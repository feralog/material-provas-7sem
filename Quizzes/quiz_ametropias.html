<script type="text/html" id="resumoSrc"><h2>O olho como sistema óptico</h2>
<p>O olho humano é, antes de tudo, um conjunto de lentes que precisa entregar uma imagem nítida sobre a retina. O modelo clássico usado para descrever essas propriedades é o olho esquemático de Gullstrand, que reduz o globo a poucas superfícies refratoras com poder dióptrico conhecido. Quatro estruturas compõem os <strong>meios refringentes</strong>:</p>
<ul><li><strong>Córnea</strong>, que molda o humor aquoso logo atrás dela — juntos respondem por cerca de</li></ul>
<p><strong>40 dioptrias</strong> e formam o elemento refrator mais potente do olho. Sua curvatura é fixa, isto é, a córnea não muda de poder ao longo do dia.</p>
<ul><li><strong>Cristalino</strong>, com cerca de <strong>19 dioptrias</strong> e, ao contrário da córnea, **índice de</li></ul>
<p>refração variável** — é ele que permite variar o foco.</p>
<ul><li><strong>Vítreo</strong>, que praticamente não refrata, mas influencia a magnificação da imagem</li></ul>
<p>projetada na retina.</p>
<p>Quando esse sistema funciona em equilíbrio com o comprimento do globo, os raios de luz paralelos — vindos do infinito óptico — convergem exatamente sobre a retina, <strong>sem nenhum esforço de acomodação</strong>. Essa é a definição de <strong>emetropia</strong>. Se os raios paralelos não chegam focalizados na retina, o olho é <strong>amétrope</strong>, e o termo <em>ametropia</em> engloba miopia, hipermetropia e astigmatismo.</p>
<p>Um terceiro termo completa o vocabulário: <strong>anisometropia</strong> é a diferença de erro refracional entre os dois olhos — por exemplo, −1,00 DE à direita e +2,00 DE à esquerda. Não é um tipo de ametropia, e sim a assimetria entre os olhos; diferenças grandes produzem imagens de tamanhos distintos em cada retina e, na criança, são fator de risco para ambliopia.</p>
<hr>
<h2>Acomodação: como o olho muda de foco</h2>
<p>Acomodação é o processo pelo qual o olho <strong>aumenta seu poder refrativo</strong> para focalizar objetos próximos. A mecânica é contraintuitiva e cai em prova exatamente por isso:</p>
<ol><li>O <strong>músculo ciliar contrai</strong>.</li><li>Com a contração, as fibras da <strong>zônula relaxam</strong> — perdem tensão.</li><li>Livre da tração zonular, o <strong>cristalino assume forma mais esférica</strong>, aumenta sua</li></ol>
<blockquote><p>A córnea não participa da acomodação. Todo o ajuste de foco para perto é feito pelo cristalino, e é justamente essa capacidade que se perde com a idade.</p></blockquote>
<p>A amplitude de acomodação é máxima na infância e cai de forma contínua ao longo da vida. Essa queda tem duas consequências clínicas que percorrem todo o resto do assunto: ela <strong>mascara a hipermetropia</strong> enquanto é abundante, e <strong>produz a presbiopia</strong> quando se esgota.</p>
<hr>
<h2>Miopia</h2>
<p>Na miopia o sistema óptico é <strong>excessivamente convergente para o comprimento do olho</strong>: os raios paralelos cruzam-se <strong>antes de alcançar a retina</strong> e, quando chegam ao plano retiniano, já estão divergindo de novo. O resultado é imagem borrada para longe, com visão de perto preservada — o míope enxerga bem no livro e mal na lousa.</p>

<p>A acomodação não resolve a miopia. Como ela só aumenta o poder refrativo, acomodar deslocaria o foco ainda mais para a frente, piorando o quadro.</p>
<h4>Tipos de miopia</h4>
<ul><li><strong>Miopia axial</strong> — diâmetro anteroposterior do bulbo ocular <strong>aumentado</strong>, o chamado</li></ul>
<p>olho comprido. A retina está longe demais do plano focal. É a forma mais comum.</p>
<ul><li><strong>Miopia de índice</strong> — alteração do <strong>índice de refração dos meios refringentes</strong>, sem</li></ul>
<p>mudança do comprimento do olho. O exemplo clássico é a esclerose do núcleo do cristalino no idoso, que aumenta o poder da lente e mioptiza o paciente.</p>
<p><strong>Correção:</strong> lentes <strong>divergentes</strong>, bicôncavas, prescritas com <strong>sinal negativo</strong>. Elas reduzem a vergência do feixe e empurram o foco para trás, até a retina. Uma lente positiva agravaria o erro.</p>
<hr>
<h2>Hipermetropia</h2>
<p>Na hipermetropia acontece o oposto: o poder refrativo é <strong>insuficiente para o comprimento do olho</strong>. Os raios ainda não convergiram quando atingem a retina, e o ponto de foco cairia em um <strong>plano virtual atrás dela</strong> — por isso os esquemas mostram o prolongamento tracejado dos raios além do globo.</p>

<p>A diferença decisiva em relação à miopia é que <strong>a acomodação ajuda</strong>. Contraindo o ciliar, o hipermetrope acrescenta dioptrias e traz o foco até a retina. Enxerga, mas às custas de esforço sustentado — e é desse esforço que nascem os sintomas.</p>
<h4>Tipos de hipermetropia</h4>
<ul><li><strong>Hipermetropia axial</strong> — diâmetro anteroposterior do bulbo <strong>reduzido</strong>, o olho curto:</li></ul>
<p>a retina fica antes do plano focal.</p>
<ul><li><strong>Hipermetropia de índice</strong> — alteração do índice de refração das estruturas do sistema</li></ul>
<p>óptico do globo ocular.</p>
<h4>Latente, manifesta e total</h4>
<p>Esta classificação é puramente funcional e depende de quanto a acomodação consegue esconder do grau real:</p>
<div class="tbl"><table><thead><tr><th>Forma</th><th>Definição</th></tr></thead><tbody><tr><td><strong>Manifesta</strong></td><td>A parcela que a acomodação <strong>não</strong> consegue compensar — é o que aparece na refração dinâmica, sem colírio</td></tr><tr><td><strong>Latente</strong></td><td>A parcela que a acomodação <strong>vinha compensando</strong> — só aparece depois de paralisar o músculo ciliar</td></tr><tr><td><strong>Total</strong></td><td>Soma da latente com a manifesta; é a refração medida sob cicloplegia</td></tr></tbody></table></div>
<p>Exemplo numérico: paciente com <strong>+3,00 DE</strong> na refração dinâmica e <strong>+5,00 DE</strong> após dilatação. A manifesta é +3,00, a total é +5,00 e a <strong>latente é a diferença, +2,00 DE</strong>.</p>
<p>Para revelar a parcela latente instila-se um <strong>cicloplégico</strong> — ciclopentolato ou tropicamida —, que bloqueia o músculo ciliar e suspende a acomodação. Em crianças e jovens hipermetropes essa etapa é indispensável: sem ela o grau é sistematicamente subestimado.</p>
<h4>Astenopia</h4>
<p>O hipermetrope não corrigido mantém acomodação sustentada e desenvolve <strong>astenopia</strong>, a síndrome de fadiga visual:</p>
<ul><li>Cansaço visual e sensação de peso nos olhos</li><li>Desconforto e dor ocular</li><li>Cefaleia, tipicamente após uso prolongado da visão de perto</li><li>Piora com fadiga, álcool e alguns medicamentos</li></ul>
<p><strong>Correção:</strong> lentes <strong>convergentes</strong>, biconvexas, de <strong>sinal positivo</strong>. Ao trazer o foco para o plano retiniano, dispensam a acomodação — e a astenopia costuma ceder junto.</p>
<hr>
<h2>Astigmatismo</h2>
<p>No astigmatismo a córnea <strong>não é esférica</strong>: os meridianos têm curvaturas diferentes, um refrata mais que o outro e <strong>não existe um ponto focal único</strong>, e sim <strong>duas linhas focais</strong>. A imagem chega à retina alongada e distorcida, em qualquer distância — a letra que parece escorrer é a queixa típica.</p>

<div class="tbl"><table><thead><tr><th>Tipo</th><th>Posição das linhas focais</th></tr></thead><tbody><tr><td><strong>Miópico simples</strong></td><td>Uma sobre a retina, a outra <strong>à frente</strong> dela</td></tr><tr><td><strong>Hipermetrópico simples</strong></td><td>Uma sobre a retina, a outra <strong>atrás</strong> dela</td></tr><tr><td><strong>Miópico composto</strong></td><td><strong>As duas à frente</strong> da retina</td></tr><tr><td><strong>Hipermetrópico composto</strong></td><td><strong>As duas atrás</strong> da retina</td></tr><tr><td><strong>Misto</strong></td><td>Uma <strong>à frente</strong> e a outra <strong>atrás</strong> — um meridiano míope, o outro hipermetrope</td></tr></tbody></table></div>
<blockquote><p>A chave das formas simples é que um dos meridianos é emétrope: sua linha focal repousa exatamente sobre a retina. Quando nenhum meridiano foca na retina, o astigmatismo passa a ser composto ou misto.</p></blockquote>
<h4>Outras classificações</h4>
<ul><li><strong>Regular ou irregular</strong> — o regular tem meridianos principais perpendiculares entre si</li></ul>
<p>e é corrigível com lente cilíndrica; o irregular, não.</p>
<ul><li><strong>Simétrico ou assimétrico</strong> — quanto ao comportamento entre os dois olhos.</li><li><strong>A favor da regra, contra a regra ou oblíquo</strong> — quanto à orientação do meridiano mais</li></ul>
<p>curvo.</p>
<div class="tbl"><table><thead><tr><th>Padrão</th><th>Meridiano mais curvo</th><th>Eixo negativo</th><th>Perfil</th></tr></thead><tbody><tr><td><strong>A favor da regra</strong></td><td>Vertical</td><td>Próximo de <strong>180°</strong></td><td>Mais comum em pessoas jovens</td></tr><tr><td><strong>Contra a regra</strong></td><td>Horizontal</td><td>Próximo de <strong>90°</strong></td><td>Tende a surgir com o envelhecimento</td></tr><tr><td><strong>Oblíquo</strong></td><td>Intermediário</td><td>Longe de 90° e de 180°</td><td>Eixos afastados dos dois padrões</td></tr></tbody></table></div>
<p><strong>Correção:</strong> lentes <strong>cilíndricas</strong>, que alteram o poder dióptrico em apenas um meridiano e deixam o perpendicular inalterado, reunindo as duas linhas focais em um ponto. Por isso a receita de astigmatismo precisa trazer, além do valor, o <strong>eixo em graus</strong>. Lentes esféricas atuam igualmente em todos os meridianos e não corrigem a assimetria.</p>
<hr>
<h2>Presbiopia</h2>
<p>A presbiopia é a <strong>perda fisiológica da acomodação que acompanha o envelhecimento</strong> do cristalino. Não é um erro do comprimento do olho nem da curvatura da córnea: o sistema óptico pode ser perfeitamente normal para longe. O que falha é o <strong>mecanismo de foco para perto</strong> — a imagem de objetos próximos chega à retina antes de formar o foco, e o cristalino já não consegue encurvar-se o bastante para compensar.</p>
<ul><li><strong>Início por volta dos 40 anos</strong>, com progressão até cerca dos <strong>60 anos</strong>, quando a</li></ul>
<p>amplitude acomodativa está praticamente esgotada.</p>
<ul><li>Manifestação clássica: o paciente <strong>afasta o texto do rosto</strong> para ler, o chamado sinal</li></ul>
<p>do braço curto. Aumentar a distância do objeto reduz a demanda acomodativa exigida.</p>
<ul><li>Piora sob luz fraca e ao fim do dia, quando a reserva acomodativa já foi consumida.</li></ul>
<p><strong>Correção:</strong> lentes <strong>convergentes positivas</strong>, que substituem a acomodação perdida. Esse valor é prescrito como <strong>adição</strong>, somado ao grau de longe, e <strong>cresce com a idade</strong>, acompanhando a queda da amplitude acomodativa.</p>
<blockquote><p><strong>A armadilha clássica: presbiopia × hipermetropia.</strong> As duas atrapalham a visão de perto e as duas se corrigem com lente positiva — mas por motivos opostos. Na <strong>hipermetropia</strong> o olho é opticamente insuficiente, em geral curto demais, o defeito existe desde sempre e fica <strong>mascarado pela acomodação</strong> enquanto ela funciona; a correção positiva vale para longe e para perto. Na <strong>presbiopia</strong> o olho pode ser opticamente normal e o que <strong>falha é a própria acomodação</strong>, com a idade; a lente positiva entra apenas como <strong>adição para perto</strong>. Consequência prática: o hipermetrope fica sintomático mais cedo, porque perde antes a reserva que vinha usando para compensar o grau.</p></blockquote>

<div class="tbl"><table><thead><tr><th>Ametropia</th><th>Onde o foco cai</th><th>Lente corretora</th><th>Sintoma principal</th></tr></thead><tbody><tr><td><strong>Miopia</strong></td><td><strong>Antes</strong> da retina</td><td>Esférica <strong>divergente</strong> (−), bicôncava</td><td>Borramento <strong>para longe</strong>; perto preservado</td></tr><tr><td><strong>Hipermetropia</strong></td><td><strong>Atrás</strong> da retina, em plano virtual</td><td>Esférica <strong>convergente</strong> (+), biconvexa</td><td><strong>Astenopia</strong>, cefaleia, borramento de perto</td></tr><tr><td><strong>Astigmatismo</strong></td><td>Em <strong>duas linhas focais</strong>, sem ponto único</td><td><strong>Cilíndrica</strong>, com eixo em graus</td><td><strong>Distorção</strong> da imagem em todas as distâncias</td></tr><tr><td><strong>Presbiopia</strong></td><td>Foco de perto <strong>não é alcançado</strong>, por acomodação esgotada</td><td>Convergente (+) prescrita como <strong>adição</strong></td><td>Dificuldade <strong>para ler</strong>, a partir dos 40 anos</td></tr></tbody></table></div>
<p>Na lente, o formato acompanha o sinal: a <strong>bicôncava é mais fina no centro</strong> que nas bordas e diverge o feixe (miopia); a <strong>biconvexa é mais espessa no centro</strong> e converge (hipermetropia e adição); a <strong>cilíndrica</strong> tem curvatura em um só meridiano (astigmatismo).</p>
<hr>
<h2>Medindo e prescrevendo</h2>
<h4>Como se mede a refração</h4>
<ul><li><strong>Esquiascopia, ou retinoscopia</strong> — método <strong>objetivo</strong>: com o <strong>retinoscópio</strong></li></ul>
<p>projeta-se uma faixa de luz na pupila e observa-se o movimento do reflexo retiniano enquanto se interpõem lentes. Não depende da resposta do paciente, o que a torna insubstituível em crianças e pacientes pouco cooperativos.</p>
<ul><li><strong>Autorrefrator</strong> — cumpre função semelhante de forma automatizada e serve como ponto de</li></ul>
<p>partida.</p>
<ul><li><strong>Refração subjetiva</strong> — refrator manual (greens), caixa de prova com armação de prova e</li></ul>
<p>régua de refração, ajustando o grau pela resposta do paciente.</p>
<ul><li><strong>Refração sob cicloplegia</strong> — obrigatória quando se suspeita de hipermetropia latente.</li></ul>

<ul><li><strong>DE, dioptrias esféricas</strong> — valor negativo indica <strong>miopia</strong>, positivo indica</li></ul>
<p><strong>hipermetropia</strong>.</p>
<ul><li><strong>DC, dioptrias cilíndricas</strong>, acompanhadas do <strong>eixo</strong> em graus: é o componente do</li></ul>
<p><strong>astigmatismo</strong>, que pode ser anotado com sinal negativo ou positivo.</p>
<ul><li><strong>Longe e perto</strong> ocupam linhas distintas, e a <strong>adição</strong> é o valor <strong>positivo</strong> somado</li></ul>
<p>ao grau de longe para a visão de perto — a correção da presbiopia.</p>
<p>Uma receita com −1,00 DE no olho direito e +2,00 DE no esquerdo descreve um olho míope e outro hipermetrope, ou seja, uma <strong>anisometropia</strong>; se a linha do olho direito trouxer ainda −0,50 DC a 180°, há também um componente astigmático nesse olho.</p>
<h4>Como se corrige</h4>
<ul><li><strong>Óculos</strong> — monofocais, de um único foco; <strong>bifocais</strong>, com longe em cima e perto</li></ul>
<p>embaixo, separados por uma linha visível; e <strong>multifocais ou progressivos</strong>, que distribuem a adição gradualmente e criam uma <strong>faixa intermediária</strong>, útil para distâncias como a do computador.</p>
<ul><li><strong>Lentes de contato</strong> — gelatinosas ou rígidas gás-permeáveis; estas últimas corrigem</li></ul>
<p>também astigmatismos irregulares, por criarem uma nova superfície refratora regular.</p>
<ul><li><strong>Cirurgia refrativa a laser</strong> — <strong>PRK</strong> e <strong>LASIK</strong>, que remodelam a curvatura corneana.</li></ul>
<hr>
<h2>Fatores sistêmicos que interferem na refração</h2>
<p>O grau não é uma constante biológica: várias condições sistêmicas alteram a refração, de forma transitória ou permanente.</p>
<ul><li><strong>Doenças metabólicas, medicamentos e gestação</strong> — induzem ametropias, em geral</li></ul>
<p>reversíveis.</p>
<ul><li><strong>Diabetes descompensado</strong> — a hiperglicemia eleva a glicose no humor aquoso, o</li></ul>
<p>cristalino <strong>absorve água</strong>, aumenta seu poder refrativo e desloca o foco para antes da retina: um <strong>desvio miópico transitório</strong>. Ao normalizar a glicemia a refração retorna, e por isso <strong>não se prescrevem óculos definitivos durante a descompensação</strong>.</p>
<ul><li><strong>Síndrome de Marfan</strong> — <strong>luxação do cristalino</strong>, a ectopia lentis.</li><li><strong>Síndrome de Weill-Marchesani</strong> — <strong>microesferofacia</strong>: cristalino pequeno e</li></ul>
<p>excessivamente esférico, o que eleva muito seu poder refrativo e produz <strong>miopia</strong> lenticular alta.</p>
<ul><li><strong>Homocistinúria</strong> — <strong>luxação do cristalino</strong> e associação com <strong>ceratocone</strong>.</li></ul>
<blockquote><p>Duas mensagens práticas fecham o assunto: toda ametropia se resume a <strong>onde o foco cai</strong> em relação à retina, e antes de fechar uma receita vale perguntar se algum fator sistêmico está deslocando esse foco naquele momento.</p></blockquote></script>

                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';

  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

  var stat = function(v,l,color){
    return '<div style="background:#faf9f6;padding:14px 10px">' +

  };

  }).join('');

  var list = reviewList();
  var allOpen = list.length>0 && list.every(function(r){ return S.open[r.idx]; });

  var cards = list.map(function(r){

    var open = !!S.open[r.idx];
    var body = '';
    if (open) {
      var opts = r.q.options.map(function(text,n){
        var isC = n===r.q.correctIndex, isMine = n===r.a;
        var bd='#eeebe4', bg='#fbfaf8', fg='#5b6478', bBg='#f0ede7', bFg='#8a8578', tag='', tBg='', tFg='';
        if (isC)            { bd='#bcdcc9'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; tag='Correta'; tBg='#d9ede1'; tFg='#1f5c3e'; }
        if (isMine && !isC) { bd='#eec4bd'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; tag='Sua resposta'; tBg='#f7ddd8'; tFg='#8f2f25'; }
        if (isMine && isC)  { tag='Sua resposta ✓'; }
        return '<div style="display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:11px;font-size:14px;line-height:1.5;border:1px solid '+bd+';background:'+bg+';color:'+fg+'">' +
          '<span style="flex-shrink:0;width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:10.5px;font-weight:600;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
          '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
          (tag ? '<span style="flex-shrink:0;'+mono+';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;margin-top:1px;background:'+tBg+';color:'+tFg+'">'+tag+'</span>' : '') +
          '</div>';
      }).join('');
      body = '<div style="padding:2px 15px 18px;animation:qDrawer .2s ease">' +

    }
    return '<div style="background:#fff;border:1px solid '+(open?'#c9c3b6':'#e4e0d8')+';border-radius:14px;overflow:hidden;transition:border-color .15s ease">' +
      '<button type="button" data-act="toggle" data-n="'+r.idx+'" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 15px;cursor:pointer">' +
        '<span style="flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:12px;font-weight:600;background:'+numBg+';color:'+numFg+'">'+pad(r.idx+1)+'</span>' +

  }).join('');

  document.getElementById('stage').innerHTML =
    '<section style="padding:34px 0 0;animation:qFade .3s ease">' +
      '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:14px">Resultado</div>' +

      '<p style="font-size:15px;line-height:1.6;color:#5b6478;margin:0 0 24px;max-width:48ch;text-wrap:pretty">'+msg+'</p>' +
      '<div style="height:8px;border-radius:99px;background:#e4e0d8;overflow:hidden;margin-bottom:10px">' +

        stat(c.hit,'Certas','#2e7d55')+stat(c.miss,'Erradas','#c04437')+stat(c.blank,'Branco','#8a8578')+stat(pct+'%','Aproveit.','#2b57cc') +

        '<button type="button" data-act="toggleAll" class="h-ink" style="background:none;border:0;padding:6px 0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;text-decoration:underline;text-underline-offset:3px">'+(allOpen?'Recolher tudo':'Expandir tudo')+'</button>' +
      '</div>' +

      (list.length===0 ? '<div style="padding:38px 16px;text-align:center;color:#8a8578;font-size:14px;border:1px dashed #ddd8ce;border-radius:14px">Nenhuma questão neste filtro.</div>' : '') +

        '<button type="button" data-act="restart" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:13px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">Refazer o quiz</button>' +
        '<button type="button" data-act="back" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Voltar às questões</button>' +
        '<button type="button" data-act="resumo" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Ler o resumo</button>' +
      '</div></section>';
}

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
