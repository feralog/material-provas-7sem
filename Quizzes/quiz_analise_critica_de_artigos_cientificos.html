<script type="text/html" id="resumoSrc"><h2>Por que a leitura crítica precisa vir antes da prática</h2>
<p>Um paciente que traz uma notícia, um post de influenciador ou uma resposta de chatbot não está errado em perguntar — mas "eu acho", "eu li" e "eu vi um caso" não têm o mesmo peso que uma evidência bem produzida. Um relato isolado de melhora (ou de piora) não permite nenhuma inferência sobre causa e efeito, porque não existe grupo de comparação nem controle de variáveis. A pergunta que sustenta toda a análise crítica de um artigo não é "o influenciador está mentindo?", mas sim <strong>o desenho do estudo é capaz de responder à pergunta clínica em questão?</strong> — a conclusão pode estar tecnicamente correta e, ainda assim, vir de um estudo incapaz de sustentá-la com rigor.</p>
<p>Para classificar um artigo, cinco perguntas básicas orientam a leitura:</p>
<ol><li>É um estudo original ou uma síntese de outros estudos?</li><li>Quem é o público-alvo — a amostra reflete a população que me interessa?</li><li>O delineamento está bem escolhido para a pergunta que pretende responder?</li><li>Foram usadas ferramentas para reduzir viés sistemático?</li><li>O número de pacientes e o tempo de seguimento foram suficientes para o desfecho avaliado?</li></ol>
<p>Nem toda pergunta clínica tem um estudo perfeito disponível — doenças raras, por exemplo, dificilmente terão um ensaio clínico randomizado de milhares de pacientes. Isso não inviabiliza usar o que existe, mas exige explicitar as limitações ao aplicar o resultado.</p>
<h2>PICO: decompondo a pergunta clínica</h2>
<p>Antes de escolher um artigo, é preciso saber exatamente qual pergunta ele deve responder. O <strong>PICO</strong> é a estrutura padrão para isso, decompondo qualquer dúvida clínica em quatro componentes:</p>
<ul><li><strong>P — Paciente ou Problema</strong>: quem é a população de interesse (idade, diagnóstico, gravidade)?</li><li><strong>I — Intervenção</strong>: qual exposição, tratamento ou procedimento está sendo testado?</li><li><strong>C — Comparação</strong>: contra o que a intervenção é comparada (placebo, outro fármaco, nenhuma intervenção)?</li><li><strong>O — Outcome (resultado)</strong>: qual desfecho está sendo medido, e em que prazo?</li></ul>
<p>Um artigo só é capaz de responder a uma pergunta clínica quando seu PICO corresponde ao PICO da dúvida original. Um estudo com excelente metodologia, mas conduzido numa população, intervenção ou desfecho diferentes do que se quer saber, simplesmente não responde à pergunta — por melhor que seja o desenho.</p>
<h2>Os delineamentos de estudo e a classificação de Oxford</h2>
<p>A classificação de Oxford (CEBM — Oxford Centre for Evidence-Based Medicine) organiza os delineamentos mais comuns por características, exemplo típico e vantagem principal:</p>
<div class="tbl"><table><thead><tr><th>Tipo de estudo</th><th>Características</th><th>Exemplo</th><th>Vantagem principal</th></tr></thead><tbody><tr><td>ECR (ensaio clínico randomizado)</td><td>Randomização, grupo controle, cegamento</td><td>Teste de nova droga vs. placebo</td><td>Padrão-ouro para causalidade e eficácia</td></tr><tr><td>Coorte</td><td>Observa exposição → desfecho, prospectiva ou retrospectiva</td><td>Tabagistas vs. não tabagistas e incidência de câncer</td><td>Ótimo para incidência e história natural da doença</td></tr><tr><td>Caso-controle</td><td>Parte do desfecho → busca exposição prévia</td><td>Pacientes com IAM vs. sem IAM e uso prévio de AINE</td><td>Eficiente para doenças raras ou de longa latência</td></tr><tr><td>Transversal</td><td>Foto única, mede prevalência</td><td>Prevalência de osteoporose em mulheres &gt; 60 anos</td><td>Rápido, barato, ótimo para prevalência</td></tr><tr><td>Série de casos / relato</td><td>Descrição de casos clínicos, sem grupo comparação</td><td>10 pacientes com lúpus e miocardite</td><td>Identifica doenças novas ou efeitos colaterais raros</td></tr><tr><td>Revisão sistemática / metanálise</td><td>Integra múltiplos estudos com métodos reprodutíveis</td><td>Revisão Cochrane sobre corticoide na artrite</td><td>Maior nível de evidência para decisão clínica</td></tr></tbody></table></div>
<h3>Estudos de intervenção × observacionais</h3>
<p>A diferença central entre essas duas famílias não é sutil: em um <strong>estudo de intervenção</strong> (ECR, estudos cruzados, ensaios de campo), o pesquisador <strong>controla ativamente</strong> a exposição, o que permite avaliar relação de causa-efeito, eficácia e efetividade. Já em um <strong>estudo observacional</strong> (coorte, caso-controle, transversal, série de casos), o pesquisador <strong>apenas observa</strong> a realidade, sem interferir no curso dos eventos — servindo para descrever fenômenos, encontrar associações e gerar hipóteses.</p>
<div class="tbl"><table><thead><tr><th>Critério</th><th>Estudos de intervenção</th><th>Estudos observacionais</th></tr></thead><tbody><tr><td>Papel do pesquisador</td><td>Controla ativamente a exposição</td><td>Apenas observa, sem interferir</td></tr><tr><td>Objetivo principal</td><td>Causa-efeito, eficácia, efetividade</td><td>Descrever, associar, gerar hipóteses</td></tr><tr><td>Limitação típica</td><td>Caros, complexos, barreiras éticas</td><td>Suscetíveis a viés de confundimento</td></tr><tr><td>Quando usar</td><td>Provar que um tratamento funciona (fase III)</td><td>Entender frequência/risco de uma exposição</td></tr></tbody></table></div>
<blockquote><p>Um resultado observacional pode ser real e ainda assim estar distorcido por um fator externo não medido — o confundimento. Isso não invalida o estudo, mas exige cautela redobrada antes de afirmar causalidade.</p></blockquote>
<h2>Limitações metodológicas específicas de cada delineamento</h2>
<p>Mesmo com o delineamento certo escolhido, é preciso olhar fatores específicos de viés dentro dele. Para ensaios clínicos randomizados de superioridade, cinco falhas costumam comprometer o resultado:</p>
<ol><li><strong>Ausência de sigilo da alocação</strong> — quem recruta consegue prever o próximo grupo por uma randomização previsível (por dia da semana, por exemplo), o que permite selecionar quem entra em cada braço.</li><li><strong>Ausência de mascaramento (cegamento)</strong> — pacientes, cuidadores, coletores de dados ou avaliadores de desfecho sabem qual tratamento foi dado, o que pode enviesar a interpretação do resultado.</li><li><strong>Seguimento incompleto</strong> — perda de pacientes randomizados ao longo do estudo, sem análise por intenção de tratar.</li><li><strong>Relato seletivo de desfechos</strong> — resultados desfavoráveis ou secundários simplesmente não são publicados.</li><li><strong>Outras limitações</strong> — como interrupção precoce do estudo por benefício aparente, ou uso de desfechos substitutos sem validação.</li></ol>
<p>Para estudos observacionais, as limitações mais características são a <strong>seleção e inclusão inadequada de participantes</strong> (pareamento ruim entre casos e controles, ou populações de origem diferentes entre expostos e não expostos), a <strong>ausência de mascaramento</strong> na avaliação da exposição ou do desfecho (por exemplo, viés de recordação) e a <strong>falha em controlar adequadamente os fatores de confusão</strong> — quando fatores prognósticos conhecidos não são medidos com precisão.</p>

<h2>Ferramentas de avaliação de qualidade: GRADE, AMSTAR-2 e RoB 2</h2>
<p>Delineamento adequado não é garantia de estudo confiável — por isso existem ferramentas específicas para auditar a qualidade de um artigo. Cada uma tem um alvo diferente, e confundi-las é um erro comum:</p>
<div class="tbl"><table><thead><tr><th>Ferramenta</th><th>O que avalia</th></tr></thead><tbody><tr><td><strong>GRADE</strong></td><td>Qualidade geral da evidência clínica e força das recomendações, de forma ampla</td></tr><tr><td><strong>AMSTAR-2</strong></td><td>Qualidade metodológica especificamente de revisões sistemáticas</td></tr><tr><td><strong>RoB 2</strong></td><td>Risco de viés especificamente dentro de ensaios clínicos randomizados</td></tr></tbody></table></div>
<h3>GRADE (Grading of Recommendations, Assessment, Development and Evaluation)</h3>
<p>É o sistema mais usado por organizações como OMS, Cochrane e UpToDate para padronizar a classificação da qualidade da evidência. Seu diferencial é a <strong>transparência</strong>: qualquer leitor consegue reconstruir como os avaliadores chegaram àquela recomendação. O GRADE avalia cinco domínios:</p>
<div class="tbl"><table><thead><tr><th>Domínio</th><th>O que avalia</th><th>Exemplo</th></tr></thead><tbody><tr><td>Risco de viés</td><td>Se o estudo foi desenhado para minimizar erros sistemáticos</td><td>ECR sem randomização descrita aumenta o risco</td></tr><tr><td>Consistência dos resultados</td><td>Se os resultados se repetem entre estudos ou subgrupos</td><td>Metanálise com I² &lt; 25% indica consistência</td></tr><tr><td>Precisão</td><td>Tamanho da amostra e largura do intervalo de confiança (IC)</td><td>IC 95% estreito indica mais precisão</td></tr><tr><td>Evidência direta</td><td>Se população, intervenção e desfecho são diretamente aplicáveis</td><td>Estudo em adolescentes extrapolado para adultos é evidência indireta</td></tr><tr><td>Viés de publicação</td><td>Se houve busca ampla de estudos e omissão de resultados negativos</td><td>Só incluir estudos patrocinados com resultado positivo é sinal de alto risco</td></tr></tbody></table></div>
<p>A partir desses cinco domínios, a evidência recebe uma classificação final:</p>
<ul><li><strong>Alta</strong> — resultados muito confiáveis.</li><li><strong>Moderada</strong> — podem mudar com novos estudos.</li><li><strong>Baixa</strong> — grande incerteza.</li><li><strong>Muito baixa</strong> — resultados altamente incertos.</li></ul>
<p>Um ensaio clínico randomizado <strong>começa</strong> na classificação alta; um estudo observacional <strong>começa</strong> mais abaixo. Mas essa posição de partida pode subir (por exemplo, com efeito muito grande e consistente) ou descer (por exemplo, com financiamento da indústria somado a desenho aberto).</p>
<h2>A pirâmide de evidências e o viés de pesquisa</h2>
<p>A pirâmide de evidências organiza os delineamentos conforme sua capacidade de fornecer conclusões livres de viés e com maior força de recomendação. Quanto mais alto na pirâmide, menor o risco de viés e maior a confiança para aplicar o resultado diretamente ao paciente — mas essa posição só se traduz em recomendação forte de fato quando confirmada por ferramentas como o GRADE.</p>

mide de evidências científicas: da opinião de especialistas, na base, até revisões sistemáticas e metanálises, no topo"><figcaption>Pirâmide de evidências científicas: da opinião de especialistas, na base, até revisões sistemáticas e metanálises, no topo</figcaption></figure>
<p>Da base para o topo, a ordem típica é: opinião de especialistas sem avaliação crítica → séries de casos e relatos de caso → estudos de caso-controle → estudos de coorte → ensaios clínicos randomizados → revisões sistemáticas e metanálises.</p>
<p><strong>Viés de pesquisa</strong> é o nome geral para os erros sistemáticos que distorcem os resultados de um estudo, comprometendo sua validade interna. Toda pesquisa carrega algum grau de viés — o que muda é o quanto ele foi minimizado e quão transparente foi essa avaliação. Por isso, avaliar risco de viés é etapa obrigatória em qualquer revisão sistemática séria.</p>
<h2>Caso aplicado: semaglutida × tirzepatida na obesidade e na esteatose hepática</h2>
<p>Um paciente com obesidade grau 1 (IMC 31, 92 kg, 170 cm) e esteatose hepática leve, sem fibrose, diabetes ou hipertensão, quer saber se semaglutida ou tirzepatida podem fazê-lo perder 30 kg, qual das duas é melhor, se a perda se mantém e se o medicamento trata também a esteatose. Ambas são terapias baseadas em incretinas: a <strong>semaglutida</strong> é agonista do receptor GLP-1 de ação prolongada, reduzindo apetite e retardando o esvaziamento gástrico; a <strong>tirzepatida</strong> é agonista duplo, atuando também no receptor GIP — inclusive em receptores de GIP presentes nos adipócitos —, o que é a hipótese para sua maior eficácia na redução de peso.</p>
<p>Analisar criticamente cada estudo citado exige sempre o mesmo roteiro: delineamento (classificação de Oxford), PICO, pontos fortes e fracos da metodologia, ferramentas de avaliação de viés usadas, e classificação GRADE resultante.</p>
<div class="tbl"><table><thead><tr><th>Estudo</th><th>Delineamento</th><th>Resultado principal</th><th>Viés relevante</th><th>GRADE</th></tr></thead><tbody><tr><td>SURMOUNT-5</td><td>ECR fase 3b, head-to-head, aberto (open-label)</td><td>Tirzepatida: 19,7% ≥30% de perda de peso; semaglutida: 6,9%</td><td>Patrocínio (Eli Lilly) + ausência de cegamento</td><td>Alta → Moderada</td></tr><tr><td>Coorte EHR (Truveta)</td><td>Coorte observacional, pareamento por escore de propensão 1:1</td><td>Tirzepatida superior à semaglutida em mundo real, &gt; 18 mil pacientes pareados</td><td>Fatores de confusão não mensurados (motivação, estilo de vida)</td><td>Moderada → Alta</td></tr><tr><td>STEP 5</td><td>ECR fase 3, duplo-cego, controlado por placebo, 2 anos</td><td>Perda de ~15,2% com semaglutida, estável da semana 60 à 104</td><td>Patrocínio (Novo Nordisk), baixa diversidade racial (7% não brancos)</td><td>Alto → Moderado</td></tr><tr><td>ESSENCE</td><td>ECR fase 3, multicêntrico, duplo-cego, placebo, biópsia centralizada</td><td>62,9% de resolução da esteato-hepatite com semaglutida vs. 34,3% placebo</td><td>Patrocínio (Novo Nordisk), mitigado por patologistas cegados</td><td>Não detalhado — biópsia cegada eleva a confiança</td></tr></tbody></table></div>
<p>No SURMOUNT-5, a diferença mais citada nas redes — tirzepatida 2,8 vezes mais provável de atingir 30% de perda de peso do que a semaglutida — é numericamente correta, mas vem de um <strong>desfecho secundário adicional (exploratório)</strong>, não do desfecho primário do estudo. O desenho aberto (pacientes e investigadores sabiam qual droga usavam) e o financiamento pela fabricante da tirzepatida são os motivos do rebaixamento cauteloso de alta para moderada.</p>
<blockquote><p>Desfecho primário e desfecho exploratório não têm o mesmo peso estatístico. Um resultado exploratório pode ser real e ainda assim não ter sido "procurado" com o mesmo rigor amostral do desfecho principal — é um sinal de alerta, não um motivo para descartar o dado.</p></blockquote>
<p>O ESSENCE, por sua vez, só testou semaglutida contra placebo: não existe, ali, nenhuma comparação com tirzepatida, então qualquer afirmação sobre tirzepatida tratar a esteato-hepatite não pode se apoiar nesse estudo.</p>
<h2>O que é extrapolável para este paciente, e o que não é</h2>
<p>Um estudo bem desenhado metodologicamente e um resultado extrapolável para um paciente específico são duas perguntas diferentes — a primeira é sobre a qualidade interna do estudo, a segunda é sobre a semelhança entre a amostra estudada e a pessoa à sua frente.</p>
<ul><li><strong>Raça</strong>: favorável. Participantes brancos foram maioria tanto no STEP 5 (93,1%) quanto no SURMOUNT-5 (76,1%), compatível com o perfil do paciente.</li><li><strong>Sexo</strong>: limitado. O STEP 5 teve apenas 22,4% de homens — proporção que os próprios autores consideram insuficiente para conclusões definitivas nesse subgrupo; o SURMOUNT-5 teve 35,3% de homens.</li><li><strong>Meta de perda de peso</strong>: ambiciosa. Perder 30 kg a partir de 92 kg equivale a cerca de 32,6% do peso corporal — mais exigente que o corte de 30% avaliado no SURMOUNT-5, atingido por apenas 19,7% do grupo tirzepatida e 6,9% do grupo semaglutida.</li><li><strong>Gravidade da doença hepática</strong>: não compatível. O ESSENCE incluiu apenas pacientes com esteato-hepatite (MASH) e fibrose em estágios 2 ou 3 — um estágio muito mais avançado do que a esteatose grau 1 sem fibrose do paciente.</li></ul>
<blockquote><p>Nenhum desses estudos foi conduzido especificamente para responder pela realidade deste paciente. Os dados são parcialmente extrapoláveis: sustentam a plausibilidade de um benefício, mas não garantem a mesma magnitude de resultado — e a decisão final ainda depende do julgamento clínico individual, algo que nenhum artigo isolado substitui.</p></blockquote>
<hr>
<p>Esse roteiro — delineamento, PICO, pontos fortes e fracos, ferramenta de viés, classificação GRADE e extrapolabilidade — é o que separa uma leitura crítica de um artigo científico de uma simples repetição do que "alguém leu e achou".</p></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

function renderHeader(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var left =
    '<div style="min-width:0">' +
      '<div style="display:flex;align-items:center;gap:8px;'+mono+';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8a8578">' +
        '<a href="'+idxHref()+'" class="h-ink" style="color:#2b57cc;text-decoration:none;white-space:nowrap">\u2190 Materiais</a>' +
        '<span style="color:#d3cec4">/</span>' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(EYEBROW)+'</span>' +
      '</div>' +
      '<h1 style="margin:1px 0 0;font-family:\'Newsreader\',Georgia,serif;font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.15">'+esc(TITLE)+'</h1>' +
    '</div>';

  var right = '';
  if (S.view === 'quiz' && S.started) {
    var hit = counts().hit;
    right = '<div style="display:flex;align-items:center;gap:10px;flex-shrink:0">' +
              '<button type="button" data-act="sair" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:9px;padding:6px 11px;'+mono+';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">Sair</button>' +
              '<div style="display:flex;align-items:center;gap:6px">' +
                '<span style="'+mono+';font-size:15px;font-weight:600;letter-spacing:-.02em">'+hit+'</span>' +
                '<span style="'+mono+';font-size:11px;color:#8a8578">/ '+S.order.length+'</span>' +
              '</div></div>';
  } else if (S.view !== 'home') {
    right = '<button type="button" data-act="home" class="h-line" style="flex-shrink:0;background:none;border:1px solid #ddd8ce;border-radius:9px;padding:7px 13px;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">← Início</button>';
  }

  var html = '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:'+(S.view==='quiz'&&S.started?'10px':'2px')+'">'+left+right+'</div>';

  if (S.view === 'quiz' && S.started) {
    var c = counts();
    var rail = S.order.map(function(q,n){
      var a = S.answers[n], cur = n===S.i && !S.finished, bg = '#d3cec4';
      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';
      if (cur && a===null) bg = '#121a2b';
      var st = a===null ? 'em branco' : (a===q.correctIndex ? 'correta' : 'incorreta');
      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +
             '<span style="display:block;width:100%;border-radius:99px;transition:height .18s ease,background .18s ease,box-shadow .18s ease;height:'+(cur?'17px':'9px')+';background:'+bg+';box-shadow:'+(cur?'0 0 0 3px rgba(18,26,43,.13)':'none')+'"></span></button>';
    }).join('');
    html += '<div><div style="display:flex;align-items:center;gap:3px">'+rail+'</div>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-2px">' +
              '<div style="'+mono+';font-size:11px;letter-spacing:.04em;color:#5b6478">Questão '+pad(S.i+1)+' / '+S.order.length+'</div>' +
              '<div style="display:flex;align-items:center;gap:12px;'+mono+';font-size:10.5px;color:#8a8578">' +
                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +
              '</div></div></div>';
  }
  document.getElementById('hdr').innerHTML = html;
}
function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
