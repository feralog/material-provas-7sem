<script type="text/html" id="resumoSrc"><h2>Anatomia e Fisiologia Ocular I</h2>
<p>O olho é, ao mesmo tempo, um instrumento óptico e um órgão alojado numa caixa óssea piramidal. Entender oftalmologia começa por essas duas leituras: a do sistema de lentes que projeta a imagem sobre a retina e a da órbita que abriga, protege e mobiliza esse sistema. Este capítulo percorre a fisiologia óptica do globo, a arquitetura óssea da órbita, o conteúdo do seu ápice e os seis músculos que movem o olho — com as consequências clínicas que cada detalhe anatômico produz.</p>
<hr>
<h2>Fisiologia óptica: os quatro meios refringentes</h2>
<p>Para chegar à retina a luz atravessa, em série, quatro meios transparentes de índices de refração diferentes: <strong>córnea</strong>, <strong>humor aquoso</strong>, <strong>cristalino</strong> e <strong>humor vítreo</strong>. Essa sequência é a base do <em>olho esquemático de Gullstrand</em>, o modelo que reduz o olho humano a um conjunto de superfícies refrativas com pontos nodais, focais e principais definidos, permitindo calcular o comportamento óptico do olho sem tratar cada estrutura isoladamente.</p>

<p>A divisão do trabalho refrativo entre esses meios é desigual, e é isso que importa na prova. A <strong>córnea</strong> é o principal elemento refrativo do olho: como a diferença de índice entre o ar e o tecido corneano é grande, ela responde por <strong>cerca de 40 dioptrias</strong>, tendo o humor aquoso como face posterior dessa primeira lente espessa. O <strong>cristalino</strong>, segunda lente do sistema, acrescenta apenas <strong>cerca de 19 dioptrias</strong>. O <strong>vítreo</strong>, com índice próximo ao do aquoso, refrata pouco: seu papel é preencher o segmento posterior e determinar a ampliação da imagem retiniana.</p>
<blockquote><p>A córnea refrata mais, mas é o cristalino que refrata de forma <strong>variável</strong>. A acomodação — contração do músculo ciliar, relaxamento da zônula e aumento da curvatura do cristalino — só é possível porque essa lente é deformável. A córnea tem poder fixo, e é exatamente por isso que ela é o alvo das cirurgias refrativas.</p></blockquote>
<p>A distância que a imagem precisa percorrer é tão decisiva quanto o poder das lentes. O <strong>bulbo ocular adulto mede em média 24,2 mm</strong> no eixo anteroposterior, e esse valor é a referência da emetropia. Olhos mais longos focam a imagem à frente da retina (miopia axial); olhos mais curtos, atrás dela (hipermetropia axial). Como cada milímetro de comprimento axial vale aproximadamente 3 dioptrias, pequenas variações de tamanho produzem ametropias clinicamente relevantes.</p>
<hr>
<h2>A órbita: cavidade, volume e conteúdo</h2>
<p>A órbita é uma pirâmide quadrangular de base anterior e ápice posterior, com <strong>volume aproximado de 30 mL</strong> no adulto. O dado mais cobrado é a proporção: o <strong>globo ocular ocupa apenas cerca de 20%</strong> desse espaço. Os 80% restantes são gordura orbitária, músculos extraoculares, glândula lacrimal, vasos e nervos.</p>
<p>Essa reserva de tecido mole explica o comportamento clínico dos processos expansivos retrobulbares. Um tumor, um hematoma ou o aumento do volume muscular da orbitopatia de Graves só produzem <strong>proptose</strong> depois de consumir a folga de gordura — e, como a órbita é óssea em quase todo o seu contorno, o único caminho de escape do conteúdo é para frente. Por isso a síndrome compartimental orbitária, como na hemorragia retrobulbar aguda, é emergência: a pressão sobe rapidamente contra paredes rígidas e comprime o nervo óptico e sua vascularização.</p>
<hr>
<h2>Os sete ossos e as quatro paredes</h2>
<p>Sete ossos participam da órbita: <strong>frontal, esfenoide, etmoide, lacrimal, palatino, zigomático e maxilar</strong>. O osso temporal, apesar de vizinho, <strong>não</strong> entra em nenhuma parede — é um distrator clássico.</p>

<div class="tbl"><table><thead><tr><th>Parede</th><th>Ossos que a formam</th><th>Ponto clínico</th></tr></thead><tbody><tr><td>Teto</td><td>Frontal e asa menor do esfenoide</td><td>Separa da fossa craniana anterior e do seio frontal</td></tr><tr><td>Parede lateral</td><td>Zigomático e asa maior do esfenoide</td><td>A mais espessa e resistente</td></tr><tr><td>Assoalho</td><td>Maxilar, zigomático e palatino</td><td>Fino; é o teto do seio maxilar; aloja o sulco infraorbitário</td></tr><tr><td>Parede medial</td><td>Etmoide, lacrimal, maxilar e esfenoide</td><td>A mais fina de todas — lâmina papirácea</td></tr></tbody></table></div>
<p>A <strong>parede medial</strong> é formada em sua maior parte pela lâmina orbital do etmoide, chamada <strong>lâmina papirácea</strong> justamente por ter espessura de papel. Duas consequências decorrem disso: a fratura medial pode gerar <strong>enfisema orbitário</strong> quando o paciente assoa o nariz, e a <strong>sinusite etmoidal</strong> é a causa mais frequente de celulite orbitária, por propagação direta através dessa lâmina e das veias que a atravessam.</p>
<p>O <strong>assoalho</strong> é o segundo ponto frágil, e o rebordo infraorbitário aloja o sulco e o forame por onde passa o <strong>nervo infraorbitário</strong>, ramo de V2 — nervo cuja hipoestesia é sinal semiológico de fratura do assoalho.</p>
<hr>
<h2>Eixos e geometria orbitária</h2>
<p>As duas órbitas não são paralelas entre si. Vistas de cima, suas <strong>paredes mediais são praticamente paralelas</strong> ao plano sagital, enquanto cada <strong>parede lateral forma cerca de 45° com esse plano</strong> — de modo que as duas paredes laterais formam entre si um ângulo de aproximadamente <strong>90°</strong>.</p>

<p>Como o eixo da pirâmide orbitária aponta para fora e para frente, e o eixo visual segue reto até o objeto fixado, os dois não coincidem: na posição primária do olhar há um ângulo de <strong>cerca de 23° entre o eixo orbitário e o eixo visual</strong>.</p>
<blockquote><p>Esses 23° não são curiosidade anatômica: são a explicação de todas as ações secundárias dos músculos retos verticais. Um músculo que traciona em direção oblíqua ao eixo visual necessariamente produz, além do movimento principal, componentes de torção e de deslocamento horizontal.</p></blockquote>
<hr>
<h2>Relações com os seios paranasais e a fratura blow-out</h2>
<p>A órbita é cercada de cavidades pneumáticas: <strong>acima</strong>, o seio frontal; <strong>abaixo</strong>, o seio maxilar; <strong>medialmente</strong>, as células etmoidais e, mais posteriormente, o seio esfenoidal. Essa vizinhança é a base tanto das complicações infecciosas quanto do padrão das fraturas.</p>
<h4>Mecanismo</h4>
<p>A <strong>fratura blow-out</strong> ocorre quando um objeto rombo <strong>maior que a rima orbitária</strong> — bola, punho, cotovelo, airbag — atinge o globo. Como o objeto não cabe na abertura, ele não fratura o rebordo: comprime o conteúdo orbitário e eleva bruscamente a pressão dentro da cavidade, que se descomprime rompendo a parede mais frágil. O <strong>assoalho</strong> cede, e gordura, periórbita e eventualmente o músculo reto inferior herniam para dentro do <strong>seio maxilar</strong>, logo abaixo. O rebordo orbitário permanece íntegro — é isso que caracteriza a fratura <em>pura</em>.</p>
<h4>Quadro clínico</h4>
<ul><li><strong>Diplopia vertical que piora ao olhar para cima</strong>, por encarceramento do reto inferior na fenda óssea: preso, ele não deixa o olho subir.</li><li><strong>Enoftalmia</strong>, pelo aumento do continente ósseo e pela perda de gordura para o seio.</li><li><strong>Hipoestesia da bochecha, da asa do nariz e do lábio superior</strong>, por lesão do nervo infraorbitário no assoalho.</li><li>Equimose periorbitária, edema e, quando há comunicação com o seio, enfisema subcutâneo.</li></ul>
<h4>Diagnóstico</h4>
<p>A <strong>tomografia computadorizada em corte coronal</strong> é o exame de escolha. O achado clássico é o <strong>sinal da gota pendente</strong>: a opacidade de tecido mole herniada pelo traço de fratura fica pendurada no teto do seio maxilar, como uma gota. Avalia-se sempre, junto, a integridade do globo e a acuidade visual — a fratura pode coexistir com trauma ocular grave.</p>
<blockquote><p>Em crianças o osso é elástico e a fratura tende a ser em alçapão <em>(trapdoor)</em>: o assoalho cede e volta à posição, aprisionando o músculo com pouca alteração radiológica aparente. O quadro é de diplopia intensa, dor à supraversão e reflexo oculocardíaco, com bradicardia e náusea — indicação de reparo cirúrgico precoce, em horas, e não em semanas.</p></blockquote>
<hr>
<h2>O ápice da órbita e o anel de Zinn</h2>

<p>Circundando o canal óptico e a parte média da fissura orbital superior está o <strong>anel tendíneo comum</strong>, ou <strong>anel de Zinn</strong>, de onde nascem os quatro músculos retos. O anel divide o conteúdo do ápice em duas categorias, e essa divisão é uma das perguntas mais recorrentes do tema:</p>
<ul><li><strong>Dentro do anel:</strong> ramo superior e ramo inferior do <strong>oculomotor (III)</strong>, nervo <strong>nasociliar</strong> (ramo de V1) e nervo <strong>abducente (VI)</strong> — além do nervo óptico e da artéria oftálmica, que entram pelo canal óptico, dentro do anel.</li><li><strong>Fora do anel</strong>, pela porção lateral e superior da fissura: nervos <strong>frontal</strong>, <strong>lacrimal</strong> e <strong>troclear (IV)</strong>, mais a veia oftálmica superior.</li></ul>
<blockquote><p>Uma lesão que ocupe a fissura orbital superior produz a <strong>síndrome da fissura orbital superior</strong>: oftalmoplegia completa, ptose, midríase e hipoestesia da hemifronte por acometimento de V1. Se o processo avança e compromete também o canal óptico, somando perda visual, o quadro passa a ser a <strong>síndrome do ápice orbitário</strong>.</p></blockquote>
<hr>
<h2>Os seis músculos extraoculares: origem, trajeto e inserção</h2>
<p>Todos os músculos extraoculares se originam no ápice da órbita — <strong>com uma única exceção</strong>. Os quatro retos, superior, inferior, medial e lateral, nascem do anel de Zinn e correm para frente formando o <strong>cone muscular</strong>, dentro do qual caminham o nervo óptico, o gânglio ciliar e os nervos que suprem esses próprios músculos. O <strong>oblíquo superior</strong> origina-se logo acima e medialmente ao anel; seu tendão sobe até a <strong>tróclea</strong>, polia fibrocartilaginosa na porção superomedial da órbita, faz aí uma volta acentuada e segue para trás e para fora, inserindo-se no quadrante superotemporal da esclera. É a tróclea, e não a origem, que define a direção efetiva de tração desse músculo.</p>
<p>O <strong>oblíquo inferior</strong> é a exceção: nasce na porção <strong>anteromedial do assoalho da órbita, no maxilar</strong>, lateralmente à fossa do saco lacrimal, e corre para trás, para fora e para cima, passando por baixo do reto inferior até a esclera temporal posterior.</p>

<p>A posição das inserções define o tipo de movimento produzido:</p>
<ul><li>Os <strong>quatro retos</strong> inserem-se <strong>à frente do equador</strong>, na metade anterior da esclera, e por isso giram o globo em torno dos eixos vertical e horizontal — abdução, adução, elevação e depressão.</li><li>Os <strong>dois oblíquos</strong> inserem-se <strong>atrás do equador</strong>, na metade posterior e temporal da esclera, e por isso rodam o globo em torno do eixo anteroposterior, produzindo torção.</li></ul>
<p>O plano de tração dos retos horizontais, medial e lateral, <strong>coincide com o eixo visual</strong>, e por isso a ação deles é pura: aduzir e abduzir. Já o plano dos <strong>retos verticais forma os 23°</strong> com o eixo óptico, o que lhes impõe ações secundárias obrigatórias.</p>
<blockquote><p>Consequência prática dos 23°: com o olho em <strong>abdução de 23°</strong> o eixo visual se alinha ao plano muscular e os retos verticais agem de forma pura — o reto superior só eleva, o reto inferior só deprime. Em <strong>adução</strong>, ao contrário, predomina a ação torcional dos retos verticais, e a elevação passa a depender do oblíquo inferior. É esse o raciocínio por trás do teste das seis posições diagnósticas do olhar.</p></blockquote>

<p>A regra mnemônica clássica resume a inervação: <code>RL6 OS4</code>, todos os demais pelo III. O oculomotor se divide em dois ramos, e a divisão importa:</p>
<ul><li><strong>Ramo superior:</strong> reto superior e levantador da pálpebra superior — apenas dois músculos.</li><li><strong>Ramo inferior:</strong> reto inferior, reto medial e oblíquo inferior, além das <strong>fibras parassimpáticas</strong> que fazem sinapse no gânglio ciliar e seguem para o esfíncter da íris e o músculo ciliar.</li></ul>
<p>Daí decorrem dois pares semiológicos úteis: a paralisia facial cursa com <strong>lagoftalmo</strong>, incapacidade de fechar o olho, com risco de ceratopatia de exposição; a paralisia do III par cursa com <strong>ptose</strong>, pela perda do levantador.</p>
<h4>As três paralisias oculomotoras</h4>
<ul><li><strong>VI par (abducente):</strong> limitação isolada da abdução, <strong>esotropia</strong> em posição primária e diplopia horizontal que piora ao olhar para o lado do músculo parético. É o par craniano de trajeto intracraniano mais longo e por isso o primeiro a sofrer com hipertensão intracraniana, funcionando então como sinal falso-localizatório.</li><li><strong>IV par (troclear):</strong> paralisia do oblíquo superior, com hipertropia do olho acometido que piora na adução e na inclinação da cabeça para o mesmo lado. O paciente compensa com <strong>torcicolo ocular</strong>, inclinando a cabeça para o lado oposto. É o único par craniano de emergência dorsal e o único que cruza antes de chegar à órbita — daí sua vulnerabilidade no traumatismo craniano.</li><li><strong>III par (oculomotor):</strong> ptose completa e olho desviado <strong>para baixo e para fora</strong>, porque restam funcionantes apenas o reto lateral e o oblíquo superior. O estado da pupila orienta a etiologia: <strong>midríase associada</strong> sugere compressão externa, como aneurisma de artéria comunicante posterior ou herniação uncal, porque as fibras parassimpáticas correm na periferia do nervo; <strong>pupila poupada</strong> sugere causa isquêmica microvascular, típica de diabetes e hipertensão, que acomete o centro do nervo.</li></ul>
<hr>
<h2>Vascularização e drenagem venosa</h2>
<p>Toda a irrigação da órbita deriva da <strong>artéria oftálmica</strong>, primeiro ramo intracraniano da <strong>carótida interna</strong>, que entra pelo canal óptico. Dela partem as artérias musculares e, destas, as <strong>artérias ciliares anteriores</strong>, que sobem pelos tendões dos músculos retos e perfuram a esclera perto do limbo para irrigar o segmento anterior — íris, corpo ciliar e rede episcleral.</p>
<p>A distribuição é assimétrica e é dado de prova: os retos <strong>superior, medial e inferior levam duas artérias ciliares anteriores cada</strong>; o <strong>reto lateral leva apenas uma</strong>.</p>
<blockquote><p><strong>Importância prática:</strong> por dependerem dessas artérias, a desinserção simultânea de três músculos retos numa mesma cirurgia de estrabismo arrisca <strong>isquemia do segmento anterior</strong>, quadro de dor, edema de córnea, uveíte e atrofia iriana. Por isso as cirurgias sobre múltiplos retos costumam ser divididas em dois tempos ou empregam técnicas de preservação vascular.</p></blockquote>
<p>A drenagem venosa se faz sobretudo pelas <strong>veias vorticosas</strong>, em número de <strong>quatro a seis</strong>, visíveis como estruturas violáceas na esclera perto do equador do globo, próximas aos músculos oblíquos. Elas recolhem o sangue de toda a úvea — coroide, corpo ciliar e íris — e desembocam nas <strong>veias oftálmicas superior e inferior</strong>, que drenam para o <strong>seio cavernoso</strong>.</p>
<blockquote><p>O sistema venoso orbitário e facial é <strong>desprovido de válvulas</strong> e comunica-se livremente com o seio cavernoso e com a veia facial. É por isso que infecções da face média, da órbita e dos seios paranasais podem ascender e causar <strong>trombose de seio cavernoso</strong>, quadro grave, com oftalmoplegia dolorosa, proptose, quemose e tendência à bilateralização pela comunicação entre os dois seios cavernosos.</p></blockquote></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* ── header ────────────────────────────────────────────────────────────────── */
function renderHeader(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var left =
    '<div style="min-width:0">' +
      '<div style="'+mono+';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8a8578">'+esc(EYEBROW)+'</div>' +
      '<h1 style="margin:1px 0 0;font-family:\'Newsreader\',Georgia,serif;font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.15">'+esc(TITLE)+'</h1>' +
    '</div>';

  var right = '';
  if (S.view === 'quiz' && S.started) {
    var hit = counts().hit;
    right = '<div style="display:flex;align-items:center;gap:6px;flex-shrink:0">' +
              '<span style="'+mono+';font-size:15px;font-weight:600;letter-spacing:-.02em">'+hit+'</span>' +
              '<span style="'+mono+';font-size:11px;color:#8a8578">/ '+S.order.length+'</span>' +
            '</div>';
  } else if (S.view !== 'home') {
    right = '<button type="button" data-act="home" class="h-line" style="flex-shrink:0;background:none;border:1px solid #ddd8ce;border-radius:9px;padding:7px 13px;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">← Início</button>';
  }

  var html = '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:'+(S.view==='quiz'&&S.started?'10px':'2px')+'">'+left+right+'</div>';

  if (S.view === 'quiz' && S.started) {
    var c = counts();
    var rail = S.order.map(function(q,n){
      var a = S.answers[n], cur = n===S.i && !S.finished, bg = '#d3cec4';
      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';
      if (cur && a===null) bg = '#121a2b';
      var st = a===null ? 'em branco' : (a===q.correctIndex ? 'correta' : 'incorreta');
      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +
             '<span style="display:block;width:100%;border-radius:99px;transition:height .18s ease,background .18s ease,box-shadow .18s ease;height:'+(cur?'17px':'9px')+';background:'+bg+';box-shadow:'+(cur?'0 0 0 3px rgba(18,26,43,.13)':'none')+'"></span></button>';
    }).join('');
    html += '<div><div style="display:flex;align-items:center;gap:3px">'+rail+'</div>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-2px">' +
              '<div style="'+mono+';font-size:11px;letter-spacing:.04em;color:#5b6478">Questão '+pad(S.i+1)+' / '+S.order.length+'</div>' +
              '<div style="display:flex;align-items:center;gap:12px;'+mono+';font-size:10.5px;color:#8a8578">' +
                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +
              '</div></div></div>';
  }
  document.getElementById('hdr').innerHTML = html;
}
function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── tela inicial ──────────────────────────────────────────────────────────── */
function renderHome(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var secoes = (document.getElementById('resumoSrc').textContent.match(/<h2/g)||[]).length;
  var cell = function(v,l){
    return '<div style="background:#faf9f6;padding:16px 14px">' +
      '<div style="'+mono+';font-size:22px;font-weight:500;letter-spacing:-.03em">'+v+'</div>' +

  };
  var card = function(act,tag,titulo,desc,cta){
    return '<button type="button" data-act="'+act+'" class="h-card" style="display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:24px 22px;cursor:pointer;transition:border-color .16s ease,transform .14s ease;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -20px rgba(18,26,43,.18)">' +
      '<div style="'+mono+';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:12px">'+tag+'</div>' +
      '<div style="font-family:\'Newsreader\',Georgia,serif;font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.15;margin-bottom:8px">'+titulo+'</div>' +
      '<div style="font-size:14px;line-height:1.6;color:#5b6478;margin-bottom:18px;text-wrap:pretty">'+desc+'</div>' +

  };

  document.getElementById('stage').innerHTML =
    '<section style="padding:56px 0 0;animation:qFade .3s ease">' +
      '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:16px">Material de revisão</div>' +
      '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:40px;line-height:1.08;font-weight:400;letter-spacing:-.025em;margin:0 0 18px;text-wrap:pretty">'+esc(SUBTITLE)+'</h2>' +
      '<p style="font-size:15.5px;line-height:1.65;color:#5b6478;margin:0 0 30px;max-width:52ch;text-wrap:pretty">'+esc(INTRO)+'</p>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:1px;background:#e4e0d8;border:1px solid #e4e0d8;border-radius:14px;overflow:hidden;margin-bottom:32px">' +
        cell(QUIZ.length,'Questões') + cell(secoes,'Seções') + cell('~'+Math.round(QUIZ.length*0.75),'Minutos') +
      '</div>' +
      '<div class="home-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
        card('start','Praticar','Quiz', QUIZ.length+' questões de múltipla escolha, com explicação assim que você responde e gabarito comentado no fim.','Começar →') +
        card('resumo','Estudar','Resumo','O conteúdo da aula em texto corrido, organizado em '+secoes+' seções para leitura antes da prova.','Ler →') +
      '</div>' +
      '<div style="margin-top:26px;display:flex;flex-wrap:wrap;gap:8px 18px;'+mono+';font-size:11px;color:#8a8578">' +
        '<span>← →&nbsp; navegar</span><span>1–'+maxOpts()+'&nbsp; responder</span><span>Enter&nbsp; avançar</span></div>' +
    '</section>';
}
function maxOpts(){ return QUIZ.reduce(function(m,q){ return Math.max(m,q.options.length); },0); }

/* ── resumo ────────────────────────────────────────────────────────────────── */
function renderResumo(){
  document.getElementById('stage').innerHTML =
    '<section style="padding:34px 0 0;animation:qFade .3s ease">' +
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:14px">Resumo</div>' +
      '<div class="rsm">' + document.getElementById('resumoSrc').textContent + '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:38px;padding-top:24px;border-top:1px solid #e4e0d8">' +
        '<button type="button" data-act="start" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:13px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">Fazer o quiz →</button>' +
        '<button type="button" data-act="home" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Voltar ao início</button>' +
      '</div></section>';

/* imagem da questao — data URI ja resolvida pelo montar_quiz.py */
function figura(q, cls){
  if (!q.image) return '';
  return '<figure class="fig'+(cls?' '+cls:'')+'"><img src="'+q.image+'" alt="'+esc(q.imageCaption||'Imagem da questão')+'">' +
         (q.imageCaption ? '<figcaption>'+esc(q.imageCaption)+'</figcaption>' : '') + '</figure>';
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +
      '</button>';
  }).join('');

  var expl = reveal ? '<div style="margin-top:20px;padding:16px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;animation:qFade .26s ease">' +
      '<div style="'+mono+';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:8px">Por quê</div>' +
      '<p style="margin:0;font-size:14.5px;line-height:1.68;color:#39404f;text-wrap:pretty">'+esc(q.explanation)+'</p></div>' : '';

  var blank = counts().blank;
  var warn = S.warn ? '<div style="margin-top:14px;padding:15px 17px;background:#fdf7e9;border:1px solid #e8d5a3;border-radius:14px;animation:qFade .22s ease">' +
      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +
        '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;line-height:1.42;font-weight:400;letter-spacing:-.012em;margin:0 0 22px;text-wrap:pretty">'+esc(q.question)+'</h2>' +
        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
      '</article>' + warn +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px">' +
        '<button type="button" data-act="prev" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:12px 18px;font-size:14px;cursor:pointer;transition:border-color .15s ease,color .15s ease;color:'+(S.i===0?'#c4bfb4':'#121a2b')+';pointer-events:'+(S.i===0?'none':'auto')+'">← Anterior</button>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          (early ? '<button type="button" data-act="finish" class="h-ink" style="background:none;border:0;padding:12px 6px;'+mono+';font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a8578;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Finalizar</button>' : '') +
          '<button type="button" data-act="next" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">'+(last?'Finalizar':'Próxima →')+'</button>' +
        '</div></div></section>';
}

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';
  if (pct>=90)      { title='Domínio sólido';   msg='Desempenho excelente. Confira as explicações das que escaparam e siga em frente.'; }
  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

  var stat = function(v,l,color){
    return '<div style="background:#faf9f6;padding:14px 10px">' +
      '<div style="'+mono+';font-size:19px;font-weight:500;color:'+color+'">'+v+'</div>' +
      '<div style="'+mono+';font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#8a8578;margin-top:2px">'+l+'</div></div>';
  };

  var fdefs = [['all','Todas',c.total],['wrong','Erradas',c.miss],['right','Certas',c.hit],['blank','Em branco',c.blank]];
  var filters = fdefs.map(function(f){
    var on = S.filter===f[0];
    return '<button type="button" data-act="filter" data-k="'+f[0]+'" class="h-line" style="border-radius:99px;padding:8px 14px;font-size:13px;cursor:pointer;transition:all .15s ease;border:1px solid '+(on?'#121a2b':'#ddd8ce')+';background:'+(on?'#121a2b':'transparent')+';color:'+(on?'#f5f3ef':'#5b6478')+'">'+f[1]+' '+f[2]+'</button>';
  }).join('');

  var list = reviewList();
  var allOpen = list.length>0 && list.every(function(r){ return S.open[r.idx]; });

  var cards = list.map(function(r){
    var numBg='#f0ede7', numFg='#8a8578';
    if (!r.blank) { if (r.ok) { numBg='#e3f0e8'; numFg='#1f5c3e'; } else { numBg='#fbe6e2'; numFg='#8f2f25'; } }
    var open = !!S.open[r.idx];
    var body = '';
    if (open) {
      var opts = r.q.options.map(function(text,n){
        var isC = n===r.q.correctIndex, isMine = n===r.a;
        var bd='#eeebe4', bg='#fbfaf8', fg='#5b6478', bBg='#f0ede7', bFg='#8a8578', tag='', tBg='', tFg='';
        if (isC)            { bd='#bcdcc9'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; tag='Correta'; tBg='#d9ede1'; tFg='#1f5c3e'; }
        if (isMine && !isC) { bd='#eec4bd'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; tag='Sua resposta'; tBg='#f7ddd8'; tFg='#8f2f25'; }
        if (isMine && isC)  { tag='Sua resposta ✓'; }
        return '<div style="display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:11px;font-size:14px;line-height:1.5;border:1px solid '+bd+';background:'+bg+';color:'+fg+'">' +
          '<span style="flex-shrink:0;width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:10.5px;font-weight:600;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
          '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
          (tag ? '<span style="flex-shrink:0;'+mono+';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;margin-top:1px;background:'+tBg+';color:'+tFg+'">'+tag+'</span>' : '') +
          '</div>';
      }).join('');
      body = '<div style="padding:2px 15px 18px;animation:qDrawer .2s ease">' +
        '<div style="height:1px;background:#eeebe4;margin:0 0 16px"></div>' +
        '<p style="font-family:\'Newsreader\',Georgia,serif;font-size:18px;line-height:1.5;margin:0 0 16px;text-wrap:pretty">'+esc(r.q.question)+'</p>' +
        figura(r.q) +
        '<div style="display:flex;flex-direction:column;gap:7px">'+opts+'</div>' +
        '<div style="margin-top:16px;padding:14px 16px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 11px 11px 0">' +
          '<div style="'+mono+';font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:7px">Por quê</div>' +
          '<p style="margin:0;font-size:14px;line-height:1.65;color:#39404f;text-wrap:pretty">'+esc(r.q.explanation)+'</p></div>' +
        '<button type="button" data-act="jump" data-n="'+r.idx+'" style="margin-top:14px;background:none;border:0;padding:0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#2b57cc;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Abrir no quiz →</button></div>';
    }
    return '<div style="background:#fff;border:1px solid '+(open?'#c9c3b6':'#e4e0d8')+';border-radius:14px;overflow:hidden;transition:border-color .15s ease">' +
      '<button type="button" data-act="toggle" data-n="'+r.idx+'" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 15px;cursor:pointer">' +
        '<span style="flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:12px;font-weight:600;background:'+numBg+';color:'+numFg+'">'+pad(r.idx+1)+'</span>' +
        '<span style="flex:1;min-width:0;font-size:14px;line-height:1.45;color:#39404f;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(r.q.question)+'</span>' +
        '<span style="flex-shrink:0;'+mono+';font-size:16px;color:#8a8578;width:16px;text-align:center">'+(open?'−':'+')+'</span>' +
      '</button>' + body + '</div>';
  }).join('');

  document.getElementById('stage').innerHTML =
    '<section style="padding:34px 0 0;animation:qFade .3s ease">' +
      '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:14px">Resultado</div>' +
      '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:36px;line-height:1.12;font-weight:400;letter-spacing:-.025em;margin:0 0 8px">'+title+'</h2>' +
      '<p style="font-size:15px;line-height:1.6;color:#5b6478;margin:0 0 24px;max-width:48ch;text-wrap:pretty">'+msg+'</p>' +
      '<div style="height:8px;border-radius:99px;background:#e4e0d8;overflow:hidden;margin-bottom:10px">' +
        '<div style="height:100%;border-radius:99px;background:#121a2b;transition:width .7s cubic-bezier(.22,1,.36,1);width:'+pct+'%"></div></div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e4e0d8;border:1px solid #e4e0d8;border-radius:14px;overflow:hidden;margin-bottom:34px">' +
        stat(c.hit,'Certas','#2e7d55')+stat(c.miss,'Erradas','#c04437')+stat(c.blank,'Branco','#8a8578')+stat(pct+'%','Aproveit.','#2b57cc') +
      '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px">' +
        '<h3 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;font-weight:500;letter-spacing:-.015em;margin:0">Gabarito comentado</h3>' +
        '<button type="button" data-act="toggleAll" class="h-ink" style="background:none;border:0;padding:6px 0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;text-decoration:underline;text-underline-offset:3px">'+(allOpen?'Recolher tudo':'Expandir tudo')+'</button>' +
      '</div>' +
      '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">'+filters+'</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">'+cards+'</div>' +
      (list.length===0 ? '<div style="padding:38px 16px;text-align:center;color:#8a8578;font-size:14px;border:1px dashed #ddd8ce;border-radius:14px">Nenhuma questão neste filtro.</div>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:28px;padding-top:24px;border-top:1px solid #e4e0d8">' +
        '<button type="button" data-act="restart" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:13px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">Refazer o quiz</button>' +
        '<button type="button" data-act="back" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Voltar às questões</button>' +
        '<button type="button" data-act="resumo" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Ler o resumo</button>' +
      '</div></section>';
}

/* ── render + eventos ──────────────────────────────────────────────────────── */
function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});
