<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#f5f3ef;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font:inherit;color:inherit;font-family:'IBM Plex Sans',system-ui,sans-serif}
  a{color:#2b57cc;text-decoration:none}
  a:hover{color:#1e3f9c;text-decoration:underline}
  @keyframes qFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes qDrawer{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  /* hovers — no canvas eram style-hover, aqui viram CSS de verdade */
  .h-dark:hover{background:#2b57cc!important;transform:translateY(-1px)}
  .h-darkflat:hover{background:#2b57cc!important}
  .h-line:hover{border-color:#121a2b!important}
  .h-ink:hover{color:#121a2b!important}
  .h-opt:not(.locked):hover{border-color:var(--hbd)!important;transform:translateY(-1px)}
  .h-card:hover{border-color:#121a2b!important;transform:translateY(-2px)}

  /* tipografia do resumo */
  .rsm{font-size:16.5px;line-height:1.72;color:#2a3141;max-width:64ch}
  .rsm h2{font-family:'Newsreader',Georgia,serif;font-size:27px;font-weight:500;letter-spacing:-.02em;line-height:1.2;margin:42px 0 14px;padding-top:20px;border-top:1px solid #e4e0d8;text-wrap:pretty}
  .rsm h2:first-child{margin-top:0;padding-top:0;border-top:0}
  .rsm h3{font-family:'Newsreader',Georgia,serif;font-size:20px;font-weight:600;letter-spacing:-.01em;margin:28px 0 10px;text-wrap:pretty}
  .rsm h4{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#2b57cc;margin:24px 0 8px}
  .rsm p{margin:0 0 15px;text-wrap:pretty}
  .rsm ul,.rsm ol{margin:0 0 15px;padding-left:22px}
  .rsm li{margin-bottom:7px;text-wrap:pretty}
  .rsm li>ul,.rsm li>ol{margin:7px 0 0}
  .rsm strong{font-weight:600;color:#121a2b}
  .rsm em{font-style:italic}
  .rsm code{font-family:'IBM Plex Mono',monospace;font-size:.88em;background:#efece5;border:1px solid #e4e0d8;border-radius:5px;padding:1px 5px}
  .rsm hr{border:0;border-top:1px solid #e4e0d8;margin:32px 0}
  .rsm blockquote{margin:0 0 18px;padding:15px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;font-size:15px;line-height:1.65;color:#39404f}
  .rsm blockquote p:last-child{margin-bottom:0}
  .rsm .tbl{overflow-x:auto;margin:0 0 20px;border:1px solid #e4e0d8;border-radius:12px;background:#fff}
  .rsm table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
  .rsm th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#8a8578;font-weight:600;padding:11px 14px;background:#faf9f6;border-bottom:1px solid #e4e0d8;white-space:nowrap}
  .rsm td{padding:11px 14px;border-bottom:1px solid #efece5;vertical-align:top;text-wrap:pretty}
  .rsm tr:last-child td{border-bottom:0}
  .rsm .key{background:#f2f6fb;border:1px solid #d6e2f4;border-radius:12px;padding:16px 18px;margin:0 0 18px}
  .rsm .key>*:last-child{margin-bottom:0}

  /* figuras — no resumo e na questao */
  .fig{margin:0 0 20px;background:#fff;border:1px solid #e4e0d8;border-radius:14px;overflow:hidden}
  .fig img{display:block;width:100%;height:auto;cursor:zoom-in}
  .fig figcaption{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;color:#8a8578;padding:9px 13px;border-top:1px solid #efece5;background:#faf9f6;text-wrap:pretty}
  .qfig{margin:0 0 20px}

  /* lightbox */
  #lb{position:fixed;inset:0;z-index:90;background:rgba(18,26,43,.86);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
  #lb.on{display:flex;animation:qFade .16s ease}
  #lb img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.5)}

  @media(max-width:560px){
    .rsm{font-size:16px}
    .rsm h2{font-size:24px}
    .home-grid{grid-template-columns:1fr!important}
  }
</style>

<script type="text/html" id="resumoSrc"><h2>O cristalino e o que significa opacificá-lo</h2>
<p>O cristalino é a segunda lente do sistema óptico do olho. Fica suspenso atrás da íris pelas fibras zonulares, é avascular, não tem inervação e vive nutrido pelo humor aquoso que o banha. Ele contribui com cerca de <strong>19 dioptrias</strong> para o poder refrativo total do olho — bem menos que a córnea, responsável por cerca de <strong>40 dioptrias</strong>, que é a superfície de maior poder refrativo porque separa o ar do meio aquoso. O que torna o cristalino insubstituível não é o poder dióptrico, e sim o fato de ele ser <strong>variável</strong>: a contração do músculo ciliar relaxa a zônula, a lente engrossa e o olho acomoda para perto.</p>

<p><strong>Catarata é qualquer opacidade do cristalino</strong>, de qualquer grau, em qualquer camada, por qualquer causa. Não existe limiar: uma opacidade puntiforme periférica já é catarata, embora só a opacidade que compromete o eixo visual produza sintoma. A classificação mais imediata separa a catarata <strong>congênita</strong>, presente ao nascimento, da <strong>adquirida</strong>, que se instala ao longo da vida.</p>
<p>A doença é quase universal na velhice. <strong>Cerca de 50% das pessoas entre 65 e 74 anos</strong> têm algum grau de catarata, e a proporção continua subindo depois disso. Como o único tratamento é cirúrgico, a catarata é a principal causa de cegueira reversível no mundo e a cirurgia de catarata é o procedimento oftalmológico mais realizado.</p>
<h3>O quadro clínico</h3>
<p>A catarata é <strong>indolor, progressiva e sem olho vermelho</strong>. As três queixas centrais são:</p>
<ul><li><strong>baixa visão</strong> que se instala em meses a anos;</li><li><strong>embaçamento</strong>, com perda de contraste antes mesmo da queda de acuidade;</li><li><strong>visão amarelada</strong>, porque o núcleo esclerosado filtra o azul e altera a percepção de cor.</li></ul>
<blockquote><p>Dor, olho vermelho e halos coloridos <strong>não</strong> são catarata. Esse conjunto aponta para glaucoma agudo ou inflamação. Catarata que dói é catarata com complicação — hipermadura, com glaucoma facolítico ou facomórfico associado.</p></blockquote>
<p>O exame que fecha o diagnóstico e, mais que isso, define o tipo é a <strong>biomicroscopia com lâmpada de fenda</strong>: o corte óptico mostra em que camada está a opacidade e quão densa ela é. O reflexo vermelho, obtido com o oftalmoscópio direto a distância, mostra a opacidade em silhueta escura sobre o fundo alaranjado — é o que torna a triagem possível sem lâmpada de fenda.</p>
<hr>
<h2>Catarata relacionada à idade: os três tipos morfológicos</h2>
<p>A catarata senil não é uma doença só. As três formas nascem em camadas diferentes do cristalino, produzem sintomas diferentes e têm associações causais diferentes. Reconhecê-las separadamente é a pergunta clássica de prova.</p>

<h3>Nuclear</h3>
<p>O núcleo endurece e amarelece progressivamente, até chegar ao aspecto âmbar ou <strong>brunescente</strong> (castanho-escuro) das cataratas muito avançadas. É a forma mais comum.</p>
<p>O ponto que cai em prova é o efeito refrativo: o núcleo esclerosado tem <strong>índice de refração maior</strong>, então o olho fica mais míope. O paciente idoso descreve isso como <strong>"segunda visão"</strong> — volta a ler sem os óculos de perto enquanto a visão de longe piora. Não é melhora: é sinal de que a esclerose está progredindo. Na prática, a troca frequente do grau dos óculos em um idoso deve levantar a suspeita.</p>
<h3>Cortical</h3>
<p>Opacidades brancas em cunha se formam na periferia do córtex e avançam em direção ao centro, com o aspecto de <strong>raios de roda de carroça</strong>. Como poupam o eixo visual por muito tempo, o sintoma dominante é <strong>ofuscamento</strong> desproporcional à acuidade medida: o paciente enxerga bem na sala escura do consultório e reclama de dirigir à noite.</p>
<p>Quando as cunhas confluem e todo o córtex branqueia, a catarata está <strong>madura</strong>. Se o córtex liquefaz e o núcleo afunda dentro do saco capsular, está <strong>hipermadura</strong> (morganiana) — situação de risco para glaucoma facolítico, porque proteína cristaliniana escapa pela cápsula e obstrui o trabeculado.</p>

<h3>Subcapsular posterior</h3>
<p>Placa granular imediatamente à frente da cápsula posterior. Como fica <strong>exatamente no eixo visual</strong>, no ponto nodal do olho, é a forma que mais atrapalha para o grau de opacidade que tem. Qualquer situação que contraia a pupila piora o sintoma: sol forte, faróis à noite, leitura. Daí o padrão característico de <strong>ofuscamento intenso com piora da visão de perto</strong>.</p>
<p>É também a forma que aparece <strong>fora da faixa etária esperada</strong>: em paciente jovem, catarata subcapsular posterior deve fazer procurar corticoide, diabetes, uveíte ou irradiação.</p>

<h2>Causas secundárias</h2>
<p>Fora o envelhecimento, a lista de causas reconhecidas reúne <strong>trauma</strong>, <strong>doenças sistêmicas</strong>, <strong>fármacos</strong>, <strong>tabagismo</strong> e <strong>hereditariedade</strong>.</p>
<div class="tbl"><table><thead><tr><th>Causa</th><th>Como produz catarata</th><th>Forma típica</th></tr></thead><tbody><tr><td><strong>Corticoide</strong> (sistêmico, inalatório ou tópico)</td><td>efeito dose e tempo-dependente sobre as fibras</td><td>subcapsular posterior</td></tr><tr><td><strong>Diabetes</strong></td><td>acúmulo osmótico de sorbitol, com edema das fibras</td><td>subcapsular posterior, precoce</td></tr><tr><td><strong>Trauma</strong> contuso ou perfurante</td><td>lesão direta das fibras ou da cápsula</td><td>opacidade em roseta / total</td></tr><tr><td><strong>Uveíte crônica</strong></td><td>inflamação repetida e uso de corticoide</td><td>subcapsular posterior + sinéquias</td></tr><tr><td><strong>Galactosemia</strong></td><td>galactitol acumulado no cristalino</td><td>catarata do lactente</td></tr><tr><td><strong>Rubéola congênita</strong></td><td>infecção materna no 1º trimestre</td><td>catarata congênita bilateral</td></tr><tr><td><strong>Cromossomopatias</strong> (Down, Patau, Edwards, Turner)</td><td>malformação do desenvolvimento do cristalino</td><td>catarata congênita</td></tr><tr><td><strong>Tabagismo</strong></td><td>estresse oxidativo do cristalino</td><td>nuclear</td></tr></tbody></table></div>
<h4>Catarata medicamentosa</h4>
<p>O <strong>corticoide</strong> é a causa medicamentosa clássica, e a única que se deve saber de cor. Mas a lista é maior:</p>
<ul><li><strong>Antibióticos</strong> — eritromicina e sulfa em uso prolongado; o mecanismo apontado é o aumento da absorção de radiação ultravioleta pelo cristalino.</li><li><strong>Isotretinoína</strong> — aumenta a sensibilidade à luz, e essa fototoxicidade se traduz em risco de alteração do cristalino.</li><li><strong>Antidepressivos</strong> inibidores de recaptação de serotonina (fluoxetina, sertralina, citalopram) — efeito raro.</li><li><strong>Betabloqueadores</strong> (propranolol, carvedilol) — estimulam depósitos no cristalino.</li></ul>
<h4>Diabetes</h4>
<p>A hiperglicemia desvia a glicose para a via da <strong>aldose redutase</strong>. O <strong>sorbitol</strong> formado não atravessa a membrana das fibras, retém água por osmose, e o edema rompe as fibras do cristalino. O resultado é catarata <strong>mais precoce e de progressão mais rápida</strong> que a senil, tipicamente subcapsular posterior. Vale lembrar que o pico glicêmico também causa mudança transitória de grau — o diabético descompensado pode chegar ao consultório míope, sem ter catarata nova.</p>
<h4>Trauma</h4>
<p>Duas mecânicas distintas:</p>
<ul><li><strong>Contuso</strong> — a onda de energia lesa as fibras subcapsulares e produz a opacidade em <strong>roseta</strong> ou estrela, que pode aparecer dias a meses depois do trauma. Unilateral, frequentemente em paciente jovem.</li><li><strong>Perfurante</strong> — a cápsula é rompida, o humor aquoso entra em contato direto com as fibras e as hidrata; a opacificação pode ser total e rápida.</li></ul>
<hr>
<h2>Catarata congênita e o reflexo vermelho</h2>
<p>Catarata congênita é a que está <strong>presente ao nascimento</strong> ou é <strong>adquirida na infância</strong>. O problema aqui não é óptico, é de <strong>desenvolvimento neural</strong>: nos primeiros meses de vida, o córtex visual só se organiza se receber imagem nítida. Uma opacidade densa bloqueia esse estímulo e produz <strong>ambliopia por privação</strong> — a forma mais grave de ambliopia e a de pior prognóstico. Depois de encerrado o período crítico, remover a catarata já não devolve a visão.</p>
<blockquote><p><strong>A urgência é do reflexo vermelho, não da catarata.</strong> Reflexo vermelho alterado em recém-nascido ou lactente é encaminhamento oftalmológico <strong>imediato</strong>, não reavaliação eletiva. O tempo é a variável que decide o resultado visual.</p></blockquote>

<h3>Leucocoria: o diferencial que não pode ser esquecido</h3>
<p>Reflexo branco na pupila é <strong>leucocoria</strong>, e leucocoria não é sinônimo de catarata. O diagnóstico que precisa ser afastado primeiro é o <strong>retinoblastoma</strong>.</p>
<blockquote><p><strong>Catarata congênita ameaça a visão; retinoblastoma ameaça a vida.</strong> Toda leucocoria exige fundo de olho sob dilatação e, quando o fundo não é visível, ultrassonografia ocular. Outros diferenciais: retinopatia da prematuridade, doença de Coats, persistência da vasculatura fetal e toxocaríase ocular.</p></blockquote>
<h3>Quando operar</h3>
<p>Nem toda catarata congênita é operada. Três parâmetros da opacidade decidem:</p>
<ol><li><strong>Tamanho</strong> — opacidades pequenas não bloqueiam a formação de imagem;</li><li><strong>Localização</strong> — periférica se acompanha, central obstrui o eixo visual;</li><li><strong>Densidade</strong> — opacidade tênue ainda deixa passar estímulo suficiente.</li></ol>
<p>A regra de urgência é a lateralidade: <strong>catarata congênita unilateral densa é cirurgia de urgência</strong>. Com um olho sadio fornecendo imagem nítida, a competição binocular suprime o olho opaco e a ambliopia se instala mais rápido e mais profunda do que quando os dois olhos estão igualmente privados. Além da cirurgia, o tratamento exige correção óptica imediata (lente de contato ou óculos afácico) e <strong>oclusão do olho bom</strong>, sem o que o resultado cirúrgico se perde.</p>
<hr>
<h2>O tratamento é cirúrgico</h2>
<p>Não existe colírio, óculos ou medicamento que reverta a opacidade do cristalino. O tratamento é a <strong>extração do cristalino com implante de lente intraocular (LIO)</strong>, e a indicação é funcional: opera-se quando a visão deixa de atender às necessidades do paciente, não a partir de um valor fixo de acuidade.</p>
<h3>Biometria — o cálculo que antecede a cirurgia</h3>
<p>Retirar o cristalino significa retirar 19 dioptrias do sistema óptico. A <strong>biometria</strong> calcula o grau da LIO que vai substituí-lo, combinando duas medidas em fórmulas de cálculo (Holladay, SRK/T, Haigis):</p>
<ul><li><strong>ceratometria</strong> (K1 e K2) — a curvatura da córnea;</li><li><strong>comprimento axial</strong> — a distância da córnea à retina.</li></ul>
<p>A medida ultrassônica pode ser <strong>de contato</strong> ou <strong>de imersão</strong>; a de imersão evita a compressão da córnea pela sonda e é mais confiável. Um erro de biometria não aparece na sala cirúrgica: aparece depois, como ametropia residual que o paciente terá que corrigir com óculos.</p>

<h3>As duas técnicas</h3>
<div class="tbl"><table><thead><tr><th></th><th>Facectomia extracapsular (FEC + LIO)</th><th>Facoemulsificação (FACO + LIO)</th></tr></thead><tbody><tr><td>Incisão</td><td>ampla, no limbo</td><td>pequena, 2 a 3 mm</td></tr><tr><td>Núcleo</td><td>sai <strong>inteiro</strong>, por expressão</td><td><strong>fragmentado por ultrassom</strong> e aspirado</td></tr><tr><td>Cápsula posterior</td><td>preservada</td><td>preservada</td></tr><tr><td>Sutura</td><td>necessária</td><td>em geral dispensada</td></tr><tr><td>Astigmatismo induzido</td><td>maior</td><td>mínimo</td></tr><tr><td>Indicação atual</td><td>cataratas muito duras ou maduras</td><td>padrão para a maioria dos casos</td></tr></tbody></table></div>
<p>A <strong>facoemulsificação</strong> é a técnica padrão: a ponteira vibra em frequência ultrassônica, quebra o núcleo dentro do saco capsular e aspira os fragmentos pela mesma via. A incisão pequena permite implantar uma LIO dobrável, reduz o astigmatismo cirúrgico e diminui o risco de hemorragia expulsiva. A <strong>extracapsular</strong> continua tendo indicação em núcleos muito duros, em que a energia de ultrassom necessária seria lesiva ao endotélio corneano.</p>
<p>Em ambas, a <strong>cápsula posterior é preservada</strong> para alojar a LIO. A técnica <strong>intracapsular</strong>, que retirava o cristalino com todo o saco capsular, está abandonada — sem apoio capsular, não há onde implantar a lente no lugar fisiológico.</p>
<h4>Tipos de LIO</h4>
<p>As lentes são dobráveis, de material acrílico, com hápticas laterais que as centralizam dentro do saco capsular. As <strong>monofocais</strong> têm foco único, em geral ajustado para longe, e o paciente usa óculos para perto. As <strong>multifocais</strong> trazem anéis concêntricos difrativos que repartem a luz em mais de um foco, dando longe e perto sem óculos — ao custo de perda de contraste e halos noturnos. As <strong>tóricas</strong> corrigem astigmatismo corneano preexistente.</p>
<hr>
<h2>Complicações da cirurgia</h2>
<p>A cirurgia de catarata tem alta taxa de sucesso, mas as complicações caem em prova exatamente porque são graves e reconhecíveis:</p>
<ul><li><strong>Cristalino "mergulhado" no vítreo</strong> — com ruptura da cápsula posterior, o núcleo ou seus fragmentos caem na cavidade vítrea. Desencadeiam inflamação e hipertensão ocular, e a remoção exige vitrectomia.</li><li><strong>Hemorragia expulsiva</strong> — sangramento coroideo maciço com o olho aberto, que expulsa o conteúdo intraocular pela incisão. É a complicação mais catastrófica; o risco é maior em incisões amplas.</li><li><strong>Infecção (endoftalmite)</strong> — dor intensa, hipópio e queda abrupta da visão nos primeiros dias de pós-operatório. <strong>Emergência</strong>: coleta de material e antibiótico intravítreo imediatos.</li><li><strong>Ceratopatia bolhosa</strong> — perda de células endoteliais da córnea, que deixam de desidratar o estroma; a córnea edemacia e forma bolhas epiteliais dolorosas. O endotélio não se regenera, e o tratamento definitivo é o transplante.</li><li><strong>Glaucoma</strong> — por material cristaliniano retido, inflamação ou bloqueio pupilar.</li><li><strong>Lesão de íris e hifema</strong> — sangue na câmara anterior, por trauma cirúrgico dos vasos irianos.</li><li><strong>Descentralização da LIO</strong> — deslocamento da lente por ruptura capsular ou fragilidade zonular, com diplopia monocular e halos.</li></ul>
<blockquote><p><strong>Catarata secundária não é recidiva.</strong> Meses após uma cirurgia bem-sucedida, células epiteliais remanescentes proliferam sobre a cápsula posterior preservada e a opacificam. O paciente volta com o mesmo embaçamento de antes. O tratamento é a <strong>capsulotomia com laser YAG</strong>, feita em consultório, em minutos, sem abrir o olho.</p></blockquote>

<p>A <strong>catarata em olho com uveíte crônica</strong> merece nota própria: a inflamação repetida cola a borda pupilar à cápsula anterior (sinéquias posteriores), a pupila não dilata e o reflexo vermelho está prejudicado. A cirurgia exige liberar as aderências e corar a cápsula com azul de tripano para realizar a capsulorrexe, e o pós-operatório é de risco aumentado para inflamação e glaucoma secundário.</p></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

/* ── header ────────────────────────────────────────────────────────────────── */
function renderHeader(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var left =
    '<div style="min-width:0">' +
      '<div style="display:flex;align-items:center;gap:8px;'+mono+';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8a8578">' +
        '<a href="'+idxHref()+'" class="h-ink" style="color:#2b57cc;text-decoration:none;white-space:nowrap">\u2190 Materiais</a>' +
        '<span style="color:#d3cec4">/</span>' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(EYEBROW)+'</span>' +
      '</div>' +
      '<h1 style="margin:1px 0 0;font-family:\'Newsreader\',Georgia,serif;font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.15">'+esc(TITLE)+'</h1>' +
    '</div>';

  var right = '';
  if (S.view === 'quiz' && S.started) {
    var hit = counts().hit;
    right = '<div style="display:flex;align-items:center;gap:10px;flex-shrink:0">' +
              '<button type="button" data-act="sair" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:9px;padding:6px 11px;'+mono+';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">Sair</button>' +
              '<div style="display:flex;align-items:center;gap:6px">' +
                '<span style="'+mono+';font-size:15px;font-weight:600;letter-spacing:-.02em">'+hit+'</span>' +
                '<span style="'+mono+';font-size:11px;color:#8a8578">/ '+S.order.length+'</span>' +
              '</div></div>';
  } else if (S.view !== 'home') {
    right = '<button type="button" data-act="home" class="h-line" style="flex-shrink:0;background:none;border:1px solid #ddd8ce;border-radius:9px;padding:7px 13px;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">← Início</button>';
  }

  var html = '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:'+(S.view==='quiz'&&S.started?'10px':'2px')+'">'+left+right+'</div>';

  if (S.view === 'quiz' && S.started) {
    var c = counts();
    var rail = S.order.map(function(q,n){
      var a = S.answers[n], cur = n===S.i && !S.finished, bg = '#d3cec4';
      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';
      if (cur && a===null) bg = '#121a2b';
      var st = a===null ? 'em branco' : (a===q.correctIndex ? 'correta' : 'incorreta');
      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +
             '<span style="display:block;width:100%;border-radius:99px;transition:height .18s ease,background .18s ease,box-shadow .18s ease;height:'+(cur?'17px':'9px')+';background:'+bg+';box-shadow:'+(cur?'0 0 0 3px rgba(18,26,43,.13)':'none')+'"></span></button>';
    }).join('');
    html += '<div><div style="display:flex;align-items:center;gap:3px">'+rail+'</div>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-2px">' +
              '<div style="'+mono+';font-size:11px;letter-spacing:.04em;color:#5b6478">Questão '+pad(S.i+1)+' / '+S.order.length+'</div>' +
              '<div style="display:flex;align-items:center;gap:12px;'+mono+';font-size:10.5px;color:#8a8578">' +
                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +
              '</div></div></div>';
  }
  document.getElementById('hdr').innerHTML = html;
}
function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }

    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }

        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +

      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

  var mono = "font-family:'IBM Plex Mono',monospace";

  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

          (tag ? '<span style="flex-shrink:0;'+mono+';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;margin-top:1px;background:'+tBg+';color:'+tFg+'">'+tag+'</span>' : '') +

        '<button type="button" data-act="toggleAll" class="h-ink" style="background:none;border:0;padding:6px 0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;text-decoration:underline;text-underline-offset:3px">'+(allOpen?'Recolher tudo':'Expandir tudo')+'</button>' +
      '</div>' +
      '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">'+filters+'</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">'+cards+'</div>' +
      (list.length===0 ? '<div style="padding:38px 16px;text-align:center;color:#8a8578;font-size:14px;border:1px dashed #ddd8ce;border-radius:14px">Nenhuma questão neste filtro.</div>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:28px;padding-top:24px;border-top:1px solid #e4e0d8">' +
        '<button type="button" data-act="restart" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:13px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">Refazer o quiz</button>' +
        '<button type="button" data-act="back" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Voltar às questões</button>' +
        '<button type="button" data-act="resumo" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Ler o resumo</button>' +
      '</div></section>';
}

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
