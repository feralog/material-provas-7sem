<script type="text/html" id="resumoSrc"><h2>Consciência e coma: conceitos e anatomia do alerta</h2>
<p>Não existe uma definição filosófica satisfatória de consciência, e por isso se usa uma definição <strong>operacional</strong>: consciência é o estado de perfeito conhecimento de si próprio e do ambiente. Na beira do leito ela é decomposta em dois componentes, que dependem de estruturas anatômicas diferentes — e é essa separação que organiza todo o raciocínio do coma.</p>
<div class="tbl"><table><thead><tr><th>Componente</th><th>O que é</th><th>Onde depende</th></tr></thead><tbody><tr><td><strong>Nível de consciência</strong></td><td>grau de alerta comportamental do indivíduo</td><td>interação entre a <strong>formação reticular ativadora ascendente (FRAA)</strong>, na região pontomesencefálica, e o <strong>córtex cerebral como um todo</strong></td></tr><tr><td><strong>Conteúdo de consciência</strong></td><td>soma das funções cognitivas e afetivas: memória, crítica, linguagem, humor</td><td><strong>córtex cerebral</strong></td></tr></tbody></table></div>
<p>Lesões corticais restritas produzem distúrbios restritos do conteúdo — <strong>afasia, apraxia, agnosia</strong> — sem rebaixar o nível. Para haver rebaixamento por lesão cortical é preciso que a <strong>maior parte dos dois hemisférios</strong> esteja lesada.</p>
<h3>A prova experimental</h3>
<p>Em animais, a <strong>secção entre bulbo e medula espinal não altera a vigília</strong>; já a <strong>secção entre os colículos superior e inferior do mesencéfalo</strong> leva a diminuição do nível de consciência. Pequenas lesões mesencefálicas mediais também rebaixam o nível, e a estimulação elétrica da formação reticular pontina alta e mesencefálica desperta o animal. Conclusão: o segmento entre esses dois cortes — ponte alta e mesencéfalo — é o "interruptor" da ativação cortical.</p>
<p>A <strong>formação reticular</strong> é um agrupamento de subnúcleos cujos neurônios recebem colaterais das vias ascendentes e descendentes e integram enorme quantidade de informação. Ela se projeta rostralmente (via tálamo) e mantém o córtex ativado. Lesões da FRAA <strong>ou de suas projeções rostrais</strong> rebaixam a consciência.</p>
<h3>Definição de coma</h3>
<blockquote><p><strong>Coma</strong> é o estado em que o indivíduo não demonstra conhecimento de si próprio nem do ambiente, com ausência ou extrema diminuição do alerta comportamental, permanecendo não responsivo a estímulos internos e externos e <strong>com os olhos fechados</strong>. A causa é lesão ou disfunção da <strong>FRAA</strong>, do <strong>córtex cerebral de forma difusa</strong>, ou de <strong>ambos</strong>.</p></blockquote>
<p>Uma exceção à regra "um hemisfério só não dá coma" é a <strong>lateralização da consciência</strong>: lesões <strong>extensas do hemisfério dominante</strong> (esquerdo, na maioria) podem rebaixar o nível mesmo sendo unilaterais.</p>
<h3>Do alerta ao coma: os estados intermediários</h3>
<p>Entre a vigília (mecanismos de alerta ativos) e o coma (mecanismos inativos) há um contínuo de estados intermediários. A terminologia clínica corrente gradua esse contínuo assim:</p>
<div class="tbl"><table><thead><tr><th>Estado</th><th>Como se apresenta</th></tr></thead><tbody><tr><td><strong>Vigília / alerta</strong></td><td>acordado, responde de modo adequado e imediato</td></tr><tr><td><strong>Sonolência (obnubilação)</strong></td><td>desperta com estímulo verbal ou leve, responde de modo razoavelmente adequado e volta a adormecer quando deixado sem estímulo</td></tr><tr><td><strong>Torpor (estupor)</strong></td><td>só desperta com estímulos <strong>vigorosos e repetidos</strong>, em geral dolorosos; respostas pobres (gemido, retirada) e retorno ao estado anterior assim que o estímulo cessa</td></tr><tr><td><strong>Coma</strong></td><td>não desperta nem com estímulo doloroso; nenhuma resposta com significado, olhos fechados</td></tr></tbody></table></div>
<blockquote><p>Como esses rótulos variam de examinador para examinador, na prática o estado é <strong>descrito pelo estímulo necessário e pela resposta obtida</strong> — e quantificado pela escala de Glasgow.</p></blockquote>
<h3>O coma aparece em três cenários</h3>
<ul><li><strong>progressão esperada</strong> de doença conhecida (isquemia de tronco, herniação transtentorial);</li><li><strong>evento imprevisto</strong> em paciente com situação conhecida (hemorragia intracraniana no plaquetopênico; anoxia por parada no arrítmico);</li><li><strong>paciente totalmente desconhecido</strong> — o cenário de maior dificuldade diagnóstica.</li></ul>
<p>Mesmo diante de uma causa previsível, a causa imprevisível tem de ser lembrada: um paciente com AVC isquêmico de tronco pode entrar em coma por uma <strong>hipoglicemia superveniente</strong>.</p>
<p>O que torna o comatoso difícil é a soma de <strong>inúmeras causas potenciais</strong>, <strong>ausência de história</strong> na maioria das vezes e <strong>pouco tempo</strong> antes que o dano neurológico se torne irreversível.</p>
<h2>Causas: supratentorial, infratentorial ou difusa</h2>
<p>Usando a <strong>tenda do cerebelo</strong> como marco, o conteúdo intracraniano ocupa dois compartimentos: o <strong>supratentorial</strong> (diencéfalo e telencéfalo) e o <strong>infratentorial</strong> (tronco encefálico e cerebelo). Daí a classificação de Plum e Posner, que é o objetivo clínico da avaliação — chegar a <strong>um dos três tipos de coma</strong>, deixando a etiologia exata para os exames subsidiários.</p>
<div class="tbl"><table><thead><tr><th>Tipo</th><th>Subgrupo</th><th>Exemplos</th></tr></thead><tbody><tr><td><strong>Supratentorial</strong></td><td>destrutivas subcorticais e rinencefálicas</td><td><strong>infarto ou hemorragia talâmica</strong> — raras como causa de coma</td></tr><tr><td></td><td>expansivas (massas)</td><td>hemorragias, infartos com edema, tumores, abscessos, trauma craniano</td></tr><tr><td><strong>Infratentorial</strong></td><td>isquêmicas ou destrutivas</td><td>hemorragia pontina, infarto de tronco, enxaqueca vertebrobasilar, desmielinização, tumores, abscessos e granulomas de tronco</td></tr><tr><td></td><td>compressivas</td><td>hemorragia, infarto, tumor e abscesso <strong>cerebelares</strong>; hematoma subdural ou extradural de fossa posterior; aneurisma basilar; tumores extratronco</td></tr><tr><td><strong>Difusa, multifocal e/ou metabólica</strong></td><td>falta de O₂, substrato ou cofatores</td><td>hipóxia, hipoglicemia, deficiência de tiamina</td></tr><tr><td></td><td>doenças de outros órgãos</td><td>insuficiência hepática, renal (urêmica), pulmonar (narcose por CO₂), encefalopatia pancreática; hipófise, tireoide, paratireoide, adrenal; diabetes, porfiria, septicemia</td></tr><tr><td></td><td>intoxicações exógenas</td><td>sedativos, psicotrópicos, ácidos ou precursores de ácidos; penicilina, anticonvulsivantes, esteroides, digitálicos, cimetidina, metais pesados, cianeto, salicilatos, organoclorados, organofosforados</td></tr><tr><td></td><td>hidreletrolíticos e acidobásicos</td><td>hipo e hipernatremia, acidose e alcalose, magnésio, cálcio, hipofosfatemia</td></tr><tr><td></td><td>temperatura</td><td>hipotermia, hipertermia</td></tr><tr><td></td><td>infecção e inflamação do SNC</td><td>meningite, encefalite, encefalomielite parainfecciosa, vasculite, hemorragia subaracnóidea</td></tr><tr><td></td><td>doenças gliais e neuronais</td><td>Creutzfeldt-Jakob, Marchiafava-Bignami, adrenoleucodistrofia, gliomatose, leucoencefalopatia multifocal progressiva</td></tr><tr><td></td><td>outras</td><td>crises e estado pós-ictal; estados delirantes (abstinência, pós-operatório, UTI)</td></tr></tbody></table></div>
<h4>Por que a lesão destrutiva supratentorial quase nunca dá coma</h4>
<p>Lesões destrutivas sem efeito de massa (giros do cíngulo, território da cerebral anterior, núcleos da base) excepcionalmente levam ao coma — e quando o fazem o quadro costuma lembrar <strong>mutismo acinético</strong>. A grande exceção é o <strong>tálamo</strong> (infarto ou hemorragia), porque ali se atinge a própria FRAA em nível talâmico.</p>
<h4>Por que a massa supratentorial dá coma</h4>
<p>Uma massa supratentorial <strong>não causa coma pela localização</strong> — afeta um só hemisfério e produz sinais focais (hemiparesia, afasia, hemianopsia). Ela leva ao coma quando cresce (pela própria lesão ou pelo edema) e provoca <strong>herniação</strong> do conteúdo supratentorial pelo forame da tenda, <strong>comprimindo a formação reticular bilateralmente</strong>.</p>
<h2>Condutas imediatas: proteger o encéfalo antes de diagnosticar</h2>
<p>A avaliação completa do comatoso demora, e o tecido nervoso depende de <strong>três substratos — oxigênio, glicose e cofatores</strong>. Por isso algumas medidas vêm antes do diagnóstico, de forma praticamente automática:</p>
<ol><li>avaliar possibilidade de <strong>trauma</strong>, despir o paciente e verificar sinais vitais (pulso, PA, temperatura, respiração);</li><li>assegurar <strong>oxigenação</strong>;</li><li>verificar <strong>circulação</strong> e obter acesso venoso;</li><li>colher exames laboratoriais e fazer <strong>ECG</strong>;</li><li>dar <strong>tiamina</strong>;</li><li>dar <strong>glicose hipertônica</strong>;</li><li>considerar <strong>antídotos</strong> (a naloxona entra já no suporte inicial);</li><li>tratar <strong>convulsões</strong>;</li><li>proteger os olhos, reduzir a pressão intracraniana, tratar infecções, manter o equilíbrio acidobásico e hidreletrolítico;</li><li>controlar a agitação, considerar sondas vesical e nasogástrica, <strong>nunca deixar o paciente sozinho</strong> e prevenir as complicações da imobilidade.</li></ol>
<h3>Tiamina antes da carga de glicose</h3>
<p>A tiamina (vitamina B1) é cofator de enzimas do metabolismo dos carboidratos. No indivíduo deficiente, uma <strong>carga de glicose pode precipitar a encefalopatia de Wernicke</strong> por deficiência aguda. Dose clássica: <strong>50–100 mg IM ou EV</strong>, obrigatória:</p>
<ul><li>na suspeita de <strong>alcoolismo ou desnutrição</strong>;</li><li>na <strong>ausência de informações</strong>;</li><li>no <strong>coma com ausência de movimentos oculares</strong>.</li></ul>
<p>A tríade de Wernicke — <strong>confusão, ataxia e déficit de movimentos oculares</strong> — não é a única apresentação: pode haver hipotensão, hipotermia e até coma, com mortalidade de até 20%. Além do alcoolista, ocorre em nutrição parenteral prolongada, hiperêmese gravídica, anorexia nervosa, jejum prolongado e insuficiência renal crônica.</p>
<blockquote><p><strong>Atualização:</strong> hoje se usam doses maiores — 100 mg ou mais de forma empírica e, na encefalopatia de Wernicke estabelecida, 200 a 500 mg EV três vezes ao dia.</p></blockquote>
<h3>Glicose hipertônica</h3>
<p>Infundem-se <strong>50 mL de SG 50%</strong> (1 mL/kg), o que corrige uma hipoglicemia e fornece substrato energético. O receio de piorar um coma hiperglicêmico é infundado — a glicemia sobe pouco e o quadro muda pouco —, enquanto <strong>deixar de tratar uma hipoglicemia pode ser fatal</strong>. Como a hiperglicemia piora o prognóstico da isquemia cerebral, <strong>se a glicemia capilar confirmar valor adequado, a infusão pode ser evitada</strong>.</p>
<blockquote><p>Duas pegadinhas: a <strong>ausência de melhora não afasta</strong> hipoglicemia (o paciente pode estar há horas assim, com lesão irreversível), e a <strong>melhora não confirma</strong> hipoglicemia — o SG 50% é hipertônico e pode reduzir a pressão intracraniana.</p></blockquote>
<p>Sintomas de hipoglicemia: <strong>neurogênicos (autonômicos)</strong> — tremor, palpitação, ansiedade, sudorese, fome, parestesias — e <strong>neuroglicopênicos</strong> — confusão, calor, fraqueza, fadiga, déficit cognitivo, crises e coma. Episódios recentes de hipoglicemia deslocam os limiares para baixo, e o paciente perde os sintomas de alerta (<strong>hipoglicemia não percebida</strong>), comum no diabético em insulina e no insulinoma.</p>
<h3>Convulsões</h3>
<p>As crises elevam a pressão intracraniana e o consumo energético cerebral, piorando o prognóstico. <strong>Diazepam 3–10 mg EV lento</strong> (risco de depressão respiratória), seguido de <strong>fenitoína 18 mg/kg EV a no máximo 50 mg/min</strong> (cuidado em cardiopatas e idosos) e manutenção de 3–5 mg/kg/dia (200–300 mg no adulto). O anticonvulsivante <strong>profilático é controverso</strong>; alguns o indicam na hemorragia intracraniana, encefalopatia anóxica e abscesso cerebral.</p>
<p>A agitação só deve ser controlada após avaliação; muitas vezes basta ambiente calmo e iluminado, e quando preciso usa-se <strong>haloperidol</strong>, por ser pouco sedativo. E os acompanhantes <strong>não devem ser liberados</strong> antes de se obter o máximo de informação.</p>
<h2>Exame do comatoso: Glasgow, pupilas e respiração</h2>
<p>A avaliação neurológica tem <strong>cinco itens</strong>: nível de consciência, pupilas e fundo de olho, ritmo respiratório, movimentação ocular extrínseca e padrão de resposta motora.</p>
<h3>Escala de coma de Glasgow</h3>
<div class="tbl"><table><thead><tr><th>Parâmetro</th><th>Resposta</th><th>Pontos</th></tr></thead><tbody><tr><td>Abertura ocular</td><td>espontânea</td><td>4</td></tr><tr><td></td><td>ao estímulo verbal</td><td>3</td></tr><tr><td></td><td>ao estímulo doloroso</td><td>2</td></tr><tr><td></td><td>ausente</td><td>1</td></tr><tr><td>Melhor resposta verbal</td><td>orientado</td><td>5</td></tr><tr><td></td><td>confuso</td><td>4</td></tr><tr><td></td><td>palavras inapropriadas</td><td>3</td></tr><tr><td></td><td>sons ininteligíveis</td><td>2</td></tr><tr><td></td><td>ausente</td><td>1</td></tr><tr><td>Melhor resposta motora</td><td>obedece comandos</td><td>6</td></tr><tr><td></td><td>localiza o estímulo</td><td>5</td></tr><tr><td></td><td>retirada inespecífica</td><td>4</td></tr><tr><td></td><td>padrão flexor (decorticação)</td><td>3</td></tr><tr><td></td><td>padrão extensor (descerebração)</td><td>2</td></tr><tr><td></td><td>ausente</td><td>1</td></tr></tbody></table></div>
<p>O escore vai de <strong>3 a 15</strong>. O estímulo doloroso preferido é a <strong>compressão do leito ungueal</strong> com lápis ou caneta; o estímulo <strong>supraorbitário pode provocar fechamento dos olhos</strong> e atrapalhar a avaliação da abertura ocular.</p>
<blockquote><p><strong>Complemento (uso clínico corrente):</strong> Glasgow <strong>≤ 8</strong> define coma grave e indica proteger a via aérea. Desde 2018 existe o <strong>Glasgow-P</strong>: subtrai-se do total 1 ponto se uma pupila não reage à luz e 2 se nenhuma reage (escore de 1 a 15).</p></blockquote>
<h3>Fundo de olho</h3>
<p>Pode mostrar hemorragias, <strong>papiledema</strong>, retinopatia hipertensiva ou diabética. Mas é <strong>absolutamente contraindicado dilatar a pupila</strong> para fazê-lo: é a análise das pupilas que frequentemente denuncia o agravamento do coma. Se não der para examinar sem midriático, adia-se.</p>
<h3>Pupilas</h3>
<p>O diâmetro pupilar resulta do equilíbrio autonômico: o <strong>simpático dilata</strong>, o <strong>parassimpático contrai</strong>. Midríase e miose traduzem predomínio simpático e parassimpático. Como as duas vias têm trajeto longo pelo SNC, o tipo de pupila tem forte valor localizatório.</p>
<blockquote><p>O <strong>reflexo fotomotor é extremamente resistente a insultos metabólicos e difusos</strong>. Nas encefalopatias metabólicas ele se mantém até fases profundas do coma — logo, <strong>pupila alterada é forte indício de lesão estrutural</strong>.</p></blockquote>
<p>As exceções metabólicas/tóxicas que alteram a pupila precisam ser decoradas:</p>
<div class="tbl"><table><thead><tr><th>Situação</th><th>Pupila</th></tr></thead><tbody><tr><td>Atropina / anticolinérgicos</td><td><strong>midriáticas e fixas</strong></td></tr><tr><td>Opiáceos (morfina)</td><td><strong>intensamente mióticas, com reflexo presente</strong> (às vezes só visível com lupa)</td></tr><tr><td>Hipotermia</td><td>podem ficar fixas</td></tr><tr><td>Barbitúrico em dose alta</td><td>fixas</td></tr><tr><td>Encefalopatia anóxica</td><td>midriáticas e fixas</td></tr><tr><td>Hipóxia</td><td>não reativas — em geral dilatadas, mas podem ser médias ou mióticas</td></tr><tr><td>Glutetimida</td><td>médias e fixas</td></tr></tbody></table></div>
<p>Examina-se o <strong>diâmetro em mm</strong>, a <strong>simetria</strong> (iso ou anisocoria) e os reflexos <strong>direto e consensual</strong>.</p>
<div class="tbl"><table><thead><tr><th>Tipo</th><th>Aspecto</th><th>Reflexo fotomotor</th><th>Significado</th></tr></thead><tbody><tr><td><strong>Diencefálica / metabólica</strong></td><td>pequenas, simétricas</td><td>presente</td><td>encefalopatia metabólica <strong>ou</strong> disfunção diencefálica bilateral (hipofunção simpática) — indistinguíveis só pela pupila; também no idoso e no sono</td></tr><tr><td><strong>Claude Bernard-Horner</strong></td><td>miose unilateral + semiptose</td><td>presente</td><td>lesão da via simpática <strong>ipsilateral à miose</strong> (do hipotálamo à medula cervical baixa, ou periférica)</td></tr><tr><td><strong>Mesencefálica (médias e fixas)</strong></td><td>4–5 mm</td><td>ausente</td><td>lesão da <strong>porção ventral do mesencéfalo</strong> (simpático e parassimpático)</td></tr><tr><td><strong>Tectal</strong></td><td>5–6 mm, com <strong>hippus</strong>; dilata à dor (reflexo ciliospinal)</td><td>ausente</td><td>lesão do <strong>tecto mesencefálico</strong></td></tr><tr><td><strong>Pontina</strong></td><td><strong>puntiformes</strong></td><td>presente (com lupa)</td><td>lesão da ponte, geralmente <strong>hemorragia pontina</strong></td></tr><tr><td><strong>Uncal (III nervo)</strong></td><td><strong>midríase unilateral intensa</strong></td><td>ausente do lado dilatado</td><td><strong>herniação uncal</strong> comprimindo o oculomotor</td></tr></tbody></table></div>
<p>Pupilas dilatadas <strong>bilateralmente</strong> indicam herniação bilateral ou encefalopatia anóxica. Anisocoria com pupila fixa <strong>sem</strong> alteração motora nem de consciência obriga a pensar em <strong>colírio midriático</strong> ou doença ocular (uveíte). Anisocoria constitucional existe, mas sempre com reflexo presente — uma fotografia antiga ajuda.</p>
<h4>Lesão do óptico × lesão do oculomotor</h4>
<div class="tbl"><table><thead><tr><th>Lesão (olho direito)</th><th>Luz no olho direito</th><th>Luz no olho esquerdo</th></tr></thead><tbody><tr><td><strong>Nervo óptico</strong> (via aferente)</td><td>direto <strong>e</strong> consensual negativos</td><td>direto e consensual normais</td></tr><tr><td><strong>Nervo oculomotor</strong> (via eferente)</td><td>direto negativo; consensual (olho esquerdo) normal</td><td>direto normal; consensual (olho direito) negativo</td></tr></tbody></table></div>
<h3>Ritmo respiratório</h3>
<p>É parâmetro de <strong>valor relativo</strong>: o comatoso frequentemente tem doença pulmonar prévia ou complicações próprias do coma, e distúrbios hidreletrolíticos e acidobásicos mexem muito no ritmo. Ainda assim, certos padrões apontam um nível:</p>
<div class="tbl"><table><thead><tr><th>Padrão</th><th>Como é</th><th>Nível sugerido</th></tr></thead><tbody><tr><td><strong>Apneia pós-hiperventilação</strong></td><td>após 5 respirações profundas, demora até 30 s para voltar a respirar</td><td>disfunção telencefálica difusa (paciente ainda não comatoso)</td></tr><tr><td><strong>Cheyne-Stokes</strong></td><td>apneia alternando com hiperpneia de amplitude <strong>crescente e depois decrescente</strong></td><td><strong>diencéfalo</strong> (também na insuficiência cardíaca e no sono normal)</td></tr><tr><td><strong>Hiperventilação neurogênica central</strong></td><td>hiperventilação mantida, pH alcalino, pCO₂ baixa e pO₂ alta</td><td>descrita para o <strong>mesencéfalo</strong>; hoje atribuída sobretudo a congestão pulmonar de causa cerebral</td></tr><tr><td><strong>Apnêustica</strong></td><td>inspiração rápida com <strong>pausa em inspiração profunda</strong></td><td><strong>ponte baixa</strong></td></tr><tr><td><strong>Periódica de ciclo curto</strong></td><td>1–2 respirações amplas, 2–4 rápidas, 1–2 decrescentes</td><td>hipertensão intracraniana, ponte baixa, fossa posterior</td></tr><tr><td><strong>Atáxica (Biot)</strong></td><td><strong>completamente irregular</strong>, apneias com respirações superficiais e profundas</td><td><strong>bulbo</strong> — não mantém ventilação: <strong>indica ventilação mecânica</strong></td></tr><tr><td><strong>Apneia</strong></td><td>—</td><td>falência bulbar: lesão estrutural grave do bulbo, sedativos, lesão cervical alta associada a TCE</td></tr></tbody></table></div>
<blockquote><p>Hiperventilação no comatoso raramente é mesencefálica. Antes, procure <strong>edema pulmonar, acidose, intoxicação por AAS, sepse por Gram-negativos</strong> (sobretudo em idosos), <strong>hipóxia, encefalopatia hepática e tireotoxicose</strong>.</p></blockquote>
<h2>Exame do comatoso: movimentos oculares e resposta motora</h2>
<h3>Bases anatômicas</h3>
<p>Os músculos extrínsecos do olho são inervados pelo <strong>III, IV e VI</strong> nervos; no comatoso estudam-se basicamente o <strong>III</strong> (núcleo no mesencéfalo) e o <strong>VI</strong> (núcleo na ponte), interligados pelo <strong>fascículo longitudinal medial (FLM)</strong>. No olhar lateral voluntário para a direita, fibras do <strong>lobo frontal esquerdo (área 8)</strong> descem, cruzam no mesencéfalo baixo e chegam à <strong>formação reticular pontina paramediana (FRPP) direita</strong>, que ativa o <strong>VI direito</strong> (abdução do olho direito) e, pelo FLM, o <strong>III esquerdo</strong> (adução do olho esquerdo). Os movimentos verticais dependem do <strong>tecto mesencefálico</strong>; os de seguimento, de áreas parieto-occipitais (nistagmo optocinético).</p>
<p>A análise da movimentação ocular extrínseca (MOE) tem cinco etapas: movimentos espontâneos, manobra dos olhos de boneca, manobra oculovestibular, reflexo corneopalpebral e observação das pálpebras.</p>
<h3>Olhos de boneca (oculocefálico)</h3>
<p>Giram-se bruscamente a cabeça para os lados e depois em flexão e extensão. Com as vias do tronco íntegras, os olhos se desviam <strong>no sentido oposto ao do giro da cabeça</strong> (cabeça para a direita, olhos para a esquerda), graças às conexões proprioceptivas cervicais e labirínticas com os núcleos do III e VI. Detecta déficits isolados e de movimentos conjugados — mas <strong>a ausência de resposta não prova lesão</strong> do tronco; a prova seguinte é mais fidedigna.</p>
<h3>Prova oculovestibular (calórica)</h3>
<p>Faz-se <strong>otoscopia antes</strong> (afastar perfuração), coloca-se a cabeça <strong>30° acima da horizontal</strong> e injetam-se <strong>50–100 mL de água gelada</strong> lentamente num conduto auditivo; após 5 minutos, repete-se do outro lado.</p>
<ul><li><strong>Consciente:</strong> nistagmo com fase rápida para o lado <strong>oposto</strong> ao estimulado.</li><li><strong>Coma com tronco íntegro:</strong> <strong>desvio tônico conjugado dos olhos para o lado estimulado</strong>.</li><li>Água gelada nos dois ouvidos: desvio para <strong>baixo</strong>; água a 44 °C nos dois: para <strong>cima</strong> (raramente usada).</li></ul>
<div class="tbl"><table><thead><tr><th>Resposta</th><th>Interpretação</th></tr></thead><tbody><tr><td>conjugada tônica</td><td>ponte e mesencéfalo íntegros</td></tr><tr><td>abdução presente, <strong>adução ausente</strong></td><td>lesão do <strong>FLM</strong> ou do <strong>III nervo</strong></td></tr><tr><td><strong>abdução ausente</strong>, adução presente</td><td>lesão do <strong>VI nervo</strong></td></tr><tr><td>horizontal normal, vertical patológica</td><td>lesão mesodiencefálica</td></tr><tr><td>vertical normal, horizontal patológica</td><td>mesencéfalo íntegro, lesão pontina</td></tr><tr><td>ausente</td><td>lesão intensa do tronco — <strong>ou</strong> drogas vestibulossupressoras (barbitúricos, fenitoína, sedativos, bloqueadores neuromusculares) ou doença vestibular prévia</td></tr><tr><td><strong>nistagmo</strong></td><td>paciente provavelmente consciente — sugere distúrbio psicogênico (não patognomônico)</td></tr></tbody></table></div>
<h3>Reflexo corneopalpebral e pálpebras</h3>
<p>O estímulo da córnea provoca fechamento palpebral e desvio dos olhos para cima (<strong>fenômeno de Bell</strong>): testa o <strong>V</strong> (aferente), o <strong>VII</strong> (eferente) e a área tectal. No coma as pálpebras ficam fechadas; <strong>coma de olhos abertos sugere lesão aguda da ponte</strong>, geralmente vascular. Déficit de fechamento sugere lesão do VII; <strong>semiptose</strong>, lesão simpática; <strong>ptose completa</strong>, lesão do III.</p>
<h3>Achados oculares com valor localizatório</h3>
<div class="tbl"><table><thead><tr><th>Achado</th><th>Sugere</th></tr></thead><tbody><tr><td>movimentos <strong>erráticos</strong> lentos de um lado a outro</td><td>disfunção supratentorial difusa com <strong>tronco preservado</strong></td></tr><tr><td>desvio conjugado + hemiplegia <strong>contralateral</strong></td><td>lesão <strong>supratentorial</strong> do lado para onde olham — "os olhos olham para a lesão"</td></tr><tr><td>desvio conjugado + hemiplegia <strong>ipsilateral</strong></td><td>lesão <strong>pontina</strong> contralateral à hemiplegia — "os olhos olham para a hemiplegia" (exceção: fase irritativa de hemorragia cerebral profunda)</td></tr><tr><td>movimentos alternantes periódicos (<strong>ping-pong</strong>)</td><td>lesão do verme cerebelar ou supratentorial difusa</td></tr><tr><td>desvio conjugado <strong>para baixo</strong></td><td>hemorragia talâmica, hemorragia subaracnóidea difusa, encefalopatia anóxica ou metabólica</td></tr><tr><td>desvio conjugado <strong>para cima</strong></td><td>encefalopatia anóxica grave; atividade epileptiforme</td></tr><tr><td><strong>bobbing clássico</strong> (abalos para baixo, retorno lento, horizontais abolidos)</td><td>lesão <strong>pontina</strong></td></tr><tr><td>bobbing atípico (horizontais preservados)</td><td>encefalopatia difusa</td></tr><tr><td>bobbing reverso (para cima, retorno lento)</td><td>encefalopatia anóxica</td></tr><tr><td>desvio para baixo na calórica unilateral</td><td>intoxicação por hipnótico-sedativos</td></tr><tr><td>movimentos disjuntivos nas manobras</td><td>lesão de tronco</td></tr><tr><td><strong>síndrome um-e-meio</strong> (abolição horizontal de um olho + déficit de adução do outro)</td><td>lesão <strong>pontina</strong> unilateral de FRPP e FLM</td></tr></tbody></table></div>
<h4>Dois tipos de coma pela MOE</h4>
<ul><li><strong>MOE preservada:</strong> lesões estruturais <strong>supratentoriais</strong> (infarto, tumor, hemorragia, abscesso) e causas <strong>metabólicas</strong> (anoxia leve a moderada, hepática, uremia, narcose por CO₂, hipo e hiperglicemia, hiponatremia, hipo e hipercalcemia, pós-ictal, choque séptico) ou <strong>tóxicas</strong> que não deprimem o tronco (etanol, fenotiazínicos, opiáceos, tricíclicos, atropina).</li><li><strong>MOE ausente:</strong> lesões estruturais <strong>infratentoriais</strong> (primárias ou secundárias) e tóxicas por <strong>hipnótico-sedativos</strong>, curare, succinilcolina, anestesia geral, fenitoína, primidona — drogas que deprimem intensamente as vias polissinápticas do tronco.</li></ul>
<blockquote><p><strong>MOE abolida com pupilas reagentes</strong> é a assinatura do coma por <strong>sedativos</strong>: o reflexo fotomotor resiste ao insulto tóxico-metabólico, as vias oculomotoras polissinápticas não.</p></blockquote>
<h3>Resposta motora</h3>
<p>A via motora corre do giro pré-central ao bulbo, onde decussa — por isso é frequentemente atingida nas lesões estruturais. <strong>Sinal motor focal sugere lesão estrutural</strong>, com raras exceções metabólicas: <strong>hipoglicemia, encefalopatia hepática e encefalopatia urêmica</strong>.</p>
<p>Sistemática: movimentação espontânea; reflexos (presença, simetria, <strong>Babinski</strong>, <strong>grasp</strong>); tono (hipertonia, hipotonia, <strong>paratonia</strong> — resistência que lembra hipertonia plástica mas some ao mover o membro lentamente); resposta à dor no leito ungueal, região supraorbitária ou esterno.</p>
<div class="tbl"><table><thead><tr><th>Padrão</th><th>Nível sugerido</th></tr></thead><tbody><tr><td>hemiparesia com comprometimento facial</td><td>hemisfério <strong>contralateral</strong></td></tr><tr><td>hemiparesia facial + <strong>paratonia</strong></td><td>hemisfério contralateral com herniação central incipiente, ou lesão frontal predominante</td></tr><tr><td><strong>decorticação</strong> — MS em adução e flexão de cotovelo, punho e dedos; MI em hiperextensão, flexão plantar e rotação interna</td><td>disfunção <strong>supratentorial</strong></td></tr><tr><td><strong>descerebração</strong> — MS em adução, extensão e hiperpronação; MI em extensão e flexão plantar; às vezes opistótono e trismo</td><td><strong>tronco alto</strong> (no animal, entre núcleo rubro e vestibulares; no homem, até diencéfalo)</td></tr><tr><td>extensão de MMSS com flacidez ou flexão fraca de MMII</td><td><strong>tegmento pontino</strong></td></tr><tr><td>flacidez sem resposta</td><td><strong>ponte baixa e bulbo</strong> — ou lesão periférica associada</td></tr></tbody></table></div>
<h2>Herniações cerebrais e hipertensão intracraniana</h2>
<p>As hérnias que importam na evolução de uma massa supratentorial são a <strong>central</strong> e a <strong>lateral (uncal)</strong>. Na <strong>central</strong>, o diencéfalo é empurrado para baixo através do forame da tenda. Na <strong>lateral</strong>, a porção medial e anterior do lobo temporal (<strong>uncus</strong>) se insinua entre a borda livre da tenda e o mesencéfalo, comprimindo primeiro o <strong>III nervo</strong> e depois o tronco. Em ambas o dano progride no sentido <strong>rostrocaudal</strong> — como se fossem feitas secções sucessivas: diencéfalo → mesencéfalo → ponte → bulbo.</p>
<h3>Evolução da hérnia central</h3>
<div class="tbl"><table><thead><tr><th>Etapa</th><th>Consciência e respiração</th><th>Pupilas</th><th>MOE</th><th>Motricidade</th></tr></thead><tbody><tr><td><strong>Diencefálica</strong></td><td>desatenção e sonolência progressivas; <strong>Cheyne-Stokes</strong></td><td><strong>pequenas e reagentes</strong></td><td><strong>preservada</strong></td><td>paratonia; flexor no MS e extensor no MI</td></tr><tr><td><strong>Mesencefálica</strong></td><td>coma</td><td><strong>médias e fixas</strong></td><td>déficit de adução</td><td><strong>extensora nos quatro membros</strong></td></tr><tr><td><strong>Pontina</strong></td><td>ritmo irregular</td><td>médias e fixas</td><td>abolida</td><td>extensor nos MMSS, ausente ou fracamente flexor nos MMII</td></tr><tr><td><strong>Bulbar</strong></td><td><strong>apneia</strong></td><td>médias e fixas</td><td>abolida</td><td>ausente</td></tr></tbody></table></div>
<blockquote><p>A <strong>etapa diencefálica é o aviso de que o processo ainda é reversível</strong> — e é habitualmente negligenciada. Sinais mesencefálicos já podem indicar lesão irreversível. Se a massa estiver em <strong>área silenciosa</strong> (lobo frontal ou temporal direito), a fase diencefálica pode ser a primeira manifestação e o paciente é rotulado, erroneamente, como <strong>encefalopatia difusa</strong>.</p></blockquote>
<h3>Evolução da hérnia lateral (uncal)</h3>
<p>Massas no lobo temporal ou extra-axiais sobre ele comprimem o <strong>III nervo ipsilateral</strong>: <strong>midríase intensa</strong> primeiro, depois ptose e déficit de adução. Em seguida o mesencéfalo é comprimido e a consciência cai. Pode surgir <strong>hemiplegia ipsilateral à massa</strong>, porque o <strong>pedúnculo cerebral oposto é empurrado contra a borda da tenda</strong> (o chamado fenômeno de Kernohan — um falso sinal localizatório). Daí em diante a evolução é igual à central.</p>
<blockquote><p>A etapa uncal pode ser <strong>lenta (horas)</strong>, mas atingida a fase seguinte a evolução é <strong>fulminante</strong>.</p></blockquote>
<h3>Conduta</h3>
<ul><li>Diagnóstico: <strong>tomografia de crânio</strong>; na falta, arteriografia.</li><li><strong>Punção lombar é contraindicada</strong> em qualquer herniação, mesmo incipiente — pode precipitar progressão rápida.</li><li>Medidas para reduzir a pressão intracraniana e ganhar <strong>4 a 8 horas</strong> até o tratamento definitivo (às vezes cirúrgico):</li><ul><li>hiperventilação assistida com <strong>pCO₂ de 25–30 mmHg</strong>;</li><li><strong>manitol 0,5–1 g/kg EV</strong> em 10–20 min, repetível se piorar (com controle hidreletrolítico);</li><li><strong>dexametasona 10 mg EV</strong>, depois 4 mg EV de 6/6 ou 4/4 h (furosemida 20–40 mg EV se houver aumento do volume hídrico);</li><li><strong>cabeceira elevada a 30–45°</strong>.</li></ul></ul>
<blockquote><p><strong>Atualização:</strong> a hiperventilação hoje é usada só como ponte temporária, com alvo de <strong>pCO₂ 30–35 mmHg</strong> (abaixo disso há risco de isquemia por vasoconstrição). O corticoide serve ao <strong>edema vasogênico</strong> de tumor e abscesso, mas <strong>não</strong> deve ser usado no trauma craniano nem no AVC.</p></blockquote>
<h2>Estrutural × metabólico: chegando ao diagnóstico</h2>
<h3>Coma infratentorial</h3>
<p>A FRAA é atingida por processo na fossa posterior, intrínseco ou extrínseco ao tronco.</p>
<ul><li><strong>Lesões destrutivas</strong> (quase sempre vasculares — isquemia ou hemorragia): rebaixamento com <strong>alteração pupilar e da MOE já no início</strong>, sinais motores em geral <strong>bilaterais</strong> e ritmo respiratório de tronco. Tumores, abscessos e granulomas de tronco costumam dar coma só em fase terminal, já diagnosticados.</li><li><strong>Lesões compressivas</strong> (extratronco): instalação <strong>mais lenta</strong>, com sintomas premonitórios — <strong>cefaleia, náusea, vômitos, vertigem</strong> —, depois alteração respiratória, pupilas mióticas reagentes ou médias fixas, alteração dos movimentos horizontais e sinais motores bilaterais. <strong>Não há a deterioração rostrocaudal</strong> da hérnia supratentorial, e sinais de compressão pontina aparecem <strong>antes</strong> do rebaixamento profundo: <strong>paralisia do olhar conjugado para o lado da lesão e do VI e VII ipsilaterais</strong> (dano ao centro pontino do olhar horizontal, ao núcleo do VI e ao joelho do facial no assoalho do IV ventrículo). É o quadro típico da <strong>hemorragia cerebelar</strong>.</li><li><strong>Herniação transtentorial ascendente:</strong> estruturas da fossa posterior sobem pela tenda e comprimem o tecto mesencefálico — rebaixamento, <strong>olhos desviados para baixo e paralisia do olhar vertical para cima</strong>. Favorecida por <strong>derivação ventricular</strong> em massa de fossa posterior com hidrocefalia. A TC mostra <strong>obliteração das cisternas quadrigeminais</strong>.</li><li><strong>Herniação pelo forame magno:</strong> comprime o bulbo e causa <strong>colapso cardiorrespiratório</strong>, com coma por mecanismo anóxico.</li></ul>
<p>Outros pontos: <strong>bobbing clássico</strong> sugere lesão infratentorial; quem chega em fase tardia de herniação supratentorial tem semiologia de tronco e é impossível distinguir lesão primária de secundária sem história; hemorragias e abscessos supratentoriais podem <strong>romper para o ventrículo</strong> e simular lesão pontina sem passar pela evolução rostrocaudal — a pista são os sinais iniciais supratentoriais (hemiparesia, afasia, hemianopsia).</p>
<h3>Coma difuso, multifocal ou metabólico</h3>
<p>Há depressão seletiva de funções em diferentes níveis, com funções do mesmo nível preservadas. O perfil é:</p>
<ul><li>instalação <strong>gradual</strong>, muitas vezes precedida de <strong>confusão e agitação</strong>;</li><li><strong>sinais motores não lateralizados</strong> (exceções: hipoglicemia, encefalopatia hepática e urêmica, que podem dar até hemiplegia); posturas e Babinski, quando presentes, <strong>simétricos</strong>;</li><li>fenômenos motores de disfunção difusa: <strong>mioclonias, tremores, asterixe</strong>;</li><li><strong>pupilas normais</strong>, no máximo mióticas <strong>com reflexo presente</strong>;</li><li>respiração muito variável (Cheyne-Stokes, hiperventilação, irregular, apneia nas intoxicações);</li><li><strong>MOE normal</strong>, exceto nos hipnótico-sedativos.</li></ul>
<p>Duas armadilhas: a <strong>fase diencefálica</strong> de uma massa em área silenciosa e as <strong>lesões talâmicas</strong> podem simular encefalopatia difusa.</p>
<h4>Investigação</h4>
<p>História cuidadosa, exame físico geral e exames: glicemia, hemograma, eletrólitos (Na, K, Cl, Ca, Mg, PO₄), ureia e creatinina, gasometria, toxicológico (sangue, urina, suco gástrico — muitas drogas não são dosáveis), provas hepáticas com <strong>amônia</strong>, coagulograma, tireoide e adrenal, culturas, sorologias, <strong>EEG</strong> e <strong>líquor</strong>.</p>
<blockquote><p><strong>Osmolaridade calculada</strong> = 2 × Na + glicemia/18 + ureia/6 (normal 285–295 mOsm/kg). Medida bem acima da calculada (<strong>gap osmolar</strong>) sugere toxina de baixo peso molecular: <strong>metanol</strong>, acetona, isopropanol, etanol.</p></blockquote>
<p>O <strong>EEG</strong> pode mostrar padrão de encefalopatia metabólica (hepática), encefalite (herpética), <strong>estado de mal epiléptico não convulsivo</strong> ou sofrimento hemisférico unilateral — e, se normal, aponta para quadro psiquiátrico.</p>
<h3>Algoritmo de abordagem</h3>
<ol><li><strong>Suporte de vida:</strong> intubação, acesso venoso, PA, pulso, temperatura, respiração, monitorização cardíaca, <strong>naloxona</strong>.</li><li><strong>História rápida.</strong></li><li><strong>Preservar o SNC:</strong> oxigênio, <strong>tiamina, glicose</strong>.</li><li>História completa, exame geral e neurológico — e então três trilhas:</li></ol>
<div class="tbl"><table><thead><tr><th>Suspeita</th><th>Primeiro exame</th><th>Desdobramento</th></tr></thead><tbody><tr><td><strong>massa ou hemorragia</strong></td><td><strong>TC de crânio</strong></td><td>massa presente → neurologia, tratar HIC, considerar angiografia; massa ausente → <strong>líquor para afastar hemorragia</strong> (sangue → mesma conduta da massa; sem sangue → avaliação tóxico-metabólica)</td></tr><tr><td><strong>meningite</strong></td><td><strong>líquor</strong> — com <strong>TC antes</strong> se houver dúvida no exame ou história de massa</td><td>meningite → tratamento específico; outra infecção → avaliação tóxico-metabólica e considerar TC</td></tr><tr><td><strong>tóxico-metabólica ou hipotermia</strong></td><td>avaliação tóxico-metabólica</td><td>diagnóstico → tratamento; sem diagnóstico → <strong>TC ou líquor em 4 horas</strong></td></tr></tbody></table></div>
<p>Sem diagnóstico ao fim das trilhas: história mais detalhada e consulta neurológica.</p>
<h4>Lesões que a TC pode não mostrar</h4>
<p>Quando a clínica sugere lesão estrutural e a TC é normal, lembrar: lesões de <strong>fossa posterior</strong> (infarto ou hemorragia de tronco, tumores, hemorragias cerebelares baixas), <strong>hematoma subdural crônico isodenso bilateral</strong>, <strong>encefalite herpética</strong> e <strong>AVC isquêmico extenso de cerebral média nas primeiras 8 horas</strong>. Avisar o radiologista ajuda; a RM ajuda, mas é demorada no paciente grave.</p>
<h2>Estados que sucedem ou imitam o coma</h2>
<div class="tbl"><table><thead><tr><th>Estado</th><th>Olhos abertos / ciclo sono-vigília</th><th>Percepção</th><th>Movimento</th><th>Lesão típica</th></tr></thead><tbody><tr><td><strong>Estado vegetativo</strong></td><td>sim / sim</td><td><strong>ausente</strong></td><td>reflexo apenas</td><td>cortical difusa com tronco funcionante</td></tr><tr><td><strong>Minimamente consciente</strong></td><td>sim / sim</td><td><strong>mínima, mas reprodutível</strong></td><td>intencional, inconsistente</td><td>variada, menos grave</td></tr><tr><td><strong>Mutismo acinético</strong></td><td>sim / sim; explora o ambiente com o olhar</td><td>parece presente</td><td><strong>não se move nem fala</strong></td><td>frontal medial, reticulocortical, hidrocefalia</td></tr><tr><td><strong>Locked-in</strong></td><td>sim / sim</td><td><strong>plena</strong></td><td>só <strong>olhos verticais</strong> e piscar</td><td><strong>ponte ventral</strong></td></tr><tr><td><strong>Retirada psíquica</strong></td><td>resiste à abertura</td><td>presente</td><td>tono normal, respostas imprevisíveis</td><td>nenhuma — EEG normal</td></tr><tr><td><strong>Morte encefálica</strong></td><td>não / não</td><td>ausente</td><td>só respostas medulares</td><td>perda de toda a função encefálica</td></tr></tbody></table></div>
<h3>Estado vegetativo persistente (EVP)</h3>
<p>Termo criado por <strong>Jennett e Plum (1972)</strong>. Seja qual for a causa do coma — salvo lesão bilateral do III nervo —, <strong>duas a três semanas</strong> depois o paciente começa a <strong>abrir os olhos e recupera o ciclo vigília-sono</strong>, mas os olhos <strong>não se orientam</strong> para o estímulo (podem simular seguimento). É <strong>vigília sem percepção</strong> do ambiente. A descerebração pode dar lugar a respostas flexoras lentas e distônicas; surgem <strong>grasp</strong> intenso, mastigação e deglutição; sons ininteligíveis à dor, nunca com significado, e a maioria não vocaliza.</p>
<ul><li>O diagnóstico é <strong>clínico</strong> — nenhum exame laboratorial, EEG ou de imagem o define.</li><li>Quem recupera a percepção costuma <strong>emergir direto do coma</strong>; quem assume o quadro de EVP normalmente não se recupera, embora haja recuperação descrita após até <strong>8 semanas</strong>.</li><li>A <strong>ausência do potencial evocado somatossensitivo</strong> no córtex parietal contralateral parece correlacionar-se com mau prognóstico.</li></ul>
<blockquote><p><strong>Complemento (terminologia atual):</strong> a força-tarefa americana de 1994 chamou de <em>persistente</em> o estado vegetativo com mais de <strong>1 mês</strong> e de <em>permanente</em> o que dura mais de <strong>3 meses</strong> após lesão não traumática ou <strong>12 meses</strong> após trauma. A diretriz de 2018 prefere "estado vegetativo <strong>crônico</strong>", porque há recuperações tardias, e muitos autores usam "<strong>síndrome da vigília não responsiva</strong>".</p></blockquote>
<h3>Estado minimamente consciente</h3>
<p>Conceito mais recente, definido pelo consenso de Aspen (2002). O paciente tem evidência <strong>mínima, mas definida e reprodutível</strong>, de percepção de si ou do ambiente: <strong>seguir um comando simples</strong>, responder sim/não (gesto ou fala, mesmo de modo pouco confiável), verbalizar algo inteligível, ou comportamento intencional como <strong>seguimento visual sustentado</strong>, sorriso ou choro apropriados ao contexto e alcançar objetos. A diferença para o estado vegetativo <strong>não é o ciclo vigília-sono nem os reflexos de tronco</strong> (ambos têm), e sim esses sinais de percepção. Sai-se dele quando volta a <strong>comunicação funcional</strong> ou o <strong>uso funcional de objetos</strong>. O prognóstico é melhor que o do vegetativo.</p>
<h3>Mutismo acinético</h3>
<p>Paciente <strong>alerta</strong>, com ciclo vigília-sono, <strong>explorando o campo visual com os olhos</strong>, mas incapaz de se mover, vocalizar ou ter reação faciovocal à dor — e <strong>sem grandes sinais de lesão piramidal</strong>. Decorre de lesão das vias reticulocorticais ou límbico-corticais:</p>
<ul><li>lesões <strong>frontais basais e mediais</strong> (córtex orbital, área septal, giro do cíngulo);</li><li>lesões pequenas da FRAA paramediana do diencéfalo posterior e mesencéfalo adjacente;</li><li><strong>hidrocefalia subaguda</strong>.</li></ul>
<p>Admite-se lesão do <strong>trato mesencéfalo-frontal dopaminérgico</strong>, daí o uso de <strong>agonistas dopaminérgicos (bromocriptina)</strong>, às vezes com bom resultado.</p>
<h3>Estado confusional agudo (delirium)</h3>
<p>Alteração do estado mental em que o <strong>déficit mais saliente é o da atenção</strong>. Em geral sem sinais focais motores ou sensitivos, exceto tremor, mioclonias e asterixe. Três aspectos fundamentais:</p>
<ol><li>distúrbio de vigilância com <strong>aumento da distração</strong>;</li><li>incapacidade de manter a <strong>coerência do pensamento</strong>;</li><li>incapacidade de executar uma <strong>sequência de movimentos com objetivo</strong>.</li></ol>
<p>Somam-se ilusões e alucinações, desorientação, déficit de memória, anomia discreta, disgrafia, discalculia, déficit construtivo e falha de julgamento; o paciente pode estar apático ou agitado. A atenção depende da <strong>FRAA</strong> (tônus global) e do <strong>neocórtex rostral</strong> (seletividade, atuando sobre o tálamo) — sobretudo pré-frontal e parietal posterior <strong>direitos</strong> e temporal ventral.</p>
<p><strong>Causas:</strong> encefalopatias tóxico-metabólicas; doenças multifocais (meningite, encefalite, anoxia, vasculite, CIVD, embolia gordurosa, piora aguda de demência); trauma craniano; epilepsia (pós-ictal, crises parciais complexas); massas, sobretudo <strong>hematoma subdural crônico</strong>; lesões focais vasculares (parietal posterior direito, pré-frontal direito, giros para-hipocampal-fusiforme-lingual).</p>
<p><strong>Diferenciais:</strong> psicose de Korsakoff, afasia de Wernicke, depressão, <strong>demência</strong> (o critério é o <strong>tempo de evolução</strong>; o demente tem mais predisposição a confusão aguda, reversível ao corrigir a causa) e <strong>psicose aguda</strong> (alucinações mais <strong>auditivas</strong> e <strong>EEG normal</strong>).</p>
<blockquote><p>Termos como "psicose orgânica" e "síndrome cerebral orgânica aguda" caíram em desuso. Já <strong>delirium</strong> é hoje o termo <strong>preferido</strong> (DSM-5) — sinônimo de estado confusional agudo.</p></blockquote>
<h3>Síndrome do encarceramento (locked-in, estado deeferentado)</h3>
<p>Lesão — geralmente aguda — da <strong>porção ventral da ponte</strong> interrompe as fibras motoras corticais: o paciente fica <strong>tetraplégico</strong> e não move lábios nem língua (fibras para os núcleos dos nervos cranianos), com <strong>déficit do olhar horizontal</strong>, conseguindo apenas <strong>elevar e abaixar os olhos</strong>. Mas está <strong>consciente</strong>, porque a <strong>porção dorsal da ponte, onde está a FRAA, permanece íntegra</strong>. A comunicação é possível por código de letras com o olhar. Quadros parecidos ocorrem em lesões periféricas graves (miastenia, polirradiculoneurite).</p>
<blockquote><p><strong>Complemento:</strong> a causa clássica é a <strong>trombose da artéria basilar</strong>, e o EEG é normal. O locked-in pode simular morte encefálica, mas os <strong>reflexos de tronco estão presentes</strong>.</p></blockquote>
<h3>Retirada psíquica</h3>
<p>Alterações psíquicas involuntárias ou voluntárias (simulação, em geral com ganho secundário) imitam o coma. Pistas: <strong>tono normal</strong>, posturas não usuais, mudança de postura quando sozinho, resistência à movimentação passiva, ausência de reflexos patológicos, <strong>resistência à abertura palpebral</strong>, olhos forçadamente fechados, <strong>queda rápida da pálpebra</strong> após abertura (no coma ela cai lentamente), respostas imprevisíveis às manobras oculocefálicas, <strong>nistagmo na prova calórica</strong>, pupilas normais ou dilatadas (cicloplégicos). Na dúvida, <strong>o EEG é o melhor exame — será normal</strong>.</p>
<h3>Catatonia</h3>
<p>Síndrome erroneamente tomada como sinônimo de doença psiquiátrica. Inclui distúrbios de postura (rigidez, às vezes <strong>cérea</strong>), retirada psicossocial (mutismo, negativismo), excitação e comportamento repetitivo (estereotipias, maneirismos, ecolalia, ecopraxia). Exige investigação clínica e de imagem, porque os diferenciais incluem doenças psiquiátricas (esquizofrenia, transtornos afetivos), neurológicas (núcleos da base, sistema límbico e lobos temporais — encefalite herpética —, diencéfalo), metabólicas (cetoacidose, hipoglicemia, porfiria aguda intermitente, encefalopatia hepática, homocistinúria, pelagra, hipercalcemia), tóxicas (etanol, mescalina, cocaína, fenciclidina, anfetamina) e farmacológicas (AAS, ACTH, neurolépticos).</p>
<h2>Morte encefálica</h2>
<p>O diagnóstico de morte encefálica é aceito como <strong>confirmação de morte</strong>: a função dos órgãos não se mantém por muito tempo, quaisquer que sejam as medidas. É diferente do estado vegetativo, em que as funções vegetativas seguem ativas e a sobrevida pode ser muito longa. O diagnóstico justifica suspender medicações e aparelhos e liberar para <strong>doação de órgãos</strong>.</p>
<p>Duas vertentes conceituais:</p>
<ul><li><strong>Americana</strong> (Harvard 1968 → NIH 1971 → Comissão Presidencial 1981): morte é a <strong>cessação irreversível de todas as funções do encéfalo, incluindo o tronco</strong>. Perder só a função cerebral superior não é morte — o encéfalo é o organizador de todas as funções do corpo.</li><li><strong>Britânica</strong> (Royal Colleges, 1976): <strong>cessação irreversível das funções do tronco</strong>, diagnosticada clinicamente, sem exame obrigatório.</li></ul>
<p>Três princípios: <strong>irreversibilidade do coma</strong>, <strong>ausência de reflexos de tronco</strong> e <strong>ausência de atividade cortical</strong>.</p>
<h3>Critérios clínicos (protocolo clássico)</h3>
<ol><li>Diagnóstico da doença que causou o quadro.</li><li>Afastar situações que simulem morte encefálica.</li><li>Exame neurológico:</li><ul><li><strong>Glasgow 3</strong>, desconsiderando respostas medulares;</li><li><strong>pupilas médias ou midriáticas (4–5 mm), sem fotomotor</strong> — <strong>pupilas pequenas sugerem intoxicação</strong>;</li><li><strong>oculocefálico e oculovestibular negativos</strong>;</li><li><strong>sem resposta motora à dor</strong>, podendo haver <strong>respostas medulares</strong>;</li><li>reflexos <strong>corneano, mandibular, faríngeo</strong> e axiais da face ausentes; o cutaneoplantar é irrelevante;</li><li><strong>teste de apneia</strong> obrigatório, até <strong>paCO₂ de 55–60 mmHg</strong>, sem movimentos respiratórios.</li></ul><li>Tempo mínimo de observação: <strong>6 horas</strong>.</li></ol>
<h3>O que simula ou atrapalha</h3>
<div class="tbl"><table><thead><tr><th>Situação</th><th>Detalhe</th></tr></thead><tbody><tr><td>Intoxicações</td><td>sobretudo <strong>barbitúricos</strong> (&gt; 10 mg/dL) e <strong>bloqueadores neuromusculares</strong> — dosar na dúvida</td></tr><tr><td><strong>Hipotermia</strong></td><td>temperatura deve estar <strong>acima de 35 °C</strong></td></tr><tr><td>Choque</td><td>PA sistólica ≥ 95 mmHg</td></tr><tr><td>Encefalite de tronco</td><td>reflexos de tronco ausentes, mas há atividade cortical</td></tr><tr><td>Trauma facial múltiplo</td><td>dificulta o exame</td></tr><tr><td><strong>Locked-in</strong></td><td>parece coma, mas os <strong>reflexos de tronco estão presentes</strong></td></tr><tr><td>Alterações pupilares prévias</td><td>colírios, drogas, cirurgia, trauma</td></tr><tr><td>Distúrbio metabólico grave</td><td>—</td></tr><tr><td>Criança &lt; 4 anos</td><td>mais resistente ao trauma — observação maior e dois médicos</td></tr><tr><td>Vítima de homicídio</td><td>maiores problemas médico-legais</td></tr></tbody></table></div>
<h3>Exames complementares</h3>
<ul><li><strong>Ausência de atividade:</strong> EEG, potencial evocado, vasopressina.</li><li><strong>Ausência de fluxo:</strong> <strong>angiografia dos quatro vasos</strong> (carótidas e vertebrais) por cateterismo — <strong>o exame mais específico</strong>; angiografia isotópica, TC com contraste, SPECT, Doppler transcraniano.</li></ul>
<blockquote><p><strong>Atualização — Brasil, Resolução CFM 2.173/2017</strong> (o protocolo clássico acima trata o exame complementar como apenas confirmatório): pré-requisitos de <strong>temperatura &gt; 35 °C</strong>, <strong>SatO₂ &gt; 94%</strong> e <strong>PAS ≥ 100 mmHg ou PAM ≥ 65 mmHg</strong> no adulto, após <strong>no mínimo 6 horas</strong> de tratamento e observação hospitalar (<strong>24 h</strong> se a causa for encefalopatia hipóxico-isquêmica); <strong>dois exames clínicos por médicos diferentes</strong>, com intervalo mínimo de <strong>1 hora</strong> acima de 2 anos de idade; <strong>um teste de apneia</strong> (PaCO₂ &gt; 55 mmHg); e <strong>exame complementar obrigatório</strong>.</p></blockquote></script>

  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +
      '</button>';
  }).join('');

  var expl = reveal ? '<div style="margin-top:20px;padding:16px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;animation:qFade .26s ease">' +
      '<div style="'+mono+';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:8px">Por quê</div>' +
      '<p style="margin:0;font-size:14.5px;line-height:1.68;color:#39404f;text-wrap:pretty">'+esc(q.explanation)+'</p></div>' : '';

  var blank = counts().blank;

      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +

        (reveal ? chatBox(q, ans===q.correctIndex) : '') +

        '<button type="button" data-act="prev" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:12px 18px;font-size:14px;cursor:pointer;transition:border-color .15s ease,color .15s ease;color:'+(S.i===0?'#c4bfb4':'#121a2b')+';pointer-events:'+(S.i===0?'none':'auto')+'">← Anterior</button>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          (early ? '<button type="button" data-act="finish" class="h-ink" style="background:none;border:0;padding:12px 6px;'+mono+';font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a8578;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Finalizar</button>' : '') +
          '<button type="button" data-act="next" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">'+(last?'Finalizar':'Próxima →')+'</button>' +
        '</div></div></section>';
}

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';
  if (pct>=90)      { title='Domínio sólido';   msg='Desempenho excelente. Confira as explicações das que escaparam e siga em frente.'; }
  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

  var stat = function(v,l,color){
    return '<div style="background:#faf9f6;padding:14px 10px">' +
      '<div style="'+mono+';font-size:19px;font-weight:500;color:'+color+'">'+v+'</div>' +
      '<div style="'+mono+';font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#8a8578;margin-top:2px">'+l+'</div></div>';
  };

  var fdefs = [['all','Todas',c.total],['wrong','Erradas',c.miss],['right','Certas',c.hit],['blank','Em branco',c.blank]];
  var filters = fdefs.map(function(f){
    var on = S.filter===f[0];
    return '<button type="button" data-act="filter" data-k="'+f[0]+'" class="h-line" style="border-radius:99px;padding:8px 14px;font-size:13px;cursor:pointer;transition:all .15s ease;border:1px solid '+(on?'#121a2b':'#ddd8ce')+';background:'+(on?'#121a2b':'transparent')+';color:'+(on?'#f5f3ef':'#5b6478')+'">'+f[1]+' '+f[2]+'</button>';
  }).join('');

  var list = reviewList();
  var allOpen = list.length>0 && list.every(function(r){ return S.open[r.idx]; });

  var cards = list.map(function(r){
    var numBg='#f0ede7', numFg='#8a8578';
    if (!r.blank) { if (r.ok) { numBg='#e3f0e8'; numFg='#1f5c3e'; } else { numBg='#fbe6e2'; numFg='#8f2f25'; } }
    var open = !!S.open[r.idx];
    var body = '';
    if (open) {
      var opts = r.q.options.map(function(text,n){
        var isC = n===r.q.correctIndex, isMine = n===r.a;
        var bd='#eeebe4', bg='#fbfaf8', fg='#5b6478', bBg='#f0ede7', bFg='#8a8578', tag='', tBg='', tFg='';
        if (isC)            { bd='#bcdcc9'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; tag='Correta'; tBg='#d9ede1'; tFg='#1f5c3e'; }
        if (isMine && !isC) { bd='#eec4bd'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; tag='Sua resposta'; tBg='#f7ddd8'; tFg='#8f2f25'; }
        if (isMine && isC)  { tag='Sua resposta ✓'; }
        return '<div style="display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:11px;font-size:14px;line-height:1.5;border:1px solid '+bd+';background:'+bg+';color:'+fg+'">' +
          '<span style="flex-shrink:0;width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:10.5px;font-weight:600;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
          '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +

      body = '<div style="padding:2px 15px 18px;animation:qDrawer .2s ease">' +

        figura(r.q) +
        '<div style="display:flex;flex-direction:column;gap:7px">'+opts+'</div>' +
        '<div style="margin-top:16px;padding:14px 16px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 11px 11px 0">' +
          '<div style="'+mono+';font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:7px">Por quê</div>' +
          '<p style="margin:0;font-size:14px;line-height:1.65;color:#39404f;text-wrap:pretty">'+esc(r.q.explanation)+'</p></div>' +
        '<button type="button" data-act="jump" data-n="'+r.idx+'" style="margin-top:14px;background:none;border:0;padding:0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#2b57cc;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Abrir no quiz →</button></div>';
    }
    return '<div style="background:#fff;border:1px solid '+(open?'#c9c3b6':'#e4e0d8')+';border-radius:14px;overflow:hidden;transition:border-color .15s ease">' +
      '<button type="button" data-act="toggle" data-n="'+r.idx+'" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 15px;cursor:pointer">' +
        '<span style="flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:12px;font-weight:600;background:'+numBg+';color:'+numFg+'">'+pad(r.idx+1)+'</span>' +
        '<span style="flex:1;min-width:0;font-size:14px;line-height:1.45;color:#39404f;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(r.q.question)+'</span>' +

  }).join('');

  document.getElementById('stage').innerHTML =
    '<section style="padding:34px 0 0;animation:qFade .3s ease">' +
      '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:14px">Resultado</div>' +
      '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:36px;line-height:1.12;font-weight:400;letter-spacing:-.025em;margin:0 0 8px">'+title+'</h2>' +
      '<p style="font-size:15px;line-height:1.6;color:#5b6478;margin:0 0 24px;max-width:48ch;text-wrap:pretty">'+msg+'</p>' +
      '<div style="height:8px;border-radius:99px;background:#e4e0d8;overflow:hidden;margin-bottom:10px">' +
