<script type="text/html" id="resumoSrc"><h2>O que é a Declaração de Óbito e por que ela importa</h2>
<p>A Declaração de Óbito (DO) é o documento oficial que atesta legalmente um falecimento. É obrigatória para o sepultamento e para o registro do óbito em cartório, e deve ser preenchida por profissional habilitado, conforme as normativas do Ministério da Saúde. A DO é o documento-base do Sistema de Informação sobre Mortalidade (SIM), o que faz do seu preenchimento correto uma questão que ultrapassa o caso individual: os dados nela lançados alimentam estatísticas de saúde pública, orientam o monitoramento de doenças e o planejamento de políticas de saúde, e servem de base para registros civis, aposentadorias e seguros. Um preenchimento impreciso não é apenas um erro de formulário — distorce indicadores epidemiológicos, prejudica o direito da família a uma informação correta e pode ter consequências jurídicas.</p>
<blockquote><p>A emissão da DO é, segundo a Resolução CFM nº 1.779/2005, <strong>ato médico</strong>. O médico tem obrigação legal de constatar e atestar o óbito, e responsabilidade ética e jurídica por tudo o que é registrado no documento — inclusive pela sua própria assinatura. Por isso, o documento deve ser revisado por inteiro antes de ser assinado.</p></blockquote>
<h3>O que o médico deve fazer</h3>
<ul><li>Preencher os dados de identificação com base em um <strong>documento oficial com foto</strong> da pessoa falecida.</li><li>Registrar os dados com letra legível, sem siglas, abreviações ou rasuras.</li><li>Registrar as causas da morte anotando <strong>apenas um diagnóstico por linha</strong>, com o tempo aproximado entre o início da doença e a morte. O médico não preenche o campo do CID.</li><li>Revisar o documento inteiro, identificar-se e assinar.</li></ul>
<h3>O que nunca fazer</h3>
<blockquote><p>Quatro condutas configuram erro grave no preenchimento da DO: <strong>assinar em branco</strong>, deixando campos para terceiros completarem depois; <strong>preencher sem examinar o corpo</strong> e constatar a morte pessoalmente; <strong>usar termos vagos</strong> como parada cardíaca, parada cardiorrespiratória ou falência múltipla de órgãos, que descrevem o mecanismo final comum a quase toda morte sem apontar a doença que a causou; e <strong>cobrar</strong> pela emissão do documento.</p></blockquote>
<h2>Quando emitir — e quando não emitir — a Declaração de Óbito</h2>
<p>A DO deve ser emitida em todos os óbitos, sejam eles de causa natural ou violenta. Uma situação frequentemente mal compreendida é a do recém-nascido: quando a criança <strong>nasce viva</strong> e morre logo em seguida, a emissão é obrigatória <strong>independentemente</strong> da duração da gestação, do peso ao nascer ou do tempo que a criança permaneceu viva. Esses critérios de idade gestacional, peso e estatura só entram em jogo quando o óbito é fetal — ou seja, quando não houve nascimento com vida.</p>
<blockquote><p><strong>Critérios de óbito fetal que exigem DO</strong> (basta um deles estar presente): - gestação com duração igual ou superior a <strong>20 semanas</strong>; - feto com peso igual ou superior a <strong>500 gramas</strong>; - feto com estatura igual ou superior a <strong>25 centímetros</strong>. Abaixo de todos esses três limiares, a DO <strong>não</strong> deve ser emitida. Também não se emite DO para peças anatômicas amputadas, que não configuram óbito de uma pessoa.</p></blockquote>
<h2>Quem deve preencher a Declaração de Óbito</h2>
<p>A responsabilidade pelo preenchimento muda conforme o tipo de morte e a existência (ou não) de assistência médica ou de estrutura pericial na localidade.</p>
<div class="tbl"><table><thead><tr><th>Cenário</th><th>Quem preenche</th></tr></thead><tbody><tr><td>Morte natural, <strong>com</strong> assistência médica</td><td>Médico assistente ou, na sua falta, substituto, plantonista, ou o médico designado pela instituição (hospitalar, ambulatorial, domiciliar ou de programa como o de Saúde da Família)</td></tr><tr><td>Morte natural, <strong>sem</strong> assistência médica</td><td>Médico do SVO, ou médico do serviço público de saúde mais próximo do local do óbito, ou, na ausência de ambos, qualquer médico da localidade</td></tr><tr><td>Morte não-natural (causa externa), em localidade <strong>com</strong> IML</td><td>Médico legista, ou qualquer médico que tenha acompanhado o intervalo entre o evento violento e a morte</td></tr><tr><td>Morte não-natural (causa externa), em localidade <strong>sem</strong> IML</td><td>Qualquer médico da localidade, desde que investido pela autoridade judicial ou policial como perito legista eventual (<em>ad hoc</em>)</td></tr></tbody></table></div>
<p>Um óbito por causa externa (morte não-natural) é aquele que decorre de lesão provocada por violência — homicídio, suicídio, acidente ou morte suspeita — qualquer que tenha sido o tempo transcorrido entre o evento lesivo e a morte propriamente dita. Essa definição importa porque muda quem tem competência legal para assinar: um médico assistente, por mais que tenha acompanhado o paciente antes do evento, não pode atestar sozinho uma morte não-natural.</p>
<h2>Estrutura da Declaração de Óbito</h2>
<p>A DO reúne campos essenciais organizados em blocos: identificação do falecido (nome, idade, sexo, naturalidade, endereço), informação sobre assistência médica e a condição do atestado, local do óbito e responsabilidade pelo preenchimento, e o bloco de causas da morte — o núcleo clínico do documento, tratado em detalhe a seguir.</p>
<p>No bloco de identificação do médico (Bloco VI), o profissional declara seu nome, CRM, meio de contato, data do atestado e assinatura, além de marcar sob qual vínculo atestou o óbito: <strong>assistente, substituto, IML, SVO ou outro</strong>. Esse campo é o que permite rastrear, posteriormente, a responsabilidade legal pelo atestado.</p>
<h2>Causa básica e causa imediata: a distinção central</h2>
<p>Toda a lógica de preenchimento das causas da morte gira em torno de uma distinção que precisa estar automatizada antes mesmo de abrir o formulário.</p>
<div class="tbl"><table><thead><tr><th></th><th>Definição</th><th>Posição na DO</th></tr></thead><tbody><tr><td><strong>Causa imediata</strong></td><td>Doença, lesão ou complicação mais recente — a afecção mais próxima do momento da morte —, desencadeada pela causa básica</td><td>Parte I, linha a</td></tr><tr><td><strong>Causa básica</strong></td><td>Doença ou condição inicial responsável por toda a cadeia de eventos que culminou no óbito</td><td>Parte I, última linha preenchida (b, c ou d)</td></tr></tbody></table></div>
<p>As causas devem ser descritas <strong>na sequência lógica de evolução da doença</strong>: da mais recente (linha a) para a mais antiga, percorrendo eventuais causas intermediárias nas linhas seguintes. Escolher mal a causa básica não é um detalhe formal — a escolha correta impacta diretamente as estatísticas de mortalidade e o planejamento de saúde pública, porque é a causa básica, e não a imediata, que entra nas grandes séries epidemiológicas de mortalidade.</p>
<h2>Parte I e Parte II: construindo a cadeia causal</h2>
<p>A Parte I da DO é dividida em quatro linhas:</p>
<ul><li><strong>Linha a</strong> — causa terminal ou imediata da morte.</li><li><strong>Linhas b, c, d</strong> — causas antecedentes, preenchidas em ordem cronológica inversa; a última linha preenchida traz a causa básica.</li></ul>
<p>Cada linha responde a "devido a, ou como consequência de", amarrando uma causa à seguinte numa cadeia única e coerente. Nem toda condição do paciente entra nessa cadeia: a <strong>Parte II</strong> reúne outras condições significativas que contribuíram para a morte, mas que <strong>não têm relação causal direta</strong> com a doença ou condição indicada na Parte I. Uma hipertensão arterial crônica ou uma sequela neurológica antiga, por exemplo, podem ter agravado o estado geral do paciente sem terem sido o elo que efetivamente conduziu ao óbito — nesse caso, vão para a Parte II, não para a cadeia da Parte I.</p>
<p>Um ponto que merece atenção redobrada: durante a pandemia de COVID-19, consolidou-se o entendimento de que a infecção aguda deve ser registrada como <strong>causa básica</strong> quando é ela quem desencadeia a via final (insuficiência respiratória, por exemplo), mesmo na presença de uma doença crônica de base como DPOC — a doença crônica prévia, nesses casos, é condição contribuinte (Parte II), e não o início da cadeia causal daquele óbito específico.</p>
<h2>Erros comuns no preenchimento</h2>
<blockquote><p>Os erros mais frequentes na DO se repetem: uso de termos vagos ("falência múltipla de órgãos", "parada cardiorrespiratória", "parada cardíaca"), omissão de informações importantes, <strong>preenchimento da sequência de causas fora da ordem lógica</strong> de evolução da doença, e falta de registro do tempo aproximado entre o início da doença e a morte. Diagnósticos genéricos como "senilidade" também devem ser evitados — a causa básica precisa estar na raiz real dos eventos, apurada a partir do histórico clínico e de critérios normativos, nunca de um rótulo genérico.</p></blockquote>
<h2>As três categorias de morte</h2>
<p>Antes de preencher qualquer campo de causas, a primeira decisão é classificatória: a que categoria pertence este óbito. Essa classificação determina, sozinha, quem tem competência para assinar a DO.</p>
<div class="tbl"><table><thead><tr><th>Categoria</th><th>Critério</th><th>Responsável pelo preenchimento</th><th>Encaminhamento</th></tr></thead><tbody><tr><td><strong>Morte natural</strong></td><td>Doença crônica conhecida e acompanhada; sem suspeita de crime, intoxicação ou evento externo</td><td>Médico assistente (ou substituto/SVO, conforme a tabela de assistência médica)</td><td>Nenhum — segue o fluxo comum</td></tr><tr><td><strong>Morte violenta (não-natural)</strong></td><td>Causas externas: acidentes, homicídios, suicídios</td><td>Médico legista, ou médico <em>ad hoc</em> investido pela autoridade competente — <strong>nunca</strong> o médico assistente</td><td>IML, para necropsia obrigatória</td></tr><tr><td><strong>Morte suspeita</strong></td><td>Causa desconhecida, ou sem histórico clínico compatível com o quadro final</td><td>Depende da investigação</td><td>SVO, para investigação médico-legal</td></tr></tbody></table></div>
<h3>Seis casos clínicos para fixar a cadeia causal</h3>
<p>A melhor forma de fixar a distinção entre causa básica e causa imediata é percorrendo casos reais até o fim da cadeia.</p>
<p>Um homem de 72 anos, operado dez meses antes de câncer gástrico confirmado por histopatológico, evolui com metástases pulmonares e, uma semana antes de morrer, com broncopneumonia. É também hipertenso há dez anos e teve um AVC com hemiplegia três meses antes do óbito. A cadeia correta é: causa imediata — broncopneumonia; causa intermediária — metástase pulmonar; causa básica — câncer gástrico. Hipertensão e sequela de AVC, por não fazerem parte dessa cadeia, vão para a Parte II.</p>
<p>Uma mulher de 50 anos com câncer de mama e metástases ganglionares confirmadas evolui meses depois com metástases hepáticas — hepatomegalia nodular, ascite, icterícia — e morre em coma por encefalopatia hepática. A causa básica é o câncer de mama; a imediata, a encefalopatia hepática, afecção mais próxima da morte.</p>
<p>Uma mulher de 30 anos, procedente de zona endêmica de esquistossomose, tem ruptura de varizes esofágicas por hipertensão portal secundária a fibrose hepática esquistossomótica, confirmada por biópsia, e morre em choque irreversível após tentativa cirúrgica. A cadeia, da causa básica à imediata: esquistossomose hepatoesplênica → hipertensão portal → ruptura de varizes esofágicas → choque hemorrágico.</p>
<p>Um homem de 78 anos, tabagista, com DPOC grave em oxigenoterapia domiciliar, é internado com diagnóstico confirmado de COVID-19 e evolui para insuficiência respiratória aguda e óbito. A causa básica é a COVID-19 — doença que desencadeou a via final daquele episódio —, e a DPOC prévia entra na Parte II como condição contribuinte, não como elo da cadeia.</p>
<p>Um pedreiro de 44 anos sofre queda acidental de andaime do 12º andar, chega comatoso ao hospital e evolui para parada cardiorrespiratória sem resposta à reanimação. É morte violenta por causa externa acidental: encaminhamento obrigatório ao IML, com DO vedada ao médico que conduziu a reanimação, ainda que ele seja o assistente do caso.</p>
<p>Por fim, um paciente idoso com constipação crônica e perda de peso sem diagnóstico formal evolui em casa com febre, dor abdominal e sinais de choque séptico, morrendo no domicílio sem avaliação médica nos momentos finais. Sem diagnóstico estabelecido e sem acompanhamento compatível com o quadro terminal, esse óbito não pode ser atestado como natural nem se enquadra em causa externa: é morte suspeita, com encaminhamento obrigatório ao SVO.</p></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

  }
  document.getElementById('hdr').innerHTML = html;

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
