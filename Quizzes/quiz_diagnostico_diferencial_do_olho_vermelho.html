<script type="text/html" id="resumoSrc"><h2>O olho vermelho: o que a queixa não diz</h2>
<p>Olho vermelho é um sinal, não um diagnóstico. Debaixo dele cabem desde a conjuntivite viral que se resolve sozinha até o glaucoma agudo que cega em horas. As causas dividem-se em <strong>traumáticas</strong> — abrasão, corpo estranho, queimadura química, hérnia de íris por perfuração — e <strong>não traumáticas</strong>, que reúnem conjuntivites, episclerite, esclerite, hiposfagma, pterígio, uveítes e glaucoma agudo.</p>
<p>A triagem começa por três perguntas objetivas, feitas antes de qualquer colírio: <strong>dói de verdade? enxerga bem? a córnea está transparente?</strong> Um paciente que responde "arde um pouco", "enxergo normal" e cuja córnea brilha ao exame tem, com altíssima probabilidade, doença da superfície. Qualquer resposta negativa desloca o caso para o grupo que precisa de oftalmologista no mesmo dia.</p>
<h3>Hiperemia conjuntival versus hiperemia ciliar</h3>
<p>A distinção mais rentável do exame externo é o <strong>padrão da vermelhidão</strong>, e ela se faz a olho nu.</p>
<div class="tbl"><table><thead><tr><th></th><th>Hiperemia conjuntival</th><th>Hiperemia ciliar (pericorneana)</th></tr></thead><tbody><tr><td>Distribuição</td><td>difusa, acentua-se nos fórnices</td><td>coroa violácea ao redor do limbo</td></tr><tr><td>Vasos</td><td>superficiais, tortuosos, móveis</td><td>profundos, retilíneos, fixos</td></tr><tr><td>Aspecto</td><td>vermelho vivo</td><td>vermelho-arroxeado</td></tr><tr><td>Sugere</td><td>conjuntivite, episclerite</td><td>uveíte, ceratite, glaucoma agudo</td></tr></tbody></table></div>
<blockquote><p>Vermelhidão que se <strong>concentra ao redor da córnea</strong> é sinal de que a inflamação está dentro do olho, não na superfície. É a diferença entre prescrever colírio e encaminhar.</p></blockquote>
<hr>
<h2>Conjuntivite bacteriana</h2>
<p>Inflamação da conjuntiva com <strong>secreção purulenta</strong> como marca registrada. O quadro clínico soma hiperemia ocular, secreção espessa, edema palpebral e pálpebras coladas ao acordar; começa em um olho e frequentemente se dissemina para o outro. O raspado conjuntival corado por <strong>Gram e Giemsa</strong> mostra predomínio de <strong>neutrófilos polimorfonucleares</strong>; cultura e antibiograma ficam reservados aos casos graves ou recidivantes. O tratamento é feito com colírio antibiótico.</p>
<p>A classificação por velocidade de instalação organiza os agentes e, com eles, a gravidade:</p>
<div class="tbl"><table><thead><tr><th>Forma</th><th>Agentes</th><th>Comportamento</th></tr></thead><tbody><tr><td><strong>Aguda</strong></td><td><em>Staphylococcus aureus</em>, <em>Streptococcus pneumoniae</em></td><td>benigna, autolimitada em cerca de 14 dias</td></tr><tr><td><strong>Hiperaguda</strong></td><td><em>Neisseria gonorrhoeae</em>, <em>Neisseria meningitidis</em></td><td>secreção muito abundante, risco corneano</td></tr><tr><td><strong>Subaguda</strong></td><td><em>Haemophilus influenzae</em>, <em>Escherichia coli</em></td><td>instalação intermediária</td></tr><tr><td><strong>Crônica</strong></td><td>secundária a doença palpebral ou obstrução do ducto nasolacrimal</td><td>recidiva enquanto a causa persistir</td></tr></tbody></table></div>
<p>A forma crônica é a que mais engana: o antibiótico melhora e o quadro volta, porque a blefarite ou a obstrução lacrimal continuam alimentando a colonização. Tratar a causa de base vale mais que trocar o colírio.</p>
<blockquote><p>O gonococo invade <strong>epitélio corneano íntegro</strong> — não precisa de porta de entrada. Conjuntivite hiperaguda com secreção jorrando é emergência, não consulta de rotina.</p></blockquote>
<hr>
<h2>Conjuntivite neonatal: a urgência do berçário</h2>
<p>Toda conjuntivite no recém-nascido é tratada como <strong>urgência</strong>. A contaminação ocorre na passagem pelo canal de parto ou no período pós-parto imediato, e a córnea do neonato tolera muito pouca agressão antes de ulcerar e perfurar.</p>

<p>O tempo entre o nascimento e o início dos sintomas é o dado que mais aponta para o agente:</p>
<div class="tbl"><table><thead><tr><th>Agente</th><th>Incubação</th><th>Risco característico</th><th>Tratamento</th></tr></thead><tbody><tr><td><strong>Gonococo</strong></td><td>2 a 3 dias</td><td>lesão de córnea e cegueira</td><td>ceftriaxona 125 mg, IM, dose única</td></tr><tr><td><strong>Clamídia</strong></td><td>5 a 12 dias</td><td>quadro por meses, pneumonia</td><td>eritromicina 50 mg/kg/dia ÷ 3 doses, 14 dias</td></tr><tr><td><strong>Herpes simples</strong></td><td>2 a 3 dias</td><td>vesículas cutâneas, disseminação sistêmica</td><td>internação para aciclovir sistêmico</td></tr></tbody></table></div>
<p>Note que gonococo e herpes compartilham a incubação curta; o que os separa à beira do berço é o <strong>aspecto da secreção</strong> — purulenta e jorrante no primeiro, mucoide com vesículas na pele no segundo. A clamídia chega mais tarde e, mesmo com o olho aparentemente controlado, exige tratamento <strong>sistêmico</strong> por causa da pneumonia do lactente.</p>
<blockquote><p>Diante de secreção purulenta em recém-nascido, o tratamento começa antes do resultado da cultura. Colher material é obrigatório; esperar por ele, não.</p></blockquote>
<hr>
<h2>Profilaxia da oftalmia neonatal</h2>
<p>Em 1880 o médico francês <strong>Carl S. F. Credê</strong> introduziu a instilação de uma gota de solução aquosa de nitrato de prata a 2% em cada olho do recém-nascido, e os casos de conjuntivite neonatal caíram de 30 para 1 por ano. A concentração foi depois reduzida para <strong>1%</strong>. No Brasil o método foi tornado obrigatório pelo <strong>Decreto nº 9.713/1977</strong>.</p>
<h4>O método de Credê</h4>
<ul><li>Colírio de <strong>nitrato de prata 1%</strong>, na <strong>primeira hora de vida</strong></li><li>Indicação <strong>universal</strong>: parto normal <strong>e</strong> cesáreo</li><li>Alvo: prevenção da <strong>oftalmia gonocócica</strong></li><li><strong>Mecanismo:</strong> o íon prata combina-se com as proteínas dos microrganismos, precipitando-as e impedindo a penetração da bactéria na córnea</li><li><strong>Efeito adverso:</strong> conjuntivite química pela formação de albumina de prata</li></ul>
<p>O mesmo mecanismo que protege — precipitar proteínas — irrita a conjuntiva do bebê, e daí a busca por substitutos. As opções consideradas mais eficazes são o colírio de <strong>iodopovidona 2,5%</strong>, o de <strong>eritromicina 0,5%</strong> e o de <strong>tetraciclina 1%</strong>. A iodopovidona é ativa não só contra os agentes bacterianos mais importantes, como <em>Chlamydia trachomatis</em> e <em>Neisseria gonorrhoeae</em>, mas também contra fungos, contra o HIV e contra os herpes-vírus I e II. O Projeto de Lei nº 321/2019, no Estado de São Paulo, propõe justamente a substituição do nitrato de prata pela iodopovidona a 2,5% nas maternidades.</p>
<hr>
<h2>Conjuntivite viral</h2>
<p>Predominam <strong>lacrimejamento aquoso</strong>, hiperemia intensa, edema palpebral e <strong>linfonodo pré-auricular</strong> palpável — este último quase uma assinatura da etiologia viral. As formas agudas são a febre faringoconjuntival, a ceratoconjuntivite epidêmica e a conjuntivite herpética; as crônicas, as blefaroconjuntivites por molusco contagioso, varicela-zóster e sarampo.</p>
<h4>Febre faringoconjuntival</h4>
<p>Causada por <strong>adenovírus</strong>. Reúne febre, dor de garganta e conjuntivite, com linfadenopatia pré-auricular. Autolimitada em torno de <strong>10 dias</strong>, tratada apenas com colírios lubrificantes.</p>
<h4>Ceratoconjuntivite epidêmica</h4>
<p>Também adenoviral, é a mais arrastada e a mais sintomática: dura <strong>3 a 4 semanas</strong> e soma hiperemia conjuntival, lacrimejamento, dor, fotofobia, edema palpebral, quemose, hemorragia conjuntival, <strong>pseudomembranas</strong> e <strong>opacidades subepiteliais</strong> — estas últimas capazes de baixar a acuidade por meses depois que o olho já deixou de estar vermelho. Tratamento com lubrificantes.</p>
<h4>Conjuntivite herpética</h4>
<p>Hiperemia conjuntival, secreção mucoide, dor e fotofobia leves, vesículas na pálpebra, linfonodo pré-auricular e, o achado que fecha o diagnóstico, <strong>úlceras corneanas epiteliais dendríticas</strong>. Dura 2 a 3 semanas e se trata com antiviral tópico e sistêmico.</p>

<blockquote><p><strong>Corticoide tópico é contraindicado no herpes ocular.</strong> Ele alivia por um dia e transforma a úlcera dendrítica em úlcera geográfica, com risco de perfuração. Antes de prescrever corticoide num olho vermelho, cora-se a córnea com fluoresceína.</p></blockquote>
<h4>Formas crônicas</h4>
<ul><li><strong>Molusco contagioso:</strong> nódulo palpebral umbilicado que semeia a conjuntiva; tratamento é a <strong>excisão dos nódulos</strong></li><li><strong>Varicela-zóster:</strong> lesões ao longo do <strong>dermátomo do ramo oftálmico do trigêmeo</strong>, linfonodo pré-auricular, cicatrização com <strong>entrópio</strong>; aciclovir oral em alta dose</li><li><strong>Sarampo:</strong> conjuntiva de aparência vítrea e exsudativa, <strong>edema da prega semilunar (sinal de Meyer)</strong> e manchas de <strong>Koplik</strong> na conjuntiva e na boca, que aparecem <strong>dias antes</strong> da erupção cutânea</li></ul>
<hr>
<h2>Conjuntivite alérgica</h2>
<p>Reação de <strong>hipersensibilidade humoral</strong>, com o <strong>prurido</strong> como sintoma dominante e a <strong>quemose</strong> — edema da conjuntiva — como sinal recorrente. São quatro apresentações.</p>
<div class="tbl"><table><thead><tr><th>Forma</th><th>Contexto</th><th>Achado próprio</th><th>Tratamento</th></tr></thead><tbody><tr><td><strong>Febre do feno</strong></td><td>rinite alérgica</td><td>prurido, quemose, secreção viscosa</td><td>anti-histamínico em colírio e oral</td></tr><tr><td><strong>Ceratoconjuntivite atópica</strong></td><td>dermatite atópica</td><td>papilas finas, fotofobia</td><td>antialérgico, AINH e corticoide tópicos</td></tr><tr><td><strong>Ceratoconjuntivite vernal</strong></td><td>início na puberdade, dura 5 a 10 anos</td><td>papilas gigantes, nódulos de Trantas, úlcera em escudo</td><td>antialérgico, corticoide, ciclosporina 2%, tacrolimus 0,03%, excisão das papilas</td></tr><tr><td><strong>Papilar gigante</strong></td><td>lente de contato ou prótese de plástico</td><td>papilas na conjuntiva tarsal</td><td>suspender a lente, trocar a prótese por vidro</td></tr></tbody></table></div>

<p>A ceratoconjuntivite vernal é a forma que ameaça a visão: as papilas gigantes da pálpebra superior raspam o epitélio e produzem a <strong>úlcera em escudo</strong>, de base placóide, sobre o eixo visual. A papilar gigante, por contraste, é mecânica — enquanto o corpo estranho crônico permanecer apoiado na conjuntiva tarsal, nenhum colírio resolve.</p>
<hr>
<h2>Episclerite, esclerite e as lesões da superfície</h2>
<p><strong>Episclerite</strong> e <strong>esclerite</strong> separam-se pela dor. A episclerite é inflamação localizada da episclera, de causa em geral desconhecida, embora possa vir associada a rosácea, atopia, gota e colagenoses. Atinge sobretudo mulheres jovens da 3ª à 4ª década, é três vezes mais comum no sexo feminino, unilateral em 66% dos casos e <strong>autolimitada em 1 a 2 semanas</strong>. Ao exame: congestão episcleral nodular, setorial ou difusa, <strong>sem secreção</strong>, com hiperemia e apenas leve desconforto. Trata-se com lágrima artificial, AINH ou corticoide tópicos.</p>
<p>A <strong>esclerite</strong> é mais grave e mais rara. Caracteriza-se por infiltração celular, destruição do colágeno e remodelamento vascular; predomina em mulheres na 5ª ou 6ª década e é bilateral em 33%. Causas: trauma, doenças sistêmicas autoimunes, granulomatosas ou infecciosas — ou nenhuma identificada. O sintoma cardinal é <strong>hiperemia com dor intensa</strong>, e o exame mostra congestão episcleral profunda com <strong>afinamento escleral</strong>. A ultrassonografia demonstra espessamento da esclera. O tratamento é <strong>sistêmico</strong>: AINH e corticoide por via oral.</p>
<h4>Hiposfagma</h4>
<p>Hemorragia subconjuntival: sangue vermelho vivo, de limites nítidos, sob a conjuntiva, <strong>sem dor e sem perda visual</strong>. Causas: trauma, esforço físico e anticoagulantes. Conduta: lágrima artificial e avaliação da coagulação quando recorrente.</p>

<h4>Pterígio e pinguécula</h4>
<p>O <strong>pterígio</strong> é uma invasão fibrovascular triangular que cruza o limbo e avança <strong>sobre a córnea</strong>, ligada à exposição ultravioleta e a fatores genéticos. A <strong>pinguécula</strong> é a lesão amarelada equivalente que fica na conjuntiva e <strong>não ultrapassa o limbo</strong>. Tratamento: lágrima artificial e remoção cirúrgica quando avança sobre o eixo visual.</p>

<h2>Uveítes</h2>
<p>Inflamação do trato uveal, classificada por <strong>anatomia</strong>: a da íris é a <strong>uveíte anterior</strong>; a do corpo ciliar, a <strong>uveíte intermediária</strong>; a da coroide, a <strong>coroidite</strong> ou coriorretinite. O envolvimento de todos os compartimentos configura panuveíte.</p>
<p>À biomicroscopia, a câmara anterior deixa de estar opticamente vazia. A <strong>reação de câmara anterior</strong> aparece como células e flare no feixe da lâmpada de fenda; os <strong>precipitados ceráticos</strong> depositam-se no endotélio corneano — brancos e finos nas uveítes não granulomatosas, grandes e gordurosos, em "gordura de carneiro", nas granulomatosas. As <strong>sinéquias posteriores</strong> colam a borda pupilar ao cristalino e deformam a pupila; quando circunferenciais, produzem <strong>seclusão pupilar</strong>. O <strong>hipópio</strong> é o acúmulo de pus com nível horizontal no fundo da câmara.</p>

<p>Nas uveítes posteriores, o mapeamento de retina é o exame que documenta a lesão — a placa de toxoplasmose, por exemplo, aparece esbranquiçada e de bordas mal definidas quando em atividade, e pigmentada e cicatricial quando inativa.</p>

<h2>A tabela mestra e os sinais de alarme</h2>
<p>O quadro abaixo é o núcleo do diagnóstico diferencial: quatro colunas, dez linhas, e quase todo olho vermelho de plantão cabe nele.</p>
<div class="tbl"><table><thead><tr><th></th><th>Conjuntivite aguda</th><th>Uveíte anterior aguda</th><th>Glaucoma agudo</th><th>Trauma ou infecção</th></tr></thead><tbody><tr><td><strong>Incidência</strong></td><td>extremamente comum</td><td>comum</td><td>incomum</td><td>comum</td></tr><tr><td><strong>Secreção</strong></td><td>moderada a abundante</td><td>nenhuma</td><td>nenhuma</td><td>aquosa ou purulenta</td></tr><tr><td><strong>Visão</strong></td><td>sem efeito</td><td>ligeiramente turva</td><td>acentuadamente turva</td><td>usualmente turva</td></tr><tr><td><strong>Dor</strong></td><td>nenhuma</td><td>moderada</td><td>aguda</td><td>moderada a aguda</td></tr><tr><td><strong>Injeção conjuntival</strong></td><td>difusa, mais nos fórnices</td><td>principalmente pericorneana</td><td>difusa</td><td>difusa</td></tr><tr><td><strong>Córnea</strong></td><td>clara</td><td>usualmente clara</td><td>embaciada</td><td>altera-se conforme a causa</td></tr><tr><td><strong>Pupila</strong></td><td>normal</td><td>pequena</td><td>moderadamente dilatada e fixa</td><td>normal</td></tr><tr><td><strong>Reflexo fotomotor</strong></td><td>normal</td><td>fraco</td><td>nenhum</td><td>normal</td></tr><tr><td><strong>Pressão intraocular</strong></td><td>normal</td><td>normal</td><td>elevada</td><td>normal</td></tr><tr><td><strong>Esfregaço</strong></td><td>organismos causadores</td><td>nenhum organismo</td><td>nenhum organismo</td><td>organismos só nas úlceras infecciosas</td></tr></tbody></table></div>
<p>E o diferencial rápido entre as conjuntivites, por intensidade do sinal:</p>
<div class="tbl"><table><thead><tr><th></th><th>Secreção</th><th>Lacrimejamento</th><th>Prurido</th><th>Congestão</th><th>Edema</th><th>Linfadenopatia</th></tr></thead><tbody><tr><td><strong>Bacteriana</strong></td><td>++++</td><td>+</td><td>+ a ++</td><td>+++</td><td>+++</td><td>+</td></tr><tr><td><strong>Viral</strong></td><td>+</td><td>++++</td><td>+</td><td>++++</td><td>++++</td><td>+++</td></tr><tr><td><strong>Alérgica</strong></td><td>+</td><td>+</td><td>++++</td><td>++</td><td>+</td><td>ausente</td></tr></tbody></table></div>
<blockquote><p><strong>Sinais de alarme no olho vermelho:</strong> dor intensa · baixa de acuidade visual · hiperemia ciliar (pericorneana) · alteração pupilar — miose com pupila irregular na uveíte, midríase média e fixa no glaucoma agudo · opacidade da córnea · pressão intraocular elevada. Qualquer um deles retira o caso da prateleira "conjuntivite" e o coloca na do encaminhamento imediato.</p></blockquote>
<p>Três atalhos que resolvem a maioria dos casos: <strong>secreção purulenta abundante</strong> aponta bactéria; <strong>lacrimejamento com linfonodo pré-auricular</strong> aponta vírus; <strong>prurido</strong> aponta alergia. Mas nenhum deles vale se as três perguntas de triagem — dói, enxerga, córnea clara — não tiverem sido feitas primeiro.</p></script>

      "Dor intensa, baixa de visão e opacidade da córnea",
      "Prurido, secreção aquosa e sensação de areia",
      "Lacrimejamento, fotofobia leve e olho colado",
      "Ardor matinal, crostas nos cílios e coceira"
    ],
    "correctIndex": 0,
    "explanation": "Dor intensa, queda da acuidade visual e perda da transparência corneana indicam acometimento além da conjuntiva. Somam-se a esses sinais de alarme a hiperemia ciliar e a alteração pupilar, seja miose com pupila irregular na uveíte, seja midríase média fixa no glaucoma agudo. Nenhum desses achados pertence à conjuntivite simples."
  }
];

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

      var a = S.answers[n], cur = n===S.i && !S.finished, bg = '#d3cec4';
      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';

             '<span style="display:block;width:100%;border-radius:99px;transition:height .18s ease,background .18s ease,box-shadow .18s ease;height:'+(cur?'17px':'9px')+';background:'+bg+';box-shadow:'+(cur?'0 0 0 3px rgba(18,26,43,.13)':'none')+'"></span></button>';

              '<div style="'+mono+';font-size:11px;letter-spacing:.04em;color:#5b6478">Questão '+pad(S.i+1)+' / '+S.order.length+'</div>' +
              '<div style="display:flex;align-items:center;gap:12px;'+mono+';font-size:10.5px;color:#8a8578">' +
                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +
              '</div></div></div>';
  }
  document.getElementById('hdr').innerHTML = html;
}
function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +
      '</button>';
  }).join('');

  var expl = reveal ? '<div style="margin-top:20px;padding:16px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;animation:qFade .26s ease">' +
      '<div style="'+mono+';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:8px">Por quê</div>' +
      '<p style="margin:0;font-size:14.5px;line-height:1.68;color:#39404f;text-wrap:pretty">'+esc(q.explanation)+'</p></div>' : '';

  var blank = counts().blank;
  var warn = S.warn ? '<div style="margin-top:14px;padding:15px 17px;background:#fdf7e9;border:1px solid #e8d5a3;border-radius:14px;animation:qFade .22s ease">' +
      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +
        '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;line-height:1.42;font-weight:400;letter-spacing:-.012em;margin:0 0 22px;text-wrap:pretty">'+esc(q.question)+'</h2>' +
        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
      '</article>' + warn +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px">' +
        '<button type="button" data-act="prev" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:12px 18px;font-size:14px;cursor:pointer;transition:border-color .15s ease,color .15s ease;color:'+(S.i===0?'#c4bfb4':'#121a2b')+';pointer-events:'+(S.i===0?'none':'auto')+'">← Anterior</button>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          (early ? '<button type="button" data-act="finish" class="h-ink" style="background:none;border:0;padding:12px 6px;'+mono+';font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a8578;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Finalizar</button>' : '') +
          '<button type="button" data-act="next" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">'+(last?'Finalizar':'Próxima →')+'</button>' +
        '</div></div></section>';
}

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';
  if (pct>=90)      { title='Domínio sólido';   msg='Desempenho excelente. Confira as explicações das que escaparam e siga em frente.'; }
  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

  var stat = function(v,l,color){
    return '<div style="background:#faf9f6;padding:14px 10px">' +
      '<div style="'+mono+';font-size:19px;font-weight:500;color:'+color+'">'+v+'</div>' +
      '<div style="'+mono+';font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#8a8578;margin-top:2px">'+l+'</div></div>';
  };

  var fdefs = [['all','Todas',c.total],['wrong','Erradas',c.miss],['right','Certas',c.hit],['blank','Em branco',c.blank]];
  var filters = fdefs.map(function(f){
    var on = S.filter===f[0];
    return '<button type="button" data-act="filter" data-k="'+f[0]+'" class="h-line" style="border-radius:99px;padding:8px 14px;font-size:13px;cursor:pointer;transition:all .15s ease;border:1px solid '+(on?'#121a2b':'#ddd8ce')+';background:'+(on?'#121a2b':'transparent')+';color:'+(on?'#f5f3ef':'#5b6478')+'">'+f[1]+' '+f[2]+'</button>';
  }).join('');

  var list = reviewList();
  var allOpen = list.length>0 && list.every(function(r){ return S.open[r.idx]; });

  var cards = list.map(function(r){
    var numBg='#f0ede7', numFg='#8a8578';
    if (!r.blank) { if (r.ok) { numBg='#e3f0e8'; numFg='#1f5c3e'; } else { numBg='#fbe6e2'; numFg='#8f2f25'; } }
    var open = !!S.open[r.idx];
    var body = '';
    if (open) {
      var opts = r.q.options.map(function(text,n){
        var isC = n===r.q.correctIndex, isMine = n===r.a;
        var bd='#eeebe4', bg='#fbfaf8', fg='#5b6478', bBg='#f0ede7', bFg='#8a8578', tag='', tBg='', tFg='';
        if (isC)            { bd='#bcdcc9'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; tag='Correta'; tBg='#d9ede1'; tFg='#1f5c3e'; }
        if (isMine && !isC) { bd='#eec4bd'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; tag='Sua resposta'; tBg='#f7ddd8'; tFg='#8f2f25'; }
        if (isMine && isC)  { tag='Sua resposta ✓'; }
        return '<div style="display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:11px;font-size:14px;line-height:1.5;border:1px solid '+bd+';background:'+bg+';color:'+fg+'">' +
          '<span style="flex-shrink:0;width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:10.5px;font-weight:600;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
          '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
          (tag ? '<span style="flex-shrink:0;'+mono+';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;margin-top:1px;background:'+tBg+';color:'+tFg+'">'+tag+'</span>' : '') +
          '</div>';
      }).join('');
      body = '<div style="padding:2px 15px 18px;animation:qDrawer .2s ease">' +
        '<div style="height:1px;background:#eeebe4;margin:0 0 16px"></div>' +
        '<p style="font-family:\'Newsreader\',Georgia,serif;font-size:18px;line-height:1.5;margin:0 0 16px;text-wrap:pretty">'+esc(r.q.question)+'</p>' +
        figura(r.q) +
        '<div style="display:flex;flex-direction:column;gap:7px">'+opts+'</div>' +
        '<div style="margin-top:16px;padding:14px 16px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 11px 11px 0">' +
          '<div style="'+mono+';font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:7px">Por quê</div>' +
          '<p style="margin:0;font-size:14px;line-height:1.65;color:#39404f;text-wrap:pretty">'+esc(r.q.explanation)+'</p></div>' +
        '<button type="button" data-act="jump" data-n="'+r.idx+'" style="margin-top:14px;background:none;border:0;padding:0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#2b57cc;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Abrir no quiz →</button></div>';
    }
    return '<div style="background:#fff;border:1px solid '+(open?'#c9c3b6':'#e4e0d8')+';border-radius:14px;overflow:hidden;transition:border-color .15s ease">' +
      '<button type="button" data-act="toggle" data-n="'+r.idx+'" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 15px;cursor:pointer">' +
        '<span style="flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:12px;font-weight:600;background:'+numBg+';color:'+numFg+'">'+pad(r.idx+1)+'</span>' +
        '<span style="flex:1;min-width:0;font-size:14px;line-height:1.45;color:#39404f;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(r.q.question)+'</span>' +
        '<span style="flex-shrink:0;'+mono+';font-size:16px;color:#8a8578;width:16px;text-align:center">'+(open?'−':'+')+'</span>' +
      '</button>' + body + '</div>';
  }).join('');

  document.getElementById('stage').innerHTML =
    '<section style="padding:34px 0 0;animation:qFade .3s ease">' +
      '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:14px">Resultado</div>' +
      '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:36px;line-height:1.12;font-weight:400;letter-spacing:-.025em;margin:0 0 8px">'+title+'</h2>' +
      '<p style="font-size:15px;line-height:1.6;color:#5b6478;margin:0 0 24px;max-width:48ch;text-wrap:pretty">'+msg+'</p>' +
      '<div style="height:8px;border-radius:99px;background:#e4e0d8;overflow:hidden;margin-bottom:10px">' +
        '<div style="height:100%;border-radius:99px;background:#121a2b;transition:width .7s cubic-bezier(.22,1,.36,1);width:'+pct+'%"></div></div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e4e0d8;border:1px solid #e4e0d8;border-radius:14px;overflow:hidden;margin-bottom:34px">' +
        stat(c.hit,'Certas','#2e7d55')+stat(c.miss,'Erradas','#c04437')+stat(c.blank,'Branco','#8a8578')+stat(pct+'%','Aproveit.','#2b57cc') +
      '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px">' +
        '<h3 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;font-weight:500;letter-spacing:-.015em;margin:0">Gabarito comentado</h3>' +
        '<button type="button" data-act="toggleAll" class="h-ink" style="background:none;border:0;padding:6px 0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;text-decoration:underline;text-underline-offset:3px">'+(allOpen?'Recolher tudo':'Expandir tudo')+'</button>' +
      '</div>' +
      '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">'+filters+'</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">'+cards+'</div>' +
      (list.length===0 ? '<div style="padding:38px 16px;text-align:center;color:#8a8578;font-size:14px;border:1px dashed #ddd8ce;border-radius:14px">Nenhuma questão neste filtro.</div>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:28px;padding-top:24px;border-top:1px solid #e4e0d8">' +
        '<button type="button" data-act="restart" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:13px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">Refazer o quiz</button>' +
        '<button type="button" data-act="back" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Voltar às questões</button>' +
        '<button type="button" data-act="resumo" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Ler o resumo</button>' +
      '</div></section>';
}

/* ── render + eventos ──────────────────────────────────────────────────────── */
function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
