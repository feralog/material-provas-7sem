<script type="text/html" id="resumoSrc"><h2>Disfonia: conceito e qualidades vocais</h2>
<p><strong>Disfonia não é sinônimo de rouquidão.</strong> Disfonia é qualquer alteração de uma ou mais características acústicas da voz — <strong>timbre</strong> (qualidade sonora), <strong>intensidade</strong> (força) e <strong>tom</strong> (frequência) —, manifestada por rouquidão ou por outros defeitos de fonação, de causa orgânica, funcional ou psíquica. Afonia, odinofonia, tremor vocal, espasmos ao falar, voz fraca, estridente ou infantilizada são todas disfonias. O espectro etiológico é amplo: <strong>de um resfriado a uma neoplasia maligna</strong>.</p>
<p>Reconhecer a qualidade vocal ajuda a apontar o mecanismo. Cada padrão tem um exemplo clássico, e é esse par — padrão e exemplo — que costuma cair em prova.</p>
<div class="tbl"><table><thead><tr><th>Qualidade</th><th>Como soa</th><th>Exemplo típico</th></tr></thead><tbody><tr><td>Rouca</td><td>Áspera, "raspada"</td><td>Laringite viral, fumante crônico</td></tr><tr><td>Soprosa</td><td>Escape audível de ar na fala</td><td><strong>Paralisia unilateral</strong> de prega vocal</td></tr><tr><td>Áspera ou rugosa</td><td>Irregular, "arranhando" o tempo todo</td><td>Pólipo vocal, câncer de laringe</td></tr><tr><td>Tensa ou estrangulada</td><td>Apertada, com esforço excessivo</td><td><strong>Disfonia espasmódica adutora</strong></td></tr><tr><td>Trêmula</td><td>Oscilação rítmica involuntária</td><td>Tremor vocal essencial</td></tr><tr><td>Fraca ou hipofônica</td><td>Intensidade reduzida</td><td><strong>Doença de Parkinson</strong>, presbifonia</td></tr><tr><td>Bitonal (diplofonia)</td><td>Duas frequências simultâneas ou alternadas</td><td>Pólipo, cisto ou paralisia que impedem a vibração uniforme</td></tr><tr><td>Monótona</td><td>Sem variação normal de tom</td><td>Parkinson, paralisias laríngeas, disfonias funcionais</td></tr><tr><td>Afonia completa</td><td>Perda total do som vocal</td><td>Afonia psicogênica, pós-operatório, laringite intensa</td></tr></tbody></table></div>
<blockquote><p>Soprosidade = a glote não fecha e o ar escapa (pense em paralisia). Tensão = a glote fecha demais (pense em disfonia espasmódica adutora). Diplofonia = as pregas vibram fora de sincronia (pense em lesão de massa ou paralisia).</p></blockquote>
<hr>
<h2>A laringe: funções, cartilagens e músculos</h2>
<p>A laringe é um órgão versátil. <strong>Filogeneticamente, nasceu como esfíncter de proteção das vias respiratórias</strong>; só depois, na evolução, foi adaptada à produção de sons e de voz. Hoje acumula três funções:</p>
<ol><li><strong>Respiratória</strong> — conduz o ar até a traqueia, com as pregas vocais em <strong>abdução</strong>.</li><li><strong>Proteção da via aérea</strong> — na deglutição as pregas se fecham (<strong>adução</strong>) junto com a epiglote, que desvia o alimento; o arcabouço de cartilagens protege contra traumas.</li><li><strong>Fonação</strong> — produção da voz pela vibração das pregas, também em <strong>adução</strong> (daí o apelido de "caixa de voz").</li></ol>
<p>Essencialmente cartilaginosa, membranosa e ligamentar, a laringe fica na região anterior e mediana do pescoço, da língua à traqueia, <strong>geralmente entre a quarta e a sexta vértebras cervicais (C4–C6)</strong>. É maior nos homens porque cresce mais na <strong>puberdade, por ação hormonal</strong>, com projeção anterior da tireoide — o pomo de Adão.</p>
<h3>Cartilagens</h3>
<p>São <strong>nove</strong>: três ímpares e três pares, unidas por ligamentos e membranas, dando forma, proteção e sustentação ao órgão.</p>
<div class="tbl"><table><thead><tr><th>Cartilagem</th><th>Características</th></tr></thead><tbody><tr><td>Epiglote (ímpar)</td><td>Em forma de folha, presa por ligamento à face anterior da tireoide; desvia o alimento na deglutição</td></tr><tr><td>Tireoide (ímpar)</td><td>A maior; ampla na frente e ausente atrás; protege contra traumas anteriores</td></tr><tr><td>Cricoide (ímpar)</td><td>Em anel, mais larga atrás e fina na frente; recebe a maior parte dos músculos intrínsecos</td></tr><tr><td>Aritenoides (par)</td><td><strong>Móveis</strong>, piramidais, articuladas à cricoide, <strong>rodam sobre o próprio eixo</strong>; recebem músculos da glote e o ligamento vocal (no processo vocal)</td></tr><tr><td>Corniculadas e cuneiformes (pares)</td><td>Acessórias</td></tr></tbody></table></div>
<p>O <strong>ligamento vocal</strong> (tireoaritenoideo) faz parte da prega vocal e, nessa altura, define-se a <strong>glote</strong> — região que separa a supraglote da infraglote, divisão usada no estadiamento dos tumores de cabeça e pescoço. Abaixo da tireoide, a membrana entre ela e a cricoide é o ponto de acesso de emergência à via aérea (<strong>cricotireoidostomia</strong>). A flacidez das estruturas supraglóticas do lactente — a <strong>laringomalácia</strong> — é o exemplo clínico de como a sustentação cartilaginosa importa: é a causa mais comum de estridor na infância.</p>
<h3>Músculos</h3>
<ul><li><strong>Intrínsecos</strong> — inserem-se entre as próprias cartilagens laríngeas e movem a prega vocal: abrem, fecham, tensionam e relaxam o ligamento vocal. Ao falar, todos entram em ação.</li><li><strong>Extrínsecos</strong> — inserem-se em estruturas fora da laringe e movem a laringe <strong>como um todo</strong>: ela sobe no /i/ e desce no /u/. Pescoço que dói ao falar ou cantar é sinal de uso errado dessa musculatura.</li></ul>
<div class="tbl"><table><thead><tr><th>Músculo intrínseco</th><th>Ação</th></tr></thead><tbody><tr><td><strong>Cricoaritenoideo posterior</strong></td><td><strong>Abre</strong> as pregas (o único abdutor)</td></tr><tr><td>Cricoaritenoideo lateral</td><td>Fecha as pregas</td></tr><tr><td>Aritenoideo transverso</td><td>Fecha as pregas, sobretudo a glote posterior</td></tr><tr><td><strong>Cricotireoideo</strong></td><td><strong>Tensiona</strong> a prega (alonga — agudo)</td></tr><tr><td>Tireoaritenoideo (músculo vocal)</td><td><strong>Relaxa</strong> a prega (encurta — grave)</td></tr></tbody></table></div>
<hr>
<h2>A prega vocal ao microscópio</h2>
<p>As pregas vocais são feitas de várias camadas com propriedades biomecânicas diferentes — e é essa arquitetura que explica tanto a vibração normal quanto onde cada lesão se instala e como ela é operada.</p>

<div class="tbl"><table><thead><tr><th>Camada</th><th>Composição</th><th>Comportamento</th></tr></thead><tbody><tr><td>Epitélio</td><td>Escamoso estratificado</td><td>Fino e resistente, "papel plástico"; mantém a forma</td></tr><tr><td>Membrana basal</td><td>Fibras colágenas e proteínas</td><td>Transição para a lâmina própria</td></tr><tr><td><strong>Camada superficial da lâmina própria = espaço de Reinke</strong></td><td>Pobre em elementos, gelatinosa</td><td>Solta e flexível; <strong>vibra intensamente</strong></td></tr><tr><td>Camada intermediária</td><td>Fibras elásticas</td><td>"Elástico mole"</td></tr><tr><td>Camada profunda</td><td>Fibras colágenas</td><td>Mais dura, "barbante"</td></tr><tr><td>Músculo tireoaritenoideo (vocal)</td><td>Músculo</td><td>Feixe elástico rígido</td></tr></tbody></table></div>
<p>A <strong>mucosa</strong> (epitélio + lâmina própria) é frouxa e muito móvel, e <strong>vibra livremente sobre o ligamento e o músculo</strong>. Daí o modelo <strong>corpo–cobertura</strong>:</p>
<ul><li><strong>Cobertura</strong> = epitélio + camada superficial (Reinke).</li><li><strong>Transição</strong> = camadas intermediária e profunda = <strong>ligamento vocal</strong>.</li><li><strong>Corpo</strong> = músculo vocal (tireoaritenoideo).</li></ul>
<blockquote><p>O espaço de Reinke é a camada que mais vibra e a que menos resiste: é ali que se acumula o material gelatinoso do edema de Reinke, e qualquer massa nessa camada desorganiza a onda mucosa.</p></blockquote>
<hr>
<h2>Como a voz é produzida</h2>
<p>Voz não é sinônimo de fonação. <strong>Voz é o processo inteiro</strong>: saída de ar dos pulmões, vibração das pregas, ressonância (filtragem pelo trato vocal) e articulação das palavras.</p>
<div class="tbl"><table><thead><tr><th>Etapa</th><th>O que acontece</th><th>Onde</th></tr></thead><tbody><tr><td><strong>Fonação</strong></td><td>Som gerado pela vibração das pregas com a passagem do ar subglótico</td><td>Pregas vocais em adução</td></tr><tr><td><strong>Ressonância</strong></td><td>Prolongamento, filtragem e amplificação do som</td><td>Trato vocal: cavidades faringolaríngea, oral e nasal (e seios paranasais)</td></tr><tr><td><strong>Articulação</strong></td><td>Modulação do som em palavras</td><td>Lábios, língua, dentes, palato e orofaringe</td></tr></tbody></table></div>
<h3>O ciclo glótico</h3>
<ol><li>Fechamento da glote pelos músculos adutores.</li><li>Contração da musculatura respiratória (diafragma e intercostais).</li><li>Elevação da pressão subglótica até as pregas ficarem paralelas.</li><li>O ar atravessa a glote e movimenta as pregas.</li><li><strong>Pressão negativa na glote (efeito Bernoulli) + força mioelástica das pregas</strong> puxam-nas de volta.</li><li>Novo fechamento da glote, e o ciclo recomeça.</li></ol>
<p>O <strong>efeito Bernoulli</strong> diz que, quando a velocidade de um fluxo aumenta, a pressão cai para que a energia total (potencial + cinética) permaneça constante. O ar acelerado na fenda glótica estreita cria sucção e aproxima as pregas — <strong>não há uma contração muscular por vibração</strong>, por isso o ciclo se repete centenas de vezes por segundo (teoria mioelástica-aerodinâmica).</p>
<blockquote><p>Não confunda ciclo glótico com adução/abdução. Adução e abdução são movimentos <strong>musculares</strong> que aproximam e afastam as pregas da linha média. O ciclo glótico é o <strong>movimento ondulatório da mucosa</strong> de revestimento, que depende da elasticidade da cobertura, da atividade dos músculos intrínsecos e da energia do ar exalado.</p></blockquote>
<h4>Frequência fundamental</h4>
<p>O número de ciclos por segundo é a frequência fundamental: <strong>homens 80–150 ciclos/s (≈120 Hz, grave)</strong> e <strong>mulheres 150–250 ciclos/s (≈200 Hz, aguda)</strong>. Ela depende do comprimento, da tensão, da rigidez e da massa das pregas, e da pressão subglótica. Por isso cai com o crescimento da criança, à medida que as pregas se alongam e ganham massa.</p>
<h3>Ressonância e articulação</h3>
<p>O som que sai da glote <strong>não soa como voz humana</strong>; é o trato vocal que lhe dá essa característica. O trato funciona como filtro: os harmônicos produzidos pela onda mucosa cujo comprimento de onda é compatível com as dimensões do tubo são <strong>reforçados e passam a se chamar formantes</strong>; os afastados das frequências de ressonância são atenuados. Forma e volume da faringe, movimento da língua e da laringe, posição da mandíbula e quantidade de som que passa pela nasofaringe e pelo nariz controlam a ressonância. A articulação, por fim, transforma esse som em palavras, com lábios, língua, palato e dentes.</p>

<h2>Avaliação do paciente com disfonia</h2>
<h3>História clínica</h3>
<div class="tbl"><table><thead><tr><th>Ponto da anamnese</th><th>O que procurar</th></tr></thead><tbody><tr><td>Idade</td><td>Criança: <strong>nódulos</strong> (mais em meninos); adolescente: <strong>muda vocal</strong>; idoso: <strong>presbifonia</strong>, voz trêmula e fraca</td></tr><tr><td>Ocupação</td><td>Professores, cantores, telemarketing, ambientes ruidosos (competição vocal)</td></tr><tr><td>Eventos precedentes</td><td>IVAS, trauma, <strong>intubação orotraqueal</strong>, aumento do esforço vocal, episódio emocional</td></tr><tr><td>Estado hormonal</td><td>Ciclo menstrual, menopausa</td></tr><tr><td>Abuso vocal</td><td>Rouquidão após shows — reversível</td></tr><tr><td>Início e evolução</td><td>Súbito ou gradual, intermitente ou progressivo; <strong>piora pela manhã sugere refluxo</strong>; piora ao longo do dia sugere abuso vocal/nódulos; melhora com repouso</td></tr><tr><td>Dispneia, disfagia</td><td>Lesões grandes que obstruem a glote; tosse, expectoração, <strong>hemoptise</strong></td></tr><tr><td>Vícios</td><td><strong>Tabagismo e etilismo</strong></td></tr><tr><td>Comorbidades</td><td>Diabetes, doenças neurológicas</td></tr></tbody></table></div>
<h3>Avaliação perceptivo-auditiva da voz</h3>
<p>O examinador escuta a fala espontânea e tarefas dirigidas:</p>
<ul><li><strong>Qualidade vocal</strong> — rouquidão, soprosidade, astenia, tensão.</li><li><strong>Pitch</strong> (altura percebida, grave × agudo) e <strong>loudness</strong> (intensidade percebida, forte × fraca): fala espontânea, /a/ sustentado, sons progressivamente graves e agudos, contagem de 1 a 10 em voz baixa e forte.</li><li><strong>Tempo máximo de fonação (TMF)</strong> — inspirar fundo e sustentar /a/ o máximo possível, três vezes, registrando o maior valor. Referências aproximadas: <strong>homens 15–25 s, mulheres 14–20 s</strong>. TMF reduzido indica escape glótico, déficit de suporte respiratório ou má coordenação pneumofônica — é o caso da <strong>paralisia unilateral</strong>, com fechamento incompleto. Sozinho, o TMF não diagnostica insuficiência glótica.</li><li><strong>Tremor</strong> — oscilação rítmica de frequência ou intensidade no /a/ sustentado (tremor essencial, doenças neurológicas); diferente das <strong>quebras</strong> da disfonia espasmódica.</li><li><strong>Ressonância</strong> — palavras orais ("papai", "batata") e nasais ("mamãe"), teste de oclusão nasal. <strong>Hipernasalidade</strong> sugere disfunção velofaríngea; <strong>hiponasalidade</strong>, obstrução nasal ou nasofaríngea.</li><li><strong>Articulação e pausas</strong> — fala espontânea e <strong>diadococinesia</strong> (/pa-pa-pa/, /ta-ta-ta/, /ka-ka-ka/, /pa-ta-ka/); alterações sugerem <strong>disartria</strong>.</li></ul>
<h4>Escala GRBAS</h4>
<p>Cada parâmetro recebe nota de <strong>0 (normal) a 3 (intensa)</strong>:</p>
<div class="tbl"><table><thead><tr><th>Letra</th><th>Termo</th><th>Significado</th></tr></thead><tbody><tr><td>G</td><td>Grade</td><td>Grau global da disfonia</td></tr><tr><td>R</td><td>Roughness</td><td>Rugosidade, aspereza</td></tr><tr><td>B</td><td>Breathiness</td><td>Soprosidade (escape aéreo)</td></tr><tr><td>A</td><td>Asthenia</td><td>Astenia, fraqueza</td></tr><tr><td>S</td><td>Strain</td><td>Tensão, esforço</td></tr></tbody></table></div>
<p>Exemplo: paralisia unilateral com voz soprosa → <strong>GRBAS 2-0-3-1-0</strong> (disfonia moderada, sem rugosidade, soprosidade intensa, astenia leve, sem tensão). A escala padroniza e permite acompanhar a evolução, mas é subjetiva e <strong>não identifica a causa</strong>.</p>
<h3>Exame da laringe</h3>
<blockquote><p><strong>Todo paciente com disfonia por no mínimo 15 dias deve ter a laringe avaliada.</strong> A avaliação perceptiva descreve a voz; só a visualização da laringe dá o diagnóstico etiológico.</p></blockquote>
<p>A laringe pode ser vista por laringoscopia indireta com espelho, por <strong>nasofibrolaringoscopia</strong> flexível ou por <strong>telelaringoscopia</strong> rígida via oral; a <strong>estroboscopia</strong>, quando disponível, mostra a onda mucosa. Lesões de anatomia difícil podem exigir laringoscopia direta.</p>
<hr>
<h2>Classificação etiológica</h2>
<div class="tbl"><table><thead><tr><th>Grupo</th><th>Definição</th><th>Exemplos</th></tr></thead><tbody><tr><td><strong>Funcionais</strong></td><td>Uso irregular da voz <strong>sem lesão laríngea visível</strong></td><td>Uso incorreto (gritos, ocupacional), alterações de outros sistemas, <strong>psicogênicas (conversivas)</strong></td></tr><tr><td><strong>Orgânicas</strong></td><td>Lesões <strong>sem relação</strong> com o mau uso vocal</td><td>Doenças mucosas benignas, neurológicas, neoplásicas</td></tr><tr><td><strong>Orgânico-funcionais</strong></td><td>Disfonia funcional que <strong>evolui e cria lesão</strong></td><td><strong>Nódulos, pólipos</strong></td></tr></tbody></table></div>
<hr>
<h2>Lesões benignas por uso vocal: nódulos, pólipos, edema de Reinke e cisto</h2>
<h3>Nódulos vocais</h3>
<p>Espessamento da <strong>borda livre</strong> das pregas, na <strong>junção do terço anterior com o terço médio</strong> — o ponto de maior atrito. São <strong>bilaterais e geralmente simétricos</strong>.</p>
<ul><li><strong>Principal causa de disfonia na infância</strong>: meninos de <strong>7 a 9 anos</strong> (e meninas mais agitadas), pelo comportamento vocal abusivo.</li><li>Em adultos, quase exclusivamente <strong>mulheres de 20 a 30 anos</strong>, fase de uso vocal intenso — profissional (professoras) ou doméstico (educação dos filhos).</li><li>A disfonia acompanha o uso e <strong>piora ao final do dia</strong>.</li><li><strong>Tratamento: fonoterapia.</strong></li></ul>

<h3>Pólipos vocais</h3>
<p>Lesão benigna <strong>unilateral, globosa</strong>, pediculada ou séssil — um processo inflamatório que se organiza. Associa-se a <strong>trauma vocal agudo</strong> (grito, esforço) ou a abuso vocal repetido.</p>
<ul><li>Aspectos: <strong>gelatinoso</strong> (translúcido, conteúdo liquefeito), <strong>fibroso</strong> (esbranquiçado, firme, exsudato de fibrina) ou <strong>angiomatoso</strong> (avermelhado, com vaso nutridor).</li><li>Clínica: disfonia de <strong>instalação súbita</strong> com piora progressiva, voz rouca ou soprosa (depende do tamanho), sensação de esforço, piora após uso prolongado.</li><li><strong>Tratamento: microcirurgia de laringe (padrão-ouro)</strong>, fonoterapia pré e pós-operatória e controle de fatores associados (refluxo, ambiente ruidoso, abuso vocal).</li></ul>
<h3>Edema de Reinke</h3>
<p>Processo inflamatório crônico com <strong>depósito de material gelatinoso</strong> (às vezes semissólido, não líquido) na <strong>camada superficial da lâmina própria</strong>.</p>
<ul><li><strong>Lentamente progressivo</strong>; fatores: <strong>tabagismo</strong> e uso intenso da voz.</li><li><strong>Bilateral (pode ser unilateral) e assimétrico</strong>; pode abranger toda a prega e dificultar a leitura da anatomia local.</li><li>Voz <strong>grave, aveludada, sedosa</strong>. A mulher procura mais o médico porque é <strong>confundida com homem ao telefone</strong>; o homem costuma apreciar a voz.</li><li>Quando muito volumoso, pode causar <strong>dispneia</strong>.</li><li><strong>Tratamento: cessar o tabagismo, controlar o refluxo, microcirurgia de laringe e fonoterapia.</strong></li></ul>

<h3>Cisto vocal</h3>
<p>Lesão benigna <strong>fechada</strong>, na lâmina própria, geralmente <strong>unilateral</strong>, associada a trauma vocal repetido. Pode ser <strong>mucoso</strong> (de retenção) ou <strong>epidermoide</strong> (com queratina, esbranquiçado).</p>
<ul><li>Diagnóstico: laringoscopia, idealmente com estroboscopia — <strong>massa arredondada, lisa, fixa na vibração</strong>.</li><li><strong>Não desaparece com fonoterapia isolada.</strong> Tratamento: microcirurgia (padrão-ouro) com fonoterapia pré e pós-operatória.</li></ul>
<hr>
<h2>Papiloma, granuloma e carcinoma</h2>
<h3>Papiloma laríngeo</h3>
<p><strong>Tumor benigno mais comum da laringe</strong>, causado pelo <strong>HPV tipos 6 e 11</strong>.</p>
<ul><li>Aspecto típico: múltiplas projeções <strong>em cacho de uva</strong> — lesões exofíticas e multilobuladas.</li><li>Clínica: disfonia progressiva, rouquidão persistente; <strong>em crianças, estridor e sinais de obstrução</strong>.</li><li>Tratamento: cirurgia (<strong>microdebridador, laser de CO2</strong>) e antiviral adjuvante (<strong>cidofovir</strong>).</li><li><strong>Alta taxa de recorrência.</strong></li></ul>

<h3>Granuloma vocal</h3>
<p>Lesão inflamatória localizada no <strong>processo vocal da aritenoide</strong> — posição <strong>posterior</strong> característica.</p>
<ul><li>Causas: <strong>refluxo laringofaríngeo (a mais frequente)</strong>, <strong>intubação orotraqueal prolongada</strong>, abuso vocal.</li><li>Clínica: disfonia <strong>leve ou ausente</strong>, sensação de corpo estranho, pigarro persistente, tosse irritativa.</li><li>Laringoscopia: lesão arredondada, avermelhada, lisa, na glote posterior.</li><li>Tratamento: controle do refluxo, fonoterapia, cirurgia eventual. <strong>Recidiva se o refluxo não for controlado.</strong></li></ul>

<h3>Carcinoma espinocelular</h3>
<p>O tumor maligno da laringe é o <strong>carcinoma espinocelular (CEC)</strong>, ligado a <strong>tabagismo e etilismo</strong>, tratado com <strong>cirurgia e/ou radioterapia</strong>. Na prega vocal, a disfonia costuma ser o sintoma inicial — razão a mais para a regra dos 15 dias.</p>

<h3>Diagnóstico diferencial na laringoscopia</h3>
<div class="tbl"><table><thead><tr><th>Lesão</th><th>Lado</th><th>Pistas</th></tr></thead><tbody><tr><td>Nódulos</td><td>Bilateral, simétrico</td><td>Junção terço anterior/médio; criança ou mulher jovem; piora ao fim do dia</td></tr><tr><td>Pólipo</td><td>Unilateral</td><td>Globoso, pediculado ou séssil; após grito; pode ser avermelhado</td></tr><tr><td>Edema de Reinke</td><td>Bilateral, assimétrico</td><td>Tabagista; voz grave e aveludada; prega toda edemaciada</td></tr><tr><td>Cisto</td><td>Unilateral</td><td>Arredondado, liso, fixo na vibração; não regride com fono</td></tr><tr><td>Papiloma</td><td>Variável, múltiplo</td><td>Cacho de uva; HPV 6/11; recorre; estridor na criança</td></tr><tr><td>Granuloma</td><td>Posterior</td><td>Processo vocal; refluxo ou intubação; pouca disfonia</td></tr><tr><td>CEC</td><td>Variável</td><td>Irregular, esbranquiçado, exofítico; tabagismo e etilismo</td></tr></tbody></table></div>
<blockquote><p><strong>Biópsia!</strong> Diante de lesão suspeita — sobretudo em tabagista e etilista —, só o anatomopatológico define o diagnóstico. Fonoterapia ou tratamento empírico de refluxo não substituem a biópsia.</p></blockquote>
<hr>
<h2>Saúde vocal</h2>
<p>A profilaxia é parte do tratamento de quase todas as disfonias orgânico-funcionais e reduz a recidiva depois da cirurgia.</p>
<ul><li><strong>Hidratação</strong> e <strong>aquecimento e desaquecimento vocal</strong>.</li><li><strong>Evitar abuso vocal</strong> e <strong>competição sonora</strong> (falar por cima do ruído).</li><li><strong>Não fumar</strong> e evitar abuso de álcool.</li><li><strong>Prevenir e tratar o refluxo.</strong></li><li>Cuidados regulares: identificar alergias e os próprios limites vocais, alimentação regular, sono satisfatório, evitar tensão, ansiedade e estresse.</li></ul>
<blockquote><p>Fumo, refluxo e abuso vocal atravessam o capítulo inteiro: aparecem como causa do edema de Reinke, do granuloma, do pólipo e do câncer. Controlá-los é tratamento e é prevenção.</p></blockquote></script>

    "question": "Qual conjunto de medidas faz parte da profilaxia da saúde vocal?",
    "options": [
      "Hidratação, aquecimento e desaquecimento vocal e evitar competição sonora",
      "Sussurrar nas crises de rouquidão, pastilhas mentoladas e café antes de falar",
      "Falar mais alto em ambiente ruidoso, gargarejo com álcool e jejum prolongado",
      "Pigarrear para limpar a voz, bebidas geladas e repouso vocal só após shows"
    ],
    "correctIndex": 0,
    "explanation": "A higiene vocal reúne hidratação, aquecimento e desaquecimento da voz, evitar abuso vocal e competição sonora (falar por cima do ruído), não fumar, evitar abuso de álcool, prevenir e tratar o refluxo, além de sono satisfatório, alimentação regular e controle de tensão, ansiedade e estresse. Identificar alergias e os próprios limites vocais também faz parte."
  }
];

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';
      if (cur && a===null) bg = '#121a2b';
      var st = a===null ? 'em branco' : (a===q.correctIndex ? 'correta' : 'incorreta');
      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +

                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +

  }
  document.getElementById('hdr').innerHTML = html;
}
function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +
      '</button>';
  }).join('');

  var expl = reveal ? '<div style="margin-top:20px;padding:16px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;animation:qFade .26s ease">' +
      '<div style="'+mono+';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:8px">Por quê</div>' +
      '<p style="margin:0;font-size:14.5px;line-height:1.68;color:#39404f;text-wrap:pretty">'+esc(q.explanation)+'</p></div>' : '';

  var blank = counts().blank;
  var warn = S.warn ? '<div style="margin-top:14px;padding:15px 17px;background:#fdf7e9;border:1px solid #e8d5a3;border-radius:14px;animation:qFade .22s ease">' +
      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +
        '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;line-height:1.42;font-weight:400;letter-spacing:-.012em;margin:0 0 22px;text-wrap:pretty">'+esc(q.question)+'</h2>' +
        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
        (reveal ? chatBox(q, ans===q.correctIndex) : '') +
      '</article>' + warn +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px">' +
        '<button type="button" data-act="prev" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:12px 18px;font-size:14px;cursor:pointer;transition:border-color .15s ease,color .15s ease;color:'+(S.i===0?'#c4bfb4':'#121a2b')+';pointer-events:'+(S.i===0?'none':'auto')+'">← Anterior</button>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          (early ? '<button type="button" data-act="finish" class="h-ink" style="background:none;border:0;padding:12px 6px;'+mono+';font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a8578;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Finalizar</button>' : '') +
          '<button type="button" data-act="next" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">'+(last?'Finalizar':'Próxima →')+'</button>' +
        '</div></div></section>';
}

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';
  if (pct>=90)      { title='Domínio sólido';   msg='Desempenho excelente. Confira as explicações das que escaparam e siga em frente.'; }
  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

  var stat = function(v,l,color){

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){

  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
</body>
</html>
