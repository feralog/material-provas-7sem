<script type="text/html" id="resumoSrc"><h2>Emergência e urgência em psiquiatria</h2>
<p>Emergência psiquiátrica é qualquer perturbação nos pensamentos, sentimentos ou ações para a qual se faz necessária uma <strong>intervenção imediata</strong>, com o objetivo de evitar maiores prejuízos à saúde psíquica, física e social do indivíduo ou de eliminar riscos à sua vida ou à de outros. O que separa a emergência da urgência não é o diagnóstico, e sim o <strong>risco</strong> e o <strong>tempo</strong> disponível para agir.</p>
<div class="tbl"><table><thead><tr><th></th><th>Emergência</th><th>Urgência</th></tr></thead><tbody><tr><td>Definição</td><td>Distúrbio de pensamento, sentimento ou ação com <strong>risco de vida ou risco social grave</strong></td><td>Situação com <strong>riscos menores</strong>, que pede intervenção a curto prazo</td></tr><tr><td>Tempo</td><td>Intervenção imediata e inadiável, em <strong>minutos ou horas</strong></td><td>Intervenção em <strong>dias ou semanas</strong></td></tr><tr><td>Exemplos</td><td>Delirium tremens, comportamento violento, toxicidade por drogas, tentativa de suicídio</td><td>Comportamento bizarro, agitação aguda, embriaguez, avaliação de internação, atitudes suicidas, síndrome conversiva</td></tr></tbody></table></div>
<p>O atendimento acontece em meio a <strong>intenso abalo emocional</strong> — do paciente, da família e, muitas vezes, da equipe. Por isso os diagnósticos feitos no pronto-socorro são <strong>provisórios</strong>, e o recomendado é registrar hipóteses <strong>sindrômicas</strong>, como <em>transtorno psicótico</em> ou <em>transtorno do humor</em>, em vez de rótulos nosológicos fechados. O cuidado na orientação ao paciente e aos acompanhantes faz parte da conduta: um diagnóstico definitivo dado cedo demais pesa sobre a família e raramente se sustenta.</p>
<h3>Por que o hospital geral atende o paciente psiquiátrico</h3>
<p>O pronto-socorro clínico já é porta de entrada da psiquiatria, e isso tem várias causas:</p>
<ul><li>integração maior da psiquiatria como especialidade médica, com <strong>interconsultas</strong> e presença do psiquiatra no hospital;</li><li>percepção crescente do papel dos transtornos mentais no curso das doenças orgânicas — como fator que altera a evolução, precipita ou até contribui para a gênese da doença;</li><li>políticas de saúde que introduziram <strong>enfermarias psiquiátricas no hospital geral</strong> e nos serviços de emergência;</li><li><strong>desospitalização</strong>: internações curtas e tratamento extra-hospitalar, na comunidade e no domicílio — com a pergunta sempre em aberto sobre se esses serviços são adequados, integrados e suficientes;</li><li>mudança do perfil epidemiológico, com envelhecimento populacional e doenças degenerativas;</li><li>abuso de drogas, depressão, suicídio e violência urbana.</li></ul>
<p>O modelo de atenção migrou do <strong>hospitalismo para a descentralização</strong>, da exclusão para a inclusão, organizado na <strong>Rede de Atenção Psicossocial (RAPS)</strong>, que funciona por território de saúde e se articula com a Estratégia Saúde da Família. A face concreta dessa mudança é a redução dos leitos em hospital psiquiátrico especializado — e a pressão que isso transfere para os serviços de emergência.</p>

<h3>Crise: populações em risco e eventos desencadeantes</h3>
<p>Crise é a ruptura do equilíbrio que acontece quando um evento supera os recursos habituais de enfrentamento da pessoa. Alguns grupos estão mais expostos:</p>
<ul><li>desemprego, subemprego ou insatisfação ocupacional;</li><li>abuso de álcool e outras drogas;</li><li>dificuldade de lidar com problemas cotidianos menores, baixa autoestima e sentimento de insegurança excessivo;</li><li>história de crises mal resolvidas ou de transtornos psiquiátricos;</li><li>subutilização de recursos de apoio social, falta de rede de apoio (família, amigos), poucos relacionamentos duradouros e sentimento de isolamento;</li><li>impulsividade, com história de lesões físicas frequentes ou de dano à propriedade.</li></ul>
<p>Os <strong>eventos desencadeantes</strong> mais comuns são a morte ou perda de um ente amado; casamento, separação, divórcio ou término de relacionamento significativo; gravidez, sobretudo fora do casamento; doença física; mudança de status educacional (inclusive graduação) ou promoção; perda de emprego, mudança nas condições de trabalho ou aposentadoria; ser vítima de violência social; e desastres naturais. Note que eventos "positivos", como promoção e casamento, também desestabilizam.</p>
<hr>
<h2>Equipe e ambiente</h2>
<p>O atendimento ao paciente com alteração do estado mental mobiliza <strong>medo</strong> na equipe, e esse medo tem razões concretas. A equipe precisa de treinamento para compreender e acolher, porque enfrenta ao mesmo tempo: risco de violência e de suicídio, excesso de casos, escassez de unidades de referência, decisões sobre internação involuntária, inexperiência e incerteza, comorbidade entre problemas clínicos e psiquiátricos, necessidade de decisões rápidas, críticas e conflitos dentro da equipe, resistência do paciente às recomendações e famílias difíceis. A resposta é uma <strong>equipe multiprofissional</strong> com código de conduta acordado entre profissionais, pacientes e familiares.</p>
<h4>Ambiente apropriado</h4>
<ul><li><strong>Salas especializadas</strong>, com segurança e proteção: a violência não pode ser permitida nem tolerada, e há recurso de contenção para os mais agitados.</li><li><strong>Acesso imediato a salas de emergência não psiquiátricas</strong>, porque <strong>5% a 30% das doenças sistêmicas</strong> se apresentam com alteração do estado mental.</li><li>Sala segura e com privacidade, <strong>sem vidro, objetos pontiagudos ou medicamentos</strong> ao alcance.</li><li>Evitar superestimulação por excesso de atividade ou ruído.</li><li><strong>Sala com duas saídas</strong>, e portas que abram para <strong>ambos os lados</strong>.</li><li>Medicamentos orais e parenterais de <strong>acesso rápido</strong> e equipe alerta para intervir.</li><li>Sala ampla, que permita entrevista conjunta com acompanhantes.</li><li>Enfermaria de observação com leitos apropriados para contenção e monitoramento constante.</li></ul>
<p>O ambiente ideal nem sempre está disponível — a crise acontece em qualquer lugar, sem aviso. Nesse caso a equipe usa os recursos que tem e encaminha o paciente a um serviço de emergência o quanto antes. A regra que não se negocia: <strong>o profissional nunca se coloca em risco</strong>, por exemplo permanecendo em sala fechada sem saída fácil.</p>
<blockquote><p>Pacientes agitados podem desafiar a autoridade, a competência e até as credenciais do médico, e costumam ser muito bons em detectar e explorar as vulnerabilidades de quem os atende. Não morder a isca faz parte da técnica.</p></blockquote>
<hr>
<h2>Agitação psicomotora e heteroagressividade</h2>
<h3>Quem tem mais risco</h3>
<ul><li><strong>Sociodemográficos:</strong> sexo masculino, <strong>15 a 24 anos</strong>, baixo nível socioeducacional, desemprego, ausência de suporte social.</li><li><strong>História prévia:</strong> atos violentos ou homicidas, assaltos, ter sido <strong>vítima de violência na infância</strong>.</li></ul>
<h3>Causas</h3>
<div class="tbl"><table><thead><tr><th>Grupo</th><th>Exemplos</th></tr></thead><tbody><tr><td>Abuso de substâncias</td><td>Intoxicação alcoólica, estimulantes, anfetamina, cocaína, abstinência alcoólica, "má viagem", solventes, inseticidas e outros tóxicos</td></tr><tr><td>Síndrome mental orgânica e doença neurológica</td><td>Meningite, encefalite, TCE, processo expansivo, epilepsia, hematoma subdural, encefalopatia hipertensiva, hipóxia cerebral</td></tr><tr><td>Quadros sintomáticos e metabólicos</td><td><strong>Hipoglicemia</strong>, infecções, febre, hipertireoidismo, uremia, insuficiência hepática</td></tr><tr><td>Medicamentos</td><td>Intoxicação, efeitos idiossincráticos e adversos</td></tr><tr><td>Psicoses</td><td>Esquizofrenia, furor maníaco, depressão agitada</td></tr><tr><td>Transtornos de personalidade</td><td>Antissocial, borderline, paranoide</td></tr><tr><td>Conversivos e dissociativos</td><td>Quadros conversivos e dissociativos</td></tr></tbody></table></div>
<h3>Sinais de heteroagressividade iminente</h3>
<p>Postura <strong>inclinada para a frente</strong>, <strong>hipervigilância</strong>, atividade motora irritável, <strong>voz alta ou gritos</strong>, comentários pejorativos, olhos arregalados e comportamento exigente e tenso. Reconhecê-los é o que permite intervir antes do ato.</p>
<h4>Escalas validadas para o Brasil</h4>
<ul><li>Lista de verificação da violência de <strong>Brøset (BVC)</strong>.</li><li>Gerenciamento do histórico clínico de riscos-20 (<strong>HCR-20</strong>).</li><li>Escala de agitação-sedação de <strong>Richmond (RASS)</strong>.</li><li>Escala de sedação e agitação (<strong>SAS</strong>).</li></ul>
<h3>A sequência do cuidado</h3>
<p>Os objetivos diante da agitação psicomotora são: triagem e avaliação da gravidade; anamnese objetiva e subjetiva; exame físico e neurológico; exame psiquiátrico; diagnóstico diferencial; tranquilização rápida; encaminhamento e orientação. Na prática a ordem se inverte com frequência — <strong>o paciente precisa ser tranquilizado antes que a avaliação possa ser feita</strong>.</p>
<h3>Quando suspeitar de causa orgânica</h3>
<div class="tbl"><table><thead><tr><th>Na história e no exame</th><th>Nos sintomas</th></tr></thead><tbody><tr><td>Sintomas agudos a partir dos <strong>45 anos</strong>; idosos</td><td>Perda de memória</td></tr><tr><td><strong>Sinais vitais alterados</strong></td><td><strong>Alucinações visuais</strong></td></tr><tr><td>Déficit neurológico focal; convulsões</td><td>Sudorese, tremor, palidez</td></tr><tr><td>Evidência de trauma craniano</td><td>Cefaleia intensa</td></tr><tr><td>Intoxicação ou abstinência de substâncias</td><td>Rigidez muscular ou fraqueza extrema</td></tr><tr><td>Doença física preexistente</td><td>Intolerância ao calor; perda de peso involuntária</td></tr><tr><td><strong>Rebaixamento do nível de consciência</strong></td><td>Dificuldade respiratória</td></tr><tr><td>Tentativas de suicídio</td><td><strong>Psicose de início recente</strong></td></tr></tbody></table></div>
<blockquote><p>Agitação com sudorese, tremor e palidez pede <strong>glicemia capilar</strong> de imediato: a hipoglicemia é causa de agitação reversível em minutos e fatal se ignorada.</p></blockquote>
<hr>
<h2>Manejo verbal e contenção física</h2>
<h3>A abordagem verbal</h3>
<ul><li>Mantenha <strong>distância</strong>, sem invadir o espaço do paciente.</li><li>Nunca se aproxime <strong>pelas costas</strong>, nunca fique de costas para ele e nunca se dirija a ele de forma rude — respeito.</li><li>Apresente-se e explique o que está fazendo, com <strong>palavras fáceis e frases curtas</strong>, mantendo-se calmo.</li><li>Ajude o paciente a restaurar a orientação e a entender o que está acontecendo, reassegurando-o sobre o diagnóstico e o tratamento.</li><li><strong>Não confronte.</strong></li><li>Expressão facial neutra, tom de voz baixo, postura relaxada — assertividade.</li><li>Forneça informações ao paciente e aos acompanhantes.</li><li>Quando possível, pergunte sobre o real motivo da violência.</li><li><strong>Coloque limites</strong>: diga que a violência não será permitida.</li><li>Estimule a expressão verbal de sentimentos, fantasias e medos.</li></ul>
<h3>A estratégia muda conforme a causa</h3>
<div class="tbl"><table><thead><tr><th>Grupo</th><th>Manejo verbal</th><th>Contenção mecânica</th><th>Manejo farmacológico</th></tr></thead><tbody><tr><td>Transtorno mental orgânico</td><td>Usualmente ineficaz</td><td>Até a elucidação diagnóstica, se há violência ou risco iminente</td><td><strong>Tratar a condição médica subjacente</strong>; psicofármaco se necessário</td></tr><tr><td>Psicose funcional (esquizofrenia, mania)</td><td>Usualmente ineficaz</td><td>Se necessário, para medicar até obter o efeito químico</td><td><strong>Psicofármaco é o tratamento de escolha</strong></td></tr><tr><td>Não psicóticos e não orgânicos (personalidade, conversivos, dissociativos)</td><td><strong>Boa resposta</strong></td><td>Conforme o grau de impulsividade</td><td>Psicofármaco se necessário</td></tr></tbody></table></div>
<h3>Contenção física</h3>
<p>A contenção física é <strong>procedimento médico</strong> e deve ser acompanhada diretamente por um profissional de enfermagem <strong>durante todo o tempo</strong> (Resolução CFM 1.598/2000, art. 11, hoje consolidada na Resolução CFM 2.057/2013). A legislação estadual de reforma psiquiátrica (Lei 11.802/95, acrescida pela 12.684/97) <strong>veda celas-fortes, camisas de força e outros procedimentos violentos e desumanos</strong>, e só admite a restrição física que cumpra quatro condições:</p>
<ol><li>ser o meio mais disponível de <strong>prevenir dano imediato ou iminente</strong> ao paciente ou a outros;</li><li>restringir-se ao <strong>período estritamente necessário</strong>;</li><li>ter <strong>registro no prontuário</strong> das razões, da natureza e da extensão da restrição;</li><li>ocorrer em condições técnicas adequadas, sob <strong>cuidado e supervisão permanentes</strong>.</li></ol>
<p>Isolamento em cela e camisa de força: <strong>nunca</strong>. Já a contenção mecânica no leito, feita com técnica, tem lugar:</p>
<ul><li>a violência iminente exige intervenção imediata;</li><li>preserva o ambiente protetor para os outros pacientes e para a equipe;</li><li>as consequências da violência não contida são imprevisíveis e podem ser irreversíveis;</li><li>a decisão é <strong>médica</strong>, tomada <strong>após a abordagem verbal infrutífera</strong> e com os recursos presentes: faixas, leito apropriado e equipe treinada.</li></ul>
<blockquote><p>Um argumento clássico a favor da contenção mecânica é que ela tem menos efeitos colaterais que a medicação, não altera o nível de consciência e é reversível. Isso não a torna inócua: a contenção tem riscos próprios — asfixia por posição, trombose venosa, rabdomiólise, lesões e trauma psicológico — e por isso é reavaliada com frequência e retirada assim que possível.</p></blockquote>
<hr>
<h2>Tranquilização rápida</h2>
<p>A chamada "contenção química" segue princípios fixos:</p>
<ul><li>tratamento farmacológico <strong>apenas quando outras abordagens falharem</strong>;</li><li>a <strong>causa da agitação</strong>, os efeitos colaterais e as contraindicações guiam a escolha;</li><li>a <strong>via oral é preferencial</strong>; a intramuscular é a alternativa, e a <strong>intravenosa deve ser evitada</strong>;</li><li><strong>todos</strong> os pacientes são monitorados antes e depois da medicação.</li></ul>
<p>O alvo é acalmar o paciente o suficiente para que a avaliação aconteça — não induzir sono profundo. Os riscos que acompanham qualquer antipsicótico parenteral são a <strong>síndrome extrapiramidal (SEP)</strong> e as alterações cardiovasculares, com destaque para o <strong>prolongamento do intervalo QT</strong>.</p>
<h3>Antipsicóticos de primeira geração</h3>
<div class="tbl"><table><thead><tr><th>Fármaco</th><th>Dose</th><th>O que importa</th></tr></thead><tbody><tr><td><strong>Haloperidol</strong></td><td><strong>5 mg IM</strong></td><td>Uso bem estabelecido, em monoterapia ou associado a prometazina, midazolam ou lorazepam; mais SEP; <strong>via IV não recomendada</strong> (amplifica SEP e cardiotoxicidade)</td></tr><tr><td>Clorpromazina</td><td>25 mg, até 300 mg/dia</td><td>Reduz o limiar convulsivo (risco de estado de mal epiléptico) e causa <strong>hipotensão grave e súbita</strong> — uso não recomendado</td></tr><tr><td>Levomepromazina</td><td>25 a 100 mg/dia</td><td>Fenotiazina sedativa</td></tr><tr><td>Droperidol</td><td>2,5 a 10 mg</td><td>Butirofenona de início rápido e mais sedativa, com menos efeito respiratório que os benzodiazepínicos; não associar a BZD — uso não recomendado</td></tr><tr><td>Zuclopentixol acetato</td><td>50 mg IM a cada 3 dias (máximo de 150 mg)</td><td>Apresentação de ação intermediária (Acuphase); o zuclopentixol também existe em depósito e oral diário</td></tr></tbody></table></div>
<p>Clorpromazina e droperidol são, além de antipsicóticos, antieméticos.</p>
<h3>Antipsicóticos de segunda geração</h3>
<ul><li><strong>Ziprasidona IM</strong>: 10 mg a cada 2 horas ou 20 mg a cada 4 horas, <strong>máximo de 40 mg/dia</strong>, por até três dias consecutivos (frasco-ampola de 20 mg/mL, pó para solução intramuscular).</li><li><strong>Olanzapina IM</strong>: 10 mg, máximo de <strong>30 mg/dia</strong> — a apresentação intramuscular foi descontinuada no Brasil.</li></ul>
<h3>Associações mais comuns</h3>
<ul><li><strong>Prometazina, uma ampola (50 mg)</strong>, associada ao haloperidol ou à clorpromazina — soma sedação e reduz a SEP.</li><li><strong>Biperideno</strong>, antiparkinsoniano, quando surge parkinsonismo agudo ou distonia.</li><li><strong>Midazolam</strong>: evitar a associação e evitar o midazolam IM, pelo risco de depressão respiratória somada.</li><li><strong>Benzodiazepínicos por via oral</strong>: relaxamento muscular, sedação, alternativa aos neurolépticos e melhora da acatisia — dependem da aceitação do paciente. <strong>Não usar IM</strong>: o diazepam IM tem absorção errática, e o lorazepam injetável não é comercializado no Brasil.</li></ul>
<h3>Benzodiazepínicos</h3>
<p>Os benzodiazepínicos aumentam o efeito do <strong>GABA nos receptores GABA-A</strong>, com ação sedativa, hipnótica, ansiolítica, anticonvulsivante e miorrelaxante. <strong>Diazepam VO, clonazepam VO e lorazepam</strong> servem para agitações <strong>leves a moderadas</strong> induzidas pela <strong>abstinência de álcool</strong> e pela <strong>intoxicação por cocaína</strong>. A associação de <strong>risperidona oral com lorazepam ou clonazepam oral</strong> também se mostrou efetiva na agitação psicomotora.</p>

<p>Dela, vale guardar: por via oral, <strong>risperidona 2 mg</strong> (pico em 1 hora, máximo de 6 mg), <strong>olanzapina 5 a 10 mg</strong> (pico tardio, em 6 horas, máximo de 20 mg), <strong>haloperidol 5 mg</strong> (mais SEP, máximo de 20 mg) e <strong>lorazepam 2 mg</strong> (máximo de 12 mg). Por via intramuscular, ziprasidona 10 a 20 mg (pico em 15 minutos), olanzapina 10 mg, aripiprazol 9,75 mg, haloperidol 5 mg e lorazepam 2 mg. O haloperidol IV (2 a 5 mg, máximo de 10 mg) aparece com ressalva: aumenta o risco de prolongamento do QT e, se usado, exige dose limitada e monitorização cardíaca.</p>
<blockquote><p><strong>Intoxicação alcoólica e abstinência alcoólica são opostas na conduta.</strong> No paciente embriagado, benzodiazepínico se soma ao álcool na depressão do sistema nervoso central e da respiração — evite. Na abstinência, o benzodiazepínico é justamente o tratamento de escolha.</p></blockquote>
<hr>
<h2>Complicações da tranquilização rápida</h2>
<p>Mesmo em doses habituais, a tranquilização rápida tem complicações previsíveis:</p>
<ul><li><strong>locais</strong>: extravasamento, dor e hematoma;</li><li><strong>respiratórias</strong>: depressão respiratória central e aspiração;</li><li><strong>cardiovasculares</strong>: efeito <strong>quinidina-like</strong> das fenotiazinas, com prolongamento do QT;</li><li><strong>clorpromazina</strong>: hipotensão aguda, convulsão e síncope cardíaca, descrita como mais comum em países tropicais.</li></ul>
<h3>As graves</h3>
<ul><li><strong>Síndrome neuroléptica maligna</strong>: estado mental alterado, <strong>rigidez muscular, hipertermia e hiperatividade autonômica</strong> — clinicamente semelhante à hipertermia maligna. A conduta é suspender o antipsicótico e dar suporte intensivo.</li><li><strong>Morte súbita</strong> inexplicada, 2 a 3 minutos após injeção intravenosa, por choque neurogênico.</li><li><strong>Morte por injeção intravenosa de neuroléptico de depósito</strong> — erro de via que não tem volta.</li></ul>
<h3>Os sintomas extrapiramidais</h3>
<div class="tbl"><table><thead><tr><th>Efeito</th><th>Como aparece</th><th>Detalhe de prova</th></tr></thead><tbody><tr><td><strong>Distonia aguda</strong></td><td>Contração muscular sustentada: torcicolo, crise oculógira, trismo</td><td>Ocorre em <strong>10% a 30%</strong> dos pacientes, nas primeiras 24 horas, e em cerca de <strong>50% dos homens jovens</strong>; trata-se com <strong>biperideno</strong></td></tr><tr><td><strong>Acatisia</strong></td><td>Inquietação, incapacidade de permanecer sentado</td><td>Pode surgir com a <strong>dose suplementar</strong> de neuroléptico e ser confundida com piora da agitação; benzodiazepínico oral melhora</td></tr></tbody></table></div>
<h3>Os riscos dos benzodiazepínicos</h3>
<ul><li>Os efeitos indesejáveis são <strong>mais fortes pela via IV</strong>.</li><li><strong>Não usar</strong> em quem usou <strong>depressores do SNC</strong>, como o álcool.</li><li>Advertência contra o <strong>diazepam IV</strong>: seu metabólito ativo, o <strong>nordiazepam</strong>, tem meia-vida de eliminação muito mais longa, de modo que a droga <strong>se acumula</strong> com doses repetidas, sobretudo em <strong>idosos</strong>, pelo efeito sobre o metabolismo oxidativo.</li><li>Embolia e depressão respiratória.</li><li>Efeitos colaterais gerais: sedação excessiva, tontura, fraqueza, desorientação, cefaleia, confusão, irritabilidade, <strong>efeito paradoxal</strong>, prejuízo de memória, incoordenação, <strong>risco de quedas</strong>, xerostomia, visão borrada, hipotensão, ataxia, depressão respiratória e parada cardiorrespiratória.</li></ul>
<hr>
<h2>Abstinência alcoólica e delirium tremens</h2>
<h3>O quadro da abstinência</h3>
<div class="tbl"><table><thead><tr><th>Domínio</th><th>Achados</th></tr></thead><tbody><tr><td>Hiperatividade autonômica</td><td><strong>Taquicardia, hipertensão, diaforese, tremores, febre</strong>, alcalose respiratória</td></tr><tr><td>Sono</td><td>Insônia de latência, aumento do sono REM, redução do sono profundo (estágios 3 e 4)</td></tr><tr><td>Gastrintestinal</td><td>Anorexia, náusea e vômitos</td></tr></tbody></table></div>
<h3>O mecanismo: GABA para baixo, glutamato para cima</h3>
<p>O álcool potencializa o GABA nos receptores GABA-A e inibe o glutamato. No uso crônico o cérebro se adapta ao contrário: reduz a resposta GABAérgica e aumenta a glutamatérgica para manter o equilíbrio. Quando o álcool é retirado de forma abrupta, sobra um sistema <strong>sem freio e com acelerador</strong>: tremor, hiperatividade autonômica, convulsão e delirium. É por isso que o benzodiazepínico, que devolve o tônus GABAérgico, é o tratamento.</p>
<h3>Números</h3>
<ul><li><strong>Menos de 50%</strong> dos dependentes de álcool desenvolvem síndrome de abstinência.</li><li><strong>5% a 10%</strong> dos quadros de abstinência evoluem para <strong>delirium tremens</strong>.</li><li>A mortalidade do delirium tremens é descrita entre <strong>5% e 25%</strong>, por disfunção respiratória e arritmias cardíacas ligadas às alterações metabólicas.</li><li>É <strong>emergência médica</strong>, com risco de vida, e pede atendimento conjunto do clínico e do psiquiatra.</li></ul>

<p>O delirium tremens é <strong>delirium somado à síndrome de abstinência alcoólica</strong>, uma <strong>complicação tardia</strong>, que surge <strong>após 48 horas</strong> de abstinência — é o etilista que interna por outro motivo e "vira" no segundo ou terceiro dia. Os sintomas são confusão, agitação, tremor, febre, ideação paranoide e <strong>alucinações visuais</strong>.</p>
<p>O tratamento tem um eixo e três adjuvantes:</p>
<ul><li><strong>benzodiazepínico</strong> (diazepam) — o eixo;</li><li>medidas gerais para delirium e, nos casos graves, <strong>UTI</strong>;</li><li><strong>haloperidol</strong> como adjuvante para as alucinações;</li><li><strong>betabloqueador e clonidina</strong> como adjuvantes para a hiperatividade simpática — nunca isolados, porque mascaram os sinais sem prevenir convulsão nem delirium.</li></ul>
<blockquote><p>No etilista, a <strong>tiamina</strong> vem antes da glicose: glicose sem tiamina pode precipitar a encefalopatia de Wernicke. A gravidade da abstinência costuma ser medida pela escala CIWA-Ar, que orienta a dose de benzodiazepínico.</p></blockquote>
<hr>
<h2>Risco de suicídio</h2>
<p>Desde a <strong>Portaria nº 1.271, de 6 de junho de 2014</strong>, a tentativa de suicídio e o suicídio são agravos de <strong>notificação compulsória imediata</strong> — a tentativa é comunicada à vigilância municipal em até 24 horas, por qualquer serviço que atenda o caso. Os estados com maiores taxas de mortalidade por suicídio são <strong>RS, RR, PI, MS e SC</strong>; o Amazonas ocupa o 10º lugar, com alta incidência na <strong>população indígena</strong>.</p>
<h3>Os graus do comportamento suicida</h3>
<p>O comportamento suicida é um espectro, e cada termo tem peso diferente na avaliação: <strong>ideação suicida</strong> (pensar), <strong>intenção suicida</strong> (querer agir), <strong>tentativa abortada</strong> (interrompida antes do ato), <strong>automutilação deliberada</strong> (lesão sem intenção de morrer), <strong>letalidade</strong> da tentativa ou do comportamento, <strong>tentativa de suicídio</strong> e <strong>suicídio</strong>.</p>
<h3>Como perguntar</h3>
<p>A entrevista vai do geral ao específico, e cada degrau só é subido se o anterior foi positivo:</p>
<ol><li>Que problemas você tem enfrentado ultimamente?</li><li>Sente que a sua vida perdeu o sentido?</li><li>Pensa que seria melhor morrer?</li><li>Pensou em pôr fim à própria vida?</li><li>Pensou em como se mataria?</li><li>Já tentou se matar ou fez algum preparativo?</li><li>Tem esperança de ser ajudado?</li></ol>
<blockquote><p>Perguntar diretamente sobre suicídio <strong>não induz</strong> o ato. Evitar o tema é o que deixa o risco sem avaliação.</p></blockquote>
<h3>O que investigar</h3>
<div class="tbl"><table><thead><tr><th>Eixo</th><th>O que levantar</th></tr></thead><tbody><tr><td>Apresentação</td><td>Ideação, plano e intenção; letalidade do método cogitado; desesperança, impulsividade e ansiedade; razões para viver e planos para o futuro; uso de álcool e drogas; violência contra outros</td></tr><tr><td>Doenças psiquiátricas</td><td>Transtornos do humor, esquizofrenia, uso de substâncias, ansiedade, personalidade borderline e antissocial; diagnósticos e tratamentos anteriores</td></tr><tr><td>História</td><td>Tentativas prévias e outros comportamentos autolesivos; doenças e tratamentos clínicos; <strong>história familiar de suicídio</strong> e de doença mental</td></tr><tr><td>Situação psicossocial</td><td>Crises agudas e estressores crônicos (perdas, dificuldade financeira, discórdia familiar, violência doméstica, abuso); ocupação, moradia, presença de crianças em casa, apoio externo; crenças culturais e religiosas sobre a morte</td></tr><tr><td>Vulnerabilidade e pontos fortes</td><td>Habilidade de enfrentamento, traços de personalidade, respostas anteriores ao estresse, teste de realidade, tolerância ao sofrimento psicológico</td></tr></tbody></table></div>

<p>A escala da OMS gradua o risco de 0 a 6 e amarra cada nível a uma conduta. Do <strong>1 ao 4</strong> — perturbação emocional leve, ideias vagas de morte, ideias vagas de suicídio, ideias de suicídio <strong>sem</strong> transtorno mental — a conduta é <strong>ouvir com empatia</strong>, indagar sobre ideação e investigar intenção (plano e método) e possibilidades de apoio. No <strong>5</strong>, ideias de suicídio <strong>com transtorno mental ou estressor social grave</strong>, investiga-se plano e método, <strong>estabelece-se um contrato</strong> e encaminha-se a cuidados psiquiátricos. No <strong>6</strong>, ideias de suicídio com transtorno mental ou estressor grave <strong>ou com agitação e tentativa prévia</strong>, a conduta é <strong>hospitalizar e não deixar o paciente sozinho</strong>, para impedir o acesso a meios.</p>

<div class="tbl"><table><thead><tr><th>Pergunta</th><th>Pontos</th></tr></thead><tbody><tr><td>No último mês, pensou que seria melhor estar morto ou desejou estar morto?</td><td>1</td></tr><tr><td>Quis fazer mal a si mesmo?</td><td>2</td></tr><tr><td>Pensou em suicídio?</td><td>6</td></tr><tr><td>Pensou numa maneira de se suicidar?</td><td><strong>10</strong></td></tr><tr><td>Tentou o suicídio?</td><td><strong>10</strong></td></tr><tr><td>Ao longo da vida, já fez alguma tentativa?</td><td>4</td></tr></tbody></table></div>
<ul><li><strong>Baixo risco (1 a 5 pontos):</strong> trabalhar os sentimentos suicidas, conversando com o paciente para diminuir a confusão emocional.</li><li><strong>Risco moderado (6 a 9 pontos):</strong> em geral está indicada intervenção psiquiátrica, e a família deve ser comunicada do risco.</li><li><strong>Alto risco (10 pontos ou mais):</strong> emergência, com <strong>internação psiquiátrica imediata</strong>.</li></ul>
<p>Repare na consequência da pontuação: ter pensado numa <strong>maneira</strong> de se matar, ou ter tentado no último mês, coloca o paciente sozinho no alto risco.</p>
<h3>Fatores de risco</h3>
<ul><li><strong>Sociodemográficos:</strong> sexo masculino; idade entre <strong>15 e 35 anos</strong> e <strong>acima de 75</strong>; estratos econômicos extremos; residência urbana; desemprego, sobretudo perda recente; aposentadoria; isolamento social; solteiros ou separados; migrantes.</li><li><strong>Psicológicos:</strong> perdas recentes; perda de figuras parentais na infância; dinâmica familiar conturbada; datas importantes e reações de aniversário; personalidade com traços marcantes de impulsividade, agressividade e humor lábil.</li><li><strong>Condições clínicas incapacitantes:</strong> doenças orgânicas incapacitantes, dor crônica, lesões desfigurantes perenes, epilepsia, trauma medular, neoplasias malignas, AIDS.</li></ul>
<hr>
<h2>Objetivos do atendimento e indicações de internação</h2>
<p>Todo atendimento psiquiátrico de emergência persegue quatro objetivos:</p>
<ol><li><strong>Estabilização do quadro</strong>: controle do sintoma-alvo.</li><li><strong>Hipótese diagnóstica</strong>: a etiologia mais provável, mesmo que provisória.</li><li><strong>Exclusão de causa orgânica</strong>: pela história, pelo exame psíquico — nível de consciência, atenção, sensopercepção — e por exames complementares.</li><li><strong>Encaminhamento</strong>: alta, tratamento ambulatorial, internação de observação ou internação psiquiátrica.</li></ol>
<h3>Quando internar</h3>
<ul><li>Risco de suicídio, de agressão ou de homicídio.</li><li>Autonegligência grave.</li><li>Refratariedade ou doença de difícil controle no ambulatório.</li><li>Troca de esquema terapêutico que coloque o paciente em risco, por piora dos sintomas ou efeitos adversos.</li><li>Ausência do suporte familiar necessário ao tratamento.</li><li>Risco de exposição moral e de dano ao patrimônio — o exemplo típico é a mania.</li></ul>

<p>Na ideação ou tentativa de suicídio, as indicações se tornam mais específicas: alto risco de suicídio; ausência de recursos extra-hospitalares, com pouco suporte familiar; desgaste ou exaustão psicológica da família; <strong>tentativas progressivamente mais graves</strong>; recusa do paciente em fazer planos futuros, inclusive de tratamento ambulatorial; <strong>incongruência</strong> entre a história do paciente e uma fonte objetiva confiável, como a família; síndrome psicótica com alucinações ou delírios; <strong>fator que interfere com o nível de consciência ou o juízo crítico</strong> — intoxicação por álcool ou drogas, delirium — e impede a avaliação na emergência; e quadro psiquiátrico com indicação própria de internação, como a mania, mesmo sem psicose.</p>
<blockquote><p>O paciente que chega intoxicado após uma tentativa e "nega tudo" ainda sonolento não pode ser avaliado naquele momento. A negativa só vale quando a consciência e o juízo crítico permitem — até lá, ele fica.</p></blockquote>
<p>A Lei 10.216/2001 prevê três modalidades de internação psiquiátrica: <strong>voluntária</strong>, com consentimento do paciente; <strong>involuntária</strong>, a pedido de terceiro e sem consentimento, comunicada ao Ministério Público em até 72 horas; e <strong>compulsória</strong>, determinada pela Justiça.</p></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

/* ── header ────────────────────────────────────────────────────────────────── */
function renderHeader(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var left =
    '<div style="min-width:0">' +
      '<div style="display:flex;align-items:center;gap:8px;'+mono+';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8a8578">' +
        '<a href="'+idxHref()+'" class="h-ink" style="color:#2b57cc;text-decoration:none;white-space:nowrap">\u2190 Materiais</a>' +
        '<span style="color:#d3cec4">/</span>' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(EYEBROW)+'</span>' +
      '</div>' +
      '<h1 style="margin:1px 0 0;font-family:\'Newsreader\',Georgia,serif;font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.15">'+esc(TITLE)+'</h1>' +
    '</div>';

  var right = '';
  if (S.view === 'quiz' && S.started) {
    var hit = counts().hit;
    right = '<div style="display:flex;align-items:center;gap:10px;flex-shrink:0">' +
              '<button type="button" data-act="sair" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:9px;padding:6px 11px;'+mono+';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">Sair</button>' +
              '<div style="display:flex;align-items:center;gap:6px">' +
                '<span style="'+mono+';font-size:15px;font-weight:600;letter-spacing:-.02em">'+hit+'</span>' +
                '<span style="'+mono+';font-size:11px;color:#8a8578">/ '+S.order.length+'</span>' +
              '</div></div>';
  } else if (S.view !== 'home') {
    right = '<button type="button" data-act="home" class="h-line" style="flex-shrink:0;background:none;border:1px solid #ddd8ce;border-radius:9px;padding:7px 13px;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">← Início</button>';
  }

  var html = '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:'+(S.view==='quiz'&&S.started?'10px':'2px')+'">'+left+right+'</div>';

  if (S.view === 'quiz' && S.started) {
    var c = counts();
    var rail = S.order.map(function(q,n){
      var a = S.answers[n], cur = n===S.i && !S.finished, bg = '#d3cec4';
      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';
      if (cur && a===null) bg = '#121a2b';
      var st = a===null ? 'em branco' : (a===q.correctIndex ? 'correta' : 'incorreta');
      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +
             '<span style="display:block;width:100%;border-radius:99px;transition:height .18s ease,background .18s ease,box-shadow .18s ease;height:'+(cur?'17px':'9px')+';background:'+bg+';box-shadow:'+(cur?'0 0 0 3px rgba(18,26,43,.13)':'none')+'"></span></button>';
    }).join('');
    html += '<div><div style="display:flex;align-items:center;gap:3px">'+rail+'</div>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-2px">' +
              '<div style="'+mono+';font-size:11px;letter-spacing:.04em;color:#5b6478">Questão '+pad(S.i+1)+' / '+S.order.length+'</div>' +
              '<div style="display:flex;align-items:center;gap:12px;'+mono+';font-size:10.5px;color:#8a8578">' +
                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +
              '</div></div></div>';
  }
  document.getElementById('hdr').innerHTML = html;
}
function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +
      '</button>';
  }).join('');

  var expl = reveal ? '<div style="margin-top:20px;padding:16px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;animation:qFade .26s ease">' +
      '<div style="'+mono+';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:8px">Por quê</div>' +
      '<p style="margin:0;font-size:14.5px;line-height:1.68;color:#39404f;text-wrap:pretty">'+esc(q.explanation)+'</p></div>' : '';

  var blank = counts().blank;
  var warn = S.warn ? '<div style="margin-top:14px;padding:15px 17px;background:#fdf7e9;border:1px solid #e8d5a3;border-radius:14px;animation:qFade .22s ease">' +
      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +

        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
        (reveal ? chatBox(q, ans===q.correctIndex) : '') +
      '</article>' + warn +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px">' +
        '<button type="button" data-act="prev" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:12px 18px;font-size:14px;cursor:pointer;transition:border-color .15s ease,color .15s ease;color:'+(S.i===0?'#c4bfb4':'#121a2b')+';pointer-events:'+(S.i===0?'none':'auto')+'">← Anterior</button>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          (early ? '<button type="button" data-act="finish" class="h-ink" style="background:none;border:0;padding:12px 6px;'+mono+';font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a8578;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Finalizar</button>' : '') +
          '<button type="button" data-act="next" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">'+(last?'Finalizar':'Próxima →')+'</button>' +
        '</div></div></section>';
}

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';
  if (pct>=90)      { title='Domínio sólido';   msg='Desempenho excelente. Confira as explicações das que escaparam e siga em frente.'; }
  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

  var stat = function(v,l,color){
    return '<div style="background:#faf9f6;padding:14px 10px">' +
      '<div style="'+mono+';font-size:19px;font-weight:500;color:'+color+'">'+v+'</div>' +
      '<div style="'+mono+';font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#8a8578;margin-top:2px">'+l+'</div></div>';
  };

  var fdefs = [['all','Todas',c.total],['wrong','Erradas',c.miss],['right','Certas',c.hit],['blank','Em branco',c.blank]];
  var filters = fdefs.map(function(f){
    var on = S.filter===f[0];
    return '<button type="button" data-act="filter" data-k="'+f[0]+'" class="h-line" style="border-radius:99px;padding:8px 14px;font-size:13px;cursor:pointer;transition:all .15s ease;border:1px solid '+(on?'#121a2b':'#ddd8ce')+';background:'+(on?'#121a2b':'transparent')+';color:'+(on?'#f5f3ef':'#5b6478')+'">'+f[1]+' '+f[2]+'</button>';
  }).join('');

  var list = reviewList();
  var allOpen = list.length>0 && list.every(function(r){ return S.open[r.idx]; });

  var cards = list.map(function(r){
    var numBg='#f0ede7', numFg='#8a8578';
    if (!r.blank) { if (r.ok) { numBg='#e3f0e8'; numFg='#1f5c3e'; } else { numBg='#fbe6e2'; numFg='#8f2f25'; } }
    var open = !!S.open[r.idx];
    var body = '';
    if (open) {
      var opts = r.q.options.map(function(text,n){
        var isC = n===r.q.correctIndex, isMine = n===r.a;
        var bd='#eeebe4', bg='#fbfaf8', fg='#5b6478', bBg='#f0ede7', bFg='#8a8578', tag='', tBg='', tFg='';
        if (isC)            { bd='#bcdcc9'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; tag='Correta'; tBg='#d9ede1'; tFg='#1f5c3e'; }
        if (isMine && !isC) { bd='#eec4bd'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; tag='Sua resposta'; tBg='#f7ddd8'; tFg='#8f2f25'; }
        if (isMine && isC)  { tag='Sua resposta ✓'; }
        return '<div style="display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:11px;font-size:14px;line-height:1.5;border:1px solid '+bd+';background:'+bg+';color:'+fg+'">' +
          '<span style="flex-shrink:0;width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:10.5px;font-weight:600;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
          '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
          (tag ? '<span style="flex-shrink:0;'+mono+';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;margin-top:1px;background:'+tBg+';color:'+tFg+'">'+tag+'</span>' : '') +
          '</div>';
      }).join('');
      body = '<div style="padding:2px 15px 18px;animation:qDrawer .2s ease">' +
        '<div style="height:1px;background:#eeebe4;margin:0 0 16px"></div>' +
        '<p style="font-family:\'Newsreader\',Georgia,serif;font-size:18px;line-height:1.5;margin:0 0 16px;text-wrap:pretty">'+esc(r.q.question)+'</p>' +
        figura(r.q) +
        '<div style="display:flex;flex-direction:column;gap:7px">'+opts+'</div>' +
        '<div style="margin-top:16px;padding:14px 16px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 11px 11px 0">' +
          '<div style="'+mono+';font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:7px">Por quê</div>' +
          '<p style="margin:0;font-size:14px;line-height:1.65;color:#39404f;text-wrap:pretty">'+esc(r.q.explanation)+'</p></div>' +
        '<button type="button" data-act="jump" data-n="'+r.idx+'" style="margin-top:14px;background:none;border:0;padding:0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#2b57cc;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Abrir no quiz →</button></div>';
    }
    return '<div style="background:#fff;border:1px solid '+(open?'#c9c3b6':'#e4e0d8')+';border-radius:14px;overflow:hidden;transition:border-color .15s ease">' +
      '<button type="button" data-act="toggle" data-n="'+r.idx+'" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 15px;cursor:pointer">' +
        '<span style="flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:12px;font-weight:600;background:'+numBg+';color:'+numFg+'">'+pad(r.idx+1)+'</span>' +
        '<span style="flex:1;min-width:0;font-size:14px;line-height:1.45;color:#39404f;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(r.q.question)+'</span>' +
        '<span style="flex-shrink:0;'+mono+';font-size:16px;color:#8a8578;width:16px;text-align:center">'+(open?'−':'+')+'</span>' +
      '</button>' + body + '</div>';
  }).join('');

  document.getElementById('stage').innerHTML =
    '<section style="padding:34px 0 0;animation:qFade .3s ease">' +
      '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:14px">Resultado</div>' +
      '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:36px;line-height:1.12;font-weight:400;letter-spacing:-.025em;margin:0 0 8px">'+title+'</h2>' +
      '<p style="font-size:15px;line-height:1.6;color:#5b6478;margin:0 0 24px;max-width:48ch;text-wrap:pretty">'+msg+'</p>' +

      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e4e0d8;border:1px solid #e4e0d8;border-radius:14px;overflow:hidden;margin-bottom:34px">' +
        stat(c.hit,'Certas','#2e7d55')+stat(c.miss,'Erradas','#c04437')+stat(c.blank,'Branco','#8a8578')+stat(pct+'%','Aproveit.','#2b57cc') +
      '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px">' +
        '<h3 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;font-weight:500;letter-spacing:-.015em;margin:0">Gabarito comentado</h3>' +
        '<button type="button" data-act="toggleAll" class="h-ink" style="background:none;border:0;padding:6px 0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;text-decoration:underline;text-underline-offset:3px">'+(allOpen?'Recolher tudo':'Expandir tudo')+'</button>' +
      '</div>' +
      '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">'+filters+'</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">'+cards+'</div>' +
      (list.length===0 ? '<div style="padding:38px 16px;text-align:center;color:#8a8578;font-size:14px;border:1px dashed #ddd8ce;border-radius:14px">Nenhuma questão neste filtro.</div>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:28px;padding-top:24px;border-top:1px solid #e4e0d8">' +
        '<button type="button" data-act="restart" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:13px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">Refazer o quiz</button>' +
        '<button type="button" data-act="back" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Voltar às questões</button>' +
        '<button type="button" data-act="resumo" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Ler o resumo</button>' +
      '</div></section>';
}

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
