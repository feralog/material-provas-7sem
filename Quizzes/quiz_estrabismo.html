<script type="text/html" id="resumoSrc"><h2>O desvio e o seu nome</h2>
<p>Estrabismo é qualquer desvio do alinhamento ocular. Não é um diagnóstico único, e sim uma categoria que reúne desde o desvio grosseiro do lactente até a foria que só aparece no fim de um dia cansativo. A primeira coisa a definir diante de um paciente é <strong>como</strong> o desvio se apresenta, porque isso já separa o que é urgência funcional do que é achado de exame:</p>
<ul><li><strong>Constante</strong> — o desvio está presente o tempo todo, em qualquer condição de exame.</li><li><strong>Intermitente</strong> — aparece e desaparece, tipicamente com fadiga, doença, distração ou luz intensa.</li><li><strong>Latente</strong> — só existe quando a fusão binocular é quebrada por uma manobra dissociante, como a oclusão de um dos olhos.</li></ul>
<p>O alinhamento normal recebe o nome de <strong>ortotropia</strong> (quando manifesto) ou <strong>ortoforia</strong> (quando o alinhamento se mantém mesmo sob dissociação). Fora disso, o desvio é nomeado por duas peças encaixadas: um <strong>prefixo</strong>, que diz para onde o olho vai, e um <strong>sufixo</strong>, que diz se ele já está lá ou se a fusão ainda o segura.</p>
<div class="tbl"><table><thead><tr><th>Sentido do desvio</th><th>Latente — a fusão controla</th><th>Manifesto — visível ao exame</th></tr></thead><tbody><tr><td>Convergente, para dentro</td><td>Esoforia</td><td><strong>Esotropia (ET)</strong></td></tr><tr><td>Divergente, para fora</td><td>Exoforia</td><td><strong>Exotropia (XT)</strong></td></tr><tr><td>Para cima</td><td>Hiperforia</td><td>Hipertropia</td></tr><tr><td>Para baixo</td><td>Hipoforia</td><td>Hipotropia</td></tr><tr><td>Torcional, polo superior para dentro</td><td>Incicloforia</td><td>Inciclotropia</td></tr><tr><td>Torcional, polo superior para fora</td><td>Excicloforia</td><td>Exciclotropia</td></tr></tbody></table></div>
<blockquote><p><strong>Foria não é tropia.</strong> O sufixo <em>-foria</em> marca o desvio latente: os olhos estão alinhados no dia a dia porque a fusão os mantém assim, e o desvio só é revelado quando se ocluiu um olho. O sufixo <em>-tropia</em> marca o desvio manifesto, que existe sem nenhuma manobra. Essa distinção não é semântica: muda a queixa, muda o risco de ambliopia e muda a indicação de tratamento.</p></blockquote>
<p>O exame da motilidade percorre a <strong>posição primária do olhar (PPO)</strong>, olhando de frente, as quatro <strong>posições secundárias</strong> (direita, esquerda, cima, baixo) e as quatro <strong>terciárias</strong> (as diagonais), além das <strong>inclinações laterais da cabeça</strong> para cada ombro. São essas nove posições, mais as duas inclinações, que transformam "o olho está torto" em um diagnóstico de qual músculo falha.</p>
<hr>
<h2>Como se mede o alinhamento</h2>
<h3>Observação desarmada</h3>
<p>Às vezes basta olhar. O desvio evidente, o torcicolo, a ptose, a posição de cabeça adotada espontaneamente — tudo isso aparece antes de qualquer instrumento e já orienta o resto do exame.</p>
<h3>Hirschberg e o ângulo kappa</h3>
<p>O teste de Hirschberg usa apenas uma lanterna projetada de frente: observa-se a posição do reflexo luminoso sobre cada córnea. Reflexos simétricos e centrados sugerem alinhamento; reflexo descentrado em um olho indica desvio. É rápido, não exige cooperação e serve em qualquer idade.</p>
<p>A leitura, porém, precisa levar em conta o <strong>ângulo kappa</strong> — o ângulo formado entre o eixo anatômico do globo e o eixo visual real, aquele que passa pela fóvea. Como a fóvea costuma estar levemente temporal ao polo posterior, um kappa pequeno é fisiológico. Quando é acentuado, ele desloca o reflexo e simula um desvio inexistente.</p>
<ul><li><strong>Reflexo deslocado medialmente (nasalmente)</strong> → kappa <strong>positivo</strong> → simula exotropia.</li><li><strong>Reflexo deslocado lateralmente (temporalmente)</strong> → kappa <strong>negativo</strong> → simula esotropia.</li></ul>

<blockquote><p><strong>A armadilha do primeiro ano de vida é o pseudoestrabismo.</strong> No lactente com <strong>epicanto amplo</strong> e base nasal larga, a prega cobre a esclera do lado nasal e cria a ilusão de convergência: os pais veem "olhos tortos" e o olho está perfeitamente alinhado. O que desfaz a dúvida é a dupla reflexo corneano centrado <strong>e</strong> cover-test sem movimento de refixação. Confirmado o pseudoestrabismo, nada se trata — apenas se acompanha.</p></blockquote>
<h3>Cover-test</h3>
<p>O cover-test é o exame que separa tropia de foria e quantifica cada uma:</p>
<ul><li><strong>Cover-uncover</strong> — cobre-se um olho e observa-se o <strong>outro</strong>. Se o olho descoberto se move para assumir a fixação, é porque não estava fixando: existe uma <strong>tropia</strong>. O sentido do movimento revela o tipo — o olho que vem de fora para dentro estava em exotropia; o que vem de dentro para fora estava em esotropia. Como a visão binocular é devolvida a cada etapa, mede-se apenas a parcela manifesta.</li><li><strong>Cover alternado</strong> — o oclusor passa de um olho ao outro sem permitir que os dois vejam juntos, <strong>impedindo a refusão</strong>. Com isso soma-se a tropia à foria e obtém-se o <strong>desvio total</strong>, o desvio máximo do paciente.</li><li><strong>Cover-test com prismas</strong> — interpõem-se prismas de potência crescente à frente do olho desviado até <strong>anular o movimento</strong> de refixação. A potência que neutraliza o movimento é a medida do desvio, expressa em dioptrias prismáticas (Δ).</li></ul>
<h3>Krimsky</h3>
<p>Quando a criança é pequena demais para cooperar com a oclusão e com a fixação sustentada, usa-se o <strong>Krimsky</strong>: prismas são colocados à frente do olho até que os reflexos corneanos fiquem <strong>simétricos</strong> nas duas córneas. A potência necessária corresponde ao desvio. É o método de escolha em bebês, justamente por dispensar a cooperação que o cover-test exige.</p>

<h3>A idade já é um dado diagnóstico</h3>
<p>A anamnese e o exame completo direcionam o raciocínio, e o primeiro item da identificação do paciente vale como triagem de hipóteses:</p>
<div class="tbl"><table><thead><tr><th>Faixa etária</th><th>Desvio mais provável</th></tr></thead><tbody><tr><td>Bebês</td><td>Desvio <strong>congênito</strong></td></tr><tr><td>Crianças pequenas</td><td>Desvio <strong>essencial</strong></td></tr><tr><td>Adultos</td><td>Desvio <strong>adquirido</strong> — e, portanto, com causa a investigar</td></tr></tbody></table></div>
<hr>
<h2>Esotropias</h2>
<p>A esotropia é o desvio convergente. As formas clínicas reconhecidas são a <strong>ET congênita</strong>, a <strong>ET comitante adquirida</strong>, a <strong>ET acomodativa</strong>, a <strong>ET parcialmente acomodativa</strong>, a <strong>microtropia</strong>, a <strong>ET cíclica</strong> (rara), a <strong>ET com miopia</strong> e a <strong>ET do adulto</strong> (Franceschetti e Bielschowsky). Três delas concentram a prática e a prova.</p>
<h3>Esotropia congênita</h3>
<p>Surge nos <strong>primeiros meses de vida</strong>, geralmente até os 6 meses. Antes de firmar o diagnóstico é obrigatório diferenciá-la da incoordenação transitória dos movimentos oculares por <strong>imaturidade nervosa</strong>, comum nas primeiras semanas e de resolução espontânea.</p>
<p>A forma mais dramática é a <strong>síndrome de Ciancia</strong>, cujo conjunto é bastante característico:</p>
<ul><li>Surgimento muito precoce, <strong>antes dos 4 meses</strong>.</li><li><strong>Grande ângulo</strong> de desvio, acima de <strong>35Δ</strong>.</li><li><strong>Fixação em adução com torcicolo</strong> — a criança gira a cabeça para o lado do olho fixador.</li><li><strong>Limitação bilateral da abdução</strong> e <strong>nistagmo sacádico</strong>.</li></ul>

<p>O tratamento tem ordem fixa: primeiro a <strong>ambliopia</strong>, com <strong>oclusão total alternada</strong> para igualar a visão dos dois olhos; depois a <strong>correção cirúrgica</strong>, buscando <strong>alinhamento precoce</strong>. A pressa não é estética — a chance de desenvolver alguma binocularidade depende de o desvio ser corrigido enquanto o sistema visual ainda é plástico.</p>
<h3>Esotropia essencial</h3>
<p>Aparece entre <strong>1 e 3 anos</strong>, podendo se estender até os 6 ou 7. O início pode ser <strong>súbito</strong>, com frequência após um episódio de estresse ou doença, ou <strong>insidioso e progressivo</strong>. Costuma ser <strong>alternante</strong>, embora possa haver olho preferido, e a <strong>ambliopia é comum e de grau variável</strong>. O tratamento repete a sequência: reconhecer e tratar a ambliopia com refração e oclusão, e só então operar, observando antes a estabilidade do desvio. O objetivo cirúrgico realista é melhorar o alinhamento até um <strong>microdesvio</strong>, não a perfeição geométrica.</p>
<h3>Esotropia acomodativa</h3>
<p>Acomodação e convergência são reflexos acoplados. Na criança hipermetrope não corrigida, o esforço acomodativo necessário para focalizar arrasta consigo <strong>convergência excessiva</strong> e produz o desvio. O surgimento é variável, em geral entre <strong>2 e 4 anos</strong>; o desvio é variável, anotado como <strong>E(T)</strong>; pode haver <strong>diplopia</strong> no início, embora ela costume estar ausente.</p>
<p>O tratamento é <strong>óptico</strong>: corrigida a hipermetropia com <strong>óculos</strong>, cessa o esforço acomodativo excessivo e o desvio desaparece. A resposta aos óculos é, ela mesma, o teste diagnóstico.</p>

<blockquote><p>Na forma <strong>parcialmente acomodativa</strong> a lente resolve só uma parte do desvio e sobra um ângulo residual. A cirurgia opera <strong>apenas o desvio residual</strong> — operar o desvio total levaria à hipercorreção assim que o paciente voltasse a usar os óculos, convertendo a esotropia em exotropia consecutiva.</p></blockquote>
<hr>
<h2>Exotropias</h2>
<p>A exotropia é o desvio divergente, e as formas clínicas são a <strong>pseudo-XT</strong>, a <strong>exoforia</strong>, a <strong>XT intermitente</strong>, a <strong>XT manifesta</strong> e a <strong>XT consecutiva</strong>.</p>
<h3>Exotropia intermitente</h3>
<p>Não há correspondência com o erro refracional e <strong>raramente se encontra ambliopia</strong>, porque a binocularidade se mantém na maior parte do tempo. O sinal clássico é o paciente <strong>fechar o olho que desvia sob luz intensa</strong>, como ao sair ao sol: a luz quebra a fusão e o olho desviado é suprimido. O tratamento oclusivo só tem papel <strong>até cerca dos 5 anos</strong>; depois disso, a conduta é cirúrgica.</p>
<h3>Exotropia manifesta</h3>
<p>Pode ser congênita ou adquirida, primária ou secundária. Tem <strong>pouca relação com a refração</strong>, <strong>maior associação com alterações neurológicas</strong> e, por ser um desvio permanente, <strong>não há estereopsia</strong>. É a forma que mais exige investigação além do olho.</p>
<h3>Exotropia consecutiva</h3>
<p>É a exotropia que se instala <strong>após a correção de uma esotropia</strong> — embora exista também a forma espontânea, sem cirurgia prévia. Divide-se pelo tempo de aparecimento:</p>
<ul><li><strong>Precoce</strong> — cirurgia exagerada ou <strong>má técnica</strong>, tipicamente o músculo escorregado (<em>slipped muscle</em>).</li><li><strong>Tardia</strong> — cirurgia exagerada somada a fatores de risco do próprio paciente.</li></ul>
<hr>
<h2>Estrabismos paralíticos: os três nervos</h2>
<p>Quando o desvio não vem de um desequilíbrio de forças, mas da falha de um nervo, o quadro muda de natureza: passa a ser <strong>incomitante</strong> (o ângulo varia conforme a direção do olhar), costuma cursar com <strong>diplopia</strong> no paciente que já tinha visão binocular madura, e frequentemente vem acompanhado de uma <strong>posição compensadora de cabeça</strong>, adotada para encontrar o campo em que as duas imagens ainda se fundem.</p>
<div class="tbl"><table><thead><tr><th>Nervo</th><th>Músculo(s)</th><th>Desvio em PPO</th><th>Posição compensadora da cabeça</th></tr></thead><tbody><tr><td><strong>III — oculomotor</strong></td><td>Retos medial, superior e inferior, oblíquo inferior, levantador da pálpebra e via pupilar</td><td><strong>Exotropia</strong> acentuada, com paralisia vertical</td><td>Em geral ausente ou inútil — a ptose e a perda da fusão impedem a compensação</td></tr><tr><td><strong>IV — troclear</strong></td><td>Oblíquo superior</td><td><strong>Hipertropia</strong> do olho acometido, com componente torcional</td><td><strong>Torcicolo</strong>: cabeça inclinada para o ombro <strong>oposto</strong> ao olho parético</td></tr><tr><td><strong>VI — abducente</strong></td><td>Reto lateral</td><td><strong>Esotropia</strong>, com limitação da abdução</td><td>Face <strong>rodada para o lado</strong> do músculo paralisado</td></tr></tbody></table></div>
<blockquote><p>Toda paralisia adquirida exige <strong>avaliação clínica e neurológica</strong> completa, sem exceção. O estrabismo, aqui, é apenas o sinal visível de uma doença que está em outro lugar: um aneurisma, um tumor, uma hipertensão intracraniana, uma vasculopatia.</p></blockquote>
<hr>
<h2>Paralisia do VI nervo</h2>
<p>É o <strong>estrabismo paralítico mais frequente</strong> e <strong>raramente congênito</strong>. O nervo abducente emerge da <strong>ponte</strong>, percorre um longo trajeto intracraniano, atravessa a <strong>fissura orbitária superior</strong> e inerva exclusivamente o <strong>reto lateral</strong> — esse trajeto longo é justamente o que o torna vulnerável.</p>
<p>Paralisado o reto lateral, a abdução se abole e o reto medial fica sem oposição: instala-se <strong>esotropia acentuada em PPO, entre 30Δ e 35Δ</strong>. O desvio <strong>pode aumentar com o tempo</strong>, por <strong>contratura do reto medial</strong>, e esse é o principal inimigo do prognóstico.</p>
<h4>Etiologia</h4>
<ul><li><strong>Diabetes mellitus</strong> — a causa microvascular clássica no adulto.</li><li>Traumatismos e inflamações.</li><li><strong>Síndrome de Gradenigo</strong> — otite e mastoidite que se estendem ao ápice petroso e acometem o <strong>V e o VI</strong> nervos, somando dor facial trigeminal à paralisia do reto lateral.</li><li>Vasculopatias.</li><li>Tumores — na criança, o <strong>glioma de tronco</strong>.</li><li><strong>Hipertensão intracraniana</strong>.</li><li>Infecções virais, sobretudo na criança.</li><li>Causas indeterminadas.</li></ul>
<h4>Tratamento</h4>
<p>A conduta inicial é <strong>observar a melhora espontânea</strong>, que é a regra nas formas microvasculares, com <strong>oclusão de alívio</strong> para a diplopia. Em paralelo, o objetivo é <strong>evitar a contratura do reto medial</strong>: a <strong>toxina botulínica</strong> aplicada no reto medial o paralisa temporariamente e impede o encurtamento, ao custo de duas desvantagens conhecidas — <strong>blefaroptose</strong> e <strong>desvio vertical</strong> por difusão.</p>
<p>A cirurgia só entra depois de <strong>no mínimo 6 meses</strong>, com avaliação completa <strong>a cada 15 dias</strong> nesse intervalo. As metas são reequilibrar as forças quando ainda é possível ou, quando não é, criar uma <strong>força estática</strong> que sustente o alinhamento.</p>
<hr>
<h2>Paralisias do III e do IV nervos</h2>
<h3>III nervo — oculomotor</h3>
<p>É o desvio paralítico <strong>menos frequente</strong> e pode ser congênito, embora raramente. O III inerva os retos medial, superior e inferior, o oblíquo inferior, o levantador da pálpebra e a via parassimpática pupilar; na paralisia <strong>completa</strong>, sobram funcionantes apenas o <strong>reto lateral</strong> (VI) e o <strong>oblíquo superior</strong> (IV), o que explica todo o quadro e lhe dá o <strong>pior prognóstico</strong> entre os desvios paralíticos:</p>
<ul><li><strong>Exotropia acentuada</strong> em PPO.</li><li><strong>Ausência de movimentos verticais</strong> e <strong>hipotropia discreta</strong>.</li><li><strong>Intorção</strong>.</li><li><strong>Blefaroptose</strong>.</li><li><strong>Midríase</strong> e <strong>paralisia da acomodação</strong>.</li></ul>
<p>Pode haver melhora espontânea ou regressão parcial em até 6 meses. Na etiologia adquirida, o <strong>traumatismo craniano</strong> vem em primeiro lugar e as <strong>vasculopatias</strong> em segundo — aneurismas, hipertensão arterial e diabetes —, seguidos de tumores, hipertensão intracraniana e causas iatrogênicas. A associação de midríase obriga a afastar <strong>aneurisma</strong> comprimindo o nervo. O tratamento observa a melhora espontânea nas formas vasculares, usa oclusão de alívio e toxina botulínica, e recorre à cirurgia para reequilibrar forças ou debilitar antagonistas em busca de alinhamento — sem correção do componente vertical.</p>
<h3>IV nervo — troclear</h3>
<p>A etiologia divide-se em congênita e adquirida. Entre as adquiridas estão o <strong>traumatismo craniano</strong>, que caracteristicamente produz <strong>paralisia bilateral</strong>, a <strong>síndrome da mordida de cão</strong>, com lesão direta no tendão do oblíquo superior, e as formas idiopáticas.</p>
<p>O quadro clínico se organiza em torno de quatro elementos encadeados: <strong>diplopia</strong> vertical, a <strong>fusão</strong> que o paciente ainda consegue obter em alguma posição, a <strong>posição compensadora de cabeça</strong> que essa fusão exige, e a <strong>manobra de Bielschowsky</strong>, que fecha o diagnóstico. Na manobra, inclina-se a cabeça para cada ombro e observa-se o desvio vertical: na paralisia do oblíquo superior, a hipertropia do olho acometido <strong>aumenta</strong> quando a cabeça é inclinada para o mesmo lado.</p>

<blockquote><p><strong>Visão binocular normal = torcicolo.</strong> O torcicolo não é vício postural: é a estratégia que mantém a fusão. Casos muito discretos podem ser resolvidos com <strong>prisma vertical</strong>, mas o tratamento é <strong>essencialmente cirúrgico</strong>, com três metas simultâneas — corrigir o desvio, corrigir o torcicolo e eliminar a diplopia.</p></blockquote>
<hr>
<h2>Ambliopia: o que torna o estrabismo infantil uma urgência</h2>
<p>Dois olhos desalinhados enviam ao cérebro duas imagens incompatíveis. O cérebro adulto responde com diplopia; o cérebro imaturo faz outra coisa — <strong>suprime</strong> a imagem do olho desviado. Sem estímulo, esse olho não desenvolve acuidade normal e se instala a <strong>ambliopia</strong>. Como o período de plasticidade visual é limitado aos primeiros anos de vida, cada mês de atraso reduz a chance de recuperação: o estrabismo da criança pequena é uma urgência funcional, ainda que o olho seja anatomicamente perfeito.</p>
<p>O princípio do tratamento decorre diretamente do mecanismo:</p>
<ol><li><strong>Corrigir o erro refracional</strong> primeiro — sem imagem nítida, nenhuma oclusão funciona.</li><li><strong>Ocluir o olho de melhor visão</strong>, forçando o uso do olho amblíope e estimulando a sua via visual.</li><li>Quando a criança <strong>alterna</strong> a fixação espontaneamente, como na esotropia congênita de grande ângulo, usar <strong>oclusão total alternada</strong>.</li><li>Só depois de tratada a ambliopia, <strong>operar</strong> o alinhamento.</li></ol>
<blockquote><p>A ordem importa: operar antes de tratar a ambliopia alinha os olhos e deixa a visão para trás. Alinhamento é resultado motor; visão é resultado sensorial — e o segundo tem prazo de validade.</p></blockquote>
<hr>
<h2>Técnicas cirúrgicas</h2>
<p>A cirurgia de estrabismo trabalha com um repertório pequeno e bem definido: <strong>retrocesso de músculos retos</strong>, <strong>ressecção de músculos retos</strong>, <strong>transposição muscular</strong> e as <strong>cirurgias de oblíquos</strong>, que incluem os <strong>debilitamentos do oblíquo inferior</strong> e os procedimentos sobre o <strong>tendão do oblíquo superior</strong>.</p>
<h3>Retrocesso</h3>
<p>O músculo é desinserido e <strong>reinserido posteriormente à inserção original</strong>, medindo-se a distância do recuo com compasso. Encurtar o braço de alavanca reduz a força do músculo sobre o globo.</p>

<h3>Ressecção</h3>
<p>Um segmento do músculo é removido e o coto é reinserido na inserção original. O músculo encurtado passa a tracionar mais o globo.</p>
<blockquote><p><strong>Retrocesso enfraquece, ressecção fortalece.</strong> É a dupla que resolve a maior parte dos desvios horizontais: enfraquece-se o músculo que puxa demais e fortalece-se o seu antagonista, no mesmo olho ou em olhos diferentes, conforme o ângulo a corrigir. A transposição, por sua vez, não regula força — ela <strong>redireciona</strong> a ação de um músculo, recurso reservado às paralisias em que o músculo próprio já não responde.</p></blockquote></script>

    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';
  if (pct>=90)      { title='Domínio sólido';   msg='Desempenho excelente. Confira as explicações das que escaparam e siga em frente.'; }
  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

  var stat = function(v,l,color){
    return '<div style="background:#faf9f6;padding:14px 10px">' +
      '<div style="'+mono+';font-size:19px;font-weight:500;color:'+color+'">'+v+'</div>' +

  };

  var fdefs = [['all','Todas',c.total],['wrong','Erradas',c.miss],['right','Certas',c.hit],['blank','Em branco',c.blank]];
  var filters = fdefs.map(function(f){
    var on = S.filter===f[0];
    return '<button type="button" data-act="filter" data-k="'+f[0]+'" class="h-line" style="border-radius:99px;padding:8px 14px;font-size:13px;cursor:pointer;transition:all .15s ease;border:1px solid '+(on?'#121a2b':'#ddd8ce')+';background:'+(on?'#121a2b':'transparent')+';color:'+(on?'#f5f3ef':'#5b6478')+'">'+f[1]+' '+f[2]+'</button>';
  }).join('');

  var list = reviewList();
  var allOpen = list.length>0 && list.every(function(r){ return S.open[r.idx]; });

  var cards = list.map(function(r){
    var numBg='#f0ede7', numFg='#8a8578';
    if (!r.blank) { if (r.ok) { numBg='#e3f0e8'; numFg='#1f5c3e'; } else { numBg='#fbe6e2'; numFg='#8f2f25'; } }
    var open = !!S.open[r.idx];
    var body = '';
    if (open) {
      var opts = r.q.options.map(function(text,n){
        var isC = n===r.q.correctIndex, isMine = n===r.a;

        if (isMine && !isC) { bd='#eec4bd'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; tag='Sua resposta'; tBg='#f7ddd8'; tFg='#8f2f25'; }

        figura(r.q) +
        '<div style="display:flex;flex-direction:column;gap:7px">'+opts+'</div>' +
        '<div style="margin-top:16px;padding:14px 16px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 11px 11px 0">' +
          '<div style="'+mono+';font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:7px">Por quê</div>' +
          '<p style="margin:0;font-size:14px;line-height:1.65;color:#39404f;text-wrap:pretty">'+esc(r.q.explanation)+'</p></div>' +
        '<button type="button" data-act="jump" data-n="'+r.idx+'" style="margin-top:14px;background:none;border:0;padding:0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#2b57cc;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Abrir no quiz →</button></div>';
    }
    return '<div style="background:#fff;border:1px solid '+(open?'#c9c3b6':'#e4e0d8')+';border-radius:14px;overflow:hidden;transition:border-color .15s ease">' +
      '<button type="button" data-act="toggle" data-n="'+r.idx+'" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 15px;cursor:pointer">' +
        '<span style="flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:12px;font-weight:600;background:'+numBg+';color:'+numFg+'">'+pad(r.idx+1)+'</span>' +
        '<span style="flex:1;min-width:0;font-size:14px;line-height:1.45;color:#39404f;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(r.q.question)+'</span>' +

  }).join('');

  document.getElementById('stage').innerHTML =
    '<section style="padding:34px 0 0;animation:qFade .3s ease">' +
      '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:14px">Resultado</div>' +

      '<p style="font-size:15px;line-height:1.6;color:#5b6478;margin:0 0 24px;max-width:48ch;text-wrap:pretty">'+msg+'</p>' +

        stat(c.hit,'Certas','#2e7d55')+stat(c.miss,'Erradas','#c04437')+stat(c.blank,'Branco','#8a8578')+stat(pct+'%','Aproveit.','#2b57cc') +

      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px">' +

        '<button type="button" data-act="toggleAll" class="h-ink" style="background:none;border:0;padding:6px 0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;text-decoration:underline;text-underline-offset:3px">'+(allOpen?'Recolher tudo':'Expandir tudo')+'</button>' +
      '</div>' +

      '<div style="display:flex;flex-direction:column;gap:8px">'+cards+'</div>' +
      (list.length===0 ? '<div style="padding:38px 16px;text-align:center;color:#8a8578;font-size:14px;border:1px dashed #ddd8ce;border-radius:14px">Nenhuma questão neste filtro.</div>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:28px;padding-top:24px;border-top:1px solid #e4e0d8">' +
        '<button type="button" data-act="restart" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:13px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">Refazer o quiz</button>' +
        '<button type="button" data-act="back" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Voltar às questões</button>' +
        '<button type="button" data-act="resumo" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Ler o resumo</button>' +
      '</div></section>';
}

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
