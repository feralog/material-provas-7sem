<script type="text/html" id="resumoSrc"><h2>O exame psíquico: ferramenta diagnóstica e linguagem entre médicos</h2>
<p>O exame psíquico é a grande <strong>ferramenta propedêutica diagnóstica da psiquiatria</strong> — e não é exclusividade do psiquiatra. O argumento é epidemiológico: o Brasil tem em média <strong>quase sete psiquiatras para cada 100.000 habitantes</strong>, cerca de <strong>75% concentrados no Sul e no Sudeste</strong>, enquanto a prevalência de <strong>depressão ao longo da vida gira em torno de 15%</strong>. Com essa conta, quadros <strong>leves de ansiedade e depressão são da atenção primária</strong>: o médico generalista precisa saber reconhecê-los e conduzi-los — e isso exige um bom exame psíquico. Além disso, toda especialidade atende pacientes psiquiátricos, e o exame psíquico funciona como <strong>linguagem de comunicação entre médicos</strong>: no hospital, decide-se sobre um pedido de vaga de internação lendo o exame psíquico redigido por outro médico — no caso, uma paciente descrita com <em>humor hipertímico, pensamento acelerado, logorreia, delírio de grandeza, persecutório e religioso, sem auto ou heteroagressividade e com insight prejudicado</em>.</p>
<blockquote><p><strong>Ponto-chave.</strong> Para Fuchs, a descrição psicopatológica <strong>converte a experiência do paciente em categorias de sintomas e sinais específicos definidos em terceira pessoa</strong>, promovendo informação objetiva compartilhada para diagnóstico, tratamento e pesquisa. Não se escreve o exame psíquico em primeira pessoa.</p></blockquote>
<p>Outra premissa fundamental: o funcionamento psíquico é <strong>uno</strong> — o examinador observa tudo ao mesmo tempo, não "agora o humor, depois o pensamento". A fragmentação em conceitos (consciência, atenção, sensopercepção, pensamento, afeto...) é uma construção teórica, criada para <strong>melhor descrever e compreender</strong> esse funcionamento. As alterações psicopatológicas também não são específicas de um transtorno: o diagnóstico psiquiátrico é uma <strong>somatória de alterações</strong> que pesam mais para um ou outro diagnóstico — não existe sinal patognomônico.</p>
<h2>Apresentação e primeiras impressões</h2>
<p>O exame psíquico começa <strong>antes da entrevista formal</strong>, pelas primeiras impressões tecidas nos primeiros minutos de contato, ainda na recepção. São os <strong>dados não verbais</strong>: maneira de se vestir e se portar, expressão facial, postura, expressão corpórea, uso de maquiagem, inflexão do discurso, aspecto geral, cuidados vestimentares, <strong>higiene e autocuidado</strong>, atitude frente ao examinador e <strong>colaboração</strong> com a avaliação. O paciente fornece dados sobre si <strong>ainda que não diga nada</strong> — como a paciente bipolar que a família reconhece estar entrando em episódio de mania psicótica porque muda as roupas (cores mais vivas, mais chamativas) e o padrão de maquiagem (mais exagerado). O parâmetro é a <strong>mudança em relação à própria paciente</strong>, não em relação a um grupo ou cultura.</p>
<p>As posturas observáveis durante a entrevista incluem pacientes arrogantes, manipuladores, evasivos, esquivos, confusos e deprimidos. A primeira linha do exame habitualmente registra: <em>"apresentação habitual com manutenção do autocuidado e postura colaborativa com a entrevista"</em> — ou, quando alterada, <em>prejuízo do autocuidado</em>, <em>apresentação atípica</em> ou <em>atitude negativista</em> em relação à entrevista.</p>
<h2>Nível de consciência</h2>
<p>A consciência é a <strong>segunda descrição</strong> do exame psíquico e <strong>determina todo o restante</strong>: se o paciente está em coma — como o do leito 9, intubado e sedado com midazolam e fentanil após intoxicação exógena —, não é possível extrair pensamento, humor ou volição, e o exame fica reduzido a uma linha. O mesmo vale na enfermaria psiquiátrica: o paciente agitado contido quimicamente (Haldol com fenergan ou midazolam intramuscular) fica sonolento, e toda a avaliação seguinte fica prejudicada. Para fins psicopatológicos, a consciência é a <strong>capacidade de entrar em contato com a realidade circundante e reconhecer os objetos externos e internos</strong> — o sono é uma <strong>redução fisiológica</strong> da consciência. Ela é o <strong>grau de clareza do sensório</strong>.</p>
<p>A consciência tem dois aspectos:</p>
<div class="tbl"><table><thead><tr><th>Aspecto</th><th>O que é</th><th>Exemplo de avaliação</th></tr></thead><tbody><tr><td><strong>Quantitativo</strong></td><td>Variação <strong>vertical</strong> da percepção dos estímulos, da vigília ao coma</td><td><strong>Escala de Coma de Glasgow</strong></td></tr><tr><td><strong>Qualitativo</strong></td><td><strong>Integração e organização</strong> das informações percebidas em um dado</td><td>Quadros <strong>dissociativos</strong></td></tr></tbody></table></div>
<h3>As alterações quantitativas, da vigília ao coma</h3>
<ul><li><strong>Vigília</strong> — pleno funcionamento da consciência, resposta espontânea; o indivíduo percebe e integra o mundo.</li><li><strong>Obnubilação</strong> — <em>parece</em> acordado, mas tem <strong>dificuldade de integrar as informações</strong>; fica confuso, com alterações da orientação.</li><li><strong>Torpor</strong> — estado basal de sonolência que se interrompe com <strong>estímulo ambiental mais vigoroso</strong> (chamar o nome do paciente: "José, José!").</li><li><strong>Sopor</strong> — sonolência que só se interrompe com <strong>estímulo mais vigoroso e aplicado diretamente</strong> sobre o paciente (sacudi-lo), que abre os olhos mas <strong>tende a voltar ao estado basal</strong>.</li><li><strong>Coma</strong> — <strong>abolição da consciência</strong>; o indivíduo não percebe o mundo e <strong>não responde nem ao estímulo doloroso</strong> aplicado sobre ele.</li></ul>
<h3>Alterações qualitativas: os quadros dissociativos</h3>
<p>Na dissociação, o indivíduo <strong>percebe o mundo, mas não integra as informações</strong> para utilizá-las. Um caso ilustrativo: a paciente em luto que, após ver a transferência dos ossos do marido no cemitério, lia as placas mas não conseguia usá-las para se direcionar para casa — andou a esmo por São Paulo, entrando e saindo do metrô, até recobrar o funcionamento qualitativo horas depois. Não era sonolência nem falta de percepção: era <strong>desintegração das informações</strong> sob intenso estressor psíquico — uma alteração <strong>qualitativa</strong> da consciência.</p>
<blockquote><p><strong>Pegadinha.</strong> Obnubilação é quantitativa (clareza reduzida, confusão ao integrar). Dissociação é qualitativa (clareza preservada, integração quebrada). Se a questão descrever um paciente que percebe mas não "usa" o que percebe, pense em dissociação — não em sonolência.</p></blockquote>
<h2>Orientação</h2>
<p>A orientação é a <strong>capacidade de se situar em relação a si mesmo e ao mundo</strong>. Quando há alterações quantitativas ou qualitativas da consciência, uma das primeiras expressões é a <strong>desorientação</strong>. Ela se divide em:</p>
<ul><li><strong>Orientação autopsíquica</strong> — em relação à própria biografia: quem é você, quantos anos tem, é casado, tem filhos, trabalha, de onde veio.</li><li><strong>Orientação alopsíquica</strong> — em relação ao meio, ao <strong>tempo e ao espaço</strong>: que dia é hoje, em que ano estamos, que local, bairro e cidade é esse.</li></ul>
<p>A linha do exame: <em>"vígil, orientado auto e alopsiquicamente"</em> — ou, quando alterado, <em>"sonolento, desorientado no tempo e no espaço"</em> ou <em>"desorientado autopsiquicamente"</em>.</p>
<h2>Senso percepção</h2>
<p>O mundo é percebido pelos órgãos dos sentidos, que captam os sinais e os transmitem ao sistema nervoso central. Duas operações se distinguem: a <strong>sensação</strong>, ato original e cru de interação entre o estímulo e a célula sensível que o capta (ativação dos receptores), e a <strong>percepção</strong>, que ocorre quando a sensação chega à consciência <strong>acrescida de significado</strong>. Todas as alterações de senso percepção se dão nesse binômio indivíduo–estímulo.</p>
<div class="tbl"><table><thead><tr><th>Alteração</th><th>Relação com o estímulo</th><th>Exemplo</th></tr></thead><tbody><tr><td><strong>Hiperestesia</strong></td><td>Estímulo <strong>ampliado</strong>, mais intenso ou mais duradouro</td><td>Cores mais vívidas e sons mais nítidos após <strong>Ayahuasca ou cogumelos</strong></td></tr><tr><td><strong>Ilusão</strong></td><td>Estímulo <strong>existe</strong>, mas é percebido <strong>distorcido</strong></td><td>Etilista confunde o <strong>equipo do soro com uma serpente</strong>; ouvir o próprio nome a partir de sons inespecíficos</td></tr><tr><td><strong>Alucinação</strong></td><td>Percepção <strong>sem o estímulo sensorial respectivo</strong></td><td>Ouvir uma voz que manda se matar, "como ouço a sua"</td></tr></tbody></table></div>
<p>A alucinação é a percepção de um objeto <strong>sem que este esteja presente</strong> — como se o feixe de luz que incide sobre o indivíduo simplesmente não existisse. Os tipos: <strong>auditivas</strong> (as <strong>mais comuns na psiquiatria</strong> — ouvir vozes), <strong>visuais</strong> (menos frequentes na psiquiatria, <strong>mais relacionadas a quadros orgânicos</strong>), <strong>táteis</strong> (Síndrome de Ekbom: múltiplos insetos caminhando sobre o corpo) e <strong>olfativas</strong> (a paciente deprimida que sentia cheiro de podre sem estímulo no ambiente). As ilusões também podem ser visuais (móveis, roupas e objetos vistos como pessoas, monstros ou animais) e auditivas (chamamentos a partir de sons inespecíficos).</p>
<h2>Atenção e memória</h2>
<p>O mundo nos estimula o tempo inteiro, e <strong>a atenção é quem hierarquiza os estímulos</strong>: como um farol, ela direciona a consciência para determinados pontos, para que sejam percebidos com maior clareza e definição. A atenção é <strong>flutuante</strong> com o tempo — depende do <strong>valor dos estímulos para o indivíduo</strong> (quem fará psiquiatria presta mais atenção a um conteúdo psiquiátrico) e de <strong>fatores energéticos</strong> (o cansaço desgasta a atenção ao longo do dia). Formas descritas: <strong>voluntária</strong> (dirigida a um estímulo de propósito) e <strong>involuntária ou espontânea</strong> (automática, não refletida — perceber o barulho do ar-condicionado); e ainda a <strong>atenção concentrada</strong> (selecionar um estímulo), a <strong>sustentada</strong> (mantê-la por um intervalo de tempo) e a <strong>dividida</strong> (perceber dois estímulos ao mesmo tempo, como a mulher ao telefone e o homem batendo a cabeça na pilastra do vídeo). O <strong>TDAH</strong> é a alteração <strong>primária</strong> da atenção, mas depressão e ansiedade também a comprometem. Na consulta, a atenção é inferida pelo comportamento diante da entrevista: o paciente permanece nela, entende as perguntas, segue conectado.</p>
<p>A <strong>memória é descrita indiretamente</strong> no exame psíquico: pela capacidade de <strong>narrar e organizar a própria história</strong>, infere-se a capacidade de registrar, manter e evocar fatos. A avaliação formal exigiria aplicar um teste; por isso a linha habitual é <em>"sem sinais indiretos de alterações mnemônicas"</em> ou <em>"alterações da memória"</em>.</p>
<h2>Afetividade e humor</h2>
<p>A afetividade é o <strong>sistema de valoração das experiências</strong> — é por ela que o mundo se torna agradável ou desagradável: experiências de <strong>valência positiva</strong> (que gostaríamos que se perpetuassem) e de <strong>valência negativa</strong> (que gostaríamos que se encerrassem). Alegria, tristeza, raiva, ciúmes e vergonha são afetos. No exame psíquico descrevem-se <strong>humor e afeto</strong>; emoção e sentimento não são descritos.</p>
<blockquote><p><strong>Pegadinha clássica — humor × afeto.</strong> O <strong>humor</strong> é o <strong>estado emocional basal que penetra toda a experiência psíquica</strong>: a tela de fundo, a lente afetiva entre o indivíduo e sua percepção do mundo (os "óculos melancólicos" que tornam o mundo triste), também definido como a <strong>média dos afetos</strong>. O <strong>afeto</strong> é o <strong>componente emocional vinculado a uma ideia</strong>: a tristeza que acompanha a notícia da morte do cachorro de 16 anos. Se a alternativa inverter os dois, está errada.</p></blockquote>
<p>Os tipos de humor: <strong>eutímico</strong> (não polarizado, não distorce a percepção do real), <strong>hipotímico</strong> (depressivo, reduz todas as experiências), <strong>hipertímico</strong> (euforia e expansão, amplia as experiências — característico do transtorno bipolar), <strong>ansioso/disfórico</strong> (na iminência da briga, irritado, altamente sensível) e <strong>pueril</strong> (afetividade infantilizada, principalmente nas deficiências intelectuais).</p>
<p>As propriedades do afeto: a <strong>incongruência afetiva</strong> é o desacordo entre a ideia e o valor emocional atribuído a ela (falar da morte do cachorro sorrindo de orelha a orelha); a <strong>modulação</strong> é a mudança do afeto de acordo com o conteúdo expresso; o <strong>tônus afetivo</strong> é o tamanho do afeto — aumentado, distorce o pensamento, como na <strong>mania</strong>, em que o afeto grande deforma o círculo do pensamento; e a <strong>ressonância</strong> é o impacto da expressão afetiva do paciente sobre o <strong>aparelho psíquico do examinador</strong> ("esse afeto ressoa em mim").</p>
<h2>Pensamento: forma, curso e conteúdo</h2>
<p>O pensamento é <strong>a estrela do exame psíquico</strong>, avaliado em três instâncias:</p>
<ul><li><strong>Forma</strong> — como os conceitos se organizam. No pensamento linear normal, o conceito 1 se correlaciona ao 2, que se correlaciona ao 3, dirigindo-se ao objetivo da pergunta (o pai que explica que dorme mal porque o filho recém-nascido chora de madrugada). A <strong>sopa de palavras</strong> é a alteração grave: plena fragmentação do discurso, componentes sem agregação, sem construção de frase ("carro azul, fita amarela, céu azul, sol amarelo").</li><li><strong>Curso</strong> — a velocidade: a <strong>quantidade de ideias em uma unidade de tempo</strong>. Muitas ideias no mesmo tempo = curso <strong>acelerado</strong>; poucas ideias = curso <strong>lentificado</strong>. A mesma resposta sobre o sono pode sair acelerada (muitas ideias por unidade de tempo) ou lentificada (ideias espaçadas, com pausas).</li><li><strong>Conteúdo</strong> — os <strong>juízos</strong>: a maneira de afirmar a relação com o mundo, discernir a verdade do erro. O erro é a percepção distorcida por uma <strong>premissa falsa</strong> (achar que os alunos no celular não prestam atenção, quando na verdade estavam anotando o conteúdo). Conteúdos patológicos: melancólico na depressão, de urgência e preocupação na ansiedade, <strong>concreto e empobrecido na deficiência intelectual</strong> (perda da capacidade de abstração — o paciente não interpreta o ditado "água mole em pedra dura").</li></ul>
<h3>Pensamento de morte, ideação suicida e delírio</h3>
<p>O <strong>pensamento de morte</strong> é passivo: "morrer seria melhor do que estar vivo", rezar para que Deus leve. A <strong>ideação suicida</strong> é a progressão desse desejo passivo para um <strong>componente ativo</strong>, em que o indivíduo deseja se matar — e, por sua importância, é descrita <strong>à parte</strong> no exame psíquico: <em>"com ideação suicida"</em> ou <em>"sem ideação suicida"</em>.</p>
<p>O <strong>delírio</strong> é uma alteração do <strong>conteúdo</strong> do pensamento, com conteúdo não real — "uma alucinação no campo do pensamento" — e frequentemente se associa a alucinações (ouvir a voz + acreditar que o vizinho vigia com câmera). Suas três características:</p>
<ol><li><strong>Conteúdo impossível, irreal</strong>.</li><li><strong>Refratário à argumentação lógica</strong> — convicção extraordinária; "o delírio sempre dá um passo ao lado" para se manter (o paciente do verme na cabeça: a ressonância "não veria o verme" porque ele seria de um material não captável pelo exame).</li><li><strong>Ideia assistêmica/associal</strong> — não compartilhada, individualizada; retira o indivíduo do coletivo de juízo de realidade.</li></ol>
<p>Outras formas de pensamento: <strong>tangencial</strong> (parece que vai responder, mas não responde ao que foi perguntado), <strong>prolixo</strong> (inclui detalhes dispensáveis, mas <strong>chega ao alvo</strong>) e <strong>arborizado</strong> (desprende-se totalmente da temática central — como o paciente do vídeo inicial, que sai de "o que você faz aqui?" para ervilhas e a princesa; típico da <strong>mania</strong>).</p>
<h2>Pragmatismo, volição e psicomotricidade</h2>
<p>O <strong>pragmatismo</strong> é a capacidade de manter as <strong>atividades básicas da vida prática</strong> — frequentemente é o guia para determinar se há prejuízo. Na depressão, há <strong>redução</strong> do pragmatismo (deixa de fazer o que fazia); na mania, o <strong>aumento</strong> do funcionamento também é patológico (pegar um monte de plantões de uma vez).</p>
<p>A <strong>volição</strong> distingue três atos: o <strong>ato intencional (volitivo)</strong>, elaborado em etapas — intenção → deliberação → decisão → execução (querer sair da sala, ponderar as consequências, decidir ficar); o <strong>ato impulsivo</strong>, ação <strong>sem deliberação</strong>, com a deliberação vindo depois do ato ("levantei, xinguei e saí; não devia ter feito isso"); e a <strong>compulsão</strong>, que tem certa formulação, mas um <strong>avanço irrefreável</strong>: o indivíduo perde o poder de deliberação e, <strong>uma vez iniciado o comportamento, não consegue interrompê-lo</strong> — vai até o esgotamento (o uso compulsivo de cocaína: "vou pegar só um pino" e usa vinte).</p>
<blockquote><p><strong>Ponto-chave.</strong> Na <strong>impulsividade</strong> há incapacidade de <strong>não iniciar</strong> o comportamento; na <strong>compulsão</strong>, incapacidade de <strong>interromper</strong> o comportamento uma vez iniciado.</p></blockquote>
<p>A <strong>psicomotricidade</strong> é a maneira pela qual o indivíduo <strong>executa a sua vontade</strong>: pode estar <strong>diminuída</strong> (deprimido acamado) ou <strong>aumentada</strong> (mania, agitação psicomotora). Citam-se ainda a <strong>flexibilidade cérea</strong> e <strong>lentificação motora</strong> como alterações psicomotoras.</p></script>

    "explanation": "Pensamento de morte é passivo — 'morrer seria melhor do que estar vivo', rezar para que Deus leve. A ideação suicida é a progressão desse desejo passivo para um componente ativo, em que o indivíduo deseja se matar. Por sua importância, a ideação suicida é descrita à parte no exame psíquico: 'com ideação suicida' ou 'sem ideação suicida'."
  },
  {
    "question": "Quais são as características do delírio?",
    "options": [
      "Conteúdo irreal, refratário à lógica e não compartilhado",
      "Conteúdo irreal, corrigível pela lógica e compartilhado",
      "Conteúdo possível, refratário à lógica e individualizado",
      "Conteúdo possível, corrigível pela argumentação e individualizado"
    ],
    "correctIndex": 0,
    "explanation": "O delírio é alteração do conteúdo do pensamento com conteúdo não real (1), refratário à argumentação lógica — o paciente tem convicção extraordinária, e 'o delírio sempre dá um passo ao lado' para se manter (2) — e é uma ideia assistêmica, não compartilhada, que retira o indivíduo do coletivo de juízo de realidade (3). Frequentemente se associa a alucinações."
  },
  {
    "question": "Qual a diferença entre impulsividade e compulsão?",
    "options": [
      "Na impulsividade há falha em não iniciar; na compulsão, falha em interromper o ato",

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +

      '<p style="margin:0;font-size:14.5px;line-height:1.68;color:#39404f;text-wrap:pretty">'+esc(q.explanation)+'</p></div>' : '';

  var blank = counts().blank;

      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +

        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
        (reveal ? chatBox(q, ans===q.correctIndex) : '') +

        '<button type="button" data-act="prev" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:12px 18px;font-size:14px;cursor:pointer;transition:border-color .15s ease,color .15s ease;color:'+(S.i===0?'#c4bfb4':'#121a2b')+';pointer-events:'+(S.i===0?'none':'auto')+'">← Anterior</button>' +

          (early ? '<button type="button" data-act="finish" class="h-ink" style="background:none;border:0;padding:12px 6px;'+mono+';font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a8578;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Finalizar</button>' : '') +
          '<button type="button" data-act="next" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">'+(last?'Finalizar':'Próxima →')+'</button>' +
        '</div></div></section>';
}

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
