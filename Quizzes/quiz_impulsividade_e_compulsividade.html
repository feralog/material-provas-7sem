<script type="text/html" id="resumoSrc"><h2>Dois modos de o cérebro não dizer "não"</h2>
<p>Impulso é, na origem da palavra, a força que provoca o movimento de um corpo. Em psicopatologia, <strong>impulsividade</strong> é a reação rápida e não planejada, executada sem avaliação das consequências. O sujeito age antes de pensar, não consegue adiar a recompensa e prefere o ganho imediato ao ganho maior, porém retardado. Há falha de inibição motora e escolha frequente de comportamentos de risco — o que a linguagem comum, de forma pouco científica, chama de falta de força de vontade para resistir à tentação. É o velho conflito freudiano entre princípio do prazer e princípio de realidade, agora descrito em termos de circuito.</p>
<p><strong>Compulsividade</strong> é outra coisa. É o desempenho de um comportamento manifesto ou encoberto, repetitivo, funcionalmente prejudicial e sem função adaptativa, executado de modo habitual ou estereotipado. Obedece a regras rígidas ou serve para evitar consequências negativas percebidas. Os rituais existem para prevenir ou reduzir o sofrimento, ou para eliminar consequências temidas que podem chegar à intensidade de ideias deliroides. O problema é que <strong>a sensação de alívio é temporária</strong>: o desconforto retorna, o ato precisa ser repetido, e instala-se o ciclo vicioso.</p>
<p>A impulsividade foi descrita já por Esquirol, Kraepelin e Bleuler, mas ficou menosprezada até a década de 1990, quando a CID-10 lhe deu um lugar próprio (F63). Hoje é reconhecida como componente central de um amplo espectro de quadros psiquiátricos e como o elemento psicopatológico que sustenta as dependências comportamentais.</p>
<div class="tbl"><table><thead><tr><th></th><th>Impulsividade</th><th>Compulsividade</th></tr></thead><tbody><tr><td>Falha básica</td><td>não consegue <strong>interromper o início</strong> da ação</td><td>não consegue <strong>encerrar a ação</strong> em andamento</td></tr><tr><td>Motivação</td><td>buscar prazer, ganho ou excitação</td><td>evitar dano temido, reduzir sofrimento</td></tr><tr><td>Relação com o ato</td><td>egossintônico no momento: gratifica</td><td>egodistônico: não há prazer direto no ato</td></tr><tr><td>Antes do ato</td><td>tensão crescente</td><td>ansiedade/urgência ligada ao dano temido</td></tr><tr><td>Depois do ato</td><td>alívio e gratificação, depois culpa</td><td>alívio apenas temporário, realimenta o ciclo</td></tr><tr><td>Neurocircuito</td><td>estriado <strong>ventral</strong> – tálamo – VMPFC/ACC</td><td>estriado <strong>dorsal</strong> – tálamo – OFC</td></tr><tr><td>Direção do erro</td><td>pressão excessiva "de baixo para cima"</td><td>hábito automatizado, rigidez cognitiva</td></tr></tbody></table></div>
<blockquote><p>Impulsividade e compulsividade não são categorias diagnósticas, e sim <strong>endofenótipos</strong> — dimensões transdiagnósticas, observadas em grande variedade de transtornos. As duas são formas de inflexibilidade cognitiva, ligadas a circuitos cerebrais específicos e à conexão disfuncional entre córtex frontal e estruturas límbicas.</p></blockquote>
<hr>
<h2>As cinco faces da impulsividade</h2>
<p>Impulsividade não é um traço único. Decompõe-se em dimensões que podem predominar isoladamente num mesmo paciente:</p>
<ul><li><strong>Busca de sensação</strong> — procura de experiências perigosas e prazer em atividades excitantes.</li><li><strong>Urgência negativa</strong> — agir precipitadamente para diminuir emoções negativas.</li><li><strong>Urgência positiva</strong> — agir precipitadamente ao vivenciar emoções positivas intensas.</li><li><strong>Falta de premeditação</strong> — agir antes de pensar nas consequências.</li><li><strong>Falta de perseverança</strong> — dificuldade em manter o foco em tarefas enfadonhas e em terminar projetos diante de outros estímulos.</li></ul>
<p>No plano mecânico, a impulsividade combina dois elementos: <strong>deficiência dos sistemas de inibição de resposta</strong> e <strong>suscetibilidade à provocação de resposta</strong>. O sintoma nasce do desequilíbrio entre eles — ou o freio é fraco, ou o estímulo é forte demais, ou as duas coisas.</p>
<h3>A impulsividade tem endereços diferentes em cada diagnóstico</h3>
<p>O traço é heterogêneo, e saber qual é o motor em cada quadro é o que separa as questões de prova:</p>
<div class="tbl"><table><thead><tr><th>Quadro</th><th>O que move a impulsividade</th></tr></thead><tbody><tr><td>TDAH</td><td>deficiências cognitivas — atenção, planejamento da ação</td></tr><tr><td>Personalidade borderline</td><td>instabilidade afetiva</td></tr><tr><td>Personalidade antissocial</td><td>redução da função empática</td></tr><tr><td>Transtorno do jogo</td><td>desejo do ganho monetário</td></tr><tr><td>Transtorno explosivo intermitente</td><td>agressividade incontida</td></tr></tbody></table></div>
<p>Essa distribuição espelha o desenvolvimento filogenético do sistema nervoso central. O <strong>componente afetivo</strong> — as emoções básicas de medo e tristeza — falha e produz instabilidade emocional, como no borderline. As <strong>funções cognitivas</strong> — atenção, inteligência, memória, planejamento da ação — falham e produzem o TDAH. O <strong>freio social e moral</strong>, isto é, a empatia, com bases evolucionárias, neuroendócrinas e neurofisiológicas profundas voltadas à preservação do grupo e do indivíduo, falha e produz a personalidade antissocial.</p>
<blockquote><p>Curso e risco: o início costuma ocorrer <strong>na adolescência ou no princípio da vida adulta</strong>, fase de maior incapacitação, e <strong>as tentativas de suicídio estão correlacionadas a traços impulsivos</strong>. O repertório inclui comportamento autoagressivo, heteroagressivo e de risco — a avaliação do impulso é, na prática, avaliação de risco.</p></blockquote>
<hr>
<h2>Os dois circuitos: alça ventral e alça dorsal</h2>
<p>A pergunta clínica — por que impulsos e compulsões não podem ser interrompidos? — tem resposta de circuito. Impulsividade e compulsividade são fenômenos <strong>"de baixo para cima"</strong>, gerados no estriado, enquanto o controle volitivo inibitório é exercido <strong>"de cima para baixo"</strong> por áreas do córtex pré-frontal, que inibem atos involuntários ou condicionados. O córtex cingulado medeia as reações e as respostas aos resultados obtidos.</p>
<p>O sintoma aparece quando esse arranjo se desequilibra, por <strong>falha nos sistemas corticais de inibição de resposta</strong> (controle de cima para baixo insuficiente) ou por <strong>pressão excessiva vinda de baixo</strong> — do estriado ventral, na impulsividade, ou do estriado dorsal, na compulsividade.</p>

<p>A <strong>alça da impulsividade</strong> liga o estriado ventral ao tálamo, ao córtex pré-frontal ventromedial (VMPFC) e ao córtex cingulado anterior (ACC). É a alça da recompensa: o estriado ventral abriga o núcleo accumbens, alvo da via dopaminérgica mesolímbica que parte da área tegmentar ventral.</p>

<p>A <strong>alça da compulsividade</strong> liga o estriado dorsal ao tálamo e ao córtex orbitofrontal (OFC). O estriado dorsal é a sede do sistema de hábito, o que explica a automatização, a rigidez e a resistência à mudança do comportamento compulsivo.</p>

<h4>Migração ventral → dorsal</h4>
<p>Este é o ponto que amarra a aula inteira. Atos que começam <strong>impulsivos</strong> — uso de drogas, jogo, comer compulsivo que leva à obesidade — podem se tornar <strong>compulsivos</strong> por alterações neuroplásticas que recrutam o sistema de hábito dorsal. Teoricamente, os impulsos migram da alça ventral para a alça dorsal: o comportamento deixa de ser movido pela recompensa e passa a ser movido pelo hábito.</p>
<blockquote><p>Consequência clínica: quanto mais tarde o quadro é abordado, mais ele deixou de ser "escolha ruim" e mais virou automatismo. Esperar que o paciente "recupere a vontade" é esperar de um circuito dorsal uma função que é do circuito ventral.</p></blockquote>

<h3>O que cada classificação faz com isso</h3>
<p>A <strong>CID-10</strong> reúne em <strong>F63 — transtornos dos hábitos e impulsos</strong>: jogo patológico, piromania, roubo patológico (cleptomania), tricotilomania, outros transtornos dos hábitos e impulsos (por exemplo a oniomania) e os não especificados. São comportamentos impulsivos heterogêneos, irracionais, repetitivos e descontrolados, com prejuízo significativo para o paciente.</p>
<p>O <strong>DSM-5</strong> criou os <strong>Transtornos Disruptivos, do Controle de Impulsos e da Conduta</strong>. Permaneceram piromania, cleptomania e transtorno explosivo intermitente, e foram agregados transtorno de conduta (TC), transtorno opositor desafiador (TOD) e transtorno de personalidade antissocial (TASP). A justificativa foi a associação frequente entre TC e TOD e o risco de progressão para TEI e TASP na vida adulta. O eixo comum é o problema no controle das emoções — particularmente da raiva — e do comportamento, resultando em desrespeito a terceiros e dificuldade de se adequar a normas e autoridades. O DSM-5 divide o conjunto em três subgrupos:</p>
<ol><li>Dificuldades na regulação emocional e expressão de irritabilidade ou raiva: <strong>TOD e TEI</strong>.</li><li>Dificuldade em modular o comportamento pelas regras e pelo contexto social: <strong>TC e TASP</strong>.</li><li>Perda de controle sobre comportamentos específicos: <strong>piromania, cleptomania</strong> e outros comportamentos impulsivos de natureza hedônica — compras, internet, comportamento alimentar e sexual.</li></ol>
<p>Quanto à frequência, os transtornos relacionados à impulsividade são mais comuns na população do que se estimava inicialmente. Cálculos conservadores apontam cerca de <strong>8% da população</strong> (sem incluir dependências químicas) e amostras brasileiras, <strong>4,3%</strong>. A exceção é a <strong>piromania</strong>, diagnóstico pouco estudado e sem dados definidos de prevalência.</p>
<hr>
<h2>Espectro obsessivo-compulsivo e comportamentos focados no corpo</h2>
<h3>TOC</h3>
<p>O TOC se define por ideias obsessivas, por comportamentos compulsivos recorrentes, ou pelos dois. As obsessões típicas giram em torno de contaminação, medo de causar dano a si ou ao outro, preocupação com ordem e simetria e preocupação com moral e religião. As compulsões típicas são limpeza, verificações de segurança e repetição de palavras ou de toques.</p>
<blockquote><p><strong>A pegadinha clássica do TOC é a crítica.</strong> As ideias obsessivas se intrometem na consciência de modo repetitivo e estereotipado, mas o paciente <strong>reconhece que são seus próprios pensamentos</strong>, embora estranhos à sua vontade e em geral desprazerosos. E <strong>não há prazer direto algum</strong> na realização desses atos inúteis — o que separa o ato compulsivo do ato impulsivo, que gratifica no momento em que é executado.</p></blockquote>
<h3>Transtorno de acumulação</h3>
<p>Subtipo do espectro: aquisição de grande número de itens somada ao <strong>fracasso em descartar objetos inúteis</strong>, com espaços desordenados. Comorbidades frequentes: depressão, transtornos psicóticos, ansiedade generalizada, fobia social, TOC e transtorno bipolar.</p>

<p>A escoriação consiste em comportamentos repetitivos focados no corpo, cutucando a pele. O perfil descrito é o de indivíduos perfeccionistas, facilmente entediados, frustrados ou impacientes, e o ato produz uma mistura paradoxal de <strong>sofrimento com satisfação, alívio e recompensa</strong>.</p>
<blockquote><p>Detalhe de prova: <strong>a tensão antecipatória ao ato é menos comum na tricotilomania</strong> e nos transtornos relacionados — dermatotilexomania, onicofagia grave e demais comportamentos repetitivos com foco no corpo. Não espere o arco tensão-alívio-culpa da cleptomania aqui; o ato frequentemente é automático.</p></blockquote>
<h3>Transtorno dismórfico corporal</h3>
<p>Forte crença de existir uma falha na aparência que torna a pessoa feia ou deformada — falha que os outros nem percebem. Acompanham comportamentos repetitivos e demorados, como se olhar no espelho, cutucar a falha percebida e gastar muito tempo escondendo-a, além de constrangimento e ansiedade perto de outras pessoas, prejuízo no trabalho ou na escola e busca de cirurgias plásticas.</p>
<h3>Hipocondria / cibercondria</h3>
<p>Do grego <em>hypo-</em> (abaixo) e <em>chondros</em> (cartilagem do diafragma). Crença infundada de padecer de doença grave, com medo irracional da morte e das doenças, obsessão com sintomas ou defeitos físicos irrelevantes, pensamentos intrusivos, preocupação e auto-observação constante do corpo. O paciente vai repetidamente a hospitais, consultórios e prontos-socorros, não se conforma com resultados normais e supervaloriza sintomas corriqueiros. Atinge <strong>1 a 5% da população</strong>.</p>
<h3>Síndrome de Tourette</h3>
<p>Manifestações vocais e/ou físicas involuntárias repetitivas, descritas pelo neurologista francês em 1885. Prevalência de <strong>1 para 2.500</strong> (EUA), proporção <strong>3 meninos para 1 menina</strong>, início antes dos 21 anos — em geral entre 3 e 9 anos. Evolui em frequência, localização e gravidade ao longo do tempo; é doença crônica, cujos sintomas podem aliviar com a idade.</p>
<hr>
<h2>Dependências: químicas, comportamentais e alimentares</h2>
<p>A compulsividade, como traço de personalidade, foi associada ao uso, abuso e dependência de álcool, aos transtornos do jogo e à bulimia nervosa. São exatamente os quadros em que o ato nasce impulsivo e se automatiza.</p>
<h3>Dependência de substâncias</h3>
<p>Os critérios formam um bloco que vale decorar inteiro:</p>
<ul><li><strong>Fissura</strong> — forte desejo ou senso de compulsão para consumir a substância.</li><li><strong>Perda de controle</strong> — dificuldade em controlar o comportamento de consumo.</li><li><strong>Abstinência fisiológica</strong> — síndrome característica ao cessar ou reduzir o uso, ou uso de substância relacionada para aliviá-la.</li><li><strong>Tolerância</strong> — doses crescentes para alcançar os efeitos obtidos no início.</li><li><strong>Estreitamento do repertório</strong> — abandono progressivo de prazeres e interesses alternativos, com aumento do tempo gasto para obter, usar e se recuperar da substância.</li><li><strong>Persistência apesar do dano</strong> — manutenção do uso mesmo compreendendo o prejuízo: dano hepático pelo álcool, humor depressivo após períodos de consumo excessivo, comprometimento cognitivo relacionado à droga.</li></ul>
<blockquote><p>Não confundir <strong>tolerância</strong> com <strong>abstinência</strong>. Tolerância é precisar de mais para sentir o mesmo; abstinência é adoecer quando falta. São critérios independentes, e trocá-los é o erro mais frequente nessa lista.</p></blockquote>
<h3>Dependência de comida — compulsão alimentar (CID-11, 6B82)</h3>
<p>Episódio de compulsão alimentar é aquele em que o indivíduo experimenta <strong>perda de controle sobre a alimentação</strong>, comendo mais do que o normal, incapaz de parar ou de limitar o tipo e a quantidade de alimento. É muito angustiante, acompanhado de emoções negativas como culpa ou repulsa, com prejuízo pessoal, familiar, social, educacional e ocupacional.</p>
<blockquote><p><strong>Diferencial com a bulimia nervosa:</strong> na compulsão alimentar os episódios <strong>não são seguidos por comportamentos compensatórios inadequados</strong> destinados a prevenir ganho de peso — vômito autoinduzido, uso indevido de laxantes ou enemas, exercício extenuante. A perda de controle existe nos dois; o que decide é a presença ou ausência da compensação.</p></blockquote>
<h3>Dependência digital, nomofobia e transtornos do jogo</h3>
<p>Uso abusivo e descontrolado de redes sociais e jogos eletrônicos, que interfere diretamente na qualidade de vida e no desempenho no trabalho ou nos estudos. Há ausência de resistência para interromper a atividade patológica e, sobretudo, <strong>ausência de controle por outras pessoas</strong>: somada ao anonimato, essa invisibilidade reduz as chances de o jogador reconhecer o problema e estabelecer limites para si. A CID-11 separa <em>gaming disorder</em> (jogos eletrônicos) de <em>gambling disorder</em> (jogos de aposta).</p>
<hr>
<h2>Perda de controle sobre atos específicos</h2>
<h3>Cleptomania</h3>
<p>Furto de coisas diversas, <strong>inclusive sem valor</strong> — pedaços de giz, sabonetes, canetas —, praticado sem necessidade e com certo grau de dissociação, em lojas, casas de terceiros ou na escola. <strong>O ato de furtar é o objetivo, não o objeto furtado</strong>: é isso que separa a cleptomania do furto comum, motivado pelo ganho.</p>
<p>A sequência afetiva é o arco clássico dos impulsos hedônicos: <strong>antes</strong>, tensão crescente; <strong>depois</strong>, gratificação imediata e alívio da tensão; <strong>em seguida</strong>, culpa, remorso, frustração e depressão.</p>
<h3>Oniomania (compras compulsivas)</h3>
<p>Necessidade incontrolável de adquirir objetos, em que <strong>a compra é que gera o alívio</strong> e se torna a principal maneira de a pessoa lidar com sentimentos e situações desconfortáveis. Os produtos comprados podem ser abandonados depois. Seguem-se arrependimento, culpa e prejuízos financeiros, e o comportamento se mantém mesmo com a pessoa sabendo que será prejudicial ou inoportuno.</p>
<blockquote><p>Oniomania <strong>≠ consumista</strong>. O consumista compra por desejo e ostentação, e o objeto importa. Na oniomania o que alivia é o ato, e o objeto pode terminar esquecido dentro da sacola.</p></blockquote>
<h3>Piromania</h3>
<p>Excitação nos momentos que antecedem o ato de incendiar, com fascinação pelo fogo e curiosidade e atração pelas circunstâncias ligadas a ele. Mais comum na adolescência. Em crianças, a conduta incendiária costuma associar-se a transtorno de conduta, transtorno de ajustamento ou TDAH.</p>
<blockquote><p><strong>O que exclui a piromania:</strong> incêndio por motivação monetária, por motivação político-ideológica ou como expressão de raiva. Sem a fascinação pelo fogo e com um objetivo instrumental atrás do ato, o diagnóstico é outro.</p></blockquote>
<hr>
<h2>Agressividade, personalidade e autolesão</h2>
<h3>Transtorno explosivo intermitente (TEI)</h3>
<p>Incapacidade de gerenciar impulsos agressivos, com comportamentos agressivos, ataques de fúria e reações <strong>desproporcionais</strong> ao estímulo. Seja qual for a natureza da agressão, é comum o paciente sentir arrependimento, vergonha, culpa ou tristeza depois da explosão.</p>
<div class="tbl"><table><thead><tr><th>Forma</th><th>Conduta</th><th>Frequência</th></tr></thead><tbody><tr><td>Leve</td><td>ameaças, xingamentos, ofensas, gestos obscenos, ataque a objetos, agressão física <strong>sem</strong> lesão corporal</td><td>2 vezes em 3 meses</td></tr><tr><td>Grave</td><td>destruição de propriedade/patrimônio, ataque físico <strong>com</strong> lesão corporal</td><td>3 vezes em 1 ano</td></tr></tbody></table></div>
<p>Dois critérios fecham o diagnóstico: as explosões <strong>não têm objetivo</strong> (não visam dinheiro, poder ou intimidação) e causam sofrimento acentuado ou prejuízo profissional, interpessoal, financeiro ou legal. E é diagnóstico de exclusão: os ataques não podem ser devidos a álcool, drogas, medicamentos, transtorno depressivo maior, transtorno bipolar, transtorno psicótico, personalidade antissocial ou borderline, traumatismo craniano ou doença de Alzheimer.</p>
<h3>Transtorno de personalidade borderline</h3>
<p>Também chamado de transtorno de instabilidade emocional. Padrão generalizado de instabilidade e hipersensibilidade nos relacionamentos interpessoais, instabilidade na autoimagem, flutuações extremas de humor e impulsividade — sendo a impulsividade um sintoma importante. <strong>O diagnóstico é feito por critérios clínicos; o tratamento é com psicoterapia e fármacos.</strong></p>
<h3>Comportamento parassuicida / automutilação (autolesão não suicida)</h3>
<p>Critério de frequência: <strong>em cinco ou mais dias no último ano</strong>, dano intencional autoinfligido à superfície do corpo, provavelmente induzindo sangramento, contusão ou dor — cortar, queimar, fincar, bater, esfregar excessivamente —, <strong>com a expectativa de que a lesão leve apenas a dano físico menor ou moderado, ou seja, sem intenção suicida</strong>.</p>
<p>O comportamento vem acompanhado de pelo menos uma destas expectativas:</p>
<ol><li>Obter alívio de um estado de sentimento ou de cognição negativos.</li><li>Resolver uma dificuldade interpessoal.</li><li>Induzir um estado de sentimento positivo.</li></ol>
<p>O alívio ou a resposta desejada são experimentados durante ou logo após a autolesão, e o indivíduo pode exibir padrões de comportamento que sugerem <strong>dependência</strong> de se envolver repetidamente nesses atos. A autolesão intencional associa-se ainda a pelo menos um dos seguintes: dificuldades interpessoais ou sentimentos e pensamentos negativos — depressão, ansiedade, tensão, raiva, angústia generalizada, autocrítica — no período imediatamente anterior ao ato; um período de preocupação difícil de controlar com o comportamento pretendido; ou pensamentos frequentes sobre a autolesão mesmo quando ela não é praticada.</p>
<blockquote><p>A autolesão não suicida <strong>não é tentativa de suicídio</strong> e também não é "chamar atenção". É um comportamento com função reguladora — alívio de estado afetivo negativo — que tende a se repetir justamente porque funciona a curto prazo. Avaliar risco suicida continua obrigatório, porque traços impulsivos se correlacionam a tentativas, mas o diagnóstico é outro.</p></blockquote>
<h3>Quando o impulso é sintoma de outra coisa</h3>
<p>A alteração do controle do impulso também aparece como parte de <strong>transtorno bipolar, TDAH, comportamento antissocial, transtorno de conduta e transtorno opositor desafiador</strong>. Nesses casos o alvo terapêutico é o quadro de base, não o impulso isolado.</p>
<hr>
<h2>Sexualidade: hipersexualidade e parafilias</h2>
<p><strong>Hipersexualidade</strong> aparece ou como sintoma dentro de outra patologia — mania, por exemplo — ou como manifestação de dependência comportamental.</p>
<p><strong>Parafilia</strong> é qualquer interesse sexual intenso e persistente que não seja o interesse na estimulação genital ou nas preliminares com parceiros humanos, maduros e consentindo; inclui práticas e relacionamentos eróticos atípicos envolvendo dor ou poder. Vira transtorno quando o comportamento sexual atípico causa angústia ou torna a pessoa uma ameaça ao bem-estar psicológico e físico de outras pessoas.</p>
<ul><li><strong>Fetichismo</strong> — objetos inanimados como foco do desejo.</li><li><strong>Pedofilia</strong>.</li><li><strong>Exibicionismo</strong> — expor os genitais sem consentimento do outro.</li><li><strong>Voyeurismo</strong> — observar sem consentimento do outro.</li><li><strong>Frotteurismo</strong> — excitação sexual recorrente e intensa de tocar ou se esfregar em pessoa sem consentimento, com prejuízo no funcionamento social, ocupacional ou em outras áreas importantes.</li><li><strong>Transtorno de travestismo</strong> — excitação sexual intensa por se travestir.</li></ul>
<blockquote><p><strong>Travestismo não é identidade transgênero.</strong> O transtorno de travestismo descreve excitação sexual obtida pelo ato de se travestir. Identidade trans diz respeito à identidade de gênero da pessoa, não a um interesse sexual, e não é diagnóstico psiquiátrico. Confundir os dois é erro conceitual, não detalhe de nomenclatura.</p></blockquote></script>

    "explanation": "O início costuma ocorrer na adolescência ou no princípio da vida adulta, período de maior incapacitação, e as tentativas de suicídio estão correlacionadas a traços impulsivos. O repertório inclui comportamento autoagressivo, heteroagressivo e de risco."
  }
];

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

  } else if (S.view !== 'home') {
    right = '<button type="button" data-act="home" class="h-line" style="flex-shrink:0;background:none;border:1px solid #ddd8ce;border-radius:9px;padding:7px 13px;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">← Início</button>';
  }

  var html = '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:'+(S.view==='quiz'&&S.started?'10px':'2px')+'">'+left+right+'</div>';

      var a = S.answers[n], cur = n===S.i && !S.finished, bg = '#d3cec4';
      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';
      if (cur && a===null) bg = '#121a2b';
      var st = a===null ? 'em branco' : (a===q.correctIndex ? 'correta' : 'incorreta');
      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +
             '<span style="display:block;width:100%;border-radius:99px;transition:height .18s ease,background .18s ease,box-shadow .18s ease;height:'+(cur?'17px':'9px')+';background:'+bg+';box-shadow:'+(cur?'0 0 0 3px rgba(18,26,43,.13)':'none')+'"></span></button>';
    }).join('');
    html += '<div><div style="display:flex;align-items:center;gap:3px">'+rail+'</div>' +

              '<div style="'+mono+';font-size:11px;letter-spacing:.04em;color:#5b6478">Questão '+pad(S.i+1)+' / '+S.order.length+'</div>' +

                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +

  }
  document.getElementById('hdr').innerHTML = html;
}
function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

function figura(q, cls){

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +
      '</button>';
  }).join('');

  var expl = reveal ? '<div style="margin-top:20px;padding:16px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;animation:qFade .26s ease">' +
      '<div style="'+mono+';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:8px">Por quê</div>' +
      '<p style="margin:0;font-size:14.5px;line-height:1.68;color:#39404f;text-wrap:pretty">'+esc(q.explanation)+'</p></div>' : '';

  var blank = counts().blank;
  var warn = S.warn ? '<div style="margin-top:14px;padding:15px 17px;background:#fdf7e9;border:1px solid #e8d5a3;border-radius:14px;animation:qFade .22s ease">' +
      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +
        '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;line-height:1.42;font-weight:400;letter-spacing:-.012em;margin:0 0 22px;text-wrap:pretty">'+esc(q.question)+'</h2>' +
        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
        (reveal ? chatBox(q, ans===q.correctIndex) : '') +
      '</article>' + warn +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px">' +
        '<button type="button" data-act="prev" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:12px 18px;font-size:14px;cursor:pointer;transition:border-color .15s ease,color .15s ease;color:'+(S.i===0?'#c4bfb4':'#121a2b')+';pointer-events:'+(S.i===0?'none':'auto')+'">← Anterior</button>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          (early ? '<button type="button" data-act="finish" class="h-ink" style="background:none;border:0;padding:12px 6px;'+mono+';font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a8578;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Finalizar</button>' : '') +
          '<button type="button" data-act="next" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">'+(last?'Finalizar':'Próxima →')+'</button>' +
        '</div></div></section>';
}

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';
  if (pct>=90)      { title='Domínio sólido';   msg='Desempenho excelente. Confira as explicações das que escaparam e siga em frente.'; }
  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

  var stat = function(v,l,color){
    return '<div style="background:#faf9f6;padding:14px 10px">' +
      '<div style="'+mono+';font-size:19px;font-weight:500;color:'+color+'">'+v+'</div>' +
      '<div style="'+mono+';font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#8a8578;margin-top:2px">'+l+'</div></div>';
  };

  var fdefs = [['all','Todas',c.total],['wrong','Erradas',c.miss],['right','Certas',c.hit],['blank','Em branco',c.blank]];
  var filters = fdefs.map(function(f){

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
</body>
</html>
