<script type="text/html" id="resumoSrc"><h2>Definição, Classificação e Epidemiologia</h2>
<p>Infertilidade conjugal é a <strong>ausência de gestação após 12 meses</strong> de relação sexual regular, bem distribuída ao longo do ciclo, sem uso de método contraceptivo — definição da OMS e da FEBRASGO. O prazo não é rígido: em mulheres com <strong>idade igual ou superior a 35 anos</strong>, ou diante de fator de risco já identificado (IST prévia, cirurgia pélvica, quimioterapia, ciclos irregulares), a investigação começa <strong>após 6 meses</strong>.</p>
<p>O princípio que organiza toda a investigação é que o <strong>casal é uma unidade funcional</strong>. Ambos os parceiros são investigados desde o início, porque fatores masculinos e femininos coexistem com frequência, e o tratamento é definido pelo perfil do casal como um todo — não pelo indivíduo isolado.</p>
<h3>Classificação</h3>
<div class="tbl"><table><thead><tr><th>Tipo</th><th>Definição</th><th>Observação</th></tr></thead><tbody><tr><td>Infertilidade <strong>primária</strong></td><td>O casal nunca conseguiu uma gestação</td><td>Inclui todos os casos sem filho prévio no relacionamento atual</td></tr><tr><td>Infertilidade <strong>secundária</strong></td><td>O casal já obteve pelo menos uma gestação prévia</td><td>Gestações que não resultaram em filho vivo (aborto, ectópica) <strong>contam</strong></td></tr></tbody></table></div>
<h3>Prevalência e distribuição das causas</h3>
<p>A infertilidade atinge <strong>15 a 20%</strong> da população em idade reprodutiva.</p>
<div class="tbl"><table><thead><tr><th>Origem</th><th>Participação</th></tr></thead><tbody><tr><td>Fatores mistos (masculino + feminino)</td><td>35%</td></tr><tr><td>Fator masculino isolado</td><td>30%</td></tr><tr><td>Fator feminino isolado</td><td>30%</td></tr><tr><td>Idiopático</td><td>10%</td></tr></tbody></table></div>
<blockquote><p><strong>Ponto-chave.</strong> Fator masculino isolado responde por 30% dos casos e fatores mistos por mais 35% — ou seja, o homem participa de cerca de dois terços das causas. Investigar apenas a mulher é erro de conduta e pegadinha recorrente de prova.</p></blockquote>
<hr>
<h2>Investigação do Casal — Roteiro Inicial</h2>
<p>A avaliação segue três etapas para os dois parceiros: <strong>anamnese</strong>, <strong>exame físico dirigido</strong> aos sistemas reprodutores e <strong>exames subsidiários</strong> (laboratoriais, de imagem e funcionais) conforme a indicação.</p>
<h4>Anamnese — eixos obrigatórios</h4>
<ul><li><strong>Identificação:</strong> idade de ambos, ocupação e exposições ocupacionais, duração da infertilidade, filhos pregressos (individuais e do casal).</li><li><strong>Hábitos e vícios:</strong> tabagismo (cigarro e narguilé), etilismo, sedentarismo e IMC, drogas ilícitas e <strong>anabolizantes</strong>.</li><li><strong>Antecedentes pessoais:</strong> doenças crônicas (diabetes, tireoidopatias, SOP), ISTs prévias e tratamentos, cirurgias abdominais ou pélvicas, medicações em uso.</li><li><strong>Saúde sexual:</strong> frequência das relações, disfunção erétil, dispareunia, uso de lubrificantes, IST ativa.</li></ul>
<h4>Pistas que direcionam a investigação feminina</h4>
<ul><li>Ciclos irregulares → causas ovulatórias: FSH, LH, TSH, prolactina, testosterona.</li><li>Dismenorreia e dispareunia → endometriose: ultrassom com preparo, ressonância de pelve.</li><li>ISTs prévias ou DIP → fator tubário: histerossalpingografia.</li><li>Cirurgias uterinas ou curetagens → fator uterino: histerossalpingografia e histeroscopia.</li></ul>
<blockquote><p><strong>Pegadinha.</strong> A HSG está indicada em <strong>todas</strong> as pacientes, com uma única exceção: quando já existe <strong>indicação imediata de FIV/ICSI por outra causa</strong> — aí o resultado não mudaria a conduta. A laparoscopia fica reservada a casos selecionados, não é rastreio.</p></blockquote>
<hr>
<h2>Fator Masculino — Anatomia, Anamnese e Exame Físico</h2>
<p>A função testicular tem duas vertentes. A <strong>via seminífera</strong> (produção) faz a espermatogênese nos túbulos seminíferos, regulada por <strong>FSH e testosterona</strong>, com duração aproximada de <strong>74 dias</strong>, seguida de maturação no epidídimo por mais <strong>12 a 21 dias</strong>; as células de Sertoli dão suporte e nutrição. A <strong>via excretora</strong> (transporte) vai do epidídimo ao ducto deferente, recebendo a contribuição das glândulas acessórias.</p>

<blockquote><p>Como o ciclo completo de produção e maturação leva cerca de <strong>3 meses</strong>, tudo o que aconteceu nos últimos 90 dias — febre, quimioterapia, anabolizante, calor — repercute no espermograma de hoje. A anamnese masculina cobre exatamente esse intervalo.</p></blockquote>
<h3>Anamnese masculina dirigida</h3>
<ul><li><strong>Infecções/ISTs:</strong> orquite, epididimite, uretrite por gonococo ou clamídia.</li><li><strong>Patologias testiculares:</strong> criptorquidia, torção testicular, trauma, varicocele.</li><li><strong>Medicações:</strong> anabolizantes, quimioterápicos, sulfassalazina, cimetidina, bloqueadores alfa.</li><li><strong>Cirurgias prévias:</strong> vasectomia, herniorrafia inguinal, cirurgia pélvica, varicocelectomia.</li><li><strong>Tóxicos e calor:</strong> pesticidas, radiação, banho quente prolongado, trabalho junto a fontes de calor.</li></ul>
<h3>Exame físico</h3>
<p>Avaliar pênis (hipospádia, fimose, anomalias do meato), <strong>testículos</strong> (volume mínimo de 15 mL cada, consistência e localização), epidídimos e deferentes (espessamento, nódulos, <strong>ausência congênita bilateral</strong>) e o <strong>plexo pampiniforme</strong>, pesquisado em repouso e com manobra de Valsalva. A temperatura do ambiente e do local de coleta do espermograma também entra na avaliação.</p>
<h3>Varicocele</h3>
<p>Dilatação varicosa das veias do plexo pampiniforme — a <strong>causa tratável mais frequente</strong> de infertilidade masculina. A cadeia fisiopatológica é: hipertensão venosa com refluxo renal/adrenal → hipoperfusão e hipóxia tecidual → estresse oxidativo e disfunção epitelial → <strong>queda da qualidade espermática</strong>.</p>

<h2>Espermograma e Valores de Referência (OMS 2021)</h2>
<p>O espermograma avalia simultaneamente a função dos túbulos seminíferos (contagem e morfologia), as glândulas acessórias (volume e composição), a capacidade ejaculatória (volume, fluidez, pH e arquitetura do ejaculado) e, indiretamente, o eixo hipotálamo-hipófise-gonadal.</p>
<h3>Fatores de variabilidade na coleta</h3>
<ul><li>Abstinência sexual — <strong>ideal de 2 a 5 dias</strong>.</li><li>Local de coleta (preferência pelo laboratório) e modo de coleta (masturbação em frasco estéril).</li><li>Transporte em temperatura corporal, em <strong>menos de 1 hora</strong>.</li><li>Estado de saúde, medicações e drogas nos últimos 3 meses; estado emocional e grau de instrução.</li></ul>
<blockquote><p><strong>Ponto-chave.</strong> A variação biológica é esperada: <strong>trabalhe sempre com a média de dois exames</strong> antes de rotular o paciente. Um espermograma isolado alterado não fecha diagnóstico nem indica reprodução assistida.</p></blockquote>
<h3>Valores de referência</h3>
<div class="tbl"><table><thead><tr><th>Parâmetro</th><th>Referência</th><th>Alteração se abaixo</th></tr></thead><tbody><tr><td>Volume</td><td>≥ 1,4 mL</td><td>Hipospermia</td></tr><tr><td>Concentração</td><td>≥ 16 × 10⁶/mL</td><td>Oligozoospermia (&lt; 5 = grave · 0 = <strong>azoospermia</strong>)</td></tr><tr><td>Motilidade progressiva (PR)</td><td>≥ 30%</td><td>Astenozoospermia</td></tr><tr><td>Morfologia (Kruger)</td><td>≥ 4%</td><td>Teratozoospermia</td></tr></tbody></table></div>
<p>A associação das três alterações — <strong>OAT</strong> (oligo + asteno + teratozoospermia) — é frequente na prática e é a indicação principal de ICSI.</p>
<h3>Exames subsidiários masculinos</h3>
<h4>Avaliação hormonal (FSH, LH, testosterona, prolactina)</h4>
<p>Indicada na alteração seminal confirmada, baixa libido, disfunção erétil ou testículos reduzidos.</p>
<ul><li>↑ FSH + ↓ volume testicular → <strong>falência testicular primária</strong>.</li><li>↓ FSH/LH + ↓ testosterona → <strong>hipogonadismo hipogonadotrófico</strong> (central).</li></ul>
<h4>Imagem</h4>
<p>Ultrassom escrotal para varicocele, volume testicular e lesões; <strong>ultrassom transretal ou RNM pélvica</strong> na suspeita de obstrução distal — indicados na hipospermia (&lt; 1,4 mL) e na azoospermia ou suspeita obstrutiva.</p>
<h4>Avaliação genética</h4>
<p>Indicada na <strong>oligozoospermia grave (&lt; 5 × 10⁶/mL) ou azoospermia</strong>: microdeleções das regiões <strong>AZFa, AZFb e AZFc</strong> (definem prognóstico) e cariótipo — a <strong>síndrome de Klinefelter (47,XXY)</strong> é a causa cromossômica mais frequente.</p>
<hr>
<h2>Fator Ovulatório e Síndrome dos Ovários Policísticos</h2>
<p>O fator ovulatório responde por <strong>35%</strong> das causas femininas (junto com o tubário, também 35%; endometriose 20%; idiopático 10%). Qualquer nível do eixo hipotálamo (GnRH pulsátil) → hipófise (FSH e LH) → ovário (estrogênio e progesterona) → útero (implantação) pode estar comprometido, gerando ciclos anovulatórios, irregularidade menstrual, amenorreia e infertilidade.</p>

<h3>Como comprovar a ovulação</h3>
<h4>Progesterona de fase lútea</h4>
<p>Coletada no <strong>21º dia</strong> de um ciclo de 28 dias (cerca de 7 dias após a ovulação presumida):</p>
<ul><li><strong>&lt; 3 ng/mL</strong> → ciclo anovulatório.</li><li><strong>3 a 10 ng/mL</strong> → ovulação incerta ou insuficiência lútea.</li><li><strong>&gt; 10 ng/mL</strong> → ciclo ovulatório confirmado.</li></ul>
<h4>Ultrassonografia seriada</h4>
<p>Monitorização do crescimento folicular ao longo do ciclo; o <strong>folículo dominante mede 18 a 24 mm</strong> no pré-ovulatório; <strong>colapso folicular com líquido livre no fundo de saco de Douglas</strong> confirma que a ovulação ocorreu. O mesmo exame avalia espessura e padrão endometrial.</p>
<h3>SOP</h3>
<p>Acomete <strong>6 a 10%</strong> das mulheres em idade reprodutiva e é <strong>diagnóstico de exclusão</strong>, fechado pelos <strong>critérios de Rotterdam — 2 de 3</strong>:</p>
<ol><li><strong>Irregularidade menstrual:</strong> oligo ou amenorreia (menos de 8 ciclos/ano ou ciclos &gt; 35 dias).</li><li><strong>Hiperandrogenismo:</strong> clínico (acne, hirsutismo, alopecia) ou laboratorial (testosterona livre elevada).</li><li><strong>Morfologia policística:</strong> ≥ 12 folículos de 2–9 mm <strong>ou</strong> volume ovariano &gt; 10 cm³ em pelo menos um ovário.</li></ol>

<p>Causas mais frequentes: ISTs por <strong>Chlamydia trachomatis</strong> e <strong>Neisseria gonorrhoeae</strong>, endometriose pélvica com acometimento tubário, cirurgias abdominais e pélvicas com aderências, DIP recorrente, aborto séptico e puerpério complicado.</p>
<blockquote><p>A <strong>hidrossalpinge</strong> não é achado inocente: além de bloquear a tuba, o líquido acumulado <strong>piora os resultados da FIV</strong>, o que costuma indicar tratar a tuba antes do ciclo de reprodução assistida.</p></blockquote>
<h3>Endometriose (fator peritoneal)</h3>
<p>Atinge <strong>5 a 15%</strong> das mulheres em idade reprodutiva, está presente em <strong>25 a 50%</strong> das mulheres inférteis e torna inférteis <strong>30 a 50%</strong> de suas portadoras. Mecanismos propostos: distorção anatômica com obstrução tubária, ambiente peritoneal hostil aos gametas (citocinas inflamatórias), endometriomas ovarianos comprometendo a reserva, receptividade endometrial alterada e falha da motilidade e do fimbriotransporte. Investigação: clínica (dismenorreia, dispareunia, sangramento anormal), RNM de pelve para doença profunda, ultrassom com preparo intestinal e <strong>laparoscopia como padrão-ouro</strong> diagnóstico e terapêutico; estadiamento <strong>I a IV (ASRM)</strong>.</p>
<h3>Fator uterino, fator cervical e ISCA</h3>
<ul><li><strong>Uterino:</strong> miomatose submucosa ou intramural ≥ 4 cm, pólipo endometrial, malformações müllerianas (septo, bicorno), <strong>síndrome de Asherman</strong> (sinéquias).</li><li><strong>Cervical:</strong> muco cervical hostil, estenose pós-conização, anticorpos antiespermáticos (raro), infecções cervicais crônicas.</li><li><strong>ISCA (infertilidade sem causa aparente):</strong> diagnóstico de exclusão após investigação completa, <strong>10 a 15%</strong> dos casos; mecanismos possíveis são fertilização deficiente, disfunção oocitária sutil e implantação comprometida.</li></ul>
<hr>
<h2>Reserva Ovariana</h2>
<p>A reserva ovariana reflete o estoque folicular remanescente e a qualidade oocitária — determinante fundamental do prognóstico reprodutivo.</p>
<div class="tbl"><table><thead><tr><th>Marcador</th><th>Como avaliar</th><th>Corte de reserva reduzida</th></tr></thead><tbody><tr><td><strong>Idade</strong></td><td>História</td><td>Queda acelerada <strong>a partir dos 35 anos</strong>, com aumento do risco de aneuploidia</td></tr><tr><td><strong>AMH</strong></td><td>Qualquer dia do ciclo</td><td><strong>&lt; 1,0 ng/mL</strong></td></tr><tr><td><strong>CFA</strong></td><td>Ultrassom transvaginal, dia 2–5</td><td><strong>&lt; 7 folículos</strong> de 2–9 mm no total</td></tr><tr><td><strong>FSH basal</strong></td><td>Dia 3–5 do ciclo</td><td><strong>&gt; 10–12 UI/L</strong></td></tr></tbody></table></div>
<p>O AMH é sintetizado pelas células da granulosa dos folículos pré-antrais e <strong>independe do ciclo menstrual</strong>, o que o torna o melhor marcador disponível. A CFA é o melhor preditor de resposta à estimulação ovariana. O FSH basal sobe porque a depleção folicular reduz a retroalimentação negativa.</p>
<blockquote><p><strong>Pegadinha clássica.</strong> O <strong>AMH é o melhor marcador laboratorial</strong>, mas a <strong>idade é o preditor isolado mais importante</strong> do prognóstico reprodutivo. AMH bom aos 42 anos não devolve qualidade oocitária.</p></blockquote>
<hr>
<h2>Tratamento — Baixa e Alta Complexidade</h2>
<h3>Etapa 1 — retirar ou reverter as causas identificadas</h3>
<p>Tratar ISTs, corrigir hipogonadismo, realizar varicocelectomia, operar o fator tubário, promover perda de peso e suspender drogas e anabolizantes. Nenhuma técnica de reprodução assistida vem antes desta etapa.</p>
<h3>Etapa 2 — escolher o método</h3>
<h4>Baixa complexidade</h4>
<ul><li><strong>Coito programado (CP):</strong> relação sexual orientada pela monitorização ovulatória (ultrassom seriado + LH urinário). Indicado na infertilidade ovulatória e na idiopática leve.</li><li><strong>Inseminação intrauterina (IIU):</strong> sêmen processado depositado na cavidade uterina por cateter, em geral associada à estimulação ovariana controlada. Indicações: <strong>fator cervical, fator masculino leve a moderado e infertilidade idiopática</strong>.</li></ul>
<h4>Alta complexidade</h4>
<ul><li><strong>FIV (fertilização in vitro):</strong> punção oocitária, fertilização extracorpórea e transferência embrionária. Indicações: <strong>fator tubário, falha de IIU, endometriose grave e reserva diminuída</strong>.</li><li><strong>ICSI (injeção intracitoplasmática):</strong> microinjeção de um único espermatozoide no oócito. Indicação principal: <strong>fator masculino grave (OAT)</strong>; também nas falhas de fertilização em FIV convencional.</li></ul>
<blockquote><p><strong>Resumo da escolha.</strong> Fator cervical ou masculino leve → IIU. Fator tubário, endometriose grave ou falha de IIU → FIV. Fator masculino grave ou falha de fertilização em FIV → ICSI.</p></blockquote></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';
      if (cur && a===null) bg = '#121a2b';
      var st = a===null ? 'em branco' : (a===q.correctIndex ? 'correta' : 'incorreta');
      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +

                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +
              '</div></div></div>';
  }
  document.getElementById('hdr').innerHTML = html;

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +
      '</button>';
  }).join('');

  var expl = reveal ? '<div style="margin-top:20px;padding:16px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;animation:qFade .26s ease">' +

function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }

        '<span style="flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:12px;font-weight:600;background:'+numBg+';color:'+numFg+'">'+pad(r.idx+1)+'</span>' +
        '<span style="flex:1;min-width:0;font-size:14px;line-height:1.45;color:#39404f;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(r.q.question)+'</span>' +

        stat(c.hit,'Certas','#2e7d55')+stat(c.miss,'Erradas','#c04437')+stat(c.blank,'Branco','#8a8578')+stat(pct+'%','Aproveit.','#2b57cc') +

      '<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:28px;padding-top:24px;border-top:1px solid #e4e0d8">' +

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;white-space:pre-wrap;' +
    'text-wrap:pretty">' + esc(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'white-space:pre-wrap;text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.textContent = txt;
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
</body>
