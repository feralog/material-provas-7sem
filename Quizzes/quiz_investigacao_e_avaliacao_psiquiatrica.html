<script type="text/html" id="resumoSrc"><h2>Normalidade: diferença de grau, nunca de natureza</h2>
<p>Antes de qualquer diagnóstico vem a pergunta: o que separa uma vivência comum de um sintoma psiquiátrico? A resposta está em <strong>três critérios</strong>, sempre avaliados juntos. O primeiro é a <strong>intensidade</strong> — quanto o sintoma prejudica o dia a dia; recomenda-se pedir que o paciente quantifique, por exemplo com uma nota de 0 a 10. O segundo é a <strong>quantidade</strong> — a frequência com que o sintoma se repete, pois uma vez na vida é diferente de todos os dias. O terceiro é o <strong>tempo de permanência</strong> — por quanto tempo o sintoma persiste: minutos e se acalma, ou fica fixado por horas e dias. A regra de ouro é que a diferença entre o normal e o patológico é sempre de <strong>grau</strong> (intensidade, quantidade, tempo), <strong>nunca de natureza</strong>.</p>

<blockquote><p>Pegadinha: "Ser normal é ter tudo e não ter nada." Todos temos os sintomas — por pouco tempo, com pouca intensidade e sem grande prejuízo. A normalidade não é a ausência de sintomas.</p></blockquote>
<p>Três pares de exemplos fixam a ideia — vivências que diferem em grau, não em natureza:</p>
<div class="tbl"><table><thead><tr><th>Vivência normal</th><th>Versão patológica</th></tr></thead><tbody><tr><td>Ouvir "chamarem seu nome" uma ou duas vezes na vida</td><td>Psicose: ouvir vozes o tempo todo</td></tr><tr><td>Sair de uma aula chateado, achar que "ninguém gosta de você" e se acalmar após o banho e o jantar</td><td>Paranoia: o estado se mantém o tempo todo</td></tr><tr><td>Ver um trânsito, imaginar um acidente, visualizar e esquecer</td><td>Ansiedade catastrófica: fixação — assistir o dia todo a programas policiais temendo pelos filhos</td></tr></tbody></table></div>
<h2>A relação médico-paciente e a ressonância emocional</h2>
<p>A consulta psiquiátrica é definida como uma <strong>troca constante, peculiar, de ida e volta</strong> entre médico e paciente (MÉDICO ⇄ PACIENTE) — uma ressonância mútua da qual não se pode esquecer. Essa ressonância é mais do que um fenômeno da relação: é um <strong>instrumento clínico</strong>. O que o paciente desperta em você orienta a hipótese diagnóstica: sentir <strong>medo</strong> aponta para risco de comportamento antissocial ou psicopatia; <strong>tristeza</strong>, para provável quadro depressivo; <strong>agitação</strong> é um estado emocional contagioso, que se espalha pela sala de espera. Quando o paciente relata uma tragédia sem nenhuma expressão emocional e o entrevistador "não sente nada", os residentes dizem que "<strong>não ressoou</strong>" — e essa ausência também é um sinal a investigar, não um defeito do entrevistador.</p>

<p>Um caso clínico exemplar mostra o medo bloqueando a escuta: um paciente que começou a beber na roça com o pai na infância, viu o pai assassinado aos 15 anos, sofreu agressão grave com traumatismo cranioencefálico aos 16 e, aos 18, matou a facadas o assassino do pai. Hoje vive em São Paulo, trabalha como pedreiro e parou de beber há 12 anos. O residente travou de medo diante do relato sem expressão emocional ("Eu fiz o que tinha que fazer"). A conduta correta: analisar o <strong>contexto cultural de violência</strong> e investigar os <strong>pontos positivos</strong> — por que mudou de estado, escolheu ser pedreiro e parou de beber. Quando o médico não se dá conta de atender, o caminho é encaminhar.</p>
<h2>Os limites da atuação médica</h2>
<p>Precisamos compreender os limites do nosso poder. Na UBS, diante de um paciente psicótico, a conduta é acolher, fazer os exames básicos e encaminhar ao especialista; diante de pânico achando que está infartando, eletrocardiograma, tranquilizar e encaminhar para psicologia/psiquiatria. Diante da pergunta "Doutora, qual é o sentido da vida?", a resposta é clara: "<strong>Eu sou psiquiatra, não sou guru</strong> — vamos focar no tratamento do seu transtorno bipolar". O resultado final depende das escolhas do paciente sobre o que ele aceita mudar — e isso está além do nosso poder. Na agitação, uma ferramenta de ouro é <strong>reestabelecer dados de realidade</strong> com frases simples e seguras ("isto é um hospital, ninguém vai te fazer mal"), o que acalma o paciente.</p>
<h2>Rigidez mental, ansiedade e a curva do burnout</h2>
<p>A <strong>rigidez mental</strong> (patológica) é dar sempre a mesma resposta para qualquer estímulo da vida: "Morreu o pai, bebe. Nasceu o filho, bebe. É aniversário, bebe. O time ganhou ou perdeu, bebe." Ela repete os mesmos caminhos neuronais. A <strong>maturidade</strong> (saudável) é adaptar-se e encontrar soluções criativas para as frustrações diárias — atividades que estimulam o cérebro de formas diferentes, como dança e novas rotinas, abrem novas vias cerebrais. O paciente preso à descrição física do sintoma ("boca seca, coração batendo") foca na periferia e perde a meta de vida; se patina na terapia, cabe ao psiquiatra dar um direcionamento para o ponto central do conflito.</p>

<p>A ansiedade normal nos move — até certo limite. A <strong>curva de desempenho x estresse</strong> mostra que, até certo ponto, o estresse aumenta a produtividade; além do limite, o indivíduo entra em <strong>burnout</strong>. Os <strong>sintomas nucleares</strong> da ansiedade são medo e preocupação constante; os <strong>periféricos</strong>, insônia, cansaço, tensão, irritabilidade, dificuldade de concentração e alterações alimentares. Os bancos geram ansiedade proposital e constante (metas abusivas, ameaça de demissão) — o que leva a adoecimento grave.</p>
<blockquote><p>Pegadinha: "Sem ansiedade, o estudante não estuda e o cachorro não corre." A ansiedade é necessária para nos mover; o problema não é ela existir, é passar do limite.</p></blockquote>
<h2>O consultório e a entrevista psiquiátrica</h2>
<p>O consultório é um espaço planejado: <strong>acesso físico</strong> com duas portas (uma para o paciente, outra para os funcionários), <strong>posicionamento</strong> do médico nunca acuado no canto e com saída desimpedida, <strong>segurança</strong> — acolhedor, mas livre de objetos pontiagudos, agulhas, tesouras ou seringas, evitando brincos e colares longos — e <strong>postura</strong>:</p>
<div class="tbl"><table><thead><tr><th>Postura do entrevistador</th><th>Situação</th></tr></thead><tbody><tr><td>Passiva</td><td>Paciente comunicativo — anotar para investigar depois</td></tr><tr><td>Ativa</td><td>Paciente fechado ou hostil — técnicas para estabelecer a aliança terapêutica</td></tr></tbody></table></div>
<p>A escuta clínica ativa esmiuça cada sintoma relatado. Diante de "não durmo há uma semana" — biologicamente incompatível com a vida — o médico pergunta: a que horas deita? Quanto tempo leva para dormir? Quantas vezes acorda? O que faz quando acorda? Assim se corrigem distorções de percepção do paciente sobre o próprio sintoma. O entrevistador deve manter a <strong>neutralidade</strong>: valores pessoais não interferem, julgamentos e conselhos pessoais são inadequados, e a postura rígida e autoritária ("o médico aqui sou eu!") destrói a aliança terapêutica. Se o paciente pesquisou na internet, o caminho é validar o interesse e esclarecer com base na intensidade e no prejuízo clínico.</p>
<p>A psiquiatria exige tempo: <strong>30 minutos, no mínimo, por consulta</strong> — o que permite acolhimento e desabafo e estrutura o raciocínio clínico — contra os 12 minutos da pressão de convênios e do sistema de saúde. O médico mantém o controle da entrevista com <strong>assertividade</strong>, trazendo de volta, com respeito, o paciente prolixo ou tangencial. Toda pergunta invasiva ou exame deve ser justificado ao paciente (avisar antes de se levantar, pedir licença para tocar, explicar por que pergunta sobre alucinações): isso gera respeito e melhora drasticamente a adesão ao tratamento.</p>
<h2>CID, DSM e a investigação clínica</h2>
<p>Dois sistemas de classificação, funções complementares. A <strong>CID</strong> — Classificação Internacional de Doenças, da OMS — é a classificação oficial, obrigatória para laudos, receitas e guias burocráticas no sistema de saúde. O <strong>DSM</strong> — Manual Diagnóstico e Estatístico de Transtornos Mentais, da APA — é extremamente detalhado, padrão-ouro para pesquisas, ensaios clínicos e para estruturar o tempo e a intensidade dos critérios diagnósticos.</p>

<p>A investigação clínica também abrange os <strong>fatores desencadeantes</strong> — eventos estressores que iniciam o quadro, como o luto, muitas vezes não reconhecido pelo paciente — e os <strong>fatores de manutenção</strong> — condições que perpetuam o adoecimento, como um ambiente de trabalho abusivo, que exigem intervenções além do medicamento.</p>
<h2>Risco, exames complementares e a anamnese</h2>
<p>A <strong>avaliação de risco</strong> determina o nível de cuidado: internação, CAPS ou ambulatório. Dois casos ilustram a comparação. Caso 1: jovem de 15 anos que, após término de namoro, ingere 10 comprimidos de Cibalena e é levada ao pronto-socorro pela família estruturada — risco menor, por haver rede de apoio, método de menor letalidade e primeira tentativa. Caso 2: homem de 35 anos, isolado, morando sozinho em outro estado, na segunda tentativa de suicídio com 30 comprimidos de Rivotril — risco imensamente maior, pela letalidade do método, pela reiteração da tentativa e pela ausência total de rede de apoio. A farmacologia é apenas uma fração do tratamento, que deve ser compartilhado com psicoterapia e manejo dos fatores psicossociais.</p>
<p>Por que a psiquiatria não tem exame de imagem diagnóstico de rotina? Porque lida com neuroquímica intercelular e conexões sinápticas, em nível microscópico, dentro da caixa craniana fechada. A <strong>ressonância magnética funcional</strong> é recurso de pesquisa científica — mapeia áreas ativas sob estímulos, e padrões de grupo (como hipocampo reduzido em deprimidos) não servem de diagnóstico individual. Os exames de imagem e laboratoriais são pedidos para <strong>excluir causas orgânicas secundárias</strong> (tumores, distúrbios metabólicos) e para avaliar populações específicas: idosos com demência, crianças com suspeita de autismo e etilistas graves.</p>
<blockquote><p>Pegadinha: o diagnóstico psiquiátrico nasce da anamnese, não de exames de imagem. Nenhum exame confirma o diagnóstico; exames excluem causas orgânicas.</p></blockquote>
<p>A <strong>avaliação neuropsicológica</strong> avalia funções cognitivas puras — memória, atenção, planejamento e funções executivas — enquanto os <strong>testes psicológicos</strong> avaliam traços de personalidade, funcionamento psíquico e dinâmica emocional. A anamnese psiquiátrica segue uma estrutura fixa: <strong>QP</strong> (queixa principal) → <strong>HMA</strong> (história da moléstia atual) → <strong>Antecedentes Pessoais</strong> (hábitos, desenvolvimento, substâncias, projeto de vida) → <strong>Qualidade de Vida</strong> → <strong>Antecedentes Familiares</strong>.</p>

<h2>Genética e o modelo biopsicossocial</h2>
<p>O adoecimento não tem uma causa única — cerca de <strong>50% do risco</strong> de desenvolver um transtorno psiquiátrico vem da vulnerabilidade genética, e a outra metade vem do ambiente e da história de vida. A "<strong>conspiração de fatores</strong>" reúne três elementos: <strong>vulnerabilidade</strong> (fatores biológicos, genéticos, lesões físicas precoces como TCE infantil ou meningite, ambientes familiares caóticos), <strong>fatores desencadeantes</strong> (estressores agudos que disparam o primeiro episódio) e <strong>fatores de manutenção</strong> (elementos que mantêm o paciente doente ao longo do tempo). Alguém com forte predisposição genética à esquizofrenia ou à bipolaridade pode nunca manifestar a doença de forma grave, dado um ambiente acolhedor, estrutura organizadora, cuidados com o estilo de vida e psicoterapia precoce. Por isso não se devem fazer comparações simplistas de desempenho ou resistência ao estresse — cada pessoa tem constituição genética e história de vida únicas. Como resumiu Karl Jaspers, "a doença mental é uma perda de opções existenciais": o paciente perde a flexibilidade para responder de forma adaptativa aos desafios.</p>

<p>Os seis pontos-chave: normal x patológico é diferença de intensidade, quantidade e tempo — nunca de natureza; a ressonância emocional do médico é um instrumento clínico valioso; cada papel profissional tem limites — o resultado final depende do paciente; a entrevista exige tempo, escuta ativa e assertividade respeitosa; o diagnóstico nasce da anamnese, não de exames de imagem; e o adoecimento é sempre uma conspiração de fatores — genética, ambiente e história de vida.</p></script>

  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +
              '</div></div></div>';
  }
  document.getElementById('hdr').innerHTML = html;
}
function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */

    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';

    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

  };

  var fdefs = [['all','Todas',c.total],['wrong','Erradas',c.miss],['right','Certas',c.hit],['blank','Em branco',c.blank]];

  var list = reviewList();

        var isC = n===r.q.correctIndex, isMine = n===r.a;

        if (isMine && !isC) { bd='#eec4bd'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; tag='Sua resposta'; tBg='#f7ddd8'; tFg='#8f2f25'; }
        if (isMine && isC)  { tag='Sua resposta ✓'; }
        return '<div style="display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:11px;font-size:14px;line-height:1.5;border:1px solid '+bd+';background:'+bg+';color:'+fg+'">' +
          '<span style="flex-shrink:0;width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:10.5px;font-weight:600;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
          '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
          (tag ? '<span style="flex-shrink:0;'+mono+';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;margin-top:1px;background:'+tBg+';color:'+tFg+'">'+tag+'</span>' : '') +

      body = '<div style="padding:2px 15px 18px;animation:qDrawer .2s ease">' +

    }
    return '<div style="background:#fff;border:1px solid '+(open?'#c9c3b6':'#e4e0d8')+';border-radius:14px;overflow:hidden;transition:border-color .15s ease">' +
      '<button type="button" data-act="toggle" data-n="'+r.idx+'" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 15px;cursor:pointer">' +
        '<span style="flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:12px;font-weight:600;background:'+numBg+';color:'+numFg+'">'+pad(r.idx+1)+'</span>' +
        '<span style="flex:1;min-width:0;font-size:14px;line-height:1.45;color:#39404f;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(r.q.question)+'</span>' +
        '<span style="flex-shrink:0;'+mono+';font-size:16px;color:#8a8578;width:16px;text-align:center">'+(open?'−':'+')+'</span>' +
      '</button>' + body + '</div>';
  }).join('');

  document.getElementById('stage').innerHTML =
    '<section style="padding:34px 0 0;animation:qFade .3s ease">' +
      '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:14px">Resultado</div>' +
      '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:36px;line-height:1.12;font-weight:400;letter-spacing:-.025em;margin:0 0 8px">'+title+'</h2>' +
      '<p style="font-size:15px;line-height:1.6;color:#5b6478;margin:0 0 24px;max-width:48ch;text-wrap:pretty">'+msg+'</p>' +
      '<div style="height:8px;border-radius:99px;background:#e4e0d8;overflow:hidden;margin-bottom:10px">' +
        '<div style="height:100%;border-radius:99px;background:#121a2b;transition:width .7s cubic-bezier(.22,1,.36,1);width:'+pct+'%"></div></div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e4e0d8;border:1px solid #e4e0d8;border-radius:14px;overflow:hidden;margin-bottom:34px">' +
        stat(c.hit,'Certas','#2e7d55')+stat(c.miss,'Erradas','#c04437')+stat(c.blank,'Branco','#8a8578')+stat(pct+'%','Aproveit.','#2b57cc') +
      '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px">' +
        '<h3 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;font-weight:500;letter-spacing:-.015em;margin:0">Gabarito comentado</h3>' +
        '<button type="button" data-act="toggleAll" class="h-ink" style="background:none;border:0;padding:6px 0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;text-decoration:underline;text-underline-offset:3px">'+(allOpen?'Recolher tudo':'Expandir tudo')+'</button>' +
      '</div>' +
      '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">'+filters+'</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">'+cards+'</div>' +
      (list.length===0 ? '<div style="padding:38px 16px;text-align:center;color:#8a8578;font-size:14px;border:1px dashed #ddd8ce;border-radius:14px">Nenhuma questão neste filtro.</div>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:28px;padding-top:24px;border-top:1px solid #e4e0d8">' +
        '<button type="button" data-act="restart" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:13px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">Refazer o quiz</button>' +
        '<button type="button" data-act="back" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Voltar às questões</button>' +
        '<button type="button" data-act="resumo" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Ler o resumo</button>' +
      '</div></section>';
}

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;white-space:pre-wrap;' +
    'text-wrap:pretty">' + esc(m.content) + '</div></div>';
}

function chatBox(q){
  if (!dsOn()) return '';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">Ainda com dúvida?</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="Por que a que eu marquei está errada?" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'white-space:pre-wrap;text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var msgs = [
    { role:'system', content:
      'Voce e um tutor de medicina ajudando um estudante do 7o semestre que errou uma questao. ' +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.textContent = txt;
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
