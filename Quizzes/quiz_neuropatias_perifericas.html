<script type="text/html" id="resumoSrc"><h2>O sistema nervoso periférico: classificação, padrões e mecanismos de lesão</h2>
<p>O sistema nervoso periférico é a parte do sistema nervoso em que os neurônios ou seus prolongamentos se relacionam com a célula satélite periférica, a <strong>célula de Schwann</strong>. Compreende todos os nervos cranianos <strong>com exceção do olfatório e do óptico</strong>, as raízes nervosas, os gânglios da raiz dorsal, os troncos nervosos periféricos com suas ramificações terminais e o sistema nervoso autônomo periférico.</p>
<p>O número de etiologias é enorme, mas a expressão clínica é muito mais limitada — e é por isso que a classificação importa mais do que a lista de causas. Toda neuropatia periférica pode ser enquadrada em <strong>seis parâmetros</strong>:</p>
<div class="tbl"><table><thead><tr><th>Parâmetro</th><th>Possibilidades</th></tr></thead><tbody><tr><td>Velocidade de instalação</td><td>aguda (&lt; 1 semana) · subaguda (&lt; 1 mês) · crônica (&gt; 1 mês)</td></tr><tr><td>Tipo de fibra</td><td>motora · sensitiva · autonômica · mista</td></tr><tr><td>Tamanho da fibra</td><td>grossa · fina · mista</td></tr><tr><td>Distribuição</td><td>proximal · distal · difusa</td></tr><tr><td>Padrão</td><td>mononeuropatia · mononeuropatia múltipla · polineuropatia</td></tr><tr><td>Patologia</td><td>degeneração axonal · desmielinização segmentar · mista</td></tr></tbody></table></div>
<h3>O padrão é o primeiro divisor de águas</h3>
<p>Diante de um paciente com neuropatia, a primeira pergunta é em que padrão ele se encaixa, porque disso depende todo o diagnóstico diferencial.</p>
<div class="tbl"><table><thead><tr><th>Padrão</th><th>Distribuição</th><th>O que sugere</th></tr></thead><tbody><tr><td><strong>Polineuropatia</strong></td><td>simétrica, distal e bilateral</td><td>leque etiológico amplo: metabólicas, tóxico-carenciais, hereditárias</td></tr><tr><td><strong>Polirradiculo(neuro)patia</strong></td><td>raízes espinais, ou raízes e troncos</td><td>Guillain-Barré, forma crônica, radiculopatias infecciosas</td></tr><tr><td><strong>Mononeuropatia</strong></td><td>lesão focal de um nervo</td><td>compressão, trauma, túnel do carpo, neurite leprosa</td></tr><tr><td><strong>Mononeuropatia múltipla</strong></td><td>lesão multifocal, assimétrica</td><td>vasculites, diabetes, hanseníase, Lyme, HIV, sarcoidose</td></tr></tbody></table></div>
<blockquote><p>Com a progressão, a mononeuropatia múltipla pode acabar envolvendo simetricamente todos os nervos e parecer uma polineuropatia. Mesmo aí o exame cuidadoso mostra <strong>graus diferentes de comprometimento por território nervoso</strong> — é esse detalhe que desmascara o padrão multifocal de origem.</p></blockquote>
<p>Nos casos crônicos, além da causa adquirida, sempre se considera neuropatia hereditária: evolução de <strong>anos</strong>, simetria desde o início, <strong>pés cavos e dedos em martelo</strong>. História familiar negativa <strong>não exclui</strong> — a herança pode ser recessiva, ou os sinais nos parentes são discretos e passam despercebidos por eles.</p>
<h3>Degeneração axonal × desmielinização: dois mecanismos, dois tempos</h3>
<p>A mielina é o elemento mais suscetível da fibra nervosa e pode ser atingida primariamente ou de forma secundária a uma doença do axônio. Três processos se combinam em proporções variadas no mesmo paciente:</p>
<ul><li><strong>Desmielinização segmentar</strong> — degeneração focal da bainha <strong>com o axônio preservado</strong>.</li><li><strong>Degeneração walleriana</strong> — consequência da interrupção focal do axônio.</li><li><strong>Degeneração axonal centrípeta</strong> — resulta de lesão metabólica do corpo do neurônio, com</li></ul>
<p>queda da síntese proteica e falência de suprimento para as porções mais distais do axônio.</p>
<p>Nas duas últimas há degeneração <strong>secundária</strong> da mielina.</p>
<div class="tbl"><table><thead><tr><th></th><th>Desmielinização segmentar</th><th>Degeneração axonal / walleriana</th></tr></thead><tbody><tr><td>Axônio</td><td>íntegro</td><td>interrompido ou em sofrimento</td></tr><tr><td>Recuperação</td><td><strong>rápida</strong> — basta remielinizar</td><td><strong>lenta</strong>, meses a anos: o axônio precisa regenerar e reconectar-se ao músculo</td></tr><tr><td>Atrofia muscular</td><td>discreta, por <strong>desuso</strong></td><td>intensa, por <strong>desnervação</strong></td></tr><tr><td>Eletroneuromiografia</td><td>↓ velocidade de condução, ↑ latência distal, bloqueio de condução, ↑ latência da onda F</td><td>↓↓ amplitude do potencial + sinais de desnervação na agulha</td></tr></tbody></table></div>
<p>A degeneração axonal centrípeta explica por que tantas polineuropatias — nutricionais, metabólicas e tóxicas — começam pelos <strong>pés e pernas</strong> e só mais tarde, e com menos intensidade, atingem mãos e antebraços: as alterações se iniciam na parte distal dos nervos mais calibrosos e mais longos e progridem em direção ao corpo celular.</p>
<hr>
<h2>Semiologia: o que cada fibra entrega quando é lesada</h2>
<p>A fraqueza muscular é proporcional ao número de motoneurônios alfa afetados e pode vir de desmielinização segmentar, de interrupção axonal ou de destruição do neurônio motor. A hipotonia acompanha os quadros de comprometimento importante e decorre da <strong>interrupção do arco reflexo espinal</strong>. A perda dos reflexos profundos é comum e tem vários mecanismos: perda de fibras aferentes dos fusos, desnervação das fibras intrafusais e dispersão temporal da condução. <strong>Fasciculações e câimbras não são achado relevante</strong> na maioria das polineuropatias — aparecem em algumas crônicas e, ocasionalmente, em radiculopatias crônicas.</p>
<p>A sensibilidade é mais comprometida nos segmentos distais, em padrão de <strong>bota e luva</strong>, e acomete mais os membros inferiores que os superiores. Com a progressão, surgem hipoestesia ou anestesia proximais e no tronco.</p>
<div class="tbl"><table><thead><tr><th>Fibra lesada</th><th>O que ela conduz</th><th>Quadro resultante</th></tr></thead><tbody><tr><td><strong>Mielínicas finas e amielínicas</strong></td><td>dor e temperatura</td><td>hipoestesia térmica e dolorosa <strong>com tátil, vibratória e cineticopostural preservadas</strong> — dissociação <em>pseudo-siringomiélica</em></td></tr><tr><td><strong>Grandes fibras mielínicas</strong></td><td>tato, vibração, propriocepção</td><td>perda da sensibilidade <strong>tátil</strong>, com térmica e dolorosa preservadas; ataxia sensitiva</td></tr><tr><td><strong>Autonômicas</strong></td><td>sudorese, tônus vascular, vísceras</td><td>anidrose e hipotensão ortostática</td></tr></tbody></table></div>
<p>Na maioria das polineuropatias <strong>todas</strong> as modalidades estão comprometidas, e a intensidade da hipoestesia costuma ser maior ou proporcional à fraqueza.</p>
<h3>Fenômenos positivos e ataxia</h3>
<ul><li><strong>Parestesia</strong> — queimação ou formigamento, em território de um nervo ou em bota e luva.</li><li><strong>Hiperestesia</strong> — sensibilidade aumentada; resposta desagradável a estímulo <strong>não</strong> nocivo.</li><li><strong>Hiperpatia</strong> — resposta dolorosa e desagradável a estímulo <strong>nocivo</strong>, sobretudo repetido.</li></ul>
<p>Hiperestesia e hiperpatia surgem na lesão <strong>parcial</strong> do nervo ou durante a recuperação da injúria, e não se conseguiu correlacioná-las com um tipo específico de fibra.</p>
<p>A <strong>ataxia sensitiva</strong> resulta de deaferentação proprioceptiva por perda de fibras grossas. Quando a força está preservada e os membros superiores são mantidos estendidos com os olhos fechados, aparecem <strong>movimentos pseudo-atetóticos</strong> dos dedos.</p>
<h3>Alterações tróficas e autonômicas</h3>
<p>A atrofia por desnervação é o principal distúrbio trófico. Deformidades de pés, mãos e coluna são frequentes nas polineuropatias crônicas, sobretudo nas de início na infância.</p>
<blockquote><p><strong>O pé insensível é o pé que se destrói.</strong> A analgesia das partes distais torna os pés suscetíveis a queimaduras, escaras e injúria repetida: surgem úlceras plantares (<em>mal perfurante plantar</em>) e perda de falanges distais. A <strong>osteoartropatia neurogênica</strong>, ou junta de Charcot, traz enormes deformidades articulares, <strong>ausência de dor</strong>, início súbito e desenvolvimento rápido. A pele fica atrófica, lisa e brilhante; as unhas, curvas e rígidas.</p></blockquote>
<p>As alterações autonômicas mais frequentes são <strong>anidrose</strong> e <strong>hipotensão ortostática</strong>, e muitas vezes constituem o quadro principal. Somam-se pupilas médias ou pequenas e arreativas, falta de lágrimas e saliva, impotência sexual, incontinência urinária e fecal, dilatação de esôfago e cólon.</p>
<hr>
<h2>Como investigar</h2>
<p>A sequência começa pela história: <strong>ocupação</strong>, medicamentos em uso, doenças sistêmicas concomitantes e hábitos (alcoolismo, drogas). Exames iniciais: hemograma, glicemia, hemoglobina glicosilada, ureia e creatinina, hormônios tireoidianos, fator reumatoide, fator antinuclear, dosagem de vitamina B12, imunoeletroforese sérica e urinária, sorologias para hepatite e HIV.</p>
<p>A <strong>eletroneuromiografia</strong> confirma a neuropatia e, mais importante, define o padrão — desmielinizante ou axonal, conforme a tabela acima. Na mononeuropatia múltipla ela identifica quais nervos estão acometidos e o grau do comprometimento.</p>
<p>A <strong>biópsia de nervo</strong>, em geral do sural, é o <strong>último</strong> exame, pedido quando a investigação sistêmica não definiu etiologia. Pode fechar o diagnóstico de vasculite, neuropatia amiloide, mal de Hansen, infiltração neoplásica do nervo e algumas doenças hereditárias.</p>
<blockquote><p>Mesmo com investigação clinicolaboratorial adequada, <strong>cerca de 24% dos pacientes permanecem sem etiologia determinada</strong>. Não é falha do método: é a estatística da doença.</p></blockquote>
<p>Para as formas adquiridas, a abordagem inicial se organiza em <strong>quatro grupos</strong>: distúrbios metabólicos, tóxico-carenciais, infecciosos e imune-mediados.</p>
<hr>
<h2>Neuropatias metabólicas e a polineuropatia diabética</h2>
<p>O <strong>diabetes melito</strong> é a causa mais frequente do grupo metabólico; seguem-se falência renal crônica, falência hepática, hipotireoidismo e acromegalia. Em geral são <strong>axonais</strong>, sensitivo-motoras, com predomínio dos sintomas sensitivos distais.</p>
<p>Duas situações merecem registro à parte:</p>
<ul><li><strong>Neuropatia urêmica</strong> — prevalência de 10% a 80%, ligada à duração e à gravidade da</li></ul>
<p>falência renal. Quando o <strong>clearance de creatinina cai abaixo de 10%</strong> do normal, a velocidade de condução motora começa a diminuir, embora os sintomas não guardem relação direta com ela. Quadro: polineuropatia sensitivo-motora progressiva e simétrica, com <strong>disestesias nos pés</strong> e déficit motor leve; acometimento autonômico é raro. Atribui-se o dano a substâncias de peso molecular entre 300 e 2.000 (metilguanidina, mioinositol). Diálise e transplante têm efeito benéfico — até neuropatias graves melhoram meses após o transplante.</p>
<ul><li><strong>Polineuropatia do doente crítico</strong> — ocorre em 20% a 50% dos admitidos em terapia</li></ul>
<p>intensiva. É polineuropatia <strong>motora axonal</strong> consequente à síndrome de resposta inflamatória sistêmica (sepse, falência de múltiplos órgãos, pancreatite, trauma, queimadura). Clinicamente: tetraparesia, arreflexia profunda e <strong>insuficiência respiratória prolongada com dificuldade de desmame</strong>. Melhora se o paciente sobrevive à doença de base.</p>
<h3>Neuropatia diabética: números e formas</h3>
<p>Cerca de <strong>15%</strong> dos diabéticos têm sintomas e sinais de neuropatia. A prevalência vai de <strong>7,5% na descoberta do diabetes a 50% após 25 anos</strong>. Crianças raramente são acometidas (2%). Ocorre no tipo I, no tipo II e no diabetes associado a outras síndromes.</p>
<h4>Classificação</h4>
<ul><li><strong>Polineuropatias simétricas</strong> — sensitiva ou sensitivo-motora · motora aguda ou subaguda ·</li></ul>
<p>autonômica</p>
<ul><li><strong>Neuropatias focais e multifocais</strong> — de nervos cranianos · mononeuropatia de tronco e</li></ul>
<p>membros · neuropatia motora proximal</p>
<div class="tbl"><table><thead><tr><th>Forma</th><th>Marca registrada</th></tr></thead><tbody><tr><td><strong>Polineuropatia sensitiva</strong></td><td>a mais frequente; comum iniciar <strong>após</strong> o início da insulina ou do hipoglicemiante oral. Sinais precoces: <strong>perda do reflexo aquileu e hipopalestesia dos pés</strong>. Dor nos membros inferiores que <strong>piora à noite</strong></td></tr><tr><td>Forma sensitiva grave (<em>pseudotabes diabético</em>)</td><td>ataxia sensitiva com marcha talonante, perda da sensibilidade profunda, atonia vesical, fraqueza discreta; úlceras perfurantes e artropatia interfalangeana e metatarsofalangeana</td></tr><tr><td><strong>Neuropatia autonômica</strong></td><td>disfunção pupilar e lacrimal, hipotensão postural, atonia gastrintestinal e vesical, diarreia, ejaculação retrógrada, impotência — e <strong>hipoglicemia sem os sinais premonitórios</strong>, levando ao coma</td></tr><tr><td><strong>Nervos cranianos</strong></td><td>idosos; <strong>terceiro nervo</strong> é o mais atingido, início abrupto, <strong>pupila habitualmente poupada</strong>, recuperação é a regra. Fora dos oculares, o <strong>facial</strong> é o mais acometido</td></tr><tr><td><strong>Mononeuropatia de tronco e membros</strong></td><td>ulnar, mediano, radial, femoral, cutâneo lateral da coxa, peroneal; início abrupto, com dor, no mesmo local das paralisias compressivas</td></tr><tr><td><strong>Neuropatia motora proximal</strong> (<em>amiotrofia diabética</em>)</td><td>fraqueza e atrofia <strong>assimétricas</strong> proximais nos membros inferiores, dor pior à noite, <strong>reflexos patelares abolidos</strong>, sensibilidade ausente ou discretamente alterada; ileopsoas, quadríceps e adutores</td></tr></tbody></table></div>
<p>A amiotrofia diabética tende à <strong>recuperação espontânea</strong>, podendo regredir de um lado e aparecer no outro; a lesão se situa provavelmente nas raízes ou nervos espinais.</p>
<h4>Patologia, patogênese e tratamento</h4>
<p>Há perda de axônios e desmielinização segmentar secundária, redução de fibras amielínicas, lesões vasculares obliterativas e <strong>membrana basal dos capilares intraneurais espessada e duplicada</strong>. Mais de um mecanismo opera: as <strong>mononeuropatias assimétricas</strong> parecem ter origem <strong>isquêmica</strong>, por doença da <em>vasa nervorum</em>; as formas difusas são atribuídas a alterações metabólicas — <strong>acúmulo de sorbitol na célula de Schwann</strong> e <strong>deficiência de mioinositol</strong> com redução da velocidade de condução.</p>
<blockquote><p>Como a lesão do nervo se relaciona ao controle inadequado do diabetes, o ponto principal do tratamento é <strong>manter a glicemia relativamente normal</strong>. Para a dor: fenitoína, carbamazepina, gabapentina, fenotiazinas e antidepressivos tricíclicos.</p></blockquote>
<hr>
<h2>Neuropatias tóxico-carenciais</h2>
<p>As neuropatias por drogas são em geral <strong>distais, simétricas, sensitivo-motoras</strong>, com predomínio sensitivo e dor frequente. Ao cessar a exposição o paciente ainda <strong>piora um pouco</strong> antes de começar a melhorar; a recuperação leva meses e costuma ser incompleta. Entre os fármacos implicados: amiodarona, cloranfenicol, cloroquina, colchicina, dapsona, disulfiram, isoniazida, metronidazol, nitrofurantoína, fenitoína, piridoxina, talidomida, sinvastatina e os dideoxinucleosídeos.</p>
<div class="tbl"><table><thead><tr><th>Agente</th><th>Pista extraneurológica</th><th>Neuropatia</th></tr></thead><tbody><tr><td><strong>Arsênico</strong></td><td>pancitopenia, dor abdominal, vômitos, diarreia, <strong>hiperqueratose palmoplantar</strong>, melanose, alopecia, estrias transversas nas unhas</td><td>sensitivo-motora</td></tr><tr><td><strong>Chumbo</strong></td><td>dor abdominal, anemia, <strong>linha plúmbica gengival</strong></td><td>predominantemente <strong>motora</strong>, axonal, com predileção pelo <strong>nervo radial</strong></td></tr><tr><td><strong>Tálio</strong></td><td>sintomas gastrintestinais, <strong>alopecia 2 a 3 semanas após</strong> o início da neuropatia</td><td>sensitivo-motora, distal e dolorosa</td></tr><tr><td><strong>Álcool</strong></td><td>9% dos alcoolistas</td><td>membros inferiores, <strong>predominantemente sensitiva</strong>, hiperestesia nos pés, abolição dos aquileus</td></tr></tbody></table></div>
<p>O diagnóstico das neuropatias por metais se faz pelo nível sérico elevado do metal no sangue, urina, cabelo ou unhas; o tratamento é cessar a exposição e usar quelantes. Na alcoólica, parar o álcool e manter nutrição adequada — a melhora é gradual, em meses, e pode ser incompleta.</p>
<h3>Carências vitamínicas</h3>
<div class="tbl"><table><thead><tr><th>Vitamina</th><th>Síndrome</th></tr></thead><tbody><tr><td><strong>B1 (tiamina)</strong></td><td>beribéri — falência cardíaca e polineuropatia distal axonal, de predomínio sensitivo</td></tr><tr><td><strong>B6 (piridoxina)</strong></td><td>neuropatia periférica, cuja causa mais comum é o aumento da excreção pela <strong>isoniazida</strong> — a reposição previne</td></tr><tr><td><strong>B12 (cobalamina)</strong></td><td>polineuropatia leve que <strong>não ocorre isolada</strong>: domina a mielopatia das colunas posterior e lateral (degeneração subaguda combinada)</td></tr><tr><td><strong>E</strong></td><td>síndrome espinocerebelar, arreflexia, ataxia, queda da sensibilidade vibratória e artrestesia; lesão nos processos <strong>centrais</strong> do gânglio da raiz dorsal</td></tr></tbody></table></div>
<blockquote><p>Piridoxina é a vitamina de dois gumes: <strong>falta</strong> dela por uso de isoniazida causa neuropatia, e <strong>dose muito elevada</strong> causa uma neuropatia <strong>sensitiva atáxica</strong>. Repor sim, exagerar não.</p></blockquote>
<hr>
<h2>Neuropatias infecciosas — com destaque para a hanseníase</h2>
<p>O <strong>mal de Hansen</strong> é uma doença infecciosa <strong>primária do sistema nervoso periférico</strong>, causada pelo <em>Mycobacterium leprae</em>. A lesão inicial é uma <strong>pápula ou mácula geralmente hipopigmentada, com diminuição da sensibilidade</strong>, pela invasão dos nervos cutâneos pelo bacilo. A manifestação clínica é determinada pela <strong>resposta imune do hospedeiro</strong>:</p>
<div class="tbl"><table><thead><tr><th>Forma</th><th>Resposta imune</th><th>Consequência</th></tr></thead><tbody><tr><td><strong>Tuberculoide</strong></td><td>celular, com formação de <strong>granuloma</strong></td><td>lesão do tecido, poucos bacilos</td></tr><tr><td><strong>Lepromatosa</strong></td><td><strong>mínima</strong></td><td>proliferação e disseminação do agente</td></tr></tbody></table></div>
<p>O sintoma principal é a perda sensitiva, <strong>principalmente à dor e à temperatura</strong>, acometendo nervos cutâneos e mistos em partes do corpo de <strong>temperatura relativamente baixa</strong> — é a topografia térmica, e não o comprimento do nervo, que define a distribuição. À perda sensitiva soma-se perda motora pela invasão de nervos próximos à pele, e o <strong>nervo ulnar é o mais acometido</strong>. Diagnóstico por <strong>biópsia de pele ou de nervo</strong>; tratamento principalmente com <strong>sulfonas</strong>, sendo a <strong>dapsona</strong> a mais utilizada.</p>
<h3>Outras infecciosas</h3>
<ul><li><strong>HIV</strong> — nos estágios tardios, o quadro mais comum é <strong>neuropatia distal dolorosa</strong>,</li></ul>
<p>sobretudo nos pés, com alteração sensitiva importante e comprometimento motor menor; parte dos casos tem déficit de B12 ou uso de drogas neurotóxicas associado. Pacientes assintomáticos, muitas vezes na <strong>soroconversão</strong>, podem ter polirradiculoneurite aguda ou crônica semelhante à dos HIV-negativos, <strong>exceto pela pleocitose no líquor</strong>. O <strong>citomegalovírus</strong>, nos estágios avançados, causa mononeuropatia múltipla grave e polirradiculoneuropatia lombossacral aguda.</p>
<ul><li><strong>Doença de Lyme</strong> — <em>Borrelia burgdorferi</em>, transmitida por carrapato, em três estágios</li></ul>
<p>(erupção cutânea, disseminação precoce de 2 a 10 semanas, tardia após 1 ano). No envolvimento precoce, a <strong>neuropatia do nervo facial é a mais comum, com envolvimento contralateral em 50%</strong>, e há dor radicular com fraqueza assimétrica. Tratamento com penicilina ou ceftriaxona leva à recuperação. <strong>A neuropatia tardia não melhora se não for tratada.</strong></p>
<ul><li><strong>Varicela-zóster</strong> — a reativação do vírus latente nos neurônios sensitivos do gânglio da</li></ul>
<p>raiz dorsal causa ganglionite inflamatória e necrótica, com alteração sensitiva e dor no dermátomo. Se a inflamação se estende à raiz ventral, há fraqueza no miótomo correspondente em <strong>30%</strong> dos pacientes. A <strong>neuralgia pós-herpética</strong> tem incidência crescente com a idade.</p>
<hr>
<h2>Neuropatias imune-mediadas: Guillain-Barré e a forma crônica</h2>
<p>A <strong>polirradiculoneurite aguda (PRNA)</strong>, ou síndrome de Guillain-Barré, caracteriza-se por <strong>déficit motor progressivo, geralmente ascendente, de instalação aguda, acompanhado de arreflexia</strong>, com ou sem alteração sensitiva. É imune-mediada, com alterações da imunidade celular e humoral; o antígeno desencadeante ainda não foi determinado. O achado patológico clássico é infiltrado de linfócitos e macrófagos com desmielinização nas raízes e nos segmentos proximais dos nervos, mas há duas variantes axonais descritas:</p>
<ul><li><strong>Neuropatia axonal sensitivo-motora aguda</strong> — envolve fibras motoras e sensitivas, em</li></ul>
<p>geral <strong>mais grave</strong>.</p>
<ul><li><strong>Neuropatia axonal motora aguda</strong> — comprometimento <strong>motor puro</strong>, evolução mais benigna.</li><li><strong>Síndrome de Miller-Fisher</strong> — variante com <strong>oftalmoplegia, ataxia e arreflexia</strong>, na</li></ul>
<p>ausência de fraqueza muscular importante.</p>
<h3>A cronologia da PRNA</h3>
<p>Em <strong>dois terços</strong> dos casos há antecedente de processo infeccioso viral ou bacteriano, ou de cirurgia e vacinas. Os primeiros sintomas são <strong>parestesias</strong>; depois vem fraqueza proximal e distal de caráter ascendente, começando nos membros inferiores, podendo chegar à insuficiência respiratória e aos nervos cranianos (mímica facial, mastigação, palato e, mais raramente, motricidade ocular extrínseca). A fraqueza é relativamente simétrica e a <strong>arreflexia é sinal precoce</strong>. Cerca de <strong>50% têm disfunção autonômica</strong>, com flutuação de pressão arterial e frequência cardíaca e retenção urinária transitória.</p>
<p>O grau máximo de incapacidade ocorre entre <strong>1 e 4 semanas</strong>, seguido de <strong>platô de 2 a 4 semanas</strong> e recuperação em poucos meses.</p>
<blockquote><p><strong>Dissociação proteíno-citológica</strong> = celularidade normal + proteinorraquia aumentada. Ela aparece <strong>após uma semana</strong> de evolução e atinge o máximo entre a <strong>quarta e a sexta semanas</strong> — ou seja, um líquor normal na fase inicial <strong>não afasta</strong> o diagnóstico.</p></blockquote>
<p>Apesar da evolução dita benigna: a maior parte dos pacientes fica restrita ao leito, <strong>15% a 30% precisam de assistência ventilatória</strong>, <strong>15% evoluem com déficit funcional persistente</strong> e <strong>3% a 8% morrem</strong>. Falência respiratória e disautonomia justificam a terapia intensiva.</p>
<blockquote><p><strong>Tratamento da PRNA:</strong> a <strong>plasmaférese</strong> foi o primeiro tratamento comprovadamente eficaz — seu obstáculo prático é o acesso venoso, muitas vezes exigindo cateter central, e a disautonomia pode dificultar as sessões. A <strong>imunoglobulina endovenosa</strong> mostrou-se <strong>igualmente eficaz</strong> e também é usada. <strong>O corticosteroide não está entre os tratamentos de eficácia estabelecida na forma aguda</strong> — reservá-lo é justamente o que separa a PRNA da forma crônica.</p></blockquote>
<h3>Polirradiculoneurite crônica (PRNC)</h3>
<p>Polineuropatia <strong>desmielinizante adquirida</strong>, provavelmente imunológica, de instalação lentamente progressiva ou com períodos de flutuação da fraqueza, estabelecendo-se como crônica com <strong>evolução de pelo menos dois meses</strong>.</p>
<div class="tbl"><table><thead><tr><th></th><th><strong>PRNA (Guillain-Barré)</strong></th><th><strong>PRNC</strong></th></tr></thead><tbody><tr><td>Instalação</td><td>aguda</td><td>lentamente progressiva ou flutuante</td></tr><tr><td>Tempo até se definir</td><td>pico em 1 a 4 semanas</td><td><strong>pelo menos 2 meses</strong></td></tr><tr><td>Déficit motor</td><td>ascendente, proximal e distal, simétrico</td><td>simétrico, proximal e distal, começa nos inferiores</td></tr><tr><td>Insuficiência respiratória</td><td>15% a 30% precisam de ventilação</td><td><strong>rara</strong></td></tr><tr><td>Sensibilidade</td><td>alteração em geral discreta</td><td><strong>frequente</strong> — hipoestesia em bota e luva, perda profunda</td></tr><tr><td>Reflexos</td><td>arreflexia precoce</td><td>arreflexia generalizada</td></tr><tr><td>Líquor</td><td>dissociação proteíno-citológica</td><td>—</td></tr><tr><td><strong>Corticosteroide</strong></td><td><strong>não é tratamento estabelecido</strong></td><td><strong>preconizado e reconhecido como eficaz</strong></td></tr><tr><td>Outros tratamentos</td><td>plasmaférese e imunoglobulina</td><td>azatioprina, ciclofosfamida, ciclosporina; plasmaférese e imunoglobulina são consideradas primeira escolha por vários autores</td></tr></tbody></table></div>
<p>A <strong>resposta positiva ao tratamento imunossupressor</strong> é uma das melhores evidências de que a PRNC é imunologicamente mediada. Muitos pacientes pioram quando a plasmaférese ou a imunoglobulina são espaçadas ou retiradas, exigindo associação com imunossupressores.</p>
<hr>
<h2>Vasculíticas, paraproteinêmicas, paraneoplásicas e hereditárias</h2>
<p><strong>Neuropatias vasculíticas</strong> — o processo inflamatório atinge os vasos nutrientes do nervo e precisa ser relativamente extenso, dada a rica vascularização da região. A vasculite tende a ser <strong>focal e assimétrica</strong>, produzindo <strong>mononeuropatia múltipla</strong> que vai <strong>confluindo</strong> com a progressão; as manifestações sensitivas frequentemente inauguram o quadro e o déficit motor vem depois. As vasculites sistêmicas envolvidas incluem poliarterite nodosa (neuropatia em <strong>50% a 70%</strong>), vasculite reumatoide, síndrome de Sjögren, granulomatose de Wegener, síndrome de Churg-Strauss e lúpus. O diagnóstico definitivo é por <strong>biópsia de nervo</strong>: infiltrado perivascular ou intramural, focos de <strong>necrose fibrinoide</strong>, fibrose ou oclusão da luz — o vaso <strong>epineural</strong> é o mais acometido. Tratamento: <strong>prednisona em altas doses</strong>, associada ou não a ciclofosfamida. De 10% a 30% não têm vasculite sistêmica e evoluem de forma benigna.</p>
<p><strong>Associadas a paraproteínas</strong> — grupo heterogêneo (axonais, desmielinizantes e mistas) com proteína monoclonal circulante (IgG, IgA ou IgM). A maioria se associa a gamopatia monoclonal de significado indeterminado (MGUS); outras a mieloma múltiplo, mieloma osteosclerótico (síndrome POEMS), amiloidose sistêmica, macroglobulinemia ou linfoma.</p>
<p><strong>Paraneoplásicas</strong> — o sistema nervoso periférico expressa sobretudo manifestações sensitivas ou sensitivo-motoras, agudas ou subagudas, com parestesias, disestesias e <strong>ataxia por perda proprioceptiva</strong>. O líquor mostra pleocitose linfocítica e aumento de proteína. O anticorpo <strong>anti-Hu</strong>, contra antígeno nuclear neuronal de 37 kDa, é específico e sensível; anti-p23 se relaciona a polineuropatias secundárias a linfomas, anti-Trotter à polineuropatia paralinfomatosa de Hodgkin, anti-Yo ao envolvimento cerebelar.</p>
<blockquote><p>O envolvimento do sistema nervoso periférico quase sempre <strong>precede o aparecimento do tumor</strong> — por isso o diagnóstico de neuropatia paraneoplásica obriga, em alguns casos, a caçar o tumor ainda não manifesto.</p></blockquote>
<p><strong>Geneticamente determinadas</strong> — hereditárias, crônicas, simétricas. Dividem-se nas associadas a defeito metabólico específico (leucodistrofia metacromática, Krabbe, Refsum, Fabry, Tangier, amiloidótica hereditária, porfiria hepática) e naquelas de patogênese indefinida, estas subdivididas em neuronopatias motoras hereditárias, <strong>neuropatias hereditárias sensitivo-motoras (HMSN)</strong>, autonômicas e sensitivas, e grupos menores.</p>
<div class="tbl"><table><thead><tr><th>Entidade</th><th>Marca</th></tr></thead><tbody><tr><td><strong>Amiloidose hereditária tipo I</strong></td><td>a mais comum em nosso meio, ascendência <strong>portuguesa</strong>, autossômica dominante, início entre 25 e 35 anos; mutação do gene da <strong>transtirretina</strong> (pré-albumina); polineuropatia sensitivo-motora de predomínio sensitivo + disautonomia marcada; evolução a caquexia e morte em 10 a 15 anos</td></tr><tr><td><strong>Porfiria aguda intermitente</strong></td><td>ataques com dor abdominal, náuseas, taquicardia e hipertensão, depois confusão e convulsões, e então neuropatia <strong>predominantemente motora de instalação aguda</strong> — diagnóstico diferencial da PRNA; na crise, ALA e porfobilinogênio na urina</td></tr><tr><td><strong>HMSN I (CMT1)</strong></td><td><strong>desmielinizante hipertrófica</strong>; fraqueza distal lentamente progressiva de peroneiros e tibiais anteriores, sintomática entre a 2ª e a 4ª décadas; deformidades dos pés, arreflexia, perda sensitiva distal; <strong>hipertrofia dos nervos em um terço</strong>; CMT1A no cromossomo 17</td></tr><tr><td><strong>HMSN II (CMT2)</strong></td><td>quadro semelhante, <strong>início mais tardio</strong> e lesão <strong>axonal</strong></td></tr><tr><td><strong>HMSN III (Dejerine-Sottas)</strong></td><td>autossômica <strong>recessiva</strong>, desmielinizante com hipomielinização, início antes dos 2 anos, quadro mais grave, velocidade de condução muito reduzida; mutação de PMP22 ou P0</td></tr></tbody></table></div>
<hr>
<h2>Plexos e troncos nervosos</h2>
<p>O <strong>plexo braquial</strong> nasce dos ramos anteriores de C5 a T1: C5 e C6 formam o tronco superior, C7 continua como tronco médio e C8 com T1 formam o tronco inferior. Causas de lesão: arma branca ou de fogo, torções do membro, trauma de parto, compressão por costela cervical, fáscias ou tumores, lesão cirúrgica e pós-radioterapia.</p>
<div class="tbl"><table><thead><tr><th>Síndrome</th><th>Raízes</th><th>Quadro</th></tr></thead><tbody><tr><td><strong>Paralisia braquial superior</strong> (a mais frequente)</td><td>C5-C6</td><td>déficit de deltoide, supra e infraespinhoso, bíceps e braquiorradial; não abduz nem roda externamente o braço, não flete nem supina o antebraço; <strong>reflexo bicipital abolido</strong>; alteração sensitiva leve sobre o deltoide</td></tr><tr><td>Síndrome radicular média (rara)</td><td>C7</td><td>fraqueza do tríceps <strong>com braquiorradial poupado</strong>, perda do reflexo tricipital, hipoestesia no dorso do antebraço, mão e 2º-3º dedos; também pronador redondo e flexor radial do carpo</td></tr><tr><td><strong>Paralisia braquial inferior</strong> (2ª mais comum)</td><td>C8-T1</td><td>paralisia, atrofia e hipotonia dos pequenos músculos da mão (tenar, hipotenar, interósseos, lumbricais); hipoestesia do mínimo, borda medial do anular, mão e antebraço; <strong>síndrome de Claude-Bernard-Horner se T1 for atingida</strong>. Causas: trauma penetrante, <strong>tumor do ápice pulmonar (Pancoast)</strong>, neurinoma, costela cervical</td></tr></tbody></table></div>
<p>O <strong>plexo lombossacro</strong> vem dos ramos anteriores das cinco raízes lombares e das quatro sacrais; o acometimento simultâneo de ambos é menos frequente que o individual. Do plexo lombar saem o <strong>obturador</strong> (adutores da coxa) e o <strong>femoral</strong> (ileopsoas e quadríceps); o maior nervo do plexo lombossacral é o <strong>ciático</strong>, que se divide em fibular e tibial posterior. A lesão do plexo superior dá déficit de flexão e adução da coxa e extensão da perna, com alteração sensitiva na face anterior da coxa e da perna; a do plexo inferior atinge os músculos posteriores da coxa e da perna e os do pé. Causas: cirurgias pélvicas e abdominais (histerectomia, apendicectomia, herniorrafia), traumatismo obstétrico materno, aneurisma de aorta e tumores de próstata, útero, cólon e linfomas retroperitoneais.</p>
<div class="tbl"><table><thead><tr><th>Nervo</th><th>Déficit motor</th><th>Território sensitivo</th><th>Causas típicas</th></tr></thead><tbody><tr><td><strong>Mediano</strong></td><td>não prona o antebraço, não flete os três primeiros dedos, perde a oponência do polegar; atrofia tenar → <strong>mão simiesca</strong></td><td>lado externo da face palmar da mão</td><td>ferimento perfurante do braço, torniquete, <strong>síndrome do túnel do carpo</strong>, neurite leprosa</td></tr><tr><td><strong>Ulnar</strong></td><td>não flete nem aduz o punho, não flete as primeiras falanges, não abduz nem aduz os dedos, não aduz o polegar → <strong>garra cubital</strong> (a mão em garra verdadeira só na lesão combinada com o mediano)</td><td>dedo mínimo e metade medial do anular</td><td>fraturas e artropatias crônicas do <strong>cotovelo</strong>, arma branca ou de fogo, neurite leprosa</td></tr><tr><td><strong>Radial</strong></td><td>déficit dos extensores do antebraço, mão e dedos, e do braquiorradial → <strong>mão caída</strong></td><td>dorso da 1ª falange do polegar e 1º espaço interósseo</td><td><strong>fratura do úmero</strong>, compressão ao dormir com o braço pendente, <strong>intoxicação por chumbo</strong></td></tr><tr><td><strong>Fibular comum</strong></td><td>paralisia da flexão dorsal, abdução do pé e extensão dos dedos</td><td>face lateral da perna e dorso do pé</td><td>trauma, fratura da fíbula, compressão sobre a <strong>cabeça da fíbula</strong> (pernas cruzadas, gesso)</td></tr><tr><td><strong>Tibial posterior</strong></td><td>déficit dos músculos da panturrilha e intrínsecos do pé</td><td>territórios sural e plantar</td><td>compressão na fossa poplítea por cisto ou aneurisma; <strong>síndrome do túnel do tarso</strong>, rara</td></tr></tbody></table></div></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';

      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +

  document.getElementById('hdr').innerHTML = html;

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

function renderQuestion(){

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';

        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +

      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +

        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
        (reveal ? chatBox(q, ans===q.correctIndex) : '') +

function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };

    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
