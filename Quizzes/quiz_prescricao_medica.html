<script type="text/html" id="resumoSrc"><h2>O ato de prescrever e suas responsabilidades</h2>
<p>Prescrever é o momento em que o médico, depois de completar anamnese, exame físico e análise dos exames complementares, decide o caminho terapêutico de um paciente. A Organização Mundial da Saúde resume esse processo em seis etapas: definição do problema, especificação dos objetivos terapêuticos, seleção do tratamento mais eficaz e seguro para aquele paciente específico, prescrição propriamente dita (incluindo medidas medicamentosas e não medicamentosas), informação clara ao paciente sobre a terapêutica, e monitoramento do tratamento proposto.</p>
<p>A segurança da prescrição depende de quatro atores com papéis distintos: o médico prescritor, responsável pela indicação clínica; o farmacêutico, que valida tecnicamente e dispensa o medicamento; o paciente, que segue as orientações terapêuticas recebidas; e a vigilância sanitária, que fiscaliza e regulamenta todo o sistema. A prescrição ambulatorial — o documento que orienta o tratamento medicamentoso fora do ambiente hospitalar — precisa de clareza, precisão e responsabilidade profissional justamente porque, uma vez entregue ao paciente, ninguém mais vai supervisionar sua execução em tempo real.</p>
<blockquote><p>A falta de conhecimento sobre os medicamentos prescritos coloca em risco tanto a saúde do paciente quanto a credibilidade do profissional. A relação médico-paciente só se completa, do ponto de vista terapêutico, quando a prescrição é compreendida e seguida — o que exige transparência e disponibilidade do médico para esclarecer dúvidas e reações adversas.</p></blockquote>
<h2>Os cinco elementos de toda prescrição</h2>
<p>Toda prescrição — simples ou de controle especial — se organiza nos mesmos cinco blocos de informação:</p>
<ul><li><strong>Cabeçalho</strong> — impresso, com nome, endereço, registro profissional e CPF/CNPJ do prescritor ou da instituição.</li><li><strong>Superinscrição</strong> — nome, endereço e idade do paciente; pode trazer o símbolo ℞ ou a indicação de uso interno/externo, que corresponde ao emprego por via enteral ou parenteral.</li><li><strong>Inscrição</strong> — nome do fármaco, forma farmacêutica e concentração.</li><li><strong>Subinscrição</strong> — quantidade total a ser fornecida; para medicamentos de uso controlado, deve vir em algarismos arábicos e por extenso.</li><li><strong>Adscrição</strong> — orientações do profissional para o paciente sobre o uso do medicamento (posologia, via, duração).</li></ul>
<p>Data, assinatura e número de inscrição no conselho profissional (CRM, CRMV ou CRO) completam o documento e são obrigatórios em qualquer receituário. O uso de carimbo, por outro lado, é <strong>facultativo</strong>: a lei exige assinatura identificável com o CRM, não carimbo. Quando usado, o carimbo deve trazer no mínimo o número de inscrição e a sigla do estado, nunca convicções pessoais, religiosas ou discriminatórias do médico — a receita não pode ser instrumento de proselitismo. Um carimbo desgastado, com nome ou CRM ilegíveis, equivale por interpretação extensiva à letra ilegível vedada pelo Código de Ética Médica.</p>
<h4>Sobre o símbolo ℞ e o símbolo ®</h4>
<p>O "R" cortado (℞) é tradicionalmente associado a um pedido de proteção sobre a prescrição; seu uso não é obrigatório. Já o símbolo ® indica o nome comercial (marca) do produto, e não o seu princípio ativo — distinção que importa na hora de autorizar ou não a substituição por outro medicamento.</p>
<h2>Tipos de receituário</h2>
<p>A escolha do receituário certo depende exclusivamente da substância prescrita, nunca da preferência do médico. Cada lista tem cor, validade e quantidade máxima próprias, e o erro mais comum de prova é justamente trocar a cor ou a validade de duas listas parecidas.</p>
<div class="tbl"><table><thead><tr><th>Receituário</th><th>Lista / cor</th><th>Exemplos</th><th>Validade</th><th>Quantidade máxima por receita</th></tr></thead><tbody><tr><td>Receita simples</td><td>Venda livre ou tarja vermelha comum, sem controle especial</td><td>Analgésicos, a maioria dos anti-hipertensivos</td><td>Sem retenção pela farmácia</td><td>Definida pelo prescritor</td></tr><tr><td>Controle especial (branca, 2 vias)</td><td>Lista C1, C4, C5 e adendos de A1/A2/B1; inclui antimicrobianos</td><td>Antibióticos, anticonvulsivantes, antidepressivos, imunossupressores, anabolizantes</td><td>30 dias (10 dias para antimicrobianos)</td><td>60 dias de tratamento (C1/C5); até 180 dias para anticonvulsivantes/antiparkinsonianos</td></tr><tr><td>Notificação azul "B"</td><td>B1 e B2 — psicotrópicos</td><td>Clonazepam, alprazolam, zolpidem</td><td>30 dias, só no estado emitente</td><td>B1: até 60 dias de tratamento; B2: até 30 dias; 5 ampolas se injetável</td></tr><tr><td>Notificação amarela "A"</td><td>A1, A2 (entorpecentes) e A3 (psicotrópicos)</td><td>Morfina, metadona, lisdexanfetamina</td><td>30 dias, em todo o território nacional</td><td>5 ampolas para injetável; 1 produto por receita</td></tr><tr><td>Notificação C2 (retinoides sistêmicos)</td><td>Isotretinoína, tretinoína, acitretina</td><td>Cor branca, sem retenção</td><td>30 dias, só no estado emitente</td><td>5 ampolas ou 30 dias de tratamento; exige termo de consentimento de risco</td></tr><tr><td>Notificação C3 (talidomida)</td><td>Talidomida</td><td>Cor branca</td><td>15 dias</td><td>30 dias de tratamento</td></tr></tbody></table></div>
<blockquote><p>Uma receita amarela ou azul só pode conter <strong>um único produto farmacêutico</strong>. Isso significa que um paciente em uso de dois medicamentos controlados de listas diferentes precisa de duas notificações separadas, cada uma com sua numeração própria.</p></blockquote>
<h2>Legibilidade, rasuras e substituição de medicamentos</h2>
<p>O artigo 11 do Código de Ética Médica veda receitar de forma secreta ou ilegível, sem identificação clara do número de registro no conselho de medicina — regra que vale tanto para a letra manuscrita quanto para um carimbo tão desgastado que o CRM não seja mais legível. Rasuras e emendas, por sua vez, comprometem a verificação da autenticidade do documento e podem impedir a dispensação; a Lei 5.991/73 proíbe expressamente rasuras em receituário de controle sanitário especial. Diante de um erro, a conduta correta é sempre emitir uma nova receita, nunca corrigir a antiga.</p>
<p>Ao prescrever um medicamento de referência, o médico pode autorizar ou não sua substituição por um genérico. Não havendo nenhuma frase específica exigida por lei, basta registrar por escrito, na própria receita, algo como "não autorizo a substituição". No silêncio do prescritor, a substituição é permitida.</p>
<blockquote><p>Trocar de receituário sem examinar o paciente, ou prescrever por telefone fora de uma urgência inadiável, infringe o artigo 37 do Código de Ética Médica, que exige exame direto antes de qualquer prescrição — ressalvadas emergências, quando o exame deve ser feito assim que o impedimento cessar.</p></blockquote>
<h2>Prescrição eletrônica: a atualização 2025/2026</h2>
<p>Uma nova Resolução da Diretoria Colegiada (RDC) da Anvisa, publicada em <strong>11 de dezembro de 2025</strong>, passou a permitir a emissão eletrônica de receitas amarelas e azuis por plataformas integradas ao <strong>Sistema Nacional de Controle de Receituários</strong>. A medida responde a três problemas crônicos do modelo em papel: falsificação de receitas, reutilização indevida de prescrições já aviadas e baixa rastreabilidade nacional dos medicamentos controlados dispensados.</p>
<p>No novo modelo, cada prescrição eletrônica recebe um <strong>número nacional único</strong>, e a dispensação é registrada eletronicamente pela farmácia em tempo real — o que torna a reutilização da mesma receita praticamente impossível e dá transparência imediata ao fluxo do medicamento, do prescritor até o paciente.</p>
<blockquote><p>Fotografar uma receita em papel e enviá-la pelo celular <strong>não</strong> equivale a uma prescrição eletrônica válida: a validade exige emissão dentro de um sistema integrado oficial ao controle sanitário nacional, não uma simples imagem do documento.</p></blockquote>
<p>Um ponto que costuma ser cobrado em prova: a digitalização da receita <strong>não transfere responsabilidade</strong>. O médico continua integralmente responsável — clínica e eticamente — pela indicação, pela dose, pela duração do tratamento e pelo acompanhamento terapêutico do paciente, exatamente como no receituário em papel.</p>
<h2>Interações medicamentosas de maior risco</h2>
<p>Combinações de fármacos amplamente utilizados na prática ambulatorial concentram a maior parte dos eventos adversos evitáveis. As mais cobradas:</p>
<div class="tbl"><table><thead><tr><th>Combinação</th><th>Risco</th><th>Conduta</th></tr></thead><tbody><tr><td>Anlodipino + sinvastatina</td><td>Miopatia/rabdomiólise (anlodipino inibe o CYP3A4)</td><td>Limitar sinvastatina a 20 mg/dia</td></tr><tr><td>Ciprofibrato + estatina</td><td>Rabdomiólise</td><td>Evitar; preferir fenofibrato</td></tr><tr><td>Varfarina + AINE</td><td>Sangramento gastrointestinal</td><td>Evitar; IBP e monitorar INR se inevitável</td></tr><tr><td>Varfarina + amiodarona</td><td>Amiodarona inibe o metabolismo da varfarina, ↑INR</td><td>Reduzir dose de varfarina, monitorar INR</td></tr><tr><td>IECA/BRA + espironolactona</td><td>Hipercalemia grave</td><td>Monitorar potássio e função renal</td></tr><tr><td>Tramadol + ISRS/ISRSN</td><td>Síndrome serotoninérgica</td><td>Evitar a associação ou monitorar de perto</td></tr><tr><td>Claritromicina + sinvastatina</td><td>Miopatia/rabdomiólise (inibição do CYP3A4)</td><td>Suspender a estatina durante o antibiótico</td></tr><tr><td>Alopurinol + azatioprina</td><td>Mielotoxicidade grave</td><td>Reduzir azatioprina para cerca de 25% da dose</td></tr><tr><td>Metformina + contraste iodado</td><td>Acidose láctica</td><td>Suspender 48h antes e depois do exame</td></tr><tr><td>Opioide + benzodiazepínico</td><td>Depressão respiratória</td><td>Evitar a associação</td></tr></tbody></table></div>
<blockquote><p>Reparar no padrão: boa parte dessas interações passa pela inibição do <strong>CYP3A4</strong> (anlodipino, claritromicina) potencializando estatinas, ou pelo bloqueio duplo do eixo renina-angiotensina-aldosterona (IECA/BRA + espironolactona) elevando o potássio. Reconhecer o mecanismo — não decorar o par isoladamente — é o que permite generalizar para combinações parecidas não listadas aqui.</p></blockquote>
<h2>Medicações de risco e segurança do idoso</h2>
<p>Certas classes exigem vigilância redobrada em qualquer paciente, independentemente da idade: AINEs (sangramento gastrointestinal e insuficiência renal — usar a menor dose pelo menor tempo), corticosteroides sistêmicos (imunossupressão e hiperglicemia), varfarina e anticoagulantes diretos (sangramento), opioides (depressão respiratória), aminoglicosídeos (nefro e ototoxicidade), metotrexato (mielossupressão e hepatotoxicidade) e lítio (toxicidade neurológica e renal, exigindo dosagem sérica periódica).</p>
<p>Em pacientes idosos, os critérios de Beers apontam classes específicas como potencialmente inapropriadas, quase sempre porque existe uma alternativa mais segura disponível:</p>
<div class="tbl"><table><thead><tr><th>Classe de risco</th><th>Exemplo</th><th>Problema em idosos</th><th>Alternativa mais segura</th></tr></thead><tbody><tr><td>Benzodiazepínicos</td><td>Diazepam, alprazolam</td><td>Quedas, delirium, dependência</td><td>Terapia cognitivo-comportamental para insônia</td></tr><tr><td>Anticolinérgicos</td><td>Oxibutinina, amitriptilina</td><td>Confusão mental, retenção urinária</td><td>Mirabegrona, nortriptilina</td></tr><tr><td>Hipoglicemiantes de meia-vida longa</td><td>Glibenclamida</td><td>Hipoglicemia grave e prolongada</td><td>Gliclazida, metformina (se função renal permitir)</td></tr><tr><td>AINEs crônicos</td><td>Naproxeno, diclofenaco</td><td>Úlcera péptica, sangramento digestivo</td><td>Paracetamol, dipirona</td></tr><tr><td>Antidepressivos tricíclicos</td><td>Amitriptilina</td><td>Sedação, hipotensão, efeito anticolinérgico</td><td>ISRS (sertralina)</td></tr><tr><td>Antipsicóticos sem indicação clara</td><td>Haloperidol</td><td>Maior risco de AVC e mortalidade em demência</td><td>Investigar causa reversível da agitação antes de medicar</td></tr><tr><td>Antieméticos dopaminérgicos</td><td>Metoclopramida</td><td>Piora da rigidez parkinsoniana</td><td>Domperidona, quetiapina em baixa dose</td></tr></tbody></table></div>
<blockquote><p>Antes de qualquer reconciliação medicamentosa em idoso, vale perguntar três coisas de cada fármaco em uso contínuo: ele está na lista de Beers, existe alternativa mais segura, e a indicação original ainda se sustenta hoje.</p></blockquote>
<h2>Erros de prescrição que se repetem — e como corrigi-los</h2>
<p>Alguns erros de prescrição aparecem com tanta frequência na prática clínica que valem a pena como estudo de caso isolado.</p>
<blockquote><p><strong>Duplicação do bloqueio do sistema renina-angiotensina-aldosterona.</strong> Manter um IECA (por exemplo, enalapril) e um BRA (por exemplo, losartana) simultaneamente após uma otimização terapêutica hospitalar é um erro real e recorrente: os dois fármacos atuam no mesmo eixo, e a soma eleva o risco de hipercalemia e lesão renal aguda. Antes da alta, um dos dois deve ser suspenso, com checagem de potássio e função renal.</p></blockquote>
<blockquote><p><strong>Erro de dígito na dose de levotiroxina.</strong> Transcrever 50 mcg como 150 mcg — um erro de dose dez vezes maior — expõe o paciente a tireotoxicose. A prevenção está em conferir sistematicamente a dose de alta contra a lista de medicamentos em uso antes da internação, com dupla checagem em qualquer transcrição manual.</p></blockquote>
<blockquote><p><strong>Desmame de benzodiazepínico em idoso.</strong> Interromper abruptamente um benzodiazepínico usado cronicamente para insônia expõe o paciente a convulsão e efeito rebote. A retirada segura reduz a dose gradualmente, entre 10% e 25% a cada 1 a 2 semanas, sem substituir por outro hipnótico-sedativo — e, enquanto durar, a prescrição continua exigindo notificação de receita azul.</p></blockquote>
<blockquote><p><strong>Omissão terapêutica do laxante no uso crônico de opioide.</strong> A constipação por opioide é efeito adverso praticamente universal e previsível, não uma intercorrência rara. Deixar de associar um laxante estimulante ou osmótico (por exemplo, lactulose) desde o início do tratamento é uma falha de prescrição tão significativa quanto prescrever um fármaco errado — a morfina continua em receituário amarelo, o laxante vai em receita branca comum.</p></blockquote>
<p>Esses quatro padrões resumem bem o espírito da prescrição segura: toda medicação nova pede uma pergunta sobre o que já está em uso, todo efeito adverso previsível pede profilaxia, e toda dose que sai do script pede conferência antes da assinatura.</p></script>

    "question": "Norberto Aguiar, 78 anos, tem histórico de infarto agudo do miocárdio há 3 anos e hipertensão controlada com besilato de anlodipino 5mg/dia. Em consulta de rotina, apresenta LDL-colesterol de 145 mg/dL. Qual é a conduta prescritiva mais adequada para o manejo lipídico, considerando a interação medicamentosa envolvida?",
    "options": [
      "Estatina em dose máxima tolerada; limitar sinvastatina a 20mg/dia.",
      "Não iniciar estatina; a idade avançada contraindica a prevenção secundária.",
      "Sinvastatina 80mg/dia associada ao anlodipino, sem limitar a dose.",
      "Suspender o anlodipino antes de iniciar qualquer estatina."
    ],
    "correctIndex": 0,
    "explanation": "Em prevenção secundária após evento coronariano, a terapia com estatina de intensidade máxima tolerada deve ser mantida independentemente da idade; como o anlodipino inibe o CYP3A4 e aumenta a exposição à sinvastatina, essa não deve ultrapassar 20mg/dia quando associada."
  }
];

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';

      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +
      '</button>';
  }).join('');

  var expl = reveal ? '<div style="margin-top:20px;padding:16px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;animation:qFade .26s ease">' +

      '<p style="margin:0;font-size:14.5px;line-height:1.68;color:#39404f;text-wrap:pretty">'+esc(q.explanation)+'</p></div>' : '';

  var blank = counts().blank;

      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +
        '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;line-height:1.42;font-weight:400;letter-spacing:-.012em;margin:0 0 22px;text-wrap:pretty">'+esc(q.question)+'</h2>' +
        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
        (reveal ? chatBox(q, ans===q.correctIndex) : '') +
      '</article>' + warn +

        '<button type="button" data-act="prev" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:12px 18px;font-size:14px;cursor:pointer;transition:border-color .15s ease,color .15s ease;color:'+(S.i===0?'#c4bfb4':'#121a2b')+';pointer-events:'+(S.i===0?'none':'auto')+'">← Anterior</button>' +

          (early ? '<button type="button" data-act="finish" class="h-ink" style="background:none;border:0;padding:12px 6px;'+mono+';font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a8578;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Finalizar</button>' : '') +
          '<button type="button" data-act="next" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">'+(last?'Finalizar':'Próxima →')+'</button>' +
        '</div></div></section>';
}

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';
  if (pct>=90)      { title='Domínio sólido';   msg='Desempenho excelente. Confira as explicações das que escaparam e siga em frente.'; }
  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

  var stat = function(v,l,color){

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
</body>
</html>
