<script type="text/html" id="resumoSrc"><h2>Histórico: das terapias biológicas às duas revoluções farmacológicas</h2>
<p>A psicofarmacologia moderna tem pouco mais de setenta anos. Antes dela, o tratamento das doenças mentais graves se apoiava em intervenções biológicas inespecíficas. A primeira foi a <strong>malarioterapia (1917)</strong> — a inoculação de malária para provocar febre alta, usada na paralisia geral da neurossífilis. Na <strong>década de 1930</strong> surgiu a <strong>eletroconvulsoterapia (ECT)</strong>, ainda hoje em uso, agora com técnica e indicações bem definidas.</p>
<p>A virada veio na <strong>década de 1950, a I Revolução Farmacológica</strong>. Em <strong>1952</strong>, a <strong>clorpromazina</strong>, uma fenotiazina, mostrou efeito antipsicótico e inaugurou o tratamento farmacológico moderno da esquizofrenia. Em sequência vieram os <strong>antidepressivos tricíclicos (1958)</strong> e os <strong>benzodiazepínicos (1960)</strong>. A <strong>II Revolução Farmacológica</strong>, nos <strong>anos 1980</strong>, trouxe fármacos mais seletivos e mais bem tolerados: a reintrodução da clozapina, os inibidores seletivos da recaptação de serotonina e, nos anos 1990, os antipsicóticos atípicos.</p>
<div class="tbl"><table><thead><tr><th>Período</th><th>Marco</th></tr></thead><tbody><tr><td>1917</td><td>Malarioterapia</td></tr><tr><td>Década de 1930</td><td>Eletroconvulsoterapia (Cerletti e Bini)</td></tr><tr><td>1952</td><td>Neurolépticos clássicos — clorpromazina</td></tr><tr><td>1958</td><td>Antidepressivos tricíclicos</td></tr><tr><td>1960</td><td>Benzodiazepínicos</td></tr><tr><td>Anos 1970</td><td>Clozapina, o primeiro atípico — logo restrita por agranulocitose</td></tr><tr><td>Fim dos anos 1980</td><td>II Revolução: clozapina reintroduzida com monitorização; ISRS</td></tr><tr><td>Anos 1990</td><td>Risperidona, olanzapina, quetiapina, ziprasidona</td></tr><tr><td>Anos 2000</td><td>"Nova geração": aripiprazol</td></tr></tbody></table></div>
<p>Na linha do tempo dos antipsicóticos, depois da clorpromazina vieram outras classes de típicos — tioxantenos, butirofenonas como o <strong>haloperidol</strong>, benzamidas — que acrescentaram pouco à eficácia da primeira. Todas compartilhavam dois problemas: <strong>efeitos extrapiramidais</strong> marcantes, com risco de discinesia e distonia tardias irreversíveis, e efeito <strong>nulo ou fraco sobre sintomas negativos</strong>. Entre <strong>15% e 30%</strong> dos pacientes com esquizofrenia são ou se tornam resistentes aos típicos. Por muito tempo se acreditou que não haveria efeito antipsicótico sem efeito extrapiramidal — o "dogma da neurolepsia" —, e foi a clozapina que o derrubou.</p>
<blockquote><p><strong>Para não confundir as datas.</strong> 1952 é clorpromazina (antipsicótico), 1958 são os tricíclicos (antidepressivo), 1960 os benzodiazepínicos. A década de 1950 é a I Revolução; a de 1980, a II.</p></blockquote>
<hr>
<h2>Eletroconvulsoterapia</h2>
<p>A ECT foi desenvolvida por <strong>Cerletti e Bini, na década de 1930</strong>, a partir da observação de que estados psicóticos melhoravam em pacientes epilépticos após crises convulsivas. Nas décadas seguintes foi usada de forma abusiva — em praticamente <strong>todos os quadros mentais, sem exceção e sem padronização</strong> — e, em países que viveram regimes ditatoriais, acabou confundida com "choques de tortura", estigma que persiste. Hoje é feita <strong>sob anestesia geral e relaxamento muscular</strong>, com monitorização, e é um dos tratamentos mais eficazes da psiquiatria.</p>
<div class="tbl"><table><thead><tr><th>Indicações</th><th>Contraindicações</th></tr></thead><tbody><tr><td>Depressão psicótica com risco de suicídio</td><td>Arritmia cardíaca recente</td></tr><tr><td>Depressão grave em idosos</td><td>Aumento da pressão intracraniana</td></tr><tr><td>Depressão grave em gestantes</td><td>Trombose venosa profunda e embolias</td></tr><tr><td>Falha terapêutica (refratariedade)</td><td></td></tr></tbody></table></div>
<p>A lógica das indicações é a da <strong>rapidez e da segurança</strong>: quando o risco de morte é alto (suicídio, recusa alimentar), a ECT age mais depressa que o antidepressivo; em idosos e gestantes, poupa a carga de fármacos e as interações.</p>
<blockquote><p><strong>Complemento clínico.</strong> A posição atual é que a ECT <strong>não tem contraindicação absoluta</strong>; a mais importante é a <strong>hipertensão intracraniana</strong> (lesão expansiva), seguida de infarto ou AVC recentes. Além da depressão, a ECT é tratamento de escolha na <strong>catatonia</strong> e opção na <strong>síndrome neuroléptica maligna</strong> e na mania refratária. O efeito adverso mais comum é cognitivo — confusão pós-ictal e amnésia transitória.</p></blockquote>
<hr>
<h2>Antipsicóticos: o bloqueio D2 e as quatro vias dopaminérgicas</h2>
<p>A base da ação antipsicótica é a <strong>hipótese dopaminérgica da esquizofrenia</strong>: um <strong>excesso de dopamina em vias cerebrais</strong> produz os sintomas produtivos (positivos) — delírios e alucinações. Nos neurolépticos de primeira geração, a <strong>eficácia está diretamente relacionada ao bloqueio do receptor D2</strong>. O problema é que o fármaco não escolhe onde bloquear: o D2 é bloqueado em <strong>todas</strong> as vias dopaminérgicas, e cada uma responde de um jeito.</p>
<div class="tbl"><table><thead><tr><th>Via</th><th>Trajeto</th><th>Efeito do bloqueio D2</th></tr></thead><tbody><tr><td><strong>Mesolímbica</strong></td><td>área tegmentar ventral → sistema límbico (núcleo accumbens)</td><td><strong>alívio dos sintomas positivos</strong> — o efeito terapêutico</td></tr><tr><td><strong>Mesocortical</strong></td><td>área tegmentar ventral → córtex pré-frontal</td><td><strong>aumento dos sintomas negativos secundários</strong> (apatia, embotamento, alogia)</td></tr><tr><td><strong>Nigroestriatal</strong></td><td>substância negra → estriado</td><td><strong>sintomas extrapiramidais</strong> (distonia, acatisia, parkinsonismo, discinesia tardia)</td></tr><tr><td><strong>Tuberoinfundibular</strong></td><td>hipotálamo → hipófise</td><td><strong>aumento da prolactina</strong> (galactorreia, amenorreia, ginecomastia, disfunção sexual)</td></tr></tbody></table></div>
<blockquote><p><strong>A lógica que resolve as questões.</strong> Só uma das quatro vias é alvo terapêutico — a mesolímbica. As outras três explicam os efeitos adversos clássicos: piora dos negativos (mesocortical), extrapiramidais (nigroestriatal) e hiperprolactinemia (tuberoinfundibular). Na tuberoinfundibular a dopamina é o freio da prolactina; bloquear o freio libera a prolactina.</p></blockquote>
<p>Os típicos têm <strong>extensa lista de efeitos adversos</strong> e cerca de <strong>30% dos pacientes não respondem</strong> a eles. Atenção a uma armadilha clínica: o parkinsonismo medicamentoso (hipomimia, lentificação) pode imitar sintomas negativos — a presença de rigidez, tremor e bradicinesia aponta para a via nigroestriatal.</p>
<hr>
<h2>Típicos e atípicos: perfis, efeitos adversos e o que o SUS oferece</h2>
<h3>Os típicos: sedativos e incisivos</h3>
<p>Os neurolépticos de primeira geração se dividem pela potência de bloqueio D2:</p>
<div class="tbl"><table><thead><tr><th></th><th>Sedativos (baixa potência)</th><th>Incisivos (alta potência)</th></tr></thead><tbody><tr><td><strong>Exemplos</strong></td><td>clorpromazina, levomepromazina</td><td>haloperidol</td></tr><tr><td><strong>Dose</strong></td><td>alta</td><td>baixa</td></tr><tr><td><strong>Outros bloqueios</strong></td><td>histamínico H1, muscarínico, alfa-1</td><td>pouco além do D2</td></tr><tr><td><strong>Perfil adverso</strong></td><td>sedação, efeito anticolinérgico, hipotensão postural</td><td><strong>sintomas extrapiramidais</strong> marcantes</td></tr></tbody></table></div>
<h4>Sintomas extrapiramidais (complemento clínico)</h4>
<div class="tbl"><table><thead><tr><th>Quadro</th><th>Quando surge</th><th>Como se apresenta</th><th>Manejo</th></tr></thead><tbody><tr><td>Distonia aguda</td><td>horas a dias</td><td>torcicolo, crise oculógira, trismo</td><td>biperideno IM</td></tr><tr><td>Acatisia</td><td>dias a semanas</td><td>inquietação, incapacidade de ficar sentado</td><td>reduzir dose, propranolol ou BZD</td></tr><tr><td>Parkinsonismo</td><td>semanas</td><td>tremor, rigidez, bradicinesia, hipomimia</td><td>reduzir dose, biperideno</td></tr><tr><td>Discinesia tardia</td><td>meses a anos</td><td>movimentos orofaciais involuntários e repetitivos</td><td>trocar para clozapina; costuma ser irreversível</td></tr></tbody></table></div>
<p>A <strong>discinesia tardia (DT)</strong> é um distúrbio do movimento involuntário e repetitivo. O risco com os neurolépticos convencionais é de cerca de <strong>20% dos pacientes</strong>, chegando a <strong>50% em grupos de risco</strong> como idosos e pacientes clinicamente comprometidos. <strong>Fármacos que produzem poucos sintomas extrapiramidais parecem causar pouca DT também.</strong></p>
<h3>Os atípicos (segunda geração)</h3>
<p>Os atípicos mantêm o <strong>efeito antipsicótico</strong> com:</p>
<ul><li><strong>baixa propensão a sintomas extrapiramidais</strong> e <strong>menor risco de discinesia tardia</strong>;</li><li><strong>baixa propensão a hiperprolactinemia</strong>;</li><li><strong>melhor efeito sobre sintomas negativos</strong>;</li><li><strong>eficácia parcial em sintomas depressivos</strong> e <strong>melhora da função cognitiva</strong>;</li><li>utilidade em <strong>pacientes refratários</strong> (clozapina).</li></ul>
<p>O mecanismo combina bloqueio D2 menos intenso ou mais transitório com <strong>antagonismo do receptor serotoninérgico 5-HT2A</strong>, que libera dopamina justamente nas vias mesocortical e nigroestriatal. O <strong>aripiprazol</strong> tem mecanismo próprio: é <strong>agonista parcial D2</strong> — reduz a dopamina onde ela sobra e a sustenta onde falta — e é usado também como <strong>potencializador</strong> de antidepressivos.</p>
<blockquote><p><strong>Pegadinha: atípico não é sinônimo de seguro.</strong> "Menos" extrapiramidal não é "nenhum", e a risperidona em dose alta se comporta como típico. A <strong>risperidona</strong> é a exceção que <strong>eleva a prolactina</strong> tanto quanto o haloperidol. E o custo dos atípicos é <strong>metabólico</strong>.</p></blockquote>
<h3>Outros efeitos adversos — quem tem maior risco</h3>
<div class="tbl"><table><thead><tr><th>Efeito</th><th>Maior risco</th></tr></thead><tbody><tr><td>Hipotensão postural</td><td><strong>clozapina</strong></td></tr><tr><td>Alterações cardiovasculares (QT longo, arritmia)</td><td><strong>tioridazina, ziprasidona, clozapina</strong></td></tr><tr><td>Disfunção metabólica (peso, diabetes, dislipidemia)</td><td><strong>clozapina, olanzapina</strong></td></tr><tr><td>Agranulocitose</td><td><strong>clozapina</strong></td></tr></tbody></table></div>
<p>A tioridazina é a que mais prolonga o QT, com risco de torsades de pointes — por isso deixou de ser comercializada em vários países.</p>
<p>A <strong>clozapina</strong> é o caso à parte. Primeiro atípico, com baixíssimo risco extrapiramidal e eficácia sobre sintomas positivos e negativos, teve o uso restrito após <strong>casos fatais de agranulocitose</strong> e só voltou, no fim dos anos 1980, pela eficácia na <strong>esquizofrenia refratária</strong>, condicionada a <strong>hemograma seriado</strong> (complemento: semanal nas primeiras 18 semanas e mensal depois). Refratário, na prática, é quem não respondeu a dois antipsicóticos em dose e tempo adequados.</p>
<blockquote><p><strong>Complemento clínico — síndrome neuroléptica maligna.</strong> Emergência rara de qualquer antagonista dopaminérgico, mais comum com típicos de alta potência e doses altas ou rápidas: <strong>febre, rigidez em cano de chumbo, alteração de consciência, instabilidade autonômica e CPK muito elevada</strong>, instalando-se em dias. Conduta: suspender o antipsicótico, suporte intensivo, e dantrolene ou bromocriptina nos casos graves.</p></blockquote>
<h3>O que o SUS oferece</h3>
<div class="tbl"><table><thead><tr><th>Componente</th><th>Fármacos</th></tr></thead><tbody><tr><td><strong>1ª geração</strong> (atenção básica)</td><td>haloperidol (VO e IM), <strong>haloperidol decanoato</strong> (IM, depósito), clorpromazina (VO e IM), pimozida, levomepromazina, tioridazina, periciazina VO</td></tr><tr><td><strong>2ª geração</strong> (Componente Especializado, mediante <strong>LME</strong>)</td><td>risperidona, quetiapina, clozapina, olanzapina, ziprasidona</td></tr></tbody></table></div>
<p>LME é o laudo de solicitação do Componente Especializado da Assistência Farmacêutica: os atípicos não ficam na farmácia da unidade básica, dependem de laudo e de protocolo clínico. Aripiprazol (usado também como potencializador) e lurasidona completam a classe dos atípicos; a cobertura de cada um no SUS segue os protocolos clínicos vigentes. O <strong>haloperidol decanoato</strong> é a formulação de depósito, aplicada por via intramuscular em geral a cada quatro semanas — a saída para quem não adere ao oral.</p>
<h3>Por que os pacientes abandonam o tratamento</h3>
<ul><li><strong>sintomas extrapiramidais</strong>;</li><li><strong>cronicidade</strong> da doença;</li><li><strong>dificuldade de vincular-se</strong> ao tratamento;</li><li><strong>custos diretos</strong>;</li><li><strong>esgotamento familiar</strong>.</li></ul>
<hr>
<h2>Antidepressivos: classes e perfis</h2>
<p>O modelo clássico que orienta a classe é a <strong>hipótese monoaminérgica</strong>: a depressão estaria associada a <strong>baixos níveis de neurotransmissores</strong> (serotonina, noradrenalina, dopamina), e os antidepressivos <strong>aumentam a quantidade de neurotransmissor na sinapse</strong>, sobretudo <strong>impedindo que ele seja recaptado</strong> pela célula que o liberou. É um modelo útil, mas simplificado: o bloqueio da recaptação acontece em horas, e a melhora clínica leva semanas — sinal de que a resposta depende de adaptações mais lentas, como a neuroplasticidade.</p>
<div class="tbl"><table><thead><tr><th>Classe</th><th>Exemplos</th><th>Mecanismo</th><th>Perfil e efeitos adversos</th></tr></thead><tbody><tr><td><strong>Tricíclicos</strong></td><td>sedativos: amitriptilina, clomipramina; menos sedativos: imipramina, nortriptilina</td><td>inibem intensamente a recaptação de serotonina e noradrenalina; bloqueiam muscarínicos, H1 e alfa-1</td><td>visão embaçada, boca seca, constipação, efeitos cardíacos, disfunção erétil, sedação, hipotensão</td></tr><tr><td><strong>ISRS</strong></td><td>fluoxetina, fluvoxamina, paroxetina, sertralina, citalopram, escitalopram</td><td>inibem a recaptação da serotonina</td><td>menos efeitos e menos sedação que os tricíclicos; desconforto gástrico, diarreia, náusea, ansiedade inicial, disfunção sexual</td></tr><tr><td><strong>IMAO</strong></td><td>(tranilcipromina)</td><td>inibem a monoaminoxidase, que degrada as monoaminas</td><td>crise hipertensiva com tiramina; muitas interações</td></tr><tr><td><strong>Duais</strong></td><td>venlafaxina, desvenlafaxina, duloxetina</td><td>inibem a recaptação de serotonina e noradrenalina</td><td>ação semelhante à dos tricíclicos, com bem menos efeitos adversos</td></tr><tr><td><strong>Multimodal</strong></td><td>vortioxetina</td><td>modula e estimula o sistema serotoninérgico, com efeito em cascata sobre outros neurotransmissores</td><td>efeito <strong>pró-cognitivo</strong></td></tr><tr><td><strong>Dopaminérgico</strong></td><td>bupropiona</td><td>inibe a recaptação de dopamina e noradrenalina</td><td>energia e motivação; ansiedade, menos apetite, sem disfunção sexual</td></tr></tbody></table></div>
<h3>Tricíclicos</h3>
<p>Os tricíclicos atuam nos eixos de serotonina e noradrenalina <strong>de forma intensa</strong>, mas o que limita seu uso são os bloqueios "fora do alvo": <strong>muscarínicos</strong> (boca seca, constipação, visão embaçada, retenção urinária, confusão no idoso), <strong>histamínicos</strong> (sedação, ganho de peso) e <strong>alfa-1</strong> (hipotensão postural), além dos <strong>efeitos cardíacos</strong>. A <strong>amitriptilina</strong> tem <strong>ação analgésica</strong> e <strong>auxilia na insônia</strong> — por isso aparece em doses baixas na dor crônica, na fibromialgia e na profilaxia de cefaleia.</p>
<blockquote><p><strong>Complemento clínico.</strong> Em superdosagem os tricíclicos são <strong>cardiotóxicos</strong> (alargamento do QRS, arritmias) e potencialmente letais — cuidado redobrado em paciente com risco de suicídio.</p></blockquote>
<h3>Bupropiona</h3>
<p>A bupropiona tem <strong>ação dopaminérgica</strong> (e noradrenérgica), com <strong>intensa ação sobre energia e motivação</strong>, porém com <strong>aumento dos sintomas de ansiedade</strong>. Entre os efeitos estão <strong>aumento da libido</strong> e <strong>diminuição do apetite</strong>. Há <strong>interação com álcool</strong> — a combinação reduz o limiar convulsivo — e ela é usada no <strong>tratamento do tabagismo</strong>. É escolha lógica no deprimido apático, cansado e não ansioso.</p>
<blockquote><p><strong>Pegadinha de classificação.</strong> A bupropiona às vezes aparece agrupada entre os "duais", mas <strong>não tem ação serotoninérgica</strong>: é inibidora da recaptação de noradrenalina e dopamina. Os duais propriamente ditos — inibidores da recaptação de serotonina e noradrenalina — são venlafaxina, desvenlafaxina e duloxetina.</p></blockquote>
<h3>Duas interações que caem em prova (complemento clínico)</h3>
<ul><li><strong>IMAO + tiramina:</strong> alimentos ricos em tiramina (queijos curados, embutidos, vinho) em quem usa IMAO causam <strong>crise hipertensiva</strong>, porque a tiramina, que não é mais degradada, libera noradrenalina em massa.</li><li><strong>Síndrome serotoninérgica:</strong> combinar ou aumentar serotoninérgicos (ISRS, duais, IMAO, tramadol, linezolida, triptanos) pode causar, em <strong>horas</strong>, alteração mental, hiperatividade autonômica (febre, sudorese, taquicardia, diarreia, midríase) e hiperatividade neuromuscular — <strong>clônus, mioclonias e hiperreflexia</strong>, mais nos membros inferiores. Diferencia-se da síndrome neuroléptica maligna pelo <strong>início rápido</strong> e pelo <strong>clônus</strong>, contra a <strong>rigidez em cano de chumbo</strong> e a instalação em dias da SNM. Conduta: suspender o agente; ciproeptadina nos casos moderados.</li></ul>
<h3>Por que os pacientes param o antidepressivo</h3>
<p>As razões de descontinuação mais citadas pelos pacientes são: <strong>não toleraram os efeitos colaterais</strong>, <strong>acharam que não precisavam mais</strong>, <strong>sentiram-se melhor</strong>, <strong>a medicação não estava funcionando</strong> e <strong>acabou a medicação</strong>. Repare que duas delas são o próprio sucesso do tratamento — o paciente melhora e para, e é aí que mora a recaída. Orientar sobre tempo de tratamento faz parte da prescrição.</p>
<hr>
<h2>Estabilizadores do humor: lítio, carbamazepina e valproato</h2>
<p>Estabilizadores do humor são medicamentos usados na <strong>prevenção e no tratamento dos transtornos do humor e do transtorno esquizoafetivo</strong>, com <strong>efeito antimaníaco e antidepressivo</strong>. Os três clássicos são o <strong>carbonato de lítio</strong>, a <strong>carbamazepina</strong> e o <strong>valproato de sódio</strong>.</p>
<h3>Lítio</h3>
<h4>Indicações</h4>
<ul><li><strong>Transtorno afetivo bipolar</strong> — episódios de mania, hipomania e depressão.</li><li><strong>Depressão recorrente</strong> (profilaxia) e <strong>depressão resistente</strong>.</li><li><strong>Transtorno esquizoafetivo</strong>.</li><li><strong>Agressividade</strong> e <strong>impulsividade</strong>.</li><li><strong>Prevenção de suicídio</strong> — efeito antissuicida próprio do lítio.</li></ul>
<h4>O que mexe na litemia</h4>
<p>O lítio <strong>não é metabolizado nem se liga a proteínas</strong>: é filtrado e reabsorvido pelo rim como se fosse sódio. Tudo o que faz o rim reter sódio retém lítio.</p>
<ul><li><strong>Idosos</strong> — filtração menor, litemia maior com a mesma dose.</li><li><strong>Diuréticos tiazídicos</strong> (hidroclorotiazida) e <strong>anti-inflamatórios não hormonais</strong> <strong>aumentam</strong> a litemia; ISRS em associação também pedem atenção.</li><li><strong>Associação com carbamazepina</strong> → <strong>neurotoxicidade aumentada</strong>, mesmo com litemia normal.</li></ul>
<blockquote><p><strong>Complemento clínico — janela estreita.</strong> A litemia-alvo fica em torno de <strong>0,6 a 1,2 mEq/L</strong> (mais alta na mania aguda, mais baixa na manutenção). Acima de <strong>1,5 mEq/L</strong> aparece a intoxicação: <strong>tremor grosseiro, ataxia, disartria, vômitos, diarreia e confusão</strong>; acima de 2,5, convulsões e coma, com indicação de hemodiálise. IECA e BRA também elevam a litemia. O paciente que começa um tiazídico ou um anti-inflamatório e passa a tremer e cambalear está intoxicado até prova em contrário.</p></blockquote>
<h4>Efeitos colaterais</h4>
<div class="tbl"><table><thead><tr><th>Comuns</th><th>A vigiar no longo prazo</th></tr></thead><tbody><tr><td>Poliúria e polidipsia</td><td><strong>Diabetes insipidus nefrogênico</strong> (não responde à desmopressina)</td></tr><tr><td>Tremor</td><td>Alterações renais subclínicas</td></tr><tr><td>Diarreia e náuseas</td><td><strong>Indução de hipotireoidismo</strong></td></tr><tr><td>Aumento de peso</td><td>Acne, alergias, alopecia</td></tr></tbody></table></div>
<p>Daí o seguimento com <strong>creatinina</strong> e <strong>TSH</strong>, além da litemia.</p>
<h4>Contraindicações</h4>
<ul><li><strong>Insuficiência renal aguda</strong>.</li><li><strong>Infarto do miocárdio</strong>.</li><li><strong>Primeiro trimestre da gravidez</strong> — risco de malformação cardíaca, classicamente a <strong>anomalia de Ebstein</strong> (complemento: o risco absoluto é menor do que se estimava, e hoje a decisão é individualizada).</li></ul>
<h3>Carbamazepina</h3>
<p>Anticonvulsivante com <strong>eficácia antimaníaca</strong> e <strong>pouca eficácia antidepressiva</strong>. Parece <strong>não ser tão eficaz quanto o lítio</strong>, mas parece ser <strong>mais eficaz em ciclagem rápida, mania disfórica, pacientes com lesão cerebral e depressão grave e episódica</strong>. A <strong>associação com lítio</strong> tem <strong>maior eficácia profilática</strong>.</p>
<p>Efeitos colaterais: <strong>rash cutâneo</strong>, <strong>leucopenia</strong> e <strong>discrasias sanguíneas</strong> (cuidado com sangramentos ou sinais de infecção), <strong>alteração de exames hepáticos</strong>, <strong>hiponatremia</strong>; no <strong>aumento rápido de dose</strong>, tontura, ataxia, letargia e diplopia. É <strong>teratogênica</strong> e está <strong>presente no leite materno</strong>.</p>
<blockquote><p><strong>A "narcisa" dos neurolépticos.</strong> A carbamazepina é um potente <strong>indutor enzimático hepático</strong> — "só pensa em si" e derruba o nível dos outros fármacos: <strong>anticoncepcionais orais</strong> (risco de gravidez numa droga teratogênica), <strong>neurolépticos</strong>, <strong>clonazepam</strong>, <strong>ácido valproico</strong>, outros <strong>anticonvulsivantes</strong> e <strong>anticoagulantes</strong>. Ela induz também o próprio metabolismo (autoindução), e a dose precisa ser reajustada nas primeiras semanas.</p></blockquote>
<h3>Valproato</h3>
<p>Anticonvulsivante <strong>antimaníaco e talvez antidepressivo</strong>, com <strong>melhor resultado na mania disfórica e na ciclagem rápida</strong> e <strong>ação profilática para mania</strong>. Tem <strong>melhor tolerabilidade e menos interações</strong> que lítio e carbamazepina.</p>
<p>Efeitos colaterais: <strong>tremor</strong>, <strong>aumento de peso</strong>, <strong>epigastralgia</strong>, <strong>queda ou enfraquecimento do cabelo</strong> e <strong>ovários policísticos</strong>. É <strong>teratogênico</strong>, <strong>pode ser usado na amamentação</strong> e tem <strong>baixa toxicidade em superdosagem</strong>.</p>
<blockquote><p><strong>Complemento clínico.</strong> Entre os estabilizadores, o valproato tem o <strong>maior risco teratogênico</strong> — defeitos do tubo neural e prejuízo do neurodesenvolvimento —, e as diretrizes atuais pedem que seja evitado em mulheres em idade fértil sem contracepção eficaz. Ele é <strong>inibidor</strong> enzimático (dobra o nível da lamotrigina), e pode causar hepatotoxicidade, pancreatite, plaquetopenia e hiperamonemia.</p></blockquote>
<div class="tbl"><table><thead><tr><th></th><th>Lítio</th><th>Carbamazepina</th><th>Valproato</th></tr></thead><tbody><tr><td><strong>Destaque</strong></td><td>antissuicida; profilaxia de longo prazo</td><td>ciclagem rápida, mania disfórica, lesão cerebral</td><td>mania disfórica, ciclagem rápida; boa tolerabilidade</td></tr><tr><td><strong>Efeito-assinatura</strong></td><td>poliúria, tremor, hipotireoidismo, diabetes insipidus</td><td>rash, leucopenia, hiponatremia</td><td>peso, queda de cabelo, ovários policísticos</td></tr><tr><td><strong>Interação-chave</strong></td><td>tiazídicos e AINEs elevam o nível</td><td>indutor: reduz anticoncepcional e outros</td><td>inibidor enzimático</td></tr><tr><td><strong>Gestação</strong></td><td>Ebstein (1º trimestre)</td><td>teratogênica</td><td>teratogenicidade mais alta</td></tr></tbody></table></div>
<h3>Psicotrópicos por fase do transtorno bipolar</h3>
<div class="tbl"><table><thead><tr><th>Fase</th><th>Fase aguda (emergência, primeiros dias)</th><th>Manutenção e prevenção</th></tr></thead><tbody><tr><td><strong>Mania</strong></td><td>neurolépticos + benzodiazepínicos + estabilizador do humor</td><td>estabilizador: lítio ou anticonvulsivante</td></tr><tr><td><strong>Depressão</strong></td><td>antidepressivo + estabilizador do humor</td><td>estabilizador: lítio ou anticonvulsivante</td></tr></tbody></table></div>
<blockquote><p><strong>Nunca antidepressivo sozinho no bipolar.</strong> Na depressão bipolar o antidepressivo só entra <strong>associado</strong> a estabilizador, pelo risco de virada maníaca. (Complemento: as diretrizes atuais colocam quetiapina, lurasidona, lítio e lamotrigina na primeira linha da depressão bipolar, e o antidepressivo como adjuvante.)</p></blockquote>
<hr>
<h2>Benzodiazepínicos</h2>
<h3>Mecanismo e efeitos</h3>
<p>Os receptores <strong>GABA-A</strong> modulam <strong>alterações rápidas e súbitas do humor</strong> — <strong>ansiedade, pânico e resposta ao estresse</strong>. Os benzodiazepínicos (BZD) agem nesses receptores, ligando-se a um sítio próprio e <strong>potencializando o GABA</strong>, o principal neurotransmissor inibitório (o canal de cloreto se abre mais, o neurônio fica menos excitável). Disso vêm cinco efeitos:</p>
<ol><li><strong>sedativo</strong>;</li><li><strong>ansiolítico</strong>;</li><li><strong>relaxante muscular</strong>;</li><li><strong>anticonvulsivante</strong>;</li><li><strong>amnéstico</strong>.</li></ol>
<p>O antagonista do sítio benzodiazepínico é o <strong>flumazenil</strong> (complemento).</p>
<h3>Quem é usado para quê</h3>
<div class="tbl"><table><thead><tr><th>Uso</th><th>Fármacos</th><th>Por quê</th></tr></thead><tbody><tr><td><strong>Ansiolíticos</strong></td><td>diazepam, alprazolam, bromazepam, clonazepam</td><td>pico mais lento e declínio gradual da concentração</td></tr><tr><td><strong>Hipnóticos</strong></td><td><strong>midazolam</strong> (meia-vida muito curta)</td><td>início rápido, maior lipossolubilidade</td></tr><tr><td><strong>Anticonvulsivante</strong></td><td>clonazepam</td><td>uso principal desse composto</td></tr></tbody></table></div>
<h3>Farmacocinética</h3>
<p>Os BZD são <strong>bem absorvidos pelo trato gastrointestinal</strong>. São compostos de <strong>alta lipossolubilidade</strong>, e isso explica quase tudo:</p>
<ul><li><strong>atravessam mais rapidamente a barreira hematoencefálica</strong>, com <strong>início de ação mais rápido</strong>;</li><li><strong>ligam-se a depósitos de gordura</strong>, permanecendo mais tempo no organismo;</li><li>os de início mais rápido têm <strong>maior potencial de abuso</strong>;</li><li><strong>atravessam a barreira placentária</strong> (podem sedar o feto e associam-se a problemas neonatais) e <strong>passam para o leite materno</strong>, sedando o recém-nascido.</li></ul>
<p>A ligação a proteínas é alta (mais de 90%), o que pede atenção em estados carenciais e hipoalbuminemia, quando a fração livre e o efeito aumentam.</p>
<blockquote><p><strong>Via intramuscular — a pegadinha.</strong> <strong>Diazepam</strong> e <strong>clordiazepóxido</strong> por via intramuscular têm absorção <strong>lenta e errática</strong> (cristalizam no local) e picos menores que pela via oral. <strong>Lorazepam</strong> e <strong>midazolam</strong>, hidrossolúveis, são <strong>rapidamente absorvidos</strong> e bem tolerados no músculo. Precisa de BZD intramuscular? Midazolam.</p></blockquote>
<h3>Efeitos sobre o sono, o desempenho e a memória</h3>
<div class="tbl"><table><thead><tr><th>Domínio</th><th>Efeito</th></tr></thead><tbody><tr><td><strong>Sono</strong></td><td>↓ latência do sono · ↓ despertares · ↑ tempo total de sono</td></tr><tr><td><strong>Desempenho psicomotor</strong></td><td>↓ velocidade de desempenho · tempo de reação <strong>alongado</strong> (reflexos mais lentos) · cuidado com tarefas que exigem precisão de movimentos</td></tr><tr><td><strong>Memória</strong></td><td><strong>amnésia anterógrada</strong>; memória semântica e de procedimento preservadas</td></tr></tbody></table></div>
<p>O prejuízo psicomotor, de atenção e de vigilância é <strong>proporcional à dose</strong> e dura conforme a meia-vida: com BZD de <strong>meia-vida longa</strong> tomado à noite, persiste na manhã seguinte. Pior, o julgamento também é afetado, e o paciente <strong>não percebe a própria limitação</strong>. O uso de BZD associa-se a <strong>acidentes automobilísticos</strong>, risco maior em <strong>idosos</strong> usando compostos de <strong>meia-vida longa em doses altas</strong> — e, no idoso, a quedas e fratura de quadril.</p>
<p>Sobre a memória: os BZD, por qualquer via, induzem <strong>amnésia anterógrada</strong> — reduzem a lembrança do que acontece <strong>depois</strong> da dose, enquanto o paciente está sob efeito. <strong>Nenhum BZD causa amnésia retrógrada.</strong> O dano principal recai sobre a <strong>memória episódica de longo prazo</strong> (autobiográfica), por falha na <strong>consolidação</strong> — prejudicam a passagem da memória recente de curto para longo prazo. Ficam preservadas a memória de curto prazo/operacional, a <strong>memória semântica</strong> (conhecimento geral) e a <strong>memória de procedimento</strong> (habilidades). O efeito amnéstico <strong>independe da sedação</strong>, embora ela o intensifique.</p>
<h3>Tolerância, dependência e abstinência</h3>
<p>O uso prolongado leva a <strong>tolerância</strong> e <strong>dependência</strong>. O quadro de <strong>abstinência é pouco específico</strong>:</p>
<ul><li><strong>irritabilidade, agitação, insônia</strong>;</li><li><strong>tremor, sudorese, palpitações, náusea, letargia, cefaleia, dor e tensão muscular</strong>;</li><li><strong>aumento da sensibilidade a luz e sons, parestesias, cãibras</strong>;</li><li><strong>convulsões</strong> — o risco mais grave.</li></ul>
<blockquote><p><strong>Complemento clínico.</strong> Nunca suspender abruptamente um BZD usado por meses: reduz-se a dose de forma gradual, em semanas a meses, às vezes trocando antes por um de meia-vida longa. Diante de abstinência instalada, reintroduz-se o BZD e recomeça-se a retirada lenta.</p></blockquote>
<p>O BZD é um dos medicamentos mais vendidos, e o tema da <strong>"farmacologização da vida"</strong> — tratar com comprimido o sofrimento cotidiano — é o pano de fundo do seu uso excessivo. Prescrição por tempo limitado, com plano de retirada desde o início, é a regra.</p>
<hr>
<h2>Escolha do psicofármaco, adesão e polifarmácia</h2>
<p>A escolha do medicamento pesa um conjunto de aspectos, e nenhum deles sozinho decide:</p>
<ul><li><strong>eficácia</strong> para aquele quadro;</li><li><strong>mecanismo de ação</strong>;</li><li><strong>características do medicamento</strong> — farmacocinética e farmacodinâmica;</li><li><strong>tolerabilidade</strong>;</li><li><strong>tempo para o início da ação</strong>;</li><li><strong>segurança</strong> (inclusive em superdosagem);</li><li><strong>custo</strong> — que, no SUS, se traduz em disponibilidade na atenção básica ou necessidade de LME.</li></ul>
<p>O <strong>doente crônico</strong> frequentemente acumula medicamentos: diurético, anti-hipertensivo, remédio "do coração", antiulceroso, polivitamínico, benzodiazepínico e antidepressivo. A <strong>polifarmácia</strong> multiplica interações e efeitos adversos, e várias delas já apareceram nas seções anteriores:</p>
<div class="tbl"><table><thead><tr><th>Combinação</th><th>Risco</th></tr></thead><tbody><tr><td>Lítio + tiazídico ou anti-inflamatório</td><td>elevação da litemia e intoxicação</td></tr><tr><td>Lítio + carbamazepina</td><td>neurotoxicidade</td></tr><tr><td>Carbamazepina + anticoncepcional, anticoagulante, neuroléptico</td><td>queda do nível do outro fármaco</td></tr><tr><td>ISRS + tramadol, IMAO ou triptano</td><td>síndrome serotoninérgica</td></tr><tr><td>BZD de meia-vida longa no idoso</td><td>sedação residual, quedas, acidentes</td></tr><tr><td>BZD + álcool</td><td>depressão do sistema nervoso central e respiratória</td></tr></tbody></table></div>
<blockquote><p><strong>Síntese para a prova.</strong> Antipsicótico: pense em qual via o D2 foi bloqueado. Antidepressivo: pense em quais receptores além do alvo foram atingidos. Estabilizador: pense no rim (lítio), no fígado indutor (carbamazepina) e na gestação (valproato). Benzodiazepínico: pense em GABA-A, lipossolubilidade, amnésia anterógrada e abstinência com convulsão.</p></blockquote></script>

    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

function renderQuestion(){

    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }

      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';
  if (pct>=90)      { title='Domínio sólido';   msg='Desempenho excelente. Confira as explicações das que escaparam e siga em frente.'; }
  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

  var stat = function(v,l,color){
    return '<div style="background:#faf9f6;padding:14px 10px">' +
      '<div style="'+mono+';font-size:19px;font-weight:500;color:'+color+'">'+v+'</div>' +
      '<div style="'+mono+';font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#8a8578;margin-top:2px">'+l+'</div></div>';
  };

  var fdefs = [['all','Todas',c.total],['wrong','Erradas',c.miss],['right','Certas',c.hit],['blank','Em branco',c.blank]];
  var filters = fdefs.map(function(f){
    var on = S.filter===f[0];
    return '<button type="button" data-act="filter" data-k="'+f[0]+'" class="h-line" style="border-radius:99px;padding:8px 14px;font-size:13px;cursor:pointer;transition:all .15s ease;border:1px solid '+(on?'#121a2b':'#ddd8ce')+';background:'+(on?'#121a2b':'transparent')+';color:'+(on?'#f5f3ef':'#5b6478')+'">'+f[1]+' '+f[2]+'</button>';
  }).join('');

  var list = reviewList();
  var allOpen = list.length>0 && list.every(function(r){ return S.open[r.idx]; });

  var cards = list.map(function(r){
    var numBg='#f0ede7', numFg='#8a8578';
    if (!r.blank) { if (r.ok) { numBg='#e3f0e8'; numFg='#1f5c3e'; } else { numBg='#fbe6e2'; numFg='#8f2f25'; } }
    var open = !!S.open[r.idx];
    var body = '';
    if (open) {
      var opts = r.q.options.map(function(text,n){
        var isC = n===r.q.correctIndex, isMine = n===r.a;
        var bd='#eeebe4', bg='#fbfaf8', fg='#5b6478', bBg='#f0ede7', bFg='#8a8578', tag='', tBg='', tFg='';

        if (isMine && !isC) { bd='#eec4bd'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; tag='Sua resposta'; tBg='#f7ddd8'; tFg='#8f2f25'; }
        if (isMine && isC)  { tag='Sua resposta ✓'; }
        return '<div style="display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:11px;font-size:14px;line-height:1.5;border:1px solid '+bd+';background:'+bg+';color:'+fg+'">' +

          (tag ? '<span style="flex-shrink:0;'+mono+';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;margin-top:1px;background:'+tBg+';color:'+tFg+'">'+tag+'</span>' : '') +
          '</div>';
      }).join('');
      body = '<div style="padding:2px 15px 18px;animation:qDrawer .2s ease">' +
        '<div style="height:1px;background:#eeebe4;margin:0 0 16px"></div>' +
        '<p style="font-family:\'Newsreader\',Georgia,serif;font-size:18px;line-height:1.5;margin:0 0 16px;text-wrap:pretty">'+esc(r.q.question)+'</p>' +
        figura(r.q) +
        '<div style="display:flex;flex-direction:column;gap:7px">'+opts+'</div>' +
        '<div style="margin-top:16px;padding:14px 16px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 11px 11px 0">' +
          '<div style="'+mono+';font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:7px">Por quê</div>' +
          '<p style="margin:0;font-size:14px;line-height:1.65;color:#39404f;text-wrap:pretty">'+esc(r.q.explanation)+'</p></div>' +
        '<button type="button" data-act="jump" data-n="'+r.idx+'" style="margin-top:14px;background:none;border:0;padding:0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#2b57cc;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Abrir no quiz →</button></div>';
    }
    return '<div style="background:#fff;border:1px solid '+(open?'#c9c3b6':'#e4e0d8')+';border-radius:14px;overflow:hidden;transition:border-color .15s ease">' +
      '<button type="button" data-act="toggle" data-n="'+r.idx+'" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 15px;cursor:pointer">' +
        '<span style="flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:12px;font-weight:600;background:'+numBg+';color:'+numFg+'">'+pad(r.idx+1)+'</span>' +
        '<span style="flex:1;min-width:0;font-size:14px;line-height:1.45;color:#39404f;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(r.q.question)+'</span>' +
        '<span style="flex-shrink:0;'+mono+';font-size:16px;color:#8a8578;width:16px;text-align:center">'+(open?'−':'+')+'</span>' +
      '</button>' + body + '</div>';
  }).join('');

  document.getElementById('stage').innerHTML =
    '<section style="padding:34px 0 0;animation:qFade .3s ease">' +
      '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:14px">Resultado</div>' +
      '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:36px;line-height:1.12;font-weight:400;letter-spacing:-.025em;margin:0 0 8px">'+title+'</h2>' +
      '<p style="font-size:15px;line-height:1.6;color:#5b6478;margin:0 0 24px;max-width:48ch;text-wrap:pretty">'+msg+'</p>' +
      '<div style="height:8px;border-radius:99px;background:#e4e0d8;overflow:hidden;margin-bottom:10px">' +
        '<div style="height:100%;border-radius:99px;background:#121a2b;transition:width .7s cubic-bezier(.22,1,.36,1);width:'+pct+'%"></div></div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e4e0d8;border:1px solid #e4e0d8;border-radius:14px;overflow:hidden;margin-bottom:34px">' +
        stat(c.hit,'Certas','#2e7d55')+stat(c.miss,'Erradas','#c04437')+stat(c.blank,'Branco','#8a8578')+stat(pct+'%','Aproveit.','#2b57cc') +
      '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px">' +
        '<h3 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;font-weight:500;letter-spacing:-.015em;margin:0">Gabarito comentado</h3>' +
        '<button type="button" data-act="toggleAll" class="h-ink" style="background:none;border:0;padding:6px 0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;text-decoration:underline;text-underline-offset:3px">'+(allOpen?'Recolher tudo':'Expandir tudo')+'</button>' +
      '</div>' +
      '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">'+filters+'</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">'+cards+'</div>' +
      (list.length===0 ? '<div style="padding:38px 16px;text-align:center;color:#8a8578;font-size:14px;border:1px dashed #ddd8ce;border-radius:14px">Nenhuma questão neste filtro.</div>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:28px;padding-top:24px;border-top:1px solid #e4e0d8">' +
        '<button type="button" data-act="restart" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:13px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">Refazer o quiz</button>' +
        '<button type="button" data-act="back" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Voltar às questões</button>' +
        '<button type="button" data-act="resumo" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Ler o resumo</button>' +
      '</div></section>';
}

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
