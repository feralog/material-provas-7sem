<script type="text/html" id="resumoSrc"><h2>O peso da doença</h2>
<p>A retinopatia diabética é a complicação microvascular mais característica do diabetes mellitus, presente tanto no tipo 1 quanto no tipo 2. É a tradução ocular de um processo que corre em paralelo no rim e no nervo periférico: a hiperglicemia crônica lesa o leito capilar, e a retina — tecido de altíssima demanda metabólica, irrigado por vasos terminais sem circulação colateral — é um dos primeiros territórios a denunciar o dano. Falar em retinopatia é, portanto, falar em <strong>dano em órgão-alvo</strong>, e não em um problema oftalmológico isolado.</p>
<p>A magnitude epidemiológica justifica o rastreamento sistemático. Em países de alta renda, a retinopatia diabética é a <strong>causa mais frequente de novos casos de cegueira na faixa de 20 a 74 anos</strong> — exatamente a população economicamente ativa. Cerca de <strong>um terço de todos os diabéticos</strong> apresenta algum grau de retinopatia em um corte transversal qualquer.</p>
<p>O tempo de doença manda no risco, e manda de forma diferente nos dois tipos:</p>
<ul><li><strong>Diabetes tipo 1:</strong> aproximadamente <strong>84%</strong> já têm retinopatia após <strong>19 anos</strong> de doença. Praticamente todo portador de tipo 1 acaba acometido se viver tempo suficiente com a doença.</li><li><strong>Diabetes tipo 2:</strong> cerca de <strong>2%</strong> desenvolvem a forma <strong>proliferativa</strong> em menos de 5 anos de doença, proporção que sobe para <strong>25% após 25 anos</strong>. Como o tipo 2 é diagnosticado anos depois de instalado, parte desses pacientes já chega à primeira consulta com retinopatia.</li></ul>
<blockquote><p>Metade dos pacientes sem tratamento evolui para perda visual grave; com rastreamento regular e tratamento precoce, até <strong>98%</strong> dessa perda pode ser prevenida. A diferença entre esses dois números é o exame de fundo de olho feito a tempo.</p></blockquote>
<hr>
<h2>Da hiperglicemia ao neovaso</h2>
<h3>As quatro vias do dano</h3>
<p>A hiperglicemia crônica não age por um mecanismo único. Ela aciona, em paralelo, quatro processos que convergem sobre o capilar retiniano:</p>
<ol><li><strong>Produção aumentada de radicais livres</strong> — estresse oxidativo com lesão direta do endotélio.</li><li><strong>Formação de produtos finais de glicação avançada (AGEs)</strong> — a glicose reage de forma não enzimática com grupos amino de proteínas, gerando a base de Schiff, que se rearranja no produto de Amadori e, ao final, nos AGEs. Esses produtos alteram proteínas estruturais da parede vascular e ativam receptores pró-inflamatórios.</li><li><strong>Liberação de fatores inflamatórios</strong> — recrutamento leucocitário, adesão endotelial e quebra progressiva da barreira hematorretiniana.</li><li><strong>Aumento do fator de crescimento endotelial vascular (VEGF)</strong> — mediador que, ao mesmo tempo, <strong>aumenta a permeabilidade</strong> vascular e <strong>estimula a angiogênese</strong>. É o alvo farmacológico central do tratamento moderno.</li></ol>
<h3>A sequência de eventos na microvasculatura</h3>
<h4>1. Perda de pericitos</h4>
<p>Os pericitos são células contráteis que abraçam o capilar e sustentam mecanicamente sua parede. A hiperglicemia provoca sua apoptose, e o segmento desguarnecido se dilata focalmente: nasce o <strong>microaneurisma</strong>, a primeira lesão clinicamente visível da doença.</p>
<h4>2. Aumento da permeabilidade</h4>
<p>Com a barreira hematorretiniana rompida, plasma e lipoproteínas extravasam para dentro da retina. Clinicamente isso aparece como <strong>espessamento retiniano</strong> (edema) e <strong>exsudatos duros</strong>.</p>
<h4>3. Não-perfusão capilar</h4>
<p>Capilares vão se ocluindo progressivamente, criando territórios de retina sem irrigação. A angiofluoresceinografia revela essas áreas como zonas escuras de ausência de enchimento.</p>
<h4>4. Isquemia, hipóxia e VEGF</h4>
<p>A retina isquêmica responde à hipóxia aumentando a expressão de VEGF. O estímulo angiogênico leva ao brotamento de <strong>vasos neoformados</strong>, de parede frágil e acompanhados de tecido fibroso. Esse é o ponto de virada da doença: tudo que vem depois — hemorragia vítrea, tração, glaucoma neovascular — descende desse passo.</p>
<blockquote><p>Durante décadas a retinopatia foi entendida como doença puramente microvascular. Evidências mais recentes descrevem <strong>neurodegeneração retiniana precoce</strong>, com apoptose de células ganglionares e afinamento das camadas internas, detectável <strong>antes</strong> de surgirem os primeiros microaneurismas.</p></blockquote>
<hr>

<div class="tbl"><table><thead><tr><th>Achado</th><th>Aspecto no fundo de olho</th><th>O que significa</th></tr></thead><tbody><tr><td><strong>Microaneurisma</strong></td><td>Ponto vermelho pequeno, redondo, de limites nítidos</td><td>Dilatação sacular de capilar que perdeu pericitos</td></tr><tr><td><strong>Hemorragia intrarretiniana</strong></td><td>Mancha vermelha puntiforme ou em borrão, de bordas irregulares</td><td>Ruptura de microaneurisma ou de capilar incompetente</td></tr><tr><td><strong>Exsudato duro</strong></td><td>Depósito <strong>amarelo</strong>, brilhante, de <strong>bordas nítidas</strong>, frequentemente em anel</td><td>Lipoproteína extravasada — marcador de <strong>extravasamento</strong></td></tr><tr><td><strong>Mancha algodonosa</strong></td><td>Mancha <strong>esbranquiçada</strong>, felpuda, de <strong>bordas esgarçadas</strong></td><td>Microinfarto da camada de fibras nervosas — marcador de <strong>isquemia</strong></td></tr><tr><td><strong>Veia em rosário</strong></td><td>Vênula com calibre irregular, em contas de colar</td><td>Sofrimento venoso por isquemia grave adjacente</td></tr><tr><td><strong>IRMA</strong></td><td>Capilares dilatados e tortuosos <strong>dentro</strong> da espessura retiniana</td><td>Shunt ao redor de área não perfundida</td></tr><tr><td><strong>Neovaso</strong></td><td>Tufo de vasos finos, tortuosos, <strong>acima</strong> da superfície retiniana</td><td>Angiogênese por VEGF — define a forma proliferativa</td></tr></tbody></table></div>
<p>Dois pares são cobrados exaustivamente em prova e merecem atenção:</p>
<ul><li><strong>Exsudato duro × mancha algodonosa.</strong> O primeiro é amarelo, de contornos bem definidos, e nasce de extravasamento. O segundo é esbranquiçado, felpudo, e nasce de oclusão de arteríola pré-capilar com interrupção do transporte axoplasmático. Um é vazamento, o outro é infarto.</li><li><strong>IRMA × neovaso.</strong> O IRMA permanece <strong>dentro</strong> da retina e representa remodelamento de capilares preexistentes; o neovaso cresce <strong>sobre</strong> a superfície retiniana, em direção ao vítreo, e é tecido novo. Essa distinção decide se o paciente é classificado como não proliferativo grave ou como proliferativo — e, portanto, se recebe laser.</li></ul>
<hr>
<h2>Classificação por estágios</h2>
<p>A divisão fundamental é binária: <strong>há neovasos ou não há</strong>. A ausência deles define o grupo não proliferativo (RDNP), que se subdivide pela carga de lesões; a presença define a forma proliferativa (RDP).</p>

<div class="tbl"><table><thead><tr><th>Estágio</th><th>Achado na retinografia</th><th>Conduta</th></tr></thead><tbody><tr><td><strong>RDNP leve</strong></td><td>Apenas microaneurismas</td><td>Controle metabólico; reavaliação anual</td></tr><tr><td><strong>RDNP moderada</strong></td><td>Microaneurismas + hemorragias intrarretinianas + manchas algodonosas + exsudatos duros</td><td><strong>Encaminhamento ao oftalmologista</strong>; reavaliação em 6 meses</td></tr><tr><td><strong>RDNP grave</strong> (pré-proliferativa)</td><td>Regra <strong>4-2-1</strong>: hemorragias graves nos <strong>4</strong> quadrantes, <strong>ou</strong> veias em rosário em <strong>2</strong> ou mais, <strong>ou</strong> IRMA em <strong>1</strong> ou mais — sem neovasos</td><td><strong>Encaminhamento urgente</strong>; vigilância estreita, laser em casos selecionados</td></tr><tr><td><strong>RDP</strong></td><td>Neovasos no disco (NVD), em outras áreas da retina (NVE), na íris ou no ângulo de filtração</td><td><strong>Panfotocoagulação a laser</strong> e/ou anti-VEGF</td></tr><tr><td><strong>Edema macular diabético</strong></td><td>Espessamento macular, exsudatos em anel perifoveal</td><td><strong>Encaminhamento urgente em qualquer estágio</strong>; anti-VEGF se centro acometido</td></tr></tbody></table></div>
<p>A regra 4-2-1 é o filtro que identifica quem está prestes a neovascularizar. Ela não exige todos os critérios simultaneamente: <strong>qualquer um deles</strong>, isolado e na ausência de neovasos, já classifica a retinopatia como grave.</p>

<h2>Edema macular diabético</h2>
<p>O edema macular diabético (EMD) é a consequência direta do aumento da permeabilidade vascular: plasma extravasa por capilares com barreira rompida e se acumula na retina central. Clinicamente aparece como espessamento macular, muitas vezes cercado por exsudatos duros dispostos em anel ao redor do foco de vazamento.</p>

<p>Duas características do EMD mudam a conduta prática:</p>
<ul><li>Ele <strong>pode ocorrer em qualquer estágio</strong>, inclusive na RDNP leve. Não é privilégio da forma proliferativa, e por isso o estadiamento periférico não dispensa o exame cuidadoso da mácula.</li><li>Ele é a <strong>principal causa de perda visual moderada</strong> no diabético. Enquanto a RDP tende a causar perda súbita e catastrófica, o EMD corrói a acuidade de forma lenta e é, em volume de casos, o que mais cega funcionalmente.</li></ul>
<p>A <strong>tomografia de coerência óptica (OCT)</strong> é o exame de escolha para diagnosticar, quantificar e acompanhar o EMD. Ela produz cortes de alta resolução da retina, mede a espessura macular em micrometros e revela cistos intrarretinianos e líquido sub-retiniano que a retinografia colorida não mostra. A resposta ao tratamento é monitorada por OCT seriada.</p>

<blockquote><p>Qualquer nível de edema macular diabético é indicação de encaminhamento imediato. Esperar a queda da acuidade visual significa tratar quando parte do dano fotorreceptor já é irreversível.</p></blockquote>
<hr>
<h2>As complicações da forma proliferativa</h2>
<p>Os neovasos são frágeis, sangram com facilidade e vêm acompanhados de tecido fibroso que adere ao vítreo. As quatro complicações clássicas derivam dessa combinação:</p>
<h4>Hemorragia vítrea</h4>
<p>A tração do vítreo sobre o tufo neovascular rompe os vasos e o sangue invade a cavidade vítrea. O quadro típico é <strong>perda visual súbita e indolor</strong>, precedida ou acompanhada de moscas volantes densas e sombras móveis. Hemorragia que não se reabsorve é indicação de vitrectomia.</p>
<h4>Descolamento de retina tracional</h4>
<p>As membranas epirretinianas e as bandas fibrovasculares se contraem com o tempo e puxam a retina em direção à cavidade vítrea. Quando a tração atinge ou ameaça a mácula, há indicação cirúrgica. A contração também pode abrir uma rotura e produzir um componente regmatogênico associado.</p>
<h4>Glaucoma neovascular</h4>
<p>A isquemia retiniana grave libera VEGF que difunde para o segmento anterior e induz neovasos sobre a superfície da íris — a <strong>rubeose iridiana</strong>. Quando a membrana fibrovascular alcança o ângulo de filtração, bloqueia o escoamento do humor aquoso: a pressão intraocular dispara e o prognóstico visual passa a ser reservado.</p>

se iridiana)</figcaption></figure>
<blockquote><p>Rubeose de íris em um diabético é sinal de isquemia retiniana grave e <strong>emergência oftalmológica</strong>, mesmo que a pressão intraocular ainda esteja normal no momento do exame.</p></blockquote>
<hr>
<h2>Fatores de risco e prevenção</h2>
<h3>Não modificáveis</h3>
<ul><li><strong>Duração do diabetes</strong> — o mais importante de todos. Quanto maior o tempo de exposição à hiperglicemia, maior a prevalência e a gravidade.</li><li>Tipo de diabetes.</li><li>Idade jovem ao diagnóstico.</li><li><strong>Puberdade</strong>, que acelera a progressão.</li><li>Fatores genéticos.</li></ul>
<h3>Modificáveis</h3>
<ul><li><strong>Hiperglicemia crônica (HbA1c elevada)</strong> — o fator modificável de maior peso.</li><li>Hipertensão arterial sistêmica.</li><li>Dislipidemia.</li><li>Nefropatia diabética — a presença de albuminúria indica que a microangiopatia já está estabelecida em outro órgão-alvo.</li><li>Gravidez, que pode acelerar a progressão.</li><li>Obesidade, sedentarismo e tabagismo.</li></ul>
<blockquote><p>A redução <strong>rápida e intensa</strong> da glicemia pode causar <strong>piora inicial</strong> da retinopatia, fenômeno descrito com os agonistas de GLP-1 (semaglutida, liraglutida, dulaglutida). O benefício a longo prazo do bom controle se mantém, mas quem já tem retinopatia estabelecida deve ser avaliado antes e monitorado durante a intensificação do tratamento.</p></blockquote>
<p>As estratégias primárias de prevenção são quatro e nenhuma é oftalmológica: controle glicêmico rigoroso, controle pressórico, controle lipídico e estilo de vida saudável. O oftalmologista trata a complicação; quem evita que ela apareça é o controle metabólico.</p>
<hr>
<h2>Rastreamento e encaminhamento</h2>
<p>O calendário de rastreio parte de uma assimetria simples entre os dois tipos de diabetes: no tipo 1 a data do diagnóstico coincide com o início da doença, no tipo 2 não.</p>
<div class="tbl"><table><thead><tr><th>Situação</th><th>Primeiro exame</th><th>Periodicidade</th></tr></thead><tbody><tr><td><strong>Diabetes tipo 1</strong></td><td>5 anos após o diagnóstico, a partir da puberdade</td><td>Anual</td></tr><tr><td><strong>Diabetes tipo 2</strong></td><td>No momento do diagnóstico</td><td>Anual, ou mais frequente conforme a gravidade</td></tr><tr><td><strong>Gestante com diabetes prévio</strong></td><td>No planejamento da gestação ou no 1º trimestre</td><td>A cada trimestre, estendendo-se ao 1º ano pós-parto</td></tr><tr><td><strong>Retinopatia já diagnosticada</strong></td><td>—</td><td>Intervalo definido pelo estágio, de 6 meses a poucas semanas</td></tr></tbody></table></div>
<p>O diabetes gestacional isolado, sem diabetes prévio, não exige esse rastreamento ocular trimestral.</p>
<p>Três situações obrigam a <strong>encaminhamento urgente</strong> ao oftalmologista:</p>
<ol><li><strong>Qualquer nível de edema macular diabético.</strong></li><li><strong>RDNP moderada ou grave.</strong></li><li><strong>Qualquer retinopatia proliferativa.</strong></li></ol>
<blockquote><p>O rastreamento é indispensável mesmo no paciente sem queixa alguma: a retinopatia evolui em silêncio e pode alcançar a forma proliferativa <strong>sem nenhum sintoma</strong>, porque a mácula só é comprometida tardiamente em boa parte dos casos. Quem espera a queixa visual trata tarde.</p></blockquote>
<hr>
<h2>Tratamento e prognóstico</h2>
<h3>As quatro modalidades</h3>
<div class="tbl"><table><thead><tr><th>Modalidade</th><th>Indicação principal</th><th>Racional</th></tr></thead><tbody><tr><td><strong>Anti-VEGF intravítreo</strong></td><td>EMD com acometimento central; adjuvante ou alternativa ao laser na RDP</td><td>Bloqueia o mediador da permeabilidade e da angiogênese</td></tr><tr><td><strong>Fotocoagulação a laser</strong></td><td>Panfotocoagulação na RDP (e na RDNP muito grave selecionada); laser focal em vazamentos extrafoveais</td><td>Destrói retina periférica isquêmica, reduzindo a massa produtora de VEGF</td></tr><tr><td><strong>Corticosteroide intravítreo</strong></td><td>EMD refratário ao anti-VEGF, especialmente em olho pseudofácico</td><td>Ação anti-inflamatória e antipermeabilidade</td></tr><tr><td><strong>Vitrectomia via pars plana</strong></td><td>Hemorragia vítrea persistente; descolamento tracional envolvendo ou ameaçando a mácula; membranas fibrovasculares extensas</td><td>Remove o sangue, secciona as trações e permite completar o laser no mesmo tempo cirúrgico</td></tr></tbody></table></div>
<p>A panfotocoagulação é um tratamento de sacrifício controlado: queima-se retina periférica — com perda de campo visual periférico e de adaptação ao escuro — para salvar a mácula e evitar a cascata de complicações da neovascularização. Para o edema macular com envolvimento do centro, porém, o laser não é a primeira escolha: o tratamento inicial é o <strong>anti-VEGF</strong>, aplicado em séries e reavaliado por OCT.</p>
<h3>Prognóstico</h3>
<p>Com rastreamento regular e tratamento precoce, <strong>até 98% da perda visual pode ser prevenida</strong>. Sem tratamento, aproximadamente <strong>50% dos pacientes evoluem para perda visual grave</strong>. As terapias atuais não apenas estabilizam: em muitos pacientes a visão melhora em relação ao basal, sobretudo no edema macular tratado com anti-VEGF.</p>
<blockquote><p>O fator que mais separa um desfecho do outro não é a tecnologia disponível, e sim a <strong>adesão ao acompanhamento</strong>. Duração do diabetes e controle glicêmico definem o risco; o comparecimento ao exame periódico define o desfecho.</p></blockquote></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';

      var st = a===null ? 'em branco' : (a===q.correctIndex ? 'correta' : 'incorreta');
      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +

  document.getElementById('hdr').innerHTML = html;

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }

    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }

      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +

      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +
        '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;line-height:1.42;font-weight:400;letter-spacing:-.012em;margin:0 0 22px;text-wrap:pretty">'+esc(q.question)+'</h2>' +
        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
        (reveal ? chatBox(q, ans===q.correctIndex) : '') +
      '</article>' + warn +

function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;

    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);

}

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
