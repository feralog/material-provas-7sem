<script type="text/html" id="resumoSrc"><h2>A consulta do adolescente: vínculo, privacidade e sigilo</h2>
<h3>Os três pilares</h3>
<p>Antes de qualquer conduta sobre infecção sexualmente transmissível, contracepção ou gestação, o que muda no atendimento do adolescente é a <strong>forma</strong> de atender. A consulta se apoia em três pilares que não são etapas sucessivas, e sim condições simultâneas: <strong>vínculo</strong>, <strong>privacidade</strong> e <strong>segurança</strong>.</p>
<p><strong>Vínculo</strong> é acolher sem julgamento. O adolescente chega testando se aquele profissional vai reagir com susto, sermão ou desaprovação ao que ele tem para contar. Uma frase que retira o peso pessoal da pergunta abre a conversa: <em>"vou fazer perguntas que faço para todo mundo"</em>. A pergunta universal não acusa ninguém e, por isso mesmo, é a única que costuma ser respondida com franqueza.</p>
<p><strong>Privacidade</strong> é garantir um tempo de consulta a sós. Não é esconder nada da família: é criar o espaço em que vida sexual, uso de álcool e outras drogas, humor e violência podem ser ditos. Sem esse tempo, a consulta se reduz à queixa de entrada — corrimento, atraso menstrual, dor — e todo o resto fica invisível.</p>
<p><strong>Segurança</strong> é rastrear ativamente risco e violência, mesmo quando nada foi mencionado. É o pilar que transforma a consulta em porta de entrada para a rede de proteção.</p>
<blockquote><p>Sem os três pilares, o atendimento até prescreve certo, mas erra o essencial: não fica sabendo o que realmente adoece aquele adolescente. Humor, substâncias e violência raramente aparecem como queixa espontânea.</p></blockquote>
<h3>Confidencialidade: o que fica entre nós e o que não pode ficar</h3>
<p>A confidencialidade é oferecida de forma <strong>explícita e com os limites nomeados logo no início da consulta</strong>, nunca depois que a revelação já aconteceu. A formulação padrão é direta: <em>"o que você me contar fica entre nós, exceto se eu achar que você está em risco de se machucar ou de alguém te machucar; se isso acontecer, eu te explico cada passo"</em>.</p>
<p>Prometer segredo absoluto é o erro mais caro dessa consulta. Se depois surgir risco de vida ou violência, será preciso acionar proteção — e a promessa rompida destrói justamente o vínculo que permitiu a revelação.</p>
<h4>Quando o sigilo se mantém e quando se rompe</h4>
<div class="tbl"><table><thead><tr><th>Situação</th><th>Manter ou quebrar</th><th>A quem comunicar</th></tr></thead><tbody><tr><td>Vida sexual ativa, pedido de contracepção</td><td>Manter</td><td>Ninguém; estimular diálogo familiar sem impor</td></tr><tr><td>IST diagnosticada e tratada</td><td>Manter</td><td>Parcerias sexuais, com apoio do serviço; vigilância nos agravos de notificação</td></tr><tr><td>Uso de álcool ou drogas sem risco imediato</td><td>Manter</td><td>Ninguém; seguir com plano de redução de danos</td></tr><tr><td>Suspeita ou confirmação de violência ou abuso</td><td>Quebrar</td><td>Conselho Tutelar e notificação compulsória à vigilância</td></tr><tr><td>Ideação suicida ou autoagressão</td><td>Quebrar</td><td>Responsável legal e serviço de saúde mental, com o adolescente informado</td></tr><tr><td>Risco grave imediato à vida</td><td>Quebrar</td><td>Responsável legal e rede de urgência, sem atrasar a conduta clínica</td></tr><tr><td>Necessidade de internação hospitalar</td><td>Sigilo mantido, autorização necessária</td><td>Responsável legal, apenas para autorizar a internação</td></tr></tbody></table></div>
<blockquote><p>Quebra de sigilo é medida de proteção, não punição. Ela se aplica a risco de vida e a violência — nunca ao fato de o adolescente ter vida sexual, pedir método contraceptivo ou ter tido uma IST. Comunicar a família por esses motivos é violar o sigilo, não protegê-lo. E, quando a quebra for necessária, o adolescente é avisado antes e acompanhado em cada passo.</p></blockquote>
<h4>O que o adolescente decide sozinho</h4>
<p>O adolescente com discernimento sobre a própria saúde e compreensão do autocuidado tem direito a:</p>
<ul><li>realizar <strong>consulta desacompanhado</strong>, se essa for a escolha dele;</li><li>realizar <strong>procedimentos não invasivos</strong> desacompanhado, incluindo coleta de exames laboratoriais;</li><li>receber <strong>informação sobre qualquer aspecto da sexualidade e da saúde reprodutiva</strong>;</li><li><strong>escolher método contraceptivo</strong> adequado, orientado por profissional de saúde, inclusive pelo pediatra;</li><li>realizar <strong>testes rápidos de gravidez, HIV e sífilis</strong>, com acolhimento e aconselhamento antes e depois do resultado.</li></ul>
<p>O limite está na <strong>internação hospitalar</strong>, que exige autorização do pai, da mãe ou do responsável legal. Essa exigência, porém, <strong>não impede nenhuma conduta de emergência</strong>: nenhum trâmite burocrático pode atrasar o atendimento de quem corre risco de vida.</p>
<p>Na prática, isso resolve a cena mais comum do ambulatório. A adolescente que chega sozinha pedindo contracepção e pedindo que os pais não saibam deve ser avaliada e receber o método — mantendo o sigilo e estimulando o diálogo familiar como algo desejável, jamais como condição para atender.</p>
<hr>
<h2>A anamnese estruturada: HEADSSS e os 5 Ps</h2>
<p>Dois roteiros curtos evitam que a consulta trave ou se reduza à queixa.</p>
<h4>HEADSSS — visão integral</h4>
<div class="tbl"><table><thead><tr><th>Letra</th><th>Domínio</th><th>O que explorar</th></tr></thead><tbody><tr><td>H</td><td>Home</td><td>Com quem mora, apoio, conflitos, segurança em casa</td></tr><tr><td>E</td><td>Education / Employment</td><td>Escola, rendimento, evasão, trabalho</td></tr><tr><td>A</td><td>Activities</td><td>Rotina, lazer, pares, tempo de tela</td></tr><tr><td>D</td><td>Drugs</td><td>Álcool, tabaco, maconha, outras substâncias</td></tr><tr><td>S</td><td>Sexuality</td><td>Orientação, práticas, proteção, parcerias</td></tr><tr><td>S</td><td>Suicide / Depression</td><td>Humor, desesperança, ideação, autoagressão</td></tr><tr><td>S</td><td>Safety</td><td>Violência, internet, armas, segurança no relacionamento</td></tr></tbody></table></div>
<p>A função do HEADSSS é impedir que a consulta vire só corrimento ou gravidez e deixe de fora humor, drogas e segurança — que costumam pesar mais no prognóstico do que a queixa de entrada.</p>
<h4>Os 5 Ps — história sexual</h4>
<ul><li><strong>Partners</strong> — com quem você se relaciona? Com homens, mulheres ou ambos?</li><li><strong>Practices</strong> — que tipo de contato sexual? Vaginal, anal, oral?</li><li><strong>Protection</strong> — usa preservativo em quais situações? Usa algum método contraceptivo?</li><li><strong>Past</strong> — já teve alguma IST? Já fez testes? Quando?</li><li><strong>Pregnancy plans</strong> — tem preocupação com gravidez? Deseja engravidar agora?</li></ul>
<p>Os 5 Ps reduzem o improviso: em vez de decidir na hora o que perguntar, o profissional segue um roteiro que cobre risco, proteção e intenção reprodutiva em poucos minutos. Um microscript funciona bem como abertura: <em>"você tem vida sexual? Se sim, com homens, mulheres ou ambos? Usa camisinha em quais situações?"</em>.</p>
<hr>
<h2>IST na adolescência: prevenção combinada e fluxo de atendimento</h2>
<h3>Carga global e o argumento da testagem</h3>
<p>As estimativas da Organização Mundial da Saúde para 2020 somam cerca de <strong>374 milhões de novas infecções por ano</strong> apenas por quatro IST curáveis:</p>
<div class="tbl"><table><thead><tr><th>IST curável</th><th>Novas infecções em 2020</th></tr></thead><tbody><tr><td>Tricomoníase</td><td>156 milhões</td></tr><tr><td>Clamídia</td><td>129 milhões</td></tr><tr><td>Gonorreia</td><td>82 milhões</td></tr><tr><td>Sífilis</td><td>7,1 milhões</td></tr></tbody></table></div>
<p>O número importa menos que a sua natureza: <strong>boa parte dessas infecções é silenciosa</strong>, sobretudo clamídia e gonorreia em adolescentes. Testar apenas quem se queixa deixa passar a maioria dos casos, mantém a cadeia de transmissão e permite que a infecção suba para o trato genital superior antes de qualquer sintoma. É esse dado que sustenta testagem de rotina conforme risco, e não conforme queixa.</p>
<h3>Prevenção combinada</h3>
<p>Prevenção combinada é somar medidas pequenas, e não escolher a melhor delas:</p>
<ul><li><strong>preservativo</strong>, com técnica de uso efetivamente ensinada e não apenas mencionada;</li><li><strong>testagem</strong> para HIV, sífilis e outras IST conforme risco, explicando janela imunológica e retorno;</li><li><strong>vacinação</strong> contra HPV e hepatite B, com checagem do cartão a cada oportunidade;</li><li><strong>PrEP ou PEP</strong>, quando indicadas;</li><li><strong>tratamento</strong> adequado, com retorno combinado;</li><li><strong>abordagem das parcerias</strong>, incluindo notificação e tratamento — sem isso, a reinfecção é questão de tempo.</li></ul>
<p>Fazer três desses itens por consulta já muda o desfecho. O item mais esquecido na prática costuma ser justamente o parceiro.</p>
<h3>O fluxo do ambulatório em cinco passos</h3>
<ol><li><strong>Acolher com privacidade</strong> — explicar confidencialidade e seus limites.</li><li><strong>História sexual curta</strong> — os 5 Ps: risco, proteção, parcerias, gravidez.</li><li><strong>Exame e testes essenciais</strong> — incluindo <strong>teste de gravidez sempre que aplicável</strong>.</li><li><strong>Tratar e orientar</strong> — evitar o erro clássico de só pedir exames e mandar embora.</li><li><strong>Prevenção combinada e retorno</strong> — preservativo, vacina, parceria, reavaliação.</li></ol>
<h4>Erros comuns na queixa de IST</h4>
<ul><li>Pedir exames sem orientar prevenção nem combinar retorno.</li><li>Não testar gravidez por constrangimento em perguntar.</li><li>Não abordar as parcerias, mantendo o ciclo de reinfecção.</li><li>Ignorar sinais de coerção ou violência no relato.</li></ul>
<h4>No pronto atendimento o raciocínio é outro</h4>
<p>No ambulatório se pensa em prevenção e seguimento; no pronto atendimento, em <strong>risco imediato e janela de intervenção</strong>. São três decisões rápidas:</p>
<ol><li>Há instabilidade ou sinal de alarme? (dor pélvica intensa, febre, sangramento, síncope)</li><li>Há janela aberta para profilaxia de HIV, de outras IST ou de gravidez?</li><li>É preciso acionar o fluxo de proteção?</li></ol>
<p>Quanto mais cedo, melhor para qualquer profilaxia. Documentar com objetividade e agendar seguimento fecham o atendimento.</p>
<hr>
<h2>Doença inflamatória pélvica</h2>
<p>A doença inflamatória pélvica é a <strong>infecção do trato genital superior</strong> — útero, trompas e, por vezes, ovários e peritônio — causada em geral por agentes de transmissão sexual que ascendem do colo uterino. <em>Chlamydia trachomatis</em> e <em>Neisseria gonorrhoeae</em> são os principais, mas o quadro costuma ser <strong>polimicrobiano</strong>, o que justifica cobertura antibiótica ampla.</p>
<h4>Quando suspeitar</h4>
<ul><li>Dor pélvica ou abdominal baixa</li><li>Corrimento vaginal anormal</li><li>Dispareunia</li><li>Sangramento irregular</li><li>Febre — <strong>nem sempre presente</strong></li><li><strong>Dor à mobilização do colo uterino</strong> ao exame ginecológico, o sinal mais característico</li></ul>
<blockquote><p>Exigir febre para considerar o diagnóstico faz perder casos. A combinação de dor pélvica, corrimento e dor à mobilização do colo já basta para tratar.</p></blockquote>
<h4>Conduta</h4>
<p>Com clínica compatível, <strong>o tratamento começa empiricamente, sem aguardar exames</strong>, seguindo o protocolo local. Em paralelo: testar HIV, sífilis, clamídia e gonococo conforme risco, orientar e tratar as parcerias, reforçar prevenção e avaliar necessidade de internação.</p>
<p>São <strong>sinais de gravidade que indicam internação</strong>: dor intensa, febre alta, vômitos que impedem a via oral, gestação concomitante e abscesso tubo-ovariano.</p>
<h4>Por que a pressa importa</h4>
<p>As complicações tardias são definitivas e recaem sobre alguém com décadas de vida reprodutiva pela frente: <strong>infertilidade por lesão tubária</strong>, <strong>gravidez ectópica</strong> e <strong>dor pélvica crônica</strong>. O atraso terapêutico nessa doença não custa dias de sintoma, custa desfecho reprodutivo.</p>
<hr>
<h2>Profilaxias para o HIV: PrEP e PEP</h2>
<p>A distinção é simples e cai em prova justamente por ser confundida: <strong>PrEP protege quem tem risco continuado; PEP socorre quem teve uma exposição pontual</strong>.</p>
<div class="tbl"><table><thead><tr><th></th><th>PrEP — pré-exposição</th><th>PEP — pós-exposição</th></tr></thead><tbody><tr><td>Quem</td><td>Risco sexual continuado</td><td>Exposição de risco já ocorrida</td></tr><tr><td>Indicações</td><td>Relações sem preservativo frequentes, parceria com HIV sem supressão viral documentada, múltiplas parcerias, IST recente, uso de drogas injetáveis com compartilhamento</td><td>Violência sexual, relação sem preservativo com parceria HIV positiva sem supressão ou de status desconhecido, acidente ocupacional com material biológico</td></tr><tr><td>Quando iniciar</td><td>Antes da exposição, em uso regular</td><td>O quanto antes, idealmente <strong>até 72 horas</strong></td></tr><tr><td>Duração</td><td>Enquanto durar o risco</td><td><strong>28 dias</strong> de esquema completo</td></tr><tr><td>Antes de iniciar</td><td><strong>Testar HIV</strong>, avaliar função renal, rastrear outras IST</td><td><strong>Testar HIV</strong> e avaliar a exposição</td></tr><tr><td>Seguimento</td><td>Testagem periódica de HIV e IST</td><td>Testagem seriada após o esquema</td></tr></tbody></table></div>
<p>Testar HIV antes de iniciar a PrEP é obrigatório: começar a profilaxia em alguém já infectado equivale a expor o vírus a um esquema incompleto e selecionar resistência. A avaliação de função renal se justifica pelo perfil do tenofovir, e o rastreio de outras IST tem duplo papel — sinaliza risco e identifica infecção que precisa de tratamento próprio.</p>
<blockquote><p>A PrEP protege <strong>apenas contra o HIV</strong>. Ela não previne sífilis, gonorreia, clamídia ou HPV. Preservativo e testagem periódica continuam parte obrigatória do pacote de cuidado de quem está em profilaxia.</p></blockquote>
<p>Na PEP, a eficácia é <strong>tempo-dependente</strong>: cai a cada hora de atraso e o limite prático é de 72 horas. Relação com preservativo íntegro ou com parceria de carga viral indetectável não configura indicação.</p>
<h4>Vacinação</h4>
<p>O calendário nacional oferece a vacina <strong>HPV quadrivalente em dose única para meninas e meninos de 9 a 14 anos</strong>, com melhor resposta imune quando aplicada antes do início da vida sexual. Imunossuprimidos, pessoas vivendo com HIV e vítimas de violência sexual seguem esquema de três doses. A hepatite B compõe o mesmo bloco de checagem do cartão vacinal.</p>
<hr>
<h2>Contracepção na adolescência</h2>
<p>A lógica da escolha na adolescência difere da do adulto em um ponto: a <strong>falha de uso típico</strong> pesa mais do que a falha do método. Métodos que dependem de lembrar todo dia, ou de agir corretamente a cada relação, falham muito mais nessa faixa etária — daí a preferência pelos métodos de longa duração, os LARC.</p>
<div class="tbl"><table><thead><tr><th>Método</th><th>Mecanismo</th><th>Vantagem na adolescência</th><th>Ressalva</th></tr></thead><tbody><tr><td>Implante subdérmico de etonogestrel</td><td>Inibe a ovulação e espessa o muco</td><td>Alta eficácia independente da adesão diária; dura anos</td><td>Sangramento irregular é comum e motiva abandono se não for avisado antes</td></tr><tr><td>DIU de cobre</td><td>Ação espermicida e inflamatória local, sem hormônio</td><td>Longa duração, sem hormônio, serve também como contracepção de emergência</td><td>Pode aumentar fluxo e cólica menstrual</td></tr><tr><td>SIU de levonorgestrel</td><td>Espessa o muco e atrofia o endométrio</td><td>Alta eficácia e redução do fluxo menstrual</td><td>Amenorreia frequente, que assusta quem não foi orientada</td></tr><tr><td>Pílula combinada</td><td>Inibe a ovulação</td><td>Controle de ciclo, acne e dismenorreia</td><td>Depende de tomada diária; contraindicada em enxaqueca com aura e em outros riscos vasculares</td></tr><tr><td>Injetável trimestral de medroxiprogesterona</td><td>Inibe a ovulação</td><td>Não exige lembrar todo dia; discreto</td><td><strong>Reduz a densidade mineral óssea durante o uso</strong>, justamente no período de aquisição do pico de massa óssea</td></tr><tr><td>Preservativo</td><td>Barreira física</td><td>Único método que também previne IST</td><td>Falha de uso típico alta se usado isoladamente para evitar gravidez</td></tr></tbody></table></div>
<p>Nuliparidade e idade <strong>não contraindicam</strong> o dispositivo intrauterino — essa é a crença antiga que mais afasta adolescentes do método mais eficaz disponível para elas. Quanto ao injetável trimestral, a perda óssea é em boa parte reversível após a suspensão, mas o método fica como alternativa quando existem outros de eficácia semelhante.</p>
<blockquote><p><strong>Dupla proteção</strong>: associar o preservativo a um método contraceptivo eficaz. Nenhum método hormonal ou intrauterino protege contra infecções, e o preservativo isolado tem falha alta para prevenir gravidez. Somar os dois é a única forma de cobrir os dois desfechos, e é a orientação padrão para quem está iniciando a vida sexual.</p></blockquote>
<h3>Contracepção de emergência</h3>
<p>O <strong>levonorgestrel</strong> é usado em <strong>dose única de 1,5 mg</strong>, o quanto antes, com alguma eficácia mantida <strong>até 5 dias (120 horas)</strong> da relação. O efeito é tempo-dependente e cai a cada dia de atraso. O mecanismo principal é <strong>retardar ou inibir a ovulação</strong>.</p>
<p>A consequência desse mecanismo precisa ser dita com clareza: a contracepção de emergência <strong>não interrompe uma gestação já estabelecida</strong> nem lhe causa dano. Deixar isso explícito evita que o medo de estar cometendo um aborto atrase o uso, justamente quando cada hora conta.</p>
<p>A opção <strong>mais eficaz</strong> de contracepção de emergência é a <strong>inserção do DIU de cobre em até 5 dias</strong>, com taxa de falha bem inferior à do levonorgestrel e com a vantagem de já deixar a adolescente com um método de longa duração instalado.</p>
<hr>
<h2>Violência sexual: acolher, proteger e não revitimizar</h2>
<p>O objetivo do atendimento em saúde é <strong>segurança e cuidado — não investigação</strong>. A apuração dos fatos cabe a outros órgãos, e confundir os papéis é o que produz revitimização.</p>
<h3>Sinais de alerta</h3>
<ul><li>Queixas vagas e recorrentes sem causa definida: dor abdominal, cefaleia, sintomas gastrointestinais</li><li>Lesões inexplicadas</li><li>IST de repetição ou gestação</li><li>Mudança abrupta de humor e queda no rendimento escolar</li><li>Parceria muito mais velha ou com sinais de coerção</li></ul>
<h3>O primeiro minuto da revelação</h3>
<p>Três frases dão conta do essencial, e a terceira é a que mais se erra:</p>
<ul><li><em>"Obrigado por me contar."</em></li><li><em>"Eu acredito em você, e você não tem culpa."</em></li><li><em>"Eu não posso prometer segredo absoluto: se houver risco, eu vou acionar ajuda e te explico cada passo."</em></li></ul>
<p>Em seguida, duas perguntas de triagem definem a conduta: <strong>"isso aconteceu hoje, ontem ou há mais tempo?"</strong> — porque a janela decide as profilaxias — e <strong>"você está seguro para voltar para casa hoje?"</strong> — porque a segurança imediata decide o destino.</p>
<h4>Perguntas seguras</h4>
<ul><li>"Alguém já te tocou de um jeito que te deixou desconfortável?"</li><li>"Você se sente seguro no seu relacionamento e em casa?"</li><li>"Você já foi forçado a fazer algo sexual?"</li><li>"Eu pergunto isso para todo mundo: alguém te pressionou ou te obrigou a ter relação?"</li></ul>
<h4>O que evitar</h4>
<ul><li>Entrevistas detalhadas e repetidas, do tipo <em>"conte tudo de novo"</em> — revitimizam e contaminam o relato.</li><li>Perguntas que culpabilizam, como <em>"por que você não reagiu?"</em>.</li><li>Duvidar do relato.</li><li>Prometer sigilo absoluto — promessa impossível de cumprir nesse cenário.</li><li>Chamar o suposto agressor ou a família para a sala antes de avaliar segurança.</li></ul>
<h3>O tempo decide a conduta</h3>
<div class="tbl"><table><thead><tr><th>Intervalo desde a exposição</th><th>Prioridades</th></tr></thead><tbody><tr><td>0 a 72 horas</td><td>Acolhimento e segurança; coleta de evidências quando aplicável; <strong>profilaxia pós-exposição ao HIV</strong>; profilaxias das demais IST conforme protocolo; <strong>contracepção de emergência</strong> quando indicada</td></tr><tr><td>72 horas a 7 dias</td><td>Testagem inicial e programação do seguimento; tratamento sintomático; apoio psicossocial; contracepção de emergência ainda possível até o quinto dia</td></tr><tr><td>Mais de 7 dias</td><td>Rastreamento de IST e de gestação; cuidado em saúde mental; articulação da rede; plano de segurança</td></tr></tbody></table></div>
<p>Reconhecer a janela perdida também é conduta: passados sete dias, prescrever profilaxia pós-exposição não traz benefício, e o eixo do cuidado passa a ser rastrear, tratar e proteger.</p>
<blockquote><p>O atendimento em saúde <strong>nunca</strong> pode ser condicionado a boletim de ocorrência, a exame de corpo de delito ou à autorização da família. Assistência primeiro; os trâmites correm em paralelo.</p></blockquote>
<h3>Dever legal</h3>
<p>Suspeita ou confirmação de violência contra criança ou adolescente é de <strong>comunicação obrigatória ao Conselho Tutelar</strong> e de <strong>notificação compulsória e imediata à vigilância epidemiológica</strong>, independentemente de registro policial e de autorização da família. Não é escolha do profissional nem depende do consentimento da adolescente — é dever legal, e a adolescente deve ser informada de que isso será feito e de por quê.</p>
<hr>
<h2>Gestação na adolescência</h2>
<p>As estimativas para 2019 apontam cerca de <strong>21 milhões de gestações e 12 milhões de nascimentos por ano</strong> entre adolescentes de 15 a 19 anos em países de baixa e média renda. O número não descreve um problema de culpa individual: descreve desigualdade de acesso, de educação e de proteção.</p>
<h3>A primeira consulta, em quatro eixos</h3>
<p><strong>1. Confirmar e datar</strong> — teste de gravidez, idade gestacional sempre que possível, sintomas e sinais de risco, história obstétrica e comorbidades.</p>
<p><strong>2. Avaliar vulnerabilidades</strong> — apoio familiar e escolar, <strong>violência e coerção</strong>, uso de substâncias, saúde mental.</p>
<p><strong>3. Cuidado clínico essencial</strong> — rastreamento de IST conforme risco, revisão vacinal, avaliação de anemia e nutrição, plano de pré-natal com retornos definidos.</p>
<p><strong>4. Planejar o depois</strong> — <strong>contracepção pós-parto eficaz decidida ainda no pré-natal</strong>, prevenção de recorrência e manutenção do vínculo com a atenção primária.</p>
<p>O quarto eixo costuma ser tratado como detalhe e não é. Uma segunda gestação em curto intervalo agrava evasão escolar, vulnerabilidade social e risco obstétrico; combinar o método antes da alta é prevenção secundária e evita perder a adolescente no seguimento.</p>
<h3>No pronto atendimento: triagem, não pré-natal</h3>
<p>Queixas frequentes: sangramento vaginal, dor abdominal ou pélvica, vômitos intensos, cefaleia, edema, visão turva, desmaio.</p>
<p>As três primeiras ações são sinais vitais e avaliação de estabilidade, confirmação da gestação em caso de dúvida e priorização da avaliação obstétrica diante de sinal de alarme.</p>
<div class="tbl"><table><thead><tr><th>Sinal de alarme</th><th>Hipótese a afastar</th></tr></thead><tbody><tr><td>Dor intensa e unilateral</td><td><strong>Gravidez ectópica</strong>, pelo risco de rotura e choque em curto prazo</td></tr><tr><td>Instabilidade hemodinâmica, síncope, sangramento importante</td><td>Rotura de ectópica, abortamento, outras causas de hemorragia</td></tr><tr><td>Cefaleia persistente, edema, visão turva, pressão arterial elevada</td><td><strong>Doença hipertensiva da gestação</strong></td></tr><tr><td>Vômitos incoercíveis</td><td>Hiperêmese com desidratação e distúrbio hidroeletrolítico</td></tr><tr><td>Relato ou indício de coerção</td><td>Violência sexual, com acionamento do fluxo de proteção</td></tr></tbody></table></div>
<h3>Coerção e diferença de idade</h3>
<p>Parceria bem mais velha é sinal de alerta e merece rastreio ativo. A abordagem correta é a <strong>pergunta universal, feita a sós e sem acusar ninguém</strong>: <em>"eu pergunto isso para todo mundo — alguém te pressionou ou te obrigou a ter relação?"</em>. Perguntar a todos com a mesma frase retira o peso pessoal e abre espaço para a resposta; interrogar diante do parceiro ou anunciar à família que houve crime antes de conversar com a adolescente fecha a porta e a coloca em risco.</p>
<hr>
<h2>Síntese para a prova</h2>
<ul><li>Os três pilares são <strong>vínculo, privacidade e segurança</strong> — e a privacidade não é esconder da família, é criar espaço para falar.</li><li>O sigilo é oferecido <strong>com os limites nomeados no início</strong>: risco grave imediato, suspeita de violência e ideação suicida ou autoagressão.</li><li>Consulta e procedimentos não invasivos podem ser feitos com o adolescente <strong>desacompanhado</strong>; a <strong>internação</strong> exige autorização do responsável, o que <strong>não impede conduta de emergência</strong>.</li><li><strong>HEADSSS</strong> para a visão integral; <strong>5 Ps</strong> para a história sexual.</li><li>Prevenção combinada: preservativo, testagem, vacina, PrEP ou PEP, tratamento e parcerias.</li><li><strong>DIP</strong>: tratar empiricamente com clínica compatível; dor à mobilização do colo é o sinal-chave; sequelas são infertilidade tubária, ectópica e dor pélvica crônica.</li><li><strong>PEP</strong> até 72 horas, por 28 dias; <strong>PrEP</strong> para risco continuado, com teste de HIV obrigatório antes.</li><li><strong>Levonorgestrel 1,5 mg</strong> em dose única, até 5 dias, quanto antes melhor; <strong>DIU de cobre</strong> é a contracepção de emergência mais eficaz.</li><li>Violência sexual: acolher em três frases, não prometer segredo absoluto, respeitar a janela de tempo e <strong>comunicar Conselho Tutelar e vigilância</strong>.</li><li>Gestação: confirmar e datar, rastrear vulnerabilidades, cuidar clinicamente e <strong>definir contracepção pós-parto ainda no pré-natal</strong>.</li></ul>
<p>A mensagem final é que <strong>técnica, vínculo e segurança andam juntos</strong>: os esquemas terapêuticos mudam conforme a diretriz local e o ano, mas o processo bem feito permanece.</p></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

      var a = S.answers[n], cur = n===S.i && !S.finished, bg = '#d3cec4';
      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';
      if (cur && a===null) bg = '#121a2b';
      var st = a===null ? 'em branco' : (a===q.correctIndex ? 'correta' : 'incorreta');
      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +
             '<span style="display:block;width:100%;border-radius:99px;transition:height .18s ease,background .18s ease,box-shadow .18s ease;height:'+(cur?'17px':'9px')+';background:'+bg+';box-shadow:'+(cur?'0 0 0 3px rgba(18,26,43,.13)':'none')+'"></span></button>';

  }
  document.getElementById('hdr').innerHTML = html;
}
function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +
      '</button>';
  }).join('');

  var expl = reveal ? '<div style="margin-top:20px;padding:16px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;animation:qFade .26s ease">' +

      '<p style="margin:0;font-size:14.5px;line-height:1.68;color:#39404f;text-wrap:pretty">'+esc(q.explanation)+'</p></div>' : '';

  var blank = counts().blank;
  var warn = S.warn ? '<div style="margin-top:14px;padding:15px 17px;background:#fdf7e9;border:1px solid #e8d5a3;border-radius:14px;animation:qFade .22s ease">' +
      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +
        '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;line-height:1.42;font-weight:400;letter-spacing:-.012em;margin:0 0 22px;text-wrap:pretty">'+esc(q.question)+'</h2>' +
        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
        (reveal ? chatBox(q, ans===q.correctIndex) : '') +
      '</article>' + warn +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px">' +
        '<button type="button" data-act="prev" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:12px 18px;font-size:14px;cursor:pointer;transition:border-color .15s ease,color .15s ease;color:'+(S.i===0?'#c4bfb4':'#121a2b')+';pointer-events:'+(S.i===0?'none':'auto')+'">← Anterior</button>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          (early ? '<button type="button" data-act="finish" class="h-ink" style="background:none;border:0;padding:12px 6px;'+mono+';font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a8578;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Finalizar</button>' : '') +
          '<button type="button" data-act="next" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">'+(last?'Finalizar':'Próxima →')+'</button>' +
        '</div></div></section>';
}

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';
  if (pct>=90)      { title='Domínio sólido';   msg='Desempenho excelente. Confira as explicações das que escaparam e siga em frente.'; }

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
