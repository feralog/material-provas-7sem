<script type="text/html" id="resumoSrc"><h2>O roteiro da consulta oftalmológica</h2>
<p>A consulta oftalmológica segue uma ordem fixa, e essa ordem é a própria matéria de prova. Primeiro a <strong>anamnese</strong> — queixa e duração (QD), história pregressa da moléstia atual (HPMA) e antecedentes oculares, pessoais e familiares. Depois o <strong>exame oftalmológico básico</strong>, sempre na mesma sequência: exame externo, acuidade visual, biomicroscopia, refração, tonometria, exame da motilidade ocular e fundoscopia. Por último, quando o básico levanta uma hipótese que precisa ser quantificada, entram os <strong>exames especializados</strong> — topografia, paquimetria, microscopia especular, gonioscopia, biometria, angiofluoresceinografia, tomografia de coerência óptica, ecografia e campimetria.</p>
<blockquote><p>Decore a sequência do básico: <strong>externo → acuidade → biomicroscopia → refração → tonometria → motilidade → fundoscopia</strong>. A acuidade visual vem antes de qualquer manipulação, porque colírio anestésico, fluoresceína e midriático alteram a medida.</p></blockquote>
<p>O ponto de partida é sempre funcional. A pergunta que organiza tudo é: o paciente enxerga? Quanto? Desde quando? A acuidade visual é o sinal vital do olho, e é ela que separa uma urgência de um caso ambulatorial.</p>
<hr>
<h2>Queixa, duração e história pregressa</h2>
<p>A queixa oftalmológica cai em dois grandes eixos, e cada eixo se subdivide pelo tempo de instalação. É essa combinação — <strong>o quê</strong> e <strong>em quanto tempo</strong> — que estreita o diagnóstico diferencial antes mesmo de encostar no paciente.</p>
<div class="tbl"><table><thead><tr><th>Eixo</th><th>Instalação</th><th>Causas típicas</th></tr></thead><tbody><tr><td>Baixa de visão</td><td>Aguda (horas a dias)</td><td>Descolamento de retina, oclusão venosa retiniana</td></tr><tr><td>Baixa de visão</td><td>Progressiva (meses a anos)</td><td>Ametropias não corrigidas, catarata</td></tr><tr><td>Sintomas oculares</td><td>Agudos</td><td>Conjuntivite, úlcera de córnea, corpo estranho</td></tr><tr><td>Sintomas oculares</td><td>Crônicos</td><td>Olho seco, alergia ocular</td></tr></tbody></table></div>
<p><strong>Baixa visão aguda é urgência até prova em contrário.</strong> Perda súbita e indolor aponta para retina e vasos — descolamento, oclusão arterial ou venosa. Perda arrastada, sem dor e sem olho vermelho, aponta para meios ópticos: catarata e erro refracional.</p>
<p>Do lado dos sintomas, a distinção é igualmente prática. Dor, secreção e hiperemia de instalação em poucos dias sugerem processo agudo de superfície; ardor, sensação de areia e flutuação ao longo de meses sugerem olho seco ou alergia.</p>
<hr>
<h2>Antecedentes: três blocos que não se misturam</h2>
<p>Os antecedentes se colhem em três blocos separados, e cada um responde a uma pergunta diferente.</p>
<h4>Antecedentes oculares</h4>
<p>Uso de <strong>óculos ou lentes de contato</strong>, <strong>cirurgias oculares</strong> prévias, <strong>doenças oculares</strong> já diagnosticadas e <strong>uso de colírios</strong>. O item mais negligenciado é o colírio: uso crônico de corticoide tópico explica hipertensão ocular e catarata subcapsular posterior, e o paciente raramente menciona espontaneamente porque "é só um colírio".</p>
<h4>Antecedentes pessoais</h4>
<p><strong>Diabetes</strong> e <strong>hipertensão arterial</strong>, pela retinopatia; <strong>alergias</strong>; <strong>doenças reumáticas</strong>, pela uveíte e pela esclerite; <strong>alterações hormonais</strong>, com destaque para a tireoide e sua repercussão orbitária; e <strong>doenças neurológicas</strong>, pelas alterações pupilares, de campo visual e de motilidade.</p>
<h4>Antecedentes familiares</h4>
<p><strong>Glaucoma</strong>, <strong>ceratocone</strong>, <strong>altas ametropias</strong>, <strong>estrabismo</strong> e <strong>degenerações maculares</strong>. Todos com componente hereditário reconhecido — a resposta positiva muda a idade de início e a periodicidade do rastreamento.</p>
<blockquote><p>Mãe com glaucoma transforma uma consulta de rotina em rastreamento dirigido: tonometria, avaliação da escavação do disco óptico e, se houver dúvida, campimetria.</p></blockquote>
<hr>
<h2>Exame externo</h2>
<p>É a inspeção simples, sem aparelho, feita à luz ambiente e com lanterna. Avalia pálpebras, cílios, margem palpebral, conjuntiva, esclera, córnea e a posição dos globos oculares. Rende diagnósticos imediatos:</p>
<ul><li><strong>Hordéolo</strong> — nódulo inflamatório agudo da margem palpebral, doloroso.</li><li><strong>Pterígio</strong> — proliferação fibrovascular da conjuntiva, quase sempre nasal, que avança sobre a córnea e pode induzir astigmatismo.</li><li><strong>Entrópio</strong> — inversão da borda palpebral, com os cílios raspando a córnea.</li><li><strong>Conjuntivite</strong> — hiperemia conjuntival difusa, com secreção, frequentemente unilateral no início.</li></ul>

<p>É também no exame externo que se avaliam as <strong>pupilas</strong>: diâmetro, simetria e reflexos. O <strong>reflexo fotomotor direto</strong> é a constrição da pupila do olho iluminado; o <strong>consensual</strong> é a constrição simultânea da pupila do olho oposto, que decorre da decussação parcial das fibras pupilares. A pesquisa do <strong>defeito pupilar aferente relativo (DPAR)</strong> com a lanterna oscilante é obrigatória diante de baixa visual sem causa aparente: se a pupila do olho doente dilata quando a luz passa do olho sadio para ela, há comprometimento da via aferente — neuropatia óptica ou lesão retiniana extensa. Opacidade de meios, como catarata, <strong>não</strong> produz DPAR.</p>
<hr>
<h2>Acuidade visual: como medir e como anotar</h2>
<p>A acuidade visual normal para longe é <strong>20/20</strong>, equivalente a <strong>1,0</strong> na notação decimal, medida a 20 pés (cerca de 6 metros). Na notação de Snellen o numerador é a distância de teste e o denominador é a distância na qual um olho normal leria aquela mesma linha: 20/200 significa que o paciente enxerga a 20 pés o que o olho normal enxergaria a 200.</p>

<p>A medida se faz <strong>monocularmente</strong>, um olho de cada vez, <strong>sem correção (sc)</strong> e <strong>com correção (cc)</strong>. Registrar as duas é o que separa a parcela refracional da parcela orgânica da baixa visual.</p>
<p>Quando o paciente não enxerga nem o maior optótipo da tabela, a escala continua abaixo dela, em degraus decrescentes:</p>
<div class="tbl"><table><thead><tr><th>Notação</th><th>Significado</th><th>Como se testa</th></tr></thead><tbody><tr><td>20/20 a 20/200 (ou 20/400)</td><td>Faixa da tabela, conforme o optótipo</td><td>Leitura da tabela a 6 m</td></tr><tr><td>CD a X m</td><td>Conta dedos à distância anotada</td><td>Mostrar dedos, aproximando até acertar</td></tr><tr><td>MM</td><td>Percepção de movimentos de mão</td><td>Deslocar a mão diante do olho</td></tr><tr><td>PL</td><td>Percepção luminosa</td><td>Projetar luz sobre o olho</td></tr><tr><td>SPL</td><td>Sem percepção luminosa</td><td>Nenhuma resposta à luz — amaurose</td></tr></tbody></table></div>
<blockquote><p>A ordem <strong>CD → MM → PL → SPL</strong> cai em prova. Contar dedos exige mais resolução do que perceber o deslocamento da mão, que exige mais do que perceber apenas a luz. Trocar a ordem é o erro clássico.</p></blockquote>
<h3>Acuidade para perto</h3>
<p>Mede-se com a <strong>tabela de Jaeger</strong>, a cerca de 33 a 40 centímetros, graduada de <strong>J1 a J6</strong>. O normal é <strong>J1</strong>, o menor corpo de letra. Perda isolada da visão de perto, com longe preservado e correção obtida apenas com adição esférica positiva, é presbiopia.</p>

<h3>Quando o paciente não lê letras</h3>
<ul><li><strong>E direcional (E de Snellen)</strong> e <strong>optótipos isolados</strong>, como a mão angular, para analfabetos e crianças pequenas.</li><li><strong>Cartões de acuidade de Teller</strong>, por olhar preferencial: apresenta-se um cartão com metade listrada e metade homogênea e observa-se para onde a criança pré-verbal dirige o olhar.</li><li><strong>Potencial visual evocado de varredura</strong>, método eletrofisiológico objetivo, que independe de resposta comportamental.</li></ul>
<h3>Buraco estenopeico</h3>
<p>O buraco estenopeico é um orifício de cerca de 1 mm colocado diante do olho. Ele deixa passar apenas os raios paraxiais, o que <strong>reduz o círculo de difusão</strong> projetado na retina e aumenta a profundidade de foco.</p>
<blockquote><p><strong>Melhorou com o estenopeico → causa refracional.</strong> Não melhorou → causa orgânica: catarata densa, doença macular, neuropatia óptica. É o teste de triagem mais barato e mais rápido da propedêutica ocular.</p></blockquote>
<hr>
<h2>Biomicroscopia, refração e tonometria</h2>
<h3>Biomicroscopia — lâmpada de fenda</h3>
<p>Combina magnificação e iluminação em fenda para examinar o <strong>segmento anterior</strong>: pálpebras, conjuntiva, córnea, câmara anterior, íris, pupila e cristalino. É por ela que se descreve a úlcera de córnea — o padrão dendrítico da herpética contra o infiltrado branco e denso da bacteriana — e se gradua a catarata. Com lentes auxiliares, permite também a <strong>biomicroscopia de fundo</strong>, com grande aumento, boa estereopsia e visão de detalhes.</p>
<h3>Refração</h3>
<p>Divide-se em objetiva e subjetiva.</p>
<ul><li><strong>Objetiva</strong> — independe da resposta do paciente: <strong>retinoscópio</strong> (esquiascopia), que lê o reflexo retiniano, e o <strong>autorrefrator</strong>.</li><li><strong>Subjetiva</strong> — depende da comparação relatada pelo paciente: <strong>refrator manual ou de Greens</strong>, <strong>caixa de prova com armação de ensaio</strong> e <strong>régua de refração</strong>.</li></ul>
<h3>Tonometria</h3>
<p>Mede a pressão intraocular. O método de referência é a <strong>tonometria de aplanação de Goldmann</strong>, acoplada à lâmpada de fenda: após anestésico tópico e fluoresceína, observam-se sob <strong>luz azul de cobalto</strong> duas miras semicirculares, e a leitura se faz quando suas bordas internas ficam justapostas.</p>

<p>Alternativas: o <strong>autotonômetro de sopro</strong>, sem contato e sem anestésico, útil como triagem; e os portáteis — <strong>Perkins</strong>, <strong>Pascal</strong>, <strong>Tonopen</strong> e <strong>Icare</strong> — indispensáveis em paciente acamado, em criança sob sedação ou em centro cirúrgico, quando não se pode sentar o paciente à lâmpada de fenda.</p>

<h2>Motilidade ocular e fundoscopia</h2>
<h3>Exame da motilidade ocular</h3>
<ul><li><strong>Teste de Hirschberg</strong> — ilumina-se o paciente de frente e compara-se a posição do reflexo luminoso corneano nos dois olhos. Reflexo centrado em ambos indica alinhamento; quanto mais descentrado, maior o ângulo do desvio. É a triagem mais simples de estrabismo.</li><li><strong>Teste de Krimsky</strong> — acrescenta <strong>prismas</strong> de potência crescente diante do olho fixador até centralizar o reflexo, o que quantifica o desvio em dioptrias prismáticas.</li><li><strong>Cover test</strong> — o <strong>simples</strong> revela a <strong>tropia</strong>, o desvio manifesto, pelo movimento de refixação do olho descoberto; o <strong>alternado</strong> quebra a fusão e desmascara a <strong>foria</strong>, o desvio latente. Associado a prismas, vira o <strong>prisma e cover</strong>, que mede o ângulo.</li><li><strong>Versões</strong> — avaliação dos movimentos conjugados nas posições cardinais do olhar.</li><li><strong>Teste de Titmus</strong> — mede a <strong>estereopsia</strong>, a visão de profundidade, com lâminas polarizadas e resposta graduada em segundos de arco.</li></ul>

<p>A <strong>fundoscopia indireta</strong>, feita com capacete binocular e lente condensadora, é o <strong>mapeamento de retina</strong>: vê pouco detalhe, mas vê tudo, incluindo a periferia — por isso é o método obrigatório na suspeita de rotura ou descolamento de retina. A <strong>direta</strong> amplia bem o polo posterior e a papila, mas não chega à periferia.</p>
<p>Descrevem-se rotineiramente: <strong>escavação</strong> do disco óptico (relação escavação/disco, por exemplo 0,2/0,2), <strong>mácula</strong>, <strong>calibre dos vasos</strong>, estado da <strong>retina</strong> e transparência do <strong>vítreo</strong>.</p>
<hr>
<h2>Registro completo de uma consulta</h2>
<p>Vale memorizar o formato de um caso normal, porque é ele que serve de referência para reconhecer o anormal.</p>
<blockquote><p><strong>Identificação:</strong> homem, 48 anos. <strong>QD:</strong> baixa acuidade visual há 2 anos. <strong>HPMA:</strong> usa óculos para perto há 3 anos e não enxerga bem para perto com o grau atual (+1,25 DE em ambos os olhos). <strong>AP:</strong> hipertensão controlada. <strong>AO:</strong> nega cirurgias, doenças ou uso de colírio. <strong>AF:</strong> mãe com glaucoma. <strong>Ao exame</strong> — AV sc longe 20/20 em ambos os olhos, J3 para perto. <strong>Biomicroscopia:</strong> pálpebras, conjuntiva e córnea sem alterações, câmara anterior profunda, pupilas sem alterações, cristalino transparente. <strong>Tonometria:</strong> 12/12 mmHg. <strong>Fundoscopia:</strong> escavação 0,2/0,2, mácula normal, vasos de calibre normal, retina colada, vítreo claro. <strong>Refração:</strong> plano 20/20, adição +1,75 → J1. <strong>HD:</strong> presbiopia em ambos os olhos. <strong>Conduta:</strong> óculos para perto e alta.</p></blockquote>
<p>O raciocínio: visão de longe plena, visão de perto deficiente e correção obtida apenas com <strong>adição esférica positiva</strong> fecham presbiopia. Tonometria de 12 mmHg e escavação de 0,2/0,2 afastam glaucoma apesar do antecedente familiar — mas justificam seguimento.</p>
<hr>
<h2>Exames oftalmológicos especializados</h2>
<p>Cada exame responde a uma pergunta anatômica específica.</p>
<h4>Córnea</h4>
<ul><li><strong>Topografia corneana</strong> — mapeia a <strong>curvatura</strong>; investiga astigmatismo e ceratocone.</li><li><strong>Paquimetria</strong> — mede a <strong>espessura</strong>, em micra; indispensável antes de cirurgia refrativa e na interpretação da tonometria.</li><li><strong>Pentacam</strong> — tomografia de Scheimpflug, que reúne curvatura das duas faces da córnea, espessura e análise do segmento anterior.</li><li><strong>Microscopia especular</strong> — conta e analisa a forma das <strong>células endoteliais</strong>. Ao nascimento há 3.000 a 4.000 células/mm²; o adulto normal fica em torno de <strong>2.500 células/mm²</strong> e o idoso em torno de 2.000.</li></ul>
<h4>Câmara anterior e humor aquoso</h4>
<p>O humor aquoso é produzido pelos <strong>processos ciliares</strong> do corpo ciliar, à taxa de <strong>2,0 µL/min</strong>, sendo 80% por secreção ativa e 20% por ultrafiltração e difusão. É composto por 99% de água, além de glicose, oxigênio, aminoácidos, proteínas, sódio, cálcio, magnésio, ácido ascórbico e ácido lático, e cumpre funções óptica, filtrante, trófica e tensional. A via de escoamento convencional é <strong>trabeculado → canal de Schlemm → canais coletores → veias episclerais</strong>, com a via úveo-escleral como alternativa.</p>
<ul><li><strong>Gonioscopia</strong> — lente com espelhos sobre a córnea para classificar o <strong>ângulo camerular</strong> em aberto ou fechado; define o tipo de glaucoma.</li><li><strong>UBM (biomicroscopia ultrassônica)</strong> — imagem de alta frequência do segmento anterior, inclusive de estruturas atrás da íris.</li></ul>
<h4>Cristalino, retina e função visual</h4>
<ul><li><strong>Biometria</strong> — calcula o poder da lente intraocular que substituirá o cristalino na cirurgia de catarata.</li><li><strong>Angiofluoresceinografia</strong> — estuda a circulação retiniana após injeção endovenosa de contraste.</li><li><strong>OCT (tomografia de coerência óptica)</strong> — cortes que mostram as camadas da retina; a <strong>angio-OCT</strong> avalia o fluxo sem contraste.</li><li><strong>Ecografia ocular (USG)</strong> — avalia o segmento posterior quando a opacidade de meios impede a fundoscopia.</li><li><strong>TC e RM de órbitas</strong> — investigam órbita e nervo óptico; a RM em T2, por exemplo, mostra o alargamento e a tortuosidade do nervo óptico no glioma associado à neurofibromatose tipo 1.</li><li><strong>Campimetria computadorizada</strong> — quantifica o <strong>campo visual</strong>, pilar do diagnóstico e do seguimento do glaucoma e das lesões de via óptica.</li><li><strong>Teste de Ishihara</strong> — avalia a <strong>visão de cores</strong> por lâminas pseudoisocromáticas.</li><li><strong>Sensibilidade ao contraste</strong> — grades de listras com frequência espacial e contraste variáveis; detecta perda funcional com acuidade ainda normal.</li></ul>

    "explanation": "A constrição da pupila contralateral à luz é o reflexo fotomotor consensual, explicado pela decussação parcial das fibras pupilares no quiasma e nos núcleos pré-tectais. O fotomotor direto é a contração da pupila do próprio olho iluminado."
  },
  {
    "question": "O defeito pupilar aferente relativo, pesquisado com a lanterna oscilante, aponta lesão em qual sítio?",
    "options": [
      "Nervo óptico ou retina extensa",
      "Músculo dilatador da íris",
      "Córnea central e cristalino",
      "Terceiro nervo craniano direito"
    ],
    "correctIndex": 0,
    "explanation": "No defeito pupilar aferente relativo a pupila do olho doente dilata quando a luz passa do olho sadio para ele, denunciando via aferente comprometida por neuropatia óptica ou lesão retiniana extensa. Opacidades de meios, como a catarata, não produzem esse sinal, e a lesão do terceiro nervo afeta a via eferente, com pupila fixa e midriática."
  }
];

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +

  }).join('');

      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +

        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
        (reveal ? chatBox(q, ans===q.correctIndex) : '') +

        '</div></div></section>';
}

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';
  if (pct>=90)      { title='Domínio sólido';   msg='Desempenho excelente. Confira as explicações das que escaparam e siga em frente.'; }
  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
</body>
</html>
