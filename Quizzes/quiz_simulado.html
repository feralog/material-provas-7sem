<script type="text/html" id="resumoSrc"><h2>Revisão dos temas do simulado</h2>
<p>Este simulado não gira em torno de um assunto só. Ele mistura quatro blocos que se repetem em prova: a <strong>consulta do adolescente</strong> (7 questões), a <strong>oncologia pediátrica</strong> (6), a <strong>endocrinologia e a neonatologia da tireoide</strong> (5) e o <strong>ECA aplicado à prática</strong> (2). O que segue reconstrói o raciocínio de cada bloco, para que as respostas parem de depender de memória e passem a depender de critério.</p>
<hr>
<h2>A consulta do adolescente: privacidade, sigilo e autonomia</h2>
<p>O adolescente é sujeito de direitos, não um apêndice do responsável. Três garantias sustentam o atendimento e caem juntas em prova: <strong>privacidade</strong> (ser atendido sozinho, ainda que parte da consulta seja com a família), <strong>confidencialidade</strong> (o que foi dito não é repassado sem necessidade) e <strong>consentimento informado</strong> (participar da decisão sobre o próprio corpo).</p>
<p>A consequência prática mais cobrada é que <strong>não é obrigatório o consentimento dos pais para todo atendimento</strong>. Adolescente com capacidade de discernimento pode ser atendido desacompanhado, receber orientação sobre sexualidade, iniciar contraceptivo, ser testado para IST e tratado. Exigir acompanhante nesses casos não protege ninguém: cria barreira de acesso justamente em quem já está exposto.</p>
<p>O modelo de consulta é dialógico. Escuta ativa, linguagem sem julgamento, exame físico explicado antes de ser feito e decisões pactuadas produzem adesão; a transmissão unidirecional de recomendações produz abandono. Quando o adolescente resiste ao exame físico, isso costuma ser dado clínico — vergonha corporal, violência, automutilação escondida sob manga comprida.</p>
<blockquote><p><strong>Pegadinha recorrente:</strong> a alternativa que diz "a confidencialidade deve ser sempre garantida, sem exceções" é sempre falsa. Assim como é falsa a que exige autorização dos pais para qualquer atendimento. As duas erram pelo absoluto.</p></blockquote>
<hr>
<h2>Quando o sigilo se rompe — e quando não se rompe</h2>
<p>O sigilo é a regra; a quebra é exceção justificada, restrita ao mínimo necessário e, sempre que possível, <strong>comunicada antes ao adolescente</strong>, de preferência com ele presente no momento em que a família é informada.</p>
<div class="tbl"><table><thead><tr><th>Situação</th><th>Sigilo</th><th>Por quê</th></tr></thead><tbody><tr><td>Autoagressão, ideação ou tentativa de suicídio</td><td><strong>Quebra</strong></td><td>Risco atual à própria vida</td></tr><tr><td>Não adesão ao tratamento de tuberculose</td><td><strong>Quebra</strong></td><td>Doença transmissível de notificação compulsória; risco à coletividade e seleção de resistência</td></tr><tr><td>Suspeita ou confirmação de violência e abuso sexual</td><td><strong>Quebra</strong></td><td>Proteção obrigatória; notificação e Conselho Tutelar (art. 13 do ECA)</td></tr><tr><td>Incapacidade de discernir a própria condição</td><td><strong>Quebra</strong></td><td>Falta o pressuposto da autonomia</td></tr><tr><td>Suspeita de gravidez</td><td>Mantém</td><td>Não há risco iminente; acolher e apoiar a comunicação à família</td></tr><tr><td>Uso experimental de droga ilícita</td><td>Mantém</td><td>Episódio isolado não é risco de vida nem crime a ser denunciado pelo médico</td></tr><tr><td>Pedido de sorologia para HIV por ansiedade</td><td>Mantém</td><td>Testar e aconselhar é cuidado, não motivo de denúncia</td></tr><tr><td>Início de método contraceptivo</td><td>Mantém</td><td>Direito reprodutivo do adolescente</td></tr></tbody></table></div>
<p>Quando a quebra é necessária, a forma importa tanto quanto a decisão: informa-se <strong>na própria consulta</strong>, com o adolescente presente, apenas o que for indispensável para acionar a proteção, e já se encaminha (saúde mental, rede de proteção, serviço especializado). Combinar que "o próprio adolescente conversará com a família depois" é insuficiente diante de risco de vida — deixa o desfecho sem retaguarda.</p>
<blockquote><p>Uso experimental de maconha em asmático não muda a regra. Orienta-se sobre o efeito irritativo da fumaça e o risco de broncoespasmo, reforça-se o corticoide inalatório e trata-se a tosse — mantendo o sigilo, que é o que garante o próximo retorno.</p></blockquote>
<hr>
<h2>ECA na prática: vacinação, negligência e Conselho Tutelar</h2>
<p>Dois artigos resolvem a maioria das questões:</p>
<ul><li><strong>Art. 13</strong> — casos suspeitos <strong>ou</strong> confirmados de maus-tratos devem ser comunicados ao Conselho Tutelar, sem prejuízo de outras providências legais. Suspeita basta; não cabe ao profissional investigar antes de comunicar.</li><li><strong>Art. 14, § 1º</strong> — é <strong>obrigatória</strong> a vacinação das crianças nos casos recomendados pelas autoridades sanitárias. Recusa vacinal, portanto, não é escolha legítima dos pais: é negligência.</li></ul>
<p><strong>Negligência é violência.</strong> Ela aparece nas provas disfarçada de decisão familiar: recusa de vacina, abandono de tratamento, evasão hospitalar com criança grave, falta a consultas de doença crônica. Evadir do hospital com um lactente em oxigenioterapia por saturação de 85% é privação de cuidado essencial — registra-se o ocorrido em prontuário, com horário e circunstâncias, e comunica-se o Conselho Tutelar.</p>
<blockquote><p>A alternativa "sensibilizar a família e, só em risco iminente, acionar o Conselho Tutelar" parece equilibrada e por isso atrai. Quando a família já decidiu suspender o esquema e há crianças menores de 5 anos em atraso, o risco não é hipotético: coqueluche, sarampo e doença meningocócica não esperam a próxima visita.</p></blockquote>
<h3>Diante de suspeita de violência física</h3>
<ol><li>Conversar <strong>a sós</strong> com a vítima, antes do exame físico — a presença de familiares inibe o relato e pode reproduzir a coação.</li><li>Examinar por completo e <strong>descrever as lesões</strong> (tipo, localização, coloração, estágio de evolução), porque essa descrição vira documento.</li><li>Notificar (ficha de notificação compulsória) e comunicar o Conselho Tutelar.</li><li>Nunca acarear o suspeito nem confrontá-lo no serviço: expõe a vítima a retaliação e não é papel do médico.</li></ol>
<hr>
<h2>Gravidez na adolescência</h2>
<p>Os fatores de risco não são só informativos. Pesam o desenvolvimento psíquico ainda em curso (impulsividade, dificuldade de antecipar consequências), fatores culturais e familiares, violência sexual, evasão escolar prévia e baixa oferta de contracepção. <strong>Acesso à internet não substitui educação sexual qualificada</strong> — o volume de informação aumentou e a desinformação, também.</p>
<p>Dois marcadores biológicos definem gestação de maior risco:</p>
<ul><li>idade <strong>menor que 16 anos</strong>;</li><li><strong>intervalo pós-menarca menor que 2 anos</strong>, quando o eixo hipotálamo-hipófise-ovário e a pelve ainda estão imaturos.</li></ul>
<p>O risco é materno e fetal — nunca só fetal. Do lado materno: anemia, pré-eclâmpsia, parto prematuro, desproporção cefalopélvica, depressão pós-parto, abandono escolar e repetição da gestação na adolescência. Do lado fetal: prematuridade, baixo peso e maior mortalidade perinatal.</p>
<hr>
<h2>Sinais de alerta do câncer na infância</h2>
<p>O câncer pediátrico é raro, mas a leucemia linfoide aguda responde por cerca de um quarto de todos os casos e tem pico entre <strong>2 e 5 anos</strong>. A apresentação é banal na superfície — febre, palidez, "dor de crescimento" — e o que denuncia é a <strong>combinação</strong>:</p>
<ul><li>febre prolongada ou recorrente sem foco;</li><li><strong>dor óssea que acorda à noite</strong> ou faz a criança parar de andar (dor de crescimento não acorda, não é matinal e não incapacita);</li><li>palidez progressiva, adinamia, sopro sistólico funcional;</li><li>equimoses e petéquias em <strong>áreas não expostas a trauma</strong>, sangramento gengival, epistaxe;</li><li>linfonodomegalia generalizada, hepatoesplenomegalia;</li><li>massa abdominal, aumento de volume testicular indolor, cefaleia matinal com vômitos, leucocoria.</li></ul>
<p>O laboratório fecha o raciocínio: <strong>citopenia em mais de uma série</strong> com organomegalia. O primeiro exame é sempre o <strong>hemograma completo com contagem de plaquetas</strong> — barato, rápido, disponível na atenção básica e capaz de mostrar blastos. Confirmação é por mielograma (≥ 25% de blastos), mas isso já é do serviço especializado.</p>
<h3>Diagnóstico diferencial das citopenias com púrpura</h3>
<div class="tbl"><table><thead><tr><th>Hipótese</th><th>Anemia</th><th>Leucócitos</th><th>Plaquetas</th><th>Organomegalia</th><th>Chave</th></tr></thead><tbody><tr><td>Leucemia linfoide aguda</td><td>sim</td><td>variáveis, com predomínio linfocitário ou blastos</td><td>baixas</td><td>hepatoesplenomegalia e adenomegalia</td><td>citopenia em várias séries + dor óssea noturna</td></tr><tr><td>Anemia aplásica</td><td>sim</td><td>baixos</td><td>baixas</td><td><strong>ausente</strong></td><td>pancitopenia sem visceromegalia e sem dor óssea</td></tr><tr><td>Púrpura trombocitopênica imunológica</td><td>não</td><td>normais</td><td>muito baixas</td><td>ausente</td><td>criança bem, só plaquetas caídas, após virose</td></tr><tr><td>Vasculite por IgA</td><td>não</td><td>normais</td><td><strong>normais</strong></td><td>ausente</td><td>púrpura palpável em membros inferiores e nádegas, dor abdominal, artrite</td></tr><tr><td>Artrite idiopática juvenil sistêmica</td><td>discreta</td><td><strong>altos</strong></td><td><strong>altas</strong></td><td>hepatoesplenomegalia possível</td><td>leucocitose e trombocitose, não citopenia</td></tr></tbody></table></div>
<blockquote><p>Reticulócitos baixos (por exemplo 0,4%) diante de anemia significam medula que <strong>não</strong> está respondendo — aponta para ocupação ou falência medular, não para hemólise ou perda.</p></blockquote>
<p>Massa testicular indolor com febre, astenia e adenomegalias em várias cadeias, inclusive epitroclear, não é orquiepididimite: é doença linfoproliferativa até prova em contrário, e o exame que direciona é o hemograma. Ultrassonografia, alfafetoproteína e DHL entram depois, para caracterizar a massa e estadiar.</p>
<hr>
<h2>Massas abdominais da infância e emergências oncológicas</h2>
<p>Massa abdominal em criança é sinal de alarme. A idade e o comportamento da massa quase fecham o diagnóstico:</p>
<div class="tbl"><table><thead><tr><th>Tumor</th><th>Idade típica</th><th>Massa</th><th>Achados que distinguem</th></tr></thead><tbody><tr><td>Neuroblastoma</td><td>&lt; 2 anos</td><td>irregular, <strong>cruza a linha média</strong>, fixa</td><td>criança em mau estado geral, dor óssea, opsoclonia, equimose periorbital, catecolaminas urinárias elevadas</td></tr><tr><td>Tumor de Wilms (nefroblastoma)</td><td>2 a 5 anos</td><td>lisa, <strong>não cruza a linha média</strong></td><td>criança em bom estado geral, hipertensão, hematúria, associação com anomalias geniturinárias</td></tr><tr><td>Hepatoblastoma</td><td>&lt; 3 anos</td><td>hepatomegalia dura em lobo direito</td><td>alfafetoproteína muito elevada</td></tr><tr><td>Linfoma de Burkitt</td><td>escolar</td><td>massa retroperitoneal ou ileocecal de crescimento explosivo</td><td>febre, sudorese noturna, perda de peso, DHL muito alta</td></tr><tr><td>Hidronefrose / rim multicístico</td><td>qualquer</td><td>massa lisa em flanco</td><td>sem sinais sistêmicos, sem perda de peso</td></tr></tbody></table></div>
<h3>Síndrome de lise tumoral</h3>
<p>É a emergência oncológica que mais cai. Ocorre quando uma grande massa de células com alta taxa de proliferação se rompe e despeja conteúdo intracelular na circulação — espontaneamente ou logo após a primeira dose de quimioterapia. O quarteto laboratorial é <strong>hiperuricemia, hipercalemia, hiperfosfatemia e hipocalcemia</strong>, com injúria renal aguda por precipitação de urato e de fosfato de cálcio nos túbulos.</p>
<p>Alto risco: linfoma de Burkitt, leucemias com hiperleucocitose, massas volumosas, <strong>DHL muito elevada</strong>, ácido úrico alto e creatinina já alterada antes de tratar.</p>
<p>Manejo antes da quimioterapia:</p>
<ul><li><strong>Hiper-hidratação venosa</strong> (cerca de 2,5 a 3 L/m²/dia), sem potássio e sem cálcio na solução, mantendo diurese abundante;</li><li><strong>Rasburicase</strong> no alto risco — é uma urato-oxidase que <strong>degrada o ácido úrico já formado</strong>, derrubando-o em horas;</li><li><strong>Alopurinol</strong> apenas no risco intermediário: inibe a xantina-oxidase e impede a formação de urato <strong>novo</strong>, mas não elimina o que já está circulando;</li><li>laboratório seriado (potássio, fósforo, cálcio, ácido úrico, creatinina) a cada 6 a 8 horas;</li><li><strong>adiar a quimioterapia</strong> até a estabilização metabólica; diálise é resgate, não profilaxia.</li></ul>
<blockquote><p>A alternativa "iniciar a quimioterapia imediatamente porque o atraso piora o prognóstico" explora um medo real, mas inverte a prioridade: algumas horas de estabilização não mudam o prognóstico oncológico, e a lise não controlada mata.</p></blockquote>
<hr>
<h2>Tireoide: da triagem neonatal ao adolescente</h2>
<h3>Hipotireoidismo congênito e teste do pezinho</h3>
<p>É a principal causa evitável de deficiência intelectual, e o recém-nascido é <strong>assintomático</strong> nas primeiras semanas — daí a triagem. Quando há sinais, são inespecíficos: <strong>icterícia prolongada por bilirrubina indireta</strong>, hipotonia, choro rouco, constipação, hérnia umbilical, abdome globoso, fontanela posterior ampla, macroglossia, dificuldade de sucção.</p>
<p>O mecanismo da icterícia é direto: o déficit hormonal reduz a atividade da glicuroniltransferase hepática e lentifica o trânsito intestinal, aumentando a circulação êntero-hepática da bilirrubina. Por isso icterícia indireta persistindo além da primeira semana <strong>sem incompatibilidade sanguínea</strong> — mãe e recém-nascido do mesmo tipo, Coombs negativo — obriga a pensar em tireoide antes de pensar em obstrução biliar, que daria bilirrubina <strong>direta</strong>, colúria e acolia fecal.</p>
<p>Conduta pelo valor de TSH em papel-filtro (coleta ideal entre o 3º e o 5º dia de vida):</p>
<div class="tbl"><table><thead><tr><th>TSH na triagem</th><th>Conduta</th></tr></thead><tbody><tr><td>Abaixo do corte (em geral &lt; 10 mUI/L)</td><td>Normal, seguimento habitual</td></tr><tr><td>Discretamente alterado, próximo ao corte</td><td>Repetir a amostra em papel-filtro</td></tr><tr><td><strong>Francamente alterado (&gt; 20 mUI/L)</strong></td><td>Convocação imediata e <strong>dosagem sérica de TSH e T4 livre</strong>; iniciar levotiroxina assim que confirmado</td></tr></tbody></table></div>
<blockquote><p>A janela terapêutica é o dado que decide a questão: o tratamento deve começar entre <strong>14 e 21 dias de vida</strong>, no máximo dentro do primeiro mês. Repetir o teste do pezinho em 30 dias ou "observar por 3 meses" queima exatamente essa janela.</p></blockquote>
<p>Seguimento: a criança que iniciou levotiroxina precocemente <strong>sem etiologia definida</strong> — tireoide tópica e de tamanho normal na ultrassonografia — pode ter tido hipotireoidismo transitório, mas a reposição é mantida durante toda a fase de maturação do sistema nervoso central, até cerca de <strong>2 a 3 anos</strong>. Só então se faz a reavaliação, com suspensão programada e nova dosagem de TSH e T4 livre. Sob tratamento, a cintilografia é pouco informativa, porque o TSH suprimido reduz a captação.</p>
<h3>Hipo e hipertireoidismo no adolescente</h3>
<p><strong>Hipotireoidismo primário</strong> — TSH alto com T4 livre baixo. Fadiga, ganho de peso, constipação, pele seca, intolerância ao frio, bradicardia, irregularidade menstrual, queda de velocidade de crescimento e <strong>fase de relaxamento lentificada</strong> nos reflexos profundos. A causa mais comum em área suficiente em iodo é a <strong>tireoidite de Hashimoto</strong>, e quem define a etiologia é o <strong>anti-TPO</strong>, positivo em 90 a 95% dos casos — não a ultrassonografia, que só mostra heterogeneidade inespecífica, nem a cintilografia, que não tem papel aqui.</p>
<p><strong>Hipertireoidismo</strong> — TSH suprimido com T4 livre elevado. Palpitações, taquicardia, perda de peso com apetite aumentado, intolerância ao calor, tremor fino, irritabilidade. A causa esmagadoramente mais comum na adolescência é a <strong>doença de Graves</strong>, e o sinal que a identifica é a tríade <strong>bócio difuso + exoftalmia + tireotoxicose</strong>: os anticorpos antirreceptor de TSH estimulam toda a glândula e agridem o tecido retro-orbitário.</p>

<h2>O que mais caiu — mapa rápido</h2>
<ul><li><strong>Sigilo do adolescente:</strong> regra, com exceções fechadas — risco de vida, doença transmissível sem adesão, violência, ausência de discernimento. Toda alternativa com "sempre" ou "nunca" tende a ser falsa.</li><li><strong>Atendimento desacompanhado e contracepção:</strong> direito do adolescente, sem autorização de responsável.</li><li><strong>ECA:</strong> art. 13 (comunicar suspeita de maus-tratos) e art. 14, § 1º (vacinação obrigatória). Negligência é violência.</li><li><strong>Leucemia linfoide aguda:</strong> cinco das seis questões de oncologia partiram dela — febre, dor óssea noturna, palidez, púrpura e citopenias com organomegalia. Primeiro exame: hemograma com plaquetas.</li><li><strong>Lise tumoral:</strong> hidratação vigorosa + rasburicase + laboratório seriado, adiando a quimioterapia. Alopurinol não desfaz o urato já formado.</li><li><strong>Triagem neonatal:</strong> TSH &gt; 20 mUI/L no papel-filtro é dosagem sérica imediata, não repetição do teste.</li><li><strong>Tireoide:</strong> anti-TPO define a etiologia do hipotireoidismo; exoftalmia com bócio difuso define Graves.</li></ul></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

function renderHeader(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var left =
    '<div style="min-width:0">' +
      '<div style="display:flex;align-items:center;gap:8px;'+mono+';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8a8578">' +
        '<a href="'+idxHref()+'" class="h-ink" style="color:#2b57cc;text-decoration:none;white-space:nowrap">\u2190 Materiais</a>' +
        '<span style="color:#d3cec4">/</span>' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(EYEBROW)+'</span>' +
      '</div>' +
      '<h1 style="margin:1px 0 0;font-family:\'Newsreader\',Georgia,serif;font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.15">'+esc(TITLE)+'</h1>' +
    '</div>';

  var right = '';
  if (S.view === 'quiz' && S.started) {
    var hit = counts().hit;
    right = '<div style="display:flex;align-items:center;gap:10px;flex-shrink:0">' +
              '<button type="button" data-act="sair" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:9px;padding:6px 11px;'+mono+';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">Sair</button>' +
              '<div style="display:flex;align-items:center;gap:6px">' +
                '<span style="'+mono+';font-size:15px;font-weight:600;letter-spacing:-.02em">'+hit+'</span>' +
                '<span style="'+mono+';font-size:11px;color:#8a8578">/ '+S.order.length+'</span>' +
              '</div></div>';
  } else if (S.view !== 'home') {
    right = '<button type="button" data-act="home" class="h-line" style="flex-shrink:0;background:none;border:1px solid #ddd8ce;border-radius:9px;padding:7px 13px;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">← Início</button>';
  }

  var html = '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:'+(S.view==='quiz'&&S.started?'10px':'2px')+'">'+left+right+'</div>';

  if (S.view === 'quiz' && S.started) {
    var c = counts();
    var rail = S.order.map(function(q,n){
      var a = S.answers[n], cur = n===S.i && !S.finished, bg = '#d3cec4';
      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';
      if (cur && a===null) bg = '#121a2b';
      var st = a===null ? 'em branco' : (a===q.correctIndex ? 'correta' : 'incorreta');
      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +
             '<span style="display:block;width:100%;border-radius:99px;transition:height .18s ease,background .18s ease,box-shadow .18s ease;height:'+(cur?'17px':'9px')+';background:'+bg+';box-shadow:'+(cur?'0 0 0 3px rgba(18,26,43,.13)':'none')+'"></span></button>';
    }).join('');
    html += '<div><div style="display:flex;align-items:center;gap:3px">'+rail+'</div>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-2px">' +
              '<div style="'+mono+';font-size:11px;letter-spacing:.04em;color:#5b6478">Questão '+pad(S.i+1)+' / '+S.order.length+'</div>' +
              '<div style="display:flex;align-items:center;gap:12px;'+mono+';font-size:10.5px;color:#8a8578">' +
                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +
              '</div></div></div>';
  }
  document.getElementById('hdr').innerHTML = html;
}
function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
