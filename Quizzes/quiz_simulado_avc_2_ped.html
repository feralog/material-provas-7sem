<script type="text/html" id="resumoSrc"><h2>Como ler este simulado</h2>
<p>São 19 questões transcritas do formulário da AVC 2 de Pediatria, e elas se distribuem em três eixos muito desiguais. <strong>Oito</strong> tratam de violência sexual e aborto legal, <strong>sete</strong> de erros inatos da imunidade e <strong>quatro</strong> de alergia e dermatologia. Não é dispersão: é um recado sobre onde a prova concentra peso.</p>
<p>O gabarito das <strong>questões 1 a 11 é oficial</strong>, confirmado nas telas de correção do formulário. Da 12 em diante é reconstrução pelo conteúdo. Vale registrar que as onze oficiais confirmaram, uma a uma, o que a reconstrução já apontava — o que dá alguma confiança nas oito restantes, embora não seja garantia.</p>
<div class="tbl"><table><thead><tr><th>Q</th><th>Tema</th><th>Resposta</th><th>Fonte</th></tr></thead><tbody><tr><td>1</td><td>Dermatite atópica impetiginizada</td><td>A</td><td>Oficial</td></tr><tr><td>2</td><td>Profilaxias na violência sexual</td><td>D</td><td>Oficial</td></tr><tr><td>3</td><td>Recusa de atendimento à vítima</td><td>A</td><td>Oficial</td></tr><tr><td>4</td><td>Sinal de alerta de imunodeficiência</td><td>E</td><td>Oficial</td></tr><tr><td>5</td><td>Aborto legal: o que é exigido</td><td>B</td><td>Oficial</td></tr><tr><td>6</td><td>Dermatite atópica leve</td><td>A</td><td>Oficial</td></tr><tr><td>7</td><td>Wiskott-Aldrich</td><td>A</td><td>Oficial</td></tr><tr><td>8</td><td>Vacinas contraindicadas</td><td>B</td><td>Oficial</td></tr><tr><td>9</td><td>Profilaxia e notificação</td><td>B</td><td>Oficial</td></tr><tr><td>10</td><td>Diagnóstico de dermatite atópica</td><td>C</td><td>Oficial</td></tr><tr><td>11</td><td>Gestação aos 13 anos, 23 semanas</td><td>B</td><td>Oficial</td></tr><tr><td>12</td><td>Investigação laboratorial</td><td>B</td><td>Estimado</td></tr><tr><td>13</td><td>Limite gestacional (julgamento)</td><td>Incorreto</td><td>Estimado</td></tr><tr><td>14</td><td>Doença granulomatosa crônica</td><td>C</td><td>Estimado</td></tr><tr><td>15</td><td>Frases de validação</td><td>D (II e III)</td><td>Estimado</td></tr><tr><td>16</td><td>Hipogamaglobulinemia</td><td>B</td><td>Estimado</td></tr><tr><td>17</td><td>Urticária aguda alimentar</td><td>A</td><td>Estimado</td></tr><tr><td>18</td><td>SCID e triagem neonatal</td><td>A</td><td>Estimado</td></tr><tr><td>19</td><td>Estupro de vulnerável: as três condutas</td><td>A</td><td>Estimado</td></tr></tbody></table></div>
<blockquote><p><strong>Duas questões foram adaptadas para caber no formato do quiz.</strong> A questão 13 era de julgamento, com duas opções (Correto / Incorreto), e ganhou quatro alternativas com a justificativa dentro de cada uma — o conteúdo cobrado é o mesmo. E a alternativa D da questão 15 aparece no formulário escrita como "II e II", erro de digitação evidente; aqui está como "II e III". A grafia "Wisckott" da questão 7 foi mantida como no formulário; o epônimo correto é <strong>Wiskott-Aldrich</strong>.</p></blockquote>
<hr>
<h2>Violência sexual: o que se faz nas primeiras horas</h2>
<p>A lógica inteira do atendimento é uma só: <strong>nada espera confirmação</strong>. Não se aguarda sorologia, não se aguarda boletim de ocorrência, não se aguarda perícia. Cada profilaxia tem uma janela, e a janela fecha.</p>
<h4>As profilaxias e seus prazos</h4>
<div class="tbl"><table><thead><tr><th>O que</th><th>Esquema</th><th>Janela</th></tr></thead><tbody><tr><td><strong>HIV (PEP)</strong></td><td>tenofovir + lamivudina + dolutegravir, 28 dias</td><td><strong>até 72 h</strong> — quanto antes, melhor</td></tr><tr><td><strong>Sífilis</strong></td><td>penicilina <strong>benzatina</strong> 2,4 milhões UI IM, dose única</td><td>o quanto antes</td></tr><tr><td><strong>Gonorreia</strong></td><td>ceftriaxona 500 mg IM, dose única</td><td>o quanto antes</td></tr><tr><td><strong>Clamídia</strong></td><td>azitromicina 1 g VO, dose única</td><td>o quanto antes</td></tr><tr><td><strong>Tricomoníase</strong></td><td>metronidazol 2 g VO, dose única</td><td>o quanto antes</td></tr><tr><td><strong>Hepatite B</strong></td><td>vacina + imunoglobulina (IGHAHB) se esquema incompleto</td><td>até 14 dias</td></tr><tr><td><strong>Gravidez</strong></td><td>levonorgestrel <strong>1,5 mg</strong> VO, dose única</td><td>até 5 dias, ideal 72 h</td></tr></tbody></table></div>
<p>Três armadilhas moram nessa tabela, e as três foram cobradas:</p>
<ul><li><strong>"Após 72 horas" × "até 72 horas".</strong> A PEP se inicia dentro da janela; depois dela, não se inicia mais. Uma preposição trocada inverte a conduta.</li><li><strong>Penicilina benzatina, não cristalina.</strong> A cristalina é endovenosa e se reserva à neurossífilis; a dose de 2,4 milhões UI pertence à benzatina.</li><li><strong>Metronidazol 2 g é tricomoníase, não vaginose bacteriana.</strong> A dose está certa; o rótulo é que está errado.</li></ul>
<p>E a contracepção de emergência pode vir como 1,5 mg em um comprimido ou <strong>dois comprimidos de 0,75 mg em dose única</strong> — a mesma coisa escrita de outro jeito, e foi assim que a prova escreveu. Não existe contraindicação por estar menstruada, nem risco tromboembólico que a impeça.</p>
<blockquote><p><strong>Ponto-chave:</strong> se uma alternativa condiciona qualquer profilaxia a exame, laudo ou autorização, ela está errada antes mesmo de você ler o resto.</p></blockquote>
<h4>Recusar o atendimento não é opção</h4>
<p>O atendimento à vítima de violência sexual é <strong>emergência médica</strong> e independe de haver lesão física. Mandar a pessoa à delegacia antes de atendê-la soma três infrações de uma vez: ética, pelo Código de Ética Médica; administrativa, por descumprir a norma técnica do Ministério da Saúde; e criminal, como <strong>omissão de socorro</strong>. Registrar a justificativa em prontuário não legitima a recusa — apenas documenta quem a cometeu. E o custo não é só formal: cada hora perdida come a janela da PEP e da contracepção de emergência.</p>
<hr>
<h2>Aborto legal: o que a lei pede e o que ela não pede</h2>
<p>O artigo 128 do Código Penal autoriza a interrupção em duas situações — <strong>risco de vida da gestante</strong> e <strong>gravidez resultante de estupro</strong> —, às quais a jurisprudência somou a <strong>anencefalia</strong> (ADPF 54). É um texto curto, e o que ele <em>não</em> diz é o que mais cai.</p>
<h4>O que NÃO é exigido</h4>
<ul><li><strong>Boletim de ocorrência.</strong> A palavra da mulher basta.</li><li><strong>Autorização judicial ou alvará.</strong></li><li><strong>Laudo pericial do IML.</strong> A perícia é do interesse da investigação criminal, não condição do atendimento em saúde.</li><li><strong>Idade gestacional dentro de um limite legal.</strong> O artigo 128 <strong>não fixa prazo nenhum.</strong></li></ul>
<p>Esse último ponto foi cobrado duas vezes, e vale fixar de onde vêm os números que circulam. Os cortes de <strong>20 a 22 semanas</strong> (ou 500 g) são de norma técnica e de limite de viabilidade fetal: critério assistencial, que orienta a técnica empregada e o serviço capaz de realizá-la. Não são impedimento previsto em lei. E as <strong>12 semanas</strong> não existem em lugar nenhum da legislação brasileira — são um número plausível, tirado de outros países, e é exatamente por parecer plausível que funciona tão bem como distrator.</p>
<h4>O que é exigido</h4>
<p>Consentimento da paciente (ou de representante legal, conforme a idade) e o <strong>procedimento de justificação e autorização</strong>, feito pela equipe multidisciplinar, que registra o relato e atesta a compatibilidade entre a idade gestacional e a data referida da violência.</p>
<h4>Objeção de consciência tem limite</h4>
<p>O médico pode se recusar, mas <strong>não</strong> em três situações: risco de morte da mulher, ausência de outro profissional que o faça, e qualquer circunstância em que a recusa cause dano ou agravo à saúde. E a objeção nunca dispensa o acolhimento, o atendimento das complicações nem o encaminhamento a quem possa assumir o caso.</p>
<hr>
<h2>Estupro de vulnerável, notificação e acolhimento</h2>
<p><strong>Abaixo de 14 anos não existe consentimento válido.</strong> O artigo 217-A do Código Penal é objetivo: a relação sexual com menor de 14 anos é estupro de vulnerável, independentemente de ter sido desejada, de não ter havido violência física ou coação, e da idade do parceiro — inclusive quando o parceiro também é adolescente. Essa é a chave de duas questões do simulado, e é o ponto em que o enunciado tenta induzir ao erro justamente insistindo na palavra "consensual".</p>
<p>A consequência prática se desdobra em três condutas, que foi como a prova cobrou:</p>
<ol><li><strong>O aborto legal está previsto</strong>, porque juridicamente houve estupro.</li><li><strong>Encaminhar ao serviço de referência</strong> em violência sexual e aborto legal, que concentra a equipe multidisciplinar.</li><li><strong>Notificar no SINAN.</strong> A notificação de violência é <strong>compulsória e imediata</strong> (em até 24 horas), independe da autorização da vítima ou da família e independe de boletim de ocorrência. Em menor de 18 anos soma-se a comunicação ao <strong>Conselho Tutelar</strong>, por exigência do ECA.</li></ol>
<h4>Validar o sofrimento é técnica, não gentileza</h4>
<p>A prova cobrou reconhecer frases de acolhimento, e o critério é objetivo. Valida quem <strong>nomeia o sofrimento sem minimizá-lo</strong>, <strong>normaliza a reação</strong> ("sintomas perturbadores costumam ocorrer em pessoas que passam pelo que você passou"), <strong>oferece perspectiva</strong> sem prometer e <strong>indica onde buscar ajuda</strong>. Perguntar diretamente como a pessoa está se sentindo é o que abre a conversa — evitar a pergunta é o oposto de acolher.</p>
<hr>
<h2>Erros inatos da imunidade: o que faz suspeitar</h2>
<p>Criança com infecção é o normal da pediatria; o que muda a conduta é o <strong>padrão</strong>. Os sinais de alerta existem justamente para separar o esperado do investigável.</p>
<div class="tbl"><table><thead><tr><th>Esperado, não investiga</th><th>Sinal de alerta, investiga</th></tr></thead><tbody><tr><td>3 a 8 resfriados por ano no pré-escolar</td><td><strong>2 ou mais pneumonias</strong> no último ano</td></tr><tr><td>Uma diarreia aguda que resolve em dias</td><td><strong>Diarreia crônica</strong> ou giardíase de repetição</td></tr><tr><td>Uma pneumonia com boa resposta ao antibiótico</td><td><strong>4 ou mais otites</strong> no último ano</td></tr><tr><td>Rinite alérgica</td><td><strong>Abscessos de repetição</strong> ou ectima</td></tr><tr><td>Monilíase oral no lactente</td><td><strong>Candidíase oral por mais de 2 meses</strong> após o primeiro ano</td></tr><tr><td>—</td><td>Infecção sistêmica grave: meningite, osteoartrite, sepse</td></tr><tr><td>—</td><td>Efeito adverso ao BCG ou infecção por micobactéria</td></tr><tr><td>—</td><td>História familiar de imunodeficiência</td></tr></tbody></table></div>
<p>Repare na estrutura das duas questões que exploraram isso: elas enchem o caso de achados banais — resfriados na média, uma diarreia resolvida, uma pneumonia bem tratada, rinite — e escondem <strong>um</strong> achado fora da curva. Na questão 3 era o abscesso de repetição; na questão 9, a giardíase recorrente somada às sinusites e otites.</p>
<h4>Que compartimento o padrão aponta</h4>
<div class="tbl"><table><thead><tr><th>Padrão clínico</th><th>Compartimento</th><th>Exame inicial</th></tr></thead><tbody><tr><td>Sinopulmonar por encapsulados, giardíase</td><td><strong>Anticorpos</strong> (o mais comum)</td><td>dosagem de imunoglobulinas, resposta a polissacarídeo</td></tr><tr><td>Oportunistas, início precoce, grave</td><td><strong>Combinada (T e B)</strong></td><td>linfócitos totais, subpopulações, TREC</td></tr><tr><td>Abscessos, adenite supurativa, fungos</td><td><strong>Fagócitos</strong></td><td>DHR ou NBT, hemograma</td></tr><tr><td>Neisseria invasiva de repetição</td><td><strong>Complemento</strong></td><td>CH50, AH50</td></tr></tbody></table></div>
<blockquote><p><strong>Pegadinha recorrente:</strong> o enunciado pede "apenas instrumentos <strong>laboratoriais</strong>". Tomografia é imagem e espirometria é prova de função — as duas eliminam a alternativa inteira, antes de qualquer raciocínio imunológico.</p></blockquote>
<hr>
<h2>As cinco imunodeficiências do simulado</h2>
<h4>Doença granulomatosa crônica (DGC)</h4>
<p>Defeito do complexo <strong>NADPH oxidase</strong>: o fagócito engole o microrganismo e não consegue produzir superóxido para matá-lo. Por isso adoece por germes <strong>catalase-positivos</strong>, que degradam o pouco peróxido disponível — <em>Staphylococcus aureus</em>, <em>Serratia</em>, <em>Burkholderia</em>, <em>Nocardia</em> e <em>Aspergillus</em>. Clinicamente: abscessos cutâneos e hepáticos, adenite supurativa, pneumonia fúngica e formação de granulomas.</p>
<p>É <strong>defeito qualitativo</strong>. A contagem de neutrófilos é <strong>normal</strong>, e o diagnóstico se faz pelo <strong>DHR</strong> (citometria com diidrorodamina) ou pelo <strong>NBT</strong>, que mostram ausência do burst oxidativo. Procurar neutropenia no hemograma de um paciente com DGC não leva a lugar nenhum.</p>
<h4>Imunodeficiência combinada grave (SCID)</h4>
<p>Emergência pediátrica. A triagem se faz pelo <strong>TREC</strong> no teste do pezinho: são círculos de DNA excisados quando o linfócito T rearranja seu receptor no timo, de modo que contá-los mede produção tímica recente e detecta linfopenia T <strong>antes da primeira infecção</strong>. O <strong>transplante de células-tronco é tanto melhor quanto mais precoce</strong> — idealmente antes dos 3,5 meses e antes de qualquer infecção grave. Adiar é o contrário do indicado. Vacina de agente vivo é <strong>contraindicação absoluta</strong>, e o BCG do berçário é o problema clássico, causando becegeíte disseminada.</p>
<h4>Síndrome de Wiskott-Aldrich</h4>
<p>Imunodeficiência <strong>combinada</strong> ligada ao X, por mutação no gene <em>WAS</em>. A tríade é o que se cobra: <strong>infecções de repetição, eczema parecido com dermatite atópica e trombocitopenia com plaquetas pequenas</strong>. O volume plaquetário reduzido é o detalhe discriminante — nas outras plaquetopenias da infância a plaqueta é normal ou grande, e aqui ela é microcítica. Soma risco aumentado de autoimunidade e de linfoma, e o tratamento definitivo é o transplante de células-tronco.</p>
<p>As três que costumam aparecer ao lado dela como distrator se separam fácil: <strong>Chédiak-Higashi</strong> tem albinismo parcial e grânulos gigantes nos leucócitos; <strong>diGeorge</strong> é defeito do desenvolvimento tímico, com hipocalcemia neonatal e cardiopatia conotruncal; <strong>Bruton</strong> (agamaglobulinemia ligada ao X) é deficiência de anticorpos pura, sem eczema e sem plaquetopenia.</p>
<h4>Imunodeficiência comum variável (ICV)</h4>
<p>Queda das <strong>três</strong> classes de imunoglobulina — IgG, IgA e IgM. Infecções sinopulmonares de repetição que, com o tempo, produzem <strong>bronquiectasias</strong>. Soma autoimunidade, doença granulomatosa e risco aumentado de linfoma. Tratamento com reposição de imunoglobulina.</p>
<h4>Deficiência seletiva de IgA</h4>
<p>A imunodeficiência primária <strong>mais comum de todas</strong>, e justamente por isso vira distrator: a maioria é assintomática ou leve. Não é SCID, não cursa com <em>Pneumocystis</em> nem candidíase sistêmica. O cuidado próprio dela é o risco de reação anafilática transfusional.</p>
<hr>
<h2>Vacinas de agente vivo: a lista que precisa estar de cor</h2>
<p>A contraindicação na imunodeficiência recai sobre o <strong>agente vivo atenuado</strong>, que pode causar doença em quem não consegue contê-lo. Decorar a lista resolve a questão em segundos, porque a prova monta as alternativas erradas infiltrando <strong>um</strong> item inativado no meio.</p>
<div class="tbl"><table><thead><tr><th>Vivas — contraindicadas</th><th>Inativadas — liberadas</th></tr></thead><tbody><tr><td>BCG</td><td>Pneumocócicas (10, 13, 23)</td></tr><tr><td>Poliomielite <strong>oral</strong> (VOP)</td><td>Poliomielite <strong>injetável</strong> (VIP)</td></tr><tr><td>Rotavírus</td><td>Haemophilus influenzae tipo b</td></tr><tr><td>Tríplice e tetra viral (sarampo, caxumba, rubéola, varicela)</td><td>Hepatites A e B</td></tr><tr><td>Varicela</td><td>Raiva</td></tr><tr><td>Febre amarela</td><td>Influenza injetável</td></tr><tr><td>Dengue</td><td>Coronavac e demais inativadas</td></tr></tbody></table></div>
<blockquote><p><strong>Atalho de prova:</strong> varra a alternativa procurando um inativado. Hib, Pneumo 10, hepatite A, raiva e Coronavac foram os infiltrados nas alternativas erradas deste simulado.</p></blockquote>
<hr>
<h2>Dermatite atópica: a mesma doença, duas condutas</h2>
<p>Duas questões descreveram dermatite atópica e pediram condutas diferentes. A diferença não está no diagnóstico — está em <strong>haver ou não infecção secundária</strong>.</p>
<p>O diagnóstico se monta sempre pelos mesmos elementos: início precoce, prurido como sintoma dominante, distribuição em <strong>flexuras</strong> na criança maior (face e superfícies extensoras no lactente), <strong>xerose</strong> como pele de base, piora no inverno e com banho quente, e <strong>liquenificação</strong> como marca da cronicidade. Soma-se a atopia pessoal ou familiar — asma e rinite alérgica compondo a marcha atópica —, que é o dado que o enunciado costuma plantar no fim, como se fosse detalhe.</p>
<h4>O diferencial se resolve pela topografia</h4>
<div class="tbl"><table><thead><tr><th>Diagnóstico</th><th>Onde fica</th><th>O que denuncia</th></tr></thead><tbody><tr><td><strong>Dermatite atópica</strong></td><td><strong>flexuras</strong> (cubital, poplítea)</td><td>xerose, prurido, marcha atópica, piora no inverno</td></tr><tr><td>Dermatite de contato</td><td>área exposta ao agente</td><td>o desenho da lesão copia o contactante</td></tr><tr><td>Dermatite seborreica</td><td>couro cabeludo, face, áreas sebáceas</td><td>escama gordurosa e amarelada</td></tr><tr><td>Psoríase</td><td>superfícies <strong>extensoras</strong>, joelho e cotovelo</td><td>placa eritematodescamativa com escama prateada</td></tr></tbody></table></div>
<p>Note que dermatite atópica e psoríase ocupam lados opostos da mesma articulação: a atópica na dobra, a psoríase na parte de fora. É o atalho mais rápido entre as duas.</p>
<div class="tbl"><table><thead><tr><th></th><th>Sem infecção</th><th>Com infecção (impetiginizada)</th></tr></thead><tbody><tr><td>O que se vê</td><td>eritema, prurido, escoriação</td><td><strong>crosta melicérica</strong>, exsudato, pústula</td></tr><tr><td>Barreira</td><td>emoliente, banho curto e morno, sabonete suave</td><td>igual</td></tr><tr><td>Inflamação</td><td>corticoide tópico de <strong>baixa potência</strong> na lesão ativa</td><td>igual</td></tr><tr><td>Infecção</td><td>nada</td><td><strong>antibiótico</strong> — tópico se localizada, oral se extensa</td></tr></tbody></table></div>
<p>A <strong>crosta melicérica</strong> — amarelada, cor de mel — é a assinatura do impetigo por <em>Staphylococcus aureus</em>, e é o único achado que acrescenta o antibiótico à prescrição.</p>
<p>O que <em>não</em> entra em nenhuma das duas: corticoide sistêmico em doença leve, dieta de exclusão às cegas (dermatite atópica não se trata tirando leite da dieta), sabonete bactericida e banho prolongado (pioram a barreira, que já está doente), e inibidor de calcineurina — tacrolimo e pimecrolimo são poupadores de corticoide para áreas delicadas e manutenção, <strong>não</strong> para pele infectada.</p>
<hr>
<h2>Urticária aguda e os quatro tipos de hipersensibilidade</h2>
<p>Urticária em minutos depois do alimento, na <strong>segunda</strong> exposição, sem sintoma respiratório e sem hipotensão: hipersensibilidade do <strong>tipo I</strong>. A primeira exposição sensibilizou, produzindo IgE específica que se fixou na superfície dos mastócitos; a reexposição fez a ponte entre duas moléculas de IgE e disparou a degranulação. A histamina liberada produz a pápula edematosa e o prurido.</p>
<div class="tbl"><table><thead><tr><th>Tipo</th><th>Mediador</th><th>Tempo</th><th>Exemplo</th></tr></thead><tbody><tr><td><strong>I</strong></td><td>IgE, mastócito, histamina</td><td><strong>minutos</strong></td><td>urticária alimentar, anafilaxia, asma</td></tr><tr><td><strong>II</strong></td><td>IgG/IgM contra antígeno de superfície</td><td>horas a dias</td><td>anemia hemolítica autoimune</td></tr><tr><td><strong>III</strong></td><td>imunocomplexo, complemento</td><td><strong>dias</strong></td><td>doença do soro, vasculite</td></tr><tr><td><strong>IV</strong></td><td>linfócito T, celular</td><td><strong>48 a 72 h</strong></td><td>dermatite de contato, teste tuberculínico</td></tr></tbody></table></div>
<blockquote><p><strong>O relógio resolve a questão.</strong> Minutos é tipo I; 48 a 72 horas é tipo IV; dias com artralgia e febre é tipo III. Se a alternativa oferecer bradicinina, ela está descrevendo angioedema por inibidor da ECA, que não é mecanismo imunológico nem cursa com urticária.</p></blockquote></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

function renderHeader(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var left =
    '<div style="min-width:0">' +
      '<div style="display:flex;align-items:center;gap:8px;'+mono+';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8a8578">' +
        '<a href="'+idxHref()+'" class="h-ink" style="color:#2b57cc;text-decoration:none;white-space:nowrap">\u2190 Materiais</a>' +
        '<span style="color:#d3cec4">/</span>' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(EYEBROW)+'</span>' +
      '</div>' +
      '<h1 style="margin:1px 0 0;font-family:\'Newsreader\',Georgia,serif;font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.15">'+esc(TITLE)+'</h1>' +
    '</div>';

  var right = '';
  if (S.view === 'quiz' && S.started) {
    var hit = counts().hit;
    right = '<div style="display:flex;align-items:center;gap:10px;flex-shrink:0">' +
              '<button type="button" data-act="sair" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:9px;padding:6px 11px;'+mono+';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">Sair</button>' +
              '<div style="display:flex;align-items:center;gap:6px">' +
                '<span style="'+mono+';font-size:15px;font-weight:600;letter-spacing:-.02em">'+hit+'</span>' +
                '<span style="'+mono+';font-size:11px;color:#8a8578">/ '+S.order.length+'</span>' +
              '</div></div>';
  } else if (S.view !== 'home') {
    right = '<button type="button" data-act="home" class="h-line" style="flex-shrink:0;background:none;border:1px solid #ddd8ce;border-radius:9px;padding:7px 13px;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">← Início</button>';
  }

  var html = '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:'+(S.view==='quiz'&&S.started?'10px':'2px')+'">'+left+right+'</div>';

  if (S.view === 'quiz' && S.started) {
    var c = counts();
    var rail = S.order.map(function(q,n){
      var a = S.answers[n], cur = n===S.i && !S.finished, bg = '#d3cec4';
      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';
      if (cur && a===null) bg = '#121a2b';
      var st = a===null ? 'em branco' : (a===q.correctIndex ? 'correta' : 'incorreta');
      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +
             '<span style="display:block;width:100%;border-radius:99px;transition:height .18s ease,background .18s ease,box-shadow .18s ease;height:'+(cur?'17px':'9px')+';background:'+bg+';box-shadow:'+(cur?'0 0 0 3px rgba(18,26,43,.13)':'none')+'"></span></button>';
    }).join('');
    html += '<div><div style="display:flex;align-items:center;gap:3px">'+rail+'</div>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-2px">' +
              '<div style="'+mono+';font-size:11px;letter-spacing:.04em;color:#5b6478">Questão '+pad(S.i+1)+' / '+S.order.length+'</div>' +
              '<div style="display:flex;align-items:center;gap:12px;'+mono+';font-size:10.5px;color:#8a8578">' +
                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +
              '</div></div></div>';
  }
  document.getElementById('hdr').innerHTML = html;
}
function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
