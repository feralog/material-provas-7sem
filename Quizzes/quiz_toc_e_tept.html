<script type="text/html" id="resumoSrc"><h2>Transtorno ou doença?</h2>
<p>A psiquiatria trata, na maior parte dos casos, de <em>transtornos</em>, e não de <em>doenças</em>. Doença é o conceito reservado para fenômenos com <strong>causa e efeito conhecidos e bem determinados</strong> — o exemplo clássico é a doença de Alzheimer, em que há um mecanismo definido. Já o transtorno é a <strong>resultante de múltiplos fatores psicológicos, biológicos e sociais combinados e associados</strong>; nenhuma causa única responde pelo quadro. É por isso que se fala em transtorno obsessivo-compulsivo, e não em doença obsessiva-compulsiva.</p>
<p>A obsessão é definida como uma <strong>ideia ou representação (imagem) que se impõe à consciência de modo persistente e incontrolável</strong>, apesar de ter conteúdo absurdo ou repulsivo para o indivíduo. Essa imposição gera uma luta constante: as ideias voltam de forma recorrente à consciência e o indivíduo se esforça para bani-las, produzindo um estado de angústia permanente. Três pontos da definição merecem destaque: é uma forma de pensamento (ou imagem); é um pensamento que <strong>invade</strong> — não é elaborado ativamente, como em "agora vou pensar nisso"; e seu conteúdo é percebido como absurdo ou repulsivo, o que se chama de <strong>egodistonia</strong> — uma dissonância em relação ao ego, que agride o sistema de valores do próprio paciente.</p>
<blockquote><p><strong>Ponto-chave — obsessão:</strong> os pensamentos obsessivos são intrusivos, repetitivos, indesejados, egodistônicos e associados a grande ansiedade. A origem é espontânea e circular: o pensamento invade a consciência, como no episódio do professor que, dirigindo para o plantão, foi tomado pela dúvida sobre ter desligado o fogão.</p></blockquote>
<p>Um exemplo clínico: um paciente criado em família católica tradicional passa a ser invadido pela imagem recorrente de Jesus Cristo nu — repetitiva, circular e profundamente egodistônica, com enorme culpa — e desenvolve, para compensar, o ritual de rezar determinado número de vezes para neutralizar o pensamento. Os conteúdos típicos das obsessões incluem religião, agressão, simetria, verificação, acumulação, cenas de sexo e contaminação (como a ideia constante de estar contaminado após tocar uma maçaneta).</p>
<h2>Obsessões e compulsões</h2>
<p>Diante da obsessão, a reação natural é ignorar, suprimir ou neutralizar o pensamento — o que falha, porque a origem é espontânea e circular. A estratégia mais adotada é neutralizar por meio de outros pensamentos ou ações: são as <strong>compulsões</strong>. Os atos e rituais compulsivos têm cinco características: (1) vivência frequente de desconforto subjetivo; (2) caráter egodistônico — experimentado como indesejável e contrário aos valores do paciente; (3) tentativa de resistir ou ao menos adiar o ato; (4) luta entre a compulsão e a vontade, o que não ocorre no ato impulsivo; e (5) alívio temporário ao realizar o ato, logo substituído pelo retorno do desconforto e pela urgência de repeti-lo.</p>
<p>Distinguem-se três tipos de ato pela progressão:</p>
<div class="tbl"><table><thead><tr><th>Ato</th><th>Progressão</th></tr></thead><tbody><tr><td>Volitivo</td><td>Intenção → deliberação → decisão → execução</td></tr><tr><td>Impulsivo</td><td>Intenção → execução, <strong>sem deliberação</strong></td></tr><tr><td>Compulsivo</td><td>Como o volitivo, mas com <strong>enfraquecimento da deliberação</strong> — resiste e adia, até ceder para obter alívio temporário</td></tr></tbody></table></div>
<p>A relação entre obsessão e compulsão pode ser forte ou fraca. Na <strong>relação forte (semântica)</strong>, o ato surge como tentativa direta de neutralizar a obsessão: a obsessão de mãos sujas leva à compulsão de lavá-las repetidamente, às vezes com lesões graves na pele. Na <strong>relação fraca ou indireta</strong>, a ligação é menos direta: a obsessão de ter atropelado alguém no caminho leva a voltar de carro e refazer todo o trajeto para verificar; obsessões por imagens sexuais ou religiosas repulsivas podem levar a compulsões <strong>mentais ou cognitivas</strong> — pensar na palavra "desculpa" para compensar —, sem nenhum comportamento físico visível.</p>
<h2>Etiologia e neurobiologia do TOC</h2>
<p>O TOC resulta da associação de múltiplas variáveis:</p>
<ul><li><strong>Fatores genéticos:</strong> herdabilidade alta, transtorno <strong>poligênico</strong> (sem gene único), com disfunções principalmente nas vias <strong>serotoninérgicas, glutamatérgicas e dopaminérgicas</strong> — importante para orientar o tratamento.</li><li><strong>Fatores ambientais e perinatais:</strong> tabagismo materno na gravidez, número de estressores perinatais (relação dose-dependente: quanto mais estressores, maior o risco) e exposição a experiências traumáticas ao longo da vida.</li><li><strong>Modelo neurobiológico:</strong> o circuito <strong>córtico-estriado-tálamo-cortical (CETC)</strong> funciona em alça. As regiões subcorticais (tálamo e estriado) têm ativação espontânea e inconsciente; as corticais são conscientes e fazem a inibição e filtragem dessas ativações. No TOC há <strong>hiperatividade subcortical</strong> com <strong>enfraquecimento da inibição cortical</strong> — uma região subcortical funcionando em excesso sem filtragem adequada gera os pensamentos intrusivos e obsessivos circulares.</li></ul>
<p>A psicologia descreve o <strong>reforço em cadeia</strong> que mantém o transtorno: obsessão → emoção desconfortável ou ansiedade → evitação ou compulsão → alívio transitório → repetição do ciclo. Dois traços cognitivos aumentam a suscetibilidade: a <strong>fusão pensamento-ação</strong> (thought-action fusion), em que pensar é vivenciado como fazer ou como aumento da chance real do evento — como o pai que, invadido pela obsessão de machucar o bebê recém-nascido, passa a evitar ficar sozinho com o filho por se considerar um risco real; e a <strong>intolerância à incerteza</strong>, como o amigo do professor que ligava sem parar para o pai médico que viajava: se o pai não atendia, a dúvida se convertia na certeza de que o acidente havia ocorrido.</p>
<h2>Diagnóstico do TOC</h2>
<p><strong>Epidemiologia:</strong> prevalência de cerca de <strong>3%</strong> da população geral; distribuição <strong>simétrica entre homens e mulheres (1:1)</strong>; início comum na adolescência, com <strong>mais de 50% dos casos iniciando antes dos 14 anos</strong>. É um transtorno altamente incapacitante — a paciente do ambulatório perdia empregos por se atrasar contando todas as faixas de pedestres que atravessava no trajeto.</p>
<p><strong>Critérios do DSM-5:</strong></p>
<ol><li>Presença de <strong>obsessões e/ou compulsões</strong> — geralmente ocorrem juntas, mas a presença de apenas uma é suficiente para o diagnóstico.</li><li><strong>Não há critério de tempo mínimo de evolução</strong> (como 6 meses), mas os rituais devem <strong>consumir pelo menos 1 hora por dia</strong> ou causar sofrimento e prejuízo clinicamente significativos.</li><li>Os sintomas não se devem a efeitos fisiológicos de substâncias (critério de exclusão padrão).</li><li>As manifestações não decorrem de outro transtorno mental.</li></ol>
<blockquote><p><strong>Pegadinha — hierarquia diagnóstica:</strong> obsessões que ocorrem <em>apenas</em> durante episódio de mania indicam transtorno bipolar, não TOC. Se sintomas de TOC ocorrem fora das crises, são comorbidades.</p></blockquote>
<p>O diagnóstico diferencial exige checar se o comportamento compulsivo não pertence a outro transtorno delimitado: arrancar cabelos repetidamente é <strong>tricotilomania</strong>; beliscar a pele é <strong>transtorno de escoriação (skin picking)</strong>; episódios de comer compulsivo são <strong>transtorno da compulsão alimentar (TCA)</strong>. O TOC só é diagnosticado se a compulsão não estiver relacionada a essas síndromes. Uma crítica frequente ao DSM: ele cria múltiplos diagnósticos específicos em cima de uma psicopatologia que na verdade é única — a compulsão.</p>
<h2>Tratamento do TOC</h2>
<p>O tratamento depende da gravidade, medida pela <strong>Y-BOCS (Yale-Brown Obsessive Compulsive Scale)</strong>: 10 perguntas pontuadas de 0 a 4, com total de 0 a 40.</p>
<div class="tbl"><table><thead><tr><th>Y-BOCS</th><th>Gravidade</th><th>Tratamento</th></tr></thead><tbody><tr><td>0 a 23</td><td>Leve a moderado</td><td><strong>Exclusivamente psicoterapia</strong> (TCC com exposição e prevenção de respostas — ERP)</td></tr><tr><td>A partir de 24</td><td>Grave</td><td><strong>Farmacoterapia + psicoterapia</strong>, obrigatoriamente associadas</td></tr></tbody></table></div>
<p>A psicoterapia de escolha é a <strong>TCC com ERP</strong>. O objetivo não é extinguir o pensamento obsessivo — pensamentos têm origem espontânea —, mas gerar a capacidade de <strong>refletir sobre o pensamento considerando os dados da realidade</strong>, quebrando a fusão pensamento-ação. O experimento clínico: o paciente com medo obsessivo de machucar um familiar com objeto pontiagudo segura, na sessão, a foto do familiar e o objeto, evocando o pensamento automático ("se sinto medo, sou um risco"), e o terapeuta o estimula a avaliar a realidade desse pensamento, promovendo a dessensibilização e reduzindo a carga afetiva.</p>
<p>A farmacoterapia usa <strong>ISRS</strong> com três peculiaridades:</p>
<div class="tbl"><table><thead><tr><th>Peculiaridade</th><th>Detalhe</th></tr></thead><tbody><tr><td>Doses altas</td><td>Máximas toleradas: sertralina 200 mg, fluvoxamina 300 mg, paroxetina 60 mg; progressão rápida, chegando à dose máxima em até 4 semanas</td></tr><tr><td>Resposta lenta</td><td>No TOC, esperar <strong>até 12 semanas</strong> para avaliar (na depressão e ansiedade, 4 a 6 semanas)</td></tr><tr><td>Resposta parcial</td><td>Potencializar com <strong>antipsicótico em dose baixa</strong>; se insatisfatório, trocar o antidepressivo (venlafaxina ou <strong>clomipramina</strong> — altamente eficaz, mas com perfil de efeitos colaterais mais difícil)</td></tr></tbody></table></div>
<p>O TOC é crônico, com curso oscilante entre exacerbação e remissão; apenas <strong>10 a 20%</strong> dos pacientes ficam completamente livres de sintomas ao longo da vida. Manter o tratamento em remissão por <strong>pelo menos 1 ano</strong> antes de individualizar a decisão de reduzir ou manter — pacientes costumam ter medo de suspender a medicação pelo sofrimento dos sintomas.</p>
<h2>Estresse e o circuito do medo</h2>
<p>Estresse é a <strong>resposta adaptativa do organismo às demandas impostas pelo ambiente</strong>: diante do perigo, a vivência é processada, inserida em contexto, gerando planejamento de ações e consolidação de memórias e imagens da situação de risco, com intensa resposta fisiológica autonômica (taquicardia, sudorese, tremores). No TEPT, o problema não é a reação aguda — natural em quem passou por um trauma grave —, e sim a <strong>persistência da reação de estresse</strong> por muito mais tempo que o esperado, mesmo na completa ausência do estímulo.</p>
<p>O circuito do medo é integrado:</p>
<ol><li><strong>Hipotálamo</strong> recebe as aferências sensoriais do corpo e as envia à <strong>amígdala</strong>, o centro processador do medo.</li><li><strong>Córtex órbito-frontal (COF)</strong> e <strong>córtex cingulado anterior (CCA)</strong> analisam cognitivamente as informações do ambiente para avaliar se há perigo real — uma sala de aula é segura, uma rua escura à noite é de risco.</li><li>A amígdala se conecta ao <strong>locus coeruleus</strong> (neurônios noradrenérgicos), disparando o <strong>sistema nervoso simpático</strong> — aumento da frequência cardíaca e da pressão arterial.</li><li>A amígdala ativa o <strong>eixo HPA (hipotálamo-hipófise-suprarrenal)</strong>, com liberação maciça de <strong>cortisol</strong> e glicose para a reação de luta ou fuga.</li><li>A amígdala interage com o <strong>hipocampo</strong>, responsável pela formação, consolidação e contextualização das memórias baseadas em experiências prévias.</li></ol>
<p>No TEPT, o circuito está gravemente distorcido: <strong>hiperatividade noradrenérgica persistente</strong>, ativação crônica do eixo HPA com <strong>hipercortisolemia</strong> e <strong>disfunção gabaérgica e glutamatérgica no hipocampo</strong>, que prejudica a consolidação e a contextualização da memória do trauma.</p>
<blockquote><p><strong>Ponto-chave — a vivência do trauma:</strong> como o hipocampo falha em catalogar a experiência como evento do passado, o trauma é vivido como se estivesse acontecendo no presente o tempo todo. Ele não se integra à biografia do paciente e se atualiza constantemente na consciência, na forma de revivescências.</p></blockquote>
<h2>Epidemiologia e fatores de risco do TEPT</h2>
<p>No Brasil, a prevalência de exposição a eventos traumáticos ao longo da vida é de <strong>86%</strong>, sendo <strong>60% decorrente de violência urbana</strong>. Das pessoas expostas, <strong>10 a 20% desenvolvem a sintomatologia de TEPT</strong>, gerando prevalência de cerca de <strong>7% na população geral</strong> — mais que o dobro do TOC. No Brasil, o TEPT é mais prevalente em <strong>mulheres</strong> (forte correlação com violência interpessoal e sexual); dados internacionais podem apontar o sexo masculino por exposição à guerra. Grupos mais vulneráveis: jovens, minorias identitárias, moradores de áreas de conflito e agentes de segurança pública.</p>
<p>Os fatores de risco se classificam em três grupos:</p>
<ul><li><strong>Pré-traumáticos:</strong> genética; psicopatologia prévia; baixo nível socioeconômico; <strong>experiências adversas na infância</strong> — crianças expostas à violência têm alteração persistente do eixo HPA, predispondo à hipercortisolemia e ao TEPT na vida adulta (epigenética); <strong>padrão de apego</strong>.</li><li><strong>Traumáticos:</strong> natureza do evento — traumas sexuais e abusos na infância têm altíssima taxa de conversão para TEPT; gravidade física — traumatismo cranioencefálico (TCE) e desfiguração corporal.</li><li><strong>Pós-traumáticos:</strong> perdas significativas decorrentes do evento (morte de familiares no mesmo acidente); estratégias de enfrentamento inadequadas; avaliação negativa e sentimento de culpa sobre o próprio trauma.</li></ul>
<p>Pela <strong>teoria do apego de John Bowlby</strong>, o apego seguro — pais que estimulam a exploração e servem de porto seguro — protege. O <strong>apego inseguro ou desorganizado</strong> — pais ausentes ou a própria fonte de agressão, em que a figura que deveria cuidar é a que agride — gera desorganização na modulação do estresse e aumenta drasticamente o risco de transtornos psiquiátricos e TEPT na vida adulta.</p>
<h2>Diagnóstico e tratamento do TEPT</h2>
<p>O <strong>Critério A (exposição)</strong> do DSM-5 exige exposição à morte real ou ameaça de morte, lesão grave ou violência sexual por: experiência direta; presenciar o evento ocorrendo com outros; saber que ocorreu com familiar ou amigo próximo; ou exposição repetida a detalhes aversivos (profissionais de resgate).</p>
<p>A tríade clássica de sintomas:</p>
<div class="tbl"><table><thead><tr><th>Dimensão</th><th>Manifestações</th></tr></thead><tbody><tr><td><strong>Intrusão (revivescência)</strong></td><td>Lembranças intrusivas e angustiantes; pesadelos repetitivos; <strong>flashbacks</strong> — reações dissociativas em que o indivíduo sente ou age como se o evento ocorresse no presente (o protagonista do Sniper Americano ataca o cachorro da família após um flashback de guerra)</td></tr><tr><td><strong>Evitação</strong></td><td>Esforço persistente para evitar lembranças, pensamentos, sentimentos ou estímulos externos associados ao trauma — a paciente que, após a irmã morrer atropelada por um ônibus, evita sair de casa e entra em pânico ao ver qualquer ônibus</td></tr><tr><td><strong>Hiperreatividade</strong></td><td>Irritabilidade, surtos de raiva, comportamento agressivo, hipervigilância constante, resposta de sobressalto exagerada, problemas de concentração e insônia</td></tr></tbody></table></div>
<p><strong>Critério temporal e especificadores:</strong> os sintomas devem durar <strong>pelo menos 1 mês</strong>; no primeiro mês pós-trauma, o diagnóstico é de <strong>reação aguda ao estresse</strong>, não TEPT. O <strong>início tardio</strong> é especificado quando os sintomas aparecem apenas <strong>6 meses ou mais</strong> após o evento. Alguns pacientes bloqueiam e esquecem o evento traumático — <strong>amnésia dissociativa</strong>, mecanismo de defesa: o trauma não degradado nem integrado à biografia mantém risco altíssimo de emergir como TEPT posteriormente.</p>
<blockquote><p><strong>Pegadinha — regra de ouro do pronto-socorro:</strong> <strong>não prescrever benzodiazepínicos</strong> (diazepam, clonazepam) para vítimas agudamente traumatizadas. Eles reduzem a capacidade do cérebro de processar e consolidar a memória do trauma, impedem a degradação natural do estresse e <strong>aumentam o risco de TEPT a longo prazo</strong>. Se o paciente precisar de sedação, usar alternativas como <strong>quetiapina</strong> em dose baixa.</p></blockquote>
<p><strong>Tratamento:</strong> para as sociedades médicas, o padrão-ouro é a <strong>psicoterapia</strong>. A <strong>terapia de exposição</strong> dessensibiliza o paciente, ajudando-o a narrar o evento e integrar a memória à biografia — com alta taxa de abandono, porque reviver o trauma é doloroso; muitos acham mais fácil escrever do que falar sobre o trauma. O <strong>EMDR</strong> (dessensibilização e reprocessamento por movimentos oculares) tem forte evidência: pautado na teoria de que é no sono REM que consolidamos memórias, o terapeuta faz o paciente narrar o trauma com <strong>estimulações bilaterais dos olhos</strong>, recalibrando a carga afetiva da memória. A farmacoterapia tem menos evidência, mas é utilizada: ISRS (<strong>sertralina, citalopram, venlafaxina</strong>); para insônia grave associada, <strong>mirtazapina</strong> ou antipsicóticos atípicos em baixas doses. Em estudo: alfa-agonistas (doxazosina, prazosina) para pesadelos e reatividade autonômica, e beta-bloqueadores (propranolol) como tentativa preventiva na emergência — ambos com dados conflitantes e sem recomendação formal de uso rotineiro.</p>
<p><strong>Curso clínico:</strong> sem tratamento, a resolução espontânea dos sintomas leva em média <strong>64 meses</strong>; com tratamento adequado, <strong>36 meses</strong>. Diferente do TOC, <strong>o TEPT tem cura</strong>.</p></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +
      '</button>';
  }).join('');

  var expl = reveal ? '<div style="margin-top:20px;padding:16px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;animation:qFade .26s ease">' +
      '<div style="'+mono+';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:8px">Por quê</div>' +
      '<p style="margin:0;font-size:14.5px;line-height:1.68;color:#39404f;text-wrap:pretty">'+esc(q.explanation)+'</p></div>' : '';

  var blank = counts().blank;
  var warn = S.warn ? '<div style="margin-top:14px;padding:15px 17px;background:#fdf7e9;border:1px solid #e8d5a3;border-radius:14px;animation:qFade .22s ease">' +
      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +

function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';
  if (pct>=90)      { title='Domínio sólido';   msg='Desempenho excelente. Confira as explicações das que escaparam e siga em frente.'; }
  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

  var stat = function(v,l,color){
    return '<div style="background:#faf9f6;padding:14px 10px">' +

    }
    return '<div style="background:#fff;border:1px solid '+(open?'#c9c3b6':'#e4e0d8')+';border-radius:14px;overflow:hidden;transition:border-color .15s ease">' +

        '<span style="flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:12px;font-weight:600;background:'+numBg+';color:'+numFg+'">'+pad(r.idx+1)+'</span>' +
        '<span style="flex:1;min-width:0;font-size:14px;line-height:1.45;color:#39404f;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(r.q.question)+'</span>' +

  document.getElementById('stage').innerHTML =

      '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:14px">Resultado</div>' +
      '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:36px;line-height:1.12;font-weight:400;letter-spacing:-.025em;margin:0 0 8px">'+title+'</h2>' +
      '<p style="font-size:15px;line-height:1.6;color:#5b6478;margin:0 0 24px;max-width:48ch;text-wrap:pretty">'+msg+'</p>' +
      '<div style="height:8px;border-radius:99px;background:#e4e0d8;overflow:hidden;margin-bottom:10px">' +
        '<div style="height:100%;border-radius:99px;background:#121a2b;transition:width .7s cubic-bezier(.22,1,.36,1);width:'+pct+'%"></div></div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e4e0d8;border:1px solid #e4e0d8;border-radius:14px;overflow:hidden;margin-bottom:34px">' +
        stat(c.hit,'Certas','#2e7d55')+stat(c.miss,'Erradas','#c04437')+stat(c.blank,'Branco','#8a8578')+stat(pct+'%','Aproveit.','#2b57cc') +
      '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px">' +
        '<h3 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;font-weight:500;letter-spacing:-.015em;margin:0">Gabarito comentado</h3>' +
        '<button type="button" data-act="toggleAll" class="h-ink" style="background:none;border:0;padding:6px 0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;text-decoration:underline;text-underline-offset:3px">'+(allOpen?'Recolher tudo':'Expandir tudo')+'</button>' +
      '</div>' +
      '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">'+filters+'</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">'+cards+'</div>' +
      (list.length===0 ? '<div style="padding:38px 16px;text-align:center;color:#8a8578;font-size:14px;border:1px dashed #ddd8ce;border-radius:14px">Nenhuma questão neste filtro.</div>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:28px;padding-top:24px;border-top:1px solid #e4e0d8">' +
        '<button type="button" data-act="restart" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:13px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">Refazer o quiz</button>' +
        '<button type="button" data-act="back" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Voltar às questões</button>' +
        '<button type="button" data-act="resumo" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Ler o resumo</button>' +

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;white-space:pre-wrap;' +
    'text-wrap:pretty">' + esc(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'white-space:pre-wrap;text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.textContent = txt;
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
