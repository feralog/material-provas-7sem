<script type="text/html" id="resumoSrc"><h2>Panorama: carga da doença, epidemiologia e o atraso diagnóstico</h2>
<p>O transtorno bipolar (TB) é um transtorno mental crônico do humor, caracterizado pela alternância entre episódios de elevação do humor — mania ou hipomania — e episódios depressivos. Está entre as <strong>dez principais causas de incapacidade</strong> no mundo e entre as principais causas de anos de vida ajustados por incapacidade em adultos jovens, faixa etária em que o quadro costuma se instalar.</p>
<p>O peso do transtorno se mede sobretudo pela mortalidade. Pessoas com TB têm risco de morte por suicídio <strong>20 a 30 vezes maior</strong> que o da população geral, e o transtorno pode responder por até <strong>um quarto de todos os suicídios</strong>. A expectativa de vida é reduzida em cerca de <strong>nove anos</strong>, e a explicação não é apenas o suicídio: há aumento da mortalidade por <strong>doenças cardiovasculares</strong>, ligado à alta prevalência de síndrome metabólica nessa população. É por isso que peso, pressão arterial, glicemia e perfil lipídico entram no seguimento de rotina, e não como extras.</p>
<h4>Números de prevalência</h4>
<ul><li><strong>Mundo:</strong> 2,4% ao longo da vida — 0,6% tipo I, 0,4% tipo II e 1,4% de quadro subsindrômico.</li><li><strong>Brasil:</strong> 2,1% ao longo da vida — 0,9% tipo I e 0,2% tipo II.</li><li>O quadro <strong>subsindrômico é mais prevalente que qualquer um dos dois subtipos completos</strong>.</li></ul>
<p>O início é precoce: <strong>mais de 70% dos pacientes</strong> têm o primeiro episódio de humor <strong>antes dos 25 anos</strong>. Em coorte de pacientes com até cinco anos de doença, 69% iniciaram antes dos 23 anos, 22% entre 24 e 37 anos e apenas 9% depois dos 38 anos.</p>
<blockquote><p><strong>Pegadinha de prova — o atraso diagnóstico.</strong> Há um intervalo médio de <strong>dez anos</strong> entre os primeiros sintomas e o diagnóstico formal, e apenas <strong>20%</strong> dos pacientes que buscam tratamento durante um episódio depressivo bipolar recebem o diagnóstico correto no primeiro ano. O erro típico é rotular o quadro como depressão unipolar — e tratar com antidepressivo em monoterapia. A demora no diagnóstico associa-se a pior prognóstico, mais refratariedade e mais prejuízo cognitivo.</p></blockquote>
<p>Outro dado que explica esse erro: em seguimento prospectivo, os pacientes passam <strong>cerca de metade do tempo sintomáticos</strong> (46,6% no tipo I e 55,8% no tipo II), e os sintomas depressivos predominam largamente sobre os de mania ou hipomania — razão de <strong>3:1 no tipo I</strong> e de <strong>37:1 no tipo II</strong>. O paciente bipolar chega ao consultório deprimido, não eufórico.</p>
<hr>
<h2>Os episódios de humor: mania, hipomania e depressão</h2>
<p>Todo o diagnóstico do TB se apoia na identificação correta do tipo de episódio de elevação do humor. <strong>Duração e prejuízo funcional são o divisor</strong>, e é exatamente aí que a prova costuma cobrar.</p>
<div class="tbl"><table><thead><tr><th></th><th>Mania</th><th>Hipomania</th><th>Episódio depressivo</th></tr></thead><tbody><tr><td><strong>Duração mínima</strong></td><td>7 dias (ou qualquer duração, se houver internação)</td><td>4 dias consecutivos</td><td>2 semanas</td></tr><tr><td><strong>Humor</strong></td><td>elevado, expansivo ou irritável, persistente</td><td>elevado, expansivo ou irritável, persistente</td><td>deprimido e/ou anedonia</td></tr><tr><td><strong>Prejuízo funcional</strong></td><td><strong>marcante</strong> — social, ocupacional ou familiar</td><td><strong>ausente ou leve</strong>; a mudança é notada por terceiros</td><td>variável, em geral presente</td></tr><tr><td><strong>Internação</strong></td><td>pode ser necessária; se ocorrer, define mania</td><td><strong>exclui</strong> hipomania</td><td>pode ocorrer</td></tr><tr><td><strong>Sintomas psicóticos</strong></td><td>presentes em <strong>cerca de 50%</strong> dos casos</td><td><strong>excluem</strong> hipomania</td><td>podem ocorrer</td></tr><tr><td><strong>Define qual subtipo</strong></td><td>tipo I</td><td>tipo II (com episódio depressivo)</td><td>nenhum, isoladamente</td></tr></tbody></table></div>
<p>Os sintomas centrais da elevação do humor são os mesmos nas duas formas: redução da necessidade de sono (dorme pouco e não se sente cansado), aumento da fala e pressão para falar, fuga de ideias e pensamento acelerado, grandiosidade ou autoestima inflada, distratibilidade, aumento da atividade dirigida a objetivos ou agitação psicomotora, e envolvimento em atividades de risco — gastos excessivos, indiscrições sexuais, investimentos impulsivos.</p>
<blockquote><p><strong>O divisor prático.</strong> Não é a intensidade da euforia que separa mania de hipomania: é a <strong>duração (7 versus 4 dias)</strong> e, sobretudo, a <strong>repercussão funcional</strong>. Internação, psicose ou prejuízo funcional marcante convertem o episódio em mania — e, portanto, o paciente em tipo I — mesmo que o quadro tenha durado só três dias.</p></blockquote>
<h4>Especificadores que mudam a conduta</h4>
<ul><li><strong>Com características mistas:</strong> sintomas do polo oposto presentes ao mesmo tempo. Marcador de <strong>gravidade e de risco de suicídio</strong> — a avaliação de comportamentos de risco deve buscar especificamente características mistas, agitação psicomotora e heteroagressividade. Na depressão bipolar com características mistas, a <strong>lurasidona</strong> é a escolha; antidepressivos "puros" como sertralina e venlafaxina ficam <strong>contraindicados</strong>.</li><li><strong>Ciclagem rápida:</strong> quatro ou mais episódios de humor em doze meses. Está presente em <strong>cerca de um terço dos casos de tipo I</strong> e associa-se a trauma infantil, a pior resposta ao tratamento e a maior refratariedade.</li></ul>
<hr>
<h2>Os subtipos: tipo I, tipo II e transtorno ciclotímico</h2>
<div class="tbl"><table><thead><tr><th>Subtipo</th><th>Exige ao longo da vida</th><th>Observação</th></tr></thead><tbody><tr><td><strong>Tipo I</strong></td><td>pelo menos <strong>um episódio maníaco</strong></td><td>o episódio depressivo pode ter ocorrido ou não — não é exigido</td></tr><tr><td><strong>Tipo II</strong></td><td>pelo menos <strong>um episódio hipomaníaco E um episódio depressivo</strong></td><td>a presença de qualquer episódio maníaco reclassifica para tipo I</td></tr><tr><td><strong>Ciclotimia</strong></td><td><strong>2 anos</strong> (1 ano em crianças e adolescentes) de períodos com sintomas hipomaníacos e depressivos</td><td>esses períodos <strong>nunca</strong> fecham critérios completos de mania, hipomania ou depressão maior</td></tr></tbody></table></div>
<blockquote><p><strong>Tipo I × tipo II — a confusão mais comum.</strong> O tipo I <strong>não</strong> exige depressão: um único episódio maníaco basta. O tipo II <strong>exige as duas coisas</strong> — hipomania mais depressão. E o tipo II não é uma "forma leve": os pacientes passam mais tempo sintomáticos (55,8% contra 46,6%), com predomínio depressivo de 37:1, e carregam mais comorbidades. O que muda entre eles é a gravidade do polo maníaco, não a gravidade da doença.</p></blockquote>
<hr>
<h2>Diagnóstico diferencial</h2>
<h3>Transtorno depressivo maior (depressão unipolar)</h3>
<p>É o diferencial mais importante e o erro mais frequente, porque o paciente bipolar procura atendimento em fase depressiva.</p>
<div class="tbl"><table><thead><tr><th></th><th>Aponta para <strong>bipolaridade</strong></th><th>Aponta para <strong>unipolaridade</strong></th></tr></thead><tbody><tr><td><strong>Sintomatologia</strong></td><td>hipersonia; hiperfagia ou ganho de peso; retardo ou agitação psicomotora; sintomas psicóticos; culpa patológica; labilidade do humor; irritabilidade; pensamento acelerado</td><td>insônia inicial ou sono reduzido; perda de apetite ou de peso; nível de atividade normal; queixas somáticas</td></tr><tr><td><strong>Curso da doença</strong></td><td>primeiro episódio depressivo <strong>antes dos 25 anos</strong>; múltiplos episódios</td><td>primeiro episódio depressivo <strong>depois dos 25 anos</strong>; episódio atual de longa duração</td></tr><tr><td><strong>História familiar</strong></td><td><strong>positiva</strong> para bipolaridade</td><td><strong>negativa</strong> para bipolaridade</td></tr></tbody></table></div>
<p>Em resumo: depressão <strong>atípica</strong> (dorme muito, come muito), <strong>precoce</strong>, <strong>recorrente</strong>, com <strong>psicose</strong> ou <strong>história familiar positiva</strong> deve acender o alerta de bipolaridade antes de qualquer prescrição de antidepressivo.</p>
<h3>Transtorno de déficit de atenção/hiperatividade</h3>
<div class="tbl"><table><thead><tr><th>Sintoma</th><th>Mania</th><th>TDAH</th></tr></thead><tbody><tr><td><strong>Elação</strong></td><td>episódica, prolongada e inapropriada</td><td>se presente, <strong>não é episódica</strong></td></tr><tr><td><strong>Irritabilidade</strong></td><td>episódica e prolongada</td><td>pode ser sintoma relacionado</td></tr><tr><td><strong>Sono</strong></td><td><strong>necessidade de sono reduzida</strong></td><td>insônia</td></tr><tr><td><strong>Grandiosidade</strong></td><td>aumento não característico de confiança ou autoimportância</td><td>não é sintoma ou característica comum</td></tr><tr><td><strong>Hiperatividade e distratibilidade</strong></td><td>episódicas</td><td>fazem parte dos critérios diagnósticos, mas <strong>não são episódicas</strong></td></tr></tbody></table></div>
<p>A chave é a palavra <strong>episódico</strong>: no TDAH os sintomas são um traço estável desde a infância; na mania, uma mudança nítida em relação ao funcionamento habitual.</p>
<h3>Outros diferenciais</h3>
<ul><li><strong>Transtorno da personalidade borderline:</strong> labilidade do humor e impulsividade são comuns às duas condições. Para o TB, os sintomas devem representar um <strong>episódio distinto</strong>, com aumento notável em relação ao comportamento habitual. Regra de ouro: <strong>não se firma diagnóstico de transtorno da personalidade durante um episódio de humor não tratado.</strong></li><li><strong>Transtorno por uso de substâncias:</strong> o diagnóstico primário de TB deve ser estabelecido com base nos sintomas que <strong>persistem depois</strong> que as substâncias não estão mais sendo usadas.</li><li><strong>Transtorno de ansiedade generalizada:</strong> ruminações ansiosas podem ser confundidas com pensamento acelerado, e a tentativa de aliviar a ansiedade pode parecer impulsividade. Novamente, a <strong>natureza episódica</strong> resolve.</li><li><strong>Outros:</strong> TEPT, transtorno de pânico e quadros com irritabilidade acentuada.</li></ul>
<hr>
<h2>Comorbidades, fatores de risco e curso longitudinal</h2>
<h3>Comorbidades</h3>
<ul><li><strong>Tipo I:</strong> transtornos de ansiedade em cerca de <strong>três quartos</strong> dos pacientes. Transtorno por uso de substâncias em <strong>mais da metade</strong>; mais da metade tem transtorno por uso de álcool, e a associação álcool mais TB confere <strong>grande risco de tentativa de suicídio</strong>. Síndrome metabólica e enxaqueca são mais comuns que na população geral.</li><li><strong>Tipo II:</strong> cerca de <strong>60%</strong> têm três ou mais transtornos comórbidos; <strong>75%</strong> têm transtorno de ansiedade; <strong>37%</strong>, transtorno por uso de substâncias; <strong>15%</strong> têm algum transtorno alimentar ao longo da vida, sendo a compulsão alimentar mais comum que bulimia e anorexia. Em crianças e adolescentes, a ansiedade costuma <strong>preceder</strong> o quadro bipolar.</li></ul>
<h3>Fatores de risco genéticos</h3>
<p>A história familiar é o fator de risco mais consistente: risco em média <strong>dez vezes maior</strong> entre parentes adultos de pessoas com TB tipo I e II, com magnitude crescente conforme o grau de parentesco. A herdabilidade genética estimada é de <strong>58%</strong>, e a concordância entre <strong>gêmeos monozigóticos</strong>, de <strong>40 a 80%</strong>. Estudos de associação genômica ampla apontaram genes como <strong>CACNA1C</strong> (subunidade alfa do canal de cálcio tipo L), <strong>NCAN</strong> (neurocan) e <strong>ODZ4</strong> (teneurinas); cerca de 38% da variância fenotípica viria do efeito cumulativo de muitos alelos comuns de pequeno efeito. Há <strong>sobreposição de suscetibilidade genética entre bipolaridade e esquizofrenia</strong>.</p>
<h3>Fatores de risco ambientais</h3>
<ul><li><strong>Trauma precoce:</strong> relatado <strong>2,63 vezes</strong> mais que por indivíduos saudáveis. Quem sofreu trauma infantil tem primeiro episódio mais precoce, mais ciclagem rápida e quadro mais grave. Abuso sexual e emocional afetam memória visual e verbal, fluência verbal e flexibilidade cognitiva.</li><li><strong>Fatores pré e perinatais:</strong> parto cesáreo, infecção materna na gestação, tabagismo materno e idade paterna elevada. Circunferência craniana menor que 32 cm aumenta em <strong>5,4 vezes</strong> a chance de TB na vida adulta.</li><li><strong>Substâncias:</strong> transtorno por uso de álcool multiplica por <strong>4,1</strong> a chance de TB; qualquer droga ilícita, por <strong>5</strong>. O uso de cocaína é preditor de <strong>conversão de depressão unipolar para TB</strong> (razão de chance 3,41).</li></ul>
<h3>Curso longitudinal e neuroprogressão</h3>
<p>O modelo desenvolvimental de Duffy descreve quatro estágios antes do diagnóstico formal: (1) ansiedade, problemas de sono, dificuldades de aprendizagem e TDAH; (2) sintomas depressivos inespecíficos — apatia, anedonia, distimia, ciclotimia; (3) depressão maior com episódio único, já com declínio funcional perceptível; (4) o quadro característico, com episódios maníacos e/ou hipomaníacos.</p>
<p>Depois do diagnóstico, o modelo de <strong>estadiamento/neuroprogressão</strong> descreve três estágios clínicos:</p>
<ol><li>risco aumentado por história familiar e sintomas subsindrômicos preditivos de conversão;</li><li>poucos episódios, com funcionamento normal nos períodos interepisódicos;</li><li>episódios recorrentes, com <strong>declínio no funcionamento e na cognição</strong>.</li></ol>
<blockquote><p><strong>Por que importa tratar cedo.</strong> Cada novo episódio aumenta o risco de novos episódios, a gravidade dos sintomas, a duração dos quadros agudos e a refratariedade — e reduz o limiar para recorrer. O número de episódios associa-se a prejuízo funcional e cognitivo e a maior risco de demência a longo prazo. Esse curso progressivo, porém, <strong>não é universal</strong>: um subgrupo mantém desempenho cognitivo semelhante ao de indivíduos saudáveis, e o que distingue os subgrupos são anos de estudo, número de hospitalizações e idade.</p></blockquote>
<hr>
<h2>Princípios gerais do tratamento e avaliação inicial</h2>
<p>O tratamento farmacológico é organizado por <strong>fase da doença</strong> — depressão, mania ou manutenção — e por <strong>nível de evidência</strong> (níveis 1 a 4, do mais forte ao mais fraco). A primeira decisão clínica é identificar em que fase o paciente está; só depois se escolhe o fármaco.</p>
<h4>Exames complementares na primeira avaliação</h4>
<ul><li>Hemograma completo com plaquetas; enzimas hepáticas; bilirrubinas; tempo de protrombina e de tromboplastina parcial ativada.</li><li>Glicemia de jejum e hemoglobina glicada; colesterol total, HDL e LDL; triglicerídeos.</li><li>Eletrólitos e cálcio; urinálise; <strong>creatinina sérica com estimativa da taxa de filtração glomerular</strong>; <strong>TSH</strong>.</li><li>Peso, altura com cálculo do IMC e pressão arterial.</li><li>Eletrocardiograma se acima de 40 anos ou por indicação clínica; toxicológico de urina se houver suspeita de uso de substâncias; teste de gravidez em mulheres em idade reprodutiva; prolactina se em uso de fármaco com esse efeito adverso.</li><li><strong>Nível sérico</strong> de lítio, ácido valproico/valproato e carbamazepina.</li></ul>
<h4>O roteiro antes de prescrever</h4>
<ul><li><strong>Avaliar:</strong> comportamentos de risco (risco de suicídio, com atenção a características mistas, agitação psicomotora e heteroagressividade); grau de insight; capacidade de aderir ao tratamento; suporte psicossocial.</li><li><strong>Revisar status de medicação:</strong> níveis séricos e adesão.</li><li><strong>Revisar sintomas secundários:</strong> medicamentos em uso, comorbidades psiquiátricas, uso de substâncias e outras condições médicas.</li></ul>
<blockquote><p><strong>Na mania, a conduta extra é decisiva: antidepressivos e estimulantes devem ser descontinuados.</strong> Na depressão, o roteiro acrescenta avaliar uso de nicotina, cafeína e álcool, e reintroduzir medicação se a recaída depressiva coincidir com descontinuação recente.</p></blockquote>
<p>Em todas as fases, o algoritmo é o mesmo: princípios gerais → <strong>iniciar ou otimizar</strong> o tratamento de primeira linha → <strong>adicionar ou trocar</strong> por outro de primeira linha → segunda linha → terceira linha.</p>
<hr>
<h2>Tratamento das fases agudas: depressão e mania</h2>
<h3>Depressão bipolar tipo I</h3>
<div class="tbl"><table><thead><tr><th>Linha</th><th>Opções</th><th>Observações</th></tr></thead><tbody><tr><td><strong>Primeira</strong></td><td>quetiapina (N1); lurasidona + Li/AVP (N1); lítio (N2); lamotrigina (N2); lurasidona (N2)</td><td>quetiapina e lítio com tolerabilidade moderada; cautela com AVP em mulheres férteis</td></tr><tr><td><strong>Segunda</strong></td><td>cariprazina (N1); <strong>ISRS/bupropiona (N1)</strong>; AVP (N2); olanzapina + fluoxetina (N2); ECT (N4)</td><td><strong>ISRS e bupropiona carregam risco de virada maníaca</strong>; olanzapina + fluoxetina tem efeitos colaterais de alto impacto</td></tr><tr><td><strong>Terceira</strong></td><td>carbamazepina, modafinil, rTMS, EPA, cetamina EV, levotiroxina, pramipexol, olanzapina, IRSN/iMAO</td><td>em grande parte adjuvantes, com evidência fraca</td></tr></tbody></table></div>
<blockquote><p><strong>A virada maníaca.</strong> Antidepressivo <strong>em monoterapia</strong> não é conduta aceitável no transtorno bipolar: ISRS e bupropiona só aparecem como segunda linha e sempre associados a um estabilizador, justamente pelo risco de virada. Diante de <strong>ciclagem rápida</strong>, a recomendação é ainda mais dura — <strong>excluir antidepressivos do esquema</strong>. Esse é o motivo pelo qual diagnosticar bipolaridade antes de tratar a depressão muda o desfecho.</p></blockquote>
<p><strong>Características clínicas que orientam a escolha:</strong> resposta rápida → quetiapina, lurasidona, olanzapina + fluoxetina, cariprazina ou ECT; cognição depressiva → lamotrigina ou lurasidona; ansiedade → quetiapina, lurasidona ou olanzapina + fluoxetina; <strong>características mistas → lurasidona</strong>; melancolia → ECT; depressão anérgica → tranilcipromina + lítio; sintomas psicóticos → antipsicótico atípico associado ou ECT; casos refratários → associar <strong>clozapina</strong>.</p>
<p><strong>Depressão no tipo II:</strong> a <strong>quetiapina é a única opção de primeira linha</strong> (N1). Na segunda linha entram lítio, lamotrigina, bupropiona adjuvante, ECT e — apenas na depressão "pura", sem características mistas — sertralina e venlafaxina.</p>
<h3>Episódio maníaco</h3>
<div class="tbl"><table><thead><tr><th>Linha</th><th>Opções</th></tr></thead><tbody><tr><td><strong>Primeira — monoterapia</strong></td><td><strong>lítio, quetiapina, ácido valproico (AVP), asenapina, aripiprazol, paliperidona, risperidona, cariprazina</strong> — todos N1</td></tr><tr><td><strong>Primeira — combinação</strong></td><td>quetiapina + Li/AVP; risperidona + Li/AVP (N1); aripiprazol + Li/AVP; asenapina + Li/AVP (N2)</td></tr><tr><td><strong>Segunda</strong></td><td>olanzapina, carbamazepina, ziprasidona, haloperidol (N1); olanzapina + Li/AVP (N1); lítio + AVP, ECT (N3)</td></tr><tr><td><strong>Terceira</strong></td><td>clorpromazina, clonazepam, tamoxifeno, haloperidol + Li/AVP (N2); carbamazepina/oxcarbazepina + Li/AVP, rTMS (N3); <strong>clozapina (N4)</strong></td></tr></tbody></table></div>
<p>Note o que <strong>não</strong> está na primeira linha: lamotrigina (é de manutenção, não trata mania), clonazepam, clorpromazina e clozapina. E antidepressivo nenhum.</p>
<p><strong>Características clínicas que orientam a escolha:</strong> ansiedade → AVP, quetiapina, olanzapina ou carbamazepina; <strong>características mistas → AVP ou antipsicótico atípico</strong>; <strong>sintomas psicóticos (presentes em 50% dos pacientes em mania) → associar antipsicótico atípico</strong>; <strong>ciclagem rápida (presente em 1/3 dos casos de tipo I) → tratar hipotireoidismo, excluir antidepressivos, tratar uso de substâncias e, se necessário, combinar fármacos</strong>; casos refratários → associar clozapina.</p>
<div class="tbl"><table><thead><tr><th>Lítio</th><th>Ácido valproico</th><th>Carbamazepina</th></tr></thead><tbody><tr><td><strong>mania clássica</strong> (eufórica)</td><td>mania <strong>clássica, disfórica ou com humor predominantemente irritado</strong></td><td><strong>história familiar negativa</strong> de TB em parentes de primeiro grau</td></tr><tr><td><strong>poucos episódios</strong> de humor</td><td><strong>múltiplos episódios</strong> de humor</td><td>quadro <strong>esquizoafetivo</strong> com delírios incongruentes com o humor</td></tr><tr><td><strong>história familiar positiva</strong></td><td>comorbidade com ansiedade ou uso de substâncias; <strong>traumatismo cranioencefálico</strong></td><td>comorbidade com ansiedade ou uso de substâncias; traumatismo cranioencefálico</td></tr></tbody></table></div>
<blockquote><p><strong>Hipomania.</strong> Não há esquema próprio: a experiência clínica indica que os <strong>tratamentos da mania são eficazes para os quadros de hipomania</strong>. O que muda é a urgência e, com frequência, a possibilidade de manejo ambulatorial.</p></blockquote>
<hr>
<h2>Manutenção, casos refratários e psicoeducação</h2>
<h3>Fase de manutenção</h3>
<p>A escolha do fármaco de manutenção leva em conta a resposta a medicamentos usados antes, a <strong>polaridade predominante</strong> dos episódios agudos e as comorbidades com substâncias e ansiedade. Regra prática: se o paciente respondeu bem, na fase aguda, a um fármaco que também é de primeira linha na manutenção, <strong>mantém-se esse fármaco</strong>.</p>
<div class="tbl"><table><thead><tr><th>Fármaco</th><th>Perfil clínico que o favorece</th></tr></thead><tbody><tr><td><strong>Lítio</strong></td><td>apresentação clínica <strong>típica</strong>; <strong>história familiar</strong> de bipolaridade; <strong>sem</strong> comorbidade com uso de substâncias ou ansiedade</td></tr><tr><td><strong>Quetiapina</strong></td><td>episódios com <strong>características mistas</strong></td></tr><tr><td><strong>Lamotrigina</strong></td><td><strong>polaridade depressiva predominante</strong></td></tr><tr><td><strong>Carbamazepina</strong></td><td>doença <strong>atípica</strong>; transtorno bipolar <strong>tipo II</strong>; transtorno <strong>esquizoafetivo</strong></td></tr></tbody></table></div>
<p>Primeira linha na manutenção: lítio, quetiapina, AVP e <strong>lamotrigina</strong> (todos N1), asenapina, aripiprazol (inclusive de administração mensal) e as combinações quetiapina + Li/AVP e aripiprazol + Li/AVP. Segunda linha: olanzapina, risperidona de depósito, carbamazepina, paliperidona e combinações com lurasidona ou ziprasidona. <strong>Manutenção no tipo II:</strong> quetiapina (N1), lítio e lamotrigina (N2) na primeira linha; venlafaxina na segunda; carbamazepina, AVP, escitalopram, fluoxetina e risperidona na terceira.</p>
<h4>Monitorização do lítio</h4>
<p>O lítio tem <strong>janela terapêutica estreita</strong> (litemia de referência em torno de 0,6 a 1,2 mEq/L) e toxicidade renal e tireoidiana. O seguimento exige, portanto:</p>
<ul><li><strong>litemia</strong> periódica e sempre que houver mudança de dose, desidratação, uso de diurético, AINE ou IECA;</li><li><strong>creatinina sérica com estimativa da taxa de filtração glomerular</strong>;</li><li><strong>TSH</strong>, pelo risco de hipotireoidismo induzido — que, aliás, é uma das causas reversíveis de ciclagem rápida.</li></ul>
<blockquote><p><strong>Não confunda as monitorizações.</strong> Litemia, creatinina e TSH são do <strong>lítio</strong>. <strong>Hemograma seriado</strong> é da <strong>clozapina</strong> (risco de agranulocitose). <strong>Cautela em mulheres em idade fértil</strong> é a marca do <strong>ácido valproico</strong> e da <strong>carbamazepina</strong>. Nível sérico de rotina existe para lítio, valproato e carbamazepina — não para antipsicóticos atípicos nem para antidepressivos.</p></blockquote>
<h3>Casos refratários</h3>
<p>A <strong>clozapina</strong> é uma das poucas opções farmacológicas efetivas na <strong>mania resistente ao tratamento</strong>. Apesar da escassez de ensaios randomizados, revisões sistemáticas mostram: melhora dos sintomas de humor e psicóticos; redução do número e da duração das hospitalizações; redução do número de psicotrópicos em uso; menos atendimentos hospitalares por autolesão e overdose; redução da ideação suicida e do comportamento agressivo; e melhora do funcionamento social. As limitações desses estudos são amostras pequenas, heterogeneidade, definições inconsistentes de resistência, controle e randomização insuficientes e seguimento curto.</p>
<h3>Psicoeducação</h3>
<p>Revisão sistemática de <strong>40 ensaios randomizados</strong>, com 4.507 indivíduos e familiares e seguimento médio de 15 meses, avaliou psicoeducação individual, em grupo, familiar e on-line. <strong>Setenta por cento dos estudos (28/40) focaram as modalidades em grupo ou familiar</strong> — e foram elas que concentraram os resultados positivos.</p>
<ul><li><strong>Em grupo:</strong> redução de recorrência, menos hospitalizações e de menor duração, maior tempo até a recaída, melhor adesão, <strong>níveis séricos de lítio mais adequados</strong> e redução do estigma.</li><li><strong>Familiar:</strong> além da redução de recorrência e de hospitalizações, melhora da trajetória clínica, do bem-estar e <strong>diminuição da sobrecarga dos cuidadores</strong>.</li><li><strong>Individual e on-line:</strong> poucos estudos, achados inconsistentes ou sem eficácia demonstrável.</li></ul>
<blockquote><p><strong>Fechando o raciocínio.</strong> O TB é crônico e de curso heterogêneo, e o maior erro clínico não é escolher o fármaco errado — é <strong>não reconhecer a bipolaridade em um paciente deprimido</strong> e tratá-lo com antidepressivo isolado. Reconhecido o transtorno, o tratamento se organiza por fase, com estabilizador de humor como espinha dorsal, e a psicoeducação familiar ou em grupo como adjuvante associado a melhor prognóstico.</p></blockquote></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

             '<span style="display:block;width:100%;border-radius:99px;transition:height .18s ease,background .18s ease,box-shadow .18s ease;height:'+(cur?'17px':'9px')+';background:'+bg+';box-shadow:'+(cur?'0 0 0 3px rgba(18,26,43,.13)':'none')+'"></span></button>';
    }).join('');
    html += '<div><div style="display:flex;align-items:center;gap:3px">'+rail+'</div>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-2px">' +
              '<div style="'+mono+';font-size:11px;letter-spacing:.04em;color:#5b6478">Questão '+pad(S.i+1)+' / '+S.order.length+'</div>' +
              '<div style="display:flex;align-items:center;gap:12px;'+mono+';font-size:10.5px;color:#8a8578">' +
                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +
              '</div></div></div>';
  }
  document.getElementById('hdr').innerHTML = html;
}
function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

         (q.imageCaption ? '<figcaption>'+esc(q.imageCaption)+'</figcaption>' : '') + '</figure>';

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +
      '</button>';
  }).join('');

  var expl = reveal ? '<div style="margin-top:20px;padding:16px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;animation:qFade .26s ease">' +
      '<div style="'+mono+';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:8px">Por quê</div>' +
      '<p style="margin:0;font-size:14.5px;line-height:1.68;color:#39404f;text-wrap:pretty">'+esc(q.explanation)+'</p></div>' : '';

  var blank = counts().blank;
  var warn = S.warn ? '<div style="margin-top:14px;padding:15px 17px;background:#fdf7e9;border:1px solid #e8d5a3;border-radius:14px;animation:qFade .22s ease">' +
      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +
        '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;line-height:1.42;font-weight:400;letter-spacing:-.012em;margin:0 0 22px;text-wrap:pretty">'+esc(q.question)+'</h2>' +
        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
        (reveal ? chatBox(q, ans===q.correctIndex) : '') +
      '</article>' + warn +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px">' +
        '<button type="button" data-act="prev" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:12px 18px;font-size:14px;cursor:pointer;transition:border-color .15s ease,color .15s ease;color:'+(S.i===0?'#c4bfb4':'#121a2b')+';pointer-events:'+(S.i===0?'none':'auto')+'">← Anterior</button>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          (early ? '<button type="button" data-act="finish" class="h-ink" style="background:none;border:0;padding:12px 6px;'+mono+';font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a8578;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Finalizar</button>' : '') +
          '<button type="button" data-act="next" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">'+(last?'Finalizar':'Próxima →')+'</button>' +
        '</div></div></section>';
}

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';
  if (pct>=90)      { title='Domínio sólido';   msg='Desempenho excelente. Confira as explicações das que escaparam e siga em frente.'; }
  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

  var stat = function(v,l,color){
    return '<div style="background:#faf9f6;padding:14px 10px">' +
      '<div style="'+mono+';font-size:19px;font-weight:500;color:'+color+'">'+v+'</div>' +
      '<div style="'+mono+';font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#8a8578;margin-top:2px">'+l+'</div></div>';
  };

  var fdefs = [['all','Todas',c.total],['wrong','Erradas',c.miss],['right','Certas',c.hit],['blank','Em branco',c.blank]];
  var filters = fdefs.map(function(f){
    var on = S.filter===f[0];
    return '<button type="button" data-act="filter" data-k="'+f[0]+'" class="h-line" style="border-radius:99px;padding:8px 14px;font-size:13px;cursor:pointer;transition:all .15s ease;border:1px solid '+(on?'#121a2b':'#ddd8ce')+';background:'+(on?'#121a2b':'transparent')+';color:'+(on?'#f5f3ef':'#5b6478')+'">'+f[1]+' '+f[2]+'</button>';
  }).join('');

  var list = reviewList();
  var allOpen = list.length>0 && list.every(function(r){ return S.open[r.idx]; });

  var cards = list.map(function(r){
    var numBg='#f0ede7', numFg='#8a8578';
    if (!r.blank) { if (r.ok) { numBg='#e3f0e8'; numFg='#1f5c3e'; } else { numBg='#fbe6e2'; numFg='#8f2f25'; } }
    var open = !!S.open[r.idx];
    var body = '';
    if (open) {
      var opts = r.q.options.map(function(text,n){
        var isC = n===r.q.correctIndex, isMine = n===r.a;
        var bd='#eeebe4', bg='#fbfaf8', fg='#5b6478', bBg='#f0ede7', bFg='#8a8578', tag='', tBg='', tFg='';
        if (isC)            { bd='#bcdcc9'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; tag='Correta'; tBg='#d9ede1'; tFg='#1f5c3e'; }
        if (isMine && !isC) { bd='#eec4bd'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; tag='Sua resposta'; tBg='#f7ddd8'; tFg='#8f2f25'; }
        if (isMine && isC)  { tag='Sua resposta ✓'; }
        return '<div style="display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:11px;font-size:14px;line-height:1.5;border:1px solid '+bd+';background:'+bg+';color:'+fg+'">' +
          '<span style="flex-shrink:0;width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:10.5px;font-weight:600;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
          '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
          (tag ? '<span style="flex-shrink:0;'+mono+';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;margin-top:1px;background:'+tBg+';color:'+tFg+'">'+tag+'</span>' : '') +
          '</div>';
      }).join('');
      body = '<div style="padding:2px 15px 18px;animation:qDrawer .2s ease">' +
        '<div style="height:1px;background:#eeebe4;margin:0 0 16px"></div>' +
        '<p style="font-family:\'Newsreader\',Georgia,serif;font-size:18px;line-height:1.5;margin:0 0 16px;text-wrap:pretty">'+esc(r.q.question)+'</p>' +
        figura(r.q) +
        '<div style="display:flex;flex-direction:column;gap:7px">'+opts+'</div>' +
        '<div style="margin-top:16px;padding:14px 16px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 11px 11px 0">' +
          '<div style="'+mono+';font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:7px">Por quê</div>' +
          '<p style="margin:0;font-size:14px;line-height:1.65;color:#39404f;text-wrap:pretty">'+esc(r.q.explanation)+'</p></div>' +
        '<button type="button" data-act="jump" data-n="'+r.idx+'" style="margin-top:14px;background:none;border:0;padding:0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#2b57cc;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Abrir no quiz →</button></div>';
    }
    return '<div style="background:#fff;border:1px solid '+(open?'#c9c3b6':'#e4e0d8')+';border-radius:14px;overflow:hidden;transition:border-color .15s ease">' +
      '<button type="button" data-act="toggle" data-n="'+r.idx+'" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 15px;cursor:pointer">' +
        '<span style="flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:12px;font-weight:600;background:'+numBg+';color:'+numFg+'">'+pad(r.idx+1)+'</span>' +
        '<span style="flex:1;min-width:0;font-size:14px;line-height:1.45;color:#39404f;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(r.q.question)+'</span>' +
        '<span style="flex-shrink:0;'+mono+';font-size:16px;color:#8a8578;width:16px;text-align:center">'+(open?'−':'+')+'</span>' +
      '</button>' + body + '</div>';
  }).join('');

  document.getElementById('stage').innerHTML =
    '<section style="padding:34px 0 0;animation:qFade .3s ease">' +
      '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:14px">Resultado</div>' +
      '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:36px;line-height:1.12;font-weight:400;letter-spacing:-.025em;margin:0 0 8px">'+title+'</h2>' +
      '<p style="font-size:15px;line-height:1.6;color:#5b6478;margin:0 0 24px;max-width:48ch;text-wrap:pretty">'+msg+'</p>' +
      '<div style="height:8px;border-radius:99px;background:#e4e0d8;overflow:hidden;margin-bottom:10px">' +
        '<div style="height:100%;border-radius:99px;background:#121a2b;transition:width .7s cubic-bezier(.22,1,.36,1);width:'+pct+'%"></div></div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e4e0d8;border:1px solid #e4e0d8;border-radius:14px;overflow:hidden;margin-bottom:34px">' +
        stat(c.hit,'Certas','#2e7d55')+stat(c.miss,'Erradas','#c04437')+stat(c.blank,'Branco','#8a8578')+stat(pct+'%','Aproveit.','#2b57cc') +
      '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px">' +
        '<h3 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;font-weight:500;letter-spacing:-.015em;margin:0">Gabarito comentado</h3>' +
        '<button type="button" data-act="toggleAll" class="h-ink" style="background:none;border:0;padding:6px 0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;text-decoration:underline;text-underline-offset:3px">'+(allOpen?'Recolher tudo':'Expandir tudo')+'</button>' +
      '</div>' +
      '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">'+filters+'</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">'+cards+'</div>' +
      (list.length===0 ? '<div style="padding:38px 16px;text-align:center;color:#8a8578;font-size:14px;border:1px dashed #ddd8ce;border-radius:14px">Nenhuma questão neste filtro.</div>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:28px;padding-top:24px;border-top:1px solid #e4e0d8">' +
        '<button type="button" data-act="restart" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:13px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">Refazer o quiz</button>' +
        '<button type="button" data-act="back" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Voltar às questões</button>' +
        '<button type="button" data-act="resumo" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Ler o resumo</button>' +
      '</div></section>';
}

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
