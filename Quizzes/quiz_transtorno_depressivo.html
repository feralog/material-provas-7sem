<script type="text/html" id="resumoSrc"><h2>O peso da depressão</h2>
<p>A depressão é uma das doenças mais antigas descritas pela medicina — há relato de quadros melancólicos no Tratado Hipocrático e descrições clínicas reconhecíveis de 2500 anos atrás — e também uma das mais prevalentes. Cerca de <strong>15% da população geral</strong> adoece ao longo da vida, mesmo em culturas muito diferentes entre si, com nítida assimetria entre os sexos: <strong>20% das mulheres contra 12% dos homens</strong>. Dito de outro modo, um em cada seis adultos terá um episódio depressivo em algum momento.</p>
<p>O conceito mudou de eixo ao longo das décadas, e essa mudança explica por que hoje se cobra tanto a avaliação funcional. Nos anos 50 a depressão era descrita em termos <strong>emocionais</strong> (humor deprimido, irritabilidade, isolamento); nos anos 70 ganhou o corpo, com a valorização dos sintomas <strong>físicos</strong> (dor muscular, fadiga, alteração do sono, perda de libido, variação de peso); nos anos 90 veio a dimensão <strong>funcional</strong> (dificuldade de concentração, falta de motivação, prejuízo social e profissional); e a partir dos anos 2000 o foco é o <strong>impacto</strong>, a ruptura do cotidiano que incapacita no trabalho, em casa e nos vínculos.</p>
<p>Os números do impacto sustentam essa leitura. Quase <strong>90% dos pacientes deprimidos</strong> apresentam incapacitação importante no trabalho, em casa ou no convívio social; <strong>44%</strong> têm a capacidade de trabalho comprometida e <strong>11%</strong> atribuem o desemprego à depressão; em média o paciente passa <strong>35 dias por ano</strong> totalmente incapacitado para as atividades normais. O custo anual estimado nos Estados Unidos chegou a <strong>83 bilhões de dólares</strong>, dos quais apenas 31% são custos diretos de assistência e medicamento: <strong>62% vêm da perda de produtividade</strong> — e, dentro dessa fatia, a queda de desempenho de quem continua trabalhando pesa mais que o absenteísmo, respondendo por 81% dos custos. Outros 7% correspondem a suicídios. Comparado a controles pareados por idade e sexo, o paciente deprimido consome praticamente o dobro em cuidados de saúde (4.642 contra 2.371 dólares por ano), e o excesso aparece em <strong>todas</strong> as categorias de gasto, não só na psiquiatria.</p>
<h4>Fatores de risco</h4>
<ul><li>Sexo feminino, com risco cerca de <strong>duas vezes maior</strong> que o masculino.</li><li>Idade de início tipicamente entre <strong>20 e 40 anos</strong>.</li><li>Situação conjugal: maior incidência em separados e divorciados; homens casados adoecem menos que solteiros, enquanto mulheres casadas adoecem mais que solteiras.</li><li><strong>Puerpério</strong>, com risco aumentado nos seis meses seguintes ao parto.</li><li>Eventos vitais negativos e morte precoce dos pais.</li></ul>
<blockquote><p>A depressão é também causa e consequência de doença clínica: cerca de <strong>30% dos pacientes hospitalizados</strong> apresentam algum transtorno depressivo, e a comorbidade agrava a doença de base e reduz a resposta ao tratamento clínico — em cardiopatia, acidente vascular encefálico, diabetes, câncer e doença de Parkinson.</p></blockquote>
<hr>
<h2>Critérios do episódio depressivo maior</h2>
<p>O diagnóstico é clínico e segue um limiar fechado: <strong>cinco ou mais sintomas presentes no mesmo período de duas semanas</strong>, representando mudança em relação ao funcionamento prévio, e com pelo menos um dos <strong>dois sintomas cardinais</strong> entre eles. Abaixo de cinco sintomas, ou com menos de duas semanas, não se fecha o episódio por mais real que seja o sofrimento.</p>
<div class="tbl"><table><thead><tr><th>Item</th><th>O que exige</th></tr></thead><tbody><tr><td><strong>Humor deprimido</strong> (cardinal)</td><td>Na maior parte do dia, quase todos os dias, com sensação de vazio, tristeza ou choro</td></tr><tr><td><strong>Anedonia</strong> (cardinal)</td><td>Perda de interesse ou prazer por todas ou quase todas as atividades</td></tr><tr><td>Peso e apetite</td><td>Perda ou ganho significativo, sem dieta</td></tr><tr><td>Sono</td><td>Insônia ou hipersonia diárias ou quase diárias</td></tr><tr><td>Psicomotricidade</td><td>Agitação, irritabilidade ou retardo psicomotor</td></tr><tr><td>Energia</td><td>Fadiga ou perda de energia</td></tr><tr><td>Autovaloração</td><td>Sensação de inutilidade ou culpa inexplicável</td></tr><tr><td>Morte</td><td>Pensamentos recorrentes de morte ou ideação suicida</td></tr><tr><td>Critério de gravidade</td><td>Sofrimento significativo ou prejuízo social e ocupacional</td></tr><tr><td>Critério de exclusão</td><td>Não atribuível a condição clínica, substância psicoativa ou medicamento</td></tr><tr><td>Critério de contexto</td><td>Não explicado melhor por luto recente</td></tr></tbody></table></div>
<p>Nem todos os sintomas valem o mesmo na hora de discriminar. Os achados de <strong>maior poder diagnóstico</strong>, por serem incomuns fora dos quadros depressivos, são perda de interesse, perda de prazer, desesperança, sentimento de inutilidade, culpa e ideação suicida. Já perda de energia, perda de apetite, insônia e dor são <strong>muito frequentes na depressão, porém inespecíficos</strong> — aparecem em dezenas de doenças clínicas e, sozinhos, não fecham nada.</p>
<h4>O exame psíquico do paciente deprimido</h4>
<ul><li><strong>Aparência:</strong> higiene prejudicada, aspecto cansado e preocupado, apatia, desânimo.</li><li><strong>Humor:</strong> deprimido ou irritável, frequentemente ansioso.</li><li><strong>Afeto:</strong> hiporressonante, tônus diminuído, distanciamento.</li><li><strong>Pensamento:</strong> velocidade lentificada; conteúdo de culpa, menos-valia, inferioridade, medos irracionais, baixa autoestima e ideação suicida.</li><li><strong>Pragmatismo:</strong> estreitamento do campo vivencial e anedonia.</li><li><strong>Sensopercepção:</strong> pode estar alterada nos quadros graves.</li><li><strong>Psicomotricidade:</strong> lentificação e fadiga.</li><li><strong>Sintomas físicos:</strong> insônia na maioria (hipersonia em cerca de 15%), cansaço, redução da libido, aumento ou redução do apetite.</li></ul>
<hr>
<h2>Uma doença sistêmica, que chega primeiro ao clínico</h2>
<p>A depressão não se apresenta só com tristeza. Ao lado dos sintomas emocionais — humor deprimido, anedonia, desesperança, baixa autoestima, prejuízo de memória, dificuldade de concentração, ansiedade, raiva e irritabilidade — vem um cortejo físico que costuma dominar a consulta: cefaleia, fadiga, distúrbio do sono, tontura, dor torácica, dor articular, dor lombar e abdominal, queixas gastrointestinais, disfunção sexual e alterações menstruais.</p>
<p>Daí decorre um fato de organização de serviço que cai em prova: a <strong>clínica geral é a porta de entrada</strong> do paciente deprimido. Ele procura o generalista por dor e cansaço, não por tristeza; soma-se a isso o preconceito ainda forte em procurar o psiquiatra, a falsa impressão de que fitoterápicos são inócuos e o risco de interações entre prescrições de vários especialistas. O resultado é diagnóstico tardio, investigação orgânica repetida e tratamento insuficiente.</p>
<p>A repercussão sistêmica tem substrato. O eixo hipotálamo-hipófise-adrenal hiperativo libera CRH, que estimula a liberação de ACTH pela hipófise anterior, que por sua vez age na <strong>zona fasciculada</strong> do córtex adrenal elevando o <strong>cortisol</strong>. O excesso de cortisol antagoniza a insulina e contribui para dislipidemia, diabetes tipo 2 e obesidade, além de suprimir a resposta imunológica. Em paralelo, o excesso de <strong>catecolaminas</strong> da medula adrenal favorece isquemia miocárdica, redução da variabilidade da frequência cardíaca, arritmias ventriculares, ativação plaquetária, aterosclerose e hipertensão. Citocinas e interleucinas fecham o circuito inflamatório.</p>

<h4>Condições e fármacos que produzem ou agravam depressão</h4>
<ul><li><strong>Medicamentos:</strong> reserpina, corticoides, metildopa, propranolol, anticonvulsivantes, hormônios, interferon.</li><li><strong>Psiquiátricas:</strong> transtornos de ansiedade (transtorno de ansiedade generalizada, pânico, transtorno obsessivo-compulsivo), alcoolismo, anorexia, demências, esquizofrenia.</li><li><strong>Cardiovasculares e respiratórias:</strong> insuficiência cardíaca, enfisema.</li><li><strong>Colagenoses:</strong> lúpus, artrite reumatoide.</li><li><strong>Infecções:</strong> mononucleose, influenza, HIV.</li><li><strong>Metabólicas e endócrinas:</strong> diabetes, hipotireoidismo, anemia.</li><li><strong>Neoplasias:</strong> linfoma, pâncreas, sistema nervoso central, mama.</li><li><strong>Neurológicas:</strong> acidente vascular encefálico, parkinsonismo, epilepsia.</li><li><strong>Nutricionais:</strong> pelagra, deficiência de vitamina B12, deficiência de tiamina.</li><li><strong>Outras:</strong> gravidez, senilidade, cirrose hepática, insuficiência renal.</li></ul>
<blockquote><p>Antes de rotular um quadro como transtorno depressivo maior primário, revise a prescrição e peça a investigação básica. Corticoide em dose alta, betabloqueador, metildopa e hipotireoidismo produzem síndromes depressivas completas, e nesses casos o tratamento começa por retirar ou corrigir a causa, não por prescrever antidepressivo.</p></blockquote>
<hr>
<h2>Formas clínicas e especificadores</h2>
<p>O espectro depressivo é largo, e boa parte das questões de prova vive nas suas bordas. Vale percorrer as apresentações clássicas, que historicamente foram organizadas em pares de oposição: psicótica contra neurótica, endógena contra reativa, primária contra secundária, maior contra distímica e, a mais importante delas na prática, <strong>unipolar contra bipolar</strong>.</p>
<h4>Transtorno depressivo persistente (distimia)</h4>
<p>Exige humor deprimido na maior parte do dia, na maioria dos dias, por <strong>pelo menos dois anos</strong> no adulto, com no máximo dois meses seguidos livres de sintomas. A intensidade é menor que a do episódio maior, mas a cronicidade produz prejuízo funcional comparável. O paciente típico não se descreve como doente, e sim como alguém que "sempre foi assim". Quando um episódio maior se sobrepõe à distimia, fala-se em depressão dupla.</p>
<h4>Características melancólicas</h4>
<p>Forma classicamente chamada de endógena: <strong>anedonia quase completa e perda da reatividade do humor</strong> — nada melhora o paciente, nem boas notícias — somadas a <strong>despertar precoce</strong>, <strong>piora matinal</strong> dos sintomas, lentificação ou agitação psicomotora marcada, anorexia com perda de peso e culpa excessiva. Responde bem a antidepressivos e à eletroconvulsoterapia.</p>
<h4>Características atípicas</h4>
<p>O espelho da melancolia: o humor <strong>ainda reage</strong> a acontecimentos positivos, e o quadro cursa com <strong>hipersonia</strong>, <strong>hiperfagia</strong> com ganho de peso, sensação de peso nos membros e sensibilidade exagerada à rejeição. É mais comum em mulheres jovens e levanta suspeita de bipolaridade subjacente.</p>
<h4>Características psicóticas</h4>
<p>Delírios congruentes com o humor — ruína, culpa, niilismo, com a paciente afirmando que os órgãos apodreceram ou que arruinou a família — e, por vezes, alucinações. Responde mal a antidepressivo isolado: o tratamento é a <strong>associação de antidepressivo com antipsicótico</strong>, e a eletroconvulsoterapia é a opção de maior eficácia quando há recusa alimentar, desidratação ou intenção suicida ativa.</p>
<h4>Padrão sazonal</h4>
<p>Relação temporal regular entre o início dos episódios e determinada época do ano, tipicamente outono e inverno, com remissão na primavera, repetida por pelo menos dois anos consecutivos. Hipersonia, hiperfagia e avidez por carboidratos são frequentes, e a fototerapia é opção terapêutica.</p>
<h4>Periparto e o blues puerperal</h4>
<p>O <strong>blues puerperal</strong> é fenômeno frequente e fisiológico: começa nos primeiros dias após o parto, cursa com labilidade emocional e choro fácil, <strong>resolve-se sozinho em até duas semanas</strong> e não compromete o cuidado com o bebê. A <strong>depressão periparto</strong> é mais duradoura e incapacitante, interfere no vínculo e exige tratamento — lembrando que o risco de episódio depressivo está aumentado durante os seis meses seguintes ao parto.</p>
<h4>Outras apresentações</h4>
<p>Equivalente depressivo ou depressão mascarada, em que as queixas somáticas ocupam todo o primeiro plano; depressão comórbida, causada ou desencadeada por outra doença; depressão induzida por medicamentos; e reações de ajustamento, de menor intensidade e ligadas a estressor identificável.</p>

<h2>Diagnóstico diferencial</h2>
<div class="tbl"><table><thead><tr><th>Condição</th><th>O que a separa do episódio depressivo maior</th></tr></thead><tbody><tr><td>Tristeza fisiológica</td><td>Proporcional ao fato, reativa a estímulos positivos, sem perda funcional</td></tr><tr><td>Luto não complicado</td><td>Dor em ondas ligada à lembrança do morto, autoestima preservada, humor ainda oscila</td></tr><tr><td>Transtorno depressivo persistente</td><td>Sintomas mais leves, porém por dois anos ou mais</td></tr><tr><td>Depressão secundária a fármaco</td><td>Relação temporal com o início da droga, melhora com a retirada</td></tr><tr><td>Transtornos ansiosos</td><td>Medo, preocupação excessiva, hipervigilância e pânico predominam</td></tr><tr><td>Demência</td><td>Declínio cognitivo progressivo com desempenho objetivamente ruim</td></tr><tr><td>Transtorno bipolar</td><td>História de episódio maníaco ou hipomaníaco, atual ou pregressa</td></tr></tbody></table></div>
<p>O diferencial com <strong>luto</strong> merece detalhe porque é o mais cobrado. No luto a autoestima permanece intacta, a dor vem em ondas desencadeadas pela lembrança da pessoa morta, e o humor ainda melhora com estímulos positivos; a ideação de morte, quando existe, tem o sentido de reencontro. Apontam para <strong>episódio depressivo maior sobreposto</strong> o sentimento persistente de inutilidade, a autodepreciação generalizada que extrapola a perda, a anedonia global, a lentificação psicomotora acentuada e a ideação suicida sem relação com o morto.</p>
<p>O diferencial com <strong>ansiedade</strong> é dificultado pela enorme zona de sobreposição: dificuldade de concentração, distúrbio do sono, queixas gastrointestinais, agitação, apreensão e dor crônica pertencem aos dois quadros. O que é próprio da depressão maior é o humor depressivo com anedonia, perda de interesse e alteração de peso; o que é próprio do transtorno ansioso é o medo, a preocupação excessiva, a hipervigilância, o ataque de pânico, a agorafobia e os rituais compulsivos.</p>
<blockquote><p><strong>Unipolar ou bipolar?</strong> Esta é a pergunta que mais muda a conduta. Aumentam a chance de bipolaridade: primeiro episódio <strong>antes dos 25 anos</strong>, <strong>muitos episódios curtos e recorrentes</strong>, <strong>história familiar de transtorno bipolar</strong>, sintomas <strong>atípicos</strong> com hipersonia e hiperfagia, sintomas <strong>psicóticos</strong>, início no <strong>puerpério</strong> e resposta rápida mas instável a antidepressivos. Reconhecer isso antecipa o tratamento correto, que passa a exigir estabilizador do humor.</p></blockquote>
<blockquote><p><strong>Virada maníaca.</strong> Euforia, redução da necessidade de sono sem cansaço no dia seguinte, aceleração do pensamento, gastos impulsivos ou desinibição surgidos nas primeiras semanas após a introdução de um antidepressivo configuram virada e revelam bipolaridade. A conduta é <strong>suspender o antidepressivo e iniciar estabilizador do humor</strong> — lítio ou valproato —, associando antipsicótico se houver agitação intensa ou sintomas psicóticos. Aumentar a dose do antidepressivo diante de "agitação" nesse contexto é o erro clássico.</p></blockquote>
<hr>
<h2>Neurobiologia: das aminas ao intestino</h2>
<p>A <strong>teoria das aminas biogênicas</strong> nasceu de duas observações farmacológicas dos anos 50, trabalhadas por Wooley com serotonina na Inglaterra e por Axelrod com noradrenalina no National Institute of Health: a <strong>reserpina</strong>, que depleta noradrenalina e serotonina, provocava depressão; a <strong>isoniazida</strong>, que elevava esses mesmos neurotransmissores, agia como antidepressivo. Dessas observações saíram as teorias dos indóis e das catecolaminas, formalizadas por Schildkraut, Bunney e Davies em 1965. Marcadores histoquímicos confirmaram depleção de vários neurotransmissores, sendo os principais a <strong>serotonina</strong>, a <strong>noradrenalina</strong> e a <strong>dopamina</strong>.</p>
<p>O modelo de especificidade de neurotransmissor ajuda a entender por que classes diferentes aliviam sintomas diferentes. A <strong>noradrenalina</strong> responde preferencialmente por motivação, energia, interesse e concentração; a <strong>serotonina</strong>, por ansiedade, impulsividade, função sexual e apetite; e as duas se sobrepõem na regulação do <strong>humor</strong>, do <strong>sono</strong> e da capacidade de lidar com o estresse.</p>

<p>As vias noradrenérgicas e serotonérgicas projetam-se do tronco encefálico para o <strong>córtex pré-frontal</strong> e o <strong>sistema límbico</strong>, ligados à regulação do humor, e também para o <strong>hipotálamo</strong>, que acumula regulação do humor e <strong>controle termorregulatório</strong> — coincidência anatômica que explica a convivência de sintomas afetivos e vasomotores nas fases de flutuação estrogênica, já que o estrógeno modula a síntese, a liberação e a atividade de receptores de ambos os sistemas.</p>

<p>Na sinapse, o neurotransmissor é sintetizado no neurônio pré-sináptico, armazenado em vesículas e liberado na fenda por um impulso. Uma vez liberado, ele pode ligar-se a receptores pós-sinápticos, voltar ao neurônio de origem ou ser degradado — e a proporção importa: cerca de <strong>80% retorna pelo transportador de recaptação</strong> e apenas <strong>20% segue para a degradação enzimática</strong>. É justamente esse transportador que os antidepressivos inibidores de recaptação bloqueiam.</p>
<h4>Estresse, atrofia neuronal e carga alostática</h4>
<p>O estresse crônico produz <em>down regulation</em> do RNA mensageiro, e o efeito <strong>persiste mesmo depois de retirado o fator estressor</strong> — por isso o estresse na infância funciona como fator desencadeante e perpetuador. O mecanismo celular é conhecido: o estresse eleva os <strong>glicocorticoides</strong> e reduz o <strong>BDNF</strong>, fator neurotrófico derivado do cérebro, essencial à sobrevivência e ao crescimento neuronal. O resultado é redução da ramificação dendrítica, atrofia e morte neuronal.</p>

<p>A figura separa dois momentos que a prova costuma confundir. A <strong>resposta adaptativa</strong>, ou alostase, reúne alterações moleculares e celulares potencialmente reversíveis: aumento da secreção de glicocorticoide, excitotoxicidade do glutamato, queda de fatores neurotróficos, alteração da sinalização intracelular, redução celular, atrofia e remodelamento neuronal, plasticidade sináptica alterada e desestabilização do citoesqueleto. Quando o estresse se cronifica, instala-se a <strong>carga alostática</strong>, já com alterações morfológicas e teciduais: neutrofilia, <strong>redução do volume cerebral</strong>, piora da função cerebral e glial e perda de conectividade da rede neuronal.</p>
<p>Essas alterações têm tradução por imagem. Há <strong>redução do volume hipocampal</strong> na depressão maior, mais acentuada na doença crônica ou recorrente; as alterações podem <strong>persistir após a resolução</strong> do episódio e ainda se discute se precedem o surto ou decorrem da cronicidade. Estudos de metabolismo mostram menor consumo cerebral de glicose no paciente deprimido em relação ao controle.</p>

<p>Um circuito mais recente conecta ambiente, intestino e humor. Estressores e traumas precoces ativam o eixo hipotálamo-hipófise-suprarrenal e, somados a uma <strong>dieta pobre em alimentos saudáveis</strong>, favorecem o <strong>extravasamento intestinal</strong> e a alteração do <strong>microbioma</strong>. Disso resulta um estado de <strong>reações inflamatórias com alterações de neurotransmissores</strong> que realimenta o próprio circuito e sustenta o quadro depressivo. É a racionalidade por trás da recomendação de padrão alimentar mediterrâneo — vegetais, frutas, cereais, leguminosas e oleaginosas, azeite como gordura principal, peixe frequente e pouca carne vermelha, laticínio e álcool, com atenção a zinco, magnésio, complexo B, vitamina D, ômega-3 e triptofano.</p>
<h4>Trauma precoce e o fenômeno do kindling</h4>
<p>Adultos com transtorno depressivo maior relatam história de trauma infantil em proporção muito superior à de controles, e esse antecedente marca um subgrupo com <strong>pior resposta aos antidepressivos</strong>.</p>
<div class="tbl"><table><thead><tr><th>Experiência traumática</th><th>Transtorno depressivo maior</th><th>Controles</th></tr></thead><tbody><tr><td>Abuso emocional</td><td>43%</td><td>9%</td></tr><tr><td>Abuso físico</td><td>22%</td><td>5%</td></tr><tr><td>Negligência</td><td>19%</td><td>4%</td></tr><tr><td>Abuso sexual</td><td>17%</td><td>5%</td></tr></tbody></table></div>
<p>O <strong>fenômeno do kindling</strong> descreve o outro lado da relação entre ambiente e doença. Nos primeiros episódios a associação com eventos estressantes de vida é forte, mas ela <strong>declina progressivamente à medida que os episódios se acumulam</strong>, estabilizando-se por volta do nono episódio: a doença torna-se autônoma em relação ao ambiente e passa a recorrer sem gatilho identificável. A leitura prática é direta — existe uma janela de oportunidade nos primeiros episódios, e tratar cedo e prevenir recorrências muda a trajetória da doença.</p>
<h4>Sono</h4>
<p>As alterações de sono são achado biológico consistente: cerca de <strong>40% dos insones crônicos</strong> têm quadro depressivo; há <strong>aumento da densidade do sono REM</strong>, <strong>redução do sono NREM</strong> e redução do tempo total de sono em até 90% dos pacientes. A privação de sono tem efeito antidepressivo transitório e já foi usada como recurso terapêutico.</p>
<hr>
<h2>Tratamento: fases, metas e fármacos</h2>
<p>A meta não é melhorar, é <strong>remitir</strong>. Responder significa reduzir parcialmente os sintomas; <strong>remissão</strong> significa ficar praticamente assintomático e voltar ao funcionamento prévio, ou seja, à eutimia. A distinção não é semântica: <strong>sintomas residuais predizem recaída, cronificação, pior resposta aos tratamentos seguintes e maior risco de suicídio</strong>.</p>
<div class="tbl"><table><thead><tr><th>Fase</th><th>Duração</th><th>Objetivo</th></tr></thead><tbody><tr><td><strong>Aguda</strong></td><td>6 a 12 semanas</td><td>Obter resposta e, de preferência, remissão</td></tr><tr><td><strong>Continuação</strong></td><td>4 a 9 meses após a remissão</td><td>Prevenir <strong>recaída</strong>, o retorno do mesmo episódio</td></tr><tr><td><strong>Manutenção</strong></td><td>A partir de 1 ano, por anos nos casos de risco</td><td>Prevenir <strong>recorrência</strong>, um episódio novo</td></tr></tbody></table></div>
<p>Recaída e recorrência não são sinônimos e a diferença define o tempo de tratamento. Na <strong>continuação</strong> mantém-se a <strong>mesma dose</strong> que produziu a remissão, porque o episódio ainda está biologicamente ativo e a retirada precoce traz de volta os mesmos sintomas. A <strong>manutenção</strong> prolongada está indicada quando há três ou mais episódios prévios, tentativa de suicídio anterior, sintomas psicóticos, episódios graves ou história familiar carregada.</p>
<p>Outro ponto de prova é o <strong>tempo de prova terapêutica</strong>: a melhora começa a aparecer entre a segunda e a quarta semana, mas a resposta plena exige <strong>quatro a oito semanas em dose adequada</strong>. Trocar o fármaco antes disso é a causa mais comum de falso rótulo de refratariedade.</p>
<div class="tbl"><table><thead><tr><th>Classe</th><th>Vantagem</th><th>Ressalva</th></tr></thead><tbody><tr><td><strong>ISRS</strong> (fluoxetina, sertralina, escitalopram)</td><td>Boa tolerabilidade e baixa letalidade em superdosagem; primeira linha</td><td>Disfunção sexual, náusea e ativação ansiosa inicial</td></tr><tr><td><strong>IRSN</strong> (venlafaxina, duloxetina)</td><td>Ação dupla, útil quando há dor e baixa energia</td><td>Elevação da pressão arterial em dose alta; sintomas de retirada</td></tr><tr><td><strong>Tricíclicos</strong> (amitriptilina, imipramina, clomipramina)</td><td>Eficácia comprovada, sobretudo em quadros melancólicos</td><td><strong>Cardiotoxicidade</strong> e alta letalidade em superdosagem; efeitos anticolinérgicos</td></tr><tr><td><strong>IMAO</strong> (tranilcipromina)</td><td>Opção na depressão atípica e refratária</td><td>Crise hipertensiva com tiramina; muitas interações</td></tr><tr><td><strong>Bupropiona</strong></td><td>Não causa disfunção sexual nem ganho de peso; auxilia na cessação do tabagismo</td><td>Reduz o limiar convulsivo; evitar em epilepsia, bulimia e anorexia</td></tr><tr><td><strong>Mirtazapina</strong></td><td>Melhora sono e apetite rapidamente</td><td>Sedação e ganho de peso</td></tr></tbody></table></div>
<p>A escolha inicial recai sobre os <strong>ISRS</strong> não por eficácia superior — as classes são comparáveis — mas por <strong>perfil de efeitos adversos mais ameno e segurança muito maior em superdosagem</strong>, o que pesa diante de um paciente com risco suicida. Os <strong>tricíclicos</strong> permanecem eficazes, porém de segunda linha: bloqueiam canais de sódio cardíacos e receptores muscarínicos, histaminérgicos e alfa-adrenérgicos, produzindo arritmia, boca seca, retenção urinária, constipação, sedação e hipotensão postural, com margem estreita entre a dose terapêutica e a dose letal.</p>
<h4>Diante da falha terapêutica</h4>
<ul><li>Confirmar <strong>adesão</strong>, <strong>dose</strong> e <strong>tempo</strong> antes de qualquer mudança.</li><li><strong>Revisar o diagnóstico</strong> — bipolaridade não reconhecida, causa clínica, fármaco depressógeno, abuso de álcool.</li><li><strong>Trocar</strong> por fármaco de outra classe, <strong>combinar</strong> dois antidepressivos de mecanismos complementares ou <strong>potencializar</strong> com lítio, hormônio tireoidiano ou antipsicótico atípico.</li><li>Considerar <strong>eletroconvulsoterapia</strong>.</li></ul>
<p>O arsenal terapêutico completo inclui ainda estabilizadores do humor, benzodiazepínicos como adjuvantes de curto prazo, hormônios tireoidianos na potencialização e antipsicóticos nos quadros psicóticos ou agitados. Psicoterapia, atividade física e dieta compõem o plano, e há base biológica para isso: ao elevar serotonina e noradrenalina e reduzir glicocorticoides, o tratamento aumenta o BDNF e o NGF, favorecendo sobrevivência neuronal, ramificação dendrítica e mielinização — ou seja, parte do dano é potencialmente reversível.</p>
<blockquote><p>A <strong>eletroconvulsoterapia é primeira escolha</strong>, e não último recurso, quando há risco de morte a curto prazo: recusa alimentar, desidratação, catatonia, sintomas psicóticos graves ou intenção suicida ativa. Também está indicada na refratariedade a múltiplos esquemas e na gestação, por evitar exposição medicamentosa. É o tratamento com a maior taxa de resposta na depressão grave.</p></blockquote>
<hr>
<h2>Suicídio, prognóstico e as consequências de não remitir</h2>
<p>O suicídio é a complicação mais temida do transtorno depressivo. Entre <strong>15% e 20% das pessoas com depressão grave apresentam condutas suicidas</strong> ao longo da doença. Como causa direta de morte, o suicídio ocupa posição intermediária nas estatísticas de adultos jovens, mas sobe para <strong>segunda causa quando se contabilizam os fatores indiretos</strong>, e nos Estados Unidos figura como terceira causa de morte entre adolescentes e adultos jovens.</p>
<p>A avaliação do risco é parte do exame, não um acréscimo opcional. Perguntar diretamente sobre <strong>ideação, plano, meio disponível, intenção e tentativas anteriores</strong> não induz o ato — é a única forma de dimensionar o risco. Importa também o <strong>momento da doença</strong>: o risco não é homogêneo ao longo do episódio.</p>
<blockquote><p>Nas <strong>primeiras semanas de tratamento</strong> o risco pode aumentar. A lentificação psicomotora e a falta de energia costumam melhorar <strong>antes</strong> do humor deprimido, da desesperança e da culpa, devolvendo ao paciente a iniciativa necessária para executar um plano que já existia. Por isso o acompanhamento deve ser próximo nesse período, com restrição do acesso a meios letais, envolvimento da família e retornos curtos.</p></blockquote>
<p>Internação está indicada diante de intenção ou plano estruturado, tentativa recente, sintomas psicóticos, recusa alimentar, ausência de suporte social ou impossibilidade de garantir segurança em ambiente domiciliar.</p>
<h4>Preditores negativos de resposta</h4>
<ul><li>Comorbidades psiquiátricas, sobretudo <strong>ansiedade</strong>, <strong>abuso de álcool e benzodiazepínicos</strong> e <strong>transtornos de personalidade</strong>.</li><li><strong>Características psicóticas</strong> do quadro depressivo.</li><li>Preocupações hipocondríacas e sintomas somáticos exacerbados.</li><li>Comorbidades clínicas.</li><li>Tratamentos anteriores malsucedidos.</li><li><strong>Abandono precoce</strong> da medicação antidepressiva.</li></ul>
<h4>O que acontece quando a depressão não remite</h4>
<ul><li>Cronificação da doença e maior prejuízo no trabalho.</li><li>Aumento do uso de serviços de saúde.</li><li><strong>Menor resposta aos tratamentos seguintes</strong>.</li><li><strong>Aumento da incidência de suicídio</strong>.</li><li>Maior prejuízo funcional, familiar, afetivo e sexual.</li><li>Maior ônus social e econômico.</li></ul>
<p>Depressão, ansiedade, insônia, dor crônica e disfunção sexual alimentam-se mutuamente num círculo em que cada sintoma agrava o seguinte. Romper esse círculo cedo, buscando remissão completa e não apenas resposta parcial, é o que separa um episódio tratado de uma doença crônica.</p></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

/* ── header ────────────────────────────────────────────────────────────────── */
function renderHeader(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var left =
    '<div style="min-width:0">' +
      '<div style="display:flex;align-items:center;gap:8px;'+mono+';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8a8578">' +
        '<a href="'+idxHref()+'" class="h-ink" style="color:#2b57cc;text-decoration:none;white-space:nowrap">\u2190 Materiais</a>' +
        '<span style="color:#d3cec4">/</span>' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(EYEBROW)+'</span>' +
      '</div>' +
      '<h1 style="margin:1px 0 0;font-family:\'Newsreader\',Georgia,serif;font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.15">'+esc(TITLE)+'</h1>' +
    '</div>';

  var right = '';
  if (S.view === 'quiz' && S.started) {
    var hit = counts().hit;
    right = '<div style="display:flex;align-items:center;gap:10px;flex-shrink:0">' +
              '<button type="button" data-act="sair" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:9px;padding:6px 11px;'+mono+';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">Sair</button>' +
              '<div style="display:flex;align-items:center;gap:6px">' +
                '<span style="'+mono+';font-size:15px;font-weight:600;letter-spacing:-.02em">'+hit+'</span>' +
                '<span style="'+mono+';font-size:11px;color:#8a8578">/ '+S.order.length+'</span>' +
              '</div></div>';
  } else if (S.view !== 'home') {
    right = '<button type="button" data-act="home" class="h-line" style="flex-shrink:0;background:none;border:1px solid #ddd8ce;border-radius:9px;padding:7px 13px;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">← Início</button>';
  }

  var html = '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:'+(S.view==='quiz'&&S.started?'10px':'2px')+'">'+left+right+'</div>';

  if (S.view === 'quiz' && S.started) {
    var c = counts();
    var rail = S.order.map(function(q,n){
      var a = S.answers[n], cur = n===S.i && !S.finished, bg = '#d3cec4';
      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';
      if (cur && a===null) bg = '#121a2b';
      var st = a===null ? 'em branco' : (a===q.correctIndex ? 'correta' : 'incorreta');
      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +
             '<span style="display:block;width:100%;border-radius:99px;transition:height .18s ease,background .18s ease,box-shadow .18s ease;height:'+(cur?'17px':'9px')+';background:'+bg+';box-shadow:'+(cur?'0 0 0 3px rgba(18,26,43,.13)':'none')+'"></span></button>';
    }).join('');
    html += '<div><div style="display:flex;align-items:center;gap:3px">'+rail+'</div>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-2px">' +
              '<div style="'+mono+';font-size:11px;letter-spacing:.04em;color:#5b6478">Questão '+pad(S.i+1)+' / '+S.order.length+'</div>' +
              '<div style="display:flex;align-items:center;gap:12px;'+mono+';font-size:10.5px;color:#8a8578">' +
                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +
              '</div></div></div>';
  }
  document.getElementById('hdr').innerHTML = html;
}
function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── tela inicial ──────────────────────────────────────────────────────────── */
function renderHome(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var secoes = (document.getElementById('resumoSrc').textContent.match(/<h2/g)||[]).length;
  var cell = function(v,l){
    return '<div style="background:#faf9f6;padding:16px 14px">' +
      '<div style="'+mono+';font-size:22px;font-weight:500;letter-spacing:-.03em">'+v+'</div>' +
      '<div style="'+mono+';font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8a8578;margin-top:3px">'+l+'</div></div>';
  };
  var card = function(act,tag,titulo,desc,cta){
    return '<button type="button" data-act="'+act+'" class="h-card" style="display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:24px 22px;cursor:pointer;transition:border-color .16s ease,transform .14s ease;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -20px rgba(18,26,43,.18)">' +
      '<div style="'+mono+';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:12px">'+tag+'</div>' +
      '<div style="font-family:\'Newsreader\',Georgia,serif;font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.15;margin-bottom:8px">'+titulo+'</div>' +
      '<div style="font-size:14px;line-height:1.6;color:#5b6478;margin-bottom:18px;text-wrap:pretty">'+desc+'</div>' +
      '<div style="'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#121a2b">'+cta+'</div></button>';
  };

  document.getElementById('stage').innerHTML =
    '<section style="padding:56px 0 0;animation:qFade .3s ease">' +
      '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:16px">Material de revisão</div>' +
      '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:40px;line-height:1.08;font-weight:400;letter-spacing:-.025em;margin:0 0 18px;text-wrap:pretty">'+esc(SUBTITLE)+'</h2>' +
      '<p style="font-size:15.5px;line-height:1.65;color:#5b6478;margin:0 0 30px;max-width:52ch;text-wrap:pretty">'+esc(INTRO)+'</p>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:1px;background:#e4e0d8;border:1px solid #e4e0d8;border-radius:14px;overflow:hidden;margin-bottom:32px">' +
        cell(QUIZ.length,'Questões') + cell(secoes,'Seções') + cell('~'+Math.round(QUIZ.length*0.75),'Minutos') +
      '</div>' +
      '<div class="home-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
        (emAndamento()
          ? card('retomar','Em andamento','Quiz',
                 'Você parou na questão '+pad(S.i+1)+' de '+S.order.length+', com '+
                 (S.order.length-counts().blank)+' respondida'+((S.order.length-counts().blank)===1?'':'s')+
                 '. Suas respostas continuam guardadas.','Retomar →')
          : card('start','Praticar','Quiz', QUIZ.length+' questões de múltipla escolha, com explicação assim que você responde e gabarito comentado no fim.','Começar →')) +
        card('resumo','Estudar','Resumo','O conteúdo da aula em texto corrido, organizado em '+secoes+' seções para leitura antes da prova.','Ler →') +
      '</div>' +
      '<div style="margin-top:26px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;'+mono+';font-size:11px;color:#8a8578">' +
        '<span>← →&nbsp; navegar</span><span>1–'+maxOpts()+'&nbsp; responder</span><span>Enter&nbsp; avançar</span>' +
        (emAndamento() ? '<button type="button" data-act="start" class="h-ink" style="background:none;border:0;padding:0;'+mono+';font-size:11px;color:#8a8578;cursor:pointer;text-decoration:underline;text-underline-offset:3px">recomeçar do zero</button>' : '') +
        '</div>' +
    '</section>';
}
function maxOpts(){ return QUIZ.reduce(function(m,q){ return Math.max(m,q.options.length); },0); }

/* ── resumo ────────────────────────────────────────────────────────────────── */
function renderResumo(){
  document.getElementById('stage').innerHTML =
    '<section style="padding:34px 0 0;animation:qFade .3s ease">' +
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:14px">Resumo</div>' +
      '<div class="rsm">' + document.getElementById('resumoSrc').textContent + '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:38px;padding-top:24px;border-top:1px solid #e4e0d8">' +
        '<button type="button" data-act="start" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:13px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">Fazer o quiz →</button>' +
        '<button type="button" data-act="home" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Voltar ao início</button>' +
      '</div></section>';
}

/* imagem da questao — data URI ja resolvida pelo montar_quiz.py */
function figura(q, cls){
  if (!q.image) return '';
  return '<figure class="fig'+(cls?' '+cls:'')+'"><img src="'+q.image+'" alt="'+esc(q.imageCaption||'Imagem da questão')+'">' +
         (q.imageCaption ? '<figcaption>'+esc(q.imageCaption)+'</figcaption>' : '') + '</figure>';
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +
      '</button>';
  }).join('');

  var expl = reveal ? '<div style="margin-top:20px;padding:16px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;animation:qFade .26s ease">' +
      '<div style="'+mono+';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:8px">Por quê</div>' +
      '<p style="margin:0;font-size:14.5px;line-height:1.68;color:#39404f;text-wrap:pretty">'+esc(q.explanation)+'</p></div>' : '';

  var blank = counts().blank;
  var warn = S.warn ? '<div style="margin-top:14px;padding:15px 17px;background:#fdf7e9;border:1px solid #e8d5a3;border-radius:14px;animation:qFade .22s ease">' +
      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +
        '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;line-height:1.42;font-weight:400;letter-spacing:-.012em;margin:0 0 22px;text-wrap:pretty">'+esc(q.question)+'</h2>' +
        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
        (reveal ? chatBox(q, ans===q.correctIndex) : '') +
      '</article>' + warn +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px">' +
        '<button type="button" data-act="prev" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:12px 18px;font-size:14px;cursor:pointer;transition:border-color .15s ease,color .15s ease;color:'+(S.i===0?'#c4bfb4':'#121a2b')+';pointer-events:'+(S.i===0?'none':'auto')+'">← Anterior</button>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          (early ? '<button type="button" data-act="finish" class="h-ink" style="background:none;border:0;padding:12px 6px;'+mono+';font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a8578;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Finalizar</button>' : '') +
          '<button type="button" data-act="next" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">'+(last?'Finalizar':'Próxima →')+'</button>' +
        '</div></div></section>';
}

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';
  if (pct>=90)      { title='Domínio sólido';   msg='Desempenho excelente. Confira as explicações das que escaparam e siga em frente.'; }
  else if (pct>=70) { title='Bom desempenho';   msg='Base consistente. Revise os pontos errados abaixo para fechar as lacunas.'; }
  else if (pct>=50) { title='Meio do caminho';  msg='Você acertou o essencial, mas há lacunas. Comece pelo filtro de erradas.'; }

  var stat = function(v,l,color){
    return '<div style="background:#faf9f6;padding:14px 10px">' +
      '<div style="'+mono+';font-size:19px;font-weight:500;color:'+color+'">'+v+'</div>' +
      '<div style="'+mono+';font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#8a8578;margin-top:2px">'+l+'</div></div>';
  };

  var fdefs = [['all','Todas',c.total],['wrong','Erradas',c.miss],['right','Certas',c.hit],['blank','Em branco',c.blank]];
  var filters = fdefs.map(function(f){
    var on = S.filter===f[0];
    return '<button type="button" data-act="filter" data-k="'+f[0]+'" class="h-line" style="border-radius:99px;padding:8px 14px;font-size:13px;cursor:pointer;transition:all .15s ease;border:1px solid '+(on?'#121a2b':'#ddd8ce')+';background:'+(on?'#121a2b':'transparent')+';color:'+(on?'#f5f3ef':'#5b6478')+'">'+f[1]+' '+f[2]+'</button>';
  }).join('');

  var list = reviewList();
  var allOpen = list.length>0 && list.every(function(r){ return S.open[r.idx]; });

  var cards = list.map(function(r){
    var numBg='#f0ede7', numFg='#8a8578';
    if (!r.blank) { if (r.ok) { numBg='#e3f0e8'; numFg='#1f5c3e'; } else { numBg='#fbe6e2'; numFg='#8f2f25'; } }
    var open = !!S.open[r.idx];
    var body = '';
    if (open) {
      var opts = r.q.options.map(function(text,n){
        var isC = n===r.q.correctIndex, isMine = n===r.a;
        var bd='#eeebe4', bg='#fbfaf8', fg='#5b6478', bBg='#f0ede7', bFg='#8a8578', tag='', tBg='', tFg='';
        if (isC)            { bd='#bcdcc9'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; tag='Correta'; tBg='#d9ede1'; tFg='#1f5c3e'; }
        if (isMine && !isC) { bd='#eec4bd'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; tag='Sua resposta'; tBg='#f7ddd8'; tFg='#8f2f25'; }
        if (isMine && isC)  { tag='Sua resposta ✓'; }
        return '<div style="display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:11px;font-size:14px;line-height:1.5;border:1px solid '+bd+';background:'+bg+';color:'+fg+'">' +
          '<span style="flex-shrink:0;width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:10.5px;font-weight:600;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
          '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
          (tag ? '<span style="flex-shrink:0;'+mono+';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;margin-top:1px;background:'+tBg+';color:'+tFg+'">'+tag+'</span>' : '') +
          '</div>';
      }).join('');
      body = '<div style="padding:2px 15px 18px;animation:qDrawer .2s ease">' +
        '<div style="height:1px;background:#eeebe4;margin:0 0 16px"></div>' +
        '<p style="font-family:\'Newsreader\',Georgia,serif;font-size:18px;line-height:1.5;margin:0 0 16px;text-wrap:pretty">'+esc(r.q.question)+'</p>' +
        figura(r.q) +
        '<div style="display:flex;flex-direction:column;gap:7px">'+opts+'</div>' +
        '<div style="margin-top:16px;padding:14px 16px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 11px 11px 0">' +
          '<div style="'+mono+';font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:7px">Por quê</div>' +
          '<p style="margin:0;font-size:14px;line-height:1.65;color:#39404f;text-wrap:pretty">'+esc(r.q.explanation)+'</p></div>' +
        '<button type="button" data-act="jump" data-n="'+r.idx+'" style="margin-top:14px;background:none;border:0;padding:0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#2b57cc;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Abrir no quiz →</button></div>';
    }
    return '<div style="background:#fff;border:1px solid '+(open?'#c9c3b6':'#e4e0d8')+';border-radius:14px;overflow:hidden;transition:border-color .15s ease">' +
      '<button type="button" data-act="toggle" data-n="'+r.idx+'" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 15px;cursor:pointer">' +
        '<span style="flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:12px;font-weight:600;background:'+numBg+';color:'+numFg+'">'+pad(r.idx+1)+'</span>' +
        '<span style="flex:1;min-width:0;font-size:14px;line-height:1.45;color:#39404f;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(r.q.question)+'</span>' +
        '<span style="flex-shrink:0;'+mono+';font-size:16px;color:#8a8578;width:16px;text-align:center">'+(open?'−':'+')+'</span>' +
      '</button>' + body + '</div>';
  }).join('');

  document.getElementById('stage').innerHTML =
    '<section style="padding:34px 0 0;animation:qFade .3s ease">' +
      '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:14px">Resultado</div>' +
      '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:36px;line-height:1.12;font-weight:400;letter-spacing:-.025em;margin:0 0 8px">'+title+'</h2>' +
      '<p style="font-size:15px;line-height:1.6;color:#5b6478;margin:0 0 24px;max-width:48ch;text-wrap:pretty">'+msg+'</p>' +
      '<div style="height:8px;border-radius:99px;background:#e4e0d8;overflow:hidden;margin-bottom:10px">' +
        '<div style="height:100%;border-radius:99px;background:#121a2b;transition:width .7s cubic-bezier(.22,1,.36,1);width:'+pct+'%"></div></div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e4e0d8;border:1px solid #e4e0d8;border-radius:14px;overflow:hidden;margin-bottom:34px">' +
        stat(c.hit,'Certas','#2e7d55')+stat(c.miss,'Erradas','#c04437')+stat(c.blank,'Branco','#8a8578')+stat(pct+'%','Aproveit.','#2b57cc') +
      '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px">' +
        '<h3 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;font-weight:500;letter-spacing:-.015em;margin:0">Gabarito comentado</h3>' +
        '<button type="button" data-act="toggleAll" class="h-ink" style="background:none;border:0;padding:6px 0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;text-decoration:underline;text-underline-offset:3px">'+(allOpen?'Recolher tudo':'Expandir tudo')+'</button>' +
      '</div>' +
      '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">'+filters+'</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">'+cards+'</div>' +
      (list.length===0 ? '<div style="padding:38px 16px;text-align:center;color:#8a8578;font-size:14px;border:1px dashed #ddd8ce;border-radius:14px">Nenhuma questão neste filtro.</div>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:28px;padding-top:24px;border-top:1px solid #e4e0d8">' +
        '<button type="button" data-act="restart" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:13px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">Refazer o quiz</button>' +
        '<button type="button" data-act="back" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Voltar às questões</button>' +
        '<button type="button" data-act="resumo" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Ler o resumo</button>' +
      '</div></section>';
}

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
