<script type="text/html" id="resumoSrc"><h2>Tempo é visão: emergência, urgência e sinais de alerta</h2>
<p>Perda visual aguda é motivo frequente de procura ao pronto-socorro, e quem vê o paciente primeiro costuma ser o <strong>clínico geral</strong>, não o oftalmologista. O diagnóstico e o encaminhamento corretos nesse primeiro contato podem evitar cegueira permanente e sequelas irreversíveis. O exemplo extremo é a oclusão da artéria central da retina: ali o tempo de isquemia determina a chance de recuperação visual, e <strong>minutos contam</strong>.</p>
<p>Por isso a classificação prática separa os quadros pelo relógio, não pela gravidade aparente:</p>
<div class="tbl"><table><thead><tr><th></th><th><strong>Emergência</strong></th><th><strong>Urgência</strong></th></tr></thead><tbody><tr><td><strong>Janela</strong></td><td>minutos a horas</td><td>horas a dias</td></tr><tr><td><strong>Encaminhamento</strong></td><td>oftalmologista <strong>agora</strong></td><td>avaliação em <strong>24 horas</strong></td></tr><tr><td><strong>Vascular</strong></td><td>oclusão da artéria central da retina</td><td>oclusão venosa da retina</td></tr><tr><td><strong>Retina</strong></td><td>descolamento com <strong>mácula ameaçada</strong> (ainda colada)</td><td>descolamento com <strong>mácula já descolada</strong></td></tr><tr><td><strong>Nervo óptico</strong></td><td>NOIA arterítica (arterite de células gigantes)</td><td>neurite óptica · neuropatia óptica isquêmica · papiledema com sintomas</td></tr><tr><td><strong>Infecção e inflamação</strong></td><td>endoftalmite aguda · celulite orbitária com comprometimento</td><td>uveíte posterior grave</td></tr><tr><td><strong>Pressão</strong></td><td>glaucoma agudo de ângulo fechado</td><td>—</td></tr><tr><td><strong>Trauma e agentes externos</strong></td><td>queimadura química · trauma penetrante</td><td>trauma contuso com comotio retinae</td></tr></tbody></table></div>
<blockquote><p><strong>A NOIA muda de coluna conforme a causa.</strong> A neuropatia óptica isquêmica aparece entre as urgências, mas a forma <strong>arterítica</strong> é emergência — o olho contralateral pode ser perdido em dias. Na prática: NOIA <strong>não arterítica = urgência</strong>; NOIA <strong>arterítica = emergência</strong>.</p></blockquote>
<p>O mesmo raciocínio vale para o descolamento de retina: com a mácula colada ainda há visão central a salvar, e o quadro é emergência; com a mácula descolada, o dano central já ocorreu e o relógio passa a ser de horas a dias.</p>
<h3>Sinais de alerta (red flags)</h3>
<div class="tbl"><table><thead><tr><th>Sinal</th><th>O que deve fazer pensar</th></tr></thead><tbody><tr><td><strong>Perda visual súbita</strong></td><td>qualquer causa grave — unilateral ou bilateral, parcial ou total</td></tr><tr><td><strong>Fotopsias + miodesopsias</strong></td><td>flashes e floaters: risco de <strong>descolamento de retina</strong></td></tr><tr><td><strong>Campo visual em cortina</strong></td><td>sombra ou véu progressivo: retina descolando</td></tr><tr><td><strong>Olho vermelho + dor intensa</strong></td><td><strong>glaucoma agudo</strong> ou <strong>infecção</strong></td></tr><tr><td><strong>Cefaleia + diplopia</strong></td><td><strong>papiledema</strong> ou compressão</td></tr><tr><td><strong>Trauma ocular recente</strong></td><td>mesmo o contuso pode causar lesão grave</td></tr></tbody></table></div>
<hr>
<h2>Abordagem inicial: o que o clínico pode e deve fazer</h2>
<p>A avaliação no pronto-socorro tem três tempos — anamnese dirigida, exame básico e decisão de encaminhamento — e nenhum deles exige equipamento de oftalmologista.</p>
<h4>Anamnese dirigida</h4>
<p>Cinco perguntas orientam o diagnóstico: o início foi <strong>súbito ou gradual</strong>? É <strong>unilateral ou bilateral</strong>? Há <strong>dor</strong>? Houve <strong>trauma ou cirurgia ocular recente</strong>? Que <strong>doenças sistêmicas</strong> o paciente tem? Hipertensão, diabetes, arterite de células gigantes, coagulopatias, trauma e cirurgia recente apontam, cada um, para um grupo de diagnósticos.</p>
<h4>Exame básico</h4>
<ol><li><strong>Acuidade visual</strong> — mesmo grosseira: conta dedos, movimento de mãos, percepção luminosa. É o dado que documenta a gravidade e o ponto de partida para qualquer comparação.</li><li><strong>Pupilas</strong> — pesquisar o <strong>defeito pupilar aferente relativo (DPAR)</strong>.</li><li><strong>Motilidade ocular</strong>.</li><li><strong>Biomicroscopia</strong>, quando disponível.</li><li><strong>Fundoscopia</strong> — sempre que possível, dilatada <strong>se for seguro</strong>. Procura hemorragias, edema de disco e descolamento.</li></ol>
<blockquote><p><strong>DPAR presente = lesão orgânica de retina ou nervo óptico.</strong> É sinal objetivo de lesão aferente: está na oclusão arterial e na neurite óptica, por exemplo, e afasta perda visual funcional.</p></blockquote>
<h4>O fundo normal como referência</h4>
<p>Reconhecer o anormal exige saber o normal. O <strong>disco óptico</strong> (cerca de 1,5 mm) é rosa-pálido, com escavação fisiológica de tamanho variável. A <strong>mácula</strong> (cerca de 5,5 mm) é uma elipse no polo posterior; no centro, a <strong>fóvea</strong> (1,85 mm; muitos textos citam cerca de 1,5 mm) não tem vasos e concentra a maior densidade de cones. O <strong>reflexo foveolar</strong> é sinal de normalidade. A retina periférica vai até a ora serrata, e as <strong>artérias são mais estreitas e mais claras que as veias</strong>.</p>

<h4>O que fazer — e o que não fazer</h4>
<p>O papel do clínico cabe em seis verbos: <strong>medir</strong> a acuidade, <strong>avaliar</strong> as pupilas, <strong>olhar</strong> o fundo, <strong>não atrasar</strong>, <strong>levantar a história sistêmica</strong> e <strong>proteger o olho</strong> — em trauma, cone de proteção, nunca pressionar, e jejum se a cirurgia for possível.</p>
<div class="tbl"><table><thead><tr><th>Não...</th><th>Quando</th><th>Por quê</th></tr></thead><tbody><tr><td><strong>dilatar a pupila</strong></td><td>suspeita de glaucoma agudo de ângulo fechado</td><td>a midríase agrava o fechamento do ângulo</td></tr><tr><td><strong>pressionar o olho</strong></td><td>trauma penetrante ou suspeita de ruptura do globo</td><td>comprime um olho aberto</td></tr><tr><td><strong>dar corticoide oral isolado</strong></td><td>neurite óptica</td><td>pode piorar o prognóstico</td></tr><tr><td><strong>demorar a encaminhar</strong></td><td>OACR, endoftalmite, descolamento com mácula ameaçada, arterite de células gigantes</td><td>não esperam</td></tr><tr><td><strong>ignorar o olho contralateral</strong></td><td>arterite de células gigantes, NOIA, algumas uveítes</td><td>o risco bilateral é real</td></tr><tr><td><strong>tratar olho vermelho às cegas</strong></td><td>colírio de corticoide sem diagnóstico</td><td>pode agravar infecções</td></tr></tbody></table></div>
<blockquote><p><strong>Na dúvida, encaminhe.</strong> Melhor um encaminhamento a mais do que uma perda visual permanente — a visão perdida raramente volta.</p></blockquote>
<hr>
<h2>Oclusões vasculares da retina</h2>
<h3>Oclusão da artéria central da retina (OACR) — o "AVC da retina"</h3>
<p>É a emergência por excelência. O quadro é de <strong>perda visual súbita, indolor e profunda</strong>, quase sempre <strong>unilateral</strong>, com <strong>DPAR</strong> presente. No fundo de olho:</p>
<ul><li><strong>retina pálida</strong> — edema isquêmico das camadas internas;</li><li>mácula em <strong>"mancha vermelho-cereja"</strong> — a fóvea, fina e sem camadas internas, deixa ver a coroide ainda perfundida, que contrasta com o branco ao redor;</li><li><strong>artérias afiladas</strong>;</li><li><strong>disco óptico pálido</strong>.</li></ul>

<p><strong>Causas:</strong> embolia (carótida, coração), trombose, vasculite — sobretudo a <strong>arterite de células gigantes (GCA)</strong> — e hipercoagulabilidade.</p>
<p><strong>Conduta inicial.</strong> Quanto mais precoce a reperfusão, maior a chance de recuperação, <strong>idealmente em menos de 4 a 6 horas</strong>:</p>
<ul><li>massagem ocular digital, se o quadro for muito precoce;</li><li>redução da pressão intraocular com <strong>acetazolamida</strong>;</li><li>paracentese de câmara anterior, em serviço especializado;</li><li><strong>VHS e PCR</strong> para descartar GCA em todo paciente <strong>acima de 50 anos</strong>;</li><li><strong>Doppler de carótidas e ecocardiograma</strong>, atrás da fonte embólica;</li><li>se GCA: <strong>corticoterapia sistêmica IMEDIATA</strong>;</li><li>encaminhamento de urgência ao oftalmologista.</li></ul>
<blockquote><p><strong>Ponto divergente — medidas clássicas e janela de tempo.</strong> Massagem ocular, acetazolamida e paracentese são as medidas tradicionais listadas acima, mas revisões mais recentes — posição adotada também em <em>Descolamento de Retina e Oclusões Vasculares</em> — consideram que <strong>nenhuma delas tem benefício comprovado</strong> e tratam a OACR como AVC: encaminhamento imediato a um serviço que possa avaliar <strong>trombólise</strong> e investigar a fonte embólica. A janela "ideal" de 4 a 6 horas também convive com o dado experimental de que a retina tolera só cerca de <strong>90 a 100 minutos</strong> de isquemia total. Em qualquer leitura, OACR é emergência e não espera.</p></blockquote>
<h3>Oclusão da veia central da retina (OVCR)</h3>
<p>O sangue chega, mas não sai. O fundo de olho mostra <strong>hemorragias em chama de vela difusas</strong>, <strong>veias tortuosas e dilatadas</strong>, <strong>edema de disco</strong> e <strong>manchas algodonosas</strong>. O <strong>edema macular</strong> é a principal causa da baixa de acuidade visual. Há duas formas, <strong>isquêmica</strong> e <strong>não isquêmica</strong>, e os fatores de risco são <strong>hipertensão, diabetes e glaucoma</strong>.</p>

<p><strong>Tratamento:</strong> <strong>anti-VEGF ou corticoide</strong> para o edema macular e <strong>controle sistêmico rigoroso</strong>. Não há manobra de emergência como na arterial — por isso a OVCR é urgência, não emergência.</p>
<h3>Oclusão de ramo venoso (ORVR)</h3>
<p>É <strong>mais comum que a central</strong>. As hemorragias ficam <strong>limitadas a um quadrante</strong>, o setor drenado pela veia ocluída, e o <strong>edema macular é frequente</strong>. Os <strong>cruzamentos arteriovenosos anormais</strong> são predisponentes — a artéria espessada comprime a veia —, de modo que o <strong>controle da hipertensão é essencial</strong>. O edema macular é tratado com <strong>anti-VEGF</strong>, e o prognóstico é <strong>melhor que o da OVCR quando a fóvea é poupada</strong>.</p>

<h2>Descolamento de retina</h2>
<h3>Regmatogênico — o que se opera com pressa</h3>
<p>É uma das principais causas de <strong>perda visual evitável por cirurgia</strong>. Há uma rotura na retina, e o quadro clínico segue a sequência da tração e do descolamento:</p>
<ol><li><strong>Fotopsias</strong> (flashes) — a tração do vítreo estimula a retina;</li><li><strong>Miodesopsias</strong> (floaters) — pontos e teias flutuando;</li><li><strong>Sombra ou "cortina"</strong> no campo visual — a retina descolando;</li><li><strong>Perda visual progressiva</strong>.</li></ol>
<p><strong>Fatores de risco:</strong> miopia alta, cirurgia de catarata, trauma, degeneração em treliça (lattice) e idade.</p>
<p><strong>Achados ao exame:</strong> retina <strong>elevada, de aspecto ondulado</strong>, com <strong>vasos tortuosos</strong> sobre a área descolada; <strong>rotura</strong> em ferradura ou redonda; <strong>pigmento no vítreo</strong> ("tabaco de cachimbo"); <strong>PIO</strong> que pode estar baixa.</p>

<p><strong>Conduta:</strong></p>
<ul><li><strong>mácula ainda colada → cirurgia em menos de 24 a 48 horas</strong>;</li><li>encaminhar <strong>imediatamente</strong> ao retinólogo;</li><li>evitar esforço, repouso relativo;</li><li>não dilatar o outro olho sem necessidade.</li></ul>
<blockquote><p><strong>Ponto duvidoso — o olho contralateral.</strong> A orientação de não dilatar o outro olho sem necessidade é controversa: os fatores de risco (miopia alta, degeneração em treliça) costumam ser bilaterais, e a prática habitual do retinólogo é examinar também o olho contralateral sob midríase, à procura de roturas.</p></blockquote>
<blockquote><p><strong>Flashes + floaters + sombra = encaminhar já.</strong> Mácula ameaçada é emergência; o estado da mácula no momento da cirurgia é o que define o prognóstico visual.</p></blockquote>
<h3>Os outros tipos</h3>
<div class="tbl"><table><thead><tr><th>Tipo</th><th>Mecanismo</th><th>Causas</th><th>Evolução e conduta</th></tr></thead><tbody><tr><td><strong>Regmatogênico</strong></td><td>rotura + passagem de líquido</td><td>miopia alta, catarata operada, trauma, lattice</td><td>cirurgia urgente</td></tr><tr><td><strong>Tracional</strong></td><td>membranas fibrovasculares puxam a retina</td><td>retinopatia diabética proliferativa, ROP</td><td>evolução geralmente <strong>mais lenta</strong></td></tr><tr><td><strong>Exsudativo</strong></td><td>fluido acumulado <strong>sem rotura</strong></td><td>tumores, inflamação, coroidopatia serosa central grave, hipertensão maligna</td><td><strong>trata-se a causa de base</strong></td></tr><tr><td><strong>Combinado</strong></td><td>tração + rotura</td><td>diabéticos após cirurgia, ROP avançada</td><td>misto</td></tr></tbody></table></div>
<blockquote><p>O exsudativo é a pegadinha: sem rotura, não há o que fechar cirurgicamente — trata-se a doença de base (o VKH, por exemplo, com corticoide sistêmico).</p></blockquote>

<h2>Neuropatias ópticas e papiledema</h2>
<h3>Neurite óptica</h3>
<p>Inflamação do nervo óptico e importante causa de perda visual <strong>em jovens</strong>. O quadro:</p>
<ul><li>perda visual <strong>subaguda</strong> — horas a dias, não minutos;</li><li><strong>dor à movimentação ocular</strong>;</li><li><strong>DPAR</strong> presente;</li><li>disco <strong>normal</strong> (forma retrobulbar) ou <strong>edemaciado</strong>;</li><li><strong>disromatopsia</strong> — as cores parecem "desbotadas";</li><li>associação clássica com <strong>esclerose múltipla</strong>.</li></ul>
<p><strong>Conduta:</strong> <strong>RM + corticoide endovenoso (metilprednisolona)</strong>. <strong>Não usar corticoide oral isolado.</strong></p>
<blockquote><p><strong>Nuance — o corticoide na neurite.</strong> No estudo clássico de tratamento da neurite óptica (ONTT), a metilprednisolona EV <strong>acelerou a recuperação, mas não mudou a acuidade visual final</strong>; a prednisona oral em dose baixa, isolada, <strong>aumentou as recorrências</strong>. É daí que vem a regra do "oral isolado, não". O pulso EV, portanto, é uma decisão para acelerar a recuperação, mais do que uma medida que muda o desfecho visual.</p></blockquote>
<h3>Neuropatia óptica isquêmica anterior (NOIA)</h3>
<p>Duas doenças com o mesmo nome e condutas opostas:</p>
<div class="tbl"><table><thead><tr><th></th><th><strong>NOIA não arterítica</strong></th><th><strong>NOIA arterítica (GCA)</strong></th></tr></thead><tbody><tr><td><strong>Frequência</strong></td><td><strong>mais frequente</strong></td><td>menos frequente</td></tr><tr><td><strong>Perfil</strong></td><td>HAS, DM, apneia do sono, disco "lotado"</td><td>idoso com <strong>arterite de células gigantes</strong></td></tr><tr><td><strong>Sintomas</strong></td><td>perda visual súbita e indolor</td><td>cefaleia, <strong>claudicação mandibular</strong>, perda visual súbita</td></tr><tr><td><strong>Disco</strong></td><td><strong>edema segmentar</strong></td><td><strong>pálido e edemaciado</strong></td></tr><tr><td><strong>Campo</strong></td><td><strong>defeito altitudinal</strong></td><td>grave</td></tr><tr><td><strong>Laboratório</strong></td><td>VHS e PCR normais</td><td><strong>VHS e PCR muito elevados</strong></td></tr><tr><td><strong>Olho contralateral</strong></td><td>risco de cerca de <strong>15 a 20%</strong></td><td>risco de cegueira <strong>em dias</strong></td></tr><tr><td><strong>Conduta</strong></td><td>sem tratamento específico comprovado; controle de fatores de risco</td><td><strong>corticoterapia sistêmica IMEDIATA</strong> + biópsia de artéria temporal</td></tr></tbody></table></div>
<blockquote><p><strong>NOIA arterítica: corticoide imediato, sem esperar a biópsia.</strong> O objetivo principal é proteger o olho que ainda enxerga.</p></blockquote>
<h3>Papiledema</h3>
<p>É o <strong>edema de disco secundário ao aumento da pressão intracraniana</strong> — e papiledema é pressão intracraniana alta até prova em contrário.</p>
<p><strong>Sinais:</strong> hiperemia e elevação do disco, borramento das margens, hemorragias peripapilares e ausência de pulso venoso espontâneo (sinal de apoio: o pulso venoso falta também em parte das pessoas normais). <strong>Sintomas:</strong> cefaleia, náuseas, escurecimentos visuais transitórios e <strong>diplopia por paresia do VI par</strong>.</p>
<p><strong>Causas:</strong> tumor, trombose venosa cerebral, hipertensão intracraniana idiopática e meningite.</p>

<h2>Trauma ocular</h2>
<h3>Comotio retinae (edema de Berlin)</h3>
<p>Opacificação retiniana <strong>cinza-esbranquiçada</strong> após <strong>trauma contuso</strong>, por edema e desarranjo dos fotorreceptores. A maioria das lesões <strong>periféricas resolve espontaneamente</strong>; o <strong>comotio macular pode deixar sequela</strong>. O comotio em si não é o problema principal — o problema é o que pode estar junto. Por isso:</p>

<h3>Outras lesões traumáticas</h3>
<div class="tbl"><table><thead><tr><th>Lesão</th><th>Como aparece</th><th>Conduta e risco</th></tr></thead><tbody><tr><td><strong>Ruptura de coroide</strong></td><td>linhas concêntricas amarelo-esbranquiçadas</td><td>risco de <strong>neovascularização tardia</strong></td></tr><tr><td><strong>Buraco macular traumático</strong></td><td>imediato ou dias após o trauma</td><td>avaliar cirurgia</td></tr><tr><td><strong>Corpo estranho intraocular</strong></td><td>suspeitar sempre em trauma com <strong>metal</strong></td><td><strong>radiografia ou TC</strong>; remoção</td></tr><tr><td><strong>Ruptura do globo</strong></td><td>olho aberto</td><td><strong>emergência cirúrgica</strong>: não pressionar, <strong>cone de proteção</strong>, <strong>antibiótico EV</strong></td></tr></tbody></table></div>
<blockquote><p><strong>Trauma: nunca pressionar.</strong> Proteger com cone, manter em jejum se a cirurgia for possível e avaliar o fundo quando for seguro.</p></blockquote>
<hr>
<h2>Endoftalmite e uveítes posteriores</h2>
<h3>Endoftalmite — emergência infecciosa</h3>
<p>Inflamação intraocular grave, capaz de <strong>destruir o olho em horas a dias</strong> se não tratada agressivamente.</p>
<p><strong>Apresentação:</strong> dor intensa + hiperemia + baixa visual, com <strong>hipópio</strong> frequente. A maioria é <strong>pós-cirúrgica</strong> (catarata) ou <strong>pós-traumática</strong>; a forma <strong>endógena</strong> (septicemia) é menos comum, e <strong>fungos</strong> aparecem em usuários de drogas e imunossuprimidos.</p>
<p><strong>Conduta:</strong> encaminhamento <strong>imediato</strong>; <strong>coleta de material + antibiótico intravítreo</strong>; <strong>vitrectomia</strong> nos casos graves; <strong>antibiótico sistêmico</strong> na forma endógena.</p>
<blockquote><p><strong>Nunca tratar endoftalmite apenas com colírios.</strong> O antibiótico tem de chegar à cavidade vítrea.</p></blockquote>
<h3>Uveítes posteriores que podem ser urgentes</h3>
<div class="tbl"><table><thead><tr><th>Doença</th><th>Pista</th><th>Tratamento</th></tr></thead><tbody><tr><td><strong>Toxoplasmose ocular</strong></td><td>lesão focal branca com vitreíte — <strong>"farol na neblina"</strong>; pode ameaçar a mácula</td><td>sulfadiazina + pirimetamina ou sulfametoxazol-trimetoprima</td></tr><tr><td><strong>Vogt-Koyanagi-Harada</strong></td><td><strong>descolamento exsudativo bilateral</strong>, cefaleia, tinido, vitiligo</td><td>corticoide sistêmico em <strong>alta dose</strong></td></tr><tr><td><strong>Necrose retiniana aguda</strong></td><td>herpesvírus; retinite necrosante periférica + oclusões vasculares; risco de descolamento</td><td><strong>antiviral EV urgente</strong></td></tr><tr><td><strong>Doença de Behçet</strong></td><td>vasculite oclusiva, hipópio, aftas; perda visual rápida</td><td>imunossupressão agressiva</td></tr></tbody></table></div>
<hr>
<h2>Urgências no diabético e no prematuro</h2>
<h3>Retinopatia diabética</h3>
<p>O diabético tem urgências próprias:</p>
<ul><li><strong>hemorragia vítrea</strong> — causa de perda visual súbita;</li><li><strong>descolamento tracional</strong>;</li><li><strong>neovascularização do ângulo → glaucoma neovascular</strong>;</li><li><strong>edema macular</strong> — não é emergência, mas é importante.</li></ul>
<p><strong>Conduta:</strong> <strong>ultrassom</strong> se o fundo não for visível (é ele que mostra o que há atrás do sangue); <strong>anti-VEGF + panfotocoagulação</strong>; controle glicêmico e pressórico rigoroso; encaminhamento ao retinólogo.</p>
<h3>Retinopatia da prematuridade (ROP)</h3>
<p>O tema é do clínico e do pediatra porque o rastreamento depende deles:</p>
<ul><li>afeta prematuros de baixo peso — em geral <strong>abaixo de 1.500 g ou de 32 semanas</strong>;</li><li>a <strong>triagem oftalmológica é obrigatória</strong> conforme os protocolos nacionais, e o pediatra ou neonatologista deve garanti-la no tempo certo;</li><li>classifica-se em <strong>estágios 1 a 5</strong>; a <strong>doença plus</strong> aumenta o risco;</li><li>tratamento com <strong>laser ou anti-VEGF</strong> quando indicado (<strong>tipo 1</strong>);</li><li>sem tratamento, pode evoluir para <strong>descolamento tracional e cegueira</strong>;</li><li>sequelas possíveis: <strong>miopia alta, estrabismo e ambliopia</strong>.</li></ul>
<hr>
<h2>Perda visual súbita: o raciocínio em duas perguntas</h2>
<p>Diante de perda visual súbita, duas perguntas organizam quase todo o diferencial: <strong>há dor ocular?</strong> E, se não há, <strong>como está o fundo de olho?</strong></p>
<div class="tbl"><table><thead><tr><th><strong>Com dor</strong></th><th><strong>Sem dor + fundo anormal</strong></th><th><strong>Sem dor + fundo normal</strong></th></tr></thead><tbody><tr><td>glaucoma agudo</td><td>oclusão arterial</td><td>neurite retrobulbar</td></tr><tr><td>neurite óptica</td><td>oclusão venosa</td><td>amaurose fugaz</td></tr><tr><td>endoftalmite</td><td>descolamento de retina</td><td>lesão de via óptica</td></tr><tr><td>uveíte anterior grave</td><td>hemorragia vítrea</td><td>conversão (mas sempre reavaliar)</td></tr><tr><td>celulite orbitária</td><td>NOIA</td><td>—</td></tr></tbody></table></div>
<h4>O fluxograma</h4>
<ol><li><strong>Perda visual súbita</strong> → há dor ocular?</li><li><strong>Sim</strong> → pensar em glaucoma agudo, neurite, endoftalmite, trauma.</li><li><strong>Não</strong> → a fundoscopia é possível?</li><li><strong>Fundo anormal</strong> → oclusão, descolamento, hemorragia vítrea, NOIA.</li><li><strong>Fundo normal</strong> → neurite retrobulbar, lesão de via óptica — e reavaliar.</li></ol>
<blockquote><p><strong>Contradição aparente — a neurite retrobulbar.</strong> Ela aparece no grupo "sem dor + fundo normal", mas a neurite óptica, inclusive a retrobulbar, costuma doer à movimentação ocular na grande maioria dos casos. O que a coloca nessa coluna é o <strong>fundo normal</strong> ("o paciente não vê, e o médico também não vê nada"); a dor à movimentação, quando presente, reforça o diagnóstico em vez de excluí-lo.</p></blockquote>
<h4>Pontos-chave para memorizar</h4>
<ul><li><strong>OACR = emergência.</strong> Tempo é visão. Investigar arterite de células gigantes em idosos.</li><li><strong>Descolamento de retina:</strong> flashes + floaters + sombra = encaminhar já.</li><li><strong>NOIA arterítica:</strong> corticoide imediato, sem esperar a biópsia.</li><li><strong>Papiledema</strong> = pressão intracraniana alta até prova em contrário; neuroimagem antes da punção.</li><li><strong>Trauma:</strong> nunca pressionar; proteger; avaliar o fundo quando possível.</li><li><strong>DPAR presente</strong> = lesão orgânica de retina ou nervo óptico.</li><li><strong>Na dúvida, encaminhe.</strong> A visão perdida raramente volta.</li></ul></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +
      '</button>';
  }).join('');

  var expl = reveal ? '<div style="margin-top:20px;padding:16px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;animation:qFade .26s ease">' +

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
