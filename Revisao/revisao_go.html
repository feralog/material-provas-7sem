ção por sítio anatômico e escore total correspondente a cada estágio<\/p>"},{"html":"<blockquote><p><strong>O estadiamento não mede a dor.<\/strong> A intensidade da dor <strong>não<\/strong> está relacionada ao estádio: endometriose mínima pode ser incapacitante e doença estádio IV pode doer pouco. Estadiar serve ao planejamento cirúrgico e ao prognóstico reprodutivo, não à decisão de tratar a dor. Essa dissociação, somada à falta de modelo animal adequado — só primatas superiores menstruam; os demais têm ciclo estral —, é o que torna a endometriose tão difícil de estudar.<\/p><\/blockquote>"}]},{"h":"Diagnóstico","blocos":[{"html":"<h3>Exame ginecológico<\/h3>"},{"html":"<p>A sequência é vulva, exame especular e <strong>toque bimanual<\/strong>. O que se procura no toque:<\/p>"},{"html":"<ul><li>Útero <strong>fixo<\/strong> e <strong>retrovertido<\/strong> pela retração cicatricial<\/li><li>Espessamento e dor nos <strong>ligamentos uterossacros<\/strong><\/li><li><strong>Nódulo<\/strong> palpável em fundo de saco posterior<\/li><\/ul>"},{"html":"<p class=\"figleg\">Toque bimanual: implantes em fundo de saco posterior e em ligamentos uterossacros<\/p>"},{"html":"<h3>Laboratório<\/h3>"},{"html":"<p><strong>CA-125 — não.<\/strong> O marcador não confirma nem afasta o diagnóstico: eleva-se em diversas condições benignas e malignas e pode estar normal em doença extensa. Pedi-lo como teste diagnóstico ou de rastreamento é erro conceitual.<\/p>"},{"html":"<h3>Imagem<\/h3>"},{"html":"<ul><li><strong>Ultrassonografia pélvica / endovaginal com preparo intestinal<\/strong> — exame de primeira linha. O preparo é o que permite avaliar a parede do reto-sigmoide, identificar nódulos retrocervicais, medir sua extensão e pesquisar o bloqueio do fundo de saco de Douglas (perda do sinal de deslizamento).<\/li><li><strong>Ressonância magnética de pelve<\/strong> — mapeia nódulos profundos e o septo retovaginal.<\/li><li><strong>Colonoscopia<\/strong> e <strong>ecocolonoscopia<\/strong> — avaliam o acometimento da parede intestinal e sua profundidade, informação decisiva quando se cogita ressecção segmentar.<\/li><\/ul>"},{"html":"<p class=\"figleg\">Ultrassonografia com preparo: nódulo retrocervical hipoecogênico e bloqueio do fundo de saco de Douglas<\/p>"}]},{"h":"Tratamento","blocos":[{"html":"<p>As opções terapêuticas se organizam em dois alvos distintos: tratar os <strong>sintomas<\/strong> e tratar a <strong>doença<\/strong>. Trata-se diante de <strong>dor<\/strong>, de <strong>sintomas intestinais ou urinários<\/strong> e de <strong>infertilidade<\/strong> — não se trata achado incidental assintomático só porque ele existe.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Linha<\/th><th>Fármaco / procedimento<\/th><th>Quando indicar<\/th><th>Ressalva<\/th><\/tr><\/thead><tbody><tr><td>Sintomática<\/td><td>Anti-inflamatórios e analgésicos<\/td><td>Dismenorreia e dor de intensidade leve a moderada<\/td><td>Controla o sintoma, não age sobre a doença<\/td><\/tr><tr><td>Hormonal de 1ª linha<\/td><td>Contraceptivo oral combinado<\/td><td>Dor e dismenorreia, paciente sem desejo gestacional imediato<\/td><td>Contraindicado se houver risco tromboembólico<\/td><\/tr><tr><td>Hormonal de 1ª linha<\/td><td>Progestágenos<\/td><td>Dor e dismenorreia; alternativa quando o estrogênio é contraindicado<\/td><td>Sangramento de escape é causa frequente de abandono<\/td><\/tr><tr><td>Hormonal de 2ª linha<\/td><td>Análogo de GnRH<\/td><td>Dor refratária ao esquema inicial; preparo pré-operatório<\/td><td>Hipoestrogenismo: fogachos e perda de massa óssea<\/td><\/tr><tr><td>Hormonal de 2ª linha<\/td><td>Inibidores da aromatase<\/td><td>Doença refratária às opções anteriores<\/td><td>Uso prolongado exige atenção à massa óssea<\/td><\/tr><tr><td>Cirúrgico<\/td><td>Exérese das lesões e reconstituição da anatomia<\/td><td>Nódulo profundo, endometrioma, falha clínica, infertilidade<\/td><td>Risco de lesão ureteral e intestinal; pode reduzir reserva ovariana<\/td><\/tr><tr><td>Cirúrgico definitivo<\/td><td>Histerectomia com ou sem ooforectomia<\/td><td>Doença grave, prole constituída, falha de todas as opções<\/td><td>Irreversível; decisão compartilhada e documentada<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p><strong>O que define a indicação cirúrgica<\/strong> não é o estádio nem o tamanho do foco, e sim a combinação de <strong>sintoma que não responde ao tratamento clínico<\/strong>, <strong>comprometimento funcional de órgão<\/strong> (nódulo obstruindo ureter ou intestino) e <strong>infertilidade a esclarecer ou tratar<\/strong>. Operar endometriose assintomática descoberta por acaso não melhora desfecho e expõe a paciente a risco desnecessário.<\/p><\/blockquote>"},{"html":"<h3>Abordagem multidisciplinar<\/h3>"},{"html":"<p>A dor pélvica crônica raramente se resolve com um único profissional. O cuidado reúne <strong>nutrição<\/strong>, <strong>atividade física<\/strong>, <strong>fisioterapia<\/strong> (sobretudo do assoalho pélvico), <strong>psicologia<\/strong>, <strong>manejo da dor e acupuntura<\/strong>, <strong>urologia<\/strong> e <strong>coloproctologia<\/strong>. É também a única forma de atacar simultaneamente as várias causas sobrepostas que, como se viu, são a regra e não a exceção nesses quadros.<\/p>"}]}]},{"slug":"hemorragias","titulo":"Hemorragias da Primeira Metade e Gestação Ectópica","disciplina":"GO","eyebrow":"Obstetrícia · Primeira Metade da Gestação","questoes":[{"id":"b53c55fa8b","q":"Como o abortamento é clinicamente conceituado quanto ao limite de idade gestacional e peso fetal?","opts":["Antes de 20 semanas ou com peso fetal inferior a 500 gramas","Antes de 24 semanas ou com peso fetal inferior a 800 gramas","Antes de 16 semanas ou com peso fetal inferior a 300 gramas","Antes de 28 semanas ou com peso fetal inferior a 1.000 gramas"],"c":0,"exp":"Abortamento é definido como a interrupção da gravidez antes das 20 semanas ou quando o peso fetal for inferior a 500 gramas. Cronologicamente é precoce até 12 semanas e tardio entre 12 e 20 semanas. Os abortamentos clinicamente reconhecidos têm incidência de 10% a 15% e, destes, 80% ocorrem antes das 12 semanas.","ref":[1,2]},{"id":"e636a41f6b","q":"Qual é a causa mais frequente de abortamento no primeiro trimestre?","opts":["Anomalias cromossômicas, responsáveis por 50% a 80% dos casos","Incompetência istmocervical, responsável por 30% a 50% dos casos","Síndrome antifosfolípide, responsável por 40% a 60% dos casos","Miomas submucosos uterinos, responsáveis por 20% a 40% dos casos"],"c":0,"exp":"As alterações cromossômicas e genéticas são as causas mais comuns de abortamento no primeiro trimestre, ocorrendo em 50% a 80% dos casos. Erros na meiose II explicam a maioria das trissomias e relacionam-se à idade materna avançada. A incompetência istmocervical, por sua vez, é causa de perda fetal tardia, no segundo trimestre.","ref":[1,4]},{"id":"4edadb0095","q":"Quais trissomias estão mais associadas ao abortamento, em ordem decrescente de frequência?","opts":["Trissomia do cromossomo 16, seguida pela do 22 e pela do 21","Trissomia do cromossomo 21, seguida pela do 18 e pela do 13","Trissomia do cromossomo 13, seguida pela do 15 e pela do 14","Trissomia do cromossomo 22, seguida pela do 21 e pela do 16"],"c":0,"exp":"As trissomias mais relacionadas ao abortamento, em ordem decrescente de frequência, envolvem os cromossomos 16, 22, 21, 15, 13, 2 e 14. A trissomia do 16 é a mais frequente entre os produtos de abortamento, ao contrário da trissomia do 21, que é a mais frequente entre os nascidos vivos.","ref":[1,4]},{"id":"f6bac8e50b","q":"Como se define o abortamento habitual (recorrente)?","opts":["Dois ou mais abortamentos espontâneos consecutivos","Cinco ou mais abortamentos espontâneos consecutivos","Um único abortamento espontâneo antes de 12 semanas","Quatro ou mais abortamentos espontâneos alternados"],"c":0,"exp":"Define-se abortamento habitual como a ocorrência consecutiva de dois (ou três, conforme a referência) ou mais abortamentos espontâneos. O risco de recorrência sobe progressivamente: 20% após um aborto, 30% após dois consecutivos e mais de 40% após três ou mais.","ref":[1,2]},{"id":"a108386794","q":"Gestante de 9 semanas apresenta sangramento vaginal discreto e cólica leve. Colo impérvio ao toque, útero compatível com a idade gestacional e USTV com embrião vivo e BCF presente. Qual a conduta?","opts":["Conduta expectante, com repouso relativo e reavaliação se piora","Esvaziamento uterino imediato por aspiração manual intrauterina","Curetagem uterina de urgência após dilatação com velas de Hegar","Misoprostol 800 mcg por via vaginal, repetido a cada doze horas"],"c":0,"exp":"O quadro é de ameaça de abortamento: sangramento com colo fechado e embrião vivo. Nenhuma medida é comprovadamente eficaz para mudar o prognóstico — indica-se repouso relativo, analgésicos antiespasmódicos, progesterona e abstinência sexual, mantendo vigilância. Metade das ameaças evolui para perda gestacional efetiva.","ref":[3,1]},{"id":"449785387f","q":"Qual achado diferencia o abortamento inevitável do abortamento em curso?","opts":["No inevitável o colo está aberto e o conceito ainda está no útero","No inevitável o colo está fechado e o embrião já perdeu os BCF","No inevitável há febre alta e secreção vaginal purulenta e fétida","No inevitável o útero já está vazio e o sangramento regrediu logo"],"c":0,"exp":"No abortamento inevitável há sangramento moderado a acentuado com cólicas fortes e colo apagado e dilatado, mas o conceito ainda se encontra totalmente dentro da cavidade uterina. No abortamento em curso já existe processo ativo de expulsão do material ovular através do canal cervical.","ref":[2,4]},{"id":"4054060edf","q":"Qual espessura endometrial à USTV separa o abortamento incompleto do abortamento completo?","opts":["Acima de 15 mm com material heterogêneo indica aborto incompleto","Acima de 30 mm com material heterogêneo indica aborto incompleto","Abaixo de 8 mm com cavidade uterina limpa indica aborto incompleto","Acima de 25 mm com cavidade uterina limpa indica aborto completo"],"c":0,"exp":"O ponto de corte é 15 mm: eco endometrial acima de 15 mm com material heterogêneo caracteriza abortamento incompleto e indica esvaziamento uterino. Abaixo de 15 mm, com cavidade limpa e regressão da dor e do sangramento, trata-se de abortamento completo, com conduta expectante e seguimento ambulatorial.","ref":[2,8]},{"id":"21b9f39d29","q":"Segundo os critérios definitivos da SRU/ACOG, qual achado ultrassonográfico fecha o diagnóstico de gestação inviável?","opts":["CCN maior ou igual a 7 mm sem atividade cardíaca fetal","CCN maior ou igual a 3 mm sem atividade cardíaca fetal","DMSG maior ou igual a 16 mm sem embrião visualizado","Vesícula vitelínica com diâmetro menor do que 3 mm"],"c":0,"exp":"Comprimento cabeça-nádega (CCN) maior ou igual a 7 mm sem batimentos cardíacos é critério definitivo de gestação inviável. CCN menor que 7 mm sem atividade cardíaca e saco gestacional entre 16 e 24 mm sem embrião são apenas critérios suspeitos, exigindo repetição do exame antes de indicar esvaziamento.","ref":[5,5]},{"id":"56238d8a50","q":"Qual diâmetro médio do saco gestacional sem embrião visualizado confirma, isoladamente, gestação inviável?","opts":["DMSG maior ou igual a 25 mm sem embrião visualizado","DMSG maior ou igual a 12 mm sem embrião visualizado","DMSG maior ou igual a 40 mm sem embrião visualizado","DMSG maior ou igual a 18 mm sem embrião visualizado"],"c":0,"exp":"Diâmetro médio do saco gestacional (DMSG) igual ou superior a 25 mm sem embrião visualizado é critério diagnóstico definitivo de gestação inviável pela SRU/ACOG. Valores entre 16 e 24 mm sem embrião são apenas suspeitos. Vesícula vitelínica volumosa, acima de 7 mm, também é achado suspeito.","ref":[8,4]},{"id":"e4b30359ee","q":"Qual esquema antibiótico é indicado no abortamento infectado, iniciado antes do esvaziamento uterino?","opts":["Clindamicina associada a gentamicina por via endovenosa","Azitromicina associada a fluconazol por via endovenosa","Nitrofurantoína associada a cefalexina por via oral","Penicilina benzatina em dose única por via intramuscular"],"c":0,"exp":"O abortamento infectado é polimicrobiano (E. coli, estreptococos anaeróbios, Clostridium perfringens) e exige clindamicina + gentamicina IV ou ampicilina + gentamicina + metronidazol. A antibioticoterapia é iniciada primeiro e o esvaziamento uterino é feito em seguida, em caráter de urgência; pode ser necessária laparotomia.","ref":[3,1]},{"id":"f6dafa3e50","q":"Qual é o método de escolha para esvaziamento uterino em gestações de até 12 semanas?","opts":["AMIU, por ser menos invasiva e ter menos complicações","Curetagem, por ser mais rápida e ter menos complicações","Histerotomia, por ser mais segura e causar menos sangramento","Ocitocina venosa, por ser mais simples e dispensar o bloco"],"c":0,"exp":"Em abortamentos de até 12 semanas a AMIU é a técnica de escolha, por ser menos invasiva e ter menor índice de complicações que a curetagem — menor taxa de perfuração uterina, menos dor e menor risco de sinéquias (síndrome de Asherman). Acima de 12 semanas indica-se curetagem, após a expulsão fetal.","ref":[3,5]},{"id":"1cc90049a3","q":"Qual é o esquema de misoprostol recomendado no abortamento retido de primeiro trimestre?","opts":["800 mcg por via vaginal, 2 a 3 doses, a cada 12 horas","400 mcg por via vaginal, em dose única, sem repetição","200 mcg por via vaginal, a cada 4 a 6 horas, até expulsão","600 mcg por via oral, em duas doses, a cada 24 horas"],"c":0,"exp":"Pela FIGO, no aborto retido de primeiro trimestre usam-se 2 a 3 doses de 800 mcg de misoprostol por via vaginal a cada 12 horas. A pegadinha é o abortamento incompleto, que recebe 400 mcg em dose única; já no segundo trimestre são 200 mcg vaginais a cada 4 a 6 horas, seguidos de tratamento cirúrgico.","ref":[3,3]},{"id":"10f014f6f2","q":"Qual método de esvaziamento uterino é o de escolha nos casos de mola hidatiforme?","opts":["Aspiração a vácuo, que acrescenta o sistema de sucção à AMIU","Curetagem uterina clássica, com cureta romba de grande calibre","Ocitocina endovenosa em altas doses antes de qualquer aspiração","Histerectomia total abdominal com preservação de ambos os anexos"],"c":0,"exp":"A aspiração a vácuo é semelhante à AMIU, apenas acrescentando o sistema a vácuo, e é o método de escolha nos casos de mola. Todo o material deve ser enviado para exame anatomopatológico. A curetagem convencional aumenta o risco de perfuração e de sinéquias em um útero amolecido e volumoso.","ref":[7,10]},{"id":"8eb0698ce0","q":"Qual é o quadro clínico típico da incompetência istmocervical?","opts":["Dilatação cervical indolor, sem sangramento, com feto vivo e normal","Cólicas intensas com sangramento abundante e feto já sem batimentos","Febre alta com secreção purulenta e dor à mobilização do colo uterino","Sangramento escuro em borra de café com dor unilateral em fossa ilíaca"],"c":0,"exp":"A incompetência istmocervical cursa com dilatação cervical indolor até 4 a 6 cm, ausência de sangramento, protrusão das membranas ovulares na vagina, rotura de membranas e expulsão de feto morfologicamente normal e vivo. É causa de perda fetal tardia recorrente, e o diagnóstico costuma ser retrospectivo.","ref":[1,11]},{"id":"93448e4e0e","q":"Qual achado comprova a incompetência istmocervical fora do período gestacional?","opts":["Passagem da vela de Hegar de 8 mm pelo orifício interno do colo","Passagem da vela de Hegar de 3 mm pelo orifício interno do colo","Colo uterino medindo menos de 25 mm à ultrassonografia transvaginal","Orifício interno do colo fechado ao toque vaginal bimanual seriado"],"c":0,"exp":"Fora da gestação, a passagem da vela de Hegar de 8 mm pelo orifício interno comprova a incompetência istmocervical. A histerossalpingografia mostra largura do segmento istmocervical, na altura do orifício interno, superior a 8 mm. Colo menor que 25 mm à USTV é critério para cerclagem terapêutica, não diagnóstico de IIC.","ref":[1,14]},{"id":"a3188f8d93","q":"Pela tabela de tipos de cerclagem, qual é o período indicado para a cerclagem eletiva?","opts":["Entre 12 e 16 semanas, antes que ocorra a cervicodilatação","Entre 20 e 24 semanas, assim que o colo começa a se dilatar","Entre 24 e 28 semanas, após confirmar o encurtamento do colo","Entre 6 e 10 semanas, logo após a confirmação da gravidez"],"c":0,"exp":"A cerclagem eletiva é indicada por histórico de uma ou mais perdas fetais no segundo trimestre na ausência de trabalho de parto, e é feita antes da cervicodilatação, entre 12 e 16 semanas. As cerclagens terapêutica e de urgência não devem ultrapassar 24 semanas. A técnica mais utilizada é a de McDonald.","ref":[1,16]},{"id":"8a1138557f","q":"O que caracteriza a síndrome antifosfolípide como causa de abortamento habitual?","opts":["Trombofilia autoimune presente em cerca de 20% desses casos","Trombofilia hereditária presente em cerca de 70% desses casos","Doença infecciosa crônica presente em cerca de 50% dos casos","Alteração cromossômica materna presente em 40% desses casos"],"c":0,"exp":"A SAF é uma trombofilia autoimune associada a tromboses e infartos placentários, prevalente em cerca de 20% das mulheres com abortamento habitual. Os autoanticorpos envolvidos são o anticoagulante lúpico, a anticardiolipina e o anti-beta-2-glicoproteína I.","ref":[1,7]},{"id":"b4724bd075","q":"Qual é o sítio mais frequente de implantação da gestação ectópica?","opts":["Ampola tubária, responsável por 70% a 80% dos casos","Istmo tubário, responsável por 40% a 50% dos casos","Ovário, responsável por 20% a 30% dos casos totais","Cicatriz de cesárea, responsável por 15% dos casos"],"c":0,"exp":"A ampola tubária concentra 70% a 80% das gestações ectópicas, por ser o segmento de parede mais distensível. O istmo responde por 12%, as fímbrias por 5% e os sítios intersticial, ovariano, abdominal e em cicatriz de cesárea somam 5% a 8%. A ectópica ocorre em 1% a 2% de todas as gestações.","ref":[4,6]},{"id":"ae8a5ec308","q":"Por que a gestação ectópica ístmica costuma romper mais precocemente?","opts":["O istmo tem menor calibre, rompendo entre 6 e 8 semanas","O istmo tem parede mais distensível, rompendo após 12 semanas","O istmo recebe menor aporte sanguíneo que os outros segmentos","O istmo favorece o abortamento tubário antes de qualquer rotura"],"c":0,"exp":"O istmo tem menor calibre e parede menos distensível que a ampola, o que leva à ruptura precoce, entre 6 e 8 semanas. A implantação nas fímbrias, ao contrário, tende a cursar com abortamento tubário espontâneo, e as formas intersticial/cornual cursam com hemorragia cataclísmica quando rompem.","ref":[4,6]},{"id":"a29b8e7338","q":"Qual antecedente eleva em 7 a 10 vezes o risco de gestação ectópica?","opts":["Gestação ectópica prévia","Tabagismo ativo atual","Endometriose pélvica","Uso atual de DIU de cobre"],"c":0,"exp":"A história de gravidez ectópica prévia é o fator de risco isolado mais importante, multiplicando o risco por 7 a 10 vezes. Doença inflamatória pélvica, cirurgia tubária prévia, tabagismo, endometriose, reprodução assistida e uso atual de DIU também são fatores de risco, mas de magnitude menor.","ref":[4,4]},{"id":"64c20e270f","q":"Quais elementos compõem a tríade clássica da gestação ectópica?","opts":["Atraso menstrual, sangramento vaginal e dor abdominal","Febre alta, sangramento vaginal e dor abdominal difusa","Atraso menstrual, hiperêmese e altura uterina aumentada","Sangramento com vesículas, cólica e colo uterino aberto"],"c":0,"exp":"A tríade é amenorreia (ou irregularidade menstrual), sangramento vaginal e dor abdominal, mas está presente em apenas 50% das pacientes na apresentação inicial. O sangramento é escasso e escuro, em borra de café, por descamação do endométrio decidualizado; a dor é unilateral, em fossa ilíaca, de início súbito.","ref":[4,8]},{"id":"9cd9878741","q":"Paciente com suspeita de gestação ectópica apresenta abaulamento e dor intolerável ao toque no fundo de saco posterior. Esse achado corresponde a qual sinal?","opts":["Sinal de Proust","Sinal de Cullen","Sinal de Laffont","Sinal de Blumberg"],"c":0,"exp":"O sinal de Proust, ou grito de Douglas, é o abaulamento doloroso do fundo de saco posterior pelo acúmulo de sangue. Cullen é a equimose periumbilical, Laffont é a dor irradiada para o ombro por irritação frênica e Blumberg é a dor à descompressão brusca abdominal.","ref":[4,12]},{"id":"c45b4fb76f","q":"Paciente com ectópica rota refere dor irradiada para o ombro direito. Como se explica esse achado?","opts":["Sinal de Laffont, por irritação do nervo frênico","Sinal de Cullen, por sangue no tecido subcutâneo","Sinal de Proust, por sangue no fundo de saco","Sinal de Grey-Turner, por equimose nos flancos"],"c":0,"exp":"O sinal de Laffont é a dor no ombro por irradiação pelo nervo frênico, decorrente da irritação do diafragma pelo sangue do hemoperitônio. Cullen é a equimose periumbilical e Grey-Turner a equimose nos flancos, ambos indicando grande hemoperitônio.","ref":[4,12]},{"id":"874df4a5ad","q":"No fluxograma de associação entre beta-hCG e ultrassonografia, qual valor com cavidade uterina vazia já firma o diagnóstico de gestação ectópica?","opts":["Valor maior ou igual a 3.500 mUI/mL","Valor maior ou igual a 1.000 mUI/mL","Valor menor que 3.500 mUI/mL","Valor menor que 1.000 mUI/mL"],"c":0,"exp":"Pelo fluxograma, com útero vazio e ausência de massa anexial, beta-hCG maior ou igual a 3.500 mUI/mL fecha o diagnóstico de gestação ectópica. Abaixo de 3.500 repete-se o beta-hCG em 48 horas: subida acima de 50% sugere gravidez tópica; subida menor que 49% indica gravidez inviável tópica ou ectópica.","cap":"Fluxograma beta-hCG e ultrassonografia (MS 2022)","ref":[5,5]},{"id":"207c4beb7a","q":"Pelo fluxograma da gravidez de localização desconhecida, o que significa hCG entre 2.000 e 3.000 mUI/mL com útero vazio?","opts":["Suspeita de gravidez ectópica","Diagnóstico de gravidez ectópica","Resultado inconclusivo do exame","Confirmação de gravidez tópica"],"c":0,"exp":"Na faixa intermediária de 2.000 a 3.000 mUI/mL com útero vazio, o fluxograma classifica como suspeita de gravidez ectópica. Abaixo de 2.000 mUI/mL o resultado é inconclusivo e exige repetição; acima de 3.000 mUI/mL considera-se o diagnóstico de gravidez ectópica estabelecido.","ref":[5,4]},{"id":"5fa62ef336","q":"Qual é o comportamento esperado do beta-hCG quantitativo em uma gestação intrauterina viável?","opts":["Duplicar a cada 48 a 72 horas, com alta mínima de 35% a 53%","Duplicar a cada 12 a 24 horas, com alta mínima de 80% a 90%","Manter-se estável nas 48 horas, com variação inferior a 10%","Cair progressivamente 15% a cada 48 horas até a 12ª semana"],"c":0,"exp":"Em gestações intrauterinas viáveis os níveis de beta-hCG duplicam a cada 48 a 72 horas, com aumento mínimo esperado de 35% a 53% em 48 horas. Subida em platô (menor que 35%) ou queda lenta sugere gestação inviável ou ectópica. Progesterona acima de 20 ng/mL indica viabilidade; abaixo de 5 ng/mL indica inviabilidade.","ref":[5,0]},{"id":"e942cb3505","q":"Qual achado ultrassonográfico é descrito como sinal do anel tubário na gestação ectópica?","opts":["Massa anexial hiperecogênica com centro anecoico, separada do ovário","Massa uterina heterogênea com áreas císticas, em tempestade de neve","Massa anexial hipoecogênica homogênea, contígua ao corpo do ovário","Espessamento endometrial acima de 15 mm com material heterogêneo"],"c":0,"exp":"O tubal ring sign é uma massa anexial hiperecogênica com centro anecoico, isolada do ovário, presente em 68% a 80% dos casos. Ao Doppler colorido aparece o anel de fogo, com hipervascularização periférica e baixo índice de resistência. Líquido livre no fundo de saco sugere sangramento ou rotura tubária.","ref":[5,7]},{"id":"6756e079df","q":"Pelo fluxograma de tratamento da gestação ectópica, quais critérios autorizam a conduta expectante?","opts":["Massa menor que 3 cm e beta-hCG abaixo de 2.000 mUI/mL em queda","Massa menor que 5 cm e beta-hCG abaixo de 5.000 mUI/mL em queda","Massa menor que 3 cm e beta-hCG acima de 2.000 mUI/mL em ascensão","Massa menor que 4 cm e beta-hCG abaixo de 1.000 mUI/mL em ascensão"],"c":0,"exp":"A conduta expectante exige paciente estável, pouca dor ou sangramento, ausência de rotura, ausência de BCF, massa anexial menor que 3 cm (ou não detectável), beta-hCG abaixo de 2.000 mUI/mL e em queda, além de confiabilidade da gestante para o seguimento com beta-hCG semanal até negativar.","cap":"Fluxograma de conduta na gestação ectópica","ref":[6,4]},{"id":"5145828bb2","q":"Quais critérios permitem tratar a gestação ectópica com metotrexato sistêmico?","opts":["Íntegra até 3,5 cm, beta-hCG até 5.000 mUI/mL e sem BCF","Íntegra até 5,0 cm, beta-hCG até 10.000 mUI/mL e sem BCF","Rota até 3,5 cm, beta-hCG até 5.000 mUI/mL e com BCF","Íntegra até 2,0 cm, beta-hCG até 1.000 mUI/mL e com BCF"],"c":0,"exp":"O metotrexato exige ectópica íntegra de até 3,5 cm de maior diâmetro, estabilidade hemodinâmica, embrião sem BCF, beta-hCG menor ou igual a 5.000 mUI/mL, líquido livre restrito à pelve e normalidade do hemograma, da função renal e das enzimas hepáticas. A presença de BCF é contraindicação.","cap":"Critérios de conduta expectante, metotrexato e cirurgia","ref":[6,8]},{"id":"45e609b674","q":"No protocolo de dose única de metotrexato, o que se espera do beta-hCG entre o 4º e o 7º dia?","opts":["Queda de pelo menos 15% do beta-hCG; se menor, aplicar 2ª dose","Queda de pelo menos 50% do beta-hCG; se menor, indicar cirurgia","Alta de pelo menos 15% do beta-hCG; se menor, aplicar 2ª dose","Queda de pelo menos 15% do beta-hCG; se menor, apenas observar"],"c":0,"exp":"Aplica-se metotrexato 50 mg/m² IM no dia 1 e dosa-se beta-hCG nos dias 4 e 7. Espera-se queda de pelo menos 15% entre o dia 4 e o dia 7; se a queda for inferior a 15%, aplica-se a segunda dose no dia 7. Após a resposta adequada, segue-se com beta-hCG semanal até negativar.","ref":[6,9]},{"id":"9c4f8597b7","q":"O que deve ser proibido à paciente durante o tratamento com metotrexato?","opts":["Álcool, suplementos de ácido fólico e relações sexuais","Álcool, anti-inflamatórios simples e exposição solar","Ferro oral, laticínios e qualquer atividade física leve","Analgésicos comuns, cafeína e o uso de anticoncepcional"],"c":0,"exp":"Durante o tratamento ficam proibidos o consumo de álcool, a suplementação com ácido fólico (que antagoniza o efeito do metotrexato) e as relações sexuais. A paciente deve ser orientada sobre a dor de separação, dor abdominal leve nos dias 3 a 7, e deve evitar nova gestação por pelo menos 3 meses.","ref":[6,11]},{"id":"d7400a15c6","q":"Qual é a via de acesso preferencial para o tratamento cirúrgico da ectópica em paciente hemodinamicamente estável?","opts":["Laparoscopia, por menor internação e menos aderências","Laparotomia, por melhor exposição e menos sangramento","Histeroscopia, por ser via natural e não deixar cicatriz","Culdocentese, por ser rápida e drenar o hemoperitônio"],"c":0,"exp":"A laparoscopia é preferencial por menor tempo de internação, menor sangramento e menor formação de aderências pós-operatórias. A laparotomia fica reservada à paciente instável, com ectópica rota e hemoperitônio volumoso, situação em que a rapidez do acesso é prioridade.","ref":[6,15]},{"id":"e6bc9ee5c5","q":"Em qual situação a salpingostomia é preferível à salpingectomia na gestação ectópica tubária?","opts":["Tuba contralateral alterada ou ausente e desejo de fertilidade","Tuba contralateral íntegra e ausência de desejo reprodutivo","Tuba acometida rota com sangramento arterial incontrolável","Instabilidade hemodinâmica com hemoperitônio volumoso agudo"],"c":0,"exp":"A salpingostomia, técnica conservadora com incisão linear na borda antimesentérica e aspiração do trofoblasto, é indicada quando a tuba contralateral está alterada ou ausente e há desejo explícito de fertilidade futura. Exige beta-hCG semanal pós-operatório pelo risco de trofoblasto persistente, de 5% a 10%.","ref":[6,15]},{"id":"36311418d6","q":"Em gestação heterotópica (ectópica associada a gestação intrauterina viável), qual é a conduta?","opts":["Indicação absoluta de tratamento cirúrgico da ectópica","Indicação absoluta de metotrexato sistêmico em dose única","Conduta expectante com beta-hCG seriado a cada 48 horas","Esvaziamento uterino imediato das duas gestações juntas"],"c":0,"exp":"A gravidez heterotópica é indicação absoluta de cirurgia, ao lado da instabilidade hemodinâmica ou ectópica rota com hemoperitônio volumoso e da falha ou contraindicação ao metotrexato. O metotrexato é proscrito porque destruiria também a gestação intrauterina viável.","ref":[6,14]},{"id":"bfd6979c50","q":"Nas gestações ectópicas não tubárias (intersticial, cervical e em cicatriz de cesárea), qual opção terapêutica é indicada?","opts":["Metotrexato local na dose de 1 mg/kg","Metotrexato sistêmico de 50 mg/m²","Salpingostomia laparoscópica eletiva","Conduta expectante com beta-hCG semanal"],"c":0,"exp":"O fluxograma da conduta na gravidez tubária traz explicitamente a recomendação de metotrexato local, 1 mg/kg, na gravidez não tubária — intersticial, cervical e em cicatriz de cesárea. Essas topografias respondem por rupturas gravíssimas com hemorragia cataclísmica e não são abordáveis por salpingostomia.","ref":[6,12]},{"id":"57d1110fd5","q":"Qual conjunto de achados caracteriza a mola hidatiforme completa?","opts":["Cariótipo 46,XX diploide, ausência de embrião e beta-hCG muito alto","Cariótipo 69,XXY triploide, presença de embrião e beta-hCG baixo","Cariótipo 45,X monossômico, ausência de embrião e beta-hCG baixo","Cariótipo 46,XY diploide, presença de embrião e beta-hCG normal"],"c":0,"exp":"A mola completa resulta da fecundação de um óvulo sem núcleo com duplicação do material genético paterno, gerando cariótipo diploide 46,XX (ou 46,XY) de origem inteiramente paterna, sem formação de embrião, com beta-hCG marcadamente elevado e hiperêmese/hipertireoidismo frequentes.","ref":[7,1]},{"id":"65c2b52980","q":"Como se origina a mola hidatiforme parcial?","opts":["Dois espermatozoides fecundam um mesmo óvulo, gerando triploidia","Um espermatozoide fecunda óvulo sem núcleo e duplica seu material","Um óvulo com dois núcleos é fecundado por um único espermatozoide","Um erro na meiose II do oócito gera trissomia do cromossomo 16"],"c":0,"exp":"Na mola parcial há material genético paterno duplicado por fecundação do mesmo óvulo por dois espermatozoides, resultando em triploidia (69,XXX ou 69,XXY). Forma-se um embrião com malformações incompatíveis com a vida, que em geral não evolui além do primeiro trimestre, e o beta-hCG é apenas discretamente elevado.","ref":[7,1]},{"id":"0eb485723f","q":"Qual é o risco de progressão para neoplasia trofoblástica gestacional na mola completa e na mola parcial?","opts":["Cerca de 20% na completa e 0,5% a 5% na parcial","Cerca de 50% na completa e 20% a 30% na parcial","Cerca de 5% na completa e 20% a 25% na parcial","Cerca de 1% na completa e menos de 1% na parcial"],"c":0,"exp":"A mola completa progride para NTG em cerca de 15% a 20% dos casos, enquanto a parcial evolui em apenas 0,5% a 5%. Essa diferença justifica o seguimento pós-molar mais longo e rigoroso da mola completa, com beta-hCG negativo mantido por mais de 6 meses.","ref":[8,10]},{"id":"74da3701d8","q":"Quais achados ultrassonográficos e laboratoriais devem levantar suspeita de mola hidatiforme?","opts":["Massa heterogênea com áreas císticas e hCG acima de 200.000","Cavidade uterina vazia com massa anexial e hCG acima de 2.000","Endométrio menor que 15 mm com hCG em queda progressiva rápida","Saco gestacional com embrião vivo e hCG dentro da normalidade"],"c":0,"exp":"Suspeita-se de mola diante de massa ou material heterogêneo com áreas císticas anecoicas na cavidade uterina, padrão descrito como tempestade de neve ou favo de mel, com hCG acima de 200.000 mUI/mL. Somam-se sangramento de primeiro trimestre, altura uterina maior que a idade gestacional e sintomas gestacionais exacerbados.","cap":"Diagnóstico da mola hidatiforme: critérios e USG","ref":[7,5]},{"id":"a064d746d3","q":"Acima de que nível de hCG costumam ser visualizados cistos tecaluteínicos nos ovários?","opts":["Acima de 500.000 mUI/mL","Acima de 5.000 mUI/mL","Acima de 1.000 mUI/mL","Acima de 50.000 mUI/mL"],"c":0,"exp":"Os cistos tecaluteínicos, volumosos e multiloculados, resultam da hiperestimulação ovariana por níveis estratosféricos de hCG e costumam aparecer especialmente acima de 500.000 mUI/mL. São bilaterais e regridem espontaneamente após o esvaziamento uterino e a queda do hCG.","ref":[7,4]},{"id":"a66fdc6d0f","q":"Por que não se deve deixar uma gestação molar chegar ao segundo trimestre?","opts":["Aumentam hemorragia, pré-eclâmpsia e insuficiência respiratória","Aumentam prematuridade, oligoâmnio e restrição de crescimento","Aumentam diabetes gestacional, anemia e infecção urinária alta","Aumentam colestase, trombose venosa profunda e rotura uterina"],"c":0,"exp":"A partir do segundo trimestre crescem os riscos de hemorragia, pré-eclâmpsia, insuficiência respiratória (embolia pulmonar trofoblástica e edema agudo de pulmão), cistos tecaluteínicos e morte materna. Por isso toda gestante com sangramento de primeiro trimestre deve fazer USTV antes de conduta expectante em aborto retido.","ref":[7,6]},{"id":"b01be158f6","q":"Diante de altura uterina acima de 16 cm com cistos tecaluteínicos, o que deve ser acrescentado ao preparo pré-esvaziamento da mola?","opts":["TSH e T4 livre, eletrocardiograma e reserva de hemácias","Apenas hemograma completo e tipagem sanguínea da paciente","Somente proteinúria em fita e dosagem de creatinina sérica","Cariótipo do casal e pesquisa de anticorpos antifosfolípides"],"c":0,"exp":"Com altura uterina maior que 16 cm e cistos tecaluteínicos, acrescentam-se TSH e T4 livre, eletrocardiograma e/ou ecocardiograma, proteinúria, AST/ALT, creatinina e reserva de duas unidades de hemácias. Havendo sinais de hipertireoidismo, prescreve-se propranolol 40 mg de 12 em 12 horas como profilaxia de crise tireotóxica.","ref":[7,9]},{"id":"62a85e7726","q":"Como deve ser o seguimento do beta-hCG após o esvaziamento uterino da mola hidatiforme?","opts":["Semanal até três valores negativos e depois mensal por 6 meses","Mensal até dois valores negativos e depois anual por dois anos","Semanal até um valor negativo e depois nenhuma outra dosagem","Apenas uma dosagem 30 dias após o esvaziamento uterino feito"],"c":0,"exp":"O controle de cura pós-mola é feito com dosagem semanal de beta-hCG até três valores negativos consecutivos, seguida de dosagem mensal por 6 meses. Considera-se remissão quando o hCG cai abaixo de 5 mUI/mL; na mola total ele deve permanecer negativo por mais de 6 meses e na parcial por pelo menos 1 mês.","ref":[8,1]},{"id":"b0b9e02ee9","q":"Além do beta-hCG seriado, o que é obrigatório no seguimento pós-molar?","opts":["Contracepção rigorosa durante todo o período de seguimento","Repetir a curetagem uterina a cada quatro semanas seguidas","Quimioterapia profilática com metotrexato em dose única","Nova ultrassonografia transvaginal a cada quinze dias"],"c":0,"exp":"A anticoncepção rigorosa (ACO ou barreira) é obrigatória durante todo o seguimento e deve ser prescrita imediatamente, sem esperar cessar o sangramento. Uma nova gestação elevaria o beta-hCG e impediria a interpretação da curva de regressão, mascarando o diagnóstico de neoplasia trofoblástica pós-molar.","ref":[8,0]},{"id":"9157f26e74","q":"Quais critérios estabelecem o diagnóstico de neoplasia trofoblástica gestacional pós-molar?","opts":["Quatro valores em platô em 3 semanas ou três em ascensão em 2","Dois valores em platô em 1 semana ou dois em ascensão em 1 mês","Seis valores em platô em 6 semanas ou cinco em ascensão em 3","Um único valor acima de 5 mUI/mL seis meses após o esvaziamento"],"c":0,"exp":"Os critérios são: quatro ou mais valores de hCG em platô por período superior a três semanas (dias 1, 7, 14 e 21); ou aumento em três medidas consecutivas por ao menos duas semanas (dias 1, 7 e 14); ou histologia de coriocarcinoma. Platô é variação menor que 10% e aumento é elevação de pelo menos 10%.","cap":"Critérios diagnósticos de NTG pós-molar","ref":[8,4]},{"id":"33076ffe1b","q":"No escore de risco da neoplasia trofoblástica gestacional, qual sítio de metástase recebe a pontuação máxima de 4?","opts":["Metástase em cérebro ou fígado","Metástase apenas em pulmão","Metástase em baço ou rim","Metástase gastrintestinal"],"c":0,"exp":"No escore da OMS/FIGO, metástases em cérebro e fígado pontuam 4; gastrintestinal pontua 2; baço e rim pontuam 1; pulmão pontua 0. Outros itens do escore incluem idade, gestação anterior, intervalo desde a gestação antecedente, nível de hCG pré-tratamento, tamanho do maior tumor, número de metástases e falha prévia de quimioterapia.","cap":"Escore de risco da NTG (adaptado de FIGO)","ref":[8,11]},{"id":"efdf65281c","q":"Como se define e como se trata a neoplasia trofoblástica gestacional de baixo risco?","opts":["Escore até 6 e estádio I-III, tratada com monoquimioterapia","Escore até 6 e estádio IV, tratada com poliquimioterapia EMA-CO","Escore acima de 7 e estádio I-III, tratada com esquema EMA-CO","Escore acima de 9 e estádio IV, tratada com cirurgia radical"],"c":0,"exp":"NTG de baixo risco é pontuação igual ou menor que 6 com estádio FIGO I a III, tratada com monoquimioterapia (metotrexato ou actinomicina D). O alto risco é pontuação igual ou maior que 7 nos estádios I a III e todos os casos de estádio IV, tratados com poliquimioterapia EMA-CO. A cura ultrapassa 95%.","ref":[8,12]},{"id":"429a8856a0","q":"No estadiamento anatômico FIGO da NTG, a que corresponde o estádio III?","opts":["Extensão para os pulmões, com ou sem envolvimento genital","Doença restrita ao corpo do útero, sem qualquer metástase","Extensão para pelve, vagina, anexos e ligamento largo","Metástases em fígado, cérebro e demais sítios à distância"],"c":0,"exp":"O estádio III da NTG é a extensão para os pulmões, com ou sem envolvimento genital. O estádio I é a doença restrita ao corpo do útero, o II é a extensão para pelve, vagina, anexos e ligamento largo, e o IV corresponde a todos os outros locais de metástase.","ref":[8,9]},{"id":"3434b2cead","q":"Gestante Rh negativa não sensibilizada, com Coombs indireto negativo, apresenta abortamento com 9 semanas. Qual a conduta imunoprofilática?","opts":["Imunoglobulina anti-D 150 mcg IM, idealmente em até 72 horas","Imunoglobulina anti-D 300 mcg IM, idealmente em até 24 horas","Imunoglobulina anti-D 150 mcg EV, idealmente em até 15 dias","Nenhuma profilaxia, pois abaixo de 12 semanas não existe risco"],"c":0,"exp":"Até 12 semanas usa-se a minidose de 150 mcg (750 UI) por via intramuscular; acima de 12 semanas, a dose padrão de 300 mcg (1.500 UI). A administração deve ocorrer o mais precocemente possível, idealmente dentro de 72 horas do evento hemorrágico. A profilaxia vale para abortamento, ectópica e mola.","ref":[9,1]},{"id":"11ce60659d","q":"Segundo a tabela de apresentação clínica dos abortamentos, qual forma clínica cursa com febre?","opts":["Abortamento infectado","Abortamento retido","Abortamento completo","Ameaça de abortamento"],"c":0,"exp":"A febre está presente apenas no abortamento infectado, que também cursa com sangramento de odor fétido, cólicas ou peritonite e útero amolecido e doloroso à palpação. Em todas as demais formas — ameaça, completo, retido, incompleto e inevitável — a febre está ausente.","cap":"Apresentação clínica das formas de abortamento","ref":[2,10]},{"id":"2c194fde90","q":"Pela tabela de condutas, qual é o manejo do abortamento retido com menos de 12 semanas?","opts":["Expectante por até 4 semanas e, após, misoprostol com AMIU","Esvaziamento imediato por curetagem, sem qualquer espera","Antibiótico endovenoso antes de qualquer esvaziamento uterino","Apenas seguimento ambulatorial, sem nenhum esvaziamento"],"c":0,"exp":"No abortamento retido com menos de 12 semanas admite-se conduta expectante por até 4 semanas e, depois, misoprostol seguido de AMIU. Acima de 12 semanas usa-se misoprostol e curetagem após a expulsão imediata do feto. Já o abortamento incompleto vai direto ao esvaziamento: AMIU se menos de 12 semanas e curetagem se mais.","cap":"Condutas nas formas clínicas de abortamento","ref":[3,1]},{"id":"93a0634767","q":"Paciente de 28 anos, DUM há 7 semanas, com dor em fossa ilíaca direita e sangramento escuro discreto. PA 110x70 mmHg, FC 88 bpm, sem Blumberg, colo fechado. Beta-hCG 2.800 mUI/mL e USTV com útero vazio, endométrio de 11 mm e imagem anular de 2,2 cm em anexo direito, sem BCF e sem líquido livre. Qual a conduta?","opts":["Metotrexato 50 mg/m² intramuscular, com beta-hCG nos dias 4 e 7","Laparotomia de urgência com salpingectomia direita imediata","Conduta expectante isolada, com beta-hCG apenas nos dias 4 e 7","Curetagem uterina após dilatação, com envio para a patologia"],"c":0,"exp":"Trata-se de gestação ectópica tubária íntegra em paciente estável: massa de 2,2 cm (menor que 3,5 cm), beta-hCG de 2.800 mUI/mL (menor que 5.000), ausência de BCF e ausência de líquido livre — todos os critérios para metotrexato. A conduta expectante exigiria beta-hCG abaixo de 2.000 e em queda, o que não é o caso.","ref":[9,7]},{"id":"cdd2f911c0","q":"Paciente com sangramento de primeiro trimestre, dor abdominal e instabilidade hemodinâmica deve ser considerada portadora de qual diagnóstico até prova em contrário?","opts":["Gestação ectópica rota até prova em contrário","Ameaça de abortamento até prova em contrário","Mola hidatiforme até prova em contrário","Abortamento completo até prova em contrário"],"c":0,"exp":"Essa é a regra de ouro da emergência obstétrica: a tríade sangramento de primeiro trimestre + dor abdominal + instabilidade hemodinâmica é gestação ectópica rota até prova em contrário, com encaminhamento imediato ao centro cirúrgico. A ectópica rota é a principal causa de morte materna no primeiro trimestre.","ref":[0,2]}],"resumo":[{"h":"Panorama e abordagem inicial do sangramento do primeiro trimestre","blocos":[{"html":"<p>Sangramento genital na primeira metade da gestação — isto é, até as 20 semanas — é queixa banal em frequência e perigosa em consequência: <strong>20% a 25% das gestantes clinicamente reconhecidas sangram até a 12ª semana<\/strong>, e metade das que apresentam ameaça de abortamento acaba perdendo a gestação. Três diagnósticos concentram praticamente toda a casuística e organizam o raciocínio: <strong>abortamento<\/strong>, <strong>gravidez ectópica<\/strong> e <strong>doença trofoblástica gestacional (DTG)<\/strong>. A ectópica rota é, isoladamente, a principal causa de morte materna no primeiro trimestre — o que explica por que a avaliação começa pela hemodinâmica, e não pelo diagnóstico etiológico.<\/p>"},{"html":"<p>A sequência de emergência é fixa. Primeiro, <strong>estabilidade hemodinâmica<\/strong>: pressão arterial, frequência cardíaca, perfusão periférica e nível de consciência. Choque hipovolêmico em gestante de primeiro trimestre significa ectópica rota ou abortamento séptico/hemorrágico grave até que se prove o contrário. Segundo, <strong>dois acessos venosos calibrosos (16G/18G)<\/strong>, cristaloide aquecido (Ringer lactato) e coleta de hemograma, <strong>tipagem ABO/Rh<\/strong>, <strong>Coombs indireto<\/strong> e <strong>β-hCG quantitativo<\/strong>. Concentrado de hemácias se a instabilidade persistir ou se Hb &lt; 7 g/dL.<\/p>"},{"html":"<blockquote><p><strong>Regra de ouro da emergência obstétrica:<\/strong> sangramento de 1º trimestre + dor abdominal + instabilidade hemodinâmica = <strong>gravidez ectópica rota<\/strong>. Não se pede exame, se encaminha ao centro cirúrgico.<\/p><\/blockquote>"},{"html":"<p>A anamnese sistematiza três eixos: características do sangramento (volume, cor — vermelho vivo × amarronzado/\"borra de café\" —, coágulos, eliminação de material em \"carne moída\" ou vesicular), padrão da dor (cólica central × dor unilateral em fossa ilíaca; irradiação para o ombro = <strong>sinal de Laffont<\/strong>) e história obstétrica com <strong>DUM<\/strong>, abortamentos prévios, DIU, cirurgia tubária e reprodução assistida.<\/p>"},{"html":"<p>O exame físico ginecológico tem dois tempos igualmente obrigatórios. O <strong>exame especular<\/strong> confirma que o sangramento vem do canal cervical (e não de lesão vaginal ou cervical) e permite ver restos ovulares no orifício. O <strong>toque bimanual<\/strong> define os três dados que fecham a maior parte dos diagnósticos: <strong>orifício interno do colo aberto ou fechado<\/strong>, <strong>volume uterino compatível ou não com a idade gestacional<\/strong>, e <strong>dor à mobilização do colo ou à palpação anexial<\/strong>.<\/p>"}]},{"h":"Abortamento: conceito, classificação e etiologia","blocos":[{"html":"<p>Abortamento é a <strong>interrupção da gestação antes das 20 semanas ou com peso fetal inferior a 500 g<\/strong> (alguns textos estendem para 22 semanas). Classifica-se por dois eixos:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Eixo<\/th><th>Categoria<\/th><th>Definição<\/th><\/tr><\/thead><tbody><tr><td>Cronologia<\/td><td>Precoce<\/td><td>Até 12 semanas<\/td><\/tr><tr><td>Cronologia<\/td><td>Tardio<\/td><td>12 a 20 semanas<\/td><\/tr><tr><td>Intenção<\/td><td>Espontâneo<\/td><td>Doenças maternas ou malformação fetal<\/td><\/tr><tr><td>Intenção<\/td><td>Provocado<\/td><td>Interrupção intencional<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A incidência dos abortamentos clinicamente reconhecidos é de <strong>10% a 15%<\/strong>, e <strong>80% deles ocorrem antes das 12 semanas<\/strong>. Quando há <strong>dois (ou três, conforme a referência) ou mais abortamentos espontâneos consecutivos<\/strong>, define-se <strong>abortamento habitual (recorrente)<\/strong>.<\/p>"},{"html":"<h3>As quatro etiologias<\/h3>"},{"html":"<p><strong>1. Anomalias cromossômicas.<\/strong> São a causa mais comum de abortamento de primeiro trimestre, respondendo por <strong>50% a 80% dos casos<\/strong>. Erros na <strong>meiose II<\/strong> explicam a maior parte das trissomias e se relacionam com idade materna avançada e com redução ou ausência de recombinação meiótica. As trissomias mais associadas, em ordem decrescente, envolvem os cromossomos <strong>16, 22, 21, 15, 13, 2 e 14<\/strong>.<\/p>"},{"html":"<p><strong>2. Fatores maternos.<\/strong> SOP; infecção aguda grave; <strong>DM tipo 1 não controlada<\/strong>; aderências intrauterinas (sinéquias); <strong>miomas submucosos<\/strong>; malformações uterinas; e ainda desnutrição acentuada, excesso de álcool, tabagismo e trauma.<\/p>"},{"html":"<p><strong>3. Incompetência istmocervical (IIC)<\/strong> — detalhada logo abaixo.<\/p>"},{"html":"<p><strong>4. Causas imunológicas.<\/strong> Na vertente <strong>autoimune<\/strong>, a <strong>síndrome do anticorpo antifosfolípide (SAF/SAAF)<\/strong>, trombofilia autoimune associada a trombose e infarto placentário, presente em cerca de <strong>20% das mulheres com abortamento habitual<\/strong>; os autoanticorpos são <strong>anticoagulante lúpico, anticardiolipina e anti-β2-glicoproteína<\/strong>. Na vertente <strong>aloimune<\/strong>, a teoria é de resposta materna anormal a antígenos paternos ou do trofoblasto, com histocompatibilidade materno-fetal exagerada e rejeição semelhante à de transplantes, possivelmente envolvendo aumento da atividade das <strong>células natural killer uterinas<\/strong>.<\/p>"},{"html":"<p>Fatores de risco adicionais que costumam cair em prova: <strong>idade materna avançada<\/strong> é o fator isolado mais relevante (~20% de risco aos 35 anos, &gt; 50% aos 40, &gt; 80% aos 45, por aneuploidia oocitária); a história gestacional prévia escalona o risco (<strong>1 aborto prévio → 20%; 2 → 30%; ≥ 3 → &gt; 40%<\/strong>); tabagismo &gt; 10 cigarros/dia, cafeína &gt; 300 mg/dia, obesidade grave (IMC &gt; 35), DM descompensado (HbA1c &gt; 8%), doença tireoidiana e SAF.<\/p>"},{"html":"<h3>Incompetência istmocervical e cerclagem<\/h3>"},{"html":"<p>A IIC é um quadro de <strong>perda fetal tardia recorrente<\/strong> por oclusão cervical insuficiente — defeito estrutural ou funcional, de origem traumática (curetagem, laceração cervical pós-parto, aborto traumático, conização), congênita (alteração do colágeno) ou por exposição intrauterina ao dietilestilbestrol.<\/p>"},{"html":"<p>O quadro clínico é característico e é a chave da questão de prova: <strong>dilatação cervical indolor até 4–6 cm, ausência de sangramento<\/strong>, protrusão das membranas ovulares na vagina, rotura de membranas e expulsão de <strong>feto morfologicamente normal e vivo<\/strong>.<\/p>"},{"html":"<blockquote><p>A IIC é o abortamento que <strong>não dói e não sangra<\/strong>. Perda de segundo trimestre com dilatação indolor e feto vivo e normal = IIC até prova em contrário.<\/p><\/blockquote>"},{"html":"<p>O diagnóstico costuma ser <strong>retrospectivo<\/strong>, pela anamnese, e confirmado <strong>fora do período gestacional<\/strong> por:<\/p>"},{"html":"<ul><li><strong>Histerossalpingografia:<\/strong> largura do segmento istmocervical, na altura do orifício interno, <strong>superior a 8 mm<\/strong>.<\/li><li><strong>Velas de Hegar:<\/strong> comprova-se a IIC quando o orifício interno <strong>permite a passagem da vela de 8 mm<\/strong>.<\/li><\/ul>"},{"html":"<p>O tratamento clássico é a <strong>cerclagem uterina<\/strong>, sutura circular no nível do orifício interno que previne o encurtamento e a abertura prematura do colo; a técnica mais utilizada é a <strong>cirurgia de McDonald<\/strong>. Alternativa em casos individualizados: <strong>pessário<\/strong> (anel de silicone).<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Tipo de cerclagem<\/th><th>Indicação<\/th><th>Período<\/th><\/tr><\/thead><tbody><tr><td><strong>Eletiva<\/strong><\/td><td>1 ou mais perdas fetais no 2º trimestre sem trabalho de parto, OU antecedente de cerclagem por dilatação assintomática no 2º trimestre<\/td><td>Antes da cervicodilatação, <strong>entre 12 e 16 semanas<\/strong><\/td><\/tr><tr><td><strong>Terapêutica<\/strong><\/td><td>Antecedente de parto prematuro &lt; 34 semanas <strong>E<\/strong> colo &lt; 25 mm à USTV antes de 24 semanas<\/td><td>Não deve ultrapassar <strong>24 semanas<\/strong><\/td><\/tr><tr><td><strong>Urgência<\/strong><\/td><td>Dilatação <strong>assintomática<\/strong> do colo com membranas ovulares protrusas pelo canal cervical<\/td><td>Não deve ultrapassar <strong>24 semanas<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}]},{"h":"Formas clínicas do abortamento","blocos":[{"html":"<p>A forma clínica se define por três variáveis — <strong>orifício do colo, volume uterino e ultrassonografia<\/strong> — e é ela que determina a conduta. A tabela abaixo é o mapa completo:<\/p>"},{"html":"<p class=\"figleg\">Apresentação clínica das seis formas de abortamento — sangramento, dor, febre, útero, orifício do colo e USG<\/p>"},{"html":"<p>Traduzindo cada quadro:<\/p>"},{"html":"<h4>Ameaça de abortamento<\/h4>\n<p>Sangramento discreto a moderado, cólica leve em hipogástrio, <strong>colo impérvio (fechado)<\/strong>, útero compatível com a IG e USTV com <strong>saco gestacional, embrião vivo e BCF presente<\/strong>. Pode haver hematoma subcoriônico. É a única forma em que a gestação segue viável.<\/p>"},{"html":"<h4>Abortamento inevitável (e abortamento em curso)<\/h4>\n<p>Sangramento moderado a intenso com cólicas fortes e <strong>colo apagado e dilatado (aberto)<\/strong>, mas com o conteúdo ovular <strong>ainda integralmente dentro da cavidade uterina<\/strong>; útero compatível ou não com a IG e BCF presente ou ausente ao USG. Há risco de hemorragia aguda e de amniorrexe pré-viabilidade. No <strong>abortamento em curso<\/strong>, a expulsão já está acontecendo pelo canal cervical, com eliminação de coágulos volumosos e tecido trofoblástico.<\/p>"},{"html":"<blockquote><p>A diferença entre <strong>inevitável<\/strong> e <strong>em curso<\/strong> não é o colo (aberto nos dois) — é <strong>onde está o material ovular<\/strong>: ainda dentro da cavidade (inevitável) × já atravessando o canal cervical (em curso).<\/p><\/blockquote>"},{"html":"<h4>Abortamento incompleto<\/h4>\n<p>Eliminação <strong>parcial<\/strong> do trofoblasto: colo fechado ou aberto, cólicas que persistem, sangramento ativo, útero menor que a IG e USTV com <strong>restos ovulares / eco endometrial heterogêneo espessado<\/strong>.<\/p>"},{"html":"<h4>Abortamento completo<\/h4>\n<p>Expulsão total do conteúdo: <strong>regressão rápida da dor e do sangramento<\/strong>, colo fechado ou puntiforme, útero menor que a IG e <strong>cavidade uterina vazia e limpa<\/strong>.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Achado<\/th><th>Abortamento incompleto<\/th><th>Abortamento completo<\/th><\/tr><\/thead><tbody><tr><td>Colo ao especular<\/td><td>Dilatado, com restos no canal<\/td><td>Fechado ou puntiforme<\/td><\/tr><tr><td>Sintomas atuais<\/td><td>Cólicas persistem, sangramento ativo<\/td><td>Dor e sangramento regridem rápido<\/td><\/tr><tr><td><strong>Espessura endometrial (USTV)<\/strong><\/td><td><strong>&gt; 15 mm<\/strong>, material heterogêneo<\/td><td><strong>&lt; 15 mm<\/strong>, cavidade limpa<\/td><\/tr><tr><td>Conduta<\/td><td>Esvaziamento (AMIU ou curetagem)<\/td><td>Expectante / seguimento ambulatorial<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<h4>Abortamento retido<\/h4>\n<p>Óbito embrionário ou fetal <strong>mantido na cavidade<\/strong>: sangramento ausente ou escasso, <strong>sem dor<\/strong>, <strong>colo fechado<\/strong>, útero menor que a IG e USTV com <strong>embrião sem BCF<\/strong>.<\/p>"},{"html":"<h4>Abortamento infectado (séptico)<\/h4>\n<p>Única forma que cursa com <strong>febre<\/strong>. Infecção polimicrobiana ascendente (<em>E. coli<\/em>, estreptococos anaeróbios, <em>Clostridium perfringens<\/em>), quase sempre ligada a procedimento clandestino ou inseguro. Sangramento variável <strong>com odor fétido<\/strong>, secreção purulenta, cólicas ou franca peritonite, <strong>útero amolecido e doloroso à palpação<\/strong>, colo fechado ou aberto. Risco iminente de choque séptico e de <strong>síndrome de Mondor<\/strong>.<\/p>"},{"html":"<blockquote><p>Para separar rapidamente: <strong>colo fechado + BCF presente<\/strong> = ameaça; <strong>colo fechado + sem BCF<\/strong> = retido; <strong>colo fechado + útero vazio<\/strong> = completo (ou ectópica!); <strong>colo aberto + restos<\/strong> = incompleto/inevitável; <strong>febre + odor fétido<\/strong> = infectado.<\/p><\/blockquote>"}]},{"h":"Condutas no abortamento e métodos de esvaziamento uterino","blocos":[{"html":"<p class=\"figleg\">Condutas por forma clínica de abortamento, com o corte das 12 semanas<\/p>"},{"html":"<ul><li><strong>Ameaça de abortamento:<\/strong> conduta <strong>expectante, mesmo na presença de hematoma<\/strong>. Nenhuma medida é comprovadamente eficaz para determinar o prognóstico — repouso relativo, analgésicos antiespasmódicos, progesterona (didrogesterona ou progesterona micronizada, sobretudo se hematoma ou abortamento de repetição) e abstinência sexual. Manter vigilância e reavaliar se o sangramento aumentar.<\/li><li><strong>Abortamento completo:<\/strong> <strong>expectante<\/strong>, com seguimento ambulatorial para monitorar o sangramento.<\/li><li><strong>Abortamento retido:<\/strong> se <strong>&lt; 12 semanas<\/strong>, pode-se aguardar de forma expectante <strong>até 4 semanas<\/strong>; após esse prazo, <strong>misoprostol + AMIU<\/strong>. Se <strong>&gt; 12 semanas<\/strong>, <strong>misoprostol seguido de curetagem<\/strong>, após a expulsão do feto.<\/li><li><strong>Abortamento incompleto:<\/strong> <strong>esvaziamento uterino<\/strong> — <strong>AMIU se &lt; 12 semanas<\/strong>, <strong>curetagem se &gt; 12 semanas<\/strong>.<\/li><li><strong>Abortamento inevitável:<\/strong> <strong>esvaziamento uterino<\/strong>, com internação e estabilização da paciente.<\/li><li><strong>Abortamento infectado:<\/strong> <strong>antibioticoterapia endovenosa imediata<\/strong> — <strong>ampicilina + gentamicina + metronidazol<\/strong> <em>ou<\/em> <strong>clindamicina + gentamicina<\/strong> — seguida de <strong>esvaziamento uterino<\/strong> e, se necessário, <strong>laparotomia<\/strong>. O antibiótico vem antes; o esvaziamento é urgente, mas não precede a antibioticoterapia.<\/li><\/ul>"},{"html":"<h3>Métodos de esvaziamento<\/h3>"},{"html":"<p><strong>Medicamentoso.<\/strong> O <strong>misoprostol<\/strong> (análogo de PGE1) é o carro-chefe do primeiro trimestre: <strong>aborto retido — 2 a 3 doses de 800 mcg por via vaginal a cada 12 h<\/strong>; <strong>abortamento incompleto — 400 mcg em dose única<\/strong>. No segundo trimestre, <strong>200 mcg por via vaginal a cada 4–6 h<\/strong>, seguido de tratamento cirúrgico combinado. A <strong>ocitocina<\/strong> tem melhor resultado acima de <strong>16 semanas e com colo favorável<\/strong>.<\/p>"},{"html":"<p><strong>Cirúrgico.<\/strong><\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Método<\/th><th>Papel<\/th><\/tr><\/thead><tbody><tr><td><strong>Dilatação cervical<\/strong><\/td><td>Preparo instrumental: espéculo, <strong>pinça de Pozzi<\/strong> e <strong>velas de Hegar<\/strong><\/td><\/tr><tr><td><strong>AMIU<\/strong> (aspiração manual intrauterina)<\/td><td><strong>Técnica de escolha até 12 semanas<\/strong> — menos invasiva, menor taxa de perfuração e menos complicações que a curetagem<\/td><\/tr><tr><td><strong>Aspiração a vácuo<\/strong><\/td><td>Semelhante à AMIU, acrescida do sistema a vácuo — <strong>método de escolha na mola<\/strong><\/td><\/tr><tr><td><strong>Curetagem uterina<\/strong><\/td><td>Tratamento clássico de 1º e 2º trimestre, eficácia próxima de 100%; maior risco de perfuração e de <strong>sinéquias (síndrome de Asherman)<\/strong>. Em retido &gt; 12 semanas, precedida de misoprostol<\/td><\/tr><\/tbody><\/table><\/div>"}]},{"h":"Gestação ectópica: fatores de risco, topografia e quadro clínico","blocos":[{"html":"<p>Gestação ectópica é a implantação e o desenvolvimento do blastocisto <strong>fora da cavidade endometrial<\/strong>, ocorrendo em <strong>1% a 2%<\/strong> de todas as gestações. Continua sendo a <strong>principal causa de morte materna no primeiro trimestre<\/strong>, com alta morbimortalidade.<\/p>"},{"html":"<p>O mecanismo central é o <strong>atraso no transporte do ovo fertilizado pela tuba<\/strong>, por lesão dos cílios tubários ou alteração da peristalse da musculatura lisa — o que explica por que quase todos os fatores de risco são, no fundo, fatores de dano tubário.<\/p>"},{"html":"<p class=\"figleg\">Fatores de risco e topografia da implantação ectópica, com as frequências relativas<\/p>"},{"html":"<p>Fatores de risco principais:<\/p>"},{"html":"<ul><li><strong>Gestação ectópica prévia<\/strong> — o mais importante, com risco <strong>7 a 10 vezes maior<\/strong>.<\/li><li><strong>Alterações tubárias<\/strong>: doença inflamatória pélvica / salpingite prévia, cirurgia tubária e laqueadura.<\/li><li><strong>Endometriose pélvica<\/strong> e <strong>tabagismo ativo<\/strong>.<\/li><li><strong>Falhas de contracepção<\/strong>, incluindo <strong>falha do DIU<\/strong> e falha da contracepção de emergência.<\/li><li><strong>Reprodução assistida (FIV)<\/strong> — inclusive pelo risco de <strong>gestação heterotópica<\/strong>.<\/li><\/ul>"},{"html":"<p>A tuba uterina concentra <strong>95% a 96%<\/strong> dos casos. Dentro dela e fora dela:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Topografia<\/th><th>Frequência<\/th><th>Particularidade<\/th><\/tr><\/thead><tbody><tr><td><strong>Ampola<\/strong><\/td><td>~70%<\/td><td>Sítio mais frequente; parede mais distensível, ruptura mais tardia<\/td><\/tr><tr><td><strong>Ístmo<\/strong><\/td><td>12%<\/td><td><strong>Ruptura precoce (6–8 semanas)<\/strong> pelo menor calibre<\/td><\/tr><tr><td><strong>Fímbrias / infundíbulo<\/strong><\/td><td>5–11%<\/td><td>Tende ao <strong>abortamento tubário<\/strong> espontâneo<\/td><\/tr><tr><td><strong>Ovariana<\/strong><\/td><td>~3%<\/td><td>—<\/td><\/tr><tr><td><strong>Intersticial / cornual<\/strong><\/td><td>2–3%<\/td><td>Ruptura gravíssima, hemorragia cataclísmica<\/td><\/tr><tr><td><strong>Cervical, cicatriz de cesárea, abdominal<\/strong><\/td><td>&lt; 1% cada (abdominal ~1%)<\/td><td>Grande risco hemorrágico; alvo do MTX local<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<h3>Quadro clínico<\/h3>"},{"html":"<p>A <strong>tríade clássica — amenorreia (ou irregularidade menstrual), sangramento vaginal e dor abdominal — está presente em apenas 50% das pacientes<\/strong> na apresentação inicial. A amenorreia costuma ser de <strong>6 a 8 semanas<\/strong>; o sangramento é <strong>escasso, escuro, em \"borra de café\"<\/strong>, resultante da descamação do endométrio decidualizado; a dor é <strong>unilateral, em fossa ilíaca, de início súbito<\/strong>, em cólica ou pontada.<\/p>"},{"html":"<p>O exame físico muda radicalmente conforme a tuba esteja íntegra ou rota:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Achado<\/th><th>Ectópica íntegra<\/th><th>Ectópica rota (aguda)<\/th><\/tr><\/thead><tbody><tr><td>Dor<\/td><td>Moderada à palpação profunda em fossa ilíaca<\/td><td><strong>Abdome agudo hemorrágico<\/strong>: rigidez, <strong>Blumberg +<\/strong><\/td><\/tr><tr><td>Toque vaginal<\/td><td>Massa anexial palpável, dolorosa, amolecida (~50%)<\/td><td><strong>Sinal de Proust extremo<\/strong> — \"grito do fundo de saco\"<\/td><\/tr><tr><td>Mobilização do colo<\/td><td>Dor discreta<\/td><td>Dor intensa<\/td><\/tr><tr><td>Hemodinâmica<\/td><td>Estável<\/td><td><strong>Choque hipovolêmico<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Sinais especiais de hemoperitônio, todos cobrados em prova:<\/p>"},{"html":"<ul><li><strong>Sinal de Cullen<\/strong> — equimose <strong>periumbilical<\/strong>, por infiltração de sangue retroperitoneal e intraperitoneal na parede abdominal.<\/li><li><strong>Sinal de Grey-Turner<\/strong> — equimose <strong>nos flancos<\/strong>, em grande hemoperitônio.<\/li><li><strong>Sinal de Laffont<\/strong> — <strong>dor no ombro (direito)<\/strong>, por irritação diafragmática transmitida pelo <strong>nervo frênico<\/strong>.<\/li><li><strong>Sinal de Proust<\/strong> — fundo de saco posterior <strong>abaulado e doloroso<\/strong> ao toque (\"grito de Douglas\").<\/li><li><strong>Sinal de Blumberg<\/strong> — dor à descompressão brusca na palpação abdominal.<\/li><\/ul>"}]},{"h":"Gestação ectópica: diagnóstico por β-hCG e ultrassonografia","blocos":[{"html":"<p>Em gestação intrauterina viável, o <strong>β-hCG duplica a cada 48–72 h<\/strong>, com aumento mínimo esperado de <strong>35% a 53% em 48 h<\/strong>; <strong>subida em platô (&lt; 35% em 48 h) ou queda lenta<\/strong> sugere gestação inviável ou ectópica. A <strong>progesterona sérica<\/strong> complementa: <strong>&gt; 20 ng/mL<\/strong> indica gestação intrauterina viável (sensibilidade ~95%) e <strong>&lt; 5 ng/mL<\/strong> indica gestação inviável, seja qual for a localização.<\/p>"},{"html":"<p>A <strong>zona discriminativa<\/strong> é o nível de β-hCG a partir do qual o saco gestacional <strong>deve<\/strong> ser visto à USTV numa gestação tópica. Tradicionalmente fixada entre <strong>1.500 e 2.000 mUI/mL<\/strong>, foi elevada por diretrizes recentes para <strong>3.500 mUI/mL<\/strong> antes de se declarar inviabilidade, justamente para evitar conduta iatrogênica sobre gestação tópica viável.<\/p>"},{"html":"<p class=\"figleg\">Fluxograma de associação entre beta-hCG e ultrassonografia transvaginal<\/p>"},{"html":"<p>Lendo o fluxograma de <strong>gravidez de localização desconhecida (PUL)<\/strong> — hCG positivo com útero vazio:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>β-hCG com útero vazio<\/th><th>Interpretação<\/th><\/tr><\/thead><tbody><tr><td><strong>&lt; 2.000 mUI/mL<\/strong><\/td><td><strong>Inconclusivo<\/strong> — repetir β-hCG e USTV em 48 h<\/td><\/tr><tr><td><strong>2.000 a 3.000 mUI/mL<\/strong><\/td><td><strong>Suspeita<\/strong> de gravidez ectópica<\/td><\/tr><tr><td><strong>&gt; 3.000 (≥ 3.500) mUI/mL<\/strong><\/td><td><strong>Diagnóstico<\/strong> de gravidez ectópica<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>E o desdobramento das dosagens seriadas em 48 h: <strong>elevação &gt; 50%<\/strong> aponta gestação tópica inicial; <strong>elevação menor que 49% do valor inicial<\/strong>, platô ou queda modesta aponta <strong>gestação inviável tópica ou ectópica<\/strong>. Massa anexial extraovariana (embrião vivo, anel tubário, hematossalpinge) já fecha o diagnóstico independentemente do valor.<\/p>"},{"html":"<p>Achados ultrassonográficos da ectópica:<\/p>"},{"html":"<ul><li><strong>Sinal do anel tubário<\/strong> (<em>tubal ring sign<\/em>) — massa anexial hiperecogênica com centro anecoico, <strong>separada do ovário<\/strong>; presente em <strong>68% a 80%<\/strong> dos casos.<\/li><li><strong>Anel de fogo ao Doppler<\/strong> — hipervascularização periférica com <strong>baixo índice de resistência<\/strong> ao redor da massa anexial.<\/li><li><strong>Líquido livre no fundo de saco de Douglas<\/strong> — sugere sangramento ou ruptura tubária.<\/li><li><strong>Cavidade uterina vazia<\/strong> com endométrio decidualizado espessado.<\/li><\/ul>"},{"html":"<blockquote><p>Cuidado com a pegadinha: <strong>útero vazio não é sinônimo de ectópica<\/strong> — pode ser gestação tópica muito inicial (abaixo da zona discriminativa) ou abortamento completo. O que separa é o <strong>valor do β-hCG<\/strong> e a <strong>cinética em 48 h<\/strong>.<\/p><\/blockquote>"}]},{"h":"Gestação ectópica: conduta expectante, metotrexato e cirurgia","blocos":[{"html":"<p>O tratamento se decide por três eixos — <strong>estado da tuba, estado hemodinâmico e desejo reprodutivo<\/strong>.<\/p>"},{"html":"<p class=\"figleg\">Fluxograma de tratamento da gestação ectópica: instável, expectante, metotrexato e cirurgia<\/p>"},{"html":"<h3>Conduta expectante<\/h3>"},{"html":"<p>Reservada aos casos de regressão espontânea do trofoblasto, com <strong>todos<\/strong> os critérios presentes:<\/p>"},{"html":"<ul><li>Paciente <strong>assintomática<\/strong> (pouca dor ou sangramento) e <strong>hemodinamicamente estável<\/strong>.<\/li><li><strong>β-hCG &lt; 2.000 mUI/mL e em queda<\/strong> (algumas referências usam &lt; 1.000–1.500 mUI/mL).<\/li><li><strong>Massa ectópica ou anexial &lt; 3 cm<\/strong> ou não detectável.<\/li><li><strong>Ausência de BCF<\/strong> e <strong>nenhuma evidência de rotura tubária<\/strong>.<\/li><li><strong>Confiabilidade da gestante para seguimento<\/strong>, com acesso rápido a serviço de emergência.<\/li><\/ul>"},{"html":"<p>O seguimento é feito com <strong>β-hCG semanal até negativar<\/strong> (dosagens sequenciais nos dias 1, 4 e 7 no protocolo padronizado). Se os títulos não caírem como esperado, migra-se para tratamento clínico ou cirúrgico.<\/p>"},{"html":"<h3>Metotrexato<\/h3>"},{"html":"<p>O <strong>metotrexato (MTX)<\/strong> é antagonista do ácido fólico e inibe a síntese de DNA nas células trofoblásticas em rápida divisão. Critérios para uso:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Critério<\/th><th>Valor exigido<\/th><\/tr><\/thead><tbody><tr><td>Estado hemodinâmico<\/td><td><strong>Estável<\/strong><\/td><\/tr><tr><td>Integridade<\/td><td><strong>GE íntegra<\/strong>, sem rotura<\/td><\/tr><tr><td>Tamanho da massa<\/td><td><strong>≤ 3,5 cm<\/strong> de maior diâmetro<\/td><\/tr><tr><td>β-hCG<\/td><td><strong>≤ 5.000 mUI/mL<\/strong> (ideal &lt; 3.000)<\/td><\/tr><tr><td>Atividade cardíaca<\/td><td><strong>BCF ausente<\/strong><\/td><\/tr><tr><td>Líquido livre<\/td><td>Restrito à pelve<\/td><\/tr><tr><td>Laboratório<\/td><td>Hemograma, função renal e enzimas hepáticas normais<\/td><\/tr><tr><td>Desejo reprodutivo<\/td><td>Presente<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p><strong>Protocolo de dose única (o mais usado):<\/strong> <strong>MTX 50 mg/m² IM no dia 1<\/strong> (algumas referências admitem <strong>50–75 mg/m²<\/strong>), com dosagem de <strong>β-hCG nos dias 4 e 7<\/strong>. Espera-se <strong>queda ≥ 15% entre o D4 e o D7<\/strong>; se a queda for <strong>&lt; 15%<\/strong>, aplica-se a <strong>2ª dose de MTX<\/strong>. Depois, β-hCG semanal até negativar (&lt; 5 mUI/mL).<\/p>"},{"html":"<p>Orientações e proibições durante o tratamento:<\/p>"},{"html":"<ul><li>Explicar a <strong>\"dor de separação\"<\/strong> — dor abdominal leve entre os dias 3 e 7, pela reabsorção do tecido; não confundir com rotura.<\/li><li><strong>Proibidos: álcool, suplementação com ácido fólico e relações sexuais<\/strong> durante o tratamento.<\/li><li><strong>Evitar nova gestação por pelo menos 3 meses.<\/strong><\/li><\/ul>"},{"html":"<blockquote><p>Nas <strong>gestações ectópicas não tubárias<\/strong> — <strong>intersticial, cervical e em cicatriz de cesárea<\/strong> — a opção indicada é o <strong>MTX local (1 mg/kg)<\/strong>, injetado no saco gestacional, pelo risco hemorrágico proibitivo da abordagem cirúrgica convencional.<\/p><\/blockquote>"},{"html":"<h3>Tratamento cirúrgico<\/h3>"},{"html":"<p>Indicações absolutas de cirurgia de urgência: <strong>instabilidade hemodinâmica ou ectópica rota com hemoperitônio volumoso<\/strong>; <strong>falha ou contraindicação ao MTX<\/strong>; <strong>massa tubária &gt; 3,5–5,0 cm<\/strong>, <strong>β-hCG &gt; 5.000<\/strong> ou <strong>embrião vivo<\/strong>; e <strong>gestação heterotópica<\/strong> (ectópica associada a gestação intrauterina viável), em que o MTX é proibido por ser embriotóxico para o concepto tópico.<\/p>"},{"html":"<ul><li><strong>Via de acesso:<\/strong> a <strong>laparoscopia<\/strong> é preferencial na paciente <strong>estável<\/strong> — menos tempo de internação, menos sangramento e menos aderências pós-operatórias. A <strong>laparotomia<\/strong> fica reservada à <strong>paciente instável / ectópica rota<\/strong>.<\/li><li><strong>Salpingostomia<\/strong> (conservadora): incisão linear na borda <strong>antimesentérica<\/strong> da tuba com aspiração do trofoblasto, <strong>preservando a tuba<\/strong>. Indicada quando a <strong>tuba contralateral está alterada ou ausente<\/strong> e há desejo explícito de fertilidade futura. Exige <strong>β-hCG semanal pós-operatório<\/strong> pelo risco de <strong>trofoblasto persistente (5–10%)<\/strong>.<\/li><li><strong>Salpingectomia<\/strong> (definitiva): ressecção completa da tuba acometida. Indicada em <strong>tuba rota ou gravemente lesada<\/strong>, sangramento incontrolável ou <strong>tuba contralateral íntegra<\/strong>.<\/li><\/ul>"}]},{"h":"Doença trofoblástica gestacional: mola completa × mola parcial","blocos":[{"html":"<p>A DTG é um grupo heterogêneo de lesões proliferativas do epitélio trofoblástico placentário, formado pela <strong>mola hidatiforme<\/strong> (forma benigna) e pela <strong>neoplasia trofoblástica gestacional (NTG)<\/strong> — esta, tumor maligno. No Brasil, estima-se <strong>uma mola para cada 200 a 800 gestações<\/strong>. A macroscopia clássica é a de inúmeras <strong>vesículas hialinas em \"cacho de uvas\"<\/strong> preenchendo a cavidade uterina, e o marcador biológico é a <strong>hipersecreção de β-hCG<\/strong>.<\/p>"},{"html":"<p>A <strong>mola completa<\/strong> resulta da fecundação de um <strong>óvulo sem núcleo (anucleado)<\/strong> por um espermatozoide, com <strong>duplicação do material genético paterno<\/strong> — cariótipo <strong>46,XX<\/strong> (podendo ser 46,XY), inteiramente paterno, e <strong>sem formação de embrião<\/strong>. A <strong>mola parcial<\/strong> resulta da fecundação de um óvulo por <strong>dois espermatozoides<\/strong> (ou por material paterno duplicado), gerando <strong>triploidia — 69,XXX ou 69,XXY<\/strong> — com <strong>embrião presente, porém malformado<\/strong> e incompatível com a vida, que em geral não ultrapassa o primeiro trimestre.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Característica<\/th><th>Mola completa<\/th><th>Mola parcial<\/th><\/tr><\/thead><tbody><tr><td><strong>Cariótipo<\/strong><\/td><td><strong>46,XX<\/strong> (ou 46,XY) — 100% paterno, diploide<\/td><td><strong>69,XXX / 69,XXY<\/strong> — triploide<\/td><\/tr><tr><td><strong>Embrião / tecido fetal<\/strong><\/td><td><strong>Ausente<\/strong><\/td><td><strong>Presente<\/strong> (feto malformado)<\/td><\/tr><tr><td><strong>β-hCG<\/strong><\/td><td><strong>Muito elevado<\/strong> (&gt; 100.000–200.000)<\/td><td>Discretamente elevado ou normal<\/td><\/tr><tr><td><strong>Hiperêmese / hipertireoidismo<\/strong><\/td><td>Frequentes e graves<\/td><td>Raros<\/td><\/tr><tr><td><strong>Progressão para NTG<\/strong><\/td><td><strong>15–20%<\/strong><\/td><td><strong>0,5–5%<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<h3>Diagnóstico<\/h3>"},{"html":"<p>Suspeitar de mola diante de: <strong>sangramento de primeiro trimestre<\/strong>; <strong>gestação não evolutiva à USG<\/strong>; <strong>altura de fundo uterino maior que a idade gestacional<\/strong>; <strong>sintomas gestacionais exacerbados<\/strong> (náuseas e vômitos); e <strong>hCG &gt; 200.000 mUI/mL<\/strong>. Acima de <strong>500.000 mUI/mL<\/strong>, é comum visualizar <strong>cistos tecaluteínicos<\/strong> nos ovários — cistos volumosos, multiloculados e <strong>bilaterais<\/strong>, decorrentes da hiperestimulação ovariana pelo hCG.<\/p>"},{"html":"<p>À <strong>ultrassonografia<\/strong>, suspeita-se quando a idade gestacional aparente é <strong>menor que a esperada<\/strong>, quando <strong>não se visualiza o embrião<\/strong> para a IG e/ou quando há <strong>massa ou material heterogêneo com áreas císticas anecoicas<\/strong> na cavidade uterina — o clássico padrão em <strong>\"tempestade de neve\"<\/strong> ou <strong>\"favo de mel\"<\/strong>. Em imagem duvidosa, repetir a ecografia em uma semana. Ao Doppler, hipervascularização miometrial com baixa resistência.<\/p>"},{"html":"<blockquote><p><strong>Toda<\/strong> gestante com sangramento de primeiro trimestre deve fazer USTV, e é preciso <strong>afastar mola antes de adotar conduta expectante em abortamento retido<\/strong> — é assim que o diagnóstico atrasa. E <strong>não se deve deixar uma gestação molar chegar ao segundo trimestre<\/strong>: é a partir daí que disparam os riscos de hemorragia, pré-eclâmpsia, insuficiência respiratória (embolia pulmonar trofoblástica, edema agudo de pulmão), cistos tecaluteínicos e morte.<\/p><\/blockquote>"},{"html":"<h3>Preparo pré-esvaziamento e tratamento<\/h3>"},{"html":"<p>Exames pré-operatórios obrigatórios: <strong>hCG quantitativo<\/strong> (colhido <strong>antes<\/strong> do esvaziamento, para servir de linha de base do controle de cura), <strong>tipagem sanguínea<\/strong>, <strong>hemograma completo<\/strong>, <strong>TSH e T4 livre<\/strong>, <strong>eletrocardiograma e/ou ecocardiograma<\/strong>, <strong>reserva de duas unidades de concentrado de hemácias<\/strong> e, se houver hipertensão arterial crônica, <strong>proteinúria, AST/ALT e creatinina<\/strong>.<\/p>"},{"html":"<p>Diante de <strong>altura uterina &gt; 16 cm associada a cistos tecaluteínicos<\/strong> ou de sinais de hipertireoidismo, acrescentar <strong>propranolol 40 mg de 12/12 h<\/strong> como <strong>profilaxia de crise tireotóxica<\/strong>.<\/p>"},{"html":"<p>O tratamento é o <strong>esvaziamento da cavidade uterina<\/strong>, tendo a <strong>aspiração a vácuo / AMIU (até cânula 8)<\/strong> como método de escolha. Parte das referências cita misoprostol e ocitocina entre os recursos de esvaziamento, mas a orientação mais atual <strong>contraindica formalmente misoprostol e ocitocina antes do esvaziamento<\/strong>, pelo risco de <strong>embolização trofoblástica pulmonar<\/strong> — na prova, prefira o método aspirativo. <strong>Todo o material deve ser enviado para exame anatomopatológico.<\/strong><\/p>"}]},{"h":"Seguimento pós-molar e neoplasia trofoblástica gestacional","blocos":[{"html":"<p>O seguimento é o coração do tema. Ele começa <strong>na alta<\/strong>, com <strong>contracepção imediata e rigorosa<\/strong> (ACO ou barreira, sem esperar o sangramento cessar) — sem contracepção não há como interpretar a curva do hCG — e <strong>hCG seriado semanal ou quinzenal<\/strong>, que deve cair progressivamente até níveis <strong>normais (&lt; 5 mUI/mL)<\/strong>, quando se considera <strong>remissão<\/strong>.<\/p>"},{"html":"<ul><li>Protocolo clássico: <strong>hCG semanal até 3 valores negativos consecutivos<\/strong>, seguido de <strong>dosagem mensal por 6 meses<\/strong>.<\/li><li>O hCG deve permanecer negativo por <strong>mais de 6 meses na mola completa (total)<\/strong> e por <strong>pelo menos 1 mês na mola parcial<\/strong>.<\/li><li>Sem acesso a anatomopatológico, recomenda-se <strong>β-hCG em todas as mulheres 30 dias após abortamento completo espontâneo<\/strong>.<\/li><\/ul>"},{"html":"<h3>Diagnóstico de NTG pós-molar<\/h3>"},{"html":"<p><strong>Aproximadamente 15% a 40% das pacientes desenvolvem NTG pós-molar<\/strong>, e em quase <strong>100% das vezes o diagnóstico é bioquímico<\/strong>, feito pela curva anormal de regressão do hCG. Critérios FIGO:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Critério<\/th><th>Definição<\/th><\/tr><\/thead><tbody><tr><td><strong>Platô<\/strong><\/td><td><strong>4 ou mais<\/strong> valores de hCG estáveis por período <strong>superior a 3 semanas<\/strong> — dias <strong>1, 7, 14 e 21<\/strong> (platô = variação <strong>&lt; 10%<\/strong>)<\/td><\/tr><tr><td><strong>Ascensão<\/strong><\/td><td><strong>3 medidas consecutivas<\/strong> em aumento por <strong>pelo menos 2 semanas<\/strong> — dias <strong>1, 7 e 14<\/strong> (aumento = <strong>≥ 10%<\/strong>)<\/td><\/tr><tr><td><strong>Histológico<\/strong><\/td><td>Diagnóstico direto de <strong>coriocarcinoma<\/strong> em material de curetagem<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Fora do contexto molar, o diagnóstico é desafiador: deve ser lembrado em toda mulher com <strong>sangramento pós-parto ou abortamento prolongado<\/strong> e diante de <strong>doença tumoral metastática sem primário definido<\/strong> com antecedente de ao menos uma gestação, mesmo remota — confirmando-se pela positividade do hCG associada a exames de imagem, <strong>não obrigatoriamente por histopatologia<\/strong>.<\/p>"},{"html":"<p>Os tipos histopatológicos da NTG são a <strong>mola invasora<\/strong>, o <strong>coriocarcinoma<\/strong>, o <strong>tumor trofoblástico de sítio placentário (TTSP)<\/strong> e o <strong>tumor trofoblástico epitelioide (TTE)<\/strong>.<\/p>"},{"html":"<h3>Estadiamento, escore de risco e tratamento<\/h3>"},{"html":"<p>O tratamento combina o <strong>estadiamento anatômico FIGO<\/strong> com o <strong>sistema de pontuação prognóstica da OMS<\/strong>.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Estádio FIGO<\/th><th>Extensão<\/th><\/tr><\/thead><tbody><tr><td><strong>I<\/strong><\/td><td>Doença restrita ao <strong>corpo do útero<\/strong><\/td><\/tr><tr><td><strong>II<\/strong><\/td><td>NTG em <strong>pelve, vagina, anexos, ligamento largo<\/strong><\/td><\/tr><tr><td><strong>III<\/strong><\/td><td>NTG com extensão para os <strong>pulmões<\/strong>, com ou sem envolvimento genital<\/td><\/tr><tr><td><strong>IV<\/strong><\/td><td><strong>Todos os outros locais<\/strong> de metástase<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Escore de risco da neoplasia trofoblástica gestacional (adaptado de FIGO)<\/p>"},{"html":"<p>No escore, pontua-se 0, 1, 2 ou 4: idade (&lt; 40 anos = 0; ≥ 40 = 1); gestação anterior (mola = 0; aborto = 1; gestação a termo = 2); intervalo entre a gestação antecedente e a NTG (&lt; 4 meses = 0; 4–6 = 1; 7–12 = 2; &gt; 12 = 4); hCG pré-tra
