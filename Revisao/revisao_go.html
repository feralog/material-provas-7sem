óstico precisa ser revisto retrospectivamente.","ref":[1,4]},{"id":"f03aad32cb","q":"Qual proporção das gestantes com hipertensão gestacional acaba desenvolvendo sinais ou sintomas de pré-eclâmpsia?","opts":["Até 25% dos casos","Até 5% dos casos","Até 50% dos casos","Até 75% dos casos"],"c":0,"exp":"Até 25% das gestantes com hipertensão gestacional passam a apresentar sinais ou sintomas de pré-eclâmpsia, mudando de diagnóstico. É por isso que o rótulo de hipertensão gestacional nunca é definitivo antes do parto e exige vigilância laboratorial seriada.","ref":[1,4]},{"id":"b2c6e4c5a3","q":"Que achado define a hipertensão do jaleco branco na gestante?","opts":["PA elevada só nas consultas, normal nas medidas domiciliares","PA elevada só à noite, normal durante todo o período diurno","PA elevada só no terceiro trimestre, normal antes disso","PA elevada em casa, normal nas aferições do consultório"],"c":0,"exp":"A síndrome do jaleco branco é a elevação da pressão apenas nas consultas de pré-natal em consultório, sem confirmação nas avaliações domiciliares. O padrão inverso, pressão alta em casa e normal no consultório, descreve a hipertensão mascarada, que é outra entidade.","ref":[1,2]},{"id":"0cce83d808","q":"Gestante com hipertensão arterial crônica apresenta, com 32 semanas, necessidade de aumentar a dose do anti-hipertensivo e proteinúria quatro vezes maior que a do primeiro trimestre. Qual é o diagnóstico?","opts":["Pré-eclâmpsia sobreposta à hipertensão crônica","Hipertensão gestacional de início tardio","Hipertensão crônica de difícil controle","Síndrome do jaleco branco descompensada"],"c":0,"exp":"A pré-eclâmpsia sobreposta se estabelece quando a hipertensa crônica, após 20 semanas, passa a exigir aumento das doses iniciais ou associação de anti-hipertensivos, quando a proteinúria aparece ou piora, ou quando surge disfunção de órgão-alvo. Os dois primeiros critérios estão presentes neste caso.","ref":[1,7]},{"id":"4fb3427d1b","q":"Na pré-eclâmpsia sobreposta, qual aumento da proteinúria já detectada na primeira metade da gestação fecha o diagnóstico?","opts":["Aumento de pelo menos três vezes o valor inicial","Aumento de pelo menos duas vezes o valor inicial","Aumento de pelo menos cinco vezes o valor inicial","Aumento de pelo menos dez vezes o valor inicial"],"c":0,"exp":"O critério é o aumento de pelo menos três vezes o valor de proteinúria encontrado na primeira metade da gestação, ou o aparecimento de proteinúria quando ela antes não existia. Flutuações menores são esperadas na nefropatia crônica e não autorizam o diagnóstico.","ref":[1,7]},{"id":"e3c7152090","q":"Quais valores caracterizam proteinúria significativa no diagnóstico de pré-eclâmpsia?","opts":["≥ 300 mg/24h ou relação proteína/creatinina ≥ 0,3","≥ 150 mg/24h ou relação proteína/creatinina ≥ 0,1","≥ 500 mg/24h ou relação proteína/creatinina ≥ 0,5","≥ 1.000 mg/24h ou relação proteína/creatinina ≥ 1,0"],"c":0,"exp":"Proteinúria significativa é definida por 300 mg ou mais em urina de 24 horas, ou relação proteína/creatinina em amostra isolada igual ou maior que 0,3 mg/mg. A relação em amostra isolada dispensa a coleta de 24 horas e é a ferramenta prática do pronto-socorro.","ref":[5,2]},{"id":"bc15a2cdd3","q":"Que contagem de plaquetas caracteriza comprometimento hematológico na pré-eclâmpsia?","opts":["Menos de 100.000/mm³","Menos de 150.000/mm³","Menos de 50.000/mm³","Menos de 20.000/mm³"],"c":0,"exp":"Plaquetas abaixo de 100.000/mm³ configuram comprometimento hematológico e, junto de hemólise ou coagulação intravascular disseminada, fecham o critério de disfunção de órgão-alvo. Contagens de 50.000 ou 20.000 já representam quadros muito mais graves, não o limiar diagnóstico.","ref":[2,3]},{"id":"35bb04c2e5","q":"A partir de que valor de TGO ou TGP se considera disfunção hepática na pré-eclâmpsia?","opts":["Acima de 70 U/L ou duas vezes o basal","Acima de 40 U/L ou duas vezes o basal","Acima de 120 U/L ou duas vezes o basal","Acima de 200 U/L ou duas vezes o basal"],"c":0,"exp":"Transaminases acima de 70 U/L, ou iguais ou maiores que duas vezes o valor de referência do laboratório, definem comprometimento hepático. Esse mesmo corte de 70 U/L é o componente de enzimas hepáticas elevadas da síndrome HELLP.","ref":[3,1]},{"id":"36815ea278","q":"Que valor de creatinina sérica caracteriza disfunção renal na pré-eclâmpsia?","opts":["Acima de 1,1 mg/dL ou duas vezes o basal","Acima de 0,6 mg/dL ou duas vezes o basal","Acima de 2,5 mg/dL ou duas vezes o basal","Acima de 4,0 mg/dL ou duas vezes o basal"],"c":0,"exp":"Creatinina acima de 1,1 mg/dL, ou o dobro do valor basal da própria paciente, caracteriza perda de função renal. O critério relativo é indispensável porque a gestante normal tem creatinina baixa, de modo que uma subida de 0,5 para 1,0 mg/dL já é significativa mesmo sem ultrapassar 1,1.","ref":[2,5]},{"id":"745d461637","q":"Gestante de 30 semanas, antes normotensa, tem PA 150 x 95 mmHg, proteinúria negativa e exames laboratoriais normais, mas o feto apresenta restrição de crescimento assimétrica com Doppler alterado. Qual é o diagnóstico?","opts":["Pré-eclâmpsia por disfunção uteroplacentária","Hipertensão gestacional sem critérios adicionais","Hipertensão crônica de diagnóstico tardio","Hipertensão do jaleco branco com feto pequeno"],"c":0,"exp":"Hipertensão após 20 semanas somada a disfunção uteroplacentária, expressa por restrição de crescimento assimétrica ou alteração dopplervelocimétrica, basta para o diagnóstico de pré-eclâmpsia mesmo sem proteinúria e sem alteração laboratorial materna. A placenta é o órgão-alvo neste caso.","cap":"Critérios diagnósticos atuais da pré-eclâmpsia","ref":[2,4]},{"id":"329f81e2f7","q":"Qual critério diagnóstico de pré-eclâmpsia NÃO é considerado também critério de gravidade?","opts":["A proteinúria, seja qual for seu valor","A plaquetopenia abaixo de 100.000/mm³","A creatinina sérica acima de 1,1 mg/dL","O edema agudo de pulmão materno"],"c":0,"exp":"Os critérios de gravidade são exatamente os mesmos critérios diagnósticos de disfunção de órgão-alvo, com uma única exceção: a proteinúria. Por mais alta que esteja, a proteinúria isolada não classifica a pré-eclâmpsia como grave nem antecipa o parto.","ref":[3,0]},{"id":"fca4fdabb8","q":"Além da disfunção de órgão-alvo, que achado pressórico define pré-eclâmpsia com sinais de gravidade?","opts":["PAS ≥ 160 e/ou PAD ≥ 110 mmHg em duas medidas","PAS ≥ 140 e/ou PAD ≥ 90 mmHg em duas medidas","PAS ≥ 150 e/ou PAD ≥ 100 mmHg em duas medidas","PAS ≥ 180 e/ou PAD ≥ 120 mmHg em duas medidas"],"c":0,"exp":"A crise hipertensiva, definida por sistólica igual ou maior que 160 e/ou diastólica igual ou maior que 110 mmHg em duas medidas, é critério de gravidade por si só. Valores de 140 x 90 mmHg apenas estabelecem o diagnóstico de hipertensão, sem agregar gravidade.","ref":[3,0]},{"id":"3543347313","q":"Que tríade de sintomas caracteriza iminência de eclâmpsia?","opts":["Cefaleia, escotomas e epigastralgia","Cefaleia, tosse seca e lombalgia","Náusea, pirose e dor pélvica baixa","Tontura, zumbido e dor torácica"],"c":0,"exp":"Cefaleia tipicamente occipital, escotomas cintilantes e epigastralgia ou dor no hipocôndrio direito são os sinais premonitórios de eclâmpsia. Eles podem ocorrer com ou sem hipertensão grave e com ou sem proteinúria, e exigem sulfato de magnésio imediato.","ref":[3,3]},{"id":"cdfaf1474a","q":"Quais são os três componentes da síndrome HELLP?","opts":["Hemólise, enzimas hepáticas elevadas e plaquetopenia","Hemoconcentração, hipoglicemia e plaquetopenia grave","Hemólise, hipertensão grave e proteinúria maciça","Hiperuricemia, enzimas elevadas e leucopenia grave"],"c":0,"exp":"A sigla reúne hemólise, elevação de enzimas hepáticas e plaquetopenia. Nenhum dos três é hipertensão ou proteinúria: a síndrome pode se instalar sem eles, e esperar por eles para pensar no diagnóstico é um erro clássico.","cap":"Os três componentes da síndrome HELLP","ref":[4,0]},{"id":"71a7c766c2","q":"Que conjunto de valores laboratoriais fecha o diagnóstico de síndrome HELLP?","opts":["DHL > 600 U/L, TGO/TGP > 70 U/L e plaquetas < 100.000","DHL > 300 U/L, TGO/TGP > 40 U/L e plaquetas < 150.000","DHL > 900 U/L, TGO/TGP > 150 U/L e plaquetas < 50.000","DHL > 450 U/L, TGO/TGP > 100 U/L e plaquetas < 70.000"],"c":0,"exp":"Os cortes são desidrogenase lática acima de 600 U/L como marcador de hemólise, transaminases acima de 70 U/L e plaquetas abaixo de 100.000/mm³. Bilirrubina total acima de 1,2 mg/dL e esquizócitos em sangue periférico também atestam a hemólise microangiopática.","ref":[7,4]},{"id":"799269e2b3","q":"Qual achado NÃO serve como marcador de hemólise na síndrome HELLP?","opts":["Haptoglobina acima de 100 mg/dL","Bilirrubina indireta ≥ 1,2 mg/dL","Esquizócitos em sangue periférico","Hemoglobina igual ou menor que 8 g/dL"],"c":0,"exp":"Na hemólise a haptoglobina é consumida e cai, de modo que o marcador é a concentração abaixo de 25 mg/dL, nunca um valor elevado. Bilirrubina indireta a partir de 1,2 mg/dL, esquizócitos ou equinócitos e anemia grave com hemoglobina até 8 g/dL são os demais marcadores aceitos.","ref":[4,1]},{"id":"d882e67b75","q":"Que contagem mínima de plaquetas se procura manter para cesárea e para parto normal na síndrome HELLP?","opts":["70.000/mm³ para cesárea e 20.000/mm³ para parto normal","50.000/mm³ para cesárea e 10.000/mm³ para parto normal","100.000/mm³ para cesárea e 50.000/mm³ para parto normal","20.000/mm³ para cesárea e 70.000/mm³ para parto normal"],"c":0,"exp":"Recomenda-se manter plaquetas acima de 70.000/mm³ para cesárea e acima de 20.000/mm³ para parto normal. A cesárea exige mais porque abre planos cirúrgicos sujeitos a hematoma; abaixo de 100.000 o parto já deve ser programado em local com reserva de hemoderivados.","ref":[4,4]},{"id":"efdd79251a","q":"Em quais pacientes com síndrome HELLP o sulfato de magnésio está indicado?","opts":["Em todas, mesmo sem iminência de eclâmpsia","Apenas nas que já convulsionaram ao menos uma vez","Apenas nas que têm cefaleia ou escotomas visuais","Apenas nas que têm plaquetas abaixo de 50.000"],"c":0,"exp":"O sulfato de magnésio é administrado a todas as pacientes com síndrome HELLP, independentemente de haver clínica de iminência de eclâmpsia. A síndrome por si só já define risco convulsivo suficiente para a profilaxia.","ref":[4,4]},{"id":"7ba2271ac4","q":"Qual é a relação entre corticoterapia antenatal e o momento do parto na síndrome HELLP?","opts":["O parto só é adiado 48 horas se a mãe estiver estável","O parto é sempre adiado 48 horas pela corticoterapia","A corticoterapia substitui a indicação de parto imediato","A corticoterapia só é feita depois de realizado o parto"],"c":0,"exp":"Diante de situação materna grave o parto jamais é postergado para completar corticoide. Excepcionalmente, em paciente estável entre 23 e 34 semanas, admite-se retardar o parto por 48 horas para a corticoterapia antenatal, mas a estabilidade materna é a condição absoluta.","ref":[4,4]},{"id":"bccb9aec31","q":"Na síndrome HELLP com plaquetas abaixo de 70.000/mm³, que tipo de anestesia é recomendado para a cesárea?","opts":["Anestesia geral, pelo risco de hematoma","Raquianestesia, por ser mais rápida","Peridural contínua, por ser mais segura","Bloqueio local, por evitar a hipotensão"],"c":0,"exp":"Com plaquetas abaixo de 70.000/mm³ indica-se anestesia geral, porque o bloqueio de neuroeixo expõe ao hematoma peridural. Completam os cuidados avaliar coagulograma, repor plaquetas no ato cirúrgico, fazer hemostasia cuidadosa e deixar dreno sentinela.","ref":[4,4]},{"id":"b9b62dcdd4","q":"Qual é o esquema de Zuspan para o sulfato de magnésio?","opts":["Ataque de 4 g EV e manutenção de 1 a 2 g/h EV em bomba","Ataque de 6 g EV e manutenção de 2 a 3 g/h EV em bomba","Ataque de 4 g EV e manutenção de 5 g IM a cada 4 horas","Ataque de 8 g EV e manutenção de 4 a 5 g/h EV em bomba"],"c":0,"exp":"Zuspan é o esquema exclusivamente endovenoso: ataque de 4 g em cerca de 20 minutos e manutenção de 1 a 2 g por hora em bomba de infusão contínua. Manutenção intramuscular de 5 g a cada 4 horas pertence ao esquema de Pritchard, e 6 g de ataque ao de Sibai.","cap":"Esquemas de sulfato de magnésio: Zuspan, Pritchard e Sibai","ref":[5,1]},{"id":"aa0f2b2d5f","q":"Qual é o esquema de Pritchard para o sulfato de magnésio?","opts":["Ataque de 4 g EV mais 10 g IM e manutenção de 5 g IM a cada 4 h","Ataque de 4 g EV mais 6 g IM e manutenção de 2 g IM a cada 6 horas","Ataque de 6 g EV mais 10 g IM e manutenção de 5 g EV a cada 4 horas","Ataque de 10 g IM apenas e manutenção de 4 g EV a cada 4 horas"],"c":0,"exp":"Pritchard combina as duas vias: ataque de 4 g endovenosos lentos somados a 10 g intramusculares profundos, seguidos de manutenção de 5 g intramusculares a cada 4 horas. É o esquema que dispensa bomba de infusão e por isso serve a serviços sem recursos.","ref":[5,2]},{"id":"fc49c5e3f3","q":"Quais parâmetros devem ser monitorizados durante a infusão de sulfato de magnésio?","opts":["Diurese, frequência respiratória e reflexos patelares","Glicemia, frequência cardíaca e reflexo cutâneo plantar","Diurese, temperatura axilar e reflexo fotomotor pupilar","Saturação, pressão venosa central e reflexo aquileu"],"c":0,"exp":"A vigilância se faz por diurese, frequência respiratória, reflexos patelares e pressão arterial a cada 4 horas, com uma ampola de gluconato de cálcio a 10% sempre ao lado do leito. Esses três parâmetros são justamente os que se alteram em sequência na intoxicação.","ref":[5,5]},{"id":"0cf5fca066","q":"Qual é o primeiro sinal de intoxicação pelo sulfato de magnésio a aparecer?","opts":["Abolição do reflexo patelar","Depressão respiratória grave","Parada cardíaca em assistolia","Rebaixamento de consciência"],"c":0,"exp":"A toxicidade segue uma ordem fixa de magnesemia: a faixa terapêutica vai de 4,8 a 8,4 mg/dL, de 9,6 a 12 mg/dL há abolição dos reflexos, a partir de 14,4 mg/dL surge depressão ou parada respiratória, e acima de 25 mg/dL ocorre parada cardíaca. O reflexo patelar é, portanto, o alarme mais precoce.","cap":"Faixa terapêutica, níveis de toxicidade e antídoto","ref":[5,6]},{"id":"135a17175d","q":"Abaixo de que frequência respiratória o sulfato de magnésio deve ser suspenso e o antídoto administrado?","opts":["16 incursões por minuto","12 incursões por minuto","20 incursões por minuto","8 incursões por minuto"],"c":0,"exp":"Frequência respiratória abaixo de 16 incursões por minuto, assim como reflexos patelares diminuídos ou abolidos, indica suspender a infusão e aplicar o antídoto. Esperar chegar a 12 ou 8 incursões significa esperar a parada respiratória se instalar.","ref":[5,5]},{"id":"8bf4605fcb","q":"Qual débito urinário é considerado fator de risco para intoxicação pelo sulfato de magnésio?","opts":["Diurese abaixo de 25 mL/h","Diurese abaixo de 50 mL/h","Diurese abaixo de 75 mL/h","Diurese abaixo de 100 mL/h"],"c":0,"exp":"O magnésio é eliminado por via renal, de modo que diurese abaixo de 25 mL por hora é o fator de risco clássico para acúmulo e intoxicação. Por isso o controle de diurese entra na rotina de monitorização junto com reflexos e frequência respiratória.","ref":[5,5]},{"id":"9cc9dd5bbf","q":"Qual é o antídoto do sulfato de magnésio e como ele é administrado?","opts":["Gluconato de cálcio 10%, uma ampola de 10 mL, EV lento","Cloreto de potássio 10%, uma ampola de 10 mL, EV lento","Bicarbonato de sódio 8,4%, uma ampola de 10 mL, EV lento","Sulfato de protamina 1%, uma ampola de 10 mL, EV lento"],"c":0,"exp":"O antídoto é o gluconato de cálcio a 10%, uma ampola de 10 mL por via endovenosa lenta. O cálcio desloca o magnésio da junção neuromuscular e reverte a depressão respiratória, razão pela qual a ampola fica permanentemente ao lado do leito.","ref":[5,5]},{"id":"f5a1551f81","q":"Que ajuste se faz no sulfato de magnésio quando a creatinina da paciente está em 1,4 mg/dL?","opts":["Reduzir a dose de manutenção pela metade","Dobrar a dose de manutenção habitual","Suspender definitivamente a medicação","Manter a dose e repetir a de ataque"],"c":0,"exp":"Com creatinina igual ou maior que 1,2 mg/dL a dose de manutenção é reduzida à metade, porque a excreção renal do magnésio está comprometida e o risco de acúmulo aumenta. A dose de ataque não muda: o que se ajusta é a manutenção.","ref":[5,6]},{"id":"7c451b5efb","q":"Qual é o esquema do nifedipino no tratamento da crise hipertensiva?","opts":["10 mg VO, repetir a cada 20 a 30 min, máximo de 30 mg","20 mg VO, repetir a cada 10 a 15 min, máximo de 80 mg","5 mg VO, repetir a cada 60 minutos, máximo de 20 mg","30 mg VO, repetir a cada 20 a 30 min, máximo de 90 mg"],"c":0,"exp":"O nifedipino é usado em comprimidos de 10 mg por via oral, repetidos a cada 20 a 30 minutos se necessário, até a dose máxima de 30 mg. Doses maiores ou intervalos menores arriscam hipotensão materna abrupta com queda do fluxo uteroplacentário.","cap":"Agentes para a crise hipertensiva: dose inicial, repetição e máximo","ref":[6,1]},{"id":"e80884db2b","q":"Qual é o esquema da hidralazina endovenosa na crise hipertensiva?","opts":["5 mg IV, repetir a cada 20 min, máximo de 30 mg","10 mg IV, repetir a cada 10 min, máximo de 60 mg","20 mg IV, repetir a cada 30 min, máximo de 80 mg","2 mg IV, repetir a cada 60 min, máximo de 10 mg"],"c":0,"exp":"A hidralazina é administrada em bolus de 5 mg endovenosos, repetíveis a cada 20 minutos até o máximo de 30 mg. A ampola de 1 mL contém 20 mg/mL e deve ser diluída em 19 mL de água destilada para obter a concentração de 1 mg/mL.","ref":[6,1]},{"id":"ac71876bd5","q":"Qual é a faixa de infusão do nitroprussiato de sódio na crise hipertensiva refratária?","opts":["0,5 a 10 µg/kg/min","5 a 50 µg/kg/min","0,1 a 1 µg/kg/min","10 a 100 µg/kg/min"],"c":0,"exp":"O nitroprussiato de sódio é infundido continuamente de 0,5 a 10 microgramas por quilo por minuto. A ampola de 2 mL contém 50 mg e é diluída em 248 mL de soro glicosado a 5%, resultando na concentração de 200 microgramas por mililitro.","ref":[6,1]},{"id":"1411979b49","q":"Qual anti-hipertensivo é considerado a droga de escolha para o tratamento inicial da gestante hipertensa?","opts":["Metildopa, 750 a 2.000 mg por dia","Captopril, 75 a 150 mg por dia","Atenolol, 50 a 150 mg por dia","Losartana, 50 a 100 mg por dia"],"c":0,"exp":"A alfametildopa, inibidor adrenérgico de ação central, é a droga considerada de tratamento inicial na hipertensão crônica e na gestacional, em doses de 750 mg a 2 g por dia divididas em duas a quatro tomadas. Captopril e losartana atuam no eixo renina-angiotensina e não têm lugar durante a gestação.","ref":[6,4]},{"id":"90856de025","q":"Qual classe de anti-hipertensivos consta no esquema do puerpério, mas não no esquema de uso durante a gestação?","opts":["Inibidores da enzima conversora de angiotensina","Bloqueadores dos canais de cálcio de uso oral","Simpatolíticos de ação central alfa-2 agonistas","Vasodilatadores periféricos de administração oral"],"c":0,"exp":"Enalapril e captopril aparecem apenas no esquema do puerpério, assim como o atenolol. Metildopa, nifedipino, anlodipino, hidralazina, metoprolol e carvedilol atravessam os dois momentos, de modo que o que muda ao sair da gestação é justamente a liberação do bloqueio do eixo renina-angiotensina.","cap":"Anti-hipertensivos recomendados no puerpério","ref":[6,5]},{"id":"8ef6e2d511","q":"Qual é a prescrição de ácido acetilsalicílico para prevenção da pré-eclâmpsia?","opts":["100 mg/dia à noite, das 12 às 36 semanas","100 mg/dia pela manhã, das 20 às 40 semanas","300 mg/dia à noite, das 12 às 28 semanas","50 mg/dia pela manhã, das 24 às 36 semanas"],"c":0,"exp":"A profilaxia é feita com 100 mg por dia de ácido acetilsalicílico, tomados à noite, iniciados a partir de 12 semanas e mantidos até 36 semanas. O horário noturno e o início precoce são o que dá eficácia à medida, porque a janela de remodelamento das artérias espiraladas é o segundo trimestre inicial.","ref":[8,4]},{"id":"6e6073716b","q":"Qual é a janela ideal para iniciar o ácido acetilsalicílico na prevenção da pré-eclâmpsia?","opts":["Entre 12 e 16 semanas","Entre 20 e 24 semanas","Entre 28 e 32 semanas","Entre 4 e 8 semanas"],"c":0,"exp":"A janela ideal de início é entre 12 e 16 semanas, antes do fim da segunda onda de invasão trofoblástica. Começar depois de 20 semanas perde o efeito preventivo, porque o defeito de placentação já está consolidado.","ref":[8,4]},{"id":"c81067e2b5","q":"Quantos fatores de alto risco bastam para classificar a gestante como de alto risco para pré-eclâmpsia?","opts":["Um único fator já basta","São necessários dois deles","São necessários três deles","São necessários quatro deles"],"c":0,"exp":"Um único fator de alto risco basta: história prévia de pré-eclâmpsia, gestação múltipla, obesidade com índice de massa corporal acima de 30, hipertensão crônica, diabetes tipo 1 ou 2, doença renal crônica, doenças autoimunes ou gestação por reprodução assistida. Já os fatores moderados exigem dois ou mais para a mesma classificação.","cap":"Fatores de risco clínicos usados na predição da pré-eclâmpsia","ref":[8,1]},{"id":"9e7508835e","q":"Até que idade gestacional se admite conduta expectante na pré-eclâmpsia sem sinais de deterioração clínica ou laboratorial?","opts":["Até a 37ª semana","Até a 34ª semana","Até a 40ª semana","Até a 32ª semana"],"c":0,"exp":"A conduta expectante é admitida somente até a 37ª semana. A partir daí, e sempre que a pré-eclâmpsia for diagnosticada no termo, indica-se a resolução da gestação, o que reduz riscos maternos sem alterar os resultados perinatais.","ref":[7,1]},{"id":"cc76480d12","q":"Quais são as metas de idade gestacional para o parto nas formas leve, moderada e grave da hipertensão arterial crônica?","opts":["40, 38 e 37 semanas, respectivamente","39, 37 e 34 semanas, respectivamente","41, 39 e 38 semanas, respectivamente","38, 36 e 34 semanas, respectivamente"],"c":0,"exp":"Na hipertensão crônica leve, com diastólica de 90 a menos de 100 mmHg, a meta é 40 semanas; na moderada, de 100 a menos de 110 mmHg, é 38 semanas; e na grave, com diastólica igual ou maior que 110 mmHg, é 37 semanas. A via de parto permanece obstétrica em todas.","ref":[1,9]},{"id":"c8d69f973d","q":"Qual é a meta de idade gestacional para o parto na pré-eclâmpsia com critério de gravidade?","opts":["Parto com 34 semanas","Parto com 37 semanas","Parto com 39 semanas","Parto com 28 semanas"],"c":0,"exp":"A pré-eclâmpsia com critério de gravidade antecipa a meta de parto para 34 semanas, contra as 37 semanas da forma sem gravidade e as 38 a 39 semanas da hipertensão gestacional. Deterioração clínica ou laboratorial grave indica o parto em qualquer idade gestacional.","ref":[7,0]},{"id":"f4fd817ece","q":"Indicada a resolução da gravidez, que situação direciona o caso para parto cesáreo?","opts":["Comprometimento da vitalidade fetal ou instabilidade materna","Vitalidade fetal preservada com colo uterino desfavorável","Estabilidade materna clínica com apresentação cefálica","Proteinúria acima de 300 mg em urina de 24 horas"],"c":0,"exp":"Cesárea se indica diante de comprometimento da vitalidade fetal, instabilidade materna clínica ou laboratorial, sangramento espontâneo ou hipertensão de difícil controle. Com vitalidade preservada e mãe estável, prefere-se o parto vaginal, preparando o colo desfavorável com sonda de Foley ou misoprostol.","ref":[7,6]},{"id":"dc0f67be09","q":"Que situação indica parto imediato, independentemente da idade gestacional?","opts":["Eclâmpsia ou descolamento prematuro de placenta","Proteinúria de 24 horas acima de 300 miligramas","Pressão de 150x95 mmHg em duas medidas seguidas","Plaquetas de 140.000 com transaminases normais"],"c":0,"exp":"Eclâmpsia, descolamento prematuro de placenta, síndrome HELLP, edema pulmonar, insuficiência renal, coagulopatia, disfunção hepática progressiva, hipertensão refratária e grave por mais de 24 horas e sofrimento fetal indicam parto imediato. Proteinúria isolada, qualquer que seja o valor, não indica.","ref":[7,4]},{"id":"83d60f11eb","q":"Imediatamente após uma crise eclâmptica surge bradicardia fetal. Qual é a conduta?","opts":["Estabilizar a mãe, pois a bradicardia costuma ceder","Indicar cesárea de emergência em menos de dez min","Realizar amnioinfusão para melhorar o fluxo fetal","Iniciar tocólise imediata com nifedipino por via oral"],"c":0,"exp":"A bradicardia fetal que surge logo após a eclâmpsia dura de 3 a 5 minutos e tende a melhorar com a estabilização materna, não indicando cesárea de emergência. A sequência é sulfato de magnésio, estabilização e só então resolução da gestação.","ref":[3,4]},{"id":"776263464d","q":"Que evento fisiopatológico central origina a pré-eclâmpsia?","opts":["Invasão trofoblástica inadequada das artérias espiraladas","Hiperplasia trofoblástica com invasão miometrial profunda","Obstrução mecânica do espaço interviloso por coágulos","Ruptura precoce das vilosidades coriais mais terminais"],"c":0,"exp":"A falha da segunda onda de invasão trofoblástica deixa as artérias espiraladas sem a remodelação que deveria ocorrer até as 20 semanas. O resultado é resistência vascular aumentada, fluxo sanguíneo reduzido e perfusão placentária diminuída, com disfunção endotelial, resposta inflamatória intensa e estado anti-angiogênico.","ref":[2,0]}],"resumo":[{"h":"O peso do tema","blocos":[{"html":"<p>As síndromes hipertensivas são a primeira causa de morte materna no Brasil. Morte materna é definida como a morte da grávida, ou a que ocorre até 42 dias do término da gravidez — qualquer que tenha sido a duração ou o local da gestação —, por causa relacionada ou agravada pela gravidez ou por conduta a ela relacionada, excluídos fatores acidentais e incidentais. Quando resulta de complicação obstétrica propriamente dita, chama-se <strong>morte materna obstétrica direta<\/strong>; quando resulta de doença preexistente ou agravada pela gestação, <strong>morte materna obstétrica indireta<\/strong>.<\/p>"},{"html":"<p>Dois números abrem tudo o que vem depois:<\/p>"},{"html":"<ul><li><strong>Hipertensão na gravidez:<\/strong> PAS ≥ 140 mmHg e/ou PAD ≥ 90 mmHg, em <strong>duas aferições com intervalo de pelo menos 4 horas<\/strong>.<\/li><li><strong>Crise hipertensiva:<\/strong> PA ≥ 160 x 110 mmHg, <strong>mesmo em paciente assintomática<\/strong> — e aí a conduta é hidralazina EV ou nifedipino VO, somados ao sulfato de magnésio.<\/li><\/ul>"},{"html":"<p>A pré-eclâmpsia afeta de 1,5% a 16,7% das gestações no mundo, causando cerca de 60 mil mortes maternas e mais de 500 mil nascimentos prematuros por ano. A hipertensão arterial crônica, por sua vez, atinge 32,5% dos adultos brasileiros e de 6% a 8% das gestantes.<\/p>"}]},{"h":"As cinco formas clínicas e o marco das 20 semanas","blocos":[{"html":"<p>Toda a classificação gira em torno de uma única linha divisória: a <strong>20ª semana de gestação<\/strong>. O que aparece antes dela é crônico; o que aparece depois é da gravidez.<\/p>"},{"html":"<p class=\"figleg\">O marco das 20 semanas separa as formas clínicas<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Entidade<\/th><th>Quando a hipertensão aparece<\/th><th>Proteinúria / órgão-alvo<\/th><th>Observação<\/th><\/tr><\/thead><tbody><tr><td>Hipertensão arterial crônica<\/td><td>Antes da gestação ou antes das 20 semanas<\/td><td>Ausentes (se presentes, pense em sobreposta)<\/td><td>Persiste depois do puerpério<\/td><\/tr><tr><td>Hipertensão do jaleco branco<\/td><td>Só nas consultas de consultório<\/td><td>Ausentes<\/td><td>Normal nas medidas domiciliares<\/td><\/tr><tr><td>Hipertensão gestacional<\/td><td>Após as 20 semanas<\/td><td><strong>Ausentes<\/strong> — é isso que a define<\/td><td>Deve sumir até 12 semanas pós-parto<\/td><\/tr><tr><td>Pré-eclâmpsia<\/td><td>Após as 20 semanas<\/td><td><strong>Presentes<\/strong> (proteinúria <em>ou<\/em> órgão-alvo <em>ou<\/em> disfunção uteroplacentária)<\/td><td>Pode evoluir para eclâmpsia e HELLP<\/td><\/tr><tr><td>Pré-eclâmpsia sobreposta<\/td><td>Hipertensa crônica que piora após 20 semanas<\/td><td>Surgem depois das 20 semanas<\/td><td>Começa crônica, termina pré-eclâmptica<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<h4>Hipertensão gestacional<\/h4>"},{"html":"<p>O rótulo nunca é definitivo antes do parto: <strong>até 25% dessas gestantes<\/strong> acabam apresentando sinais ou sintomas de pré-eclâmpsia, e o diagnóstico muda. Se a pressão não normalizar <strong>até 12 semanas pós-parto<\/strong>, o que havia era hipertensão crônica desmascarada pela gravidez.<\/p>"},{"html":"<h4>Pré-eclâmpsia sobreposta à hipertensão crônica<\/h4>"},{"html":"<p>Fecha-se o diagnóstico em três situações, e <strong>qualquer uma<\/strong> basta:<\/p>"},{"html":"<ol><li>Após 20 semanas, surge proteinúria antes inexistente, ou a já detectada na primeira metade da gestação <strong>aumenta pelo menos três vezes<\/strong> o valor inicial.<\/li><li>A paciente passa a <strong>necessitar de aumento das doses iniciais<\/strong> do anti-hipertensivo ou de associação de drogas.<\/li><li>Surge <strong>disfunção de órgão-alvo<\/strong> (ou disfunção uteroplacentária).<\/li><\/ol>"},{"html":"<h4>Classificação da hipertensão crônica<\/h4>"},{"html":"<p>A ACOG separa em leve a moderada (PAS 140–159 e PAD 90–109 mmHg) e grave (PAS ≥ 160 ou PAD ≥ 110 mmHg). Um segundo critério, o que define a meta de parto, usa só a diastólica: <strong>leve<\/strong> (PAD 90–99), <strong>moderada<\/strong> (PAD 100–109) e <strong>grave<\/strong> (PAD ≥ 110 mmHg).<\/p>"}]},{"h":"Critérios diagnósticos da pré-eclâmpsia","blocos":[{"html":"<p>A pré-eclâmpsia é uma síndrome multissistêmica cuja definição molecular combina <strong>disfunção endotelial, resposta inflamatória intensa e estado anti-angiogênico<\/strong>. Na origem está a falha da <strong>segunda onda de invasão trofoblástica<\/strong>, que deveria remodelar as artérias espiraladas até as 20 semanas: sem ela, a resistência vascular sobe, o fluxo cai e a perfusão placentária diminui.<\/p>"},{"html":"<p>A fórmula diagnóstica é hipertensão após 20 semanas <strong>mais um<\/strong> dos três blocos abaixo:<\/p>"},{"html":"<p class=\"figleg\">Critérios diagnósticos atuais da pré-eclâmpsia<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Bloco<\/th><th>O que conta<\/th><\/tr><\/thead><tbody><tr><td>Proteinúria<\/td><td>≥ 300 mg/24 h <strong>ou<\/strong> relação proteína/creatinina ≥ 0,3 mg/mg <strong>ou<\/strong> fita com 2 cruzes ou mais (só se a quantificação for indisponível)<\/td><\/tr><tr><td>Disfunção de órgão-alvo<\/td><td>Plaquetas &lt; 100.000/mm³, hemólise ou CIVD · TGO/TGP &gt; 70 U/L ou ≥ 2× o normal · creatinina &gt; 1,1 mg/dL ou 2× o basal · edema agudo de pulmão · alterações neurológicas ou visuais<\/td><\/tr><tr><td>Disfunção uteroplacentária<\/td><td>Restrição de crescimento fetal assimétrica · alteração dopplervelocimétrica<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p><strong>A proteinúria não é obrigatória.<\/strong> Restrição de crescimento assimétrica ou Doppler alterado em gestante hipertensa depois das 20 semanas já fecham pré-eclâmpsia, mesmo com urina limpa e laboratório materno normal. A placenta é um órgão-alvo como qualquer outro.<\/p><\/blockquote>"},{"html":"<p>A creatinina tem um detalhe que decide questão: o critério relativo (<strong>2× o valor basal<\/strong>) existe porque a gestante normal tem creatinina baixa. Uma subida de 0,5 para 1,0 mg/dL já é disfunção renal, ainda que não cruze 1,1.<\/p>"}]},{"h":"Sinais de gravidade, iminência e eclâmpsia","blocos":[{"html":"<p>A regra é curta: <strong>os critérios de gravidade são os mesmos critérios de disfunção de órgão-alvo, exceto a proteinúria, mais a crise hipertensiva.<\/strong><\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Critério de gravidade<\/th><th>Corte<\/th><\/tr><\/thead><tbody><tr><td>Crise hipertensiva<\/td><td>PAS ≥ 160 e/ou PAD ≥ 110 mmHg, em duas medidas<\/td><\/tr><tr><td>Plaquetopenia, hemólise ou CIVD<\/td><td>Plaquetas &lt; 100.000/mm³<\/td><\/tr><tr><td>Disfunção hepática<\/td><td>TGO ou TGP &gt; 70 U/L, ou 2× o basal<\/td><\/tr><tr><td>Disfunção renal<\/td><td>Creatinina &gt; 1,1 mg/dL, ou 2× o basal<\/td><\/tr><tr><td>Edema agudo de pulmão<\/td><td>Clínico<\/td><\/tr><tr><td>Alterações neurológicas ou visuais<\/td><td>Cefaleia intensa, escotomas, clônus, cegueira, AVC<\/td><\/tr><tr><td>Disfunção uteroplacentária<\/td><td>CIUR assimétrico ou Doppler alterado<\/td><\/tr><tr><td><strong>Proteinúria<\/strong><\/td><td><strong>Não é critério de gravidade, em nenhum valor<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<h4>Iminência de eclâmpsia<\/h4>"},{"html":"<p>A tríade premonitória é <strong>cefaleia<\/strong> (tipicamente occipital), <strong>escotomas cintilantes<\/strong> e <strong>epigastralgia ou dor em hipocôndrio direito<\/strong>. Pode ocorrer com ou sem hipertensão grave, com ou sem proteinúria. Eclâmpsia é a convulsão tônico-clônica generalizada; o rebaixamento do nível de consciência sem convulsão é a sineclâmpsia.<\/p>"},{"html":"<blockquote><p><strong>Bradicardia fetal logo após a crise eclâmptica dura de 3 a 5 minutos e melhora com a estabilização materna — não indica cesárea de emergência.<\/strong> A sequência é o mnemônico <strong>SER<\/strong>: <strong>S<\/strong>ulfato · <strong>E<\/strong>stabilização · <strong>R<\/strong>esolução. Correr para o centro cirúrgico com a mãe instável troca um problema por dois.<\/p><\/blockquote>"}]},{"h":"Síndrome HELLP","blocos":[{"html":"<p class=\"figleg\">Os três componentes da síndrome HELLP<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Componente<\/th><th>Critério<\/th><\/tr><\/thead><tbody><tr><td><strong>H<\/strong>emolysis<\/td><td>DHL &gt; 600 U/L (ou 2× a referência) · bilirrubina indireta ≥ 1,2 mg/dL · haptoglobina &lt; 25 mg/dL · hemoglobina ≤ 8 g/dL · esquizócitos ou equinócitos<\/td><\/tr><tr><td><strong>EL<\/strong>evated <strong>L<\/strong>iver enzymes<\/td><td>TGO e/ou TGP &gt; 70 U/L (ou 2× a referência)<\/td><\/tr><tr><td><strong>LP<\/strong> — <strong>L<\/strong>ow <strong>P<\/strong>latelets<\/td><td>Plaquetas &lt; 100.000/mm³<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Nem hipertensão nem proteinúria entram na definição — e <strong>não se deve esperar por elas<\/strong> para levantar a hipótese. Quedas de plaquetas maiores que 20% merecem cautela mesmo sem atingir 100.000/mm³, porque a contagem é o que melhor gradua a gravidade da síndrome.<\/p>"},{"html":"<h4>Condutas que caem em prova<\/h4>"},{"html":"<ul><li><strong>Sulfato de magnésio para todas<\/strong>, independentemente de haver clínica de iminência de eclâmpsia.<\/li><li>Avaliar o feto com perfil biofísico e, se possível, Doppler.<\/li><li><strong>A corticoterapia jamais é razão para aguardar o parto.<\/strong> Excepcionalmente, em paciente estável entre 23 e 34 semanas, admite-se retardar o parto por 48 horas para completar o ciclo.<\/li><li>Reservar hemoderivados: manter plaquetas <strong>acima de 70.000/mm³ para cesárea<\/strong> e <strong>acima de 20.000/mm³ para parto normal<\/strong>. Abaixo de 100.000, programar o parto em local seguro.<\/li><li>Com plaquetas <strong>&lt; 70.000/mm³ e indicação de cesárea<\/strong>: coagulograma, <strong>anestesia geral<\/strong>, reposição de plaquetas no ato, hemostasia cuidadosa e dreno sentinela.<\/li><li>Orientar a paciente sobre risco de recorrência.<\/li><\/ul>"},{"html":"<p>No diagnóstico diferencial, dois achados resolvem: <strong>ADAMTS13 &lt; 10%<\/strong> é sempre presente na PTT e ausente na HELLP; <strong>hipoglicemia e elevação de amônia<\/strong> são usuais na esteatose hepática aguda da gravidez e ausentes na HELLP.<\/p>"}]},{"h":"Sulfato de magnésio","blocos":[{"html":"<p>É superior a qualquer outro anticonvulsivante tanto na <strong>prevenção<\/strong> quanto no <strong>tratamento<\/strong> da eclâmpsia, com grau de recomendação forte, nas vias endovenosa e intramuscular. Uma ampola de MgSO₄ a 50% tem 10 mL e contém <strong>5 g<\/strong>.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Esquema<\/th><th>Ataque<\/th><th>Manutenção<\/th><th>Via<\/th><\/tr><\/thead><tbody><tr><td><strong>Zuspan<\/strong><\/td><td>4 g EV em 15–20 min<\/td><td>1 a 2 g/h em bomba de infusão<\/td><td>IV exclusivo<\/td><\/tr><tr><td><strong>Pritchard<\/strong><\/td><td>4 g EV + 10 g IM profundo (5 g em cada nádega)<\/td><td>5 g IM profundo a cada 4 h<\/td><td>IV + IM<\/td><\/tr><tr><td><strong>Sibai<\/strong><\/td><td>6 g EV<\/td><td>2 a 3 g/h em bomba de infusão<\/td><td>IV exclusivo<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A dose de ataque dos dois primeiros se prepara igual: diluir 8 mL de MgSO₄ a 50% (= 4 g) em 12 mL de água destilada, obtendo 4 g/20 mL, e infundir lentamente. Pritchard dispensa bomba de infusão — é o esquema dos serviços sem recurso.<\/p>"},{"html":"<p class=\"figleg\">Esquemas de sulfato de magnésio com o preparo de cada dose<\/p>"},{"html":"<h4>Monitorização obrigatória<\/h4>"},{"html":"<p>Diurese · frequência respiratória · reflexos patelares · PA a cada 4 horas · <strong>uma ampola de gluconato de cálcio a 10% sempre ao lado do leito<\/strong>.<\/p>"},{"html":"<blockquote><p><strong>A intoxicação segue uma ordem fixa de magnesemia:<\/strong> 4,8–8,4 mg/dL (4–7 mEq/L) é a faixa terapêutica; <strong>9,6–12 mg/dL abole os reflexos<\/strong>; <strong>≥ 14,4 mg/dL<\/strong> causa depressão ou parada respiratória; <strong>&gt; 25 mg/dL<\/strong>, parada cardíaca. Na prática de beira de leito, suspenda a infusão e aplique o antídoto diante de <strong>reflexo patelar diminuído ou abolido<\/strong> ou <strong>FR &lt; 16 ipm<\/strong>. Fator de risco: <strong>diurese &lt; 25 mL/h<\/strong>. Com <strong>creatinina ≥ 1,2 mg/dL, reduza a manutenção pela metade<\/strong> (a dose de ataque não muda).<\/p><\/blockquote>"},{"html":"<p><strong>Antídoto: gluconato de cálcio 10%, uma ampola de 10 mL, EV lento.<\/strong><\/p>"}]},{"h":"Anti-hipertensivos: crise, manutenção e puerpério","blocos":[{"html":"<p class=\"figleg\">Agentes da crise hipertensiva com dose inicial, repetição e máximo<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Agente (crise)<\/th><th>Dose inicial<\/th><th>Repetir<\/th><th>Máximo<\/th><\/tr><\/thead><tbody><tr><td>Nifedipino 10 mg<\/td><td>10 mg VO<\/td><td>10 mg VO a cada 20–30 min<\/td><td>30 mg<\/td><\/tr><tr><td>Hidralazina (ampola 20 mg/mL)<\/td><td>5 mg IV<\/td><td>5 mg IV a cada 20 min<\/td><td>30 mg<\/td><\/tr><tr><td>Nitroprussiato de sódio<\/td><td>0,5 a 10 µg/kg/min em infusão contínua<\/td><td>—<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A ampola de hidralazina tem 1 mL a 20 mg/mL: dilua em 19 mL de água destilada para chegar a 1 mg/mL. O nitroprussiato vem em 2 mL com 50 mg; diluído em 248 mL de SG 5%, fica a 200 µg/mL.<\/p>"},{"html":"<p>Na <strong>manutenção durante a gestação<\/strong>:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Droga<\/th><th>Posologia<\/th><th>Ressalva<\/th><\/tr><\/thead><tbody><tr><td><strong>Metildopa<\/strong> 250/500 mg<\/td><td>750 a 2.000 mg/dia, 8/8 h ou 6/6 h<\/td><td><strong>Droga do tratamento inicial<\/strong>, na HAC e na gestacional<\/td><\/tr><tr><td>Nifedipino retard 10/20 mg<\/td><td>20 a 120 mg/dia<\/td><td>Bloqueador de canal de cálcio, seguro na gestação e lactação<\/td><\/tr><tr><td>Anlodipino 2,5/5/10 mg<\/td><td>5 a 20 mg/dia<\/td><td>Uso seguro na gestação e lactação<\/td><\/tr><tr><td>Hidroclorotiazida 12,5/25 mg<\/td><td>12,5 a 50 mg/dia<\/td><td>Só se a gestante já usava antes da gestação; <strong>evitar no puerpério<\/strong><\/td><\/tr><tr><td>Carvedilol 6,25/12,5 mg<\/td><td>12,5 a 50 mg/dia<\/td><td>Iniciar com 12,5 mg/dia por dois dias antes de subir<\/td><\/tr><tr><td>Metoprolol 25/50/100 mg<\/td><td>100 a 200 mg/dia<\/td><td>Betabloqueador<\/td><\/tr><tr><td>Clonidina 0,1/0,2 mg<\/td><td>0,2 a 0,6 mg/dia<\/td><td>Simpatolítico de ação central<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p><strong>O que só entra depois do parto:<\/strong> os <strong>inibidores da ECA<\/strong> (enalapril 20–40 mg/dia, captopril 75–150 mg/dia) e o <strong>atenolol<\/strong> (50–150 mg/dia) aparecem apenas no esquema do puerpério. Durante a gestação, bloquear o eixo renina-angiotensina está fora de questão — é a diferença prática entre as duas tabelas. A hidroclorotiazida faz o caminho inverso: tolerada na gestação de quem já a usava, deve ser evitada no puerpério.<\/p><\/blockquote>"}]},{"h":"Momento e via de parto","blocos":[{"html":"<div class=\"tbl\"><table><thead><tr><th>Situação<\/th><th>Meta de idade gestacional<\/th><\/tr><\/thead><tbody><tr><td>HAC leve (PAD 90 a &lt; 100)<\/td><td>40 semanas<\/td><\/tr><tr><td>HAC moderada (PAD 100 a &lt; 110)<\/td><td>38 semanas<\/td><\/tr><tr><td>HAC grave (PAD ≥ 110)<\/td><td>37 semanas<\/td><\/tr><tr><td>Hipertensão gestacional<\/td><td>38 a 39 semanas<\/td><\/tr><tr><td>Pré-eclâmpsia sem sinais de gravidade<\/td><td>37 semanas<\/td><\/tr><tr><td>Pré-eclâmpsia com critério de gravidade<\/td><td>34 semanas<\/td><\/tr><tr><td>Deterioração clínica/laboratorial grave<\/td><td>Qualquer idade gestacional<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Na pré-eclâmpsia <strong>sem<\/strong> sinais de deterioração, a conduta expectante vale <strong>somente até a 37ª semana<\/strong> — e sempre que o diagnóstico for feito no termo, indica-se a resolução, o que reduz riscos maternos sem piorar os resultados perinatais. Enquanto se espera, mantém-se controle pressórico, vigilância de sinais de iminência, laboratório semanal (hemograma, função renal e hepática), calculadora <strong>fullPIERS<\/strong> (que estima a probabilidade de desfecho adverso <strong>materno<\/strong>) e avaliação biofísica e hemodinâmica do feto.<\/p>"},{"html":"<p>Na pré-eclâmpsia <strong>pré-termo<\/strong> entre 23 e 37 semanas com deterioração: <strong>sulfato de magnésio<\/strong>, corticoterapia antenatal considerada entre 24 e 34 semanas, e sulfato pré-nascimento abaixo de 32 semanas.<\/p>"},{"html":"<h4>Indicações de parto imediato, em qualquer idade gestacional<\/h4>"},{"html":"<p>Síndrome HELLP · eclâmpsia ou sineclâmpsia · descolamento prematuro de placenta · hipertensão refratária ao tratamento com três fármacos ou grave por mais de 24 horas · edema pulmonar · comprometimento cardíaco · alterações laboratoriais progressivas (plaquetas, transaminases, DHL) · insuficiência renal progressiva · alteração da vitalidade fetal.<\/p>"},{"html":"<h4>Via de parto<\/h4>"},{"html":"<p>A via é <strong>obstétrica<\/strong>, e o parto transpélvico é sempre desejado, tanto no pré-termo quanto no termo. Vai para <strong>cesárea<\/strong> quem tem comprometimento da vitalidade fetal, instabilidade materna clínica ou laboratorial, sangramento espontâneo ou hipertensão de difícil controle. Com mãe estável e feto bem, segue-se para o parto vaginal: colo favorável vai direto para indução com ocitocina; colo desfavorável passa antes por preparo com <strong>sonda de Foley ou misoprostol<\/strong>.<\/p>"}]},{"h":"Prevenção e predição","blocos":[{"html":"<p class=\"figleg\">Fatores de risco clínicos usados na predição da pré-eclâmpsia<\/p>"},{"html":"<p><strong>Alto risco — um único fator basta:<\/strong> história prévia de pré-eclâmpsia · gestação múltipla · obesidade (IMC &gt; 30 kg/m²) · hipertensão arterial crônica · diabetes tipo 1 ou 2 · doença renal crônica · doenças autoimunes (lúpus, SAAF) · gestação por reprodução assistida.<\/p>"},{"html":"<p><strong>Risco moderado — são precisos dois ou mais:<\/strong> nuliparidade · história familiar de pré-eclâmpsia (mãe ou irmãs) · idade ≥ 35 anos · intervalo &gt; 10 anos desde a última gestação · condição socioeconômica desfavorável · raça/cor preta ou parda · gravidez prévia com desfecho adverso de disfunção placentária (DPP, restrição de crescimento, prematuridade, óbito fetal).<\/p>"},{"html":"<h4>Profilaxia<\/h4>"},{"html":"<ul><li><strong>AAS 100 mg/dia, à noite, de 12 (ideal entre 12 e 16) até 36 semanas.<\/strong> Iniciar depois das 20 semanas perde o efeito: a janela útil é a da segunda onda de invasão trofoblástica.<\/li><li><strong>Atividade física<\/strong> de intensidade moderada, cerca de 150 min/semana.<\/li><li><strong>Sódio &lt; 2 g/dia.<\/strong><\/li><li><strong>Cálcio:<\/strong> a atualização de 2026 <strong>não o recomenda<\/strong> para prevenção de pré-eclâmpsia, revertendo a conduta anterior de 1 a 2 g/dia.<\/li><\/ul>"},{"html":"<h4>Predição no primeiro trimestre<\/h4>"},{"html":"<p>O rastreamento combinado de <strong>11 a 14 semanas<\/strong> soma à história materna a pressão arterial média, o Doppler das artérias uterinas e o PlGF (ou PAPP-A, quando o PlGF não estiver disponível).<\/p>"},{"html":"<h4>O que fica depois<\/h4>"},{"html":"<p>Quem teve pré-eclâmpsia carrega risco aumentado por toda a vida: <strong>pré-eclâmpsia na próxima gestação (RR 7,2)<\/strong>, doença renal crônica (4,7), albuminúria (4,3), hipertensão arterial (3,7), mortalidade cardiovascular (2,99), insuficiência cardíaca (2,47), doença arterial coronariana (2,16), AVC (1,81) e trombose venosa profunda (1,79).<\/p>"}]}]},{"slug":"ulceras-genitais","titulo":"Úlceras Genitais","disciplina":"GO","eyebrow":"Ginecologia · Infecções Sexualmente Transmissíveis","questoes":[{"id":"d615561036","q":"Mulher de 23 anos, sem parceiro fixo, relata que há algumas semanas notou uma pequena pápula genital indolor que logo desapareceu. Agora apresenta linfonodomegalia inguinal esquerda dolorosa, com supuração e fistulização por múltiplos orifícios. Qual é o agente etiológico mais provável?","opts":["Chlamydia trachomatis, sorovares L1 a L3","Haemophilus ducreyi, cocobacilo Gram-negativo","Klebsiella granulomatis, bacilo intracelular","Treponema pallidum, espiroqueta não cultivável"],"c":0,"exp":"Lesão de inoculação pequena, indolor e fugaz seguida, dias a semanas depois, por bubão inguinal doloroso que fistuliza por múltiplos orifícios ('bico de regador') é a evolução clássica do linfogranuloma venéreo, causado pelos sorovares L1, L2 e L3 de Chlamydia trachomatis. O bubão do cancro mole costuma fistulizar por orifício único; a sífilis dá linfonodos indolores que não supuram; a donovanose não tem adenite verdadeira.","ref":[0,3]},{"id":"1250f0547f","q":"O bubão inguinal pode supurar tanto no linfogranuloma venéreo quanto no cancro mole. Que característica da fistulização ajuda a diferenciá-los?","opts":["No linfogranuloma, múltiplos orifícios; no cancro mole, orifício único","No linfogranuloma, orifício único; no cancro mole, múltiplos orifícios","Os dois fistulizam por múltiplos orifícios, sem valor diferencial","Só o cancro mole fistuliza; o bubão do linfogranuloma regride sozinho"],"c":0,"exp":"No LGV, os linfonodos aderem à pele eritematoedematosa, flutuam e se rompem por vários pontos — o padrão em 'bico de regador'. No cancro mole, o bubão (presente em cerca de 30 a 50% dos casos, geralmente unilateral) liquefaz e drena tipicamente por um orifício único. Na sífilis, a adenopatia é indolor e não supura.","ref":[5,4]},{"id":"b297cf05e3","q":"Qual é o tratamento de primeira escolha do linfogranuloma venéreo em mulher não gestante?","opts":["Doxiciclina 100 mg VO de 12/12 h por 21 dias","Azitromicina 1 g VO em dose única, sem repetir","Penicilina benzatina 2,4 milhões UI IM, dose única","Ciprofloxacino 500 mg VO de 12/12 h por 3 dias"],"c":0,"exp":"A doxiciclina 100 mg por via oral de 12 em 12 horas por 21 dias é a primeira escolha para o LGV. A alternativa, preferida na gestante, é azitromicina 1 g por via oral uma vez por semana durante 3 semanas — a dose única é insuficiente. Penicilina benzatina trata sífilis, e o ciprofloxacino por 3 dias é esquema de cancro mole.","ref":[7,2]},{"id":"41caac7679","q":"Paciente com linfogranuloma venéreo em tratamento apresenta bubão inguinal flutuante, tenso e muito doloroso. Qual é a conduta local adequada?","opts":["Punção aspirativa com agulha de grosso calibre","Incisão ampla com drenagem cirúrgica do bubão","Exérese cirúrgica de toda a cadeia inguinal","Observação até a fistulização espontânea do bubão"],"c":0,"exp":"Bubões flutuantes são aliviados por punção aspirativa com agulha calibrosa, junto com o antibiótico. A incisão com drenagem cirúrgica é contraindicada porque favorece fistulização crônica e retarda a cicatrização; a exérese da cadeia linfática agrava a obstrução linfática que leva à elefantíase genital.","ref":[5,9]},{"id":"9a514f6c39","q":"Por que a mulher com linfogranuloma venéreo raramente refere a lesão genital inicial ao procurar atendimento?","opts":["A lesão de inoculação é pequena, indolor e cicatriza em poucos dias","A lesão de inoculação é extensa, mas fica restrita ao colo do útero","A lesão de inoculação só surge depois que o bubão inguinal fistuliza","A lesão de inoculação é dolorosa, mas confundida com uma foliculite"],"c":0,"exp":"A fase primária do LGV é uma pápula, pústula ou erosão pequena, indolor e fugaz, que cicatriza espontaneamente e passa despercebida. O que leva a paciente ao serviço é a fase secundária — a intensa repercussão linfática regional, com bubões dolorosos, às vezes com febre, mal-estar e artralgia.","ref":[5,2]},{"id":"bfc4740ebc","q":"Gestante de 19 anos, com 22 semanas e sem episódios prévios, refere queimação vulvar há três dias, seguida de vesículas agrupadas como as da figura, que se romperam em úlceras rasas e muito dolorosas. Tem febre e mal-estar. Qual é o diagnóstico e a conduta?","opts":["Primoinfecção herpética; aciclovir por via oral","Sífilis primária; penicilina benzatina intramuscular","Cancro mole; azitromicina oral em dose única","Condiloma plano; ácido tricloroacético a 90%"],"c":0,"exp":"Pródromo de ardor, vesículas agrupadas que se rompem em úlceras rasas, dolorosas e confluentes, com febre e mal-estar, num primeiro episódio, é a primoinfecção por herpes simples (o HSV-2 é o mais comum na região genital). O aciclovir oral é seguro na gestação e reduz a duração dos sintomas e da excreção viral. Sífilis primária dá úlcera única e indolor; cancro mole não começa por vesículas; condiloma plano é lesão papulosa da sífilis secundária.","cap":"Vesículas agrupadas sobre base eritematosa","ref":[3,2]},{"id":"c71eff90ba","q":"Qual é o esquema de aciclovir recomendado para o primeiro episódio de herpes genital?","opts":["400 mg VO de 8/8 h por 7 a 10 dias","400 mg VO de 8/8 h por apenas 5 dias","400 mg VO de 12/12 h por até 6 meses","800 mg VO em dose única, no pródromo"],"c":0,"exp":"No primeiro episódio, o aciclovir 200 mg, 2 comprimidos (400 mg) por via oral de 8 em 8 horas, é mantido por 7 a 10 dias. O mesmo esquema por 5 dias serve à recidiva, idealmente iniciado no pródromo; 400 mg de 12 em 12 horas por até 6 meses é a terapia supressiva, reservada a quem tem 6 ou mais recorrências por ano.","ref":[3,7]},{"id":"665c48a89c","q":"Mulher com herpes genital apresenta oito recorrências por ano. Qual é a conduta medicamentosa indicada?","opts":["Aciclovir supressivo, 400 mg de 12/12 h, por até 6 meses","Aciclovir 400 mg de 8/8 h por 7 a 10 dias, só no surto","Penicilina benzatina 2,4 milhões UI a cada recorrência","Aciclovir tópico isolado, aplicado no início dos sintomas"],"c":0,"exp":"Seis ou mais episódios por ano indicam terapia supressiva: aciclovir 400 mg por via oral de 12 em 12 horas, por até 6 meses, podendo estender-se até 2 anos. A recorrência isolada é tratada com 400 mg de 8 em 8 horas por 5 dias, de preferência iniciada no pródromo. O aciclovir tópico tem benefício mínimo e não substitui o oral.","ref":[3,7]},{"id":"cf86ebadc4","q":"Como se faz, na maioria dos casos, o diagnóstico de herpes genital?","opts":["Clinicamente, pelas vesículas agrupadas que ulceram","Pela IgM sérica, colhida no primeiro dia de lesão","Pelo Gram do fundo da úlcera, com cocos agrupados","Pela biópsia da borda, com granulomas caseosos"],"c":0,"exp":"O diagnóstico é clínico na maioria das vezes: pródromo, vesículas agrupadas de conteúdo citrino sobre base eritematosa que se rompem em úlceras dolorosas. Quando é preciso confirmar, usa-se PCR para HSV-1/HSV-2 ou cultura do material da vesícula ou da úlcera. A sorologia IgG/IgM só tem utilidade após cerca de 14 dias da primoinfecção — no primeiro dia ainda é negativa.","ref":[3,5]},{"id":"cb5501a1bd","q":"Gestante com antecedente de herpes genital entra em trabalho de parto com lesões vulvares ativas. Qual é a via de parto indicada?","opts":["Cesariana, para reduzir a transmissão ao recém-nascido","Parto vaginal, com aciclovir intravenoso no trabalho","Parto vaginal, pois a recorrência não transmite ao feto","Fórceps de alívio, para encurtar o período expulsivo"],"c":0,"exp":"Lesão herpética ativa (ou pródromo) no início do trabalho de parto indica cesariana, porque a transmissão ocorre principalmente pelo contato com o canal de parto. O risco é muito maior na primoinfecção perto do termo do que na recorrência, mas a recorrência não é isenta de risco. Em quem tem recorrências, o aciclovir supressivo a partir de 36 semanas reduz a chance de lesão no parto.","ref":[3,8]},{"id":"c1e67ac577","q":"Mulher de 26 anos refere, quatro dias após relação desprotegida, múltiplas úlceras vulvares muito dolorosas, de bordas irregulares, fundo purulento e odor fétido, como na figura. Qual é o diagnóstico mais provável?","opts":["Cancro mole, por Haemophilus ducreyi","Donovanose, por Klebsiella granulomatis","Sífilis primária, por Treponema pallidum","Herpes genital recorrente, por HSV-2"],"c":0,"exp":"Úlceras múltiplas, dolorosas, de fundo sujo, purulento e fétido, com bordas irregulares e incubação curta (3 a 5 dias), formam o retrato do cancro mole (cancroide). Lesões em 'espelho' surgem por autoinoculação. A sífilis primária dá úlcera única, indolor e de fundo limpo; a donovanose é indolor e de evolução lenta; o herpes começa por vesículas e produz úlceras rasas.","cap":"Úlceras vulvares múltiplas e confluentes","ref":[4,1]},{"id":"9383ef7d4e","q":"O esfregaço do fundo de uma úlcera genital dolorosa e purulenta, corado pelo Gram, mostra cocobacilos Gram-negativos dispostos em cadeias paralelas, como na figura. Qual agente esse arranjo sugere?","opts":["Haemophilus ducreyi","Klebsiella granulomatis","Treponema pallidum","Chlamydia trachomatis"],"c":0,"exp":"O arranjo em cadeias paralelas, descrito como 'cardume de peixes', 'trilho de trem' ou 'paliçada', é típico de Haemophilus ducreyi, agente do cancro mole; a cultura em meio específico tem sensibilidade inferior a 80%. Klebsiella granulomatis é vista como corpúsculos de Donovan dentro de macrófagos (Giemsa, Wright ou Leishman); o treponema não se cora pelo Gram e é procurado em campo escuro; a clamídia é intracelular obrigatória e se diagnostica por PCR.","cap":"Esfregaço corado pelo Gram","ref":[4,4]},{"id":"3048338287","q":"Qual é o tratamento de primeira escolha do cancro mole?","opts":["Azitromicina 1 g VO em dose única","Doxiciclina 100 mg VO 12/12 h por 21 dias","Penicilina benzatina 2,4 milhões UI IM","Aciclovir 400 mg VO 8/8 h por 7 dias"],"c":0,"exp":"A azitromicina 1 g por via oral em dose única (dois comprimidos de 500 mg) é a primeira opção para o cancroide; a ceftriaxona 250 mg intramuscular em dose única é a alternativa, e o ciprofloxacino 500 mg de 12 em 12 horas por 3 dias também é eficaz, mas é contraindicado na gestação e na lactação. Doxiciclina por 21 dias é esquema de LGV; penicilina benzatina, de sífilis.","ref":[4,6]},{"id":"56e7e390e8","q":"Por que o cancro mole costuma se apresentar com várias úlceras, inclusive em faces opostas da vulva?","opts":["Por autoinoculação, gerando lesões em espelho","Por disseminação hematogênica a partir do bubão","Por reativação viral em gânglios sacrais","Por reação de hipersensibilidade ao bacilo"],"c":0,"exp":"O cancroide é altamente contagioso: o exsudato do fundo da úlcera inocula a pele em contato e cria novas lesões em posições simétricas — as lesões em 'espelho' ou em 'beijo'. Isso, somado à incubação curta, explica a apresentação com úlceras múltiplas e dolorosas. Reativação a partir de gânglios sensitivos é mecanismo do herpes, não de bactéria.","ref":[4,1]},{"id":"7f76b80dc0","q":"No diagnóstico diferencial das úlceras genitais, quais duas causas produzem úlcera tipicamente indolor?","opts":["Sífilis primária e donovanose","Herpes genital e cancro mole","Cancro mole e donovanose","Herpes e sífilis primária"],"c":0,"exp":"O cancro duro da sífilis e a úlcera da donovanose são classicamente indolores — e a lesão de inoculação do LGV também, por isso passa despercebida. Herpes e cancro mole são as úlceras dolorosas. Dor é o primeiro eixo do diferencial, seguido por número de lesões, fundo, borda e padrão da adenopatia.","ref":[0,2]},{"id":"480010379d","q":"Mulher de 25 anos, com ferida vulvar indolor há 14 dias. Ao exame, lesão única de 2 cm em grande lábio direito, de base endurecida e fundo limpo, como na figura, e linfonodomegalia inguinal ipsilateral. Qual é o diagnóstico e o tratamento?","opts":["Sífilis primária; penicilina benzatina 2,4 milhões UI IM","Sífilis primária; azitromicina 1 g VO em dose única","Cancro mole; penicilina benzatina 2,4 milhões UI IM","Cancro mole; azitromicina 1 g VO em dose única"],"c":0,"exp":"Úlcera única, indolor, de base endurecida, bordas bem definidas e fundo limpo, com adenopatia regional indolor, é o cancro duro da sífilis primária. O tratamento é penicilina G benzatina 2,4 milhões UI intramuscular em dose única (1,2 milhão UI em cada glúteo). Azitromicina não é opção para sífilis, pelo risco de falha terapêutica e resistência; o cancro mole seria doloroso e de fundo purulento.","cap":"Úlcera única em grande lábio","ref":[1,4]},{"id":"3cceb5b019","q":"Como se apresenta a adenopatia regional que acompanha o cancro duro da sífilis primária?","opts":["Múltipla, móvel, indolor e sem supuração","Única, aderida, dolorosa e com supuração","Dolorosa, fistulizada por múltiplos orifícios","Ausente, substituída por pseudobubões"],"c":0,"exp":"Na sífilis primária, os linfonodos regionais aumentam, mas permanecem móveis, indolores e não supuram — em geral vários, do mesmo lado da lesão. Bubão único que supura sugere cancro mole; fistulização por múltiplos orifícios, LGV; pseudobubões sem adenite verdadeira, donovanose.","ref":[0,3]},{"id":"e079e16184","q":"Mulher com úlcera vulvar única, indolor e de fundo limpo, surgida há 5 dias, tem VDRL não reagente. Como interpretar esse resultado?","opts":["A sorologia pode não ter positivado; a pesquisa direta ajuda","O VDRL não reagente afasta sífilis e dispensa novos testes","O resultado indica cicatriz sorológica de infecção antiga","O VDRL negativo confirma cancro mole e indica azitromicina"],"c":0,"exp":"No início do cancro duro, a sorologia ainda pode ser não reagente — os testes não treponêmicos (VDRL, RPR) costumam positivar de uma a três semanas após o surgimento da úlcera. Nessa janela, a pesquisa direta do treponema em campo escuro, no exsudato seroso da lesão, faz o diagnóstico, e o teste treponêmico deve ser feito e repetido se necessário. Na abordagem sindrômica, úlcera sem vesículas já é tratada para sífilis e cancro mole sem aguardar a sorologia.","ref":[2,1]},{"id":"3826b91253","q":"Mulher de 30 anos com exantema indolor há três semanas, febre baixa, adinamia e linfonodomegalia generalizada. Há pápulas descamativas em palmas e plantas, como na figura, e relato de 'ferida' vulvar indolor há dois meses, que cicatrizou sozinha. Qual é o diagnóstico e a conduta?","opts":["Sífilis secundária; penicilina benzatina 2,4 milhões UI IM","Pitiríase rósea; anti-histamínico e espera da remissão","Eritema multiforme; suspensão de drogas e corticoide","Hanseníase dimorfa; poliquimioterapia única (PQT-U)"],"c":0,"exp":"Cancro indolor que cicatriza sozinho e, semanas a meses depois, exantema com acometimento palmoplantar, sintomas sistêmicos e linfadenopatia generalizada é a sífilis secundária. Por ser sífilis recente (menos de um ano), trata-se com penicilina G benzatina 2,4 milhões UI intramuscular em dose única (1,2 milhão UI em cada glúteo). A pitiríase rósea poupa palmas e plantas; o eritema multiforme tem lesões em alvo; a hanseníase cursa com alteração de sensibilidade.","cap":"Lesões palmares","ref":[1,8]},{"id":"1a993275e9","q":"Mulher com pápulas palmoplantares descamativas apresenta também, na vulva e no períneo, pápulas e placas planas, úmidas e esbranquiçadas, como na figura. Qual é a lesão genital e o seu tratamento?","opts":["Condiloma plano; penicilina benzatina intramuscular","Condiloma acuminado; ácido tricloroacético a 90%","Molusco contagioso; curetagem das lesões umbilicadas","Donovanose vegetante; azitromicina semanal"],"c":0,"exp":"O condiloma plano (condiloma lata) é manifestação da sífilis secundária: pápulas e placas planas e úmidas em áreas de dobra e atrito, muito ricas em treponemas e, portanto, muito contagiosas. Trata-se a sífilis, com penicilina benzatina, e não a lesão local. O ácido tricloroacético é tratamento do condiloma acuminado, causado pelo HPV, que tem aspecto verrucoso, em couve-flor.","cap":"Lesões papulosas em vulva e períneo","ref":[1,10]},{"id":"ec3a3d4664","q":"Qual teste deve ser usado para monitorar a resposta ao tratamento da sífilis?","opts":["Teste não treponêmico quantitativo, como o VDRL","Teste treponêmico, como o teste rápido ou FTA-Abs","Pesquisa direta do treponema em campo escuro","PCR para Treponema pallidum em amostra de sangue"],"c":0,"exp":"Os testes não treponêmicos (VDRL, RPR) são quantitativos: a titulação cai com o tratamento e sobe na reinfecção, por isso servem ao seguimento — trimestral fora da gestação, mensal na gestante. Resposta adequada é a queda de duas diluições (por exemplo, de 1:32 para 1:8) em até 6 meses na sífilis recente. Os treponêmicos permanecem reagentes por toda a vida na maioria das pessoas e não distinguem infecção ativa de tratada.","ref":[2,11]},{"id":"9af8ac33b4","q":"Mulher tratada adequadamente para sífilis recente há dois anos teve queda do VDRL de 1:64 para 1:2, título que se mantém estável nos controles, sem nova exposição de risco. O teste treponêmico segue reagente. Qual é a interpretação?","opts":["Cicatriz sorológica; não há indicação de novo tratamento","Reinfecção; repetir penicilina benzatina 2,4 milhões UI","Falha terapêutica; tratar como neurossífilis por 14 dias","Resultado falso-positivo; repetir só o teste treponêmico"],"c":0,"exp":"Após tratamento adequado, com queda documentada de pelo menos duas diluições, a persistência de títulos baixos e estáveis no teste não treponêmico, sem nova exposição, é a cicatriz sorológica — não exige retratamento. O teste treponêmico reagente é esperado, pois permanece positivo por toda a vida na maioria dos casos. Reinfecção ou falha se reconhecem pelo aumento de duas diluições ou mais (por exemplo, de 1:2 para 1:8).","ref":[2,11]},{"id":"f18571bd89","q":"Mulher assintomática, sem lesões, tem teste treponêmico reagente e VDRL 1:8 em exame de rotina. Não há tratamento prévio nem data provável da infecção. Qual é o esquema indicado?","opts":["Benzatina 2,4 milhões UI IM semanal por 3 semanas","Benzatina 2,4 milhões UI IM em dose única","Benzatina 1,2 milhão UI IM em dose única","Penicilina cristalina IV de 4/4 h por 14 dias"],"c":0,"exp":"Sem sinais clínicos e com sorologia reagente, trata-se de sífilis latente; quando não se sabe se a infecção tem menos de um ano, ela é tratada como latente tardia: penicilina G benzatina 2,4 milhões UI intramuscular uma vez por semana, por 3 semanas (7,2 milhões UI no total). A dose única de 2,4 milhões vale para a sífilis recente — primária, secundária e latente com menos de um ano. Penicilina cristalina intravenosa é reservada à neurossífilis.","ref":[2,7]},{"id":"e627c8e6ed","q":"Gestante com sífilis recente refere alergia à penicilina. Qual conduta garante tratamento adequado também para o feto?","opts":["Dessensibilização e uso de penicilina benzatina","Azitromicina 1 g VO em dose única, sem penicilina","Doxiciclina 100 mg VO de 12/12 h por 15 dias","Ceftriaxona IM por 10 dias, sem penicilina"],"c":0,"exp":"Na gestação, só a penicilina benzatina é considerada tratamento adequado para prevenir a sífilis congênita, porque atravessa a placenta e trata o feto. Diante de alergia, a gestante é dessensibilizada em ambiente hospitalar e recebe a penicilina. A doxiciclina, alternativa para não gestantes, é contraindicada na gravidez, e os demais esquemas não contam como tratamento adequado.","ref":[2,9]},{"id":"87029b186a","q":"Seis horas após receber penicilina benzatina para sífilis secundária, a paciente apresenta febre, calafrios, mialgia e piora transitória das lesões de pele. Qual é a interpretação e a conduta?","opts":["Reação de Jarisch-Herxheimer; sintomáticos, sem suspender","Anafilaxia à penicilina; adrenalina e troca do antibiótico","Falha terapêutica; repetir benzatina no dia seguinte","Neurossífilis; iniciar penicilina cristalina intravenosa"],"c":0,"exp":"A reação de Jarisch-Herxheimer surge nas primeiras 24 horas após a primeira dose, pela liberação maciça de antígenos dos treponemas destruídos: febre, calafrios, mialgia, cefaleia e exacerbação das lesões. É autolimitada, mais comum na sífilis secundária, e se trata com antitérmico e analgésico — não é alergia e não justifica suspender a penicilina nem trocar o esquema.","ref":[2,13]},{"id":"cd6f11c76a","q":"Mulher com lesão vulvar indolor de evolução lenta, há vários meses, ulcerovegetante, de fundo granuloso vermelho-vivo que sangra com facilidade e sem adenite verdadeira, como na figura. Qual é o diagnóstico e o exame que o confirma?","opts":["Donovanose; corpúsculos de Donovan em macrófagos","Cancro mole; cocobacilos em 'cardume de peixes'","Sífilis primária; espiroquetas em campo escuro","Linfogranuloma venéreo; PCR do aspirado do bubão"],"c":0,"exp":"Úlcera indolor, de crescimento lento, com fundo granulomatoso vermelho-vivo e sangramento fácil, evoluindo para lesão ulcerovegetante, é a donovanose (granuloma inguinal), por Klebsiella granulomatis. O diagnóstico é citológico ou histológico: corpúsculos de Donovan no interior de macrófagos, em material raspado ou biopsiado das áreas de granulação ativa, corado por Giemsa, Wright ou Leishman.","cap":"Lesões ulcerovegetantes de fundo vermelho-vivo","ref":[6,4]},{"id":"8e0bd1eb57","q":"Na donovanose, pode surgir aumento de volume na região inguinal. O que ele representa?","opts":["Pseudobubão: granulação subcutânea, sem adenite verdadeira","Bubão supurado, que fistuliza por múltiplos orifícios","Bubão supurado, que fistuliza por um orifício único","Adenopatia reacional móvel, indolor e não supurativa"],"c":0,"exp":"A donovanose não produz adenite verdadeira. O que aparece na virilha são granulações subcutâneas, geralmente unilaterais, por fenômenos obstrutivos linfáticos — os pseudobubões. Bubão com múltiplos orifícios é do LGV; com orifício único, do cancro mole; adenopatia móvel, indolor e não supurativa, da sífilis primária.","ref":[0,2]},{"id":"1a44b9f924","q":"Qual é o tratamento de primeira escolha da donovanose e o critério para encerrá-lo?","opts":["Azitromicina 1 g semanal, no mínimo 3 semanas e até cicatrizar","Azitromicina 1 g em dose única, sem controle de cicatrização","Penicilina benzatina 2,4 milhões UI semanal por 3 semanas","Aciclovir 400 mg de 8/8 h por 10 dias, até a formação de crosta"],"c":0,"exp":"A primeira escolha é azitromicina 1 g por via oral uma vez por semana, por no mínimo 3 semanas ou até a cicatrização completa das lesões; a alternativa é doxiciclina 100 mg de 12 em 12 horas por pelo menos 21 dias, também até cicatrizar. O critério de término é clínico — a lesão fechada —, e não um número fixo de doses.","ref":[6,6]},{"id":"3a0a7cce04","q":"Em unidade sem laboratório, mulher apresenta úlcera genital sem história nem evidência de vesículas. Pelo fluxograma de abordagem sindrômica do Ministério da Saúde, qual é a conduta?","opts":["Tratar sífilis e cancro mole ao mesmo tempo","Tratar apenas herpes genital com aciclovir","Aguardar a sorologia antes de qualquer tratamento","Tratar apenas sífilis com penicilina benzatina"],"c":0,"exp":"Na abordagem sindrômica, a pergunta que separa os caminhos é a presença de vesículas. Com vesículas, na história ou no exame, trata-se herpes. Sem vesículas, tratam-se sífilis e cancro mole simultaneamente — penicilina benzatina 2,4 milhões UI IM mais azitromicina 1 g VO —, porque são causas prevalentes e podem coexistir. Oferecem-se também testes rápidos de HIV, sífilis e hepatites B e C.","ref":[7,1]},{"id":"6f86b33b3e","q":"Mulher com úlcera vulvar há seis semanas, já tratada para sífilis e cancro mole, sem melhora. Qual é o próximo passo?","opts":["Biópsia da lesão e tratamento para donovanose","Repetir benzatina e azitromicina por mais 4 semanas","Aciclovir supressivo e reavaliar após 6 meses","Observação clínica, pois tende a regredir sozinha"],"c":0,"exp":"Úlcera com 4 semanas ou mais de evolução, ou que não responde ao tratamento sindrômico inicial, exige ampliar o diferencial: biópsia, que também afasta neoplasia, e tratamento para donovanose, doença crônica e indolor. O LGV também entra na lista. Repetir o mesmo esquema ou apenas observar atrasa o diagnóstico.","ref":[7,1]}],"resumo":[{"h":"Como pensar diante de uma úlcera genital","blocos":[{"html":"<p>Úlcera genital é a perda de continuidade da pele ou da mucosa da vulva, da vagina, do colo ou da região perianal. Entre as causas de transmissão sexual, cinco respondem por quase todos os casos e por quase todas as questões de prova: <strong>sífilis primária<\/strong> (<em>Treponema pallidum<\/em>), <strong>herpes genital<\/strong> (herpes-vírus simples), <strong>cancro mole<\/strong> (<em>Haemophilus ducreyi<\/em>), <strong>linfogranuloma venéreo<\/strong> (<em>Chlamydia trachomatis<\/em> L1–L3) e <strong>donovanose<\/strong> (<em>Klebsiella granulomatis<\/em>).<\/p>"},{"html":"<p>Clinicamente as lesões se parecem, e a coinfecção existe. O que separa uma da outra é um exame físico feito com método, olhando sempre os mesmos eixos:<\/p>"},{"html":"<ol><li><strong>Dor<\/strong> — dolorosa (herpes, cancro mole) ou indolor (sífilis, donovanose, lesão inicial do LGV).<\/li><li><strong>Número<\/strong> — única (sífilis, LGV) ou múltiplas (herpes, cancro mole; donovanose pode ter as duas).<\/li><li><strong>Fundo<\/strong> — limpo (sífilis), sujo e purulento (cancro mole), granuloso vermelho-vivo que sangra (donovanose).<\/li><li><strong>Borda e base<\/strong> — endurecida e bem delimitada (sífilis), irregular e friável (cancro mole), plana ou hipertrófica (donovanose).<\/li><li><strong>Linfonodo<\/strong> — é o eixo que mais discrimina: indolor e móvel (sífilis), bilateral e doloroso (herpes), bubão que fistuliza por <strong>orifício único<\/strong> (cancro mole), bubão que fistuliza por <strong>múltiplos orifícios<\/strong> (LGV), ausência de adenite verdadeira com <strong>pseudobubão<\/strong> (donovanose).<\/li><li><strong>Tempo<\/strong> — incubação curta (cancro mole, herpes), longa e variável (donovanose), evolução crônica de meses (donovanose).<\/li><\/ol>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Doença<\/th><th>Agente<\/th><th>Dor<\/th><th>Número<\/th><th>Aspecto da úlcera<\/th><th>Linfonodos<\/th><\/tr><\/thead><tbody><tr><td>Sífilis primária<\/td><td><em>Treponema pallidum<\/em><\/td><td>Indolor<\/td><td>Única<\/td><td>Cancro duro: fundo limpo, bordas endurecidas e elevadas<\/td><td>Indolores, móveis, não supuram<\/td><\/tr><tr><td>Herpes genital<\/td><td>HSV-2 &gt; HSV-1<\/td><td>Dolorosa<\/td><td>Múltiplas, confluentes<\/td><td>Vesículas que ulceram, rasas<\/td><td>Bilaterais, dolorosos (cerca de 50%)<\/td><\/tr><tr><td>Cancro mole<\/td><td><em>Haemophilus ducreyi<\/em><\/td><td>Dolorosa<\/td><td>Múltiplas (autoinoculação)<\/td><td>Fundo necrótico/purulento, friável, odor fétido<\/td><td>Bubão unilateral, supura e fistuliza por orifício único<\/td><\/tr><tr><td>Donovanose<\/td><td><em>Klebsiella granulomatis<\/em><\/td><td>Indolor<\/td><td>Única ou múltiplas<\/td><td>Ulcerovegetante, granulosa, vermelho-viva<\/td><td>Sem adenite verdadeira (pseudobubões)<\/td><\/tr><tr><td>Linfogranuloma venéreo<\/td><td><em>Chlamydia trachomatis<\/em> L1–L3<\/td><td>Indolor (lesão inicial)<\/td><td>Única, pequena, fugaz<\/td><td>Lesão primária imperceptível<\/td><td>Dolorosos, fistulizam por múltiplos orifícios<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Diagnóstico diferencial das úlceras genitais em mulheres<\/p>"},{"html":"<blockquote><p><strong>Regra de bolso:<\/strong> dói — herpes ou cancro mole; não dói — sífilis ou donovanose. Se o que chama atenção é a virilha e não a vulva, pense em linfogranuloma venéreo.<\/p><\/blockquote>"},{"html":"<p>Toda úlcera genital aumenta o risco de adquirir e transmitir o HIV. Por isso, qualquer que seja a hipótese, a paciente recebe oferta de <strong>testes rápidos de HIV, sífilis e hepatites B e C<\/strong>, orientação sobre preservativo e avaliação das parcerias sexuais. Causas não infecciosas — trauma, aftas, doença de Behçet, farmacodermia e <strong>neoplasia<\/strong> — entram no diferencial, sobretudo na úlcera crônica.<\/p>"}]},{"h":"Sífilis: do cancro duro à fase secundária","blocos":[{"html":"<h3>Sífilis primária — o cancro duro<\/h3>"},{"html":"<p>O <em>Treponema pallidum<\/em> é uma espiroqueta. Após incubação de 10 a 90 dias (média de três semanas), surge no ponto de inoculação — pequenos ou grandes lábios, vagina ou colo — o <strong>cancro duro<\/strong>:<\/p>"},{"html":"<ul><li><strong>úlcera única e indolor<\/strong>;<\/li><li><strong>fundo limpo<\/strong>, liso e brilhante, com exsudato seroso transparente, rico em treponemas;<\/li><li><strong>base e bordas endurecidas<\/strong>, bem delimitadas e discretamente elevadas (calosidade à palpação);<\/li><li><strong>adenopatia regional<\/strong> múltipla, móvel, indolor e <strong>não supurativa<\/strong>, em geral do mesmo lado.<\/li><\/ul>"},{"html":"<p>O cancro <strong>desaparece sozinho<\/strong> em poucas semanas, mesmo sem tratamento. Essa cura aparente é a armadilha: a doença não acabou, apenas mudou de fase. Na mulher, a lesão no colo ou na vagina frequentemente passa despercebida.<\/p>"},{"html":"<p class=\"figleg\">Cancro duro: úlcera única, de fundo limpo, em grande lábio<\/p>"},{"html":"<h3>Sífilis secundária — a doença sistêmica<\/h3>"},{"html":"<p>Entre seis semanas e seis meses depois, o treponema disseminado produz lesões cutaneomucosas <strong>ricas em treponemas e muito contagiosas<\/strong>:<\/p>"},{"html":"<ul><li>exantema macular no tronco (roséola sifilítica) e lesões papulosas descamativas, simétricas;<\/li><li><strong>pápulas palmoplantares descamativas<\/strong> — o achado clássico e o mais cobrado;<\/li><li><strong>condiloma plano<\/strong> (condiloma lata): pápulas e placas planas, úmidas e esbranquiçadas em vulva, períneo e áreas de atrito;<\/li><li>placas mucosas, alopecia em clareira, perda da cauda das sobrancelhas;<\/li><li>febre baixa, mal-estar, adinamia e <strong>linfadenopatia generalizada<\/strong>.<\/li><\/ul>"},{"html":"<p>As lesões também regridem espontaneamente. O diferencial do exantema inclui dengue (sem lesão palmoplantar descamativa nem úlcera prévia), pitiríase rósea (medalhão inicial, poupa palmas e plantas), eritema multiforme (lesões em alvo) e hanseníase (alteração de sensibilidade).<\/p>"},{"html":"<p class=\"figleg\">Sífilis secundária: lesões palmares<\/p>"},{"html":"<blockquote><p><strong>Pegadinha:<\/strong> condiloma <strong>plano<\/strong> é sífilis secundária e se trata com penicilina benzatina. Condiloma <strong>acuminado<\/strong> é HPV, tem aspecto verrucoso em couve-flor e é o que se cauteriza com ácido tricloroacético a 90%.<\/p><\/blockquote>"},{"html":"<h3>Latente e terciária<\/h3>"},{"html":"<p>Sem sinais clínicos e com sorologia reagente, a sífilis é <strong>latente<\/strong>: <strong>recente<\/strong> quando tem menos de um ano de evolução, <strong>tardia<\/strong> quando tem um ano ou mais. Quando não se sabe a duração, ela é tratada como tardia. A <strong>terciária<\/strong> aparece anos depois, com gomas, acometimento cardiovascular (aortite) e neurológico. Para o tratamento, o que importa é a divisão em <strong>recente<\/strong> (primária, secundária e latente recente) e <strong>tardia<\/strong>.<\/p>"}]},{"h":"Sífilis: diagnóstico laboratorial e tratamento","blocos":[{"html":"<h3>Pesquisa direta<\/h3>"},{"html":"<p>Na lesão primária ou no condiloma plano, a <strong>pesquisa direta em campo escuro<\/strong> procura espiroquetas viáveis no exsudato seroso. É o exame que confirma a sífilis antes de a sorologia positivar.<\/p>"},{"html":"<h3>Os dois tipos de teste sorológico<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th><\/th><th>Treponêmicos<\/th><th>Não treponêmicos<\/th><\/tr><\/thead><tbody><tr><td>Exemplos<\/td><td>Teste rápido, FTA-Abs, TPHA, ELISA/quimioluminescência<\/td><td>VDRL, RPR, TRUST<\/td><\/tr><tr><td>O que medem<\/td><td>Anticorpos contra o próprio treponema<\/td><td>Anticorpos contra cardiolipina<\/td><\/tr><tr><td>Resultado<\/td><td>Qualitativo (reagente ou não)<\/td><td><strong>Quantitativo<\/strong> (título: 1:2, 1:4, 1:8...)<\/td><\/tr><tr><td>Quando positivam<\/td><td>Primeiro<\/td><td>De uma a três semanas após o cancro<\/td><\/tr><tr><td>Depois do tratamento<\/td><td>Permanecem reagentes por toda a vida na maioria<\/td><td>Os títulos caem<\/td><\/tr><tr><td>Uso principal<\/td><td>Diagnóstico, triagem (teste rápido)<\/td><td>Diagnóstico e <strong>seguimento do tratamento<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>O diagnóstico combina um teste treponêmico e um não treponêmico, e o fluxo preferido começa pelo <strong>teste rápido treponêmico<\/strong>. Duas situações confundem:<\/p>"},{"html":"<ul><li><strong>Janela no cancro recente:<\/strong> úlcera típica com sorologia ainda não reagente não afasta sífilis — repete-se a sorologia, faz-se a pesquisa direta e, na abordagem sindrômica, trata-se sem esperar.<\/li><li><strong>Treponêmico reagente isolado:<\/strong> como ele fica positivo para sempre, sozinho não distingue infecção ativa de infecção tratada; é o não treponêmico, com a história de tratamento, que decide.<\/li><\/ul>"},{"html":"<h3>Tratamento<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Situação<\/th><th>Esquema<\/th><\/tr><\/thead><tbody><tr><td>Sífilis recente (primária, secundária, latente &lt; 1 ano)<\/td><td>Penicilina G benzatina <strong>2,4 milhões UI IM, dose única<\/strong> (1,2 milhão UI em cada glúteo)<\/td><\/tr><tr><td>Sífilis latente tardia, de duração ignorada ou terciária<\/td><td>Penicilina G benzatina 2,4 milhões UI IM <strong>semanal por 3 semanas<\/strong> (7,2 milhões UI no total)<\/td><\/tr><tr><td>Neurossífilis<\/td><td>Penicilina cristalina 18 a 24 milhões UI/dia IV (3 a 4 milhões UI de 4/4 h) por 14 dias<\/td><\/tr><tr><td>Alternativa fora da gestação<\/td><td>Doxiciclina 100 mg VO de 12/12 h por 15 dias (recente) ou 30 dias (tardia)<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A <strong>azitromicina não trata sífilis<\/strong>: há falha terapêutica e resistência do treponema.<\/p>"},{"html":"<blockquote><p><strong>Gestante:<\/strong> só a penicilina benzatina é tratamento adequado para prevenir a sífilis congênita. Um teste rápido reagente já autoriza a primeira dose, sem esperar o confirmatório. Se houver alergia, a gestante é <strong>dessensibilizada<\/strong> e recebe penicilina — doxiciclina é contraindicada na gravidez.<\/p><\/blockquote>"},{"html":"<h4>Seguimento<\/h4>"},{"html":"<p>O teste não treponêmico é repetido a cada três meses (na gestante, mensalmente). Resposta adequada é a <strong>queda de duas diluições<\/strong> — por exemplo, de 1:32 para 1:8 — em até seis meses na sífilis recente. <strong>Aumento de duas diluições<\/strong> (de 1:2 para 1:8, por exemplo) indica reinfecção ou falha e pede retratamento. Já a persistência de <strong>títulos baixos e estáveis<\/strong> após tratamento adequado
