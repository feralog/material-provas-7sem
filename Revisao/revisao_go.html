testinal, geralmente íleo ou cólon. Indicada na bexiga de baixa capacidade e complacência refratária. Complica com infecções urinárias recorrentes, formação de cálculos, distúrbios metabólicos e necessidade de cateterismo intermitente.<\/li><li><strong>Derivações urinárias<\/strong> — desviam o fluxo urinário para reservatório alternativo ou diretamente para o exterior; podem ser continentes, com mecanismo de continência, ou incontinentes, com bolsa coletora contínua. Reservadas a casos extremos.<\/li><\/ul>"}]},{"h":"Síntese para a prova","blocos":[{"html":"<p>O raciocínio se fecha em quatro movimentos.<\/p>"},{"html":"<ol><li><strong>Caracterize a perda antes de nomeá-la.<\/strong> Perda com esforço e sem desejo prévio é IUE; perda precedida de urgência incontrolável é IUU; as duas juntas configuram a forma mista, mais comum em idosas, na qual se trata o componente predominante. Gotejamento contínuo com resíduo elevado é transbordamento e não se trata com antimuscarínico.<\/li><li><strong>Exclua o que imita incontinência.<\/strong> Urina tipo I e urocultura afastam infecção; o resíduo pós-miccional, por ultrassonografia, afasta retenção. Em paciente com distopia acentuada, reduza o prolapso para pesquisar incontinência oculta antes de operar.<\/li><li><strong>Reserve a urodinâmica.<\/strong> Ela entra na perda aos esforços associada, no planejamento cirúrgico, na bexiga hiperativa neurogênica e na refratariedade — não na avaliação inicial de quem vai fazer tratamento clínico.<\/li><li><strong>Trate em degraus.<\/strong> Conservador primeiro, sempre: exercícios perineais, biofeedback, eletroestimulação e cones na IUE; mudanças comportamentais e treinamento vesical na bexiga hiperativa. Depois a farmacologia — duloxetina e estrogênios na IUE; antimuscarínicos ou mirabegrona na bexiga hiperativa. A cirurgia da IUE tem no <strong>sling de uretra média<\/strong> a técnica de melhor evidência; na bexiga hiperativa, a cirurgia é última linha e o degrau anterior é a toxina botulínica ou a neuromodulação.<\/li><\/ol>"},{"html":"<p>O objetivo final não é o número de episódios, mas a <strong>qualidade de vida<\/strong>: a incontinência urinária, de esforço ou por bexiga hiperativa, é condição tratável, e o principal obstáculo continua sendo o silêncio da paciente que a considera parte inevitável do envelhecimento.<\/p>"}]}]},{"slug":"infertilidade","titulo":"Infertilidade Conjugal","disciplina":"GO","eyebrow":"Ginecologia · Reprodução Humana","questoes":[{"id":"b0d9d9d08b","q":"Segundo a OMS e a FEBRASGO, infertilidade conjugal é a ausência de gestação após quanto tempo de tentativa?","opts":["Doze meses de relações regulares sem método contraceptivo","Seis meses de relações regulares sem método contraceptivo","Dezoito meses de relações regulares sem método contraceptivo","Vinte e quatro meses de relações regulares sem contracepção"],"c":0,"exp":"A definição da OMS/FEBRASGO exige ausência de gestação após 12 meses de relação sexual regular, bem distribuída ao longo do ciclo e sem uso de método contraceptivo. O prazo de 6 meses é exceção, reservada a mulheres com 35 anos ou mais e a casais com fator de risco identificado. Prazos de 18 ou 24 meses não são usados na definição.","ref":[0,0]},{"id":"4879bc4d68","q":"Mulher de 37 anos, ciclos regulares, sem antecedentes, tenta engravidar há 7 meses sem contracepção. Qual a conduta?","opts":["Iniciar já a investigação do casal, pois a idade é maior ou igual a 35 anos","Aguardar completar 12 meses de tentativa antes de iniciar a investigação","Aguardar completar 24 meses de tentativa antes de iniciar a investigação","Investigar somente o parceiro, já que a paciente tem ciclos regulares"],"c":0,"exp":"A regra dos 12 meses é antecipada para 6 meses quando a mulher tem 35 anos ou mais, ou quando há fator de risco identificado — justamente porque a queda de quantidade e qualidade oocitária acelera após os 35 anos. Com 37 anos e 7 meses de tentativa, a investigação já está indicada. Ela deve ser do casal, nunca de um parceiro isolado.","ref":[0,0]},{"id":"c26a5c2b16","q":"Casal que teve um aborto espontâneo há três anos e não engravidou novamente desde então deve ser classificado como:","opts":["Infertilidade secundária, pois já houve uma gestação prévia do casal","Infertilidade primária, pois não houve nascido vivo prévio do casal","Infertilidade primária, pois o aborto não configura gestação obtida","Infertilidade secundária, pois a duração ultrapassa os doze meses"],"c":0,"exp":"A infertilidade é secundária quando o casal já obteve pelo menos uma gestação prévia — e gestações anteriores contam mesmo que não tenham resultado em filho vivo, como no aborto espontâneo. A infertilidade primária é a do casal que nunca conseguiu gestação. A duração da tentativa define o diagnóstico, não a classificação em primária ou secundária.","ref":[0,3]},{"id":"bd2fd8e7dd","q":"Qual a prevalência da infertilidade conjugal e a participação do fator masculino isolado?","opts":["15 a 20% dos casais; fator masculino isolado em cerca de 30% dos casos","15 a 20% dos casais; fator masculino isolado em cerca de 10% dos casos","5 a 8% dos casais; fator masculino isolado em cerca de 30% dos casos","35 a 40% dos casais; fator masculino isolado em cerca de 50% dos casos"],"c":0,"exp":"A infertilidade conjugal atinge 15 a 20% da população em idade reprodutiva. A distribuição das causas é: fatores mistos 35%, fator masculino isolado 30%, fator feminino isolado 30% e idiopático 10%. Como fatores masculinos e femininos coexistem em boa parte dos casos, o casal é sempre avaliado como unidade funcional.","ref":[0,6]},{"id":"22159495bc","q":"Sobre a espermatogênese e a maturação espermática, qual afirmativa está correta?","opts":["Dura cerca de 74 dias, com maturação epididimária de 12 a 21 dias","Dura cerca de 28 dias, com maturação epididimária de 12 a 21 dias","Dura cerca de 74 dias, com maturação epididimária de 60 a 90 dias","Dura cerca de 120 dias, com maturação epididimária de 2 a 5 dias"],"c":0,"exp":"A espermatogênese ocorre nos túbulos seminíferos, é regulada por FSH e testosterona e dura aproximadamente 74 dias; a maturação no epidídimo leva mais 12 a 21 dias. Por isso qualquer agressão (febre, medicação, tóxico) dos últimos 3 meses repercute no espermograma atual — e por isso a anamnese cobre esse intervalo.","ref":[2,3]},{"id":"f6fc943f72","q":"Qual é a causa tratável mais frequente de infertilidade masculina?","opts":["Varicocele do plexo pampiniforme","Criptorquidia bilateral corrigida","Orquite pós-caxumba na infância","Uretrite por Chlamydia trachomatis"],"c":0,"exp":"A varicocele — dilatação varicosa das veias do plexo pampiniforme — é a causa tratável mais frequente de infertilidade masculina. A cadeia fisiopatológica é hipertensão venosa com refluxo renal/adrenal, hipoperfusão e hipóxia tecidual, estresse oxidativo com disfunção epitelial e, ao final, queda da qualidade espermática. A pesquisa é feita em repouso e com manobra de Valsalva.","ref":[2,9]},{"id":"74e6263a80","q":"A imagem mostra ingurgitamento escrotal evidente já em repouso, sem necessidade de manobras. O achado corresponde a:","opts":["Varicocele grau III, com plexo pampiniforme visível em repouso","Varicocele grau II, com plexo pampiniforme palpável em repouso","Varicocele grau I, com plexo pampiniforme palpável à Valsalva","Hidrocele volumosa, com coleção líquida na túnica vaginal"],"c":0,"exp":"A classificação da varicocele pelo exame físico tem três graus: grau I, palpável apenas durante a manobra de Valsalva; grau II, palpável em repouso; grau III, visível em repouso, com ingurgitamento escrotal evidente, como na foto. A hidrocele daria aumento liso e translúcido, sem o aspecto de novelo de veias.","cap":"Ingurgitamento escrotal visível em repouso","ref":[2,11]},{"id":"cba60867c0","q":"Qual o período de abstinência sexual recomendado antes da coleta do espermograma?","opts":["2 a 5 dias","1 a 2 dias","7 a 10 dias","12 a 15 dias"],"c":0,"exp":"O período ideal de abstinência é de 2 a 5 dias. Abstinência curta reduz volume e concentração; abstinência longa aumenta o número de formas imóveis e mortas. A coleta é por masturbação em frasco estéril, de preferência no próprio laboratório, com transporte em temperatura corporal e em menos de 1 hora.","ref":[3,2]},{"id":"4945597bfb","q":"Homem assintomático traz um espermograma isolado com oligozoospermia leve. Qual a conduta inicial correta?","opts":["Repetir o exame e trabalhar com a média de duas amostras seminais","Indicar ICSI de imediato pela alteração seminal já documentada","Solicitar cariótipo e microdeleção do cromossomo Y neste momento","Iniciar reposição de testosterona para elevar a contagem espermática"],"c":0,"exp":"O espermograma tem ampla variação biológica: abstinência, local e modo de coleta, transporte, estado emocional e doenças dos últimos 3 meses alteram o resultado. Por isso se trabalha com a média de dois exames antes de rotular o paciente. Reposição de testosterona é armadilha clássica: suprime o eixo e piora a espermatogênese.","ref":[3,3]},{"id":"c1ed58994c","q":"Quais são os valores de referência do espermograma pela OMS 2021?","opts":["Volume 1,4 mL; concentração 16 milhões/mL; progressivos 30%; Kruger 4%","Volume 1,5 mL; concentração 15 milhões/mL; progressivos 32%; Kruger 14%","Volume 2,0 mL; concentração 20 milhões/mL; progressivos 50%; Kruger 30%","Volume 1,4 mL; concentração 39 milhões/mL; progressivos 42%; Kruger 4%"],"c":0,"exp":"Pela OMS 2021 os limites inferiores são: volume maior ou igual a 1,4 mL (abaixo, hipospermia), concentração maior ou igual a 16 x 10⁶/mL (abaixo, oligozoospermia), motilidade progressiva maior ou igual a 30% (abaixo, astenozoospermia) e morfologia de Kruger maior ou igual a 4% (abaixo, teratozoospermia). Concentração abaixo de 5 x 10⁶/mL é oligozoospermia grave e zero é azoospermia.","ref":[3,5]},{"id":"a47165e5cc","q":"Espermograma: volume 2,0 mL, concentração 25 milhões/mL, motilidade progressiva 21% e morfologia de Kruger 2%. A classificação é:","opts":["Astenozoospermia associada a teratozoospermia, sem oligozoospermia","Oligozoospermia associada a teratozoospermia, sem astenozoospermia","Astenozoospermia associada a hipospermia, sem teratozoospermia","Oligozoospermia associada a hipospermia, sem astenozoospermia"],"c":0,"exp":"O volume de 2,0 mL está acima de 1,4 mL e a concentração de 25 milhões/mL está acima de 16 milhões/mL — não há hipospermia nem oligozoospermia. A motilidade progressiva de 21% está abaixo dos 30% exigidos (astenozoospermia) e a morfologia de 2% está abaixo dos 4% de Kruger (teratozoospermia). Se a concentração também caísse, o quadro seria OAT.","ref":[3,5]},{"id":"e698226f20","q":"Homem infértil com azoospermia, testículos de volume reduzido e FSH elevado. O diagnóstico mais provável é:","opts":["Falência testicular primária, por lesão do epitélio germinativo","Hipogonadismo hipogonadotrófico, por falha hipotálamo-hipofisária","Azoospermia obstrutiva, por bloqueio da via excretora distal","Hiperprolactinemia tumoral, por queda da pulsatilidade do GnRH"],"c":0,"exp":"FSH elevado com volume testicular reduzido indica falência testicular primária: o epitélio germinativo não responde, e a hipófise, sem retroalimentação inibitória, eleva o FSH. No hipogonadismo hipogonadotrófico ocorre o oposto — FSH e LH baixos com testosterona baixa. Na azoospermia obstrutiva o FSH e o volume testicular costumam estar normais.","ref":[3,10]},{"id":"a9b56b7c8e","q":"FSH e LH baixos acompanhados de testosterona baixa em homem infértil caracterizam:","opts":["Hipogonadismo hipogonadotrófico, de origem central","Falência testicular primária, de origem gonadal","Azoospermia obstrutiva, de origem pós-testicular","Síndrome de Klinefelter, de origem cromossômica"],"c":0,"exp":"A avaliação hormonal masculina (FSH, LH, testosterona e prolactina) tem duas leituras clássicas: FSH alto com volume testicular reduzido aponta falência testicular primária; FSH e LH baixos com testosterona baixa apontam hipogonadismo hipogonadotrófico, de origem hipotálamo-hipofisária. Esta última é potencialmente tratável com reposição de gonadotrofinas.","ref":[3,10]},{"id":"0da5d79402","q":"Em qual situação está indicada a avaliação genética com cariótipo e pesquisa de microdeleção do cromossomo Y?","opts":["Oligozoospermia grave, abaixo de 5 milhões/mL, ou azoospermia","Astenozoospermia isolada, abaixo de 30% de espermatozoides móveis","Teratozoospermia isolada, abaixo de 4% pelo critério de Kruger","Hipospermia isolada, abaixo de 1,4 mL, com libido preservada"],"c":0,"exp":"A avaliação genética é indicada na oligozoospermia grave (menos de 5 x 10⁶/mL) e na azoospermia. Investigam-se microdeleções das regiões AZFa, AZFb e AZFc — que definem prognóstico de recuperação espermática — e o cariótipo, sendo a síndrome de Klinefelter (47,XXY) a causa cromossômica mais frequente. Hipospermia isolada aponta antes para investigação de obstrução distal por imagem.","ref":[3,14]},{"id":"3c8d4c129d","q":"Como se distribuem as causas femininas de infertilidade conjugal?","opts":["Ovulatório 35%, tubário 35%, endometriose 20% e idiopático 10%","Ovulatório 20%, tubário 35%, endometriose 35% e idiopático 10%","Ovulatório 50%, tubário 20%, endometriose 20% e idiopático 10%","Ovulatório 35%, tubário 10%, endometriose 45% e idiopático 10%"],"c":0,"exp":"Entre as causas femininas, fator ovulatório e fator tubário respondem por 35% cada, endometriose por 20% e idiopático por 10%. Esses fatores se sobrepõem com frequência na prática, o que exige investigação sistemática e sequencial, e não a busca de uma causa única.","ref":[4,0]},{"id":"b21f3b42c4","q":"Progesterona de 12 ng/mL colhida no 21º dia de um ciclo de 28 dias deve ser interpretada como:","opts":["Ciclo ovulatório confirmado, pois o corte é de 10 ng/mL","Ciclo anovulatório definido, pois o corte é de 15 ng/mL","Insuficiência lútea provável, pois o corte é de 20 ng/mL","Resultado inconclusivo a repetir, pois o corte é de 25 ng/mL"],"c":0,"exp":"A progesterona de fase lútea é colhida no 21º dia de um ciclo de 28 dias, ou seja, cerca de 7 dias após a ovulação presumida. Valor acima de 10 ng/mL confirma ciclo ovulatório; abaixo de 3 ng/mL indica ciclo anovulatório; entre 3 e 10 ng/mL a ovulação é incerta ou há insuficiência lútea.","ref":[4,6]},{"id":"270eecedda","q":"Progesterona de 6 ng/mL no 21º dia de um ciclo de 28 dias corresponde a qual interpretação?","opts":["Ovulação incerta ou insuficiência lútea, faixa entre 3 e 10 ng/mL","Ciclo francamente anovulatório, faixa situada abaixo de 3 ng/mL","Ciclo ovulatório plenamente normal, faixa acima de 10 ng/mL","Ausência de valor diagnóstico, exigindo dosagem seriada de LH"],"c":0,"exp":"A faixa intermediária de 3 a 10 ng/mL é a pegadinha clássica: não confirma nem exclui ovulação, e sugere ovulação incerta ou insuficiência lútea. A conduta é complementar com ultrassonografia seriada, que mostra crescimento folicular, colapso do folículo e líquido livre no fundo de saco de Douglas após a ovulação.","ref":[4,8]},{"id":"bb11f8371a","q":"Ultrassonografia seriada no 13º dia do ciclo, como a da imagem. Qual o diâmetro esperado do folículo dominante no período pré-ovulatório?","opts":["18 a 24 mm","10 a 14 mm","26 a 32 mm","34 a 40 mm"],"c":0,"exp":"Na monitorização ultrassonográfica, o folículo dominante atinge 18 a 24 mm no período pré-ovulatório. A confirmação de que a ovulação ocorreu vem do colapso folicular com líquido livre no fundo de saco de Douglas. O mesmo exame avalia espessura e padrão endometrial.","cap":"Folículo dominante ao ultrassom transvaginal","ref":[4,8]},{"id":"e1c7f1ef44","q":"Ovário com múltiplos folículos pequenos dispostos perifericamente, como na imagem, em paciente com oligomenorreia e hirsutismo. Como se fecha o diagnóstico de SOP?","opts":["Critérios de Rotterdam, com pelo menos dois dos três achados presentes","Critérios de Rotterdam, com os três achados obrigatoriamente presentes","Critérios de Rotterdam, com apenas um dos três achados já suficiente","Critérios de Rotterdam, com dois dos quatro achados, incluindo obesidade"],"c":0,"exp":"A SOP é diagnóstico de exclusão pelos critérios de Rotterdam: bastam 2 de 3 entre irregularidade menstrual (oligo/amenorreia, menos de 8 ciclos por ano ou ciclos acima de 35 dias), hiperandrogenismo clínico ou laboratorial e morfologia policística ao ultrassom (12 ou mais folículos de 2 a 9 mm, ou volume ovariano acima de 10 cm³, em pelo menos um ovário). Atinge 6 a 10% das mulheres em idade reprodutiva.","cap":"Ovário com múltiplos folículos periféricos","ref":[4,11]},{"id":"2059722735","q":"A imagem mostra o exame de escolha para avaliar permeabilidade e função tubária. Qual é o exame e quando deve ser realizado?","opts":["Histerossalpingografia, entre o 7º e o 10º dia do ciclo menstrual","Histerossonografia, entre o 20º e o 24º dia do ciclo menstrual","Videolaparoscopia, entre o 14º e o 16º dia do ciclo menstrual","Histeroscopia, entre o 24º e o 28º dia do ciclo menstrual"],"c":0,"exp":"A radiografia mostra contraste preenchendo a cavidade uterina e as tubas — é uma histerossalpingografia, exame de escolha para avaliar permeabilidade e função tubária. É feita preferencialmente na primeira fase do ciclo, entre o 7º e o 10º dia, quando não há sangramento nem risco de irradiar gestação inicial.","cap":"Contraste preenchendo cavidade e tubas","ref":[5,3]},{"id":"7a9ecaa72f","q":"Paciente com doença inflamatória pélvica prévia apresenta ao ultrassom a coleção anecóica tubária alongada da imagem. O achado e sua repercussão são:","opts":["Hidrossalpinge, sequela de DIP que piora os resultados da FIV","Endometrioma, sequela de endometriose que reduz a reserva ovariana","Cisto folicular, achado funcional sem qualquer impacto reprodutivo","Mioma subseroso, achado que distorce a anatomia tubária adjacente"],"c":0,"exp":"A coleção anecóica de trajeto tubário corresponde a hidrossalpinge, sequela clássica de salpingite por Chlamydia trachomatis e Neisseria gonorrhoeae ou de DIP recorrente. Além de impedir a fecundação in vivo, o líquido tubário é embriotóxico e reduz as taxas de sucesso da FIV, o que costuma indicar abordagem da tuba antes do ciclo.","cap":"Coleção anecóica de trajeto tubário","ref":[5,5]},{"id":"2831a13804","q":"Quais são as indicações clássicas de fertilização in vitro (FIV)?","opts":["Fator tubário, falha de IIU, endometriose grave e reserva diminuída","Fator cervical, muco hostil, ciclos irregulares e idade abaixo de 30","Fator ovulatório isolado, SOP recém-diagnosticada e ISCA muito leve","Hipospermia isolada, varicocele grau I e libido do casal preservada"],"c":0,"exp":"A FIV é técnica de alta complexidade — punção oocitária, fertilização extracorpórea e transferência embrionária — indicada em fator tubário, falha de inseminação intrauterina, endometriose grave e reserva ovariana diminuída. Fator cervical e fator ovulatório isolado começam por baixa complexidade: coito programado ou inseminação intrauterina.","ref":[7,6]},{"id":"96e487e4e3","q":"Casal em que o homem tem oligo-asteno-teratozoospermia grave confirmada em dois exames. Qual a técnica de escolha?","opts":["ICSI, com microinjeção de um espermatozoide dentro do oócito","FIV convencional, com fertilização espontânea do oócito em placa","IIU, com sêmen processado depositado na cavidade uterina","Coito programado, com monitorização ultrassonográfica do ciclo"],"c":0,"exp":"A injeção intracitoplasmática de espermatozoide (ICSI) tem como indicação principal o fator masculino grave, exatamente o quadro de oligo-asteno-teratozoospermia. Também é indicada após falha de fertilização em FIV convencional. Baixa complexidade (coito programado, IIU) não resolve fator masculino grave: a IIU serve ao fator masculino leve a moderado.","ref":[7,6]},{"id":"76e2a2ef50","q":"Qual a proporção de mulheres inférteis que apresentam endometriose?","opts":["25 a 50%","5 a 15%","60 a 75%","80 a 95%"],"c":0,"exp":"A endometriose acomete 5 a 15% das mulheres em idade reprodutiva, está presente em 25 a 50% das mulheres inférteis e torna inférteis 30 a 50% de suas portadoras. Os mecanismos propostos incluem distorção anatômica com obstrução tubária, ambiente peritoneal hostil aos gametas, endometriomas que comprometem a reserva, receptividade endometrial alterada e falha do fimbriotransporte.","ref":[5,7]},{"id":"c1a66f399b","q":"Quais alterações compõem o fator uterino de infertilidade?","opts":["Mioma submucoso, pólipo endometrial e sinéquias uterinas","Estenose cervical, muco hostil e cervicite crônica de repetição","Hidrossalpinge, aderências pélvicas e endometrioma ovariano","Anovulação crônica, hiperprolactinemia e disgenesia gonadal"],"c":0,"exp":"O fator uterino reúne miomatose submucosa (ou intramural igual ou maior que 4 cm), pólipo endometrial, malformações müllerianas como septo e útero bicorno, e síndrome de Asherman (sinéquias). Estenose e muco hostil são fator cervical; hidrossalpinge e aderências são fator tubário/peritoneal; anovulação e hiperprolactinemia são fator ovulatório.","ref":[5,9]},{"id":"e39a604ffc","q":"Qual é o melhor marcador disponível de reserva ovariana e seu ponto de corte para reserva diminuída?","opts":["AMH, com valor abaixo de 1,0 ng/mL indicando reserva diminuída","Estradiol basal, com valor acima de 80 pg/mL indicando reserva baixa","LH basal, com valor acima de 10 UI/L indicando reserva diminuída","Progesterona lútea, abaixo de 3 ng/mL indicando reserva diminuída"],"c":0,"exp":"O hormônio antimülleriano é o melhor marcador disponível: é sintetizado pelas células da granulosa dos folículos pré-antrais e independe do dia do ciclo menstrual; valores abaixo de 1,0 ng/mL indicam reserva diminuída. FSH basal acima de 10 a 12 UI/L e contagem de folículos antrais abaixo de 7 também apontam baixa reserva.","ref":[6,2]},{"id":"b9612a770d","q":"Qual é o preditor isolado mais importante do prognóstico reprodutivo feminino?","opts":["A idade da mulher, com queda acelerada a partir dos 35 anos","O hormônio antimülleriano, que independe do ciclo menstrual","A contagem de folículos antrais, feita entre o 2º e o 5º dia","O FSH basal, dosado entre o 3º e o 5º dia do ciclo menstrual"],"c":0,"exp":"Pegadinha frequente: o AMH é o melhor marcador laboratorial de reserva ovariana, mas o preditor isolado mais importante do prognóstico continua sendo a idade. A partir dos 35 anos há queda acelerada tanto na quantidade quanto na qualidade oocitária, com aumento significativo do risco de aneuploidia — o que nenhum marcador bioquímico corrige.","ref":[6,3]},{"id":"54e7f4da97","q":"Na investigação feminina, em que situação a histerossalpingografia pode ser dispensada?","opts":["Quando já existe indicação imediata de FIV ou ICSI por outra causa","Quando a paciente apresenta ciclos menstruais regulares e ovulatórios","Quando a ultrassonografia transvaginal basal não mostra alterações","Quando a paciente já obteve gestação no relacionamento atual"],"c":0,"exp":"O roteiro prático indica HSG em todas as pacientes, exceto quando já existe indicação imediata de FIV/ICSI por outra causa — nesse cenário o resultado não mudaria a conduta. Ciclos regulares, ultrassom normal ou gestação prévia não excluem obstrução tubária, que costuma ser assintomática após DIP ou infecção por clamídia.","ref":[1,5]},{"id":"f93cc2dbc8","q":"Qual é a primeira etapa do planejamento terapêutico do casal infértil, antes de qualquer técnica de reprodução assistida?","opts":["Retirar ou reverter as causas identificadas durante a investigação","Indicar inseminação intrauterina com estimulação ovariana controlada","Encaminhar diretamente para fertilização in vitro com ICSI do casal","Iniciar indução da ovulação com coito programado por seis ciclos"],"c":0,"exp":"A etapa 1 é sempre retirar ou reverter as causas identificadas: tratar IST, corrigir hipogonadismo, operar varicocele, corrigir cirurgicamente o fator tubário, promover perda de peso e suspender drogas e anabolizantes. Só depois se escolhe entre baixa complexidade (coito programado, IIU) e alta complexidade (FIV, ICSI).","ref":[7,1]},{"id":"c505e19020","q":"Quais são as indicações da inseminação intrauterina (IIU)?","opts":["Fator cervical, fator masculino leve a moderado e infertilidade idiopática","Fator tubário bilateral, endometriose grave e infertilidade idiopática","Fator masculino grave, falha de FIV prévia e infertilidade idiopática","Reserva ovariana muito baixa, idade acima de 42 anos e endometrioma"],"c":0,"exp":"A IIU é técnica de baixa complexidade: o sêmen processado é depositado na cavidade uterina por cateter, em geral associada à estimulação ovariana controlada. Suas indicações são fator cervical, fator masculino leve a moderado e infertilidade sem causa aparente. Fator tubário bilateral e fator masculino grave exigem alta complexidade — FIV e ICSI, respectivamente.","ref":[7,4]}],"resumo":[{"h":"Definição, Classificação e Epidemiologia","blocos":[{"html":"<p>Infertilidade conjugal é a <strong>ausência de gestação após 12 meses<\/strong> de relação sexual regular, bem distribuída ao longo do ciclo, sem uso de método contraceptivo — definição da OMS e da FEBRASGO. O prazo não é rígido: em mulheres com <strong>idade igual ou superior a 35 anos<\/strong>, ou diante de fator de risco já identificado (IST prévia, cirurgia pélvica, quimioterapia, ciclos irregulares), a investigação começa <strong>após 6 meses<\/strong>.<\/p>"},{"html":"<p>O princípio que organiza toda a investigação é que o <strong>casal é uma unidade funcional<\/strong>. Ambos os parceiros são investigados desde o início, porque fatores masculinos e femininos coexistem com frequência, e o tratamento é definido pelo perfil do casal como um todo — não pelo indivíduo isolado.<\/p>"},{"html":"<h3>Classificação<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Tipo<\/th><th>Definição<\/th><th>Observação<\/th><\/tr><\/thead><tbody><tr><td>Infertilidade <strong>primária<\/strong><\/td><td>O casal nunca conseguiu uma gestação<\/td><td>Inclui todos os casos sem filho prévio no relacionamento atual<\/td><\/tr><tr><td>Infertilidade <strong>secundária<\/strong><\/td><td>O casal já obteve pelo menos uma gestação prévia<\/td><td>Gestações que não resultaram em filho vivo (aborto, ectópica) <strong>contam<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<h3>Prevalência e distribuição das causas<\/h3>"},{"html":"<p>A infertilidade atinge <strong>15 a 20%<\/strong> da população em idade reprodutiva.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Origem<\/th><th>Participação<\/th><\/tr><\/thead><tbody><tr><td>Fatores mistos (masculino + feminino)<\/td><td>35%<\/td><\/tr><tr><td>Fator masculino isolado<\/td><td>30%<\/td><\/tr><tr><td>Fator feminino isolado<\/td><td>30%<\/td><\/tr><tr><td>Idiopático<\/td><td>10%<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p><strong>Ponto-chave.<\/strong> Fator masculino isolado responde por 30% dos casos e fatores mistos por mais 35% — ou seja, o homem participa de cerca de dois terços das causas. Investigar apenas a mulher é erro de conduta e pegadinha recorrente de prova.<\/p><\/blockquote>"}]},{"h":"Investigação do Casal — Roteiro Inicial","blocos":[{"html":"<p>A avaliação segue três etapas para os dois parceiros: <strong>anamnese<\/strong>, <strong>exame físico dirigido<\/strong> aos sistemas reprodutores e <strong>exames subsidiários<\/strong> (laboratoriais, de imagem e funcionais) conforme a indicação.<\/p>"},{"html":"<h4>Anamnese — eixos obrigatórios<\/h4>"},{"html":"<ul><li><strong>Identificação:<\/strong> idade de ambos, ocupação e exposições ocupacionais, duração da infertilidade, filhos pregressos (individuais e do casal).<\/li><li><strong>Hábitos e vícios:<\/strong> tabagismo (cigarro e narguilé), etilismo, sedentarismo e IMC, drogas ilícitas e <strong>anabolizantes<\/strong>.<\/li><li><strong>Antecedentes pessoais:<\/strong> doenças crônicas (diabetes, tireoidopatias, SOP), ISTs prévias e tratamentos, cirurgias abdominais ou pélvicas, medicações em uso.<\/li><li><strong>Saúde sexual:<\/strong> frequência das relações, disfunção erétil, dispareunia, uso de lubrificantes, IST ativa.<\/li><\/ul>"},{"html":"<h4>Pistas que direcionam a investigação feminina<\/h4>"},{"html":"<ul><li>Ciclos irregulares → causas ovulatórias: FSH, LH, TSH, prolactina, testosterona.<\/li><li>Dismenorreia e dispareunia → endometriose: ultrassom com preparo, ressonância de pelve.<\/li><li>ISTs prévias ou DIP → fator tubário: histerossalpingografia.<\/li><li>Cirurgias uterinas ou curetagens → fator uterino: histerossalpingografia e histeroscopia.<\/li><\/ul>"},{"html":"<blockquote><p><strong>Pegadinha.<\/strong> A HSG está indicada em <strong>todas<\/strong> as pacientes, com uma única exceção: quando já existe <strong>indicação imediata de FIV/ICSI por outra causa<\/strong> — aí o resultado não mudaria a conduta. A laparoscopia fica reservada a casos selecionados, não é rastreio.<\/p><\/blockquote>"}]},{"h":"Fator Masculino — Anatomia, Anamnese e Exame Físico","blocos":[{"html":"<p>A função testicular tem duas vertentes. A <strong>via seminífera<\/strong> (produção) faz a espermatogênese nos túbulos seminíferos, regulada por <strong>FSH e testosterona<\/strong>, com duração aproximada de <strong>74 dias<\/strong>, seguida de maturação no epidídimo por mais <strong>12 a 21 dias<\/strong>; as células de Sertoli dão suporte e nutrição. A <strong>via excretora<\/strong> (transporte) vai do epidídimo ao ducto deferente, recebendo a contribuição das glândulas acessórias.<\/p>"},{"html":"<p class=\"figleg\">Trajeto do espermatozoide: testículo, epidídimo, canal deferente, vesícula seminal, próstata e uretra<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Glândula acessória<\/th><th>Contribuição<\/th><\/tr><\/thead><tbody><tr><td>Vesículas seminais<\/td><td><strong>60% do volume<\/strong> seminal — nutrição<\/td><\/tr><tr><td>Próstata<\/td><td><strong>Liquefação<\/strong> do sêmen — favorece motilidade<\/td><\/tr><tr><td>Glândulas bulbouretrais<\/td><td>Lubrificação uretral<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p>Como o ciclo completo de produção e maturação leva cerca de <strong>3 meses<\/strong>, tudo o que aconteceu nos últimos 90 dias — febre, quimioterapia, anabolizante, calor — repercute no espermograma de hoje. A anamnese masculina cobre exatamente esse intervalo.<\/p><\/blockquote>"},{"html":"<h3>Anamnese masculina dirigida<\/h3>"},{"html":"<ul><li><strong>Infecções/ISTs:<\/strong> orquite, epididimite, uretrite por gonococo ou clamídia.<\/li><li><strong>Patologias testiculares:<\/strong> criptorquidia, torção testicular, trauma, varicocele.<\/li><li><strong>Medicações:<\/strong> anabolizantes, quimioterápicos, sulfassalazina, cimetidina, bloqueadores alfa.<\/li><li><strong>Cirurgias prévias:<\/strong> vasectomia, herniorrafia inguinal, cirurgia pélvica, varicocelectomia.<\/li><li><strong>Tóxicos e calor:<\/strong> pesticidas, radiação, banho quente prolongado, trabalho junto a fontes de calor.<\/li><\/ul>"},{"html":"<h3>Exame físico<\/h3>"},{"html":"<p>Avaliar pênis (hipospádia, fimose, anomalias do meato), <strong>testículos<\/strong> (volume mínimo de 15 mL cada, consistência e localização), epidídimos e deferentes (espessamento, nódulos, <strong>ausência congênita bilateral<\/strong>) e o <strong>plexo pampiniforme<\/strong>, pesquisado em repouso e com manobra de Valsalva. A temperatura do ambiente e do local de coleta do espermograma também entra na avaliação.<\/p>"},{"html":"<h3>Varicocele<\/h3>"},{"html":"<p>Dilatação varicosa das veias do plexo pampiniforme — a <strong>causa tratável mais frequente<\/strong> de infertilidade masculina. A cadeia fisiopatológica é: hipertensão venosa com refluxo renal/adrenal → hipoperfusão e hipóxia tecidual → estresse oxidativo e disfunção epitelial → <strong>queda da qualidade espermática<\/strong>.<\/p>"},{"html":"<p class=\"figleg\">Drenagem venosa testicular: a veia testicular esquerda desemboca na veia renal esquerda, e a ausência de válvulas permite o refluxo<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Grau<\/th><th>Achado ao exame físico<\/th><\/tr><\/thead><tbody><tr><td>Grau I<\/td><td>Palpável <strong>apenas<\/strong> durante a manobra de Valsalva<\/td><\/tr><tr><td>Grau II<\/td><td>Palpável <strong>em repouso<\/strong><\/td><\/tr><tr><td>Grau III<\/td><td><strong>Visível<\/strong> em repouso, com ingurgitamento escrotal evidente<\/td><\/tr><\/tbody><\/table><\/div>"}]},{"h":"Espermograma e Valores de Referência (OMS 2021)","blocos":[{"html":"<p>O espermograma avalia simultaneamente a função dos túbulos seminíferos (contagem e morfologia), as glândulas acessórias (volume e composição), a capacidade ejaculatória (volume, fluidez, pH e arquitetura do ejaculado) e, indiretamente, o eixo hipotálamo-hipófise-gonadal.<\/p>"},{"html":"<h3>Fatores de variabilidade na coleta<\/h3>"},{"html":"<ul><li>Abstinência sexual — <strong>ideal de 2 a 5 dias<\/strong>.<\/li><li>Local de coleta (preferência pelo laboratório) e modo de coleta (masturbação em frasco estéril).<\/li><li>Transporte em temperatura corporal, em <strong>menos de 1 hora<\/strong>.<\/li><li>Estado de saúde, medicações e drogas nos últimos 3 meses; estado emocional e grau de instrução.<\/li><\/ul>"},{"html":"<blockquote><p><strong>Ponto-chave.<\/strong> A variação biológica é esperada: <strong>trabalhe sempre com a média de dois exames<\/strong> antes de rotular o paciente. Um espermograma isolado alterado não fecha diagnóstico nem indica reprodução assistida.<\/p><\/blockquote>"},{"html":"<h3>Valores de referência<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Parâmetro<\/th><th>Referência<\/th><th>Alteração se abaixo<\/th><\/tr><\/thead><tbody><tr><td>Volume<\/td><td>≥ 1,4 mL<\/td><td>Hipospermia<\/td><\/tr><tr><td>Concentração<\/td><td>≥ 16 × 10⁶/mL<\/td><td>Oligozoospermia (&lt; 5 = grave · 0 = <strong>azoospermia<\/strong>)<\/td><\/tr><tr><td>Motilidade progressiva (PR)<\/td><td>≥ 30%<\/td><td>Astenozoospermia<\/td><\/tr><tr><td>Morfologia (Kruger)<\/td><td>≥ 4%<\/td><td>Teratozoospermia<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A associação das três alterações — <strong>OAT<\/strong> (oligo + asteno + teratozoospermia) — é frequente na prática e é a indicação principal de ICSI.<\/p>"},{"html":"<h3>Exames subsidiários masculinos<\/h3>"},{"html":"<h4>Avaliação hormonal (FSH, LH, testosterona, prolactina)<\/h4>"},{"html":"<p>Indicada na alteração seminal confirmada, baixa libido, disfunção erétil ou testículos reduzidos.<\/p>"},{"html":"<ul><li>↑ FSH + ↓ volume testicular → <strong>falência testicular primária<\/strong>.<\/li><li>↓ FSH/LH + ↓ testosterona → <strong>hipogonadismo hipogonadotrófico<\/strong> (central).<\/li><\/ul>"},{"html":"<h4>Imagem<\/h4>"},{"html":"<p>Ultrassom escrotal para varicocele, volume testicular e lesões; <strong>ultrassom transretal ou RNM pélvica<\/strong> na suspeita de obstrução distal — indicados na hipospermia (&lt; 1,4 mL) e na azoospermia ou suspeita obstrutiva.<\/p>"},{"html":"<h4>Avaliação genética<\/h4>"},{"html":"<p>Indicada na <strong>oligozoospermia grave (&lt; 5 × 10⁶/mL) ou azoospermia<\/strong>: microdeleções das regiões <strong>AZFa, AZFb e AZFc<\/strong> (definem prognóstico) e cariótipo — a <strong>síndrome de Klinefelter (47,XXY)<\/strong> é a causa cromossômica mais frequente.<\/p>"}]},{"h":"Fator Ovulatório e Síndrome dos Ovários Policísticos","blocos":[{"html":"<p>O fator ovulatório responde por <strong>35%<\/strong> das causas femininas (junto com o tubário, também 35%; endometriose 20%; idiopático 10%). Qualquer nível do eixo hipotálamo (GnRH pulsátil) → hipófise (FSH e LH) → ovário (estrogênio e progesterona) → útero (implantação) pode estar comprometido, gerando ciclos anovulatórios, irregularidade menstrual, amenorreia e infertilidade.<\/p>"},{"html":"<p class=\"figleg\">Ciclo menstrual: hormônios, crescimento folicular, ovulação por volta do 14º dia, corpo lúteo e resposta endometrial<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Nível do eixo<\/th><th>Causas principais<\/th><\/tr><\/thead><tbody><tr><td>Hipotálamo<\/td><td>Desvios ponderais (anorexia, obesidade), exercício excessivo, distúrbios psicossociais, medicamentos (ACO, antipsicóticos), hipogonadismo hipogonadotrófico<\/td><\/tr><tr><td>Hipófise<\/td><td>Prolactinoma e outros tumores, hiperprolactinemia, síndrome de Sheehan, puberdade tardia central<\/td><\/tr><tr><td>Ovário / adrenal / tireoide<\/td><td><strong>SOP (mais frequente)<\/strong>, falência ovariana prematura, tumores funcionantes, disgenesia gonadal, hipo e hipertireoidismo, hiperplasia adrenal congênita<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<h3>Como comprovar a ovulação<\/h3>"},{"html":"<h4>Progesterona de fase lútea<\/h4>"},{"html":"<p>Coletada no <strong>21º dia<\/strong> de um ciclo de 28 dias (cerca de 7 dias após a ovulação presumida):<\/p>"},{"html":"<ul><li><strong>&lt; 3 ng/mL<\/strong> → ciclo anovulatório.<\/li><li><strong>3 a 10 ng/mL<\/strong> → ovulação incerta ou insuficiência lútea.<\/li><li><strong>&gt; 10 ng/mL<\/strong> → ciclo ovulatório confirmado.<\/li><\/ul>"},{"html":"<h4>Ultrassonografia seriada<\/h4>"},{"html":"<p>Monitorização do crescimento folicular ao longo do ciclo; o <strong>folículo dominante mede 18 a 24 mm<\/strong> no pré-ovulatório; <strong>colapso folicular com líquido livre no fundo de saco de Douglas<\/strong> confirma que a ovulação ocorreu. O mesmo exame avalia espessura e padrão endometrial.<\/p>"},{"html":"<h3>SOP<\/h3>"},{"html":"<p>Acomete <strong>6 a 10%<\/strong> das mulheres em idade reprodutiva e é <strong>diagnóstico de exclusão<\/strong>, fechado pelos <strong>critérios de Rotterdam — 2 de 3<\/strong>:<\/p>"},{"html":"<ol><li><strong>Irregularidade menstrual:<\/strong> oligo ou amenorreia (menos de 8 ciclos/ano ou ciclos &gt; 35 dias).<\/li><li><strong>Hiperandrogenismo:<\/strong> clínico (acne, hirsutismo, alopecia) ou laboratorial (testosterona livre elevada).<\/li><li><strong>Morfologia policística:<\/strong> ≥ 12 folículos de 2–9 mm <strong>ou<\/strong> volume ovariano &gt; 10 cm³ em pelo menos um ovário.<\/li><\/ol>"},{"html":"<p class=\"figleg\">Ovário policístico: múltiplos folículos pequenos dispostos na periferia do parênquima<\/p>"},{"html":"<p>Associações relevantes: resistência insulínica, dislipidemia, risco cardiovascular, <strong>câncer de endométrio<\/strong> e apneia do sono.<\/p>"}]},{"h":"Fatores Tubário, Peritoneal, Uterino e Cervical","blocos":[{"html":"<h3>Fator tubário<\/h3>"},{"html":"<p>As tubas são o <strong>sítio fisiológico da fertilização in vivo<\/strong>; obstrução ou disfunção impede a fecundação.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Método<\/th><th>Papel<\/th><\/tr><\/thead><tbody><tr><td><strong>Histerossalpingografia (HSG)<\/strong><\/td><td><strong>Exame de escolha<\/strong> para permeabilidade e função tubária; realizada na primeira fase do ciclo, <strong>dia 7 a 10<\/strong><\/td><\/tr><tr><td>Ultrassonografia<\/td><td>Identifica <strong>hidrossalpinge<\/strong> — coleção anecóica de trajeto tubário<\/td><\/tr><tr><td>Laparoscopia<\/td><td><strong>Padrão-ouro<\/strong> — visualização direta com cromotubagem<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Histerossalpingografia: contraste preenchendo a cavidade uterina e ambas as tubas<\/p>"},{"html":"<p>Causas mais frequentes: ISTs por <strong>Chlamydia trachomatis<\/strong> e <strong>Neisseria gonorrhoeae<\/strong>, endometriose pélvica com acometimento tubário, cirurgias abdominais e pélvicas com aderências, DIP recorrente, aborto séptico e puerpério complicado.<\/p>"},{"html":"<blockquote><p>A <strong>hidrossalpinge<\/strong> não é achado inocente: além de bloquear a tuba, o líquido acumulado <strong>piora os resultados da FIV<\/strong>, o que costuma indicar tratar a tuba antes do ciclo de reprodução assistida.<\/p><\/blockquote>"},{"html":"<h3>Endometriose (fator peritoneal)<\/h3>"},{"html":"<p>Atinge <strong>5 a 15%<\/strong> das mulheres em idade reprodutiva, está presente em <strong>25 a 50%<\/strong> das mulheres inférteis e torna inférteis <strong>30 a 50%<\/strong> de suas portadoras. Mecanismos propostos: distorção anatômica com obstrução tubária, ambiente peritoneal hostil aos gametas (citocinas inflamatórias), endometriomas ovarianos comprometendo a reserva, receptividade endometrial alterada e falha da motilidade e do fimbriotransporte. Investigação: clínica (dismenorreia, dispareunia, sangramento anormal), RNM de pelve para doença profunda, ultrassom com preparo intestinal e <strong>laparoscopia como padrão-ouro<\/strong> diagnóstico e terapêutico; estadiamento <strong>I a IV (ASRM)<\/strong>.<\/p>"},{"html":"<h3>Fator uterino, fator cervical e ISCA<\/h3>"},{"html":"<ul><li><strong>Uterino:<\/strong> miomatose submucosa ou intramural ≥ 4 cm, pólipo endometrial, malformações müllerianas (septo, bicorno), <strong>síndrome de Asherman<\/strong> (sinéquias).<\/li><li><strong>Cervical:<\/strong> muco cervical hostil, estenose pós-conização, anticorpos antiespermáticos (raro), infecções cervicais crônicas.<\/li><li><strong>ISCA (infertilidade sem causa aparente):<\/strong> diagnóstico de exclusão após investigação completa, <strong>10 a 15%<\/strong> dos casos; mecanismos possíveis são fertilização deficiente, disfunção oocitária sutil e implantação comprometida.<\/li><\/ul>"}]},{"h":"Reserva Ovariana","blocos":[{"html":"<p>A reserva ovariana reflete o estoque folicular remanescente e a qualidade oocitária — determinante fundamental do prognóstico reprodutivo.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Marcador<\/th><th>Como avaliar<\/th><th>Corte de reserva reduzida<\/th><\/tr><\/thead><tbody><tr><td><strong>Idade<\/strong><\/td><td>História<\/td><td>Queda acelerada <strong>a partir dos 35 anos<\/strong>, com aumento do risco de aneuploidia<\/td><\/tr><tr><td><strong>AMH<\/strong><\/td><td>Qualquer dia do ciclo<\/td><td><strong>&lt; 1,0 ng/mL<\/strong><\/td><\/tr><tr><td><strong>CFA<\/strong><\/td><td>Ultrassom transvaginal, dia 2–5<\/td><td><strong>&lt; 7 folículos<\/strong> de 2–9 mm no total<\/td><\/tr><tr><td><strong>FSH basal<\/strong><\/td><td>Dia 3–5 do ciclo<\/td><td><strong>&gt; 10–12 UI/L<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>O AMH é sintetizado pelas células da granulosa dos folículos pré-antrais e <strong>independe do ciclo menstrual<\/strong>, o que o torna o melhor marcador disponível. A CFA é o melhor preditor de resposta à estimulação ovariana. O FSH basal sobe porque a depleção folicular reduz a retroalimentação negativa.<\/p>"},{"html":"<blockquote><p><strong>Pegadinha clássica.<\/strong> O <strong>AMH é o melhor marcador laboratorial<\/strong>, mas a <strong>idade é o preditor isolado mais importante<\/strong> do prognóstico reprodutivo. AMH bom aos 42 anos não devolve qualidade oocitária.<\/p><\/blockquote>"}]},{"h":"Tratamento — Baixa e Alta Complexidade","blocos":[{"html":"<h3>Etapa 1 — retirar ou reverter as causas identificadas<\/h3>"},{"html":"<p>Tratar ISTs, corrigir hipogonadismo, realizar varicocelectomia, operar o fator tubário, promover perda de peso e suspender drogas e anabolizantes. Nenhuma técnica de reprodução assistida vem antes desta etapa.<\/p>"},{"html":"<h3>Etapa 2 — escolher o método<\/h3>"},{"html":"<h4>Baixa complexidade<\/h4>"},{"html":"<ul><li><strong>Coito programado (CP):<\/strong> relação sexual orientada pela monitorização ovulatória (ultrassom seriado + LH urinário). Indicado na infertilidade ovulatória e na idiopática leve.<\/li><li><strong>Inseminação intrauterina (IIU):<\/strong> sêmen processado depositado na cavidade uterina por cateter, em geral associada à estimulação ovariana controlada. Indicações: <strong>fator cervical, fator masculino leve a moderado e infertilidade idiopática<\/strong>.<\/li><\/ul>"},{"html":"<h4>Alta complexidade<\/h4>"},{"html":"<ul><li><strong>FIV (fertilização in vitro):<\/strong> punção oocitária, fertilização extracorpórea e transferência embrionária. Indicações: <strong>fator tubário, falha de IIU, endometriose grave e reserva diminuída<\/strong>.<\/li><li><strong>ICSI (injeção intracitoplasmática):<\/strong> microinjeção de um único espermatozoide no oócito. Indicação principal: <strong>fator masculino grave (OAT)<\/strong>; também nas falhas de fertilização em FIV convencional.<\/li><\/ul>"},{"html":"<blockquote><p><strong>Resumo da escolha.<\/strong> Fator cervical ou masculino leve → IIU. Fator tubário, endometriose grave ou falha de IIU → FIV. Fator masculino grave ou falha de fertilização em FIV → ICSI.<\/p><\/blockquote>"}]}]},{"slug":"massas-anexiais-e-cancer-de-ovario","titulo":"Massas Anexiais e Câncer de Ovário","disciplina":"GO","eyebrow":"Ginecologia · Oncologia Ginecológica","questoes":[{"id":"940bc8e1b8","q":"Que proporção dos cânceres de ovário é diagnosticada ainda no estádio I?","opts":["Cerca de 15% dos casos","Cerca de 45% dos casos","Cerca de 70% dos casos","Cerca de 90% dos casos"],"c":0,"exp":"Apenas cerca de 15% dos casos chegam ao diagnóstico no estádio I. Os sintomas são vagos (distensão, dor pélvica, saciedade precoce), não há rastreamento eficaz e a disseminação peritoneal é precoce — daí o apelido de 'silent killer'. O reflexo aparece na sobrevida em 5 anos, em torno de 45%, contra cerca de 89% no câncer de mama.","ref":[0,2]},{"id":"f3e7febc50","q":"Mulher de 45 anos, assintomática e sem história familiar de câncer, pede exames para 'prevenir câncer de ovário'. Qual é a conduta adequada?","opts":["Explicar que não há rastreamento eficaz e não pedir USTV nem CA-125 de rotina","Solicitar ultrassonografia transvaginal anual a partir dos 40 anos de idade","Solicitar dosagem anual de CA-125 associada ao exame pélvico bimanual","Solicitar CA-125 e ultrassonografia transvaginal a cada seis meses"],"c":0,"exp":"O câncer de ovário não tem rastreamento eficaz. Em mulheres assintomáticas, o exame pélvico bimanual e a USTV não têm acurácia significativa e não são recomendados como rotina (ACOG, 2014). O CA-125 também falha como rastreio: pode ser normal nos estádios iniciais e se eleva em várias condições benignas.","ref":[4,7]},{"id":"b65deb6057","q":"Qual é o tumor de ovário mais comum em crianças e adolescentes?","opts":["Teratoma maduro, um tumor de células germinativas","Cistoadenoma seroso, um tumor epitelial benigno","Tumor de células da granulosa, um tumor estromal","Fibroma ovariano, um tumor do estroma gonadal"],"c":0,"exp":"Na infância e na adolescência predominam os tumores de células germinativas, e entre eles os teratomas. Os teratomas maduros (cisto dermoide) respondem por 55 a 70% dos tumores de ovário em crianças e são bilaterais em 10%. Cerca de 25% das lesões nessa faixa são malignas, com destaque para o disgerminoma; tecomas e fibromas somam só 1%, e os tumores da granulosa são raros.","ref":[2,2]},{"id":"57e0a09bdc","q":"Adolescente de 16 anos com amenorreia primária e cariótipo 46,XY (síndrome de Swyer) tem massa na gônada. Qual tumor se associa classicamente à disgenesia gonadal, e com que neoplasia maligna ele coexiste com frequência?","opts":["Gonadoblastoma, coexistindo em até 60% com disgerminoma","Teratoma imaturo, coexistindo em até 60% com coriocarcinoma","Tecoma, coexistindo em até 60% com tumor da granulosa","Cistoadenoma mucinoso, coexistindo em até 60% com Krukenberg"],"c":0,"exp":"O gonadoblastoma é um tumor germinativo raro, tipicamente benigno, associado à disgenesia gonadal (síndrome de Turner e síndrome de Swyer). Em até 60% dos casos aparece junto de um tumor germinativo maligno, mais comumente o disgerminoma — que responde por cerca de 1% de todos os cânceres de ovário.","ref":[2,3]},{"id":"8fcb79cb76","q":"Menina de 13 anos com aumento do volume abdominal e massa ovariana sólida de crescimento rápido. Na suspeita de disgerminoma, quais marcadores séricos são mais úteis?","opts":["Beta-hCG e desidrogenase lática (DHL)","CA-125 e antígeno carcinoembrionário","CA-19-9 e testosterona sérica total","Estradiol e CA-125 em dosagem seriada"],"c":0,"exp":"O disgerminoma eleva DHL e, quando há diferenciação trofoblástica (cerca de 5% dos casos), também beta-hCG. Na tabela de marcadores: AFP sugere tumor de saco vitelínico, teratoma imaturo ou Sertoli-Leydig; beta-hCG, disgerminoma ou coriocarcinoma; DHL, disgerminoma ou teratoma imaturo. CA-125, CEA e CA-19-9 são marcadores dos tumores epiteliais.","ref":[4,13]},{"id":"787e438bb6","q":"Mulher de 26 anos com amenorreia secundária, hirsutismo progressivo e clitoromegalia tem massa ovariana sólida unilateral. Qual é o tumor mais provável?","opts":["Tumor de células de Sertoli-Leydig","Tumor de células da granulosa adulto","Cistoadenoma mucinoso borderline","Teratoma maduro (cisto dermoide)"],"c":0,"exp":"Os tumores de células de Sertoli-Leydig secretam andrógenos (testosterona), produzindo hirsutismo, clitoromegalia e amenorreia. O espelho é o tumor de células da granulosa, que produz estradiol e causa amenorreia e puberdade precoce. Virilização + massa ovariana sólida = pense em Sertoli-Leydig.","ref":[4,13]},{"id":"0f8ef35102","q":"Gestante de 8 semanas tem cisto anexial de 4 cm achado no ultrassom de primeiro trimestre. Qual é o diagnóstico mais provável e a evolução esperada?","opts":["Cisto folicular ou corpo-lúteo, com regressão espontânea na maioria","Teratoma maduro, com crescimento progressivo na maioria dos casos","Cistoadenoma seroso, persistindo após o parto na maioria dos casos","Carcinoma epitelial inicial, com indicação de cirurgia imediata"],"c":0,"exp":"Massas anexiais aparecem em 4,9 a 6,1% dos ultrassons de primeiro trimestre, regridem espontaneamente em 71 a 89% e são benignas na anatomia patológica em 95 a 99%. No primeiro trimestre predominam o cisto folicular (o mais comum) e o corpo-lúteo (13 a 17%); passado o primeiro trimestre, a lesão anexial mais comum é o teratoma maduro.","ref":[2,7]},{"id":"d4e79edaf7","q":"Gestante assintomática com massa anexial. No ultrassom de 18 a 20 semanas, os critérios de malignidade são duvidosos. Segundo o fluxograma da figura, qual é o próximo passo?","opts":["Avaliar a massa por ressonância magnética","Indicar cirurgia de imediato, ainda no 2º trimestre","Reavaliar apenas no ultrassom de 32 a 36 semanas","Dosar CA-125 e decidir a conduta pelo seu valor"],"c":0,"exp":"Na gestação, massa anexial sintomática é cirúrgica. A assintomática é reavaliada no ultrassom de cada trimestre (inicial, 18 a 20 e 32 a 36 semanas) em busca de critérios de malignidade: presentes, cirurgia; duvidosos, ressonância magnética; ausentes, reavaliar no próximo ultrassom.","cap":"Fluxograma do manejo dos tumores anexiais em gestantes","ref":[6,9]},{"id":"3c8765988e","q":"Massa ovariana classificada como de alto risco é detectada no primeiro trimestre da gestação. Quando a cirurgia deve ser realizada?","opts":["No segundo trimestre da gestação","De imediato, ainda no 1º trimestre","Somente após o parto, no puerpério","No terceiro trimestre, antes do parto"],"c":0,"exp":"No primeiro trimestre, massa de alto risco vai para cirurgia no segundo trimestre. A de risco baixo ou intermediário é seguida além de 14 semanas: se regride, ultrassom a cada 8 semanas até o parto; se progride ou não regride, também cirurgia no segundo trimestre. Detectada após 24 semanas e de baixo risco, a massa pode aguardar o parto — excisão na cesárea ou cirurgia pós-parto.","ref":[6,10]},{"id":"39dbec663b","q":"Na pós-menopausa, qual tipo de tumor predomina entre as massas ovarianas malignas?","opts":["Tumor epitelial seroso","Tumor germinativo misto","Tumor estromal de Leydig","Tumor de seio endodérmico"],"c":0,"exp":"Os tumores epiteliais concentram-se acima dos 60 anos, e o seroso é o subtipo mais frequente (30 a 70% dos carcinomas epiteliais) — na forma maligna, cistoadenocarcinoma/carcinoma seroso. Entre as lesões benignas dessa fase destaca-se o teratoma maduro. Tumores germinativos predominam até os 25 anos; metástases (mama, trato gastrointestinal, útero, tubas) entram no diferencial de massa complexa.","ref":[2,10]},{"id":"094f290ae1","q":"Qual conjunto reúne apenas fatores de risco para câncer de ovário?","opts":["BRCA1/2, síndrome de Lynch, endometriose e nuliparidade","BRCA1/2, multiparidade, amamentação e laqueadura tubária","Contraceptivo oral, síndrome de Lynch, gestação e tabagismo","Primeiro parto antes dos 25 anos, obesidade e endometriose"],"c":0,"exp":"São fatores de risco: história familiar de câncer de mama ou ovário, mutações BRCA1/BRCA2, síndrome de Lynch, endometriose (estado inflamatório crônico), infertilidade, obesidade, tabagismo, nuliparidade, terapia de reposição hormonal e idade (pico entre 60 e 70 anos). São protetores: contraceptivo oral, gestação, amamentação, laqueadura tubária e primeiro parto antes dos 25 anos.","ref":[3,0]},{"id":"4afad2bb12","q":"Mulher de 30 anos com dispareunia e dismenorreia intensa tem massa anexial à USTV. Qual é a hipótese mais provável?","opts":["Endometrioma ovariano","Leiomioma subseroso","Abscesso tubo-ovariano","Cisto folicular simples"],"c":0,"exp":"Dispareunia e dismenorreia severa sugerem endometrioma. Metrorragia com dismenorreia aponta para leiomioma; febre e dor à mobilização do colo, para abscesso tubo-ovariano/doença inflamatória pélvica; dor aguda, para gravidez ectópica ou torção ovariana.","ref":[4,4]},{"id":"fb17e24a87","q":"Em mulher com massa anexial, qual característica dos sintomas deve levantar a suspeita de tumor maligno de ovário?","opts":["Progressão rápida e grave, sobretudo com sintomas consumptivos","Dor pélvica aguda com febre, calafrios e vômitos persistentes","Dor pélvica cíclica que piora sempre no período menstrual","Dor aguda lateralizada associada a atraso menstrual recente"],"c":0,"exp":"Os sintomas de tumor ovariano são inespecíficos (sangramento genital, aumento do volume abdominal, dor abdominal e pélvica). Quando têm início súbito, são severos ou progridem rápido — principalmente com sintomas consumptivos —, a malignidade deve ser considerada. Febre, calafrios e vômitos sugerem infecção; dor aguda com atraso menstrual, gravidez ectópica.","ref":[4,2]},{"id":"3360ef0e96","q":"Sobre o CA-125 na avaliação de massa anexial, qual afirmação está correta?","opts":["Seu valor preditivo positivo é maior na pós-menopausa que na menacme","Está elevado em praticamente todos os carcinomas ovarianos em estádio I","Isoladamente, basta para diferenciar tumor benigno de tumor maligno","Não se eleva em doenças benignas como endometriose, miomas e DIP"],"c":0,"exp":"O CA-125 é o marcador mais relevante: está elevado em cerca de 80% das mulheres com câncer epitelial de ovário, mas pode ser normal nos estádios iniciais e sobe em endometriose, miomas, DIP, cirrose, tuberculose e outros cânceres (pulmão, mama). Na pós-menopausa seu valor preditivo positivo chega a 98%, contra 49% na menacme. Por isso não deve ser usado isoladamente para separar benigno de maligno (ACOG, 2016).","ref":[4,10]},{"id":"da6c153767","q":"Mulher de 34 anos com endometrioma de 5 cm de aspecto típico tem CA-125 de 90 U/mL. Como interpretar esse valor?","opts":["Elevação esperada: endometriomas elevam o CA-125 em cerca de 67%","Elevação diagnóstica de carcinoma: indicar cirurgia oncológica","Erro laboratorial: o endometrioma não altera o CA-125 sérico","Elevação que exclui endometrioma e sugere tumor germinativo"],"c":0,"exp":"O valor de referência do CA-125 é 35 U/mL, e muitas condições benignas o ultrapassam: endometriomas e cirrose em 67%, DIP aguda em 30%, tumores epiteliais benignos em 29%, miomas em 26%, endometriose em 25% e cirrose com ascite em 100%. No câncer de ovário a elevação ocorre em 70 a 80%. Na menacme, o valor preditivo positivo do marcador é de apenas 49%.","ref":[4,11]},{"id":"b6e24d4ab5","q":"Mulher de 31 anos com dismenorreia progressiva. A USGTV do ovário direito (figura) mostra cisto de paredes regulares, sem fluxo interno ao Doppler. Qual é o diagnóstico mais provável?","opts":["Endometrioma ovariano","Cisto folicular simples","Cisto dermoide típico","Cistoadenoma mucinoso"],"c":0,"exp":"O conteúdo é homogêneo, com ecos finos de baixa intensidade em 'vidro fosco' — o padrão típico do endometrioma, que pode ter cápsula espessa e focos hiperecogênicos de permeio. O cisto folicular é anecoico (preto); o dermoide tem componente hiperecogênico com sombra acústica. Endometrioma típico com menos de 10 cm é O-RADS 2.","cap":"USGTV do ovário direito","ref":[5,4]},{"id":"13bf0c202f","q":"A figura reúne aspectos ultrassonográficos de um mesmo tipo de lesão ovariana: componente hiperecogênico com sombra acústica, linhas e pontos hiperecogênicos e, em um caso, esferas ecogênicas flutuantes. Que lesão é essa?","opts":["Teratoma maduro (cisto dermoide)","Cisto hemorrágico com coágulo","Endometrioma com focos murais","Cistoadenoma seroso papilífero"],"c":0,"exp":"São os achados do teratoma maduro: nódulo misto com área hiperecogênica e sombra acústica posterior, linhas e pontos hiperecogênicos (cabelos) e, raramente, esferas ecogênicas flutuantes — incomuns, mas patognomônicas. O dermoide típico com menos de 10 cm é O-RADS 2, é bilateral em 10% e tem risco de transformação maligna menor que 0,8%.","cap":"Aspectos ultrassonográficos típicos de uma lesão ovariana","ref":[5,4]},{"id":"941e698ef6","q":"Pelas regras simples da IOTA (figura), como se classifica um tumor sólido irregular acompanhado de ascite, sem nenhuma característica B?","opts":["Maligno: há características M e nenhuma B","Benigno: a ascite isolada não tem valor","Inconclusivo: são exigidas três ou mais M","Benigno: tumor sólido costuma ser fibroma"],"c":0,"exp":"As regras simples listam cinco características benignas (B1 unilocular; B2 componente sólido < 7 mm; B3 sombra acústica; B4 multilocular liso < 100 mm; B5 sem fluxo) e cinco malignas (M1 tumor sólido irregular; M2 ascite; M3 ≥ 4 estruturas papilares; M4 multilocular-sólido irregular ≥ 100 mm; M5 fluxo muito intenso). Uma ou mais M sem nenhuma B classifica como maligno; o inverso, benigno; ambas ou nenhuma, inconclusivo. A calculadora SRRisk converte o achado em risco percentual.","cap":"Regras simples da IOTA: características B (verde) e M (vermelho)","ref":[5,11]},{"id":"0b877d84d5","q":"Segundo o O-RADS (figura), qual destas lesões anexiais é classificada como de alto risco (≥ 50% de malignidade)?","opts":["Cisto unilocular com quatro ou mais projeções papilares","Cisto unilocular simples, anecoico, com 12 cm de diâmetro","Cisto multilocular de parede lisa < 10 cm, color score 2","Lesão sólida de contorno liso com color score 1 (sem fluxo)"],"c":0,"exp":"O-RADS 5 inclui cisto unilocular com ≥ 4 projeções papilares, cisto multilocular com componente sólido e color score 3–4, lesão sólida lisa com color score 4, lesão sólida irregular e ascite e/ou nódulos peritoneais. O cisto unilocular ≥ 10 cm, o multilocular liso < 10 cm com color score 1–3 e a lesão sólida lisa com color score 1 são O-RADS 3 (risco de 1 a < 10%).","cap":"O-RADS 5 — alto risco","ref":[5,16]},{"id":"178e5cf5e8","q":"Mulher de 52 anos tem massa anexial classificada como O-RADS 4 (risco intermediário, 10 a < 50%). Qual é a conduta recomendada?","opts":["Encaminhar a centro de referência em oncologia ginecológica","Repetir o ultrassom em seis semanas e dar alta se regredir","Seguimento ultrassonográfico em 3, 6 e 12 meses, se assintomática","Cirurgia na unidade de ginecologia geral, sem encaminhamento"],"c":0,"exp":"Achados fisiológicos (O-RADS 1) permitem conduta conservadora — alta ou novo exame em 6 semanas. Achados não fisiológicos passam por avaliação de especialista ou pelo modelo IOTA ADNEX: O-RADS 2, se assintomática, segue em 3-6-12 meses; O-RADS 3 vai para cirurgia em unidade de ginecologia geral; O-RADS 4 e 5 são encaminhados a centro especializado em oncologia ginecológica.","ref":[5,19]},{"id":"2198b1f43f","q":"Mulher de 35 anos, assintomática, tem cisto ovariano simples de 5 cm à USTV. Qual é a evolução mais provável?","opts":["Resolução espontânea em até três meses em cerca de 70%","Persistência com transformação maligna em cerca de 10%","Crescimento progressivo, exigindo cirurgia em cerca de 50%","Torção anexial nas primeiras quatro semanas em cerca de 30%"],"c":0,"exp":"Cisto simples é imagem homogênea, circular e anecoica, que pode ter septos incompletos ou menores que 3 mm e ecos em suspensão. Num estudo com 15.106 mulheres com menos de 50 anos, 2.363 tinham cistos simples < 10 cm, e 70% se resolveram espontaneamente em até 3 meses. Dos 117 que persistiram, 52% eram cistoadenomas serosos e nenhum era câncer.","ref":[5,2]},{"id":"e87c7abcdc","q":"Mulher de 32 anos, teste de gravidez negativo, cisto ovariano de 6 cm sem achados suspeitos na USTV e sem sinais de abscesso. Pelo fluxograma da figura, qual é a conduta?","opts":["Expectante, com AINE se preciso, e USTV a cada 4 semanas","Cirurgia imediata pelo tamanho superior a 5 centímetros","Dosar CA-125 e operar se o valor ultrapassar 35 U/mL","Alta definitiva, pois cisto sem achado suspeito não evolui"],"c":0,"exp":"Na pré-menopausa, o primeiro passo é o teste de gravidez (positivo: considerar ectópica). Com teste negativo, achado suspeito na USTV/RM leva a referenciar ao cirurgião ginecologista ou oncoginecologista, e afasta-se abscesso tubo-ovariano (hemograma, PCR). Sem suspeita e com massa ≤ 10 cm: conduta expectante (considerar AINE) e USTV a cada 4 semanas; se persistir além de 12 semanas, referenciar.","cap":"Fluxograma do manejo na pré-menopausa","ref":[6,2]},{"id":"f10621f364","q":"Mulher de 63 anos com massa anexial de 6 cm, sem achados suspeitos na USTV, e CA-125 de 78 U/mL. Pelo fluxograma da figura, qual é a conduta?","opts":["Referenciar ao cirurgião ginecologista ou oncoginecologista","Repetir a USTV a cada 4 semanas por mais 12 semanas","Repetir o CA-125 em seis meses, sem novo exame de imagem","Conduta expectante com anti-inflamatório não hormonal"],"c":0,"exp":"Na pós-menopausa há três portas para o especialista: massa > 10 cm, achado suspeito na USTV/RM ou CA-125 > 35 U/mL. Só quando as três são negativas faz-se USTV a cada 4 semanas, referenciando se a massa persistir além de 12 semanas. Aqui o CA-125 de 78 U/mL basta para encaminhar — e na pós-menopausa seu valor preditivo positivo é alto.","cap":"Fluxograma do manejo na pós-menopausa","ref":[6,2]},{"id":"6c71966fe1","q":"Qual é uma indicação adequada de ressonância magnética da pelve na avaliação de massa anexial?","opts":["Diferenciar coágulo de componente sólido visto à USTV","Rastrear câncer de ovário em mulher assintomática","Substituir a USTV como primeiro exame na menacme","Confirmar cisto simples anecoico típico de 3 cm"],"c":0,"exp":"A USTV é a primeira linha. A RM entra na dúvida diagnóstica e no preparo cirúrgico: teratomas com imagem atípica, coágulos que simulam massa sólida e massas sólidas como fibrotecomas e fibromas. É também a opção quando a via transvaginal não é adequada — adolescentes e mulheres sem penetração vaginal — e o recurso da gestante quando o ultrassom é duvidoso.","ref":[5,21]},{"id":"4290280c43","q":"Em câncer de ovário nos estádios III e IV, qual fator prognóstico depende diretamente da qualidade da cirurgia?","opts":["Volume de tumor residual após a citorredução","Nível sérico de CA-125 antes do diagnóstico","Lateralidade do tumor primário no abdome","Idade da menarca e número de gestações"],"c":0,"exp":"Nos estádios avançados, os fatores prognósticos são o tamanho do tumor residual após a cirurgia (≤ 1 cm vs > 1 cm), o estádio (III vs IV), o tipo histológico, a idade, o grau e o acometimento linfonodal — e o residual é o único que a equipe cirúrgica controla. Nos estádios precoces pesam o estádio (IA-IB vs IC vs II), a rotura da cápsula, o grau, a histologia, a idade e a citologia do líquido ascítico.","ref":[7,3]},{"id":"73b93e9baf","q":"Mulher de 55 anos com massa anexial sólido-cística bilateral, ascite e derrame pleural direito com citologia positiva para células malignas; CA-125 de 250 U/mL. Pela figura, qual é o estádio FIGO?","opts":["Estádio IVA — derrame pleural com citologia positiva","Estádio IC3 — células malignas no líquido ascítico","Estádio IIIC — implantes peritoneais acima de 2 cm","Estádio IIB — extensão a outros tecidos pélvicos"],"c":0,"exp":"Derrame pleural com citologia positiva é metástase à distância: estádio IVA. O IVB corresponde a metástases parenquimatosas e extra-abdominais (inclusive linfonodos inguinais). Células malignas no líquido ascítico ou lavado com tumor restrito aos ovários são IC3. Sem citologia positiva o derrame não estadia — e massa + ascite + derrame também é a tríade da síndrome de Meigs.","cap":"Estadiamento FIGO do câncer de ovário","ref":[7,9]},{"id":"6f186adf56","q":"Mulher de 58 anos com tumor ovariano sólido unilateral, ascite e derrame pleural à direita, citologia negativa e CA-125 elevado. Após a ooforectomia, ascite e derrame desaparecem; a histologia mostra fibroma. Qual é o diagnóstico?","opts":["Síndrome de Meigs clássica","Síndrome de pseudo-Meigs","Tumor de Krukenberg bilateral","Síndrome de Gorlin-Goltz"],"c":0,"exp":"A síndrome de Meigs é a tríade tumor ovariano benigno (geralmente fibroma; também tecoma ou tumor de Brenner) + ascite + derrame pleural, em geral à direita, que regride após a retirada do tumor. Mimetiza câncer avançado e pode elevar o CA-125. Na pseudo-Meigs, ascite e derrame acompanham outros tumores, como malignos de ovário ou miomas.","ref":[8,1]},{"id":"89620a9d04","q":"Mulher de 48 anos com massas ovarianas sólidas bilaterais; a histologia mostra células produtoras de mucina em 'anel de sinete'. Qual é o sítio primário mais provável?","opts":["Estômago, cerca de 70% dos casos","Cólon e reto, cerca de 70% dos casos","Mama, em cerca de 70% dos casos","Endométrio, cerca de 70% dos casos"],"c":0,"exp":"É o tumor de Krukenberg: adenocarcinoma ovariano raro, geralmente bilateral e metastático, com células em anel de sinete. O sítio primário é o trato gastrointestinal — câncer gástrico em cerca de 70% e colorretal em cerca de 20%. Diante de massa ovariana sólida bilateral com esse padrão, investigue o tubo digestivo.","ref":[8,6]},{"id":"b5aeb86e54","q":"Mulher de 27 anos, com desejo reprodutivo, tem carcinoma epitelial de ovário em estádio IA. Qual cirurgia permite preservar a fertilidade?","opts":["Salpingo-ooforectomia unilateral, preservando útero e ovário contralateral","Histerectomia total abdominal com salpingo-ooforectomia bilateral","Quimioterapia neoadjuvante isolada, sem nenhuma abordagem cirúrgica","Ooforectomia bilateral com preservação apenas do útero e das tubas"],"c":0,"exp":"O tratamento padrão é laparotomia com histerectomia total abdominal e salpingo-ooforectomia bilateral, mas nos estádios IA a IC a salpingo-ooforectomia unilateral preserva a fertilidade. Depois: IA/IB grau 1, observar; grau 2, observar ou taxano-carboplatina por 3 a 6 ciclos; grau 3 e IC, taxano-carboplatina por 3 a 6 ciclos. Estádios II a IV: citorredução e taxano-carboplatina por 6 ciclos — ou QT neoadjuvante com citorredução de intervalo se não houver condição de cirurgia primária.","ref":[7,11]},{"id":"3295c33ced","q":"Qual achado ultrassonográfico aumenta a suspeita de malignidade em massa anexial?","opts":["Projeções papilares envolvendo mais de 50% da parede interna","Conteúdo anecoico, homogêneo, com parede fina e lisa","Septo fino e incompleto, com menos de 3 mm de espessura","Sombra acústica posterior em nódulo hiperecogênico"],"c":0,"exp":"São suspeitos: componente sólido, multiloculação, cápsula espessa, diâmetro > 6 cm, septo grosseiro, projeções papilares, ascite e fluxo alterado ao Doppler. Projeções e septos finos isolados têm baixo risco — 39% dessas massas regridem em 12 meses —, mas mais de quatro projeções ou envolvimento de mais de 50% da parede interna elevam o risco. Sombra acústica com nódulo hiperecogênico é o dermoide.","ref":[5,7]}],"resumo":[{"h":"Massas anexiais: o tamanho do problema e a ordem do raciocínio","blocos":[{"html":"<p>Massa (ou tumor) anexial é qualquer lesão que ocupa a região dos anexos uterinos. É achado <strong>comum<\/strong>, pode ser de natureza <strong>ovariana ou extraovariana<\/strong>, e o manejo segue um de dois caminhos: <strong>intervenção imediata<\/strong>, quando há emergência (gestação ectópica, torção, abscesso), ou <strong>investigação para afastar malignidade<\/strong>, que é o caso da imensa maioria. Nos EUA, cerca de <strong>250 mil mulheres<\/strong> são hospitalizadas por ano por massas anexiais.<\/p>"},{"html":"<p>O que dá peso ao tema é o câncer de ovário. Nos EUA ele é a <strong>5ª causa de morte por câncer em mulheres<\/strong> e a <strong>1ª entre os cânceres ginecológicos<\/strong>; no Brasil é o <strong>7º mais incidente<\/strong> entre todos os cânceres femininos e o <strong>3º entre os ginecológicos<\/strong> — o INCA estimou cerca de <strong>6.150 casos novos e 3.283 mortes por ano<\/strong> (2016). A incidência é maior nos países desenvolvidos. A <strong>idade média ao diagnóstico é de 63 anos<\/strong>, mas um terço das pacientes tem menos de 54. O risco ao longo da vida é de cerca de <strong>1 em 100<\/strong> mulheres; sobe para <strong>5 em 100<\/strong> com um parente acometido e para <strong>7 em 100<\/strong> com dois ou três.<\/p>"},{"html":"<blockquote><p><strong>\"Silent killer\".<\/strong> Só cerca de <strong>15% dos casos são diagnosticados no estádio I<\/strong>. Os sintomas são vagos, a disseminação peritoneal é precoce e <strong>não existe rastreamento eficaz<\/strong> — nem USTV, nem CA-125, nem toque bimanual em mulher assintomática. A sobrevida em 5 anos fica em torno de <strong>45%<\/strong> (contra ~89% no câncer de mama), e cerca de <strong>70%<\/strong> das mulheres com doença avançada recidivam, muitas já no primeiro ano.<\/p><\/blockquote>"},{"html":"<h3>A ordem do raciocínio<\/h3>"},{"html":"<p>Diante de uma massa anexial, junta-se <strong>epidemiologia (idade e fase da vida) + história clínica + imagem + laboratório quando necessário<\/strong>, e pensa-se em três etapas sucessivas: <strong>descartar causa não ginecológica → descartar emergência → avaliar a possibilidade de malignidade<\/strong>. O diagnóstico definitivo é <strong>sempre histopatológico<\/strong>.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Origem<\/th><th>Benignas<\/th><th>Malignas<\/th><\/tr><\/thead><tbody><tr><td><strong>Ginecológica<\/strong><\/td><td>Teratoma maduro · torção ovariana · ovários policísticos · cistoadenoma · endometrioma · gestação ectópica · hidrossalpinge/hematossalpinge · abscesso tubo-ovariano · cisto paraovariano · fibroma ovariano · cisto folicular<\/td><td>Tumores borderline · carcinoma epitelial · tumores de cordão sexual · carcinoma endometrial · carcinoma de tuba uterina · tumores de células germinativas<\/td><\/tr><tr><td><strong>Não ginecológica<\/strong><\/td><td>Apendicite · divertículo vesical · abscesso diverticular · tumor de bainha nervosa · rim pélvico · cisto de inclusão peritoneal · divertículo ureteral<\/td><td>Metástase · tumor de Krukenberg · sarcomas retroperitoneais<\/td><\/tr><\/tbody><\/table><\/div>"}]},{"h":"Três linhagens celulares: a classificação que organiza tudo","blocos":[{"html":"<p>O ovário tem três populações celulares, e cada uma origina sua família de tumores: o <strong>epitélio de superfície<\/strong> (celômico), as <strong>células germinativas<\/strong> e o <strong>estroma gonadal/cordão sexual<\/strong>. Some-se a elas o ovário como sítio de <strong>metástases<\/strong>. A idade de pico de cada família é o atalho mais útil da clínica:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Origem<\/th><th>Principais tipos<\/th><th>Faixa etária típica<\/th><\/tr><\/thead><tbody><tr><td><strong>Células germinativas<\/strong><\/td><td>Teratoma (maduro, monodérmico, imaturo), gonadoblastoma, disgerminoma, tumor do seio endodérmico (= saco vitelínico), coriocarcinoma<\/td><td><strong>0 a 25 anos<\/strong><\/td><\/tr><tr><td><strong>Estroma / cordão sexual<\/strong><\/td><td>Tecoma, fibroma, fibrossarcoma, Sertoli-Leydig, ginandroblastoma, tumor de células esteroides, cordão sexual com túbulos anulares<\/td><td><strong>20 a 60 anos<\/strong><\/td><\/tr><tr><td><strong>Granulosa<\/strong> (cordão sexual)<\/td><td>Tumor de células da granulosa<\/td><td>Variável<\/td><\/tr><tr><td><strong>Epiteliais<\/strong><\/td><td>Cistoadenoma seroso, mucinoso e endometrioide; células claras; tumor de Brenner; carcinossarcoma (tumor mülleriano misto maligno)<\/td><td><strong>Acima de 60 anos<\/strong><\/td><\/tr><tr><td><strong>Metastáticos<\/strong><\/td><td>Krukenberg (gastrointestinal), mama, endométrio, linfoma<\/td><td>Variável<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Os <strong>tumores epiteliais são o tipo mais comum (~90%)<\/strong> das neoplasias malignas do ovário. Entre os carcinomas epiteliais, a distribuição por tipo celular é:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Subtipo epitelial<\/th><th>Frequência<\/th><\/tr><\/thead><tbody><tr><td><strong>Seroso<\/strong><\/td><td>30 a 70%<\/td><\/tr><tr><td>Endometrioide<\/td><td>10 a 20%<\/td><\/tr><tr><td>Mucinoso<\/td><td>5 a 20%<\/td><\/tr><tr><td>Células claras<\/td><td>3 a 10%<\/td><\/tr><tr><td>Indiferenciado<\/td><td>~1%<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Entre o benigno e o maligno ficam os <strong>tumores epiteliais borderline<\/strong> (de baixo potencial de malignidade): proliferação epitelial atípica <strong>sem invasão do estroma<\/strong>, mais frequente em mulheres mais jovens e de bom prognóstico. Os <strong>carcinomas de tuba uterina e os primários de peritônio são tratados da mesma forma<\/strong> que o câncer epitelial de ovário — e alguns tipos histológicos menos comuns podem representar um estágio inicial do carcinoma epitelial.<\/p>"},{"html":"<blockquote><p>O <strong>teratoma<\/strong> é tumor de células germinativas com tecidos que, ao microscópio, lembram as <strong>três camadas embrionárias<\/strong> — endoderme, mesoderme e ectoderme. Daí o cisto dermoide com cabelo, gordura, dentes e osso.<\/p><\/blockquote>"}]},{"h":"Etiologia por fase da vida","blocos":[{"html":"<p>A mesma massa de 6 cm significa coisas diferentes numa menina de 12 anos, numa mulher de 30, numa gestante e numa senhora de 65. A etiologia das massas anexiais se divide em <strong>pré-púberes, menacme, gestação e pós-menopausa<\/strong>.<\/p>"},{"html":"<h3>Pré-púberes<\/h3>"},{"html":"<p>Predominam os <strong>tumores de células germinativas<\/strong>, e entre eles os <strong>teratomas<\/strong> (maduro, monodérmico, imaturo ou maligno). Os <strong>teratomas maduros<\/strong> respondem por <strong>55 a 70%<\/strong> dos tumores de ovário em crianças e são <strong>bilaterais em 10%<\/strong>. Cerca de <strong>25%<\/strong> das lesões nessa faixa são <strong>malignas<\/strong>, com destaque para o <strong>disgerminoma<\/strong> (~1% de todos os cânceres de ovário).<\/p>"},{"html":"<ul><li><strong>Gonadoblastoma<\/strong> — tumor germinativo raro, tipicamente benigno, associado à <strong>disgenesia gonadal<\/strong> (síndrome de Turner e síndrome de Swyer). Em <strong>até 60%<\/strong> coexiste com tumor germinativo maligno, mais comumente o <strong>disgerminoma<\/strong>.<\/li><li>As lesões germinativas cursam com <strong>aumento do volume abdominal, dor ou massa abdominal<\/strong>; podem ser <strong>bilaterais em 10 a 15%<\/strong> e, em <strong>5%<\/strong>, ter diferenciação trofoblástica com secreção de <strong>beta-hCG<\/strong> e <strong>DHL<\/strong>.<\/li><li><strong>Tecomas e fibromas<\/strong> são raros em crianças (~1%) e se associam à <strong>síndrome de Gorlin<\/strong> e à <strong>síndrome de Meigs<\/strong>.<\/li><li><strong>Tumores de células da granulosa<\/strong> são raros (2 a 3% das malignidades ovarianas).<\/li><li>Entre os epiteliais benignos estão os <strong>cistoadenomas<\/strong> serosos, mucinosos ou endometrioides.<\/li><\/ul>"},{"html":"<h3>Menacme<\/h3>"},{"html":"<p>A maioria é <strong>benigna<\/strong>; só <strong>5 a 10%<\/strong> são malignas. Os principais diagnósticos benignos: <strong>cistos funcionais<\/strong>, <strong>endometrioma<\/strong>, <strong>teratoma maduro (cisto dermoide)<\/strong>, <strong>corpo-lúteo<\/strong>, leiomioma, torção ovariana, doença inflamatória pélvica, abscesso tubo-ovariano e síndrome dos ovários policísticos.<\/p>"},{"html":"<h3>Gestação<\/h3>"},{"html":"<p>Massas anexiais aparecem em <strong>4,9 a 6,1%<\/strong> dos ultrassons de primeiro trimestre, com <strong>regressão espontânea em 71 a 89%<\/strong>, e <strong>95 a 99%<\/strong> são benignas na anatomia patológica. No <strong>primeiro trimestre<\/strong>, o <strong>cisto folicular<\/strong> é o mais comum, e o <strong>corpo-lúteo<\/strong> aparece em 13 a 17%; <strong>após o primeiro trimestre<\/strong>, a lesão mais comum é o <strong>teratoma (cisto dermoide)<\/strong>. Entre os tumores sólidos, predomina o epitelial, mas disgerminomas e tumores de cordão sexual podem aparecer. Metástases ovarianas, que são ~10% dos tumores de ovário na população geral, são <strong>raras na gestação<\/strong>.<\/p>"},{"html":"<h3>Pós-menopausa<\/h3>"},{"html":"<p>Massas anexiais têm incidência de 8 a 17%, e há <strong>lesões suspeitas em 36 a 59%<\/strong>. Entre as malignas predomina o <strong>tumor epitelial seroso<\/strong> (cistoadenocarcinoma/carcinoma seroso); entre as benignas, o <strong>teratoma maduro<\/strong>. Massas <strong>complexas<\/strong> chegam a 3,2% de prevalência, e cerca de <strong>55% delas se resolvem espontaneamente em 60 dias<\/strong>.<\/p>"},{"html":"<ul><li>Diferencial benigno de massa complexa: endometrioma, cisto hemorrágico, teratoma, abscesso tubo-ovariano, linfocele.<\/li><li>Diferencial maligno: primários epiteliais, germinativos e estromais, e <strong>metástases<\/strong> (mama, trato gastrointestinal — tumor de Krukenberg —, útero/colo e tubas).<\/li><li><strong>Massa sólida ovariana deve ser investigada.<\/strong> Sólidas benignas: fibroma, leiomioma, tecoma, fibrotecoma, Brenner benigno, teratoma. Sólidas malignas: disgerminoma, granulosa, Brenner maligno e epiteliais.<\/li><\/ul>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Fase<\/th><th>Mais comum<\/th><th>Fração maligna<\/th><\/tr><\/thead><tbody><tr><td>Pré-púbere<\/td><td>Teratoma maduro (germinativo)<\/td><td>~25% (disgerminoma à frente)<\/td><\/tr><tr><td>Menacme<\/td><td>Cisto funcional, endometrioma, dermoide<\/td><td>5 a 10%<\/td><\/tr><tr><td>Gestação<\/td><td>1º tri: cisto folicular / corpo-lúteo · depois: dermoide<\/td><td>1 a 5% (95–99% benignas)<\/td><\/tr><tr><td>Pós-menopausa<\/td><td>Maligna: epitelial seroso · benigna: teratoma maduro<\/td><td>Lesões suspeitas em 36–59%<\/td><\/tr><\/tbody><\/table><\/div>"}]},{"h":"Fatores de risco e de proteção","blocos":[{"html":"<div class=\"tbl\"><table><thead><tr><th>Aumentam o risco<\/th><th>Reduzem o risco<\/th><\/tr><\/thead><tbody><tr><td>História familiar de câncer de <strong>mama ou ovário<\/strong> (sobretudo ≥ 2 parentes de 1º grau)<\/td><td><strong>Contraceptivo oral<\/strong><\/td><\/tr><tr><td>Mutações <strong>BRCA1 e/ou BRCA2<\/strong> — potencializam o risco familiar<\/td><td><strong>Gestação<\/strong><\/td><\/tr><tr><td><strong>Síndrome de Lynch<\/strong> (câncer colorretal hereditário não polipoide)<\/td><td><strong>Amamentação<\/strong><\/td><\/tr><tr><td><strong>Endometriose<\/strong> (estado inflamatório crônico)<\/td><td><strong>Laqueadura tubária<\/strong><\/td><\/tr><tr><td><strong>Idade<\/strong> — pico entre 60 e 70 anos<\/td><td><strong>Primeiro parto antes dos 25 anos<\/strong><\/td><\/tr><tr><td><strong>Nuliparidade<\/strong> e primeira gestação após os 35 anos<\/td><td><\/td><\/tr><tr><td><strong>Terapia hormonal<\/strong> no climatério<\/td><td><\/td><\/tr><tr><td>Infertilidade · obesidade · tabagismo · doença inflamatória pélvica<\/td><td><\/td><\/tr><\/tbody><\/table><\/d
