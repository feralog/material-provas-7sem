da 21-hidroxilase, em 95% dos casos","Deficiência da 11-hidroxilase, em 95% dos casos","Deficiência da 3β-HSD, em cerca de 60% dos casos","Deficiência da 17-hidroxilase, em 40% dos casos"],"c":0,"exp":"A deficiência da 21-hidroxilase é a causa mais frequente de ambiguidade genital e responde por 95% dos casos de hiperplasia adrenal congênita. O bloqueio enzimático reduz o cortisol, eleva o ACTH e desvia o substrato para a via androgênica, virilizando o feto 46,XX. O critério hormonal da forma clássica é 17OH-progesterona basal acima de 60 ng/mL.","ref":[8,5]},{"id":"57aa3f90ed","q":"Quais são os critérios hormonais para o diagnóstico da deficiência da 5α-redutase tipo 2?","opts":["T/DHT > 26 basal e > 36 após estímulo com hCG","T/DHT > 10 basal e > 20 após estímulo com hCG","17OHP > 60 ng/mL basal e > 10 ng/mL após ACTH","LH > 22 UI/L basal e testosterona > 1000 ng/dL"],"c":0,"exp":"O diagnóstico apoia-se na relação testosterona/DHT, com razão maior que 26 em condição basal e maior que 36 após estímulo com hCG, conforme a casuística de Mendonça e colaboradores. O bloqueio da conversão periférica acumula testosterona e reduz a DHT. Os valores de 17OHP pertencem ao diagnóstico da hiperplasia adrenal congênita por deficiência da 21-hidroxilase.","ref":[8,5]}],"resumo":[{"h":"Do embrião indiferenciado à crista urogenital","blocos":[{"html":"<p>Todo embrião humano atravessa uma fase em que o sexo genético já está definido, mas o sexo gonadal e o sexo fenotípico ainda não existem. O substrato de tudo é o <strong>mesoderma intermediário<\/strong>, que forma a <strong>crista urogenital<\/strong> — a mesma faixa de tecido responsável por três coisas ao mesmo tempo: a criação das gônadas, o surgimento dos dois pares de ductos genitais (Müller e Wolff) e, por infiltração migratória vinda do intestino, o alojamento das <strong>células germinativas primordiais<\/strong> (futuros oócitos e espermatozoides). A porção terminal do intestino, a <strong>cloaca<\/strong>, dá origem, em sua parte anterior, à genitália externa.<\/p>"},{"html":"<p>Essa vizinhança embriológica não é detalhe acadêmico: como os ductos paramesonéfricos progridem em sentido craniocaudal <strong>paralelamente ao sistema urinário<\/strong>, qualquer falha de organogênese mülleriana tende a vir acompanhada de anomalia renal ipsilateral. É por isso que toda paciente com malformação uterina merece ultrassom de vias urinárias.<\/p>"},{"html":"<p class=\"figleg\">Etapa indiferenciada: dois pares de ductos genitais e os dois destinos possíveis<\/p>"},{"html":"<p>Na fase indiferenciada coexistem, em ambos os sexos, o <strong>ducto mesonéfrico (de Wolff)<\/strong> e o <strong>ducto paramesonéfrico (de Müller)<\/strong>. A extremidade cefálica do ducto de Müller abre-se livremente na cavidade celômica, enquanto as extremidades caudais convergem e se fundem no <strong>ducto útero-vaginal<\/strong>. O que acontece a seguir depende inteiramente do ambiente hormonal.<\/p>"}]},{"h":"Determinação gonadal e diferenciação sexual: dois relógios distintos","blocos":[{"html":"<p>A prova cobra a distinção entre os dois termos e, sobretudo, as semanas.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Conceito<\/th><th>Definição<\/th><th>Cronologia<\/th><\/tr><\/thead><tbody><tr><td>Determinação gonadal<\/td><td>Eventos iniciais que definem a formação da gônada<\/td><td>Testículo na <strong>6ª semana<\/strong>; ovário na <strong>8ª semana<\/strong><\/td><\/tr><tr><td>Diferenciação sexual<\/td><td>Eventos subsequentes que definem o fenótipo masculino ou feminino<\/td><td>Completa-se por volta da <strong>12ª semana<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p>Ponto-chave: a via testicular é sempre a mais precoce. O testículo aparece duas semanas antes do ovário, e é essa antecipação que permite ao AMH e à testosterona agirem sobre os ductos antes que a organogênese feminina se consolide.<\/p><\/blockquote>"},{"html":"<h3>A cascata genética sobre a gônada bipotencial<\/h3>"},{"html":"<p>A gônada bipotencial é montada por um núcleo de genes comuns aos dois sexos: <strong>LHX9, SF1, WT1, CBX2, POD1, GATA4-FOG2<\/strong>. A partir daí, a bifurcação:<\/p>"},{"html":"<ul><li><strong>Via testicular:<\/strong> <code>SRY<\/code> → <code>SOX9<\/code> → diferenciação das células de Sertoli e de Leydig; participam ainda <strong>DHH, DMRT1, ATRX<\/strong>.<\/li><li><strong>Via ovariana:<\/strong> <code>WNT4<\/code>, <code>FOXL2<\/code>, <code>FST<\/code> (folistatina), <code>DSS-DAX1<\/code>, com <strong>FIGα<\/strong> e <strong>NOBOX<\/strong> na foliculogênese; <strong>BMP15<\/strong> e <strong>GDF9<\/strong> atuam nas células da granulosa.<\/li><\/ul>"},{"html":"<p>A dosagem gênica importa: <code>DSS-DAX1<\/code> em dose dobrada antagoniza a via SRY/SOX9, e <code>WNT4<\/code> reprime a esteroidogênese testicular — motivo pelo qual há indivíduos 46,XY com reversão sexual sem mutação de SRY.<\/p>"}]},{"h":"Os três hormônios que decidem o fenótipo","blocos":[{"html":"<p>A diferenciação sexual interna e externa é comandada por três mediadores, cada um com alvo e mecanismo próprios. Confundi-los é o erro mais comum na prova.<\/p>"},{"html":"<h4>AMH / MIS (hormônio antimülleriano)<\/h4>"},{"html":"<p>Secretado pelas <strong>células de Sertoli fetais entre a 7ª e a 8ª semana<\/strong>, sob controle de SOX9 e SF1. Age sobre o receptor AMH-R e provoca a <strong>regressão apoptótica irreversível dos ductos de Müller<\/strong> no feto masculino.<\/p>"},{"html":"<h4>Testosterona<\/h4>"},{"html":"<p>Secretada pelas <strong>células de Leydig<\/strong>, sob estímulo do receptor de LH e das enzimas da esteroidogênese com SF1. Estimula a diferenciação e a <strong>manutenção dos ductos de Wolff<\/strong>, de forma <strong>ipsilateral e parácrina<\/strong> — se um testículo falha, o ducto wolffiano daquele lado regride.<\/p>"},{"html":"<h4>DHT (via 5α-redutase tipo 2)<\/h4>"},{"html":"<p>A di-hidrotestosterona, potencializada localmente pela <strong>5α-redutase 2<\/strong>, é quem <strong>masculiniza a genitália externa bipotencial<\/strong>: tubérculo genital, dobras urogenitais e intumescimentos labioescrotais.<\/p>"},{"html":"<blockquote><p>Pegadinha obrigatória: os ductos de Müller <strong>não precisam de estímulo hormonal<\/strong>. Eles têm desenvolvimento autônomo e se desenvolvem passivamente na simples ausência de AMH. Quem é hormônio-dependente é o ducto de Wolff, que exige testosterona para não regredir. Por isso um feto com gônada ausente ou disgenética ainda assim forma útero e tubas.<\/p><\/blockquote>"},{"html":"<p class=\"figleg\">Organogênese dos genitais internos: MIF inibindo Müller e testosterona estimulando Wolff<\/p>"}]},{"h":"Destino dos ductos e matriz de homologias","blocos":[{"html":"<div class=\"tbl\"><table><thead><tr><th>Ducto mesonéfrico (Wolff)<\/th><th>Ducto paramesonéfrico (Müller)<\/th><\/tr><\/thead><tbody><tr><td><strong>Dependência hormonal:<\/strong> necessita de testosterona das células de Leydig fetais<\/td><td><strong>Desenvolvimento autônomo:<\/strong> na ausência de AMH desenvolve-se passivamente<\/td><\/tr><tr><td><strong>Derivados masculinos:<\/strong> epidídimo, ducto deferente, vesículas seminais, ductos ejaculatórios<\/td><td><strong>Derivados femininos:<\/strong> tubas uterinas, corpo do útero, cérvix e os <strong>2/3 superiores da vagina<\/strong><\/td><\/tr><tr><td><strong>No sexo feminino:<\/strong> regride, restando o <strong>ducto de Gartner<\/strong> e os <strong>cistos epoóforos<\/strong><\/td><td><strong>Integração com o seio urogenital:<\/strong> o <strong>1/3 inferior da vagina<\/strong> vem da placa vaginal do seio urogenital<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A vagina, portanto, tem <strong>dupla origem embriológica<\/strong> — e é exatamente na junção entre os dois territórios que se instala o septo vaginal transverso.<\/p>"},{"html":"<p class=\"figleg\">Matriz de homologia: origem embrionária, derivado masculino e derivado feminino<\/p>"},{"html":"<p>As homologias mais cobradas:<\/p>"},{"html":"<ol><li>Gônada indiferente → testículo | ovário<\/li><li>Ducto de Wolff → epidídimo e ducto deferente | degenera (vestígios de Gartner)<\/li><li>Ducto de Müller → apêndice testicular (vestígio) | tubas, útero e vagina superior<\/li><li>Tubérculo genital → glande do pênis | glande do clitóris<\/li><li>Tumefações labioescrotais → escroto | lábios maiores<\/li><li>Pregas urogenitais → uretra esponjosa | lábios menores<\/li><\/ol>"},{"html":"<p class=\"figleg\">Genitália externa: do estágio indiferenciado da 6ª semana aos destinos da 12ª semana<\/p>"},{"html":"<h3>Descida ovariana e o gubernáculo<\/h3>"},{"html":"<p>Entre a 7ª e a 12ª semana os ovários migram da parede abdominal dorsal para a pelve, tracionados pelo <strong>gubernáculo<\/strong>. A porção <strong>cranial<\/strong> desse cordão torna-se o <strong>ligamento ovariano<\/strong>; a porção <strong>caudal<\/strong> torna-se o <strong>ligamento redondo do útero<\/strong>, que percorre o canal inguinal até os grandes lábios. Esse trajeto explica manifestações inguinais de patologia pélvica na mulher.<\/p>"}]},{"h":"Fisiogênese do útero: três fases, três grupos de anomalias","blocos":[{"html":"<p>A organogênese uterina é a chave que decodifica toda a classificação das malformações — bloqueio em cada fase gera um padrão específico.<\/p>"},{"html":"<ol><li><strong>Organogênese (6ª a 9ª semana):<\/strong> formação bilateral dos ductos paramesonéfricos, com progressão craniocaudal paralela ao sistema urinário. Bloqueio → <strong>agenesia/hipoplasia<\/strong> ou, se unilateral, <strong>útero unicorno<\/strong>.<\/li><li><strong>Fusão medial (9ª a 12ª semana):<\/strong> os segmentos distais e médios fundem-se na linha média formando o primórdio uterovaginal. Bloqueio → <strong>útero didelfo ou bicorno<\/strong>.<\/li><li><strong>Reabsorção septal (12ª a 20ª semana):<\/strong> o septo fibromuscular central é reabsorvido gradualmente <strong>de caudal para cranial<\/strong>. Bloqueio → <strong>útero septado<\/strong>, completo se a interrupção for precoce, incompleto se tardia.<\/li><\/ol>"},{"html":"<p>Note que a porção cranial dos ductos <strong>nunca se funde<\/strong>: permanece aberta em forma de funil e origina as tubas uterinas.<\/p>"},{"html":"<p class=\"figleg\">Organogênese do trato: porção cranial, porção caudal e seio urogenital<\/p>"}]},{"h":"Classificação ASRM versus ESHRE/ESGE","blocos":[{"html":"<p class=\"figleg\">Classificação ASRM (MAC2021) e ESHRE/ESGE por mecanismo embriológico<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Categoria<\/th><th>Mecanismo embriológico<\/th><th>ASRM (MAC2021)<\/th><th>ESHRE/ESGE<\/th><\/tr><\/thead><tbody><tr><td>Agenesia / hipoplasia<\/td><td>Falha de organogênese inicial<\/td><td>Agenesia mülleriana (MRKH)<\/td><td><strong>U5<\/strong> (aplastic)<\/td><\/tr><tr><td>Útero unicorno<\/td><td>Falha de desenvolvimento unilateral<\/td><td>Unicornuate (com/sem corno)<\/td><td><strong>U4<\/strong> (hemi-uterus)<\/td><\/tr><tr><td>Didelfo / bicorno<\/td><td>Falha de fusão medial (total ou parcial)<\/td><td>Uterus didelphys / bicornuate<\/td><td><strong>U3<\/strong> (bicorporeal)<\/td><\/tr><tr><td>Útero septado<\/td><td>Falha de reabsorção do septo<\/td><td>Septate uterus (incompleto/completo)<\/td><td><strong>U2<\/strong> (septate)<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p>Regra mnemônica de prova: <strong>U2 = septo (reabsorção), U3 = fusão, U4 = unilateral, U5 = ausência<\/strong>. Basta lembrar o mecanismo para deduzir a classe.<\/p><\/blockquote>"},{"html":"<h3>Prevalência e impacto reprodutivo<\/h3>"},{"html":"<ul><li>Útero septado — <strong>35%<\/strong><\/li><li>Útero bicorno — 25%<\/li><li>Útero arqueado — 18%<\/li><li>Útero didelfo — 11%<\/li><li>Agenesia / unicorno — 11%<\/li><\/ul>"},{"html":"<blockquote><p>A anomalia mais frequente é também a de maior impacto obstétrico e a de melhor resposta cirúrgica: o <strong>útero septado<\/strong> tem o maior índice de <strong>perda gestacional recorrente<\/strong>, com abortamentos de 1º e 2º trimestres, e a <strong>ressecção histeroscópica do septo restaura os desfechos obstétricos<\/strong>. Nas demais anomalias a conduta costuma ser expectante.<\/p><\/blockquote>"},{"html":"<p>O grande divisor de águas prático é septado <em>versus<\/em> bicorno: ambos têm duas cavidades, mas o <strong>contorno fúndico externo é normal no septado<\/strong> e entalhado no bicorno. Só o primeiro é candidato à metroplastia histeroscópica.<\/p>"}]},{"h":"Síndrome de MRKH e as obstruções ao fluxo menstrual","blocos":[{"html":"<h3>Mayer-Rokitansky-Küster-Hauser<\/h3>"},{"html":"<p>Agenesia mülleriana em paciente <strong>46,XX<\/strong>, com ovários funcionantes e, portanto, <strong>caracteres sexuais secundários normais<\/strong>. É a <strong>segunda causa mais comum de amenorreia primária<\/strong>. Fenótipos:<\/p>"},{"html":"<ul><li><strong>Tipo 1:<\/strong> agenesia uterovaginal isolada.<\/li><li><strong>Tipo 2 (MURCS):<\/strong> associação com anomalias <strong>renais<\/strong>, <strong>cervicotorácicas<\/strong> (displasia tipo Klippel-Feil) e <strong>cardíacas<\/strong>.<\/li><\/ul>"},{"html":"<p><strong>Manejo:<\/strong> neovagina <strong>não cirúrgica<\/strong> por <strong>dilatação de Frank<\/strong> como primeira linha; as técnicas cirúrgicas (McIndoe, Vecchietti, colpoplastia intestinal) ficam reservadas às falhas, por acrescentarem morbidade. O suporte psicológico é parte do tratamento.<\/p>"},{"html":"<h3>Amenorreia primária com dor cíclica<\/h3>"},{"html":"<p>Quadro clássico de fixação: adolescente com <strong>amenorreia primária, dor pélvica cíclica e massa palpável em abdome inferior<\/strong>. A hipótese principal é <strong>hímen imperfurado ou septo vaginal transverso obstrutivo com hematocolpo<\/strong> — a dor é cíclica justamente porque o endométrio é funcionante e o sangue não escoa. A conduta inicial é o <strong>exame físico pélvico<\/strong> (membrana abaulada e azulada) seguido de <strong>ultrassom pélvico<\/strong>.<\/p>"},{"html":"<blockquote><p>Diferencial rápido: MRKH cursa com amenorreia primária <strong>sem<\/strong> dor cíclica (não há endométrio funcionante); obstrução cursa <strong>com<\/strong> dor cíclica e massa. Corno rudimentar funcionante não comunicante entra nesse mesmo grupo doloroso.<\/p><\/blockquote>"}]},{"h":"Diagnóstico por imagem","blocos":[{"html":"<div class=\"tbl\"><table><thead><tr><th>Método<\/th><th>Papel<\/th><th>Detalhe cobrado<\/th><\/tr><\/thead><tbody><tr><td><strong>Ultrassom 3D<\/strong><\/td><td><strong>Padrão-ouro<\/strong><\/td><td>Avalia simultaneamente o contorno miometrial externo e a cavidade endometrial no <strong>plano coronal<\/strong>; sensibilidade <strong>&gt; 98%<\/strong>, sem invasividade<\/td><\/tr><tr><td>Ressonância magnética<\/td><td>Anomalias complexas<\/td><td>Suspeita de agenesia e obstruções vaginais; caracteriza o contorno fúndico e a associação com malformações renais<\/td><\/tr><tr><td>Histeroscopia e laparoscopia<\/td><td>Dúvida residual e tratamento<\/td><td>Reservadas para casos indefinidos ou para a cirurgia definitiva (metroplastia histeroscópica no septado)<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A investigação de qualquer anomalia mülleriana deve incluir <strong>ultrassom de vias urinárias<\/strong>, pela associação embriológica com o sistema renal.<\/p>"}]},{"h":"Distúrbios do desenvolvimento sexual (DDS)","blocos":[{"html":"<p>O consenso LWPES/ESPE de 2006 (Hughes IA et al., <em>Arch Dis Child<\/em>) substituiu a nomenclatura antiga por quatro grandes grupos:<\/p>"},{"html":"<ul><li><strong>Anomalias do desenvolvimento gonadal<\/strong> — disgenesia gonadal XX/XY, agenesia testicular, hermafroditismo verdadeiro, hipoplasia de células de Leydig. Testosterona baixa, derivados müllerianos presentes ou não.<\/li><li><strong>DDS 46,XX<\/strong> (antigo pseudo-hermafroditismo feminino) — induzido por andrógenos (deficiência da <strong>21-hidroxilase<\/strong>) ou indeterminado.<\/li><li><strong>DDS 46,XY<\/strong> (antigo pseudo-hermafroditismo masculino) — defeito de síntese, de metabolização ou de ação da testosterona, ou defeito de síntese/ação do AMH.<\/li><li><strong>Formas não classificadas.<\/strong><\/li><\/ul>"},{"html":"<h3>Roteiro diagnóstico da genitália ambígua<\/h3>"},{"html":"<ol><li>História clínica (herança, PIG, iatrogenia) e exame físico (gônadas palpáveis, orifícios).<\/li><li>Imagem da genitália interna: <strong>UCR, ultrassom, cistoscopia<\/strong>.<\/li><li>Avaliação cromossômica: <strong>cariótipo, FISH, gene SRY por PCR<\/strong>.<\/li><li>Avaliação hormonal basal (Na, K, LH, FSH, ACTH, 17OHP, 17PREG, PROG, DHEA, DHEAS, 4A, testosterona, DHT, cortisol, composto S, aldosterona, APR) e <strong>após estímulo com ACTH e hCG<\/strong>.<\/li><li>Avaliação molecular dos genes da determinação e diferenciação sexual.<\/li><\/ol>"},{"html":"<h3>As entidades de maior peso em prova<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Entidade<\/th><th>Marca diagnóstica<\/th><\/tr><\/thead><tbody><tr><td><strong>HAC por deficiência da 21-hidroxilase<\/strong><\/td><td><strong>Causa mais frequente de ambiguidade genital<\/strong>; <strong>95%<\/strong> dos casos de HAC. Forma clássica: <strong>17OHP basal &gt; 60 ng/mL<\/strong>; não clássica: <strong>&gt; 10 ng/mL após ACTH<\/strong><\/td><\/tr><tr><td><strong>Deficiência da 5α-redutase 2<\/strong><\/td><td>Relação <strong>T/DHT &gt; 26 basal<\/strong> e <strong>&gt; 36 após hCG<\/strong>; virilização importante na puberdade<\/td><\/tr><tr><td><strong>Insensibilidade aos andrógenos (SIA)<\/strong><\/td><td><strong>Causa mais comum de DDS 46,XY<\/strong>; testosterona normal ou alta, LH elevado, derivados müllerianos ausentes<\/td><\/tr><tr><td><strong>DDS 46,XY por deficiência da 17-OH<\/strong><\/td><td><strong>Hipertensão<\/strong>, progesterona elevada e testosterona baixa<\/td><\/tr><tr><td><strong>Hermafroditismo verdadeiro<\/strong><\/td><td>Tecido testicular <strong>e<\/strong> ovariano; ginecomastia em todos; genitália interna segue a <strong>gônada ipsilateral<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>As mutações do gene <strong>CYP21<\/strong> são agrupadas pelo comprometimento enzimático residual: <strong>A<\/strong> (atividade nula) e <strong>B<\/strong> (severo, ~2%) correspondem à forma clássica; <strong>C<\/strong> (moderado, 20–50%) à forma não clássica.<\/p>"},{"html":"<p>O tratamento dos DDS é sempre tripartite: <strong>psicológico, clínico e cirúrgico<\/strong>, conduzido por equipe multidisciplinar.<\/p>"}]}]},{"slug":"distopia-genital","titulo":"Distopia Genital","disciplina":"GO","eyebrow":"Ginecologia e Obstetrícia · Uroginecologia","questoes":[{"id":"9cea894b44","q":"O que caracteriza a distopia genital?","opts":["Deslocamento caudal das vísceras pélvicas em direção ao hiato genital","Deslocamento cranial das vísceras pélvicas em direção ao abdome","Retroversão uterina fixa por aderências do fundo de saco posterior","Dilatação anormal do canal cervical com exteriorização do endométrio"],"c":0,"exp":"A distopia genital é o deslocamento das vísceras no sentido caudal, em direção ao hiato genital. Decorre do desequilíbrio entre as forças que mantêm os órgãos pélvicos em posição e aquelas que tendem a impeli-los para fora da pelve. Envolve o descenso da parede vaginal anterior e/ou posterior, do ápice (colo/útero) ou da cúpula vaginal após histerectomia.","ref":[0,0]},{"id":"bbc70762de","q":"A cistocele corresponde ao prolapso de qual estrutura?","opts":["Parede vaginal anterior, com descida da bexiga","Parede vaginal posterior, com descida do reto","Ápice vaginal, com descida da cúpula vaginal","Fundo de saco, com descida de alças intestinais"],"c":0,"exp":"A cistocele é o prolapso do compartimento anterior: a parede vaginal anterior desce arrastando a bexiga. É o defeito mais frequente, porque a parede vaginal anterior é a mais comumente acometida no prolapso de órgãos pélvicos.","ref":[4,1]},{"id":"5623dbbba2","q":"Mulher de 68 anos refere sensação de bola na vagina e dificuldade para evacuar. Ao exame há abaulamento da parede vaginal posterior. Qual o diagnóstico?","opts":["Retocele, por defeito do compartimento posterior","Cistocele, por defeito do compartimento anterior","Enterocele, por defeito do compartimento apical","Uretrocele, por defeito do compartimento distal"],"c":0,"exp":"A retocele é o prolapso da parede vaginal posterior, com protrusão do reto. O quadro típico reúne sensação de vagina larga, sensação de bola na vagina, dificuldade evacuatória, constipação crônica e peso ou pressão na vagina e no períneo.","ref":[4,12]},{"id":"9504c2e9f5","q":"Quais prolapsos pertencem ao compartimento apical?","opts":["Prolapso uterino, de cúpula vaginal e enterocele","Cistocele, uretrocele e defeito paravaginal","Retocele, rotura perineal e defeito distal","Cistocele central, retocele e defeito lateral"],"c":0,"exp":"Pensando por compartimentos: o apical reúne o prolapso uterino, o prolapso de cúpula vaginal (pós-histerectomia) e a enterocele. O anterior corresponde à cistocele, o posterior à retocele, e o distal à insuficiência do corpo perineal associada à retocele.","ref":[4,1]},{"id":"753855f410","q":"Qual a faixa etária de pico de incidência do prolapso de órgãos pélvicos?","opts":["Entre 70 e 79 anos","Entre 30 e 39 anos","Entre 40 e 49 anos","Entre 50 e 59 anos"],"c":0,"exp":"O pico de incidência do prolapso de órgãos pélvicos ocorre entre 70 e 79 anos, e a condição afeta cerca de 50% das mulheres idosas. Cerca de 25% das mulheres norte-americanas apresentam alguma desordem do assoalho pélvico, incluindo prolapso, incontinência urinária ou fecal.","ref":[1,0]},{"id":"9a194b8411","q":"Qual parede vaginal é mais frequentemente acometida no prolapso de órgãos pélvicos?","opts":["A parede vaginal anterior","A parede vaginal posterior","O ápice vaginal isolado","O terço distal posterior"],"c":0,"exp":"A parede vaginal anterior é a mais frequentemente afetada, o que explica a alta prevalência da cistocele. O estádio 2 é o de maior frequência, e nos Estados Unidos são realizadas cerca de 400.000 cirurgias por ano para correção de prolapso.","ref":[1,0]},{"id":"78f53f90d3","q":"Qual fator de risco para prolapso genital está diretamente ligado ao trauma obstétrico?","opts":["Parto vaginal, sobretudo com uso de fórceps","Cesárea eletiva antes do trabalho de parto","Amamentação prolongada por mais de um ano","Uso de contraceptivo hormonal combinado"],"c":0,"exp":"O parto vaginal é o fator de risco mais associado ao prolapso, e o parto instrumentado com fórceps agrava o risco. O trauma do parto produz lesão muscular direta, lesão fascial e compressão ou estiramento nervoso, comprometendo tanto a sustentação quanto a inervação do assoalho pélvico. Multiparidade, idade acima de 60 anos e cirurgia prévia para prolapso completam o quadro.","ref":[1,3]},{"id":"f81da4a095","q":"Quais doenças hereditárias do tecido conjuntivo aumentam o risco de prolapso genital?","opts":["Síndromes de Ehlers-Danlos e de Marfan","Síndromes de Turner e de Kallmann","Síndromes de Sheehan e de Asherman","Síndromes de Rokitansky e de Morris"],"c":0,"exp":"Desordens do colágeno e da elastina, como a síndrome de Ehlers-Danlos, a hipermobilidade articular e a síndrome de Marfan, predispõem ao prolapso por fragilidade do tecido conjuntivo endopélvico. Menopausa com hipoestrogenismo, história familiar e etnia também compõem o perfil de risco.","ref":[1,2]},{"id":"4c5acc13c4","q":"Quais condições elevam a pressão intra-abdominal e favorecem o prolapso genital?","opts":["Obesidade, obstipação e tosse crônica","Anemia, hipotireoidismo e astenia","Hipotensão, bradicardia e síncope","Osteoporose, artralgia e escoliose"],"c":0,"exp":"Obesidade, obstipação intestinal e tosse crônica (DPOC) aumentam de forma sustentada a pressão intra-abdominal, sobrecarregando o assoalho pélvico. Recém-nascido de peso elevado em parto anterior atua pelo mesmo mecanismo de sobrecarga somado ao trauma do parto.","ref":[1,2]},{"id":"d91839b189","q":"Na analogia dos dois pilares do suporte pélvico, o que corresponde aos cabos que trabalham sob tensão?","opts":["Os ligamentos uterossacros e transversos","A musculatura do assoalho pélvico","Os ossos e as articulações da pelve","A mucosa e a submucosa da vagina"],"c":0,"exp":"Só os ligamentos formam o aparelho de suspensão, trabalhando como cabos sob tensão. A fáscia endopélvica pertence ao aparelho de sustentação, junto ao músculo elevador do ânus, que faz o papel dos pilares de apoio. Quando os cabos falham, a carga recai sobre os pilares, e a falha combinada produz o prolapso.","cap":"Suspensão e sustentação como cabos e pilares","ref":[2,2]},{"id":"133067cb95","q":"Quais músculos compõem o músculo elevador do ânus?","opts":["Pubococcígeo e ileococcígeo","Bulboesponjoso e isquiocavernoso","Transverso profundo e piriforme","Obturador interno e psoas maior"],"c":0,"exp":"O elevador do ânus é formado pelos feixes pubococcígeo e ileococcígeo e, com o músculo coccígeo e o arco tendíneo da pelve, constitui o aparelho de sustentação do assoalho pélvico. Esses músculos mantêm o hiato genital fechado e geram forças de elevação que impedem a descida dos órgãos pélvicos.","ref":[2,2]},{"id":"8a28e88803","q":"Quais estruturas fazem parte da fáscia endopélvica?","opts":["Paracolpo, septo retovaginal e anel pericervical","Ligamento redondo, largo e infundibulopélvico","Membrana obturadora, psoas e ilíaco interno","Corpo perineal, hímen e bulbo vestibular"],"c":0,"exp":"A fáscia endopélvica inclui os paramétrios (ligamentos pubovesicouterinos, transversos e uterossacros), o paracolpo, o septo retovaginal, a fáscia vesicovaginal e o anel pericervical. Trata-se de lâminas de tecido conjuntivo fibroso entre as vísceras, as paredes musculares e o assoalho da pelve.","ref":[2,2]},{"id":"a901181fa0","q":"Quais estruturas prolapsam quando há falha do nível I de suporte vaginal?","opts":["Útero, cúpula vaginal e alças intestinais","Paredes vaginais anterior e posterior","Corpo perineal e esfíncter anal externo","Uretra distal e ligamentos periuretrais"],"c":0,"exp":"O nível I é o suporte apical, sustentado pelos ligamentos uterossacros e cardinais. Sua falha permite o prolapso uterino, o prolapso de cúpula vaginal e a enterocele, com herniação de alças intestinais pelo fundo de saco.","ref":[3,2]},{"id":"ef5891a553","q":"A falha do nível II de suporte vaginal produz quais prolapsos?","opts":["Cistocele e retocele, das paredes vaginais","Prolapso uterino e de cúpula vaginal","Enterocele e prolapso do fundo de saco","Rotura perineal e hipermobilidade uretral"],"c":0,"exp":"O nível II corresponde ao suporte lateral das paredes vaginais, ancorado no arco tendíneo da fáscia pélvica. Sua falha gera prolapso das paredes vaginais anterior e posterior, ou seja, cistocele e retocele.","ref":[3,2]},{"id":"440630a1d7","q":"Quais estruturas são acometidas na falha do nível III de suporte vaginal?","opts":["Corpo perineal e fáscia periuretral","Ligamentos uterossacros e cardinais","Cúpula vaginal e fundo de saco","Arco tendíneo e músculo coccígeo"],"c":0,"exp":"O nível III é o suporte distal, correspondente à fusão da vagina com o corpo perineal, a uretra e o períneo. Sua falha produz insuficiência do corpo perineal e hipermobilidade uretral, por comprometimento dos ligamentos e das fáscias periuretrais.","ref":[3,2]},{"id":"2b080d985e","q":"Qual lesão anatômica origina a cistocele?","opts":["Ruptura ou desinserção da fáscia vesicovaginal","Ruptura do septo retovaginal e do corpo perineal","Alongamento dos ligamentos uterossacros","Herniação do peritônio do fundo de saco"],"c":0,"exp":"A cistocele decorre da lesão da fáscia vesicovaginal, seja por ruptura da própria fáscia (defeito central), seja por destacamento do arco tendíneo da pelve (defeito lateral ou paravaginal). Essa distinção define a técnica cirúrgica de correção.","ref":[4,3]},{"id":"e3f941730f","q":"A protrusão exteriorizada pelo intróito mostrada na figura envolve a parede vaginal anterior. A que prolapso ela corresponde?","opts":["Cistocele — descida da bexiga","Retocele — descida do reto","Enterocele — descida de alças","Histerocele — descida do útero"],"c":0,"exp":"O abaulamento da parede vaginal anterior exteriorizando-se pelo intróito caracteriza a cistocele, com descida da bexiga. O prolapso da parede posterior seria retocele, e a herniação de alças pelo fundo de saco de Douglas, enterocele.","cap":"Prolapso da parede vaginal anterior","ref":[5,1]},{"id":"68f2644852","q":"Qual a principal limitação da colporrafia anterior clássica?","opts":["Não corrige o defeito lateral paravaginal","Não corrige o defeito central da fáscia","Não permite ressecção da mucosa vaginal","Não pode ser realizada por via vaginal"],"c":0,"exp":"A colporrafia anterior consiste na plicatura medial da fáscia vesicovaginal com ressecção do excesso de mucosa vaginal, tratando portanto o defeito central. Não corrige o defeito lateral (paravaginal) e traz risco de dispareunia, fibrose e dor no pós-operatório.","ref":[4,4]},{"id":"f90b58fc9a","q":"Como se corrige o defeito lateral (paravaginal) da cistocele por via vaginal?","opts":["Fixação da fáscia ao arco tendíneo da pelve","Plicatura medial da fáscia vesicovaginal","Fixação do útero ao ligamento sacroespinhoso","Sutura em bolsa do fundo de saco de Douglas"],"c":0,"exp":"No defeito lateral houve destacamento da fáscia do arco tendíneo da pelve; a correção reancora a fáscia nesse arco, por via vaginal ou abdominal. A plicatura medial trata apenas o defeito central e não resolve o descolamento lateral.","ref":[4,4]},{"id":"edeffe6a1c","q":"Por que a enterocele é considerada uma hérnia verdadeira?","opts":["Há herniação do fundo de saco de Douglas","Há herniação da bexiga pela parede anterior","Há herniação do reto pelo septo retovaginal","Há herniação do útero pelo hiato genital"],"c":0,"exp":"A enterocele é hérnia verdadeira porque há herniação do fundo de saco de Douglas, com saco peritoneal contendo alças intestinais. Os demais prolapsos correspondem a falhas de suporte das paredes vaginais, sem saco herniário peritoneal.","ref":[4,6]},{"id":"cf6308874b","q":"Quais procedimentos aumentam o risco de enterocele?","opts":["Histerectomia e cirurgia de Burch","Colporrafia posterior e perineoplastia","Traquelectomia e conização do colo","Colpocleise e miorrafia dos elevadores"],"c":0,"exp":"A histerectomia e a cirurgia de Burch são fatores de risco para enterocele porque anteriorizam o eixo vaginal, expondo o fundo de saco de Douglas à pressão abdominal. A prevenção se faz por procedimentos de obliteração do fundo de saco no mesmo ato cirúrgico.","ref":[4,6]},{"id":"1249805713","q":"A culdoplastia de McCall, usada na prevenção da enterocele, consiste em:","opts":["Aproximar os ligamentos uterossacros englobando o peritônio","Realizar suturas longitudinais sobre o peritônio pélvico","Fixar a cúpula vaginal ao ligamento sacroespinhoso direito","Suturar em bolsa concêntrica o fundo de saco posterior"],"c":0,"exp":"A culdoplastia de McCall aproxima os ligamentos uterossacros englobando o peritônio, obliterando o fundo de saco. As suturas longitudinais no peritônio correspondem à técnica de Halban, e as suturas concêntricas em bolsa, ao procedimento de Moschcowitz.","ref":[4,8]},{"id":"5e5644f85f","q":"Qual procedimento para correção do defeito apical é realizado por via abdominal?","opts":["Colpossacrofixação (promontofixação)","Fixação no ligamento sacroespinhoso","Culdoplastia de McCall pela vagina","Colpocleise de Le Fort pela vagina"],"c":0,"exp":"A colpossacrofixação, ou promontofixação, é a correção apical por via abdominal, fixando a cúpula vaginal ao promontório sacral. A fixação no ligamento sacroespinhoso e a culdoplastia são realizadas por via vaginal.","ref":[4,9]},{"id":"a8f69c4ebc","q":"Qual a taxa aproximada de recidiva na correção cirúrgica do defeito apical?","opts":["Acima de 30% dos casos","Abaixo de 1% dos casos","Cerca de 5% dos casos","Cerca de 10% dos casos"],"c":0,"exp":"A recidiva do defeito apical ultrapassa 30% dos casos. Contribuem a idade avançada das pacientes, as comorbidades clínicas, os ligamentos fracos ou inadequados para fixação, o tecido conjuntivo de má qualidade e a associação frequente com cistocele e retocele.","ref":[4,10]},{"id":"351b476bdc","q":"Quais os resultados esperados da colporrafia posterior clássica?","opts":["Insucesso de 25% e dispareunia de 12% a 27%","Insucesso de 70% e dispareunia de 50% a 60%","Insucesso de 2% e dispareunia de 1% a 3%","Insucesso de 45% e dispareunia acima de 80%"],"c":0,"exp":"A colporrafia posterior apresenta insucesso em torno de 25% e dispareunia pós-operatória em 12% a 27% das pacientes, com melhora dos distúrbios evacuatórios em cerca de 75%. O estreitamento do intróito sem suporte adequado da parede posterior é uma de suas complicações.","ref":[4,13]},{"id":"8b01dd7a4a","q":"Na rotura perineal obstétrica, qual estrutura está lesada no grau III?","opts":["O esfíncter externo do ânus","A mucosa retal e o reto","A pele e a mucosa vaginal","O músculo bulboesponjoso"],"c":0,"exp":"A rotura perineal de grau III envolve lesão do esfíncter externo do ânus. Graus menores atingem pele, mucosa vaginal e musculatura perineal sem comprometer o esfíncter; a extensão à mucosa retal caracteriza o grau IV, com risco de incontinência anal.","cap":"Rotura perineal com lesão esfincteriana","ref":[4,15]},{"id":"ed558129aa","q":"O que representa o ponto Aa no sistema POP-Q?","opts":["Parede anterior, 3 cm proximal ao meato uretral","Parede posterior, 3 cm proximal ao anel himenal","Ponto mais distal de toda a parede vaginal anterior","Extremidade mais distal do colo ou da cúpula vaginal"],"c":0,"exp":"O ponto Aa fica na parede vaginal anterior, 3 cm proximal ao meato uretral externo, correspondendo aproximadamente à junção uretrovesical, e varia de -3 a +3 cm. O ponto mais distal da parede anterior é o Ba, que na ausência de prolapso está em -3 cm.","ref":[6,4]},{"id":"ac17fd747f","q":"Como são registrados os pontos do POP-Q em relação ao plano do hímen?","opts":["Negativos acima e positivos abaixo do hímen","Positivos acima e negativos abaixo do hímen","Sempre positivos, medidos a partir do meato","Sempre negativos, medidos a partir do ânus"],"c":0,"exp":"O hímen é o ponto fixo de referência, definido como zero. Os pontos proximais (acima do hímen) recebem valores negativos e os distais (abaixo do hímen) valores positivos, o que permite quantificar objetivamente o grau de descenso.","ref":[6,3]},{"id":"6996f7b080","q":"O que representam os pontos C e D no sistema POP-Q?","opts":["Extremidade da cérvix e fundo de saco posterior","Meato uretral externo e junção uretrovesical","Hiato genital e comprimento vaginal total","Corpo perineal e margem do orifício anal"],"c":0,"exp":"O ponto C é a extremidade mais distal da cérvix, ou o fundo de saco vaginal após histerectomia total; o ponto D corresponde ao fórnix posterior (fundo de saco de Douglas), onde os ligamentos uterossacros se inserem na cérvix. O ponto D é omitido na ausência de colo uterino.","ref":[6,4]},{"id":"78cd97d043","q":"Quais os valores médios do hiato genital e do comprimento vaginal total?","opts":["Hiato de 4 a 5 cm e comprimento de 8 a 10 cm","Hiato de 8 a 10 cm e comprimento de 4 a 5 cm","Hiato de 1 a 2 cm e comprimento de 15 a 18 cm","Hiato de 6 a 7 cm e comprimento de 20 a 22 cm"],"c":0,"exp":"O hiato genital (distância entre o meato uretral e a fúrcula vaginal) mede em média 4 a 5 cm, assim como o corpo perineal (da fúrcula ao ânus). O comprimento vaginal total situa-se entre 8 e 10 cm.","ref":[6,4]},{"id":"69cd3b70e4","q":"Na grade de nove células usada para registrar o POP-Q, qual medida ocupa a célula central?","opts":["O corpo perineal (CP)","O hiato genital (HG)","O comprimento total (CVT)","O ponto cervical (C)"],"c":0,"exp":"A grade tem na primeira linha Aa, Ba e C; na linha do meio o hiato genital, o corpo perineal e o comprimento vaginal total; e na última linha Ap, Bp e D. A célula central é ocupada pelo corpo perineal.","cap":"Grade de registro das medidas do POP-Q","ref":[6,5]},{"id":"8413b9d4d0","q":"No sistema de Baden-Walker, o que caracteriza o grau 2 de prolapso?","opts":["Maior prolapso no nível da carúncula himenal","Maior prolapso acima da carúncula himenal","Maior prolapso ultrapassando o hímen, parcial","Eversão completa da vagina para fora do hímen"],"c":0,"exp":"No sistema de Baden-Walker, o grau 0 não tem prolapso, o grau 1 mantém o ponto de maior prolapso acima da carúncula himenal, o grau 2 o coloca no mesmo plano da carúncula, o grau 3 ultrapassa o hímen de forma parcial e o grau 4 corresponde à eversão completa.","cap":"Baden-Walker e POP-Q comparados ao anel himenal","ref":[6,8]},{"id":"589b37242d","q":"O que define o estádio 4 do prolapso de órgãos pélvicos?","opts":["Eversão completa, com exteriorização total","Ausência de qualquer descida dos órgãos","Descida até 1 cm acima do anel himenal","Descida até o plano médio da vagina"],"c":0,"exp":"O estádio 4 corresponde à eversão completa, com exteriorização total do órgão prolapsado para fora do hímen. Os estádios intermediários acompanham a posição da borda do prolapso em relação ao anel himenal, e o estádio 0 indica ausência de prolapso.","cap":"Estadiamento do prolapso uterino, de 0 a IV","ref":[6,8]},{"id":"726f452217","q":"Como se define o alongamento hipertrófico do colo uterino?","opts":["Histerometria cervical acima de 5 cm","Histerometria cervical abaixo de 2 cm","Hiato genital acima de 8 cm ao esforço","Comprimento vaginal total abaixo de 6 cm"],"c":0,"exp":"O alongamento hipertrófico do colo é definido por histerometria do canal cervical acima de 5 cm, ou por diferença entre os pontos C e D maior que 4 cm no POP-Q. O tratamento é a traquelectomia, com amputação do colo, em prolapsos de grau I ou II.","ref":[6,11]},{"id":"3d0ff894a5","q":"Quais medidas compõem o tratamento conservador do prolapso genital?","opts":["Exercícios de Kegel, cones vaginais e pessários","Histerectomia vaginal e cirurgia reparadora","Promontofixação e fixação sacroespinhosa","Colporrafia anterior e posterior com telas"],"c":0,"exp":"O tratamento conservador reúne fisioterapia do assoalho pélvico com exercícios de Kegel, cones vaginais e biofeedback, além dos pessários, que atuam por sustentação, suporte ou preenchimento. As demais alternativas descrevem condutas cirúrgicas.","ref":[7,1]},{"id":"4beff0ad2e","q":"Para qual perfil de paciente a colpocleise de Le Fort é a opção indicada?","opts":["Idosa sem atividade sexual e com alto risco","Jovem com desejo de gestação em curto prazo","Adulta com vida sexual ativa e nulípara","Gestante no terceiro trimestre com prolapso"],"c":0,"exp":"A colpocleise de Le Fort é uma cirurgia obliterativa que fecha o canal vaginal, indicada para pacientes idosas sem atividade sexual e com risco cirúrgico elevado. Quando há desejo de preservar o útero, opta-se por cirurgia de Manchester ou histeropexia.","ref":[7,5]},{"id":"323ba3aac8","q":"Qual a recomendação atual sobre o uso de telas na correção do prolapso genital?","opts":["Reservado principalmente para casos de recidiva","Indicado como primeira escolha em todos os casos","Contraindicado de forma absoluta em qualquer caso","Recomendado apenas em pacientes nulíparas jovens"],"c":0,"exp":"O uso de telas permanece controverso na literatura e entre as sociedades internacionais, sendo reservado na maioria das situações para casos de recidiva. A escolha da cirurgia leva em conta ainda o desejo de histeropreservação e a manutenção da atividade sexual.","ref":[7,5]},{"id":"ed784d08eb","q":"Qual ligamento pélvico é o principal responsável pela suspensão apical do útero?","opts":["O ligamento uterossacro","O ligamento redondo","O ligamento suspensor","O ligamento inguinal"],"c":0,"exp":"Os ligamentos uterossacros, junto aos ligamentos cardinais (transversos), formam o suporte apical do útero e da cúpula vaginal, o nível I de sustentação. O ligamento redondo mantém a anteroversão uterina, mas não sustenta o ápice contra a pressão abdominal.","cap":"Ligamentos uterinos em visão superior","ref":[3,2]}],"resumo":[{"h":"Definição e importância do problema","blocos":[{"html":"<p><strong>Distopia genital<\/strong> é o deslocamento das vísceras pélvicas no sentido caudal, em direção ao hiato genital. Ela não é um evento isolado de um órgão, e sim a expressão do <strong>desequilíbrio entre as forças que mantêm os órgãos pélvicos em sua posição normal e aquelas que tendem a impeli-los para fora da pelve<\/strong>. Traduz-se pelo descenso da parede vaginal anterior e/ou posterior, do ápice vaginal (colo e útero) ou da cúpula vaginal, quando a paciente já foi submetida a histerectomia.<\/p>"},{"html":"<p>O tema importa porque o deslocamento dos órgãos não fica confinado ao desconforto mecânico: ele pode resultar em <strong>incontinência urinária e em outras disfunções da micção<\/strong>. A função vesicouretral depende de mecanismos complexos que vão do córtex cerebral à musculatura vesicouretral, envolvendo o sistema simpático e o parassimpático, controles voluntários e involuntários e mediadores citoquímicos. A preservação da função renal é o desfecho maior por trás de tudo isso.<\/p>"},{"html":"<p class=\"figleg\">Relação anatômica entre útero, bexiga, reto e assoalho pélvico<\/p>"},{"html":"<blockquote><p>Prolapso genital é todo deslocamento caudal dos órgãos pélvicos — uretra, bexiga, útero, alças intestinais e reto — através da vagina, em diferentes graus.<\/p><\/blockquote>"}]},{"h":"Epidemiologia e fatores de risco","blocos":[{"html":"<p>O prolapso de órgãos pélvicos tem <strong>pico de incidência entre 70 e 79 anos<\/strong> e afeta cerca de <strong>50% das mulheres idosas<\/strong>. Aproximadamente <strong>25% das mulheres norte-americanas<\/strong> apresentam alguma desordem do assoalho pélvico — prolapso, incontinência urinária ou incontinência fecal. O <strong>estádio 2<\/strong> é o mais frequente e a <strong>parede vaginal anterior<\/strong> é a mais comumente acometida. Nos Estados Unidos realizam-se cerca de <strong>400.000 cirurgias por ano<\/strong>, o equivalente a 2,1 em cada 1.000 mulheres.<\/p>"},{"html":"<h3>Os fatores de risco, agrupados por mecanismo<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Mecanismo<\/th><th>Fatores<\/th><\/tr><\/thead><tbody><tr><td>Trauma obstétrico<\/td><td>Parto vaginal, parto com <strong>fórceps<\/strong>, multiparidade, recém-nascido de peso elevado<\/td><\/tr><tr><td>Aumento da pressão intra-abdominal<\/td><td>Obesidade, obstipação crônica, tosse crônica e DPOC<\/td><\/tr><tr><td>Perda de qualidade do tecido conjuntivo<\/td><td>Menopausa e hipoestrogenismo, envelhecimento, Ehlers-Danlos, Marfan, hipermobilidade articular<\/td><\/tr><tr><td>Demográficos e cirúrgicos<\/td><td>Idade acima de 60 anos, história familiar, etnia, cirurgia prévia para prolapso<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p>O <strong>parto vaginal<\/strong> é o fator de risco central: produz, ao mesmo tempo, lesão muscular direta, lesão fascial e compressão ou estiramento nervoso — atinge os três pilares do suporte de uma só vez.<\/p><\/blockquote>"}]},{"h":"O suporte das vísceras pélvicas","blocos":[{"html":"<p>O suporte dos órgãos pélvicos resulta da <strong>interação dinâmica entre três elementos<\/strong>: os ossos da pelve, o tecido conjuntivo endopélvico e a musculatura do assoalho pélvico. Funcionalmente, esses elementos se organizam em dois aparelhos complementares.<\/p>"},{"html":"<h4>Sustentação — os pilares<\/h4>"},{"html":"<p>O <strong>diafragma pélvico<\/strong> é a base ativa: músculos elevadores do ânus (feixes <strong>pubococcígeo<\/strong> e <strong>ileococcígeo<\/strong>), músculos coccígeos e o <strong>arco tendíneo da pelve<\/strong>. A esse conjunto soma-se a <strong>fáscia endopélvica<\/strong>, com os paramétrios (ligamentos pubovesicouterinos, transversos e uterossacros), o paracolpo, o septo retovaginal, a fáscia vesicovaginal e o anel pericervical.<\/p>"},{"html":"<h4>Suspensão — os cabos<\/h4>"},{"html":"<p>Os <strong>ligamentos<\/strong> mantêm os órgãos suspensos às paredes pélvicas, funcionando como cabos sob tensão. Os ligamentos uterossacros e cardinais são os principais responsáveis pela suspensão apical.<\/p>"},{"html":"<p class=\"figleg\">Os dois pilares da sustentação pélvica: cabos e pilares<\/p>"},{"html":"<blockquote><p>Os dois sistemas precisam estar íntegros e funcionando em harmonia. Os músculos elevadores mantêm o <strong>hiato genital fechado<\/strong>; quando há lesão muscular, o hiato se abre, a parede vaginal desce abaixo do hímen e passa a sofrer o diferencial entre a pressão atmosférica e a abdominal. Esse diferencial impõe tensão anormal sobre fáscias e ligamentos — e a falha de um sistema acaba arrastando o outro.<\/p><\/blockquote>"}]},{"h":"Fisiopatogenia e os níveis de suporte","blocos":[{"html":"<p>Três categorias de lesão levam ao prolapso: <strong>denervação do assoalho pélvico<\/strong> (parto vaginal, anormalidades congênitas, discopatias e osteoartrose, demências e doenças do sistema nervoso central), <strong>lesões musculares<\/strong> (lesão neuromuscular, lesão direta das fibras, perda da inserção muscular) e <strong>lesões ligamentares<\/strong> (trauma direto, desordens do colágeno).<\/p>"},{"html":"<p>O prolapso é localizado em relação ao eixo da vagina, em <strong>níveis de suporte<\/strong> que definem o que prolapsa quando cada um falha.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Nível<\/th><th>Estrutura de suporte<\/th><th>O que prolapsa na falha<\/th><\/tr><\/thead><tbody><tr><td><strong>Nível I<\/strong><\/td><td>Ligamentos uterossacros e cardinais (suporte apical)<\/td><td>Útero, cúpula vaginal, alças intestinais (enterocele)<\/td><\/tr><tr><td><strong>Nível II<\/strong><\/td><td>Arco tendíneo e fáscias laterais<\/td><td>Paredes vaginais anterior e posterior — <strong>cistocele<\/strong> e <strong>retocele<\/strong><\/td><\/tr><tr><td><strong>Nível III<\/strong><\/td><td>Corpo perineal, ligamentos e fáscias periuretrais<\/td><td>Corpo do períneo e hipermobilidade uretral<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Níveis de suporte vaginal em visão anatômica<\/p>"}]},{"h":"Os compartimentos e seus prolapsos","blocos":[{"html":"<p>Raciocinar por compartimentos organiza tanto o exame quanto a conduta.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Compartimento<\/th><th>Prolapso<\/th><th>Estrutura que desce<\/th><\/tr><\/thead><tbody><tr><td><strong>Anterior<\/strong><\/td><td>Cistocele<\/td><td>Bexiga, pela parede vaginal anterior<\/td><\/tr><tr><td><strong>Apical<\/strong><\/td><td>Prolapso uterino, prolapso de cúpula, enterocele<\/td><td>Útero, cúpula vaginal, alças intestinais<\/td><\/tr><tr><td><strong>Posterior<\/strong><\/td><td>Retocele<\/td><td>Reto, pela parede vaginal posterior<\/td><\/tr><tr><td><strong>Distal<\/strong><\/td><td>Insuficiência do corpo perineal e retocele<\/td><td>Corpo perineal e parede posterior distal<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<h3>Defeito anterior — cistocele<\/h3>"},{"html":"<p>A cistocele decorre da <strong>lesão da fáscia vesicovaginal<\/strong>, seja por <strong>ruptura da própria fáscia<\/strong> (defeito central), seja por <strong>destacamento do arco tendíneo da pelve<\/strong> (defeito lateral ou paravaginal). Essa distinção é decisiva:<\/p>"},{"html":"<ul><li><strong>Colporrafia anterior<\/strong> (tratamento tradicional): plicatura medial da fáscia vesicovaginal com ressecção do excesso de mucosa vaginal. Trata o defeito central, <strong>não trata o defeito lateral<\/strong>, e traz risco de dispareunia, fibrose e dor pós-operatória.<\/li><li><strong>Defeito lateral<\/strong>: correção por <strong>fixação da fáscia ao arco tendíneo da pelve<\/strong>, por via vaginal ou abdominal.<\/li><\/ul>"},{"html":"<h3>Defeito apical — útero, cúpula e enterocele<\/h3>"},{"html":"<p>A <strong>enterocele<\/strong> é uma <strong>hérnia verdadeira<\/strong>: há herniação do fundo de saco de Douglas, com saco peritoneal contendo alças. Seus fatores de risco são a <strong>histerectomia<\/strong> e a <strong>cirurgia de Burch<\/strong>, ambas por anteriorização do eixo vaginal, que expõe o fundo de saco à pressão abdominal.<\/p>"},{"html":"<p>Prevenção da enterocele, por obliteração do fundo de saco:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Técnica<\/th><th>Descrição<\/th><\/tr><\/thead><tbody><tr><td><strong>Culdoplastia de McCall<\/strong><\/td><td>Aproximação dos ligamentos uterossacros englobando o peritônio<\/td><\/tr><tr><td><strong>Técnica de Halban<\/strong><\/td><td>Suturas longitudinais no peritônio<\/td><\/tr><tr><td><strong>Procedimento de Moschcowitz<\/strong><\/td><td>Suturas concêntricas em bolsa obliterando o fundo de saco<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Tratamento do defeito apical já instalado: traquelectomia (amputação do colo na hipertrofia), histerectomia vaginal com cirurgia reparadora, <strong>fixação no ligamento sacroespinhoso<\/strong> (via vaginal), <strong>colpossacrofixação ou promontofixação<\/strong> (via abdominal) e culdoplastia.<\/p>"},{"html":"<blockquote><p>A correção apical é a mais difícil e a que mais recidiva: <strong>acima de 30% dos casos<\/strong>. Pesam contra o resultado a idade avançada (a maioria acima de 60 anos), as comorbidades, os ligamentos fracos ou inadequados para fixação, o tecido conjuntivo de má qualidade, a associação com cistocele e retocele e a dificuldade do acesso vaginal.<\/p><\/blockquote>"},{"html":"<h3>Defeito posterior — retocele<\/h3>"},{"html":"<p>O quadro clínico da retocele reúne sensação de \"vagina larga\", sensação de bola na vagina, dificuldade para evacuar, constipação crônica e sensação de peso, dor ou pressão na vagina e no períneo.<\/p>"},{"html":"<p>A <strong>colporrafia posterior clássica<\/strong> pode ser feita com ou sem miorrafia dos elevadores do ânus e com ou sem perineoplastia. Seus resultados: <strong>insucesso em torno de 25%<\/strong>, melhora dos distúrbios de evacuação em cerca de <strong>75%<\/strong> e <strong>dispareunia pós-operatória em 12% a 27%<\/strong>. O estreitamento do intróito sem suporte adequado da parede posterior é armadilha frequente. A alternativa é o <strong>tratamento sítio-específico<\/strong>, que repara o defeito fascial exatamente onde ele está, incluindo o defeito transversal.<\/p>"},{"html":"<h3>Defeito distal — rotura perineal<\/h3>"},{"html":"<p>A insuficiência do corpo perineal acompanha, com frequência, a retocele. Na rotura perineal obstétrica, o <strong>grau III<\/strong> implica <strong>lesão do esfíncter externo do ânus<\/strong> — marco importante, porque a partir dele o risco de incontinência anal entra em cena.<\/p>"}]},{"h":"Quadro clínico","blocos":[{"html":"<p>A queixa que traz a paciente ao consultório é quase sempre a mesma: <strong>\"bola na vagina\"<\/strong>. As queixas aumentam de forma significativa conforme avança o estádio do prolapso, e a paciente pode referir ainda peso ou pressão pélvica, dificuldade miccional ou evacuatória, incontinência urinária e dispareunia.<\/p>"},{"html":"<p>Ao exame, a distinção fundamental é topográfica: protrusão da <strong>parede vaginal anterior<\/strong> significa <strong>cistocele<\/strong>; protrusão da <strong>parede vaginal posterior<\/strong> significa <strong>retocele<\/strong>; descida do colo ou da cúpula caracteriza o defeito apical.<\/p>"}]},{"h":"Classificação e quantificação: POP-Q","blocos":[{"html":"<p>A necessidade de registrar os achados do exame físico em padrão reprodutível e inteligível, estabelecendo critérios de gravidade que orientem a intervenção, levou à criação de sistemas de quantificação. O <strong>POP-Q<\/strong> (<em>Pelvic Organ Prolapse Quantification<\/em>) foi adotado pela <strong>International Continence Society em 1996<\/strong> e classifica o prolapso em <strong>estádios de 0 a 4<\/strong>. O sistema de <strong>Baden-Walker<\/strong> (1972) é a alternativa subjetiva, por graus.<\/p>"},{"html":"<p>A descrição é feita durante o exame físico da genitália externa e do canal vaginal, e <strong>basta espéculo vaginal e histerômetro ou régua<\/strong> — não requer exame de imagem.<\/p>"},{"html":"<h3>Os seis pontos e as três medidas<\/h3>"},{"html":"<p>O sistema relaciona a <strong>carúncula himenal<\/strong>, ponto fixo definido como <strong>zero<\/strong>, à posição de seis pontos: dois na parede anterior, dois no ápice e dois na parede posterior. <strong>Pontos proximais ao hímen são negativos; pontos distais são positivos.<\/strong><\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Ponto<\/th><th>Localização<\/th><th>Variação<\/th><\/tr><\/thead><tbody><tr><td><strong>Aa<\/strong><\/td><td>Parede anterior, 3 cm proximal ao meato uretral (junção uretrovesical)<\/td><td>-3 a +3 cm<\/td><\/tr><tr><td><strong>Ba<\/strong><\/td><td>Ponto mais distal da parede vaginal anterior<\/td><td>-3 cm até +CVT<\/td><\/tr><tr><td><strong>C<\/strong><\/td><td>Extremidade mais distal da cérvix ou da cúpula pós-histerectomia<\/td><td>-CVT a +CVT<\/td><\/tr><tr><td><strong>Ap<\/strong><\/td><td>Parede posterior, 3 cm proximal ao hímen<\/td><td>-3 a +3 cm<\/td><\/tr><tr><td><strong>Bp<\/strong><\/td><td>Ponto mais distal da parede vaginal posterior<\/td><td>-3 cm até +CVT<\/td><\/tr><tr><td><strong>D<\/strong><\/td><td>Fórnix posterior, fundo de saco de Douglas<\/td><td>-CVT a +CVT<\/td><\/tr><tr><td><strong>HG<\/strong><\/td><td>Hiato genital: meato uretral à fúrcula vaginal<\/td><td>média de 4 a 5 cm<\/td><\/tr><tr><td><strong>CP<\/strong><\/td><td>Corpo perineal: fúrcula vaginal ao ânus<\/td><td>média de 4 a 5 cm<\/td><\/tr><tr><td><strong>CVT<\/strong><\/td><td>Comprimento vaginal total<\/td><td>média de 8 a 10 cm<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Grade de nove células para registro do POP-Q<\/p>"},{"html":"<blockquote><p>Dois detalhes que caem em prova: o ponto <strong>D é omitido na ausência de cérvix<\/strong>, e <strong>todas as medidas são feitas sob manobra de Valsalva, exceto o comprimento vaginal total<\/strong>. Na ausência de prolapso, Aa, Ba, Ap e Bp valem <strong>-3 cm<\/strong>.<\/p><\/blockquote>"},{"html":"<h3>Estadiamento e correspondência com Baden-Walker<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Grau (Baden-Walker)<\/th><th>Posição do ponto de maior prolapso<\/th><\/tr><\/thead><tbody><tr><td>Grau 0<\/td><td>Não há prolapso genital<\/td><\/tr><tr><td>Grau 1<\/td><td>Antes (acima) da carúncula himenal<\/td><\/tr><tr><td>Grau 2<\/td><td>No mesmo plano da carúncula himenal<\/td><\/tr><tr><td>Grau 3<\/td><td>Ultrapassa a carúncula himenal, de forma parcial<\/td><\/tr><tr><td>Grau 4<\/td><td>Ultrapassa a carúncula himenal, de forma completa — eversão total<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Correspondência entre Baden-Walker e POP-Q em relação ao anel himenal<\/p>"},{"html":"<h4>Alongamento hipertrófico do colo<\/h4>"},{"html":"<p>Definido por <strong>histerometria do canal cervical maior que 5 cm<\/strong> ou por <strong>diferença entre os pontos C e D maior que 4 cm<\/strong>. O tratamento é a <strong>traquelectomia<\/strong> — cirurgia cônica com retirada do colo uterino — indicada em portadoras de prolapso grau I ou II com alongamento hipertrófico, ou em prolapso cervical após histerectomia subtotal.<\/p>"}]},{"h":"Tratamento","blocos":[{"html":"<h3>Conservador<\/h3>"},{"html":"<ul><li><strong>Fisioterapia do assoalho pélvico<\/strong>: exercícios de Kegel, cones vaginais e biofeedback.<\/li><li><strong>Pessários<\/strong>: dispositivos de sustentação, de suporte ou de preenchimento, úteis sobretudo em pacientes com risco cirúrgico proibitivo ou que desejam adiar a cirurgia.<\/li><\/ul>"},{"html":"<h3>Cirúrgico<\/h3>"},{"html":"<ol><li>Colporrafia anterior — cistocele por defeito central.<\/li><li>Colporrafia posterior — retocele.<\/li><li>Histerectomia vaginal com cirurgia reparadora.<\/li><li><strong>Cirurgia de Manchester<\/strong> (Donald-Fothergill) — amputação do colo com encurtamento dos cardinais, opção de <strong>histeropreservação<\/strong>.<\/li><li><strong>Fixação sacroespinhosa<\/strong> — correção apical por via vaginal.<\/li><li><strong>Promontofixação / colpossacrofixação<\/strong> — correção apical por via abdominal.<\/li><li><strong>Colpocleise de Le Fort<\/strong> — cirurgia obliterativa, para pacientes <strong>sem atividade sexual<\/strong>.<\/li><\/ol>"},{"html":"<h3>O que decide a escolha<\/h3>"},{"html":"<ul><li><strong>Desejo de preservar o útero<\/strong>: cirurgia de Manchester ou histeropexia.<\/li><li><strong>Atividade sexual<\/strong>: sua ausência abre a possibilidade da colpocleise; sua manutenção a exclui.<\/li><li><strong>Uso de telas<\/strong>: controverso na literatura e entre as sociedades internacionais, <strong>reservado na maioria dos casos para recidivas<\/strong>.<\/li><\/ul>"},{"html":"<blockquote><p>A escolha da via e da técnica se faz caso a caso, cruzando o compartimento acometido, o estádio, o desejo de histeropreservação, a atividade sexual e o risco cirúrgico. Corrigir um compartimento e ignorar os demais é a receita mais comum de recidiva.<\/p><\/blockquote>"}]}]},{"slug":"doenca-inflamatoria-pelvica","titulo":"Doença Inflamatória Pélvica","disciplina":"GO","eyebrow":"Ginecologia · Infecções do Trato Genital","questoes":[{"id":"9d69ff6263","q":"A doença inflamatória pélvica é uma síndrome do trato genital superior. Quais estruturas podem ser acometidas?","opts":["Endométrio, tubas, ovários, peritônio pélvico e cápsula hepática","Vulva, vagina, colo uterino, uretra e glândulas vestibulares","Bexiga, ureteres, rins, uretra e assoalho pélvico muscular","Vagina, colo uterino, canal anal, reto e septo retovaginal"],"c":0,"exp":"A DIP é uma síndrome inflamatória e infecciosa do trato genital superior. Além de endométrio, tubas, ovários e peritônio pélvico, pode alcançar a cápsula hepática, o que origina a peri-hepatite da síndrome de Fitz-Hugh-Curtis. Vulva, vagina e colo pertencem ao trato inferior e são a porta de entrada, não o alvo da DIP.","ref":[0,0]},{"id":"8ba8bd515b","q":"Qual é a via pela qual os microrganismos alcançam o trato genital superior na DIP?","opts":["Ascensão canalicular de microrganismos da vagina e do colo uterino","Disseminação hematogênica a partir de foco infeccioso distante","Disseminação linfática a partir dos linfonodos inguinais profundos","Inoculação transperitoneal direta a partir do apêndice inflamado"],"c":0,"exp":"A DIP resulta da ascensão canalicular: os agentes sobem do colo e da vagina pelo canal cervical até o endométrio, as tubas e o peritônio. É um processo contíguo e progressivo, em geral polimicrobiano, e pode ser desencadeado por manipulação uterina.","ref":[0,1]},{"id":"4f730adf07","q":"Qual alteração do ecossistema vaginal representa o primeiro passo para a DIP?","opts":["Perda da acidez vaginal, com redução dos lactobacilos protetores","Queda do pH vaginal, com proliferação dos lactobacilos protetores","Aumento da acidez vaginal, com espessamento do epitélio escamoso","Elevação do glicogênio vaginal, com aumento dos lactobacilos locais"],"c":0,"exp":"O equilíbrio saudável depende de pH ácido e de lactobacilos protetores. Quando a acidez cai, os lactobacilos diminuem e abrem espaço para supercrescimento patogênico, favorecido por contato com sêmen, duchas íntimas e alterações hormonais. Instalam-se então vaginite e cervicite, o degrau inicial da cascata.","ref":[1,0]},{"id":"3e068fbd78","q":"Qual característica faz de Chlamydia trachomatis a chamada ameaça silenciosa na gênese da DIP?","opts":["Cerca de 70% das infecções são assintomáticas e exigem PCR","Cerca de 70% das infecções cursam com exsudato francamente purulento","Cerca de 10% das infecções são assintomáticas e exigem PCR","Cerca de 70% das infecções são detectadas pela bacterioscopia"],"c":0,"exp":"A clamídia é bactéria intracelular obrigatória e cerca de 70% dos casos são assintomáticos, de modo que a infecção avança sem alertar a paciente. O diagnóstico exige teste molecular (PCR) da secreção cervical, já que a bacterioscopia não a identifica.","ref":[2,2]},{"id":"b0819cc43a","q":"Qual a morfologia e o meio de cultura do agente de comportamento exuberante na DIP?","opts":["Diplococo Gram-negativo cultivado em meio Thayer-Martin modificado","Bacilo Gram-negativo cultivado em meio Thayer-Martin modificado","Diplococo Gram-positivo cultivado em meio Sabouraud com dextrose","Bactéria intracelular cultivada em meio Thayer-Martin modificado"],"c":0,"exp":"Neisseria gonorrhoeae é um diplococo Gram-negativo e cresce em meio Thayer-Martin modificado. Diferente da clamídia, costuma ser altamente sintomática, com exsudato purulento visível e colo edemaciado e friável ao exame especular.","ref":[2,4]},{"id":"3266fd527b","q":"Qual é a sequência anatômica correta da infecção ascendente que caracteriza a DIP?","opts":["Cervicite, endometrite, salpingite e abscesso tubo-ovariano","Endometrite, cervicite, salpingite e abscesso tubo-ovariano","Cervicite, salpingite, endometrite e abscesso tubo-ovariano","Salpingite, cervicite, endometrite e abscesso tubo-ovariano"],"c":0,"exp":"A cascata parte da cervicite, atravessa uma endometrite muitas vezes discreta e fugaz, atinge as tubas e os ovários (salpingite e ooforite, com conteúdo purulento e hidrossalpinge) e pode formar abscesso tubo-ovariano. O estágio final é a peritonite, eventualmente com peri-hepatite de Fitz-Hugh-Curtis.","cap":"Cascata fisiopatológica da ascensão da infecção","ref":[2,6]},{"id":"6dff3f3e0b","q":"Qual vaginite cursa com secreção rala acinzentada de odor fétido e eleva o risco de DIP e de parto prematuro?","opts":["Vaginose bacteriana","Candidíase vaginal","Tricomoníase vaginal","Vaginite atrófica"],"c":0,"exp":"A vaginose bacteriana produz secreção rala e acinzentada com odor fétido que piora na menstruação e após o coito, e frequentemente é assintomática ou dá apenas irritação leve. Aumenta a chance de DIP e de parto prematuro e é tratada com metronidazol ou clindamicina.","ref":[1,4]},{"id":"60429fa36a","q":"O dispositivo intrauterino eleva em 3 a 5 vezes o risco de DIP. Em que circunstância esse aumento se aplica?","opts":["Apenas quando há cervicite no momento da inserção do dispositivo","Apenas quando o dispositivo permanece por mais de cinco anos","Em qualquer inserção, independentemente do estado do colo uterino","Apenas quando o dispositivo é hormonal, por ação progestagênica"],"c":0,"exp":"O risco atribuído ao DIU se concentra no ato da inserção e só se justifica quando a paciente é portadora de cervicite naquele momento, pois o procedimento carreia o agente para a cavidade. Sem cervicite, o aumento de risco não se sustenta, e o dispositivo não precisa ser evitado por esse motivo.","cap":"Perfil de risco e gatilhos anatômicos da DIP","ref":[3,1]},{"id":"e1faf44219","q":"Qual conjunto de achados caracteriza a apresentação subaguda ou silenciosa da DIP?","opts":["Dor leve pós-menstrual, spotting, dispareunia profunda e disúria","Dor intensa, febre acima de 38,9 °C, vômitos e exsudato purulento","Choque hemorrágico, atraso menstrual e beta-hCG muito positivo","Dor migratória para a fossa ilíaca direita, febre precoce e vômito"],"c":0,"exp":"Abaixo da ponta do iceberg está a forma subaguda: dor abdominal leve a moderada, sobretudo logo após a menstruação, sangramento irregular em pequena quantidade, dispareunia profunda e disúria. É essa apresentação discreta que atrasa o diagnóstico e garante sequelas permanentes.","ref":[3,2]},{"id":"1c45656119","q":"A tríade de critérios maiores para o diagnóstico de DIP exige a presença simultânea de quais achados?","opts":["Dor no hipogástrio, dor anexial e dor à mobilização do colo","Dor no hipogástrio, febre acima de 37,5 °C e massa pélvica","Dor anexial, secreção cervical anormal e leucocitose no sangue","Dor à mobilização do colo, VHS elevada e mais de 5 leucócitos"],"c":0,"exp":"Os três critérios maiores são dor no hipogástrio, dor à palpação dos anexos e dor à mobilização do colo uterino, esta última conhecida como sinal de Chandelier. Os três precisam estar presentes. Febre, massa pélvica, leucocitose e VHS elevada pertencem à lista dos critérios menores.","cap":"Critérios maiores, menores e elaborados do Ministério da Saúde","ref":[4,1]},{"id":"1ac5d96242","q":"Qual combinação de critérios do Ministério da Saúde fecha o diagnóstico clínico de DIP?","opts":["Os três critérios maiores somados a pelo menos um critério menor","Os três critérios maiores somados a pelo menos dois critérios menores","Dois critérios maiores somados a pelo menos um critério menor","Um critério maior somado a pelo menos três critérios menores"],"c":0,"exp":"A fórmula é 3 maiores + 1 menor. Os três critérios maiores são obrigatórios e basta um critério menor para confirmar. Essa aritmética clínica permite tratar sem esperar culturas, o que é decisivo porque o atraso terapêutico é o principal determinante de sequela tubária.","ref":[4,0]},{"id":"67483bb61e","q":"Qual é o limiar de temperatura que figura entre os critérios menores de DIP?","opts":["Temperatura acima de 37,5 °C","Temperatura acima de 38,5 °C","Temperatura acima de 39,0 °C","Temperatura acima de 36,8 °C"],"c":0,"exp":"O ponto de corte entre os critérios menores é 37,5 °C, portanto febre baixa já conta. O valor de 38,5 °C aparece em outro contexto, como marcador de estado geral grave que indica internação, e não deve ser confundido com o limiar diagnóstico.","ref":[4,3]},{"id":"4f48d633b3","q":"Qual achado confirma isoladamente a DIP, dispensando a soma de critérios maiores e menores?","opts":["Endometrite comprovada em estudo histopatológico do endométrio","Secreção cervical anormal observada no exame com espéculo","Velocidade de hemossedimentação elevada em paciente febril","Mais de cinco leucócitos por campo na secreção endocervical"],"c":0,"exp":"Os critérios elaborados confirmam a DIP sozinhos: endometrite histopatológica, abscesso tubo-ovariano demonstrado em imagem e evidência laparoscópica. Secreção anormal, VHS elevada e mais de cinco leucócitos por campo são apenas critérios menores e não bastam isoladamente.","ref":[4,1]},{"id":"a3df61f0c7","q":"Qual exame é considerado o padrão-ouro visual para o diagnóstico de DIP?","opts":["Laparoscopia, por permitir ver diretamente tubas e peritônio","Ultrassonografia transvaginal, por mostrar a trompa espessada","Culdocentese, por aspirar o conteúdo do fundo de saco de Douglas","Ressonância magnética de pelve, por caracterizar a coleção anexial"],"c":0,"exp":"A laparoscopia é o padrão-ouro visual porque mostra diretamente as tubas inflamadas, o exsudato purulento e as aderências. Na prática, porém, é pouco usada na rotina: o tratamento empírico é iniciado pelos critérios clínicos, sem aguardar confirmação cirúrgica.","ref":[4,6]},{"id":"25d6c3b66c","q":"Por que o beta-hCG é obrigatório na investigação inicial de toda suspeita de DIP?","opts":["Para afastar gravidez ectópica, principal diferencial de urgência","Para estimar a gravidade da inflamação tubária já instalada","Para definir a dose do antibiótico parenteral a ser prescrito","Para confirmar a presença de abscesso tubo-ovariano íntegro"],"c":0,"exp":"Na DIP o beta-hCG é tipicamente negativo; na gravidez ectópica rota ele é obrigatoriamente positivo. Como as duas cursam com dor pélvica intensa, o teste separa um quadro infeccioso de uma emergência hemorrágica. O exame de urina compõe a mesma lógica, afastando infecção urinária.","ref":[4,8]},{"id":"c249a00c87","q":"Qual achado da ultrassonografia transvaginal sustenta a suspeita de DIP complicada?","opts":["Camada líquida preenchendo a trompa ou abscesso tubo-ovariano","Endométrio espessado e heterogêneo sem qualquer coleção anexial","Folículo ovariano dominante com fluxo periférico aumentado","Miométrio heterogêneo com nódulos hipoecoicos bem delimitados"],"c":0,"exp":"A ultrassonografia transvaginal procura conteúdo líquido distendendo a trompa, que corresponde à piossalpinge ou hidrossalpinge, e a massa complexa do abscesso tubo-ovariano. Encontrar o abscesso em imagem é critério elaborado e confirma a DIP isoladamente.","ref":[4,6]},{"id":"8f669f0e83","q":"Qual achado do exame físico ajuda a separar apendicite aguda de doença inflamatória pélvica?","opts":["Na apendicite, a mobilização do colo uterino costuma ser indolor","Na apendicite, a mobilização do colo uterino é extremamente dolorosa","Na apendicite, o corrimento cervical purulento é achado frequente","Na apendicite, a dor é hipogástrica e bilateral desde o início"],"c":0,"exp":"Na apendicite a dor migra do umbigo para a fossa ilíaca direita e a mobilização do colo tipicamente não dói. Na DIP a dor é hipogástrica e bilateral, o corrimento purulento é comum e a mobilização cervical é extremamente dolorosa. O diferencial inclui ainda infecção urinária, endometrioma roto e torção ovariana.","cap":"Diagnóstico diferencial do abdome agudo em ginecologia","ref":[4,8]},{"id":"f1e5bb147c","q":"Por que o antibiótico empírico deve ser iniciado antes do resultado de ultrassom, PCR ou culturas?","opts":["Porque 48 horas de atraso triplicam o risco de infertilidade","Porque o resultado da cultura endocervical sai em menos de 2 horas","Porque o antibiótico interfere no resultado da ultrassonografia","Porque a cultura só tem valor depois de iniciado o antibiótico"],"c":0,"exp":"Enquanto se aguarda exame, a inflamação segue destruindo o epitélio ciliar tubário, e 48 horas de atraso já triplicam o risco de infertilidade. Por isso a conduta é tratar empiricamente diante da suspeita clínica, errando pelo excesso, e não esperar a paciente evoluir para choque.","ref":[6,7]},{"id":"ea1e83d1de","q":"Como se caracteriza e como se conduz o estágio I de Monif?","opts":["Endometrite ou salpingite sem peritonite, com manejo ambulatorial","Endometrite ou salpingite com peritonite, com manejo ambulatorial","Endometrite ou salpingite sem peritonite, com internação obrigatória","Abscesso tubo-ovariano íntegro, com manejo ambulatorial vigiado"],"c":0,"exp":"Monif I é endometrite ou salpingite aguda sem peritonite, portanto quadro não complicado. Em paciente estável e sem critérios de internação, permite tratamento ambulatorial com seguimento precoce e reavaliação obrigatória em 72 horas.","cap":"Estadiamento de Monif: anatomia, marcador e conduta","ref":[5,1]},{"id":"3c4eba804c","q":"O estágio II de Monif difere do estágio I pela presença de qual achado?","opts":["Peritonite pélvica associada à salpingite aguda em curso","Abscesso tubo-ovariano íntegro demonstrado em exame de imagem","Abscesso tubo-ovariano roto com quadro de choque séptico","Endometrite isolada sem qualquer comprometimento das tubas"],"c":0,"exp":"O divisor entre Monif I e II é a peritonite pélvica, que marca maior extensão inflamatória e habitualmente leva à internação. O abscesso íntegro define o estágio III e o abscesso roto, com peritonite difusa e sepse, define o estágio IV.","ref":[5,0]},{"id":"177f3e322e","q":"Qual é a conduta típica diante de abscesso tubo-ovariano íntegro?","opts":["Internação com antibiótico intravenoso e avaliar drenagem","Ambulatório com antibiótico oral e reavaliação em 72 horas","Laparotomia imediata com salpingectomia bilateral de urgência","Observação domiciliar sem antibiótico até a cultura resultar"],"c":0,"exp":"Monif III corresponde a doença complicada com massa ou coleção anexial. A conduta padrão é internar e usar antibioticoterapia parenteral, reservando drenagem ou outra intervenção conforme a evolução. Cirurgia imediata fica reservada à rotura do abscesso.","ref":[5,1]},{"id":"5cd4c1c0a5","q":"Abscesso tubo-ovariano roto configura qual estágio de Monif e exige qual conduta?","opts":["Monif IV, com antibiótico de amplo espectro e cirurgia imediata","Monif III, com antibiótico de amplo espectro e cirurgia imediata","Monif IV, com antibiótico oral ambulatorial e retorno em 72 horas","Monif II, com antibiótico intravenoso e drenagem percutânea"],"c":0,"exp":"A rotura do abscesso é emergência: há risco de peritonite difusa, sepse e choque. O manejo é antibiótico de amplo espectro por via parenteral associado a avaliação cirúrgica imediata. É o único estágio de Monif em que a cirurgia é parte obrigatória do tratamento inicial.","ref":[5,3]},{"id":"a7e6845b00","q":"Qual situação, isoladamente, já indica internação hospitalar em paciente com DIP?","opts":["Gestação confirmada em paciente com diagnóstico de DIP","Idade abaixo de 25 anos em paciente sexualmente ativa","Antecedente de episódio prévio de DIP há mais de um ano","Uso de dispositivo intrauterino há mais de seis meses"],"c":0,"exp":"A gestante com DIP interna sempre, pelo alto risco de abortamento, corioamnionite e parto prematuro, e recebe antibiótico parenteral. As demais indicações de internação são Monif II ou maior, intolerância oral, falha após 72 horas, estado geral grave e impossibilidade de excluir urgência cirúrgica.","cap":"As seis indicações de internação hospitalar na DIP","ref":[5,5]},{"id":"f6d3139a52","q":"Após quanto tempo a ausência de resposta ao esquema ambulatorial passa a indicar internação?","opts":["72 horas do início do antibiótico, com falha ou piora clínica","24 horas do início do antibiótico, com falha ou piora clínica","14 dias do início do antibiótico, com falha ou piora clínica","7 dias do início do antibiótico, com falha ou piora clínica"],"c":0,"exp":"O retorno em 72 horas é obrigatório em todo tratamento ambulatorial de DIP. Se nesse prazo não houver melhora, ou se o quadro piorar, a paciente deve ser internada para antibioticoterapia parenteral e reavaliação do diagnóstico.","ref":[5,6]},{"id":"223f7044c2","q":"Qual é o esquema ambulatorial de primeira escolha do PCDT 2020 para a DIP?","opts":["Ceftriaxona IM em dose única, doxiciclina e metronidazol por 14 dias","Ceftriaxona IM em dose única, azitromicina e fluconazol por 14 dias","Ceftriaxona IV diária por 14 dias, doxiciclina e metronidazol orais","Penicilina IM em dose única, doxiciclina e metronidazol por 7 dias"],"c":0,"exp":"O esquema ambulatorial é ceftriaxona 500 mg IM em dose única, doxiciclina 100 mg VO de 12 em 12 horas por 14 dias e metronidazol 500 mg VO de 12 em 12 horas por 14 dias, com reavaliação em 72 horas. A segunda opção do PCDT troca a ceftriaxona pela cefotaxima 500 mg IM.","cap":"Esquemas ambulatorial e hospitalar do PCDT 2020","ref":[6,1]},{"id":"6435bb6726","q":"Qual é o esquema hospitalar de primeira escolha para a DIP?","opts":["Ceftriaxona IV, doxiciclina oral e metronidazol IV por 14 dias","Ceftriaxona IM em dose única, doxiciclina oral e metronidazol oral","Clindamicina IV, gentamicina IV e fluconazol oral por 14 dias","Ampicilina com sulbactam IV, azitromicina oral e nistatina oral"],"c":0,"exp":"O esquema hospitalar de primeira linha é ceftriaxona 1 g IV uma vez ao dia, doxiciclina 100 mg VO de 12 em 12 horas e metronidazol 400 mg IV de 12 em 12 horas, totalizando 14 dias. A transição para via oral é feita após 24 horas sem febre. As alternativas são clindamicina com gentamicina ou ampicilina-sulbactam com doxiciclina.","ref":[6,1]},{"id":"4ab3579321","q":"Quais agentes o esquema antibiótico da DIP precisa obrigatoriamente cobrir, e por quanto tempo?","opts":["Clamídia, gonococo e anaeróbios, por quatorze dias de tratamento","Clamídia, gonococo e fungos, por quatorze dias de tratamento","Gonococo, anaeróbios e protozoários, por sete dias de tratamento","Clamídia, estafilococo e anaeróbios, por sete dias de tratamento"],"c":0,"exp":"A DIP é polimicrobiana, então o esquema precisa ser de amplo espectro e cobrir simultaneamente clamídia, gonococo e anaeróbios, por 14 dias. Essa é a razão de a tríade cefalosporina, doxiciclina e metronidazol aparecer tanto no esquema ambulatorial quanto no hospitalar.","ref":[6,0]},{"id":"457ca95161","q":"Como devem ser tratadas as parcerias sexuais dos últimos 60 dias de uma paciente com DIP?","opts":["Empiricamente, com ceftriaxona 500 mg IM e azitromicina 1 g VO","Apenas se sintomáticas, com ceftriaxona 500 mg IM em dose única","Empiricamente, com doxiciclina 100 mg VO por quatorze dias","Apenas após resultado de cultura, com azitromicina 1 g VO"],"c":0,"exp":"O tratamento das parcerias dos últimos 60 dias é mandatório, mesmo nas assintomáticas, com ceftriaxona 500 mg IM associada a azitromicina 1 g VO em dose única. Sem isso, a reinfecção imediata garante falha terapêutica, por melhor que seja o esquema prescrito à paciente.","ref":[6,5]},{"id":"86371cbfcb","q":"Quais classes de antimicrobianos são contraindicadas no tratamento da DIP durante a gestação?","opts":["Tetraciclinas, como a doxiciclina, e também as quinolonas","Cefalosporinas, como a ceftriaxona, e também os macrolídeos","Nitroimidazóis, como o metronidazol, e também as penicilinas","Aminoglicosídeos, como a gentamicina, e também os macrolídeos"],"c":0,"exp":"Doxiciclina (tetraciclina) e quinolonas são contraindicadas na gestação, o que obriga a reformular o esquema padrão. A gestante com DIP tem indicação de internação obrigatória e antibioticoterapia parenteral, pelo risco de abortamento, corioamnionite e prematuridade.","ref":[6,5]},{"id":"5115791b44","q":"Qual é o risco de infertilidade por fator tubário após três episódios de DIP?","opts":["Chega a cerca de 75%, subindo a cada novo episódio","Chega a cerca de 10%, subindo a cada novo episódio","Permanece em cerca de 3%, qualquer que seja o número","Chega a cerca de 29%, caindo a cada novo episódio"],"c":0,"exp":"A infertilidade por fator tubário ocorre em 10% a 50% das mulheres após DIP e o risco cresce exponencialmente a cada recidiva, chegando a cerca de 75% depois de três episódios. Aderências e bloqueio purulento destroem o epitélio ciliar e distorcem a trompa.","ref":[7,3]},{"id":"ae4748ae64","q":"Em quanto a DIP prévia aumenta o risco de gravidez ectópica tubária?","opts":["De 6 a 10 vezes, por lesão do epitélio ciliar e aderências","De 2 a 3 vezes, por lesão do epitélio ciliar e aderências","De 20 a 30 vezes, por obstrução completa das duas trompas","Não há aumento, pois a lesão tubária impede a fecundação"],"c":0,"exp":"As aderências e a destruição do epitélio ciliar prejudicam o transporte do ovo e elevam de 6 a 10 vezes a chance de implantação tubária. Junto com a infertilidade e a dor pélvica crônica, presente em 20% a 40% das pacientes, compõe a tríade de sequelas tardias da DIP.","ref":[7,3]},{"id":"d79ba8c3cc","q":"Dor em quadrante superior direito com aderências em corda de violino na cápsula hepática define qual quadro?","opts":["Síndrome de Fitz-Hugh-Curtis, peri-hepatite por clamídia ou gonococo","Síndrome de Asherman, com sinéquias intrauterinas pós-curetagem","Síndrome de Meigs, com ascite e derrame pleural por tumor ovariano","Síndrome de Mayer-Rokitansky, com agenesia uterina e vaginal"],"c":0,"exp":"A síndrome de Fitz-Hugh-Curtis é a peri-hepatite por disseminação de clamídia ou gonococo até a cápsula de Glisson. Manifesta-se por dor no quadrante superior direito do abdome e por aderências finas em corda de violino entre a cápsula hepática e a parede abdominal.","ref":[7,1]}],"resumo":[{"h":"O que é e por que importa","blocos":[{"html":"<p>A doença inflamatória pélvica (DIP) é a síndrome clínica inflamatória e infecciosa do <strong>trato genital superior feminino<\/strong>. Não é uma doença de um órgão só: o processo pode envolver endométrio, tubas uterinas, ovários, peritônio pélvico e até a <strong>cápsula hepática<\/strong>, e por isso o espectro anatômico vai da endometrite discreta à peri-hepatite com peritonite difusa.<\/p>"},{"html":"<p>Ela decorre, quase sempre, da <strong>ascensão canalicular<\/strong> de microrganismos que já estavam na vagina e no colo uterino. É um processo contíguo, progressivo e tipicamen
