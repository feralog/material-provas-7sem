tamento (&lt; 10³ = 0; 10³–10⁴ = 1; &gt; 10⁴–10⁵ = 2; &gt; 10⁵ = 4); maior tumor incluindo o útero (3–4 cm = 1; ≥ 5 cm = 2); <strong>sítio de metástase (pulmão = 0; baço e rim = 1; gastrintestinal = 2; cérebro e fígado = 4)<\/strong>; número de metástases (1–4 = 1; 5–8 = 2; &gt; 8 = 4); e falha de quimioterapia prévia (agente único = 2; dois ou mais agentes = 4).<\/p>"},{"html":"<ul><li><strong>NTG de baixo risco:<\/strong> escore <strong>≤ 6<\/strong> e estádio FIGO <strong>I–III<\/strong> → <strong>monoquimioterapia<\/strong> com <strong>metotrexato<\/strong> (ou actinomicina D, atualmente indisponível no Brasil).<\/li><li><strong>NTG de alto risco:<\/strong> escore <strong>≥ 7<\/strong> em estádios I–III <strong>e todos os casos de estádio IV<\/strong> → <strong>poliquimioterapia EMA-CO<\/strong> (etoposida, metotrexato, actinomicina D, ciclofosfamida e vincristina). Casos de <strong>ultra-alto risco<\/strong> têm mortalidade reduzida com indução por <strong>EP<\/strong> (etoposida + cisplatina) seguida de EMA-CO ou EP-EMA.<\/li><\/ul>"},{"html":"<p>O índice de cura ultrapassa <strong>95%<\/strong>.<\/p>"}]},{"h":"Imunoprofilaxia Rh e síntese do diagnóstico diferencial","blocos":[{"html":"<p>A imunoprofilaxia é o item que mais se esquece na prática e o que mais cai na prova, porque vale para <strong>todas<\/strong> as causas de sangramento do primeiro trimestre.<\/p>"},{"html":"<blockquote><p><strong>Conduta obrigatória:<\/strong> toda gestante <strong>Rh(D) negativa não sensibilizada<\/strong> (<strong>Coombs indireto negativo<\/strong>) com sangramento de 1º trimestre, abortamento, gestação ectópica ou mola <strong>deve receber imunoglobulina anti-D<\/strong>.<\/p><\/blockquote>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Situação<\/th><th>Dose<\/th><th>Janela<\/th><\/tr><\/thead><tbody><tr><td><strong>Até 12 semanas<\/strong> de IG<\/td><td><strong>150 mcg (750 UI) IM<\/strong> — minidose<\/td><td><strong>Até 72 h<\/strong> do evento hemorrágico, o mais precoce possível<\/td><\/tr><tr><td><strong>Acima de 12 semanas<\/strong> de IG<\/td><td><strong>300 mcg (1.500 UI) IM<\/strong> — dose padrão<\/td><td><strong>Até 72 h<\/strong> do evento hemorrágico<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A finalidade é prevenir a <strong>isoimunização Rh<\/strong> e a <strong>doença hemolítica do recém-nascido<\/strong> em gestações futuras.<\/p>"},{"html":"<h3>Quadro-síntese do sangramento de primeiro trimestre<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Patologia<\/th><th>Colo uterino<\/th><th>Sangramento / dor<\/th><th>USTV<\/th><\/tr><\/thead><tbody><tr><td><strong>Ameaça de aborto<\/strong><\/td><td>Fechado<\/td><td>Leve / cólica leve<\/td><td>Saco gestacional e <strong>embrião vivo<\/strong> intrauterino<\/td><\/tr><tr><td><strong>Aborto inevitável<\/strong><\/td><td><strong>Aberto<\/strong><\/td><td>Intenso / cólicas fortes<\/td><td>Conteúdo ovular ainda <strong>na cavidade<\/strong><\/td><\/tr><tr><td><strong>Aborto incompleto<\/strong><\/td><td>Fechado ou aberto<\/td><td>Moderado a intenso / cólicas<\/td><td>Material heterogêneo, endométrio <strong>&gt; 15 mm<\/strong><\/td><\/tr><tr><td><strong>Aborto completo<\/strong><\/td><td>Fechado<\/td><td>Regride rápido / dor ausente<\/td><td><strong>Útero vazio<\/strong>, endométrio <strong>&lt; 15 mm<\/strong><\/td><\/tr><tr><td><strong>Aborto retido<\/strong><\/td><td>Fechado<\/td><td>Escasso ou ausente / <strong>sem dor<\/strong><\/td><td>Embrião <strong>sem BCF<\/strong> ou SG sem embrião<\/td><\/tr><tr><td><strong>Aborto infectado<\/strong><\/td><td>Fechado ou aberto<\/td><td>Variável, <strong>fétido<\/strong> / <strong>febre<\/strong><\/td><td>Variável; útero amolecido e doloroso<\/td><\/tr><tr><td><strong>Gestação ectópica<\/strong><\/td><td>Fechado<\/td><td><strong>Escuro<\/strong>, escasso / dor em fossa ilíaca<\/td><td><strong>Útero vazio<\/strong> + massa anexial / <strong>anel tubário<\/strong><\/td><\/tr><tr><td><strong>Mola hidatiforme<\/strong><\/td><td>Fechado ou aberto<\/td><td>Abundante / sintomas exacerbados<\/td><td><strong>\"Tempestade de neve\"<\/strong> / favo de mel<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<h3>Aplicação: caso clínico comentado<\/h3>"},{"html":"<p>Paciente de 28 anos, G2P1A0, DUM há 7 semanas, com dor súbita em fossa ilíaca direita e sangramento vaginal escuro discreto. PA 110×70 mmHg, FC 88 bpm, abdome doloroso à palpação profunda <strong>sem Blumberg<\/strong>, colo posterior e fechado, dor discreta à mobilização. <strong>β-hCG 2.800 mUI/mL<\/strong>; USTV com <strong>cavidade uterina vazia<\/strong>, endométrio de 11 mm, <strong>imagem anular hiperecogênica de 2,2 cm<\/strong> em anexo direito, <strong>sem BCF<\/strong> e <strong>sem líquido livre<\/strong>.<\/p>"},{"html":"<p>Trata-se de <strong>gestação ectópica tubária íntegra<\/strong> em paciente <strong>estável<\/strong>. Todos os critérios de MTX estão preenchidos — estabilidade, massa <strong>&lt; 3,5 cm<\/strong>, β-hCG <strong>&lt; 5.000<\/strong>, ausência de BCF e ausência de hemoperitônio —, de modo que a conduta é <strong>metotrexato sistêmico 50 mg/m² IM em dose única<\/strong>, com β-hCG nos dias 4 e 7 e segunda dose se a queda for menor que 15%. Não cabe conduta expectante (β-hCG acima de 2.000 e não documentado em queda) nem cirurgia (paciente estável, sem rotura).<\/p>"},{"html":"<h3>As mensagens para levar para casa<\/h3>"},{"html":"<ol><li><strong>Estabilize primeiro:<\/strong> afaste choque e ectópica rota antes de qualquer exame demorado.<\/li><li><strong>Zona discriminativa:<\/strong> β-hCG acima de 2.000–3.500 mUI/mL com útero vazio é ectópica até prova em contrário.<\/li><li><strong>Respeite os critérios ultrassonográficos<\/strong> antes de indicar esvaziamento — o erro aqui interrompe gestação viável.<\/li><li><strong>Não esqueça a imunoglobulina anti-D<\/strong> em toda paciente Rh negativa que sangrou.<\/li><li><strong>Mola é doença de seguimento:<\/strong> o tratamento não termina no esvaziamento, termina na curva do hCG.<\/li><\/ol>"}]}]},{"slug":"hemorragias-da-primeira-e-segunda-metade-da-gestacao","titulo":"Hemorragias da Primeira e Segunda Metade da Gestação","disciplina":"GO","eyebrow":"Ginecologia e Obstetrícia · Sangramento na Gestação","questoes":[{"id":"d499f66dad","q":"Uma curva de β-hCG com elevação inadequada em 48 horas, sem nenhum outro dado, permite concluir o quê?","opts":["Gestação anormal, que pode ser ectópica ou tópica inviável","Gestação ectópica, que deve ser tratada com metotrexato","Gestação tópica viável, ainda abaixo da zona discriminatória","Doença trofoblástica, que exige esvaziamento por aspiração"],"c":0,"exp":"Curva de elevação inadequada indica apenas que a gestação é anormal — pode ser ectópica ou intrauterina inviável. O β-hCG descreve o comportamento da gestação, não onde ela está; quem localiza é a ultrassonografia transvaginal. Tratar como ectópica só porque o valor não dobrou é um dos distratores clássicos.","ref":[1,3]},{"id":"83ec83c7ea","q":"Por que exigir que o β-hCG dobre em 48 horas leva a erro na avaliação da gestação inicial?","opts":["Superestima o incremento esperado e rotula como anormais gestações viáveis","Subestima o incremento esperado e deixa passar gestações ectópicas rotas","Só vale acima da zona discriminatória, quando o saco é sempre visível","Só vale na gestação múltipla, em que a produção de hCG é duplicada"],"c":0,"exp":"O incremento esperado em uma gestação tópica evolutiva é menor do que a duplicação e varia conforme o valor inicial — quanto mais alto o ponto de partida, menor o aumento percentual esperado. Exigir que o valor dobre rotula como anormais gestações intrauterinas viáveis e pode levar a tratar como ectópica uma gestação desejada.","ref":[1,2]},{"id":"b3e6244dc6","q":"Uma gestante tem β-hCG que sobe de 1.100 para 1.750 mUI/mL em 48 horas, sem dobrar, e a ultrassonografia transvaginal mostra saco gestacional intrauterino com vesícula vitelínica. Qual a interpretação?","opts":["Gestação tópica em evolução, com incremento adequado","Gestação ectópica, pois o β-hCG não dobrou em 48 horas","Gestação intrauterina inviável, por curva insuficiente","Gestação heterotópica, até que a USTV seja repetida"],"c":0,"exp":"Uma alta de cerca de 60% em 48 horas é incremento adequado para uma gestação inicial, mesmo sem dobrar, e o saco gestacional com vesícula vitelínica localiza a gestação dentro do útero. É o padrão da gestação tópica evolutiva: curva adequada e gestação vista na cavidade.","ref":[1,10]},{"id":"043308b9ba","q":"O que é a zona discriminatória do β-hCG?","opts":["Faixa acima da qual se espera ver o saco gestacional intrauterino na USTV","Valor acima do qual toda ectópica deve ser tratada com metotrexato","Valor abaixo do qual a gestação é considerada inviável com certeza","Faixa de queda do β-hCG que confirma o abortamento completo"],"c":0,"exp":"É a faixa de β-hCG acima da qual se espera visualizar o saco gestacional intrauterino na ultrassonografia transvaginal (tradicionalmente 1.500 a 2.000 mUI/mL; referências mais conservadoras usam 3.500 mUI/mL). Acima dela, cavidade vazia levanta forte suspeita de ectópica; abaixo, o exame ainda não é conclusivo. É referência, não gatilho isolado de conduta.","ref":[1,6]},{"id":"058272839d","q":"Mulher de 30 anos, com seis semanas de atraso menstrual, tem sangramento discreto e desconforto pélvico leve. Está estável e sem irritação peritoneal. O β-hCG é de 1.800 mUI/mL e a USTV não mostra saco gestacional intrauterino, massa anexial nem líquido livre. Qual a conduta inicial?","opts":["Repetir o β-hCG em 48 horas e manter ultrassonografia seriada","Administrar metotrexato em dose única por ectópica presumida","Esvaziamento uterino para pesquisa de vilosidades coriônicas","Laparoscopia diagnóstica para localizar a gestação ectópica"],"c":0,"exp":"É gestação de localização indefinida em paciente estável, com β-hCG próximo ou abaixo da zona discriminatória: a ultrassonografia ainda não é conclusiva e a decisão exige seriação. Metotrexato ou esvaziamento sem confirmação podem interromper uma gestação tópica desejada, e cirurgia não se justifica sem diagnóstico e sem sinais de rotura.","ref":[1,7]},{"id":"0451f8de50","q":"O β-hCG de uma gestante passa de 2.900 para 3.050 mUI/mL em 48 horas, e a USTV mostra cavidade uterina vazia e massa anexial de 2 cm. Qual a interpretação?","opts":["Gestação ectópica, com curva inadequada e massa anexial","Gestação tópica inicial, ainda abaixo da zona discriminatória","Abortamento completo, com cavidade vazia e β-hCG em platô","Mola hidatiforme parcial, com β-hCG desproporcional à idade"],"c":0,"exp":"Uma alta de apenas 5% em 48 horas é curva inadequada (gestação anormal). Com valor acima de 3.000 mUI/mL, uma gestação tópica já deveria ser vista; cavidade vazia somada a massa anexial configura gestação ectópica. Nenhum dado isolado decide — é a combinação de curva, valor e imagem.","ref":[1,10]},{"id":"0cff8afbf8","q":"O β-hCG de uma gestante cai de 5.400 para 2.100 mUI/mL em 48 horas, e a USTV mostra cavidade uterina vazia, endométrio fino e nenhuma massa anexial. Como interpretar?","opts":["Gestação de localização indefinida em resolução, ou perda precoce","Gestação ectópica íntegra, com indicação de metotrexato imediato","Gestação tópica evolutiva, ainda abaixo da zona discriminatória","Doença trofoblástica em regressão após esvaziamento espontâneo"],"c":0,"exp":"Queda franca do β-hCG com cavidade vazia, endométrio fino e ausência de massa anexial indica gestação em resolução — perda precoce ou gestação de localização indefinida que está regredindo. A conduta é acompanhar a queda até negativar; tratar como ectópica ativa seria excesso.","ref":[1,10]},{"id":"8991092b22","q":"O β-hCG de uma gestante passa de 1.400 para 1.520 mUI/mL em 48 horas, e a USTV mostra saco gestacional intrauterino de 26 mm, sem embrião. Qual o diagnóstico?","opts":["Gestação intrauterina inviável, anembrionada","Gestação tópica em evolução, ainda muito inicial","Gestação ectópica com pseudossaco intrauterino","Mola hidatiforme parcial em fase inicial"],"c":0,"exp":"Curva inadequada com saco gestacional intrauterino sem embrião (ou embrião sem batimentos) define gestação intrauterina inviável — aqui anembrionada, já que um saco de 26 mm sem embrião ultrapassa o limite de 25 mm. A ultrassonografia localizou a gestação dentro do útero; o β-hCG mostrou que ela não evolui.","ref":[1,12]},{"id":"07f1cfe090","q":"Mulher de 28 anos, com oito semanas de atraso menstrual, tem sangramento moderado e cólica em baixo ventre à direita. Teve uma gestação a termo, tratou doença inflamatória pélvica há três anos e é tabagista. Quais dados aumentam a probabilidade pré-teste de gestação ectópica?","opts":["DIP tratada e tabagismo atual","Gestação a termo prévia e idade","Atraso de 8 semanas e cólica","Sangramento moderado e paridade"],"c":0,"exp":"Doença inflamatória pélvica prévia e tabagismo lesam os cílios e a motilidade tubária, atrasando o transporte do ovo — o mecanismo central da gestação ectópica. Atraso menstrual, sangramento e cólica compõem a queixa, mas não separam ectópica de abortamento; a gestação a termo prévia não aumenta o risco.","ref":[3,2]},{"id":"0598093edc","q":"Na mesma paciente de 28 anos com suspeita de ectópica, o exame especular mostra pequeno sangramento pelo orifício externo e colo fechado. Que formas de abortamento esse achado afasta?","opts":["Abortamento inevitável e abortamento incompleto","Ameaça de abortamento e abortamento retido","Abortamento completo e abortamento retido","Ameaça de abortamento e abortamento completo"],"c":0,"exp":"Inevitável e incompleto cursam com colo aberto — produto ainda na cavidade ou restos ovulares sendo eliminados. Colo fechado mantém no páreo a ameaça, o retido, o completo e a gestação ectópica, que sobe para o topo da lista quando há dor à mobilização do colo e massa anexial dolorosa.","ref":[3,4]},{"id":"0a2e03721b","q":"Gestante estável, com dor em fossa ilíaca direita e colo fechado, tem β-hCG de 4.200 mUI/mL. A USTV mostra cavidade vazia, endométrio de 12 mm, imagem anexial direita de 2,8 cm sem embrião e pequena quantidade de líquido livre. Qual a interpretação?","opts":["Gestação ectópica íntegra até prova em contrário","Gestação tópica inicial, repetir USTV em uma semana","Abortamento completo com corpo lúteo hemorrágico","Gestação de localização indefinida, inconclusiva"],"c":0,"exp":"Com β-hCG de 4.200 mUI/mL — acima da zona discriminatória —, uma gestação tópica já deveria ser visível. Cavidade vazia, massa anexial e líquido livre em pequena quantidade configuram ectópica íntegra até prova em contrário. Não é localização indefinida, porque o valor ultrapassa a faixa em que o exame ainda seria inconclusivo.","ref":[3,6]},{"id":"c6bc4063c5","q":"Gestante com ectópica íntegra, aguardando o β-hCG de controle, evolui com dor abdominal súbita e intensa, PA 82/50 mmHg, FC 128 bpm, palidez, sudorese, descompressão dolorosa difusa e abaulamento doloroso do fundo de saco posterior. Qual a conduta?","opts":["Estabilizar e operar de imediato, sem aguardar exame confirmatório","Metotrexato em dose única, já que a massa media menos de 3 cm","Tomografia de abdome para confirmar o hemoperitônio antes de operar","Repetir β-hCG em 48 horas e reavaliar a massa por ultrassonografia"],"c":0,"exp":"É gestação ectópica rota com abdome agudo hemorrágico, e a janela do metotrexato fechou. Estabilização e cirurgia caminham juntas — dois acessos calibrosos, reposição volêmica, reserva de hemocomponentes e centro cirúrgico —, e nenhum exame complementar deve atrasar a intervenção quando o diagnóstico clínico está feito.","ref":[3,8]},{"id":"2ebc18c514","q":"Gestante com sangramento de primeiro trimestre tem tipagem O negativo e pesquisa de anticorpos irregulares negativa. O que esse resultado permite concluir e indicar?","opts":["Não está sensibilizada e tem indicação de imunoglobulina anti-D","Já está sensibilizada e não se beneficia da imunoglobulina anti-D","Só terá indicação de anti-D se for submetida a instrumentação","Dispensa a anti-D por se tratar de perda antes de 12 semanas"],"c":0,"exp":"Pesquisa de anticorpos irregulares (Coombs indireto) negativa significa que a gestante Rh negativa ainda não foi sensibilizada — exatamente quem se beneficia da profilaxia. A anti-D está indicada em abortamento de qualquer forma clínica, gestação ectópica e doença trofoblástica, independentemente da idade gestacional ou de instrumentação, o mais precocemente possível após o evento.","ref":[6,0]},{"id":"b64f85c949","q":"Se a pesquisa de anticorpos irregulares de uma gestante Rh negativa com abortamento viesse positiva para anti-D, o que isso significaria?","opts":["Sensibilização prévia, situação em que a profilaxia não se aplica","Indicação de dose dobrada de imunoglobulina anti-D após o evento","Falso-positivo esperado nas perdas antes de 12 semanas de gestação","Necessidade de repetir a pesquisa em 72 horas para então decidir"],"c":0,"exp":"A imunoglobulina anti-D é profilaxia: serve para impedir que a mãe forme anticorpos contra o antígeno D. Se a pesquisa já é positiva, a sensibilização ocorreu e não há mais o que prevenir — por isso a indicação exige gestante Rh negativa não sensibilizada.","ref":[6,1]},{"id":"e4e1f3917c","q":"Paciente estável, com ectópica íntegra, massa anexial pequena, β-hCG na faixa favorável e seguimento garantido. Qual achado adicional, sozinho, tira o metotrexato da mesa?","opts":["Batimentos cardíacos embrionários na massa anexial","Pequena quantidade de líquido livre restrito à pelve","Antecedente de doença inflamatória pélvica tratada","Endométrio de 12 mm sem saco gestacional na cavidade"],"c":0,"exp":"Os critérios do metotrexato são cumulativos: basta um item não preenchido para afastar o método. Atividade cardíaca embrionária presente associa-se a maior falha do tratamento clínico. Pequena quantidade de líquido livre restrito à pelve, DIP prévia e endométrio espessado sem saco gestacional não contraindicam o fármaco.","ref":[4,1]},{"id":"f74140f4ea","q":"Qual condição clínica contraindica o metotrexato no tratamento da gestação ectópica?","opts":["Úlcera péptica em atividade","Tabagismo de longa data","Cesárea anterior há 2 anos","Laqueadura tubária prévia"],"c":0,"exp":"Contraindicam o metotrexato: hepatopatia, nefropatia, discrasia sanguínea, imunodeficiência, úlcera péptica ativa e amamentação — o fármaco é um antimetabólito com toxicidade hepática, renal, medular e de mucosas. Tabagismo e laqueadura são fatores de risco para a ectópica, não contraindicações ao tratamento.","ref":[4,1]},{"id":"dfad8a038f","q":"Uma ectópica íntegra preenche os critérios clínicos e ultrassonográficos para metotrexato, mas a paciente mora em zona rural e não tem como retornar para dosagens seriadas de β-hCG. Qual a conduta mais adequada?","opts":["Abordagem cirúrgica, pois o seguimento não está garantido","Metotrexato em dose única, com retorno apenas se tiver dor","Metotrexato em dose dupla para dispensar as dosagens seriadas","Conduta expectante, com nova USTV no próximo pré-natal"],"c":0,"exp":"Seguimento ambulatorial garantido é critério de elegibilidade, não detalhe: a resposta ao metotrexato é monitorada pela queda do β-hCG em dias definidos, e queda insuficiente exige nova dose ou cirurgia. Sem retorno possível, a opção medicamentosa sai da mesa — as bancas costumam testar justamente a instabilidade ou a falta de seguimento.","ref":[4,5]},{"id":"721f164a28","q":"Gestante de sete semanas, estável, tem sangramento discreto e indolor, colo fechado e embrião com batimentos cardíacos à USTV. Qual afirmação sobre a conduta é correta?","opts":["Expectante, com orientação de sinais de alarme e retorno programado","Repouso absoluto e progesterona de rotina até completar 12 semanas","Misoprostol vaginal, pois o sangramento indica perda iminente","Aspiração manual intrauterina, pelo risco de evoluir para retido"],"c":0,"exp":"Colo fechado com embrião vivo define ameaça de abortamento: a gestação é intrauterina e viável, e qualquer esvaziamento interromperia uma gestação em evolução. A conduta é expectante, com orientação sobre sinais de alarme, suporte e retorno programado. Repouso absoluto e progesterona de rotina não têm indicação estabelecida nesse cenário.","ref":[2,4]},{"id":"787772cf64","q":"Mulher de 24 anos, com nove semanas, estável e afebril, tem sangramento moderado, colo aberto e restos ovulares na USTV. Quais condutas são aceitáveis?","opts":["Expectante, misoprostol ou aspiração manual intrauterina","Somente curetagem uterina sob anestesia geral imediata","Somente antibiótico de amplo espectro e reavaliação","Somente ocitocina em infusão contínua até a expulsão"],"c":0,"exp":"No abortamento incompleto em paciente estável, sem infecção e sem sangramento intenso, cabem conduta expectante, misoprostol ou aspiração manual intrauterina. Quando se opta pelo esvaziamento no primeiro trimestre, a aspiração manual é preferida à curetagem: menor risco de perfuração e de sinéquias, sem dilatação cervical ampla e com possibilidade de realização ambulatorial.","ref":[2,6]},{"id":"c4b480ef16","q":"Qual paciente com abortamento incompleto exige esvaziamento uterino, em vez de misoprostol ou conduta expectante?","opts":["Instável ou com sinais de infecção","Estável, com 8 semanas e afebril","Estável, primigesta e sem dor","Estável, com sangramento discreto"],"c":0,"exp":"Conduta expectante e medicamentosa servem à paciente estável, sem sinais de infecção e sem sangramento intenso. Instabilidade hemodinâmica e abortamento infectado exigem esvaziamento uterino — oferecer misoprostol a paciente instável ou infectada é um dos distratores que mais derrubam.","ref":[2,8]},{"id":"acd5badddd","q":"Paciente de 22 anos chega após tentativa de interrupção da gestação, com sangramento de odor fétido, dor pélvica intensa, temperatura de 38,8 °C, colo aberto e restos ovulares na USTV. Qual a conduta correta?","opts":["Antibiótico de amplo espectro associado ao esvaziamento uterino","Antibiótico de amplo espectro isolado, com reavaliação em 48 horas","Misoprostol ambulatorial com antibiótico oral e retorno em 7 dias","Analgesia e observação clínica, aguardando a expulsão espontânea"],"c":0,"exp":"No abortamento infectado, o material retido é o próprio foco da infecção. A antibioticoterapia de amplo espectro é indispensável, mas acompanha o esvaziamento uterino — nunca o substitui —, e o atraso na remoção do foco favorece a progressão para sepse.","ref":[2,10]},{"id":"ca4317a4dc","q":"Mulher de 24 anos, com 12 semanas de atraso, tem sangramento com eliminação de vesículas, hiperêmese, útero maior que o esperado, PA 150/95 mmHg, β-hCG de 380.000 mUI/mL e massa intrauterina heterogênea com múltiplos espaços císticos, sem feto. Qual o diagnóstico mais provável?","opts":["Mola hidatiforme completa","Mola hidatiforme parcial","Gemelar com pré-eclâmpsia","Coriocarcinoma gestacional"],"c":0,"exp":"Útero maior que o esperado, β-hCG desproporcionalmente elevado, eliminação de vesículas e massa com múltiplos espaços císticos sem feto são a assinatura da mola completa. Hiperêmese e hipertensão antes das 20 semanas reforçam a hipótese. A mola parcial cursa com feto, β-hCG menos elevado e útero compatível ou menor que o esperado.","ref":[5,0]},{"id":"5f5c995fec","q":"Gestante de 15 semanas apresenta PA de 150/100 mmHg com proteinúria e útero maior que o esperado para a idade gestacional. Qual hipótese precisa ser investigada?","opts":["Mola hidatiforme","Hipertensão crônica","Gestação gemelar","Lúpus com nefrite"],"c":0,"exp":"Pré-eclâmpsia antes das 20 semanas em gestante com útero aumentado deve levantar a hipótese de mola hidatiforme. Hiperêmese gravídica e sinais de tireotoxicose são os outros achados que as bancas plantam no enunciado para apontar doença trofoblástica.","ref":[5,2]},{"id":"25ced77b2f","q":"Qual achado ultrassonográfico é típico da mola hidatiforme parcial?","opts":["Placenta com áreas císticas focais e feto em geral malformado","Massa intrauterina em cachos de uva, sem qualquer tecido fetal","Útero vazio com massa anexial e anel de fogo ao Doppler","Saco gestacional de 26 mm sem embrião e com borda regular"],"c":0,"exp":"A mola parcial é triploide e contém tecido fetal: à ultrassonografia, placenta com áreas císticas focais e feto, em geral malformado. O β-hCG é menos elevado — por vezes compatível com a idade gestacional — e a altura uterina é compatível ou menor que a esperada. O aspecto em cachos de uva sem feto é da mola completa.","ref":[5,1]},{"id":"df5813c760","q":"Mulher de 43 anos, com prole constituída, tem diagnóstico de mola hidatiforme completa. Sobre a histerectomia nesse caso, é correto afirmar:","opts":["Pode ser considerada, mas não dispensa o seguimento com β-hCG","É a via de escolha em toda mola, por eliminar o risco de NTG","Está contraindicada, pois a vácuo-aspiração é a única opção","Dispensa o seguimento, pois remove todo o tecido trofoblástico"],"c":0,"exp":"A vácuo-aspiração é a via preferida de esvaziamento na mola. A histerectomia pode ser considerada em pacientes com prole constituída e fatores de risco, mas não elimina o risco de neoplasia trofoblástica gestacional — o seguimento seriado do β-hCG continua obrigatório.","ref":[5,4]},{"id":"10ac62e992","q":"Após o esvaziamento de uma mola completa, quando se indica quimioterapia?","opts":["Apenas quando a curva do β-hCG preenche critério de NTG","Profilaticamente em todas, logo após o esvaziamento","Em todas com β-hCG inicial acima de 100.000 mUI/mL","Apenas se o sangramento persistir após a 1ª semana"],"c":0,"exp":"Quimioterapia não é profilática nem generalizada: é reservada às pacientes que preenchem critérios de neoplasia trofoblástica gestacional — platô ou elevação do β-hCG em dosagens sucessivas, persistência além do prazo esperado ou diagnóstico de coriocarcinoma. A alta vem com β-hCG seriado até a negativação e contracepção eficaz durante todo o seguimento.","ref":[5,10]},{"id":"f76f523736","q":"Paciente em seguimento pós-molar tem queda progressiva do β-hCG e, à ultrassonografia, cistos tecaluteínicos ovarianos em regressão. Como interpretar?","opts":["Evolução esperada, pois os cistos regridem com a queda do hCG","Sinal de neoplasia trofoblástica, com indicação de quimioterapia","Metástase ovariana que exige ooforectomia bilateral imediata","Nova gestação, que deve ser confirmada com β-hCG qualitativo"],"c":0,"exp":"Cistos tecaluteínicos decorrem da hiperestimulação ovariana pelo hCG elevado e regridem à medida que ele cai. O que define neoplasia trofoblástica é o comportamento da curva — platô ou elevação em dosagens sucessivas —, não cistos em regressão nem sangramento discreto nos primeiros dias após o esvaziamento.","ref":[5,11]},{"id":"f39d96709a","q":"Gestante de 34 semanas, hipertensa, chega com dor abdominal intensa e contínua, pequeno sangramento escuro, útero hipertônico, PA 160/105 mmHg e frequência cardíaca fetal de 90 bpm com desacelerações. Qual a conduta?","opts":["Resolução imediata pela via mais rápida, com estabilização simultânea","Corticoide para maturação pulmonar e conduta expectante por 48 horas","Ultrassonografia obstétrica para confirmar o descolamento antes de agir","Tocólise para relaxar a hipertonia e recuperar a vitalidade fetal"],"c":0,"exp":"Dor intensa, hipertonia, sangramento escuro e sofrimento fetal em gestante hipertensa configuram descolamento prematuro de placenta. O diagnóstico é clínico, e a conduta é resolução imediata pela via mais rápida, com estabilização materna simultânea. Corticoide com expectativa mantém a gestação diante de hemorragia ativa, e a tocólise é contraindicada.","ref":[7,5]},{"id":"50880f552a","q":"Qual é o papel da ultrassonografia na suspeita de descolamento prematuro de placenta com feto vivo e sofrimento fetal?","opts":["Pode ser normal e não deve atrasar a decisão: o diagnóstico é clínico","É obrigatória antes da conduta, pois confirma o hematoma em quase todas","Define a via de parto, pois mede a extensão exata da área descolada","Substitui a cardiotocografia na avaliação da vitalidade fetal"],"c":0,"exp":"A ultrassonografia pode ser falso-negativa no descolamento e jamais deve atrasar a decisão. O diagnóstico é clínico — dor súbita e intensa, hipertonia, sangramento escuro (que pode ser oculto) e comprometimento da vitalidade fetal —, e a conduta é a resolução imediata.","ref":[7,5]},{"id":"e53357aba0","q":"Por que, no descolamento prematuro de placenta, o volume de sangue exteriorizado pode subestimar a perda real?","opts":["O sangue pode ficar retido em hematoma atrás da placenta","O útero hipertônico reabsorve o sangue da cavidade amniótica","O sangramento é fetal e não altera a hemodinâmica materna","O colo fechado impede qualquer exteriorização de sangue"],"c":0,"exp":"No descolamento, o sangue se acumula entre a placenta e a parede uterina, formando hematoma retroplacentário; parte da perda — ou toda ela — pode ficar oculta. Por isso, sinais de choque e sofrimento fetal desproporcionais ao sangramento visível são típicos do quadro.","ref":[7,4]},{"id":"c11e30c3a0","q":"Gestante de 32 semanas, com duas cesáreas prévias, tem sangramento vaginal vermelho vivo, indolor e de início súbito. O útero tem tônus normal, a frequência cardíaca fetal é de 140 bpm, a paciente está estável e não há ultrassonografia recente. Qual a conduta inicial?","opts":["Exame especular e ultrassonografia para localizar a placenta, sem toque","Toque vaginal para avaliar dilatação e apagamento do colo uterino","Amniotomia para acelerar o trabalho de parto e reduzir o sangramento","Cesárea de emergência imediata, antes de qualquer outra avaliação"],"c":0,"exp":"Sangramento vermelho vivo, indolor, com tônus normal e vitalidade fetal preservada é a assinatura da placenta prévia. Enquanto a placenta não for localizada por ultrassonografia, o toque vaginal é proscrito pelo risco de agravar o sangramento; o exame especular é permitido e informa origem e intensidade da perda. A indicação de cesárea depende da localização placentária, da idade gestacional e da estabilidade materna e fetal.","ref":[7,9]},{"id":"2012bcfc8a","q":"À beira do leito, antes de qualquer exame, qual par de achados mais ajuda a separar descolamento prematuro de placenta de placenta prévia?","opts":["Dor e tônus uterino","Idade e paridade","Febre e leucocitose","Pressão e pulso"],"c":0,"exp":"O descolamento cursa com dor súbita e intensa e útero hipertônico; a placenta prévia, com sangramento indolor e útero de tônus normal. Junto com a vitalidade fetal — comprometida com frequência no descolamento, habitualmente preservada na prévia —, dor e tônus separam os dois diagnósticos antes de qualquer exame.","ref":[7,1]},{"id":"8a9875d44b","q":"Qual conjunto de fatores de risco é típico da placenta prévia?","opts":["Cesárea prévia, multiparidade e idade materna avançada","Doença hipertensiva, trauma abdominal e tabagismo","Nuliparidade, obesidade e diabetes mellitus gestacional","Polidrâmnio, gemelaridade e macrossomia fetal"],"c":0,"exp":"Cesárea prévia, multiparidade e idade materna avançada são os fatores clássicos da placenta prévia. Doença hipertensiva, trauma e tabagismo pertencem ao descolamento prematuro de placenta; cicatriz uterina com uso inadequado de uterotônico, à rotura uterina.","ref":[7,1]},{"id":"70fcce3ba7","q":"Gestante de 28 semanas, com três cesáreas prévias e placenta prévia total à ultrassonografia, está assintomática na consulta de pré-natal. Qual a conduta mais adequada?","opts":["Investigar acretismo e programar o parto em centro de referência","Indicar cesárea de urgência no momento do diagnóstico","Liberar parto vaginal se não houver sangramento até o termo","Manter o pré-natal habitual, sem nenhum exame adicional"],"c":0,"exp":"Placenta prévia com cesáreas prévias é a combinação de maior risco para acretismo placentário. Investiga-se com ultrassonografia com Doppler, complementada por ressonância magnética quando necessário, e programa-se cesárea eletiva em centro de referência, com equipe multiprofissional, reserva de hemocomponentes e histerectomia planejada se indicada. Na prévia total, o parto vaginal é contraindicado.","ref":[7,12]},{"id":"355ec4b38e","q":"Qual é a apresentação típica do acretismo placentário não diagnosticado no pré-natal?","opts":["Hemorragia maciça na dequitação, sem dor nem sangramento antes","Dor súbita intensa com hipertonia e sangramento escuro no 3º trimestre","Sangramento vermelho vivo recorrente e indolor desde o 2º trimestre","Dor lancinante com parada das contrações e subida da apresentação"],"c":0,"exp":"No acretismo, a placenta adere anormalmente ao útero e não se desprende: a gestação transcorre sem dor, com vitalidade fetal preservada, e a hemorragia é maciça na dequitação. As demais alternativas descrevem, nessa ordem, descolamento prematuro de placenta, placenta prévia e rotura uterina.","ref":[7,12]},{"id":"aa6fa2ea1f","q":"Gestante de 39 semanas, com uma cesárea prévia, em indução com ocitocina, tem dor abdominal súbita e lancinante, parada das contrações, sangramento vaginal, subida da apresentação ao toque e bradicardia fetal mantida. Qual a conduta?","opts":["Laparotomia imediata com estabilização simultânea","Aumentar a ocitocina para restabelecer a dinâmica","Fórcipe para abreviar o período expulsivo","Tocólise e reavaliação clínica em 30 minutos"],"c":0,"exp":"Dor súbita e lancinante com cessação das contrações, subida da apresentação e bradicardia em gestante com cicatriz uterina sob ocitocina é rotura uterina consumada. A conduta é laparotomia imediata, com estabilização materna simultânea e reserva de hemocomponentes. Aumentar a ocitocina agrava a lesão, e o fórcipe pressupõe apresentação insinuada — que deixa de existir após a rotura.","ref":[7,15]},{"id":"f3cb898c0f","q":"Qual achado ao exame abdominal é característico da rotura uterina consumada?","opts":["Útero mal delimitado, com partes fetais palpáveis","Útero hipertônico, lenhoso e doloroso à palpação","Útero de tônus normal, indolor, com feto ativo","Útero maior que a idade gestacional e amolecido"],"c":0,"exp":"Na rotura consumada, o feto passa total ou parcialmente para a cavidade abdominal: o útero fica mal delimitado, as partes fetais são palpadas sob a parede abdominal, há subida da apresentação e bradicardia fetal. Útero hipertônico e doloroso é o do descolamento; tônus normal e indolor, o da placenta prévia.","ref":[7,14]},{"id":"3c74030ea3","q":"Adolescente de 15 anos, acompanhada pela mãe, relata violência sexual ocorrida há 20 horas. Não registrou boletim de ocorrência e teme a exposição do caso. Qual a conduta da equipe?","opts":["Atendimento imediato e integral, com notificação compulsória, sem exigir BO","Atendimento condicionado à apresentação do boletim de ocorrência policial","Encaminhamento prévio à delegacia, com retorno ao serviço após o registro","Atendimento somente após autorização judicial, por se tratar de menor"],"c":0,"exp":"O atendimento à pessoa em situação de violência sexual é obrigatório na rede de saúde e independe de boletim de ocorrência ou de autorização judicial. A notificação é compulsória e, em criança ou adolescente, há ainda comunicação ao Conselho Tutelar. Exigir documentos revitimiza e atrasa profilaxias cuja eficácia depende do tempo.","ref":[8,1]},{"id":"f65b91a44d","q":"Além do diagnóstico e da via de esvaziamento, quais itens completam o plano terapêutico de uma perda gestacional precoce?","opts":["Anti-D se Rh negativo, analgesia, acolhimento e contracepção","Antibiótico profilático, repouso absoluto e progesterona","Curetagem de revisão, ocitocina e retorno em seis meses","Cariótipo do casal, trombofilias e cerclagem na próxima"],"c":0,"exp":"Um plano completo inclui estabilização quando necessária, definição da via, imunoglobulina anti-D na Rh negativa não sensibilizada, analgesia e prevenção de náuseas, acolhimento, orientação de sinais de alarme e planejamento reprodutivo — contracepção e intervalo até nova gestação fazem parte da alta, não de uma consulta futura.","ref":[6,5]}],"resumo":[{"h":"Raciocínio inicial: trimestre, padrão de sangramento e estabilidade","blocos":[{"html":"<p>Sangramento na gestação se aborda com três perguntas, nesta ordem de importância: <strong>a paciente está estável?<\/strong>, <strong>em que metade da gestação estamos?<\/strong> e <strong>qual é o padrão do sangramento e da dor?<\/strong> A idade gestacional restringe o leque de diagnósticos antes de qualquer exame. Na <strong>primeira metade<\/strong> (até 20–22 semanas), três entidades concentram a casuística — <strong>abortamento<\/strong> nas suas formas clínicas, <strong>gestação ectópica<\/strong> e <strong>doença trofoblástica gestacional<\/strong>. Na <strong>segunda metade<\/strong>, quatro — <strong>descolamento prematuro de placenta (DPP)<\/strong>, <strong>placenta prévia<\/strong>, <strong>acretismo placentário<\/strong> e <strong>rotura uterina<\/strong>.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Período<\/th><th>Hipóteses<\/th><th>O que mais separa à beira do leito<\/th><\/tr><\/thead><tbody><tr><td>Primeira metade<\/td><td>Abortamento, gestação ectópica, doença trofoblástica<\/td><td>Colo aberto ou fechado, β-hCG (comportamento) e ultrassonografia transvaginal (localização)<\/td><\/tr><tr><td>Segunda metade<\/td><td>DPP, placenta prévia, acretismo, rotura uterina<\/td><td>Padrão da dor, tônus uterino e vitalidade fetal — antes de qualquer exame<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A estratificação de gravidade decide a via <strong>antes<\/strong> de o diagnóstico fechar. A <strong>paciente instável<\/strong> — hipotensão, taquicardia, palidez, sudorese, descompressão dolorosa, abaulamento do fundo de saco — vai para <strong>abordagem cirúrgica imediata<\/strong>: diagnóstico e estabilização caminham juntos, sem atraso para exame confirmatório. A <strong>paciente estável<\/strong> permite investigação escalonada, com β-hCG seriado, ultrassonografia e, quando cabível, tratamento medicamentoso.<\/p>"},{"html":"<p>Na admissão de toda gestante que sangra, solicitam-se <strong>tipagem sanguínea com fator Rh<\/strong> e <strong>pesquisa de anticorpos irregulares<\/strong> (Coombs indireto). É o item que muda a conduta e o que mais se esquece.<\/p>"},{"html":"<blockquote><p>As hemorragias seguem entre as principais causas de <strong>morte materna evitável<\/strong>. O que muda desfecho é reconhecimento precoce, acesso rápido a hemocomponentes e transporte oportuno — a hemorragia obstétrica ainda mata mulheres jovens por <strong>atraso de reconhecimento<\/strong>.<\/p><\/blockquote>"}]},{"h":"β-hCG seriado e ultrassonografia: comportamento × localização","blocos":[{"html":"<p>A regra que organiza toda a investigação da primeira metade é simples: <strong>o β-hCG descreve o comportamento da gestação; a ultrassonografia diz onde ela está<\/strong>. Nenhum dos dois decide sozinho — e a conduta se decide com os dois e com a paciente na frente.<\/p>"},{"html":"<h3>O mito da duplicação<\/h3>"},{"html":"<p>A regra clássica de que o β-hCG \"dobra em 48 horas\" superestima o incremento esperado. Numa gestação tópica evolutiva, o aumento mínimo aceitável é bem menor que 100% — da ordem de 35% a 50% em 48 horas — e <strong>varia conforme o valor inicial<\/strong>: quanto mais alto o ponto de partida, menor o aumento percentual esperado. Exigir que dobre rotula como anormais gestações viáveis.<\/p>"},{"html":"<p>Uma <strong>curva de elevação inadequada<\/strong> (platô ou alta insuficiente) indica apenas <strong>gestação anormal<\/strong> — que pode ser <strong>ectópica<\/strong> ou <strong>intrauterina inviável<\/strong>. Ela não localiza nada.<\/p>"},{"html":"<blockquote><p><strong>Pérola:<\/strong> β-hCG que não dobrou não é sinônimo de ectópica. Curva inadequada = gestação anormal; quem diz se ela está dentro ou fora do útero é a ultrassonografia.<\/p><\/blockquote>"},{"html":"<h3>Zona discriminatória<\/h3>"},{"html":"<p>É a <strong>faixa de β-hCG acima da qual se espera visualizar o saco gestacional intrauterino<\/strong> na ultrassonografia transvaginal — tradicionalmente entre 1.500 e 2.000 mUI/mL, com referências mais conservadoras usando 3.500 mUI/mL antes de declarar a gestação anormal. Funciona como <strong>faixa de referência, não como gatilho isolado de conduta<\/strong>:<\/p>"},{"html":"<ul><li><strong>Acima da zona, com cavidade vazia:<\/strong> forte suspeita de gestação ectópica.<\/li><li><strong>Abaixo da zona, com cavidade vazia:<\/strong> o exame ainda <strong>não é conclusivo<\/strong> — trata-se de gestação de localização indefinida; repetir β-hCG em 48 horas e manter ultrassonografia seriada.<\/li><\/ul>"},{"html":"<blockquote><p><strong>Armadilha de prova:<\/strong> decidir com um valor isolado, sem clínica e sem ultrassonografia seriada, é a principal fonte de erro — inclusive de esvaziamento ou metotrexato aplicados a uma <strong>gestação tópica desejada<\/strong>.<\/p><\/blockquote>"},{"html":"<h3>Lendo curvas reais<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Curva de β-hCG em 48 h<\/th><th>Ultrassonografia transvaginal<\/th><th>Interpretação<\/th><\/tr><\/thead><tbody><tr><td>1.100 → 1.750 mUI/mL (≈ +60%)<\/td><td>Saco gestacional intrauterino com vesícula vitelínica<\/td><td><strong>Gestação tópica em evolução<\/strong> — incremento adequado mesmo sem dobrar<\/td><\/tr><tr><td>2.900 → 3.050 mUI/mL (≈ +5%)<\/td><td>Cavidade vazia, massa anexial de 2 cm<\/td><td><strong>Gestação ectópica<\/strong> — curva inadequada, valor acima da zona, massa anexial<\/td><\/tr><tr><td>5.400 → 2.100 mUI/mL (queda)<\/td><td>Cavidade vazia, endométrio fino, sem massa anexial<\/td><td><strong>Gestação de localização indefinida em resolução / perda precoce<\/strong><\/td><\/tr><tr><td>310.000 mUI/mL em dosagem única<\/td><td>Massa intrauterina heterogênea com múltiplos espaços císticos<\/td><td><strong>Doença trofoblástica gestacional<\/strong><\/td><\/tr><tr><td>1.400 → 1.520 mUI/mL (≈ +9%)<\/td><td>Saco gestacional intrauterino de 26 mm, sem embrião<\/td><td><strong>Gestação intrauterina inviável (anembrionada)<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<h3>O mapa de padrões<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Padrão<\/th><th>β-hCG<\/th><th>Ultrassonografia<\/th><\/tr><\/thead><tbody><tr><td><strong>Tópica evolutiva<\/strong><\/td><td>Incremento adequado em 48 h<\/td><td>Saco gestacional intrauterino visível quando o valor ultrapassa a zona discriminatória<\/td><\/tr><tr><td><strong>Intrauterina inviável<\/strong><\/td><td>Curva inadequada ou em queda<\/td><td>Saco gestacional sem embrião ou embrião sem batimentos<\/td><\/tr><tr><td><strong>Gestação ectópica<\/strong><\/td><td>Curva inadequada<\/td><td>Cavidade vazia acima da zona discriminatória, massa anexial e eventual líquido livre<\/td><\/tr><tr><td><strong>Doença trofoblástica<\/strong><\/td><td>Desproporcionalmente elevado para a idade gestacional<\/td><td>Útero maior que o esperado, massa intrauterina com espaços císticos<\/td><\/tr><\/tbody><\/table><\/div>"}]},{"h":"Formas clínicas do abortamento e condutas","blocos":[{"html":"<p>Abortamento é a perda com idade gestacional <strong>inferior a 20–22 semanas<\/strong>. O <strong>colo uterino<\/strong> e a <strong>ultrassonografia<\/strong> separam as seis formas clínicas, e a conduta segue a forma clínica <strong>e a estabilidade da paciente<\/strong>.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Forma clínica<\/th><th>Colo uterino<\/th><th>Ultrassonografia<\/th><th>Conduta<\/th><\/tr><\/thead><tbody><tr><td><strong>Ameaça<\/strong><\/td><td>Fechado<\/td><td>Embrião com batimentos presentes<\/td><td>Expectante, com orientação e retorno programado<\/td><\/tr><tr><td><strong>Inevitável<\/strong><\/td><td>Aberto<\/td><td>Produto ainda na cavidade<\/td><td>Esvaziamento, ou medicamentoso na paciente estável<\/td><\/tr><tr><td><strong>Incompleto<\/strong><\/td><td>Aberto<\/td><td>Restos ovulares na cavidade<\/td><td>Expectante, misoprostol ou aspiração manual intrauterina<\/td><\/tr><tr><td><strong>Completo<\/strong><\/td><td>Fechado<\/td><td>Cavidade vazia, endométrio fino<\/td><td>Expectante, com controle clínico<\/td><\/tr><tr><td><strong>Retido<\/strong><\/td><td>Fechado<\/td><td>Embrião sem batimentos ou saco anembrionado<\/td><td>Expectante, medicamentosa ou esvaziamento<\/td><\/tr><tr><td><strong>Infectado<\/strong><\/td><td>Aberto, com odor fétido<\/td><td>Restos, com ou sem coleção<\/td><td>Antibiótico de amplo espectro <strong>mais<\/strong> esvaziamento<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Na prática, o colo é o primeiro filtro: <strong>colo fechado afasta o abortamento inevitável e o incompleto<\/strong> e mantém no páreo a ameaça, o retido, o completo — e a gestação ectópica, que também cursa com colo fechado.<\/p>"},{"html":"<h3>Ameaça de abortamento<\/h3>"},{"html":"<p>Colo fechado e embrião com batimentos definem uma gestação <strong>intrauterina e viável<\/strong>: qualquer esvaziamento seria a interrupção de uma gestação em evolução. A conduta é <strong>expectante<\/strong>, com orientação sobre sinais de alarme, suporte e retorno programado. <strong>Repouso absoluto e progesterona de rotina não têm indicação estabelecida<\/strong> nesse cenário.<\/p>"},{"html":"<h3>Aspiração manual intrauterina × curetagem<\/h3>"},{"html":"<p>No primeiro trimestre, quando se decide esvaziar, <strong>prefere-se a aspiração manual intrauterina (AMIU)<\/strong>: menor risco de perfuração e de sinéquias, dispensa dilatação cervical ampla, pode ser feita em ambiente ambulatorial, com menor custo e recuperação mais rápida. A <strong>curetagem<\/strong> fica reservada a situações específicas ou à indisponibilidade do método — e é o distrator preferido das bancas. Histerectomia é desproporcional, e ocitocina isolada não esvazia o útero nessa idade gestacional.<\/p>"},{"html":"<h3>Quando o misoprostol não serve<\/h3>"},{"html":"<p>Conduta expectante e medicamentosa aplicam-se à <strong>paciente estável, sem sinais de infecção e sem sangramento intenso<\/strong>. <strong>Instabilidade hemodinâmica e abortamento infectado exigem esvaziamento uterino.<\/strong><\/p>"},{"html":"<h3>Abortamento infectado<\/h3>"},{"html":"<p>Típico após tentativa de interrupção insegura: sangramento com <strong>odor fétido<\/strong>, dor pélvica intensa, febre, colo aberto e restos na cavidade. O material retido <strong>é o foco<\/strong> da infecção. A antibioticoterapia de amplo espectro é indispensável, mas <strong>acompanha o esvaziamento — nunca o substitui<\/strong> —, e o atraso na remoção do foco favorece a progressão para sepse.<\/p>"},{"html":"<blockquote><p><strong>Distrator clássico:<\/strong> antibiótico isolado, \"com reavaliação em 48 horas\", no abortamento infectado. Trata a infecção sem remover o foco.<\/p><\/blockquote>"}]},{"h":"Gestação ectópica: o caso em quatro tempos","blocos":[{"html":"<p>O raciocínio da ectópica fica claro acompanhando uma paciente que muda de cenário diante do médico.<\/p>"},{"html":"<h4>Tempo 1 — história<\/h4>"},{"html":"<p>Mulher de 28 anos, com uma gestação a termo prévia, <strong>atraso menstrual de oito semanas<\/strong>, sangramento moderado há 12 horas e <strong>cólica em baixo ventre com predomínio à direita<\/strong>. Teste de farmácia positivo, sem pré-natal. Antecedentes: <strong>doença inflamatória pélvica tratada há três anos<\/strong> e <strong>tabagismo<\/strong>. As três hipóteses que o trimestre autoriza são abortamento, ectópica e doença trofoblástica; DIP prévia e tabagismo — ambos lesam cílios e motilidade tubária — elevam a probabilidade pré-teste de ectópica.<\/p>"},{"html":"<h4>Tempo 2 — exame físico<\/h4>"},{"html":"<p>PA 106/68 mmHg, FC 96 bpm, mucosas discretamente descoradas. Abdome doloroso à palpação profunda em fossa ilíaca direita, <strong>sem descompressão dolorosa<\/strong>. Especular com pequeno sangramento e <strong>colo fechado<\/strong>; toque com <strong>dor à mobilização do colo e massa anexial direita dolorosa<\/strong>. O colo fechado afasta abortamento inevitável e incompleto; dor à mobilização e massa anexial deslocam a <strong>ectópica para o topo<\/strong> da lista.<\/p>"},{"html":"<h4>Tempo 3 — exames<\/h4>"},{"html":"<p><strong>β-hCG de 4.200 mUI/mL<\/strong>, hemoglobina de 11,2 g/dL, tipagem <strong>O negativo com pesquisa de anticorpos irregulares negativa<\/strong>. Ultrassonografia transvaginal: útero normal, <strong>cavidade vazia<\/strong>, endométrio de 12 mm, <strong>imagem anexial direita de 2,8 cm<\/strong> sem embrião e sem batimentos, pequena quantidade de líquido livre em fundo de saco. β-hCG acima da zona discriminatória com cavidade vazia e massa anexial: <strong>gestação ectópica íntegra até prova em contrário<\/strong>. A tipagem O negativa é o dado que costuma passar despercebido.<\/p>"},{"html":"<h4>Tempo 4 — o ponto de virada<\/h4>"},{"html":"<p>Enquanto aguarda o β-hCG de controle, a paciente tem <strong>dor abdominal súbita e intensa<\/strong>, PA 82/50 mmHg, FC 128 bpm, palidez, sudorese, abdome distendido com <strong>descompressão dolorosa difusa<\/strong> e <strong>abaulamento doloroso do fundo de saco posterior<\/strong>. É <strong>ectópica rota com abdome agudo hemorrágico<\/strong>: a janela do metotrexato fechou.<\/p>"},{"html":"<blockquote><p>Ectópica íntegra é um quadro que pode romper a qualquer momento. Por isso a orientação sobre sinais de alarme e o retorno garantido fazem parte da elegibilidade ao tratamento clínico, não de um detalhe da alta.<\/p><\/blockquote>"},{"html":"<h3>Estratificação: instável × estável<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th><\/th><th><strong>Paciente instável — abdome agudo hemorrágico<\/strong><\/th><th><strong>Paciente estável — ectópica íntegra<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Sinais<\/td><td>Hipotensão, taquicardia, palidez, sudorese; descompressão dolorosa e abaulamento do fundo de saco<\/td><td>Estabilidade hemodinâmica, sem sinais de rotura<\/td><\/tr><tr><td>Investigação<\/td><td>Nenhum exame atrasa a decisão<\/td><td>Escalonada, com β-hCG seriado e ultrassonografia<\/td><\/tr><tr><td>Conduta<\/td><td><strong>Abordagem cirúrgica imediata<\/strong>, com dois acessos calibrosos, reposição volêmica e reserva de hemocomponentes<\/td><td>Elegibilidade ao metotrexato avaliada critério a critério; cirurgia conservadora ou radical conforme integridade tubária e desejo reprodutivo<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Na paciente instável, oferecer metotrexato, aguardar nova dosagem de β-hCG ou pedir tomografia são condutas que retardam a intervenção em hemorragia ativa — exame de imagem adicional não muda a conduta quando o diagnóstico clínico já está estabelecido.<\/p>"}]},{"h":"Metotrexato: critérios cumulativos e seguimento","blocos":[{"html":"<p>Os critérios de elegibilidade são <strong>cumulativos<\/strong>: basta <strong>um<\/strong> item da coluna da direita para que a opção medicamentosa saia da mesa.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Favorece o metotrexato<\/th><th>Afasta o metotrexato<\/th><\/tr><\/thead><tbody><tr><td>Paciente hemodinamicamente estável<\/td><td>Instabilidade hemodinâmica ou sinais de rotura<\/td><\/tr><tr><td>Gestação ectópica íntegra, sem sinais de rotura<\/td><td>Hemoperitônio significativo ou abdome agudo<\/td><\/tr><tr><td>Massa anexial de pequenas dimensões<\/td><td>Massa de maiores dimensões, conforme protocolo do serviço<\/td><\/tr><tr><td>Ausência de batimentos cardíacos embrionários<\/td><td><strong>Atividade cardíaca embrionária presente<\/strong><\/td><\/tr><tr><td>β-hCG dentro da faixa favorável do protocolo<\/td><td>β-hCG acima da faixa favorável<\/td><\/tr><tr><td>Seguimento ambulatorial garantido e paciente aderente<\/td><td>Impossibilidade de retorno para dosagens seriadas<\/td><\/tr><tr><td>Ausência de contraindicações ao fármaco<\/td><td>Hepatopatia, nefropatia, discrasia sanguínea, imunodeficiência, úlcera péptica ativa ou amamentação<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Os valores de corte variam entre protocolos; as referências usuais são <strong>massa de até 3,5 cm<\/strong> e <strong>β-hCG de até 5.000 mUI/mL<\/strong>. A atividade cardíaca embrionária presente associa-se a maior falha do método. As contraindicações ao fármaco refletem sua toxicidade: é um antimetabólito, com efeito hepático, renal, medular e sobre mucosas.<\/p>"},{"html":"<blockquote><p><strong>O que as bancas testam:<\/strong> o descumprimento de <strong>um único critério<\/strong> — quase sempre a <strong>instabilidade<\/strong> ou a <strong>ausência de seguimento garantido<\/strong>. Paciente que preenche tudo, mas não tem como voltar para as dosagens seriadas, não é candidata.<\/p><\/blockquote>"},{"html":"<h4>Monitorização<\/h4>"},{"html":"<p>Após a aplicação, o β-hCG é dosado em dias definidos pelo protocolo; <strong>queda insuficiente indica nova dose ou mudança para abordagem cirúrgica<\/strong>.<\/p>"},{"html":"<h4>Cirurgia na paciente estável<\/h4>"},{"html":"<p>Quando o metotrexato não é possível, a cirurgia é <strong>conservadora ou radical<\/strong> conforme a integridade da tuba e o desejo reprodutivo da paciente.<\/p>"}]},{"h":"Doença trofoblástica gestacional: mola, esvaziamento e seguimento","blocos":[{"html":"<p>A doença trofoblástica aparece no enunciado com uma assinatura reconhecível: <strong>útero maior que o esperado<\/strong>, <strong>aspecto ultrassonográfico em cachos de uva<\/strong> e <strong>β-hCG desproporcionalmente elevado<\/strong>. Um caso típico: mulher de 24 anos, 12 semanas de atraso, sangramento com <strong>eliminação de vesículas<\/strong>, <strong>hiperêmese<\/strong>, útero aumentado, PA 150/95 mmHg, β-hCG de 380.000 mUI/mL e massa intrauterina heterogênea com múltiplos espaços císticos — <strong>mola hidatiforme completa<\/strong>.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th><\/th><th>Mola completa<\/th><th>Mola parcial<\/th><\/tr><\/thead><tbody><tr><td>Cariótipo<\/td><td>Diploide, de origem <strong>androgenética<\/strong><\/td><td><strong>Triploide<\/strong><\/td><\/tr><tr><td>Tecido fetal<\/td><td><strong>Ausente<\/strong><\/td><td><strong>Presente<\/strong><\/td><\/tr><tr><td>β-hCG<\/td><td>Desproporcionalmente elevado<\/td><td>Menos elevado, por vezes compatível com a idade gestacional<\/td><\/tr><tr><td>Ultrassonografia<\/td><td>Massa com múltiplos espaços císticos, em cachos de uva<\/td><td>Placenta com áreas císticas focais e feto, em geral malformado<\/td><\/tr><tr><td>Altura uterina<\/td><td>Maior que a esperada<\/td><td>Compatível ou menor que a esperada<\/td><\/tr><tr><td>Risco de neoplasia trofoblástica<\/td><td><strong>Maior — cerca de 20%<\/strong><\/td><td><strong>Menor — cerca de 5%<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p><strong>Sinais que a banca planta:<\/strong> hiperêmese gravídica, sinais de tireotoxicose e <strong>hipertensão antes das 20 semanas<\/strong>. Pré-eclâmpsia precoce em gestante com útero aumentado deve levantar a hipótese de <strong>mola hidatiforme<\/strong> — não é coincidência, é achado esperado.<\/p><\/blockquote>"},{"html":"<h3>Esvaziamento<\/h3>"},{"html":"<p>A <strong>vácuo-aspiração<\/strong> é a via preferida. A <strong>histerectomia<\/strong> pode ser considerada em pacientes com <strong>prole constituída e fatores de risco<\/strong>, mas <strong>não dispensa o seguimento<\/strong> posterior: ela não elimina o risco de neoplasia trofoblástica.<\/p>"},{"html":"<h3>Seguimento seriado do β-hCG<\/h3>"},{"html":"<p>Dosagens seriadas até a negativação, seguidas de controle por período adicional, em serviço de referência. O esquema de referência (FIGO):<\/p>"},{"html":"<ul><li><strong>Semanal<\/strong> até <strong>três dosagens negativas<\/strong> consecutivas.<\/li><li>Depois, <strong>mensal por seis meses<\/strong> negativos.<\/li><\/ul>"},{"html":"<p><strong>Contracepção eficaz é obrigatória durante todo o seguimento.<\/strong> Uma nova gestação eleva o β-hCG e mascara exatamente o sinal que está sendo vigiado — a suspeita de neoplasia trofoblástica gestacional. A paciente só deve engravidar de novo <strong>após completar o seguimento<\/strong>.<\/p>"},{"html":"<h3>Critérios de neoplasia trofoblástica gestacional<\/h3>"},{"html":"<p><strong>Platô<\/strong> do β-hCG em dosagens sucessivas, <strong>elevação<\/strong> do β-hCG, <strong>persistência<\/strong> além do prazo esperado ou diagnóstico histológico de <strong>coriocarcinoma<\/strong>. Confirmada a neoplasia, encaminha-se para <strong>quimioterapia<\/strong> em serviço de referência.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Achado no seguimento<\/th><th>Significado<\/th><\/tr><\/thead><tbody><tr><td>Queda progressiva e sustentada do β-hCG<\/td><td>Evolução favorável esperada<\/td><\/tr><tr><td>Platô ou elevação em dosagens sucessivas<\/td><td><strong>Neoplasia trofoblástica gestacional<\/strong><\/td><\/tr><tr><td>Sangramento discreto nos primeiros dias após o esvaziamento<\/td><td>Achado comum e inespecífico<\/td><\/tr><tr><td>Cistos tecaluteínicos em regressão<\/td><td>Regressão de achado ligado ao hCG alto, não progressão<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A quimioterapia <strong>não é profilática<\/strong>: fica reservada a quem preencher os critérios de neoplasia. Alta sem seguimento, liberação de nova gestação quando o sangramento cessa e quimioterapia para todas são os três distratores clássicos da orientação pós-molar.<\/p>"}]},{"h":"Imunoglobulina anti-D e o plano terapêutico completo","blocos":[{"html":"<p>Na <strong>gestante Rh negativa não sensibilizada<\/strong> — isto é, com <strong>pesquisa de anticorpos irregulares negativa<\/strong> —, a imunoglobulina anti-D está indicada em <strong>abortamento de qualquer forma clínica<\/strong>, <strong>gestação ectópica<\/strong> e <strong>doença trofoblástica<\/strong>, <strong>o mais precocemente possível após o evento<\/strong> (classicamente em até 72 horas; a minidose de 150 mcg serve até 12 semanas, e a dose de 300 mcg, acima disso).<\/p>"},{"html":"<ul><li>A indicação <strong>não depende da idade gestacional<\/strong> nem de ter havido <strong>instrumentação<\/strong> uterina.<\/li><li>O exame que decide é a <strong>pesquisa de anticorpos irregulares na gestante<\/strong>, não um Coombs direto no material do abortamento.<\/li><li>Pesquisa <strong>positiva<\/strong> significa <strong>sensibilização prévia<\/strong>: a profilaxia não se aplica, porque não há mais o que prevenir.<\/li><li>A administração deve constar no <strong>prontuário<\/strong> e no <strong>cartão da gestante<\/strong>.<\/li><\/ul>"},{"html":"<blockquote><p>Gestante Rh negativa não sensibilizada com sangramento na gestação recebe imunoglobulina anti-D. É item de alto rendimento em prova e o mais esquecido nas condutas propostas.<\/p><\/blockquote>"},{"html":"<h3>O que uma resposta completa precisa conter<\/h3>"},{"html":"<p>Em questões abertas e estações práticas, a pontuação se perde nos itens que ninguém cita:<\/p>"},{"html":"<ol><li><strong>Estabilização hemodinâmica<\/strong> — acessos calibrosos, reposição volêmica, monitorização e reserva de hemocomponentes na paciente instável.<\/li><li><strong>Definição da via<\/strong> — abordagem cirúrgica imediata na instabilidade; na paciente estável, via de esvaziamento escolhida pela idade gestacional e pela forma clínica.<\/li><li><strong>Imunoglobulina anti-D<\/strong> — na Rh negativa não sensibilizada, o mais cedo possível.<\/li><li><strong>Analgesia e suporte<\/strong> — controle da dor, prevenção de náuseas e acolhimento.<\/li><li><strong>Seguimento e planejamento reprodutivo<\/strong> — retorno, sinais de alarme, contracepção e intervalo até nova gestação. A oferta de método contraceptivo faz parte <strong>da alta<\/strong>, não de uma consulta futura.<\/li><\/ol>"}]},{"h":"Segunda metade: DPP, placenta prévia, acretismo e rotura uterina","blocos":[{"html":"<p>Na segunda metade, <strong>o padrão da dor, o tônus uterino e a vitalidade fetal<\/strong> separam os diagnósticos antes de qualquer exame.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th><\/th><th>Descolamento prematuro de placenta<\/th><th>Placenta prévia<\/th><th>Acretismo placentário<\/th><th>Rotura uterina<\/th><\/tr><\/thead><tbody><tr><td>Dor<\/td><td>Intensa e súbita<\/td><td>Ausente<\/td><td>Ausente até o parto<\/td><td>Súbita e lancinante, com cessação das contrações<\/td><\/tr><tr><td>Sangramento<\/td><td>Escuro, podendo ser oculto<\/td><td>Vermelho vivo, recorrente<\/td><td>Maciço na dequitação<\/td><td>Variável, com hemoperitônio<\/td><\/tr><tr><td>Tônus uterino<\/td><td><strong>Hipertonia<\/strong><\/td><td>Normal<\/td><td>Normal<\/td><td>Útero mal delimitado, partes fetais palpáveis<\/td><\/tr><tr><td>Vitalidade fetal<\/td><td>Comprometida com frequência<\/td><td>Habitualmente preservada<\/td><td>Preservada<\/td><td>Bradicardia e subida da apresentação<\/td><\/tr><tr><td>Fator de risco típico<\/td><td>Doença hipertensiva, trauma, tabagismo<\/td><td>Cesárea prévia, multiparidade, idade avançada<\/td><td>Placenta prévia com cesárea prévia<\/td><td>Cicatriz uterina, uso inadequado de uterotônico<\/td><\/tr><tr><td>Conduta<\/td><td>Resolução imediata pela via mais rápida<\/td><td>Especular sim, toque não; cesárea se prévia total<\/td><td>Cesárea programada em centro de referência<\/td><td>Laparotomia imediata<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p><strong>Regra de segurança:<\/strong> sangramento na segunda metade <strong>sem ultrassonografia prévia que localize a placenta<\/strong> — exame especular pode, <strong>toque vaginal não<\/strong>.<\/p><\/blockquote>"},{"html":"<h3>Descolamento prematuro de placenta<\/h3>"},{"html":"<p>É a separação da placenta normalmente inserida antes do nascimento. O sangue se acumula entre a placenta e a parede uterina, formando <strong>hematoma retroplacentário<\/strong> — por isso o sangramento é <strong>escuro<\/strong> e pode ser <strong>oculto<\/strong>, e choque e sofrimento fetal aparecem <strong>desproporcionais à perda visível<\/strong>. O quadro é de <strong>dor intensa e súbita, hipertonia uterina<\/strong> e comprometimento frequente da vitalidade fetal; o fator de risco mais típico é a <strong>doença hipertensiva<\/strong>, seguida de trauma e tabagismo.<\/p>"},{"html":"<p>O <strong>diagnóstico é clínico<\/strong>. A ultrassonografia pode ser <strong>normal<\/strong> (falso-negativa) e jamais deve atrasar a decisão. Diante de gestante de 34 semanas, hipertensa, com dor contínua, útero hipertônico, sangramento escuro e bradicardia fetal, a conduta é <strong>resolução imediata da gestação pela via mais rápida, com estabilização materna simultânea<\/strong>. Corticoide com expectativa mantém a gestação diante de hemorragia ativa, e a <strong>tocólise é formalmente contraindicada<\/strong>.<\/p>"},{"html":"<blockquote><p>Dois desdobramentos clássicos do descolamento grave: <strong>coagulopatia de consumo<\/strong> (vigiar fibrinogênio e plaquetas) e <strong>útero de Couvelaire<\/strong> — infiltração hemorrágica do miométrio, que favorece a atonia pós-parto. Com <strong>feto morto e mãe estável<\/strong>, a via vaginal costuma ser preferida; com feto vivo, vale a via mais rápida.<\/p><\/blockquote>"},{"html":"<h3>Placenta prévia<\/h3>"},{"html":"<p>É a placenta implantada no segmento inferior, sobre o orifício interno do colo ou próxima a ele. A assinatura clínica é <strong>sangramento vermelho vivo, indolor, recorrente<\/strong>, com <strong>útero de tônus normal<\/strong> e <strong>vitalidade fetal preservada<\/strong>. Fatores de risco: <strong>cesárea prévia, multiparidade e idade materna avançada<\/strong>.<\/p>"},{"html":"<p>Diante de sangramento sem ultrassonografia que localize a placenta, faz-se <strong>exame especular<\/strong> — que informa origem e intensidade da perda — e <strong>ultrassonografia<\/strong>, <strong>sem toque vaginal<\/strong>, proscrito pelo risco de agravar o sangramento. Toque vaginal é o distrator que a banca planta para testar essa regra; amniotomia e cesárea imediata antecipam decisões que dependem da localização placentária, da idade gestacional e da estabilidade materna e fetal. Na <strong>placenta prévia total<\/strong>, que recobre o orifício interno, o <strong>parto vaginal é contraindicado<\/strong> e a via é a cesárea.<\/p>"},{"html":"<h3>Acretismo placentário<\/h3>"},{"html":"<p>É a aderência anormal da placenta ao miométrio — num espectro de profundidade que vai da placenta <strong>acreta<\/strong> (adere ao miométrio) à <strong>increta<\/strong> (invade o miométrio) e à <strong>percreta<\/strong> (ultrapassa a serosa e pode atingir órgãos vizinhos). A combinação de maior risco é <strong>placenta prévia com cesárea prévia<\/strong>, e o risco cresce com o número de cesáreas.<\/p>"},{"html":"<p>Sem diagnóstico prévio, a gestação transcorre <strong>sem dor e com vitalidade preservada<\/strong>, e a hemorragia é <strong>maciça na dequitação<\/strong>, quando a placenta não se desprende. Por isso o pré-natal é a única janela para planejar: em gestante de 28 semanas, com três cesáreas e placenta prévia total, assintomática, investiga-se acretismo com <strong>ultrassonografia com Doppler<\/strong>, complementada por <strong>ressonância magnética<\/strong> quando necessário, e programa-se <strong>cesárea eletiva em centro de referência<\/strong>, com equipe multiprofissional, reserva de hemocomponentes e <strong>histerectomia planejada<\/strong>, se indicada.<\/p>"},{"html":"<h3>Rotura uterina<\/h3>"},{"html":"<p>O cenário típico é gestante com <strong>cicatriz uterina<\/strong> em trabalho de parto, sobretudo com <strong>uso inadequado de uterotônico<\/strong>. A rotura consumada se anuncia por <strong>dor súbita e lancinante com cessação das contrações<\/strong>, sangramento vaginal variável com hemoperitônio, <strong>útero mal delimitado com partes fetais palpáveis sob a parede abdominal<\/strong>, <strong>subida da apresentação<\/strong> ao toque e <strong>bradicardia fetal<\/strong>. Antes da rotura, a distensão do segmento inferior pode se anunciar pela <strong>síndrome de Bandl-Frommel<\/strong> — anel de Bandl palpável entre corpo e segmento e ligamentos redondos retesados.<\/p>"},{"html":"<p>A conduta é <strong>laparotomia imediata<\/strong>, com estabilização materna simultânea e reserva de hemocomponentes. Aumentar a ocitocina agrava a lesão; o fórcipe pressupõe apresentação insinuada, que deixa de existir após a rotura; tocólise e observação perdem o tempo que separa o desfecho favorável do óbito materno e fetal.<\/p>"}]},{"h":"Saúde pública, ética e os distratores que mais derrubam","blocos":[{"html":"<h3>Além da conduta clínica<\/h3>"},{"html":"<ul><li><strong>Acolhimento humanizado:<\/strong> comunicação clara da perda gestacional, privacidade, apoio psicológico e respeito às decisões da mulher durante todo o atendimento.<\/li><li><strong>Violência sexual:<\/strong> o atendimento é <strong>obrigatório<\/strong> na rede de saúde, <strong>imediato e integral<\/strong>, com <strong>notificação compulsória<\/strong>. <strong>Não se exige boletim de ocorrência nem autorização judicial.<\/strong> Em criança ou adolescente, há ainda <strong>comunicação ao Conselho Tutelar<\/strong>. Exigir documentos revitimiza e retarda profilaxias cuja eficácia depende do tempo; notificação em saúde e registro policial são instrumentos distintos e não se substituem.<\/li><li><strong>Mortalidade materna:<\/strong> as hemorragias estão entre as principais causas de morte materna evitável.<\/li><li><strong>Planejamento reprodutivo:<\/strong> método contraceptivo eficaz e intervalo até nova gestação são oferecidos na alta.<\/li><\/ul>"},{"html":"<h3>Os distratores clássicos<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Distrator<\/th><th>Por que está errado<\/th><\/tr><\/thead><tbody><tr><td>Curetagem como primeira escolha no primeiro trimestre<\/td><td>A aspiração manual intrauterina é preferida: menos perfuração e sinéquias, possibilidade ambulatorial<\/td><\/tr><tr><td>Misoprostol para paciente instável ou infectada<\/td><td>Expectante e medicamentoso são para a paciente estável, sem infecção e sem sangramento intenso<\/td><\/tr><tr><td>Antibiótico isolado no abortamento infectado<\/td><td>O esvaziamento é parte do tratamento, não alternativa a ele<\/td><\/tr><tr><td>Presumir ectópica só porque o β-hCG não dobrou<\/td><td>Curva inadequada indica gestação anormal — ectópica ou intrauterina inviável<\/td><\/tr><tr><td>Esquecer a imunoglobulina anti-D<\/td><td>Vale para gestante Rh negativa não sensibilizada com qualquer sangramento da gestação<\/td><\/tr><tr><td>Liberar nova gestação antes de encerrar o seguimento da mola<\/td><td>A gestação eleva o β-hCG e mascara a suspeita de neoplasia trofoblástica<\/td><\/tr><tr><td>Toque vaginal no sangramento da segunda metade sem placenta localizada<\/td><td>Pode agravar o sangramento de uma placenta prévia<\/td><\/tr><tr><td>Aguardar ultrassonografia para confirmar descolamento<\/td><td>O diagnóstico é clínico, e o exame pode ser normal<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<h3>Para levar para a prova<\/h3>"},{"html":"<ol><li>O β-hCG descreve comportamento; a ultrassonografia localiza. Nenhum dos dois decide sozinho.<\/li><li>Paciente instável com abdome agudo hemorrágico vai para abordagem cirúrgica imediata — exame nenhum atrasa essa decisão.<\/li><li>Os critérios do metotrexato são cumulativos: um item não preenchido tira a opção medicamentosa da mesa.<\/li><li>No abortamento infectado, o antibiótico acompanha o esvaziamento; jamais o substitui. E a aspiração manual vem antes da curetagem.<\/li><li>Gestante Rh negativa não sensibilizada com sangramento na gestação recebe imunoglobulina anti-D.<\/li><li>Na segunda metade, dor, tônus e vitalidade fetal separam DPP, placenta prévia, acretismo e rotura — e sem placenta localizada não se faz toque.<\/li><\/ol>"}]}]},{"slug":"imagem-mama","titulo":"Imagem em Mama","disciplina":"GO","eyebrow":"Ginecologia · Mastologia","questoes":[{"id":"073d76bbd9","q":"O esquema divide as duas incidências básicas da mamografia em regiões numeradas. O que representam as regiões 3 e 4, marcadas na incidência da direita?","opts":["Quadrantes laterais (3) e mediais (4) da mama","Quadrantes superiores (3) e inferiores (4) da mama","Terços anterior (3) e posterior (4) do parênquima","Prolongamento axilar (3) e região retroareolar (4)"],"c":0,"exp":"A incidência da direita é a crânio-caudal (CC), que divide a mama em metade lateral e metade medial. A médio-lateral oblíqua (MLO), à esquerda, é a que divide a mama em superior (1) e inferior (2). Por isso o laudo combina as duas incidências para localizar o achado num quadrante.","cap":"MLO e CC com as regiões da mama numeradas","ref":[2,1]},{"id":"79a1cf0a38","q":"O esquema compara a linha que vai da papila ao músculo peitoral na MLO com a medida equivalente na CC. Qual a diferença máxima aceitável entre as duas para considerar a CC bem posicionada?","opts":["Até 1 cm de diferença entre as duas medidas","Até 5 cm de diferença entre as duas medidas","Até 1 mm de diferença entre as duas medidas","Até 3 cm de diferença entre as duas medidas"],"c":0,"exp":"A distância da papila ao vértice do peitoral na MLO comparada à distância da papila ao ponto mais posterior na CC não pode exceder 1 cm. Diferença maior indica que tecido posterior ficou fora do campo na crânio-caudal, exigindo reposicionamento.","cap":"Comparação da linha papila-peitoral entre MLO e CC","ref":[2,5]},{"id":"132a05f51b","q":"Mamografia de rastreamento em incidência MLO bilateral de mulher de 55 anos, mostrando apenas tecido fibroglandular e gordura em distribuição habitual, sem nódulos, calcificações ou distorções. Qual a categoria e a conduta?","opts":["BI-RADS 1 — retorno de rotina conforme a idade","BI-RADS 0 — complementar com ampliação da lesão","BI-RADS 3 — controle precoce em seis meses","BI-RADS 2 — controle por imagem em seis meses"],"c":0,"exp":"Exame sem qualquer achado é categoria 1 (negativo), com risco de malignidade próximo de zero e conduta de rastreamento de rotina para a faixa etária. A categoria 2 também retorna à rotina, mas exige um achado benigno identificado, o que não ocorre aqui.","cap":"MLO bilateral sem achados focais","ref":[4,0]},{"id":"f1fa60473a","q":"Nódulo mamográfico contendo calcificações grosseiras e coalescentes, com aspecto clássico 'em pipoca'. Qual o diagnóstico presumido e a categoria?","opts":["Fibroadenoma calcificado — BI-RADS 2, rotina","Carcinoma com necrose — BI-RADS 5, biópsia","Esteatonecrose recente — BI-RADS 3, controle","Cisto oleoso calcificado — BI-RADS 0, complemento"],"c":0,"exp":"A calcificação grosseira coalescente 'em pipoca' dentro de um nódulo é o padrão de fibroadenoma em involução, um achado tipicamente benigno. Entra em BI-RADS 2, com risco próximo de zero e retorno ao rastreamento de rotina para a idade.","cap":"Nódulo com calcificação grosseira em pipoca","ref":[3,1]},{"id":"141e10baa0","q":"Mamografia mostrando calcificações tubulares dispostas em dois traços paralelos, acompanhando um trajeto tortuoso no parênquima. Como classificar esse achado?","opts":["Calcificações vasculares — benignas, BI-RADS 2","Calcificações lineares finas — suspeitas, BI-RADS 4","Calcificações em bastonetes — benignas, BI-RADS 3","Calcificações pleomórficas — suspeitas, BI-RADS 5"],"c":0,"exp":"O par de linhas paralelas em 'trilho de trem' acompanhando um vaso tortuoso define calcificação vascular, listada entre as tipicamente benignas do BI-RADS. A conduta é rotina para a idade, sem necessidade de ampliação ou biópsia.","cap":"Calcificações em trilho de trem ao longo de um vaso","ref":[4,4]},{"id":"3556095440","q":"Mamografia com múltiplas calcificações arredondadas de centro lucente, com aspecto de casca de ovo, em paciente com trauma mamário prévio. Qual o achado e a conduta?","opts":["Cistos oleosos de esteatonecrose — rotina para a idade","Calcificações amorfas agrupadas — biópsia percutânea","Microcalcificações pleomórficas — biópsia percutânea","Calcificações de leite de cálcio — perfil a noventa graus"],"c":0,"exp":"Calcificações anelares, de parede fina e centro radiotransparente, correspondem a cistos oleosos da esteatonecrose, típicos após trauma ou cirurgia. São tipicamente benignas (BI-RADS 2) e dispensam qualquer complementação ou biópsia.","cap":"Calcificações anelares com centro lucente","ref":[4,4]},{"id":"25fa52c319","q":"Mamografia de mama previamente operada mostrando depósitos de cálcio lineares que desenham o trajeto de um fio, com nós reconhecíveis. Qual a categoria?","opts":["BI-RADS 2 — calcificação de sutura, típica benigna","BI-RADS 4 — calcificação linear fina ramificada suspeita","BI-RADS 0 — necessita ampliação para caracterização","BI-RADS 5 — calcificação segmentar de alta suspeição"],"c":0,"exp":"O reconhecimento do formato do fio e dos nós identifica a calcificação de sutura, achado tipicamente benigno em mama operada. É categoria 2, com retorno à rotina, e não deve ser confundida com calcificações lineares finas de carcinoma in situ.","cap":"Cálcio depositado sobre fio de sutura, com nós","ref":[4,1]},{"id":"fab4213270","q":"Segundo o fluxograma de seguimento apresentado, um achado classificado como BI-RADS 3 que permanece estável ao longo dos 24 meses de controle deve ser:","opts":["reclassificado como BI-RADS 2, com retorno à rotina","mantido como BI-RADS 3 por mais 24 meses de controle","reclassificado como BI-RADS 4, indicando core biopsy","reclassificado como BI-RADS 1, dispensando mamografia"],"c":0,"exp":"O esquema prevê controle aos 6 meses (mamografia do lado alterado), 12 e 24 meses (bilateral). Estabilidade nesses dois anos reclassifica a lesão como categoria 2, achado benigno, e a paciente volta ao rastreamento de rotina para a idade.","cap":"Fluxograma de seguimento do BI-RADS 3","ref":[5,3]},{"id":"9ff247f748","q":"Mamografias MLO e CC bilaterais mostrando maior volume de tecido fibroglandular na mama esquerda, ocupando mais de um quadrante, sem nódulo, distorção ou calcificações, e estável em relação ao exame anterior. Como descrever o achado?","opts":["Assimetria global — benigna quando é estável","Assimetria focal — nova, com indicação de biópsia","Distorção arquitetural — com indicação de biópsia","Nódulo obscurecido — com indicação de ultrassom"],"c":0,"exp":"Assimetria que ocupa mais de um quadrante, sem margens convexas nem achado associado, é uma assimetria global. Estável na comparação com exames prévios, corresponde a variação da distribuição do tecido fibroglandular e é considerada benigna.","cap":"Assimetria de mais de um quadrante na mama esquerda","ref":[5,6]},{"id":"3f0eb3dc32","q":"Comparação da mamografia atual (acima) com o exame prévio (abaixo) revela assimetria focal nova, que ocupa menos de um quadrante. Qual a categoria e a conduta?","opts":["BI-RADS 4 — biópsia, pois o VPP é de cerca de 27%","BI-RADS 3 — controle semestral por dois anos seguidos","BI-RADS 2 — retorno ao rastreamento de rotina da idade","BI-RADS 0 — apenas repetir a mamografia em doze meses"],"c":0,"exp":"Assimetria focal em primeira mamografia, após complementação e ultrassom negativos, pode ser BI-RADS 3; porém, quando é nova ou está em crescimento, sobe para BI-RADS 4, com valor preditivo positivo em torno de 27%. Neste caso, tratava-se de carcinoma lobular invasivo.","cap":"Assimetria focal nova comparada ao exame prévio","ref":[5,6]},{"id":"7be38a6f80","q":"Mamografia ampliada mostrando calcificações finas, irregulares, descontínuas e com ramificações, todas medindo menos de 0,5 mm. Qual a interpretação?","opts":["Morfologia suspeita — típica de carcinoma ductal in situ","Morfologia benigna — típica de ectasia ductal com secreção","Morfologia benigna — típica de fibroadenoma em involução","Morfologia suspeita — típica de adenose esclerosante focal"],"c":0,"exp":"Calcificações lineares finas ramificadas moldam a luz de ductos preenchidos por células neoplásicas e necrose, sendo o padrão clássico de carcinoma ductal in situ. Diferem das calcificações em grandes bastonetes da ectasia ductal, que são grossas, maiores que 1 mm e benignas.","cap":"Calcificações lineares finas ramificadas","ref":[4,5]},{"id":"daed595501","q":"Detalhe de mamografia mostrando convergência radiada de linhas finas para um ponto central, sem nódulo identificável nesse ponto. Qual o nome do achado?","opts":["Distorção arquitetural","Assimetria mamária focal","Calcificações amorfas","Nódulo microlobulado"],"c":0,"exp":"Espículas ou retificações do parênquima convergindo para um ponto, sem massa central visível, definem distorção arquitetural. Ela pode corresponder a adenose esclerosante ou cicatriz radiada, mas também a carcinoma ductal invasivo, e por isso indica investigação histológica.","cap":"Convergência radiada sem massa central","ref":[6,1]},{"id":"aa1937b918","q":"Ultrassonografia mostrando nódulo hipoecoico cujo maior eixo é perpendicular à pele, isto é, mais alto do que largo. Qual o descritor e o seu significado?","opts":["Orientação não paralela — achado suspeito, BI-RADS 4","Orientação paralela — achado provavelmente benigno","Reforço acústico posterior — achado típico e benigno","Margem circunscrita — achado provavelmente benigno"],"c":0,"exp":"A lesão que cresce atravessando os planos teciduais fica mais alta do que larga, configurando orientação não paralela à pele. É um descritor suspeito do léxico ultrassonográfico e leva à categoria 4, com indicação de core biopsy. Neste caso, tratava-se de carcinoma ductal invasivo.","cap":"Nódulo mais alto do que largo em dois planos","ref":[6,7]},{"id":"2d0766b38f","q":"Ultrassonografia axilar em paciente com câncer de mama recém-diagnosticado, mostrando linfonodo com cortical espessada, hilo gorduroso obliterado e margem indis
