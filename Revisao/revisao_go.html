iv>"},{"html":"<p>A lógica que amarra a coluna da direita é a <strong>ovulação incessante<\/strong>: tudo o que reduz o número de ovulações (pílula, gestação, amamentação) ou interrompe a tuba (laqueadura) protege.<\/p>"},{"html":"<p>Dois pontos finos que caem em prova:<\/p>"},{"html":"<ul><li><strong>Endometriose<\/strong> associa-se ao carcinoma <strong>endometrioide<\/strong>, mas as evidências ainda não permitem dizer se é causalidade ou se as duas doenças apenas compartilham fatores de risco.<\/li><li><strong>Tratamentos de fertilidade (inclusive FIV)<\/strong>: há associação <strong>modesta com tumores borderline<\/strong>, mas <strong>não<\/strong> aumento consistente do risco de carcinoma epitelial <strong>invasor<\/strong> — os estudos são heterogêneos e a causalidade é incerta.<\/li><\/ul>"}]},{"h":"Clínica, exame físico e laboratório","blocos":[{"html":"<h3>História clínica<\/h3>"},{"html":"<p>Os sintomas são <strong>inespecíficos<\/strong>: sangramento genital, aumento do volume abdominal, dor abdominal e pélvica. O câncer de ovário costuma se anunciar por queixas que a paciente normaliza — distensão, dor pélvica, saciedade precoce ou dificuldade para comer, náusea, fadiga, constipação, flatulência, sintomas urinários (urgência, frequência), dispareunia, alteração menstrual, dor lombar.<\/p>"},{"html":"<blockquote><p><strong>Bandeira vermelha:<\/strong> sintomas de <strong>início súbito, severos ou de progressão rápida<\/strong>, sobretudo associados a <strong>sintomas consumptivos<\/strong>, obrigam a considerar tumor maligno de ovário.<\/p><\/blockquote>"},{"html":"<p>Outras pistas orientam o diferencial:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Pista<\/th><th>Pense em<\/th><\/tr><\/thead><tbody><tr><td>Febre, calafrios, vômitos<\/td><td>Processo infeccioso<\/td><\/tr><tr><td>Sintomas agudos<\/td><td><strong>Gestação ectópica<\/strong> e <strong>torção ovariana<\/strong><\/td><\/tr><tr><td>Metrorragia + dismenorreia<\/td><td>Leiomioma<\/td><\/tr><tr><td>Dispareunia + dismenorreia severa<\/td><td><strong>Endometrioma<\/strong><\/td><\/tr><tr><td>Febre + dor à mobilização do colo<\/td><td>Abscesso tubo-ovariano / DIP<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Na anamnese, investigar fatores de risco, idade, história reprodutiva, <strong>desejo gestacional/contraceptivo<\/strong> e — sempre — <strong>uso de contraceptivo e atraso menstrual<\/strong>, porque gestação traz patologias próprias (corpo-lúteo, ectópica, aborto tubário).<\/p>"},{"html":"<h3>Exame físico<\/h3>"},{"html":"<p>Dirigido à queixa: exame especular, toque vaginal, toque retal, palpação de <strong>linfonodos supraclaviculares e inguinais<\/strong>, pesquisa de <strong>ascite<\/strong> e visceromegalias. O exame identifica massa anexial em <strong>até 45%<\/strong> dos casos, com <strong>especificidade de 90%<\/strong> — e é inespecífico na maioria das vezes. Em mulher <strong>assintomática<\/strong>, toque bimanual e USTV <strong>não<\/strong> têm acurácia para tumores anexiais e não servem como rastreamento (ACOG, 2014).<\/p>"},{"html":"<h3>Laboratório<\/h3>"},{"html":"<ul><li><strong>Beta-hCG<\/strong> — obrigatório na menacme para descartar gestação e doenças relacionadas.<\/li><li><strong>Hemograma<\/strong> (e PCR) — leucocitose sugere DIP/abscesso tubo-ovariano.<\/li><li><strong>CA-125<\/strong> — o marcador mais relevante, com limites que precisam ser conhecidos.<\/li><\/ul>"},{"html":"<p>O <strong>CA-125<\/strong> é uma glicoproteína produzida pelo <strong>mesotélio<\/strong> (no ovário normal, em cistos de inclusão, áreas de metaplasia e excrescências papilares), com valor de referência de <strong>35 U/mL<\/strong>. Está elevado em <strong>~80%<\/strong> (70 a 80%) das mulheres com câncer epitelial de ovário, mas tem dois problemas: <strong>pode ser normal nos estádios iniciais<\/strong> e <strong>sobe em muitas condições benignas e malignas<\/strong> (endometriose, miomas, DIP, cirrose, tuberculose, câncer de pulmão e de mama). Na <strong>pós-menopausa<\/strong>, sensibilidade e especificidade melhoram: o <strong>valor preditivo positivo é de 98%, contra 49% na menacme<\/strong>. Desde 2016, o ACOG recomenda que o CA-125 <strong>não seja usado isoladamente<\/strong> para diferenciar tumor benigno de maligno.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Condição<\/th><th>CA-125 &gt; 35 U/mL<\/th><\/tr><\/thead><tbody><tr><td>Cirrose com ascite<\/td><td>100%<\/td><\/tr><tr><td><strong>Câncer de ovário<\/strong><\/td><td><strong>70 a 80%<\/strong><\/td><\/tr><tr><td>Endometriomas<\/td><td>67%<\/td><\/tr><tr><td>Cirrose<\/td><td>67%<\/td><\/tr><tr><td>DIP aguda<\/td><td>30%<\/td><\/tr><tr><td>Tumores epiteliais benignos<\/td><td>29%<\/td><\/tr><tr><td>Miomas<\/td><td>26%<\/td><\/tr><tr><td>Endometriose<\/td><td>25%<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Os demais marcadores apontam para a linhagem do tumor:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Marcador<\/th><th>Tumor<\/th><\/tr><\/thead><tbody><tr><td><strong>AFP<\/strong><\/td><td>Tumor de saco vitelínico · teratoma imaturo · Sertoli-Leydig<\/td><\/tr><tr><td><strong>Beta-hCG<\/strong><\/td><td>Disgerminoma · coriocarcinoma<\/td><\/tr><tr><td><strong>DHL<\/strong><\/td><td>Disgerminoma · teratoma imaturo<\/td><\/tr><tr><td><strong>CA-125, CEA, CA-19-9<\/strong><\/td><td>Tumores epiteliais<\/td><\/tr><tr><td><strong>Testosterona<\/strong> (andrógenos)<\/td><td>Sertoli-Leydig → hirsutismo, clitoromegalia, amenorreia<\/td><\/tr><tr><td><strong>Estradiol<\/strong><\/td><td>Células da granulosa → amenorreia, puberdade precoce<\/td><\/tr><\/tbody><\/table><\/div>"}]},{"h":"Ultrassonografia: padrões benignos, regras IOTA e O-RADS","blocos":[{"html":"<p>A <strong>ultrassonografia transvaginal (USTV) é a primeira linha<\/strong> de investigação. O trabalho dela é responder a uma pergunta só: <em>essa massa tem cara de benigna ou precisa de especialista?<\/em><\/p>"},{"html":"<h3>O cisto simples e sua história natural<\/h3>"},{"html":"<p><strong>Cisto simples<\/strong> é imagem <strong>homogênea, circular e anecoica<\/strong>, que pode ter septos incompletos ou menores que 3 mm e ecos em suspensão. Num estudo com 15.106 mulheres com menos de 50 anos, 2.363 tinham cistos simples menores que 10 cm, e <strong>70% se resolveram espontaneamente em até 3 meses<\/strong>; dos 117 que persistiram, 52% eram cistoadenomas serosos e <strong>nenhum era câncer<\/strong>.<\/p>"},{"html":"<h3>Padrões provavelmente benignos (IOTA)<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Lesão<\/th><th>Achado ultrassonográfico<\/th><th>Comentário<\/th><\/tr><\/thead><tbody><tr><td><strong>Cisto simples<\/strong><\/td><td>Anecoico, homogêneo, circular, sem componente interno, avascular<\/td><td>&lt; 3 cm: folículo · 3–5 cm: cisto funcional<\/td><\/tr><tr><td><strong>Cisto hemorrágico<\/strong><\/td><td>Conteúdo heterogêneo com linhas finas (padrão <strong>reticular<\/strong>), coágulo retrátil de margem côncava, sem fluxo interno<\/td><td>Sangramento dentro do folículo/corpo-lúteo<\/td><\/tr><tr><td><strong>Endometrioma<\/strong><\/td><td>Conteúdo homogêneo em <strong>\"vidro fosco\"<\/strong> (ecos finos de baixa intensidade), cápsula espessa, focos hiperecogênicos de permeio<\/td><td>Endometriose ovariana cística<\/td><\/tr><tr><td><strong>Cisto dermoide<\/strong><\/td><td>Nódulo misto com área <strong>hiperecogênica e sombra acústica posterior<\/strong>, linhas e pontos hiperecogênicos; raramente esferas flutuantes (patognomônicas)<\/td><td>Bilateral em 10%<\/td><\/tr><tr><td><strong>Fibroma<\/strong><\/td><td>Massa <strong>sólida hipoecoica<\/strong>, homogênea, com atenuação do feixe posterior<\/td><td>Pode compor a síndrome de Meigs<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Aspectos benignos: A cisto hemorrágico, B endometrioma, C cisto funcional, D cisto simples com septo fino<\/p>"},{"html":"<h3>O que levanta suspeita<\/h3>"},{"html":"<p><strong>Componente sólido, multiloculação, cápsula espessa, diâmetro &gt; 6 cm, septo grosseiro, projeções papilares, ascite e fluxo alterado ao Doppler.<\/strong> Septos e projeções finas, isoladamente, têm baixo risco: num estudo de 2.870 mulheres com projeções papilares ou septos, <strong>39% regrediram em 12 meses<\/strong>, e entre as operadas só houve um tumor borderline. O risco sobe com <strong>mais de quatro projeções papilares<\/strong> ou quando elas ocupam <strong>mais de 50% da parede interna<\/strong> do cisto.<\/p>"},{"html":"<p><strong>Teratomas maduros e endometriomas<\/strong> têm risco de transformação maligna <strong>menor que 0,8%<\/strong>, mas exigem seguimento ultrassonográfico. Encaminha-se diante de <strong>crescimento rápido, surgimento de áreas sólidas<\/strong> ou <strong>endometrioma &gt; 9 cm em mulher com mais de 45 anos<\/strong>. Escores antigos (De Priest, Ferrazzi e Finkler) tinham sensibilidade de 91%, 87% e 82% e especificidade de 68%, 81% e 78% — comparáveis à USTV feita por examinador experiente.<\/p>"},{"html":"<h3>Regras simples da IOTA<\/h3>"},{"html":"<p>O grupo <strong>IOTA (International Ovarian Tumor Analysis)<\/strong> reduziu a avaliação a dez características: cinco que sugerem benignidade (<strong>B<\/strong>) e cinco que sugerem malignidade (<strong>M<\/strong>).<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Benignas (B)<\/th><th>Malignas (M)<\/th><\/tr><\/thead><tbody><tr><td><strong>B1<\/strong> Cisto unilocular<\/td><td><strong>M1<\/strong> Tumor sólido irregular<\/td><\/tr><tr><td><strong>B2<\/strong> Componente sólido &lt; 7 mm<\/td><td><strong>M2<\/strong> Ascite<\/td><\/tr><tr><td><strong>B3<\/strong> Sombra acústica<\/td><td><strong>M3<\/strong> ≥ 4 estruturas papilares<\/td><\/tr><tr><td><strong>B4<\/strong> Multilocular liso &lt; 100 mm<\/td><td><strong>M4<\/strong> Multilocular-sólido irregular ≥ 100 mm<\/td><\/tr><tr><td><strong>B5<\/strong> Sem fluxo (color score 1)<\/td><td><strong>M5<\/strong> Fluxo muito intenso (color score 4)<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A leitura: <strong>uma ou mais M sem nenhuma B = maligno<\/strong>; <strong>uma ou mais B sem nenhuma M = benigno<\/strong>; <strong>ambas ou nenhuma = inconclusivo<\/strong> (vai para examinador experiente ou outro método). Calculadoras online (<strong>SRRisk<\/strong>, modelo <strong>ADNEX<\/strong>) convertem os achados em risco percentual: uma paciente avaliada em centro oncológico com <strong>ascite isolada<\/strong> já sai com risco estimado de <strong>93%<\/strong>.<\/p>"},{"html":"<p class=\"figleg\">Regras simples da IOTA — características B (verde) e M (vermelho)<\/p>"},{"html":"<h3>O-RADS: risco em categorias<\/h3>"},{"html":"<p>O <strong>O-RADS<\/strong> organiza os achados em categorias com risco de malignidade definido — e, a cada categoria, uma conduta:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Categoria<\/th><th>Risco<\/th><th>Lesões<\/th><\/tr><\/thead><tbody><tr><td><strong>O-RADS 0<\/strong><\/td><td>—<\/td><td>Avaliação incompleta (massa mal visualizada)<\/td><\/tr><tr><td><strong>O-RADS 1<\/strong><\/td><td>0%<\/td><td>Ovário normal: <strong>folículo<\/strong> (cisto anecoico ≤ 3 cm) ou <strong>corpo-lúteo<\/strong> ≤ 3 cm (parede espessa, fluxo periférico) — <strong>só na pré-menopausa<\/strong><\/td><\/tr><tr><td><strong>O-RADS 2<\/strong><\/td><td>&lt; 1%<\/td><td>Cisto unilocular simples · cisto hemorrágico típico · dermoide típico · endometrioma típico (todos &lt; 10 cm) · cisto unilocular não simples de parede lisa<\/td><\/tr><tr><td><strong>O-RADS 3<\/strong><\/td><td>1 a &lt; 10%<\/td><td>Cisto unilocular <strong>≥ 10 cm<\/strong> · unilocular com parede irregular &lt; 3 mm · multilocular liso &lt; 10 cm com color score 1–3 · sólido liso com color score 1<\/td><\/tr><tr><td><strong>O-RADS 4<\/strong><\/td><td>10 a &lt; 50%<\/td><td>Multilocular liso ≥ 10 cm (CS 1–3) ou de qualquer tamanho com CS 4 · multilocular com parede/septos irregulares · unilocular com componente sólido e 0–3 projeções papilares · multilocular com componente sólido CS 1–2 · sólido liso CS 2–3<\/td><\/tr><tr><td><strong>O-RADS 5<\/strong><\/td><td><strong>≥ 50%<\/strong><\/td><td>Unilocular com <strong>≥ 4 projeções papilares<\/strong> · multilocular com componente sólido CS 3–4 · sólido liso CS 4 · <strong>sólido irregular<\/strong> · <strong>ascite e/ou nódulos peritoneais<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>O <strong>color score<\/strong> gradua o fluxo ao Doppler: 1 = ausente, 2 = leve, 3 = moderado, 4 = muito intenso.<\/p>"},{"html":"<p class=\"figleg\">Manejo da massa anexial pelo O-RADS<\/p>"},{"html":"<p>A conduta acompanha a categoria: <strong>O-RADS 1<\/strong> → conservadora (alta ou repetir em 6 semanas); achados não fisiológicos passam por avaliação de especialista ou pelo <strong>modelo IOTA ADNEX<\/strong>; <strong>O-RADS 2<\/strong> → se assintomática, seguimento em 3, 6 e 12 meses; <strong>O-RADS 3<\/strong> → cirurgia em unidade de ginecologia geral; <strong>O-RADS 4 e 5<\/strong> → <strong>centro especializado em oncologia ginecológica<\/strong>.<\/p>"},{"html":"<h3>Ressonância magnética<\/h3>"},{"html":"<p>A RM de pelve é usada na <strong>dúvida diagnóstica e no preparo cirúrgico<\/strong>: teratomas com imagem atípica ao ultrassom, <strong>coágulos que simulam massa sólida<\/strong> e massas sólidas como fibrotecomas e fibromas. É também a opção quando a via transvaginal não é adequada — <strong>adolescentes e mulheres que ainda não tiveram penetração vaginal<\/strong> — e o exame da <strong>gestante<\/strong> com ultrassom duvidoso.<\/p>"}]},{"h":"Conduta conforme a fase da vida","blocos":[{"html":"<p>Os fluxogramas mudam com o status hormonal, porque o que é fisiológico na menacme (cisto funcional, corpo-lúteo) não existe na pós-menopausa — e o CA-125 só é discriminativo depois dela.<\/p>"},{"html":"<h3>Pré-menopausa<\/h3>"},{"html":"<ol><li><strong>Teste de gravidez.<\/strong> Positivo → considerar gravidez ectópica.<\/li><li>Negativo → <strong>achados suspeitos à USTV/RM?<\/strong> Sim → referenciar ao cirurgião ginecologista ou oncoginecologista. Em paralelo, <strong>afastar abscesso tubo-ovariano<\/strong> (hemograma, PCR).<\/li><li>Sem suspeita → <strong>massa &gt; 10 cm?<\/strong> Sim → referenciar.<\/li><li>Não → <strong>conduta expectante<\/strong> (considerar AINE) e <strong>USTV a cada 4 semanas<\/strong>; se <strong>persistir &gt; 12 semanas<\/strong>, referenciar.<\/li><\/ol>"},{"html":"<p class=\"figleg\">Fluxograma do manejo dos tumores anexiais na pré-menopausa<\/p>"},{"html":"<h3>Pós-menopausa<\/h3>"},{"html":"<ol><li><strong>Massa &gt; 10 cm?<\/strong> Sim → referenciar.<\/li><li>Não → <strong>achados suspeitos à USTV/RM?<\/strong> Sim → referenciar.<\/li><li>Não → <strong>CA-125 &gt; 35 U/mL?<\/strong> Sim → referenciar.<\/li><li>Não → <strong>USTV a cada 4 semanas<\/strong>; se <strong>persistir &gt; 12 semanas<\/strong>, referenciar.<\/li><\/ol>"},{"html":"<p class=\"figleg\">Fluxograma do manejo dos tumores anexiais na pós-menopausa<\/p>"},{"html":"<blockquote><p>Na pós-menopausa há <strong>três portas<\/strong> para o especialista: tamanho &gt; 10 cm, imagem suspeita ou CA-125 &gt; 35 U/mL. Na pré-menopausa, o CA-125 <strong>não<\/strong> entra no fluxograma — o teste de gravidez é que abre a investigação.<\/p><\/blockquote>"},{"html":"<h3>Gestação<\/h3>"},{"html":"<p><strong>Massa anexial sintomática na gestação = cirurgia.<\/strong> A assintomática é reavaliada no ultrassom de cada trimestre (inicial, <strong>18–20 semanas<\/strong> e <strong>32–36 semanas<\/strong>) em busca de critérios de malignidade: <strong>presentes → cirurgia; duvidosos → ressonância magnética; ausentes → reavaliar no próximo ultrassom.<\/strong><\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Detectada no<\/th><th>Risco<\/th><th>Conduta<\/th><\/tr><\/thead><tbody><tr><td><strong>1º trimestre<\/strong><\/td><td>Alto<\/td><td><strong>Cirurgia no 2º trimestre<\/strong><\/td><\/tr><tr><td><strong>1º trimestre<\/strong><\/td><td>Baixo/intermediário<\/td><td>Seguimento além de <strong>14 semanas<\/strong> → regressão: USG a cada <strong>8 semanas<\/strong> até o parto · progressão ou não regressão: <strong>cirurgia no 2º trimestre<\/strong><\/td><\/tr><tr><td><strong>2º trimestre, &lt; 24 semanas<\/strong><\/td><td>Alto ou em progressão<\/td><td>Cirurgia<\/td><\/tr><tr><td><strong>2º trimestre, ≥ 24 semanas<\/strong><\/td><td>Baixo/intermediário<\/td><td>Aguardar o parto (progressão → cirurgia): <strong>parto normal → cirurgia pós-parto<\/strong>; <strong>cesárea → excisão da massa no mesmo ato<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}]},{"h":"Câncer de ovário: carcinogênese, prognóstico, estadiamento e tratamento","blocos":[{"html":"<h3>Origem e disseminação<\/h3>"},{"html":"<p>Há <strong>dois modelos<\/strong> de carcinogênese: origem no <strong>epitélio da superfície ovariana<\/strong> ou origem na <strong>tuba uterina<\/strong>. Seja qual for o sítio, o câncer epitelial de ovário, o de tuba e o peritoneal primário compartilham a característica típica de <strong>disseminação peritoneal precoce<\/strong> — e por isso recebem o mesmo tratamento.<\/p>"},{"html":"<h3>Fatores prognósticos<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Estádios precoces (I e II)<\/th><th>Estádios avançados (III e IV)<\/th><\/tr><\/thead><tbody><tr><td>Estádio (IA-IB vs IC vs II)<\/td><td><strong>Tumor residual após a cirurgia (≤ 1 cm vs &gt; 1 cm)<\/strong><\/td><\/tr><tr><td>Rotura da cápsula ovariana<\/td><td>Estádio (III vs IV)<\/td><\/tr><tr><td>Grau do tumor<\/td><td>Tipo histológico<\/td><\/tr><tr><td>Tipo histológico<\/td><td>Idade<\/td><\/tr><tr><td>Idade<\/td><td>Grau do tumor<\/td><\/tr><tr><td>Citologia do líquido ascítico<\/td><td>Acometimento linfonodal<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>São <strong>favoráveis<\/strong>: ausência de invasão tumoral e de invasão da cápsula, tumor bem ou moderadamente diferenciado (graus 1 e 2), ausência de células malignas no líquido da cavidade abdominal e CA-125 normal ou pouco elevado. <strong>Desfavoráveis<\/strong>: o oposto — invasão presente, grau 3, citologia positiva, CA-125 muito elevado. Na doença avançada, o <strong>residual tumoral<\/strong> é o fator que a cirurgia controla: citorredução ótima (resíduo ≤ 1 cm) muda o prognóstico.<\/p>"},{"html":"<h3>Estadiamento FIGO<\/h3>"},{"html":"<p>O estadiamento é <strong>cirúrgico<\/strong> e segue a FIGO:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Estádio<\/th><th>Definição<\/th><\/tr><\/thead><tbody><tr><td><strong>IA<\/strong><\/td><td>Um ovário (ou tuba), cápsula intacta, sem tumor na superfície, citologia negativa<\/td><\/tr><tr><td><strong>IB<\/strong><\/td><td>Ambos os ovários (ou tubas), cápsula intacta<\/td><\/tr><tr><td><strong>IC<\/strong><\/td><td>Restrito aos ovários, com <strong>IC1<\/strong> rotura cirúrgica · <strong>IC2<\/strong> cápsula rota antes da cirurgia ou tumor na superfície · <strong>IC3<\/strong> células malignas na ascite ou no lavado peritoneal<\/td><\/tr><tr><td><strong>IIA<\/strong><\/td><td>Extensão/implantes no útero e/ou tubas<\/td><\/tr><tr><td><strong>IIB<\/strong><\/td><td>Extensão a outros tecidos pélvicos intraperitoneais<\/td><\/tr><tr><td><strong>IIIA1<\/strong><\/td><td>Só linfonodos retroperitoneais positivos (i: ≤ 10 mm · ii: &gt; 10 mm)<\/td><\/tr><tr><td><strong>IIIA2<\/strong><\/td><td>Envolvimento peritoneal extrapélvico <strong>microscópico<\/strong><\/td><\/tr><tr><td><strong>IIIB<\/strong><\/td><td>Implantes peritoneais extrapélvicos macroscópicos <strong>≤ 2 cm<\/strong><\/td><\/tr><tr><td><strong>IIIC<\/strong><\/td><td>Implantes <strong>&gt; 2 cm<\/strong> (inclui cápsula hepática e esplênica, sem parênquima)<\/td><\/tr><tr><td><strong>IVA<\/strong><\/td><td><strong>Derrame pleural com citologia positiva<\/strong><\/td><\/tr><tr><td><strong>IVB<\/strong><\/td><td>Metástases parenquimatosas e para órgãos extra-abdominais (inclusive linfonodos inguinais)<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Estadiamento FIGO do câncer de ovário<\/p>"},{"html":"<blockquote><p><strong>Derrame pleural só é IVA com citologia positiva.<\/strong> Células malignas na ascite ou no lavado, com tumor restrito aos ovários, são <strong>IC3<\/strong> — não estádio IV. E derrame pleural + ascite + massa ovariana <strong>sem<\/strong> citologia positiva abre a porta para a síndrome de Meigs.<\/p><\/blockquote>"},{"html":"<h3>Tratamento<\/h3>"},{"html":"<p>O primeiro tempo é cirúrgico: <strong>laparotomia com histerectomia total abdominal e salpingo-ooforectomia bilateral<\/strong>, com estadiamento. Na mulher que deseja engravidar, nos <strong>estádios IA a IC<\/strong>, a <strong>salpingo-ooforectomia unilateral<\/strong> preserva a fertilidade. Nos estádios <strong>II, III e IV<\/strong>, faz-se <strong>cirurgia de citorredução<\/strong>; quem não é candidata à cirurgia primária (diagnóstico por paracentese ou toracocentese) recebe <strong>quimioterapia neoadjuvante com citorredução de intervalo<\/strong>.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Estádio<\/th><th>Adjuvância<\/th><\/tr><\/thead><tbody><tr><td>IA/IB <strong>grau 1<\/strong><\/td><td>Observar<\/td><\/tr><tr><td>IA/IB <strong>grau 2<\/strong><\/td><td>Observar ou taxano-carboplatina por 3 a 6 ciclos<\/td><\/tr><tr><td>IA/IB <strong>grau 3<\/strong><\/td><td>Taxano-carboplatina por 3 a 6 ciclos<\/td><\/tr><tr><td><strong>IC<\/strong> (qualquer grau)<\/td><td>Taxano-carboplatina por 3 a 6 ciclos<\/td><\/tr><tr><td><strong>II, III e IV<\/strong><\/td><td><strong>Taxano-carboplatina por 6 ciclos<\/strong>; citorredução de intervalo em casos selecionados (boa resposta e lesões ressecáveis); QT intraperitoneal no estádio III com citorredução ótima (&lt; 1 cm) e no estádio II<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Após o tratamento: <strong>remissão completa<\/strong> → observação, ensaios clínicos ou paclitaxel de manutenção (o <em>second look<\/em> negativo mantém a observação; positivo, novo ciclo de QT ou observação); <strong>remissão parcial ou progressão<\/strong> → conduta individualizada conforme tempo de recorrência, volume e localização. A cirurgia feita por especialista em oncologia ginecológica tem melhores resultados.<\/p>"}]},{"h":"Armadilhas de prova: Meigs, Krukenberg e a ascite com derrame","blocos":[{"html":"<h3>Síndrome de Meigs<\/h3>"},{"html":"<p>Tríade de <strong>tumor ovariano benigno<\/strong> (geralmente <strong>fibroma<\/strong>; também tecoma ou tumor de Brenner) + <strong>ascite<\/strong> + <strong>derrame pleural<\/strong>, em geral <strong>à direita<\/strong>. O CA-125 pode estar <strong>elevado<\/strong>. Ela <strong>mimetiza câncer avançado<\/strong>, mas os sintomas <strong>desaparecem completamente após a retirada do tumor<\/strong>. Na <strong>pseudo-Meigs<\/strong>, ascite e derrame acompanham <strong>outros tumores<\/strong> — malignos de ovário ou miomas uterinos.<\/p>"},{"html":"<blockquote><p><strong>O caso clássico:<\/strong> mulher de 55 anos, pós-menopausa, com aumento progressivo do volume abdominal, dispneia leve, massa anexial, ascite, derrame pleural direito e CA-125 de 250 U/mL. Duas leituras possíveis: se a <strong>citologia pleural for positiva<\/strong>, é câncer de ovário <strong>estádio IVA<\/strong>; se a massa for um fibroma benigno e tudo regredir após a ooforectomia, é <strong>Meigs<\/strong>. A diferença está na citologia e na histologia, não no quadro clínico.<\/p><\/blockquote>"},{"html":"<h3>Síndrome de Gorlin<\/h3>"},{"html":"<p>Doença <strong>autossômica dominante<\/strong> (gene <strong>PTCH1<\/strong>) associada a <strong>fibromas ovarianos<\/strong>: múltiplos <strong>carcinomas basocelulares<\/strong> desde a infância, <strong>ceratocistos odontogênicos<\/strong>, costelas bífidas e outras anomalias vertebrais, calcificação precoce da foice do cérebro, macrocefalia, hipertelorismo e <em>pits<\/em> palmoplantares.<\/p>"},{"html":"<h3>Tumor de Krukenberg<\/h3>"},{"html":"<p>Adenocarcinoma ovariano raro, <strong>geralmente bilateral<\/strong> e de natureza <strong>metastática<\/strong>, com células produtoras de mucina em <strong>\"anel de sinete\"<\/strong>. O sítio primário é o <strong>trato gastrointestinal<\/strong>: <strong>câncer gástrico (~70%)<\/strong> e <strong>colorretal (~20%)<\/strong>. Massa ovariana sólida bilateral, sobretudo na pós-menopausa, pede investigação do tubo digestivo.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th><\/th><th>Meigs<\/th><th>Krukenberg<\/th><\/tr><\/thead><tbody><tr><td>Natureza<\/td><td>Benigna (fibroma)<\/td><td>Maligna, metastática<\/td><\/tr><tr><td>Lateralidade<\/td><td>Geralmente unilateral<\/td><td>Geralmente bilateral<\/td><\/tr><tr><td>Marca<\/td><td>Ascite + derrame que somem após a cirurgia<\/td><td>Células em anel de sinete<\/td><\/tr><tr><td>Próximo passo<\/td><td>Retirar o tumor<\/td><td>Procurar o primário (estômago, cólon)<\/td><\/tr><\/tbody><\/table><\/div>"}]}]},{"slug":"pratica-de-sindromes-hipertensivas","titulo":"Prática de Síndromes Hipertensivas","disciplina":"GO","eyebrow":"Ginecologia e Obstetrícia · Simulação de Eclâmpsia","questoes":[{"id":"ec61cf126e","q":"Gestante de 31 semanas, com PA de 170 x 112 mmHg e cefaleia desde a manhã, apresenta convulsão tônico-clônica generalizada no pronto-socorro obstétrico. Não tem antecedente de epilepsia. Qual é o diagnóstico a ser verbalizado de imediato?","opts":["Eclâmpsia, emergência obstétrica","Epilepsia de início na gestação","Síndrome HELLP com encefalopatia","Acidente vascular cerebral isquêmico"],"c":0,"exp":"Convulsão tônico-clônica generalizada em gestante hipertensa após 20 semanas, sem outra causa, é eclâmpsia. Nomear a emergência em voz alta é o primeiro item esperado da equipe: é o que dispara a chamada de ajuda e o sulfato de magnésio. HELLP é diagnóstico laboratorial, e não se espera exame de imagem para começar o tratamento.","ref":[1,2]},{"id":"de833db23b","q":"Reconhecida a eclâmpsia no leito de uma gestante de 34 semanas, qual é a ação seguinte esperada do médico, antes de qualquer medicação?","opts":["Solicitar ajuda: enfermagem, outro obstetra e apoio","Aplicar diazepam EV para interromper a convulsão","Levar a paciente direto ao centro cirúrgico","Colher os exames da rotina de doença hipertensiva"],"c":0,"exp":"Logo depois de identificar a emergência, pede-se ajuda (equipe de enfermagem, outros obstetras, apoio): o que vem em seguida — posicionar, proteger a via aérea, ofertar oxigênio, monitorizar, puncionar acessos e preparar o sulfato — exige várias mãos ao mesmo tempo. Diazepam não é o anticonvulsivante da eclâmpsia, e o parto só vem depois da estabilização materna.","ref":[1,4]},{"id":"123ce418d0","q":"Durante e logo após a crise eclâmptica, em que posição a gestante deve ser colocada?","opts":["Decúbito lateral esquerdo","Decúbito dorsal horizontal","Decúbito ventral com coxins","Semissentada, em Fowler"],"c":0,"exp":"O decúbito lateral esquerdo deixa secreções e vômito escorrerem para fora da boca, reduzindo o risco de broncoaspiração — uma das causas de óbito materno na eclâmpsia — e tira o peso do útero de cima da veia cava inferior, melhorando o retorno venoso e a perfusão placentária. O decúbito dorsal faz o contrário nas duas frentes.","ref":[1,6]},{"id":"c1183664a7","q":"Cessada a convulsão, a paciente permanece torporosa, com respiração ruidosa por queda da língua. Que dispositivo é usado para proteger a via aérea, se necessário?","opts":["Cânula orofaríngea de Guedel","Intubação orotraqueal imediata","Máscara laríngea de rotina","Traqueostomia de urgência"],"c":0,"exp":"A proteção de vias aéreas inclui a cânula orofaríngea de Guedel quando necessária, que impede a queda da língua no período pós-ictal. A intubação fica reservada para falha de ventilação ou rebaixamento persistente da consciência, e não é rotina na eclâmpsia.","ref":[1,8]},{"id":"4b23cdfcb6","q":"Após posicionar a paciente e proteger a via aérea, qual é a oferta de oxigênio esperada?","opts":["8 L/min, reavaliando a resposta, até 10 L/min","2 L/min, reavaliando a resposta, até 4 L/min","4 L/min, reavaliando a resposta, até 6 L/min","1 L/min, reavaliando a resposta, até 3 L/min"],"c":0,"exp":"A oxigenioterapia começa com 8 L/min e é ajustada pela resposta, até 10 L/min. A convulsão consome oxigênio e a respiração pós-ictal é ineficiente, enquanto o feto depende diretamente da oxigenação materna; fluxos baixos de cateter nasal não dão conta dessa demanda.","ref":[1,10]},{"id":"f75ac882ba","q":"Qual conjunto de parâmetros compõe a monitorização inicial da gestante em eclâmpsia?","opts":["PA, FC, FR e saturação de oxigênio","PA, temperatura e glicemia capilar","FC, pressão venosa central e lactato","PA, FC e eletroencefalograma contínuo"],"c":0,"exp":"A monitorização inicial é de pressão arterial, frequência cardíaca, frequência respiratória e saturação de oxigênio. A frequência respiratória, em particular, continua vigiada durante todo o uso do sulfato de magnésio, porque a depressão respiratória é sinal de intoxicação pela droga.","ref":[1,12]},{"id":"0015c879a5","q":"Com a paciente posicionada, oxigenada e monitorizada, quais condutas adicionais completam o suporte inicial?","opts":["Dois acessos venosos calibrosos, exames laboratoriais e sonda vesical","Um acesso venoso fino e exames laboratoriais só depois do parto","Dois acessos calibrosos e expansão rápida com dois litros de cristaloide","Acesso venoso central, gasometria arterial e tomografia de crânio"],"c":0,"exp":"As condutas adicionais são dois acessos venosos calibrosos, a coleta da rotina laboratorial da doença hipertensiva e a sondagem vesical de demora para medir a diurese horária. Expandir volume agressivamente é perigoso: a permeabilidade capilar está aumentada, e o líquido infundido extravasa para o terceiro espaço, inclusive para o pulmão.","ref":[2,1]},{"id":"7c4cb5e04f","q":"Qual painel corresponde à rotina laboratorial da doença hipertensiva específica da gestação colhida na eclâmpsia?","opts":["Hemograma com plaquetas, TGO, TGP, DHL, bilirrubinas, creatinina, ureia e coagulograma","Hemograma, glicemia, TSH, sódio, potássio, cálcio, magnésio, amilase e urina tipo 1","Hemograma, PCR, procalcitonina, hemocultura, lactato, gasometria e urocultura","Hemograma, troponina, CK-MB, BNP, D-dímero, gasometria, sódio e potássio"],"c":0,"exp":"A rotina busca lesão de órgão-alvo e síndrome HELLP: hemograma com plaquetas (plaquetopenia), TGO e TGP (lesão hepática), DHL e bilirrubinas totais e frações (hemólise), creatinina e ureia (função renal) e coagulograma (coagulopatia e CIVD).","ref":[2,2]},{"id":"d17a88edc0","q":"A lista abaixo resume a abordagem inicial esperada da equipe diante de uma convulsão eclâmptica. Qual é o tratamento específico, imediato, que completa essa abordagem?","opts":["Sulfato de magnésio 4 g EV, em infusão lenta","Diazepam 10 mg EV, repetido até cessar a crise","Fenitoína 15 mg/kg EV, em infusão contínua","Cesárea de emergência, assim que houver sala"],"c":0,"exp":"O tratamento imediato da eclâmpsia é o sulfato de magnésio a 50%, superior a qualquer outro anticonvulsivante tanto na prevenção quanto no tratamento de novas crises. Benzodiazepínico e fenitoína não são a escolha, e a cesárea só entra depois da estabilização materna.","cap":"Expectativa da equipe na abordagem inicial da eclâmpsia","ref":[3,0]},{"id":"253d7e3f9f","q":"Qual é a dose de ataque do sulfato de magnésio no esquema de Zuspan?","opts":["4 g EV, em infusão lenta","6 g EV, em infusão lenta","2 g EV, em infusão lenta","4 g EV, em bolus rápido"],"c":0,"exp":"O ataque do Zuspan é de 4 g endovenosos, infundidos lentamente, em cerca de 10 a 20 minutos. Como a ampola a 50% tem 10 mL com 5 g, separam-se 8 mL (4 g) e diluem-se em 12 mL de água destilada, formando 20 mL. Os 6 g pertencem ao esquema de Sibai, e o bolus rápido expõe a paciente a pico tóxico de magnésio.","ref":[3,3]},{"id":"a5e349f613","q":"Feito o ataque e com bomba de infusão disponível, qual é a manutenção do esquema de Zuspan?","opts":["1 a 2 g/h EV em bomba de infusão","2 a 3 g/h EV em bomba de infusão","0,5 g/h EV em bomba de infusão","4 g EV em bolus a cada 4 horas"],"c":0,"exp":"No Zuspan, a manutenção é de 1 a 2 g por hora em bomba de infusão contínua, depois do ataque de 4 g endovenosos. A faixa de 2 a 3 g/h pertence ao esquema de Sibai, cujo ataque é de 6 g.","ref":[3,2]},{"id":"26f3fcab35","q":"Em um serviço sem bomba de infusão, qual manutenção do sulfato de magnésio pode ser usada?","opts":["5 g IM profundo a cada 4 horas","5 g IM profundo a cada 12 horas","2 g IM profundo a cada 4 horas","10 g EV em bolus a cada 6 horas"],"c":0,"exp":"O esquema de Pritchard dispensa bomba de infusão: a manutenção é de 5 g intramusculares profundos a cada 4 horas. Pelo protocolo FEBRASGO, o ataque completo desse esquema é de 4 g endovenosos somados a 10 g intramusculares, 5 g em cada nádega.","ref":[3,2]},{"id":"82b285d122","q":"Seis horas após iniciar o sulfato de magnésio, a gestante está sonolenta, com reflexo patelar abolido, frequência respiratória de 10 irpm e diurese de 15 mL/h. Qual é a conduta?","opts":["Suspender o sulfato e aplicar gluconato de cálcio 10%, 10 mL EV lento","Reduzir a infusão pela metade e reavaliar os reflexos em uma hora","Manter o sulfato e fazer furosemida EV para recuperar a diurese","Suspender o sulfato e aplicar bicarbonato de sódio 8,4%, 10 mL EV"],"c":0,"exp":"Reflexo abolido, frequência respiratória abaixo de 12 irpm e diurese abaixo de 25 mL/h configuram intoxicação por magnésio. A conduta é suspender o sulfato e aplicar o antídoto, gluconato de cálcio a 10%, 10 mL endovenosos lentamente. Reduzir a manutenção pela metade é ajuste para creatinina elevada sem sinais de toxicidade, não para intoxicação instalada.","ref":[3,12]},{"id":"fbf06f7ea2","q":"Durante a manutenção do sulfato de magnésio, qual débito urinário sinaliza risco de acúmulo da droga?","opts":["Menor que 25 mL por hora","Menor que 100 mL por hora","Menor que 75 mL por hora","Menor que 150 mL por hora"],"c":0,"exp":"O magnésio é eliminado pelos rins, então diurese abaixo de 25 mL/h faz a droga acumular. Por isso a sondagem vesical de demora e o controle de diurese horária fazem parte da conduta: sem eles, a oligúria passa despercebida até surgirem arreflexia e depressão respiratória.","ref":[2,3]},{"id":"818a55bd35","q":"A gestante em uso de sulfato de magnésio é monitorizada pelos itens abaixo. Com o acúmulo progressivo de magnésio, qual parâmetro costuma se alterar primeiro?","opts":["Os reflexos osteotendinosos","A saturação de oxigênio","A frequência cardíaca","A pressão arterial média"],"c":0,"exp":"A toxicidade segue uma escada de magnesemia: os reflexos são abolidos entre 9,6 e 12 mg/dL, a depressão respiratória surge a partir de 14,4 mg/dL e a parada cardíaca acima de 25 mg/dL. Por isso o reflexo patelar é o sinal de alerta mais precoce e deve ser testado a cada reavaliação, junto com a frequência respiratória e a diurese horária.","cap":"Itens da monitorização materna","ref":[3,9]},{"id":"735660a78e","q":"Após o ataque de sulfato de magnésio, a PA permanece em 172 x 114 mmHg. Qual esquema endovenoso controla a crise hipertensiva?","opts":["Hidralazina 5 mg IV a cada 20 min, até 30 mg","Hidralazina 20 mg IV a cada 5 min, até 100 mg","Enalaprilato 1,25 mg IV a cada 6 h, até 5 mg","Furosemida 40 mg IV a cada 20 min, até 120 mg"],"c":0,"exp":"A hidralazina é feita em doses de 5 mg endovenosos a cada 20 minutos, com máximo de 30 mg; a ampola de 20 mg/mL é diluída em 19 mL de água destilada, ficando a 1 mg/mL. Inibidores da ECA são contraindicados na gestação, e diurético não trata a crise hipertensiva da pré-eclâmpsia, em que o volume intravascular já está reduzido.","ref":[4,4]},{"id":"98cdff5d40","q":"Qual é a alternativa por via oral à hidralazina no controle da crise hipertensiva da gestante?","opts":["Nifedipino 10 mg VO, repetido até o máximo de 30 mg","Captopril 25 mg VO, repetido até o máximo de 75 mg","Metildopa 500 mg VO, repetida até o máximo de 2 g","Atenolol 50 mg VO, repetido até o máximo de 150 mg"],"c":0,"exp":"O nifedipino de liberação imediata, 10 mg por via oral, é a alternativa à hidralazina e pode ser repetido até o máximo de 30 mg. O intervalo entre as doses varia entre protocolos (de 10 minutos a 20–30 minutos no FEBRASGO), mas dose e teto não mudam. Metildopa é droga de manutenção, lenta demais para a crise, e captopril é contraindicado na gestação.","ref":[4,2]},{"id":"dd6364ec4a","q":"Logo após a convulsão eclâmptica, com a mãe ainda em estabilização, a ausculta mostra BCF de 100 bpm. Qual é a conduta?","opts":["Estabilizar a mãe e reavaliar o BCF, sem cesárea imediata","Cesárea de emergência pelo sofrimento fetal agudo","Parto instrumental com fórceps para abreviar o nascimento","Tocólise com nifedipino e corticoide antes do parto"],"c":0,"exp":"A bradicardia fetal logo após a crise reflete a hipóxia materna transitória, dura de 3 a 5 minutos e melhora com a estabilização da mãe. Não indica cesárea de emergência: a sequência é sulfato, estabilização e só então resolução. O feto segue vigiado com BCF, movimentos fetais e cardiotocografia, em busca de sinais de sofrimento que persistam.","ref":[5,4]},{"id":"9e3dd1b76a","q":"Gestante de 30 semanas teve uma crise eclâmptica e já está estável, em uso de sulfato de magnésio e com PA controlada. Qual é a conduta obstétrica?","opts":["Resolver a gestação agora, após a estabilização materna","Manter conduta expectante até 34 semanas com sulfato","Adiar o parto por 48 horas para completar o corticoide","Manter conduta expectante até 37 semanas se PA controlada"],"c":0,"exp":"Eclâmpsia é indicação de resolução imediata da gestação, em qualquer idade gestacional, assim que a mãe estiver estável. O corticoide antenatal pode ser iniciado, mas nunca é razão para adiar o parto diante de situação materna grave; conduta expectante é para pré-eclâmpsia sem deterioração, não para eclâmpsia.","ref":[5,6]},{"id":"a6f9d36445","q":"Gestante de 36 semanas, estabilizada após eclâmpsia, com cardiotocografia normal, sem sangramento e colo favorável. Considerando os fatores abaixo, qual é a via de parto?","opts":["Indução do parto vaginal com ocitocina","Cesárea, pois eclâmpsia exige via alta","Cesárea eletiva após 48 h de sulfato","Aguardar trabalho de parto espontâneo"],"c":0,"exp":"A via de parto na eclâmpsia é obstétrica: depende da condição materna, da vitalidade fetal e das condições obstétricas, e a eclâmpsia por si só não indica cesárea. Com mãe estável, feto bem e colo favorável, induz-se com ocitocina; colo desfavorável passaria antes por sonda de Foley ou misoprostol. Cesárea fica para vitalidade fetal comprometida, instabilidade materna, sangramento ou hipertensão de difícil controle.","cap":"Fatores que definem a via de parto","ref":[5,9]},{"id":"f2a6cb0f6c","q":"A paciente teve parto vaginal duas horas após a eclâmpsia. Por quanto tempo o sulfato de magnésio deve ser mantido?","opts":["Por 24 horas após o parto","Por 6 horas após o parto","Por 12 horas após o parto","Por 72 horas após o parto"],"c":0,"exp":"O sulfato de magnésio segue em dose de manutenção por 24 horas após o parto, porque o risco de convulsão persiste no puerpério imediato. Suspendê-lo no nascimento deixa a paciente desprotegida justamente na janela em que novas crises ainda podem ocorrer.","ref":[5,11]},{"id":"52951e9500","q":"No pós-parto imediato de uma paciente com eclâmpsia, com que objetivo os exames laboratoriais são reavaliados?","opts":["Rastrear lesão de órgão-alvo e HELLP com coagulopatia","Definir o momento de suspender o sulfato de magnésio","Liberar a amamentação, contraindicada após eclâmpsia","Confirmar a eclâmpsia, que depende de proteinúria"],"c":0,"exp":"A doença não termina com o nascimento: a reavaliação laboratorial pós-parto procura lesão de órgão-alvo e síndrome HELLP, inclusive com coagulopatia. A suspensão do sulfato segue o tempo (24 horas após o parto), a amamentação não é contraindicada e a proteinúria não é obrigatória para o diagnóstico.","ref":[5,11]},{"id":"618fcc2574","q":"Quais são as principais causas de óbito materno no cenário de eclâmpsia?","opts":["Broncoaspiração, choque e parada cardiorrespiratória","Sepse puerperal, embolia amniótica e tromboembolismo","Rotura uterina, inversão uterina e acretismo placentário","Cetoacidose, tireotoxicose e insuficiência suprarrenal"],"c":0,"exp":"Na eclâmpsia, a mãe morre por broncoaspiração durante ou após a crise, por choque — distributivo ou hipovolêmico — e por parada cardiorrespiratória. É por isso que decúbito lateral, proteção da via aérea e monitorização vêm antes mesmo da medicação no atendimento.","ref":[6,1]},{"id":"9a4bf54afe","q":"Na eclâmpsia, qual mecanismo explica o choque distributivo como causa de óbito materno?","opts":["Hipovolemia relativa por extravasamento para o terceiro espaço","Perda sanguínea aguda por descolamento prematuro de placenta","Vasodilatação anafilática desencadeada pelo sulfato de magnésio","Falência de bomba por miocardiopatia periparto descompensada"],"c":0,"exp":"No choque distributivo, a disfunção endotelial aumenta a permeabilidade capilar e o líquido extravasa para o terceiro espaço: o intravascular fica com hipovolemia relativa, mesmo sem perda de sangue. Já o choque hipovolêmico verdadeiro vem do descolamento prematuro de placenta, da coagulação intravascular disseminada e da hemorragia pós-parto.","ref":[6,1]},{"id":"c701d8c1ad","q":"Qual fator mais piora o prognóstico materno na eclâmpsia?","opts":["Atraso no diagnóstico e na conduta","Idade materna acima de 35 anos","Nuliparidade com pré-natal regular","Ganho de peso acima do esperado"],"c":0,"exp":"O fator de piora do prognóstico é o atraso no diagnóstico e na conduta. Cada passo da sequência — reconhecer, chamar ajuda, proteger a via aérea, dar sulfato, controlar a pressão — reduz a chance de broncoaspiração, choque e parada; hesitar é o que transforma a crise em óbito.","ref":[6,2]}],"resumo":[{"h":"A simulação de eclâmpsia em uma página","blocos":[{"html":"<p>Eclâmpsia é a convulsão tônico-clônica generalizada em gestante com pré-eclâmpsia, sem outra causa que a explique. Em simulação ela é cobrada porque testa <strong>ordem<\/strong>, e não só conhecimento: o avaliador marca cada passo de uma sequência fixa, e pular um item — ou fazê-lo fora de hora — custa ponto mesmo quando a dose do sulfato está certa. A sequência esperada da equipe, do primeiro segundo ao puerpério, é esta:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Ordem<\/th><th>Ação esperada<\/th><th>O detalhe que se espera ouvir<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Identificar a emergência obstétrica<\/td><td>Verbalizar <strong>\"eclâmpsia\"<\/strong><\/td><\/tr><tr><td>2<\/td><td>Solicitar ajuda<\/td><td>Equipe de enfermagem, outros obstetras, apoio<\/td><\/tr><tr><td>3<\/td><td>Posicionar<\/td><td><strong>Decúbito lateral esquerdo<\/strong><\/td><\/tr><tr><td>4<\/td><td>Proteger a via aérea<\/td><td>Cânula de <strong>Guedel<\/strong>, se necessário<\/td><\/tr><tr><td>5<\/td><td>Oxigenioterapia<\/td><td><strong>8 L/min<\/strong>, avaliar a resposta, até <strong>10 L/min<\/strong><\/td><\/tr><tr><td>6<\/td><td>Monitorizar<\/td><td>PA, FC, FR, SatO₂<\/td><\/tr><tr><td>7<\/td><td>Condutas adicionais<\/td><td>2 acessos calibrosos · rotina laboratorial · sonda vesical de demora<\/td><\/tr><tr><td>8<\/td><td>Tratamento imediato<\/td><td><strong>Sulfato de magnésio a 50%<\/strong> — ataque e manutenção<\/td><\/tr><tr><td>9<\/td><td>Controlar a crise hipertensiva<\/td><td>Hidralazina EV ou nifedipino VO<\/td><\/tr><tr><td>10<\/td><td>Monitorizar mãe e feto<\/td><td>Reflexos, diurese horária, sintomas neurológicos · BCF, movimentos, CTG<\/td><\/tr><tr><td>11<\/td><td>Resolver a gestação<\/td><td><strong>Após a estabilidade materna<\/strong>; via obstétrica<\/td><\/tr><tr><td>12<\/td><td>Conduzir o pós-parto<\/td><td>Órgão-alvo e HELLP · sulfato por <strong>24 h<\/strong> após o parto<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Expectativa da equipe no atendimento inicial da eclâmpsia<\/p>"},{"html":"<blockquote><p><strong>Mnemônico SER — Sulfato, Estabilização, Resolução.<\/strong> A eclâmpsia é indicação de resolução imediata da gestação, mas <em>depois<\/em> que a mãe estiver estável. Correr para o centro cirúrgico com a paciente convulsionando ou sem via aérea protegida troca um problema por dois.<\/p><\/blockquote>"}]},{"h":"Primeiro minuto: reconhecer, chamar ajuda e proteger a via aérea","blocos":[{"html":"<p>Os seis primeiros itens não usam remédio nenhum — e são justamente os que evitam as mortes por broncoaspiração e hipóxia.<\/p>"},{"html":"<h4>1. Identificar a emergência<\/h4>"},{"html":"<p>Gestante após 20 semanas, hipertensa, com convulsão tônico-clônica generalizada e sem antecedente de epilepsia: <strong>é eclâmpsia até prova em contrário<\/strong>. Nomear em voz alta organiza a equipe. Não se espera tomografia nem exame laboratorial para começar a tratar.<\/p>"},{"html":"<h4>2. Solicitar ajuda<\/h4>"},{"html":"<p>Equipe de enfermagem, outros obstetras e apoio. O que vem em seguida — posicionar, aspirar, oxigenar, monitorizar, puncionar dois acessos, preparar o sulfato — precisa de várias mãos ao mesmo tempo.<\/p>"},{"html":"<h4>3. Decúbito lateral esquerdo<\/h4>"},{"html":"<p>Faz duas coisas de uma vez: deixa secreção e vômito escorrerem para fora da boca, reduzindo a <strong>broncoaspiração<\/strong>, e tira o útero de cima da veia cava inferior, melhorando o retorno venoso e a perfusão placentária. O decúbito dorsal faz o contrário nas duas frentes.<\/p>"},{"html":"<h4>4. Proteção de vias aéreas<\/h4>"},{"html":"<p>Cânula orofaríngea de <strong>Guedel se necessário<\/strong>, para impedir a queda da língua no pós-ictal. Intubação não é rotina: fica para falha de ventilação ou rebaixamento persistente.<\/p>"},{"html":"<h4>5. Oxigenioterapia<\/h4>"},{"html":"<p>Começar com <strong>8 L/min<\/strong> e avaliar a resposta, podendo chegar a <strong>10 L/min<\/strong>. A convulsão consome oxigênio, a respiração pós-ictal é ineficiente, e o feto depende inteiramente da oxigenação materna.<\/p>"},{"html":"<h4>6. Monitorização<\/h4>"},{"html":"<p><strong>PA, FC, FR e saturação de O₂.<\/strong> A frequência respiratória ganha importância dobrada a partir do momento em que o sulfato entra, porque é um dos sinais de intoxicação.<\/p>"}]},{"h":"Condutas adicionais: acessos, exames e sonda vesical","blocos":[{"html":"<p>Estabilizada a via aérea, três medidas completam o suporte:<\/p>"},{"html":"<ul><li><strong>Dois acessos venosos calibrosos<\/strong> — um para o sulfato, outro para anti-hipertensivo, hemoderivado ou o que mais vier.<\/li><li><strong>Rotina laboratorial da DHEG<\/strong> (doença hipertensiva específica da gestação).<\/li><li><strong>Sonda vesical de demora<\/strong>, para medir a diurese hora a hora.<\/li><\/ul>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Exame<\/th><th>O que procura<\/th><\/tr><\/thead><tbody><tr><td>Hemograma com plaquetas<\/td><td>Plaquetopenia (HELLP)<\/td><\/tr><tr><td>TGO e TGP<\/td><td>Lesão hepática<\/td><\/tr><tr><td>DHL e bilirrubinas totais e frações<\/td><td>Hemólise<\/td><\/tr><tr><td>Creatinina e ureia<\/td><td>Função renal<\/td><\/tr><tr><td>Coagulograma<\/td><td>Coagulopatia, CIVD<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p><strong>A sonda vesical não é detalhe.<\/strong> O magnésio é eliminado pelos rins: sem diurese horária, a oligúria passa despercebida e a droga acumula até surgirem arreflexia e depressão respiratória. Pelo mesmo motivo de fundo, <strong>não se expande volume agressivamente<\/strong> — com o endotélio lesado, o líquido infundido extravasa para o terceiro espaço, inclusive para o pulmão.<\/p><\/blockquote>"}]},{"h":"Sulfato de magnésio: ataque, manutenção e intoxicação","blocos":[{"html":"<p>É o tratamento <strong>imediato<\/strong> da eclâmpsia e o anticonvulsivante de escolha, superior a diazepam, fenitoína ou qualquer outro tanto para tratar quanto para prevenir novas crises. A apresentação é a <strong>ampola de MgSO₄ a 50%: 10 mL com 5 g<\/strong>.<\/p>"},{"html":"<p class=\"figleg\">Esquema do sulfato de magnésio a 50%<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Esquema<\/th><th>Ataque<\/th><th>Manutenção<\/th><th>Quando usar<\/th><\/tr><\/thead><tbody><tr><td><strong>Zuspan<\/strong><\/td><td>4 g EV lento<\/td><td><strong>1 a 2 g/h EV em bomba de infusão<\/strong><\/td><td>Há bomba de infusão<\/td><\/tr><tr><td><strong>Pritchard<\/strong><\/td><td>4 g EV + 10 g IM (5 g em cada nádega)<\/td><td><strong>5 g IM profundo a cada 4 h<\/strong><\/td><td>Não há bomba de infusão<\/td><\/tr><tr><td>Sibai<\/td><td>6 g EV<\/td><td>2 a 3 g/h EV em bomba de infusão<\/td><td>Alternativa<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p><strong>Preparo do ataque de 4 g:<\/strong> 8 mL da ampola a 50% + 12 mL de água destilada = 20 mL com 4 g, infundidos lentamente. As fontes variam no tempo de infusão — entre 10–15 e 15–20 minutos —, mas nunca em bolus rápido.<\/p>"},{"html":"<h4>Monitorização durante o sulfato<\/h4>"},{"html":"<p>Reflexos osteotendinosos (patelar) · frequência respiratória · diurese horária · PA · sintomas neurológicos · <strong>uma ampola de gluconato de cálcio a 10% sempre ao lado do leito<\/strong>.<\/p>"},{"html":"<h4>Sinais de intoxicação<\/h4>"},{"html":"<p class=\"figleg\">Sinais clínicos de intoxicação por magnésio<\/p>"},{"html":"<ul><li><strong>Diminuição ou abolição dos reflexos<\/strong> — o sinal mais precoce.<\/li><li><strong>Diminuição da frequência respiratória.<\/strong><\/li><li><strong>Diminuição da diurese, abaixo de 25 mL/h.<\/strong><\/li><\/ul>"},{"html":"<p>A toxicidade sobe em escada de magnesemia: 4,8–8,4 mg/dL é a faixa terapêutica; <strong>9,6–12 mg/dL abole os reflexos<\/strong>; a partir de 14,4 mg/dL vem a depressão ou parada respiratória; acima de 25 mg/dL, a parada cardíaca. É por isso que o reflexo patelar avisa antes da respiração.<\/p>"},{"html":"<h4>Conduta na intoxicação<\/h4>"},{"html":"<ol><li><strong>Suspender o sulfato de magnésio.<\/strong><\/li><li><strong>Antídoto: gluconato de cálcio a 10%, 10 mL EV lento<\/strong> (uma ampola).<\/li><\/ol>"},{"html":"<blockquote><p><strong>Pegadinha de número:<\/strong> a frequência respiratória de corte aparece como <strong>&lt; 12 irpm<\/strong> no roteiro de simulação e como <strong>&lt; 16 ipm<\/strong> no protocolo RBEHG/FEBRASGO 2025. Na prova prática, FR abaixo de 12 é intoxicação sem discussão; entre 12 e 16 o protocolo nacional já manda suspender e aplicar o antídoto. Da mesma forma, a diurese &lt; 25 mL/h é tratada como sinal de alerta na simulação e como <strong>fator de risco<\/strong> no protocolo — nos dois casos, a conduta é parar e reavaliar. Com <strong>creatinina ≥ 1,2 mg/dL<\/strong> sem sinais de toxicidade, a manutenção cai pela metade (o ataque não muda).<\/p><\/blockquote>"}]},{"h":"Crise hipertensiva: hidralazina ou nifedipino","blocos":[{"html":"<p>Com PA ≥ 160 x 110 mmHg, o objetivo é baixar a pressão para proteger o cérebro materno de hemorragia — o sulfato trata a convulsão, não a hipertensão.<\/p>"},{"html":"<p class=\"figleg\">Controle da crise hipertensiva<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Droga<\/th><th>Dose<\/th><th>Repetição<\/th><th>Máximo<\/th><\/tr><\/thead><tbody><tr><td><strong>Hidralazina<\/strong><\/td><td>5 mg IV<\/td><td>a cada 20 min<\/td><td><strong>30 mg<\/strong><\/td><\/tr><tr><td><strong>Nifedipino<\/strong> (liberação imediata)<\/td><td>10 mg VO<\/td><td>a cada 10 min no roteiro de simulação; a cada 20–30 min no protocolo FEBRASGO<\/td><td><strong>30 mg<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A ampola de hidralazina tem 1 mL a 20 mg/mL: diluída em 19 mL de água destilada, fica a 1 mg/mL, e cada dose de 5 mg são 5 mL.<\/p>"},{"html":"<blockquote><p><strong>O que não usar na crise:<\/strong> inibidores da ECA (captopril, enalapril) são contraindicados durante a gestação; metildopa é droga de manutenção, lenta demais para a emergência; diurético piora o volume intravascular, que já está reduzido. O rótulo \"hipertensão refratária\" usado no roteiro para essa etapa significa, no protocolo, refratária a três fármacos — e aí ela é, por si, indicação de parto.<\/p><\/blockquote>"}]},{"h":"Monitorização, resolução da gestação e pós-parto","blocos":[{"html":"<h4>Monitorização materna<\/h4>"},{"html":"<p>FR, FC, PA e SatO₂ · reflexos osteotendinosos · diurese horária · sintomas neurológicos (cefaleia, escotomas, rebaixamento, nova crise).<\/p>"},{"html":"<h4>Avaliação fetal<\/h4>"},{"html":"<p>BCF inicial e movimentos fetais · controle de vitalidade com <strong>cardiotocografia<\/strong> · busca de sinais de sofrimento fetal.<\/p>"},{"html":"<blockquote><p><strong>Bradicardia fetal logo após a crise não indica cesárea de emergência.<\/strong> Ela reflete a hipóxia materna transitória, dura de 3 a 5 minutos e melhora quando a mãe se estabiliza. Só a alteração que persiste depois da estabilização pesa na decisão.<\/p><\/blockquote>"},{"html":"<h4>Resolução: eclâmpsia = resolução imediata após estabilidade materna<\/h4>"},{"html":"<p>Vale para <strong>qualquer idade gestacional<\/strong>. O corticoide antenatal pode ser iniciado no pré-termo, mas nunca é motivo para adiar o parto numa situação materna grave. Conduta expectante é para pré-eclâmpsia sem deterioração, não para eclâmpsia.<\/p>"},{"html":"<h4>Via de parto: depende<\/h4>"},{"html":"<ul><li><strong>Condição materna<\/strong><\/li><li><strong>Vitalidade fetal<\/strong><\/li><li><strong>Condições obstétricas<\/strong><\/li><\/ul>"},{"html":"<p>A pergunta clássica — <em>eclâmpsia é indicação de cesárea imediata?<\/em> — tem resposta <strong>não<\/strong>. A via é obstétrica e o parto vaginal é desejável: com mãe estável, feto bem e colo favorável, induz-se com ocitocina; colo desfavorável passa antes por sonda de Foley ou misoprostol. A cesárea fica para vitalidade fetal comprometida, instabilidade materna clínica ou laboratorial, sangramento ou hipertensão de difícil controle.<\/p>"},{"html":"<h4>Condução pós-parto<\/h4>"},{"html":"<ul><li><strong>Reavaliar exames:<\/strong> lesão de órgãos-alvo e <strong>HELLP<\/strong>, com atenção à coagulopatia.<\/li><li><strong>Manter o sulfato de magnésio em manutenção por 24 h após o parto<\/strong> — o risco de convulsão continua no puerpério imediato.<\/li><\/ul>"}]},{"h":"Por que a paciente morre — e os erros que custam ponto","blocos":[{"html":"<p class=\"figleg\">Causas de óbito materno na eclâmpsia<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Causa<\/th><th>Mecanismo<\/th><th>O que previne<\/th><\/tr><\/thead><tbody><tr><td><strong>Broncoaspiração<\/strong><\/td><td>Vômito e secreção aspirados durante ou após a crise<\/td><td>Decúbito lateral esquerdo, via aérea protegida<\/td><\/tr><tr><td><strong>Choque distributivo<\/strong><\/td><td>Hipovolemia <strong>relativa<\/strong>: a lesão endotelial faz o líquido extravasar para o terceiro espaço<\/td><td>Monitorização, reposição criteriosa<\/td><\/tr><tr><td><strong>Choque hipovolêmico<\/strong><\/td><td>Perda real: descolamento prematuro de placenta, CIVD, hemorragia pós-parto<\/td><td>Exames, coagulograma, reserva de hemoderivados<\/td><\/tr><tr><td><strong>Parada cardiorrespiratória<\/strong><\/td><td>Hipóxia, choque, intoxicação por magnésio<\/td><td>Tudo acima, mais o gluconato ao lado do leito<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p><strong>Fator de piora do prognóstico: atraso no diagnóstico e na conduta.<\/strong> Cada passo da sequência — reconhecer, chamar ajuda, proteger a via aérea, dar sulfato, controlar a pressão — corta uma das rotas para o óbito. Hesitar é o que transforma a crise em morte.<\/p><\/blockquote>"},{"html":"<h4>Erros clássicos na estação<\/h4>"},{"html":"<ul><li>Tratar a convulsão com <strong>diazepam<\/strong> em vez de sulfato de magnésio.<\/li><li>Deixar a paciente em <strong>decúbito dorsal<\/strong>.<\/li><li>Indicar <strong>cesárea imediata<\/strong> com a mãe instável, ou por bradicardia fetal transitória pós-crise.<\/li><li>Fazer o ataque de sulfato <strong>em bolus rápido<\/strong> ou esquecer a manutenção.<\/li><li>Não passar <strong>sonda vesical<\/strong> — e perder a diurese horária.<\/li><li>Não ter <strong>gluconato de cálcio<\/strong> à mão, ou não reconhecer reflexo abolido e FR baixa como intoxicação.<\/li><li>Usar <strong>captopril/enalapril<\/strong> na crise hipertensiva.<\/li><li>Suspender o sulfato <strong>no parto<\/strong>, em vez de mantê-lo por 24 horas.<\/li><\/ul>"}]}]},{"slug":"sexualidade-feminina","titulo":"Sexualidade Feminina","disciplina":"GO","eyebrow":"Ginecologia e Obstetrícia · Referência","questoes":[{"id":"4eb53af718","q":"O modelo linear de resposta sexual de Masters e Johnson descreve quais fases, em ordem?","opts":["Excitação, platô, orgasmo e resolução","Desejo, excitação, platô e orgasmo","Neutralidade, estímulo, excitação e desejo","Desejo, lubrificação, orgasmo e satisfação"],"c":0,"exp":"Masters e Johnson (1966) descreveram, a partir de observação laboratorial, um ciclo linear em quatro fases: excitação, platô, orgasmo e resolução. Kaplan (1979) acrescentou o desejo como fase inicial (desejo, excitação, orgasmo), e Basson propôs depois o modelo circular, que parte da neutralidade.","ref":[1,1]},{"id":"7d9af67a6a","q":"Mulher de 45 anos, em relacionamento estável há 20 anos, raramente sente vontade espontânea de sexo; quando o parceiro inicia com carinho, ela se excita, passa a sentir desejo e fica satisfeita. Ela não se sente incomodada com isso. Como interpretar o quadro?","opts":["Modelo circular de Basson: desejo responsivo, sem disfunção","Modelo de Kaplan: falta a fase de desejo, logo há disfunção","Modelo de Masters e Johnson: sem platô, logo há disfunção","Modelo circular de Basson: transtorno do interesse sexual"],"c":0,"exp":"Basson (2000) mostrou que, sobretudo em relações longas, muitas mulheres partem da neutralidade sexual e, motivadas pela intimidade, respondem ao estímulo com excitação — o desejo surge depois dela (desejo responsivo). A satisfação emocional e física realimenta o ciclo. Desejo espontâneo raro, sem sofrimento, não é disfunção.","ref":[1,2]},{"id":"3a80344bed","q":"No modelo PLISSIT de abordagem das queixas sexuais, o que significam as etapas, em ordem?","opts":["Permissão, informação limitada, sugestões específicas, terapia intensiva","Prevenção, investigação laboratorial, sintomas, terapia sexual","Permissão, intervenção, sugestões sistemáticas, terapia individual","Privacidade, informação legal, suporte social, terapia integrada"],"c":0,"exp":"PLISSIT (Annon, 1976): permissão para falar do tema e validar a experiência; informação limitada (anatomia, fisiologia, desfazer mitos); sugestões específicas para o problema; e terapia intensiva com especialista. A maioria das queixas se resolve nas primeiras etapas, ao alcance do generalista.","ref":[2,2]},{"id":"60d5b74c1b","q":"Qual é a melhor forma de incluir a sexualidade na consulta ginecológica?","opts":["Perguntar de rotina, com linguagem aberta e sem pressupor","Abordar só se a paciente trouxer queixa sexual espontânea","Usar só termos técnicos para evitar constrangimento","Perguntar apenas na presença do parceiro, para confirmar"],"c":0,"exp":"A anamnese sexual faz parte da rotina: muitas mulheres não trazem a queixa espontaneamente, mas respondem quando o médico pergunta. Perguntas abertas, linguagem acessível, privacidade e não pressupor orientação sexual, parceria ou prática facilitam o relato.","ref":[2,0]},{"id":"1dda98b90c","q":"Quais são as disfunções sexuais femininas específicas do DSM-5-TR?","opts":["Interesse/excitação sexual, orgasmo e dor gênito-pélvica/penetração","Desejo hipoativo, excitação, orgasmo, dispareunia e vaginismo","Aversão sexual, excitação, anorgasmia e vulvodinia primária","Interesse sexual, lubrificação, orgasmo e vaginismo isolado"],"c":0,"exp":"O DSM-5 (mantido no DSM-5-TR, 2022) fundiu desejo e excitação no transtorno do interesse/excitação sexual feminino e fundiu dispareunia e vaginismo no transtorno da dor gênito-pélvica/penetração; o terceiro é o transtorno do orgasmo feminino. Há ainda a disfunção sexual induzida por substância ou medicamento. Dispareunia e vaginismo separados, e a aversão sexual, são do DSM-IV.","ref":[3,0]},{"id":"860ce27358","q":"Para diagnosticar uma disfunção sexual feminina pelo DSM-5-TR, quais condições gerais precisam estar presentes?","opts":["Duração de cerca de 6 meses e sofrimento clinicamente significativo","Duração mínima de 1 mês, mesmo sem sofrimento da paciente","Queixa do parceiro e ausência de orgasmo em qualquer relação","Dosagem hormonal alterada e duração mínima de 3 meses"],"c":0,"exp":"Os sintomas precisam durar cerca de 6 meses ou mais, causar sofrimento clinicamente significativo e não ser mais bem explicados por outro transtorno mental, por conflito grave no relacionamento (inclusive violência), por outros estressores, por substância ou medicamento ou por condição médica. Sem sofrimento, não há transtorno.","ref":[3,2]},{"id":"63665bb8ce","q":"Mulher de 26 anos nunca conseguiu penetração vaginal: ao tentar, há contração involuntária intensa do assoalho pélvico, medo antecipatório de dor e ansiedade. O exame ginecológico não mostra lesão. Qual é o diagnóstico e a abordagem?","opts":["Dor gênito-pélvica/penetração; fisioterapia pélvica e terapia sexual","Transtorno do orgasmo; reposição de testosterona transdérmica","Síndrome geniturinária; estrogênio vaginal de baixa dose contínuo","Transtorno do interesse; bupropiona e orientação ao parceiro"],"c":0,"exp":"Dificuldade de penetração, dor, medo antecipatório e contração involuntária do assoalho pélvico compõem o transtorno da dor gênito-pélvica/penetração, que inclui o antigo vaginismo. O tratamento combina fisioterapia do assoalho pélvico (com dilatadores progressivos), terapia sexual cognitivo-comportamental e educação, com o parceiro quando possível.","ref":[6,0]},{"id":"30d2148af6","q":"Mulher de 34 anos, em uso de sertralina há 4 meses para depressão já em remissão, passou a ter dificuldade importante para atingir o orgasmo, o que antes não ocorria. Qual é a melhor abordagem?","opts":["Atribuir ao ISRS e discutir redução da dose ou troca do fármaco","Suspender a sertralina de imediato, sem retirada gradual","Atribuir à depressão e aumentar a dose da sertralina","Indicar testosterona, pois a causa é deficiência androgênica"],"c":0,"exp":"ISRS e IRSN são a causa medicamentosa mais comum de disfunção sexual: reduzem o desejo e retardam ou abolem o orgasmo. Com a depressão controlada, as opções são reduzir a dose, trocar por antidepressivo com menor efeito sexual (bupropiona, mirtazapina) ou associar bupropiona — nunca suspender abruptamente.","ref":[4,2]},{"id":"7bc9992a22","q":"Por qual mecanismo o anticoncepcional hormonal combinado oral pode reduzir o desejo sexual em algumas usuárias?","opts":["Aumento da SHBG, com queda da testosterona livre","Aumento da prolactina, por bloqueio dopaminérgico","Queda da SHBG, com excesso de testosterona livre","Bloqueio da serotonina, com retardo do orgasmo"],"c":0,"exp":"O etinilestradiol estimula a produção hepática de SHBG (globulina ligadora de hormônios sexuais), e a supressão ovariana reduz a produção de androgênios; o resultado é queda da testosterona livre, que pode reduzir o desejo em parte das usuárias. O efeito é individual e a evidência é heterogênea: a maioria das mulheres não piora.","ref":[4,3]},{"id":"27efee7c3f","q":"Puérpera de 4 meses, em aleitamento exclusivo, refere ressecamento vaginal e dor à penetração desde o parto. Qual é o mecanismo principal?","opts":["Hipoestrogenismo da lactação, com prolactina elevada","Excesso de estrogênio placentário residual no puerpério","Deficiência de ferro, com atrofia direta da mucosa vaginal","Lesão do nervo pudendo, sempre secundária à episiotomia"],"c":0,"exp":"Na lactação, a prolactina elevada suprime o eixo hipotálamo-hipófise-ovário e causa hipoestrogenismo, com mucosa vaginal fina e pouco lubrificada, dispareunia e menor desejo. Lubrificantes e hidratantes vaginais ajudam, e o quadro melhora com o retorno da função ovariana.","ref":[4,3]},{"id":"ba27b6cd1e","q":"Mulher de 58 anos, na pós-menopausa há 6 anos e sem fogachos, refere ressecamento e ardor vaginal, dor na relação, urgência miccional e infecções urinárias de repetição. A mucosa vaginal é pálida, fina e sem pregas, com pH 6,5. Qual é o diagnóstico?","opts":["Síndrome geniturinária da menopausa","Vaginose bacteriana de repetição","Cistite intersticial com vaginismo","Vulvodinia provocada localizada"],"c":0,"exp":"A síndrome geniturinária da menopausa (termo de 2014, que substituiu 'atrofia vulvovaginal') reúne sintomas genitais, sexuais e urinários do hipoestrogenismo, com mucosa pálida, fina, sem rugosidade e pH vaginal acima de 4,5. Ao contrário dos fogachos, é progressiva e não melhora sem tratamento.","ref":[5,0]},{"id":"4c844aa9e4","q":"Para essa paciente com síndrome geniturinária, sem contraindicações e sem sintomas vasomotores, qual é o tratamento de escolha se lubrificantes e hidratantes não bastarem?","opts":["Estrogênio vaginal em baixa dose, sem progestagênio associado","Terapia hormonal sistêmica combinada por via oral contínua","Estrogênio vaginal sempre associado a progestagênio oral","Antibiótico profilático contínuo para as infecções urinárias"],"c":0,"exp":"Hidratantes (uso regular) e lubrificantes (na relação) são a primeira linha; se não bastam, o estrogênio vaginal em baixa dose (estriol, promestrieno, estrogênios conjugados) é o tratamento mais eficaz, inclusive para reduzir infecções urinárias. A absorção sistêmica é mínima e não exige progestagênio; a terapia sistêmica fica para quem também tem sintomas vasomotores.","ref":[5,3]},{"id":"9190c3dd05","q":"Qual é a única indicação com evidência consistente para o uso de testosterona em mulheres?","opts":["Desejo sexual hipoativo com sofrimento na pós-menopausa","Prevenção de osteoporose em toda mulher após a menopausa","Melhora de humor e energia em mulheres na pré-menopausa","Tratamento tópico vulvar da síndrome geniturinária"],"c":0,"exp":"O consenso global de 2019 sobre testosterona em mulheres reconhece uma única indicação com evidência: o transtorno do desejo sexual hipoativo na pós-menopausa, em dose fisiológica por via transdérmica, depois de avaliados os outros fatores. Não há evidência para osteoporose, humor, energia ou prevenção cardiovascular.","ref":[6,1]}],"resumo":[{"h":"","blocos":[{"html":"<blockquote><p>Material de referência: não há slide da aula deste tema. Baseado no DSM-5-TR (2022), nos modelos clássicos de resposta sexual (Masters e Johnson, Kaplan, Basson), nos documentos da Febrasgo e no posicionamento da NAMS sobre síndrome geniturinária da menopausa.<\/p><\/blockquote>"}]},{"h":"O ciclo de resposta sexual: três modelos","blocos":[{"html":"<p>A forma de entender a resposta sexual feminina mudou em três tempos, e a prova cobra a sequência.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Modelo<\/th><th>Fases<\/th><th>Ideia central<\/th><\/tr><\/thead><tbody><tr><td><strong>Masters e Johnson<\/strong> (1966)<\/td><td>Excitação → platô → orgasmo → resolução<\/td><td>Linear, fisiológico, baseado em observação laboratorial<\/td><\/tr><tr><td><strong>Kaplan<\/strong> (1979)<\/td><td><strong>Desejo<\/strong> → excitação → orgasmo<\/td><td>Trifásico; acrescenta o desejo como fase inicial<\/td><\/tr><tr><td><strong>Basson<\/strong> (2000)<\/td><td>Circular, a partir da <strong>neutralidade<\/strong><\/td><td>O desejo pode ser <strong>responsivo<\/strong>: surge depois da excitação<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>O <strong>modelo circular de Basson<\/strong> descreve melhor muitas mulheres, sobretudo em relações longas. Ela parte da neutralidade sexual; motivações não sexuais — intimidade, proximidade emocional, vontade de agradar ou de se sentir desejada — a tornam receptiva ao estímulo; o estímulo, num contexto adequado, gera excitação; e da excitação nasce o desejo. A satisfação emocional e física realimenta o ciclo. As fases se sobrepõem e não seguem ordem fixa.<\/p>"},{"html":"<blockquote><p><strong>Desejo espontâneo raro não é doença.<\/strong> Se a mulher responde ao estímulo, sente prazer e não sofre com isso, é a resposta descrita por Basson — não um transtorno do interesse sexual.<\/p><\/blockquote>"}]},{"h":"Anamnese sexual e o modelo PLISSIT","blocos":[{"html":"<p>Queixa sexual raramente é trazida de forma espontânea, mas costuma aparecer quando o médico pergunta. Por isso a sexualidade entra na <strong>anamnese de rotina<\/strong>: com privacidade, perguntas abertas, linguagem acessível e <strong>sem pressupor<\/strong> orientação sexual, tipo de parceria ou prática. Vale investigar início (desde sempre ou adquirido), contexto (com qualquer parceria ou situacional), sofrimento, relacionamento, saúde mental, medicamentos, doenças, gestação, parto e lactação, menopausa e história de violência.<\/p>"},{"html":"<p>O <strong>modelo PLISSIT<\/strong> (Annon, 1976) organiza a abordagem em níveis crescentes de complexidade:<\/p>"},{"html":"<ol><li><strong>P — Permissão<\/strong>: autorizar a conversa e validar a experiência.<\/li><li><strong>LI — Informação limitada<\/strong>: anatomia, fisiologia da resposta sexual, desfazer mitos.<\/li><li><strong>SS — Sugestões específicas<\/strong>: orientação dirigida ao problema (lubrificante, foco sensorial, ajuste de medicamento).<\/li><li><strong>IT — Terapia intensiva<\/strong>: encaminhamento a terapia sexual ou especialista.<\/li><\/ol>"},{"html":"<p>A maioria das queixas se resolve nas três primeiras etapas, ao alcance do generalista.<\/p>"}]},{"h":"Disfunções sexuais femininas no DSM-5-TR","blocos":[{"html":"<p>O DSM-5, mantido pelo DSM-5-TR (2022), reorganizou as disfunções femininas em três transtornos específicos, além da disfunção induzida por substância ou medicamento:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Transtorno<\/th><th>O que caracteriza<\/th><th>O que juntou<\/th><\/tr><\/thead><tbody><tr><td><strong>Interesse/excitação sexual feminino<\/strong><\/td><td>Ausência ou redução importante de interesse, fantasias, iniciativa, prazer, resposta a estímulos eróticos ou sensações genitais (ao menos 3 de 6 itens)<\/td><td>Desejo hipoativo + excitação do DSM-IV<\/td><\/tr><tr><td><strong>Orgasmo feminino<\/strong><\/td><td>Atraso acentuado, raridade ou ausência de orgasmo, ou intensidade muito reduzida, na quase totalidade das relações<\/td><td>—<\/td><\/tr><tr><td><strong>Dor gênito-pélvica/penetração<\/strong><\/td><td>Dificuldade de penetração, dor vulvovaginal ou pélvica, medo ou ansiedade antecipatória, contração involuntária do assoalho pélvico<\/td><td>Dispareunia + vaginismo<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Os critérios gerais valem para todos: <strong>duração de cerca de 6 meses ou mais<\/strong>, <strong>sofrimento clinicamente significativo<\/strong> e ausência de explicação melhor por outro transtorno mental, por conflito grave no relacionamento (inclusive violência), por outros estressores, por substância ou medicamento ou por condição médica. Especifica-se se é <strong>ao longo da vida ou adquirido<\/strong>, <strong>generalizado ou situacional<\/strong> e a gravidade.<\/p>"},{"html":"<blockquote><p><strong>Sem sofrimento, não há transtorno.<\/strong> O critério não é a frequência de relações nem a comparação com uma \"normalidade\", e sim o incômodo da própria mulher.<\/p><\/blockquote>"}]},{"h":"Fatores orgânicos, medicamentosos e relacionais","blocos":[{"html":"<p>A disfunção sexual quase sempre é multifatorial, e a busca de causa tratável vem antes de rotular o quadro.<\/p>"},{"html":"<ul><li><strong>Hormonais e ginecológicos<\/strong>: hipoestrogenismo (menopausa, <strong>lactação<\/strong>, amenorreia hipotalâmica), hiperprolactinemia, hipotireoidismo, endometriose (dispareunia de profundidade), vulvodinia, cirurgia e radioterapia pélvicas.<\/li><li><strong>Clínicos<\/strong>: diabetes, doença cardiovascular, doença neurológica, câncer, dor crônica.<\/li><li><strong>Psíquicos e relacionais<\/strong>: depressão e ansiedade, conflito conjugal, estresse, imagem corporal, história de violência sexual.<\/li><li><strong>Medicamentos<\/strong>: <strong>ISRS e IRSN<\/strong> são a causa medicamentosa mais comum — reduzem o desejo e retardam ou abolem o orgasmo; antipsicóticos (via hiperprolactinemia), betabloqueadores, antiandrogênicos, análogos do GnRH, inibidores de aromatase e tamoxifeno, opioides, benzodiazepínicos e álcool.<\/li><\/ul>"},{"html":"<p>Com a depressão controlada, a disfunção por ISRS se maneja reduzindo a dose, trocando por antidepressivo com menor efeito sexual (<strong>bupropiona<\/strong>, mirtazapina) ou associando bupropiona — nunca com suspensão abrupta.<\/p>"},{"html":"<p>O <strong>anticoncepcional combinado oral<\/strong> aumenta a SHBG e suprime os androgênios ovarianos, o que reduz a testosterona livre e pode diminuir o desejo em parte das usuárias; o efeito é individual, e a maioria não piora. Na <strong>lactação<\/strong>, a prolactina alta causa hipoestrogenismo, com ressecamento, dispareunia e menor desejo, que melhoram com o retorno da função ovariana.<\/p>"}]},{"h":"Síndrome geniturinária da menopausa","blocos":[{"html":"<p>O termo, adotado em 2014, substituiu \"atrofia vulvovaginal\" porque o hipoestrogenismo atinge vulva, vagina, uretra e bexiga. Os sintomas são <strong>genitais<\/strong> (ressecamento, ardor, prurido), <strong>sexuais<\/strong> (falta de lubrificação, dispareunia, sangramento pós-coito) e <strong>urinários<\/strong> (urgência, disúria, <strong>infecções urinárias de repetição<\/strong>). Ao exame: mucosa <strong>pálida, fina, sem pregas<\/strong>, com petéquias, menor elasticidade, carúncula uretral e <strong>pH vaginal acima de 4,5<\/strong>.<\/p>"},{"html":"<blockquote><p>Diferente dos fogachos, que tendem a melhorar com o tempo, a síndrome geniturinária é <strong>crônica e progressiva<\/strong> e não regride sem tratamento.<\/p><\/blockquote>"},{"html":"<p>O tratamento é escalonado:<\/p>"},{"html":"<ol><li><strong>Hidratantes vaginais<\/strong> de uso regular e <strong>lubrificantes<\/strong> na relação; atividade sexual regular ajuda a manter o trofismo.<\/li><li><strong>Estrogênio vaginal em baixa dose<\/strong> (estriol, promestrieno, estrogênios conjugados em creme ou óvulo) — o mais eficaz, inclusive para reduzir infecções urinárias de repetição. A absorção sistêmica é mínima e <strong>não exige progestagênio<\/strong> para proteger o endométrio.<\/li><li><strong>Terapia hormonal sistêmica<\/strong> só quando há também sintomas vasomotores; se a queixa é apenas geniturinária, prefere-se a via local.<\/li><\/ol>"},{"html":"<p>Em sobreviventes de câncer de mama, a primeira linha é não hormonal, e o estrogênio vaginal se discute com o oncologista.<\/p>"}]},{"h":"Princípios de tratamento","blocos":[{"html":"<p>O tratamento parte de corrigir o que é corrigível — medicamento, hipoestrogenismo, dor orgânica, depressão — e de educar o casal. A <strong>terapia sexual<\/strong> (cognitivo-comportamental, com exercícios de <strong>foco sensorial<\/strong>, descritos por Masters e Johnson) é central nos transtornos do interesse e do orgasmo. No transtorno da dor gênito-pélvica/penetração, a <strong>fisioterapia do assoalho pélvico<\/strong> com dilatadores progressivos é a base, associada à terapia sexual.<\/p>"},{"html":"<p>A <strong>testosterona<\/strong> tem uma única indicação com evidência consistente (consenso global de 2019): o <strong>transtorno do desejo sexual hipoativo na pós-menopausa<\/strong>, em dose fisiológica por via transdérmica, depois de avaliados os demais fatores. Não há evidência para usá-la em osteoporose, humor, energia ou prevenção cardiovascular.<\/p>"}]}]},{"slug":"sindromes-hipertensivas-na-gestacao","titulo":"Síndromes Hipertensivas na Gestação","disciplina":"GO","eyebrow":"Ginecologia e Obstetrícia · Gestação de Alto Risco","questoes":[{"id":"eb5ba6242f","q":"Quais valores pressóricos definem hipertensão arterial na gestação?","opts":["PAS ≥ 140 mmHg e/ou PAD ≥ 90 mmHg","PAS ≥ 130 mmHg e/ou PAD ≥ 85 mmHg","PAS ≥ 150 mmHg e/ou PAD ≥ 95 mmHg","PAS ≥ 160 mmHg e/ou PAD ≥ 110 mmHg"],"c":0,"exp":"Hipertensão na gravidez é definida por pressão sistólica igual ou maior que 140 mmHg e/ou diastólica igual ou maior que 90 mmHg, confirmadas em duas aferições com intervalo de pelo menos 4 horas. Os valores de 160 x 110 mmHg não definem hipertensão, e sim crise hipertensiva, um patamar de gravidade dentro dessa mesma doença.","ref":[0,2]},{"id":"61bb9c86db","q":"A partir de quais níveis pressóricos se caracteriza crise hipertensiva na gestação, mesmo em paciente assintomática?","opts":["PA ≥ 160 x 110 mmHg","PA ≥ 140 x 90 mmHg","PA ≥ 150 x 100 mmHg","PA ≥ 180 x 120 mmHg"],"c":0,"exp":"Crise hipertensiva na gestação é definida por PA igual ou maior que 160 x 110 mmHg, independentemente de sintomas. A ausência de cefaleia, escotomas ou epigastralgia não autoriza observação: o risco de acidente vascular cerebral materno já está instalado nesse patamar.","ref":[0,2]},{"id":"af5f33d610","q":"Diante de uma crise hipertensiva na gestação, qual é a conduta medicamentosa imediata?","opts":["Hidralazina EV ou nifedipino VO, associados a sulfato de magnésio","Captopril VO ou enalapril VO, associados a sulfato de magnésio","Metildopa VO ou anlodipino VO, associados a sulfato de magnésio","Furosemida EV ou atenolol VO, associados a sulfato de magnésio"],"c":0,"exp":"A crise hipertensiva é tratada com hidralazina endovenosa ou nifedipino oral, sempre acompanhados de sulfato de magnésio para prevenir eclâmpsia. Metildopa e anlodipino servem à manutenção ambulatorial, não à emergência, e inibidores da enzima conversora não são usados durante a gestação.","ref":[0,2]},{"id":"32b0595266","q":"No esquema que separa as formas clínicas pelo marco das 20 semanas, quais entidades ficam do lado anterior a esse limite?","opts":["Hipertensão arterial crônica e hipertensão do jaleco branco","Hipertensão gestacional e pré-eclâmpsia sem gravidade","Pré-eclâmpsia, eclâmpsia e síndrome HELLP associada","Hipertensão gestacional e pré-eclâmpsia sobreposta"],"c":0,"exp":"Antes das 20 semanas ficam a hipertensão arterial crônica e a hipertensão do jaleco branco. Depois das 20 semanas aparecem a hipertensão gestacional e a pré-eclâmpsia, esta com seus desdobramentos de gravidade, eclâmpsia e síndrome HELLP. A forma sobreposta atravessa todo o eixo, começando crônica e virando pré-eclâmpsia.","cap":"Formas clínicas separadas pelo marco das 20 semanas","ref":[1,1]},{"id":"cc97ac5ac6","q":"Gestante previamente normotensa apresenta PA 145 x 95 mmHg com 28 semanas, sem proteinúria e sem disfunção de órgão-alvo. Qual é o diagnóstico?","opts":["Hipertensão gestacional","Pré-eclâmpsia precoce","Hipertensão crônica","Eclâmpsia iminente"],"c":0,"exp":"Hipertensão que surge depois da 20ª semana em gestante antes normotensa, sem proteinúria e sem lesão de órgão-alvo, é hipertensão gestacional. Faltam os critérios de pré-eclâmpsia, e o surgimento tardio afasta a hipertensão crônica, que por definição precede as 20 semanas.","ref":[3,0]},{"id":"e1c7165206","q":"Em quanto tempo após o parto a hipertensão gestacional deve desaparecer para que o diagnóstico se confirme?","opts":["Até 12 semanas pós-parto","Até 42 dias pós-parto","Até 6 semanas pós-parto","Até 24 semanas pós-parto"],"c":0,"exp":"A hipertensão gestacional deve desaparecer até 12 semanas após o parto. Pressão que persiste além desse prazo revela hipertensão arterial crônica que apenas foi desmascarada pela gestação, e o diagn
