<style>
:root{
  --paper:#f5f3ef; --card:#faf9f6; --ink:#121a2b; --muted:#5b6478; --line:#ddd8ce;
  --blue:#2b57cc; --blued:#1e3f9c; --bluel:#f2f6fb; --blueb:#c9d6f7;
  --green:#1f5c3e; --greenl:#eef7f1; --greenb:#bcdcc9;
  --red:#8f2f25; --redl:#fbe6e2; --redb:#eec4bd;
  --amber:#6b5620; --amberl:#fdf6e4; --amberb:#e8d5a3;
  --serif:'Newsreader',Georgia,serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;font-family:var(--sans);cursor:pointer;border:none;background:none}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 70px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 9px}
h1{font-family:var(--serif);font-size:34px;line-height:1.1;font-weight:400;letter-spacing:-.025em;margin:0 0 10px;text-wrap:pretty}
h2{font-family:var(--serif);font-size:23px;line-height:1.3;font-weight:500;letter-spacing:-.015em;margin:0 0 12px}
h3{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:26px 0 10px}
.lede{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 22px;max-width:58ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border-radius:11px;font-weight:500;font-size:15px;
  background:var(--ink);color:#fff;transition:background .15s,transform .15s;width:100%}
.btn:hover:not(:disabled){background:var(--blue);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){background:#fff;border-color:var(--blue);color:var(--blue);transform:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{width:auto;flex:1 1 170px}
.seg{display:flex;height:7px;border-radius:99px;overflow:hidden;background:#e4e0d8}
.seg>i{display:block;height:100%}
.seg>i.ok{background:var(--green)} .seg>i.err{background:var(--red)} .seg>i.uns{background:var(--amberb)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(102px,1fr));gap:10px;margin:15px 0 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.stat b{display:block;font-family:var(--mono);font-size:21px;font-weight:600;line-height:1.1}
.stat span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}
.temas{display:flex;flex-direction:column;gap:7px}
.tema{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;transition:border-color .15s,transform .15s}
.tema:hover{border-color:var(--blue);transform:translateX(2px)}
.tema .tt{flex:1;min-width:0}
.tema .tt b{display:block;font-weight:500;font-size:14.5px;line-height:1.35}
.tema .tt span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.tema .mini{width:74px;flex:none}
.badge{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:99px;
  background:var(--redl);color:var(--red);border:1px solid var(--redb);flex:none}
.q{font-family:var(--serif);font-size:21px;line-height:1.42;font-weight:400;letter-spacing:-.012em;margin:0 0 18px;text-wrap:pretty}
.opt{display:flex;gap:11px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:13px 15px;margin:0 0 9px;font-size:15px;line-height:1.45;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--bluel)}
.opt .k{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted);flex:none;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--bluel)}
.opt.sel .k{color:var(--blued)}
.opt.ok{border-color:var(--greenb);background:var(--greenl)}
.opt.ok .k{color:var(--green)}
.opt.bad{border-color:var(--redb);background:var(--redl)}
.opt.bad .k{color:var(--red)}
.opt:disabled{cursor:default}
.conf{background:var(--amberl);border:1px solid var(--amberb);border-radius:11px;padding:13px 15px;margin:0 0 16px}
.conf p{margin:0 0 10px;font-size:13px;color:var(--amber);font-weight:500;line-height:1.4}
.conf .row>.btn{flex:1 1 128px;padding:10px 14px;font-size:14px;background:#fff;color:var(--ink);border:1px solid var(--amberb)}
.conf .row>.btn:hover{background:#fff;border-color:var(--blue);color:var(--blue);transform:none}
.conf .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.conf .btn.on:hover{background:var(--ink);color:#fff}
.exp{border-left:3px solid var(--line);padding:2px 0 2px 15px;margin:17px 0 0;font-size:14.5px;line-height:1.6;color:#2a3141}
.exp b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 6px}
.exp.good{border-color:var(--greenb)} .exp.bad{border-color:var(--redb)}
.cap{font-size:12.5px;color:var(--muted);font-style:italic;margin:11px 0 0;line-height:1.5}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 18px;
  font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.timer{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.02em;color:var(--ink)}
.timer.low{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:4px 0 0}
.gq{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:#fff;
  font-family:var(--mono);font-size:12.5px;font-weight:500;display:flex;align-items:center;justify-content:center}
.gq.done{background:var(--bluel);border-color:var(--blueb);color:var(--blued)}
.gq.now{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.gq.ok{background:var(--greenl);border-color:var(--greenb);color:var(--green)}
.gq.bad{background:var(--redl);border-color:var(--redb);color:var(--red)}
.chk{display:flex;align-items:center;gap:10px;padding:11px 13px;background:#fff;border:1px solid var(--line);
  border-radius:10px;margin:0 0 7px;font-size:14px;width:100%;text-align:left;line-height:1.4}
.chk.on{border-color:var(--blue);background:var(--bluel)}
.chk .bx{width:17px;height:17px;border:1.5px solid var(--muted);border-radius:5px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700}
.chk.on .bx{background:var(--blue);border-color:var(--blue)}
.chk .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:none}
.fld{margin:0 0 16px}
.fld label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.fld input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;
  background:#fff;font-family:var(--mono);color:var(--ink)}
.fld input:focus{outline:none;border-color:var(--blue)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:8px 0 0}
.note{background:var(--bluel);border:1px solid var(--blueb);border-radius:11px;padding:13px 15px;
  font-size:13.5px;line-height:1.55;color:var(--blued);margin:0 0 14px}
.note.warn{background:var(--redl);border-color:var(--redb);color:var(--red)}
.note.calm{background:var(--greenl);border-color:var(--greenb);color:var(--green)}
.empty{text-align:center;padding:32px 18px;color:var(--muted);font-size:14.5px;line-height:1.6}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin:13px 0 0;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:block}
.foot{margin:32px 0 0;padding:16px 0 0;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;line-height:1.8}
.foot a{color:var(--muted);text-decoration:underline}
.rev{margin:0 0 12px;padding:15px 0 0;border-top:1px solid var(--line)}
.rev:first-child{border-top:none;padding-top:0}
.revq{font-family:var(--serif);font-size:16.5px;line-height:1.42;margin:0 0 9px}
.revl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
.resp{font-size:14px;line-height:1.5;margin:0 0 4px}
/* ---- resumo anexo, para consulta ---- */
.fonte{display:inline-flex;align-items:center;gap:7px;width:auto;margin:15px 0 0;padding:9px 15px;
  border:1px solid var(--blueb);background:var(--bluel);color:var(--blued);border-radius:9px;
  font-size:13.5px;font-weight:500;line-height:1.3;text-align:left}
.fonte:hover{background:#e8effb;border-color:var(--blue);transform:none}
.resumo{font-size:15px;line-height:1.68;color:#1d2433}
.resumo h2{font-family:var(--serif);font-size:21px;font-weight:500;letter-spacing:-.015em;margin:30px 0 12px;text-transform:none;color:var(--ink)}
.resumo h2:first-child{margin-top:0}
.resumo h3{font-family:var(--serif);font-size:17.5px;font-weight:600;letter-spacing:0;margin:23px 0 9px;text-transform:none;color:var(--ink)}
.resumo h4{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:19px 0 8px}
.resumo p{margin:0 0 13px}
.resumo ul,.resumo ol{margin:0 0 13px;padding-left:21px}
.resumo li{margin:0 0 6px}
.resumo blockquote{margin:15px 0;padding:13px 16px;background:var(--bluel);border-left:3px solid var(--blueb);border-radius:0 9px 9px 0}
.resumo blockquote p:last-child{margin:0}
.resumo hr{border:none;border-top:1px solid var(--line);margin:23px 0}
.resumo code{font-family:var(--mono);font-size:.9em;background:#eeebe4;padding:1px 5px;border-radius:4px}
.resumo .tbl{overflow-x:auto;margin:0 0 15px}
.resumo table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.45}
.resumo th,.resumo td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.resumo th{background:#efece5;font-weight:600}
.resumo .figleg{font-size:12.5px;color:var(--muted);font-style:italic;border-left:2px solid var(--line);padding-left:11px;margin:0 0 13px}
.alvo{background:#fdf6e4;border-radius:5px;scroll-margin-top:24px;
  box-shadow:0 0 0 5px #fdf6e4,0 0 0 6px var(--amberb)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;line-height:1.3}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:560px){h1{font-size:28px}.q{font-size:19px}.wrap{padding:18px 15px 60px}
  .resumo{font-size:14.5px}.resumo table{font-size:12.5px}}
</style>

var DADOS = {"titulo":"Revisão · SM III","eyebrow":"Saúde da Mulher III · prova em 08/12","subtitulo":"549 questões em 17 temas. Marque sua confiança antes de responder: o que você errou — ou acertou na dúvida — volta na fila até sair com dois acertos confiantes seguidos.","rodape":"Gerado em 26 de novembro de 2026","chave":"go","voltar":{"href":"../plano.html","rotulo":"Plano de estudo"},"temas":[{"slug":"diabetes-mellitus-gestacional","titulo":"Diabetes Mellitus Gestacional","disciplina":"GO","eyebrow":"Ginecologia e Obstetrícia · Gestação de Alto Risco","questoes":[{"id":"95fd67e4cc","q":"Na primeira consulta de pré-natal, uma gestante de 10 semanas apresenta glicemia de jejum de 108 mg/dL. Qual faixa de glicemia de jejum, nesse momento, já estabelece o diagnóstico de diabetes mellitus gestacional sem necessidade de sobrecarga?","opts":["Entre 92 e 125 mg/dL","Entre 85 e 91 mg/dL","Entre 100 e 139 mg/dL","Entre 126 e 199 mg/dL","Entre 140 e 199 mg/dL"],"c":0,"exp":"No rastreamento universal da primeira consulta, glicemia de jejum entre 92 e 125 mg/dL fecha o diagnóstico de diabetes gestacional e dispensa o teste de tolerância. Abaixo de 92 mg/dL a gestante segue para o TOTG de 75 g entre 24 e 28 semanas. A partir de 126 mg/dL o quadro deixa de ser gestacional e passa a ser diabetes franco.","ref":[2,0]},{"id":"d11821dc49","q":"Gestante de 8 semanas chega ao pré-natal com glicemia de jejum de 138 mg/dL e hemoglobina glicada de 6,8%. Qual é a classificação correta desse quadro?","opts":["Diabetes mellitus diagnosticado na gestação","Diabetes mellitus gestacional de baixo risco","Tolerância à glicose diminuída da gravidez","Glicemia de jejum alterada, sem diabetes","Rastreamento normal, repetir com 24 semanas"],"c":0,"exp":"Glicemia de jejum igual ou acima de 126 mg/dL, hemoglobina glicada igual ou acima de 6,5% ou glicemia casual igual ou acima de 200 mg/dL com sintomas caracterizam diabetes franco, e não diabetes gestacional. A distinção muda o prognóstico: esse grupo tem risco de malformação, exige rastreio de vasculopatia e mantém a doença após o parto.","ref":[0,1]},{"id":"cc1b4e2f2d","q":"O teste oral de tolerância à glicose com 75 g é indicado para toda gestante que não recebeu diagnóstico no início da gravidez. Em que idade gestacional ele deve ser realizado?","opts":["Entre 24 e 28 semanas","Entre 11 e 13 semanas","Entre 16 e 20 semanas","Entre 20 e 24 semanas","Entre 30 e 34 semanas"],"c":0,"exp":"A janela de 24 a 28 semanas coincide com o pico dos hormônios contra-insulínicos placentários, quando a resistência à insulina se manifesta plenamente. O teste dosa a glicemia em jejum, na primeira e na segunda hora após a ingestão de 75 g de glicose.","ref":[2,0]},{"id":"b0bc0fc22c","q":"No teste oral de tolerância à glicose com 75 g realizado entre 24 e 28 semanas, qual é o valor de corte da glicemia de jejum que caracteriza diabetes gestacional?","opts":["92 mg/dL","85 mg/dL","95 mg/dL","100 mg/dL","126 mg/dL"],"c":0,"exp":"O corte de jejum no TOTG de 75 g é 92 mg/dL, valor derivado do estudo HAPO e adotado pelo IADPSG em 2010. O valor de 95 mg/dL pertence aos critérios de Carpenter e Coustan, usados na sobrecarga de 100 g, e 126 mg/dL já define diabetes franco.","ref":[2,0]},{"id":"c2f855b75d","q":"Qual é o valor de corte da glicemia de primeira hora no teste oral de tolerância à glicose com 75 g para o diagnóstico de diabetes gestacional?","opts":["180 mg/dL","140 mg/dL","153 mg/dL","155 mg/dL","200 mg/dL"],"c":0,"exp":"A primeira hora tem corte de 180 mg/dL. O valor de 153 mg/dL corresponde à segunda hora, e uma segunda hora igual ou acima de 200 mg/dL já indica diabetes franco, não gestacional. Não existe corte definido para a primeira hora que diagnostique diabetes franco.","ref":[2,0]},{"id":"9e9191e2eb","q":"Qual é o valor de corte da glicemia de segunda hora no teste oral de tolerância à glicose com 75 g para o diagnóstico de diabetes gestacional?","opts":["153 mg/dL","140 mg/dL","120 mg/dL","180 mg/dL","199 mg/dL"],"c":0,"exp":"A segunda hora tem corte de 153 mg/dL, e valores entre 153 e 199 mg/dL definem diabetes gestacional. A partir de 200 mg/dL o diagnóstico passa a ser diabetes franco. O corte de 140 mg/dL pertencia ao critério da Organização Mundial da Saúde de 1999, abandonado em 2013.","ref":[2,0]},{"id":"c9868e3664","q":"Quantos valores alterados são necessários no teste oral de tolerância à glicose com 75 g para firmar o diagnóstico de diabetes gestacional?","opts":["Um valor alterado já é suficiente","São necessários dois valores alterados","São necessários três valores alterados","Apenas o valor de jejum tem validade","Apenas o valor de duas horas vale"],"c":0,"exp":"Basta um único valor igual ou acima do corte — jejum 92, primeira hora 180 ou segunda hora 153 mg/dL — para diagnosticar diabetes gestacional. A exigência de dois valores alterados pertencia aos critérios antigos com sobrecarga de 100 g, de O'Sullivan e Mahan e do National Diabetes Data Group.","ref":[2,2]},{"id":"91e3e5fe5d","q":"Gestante de 26 semanas realiza teste de tolerância com 75 g: jejum 96 mg/dL, primeira hora 165 mg/dL e segunda hora 210 mg/dL. Qual é o diagnóstico?","opts":["Diabetes mellitus, pelo valor de 2 horas","Diabetes gestacional, pelo valor de jejum","Diabetes gestacional, pela primeira hora","Tolerância diminuída, sem critério de DM","Exame normal, sem necessidade de repetir"],"c":0,"exp":"Glicemia de segunda hora igual ou acima de 200 mg/dL no TOTG de 75 g caracteriza diabetes mellitus, e não diabetes gestacional, mesmo com o jejum na faixa de 92 a 125 mg/dL. Um jejum igual ou acima de 126 mg/dL tem o mesmo peso. Essa paciente é conduzida como diabética franca e precisa ser reclassificada após o parto.","ref":[2,0]},{"id":"f87d96c7ba","q":"Gestante inicia o pré-natal com 32 semanas, sem nenhum exame prévio. Qual é a conduta de rastreamento de hiperglicemia?","opts":["TOTG com 75 g de glicose imediatamente","TOTG com 75 g de glicose com 36 semanas","Apenas glicemia de jejum, sem sobrecarga","Apenas hemoglobina glicada trimestral","Glicemia pós-prandial de 2 horas apenas"],"c":0,"exp":"Quando o pré-natal começa depois de 28 semanas, a janela ideal de 24 a 28 semanas já passou e o teste de tolerância com 75 g deve ser feito imediatamente. Adiar o exame para perto do termo reduz o tempo útil de tratamento e a chance de evitar macrossomia e suas complicações.","ref":[2,0]},{"id":"26361f9894","q":"Gestante de 12 semanas tem glicemia de jejum de 84 mg/dL na primeira consulta. Qual é o próximo passo do rastreamento de hiperglicemia?","opts":["TOTG de 75 g entre 24 e 28 semanas","TOTG de 75 g entre 16 e 20 semanas","TOTG de 75 g entre 32 e 36 semanas","Nova glicemia de jejum com 20 semanas","Nenhum outro exame de rastreamento"],"c":0,"exp":"Glicemia de jejum abaixo de 92 mg/dL antes de 20 semanas afasta o diagnóstico naquele momento, mas não encerra o rastreamento: a resistência insulínica só se instala plenamente no segundo trimestre. A gestante segue para o teste de tolerância com 75 g entre 24 e 28 semanas.","cap":"Fluxograma de rastreamento da hiperglicemia na gestação","ref":[2,0]},{"id":"94bbc219d3","q":"Na classificação prognóstica de Priscila White, como é designada a gestante cujo diabetes surgiu na gravidez e é controlado apenas com dieta e exercício?","opts":["Classe A1","Classe A2","Classe B","Classe C","Classe D"],"c":0,"exp":"A classe A1 reúne o diabetes de início gestacional, sem vasculopatia e com tratamento não farmacológico; a A2 é a mesma situação, porém já em uso de medicação. As classes de B a T descrevem diabetes prévio, graduado por idade de início, tempo de doença e órgão-alvo comprometido.","cap":"Classificação prognóstica e evolutiva de Priscila White","ref":[0,4]},{"id":"2a56854edc","q":"Quais são os alvos de glicemia capilar recomendados para a gestante com diabetes em tratamento?","opts":["Jejum < 95, 1 hora < 140 e 2 horas < 120","Jejum < 90, 1 hora < 130 e 2 horas < 110","Jejum < 95, 1 hora < 120 e 2 horas < 140","Jejum < 100, 1 hora < 140 e 2 horas < 120","Jejum < 105, 1 hora < 155 e 2 horas < 130"],"c":0,"exp":"Os alvos em mg/dL são jejum abaixo de 95, uma hora pós-prandial abaixo de 140 e duas horas pós-prandial abaixo de 120. A meta de duas horas é mais baixa que a de uma hora porque a curva já deveria estar em queda. Em usuárias de insulina com hipoglicemias frequentes esses valores podem ser individualizados.","cap":"Metas para o controle glicêmico na gestação","ref":[5,3]},{"id":"65fe2b8258","q":"Na automonitorização com glicosímetro durante a gestação, quais são as faixas-alvo de glicemia capilar antes das refeições e uma hora após?","opts":["70 a 95 e 90 a 140 mg/dL","70 a 90 e 90 a 120 mg/dL","80 a 110 e 100 a 160 mg/dL","60 a 100 e 120 a 180 mg/dL","90 a 130 e 140 a 200 mg/dL"],"c":0,"exp":"As metas práticas de automonitorização são 70 a 95 mg/dL antes das refeições e 90 a 140 mg/dL uma hora depois. O piso de 70 mg/dL existe para que o tratamento não troque hiperglicemia por hipoglicemia materna, que também compromete o feto.","ref":[5,3]},{"id":"0aefb0a05e","q":"Quando o feto já é grande para a idade gestacional ou há polidrâmnio, qual meta de glicemia capilar de uma hora pós-prandial deve ser adotada?","opts":["90 a 130 mg/dL","90 a 140 mg/dL","70 a 120 mg/dL","100 a 150 mg/dL","80 a 160 mg/dL"],"c":0,"exp":"Diante de feto grande para a idade gestacional ou polidrâmnio, o alvo pós-prandial de uma hora aperta de 90-140 para 90-130 mg/dL, enquanto o pré-prandial permanece em 70-95 mg/dL. Os dois achados indicam que a hiperinsulinemia fetal segue ativa apesar de um controle aparentemente adequado.","ref":[5,4]},{"id":"e87308103a","q":"Com que frequência a glicemia capilar deve ser aferida pela gestante com diabetes em acompanhamento ambulatorial?","opts":["Quatro a oito vezes ao dia","Uma a duas vezes ao dia","Duas a três vezes ao dia","Dez a doze vezes ao dia","Uma vez a cada dois dias"],"c":0,"exp":"São recomendadas quatro a oito aferições diárias, distribuídas entre pré-prandiais e pós-prandiais de uma hora, para que cada refeição seja avaliada. Um número menor de medidas deixa escapar picos pós-prandiais, justamente os que mais se relacionam com macrossomia.","ref":[5,0]},{"id":"78ba39c229","q":"Qual é a primeira linha de tratamento do diabetes gestacional e qual proporção de gestantes atinge as metas apenas com ela?","opts":["Terapia nutricional, que resolve 80 a 90%","Insulinoterapia plena, que resolve 80 a 90%","Metformina oral, que resolve 80 a 90%","Glibenclamida oral, que resolve 80 a 90%","Internação hospitalar, que resolve 80 a 90%"],"c":0,"exp":"A terapia nutricional associada a exercício controla 80 a 90% dos casos de diabetes gestacional e é sempre a intervenção inicial. Apenas a minoria que não alcança as metas depois de cerca de duas semanas de dieta adequada precisa de tratamento farmacológico.","ref":[4,0]},{"id":"bf96a2de56","q":"Em que situação está indicado iniciar insulina na gestante com diabetes gestacional?","opts":["Quando a dieta não atinge as metas","Logo que o diagnóstico é confirmado","Somente se houver macrossomia fetal","Apenas depois de 36 semanas de gestação","Somente quando a gestante for obesa"],"c":0,"exp":"A insulina entra quando a terapia nutricional não mantém as glicemias dentro dos alvos, e também em quem já tinha diabetes tipo 1 ou tipo 2 antes da gestação. Não é iniciada de rotina ao diagnóstico, porque a maioria responde à dieta. Feto grande para a idade gestacional e polidrâmnio reforçam a indicação, mas não são pré-requisito.","ref":[6,1]},{"id":"b2a1944fe1","q":"Na prescrição dietética do diabetes gestacional, qual proporção do valor calórico total deve vir dos carboidratos?","opts":["40 a 55% do valor calórico total","20 a 30% do valor calórico total","30 a 40% do valor calórico total","15 a 20% do valor calórico total","60 a 70% do valor calórico total"],"c":0,"exp":"A distribuição recomendada é de 40 a 55% de carboidratos, 30 a 40% de lipídios e 15 a 20% de proteínas, com o valor calórico estratificado pelo índice de massa corporal. Restringir carboidrato abaixo dessa faixa favorece cetose de jejum, igualmente prejudicial ao feto.","ref":[4,0]},{"id":"374b5d3a81","q":"Quantas refeições diárias são recomendadas na terapia nutricional do diabetes gestacional e quanto de carboidrato deve conter a ceia noturna?","opts":["Seis refeições e ceia com 25 g","Seis refeições e ceia com 50 g","Três refeições e ceia com 25 g","Seis refeições e ceia com 10 g","Quatro refeições e ceia com 5 g"],"c":0,"exp":"São seis refeições ao dia, em intervalos de cerca de três horas, com ceia noturna contendo aproximadamente 25 g de carboidrato. A ceia existe para encurtar o jejum noturno e evitar a cetose de madrugada, que se traduz em glicemia de jejum instável na manhã seguinte.","ref":[4,2]},{"id":"06cac28489","q":"Qual modalidade de exercício deve ser evitada pela gestante com diabetes?","opts":["Isometria de grandes grupos musculares","Caminhada em ritmo leve a moderado","Hidroginástica em piscina aquecida","Ciclismo em bicicleta estacionária","Exercício de resistência supervisionado"],"c":0,"exp":"Devem ser evitados esportes de contato, atividades com risco de queda, isometria de grandes grupos musculares e decúbito horizontal depois do primeiro trimestre. Caminhada, natação, hidroginástica, bicicleta estacionária e exercício resistido orientado são liberados e reduzem a glicemia de jejum, a pós-prandial e a necessidade de insulina.","ref":[4,5]},{"id":"77dea11ec7","q":"Quais hormônios produzidos pela placenta explicam o aumento da resistência periférica à insulina na segunda metade da gestação?","opts":["Lactogênio placentário e cortisol","Insulina e peptídeo C placentários","Progesterona e relaxina ovarianas","Ocitocina e prolactina hipofisárias","Aldosterona e renina placentárias"],"c":0,"exp":"O lactogênio placentário, o hormônio do crescimento placentário e o cortisol são contra-insulínicos e crescem junto com a massa placentária, o que explica a resistência insulínica máxima entre 24 e 28 semanas. O pâncreas materno compensa aumentando a secreção; quando não consegue, aparece o diabetes gestacional.","ref":[1,0]},{"id":"4ad27d9890","q":"Qual mecanismo explica o polidrâmnio na gestação complicada por diabetes?","opts":["Hiperglicemia fetal causando poliúria","Hipoglicemia fetal reduzindo a diurese","Hipoplasia renal fetal por malformação","Deglutição fetal aumentada de líquido","Redução do fluxo placentário materno"],"c":0,"exp":"A glicose materna atravessa a placenta por difusão facilitada e gera hiperglicemia fetal, que funciona como diurese osmótica: o feto urina mais e o líquido amniótico aumenta. O polidrâmnio distende o útero e favorece rotura prematura de membranas e prematuridade.","ref":[1,4]},{"id":"03f50dd0fb","q":"Por que o recém-nascido de mãe com diabetes mal controlado apresenta hipoglicemia nas primeiras horas de vida?","opts":["Hiperinsulinemia fetal persiste ao nascer","Hipoinsulinemia fetal persiste ao nascer","Falta de glicogênio hepático na mãe","Imaturidade do eixo hipofisário fetal","Queda dos hormônios tireoidianos fetais"],"c":0,"exp":"A hiperglicemia materna estimula cronicamente o pâncreas fetal, que passa a produzir insulina em excesso. Com o clampeamento do cordão a oferta de glicose cessa de súbito, mas a hiperinsulinemia persiste por horas e produz hipoglicemia neonatal. Por isso o recém-nascido precisa de glicemia capilar seriada.","ref":[1,4]},{"id":"4c55044512","q":"Qual é o período crítico de mau controle glicêmico responsável pelas malformações fetais associadas ao diabetes?","opts":["Entre a sexta e a oitava semana de gestação","Entre a décima e a décima segunda semana","Entre a décima quarta e a décima sexta","Entre a vigésima e a vigésima quarta","Entre a trigésima e a trigésima quarta"],"c":0,"exp":"A organogênese ocorre entre a sexta e a oitava semana, e é a hiperglicemia desse período que triplica a incidência de malformações em relação à população geral. Como o diabetes gestacional costuma se manifestar depois, esse risco é típico do diabetes prévio, o que reforça a importância do controle pré-concepcional.","ref":[3,3]},{"id":"05477265f1","q":"Qual malformação é classicamente considerada marcadora da embriopatia diabética?","opts":["Síndrome de regressão caudal","Estenose hipertrófica de piloro","Hérnia diafragmática congênita","Atresia de esôfago com fístula","Agenesia renal bilateral isolada"],"c":0,"exp":"A síndrome de regressão caudal, com agenesia sacrococcígea, quadris pequenos e membros em posição de perna de rã, é rara na população geral e fortemente associada ao diabetes materno. Também são frequentes os defeitos de fechamento do tubo neural, como a anencefalia, e cardiopatias, como a transposição das grandes artérias.","ref":[3,3]},{"id":"5c44e2918f","q":"Quais são os valores normais do índice de líquido amniótico e do maior bolsão vertical na avaliação ultrassonográfica?","opts":["ILA de 8 a 18 cm e bolsão de 2 a 8 cm","ILA de 5 a 25 cm e bolsão de 2 a 8 cm","ILA de 8 a 18 cm e bolsão de 1 a 4 cm","ILA de 2 a 8 cm e bolsão de 8 a 18 cm","ILA de 10 a 20 cm e bolsão de 3 a 9 cm"],"c":0,"exp":"O índice de líquido amniótico normal vai de 8 a 18 cm e o maior bolsão vertical, de 2 a 8 cm. Em gestação gemelar apenas o maior bolsão vertical é válido, porque o cálculo por quadrantes perde sentido com duas bolsas. Valores acima do limite caracterizam polidrâmnio, achado que obriga a apertar as metas glicêmicas.","ref":[7,2]},{"id":"ba0cb46f93","q":"Qual é a dose inicial de insulina recomendada para a gestante com diabetes, em qualquer idade gestacional?","opts":["0,5 UI/kg/dia","0,2 UI/kg/dia","0,3 UI/kg/dia","1,0 UI/kg/dia","1,5 UI/kg/dia"],"c":0,"exp":"A dose inicial é de 0,5 UI/kg/dia, calculada sobre o peso atual e válida para qualquer idade gestacional. Os ajustes devem ser feitos no mínimo a cada 15 dias até a 30ª semana e semanalmente depois disso, porque a resistência insulínica continua crescendo até perto do termo.","ref":[6,1]},{"id":"d0cbe8b8ba","q":"Qual insulina tem início de ação em 5 a 15 minutos, pico entre 0,5 e 2 horas e duração de 3 a 5 horas?","opts":["Insulina asparte","Insulina regular","Insulina NPH humana","Insulina detemir","Insulina glargina"],"c":0,"exp":"Asparte e lispro são análogos ultrarrápidos, aplicados no início da refeição ou até 15 minutos antes. A regular, humana e de ação rápida, começa a agir em 0,5 a 1 hora e exige aplicação 30 a 40 minutos antes de comer; a NPH é intermediária, com pico em 4 a 10 horas e duração de 10 a 18 horas.","cap":"Tipos de insulina: início, pico e duração de ação","ref":[6,2]},{"id":"77fa63e3da","q":"Quando a dose total de insulina NPH é dividida em três aplicações diárias, qual é a distribuição recomendada?","opts":["1/2 de manhã, 1/4 antes do almoço, 1/4 ao deitar","1/3 de manhã, 1/3 antes do almoço, 1/3 ao deitar","1/4 de manhã, 1/4 antes do almoço, 1/2 ao deitar","1/4 de manhã, 1/2 antes do almoço, 1/4 ao deitar","1/2 de manhã, 1/2 antes do almoço, sem dose noturna"],"c":0,"exp":"Partindo de 0,5 UI/kg/dia, a NPH é distribuída em metade pela manhã, um quarto antes do almoço e um quarto ao deitar. A dose maior matinal acompanha o pico de hormônios contra-insulínicos do início do dia, e a dose ao deitar cobre a produção hepática de glicose da madrugada.","ref":[6,4]},{"id":"dcc14c5052","q":"Qual é a situação regulatória da metformina no tratamento do diabetes mellitus gestacional no Brasil?","opts":["Categoria B pelo FDA, sem aval da Anvisa","Categoria D pelo FDA, sem aval da Anvisa","Categoria B pelo FDA, aprovada pela Anvisa","Categoria X pelo FDA, proibida na gestação","Categoria A pelo FDA, aprovada pela Anvisa"],"c":0,"exp":"A metformina é categoria B na classificação norte-americana, mas a Anvisa não aprova seu uso para diabetes gestacional, de modo que a prescrição é off-label no país. O ensaio MiG, com 751 gestantes, não mostrou aumento de malformações, sepse neonatal, óbito fetal ou pré-eclâmpsia, e a droga atravessa livremente a placenta.","ref":[6,8]},{"id":"3ec44c6740","q":"Gestante com diabetes gestacional e bom controle glicêmico obtido apenas com dieta e exercício. Em que idade gestacional o parto deve ser programado?","opts":["Entre 39 e 40 semanas e 6 dias","Entre 39 e 39 semanas e 6 dias","Entre 38 e 38 semanas e 6 dias","Entre 37 e 38 semanas e 6 dias","Entre 41 e 42 semanas e 6 dias"],"c":0,"exp":"Com bom controle e tratamento apenas não farmacológico, a gestação pode seguir até 40 semanas e 6 dias. Quando o bom controle depende de medicação, a janela se estreita para 39 a 39 semanas e 6 dias. A via de parto continua definida por indicação obstétrica, não pelo diabetes em si.","cap":"Momento do parto no diabetes mellitus gestacional","ref":[7,4]},{"id":"f749f90f56","q":"Gestante com diabetes gestacional e controle glicêmico ruim, mesmo em uso de insulina. Qual é o momento recomendado para o parto?","opts":["Entre 37 e 38 semanas","Entre 39 e 40 semanas","Entre 34 e 35 semanas","Entre 40 e 41 semanas","Entre 41 e 42 semanas"],"c":0,"exp":"Controle glicêmico ruim antecipa o parto para 37 a 38 semanas, independentemente de o tratamento ser farmacológico ou não, porque o risco de óbito fetal e de macrossomia cresce no fim da gestação. No diabetes prévio ou diagnosticado na gestação com controle ruim, considera-se o parto antes de 37 semanas.","ref":[7,4]},{"id":"3b85936fc4","q":"Durante a fase ativa do trabalho de parto de gestante em uso de insulina, qual é a conduta com a dose e qual a meta glicêmica?","opts":["1/3 a 1/2 da dose e alvo de 70 a 120 mg/dL","Dose plena habitual e alvo de 70 a 120 mg/dL","Suspender a insulina e alvo de 70 a 95 mg/dL","Dobrar a dose e alvo de 100 a 180 mg/dL","1/3 a 1/2 da dose e alvo de 140 a 200 mg/dL"],"c":0,"exp":"Na fase ativa mantém-se o desjejum habitual, aplica-se um terço a metade da dose de insulina e mede-se a glicemia capilar a cada 4 horas, com alvo de 70 a 120 mg/dL. Na cesárea, a paciente fica em jejum com soro glicosado a 5% a 50 mL/h e controle capilar a cada 1 a 2 horas no diabetes prévio.","ref":[7,7]},{"id":"c66db7c544","q":"Qual exame deve ser feito na puérpera que teve diabetes gestacional, e em que momento?","opts":["TOTG de 75 g de seis a doze semanas após o parto","TOTG de 75 g na primeira semana após o parto","Hemoglobina glicada na alta da maternidade","TOTG de 100 g de seis a doze meses após o parto","Glicemia capilar diária durante seis semanas"],"c":0,"exp":"A reclassificação é feita com teste de tolerância de 75 g entre seis e doze semanas do parto, dosando jejum e segunda hora. A hemoglobina glicada não serve nesse período porque a renovação eritrocitária da gestação e a perda sanguínea do parto produzem redução falsa do resultado.","cap":"Reclassificação glicêmica da puérpera","ref":[8,3]},{"id":"189737c2cb","q":"Puérpera com diabetes gestacional prévio faz teste de tolerância com 75 g na oitava semana: jejum 110 mg/dL e segunda hora 130 mg/dL. Como se classifica esse resultado?","opts":["Glicemia de jejum alterada","Intolerância oral à glicose","Diabetes mellitus franco","Tolerância normal à glicose","Resistência insulínica pura"],"c":0,"exp":"Jejum entre 100 e 125 mg/dL com segunda hora abaixo de 140 mg/dL define glicemia de jejum alterada. A intolerância à glicose exigiria segunda hora entre 140 e 199 mg/dL, e o diabetes exigiria jejum igual ou acima de 126 ou segunda hora igual ou acima de 200 mg/dL. Resultado normal seria jejum abaixo de 100 com segunda hora abaixo de 140 mg/dL.","ref":[8,4]},{"id":"19fd2672b0","q":"Qual é o risco de diabetes tipo 2 em 20 anos após um diabetes gestacional e o quanto a mudança de estilo de vida o reduz?","opts":["50 a 60%, reduzido em 35% pelo estilo de vida","50 a 60%, reduzido em 5% pelo estilo de vida","10 a 20%, reduzido em 35% pelo estilo de vida","5 a 10%, reduzido em 70% pelo estilo de vida","80 a 90%, reduzido em 15% pelo estilo de vida"],"c":0,"exp":"Quem teve diabetes gestacional tem risco de 50 a 60% de desenvolver diabetes tipo 2 em 20 anos, cerca de dez vezes o de quem não teve. Modificação de estilo de vida com manutenção de peso reduz em 35% a progressão em 10 anos, e a metformina, em 40%. O seguimento mínimo é de três anos com glicemia de jejum ou hemoglobina glicada.","ref":[8,7]}],"resumo":[{"h":"Hiperglicemia na gestação: duas doenças sob o mesmo guarda-chuva","blocos":[{"html":"<p>Quando uma gestante apresenta glicemia elevada, a primeira pergunta não é <em>quanto<\/em>, mas <em>o quê<\/em>. O termo guarda-chuva é <strong>hiperglicemia na gestação<\/strong>, e ele abriga duas entidades com prognósticos, riscos e condutas diferentes.<\/p>"},{"html":"<p>A primeira é o <strong>diabetes mellitus<\/strong>, que pode já existir antes da gravidez — diabetes tipo 1, tipo 2 ou outros tipos específicos — ou ser <em>diagnosticado durante<\/em> a gestação por atingir os critérios clássicos de diabetes fora da gravidez: glicemia de jejum ≥ 126 mg/dL, glicemia de 2 horas após sobrecarga de 75 g ≥ 200 mg/dL, hemoglobina glicada ≥ 6,5% ou glicemia casual ≥ 200 mg/dL acompanhada de sintomas. Nesses casos a mulher é diabética, ponto: a doença não desaparece com a dequitação, o risco de malformação existe desde a concepção e há necessidade de rastrear vasculopatia.<\/p>"},{"html":"<p>A segunda é o <strong>diabetes mellitus gestacional (DMG)<\/strong>, que é a intolerância aos carboidratos reconhecida pela primeira vez na gravidez, com valores acima do normal mas <strong>abaixo<\/strong> dos critérios de diabetes franco. É uma condição da gestação, costuma se manifestar no segundo trimestre e, na maioria dos casos, remite no puerpério — deixando, porém, uma marca de risco que acompanha a mulher pelo resto da vida.<\/p>"},{"html":"<blockquote><p>A confusão mais cara da prova é tratar \"glicemia alta na gestação\" como sinônimo de DMG. Jejum de 138 mg/dL na primeira consulta <strong>não<\/strong> é diabetes gestacional: é diabetes diagnosticado na gestação (<em>overt diabetes<\/em>), e a conduta muda inteira.<\/p><\/blockquote>"},{"html":"<p>A classificação prognóstica de <strong>Priscila White<\/strong>, atualizada pelo Ministério da Saúde, organiza esse espectro por letras. As classes <strong>A1<\/strong> (DMG com tratamento não farmacológico) e <strong>A2<\/strong> (DMG com tratamento farmacológico) cobrem o diabetes de início gestacional sem vasculopatia. De <strong>B<\/strong> a <strong>T<\/strong> estão os diabetes prévios, graduados por idade de início, tempo de doença e órgão-alvo: B (início ≥ 20 anos, duração &lt; 10 anos), C (início &lt; 20 anos, duração ≥ 10 anos), D (retinopatia simples), E (calcificação de artérias pélvicas), F (nefropatia), R (retinopatia proliferativa), H (doença coronariana) e T (transplante renal).<\/p>"},{"html":"<p class=\"figleg\">Classificação prognóstica e evolutiva de Priscila White<\/p>"},{"html":"<p>A escala epidemiológica justifica o rigor. O Brasil tem cerca de 20 milhões de pessoas com diabetes, prevalência de 10,5%, ocupando o 6º lugar mundial em diabetes total e o 3º em diabetes tipo 1. Em 2021, aproximadamente 21 milhões de recém-nascidos — <strong>16,7% de todos os nascimentos<\/strong> — eram filhos de mães com algum grau de hiperglicemia na gestação. A prevalência de DMG varia de 1% a 37,7% conforme critério e população, com média mundial de <strong>16,2%<\/strong>; na própria coorte do estudo HAPO ela ficou em 17,8%.<\/p>"}]},{"h":"Fisiopatologia: a gravidez é diabetogênica por desenho","blocos":[{"html":"<p>A gestação normal cursa com <strong>aumento progressivo da resistência periférica à insulina<\/strong>. O responsável é a placenta, que secreta hormônios contra-insulínicos — <strong>lactogênio placentário<\/strong>, <strong>hormônio do crescimento placentário<\/strong> e <strong>cortisol<\/strong> — em quantidade proporcional à sua massa. Por isso o pico de resistência ocorre entre 24 e 28 semanas, exatamente a janela em que se faz o rastreamento.<\/p>"},{"html":"<p>O pâncreas materno responde aumentando a secreção de insulina. O DMG aparece quando essa reserva não dá conta. Há ainda uma divisão temporal clássica: a <strong>primeira fase da gestação é anabólica<\/strong>, de formação de reservas maternas; a <strong>segunda é catabólica<\/strong>, com lipólise materna que poupa glicose para o feto.<\/p>"},{"html":"<h3>O que acontece do lado fetal<\/h3>"},{"html":"<p>A glicose atravessa a placenta por <strong>difusão facilitada<\/strong>; a insulina, não. O feto recebe o excesso glicêmico materno e responde com o próprio pâncreas. A cascata é toda ela derivada desse ponto:<\/p>"},{"html":"<ul><li><strong>Hiperglicemia materna → glicose por difusão facilitada → feto macrossômico.<\/strong> O excesso de substrato vira massa.<\/li><li><strong>Hiperglicemia fetal → poliúria fetal → polidrâmnio.<\/strong> A glicose funciona como diurese osmótica no rim fetal.<\/li><li><strong>Polidrâmnio → distensão uterina → rotura prematura de membranas → prematuridade.<\/strong><\/li><li><strong>Hiperglicemia fetal → pâncreas fetal produz mais insulina (hiperinsulinemia fetal) → hipoglicemia ao nascimento.<\/strong> Com o clampeamento do cordão a oferta de glicose cessa de súbito, mas a insulina em excesso persiste por horas.<\/li><li><strong>Redução da ação do surfactante pela glicose → desconforto respiratório do recém-nascido.<\/strong><\/li><li><strong>Aumento da afinidade da glicose pela hemoglobina fetal → hipoxemia fetal.<\/strong><\/li><\/ul>"},{"html":"<blockquote><p>Guarde a cadeia inteira em uma frase: <em>toda<\/em> complicação fetal do diabetes desce de um único fato — a glicose passa a placenta e a insulina não. Macrossomia, polidrâmnio, hipoglicemia neonatal e desconforto respiratório são ramos da mesma árvore.<\/p><\/blockquote>"}]},{"h":"Rastreamento e diagnóstico: os números que não podem falhar","blocos":[{"html":"<p>O rastreamento é <strong>universal<\/strong> — toda gestante, independentemente de fator de risco. Ele começa na <strong>primeira consulta de pré-natal<\/strong>, com glicemia de jejum (e hemoglobina glicada, quando disponível), e se completa com o <strong>teste oral de tolerância à glicose (TOTG) com 75 g entre 24 e 28 semanas<\/strong> para quem não fechou diagnóstico antes.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Exame<\/th><th>Momento<\/th><th>Valor<\/th><th>O que define<\/th><\/tr><\/thead><tbody><tr><td>Glicemia de jejum<\/td><td>1ª consulta (&lt; 20 sem)<\/td><td>&lt; 92 mg/dL<\/td><td>Normal — segue para TOTG 75 g com 24-28 sem<\/td><\/tr><tr><td>Glicemia de jejum<\/td><td>1ª consulta (&lt; 20 sem)<\/td><td>92 a 125 mg/dL<\/td><td><strong>Diabetes gestacional<\/strong> (dispensa o TOTG)<\/td><\/tr><tr><td>Glicemia de jejum<\/td><td>1ª consulta (&lt; 20 sem)<\/td><td>≥ 126 mg/dL<\/td><td><strong>Diabetes diagnosticado na gestação<\/strong><\/td><\/tr><tr><td>Hemoglobina glicada<\/td><td>1ª consulta<\/td><td>≥ 6,5%<\/td><td><strong>Diabetes diagnosticado na gestação<\/strong><\/td><\/tr><tr><td>Glicemia casual + sintomas<\/td><td>qualquer momento<\/td><td>≥ 200 mg/dL<\/td><td><strong>Diabetes diagnosticado na gestação<\/strong><\/td><\/tr><tr><td>TOTG 75 g — jejum<\/td><td>24 a 28 semanas<\/td><td>92 a 125 mg/dL<\/td><td><strong>Diabetes gestacional<\/strong><\/td><\/tr><tr><td>TOTG 75 g — 1ª hora<\/td><td>24 a 28 semanas<\/td><td>≥ 180 mg/dL<\/td><td><strong>Diabetes gestacional<\/strong><\/td><\/tr><tr><td>TOTG 75 g — 2ª hora<\/td><td>24 a 28 semanas<\/td><td>153 a 199 mg/dL<\/td><td><strong>Diabetes gestacional<\/strong><\/td><\/tr><tr><td>TOTG 75 g — jejum<\/td><td>24 a 28 semanas<\/td><td>≥ 126 mg/dL<\/td><td><strong>Diabetes mellitus<\/strong><\/td><\/tr><tr><td>TOTG 75 g — 2ª hora<\/td><td>24 a 28 semanas<\/td><td>≥ 200 mg/dL<\/td><td><strong>Diabetes mellitus<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p><strong>Um único valor alterado no TOTG já fecha o diagnóstico de DMG.<\/strong> A exigência de dois valores pertencia aos critérios antigos com sobrecarga de 100 g (O'Sullivan e Mahan, NDDG, Carpenter e Coustan). Confundir os dois conjuntos é o erro mais comum: <strong>95 / 180 / 155 / 140<\/strong> são Carpenter e Coustan para 100 g; <strong>92 / 180 / 153<\/strong> são os valores atuais para 75 g.<\/p><\/blockquote>"},{"html":"<p>O momento de entrada no pré-natal define o caminho:<\/p>"},{"html":"<ul><li><strong>Início antes de 20 semanas<\/strong> — glicemia de jejum imediatamente; se &lt; 92 mg/dL, TOTG de 75 g entre 24 e 28 semanas.<\/li><li><strong>Início entre 20 e 28 semanas<\/strong> — aguardar a janela de 24 a 28 semanas e fazer o TOTG.<\/li><li><strong>Início após 28 semanas<\/strong> — TOTG de 75 g <strong>imediatamente<\/strong>, sem esperar.<\/li><\/ul>"},{"html":"<p class=\"figleg\">Fluxograma de rastreamento da hiperglicemia na gestação<\/p>"},{"html":"<p>O alicerce desses cortes é o estudo <strong>HAPO<\/strong> (<em>Hyperglycemia and Adverse Pregnancy Outcome<\/em>, 2008), observacional prospectivo com cerca de 25.000 gestantes em vários países, que submeteu todas a TOTG de 75 g com dosagens de jejum, 1ª e 2ª hora. A partir dele, o <strong>IADPSG<\/strong> propôs em 2010 os valores de 92, 180 e 153 mg/dL, hoje vigentes. Antes disso, a OMS (1999-2013) usava jejum ≥ 126 mg/dL e/ou 2 horas ≥ 140 mg/dL.<\/p>"}]},{"h":"Repercussões maternas e fetais","blocos":[{"html":"<p>As causas atuais de mortalidade materna são hipertensão, hemorragia pós-parto e sepse — na era pré-insulínica eram a cetoacidose e as vasculopatias. O diabetes entra hoje pela porta da <strong>síndrome metabólica<\/strong> (obesidade, hipertensão arterial, dislipidemia e DM), que multiplica a morbimortalidade materna e fetal.<\/p>"},{"html":"<h4>Complicações fetais e neonatais<\/h4>"},{"html":"<ul><li>Óbito fetal súbito<\/li><li>Malformações congênitas<\/li><li>Feto grande para a idade gestacional (macrossomia) e <strong>distocia de ombro<\/strong><\/li><li>Polidrâmnio<\/li><li>Trabalho de parto prematuro e rotura prematura de membranas ovulares<\/li><li>Hipoglicemia neonatal<\/li><li>Desconforto respiratório do recém-nascido<\/li><li>Hipocalcemia neonatal<\/li><li>Icterícia neonatal<\/li><\/ul>"},{"html":"<p>As <strong>malformações<\/strong> têm incidência <strong>três vezes maior<\/strong> que na população geral, e o fator etiológico é o mau controle glicêmico <strong>entre 6 e 8 semanas<\/strong> — a organogênese. Isso desloca o risco para o diabetes <em>prévio<\/em>, já que o DMG costuma aparecer depois desse período, e transforma o controle pré-concepcional em prioridade. As mais características são a <strong>síndrome de regressão caudal<\/strong> (agenesia sacrococcígea, quadris pequenos, membros em posição de perna de rã), os defeitos de fechamento do tubo neural como a anencefalia, as cardiopatias como a transposição das grandes artérias e os disrafismos espinhais.<\/p>"},{"html":"<h4>A longo prazo<\/h4>"},{"html":"<p>Mãe e filho carregam a marca. A prole tem risco aumentado de <strong>obesidade, diabetes tipo 2 e doença cardiovascular<\/strong> na vida adulta — um mecanismo com forte componente <strong>epigenético<\/strong>. A mãe passa a ter risco de 50 a 60% de desenvolver DM2 em 20 anos.<\/p>"}]},{"h":"Tratamento não farmacológico: a primeira linha resolve a maioria","blocos":[{"html":"<p>A <strong>terapia nutricional<\/strong> associada a exercício é a intervenção inicial e controla <strong>80 a 90%<\/strong> dos casos de DMG. O ponto de partida é a avaliação antropométrica pelo índice de massa corporal (peso em kg dividido pela altura em metros ao quadrado), que estratifica o valor calórico prescrito.<\/p>"},{"html":"<h4>Orientações gerais da dieta<\/h4>"},{"html":"<ul><li><strong>Seis refeições por dia<\/strong>, em intervalos de cerca de 3 horas<\/li><li><strong>40 a 55%<\/strong> de carboidratos<\/li><li><strong>30 a 40%<\/strong> de lipídios<\/li><li><strong>15 a 20%<\/strong> de proteínas<\/li><li><strong>Ceia noturna com 25 g de carboidratos<\/strong> — encurta o jejum da madrugada e evita a cetose que desestabiliza a glicemia de jejum<\/li><li>Adoçantes de escolha: <strong>sucralose e aspartame<\/strong> (até 6 sachês ou 15 gotas ao dia); evitar ciclamato e sacarina<\/li><li>Preferir alimentos integrais, leguminosas e frutas com casca e bagaço; evitar sucos de fruta, líquidos às refeições, açúcar de mesa, mel e frituras<\/li><\/ul>"},{"html":"<h4>Exercício físico<\/h4>"},{"html":"<p>O exercício reduz a glicemia de jejum e a pós-prandial e <strong>diminui a necessidade de insulina<\/strong>. São recomendados caminhada, natação, hidroginástica, bicicleta estacionária, aeróbica de baixo impacto, ioga, pilates e exercícios de resistência.<\/p>"},{"html":"<p>Devem ser <strong>evitados<\/strong>: esportes de contato, atividades com risco de queda, <strong>isometria de grandes grupos musculares<\/strong> e manutenção de decúbito horizontal após o primeiro trimestre. Antes do exercício, aferir a glicemia no glicosímetro e garantir ingestão calórica e hidratação. São sinais de interrupção imediata: sangramento vaginal, dor abdominal, contrações dolorosas regulares, perda de líquido amniótico, dispneia antes do esforço, tontura, cefaleia, dor torácica, fraqueza muscular com perda de equilíbrio e dor ou edema em panturrilha.<\/p>"}]},{"h":"Metas glicêmicas e monitorização","blocos":[{"html":"<p>A glicemia capilar deve ser aferida <strong>4 a 8 vezes ao dia<\/strong>, distribuídas entre medidas pré-prandiais e pós-prandiais de 1 hora, de modo que cada refeição seja avaliada. Existe também a opção da monitorização contínua.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Situação<\/th><th>Pré-prandial<\/th><th>1 hora pós-prandial<\/th><th>2 horas pós-prandial<\/th><\/tr><\/thead><tbody><tr><td>Alvos gerais (FEBRASGO)<\/td><td>&lt; 95 mg/dL<\/td><td>&lt; 140 mg/dL<\/td><td>&lt; 120 mg/dL<\/td><\/tr><tr><td>Automonitorização (faixa)<\/td><td>70 a 95 mg/dL<\/td><td>90 a 140 mg/dL<\/td><td>—<\/td><\/tr><tr><td>Feto GIG ou polidrâmnio<\/td><td>70 a 95 mg/dL<\/td><td><strong>90 a 130 mg/dL<\/strong><\/td><td>—<\/td><\/tr><tr><td>Intraparto<\/td><td>70 a 120 mg/dL<\/td><td>70 a 120 mg/dL<\/td><td>—<\/td><\/tr><tr><td>Puerpério<\/td><td>&lt; 130 mg/dL<\/td><td>—<\/td><td>&lt; 180 mg/dL<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Metas para o controle glicêmico na gestação<\/p>"},{"html":"<blockquote><p>Repare que a meta de 2 horas (&lt; 120) é <strong>mais baixa<\/strong> que a de 1 hora (&lt; 140): a curva já deveria estar em queda. E note o piso de 70 mg/dL — o tratamento não pode trocar hiperglicemia por hipoglicemia materna. Em usuárias de insulina com hipoglicemias frequentes, os alvos podem ser individualizados.<\/p><\/blockquote>"},{"html":"<p>Feto grande para a idade gestacional ou polidrâmnio apertam o alvo pós-prandial de 1 hora para 90-130 mg/dL. Os dois achados são sinal de que a hiperinsulinemia fetal continua ativa apesar de números maternos aparentemente aceitáveis.<\/p>"}]},{"h":"Tratamento farmacológico","blocos":[{"html":"<h3>Insulina<\/h3>"},{"html":"<p>A insulina é indicada para DM1, DM2 e para o <strong>DMG que não atingiu as metas com dieta<\/strong> — nunca de rotina ao diagnóstico. A dose inicial recomendada pela Sociedade Brasileira de Diabetes é <strong>0,5 UI/kg/dia<\/strong>, válida para qualquer idade gestacional. Os <strong>ajustes<\/strong> devem ocorrer no mínimo a cada <strong>15 dias até a 30ª semana<\/strong> e <strong>semanalmente após a 30ª semana<\/strong>, porque a resistência insulínica cresce até perto do termo.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Tipo<\/th><th>Nome<\/th><th>Origem<\/th><th>Início<\/th><th>Pico<\/th><th>Duração<\/th><\/tr><\/thead><tbody><tr><td>Longa duração<\/td><td>Detemir<\/td><td>Análoga<\/td><td>1 a 3 h<\/td><td>6 a 8 h (discreto)<\/td><td>18 a 22 h<\/td><\/tr><tr><td>Intermediária<\/td><td>NPH<\/td><td>Humana<\/td><td>2 a 4 h<\/td><td>4 a 10 h<\/td><td>10 a 18 h<\/td><\/tr><tr><td>Rápida<\/td><td>Regular<\/td><td>Humana<\/td><td>0,5 a 1 h<\/td><td>2 a 3 h<\/td><td>5 a 8 h<\/td><\/tr><tr><td>Ultrarrápida<\/td><td>Asparte / Lispro<\/td><td>Análoga<\/td><td>5 a 15 min<\/td><td>0,5 a 2 h<\/td><td>3 a 5 h<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Tipos de insulina: início, pico e duração de ação<\/p>"},{"html":"<p>O esquema padrão para DMG divide a dose total de NPH em três aplicações: <strong>metade pela manhã, um quarto antes do almoço e um quarto ao deitar<\/strong> (alternativamente, regular nas refeições e NPH à noite). A dose maior matinal acompanha o pico matinal de hormônios contra-insulínicos; a dose ao deitar cobre a produção hepática de glicose da madrugada.<\/p>"},{"html":"<p>Detalhes de aplicação que valem questão:<\/p>"},{"html":"<ul><li><strong>Regular<\/strong> — aplicar entre <strong>30 e 40 minutos antes<\/strong> da refeição.<\/li><li><strong>Lispro e asparte<\/strong> — aplicar no <strong>início da refeição ou 15 minutos antes<\/strong>.<\/li><li>Ao misturar NPH e regular na mesma seringa, <strong>aspirar primeiro a regular e depois a NPH<\/strong>, e aplicar imediatamente após o preparo.<\/li><li>Toda paciente em insulina deve ser orientada sobre sinais de hipoglicemia.<\/li><\/ul>"},{"html":"<h3>Metformina<\/h3>"},{"html":"<p>A metformina é <strong>categoria B<\/strong> pelo FDA, mas a <strong>Anvisa não aprova<\/strong> seu uso para tratamento do DMG — no Brasil a prescrição é off-label. O ensaio <strong>MiG<\/strong> (<em>Metformin in Gestational Diabetes<\/em>), randomizado com 751 gestantes, não mostrou aumento de malformações congênitas, sepse neonatal, morte fetal, trauma de parto ou pré-eclâmpsia.<\/p>"},{"html":"<p>A droga tem <strong>passagem transplacentária livre<\/strong>, não é considerada teratogênica e reduz hipoglicemia neonatal grave e internação em terapia intensiva neonatal. O seguimento de longo prazo das crianças expostas não mostrou eventos adversos graves nem alterações de desenvolvimento motor, linguístico ou social, embora aos 4 e aos 9 anos tenham sido observadas maiores medidas de peso e índice de massa corporal.<\/p>"}]},{"h":"Vigilância fetal e momento do parto","blocos":[{"html":"<h3>Propedêutica fetal<\/h3>"},{"html":"<ul><li><strong>USG de 1º trimestre<\/strong> — localização, datação e vitalidade<\/li><li><strong>USG morfológico de 1º trimestre<\/strong> (11 a 13 semanas e 6 dias) — malformações, rastreio de cromossomopatias e de pré-eclâmpsia<\/li><li><strong>USG morfológico de 2º trimestre<\/strong> (20 a 24 semanas) — malformações e biometria fetal<\/li><li><strong>Ecocardiograma fetal<\/strong> — a partir de <strong>24 semanas<\/strong><\/li><li><strong>USG obstétrico com Doppler<\/strong> (24 a 28 semanas) — crescimento fetal em curvas de percentil, líquido amniótico e pesquisa de vasculopatia<\/li><li><strong>Seguimento de peso e líquido<\/strong> — individualizar a cada 2 a 4 semanas, com marcos em 28, 32 e 36 semanas<\/li><li><strong>Vitalidade<\/strong> — a partir de 32 semanas, com cardiotocografia e perfil biofísico fetal<\/li><\/ul>"},{"html":"<p>Na avaliação do líquido amniótico, o <strong>ILA normal é de 8 a 18 cm<\/strong> e o <strong>maior bolsão vertical, de 2 a 8 cm<\/strong>. Em gestação gemelar usa-se <strong>apenas<\/strong> o maior bolsão vertical.<\/p>"},{"html":"<h3>Momento do parto<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Quadro<\/th><th>Controle glicêmico<\/th><th>Tratamento<\/th><th>Parto<\/th><\/tr><\/thead><tbody><tr><td>DMG<\/td><td>Bom<\/td><td>Não farmacológico<\/td><td>39 a 40 semanas e 6 dias<\/td><\/tr><tr><td>DMG<\/td><td>Bom<\/td><td>Farmacológico<\/td><td>39 a 39 semanas e 6 dias<\/td><\/tr><tr><td>DMG<\/td><td>Ruim<\/td><td>Qualquer<\/td><td>37 a 38 semanas<\/td><\/tr><tr><td>DM prévio / na gestação<\/td><td>Bom<\/td><td>Qualquer<\/td><td>38 a 39 semanas e 6 dias<\/td><\/tr><tr><td>DM prévio / na gestação<\/td><td>Ruim<\/td><td>Qualquer<\/td><td>Considerar antes de 37 semanas<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p>A <strong>via de parto é definida por indicação obstétrica<\/strong>, não pelo diabetes. O diabetes antecipa o <em>momento<\/em>, não impõe a cesárea.<\/p><\/blockquote>"},{"html":"<h3>Controle glicêmico intraparto<\/h3>"},{"html":"<ul><li><strong>Na indução<\/strong> — manter a dieta e a dose habitual de insulina; metas de jejum &lt; 95, 1 hora pós-prandial &lt; 140 ou 2 horas pós-prandial &lt; 120 mg/dL.<\/li><li><strong>Na fase ativa<\/strong> — desjejum habitual, <strong>1/3 a 1/2 da dose<\/strong> de insulina e glicemia capilar <strong>a cada 4 horas<\/strong>; meta de 70 a 120 mg/dL.<\/li><li><strong>Na cesárea<\/strong> — jejum com <strong>soro glicosado a 5% por via intravenosa a 50 mL/h<\/strong>, 1/3 a 1/2 da dose de insulina da manhã e glicemia capilar <strong>a cada 1-2 horas no DM<\/strong> ou <strong>a cada 4 horas no DMG<\/strong>, até a primeira refeição pós-parto; meta de 70 a 120 mg/dL.<\/li><\/ul>"}]},{"h":"Puerpério: reclassificar e vigiar pelo resto da vida","blocos":[{"html":"<p>No pós-parto imediato do <strong>DMG<\/strong>, a conduta é <strong>suspender a insulina, suspender o controle glicêmico e liberar a dieta<\/strong>. No <strong>DM1<\/strong>, reduzir em 50% a dose usada antes da gestação (ou 70% da dose do final da gravidez); a sensibilidade à insulina retorna aos níveis pré-gestacionais em <strong>1 a 2 semanas<\/strong>. No <strong>DM2<\/strong>, na maioria das vezes é possível suspender a insulina e manter dieta e metformina. O alvo glicêmico no puerpério afrouxa para <strong>jejum &lt; 130 mg/dL e pós-prandial &lt; 180 mg/dL<\/strong>.<\/p>"},{"html":"<p>O <strong>aleitamento<\/strong> deve ser estimulado: ajuda no controle glicêmico materno, no DMG reduz o risco de progressão para DM2 e reduz o risco de a prole desenvolver DM2 e síndrome metabólica a longo prazo. No DM1, atenção ao risco de hipoglicemia durante as mamadas.<\/p>"},{"html":"<h3>A reclassificação<\/h3>"},{"html":"<p>Repetir o <strong>TOTG de 75 g de 6 a 12 semanas após o parto<\/strong> (na prática, cerca de 2 meses), dosando jejum e 2ª hora. A <strong>hemoglobina glicada não é recomendada<\/strong> nesse período: a renovação eritrocitária da gestação e a perda sanguínea do parto produzem <strong>redução falsa<\/strong> do resultado.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Jejum<\/th><th>2ª hora<\/th><th>Classificação<\/th><\/tr><\/thead><tbody><tr><td>&lt; 100 mg/dL<\/td><td>&lt; 140 mg/dL<\/td><td>Normal<\/td><\/tr><tr><td>100 a 125 mg/dL<\/td><td>&lt; 140 mg/dL<\/td><td>Glicemia de jejum alterada<\/td><\/tr><tr><td>&lt; 126 mg/dL<\/td><td>140 a 199 mg/dL<\/td><td>Intolerância à glicose<\/td><\/tr><tr><td>≥ 126 mg/dL<\/td><td>e/ou ≥ 200 mg/dL<\/td><td>Diabetes mellitus<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Reclassificação glicêmica da puérpera<\/p>"},{"html":"<p>Se o teste for normal, manter retestagem a cada <strong>1 a 3 anos<\/strong> com hemoglobina glicada, glicemia de jejum ou novo TOTG — seguimento mínimo de 3 anos. Se alterado, encaminhar para tratamento e acompanhamento endocrinológico.<\/p>"},{"html":"<blockquote><p>O número que define o seguimento: quem teve DMG tem <strong>risco de 50 a 60% de DM2 em 20 anos<\/strong>, cerca de <strong>10 vezes<\/strong> o de quem não teve. Modificação de estilo de vida com manutenção de peso adequado reduz em <strong>35%<\/strong> a progressão em 10 anos, e a metformina, em <strong>40%<\/strong>.<\/p><\/blockquote>"}]}]},{"slug":"diferenciacao-sexual","titulo":"Diferenciação Sexual e Malformações Uterinas","disciplina":"GO","eyebrow":"Ginecologia · Embriologia e Malformações","questoes":[{"id":"fb5e94cc07","q":"Na determinação gonadal humana, em que semana de gestação a gônada bipotencial se diferencia em testículo e em que semana ela se diferencia em ovário?","opts":["Testículo na 6ª semana; ovário na 8ª semana","Testículo na 8ª semana; ovário na 6ª semana","Testículo na 4ª semana; ovário na 6ª semana","Testículo na 10ª semana; ovário na 12ª semana"],"c":0,"exp":"A determinação gonadal é o conjunto de eventos iniciais que forma a gônada: o testículo aparece na 6ª semana e o ovário só na 8ª semana de gestação. A via testicular é, portanto, mais precoce, comandada por SRY e SOX9 sobre a gônada bipotencial. A diferenciação sexual propriamente dita, que define o fenótipo, completa-se por volta da 12ª semana.","ref":[1,1]},{"id":"e3a2d81a87","q":"Qual célula fetal secreta o hormônio antimülleriano (AMH/MIS) entre a 7ª e a 8ª semana, provocando a regressão apoptótica irreversível dos ductos de Müller?","opts":["Célula de Sertoli testicular","Célula de Leydig testicular","Célula da granulosa ovariana","Célula da teca ovariana"],"c":0,"exp":"O AMH é produzido pelas células de Sertoli fetais, sob controle de SOX9 e SF1, entre a 7ª e a 8ª semana. Sua ação sobre o receptor AMH-R causa regressão apoptótica irreversível dos ductos paramesonéfricos no feto masculino. As células de Leydig produzem testosterona, e não AMH.","ref":[2,2]},{"id":"805fa1c7fe","q":"A manutenção e a diferenciação dos ductos de Wolff no feto masculino dependem diretamente de qual hormônio e de que modo ele age?","opts":["Testosterona das células de Leydig, com ação ipsilateral","Testosterona das células de Sertoli, com ação sistêmica","Di-hidrotestosterona das suprarrenais, com ação difusa","Hormônio antimülleriano de Sertoli, com ação ipsilateral"],"c":0,"exp":"Os ductos mesonéfricos são hormônio-dependentes: precisam da testosterona secretada pelas células de Leydig fetais, que age de forma ipsilateral e parácrina sobre o receptor androgênico. Por isso, se um testículo falha, o ducto de Wolff daquele lado regride. O AMH, também testicular, faz o oposto: elimina os ductos de Müller.","ref":[2,4]},{"id":"87a60f2da5","q":"A masculinização da genitália externa bipotencial (tubérculo genital, dobras urogenitais e intumescimentos labioescrotais) depende de qual mediador?","opts":["DHT, gerada pela 5α-redutase tipo 2","AMH, gerado pelas células de Sertoli","Estradiol, gerado pela aromatase gonadal","Inibina, gerada pelas células da teca"],"c":0,"exp":"A genitália externa masculiniza-se sob ação da di-hidrotestosterona, potencializada localmente pela conversão da testosterona pela 5α-redutase tipo 2. Essa é a razão pela qual a deficiência dessa enzima cursa com genitália interna masculina (dependente de testosterona) e genitália externa feminina ou ambígua. O AMH atua apenas sobre os ductos de Müller.","ref":[2,6]},{"id":"1208da5651","q":"Quais estruturas femininas derivam dos ductos paramesonéfricos (de Müller)?","opts":["Tubas uterinas, útero, cérvix e vagina superior","Ovários, tubas uterinas e terço inferior da vagina","Útero, grandes lábios e terço inferior da vagina","Cérvix, clitóris e pequenos lábios da vulva"],"c":0,"exp":"Os ductos de Müller originam as tubas uterinas, o corpo do útero, a cérvix e os dois terços superiores da vagina. O terço inferior da vagina não é mülleriano: vem do seio urogenital, pela placa vaginal. Os ovários derivam da gônada indiferenciada, e não dos ductos.","cap":"Matriz de homologia: origem embrionária e derivados masculinos e femininos","ref":[3,0]},{"id":"f609ec16c6","q":"Quais estruturas masculinas derivam dos ductos mesonéfricos (de Wolff)?","opts":["Epidídimo, ducto deferente e vesícula seminal","Próstata, uretra peniana e glande do pênis","Escroto, próstata e apêndice testicular","Testículo, escroto e uretra esponjosa"],"c":0,"exp":"Os derivados wolffianos são o epidídimo, o ducto deferente, as vesículas seminais e os ductos ejaculatórios. A próstata e o terço inferior da uretra vêm do seio urogenital; escroto, glande e uretra peniana vêm da genitália externa bipotencial sob ação da DHT. O apêndice testicular é vestígio mülleriano, não wolffiano.","ref":[3,0]},{"id":"f88e8094c0","q":"Na ausência de testosterona, os ductos de Wolff sofrem regressão fisiológica no feto feminino, mas podem deixar vestígios. Quais são esses vestígios?","opts":["Ducto de Gartner e cistos epoóforos","Ducto de Gartner e cistos de Naboth","Cistos de Bartholin e hidátide de Morgagni","Cistos epoóforos e hidátide de Morgagni"],"c":0,"exp":"Sem testosterona, os ductos mesonéfricos regridem, restando o ducto de Gartner (na parede vaginal lateral) e os cistos epoóforos (no mesossalpinge). Cistos de Naboth são de retenção glandular cervical e não têm origem wolffiana. A hidátide de Morgagni é vestígio da extremidade cranial mülleriana.","ref":[3,0]},{"id":"f7b2c71f1e","q":"Qual é a origem embriológica do terço inferior da vagina?","opts":["Seio urogenital, pela placa vaginal","Ductos de Müller, pela fusão caudal","Ductos de Wolff, pela fusão medial","Cloaca posterior, pela membrana anal"],"c":0,"exp":"A vagina tem dupla origem: os dois terços superiores vêm do ducto uterovaginal mülleriano e o terço inferior deriva do seio urogenital, pela placa vaginal. Essa dupla origem explica por que o septo vaginal transverso se localiza tipicamente na junção entre os dois territórios. É também a razão de a MRKH poder cursar com vagina distal curta em fundo cego.","ref":[3,1]},{"id":"6aaee1eedb","q":"Na diferenciação da genitália externa, o tubérculo genital e as tumefações labioescrotais originam, no sexo feminino, respectivamente:","opts":["Glande do clitóris e lábios maiores","Lábios menores e glande do clitóris","Lábios maiores e lábios menores","Glande do clitóris e lábios menores"],"c":0,"exp":"O tubérculo genital origina a glande do clitóris (homóloga da glande peniana) e as tumefações labioescrotais originam os lábios maiores (homólogos do escroto). As pregas urogenitais, que no homem fecham a uretra esponjosa, permanecem abertas na mulher e formam os lábios menores. Toda a diferenciação externa ocorre entre a 6ª e a 12ª semana.","cap":"Genitália externa: estágio indiferenciado na 6ª semana e destinos na 12ª semana","ref":[3,4]},{"id":"27c00212b3","q":"Pegadinha clássica de prova: o desenvolvimento dos ductos de Müller no feto feminino depende de qual estímulo hormonal?","opts":["De nenhum: ocorre passivamente sem AMH","Do estradiol ovariano fetal em alta dose","Da testosterona ovariana em baixa dose","Do AMH secretado pela granulosa fetal"],"c":0,"exp":"Os ductos paramesonéfricos têm desenvolvimento autônomo: na ausência de AMH eles se desenvolvem passivamente, sem precisar de estímulo hormonal ovariano. Por isso um feto com gônada ausente ou disgenética ainda assim forma útero e tubas. Quem é hormônio-dependente é o ducto de Wolff, que exige testosterona para não regredir.","ref":[2,7]},{"id":"8ded775391","q":"Na etapa indiferenciada do embrião, coexistem em ambos os sexos:","opts":["Dois pares de ductos: mesonéfricos e paramesonéfricos","Apenas o par de ductos paramesonéfricos, de Müller","Apenas o par de ductos mesonéfricos, de Wolff","Um par de ductos e a gônada já diferenciada"],"c":0,"exp":"Na fase inicial existem dois pares paralelos de ductos genitais em todo embrião: o mesonéfrico (de Wolff) e o paramesonéfrico (de Müller), ao lado da gônada ainda bipotencial. A extremidade cefálica do ducto de Müller abre-se na cavidade celômica e as extremidades caudais fundem-se no ducto uterovaginal. O destino de cada par depende inteiramente da regulação hormonal subsequente.","cap":"Etapa indiferenciada e os dois destinos: masculino e feminino","ref":[0,3]},{"id":"688c19556e","q":"Na organogênese do trato genital feminino, a porção cranial não fundida dos ductos paramesonéfricos origina qual estrutura?","opts":["As tubas uterinas, que permanecem abertas em funil","O corpo uterino, formado pela fusão na linha média","A cérvix uterina, derivada do ducto uterovaginal","A vagina inferior, derivada do seio urogenital"],"c":0,"exp":"A parte superior dos ductos paramesonéfricos não se funde e permanece aberta em forma de funil, transformando-se nas tubas uterinas. A fusão ocorre na porção caudal e progride no sentido cranial, formando o ducto uterovaginal, do qual derivam o útero e a vagina superior. A porção mais distal da vagina provém do seio urogenital.","cap":"Organogênese: porção cranial, porção caudal e contribuição do seio urogenital","ref":[4,2]},{"id":"5b9eae4db6","q":"Durante a descida ovariana entre a 7ª e a 12ª semana, em que se transformam as porções cranial e caudal do gubernáculo?","opts":["Ligamento ovariano e ligamento redondo do útero","Ligamento redondo do útero e ligamento ovariano","Ligamento largo e ligamento infundibulopélvico","Ligamento uterossacro e ligamento cardinal"],"c":0,"exp":"O gubernáculo é o cordão de fixação que traciona o ovário da parede abdominal dorsal até a pelve. Sua porção cranial torna-se o ligamento ovariano (útero-ovárico) e a porção caudal torna-se o ligamento redondo, que atravessa o canal inguinal até os grandes lábios. Esse trajeto explica por que endometriose e hérnias podem se manifestar no canal inguinal feminino.","cap":"Diferenciação externa e descida ovariana: o papel do gubernáculo","ref":[3,7]},{"id":"77c8a1c5d2","q":"Sobre a fisiogênese uterina, qual é a sequência correta das três fases e seus respectivos períodos gestacionais?","opts":["Organogênese 6–9 sem., fusão medial 9–12 sem., reabsorção septal 12–20 sem.","Fusão medial 6–9 sem., organogênese 9–12 sem., reabsorção septal 12–20 sem.","Organogênese 4–6 sem., reabsorção septal 6–9 sem., fusão medial 9–12 sem.","Reabsorção septal 6–9 sem., organogênese 9–12 sem., fusão medial 12–20 sem."],"c":0,"exp":"A organogênese (6ª a 9ª semana) forma bilateralmente os ductos paramesonéfricos com progressão craniocaudal paralela ao sistema urinário; a fusão medial (9ª a 12ª semana) une os segmentos distais e médios no primórdio uterovaginal; a reabsorção septal (12ª a 20ª semana) desfaz o septo central. O bloqueio de cada fase gera um padrão distinto de anomalia. Essa cronologia é a espinha dorsal de toda a classificação.","ref":[4,1]},{"id":"af09ad7e68","q":"A reabsorção do septo fibromuscular central que separa as duas cavidades fundidas do primórdio uterovaginal ocorre em qual sentido?","opts":["De caudal para cranial","De cranial para caudal","De medial para lateral","De lateral para medial"],"c":0,"exp":"A reabsorção septal ocorre gradualmente de caudal para cranial, entre a 12ª e a 20ª semana. Como começa embaixo, a interrupção precoce deixa um septo que se estende até a cérvix (septado completo), e a interrupção tardia deixa apenas um septo fúndico (septado incompleto). O sentido caudocranial é o inverso do sentido da organogênese, que é craniocaudal.","ref":[4,1]},{"id":"98544fa757","q":"Uma falha da fusão medial dos ductos de Müller resulta em qual grupo de anomalias uterinas?","opts":["Útero didelfo e útero bicorno","Útero septado e útero arqueado","Útero unicorno e hemiútero","Agenesia uterina e hipoplasia"],"c":0,"exp":"A falha de fusão medial, total ou parcial, produz o útero didelfo e o útero bicorno, agrupados como classe U3 (bicorporeal) na ESHRE/ESGE. O útero septado vem de falha de reabsorção do septo (U2) e a agenesia, de falha de organogênese inicial (U5). Reconhecer o mecanismo embriológico é o atalho para acertar a classificação.","cap":"Classificação ASRM (MAC2021) versus ESHRE/ESGE por mecanismo embriológico","ref":[5,1]},{"id":"6dc5661888","q":"Qual anomalia decorre da falha de reabsorção do septo e como ela é classificada pela ESHRE/ESGE?","opts":["Útero septado — classe U2","Útero bicorno — classe U3","Hemiútero — classe U4","Útero aplásico — classe U5"],"c":0,"exp":"O útero septado, incompleto ou completo, resulta da falha de reabsorção do septo fibromuscular e corresponde à classe U2 da ESHRE/ESGE. O contorno fúndico externo é normal, o que o diferencia do bicorno (U3), no qual há entalhe externo por falha de fusão. Essa distinção é decisiva porque só o septado se beneficia de metroplastia histeroscópica.","ref":[5,1]},{"id":"d1a5f107c8","q":"A agenesia/hipoplasia mülleriana (síndrome de MRKH) corresponde a que classe da ESHRE/ESGE e a qual falha embriológica?","opts":["Classe U5, por falha de organogênese inicial","Classe U4, por falha de fusão medial parcial","Classe U3, por falha de reabsorção do septo","Classe U2, por falha de desenvolvimento unilateral"],"c":0,"exp":"A agenesia mülleriana é classificada como U5 (aplastic) pela ESHRE/ESGE e como agenesia mülleriana (MRKH) pelo critério ASRM MAC2021. O mecanismo é a falha da organogênese inicial, ou seja, os ductos paramesonéfricos sequer se formam adequadamente entre a 6ª e a 9ª semana. As demais classes correspondem a falhas em etapas posteriores.","ref":[5,1]},{"id":"260f6ff55f","q":"O útero unicorno, com ou sem corno rudimentar, resulta de qual mecanismo embriológico e recebe qual classe na ESHRE/ESGE?","opts":["Falha de desenvolvimento unilateral — U4","Falha de fusão medial completa — U3","Falha de reabsorção do septo — U2","Falha de organogênese inicial — U5"],"c":0,"exp":"O útero unicorno decorre da falha de desenvolvimento de um dos ductos de Müller e é a classe U4 (hemi-uterus) da ESHRE/ESGE. Como a progressão dos ductos é paralela ao sistema urinário, é a anomalia com maior associação a agenesia renal ipsilateral. O corno rudimentar não comunicante e funcionante pode causar dismenorreia intensa e gestação ectópica cornual.","ref":[5,1]},{"id":"d46232b0d4","q":"Qual é a malformação uterina congênita mais frequente?","opts":["Útero septado, com cerca de 35%","Útero bicorno, com cerca de 25%","Útero arqueado, com cerca de 18%","Útero didelfo, com cerca de 11%"],"c":0,"exp":"O útero septado responde por cerca de 35% dos casos, seguido do bicorno (25%), do arqueado (18%), do didelfo (11%) e do grupo agenesia/unicorno (11%). Ou seja, a anomalia mais comum é justamente a de melhor resposta cirúrgica. Os dados seguem a revisão de Chan e colaboradores (Hum Reprod Update, 2011).","cap":"Prevalência relativa das malformações uterinas congênitas","ref":[5,4]},{"id":"10a243e3a5","q":"Qual malformação uterina apresenta o maior índice de perda gestacional recorrente e qual tratamento restaura os desfechos obstétricos?","opts":["Útero septado — metroplastia histeroscópica","Útero bicorno — metroplastia de Strassman","Útero didelfo — ressecção do septo vaginal","Útero unicorno — cerclagem cervical eletiva"],"c":0,"exp":"O útero septado tem o maior índice de perda gestacional recorrente, com abortamentos de primeiro e de segundo trimestres, porque o septo é fibromuscular e mal vascularizado para a implantação. A ressecção histeroscópica do septo restaura os desfechos obstétricos. Nas demais anomalias, a conduta é habitualmente expectante e o benefício cirúrgico não é comparável.","ref":[5,5]},{"id":"2a4c67edff","q":"Sobre a síndrome de MRKH, qual afirmativa está correta quanto ao cariótipo e à sua posição como causa de amenorreia?","opts":["46,XX e segunda causa de amenorreia primária","46,XY e segunda causa de amenorreia primária","46,XX e primeira causa de amenorreia primária","45,X0 e primeira causa de amenorreia primária"],"c":0,"exp":"A MRKH é uma agenesia mülleriana em paciente 46,XX e representa a segunda causa mais comum de amenorreia primária, atrás da disgenesia gonadal. Como os ovários são funcionantes, os caracteres sexuais secundários desenvolvem-se normalmente, com telarca e pubarca preservadas. O eixo hormonal é normal: falta apenas o efetor uterovaginal.","ref":[6,1]},{"id":"750e29e48b","q":"O fenótipo tipo 2 da síndrome de MRKH (associação MURCS) inclui anomalias de quais sistemas?","opts":["Renais, cervicotorácicas e cardíacas","Renais, hepáticas e pulmonares","Cardíacas, oculares e auditivas","Cervicotorácicas, ósseas e hepáticas"],"c":0,"exp":"O tipo 1 é a agenesia uterovaginal isolada; o tipo 2, também chamado MURCS, associa anomalias renais, cervicotorácicas (displasia tipo Klippel-Feil) e cardíacas. A investigação da MRKH exige, portanto, ultrassom de vias urinárias e avaliação de coluna cervical. A vizinhança embriológica entre crista urogenital e somitos cervicais explica a associação.","ref":[6,2]},{"id":"aa4506d744","q":"Qual é a primeira linha de manejo para a criação de neovagina na síndrome de MRKH?","opts":["Dilatação não cirúrgica de Frank","Neovaginoplastia cirúrgica de McIndoe","Tração laparoscópica de Vecchietti","Colpoplastia com alça sigmoide"],"c":0,"exp":"A primeira linha é a neovagina não cirúrgica pelo método de dilatação de Frank, com dilatadores progressivos aplicados pela própria paciente. As técnicas cirúrgicas (McIndoe, Vecchietti, colpoplastia intestinal) ficam reservadas às falhas da dilatação, por acrescentarem morbidade. A adesão e o suporte psicológico são determinantes do sucesso.","ref":[6,3]},{"id":"d3a160999b","q":"Qual método é considerado padrão-ouro para o diagnóstico das malformações uterinas e qual é a sua principal vantagem?","opts":["Ultrassom 3D: avalia contorno externo e cavidade","Histerossalpingografia: avalia só a cavidade","Tomografia pélvica: avalia o contorno externo","Histeroscopia: avalia a cavidade e o miométrio"],"c":0,"exp":"O ultrassom tridimensional é o padrão-ouro porque permite avaliar simultaneamente o contorno miometrial externo e a cavidade endometrial no plano coronal, com sensibilidade superior a 98% e sem invasividade. É exatamente essa visão coronal que separa o septado do bicorno. A histerossalpingografia mostra apenas o molde da cavidade e não distingue as duas entidades.","ref":[7,0]},{"id":"10cc0d2186","q":"Em quais situações a ressonância magnética está particularmente indicada na investigação das anomalias müllerianas?","opts":["Anomalias complexas, agenesia e obstruções vaginais","Rastreio inicial de toda paciente com infertilidade","Confirmação de rotina do útero arqueado assintomático","Avaliação de sangramento uterino anormal na menacme"],"c":0,"exp":"A ressonância é indicada nas anomalias complexas, na suspeita de agenesia e nas obstruções vaginais, caracterizando com precisão o contorno fúndico e a associação com malformações renais. Ela não é exame de rastreio: o método inicial é o ultrassom, incluindo o de vias urinárias. Histeroscopia e laparoscopia ficam para a dúvida residual ou para o tratamento cirúrgico definitivo.","ref":[7,0]},{"id":"711b6472f1","q":"Paciente de 15 anos com amenorreia primária, dor pélvica cíclica e massa palpável em abdome inferior. Qual a hipótese principal e a conduta inicial?","opts":["Hímen imperfurado com hematocolpo; exame físico e USG pélvico","Síndrome de MRKH com agenesia vaginal; cariótipo e USG pélvico","Síndrome dos ovários policísticos; dosagens hormonais e USG pélvico","Insensibilidade androgênica completa; cariótipo e testosterona sérica"],"c":0,"exp":"A tríade amenorreia primária, dor pélvica cíclica e massa hipogástrica indica obstrução ao fluxo menstrual com hematocolpo, por hímen imperfurado ou septo vaginal transverso obstrutivo. A dor é cíclica justamente porque o endométrio é funcionante e o sangue não escoa. A conduta inicial é o exame físico pélvico, que já pode mostrar a membrana abaulada e azulada, complementado por ultrassom pélvico.","ref":[6,5]},{"id":"de3d715acf","q":"Adolescente 46,XY com genitália externa feminina, amenorreia primária, testículos inguinais e testosterona sérica normal ou elevada. Qual o diagnóstico mais provável?","opts":["Insensibilidade completa aos andrógenos","Deficiência da 5α-redutase tipo 2","Disgenesia gonadal completa 46,XY","Hiperplasia adrenal congênita clássica"],"c":0,"exp":"A síndrome de insensibilidade androgênica é a causa mais comum de DDS 46,XY: há defeito de ação da testosterona no receptor androgênico, com testosterona normal ou alta e LH elevado. Como o AMH das células de Sertoli é normal, os derivados müllerianos estão ausentes e a vagina termina em fundo cego. Na deficiência de 5α-redutase há virilização importante na puberdade, o que não ocorre na forma completa da insensibilidade.","ref":[8,5]},{"id":"20987ace73","q":"Qual é a causa mais frequente de ambiguidade genital e qual a sua participação entre os casos de hiperplasia adrenal congênita?","opts":["Deficiência
