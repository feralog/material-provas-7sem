, com queda documentada e sem nova exposição, é a <strong>cicatriz sorológica<\/strong> e não exige novo tratamento.<\/p>"},{"html":"<h4>Reação de Jarisch-Herxheimer<\/h4>"},{"html":"<p>Nas primeiras 24 horas após a primeira dose, a destruição maciça de treponemas pode causar febre, calafrios, mialgia, cefaleia e piora transitória das lesões — mais comum na sífilis secundária. É autolimitada e se trata com sintomáticos. <strong>Não é alergia<\/strong> e não justifica suspender a penicilina.<\/p>"},{"html":"<p>As parcerias sexuais são avaliadas, testadas e tratadas, e a sífilis adquirida, a sífilis na gestante e a congênita são de notificação compulsória.<\/p>"}]},{"h":"Herpes genital","blocos":[{"html":"<p>O herpes-vírus simples tipo 2 é o agente mais comum na região genital; o tipo 1 predomina na região orolabial, mas também causa herpes genital. Depois da primoinfecção, o vírus fica <strong>latente em gânglios sensitivos<\/strong> e pode reativar — por isso a doença é recorrente.<\/p>"},{"html":"<h4>Quadro clínico<\/h4>"},{"html":"<ul><li>Incubação de 2 a 26 dias; a primoinfecção pode ser assintomática ou inespecífica.<\/li><li><strong>Pródromos<\/strong> antes das lesões: sensibilidade local, formigamento, ardor, prurido, mialgia.<\/li><li><strong>Pápulas eritematosas<\/strong> de 2 a 3 mm que viram <strong>vesículas agrupadas<\/strong> de conteúdo citrino sobre base eritematosa, e se rompem rapidamente.<\/li><li><strong>Úlceras rasas, dolorosas, confluentes<\/strong>, de bordas planas ou discretamente elevadas e tamanhos variados, podendo ser bilaterais; coalescência e infecção secundária são possíveis.<\/li><li>Localização em grandes e pequenos lábios, clitóris, fúrcula e <strong>colo uterino<\/strong> — a cervicite herpética cursa com leucorreia aquosa.<\/li><li><strong>Adenopatia inguinal dolorosa e bilateral<\/strong> em cerca de metade dos casos.<\/li><li>Na primoinfecção, sintomas sistêmicos: febre, mal-estar, cefaleia, disúria; o episódio dura em média três semanas. As recorrências são mais curtas e brandas.<\/li><\/ul>"},{"html":"<p class=\"figleg\">Vesículas agrupadas sobre base eritematosa<\/p>"},{"html":"<h4>Diagnóstico<\/h4>"},{"html":"<p>É <strong>clínico<\/strong> na maioria das vezes. Para confirmar, usa-se <strong>PCR para HSV-1/HSV-2<\/strong> ou cultura celular de material colhido na fase de vesícula ou de úlcera. A <strong>sorologia IgG/IgM<\/strong> só se torna útil após cerca de 14 dias da primoinfecção.<\/p>"},{"html":"<h4>Tratamento com aciclovir<\/h4>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Situação<\/th><th>Esquema<\/th><\/tr><\/thead><tbody><tr><td>Primeiro episódio<\/td><td>Aciclovir 400 mg VO de 8/8 h por <strong>7 a 10 dias<\/strong><\/td><\/tr><tr><td>Recidiva<\/td><td>Aciclovir 400 mg VO de 8/8 h por <strong>5 dias<\/strong>, idealmente iniciado no pródromo<\/td><\/tr><tr><td>Supressão (6 ou mais episódios por ano)<\/td><td>Aciclovir 400 mg VO de 12/12 h por até 6 meses, podendo chegar a 2 anos<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>O aciclovir oral é <strong>seguro na gestação<\/strong> e é a conduta na gestante com primoinfecção: alivia os sintomas, encurta as lesões e reduz o risco de transmissão vertical. A transmissão ao recém-nascido ocorre sobretudo no canal de parto, e o risco é muito maior na primoinfecção perto do termo do que na recorrência. <strong>Lesão ativa ou pródromo no início do trabalho de parto indica cesariana<\/strong>, e quem tem recorrências recebe aciclovir supressivo a partir de 36 semanas.<\/p>"}]},{"h":"Cancro mole (cancroide)","blocos":[{"html":"<p>Causado por <em>Haemophilus ducreyi<\/em>, um <strong>cocobacilo Gram-negativo<\/strong>, o cancro mole é o oposto da sífilis em quase tudo: dói, é múltiplo, tem fundo sujo e o linfonodo supura.<\/p>"},{"html":"<ul><li><strong>Incubação curta<\/strong>, em geral de 3 a 5 dias (até cerca de duas semanas).<\/li><li>Começa como lesão eritematopapulosa que vira pústula e ulcera.<\/li><li><strong>Úlceras múltiplas e dolorosas<\/strong>, de 3 a 50 mm, com <strong>bordas irregulares<\/strong>, avermelhadas e edemaciadas.<\/li><li><strong>Fundo necrótico ou purulento<\/strong>, amarelo-esverdeado, <strong>odor fétido<\/strong>, friável, com sangramento fácil.<\/li><li><strong>Altamente contagioso<\/strong>: a autoinoculação produz lesões em <strong>espelho<\/strong> (em \"beijo\"), em faces que se tocam.<\/li><li><strong>Bubão inguinal<\/strong> doloroso, geralmente unilateral, em cerca de 30 a 50% dos casos, que liquefaz e <strong>fistuliza por orifício único<\/strong>.<\/li><\/ul>"},{"html":"<p class=\"figleg\">Cancro mole: úlceras múltiplas, confluentes e dolorosas<\/p>"},{"html":"<h4>Diagnóstico<\/h4>"},{"html":"<p>O exame direto do material do fundo da úlcera ou do bubão, corado por <strong>Gram<\/strong> (ou Giemsa), mostra cocobacilos Gram-negativos em <strong>cadeias paralelas<\/strong> — o \"cardume de peixes\", \"trilho de trem\" ou \"paliçada\". A cultura em meio específico tem sensibilidade inferior a 80%. Sífilis e cancro mole podem coexistir na mesma lesão, o que justifica tratar os dois na abordagem sindrômica.<\/p>"},{"html":"<h4>Tratamento<\/h4>"},{"html":"<ul><li><strong>1ª opção:<\/strong> azitromicina 1 g VO em dose única (dois comprimidos de 500 mg).<\/li><li><strong>Alternativa:<\/strong> ceftriaxona 250 mg IM em dose única.<\/li><li>Ciprofloxacino 500 mg VO de 12/12 h por 3 dias também é eficaz, mas é contraindicado na gestação e na lactação.<\/li><\/ul>"},{"html":"<blockquote><p><strong>Para não confundir:<\/strong> fistulização por <strong>um<\/strong> orifício é cancro mole; por <strong>vários<\/strong>, linfogranuloma venéreo.<\/p><\/blockquote>"}]},{"h":"Linfogranuloma venéreo","blocos":[{"html":"<p>Causado pelos <strong>sorovares L1, L2 e L3 de <em>Chlamydia trachomatis<\/strong><\/em>, o LGV é uma doença do <strong>linfonodo<\/strong> mais que da pele. A incubação vai de 4 a 30 dias (média de 7), e a evolução tem fases bem marcadas.<\/p>"},{"html":"<h4>Fase primária — a lesão que ninguém vê<\/h4>"},{"html":"<p>Pápula, pústula ou erosão pequena e <strong>indolor<\/strong> no local de inoculação, que <strong>cicatriza rapidamente<\/strong> e quase sempre passa despercebida. Por isso a paciente costuma relatar apenas \"uma feridinha que sumiu\".<\/p>"},{"html":"<h4>Fase secundária — o bubão<\/h4>"},{"html":"<p>Dias a semanas depois, há intensa repercussão linfática regional: linfonodos inguinais <strong>firmes e dolorosos<\/strong>, que aderem à pele eritematoedematosa, flutuam e se rompem, <strong>fistulizando por múltiplos orifícios<\/strong> — o aspecto em \"bico de regador\". Pode haver febre, mal-estar e artralgia. Na mulher, a drenagem linfática da vagina e do colo segue para linfonodos ilíacos e perirretais, o que explica proctite e quadros menos evidentes na virilha.<\/p>"},{"html":"<h4>Fase tardia — as sequelas<\/h4>"},{"html":"<p>Sem tratamento, a obstrução e a fibrose linfática levam a elefantíase genital (estiomene), fístulas e <strong>estenose retal<\/strong>.<\/p>"},{"html":"<h4>Diagnóstico e tratamento<\/h4>"},{"html":"<p>O diagnóstico é feito por <strong>PCR para <em>C. trachomatis<\/strong><\/em> em swab genital ou aspirado de linfonodo, ou por sorologia (fixação de complemento, imunofluorescência).<\/p>"},{"html":"<ul><li><strong>1ª opção:<\/strong> doxiciclina 100 mg VO de 12/12 h por <strong>21 dias<\/strong>.<\/li><li><strong>Alternativa<\/strong> (preferencial na gestante): azitromicina 1 g VO uma vez por semana por 3 semanas.<\/li><li>Bubão flutuante: <strong>punção aspirativa com agulha de grosso calibre<\/strong>. Incisão e drenagem cirúrgica são contraindicadas, porque perpetuam a fistulização.<\/li><\/ul>"}]},{"h":"Donovanose (granuloma inguinal)","blocos":[{"html":"<p>Doença <strong>rara<\/strong>, crônica e progressiva, causada por <em>Klebsiella granulomatis<\/em>, com predileção por dobras e região perianal. A incubação é longa e variável — de dias a quase um ano, com média em torno de 50 dias.<\/p>"},{"html":"<ul><li>Começa como <strong>pápula ou nódulo subcutâneo indolor<\/strong> que cresce, necrosa e ulcera.<\/li><li>A úlcera é <strong>caracteristicamente indolor<\/strong>, serpiginosa, de <strong>bordas planas ou hipertróficas<\/strong> bem delimitadas.<\/li><li><strong>Fundo granulomatoso vermelho-vivo<\/strong>, que <strong>sangra com muita facilidade<\/strong>.<\/li><li>Na evolução tardia, lesões <strong>vegetantes ou ulcerovegetantes<\/strong>, com lesões satélites que confluem por autoinoculação, inclusive em \"espelho\", podendo atingir grandes áreas; progressão lenta, ao longo de até um ano.<\/li><li><strong>Ausência de adenite verdadeira<\/strong>: o aumento de volume inguinal são <strong>pseudobubões<\/strong>, granulações subcutâneas por obstrução linfática.<\/li><\/ul>"},{"html":"<p class=\"figleg\">Donovanose: lesões ulcerovegetantes de fundo vermelho-vivo<\/p>"},{"html":"<h4>Diagnóstico<\/h4>"},{"html":"<p><strong>Citodiagnóstico<\/strong> ou histopatologia: visualização dos <strong>corpúsculos de Donovan no interior de macrófagos<\/strong>, em material raspado ou biopsiado das áreas de granulação ativa, corado por Giemsa, Wright ou Leishman. A biópsia também afasta neoplasia, diferencial obrigatório de úlcera crônica.<\/p>"},{"html":"<h4>Tratamento<\/h4>"},{"html":"<ul><li><strong>1ª opção:<\/strong> azitromicina 1 g VO uma vez por semana, por <strong>no mínimo 3 semanas ou até a cicatrização completa<\/strong>.<\/li><li><strong>Alternativa:<\/strong> doxiciclina 100 mg VO de 12/12 h por pelo menos 21 dias ou até a cicatrização.<\/li><\/ul>"},{"html":"<blockquote><p><strong>O critério de término é clínico:<\/strong> trata-se até a lesão fechar, não por um número fixo de doses.<\/p><\/blockquote>"}]},{"h":"Abordagem sindrômica e resumo do tratamento","blocos":[{"html":"<p>Quando não há como confirmar o agente na hora, o Ministério da Saúde orienta tratar pela síndrome. O fluxograma da úlcera genital segue esta lógica:<\/p>"},{"html":"<ol><li><strong>Confirmar a úlcera<\/strong> por anamnese e exame físico e oferecer testes rápidos de HIV, sífilis e hepatites B e C; colher material para diagnóstico etiológico quando houver laboratório.<\/li><li><strong>Há história ou evidência de vesículas?<\/strong><\/li><ul><li>Sim — tratar <strong>herpes genital<\/strong>.<\/li><li>Não — tratar <strong>sífilis e cancro mole ao mesmo tempo<\/strong>: penicilina benzatina 2,4 milhões UI IM mais azitromicina 1 g VO.<\/li><\/ul><li><strong>Lesão com 4 semanas ou mais, ou sem resposta ao tratamento<\/strong> — <strong>biópsia<\/strong> e <strong>tratamento para donovanose<\/strong>, ampliando o diferencial para LGV e neoplasia.<\/li><li>Em todos os casos: tratar as parcerias, orientar preservativo, notificar quando indicado e agendar retorno.<\/li><\/ol>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Doença<\/th><th>1ª escolha<\/th><th>Alternativa / observação<\/th><\/tr><\/thead><tbody><tr><td>Sífilis recente<\/td><td>Penicilina G benzatina 2,4 milhões UI IM, dose única<\/td><td>Tardia ou ignorada: 2,4 milhões UI semanal × 3<\/td><\/tr><tr><td>Herpes — 1º episódio<\/td><td>Aciclovir 400 mg VO 8/8 h por 7 a 10 dias<\/td><td>Recidiva: 5 dias; supressão: 400 mg 12/12 h<\/td><\/tr><tr><td>Cancro mole<\/td><td>Azitromicina 1 g VO, dose única<\/td><td>Ceftriaxona 250 mg IM, dose única<\/td><\/tr><tr><td>Linfogranuloma venéreo<\/td><td>Doxiciclina 100 mg VO 12/12 h por 21 dias<\/td><td>Azitromicina 1 g VO semanal × 3 (gestante)<\/td><\/tr><tr><td>Donovanose<\/td><td>Azitromicina 1 g VO semanal, ≥ 3 semanas e até cicatrizar<\/td><td>Doxiciclina 100 mg 12/12 h ≥ 21 dias<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p><strong>Mensagem final:<\/strong> o diagnóstico de úlcera genital se faz olhando a lesão <strong>e a virilha<\/strong>. Dor e vesícula apontam herpes; dor e pus, cancro mole; úlcera limpa e indolor, sífilis; úlcera vermelha que sangra e não dói, donovanose; bubão com vários orifícios, linfogranuloma venéreo.<\/p><\/blockquote>"}]}]},{"slug":"violencia-sexual","titulo":"Violência Sexual","disciplina":"GO","eyebrow":"Ginecologia e Obstetrícia · Referência","questoes":[{"id":"a5feb6e1d8","q":"Mulher de 24 anos chega ao pronto-socorro 10 horas após estupro por desconhecido e diz que não quer registrar boletim de ocorrência. Qual é a conduta?","opts":["Atender integralmente e oferecer as profilaxias sem exigir B.O.","Condicionar as profilaxias ao registro do boletim de ocorrência","Encaminhar ao IML antes de qualquer atendimento no hospital","Acionar a polícia e aguardar a chegada para iniciar o cuidado"],"c":0,"exp":"O atendimento à pessoa em situação de violência sexual é de emergência e não depende de boletim de ocorrência, exame de corpo de delito ou autorização judicial (Lei 12.845/2013 e normas do Ministério da Saúde). O serviço informa os direitos, facilita o registro se ela quiser e notifica a vigilância, mas a recusa ao B.O. não suspende nenhuma profilaxia.","ref":[1,4]},{"id":"349906da56","q":"O que a Lei 12.845/2013, conhecida como Lei do Minuto Seguinte, garante às vítimas de violência sexual nos hospitais do SUS?","opts":["Atendimento emergencial, integral, multidisciplinar e imediato","Atendimento apenas após registro de ocorrência e laudo pericial","Atendimento restrito a serviços de referência com delegacia","Atendimento apenas quando houver lesão física comprovada"],"c":0,"exp":"A lei obriga todos os hospitais do SUS a oferecer atendimento emergencial, integral e multidisciplinar: tratamento das lesões, amparo psicológico, profilaxia da gravidez e das IST, coleta de material para exames, facilitação do registro de ocorrência e informação sobre direitos. Ela define violência sexual como qualquer forma de atividade sexual não consentida.","ref":[1,3]},{"id":"e742b42815","q":"Sobre a notificação de um caso de violência sexual atendido em serviço de saúde, é correto afirmar que ela:","opts":["É compulsória e imediata à vigilância municipal, em até 24 horas","Só é feita se a vítima autorizar e registrar boletim de ocorrência","É dispensada em adultos e obrigatória apenas em crianças","Substitui a comunicação ao Conselho Tutelar nos menores de idade"],"c":0,"exp":"Violência sexual é agravo de notificação compulsória imediata (até 24 horas) à Secretaria Municipal de Saúde, pela ficha do SINAN, em qualquer idade. A notificação é instrumento de vigilância epidemiológica, não denúncia policial; em criança e adolescente, soma-se a comunicação obrigatória ao Conselho Tutelar (ECA, art. 13).","ref":[3,0]},{"id":"31b6d37c8b","q":"Adolescente de 13 anos relata relações sexuais com o namorado de 19 anos, que ela descreve como consentidas. Qual é o enquadramento e a conduta?","opts":["Estupro de vulnerável: notificar e comunicar ao Conselho Tutelar","Relação consentida: manter sigilo, pois não há crime a comunicar","Relação consentida: comunicar apenas se houver gestação ou IST","Estupro de vulnerável apenas se os pais registrarem ocorrência"],"c":0,"exp":"Conjunção carnal ou outro ato libidinoso com menor de 14 anos é estupro de vulnerável (Código Penal, art. 217-A), independentemente de consentimento, de experiência sexual anterior ou de relacionamento. O caso é notificado e comunicado ao Conselho Tutelar, com a adolescente informada e acolhida, e as profilaxias indicadas são oferecidas.","ref":[1,2]},{"id":"1588c6e399","q":"Além dos menores de 14 anos, quem também é considerado vulnerável para fins do crime de estupro de vulnerável?","opts":["Quem, por qualquer causa, não pode oferecer resistência","Toda mulher que tenha ingerido qualquer quantidade de álcool","Apenas adolescentes de 14 a 18 anos sob tutela judicial","Somente pessoas com deficiência intelectual sob curatela"],"c":0,"exp":"O art. 217-A do Código Penal também protege quem, por enfermidade ou deficiência mental, não tem o discernimento necessário para o ato e quem, por qualquer outra causa, não pode oferecer resistência — por exemplo, a vítima inconsciente ou intoxicada a ponto de não conseguir reagir.","ref":[1,2]},{"id":"68a12b618d","q":"Mulher de 27 anos, sem método contraceptivo, sofreu estupro com penetração vaginal há 40 horas. Qual contracepção de emergência está indicada?","opts":["Levonorgestrel 1,5 mg via oral em dose única, o quanto antes","Levonorgestrel apenas se ela estiver no período fértil do ciclo","Nenhuma, pois após 24 horas a contracepção de emergência falha","Misoprostol via vaginal para impedir a implantação do embrião"],"c":0,"exp":"Levonorgestrel 1,5 mg em dose única (ou 0,75 mg em duas doses com 12 horas de intervalo) pode ser usado até 5 dias após a violência, com eficácia maior quanto mais cedo. Indica-se em qualquer fase do ciclo quando não há método de alta eficácia em uso; atua retardando ou impedindo a ovulação e não é abortivo.","ref":[4,1]},{"id":"4e3efa00ca","q":"Na profilaxia pós-exposição (PEP) ao HIV após violência sexual, qual é a janela para início e a duração?","opts":["Até 72 horas, idealmente nas primeiras 2 horas, por 28 dias","Até 7 dias, idealmente nas primeiras 24 horas, por 14 dias","Até 24 horas, só com agressor HIV positivo, por 30 dias","Até 5 dias, junto com a contracepção, por 10 dias"],"c":0,"exp":"A PEP deve começar o quanto antes — idealmente nas primeiras 2 horas — e no máximo em 72 horas, durando 28 dias. Como o status sorológico do agressor em geral é desconhecido, a violência sexual com penetração desprotegida é indicação de PEP; depois de 72 horas não há benefício comprovado.","ref":[4,2]},{"id":"d4d27593b2","q":"Qual é o esquema preferencial de PEP para HIV em adultos no protocolo do Ministério da Saúde?","opts":["Tenofovir + lamivudina + dolutegravir","Zidovudina + lamivudina + nevirapina","Tenofovir + entricitabina isolados","Abacavir + lamivudina + efavirenz"],"c":0,"exp":"O esquema preferencial do PCDT de PEP é tenofovir 300 mg + lamivudina 300 mg (comprimido combinado) mais dolutegravir 50 mg, uma vez ao dia, por 28 dias. Tenofovir com entricitabina isolados é o esquema da PrEP, não da PEP. Faz-se teste rápido de HIV antes de iniciar, sem atrasar a primeira dose.","ref":[4,0]},{"id":"5c9380e2b5","q":"Na profilaxia das IST bacterianas após violência sexual em adulta não gestante, qual combinação segue o PCDT-IST do Ministério da Saúde?","opts":["Ceftriaxona 500 mg IM, azitromicina 1 g VO e penicilina benzatina 2,4 milhões UI IM","Ceftriaxona 1 g IV, doxiciclina 100 mg 12/12 h por 21 dias e amoxicilina 2 g VO","Ciprofloxacino 500 mg VO, azitromicina 500 mg VO e penicilina cristalina IV","Azitromicina 1 g VO isolada, que cobre gonorreia, clamídia e também a sífilis"],"c":0,"exp":"O PCDT-IST (2022) recomenda, em dose única: ceftriaxona 500 mg IM (gonorreia), azitromicina 1 g VO (clamídia) e penicilina G benzatina 2,4 milhões UI IM (sífilis), mais metronidazol 2 g VO para tricomoníase, que pode ser adiado se houver intolerância ou uso simultâneo de contracepção de emergência e antirretrovirais. Azitromicina não trata sífilis.","ref":[4,0]},{"id":"436a39b04e","q":"Vítima de violência sexual nunca foi vacinada contra hepatite B, e o agressor é desconhecido. Qual é a conduta?","opts":["Iniciar a vacina e aplicar imunoglobulina anti-hepatite B","Nada fazer, pois a hepatite B raramente é transmitida assim","Aguardar o HBsAg do agressor antes de qualquer medida","Aplicar só a imunoglobulina, sem iniciar o esquema vacinal"],"c":0,"exp":"Pessoa suscetível (não vacinada ou com esquema incompleto) recebe a vacina, iniciada ou completada, e a imunoglobulina humana anti-hepatite B (0,06 mL/kg IM), de preferência nas primeiras 48 horas e no máximo até 14 dias após a violência. Quem tem esquema vacinal completo não precisa de imunoglobulina.","ref":[4,3]},{"id":"2b8b0929e6","q":"Para qual destas infecções não existe profilaxia pós-exposição após violência sexual?","opts":["Hepatite C, apenas com testagem e seguimento","Hepatite B, apenas com testagem e seguimento","Sífilis, apenas com testagem e seguimento","Gonorreia, apenas com testagem e seguimento"],"c":0,"exp":"Não há profilaxia pós-exposição para a hepatite C: colhe-se anti-HCV no atendimento inicial e repete-se no seguimento, tratando se houver soroconversão. HIV (PEP), hepatite B (vacina e imunoglobulina), sífilis, gonorreia, clamídia e tricomoníase têm profilaxia.","ref":[4,0]},{"id":"b1e4b7e400","q":"Quais exames compõem a avaliação laboratorial inicial de uma mulher em idade fértil atendida após violência sexual?","opts":["Testes de HIV, sífilis, hepatites B e C e beta-hCG","Somente beta-hCG, pois sorologias só valem após 90 dias","Cultura vaginal para gonococo como único exame inicial","Hemograma e coagulograma, sem sorologias nesse momento"],"c":0,"exp":"Os exames iniciais estabelecem a linha de base: teste rápido de HIV (necessário antes da PEP), sífilis, hepatite B (HBsAg e, se possível, anti-HBs), anti-HCV e beta-hCG. Um resultado positivo no primeiro dia indica infecção prévia, não decorrente da violência; o seguimento repete as sorologias.","ref":[2,2]},{"id":"04d4f787e8","q":"Qual atitude é adequada no acolhimento de uma mulher que acabou de sofrer violência sexual?","opts":["Escuta sem julgamento, em privacidade, com relato colhido uma vez","Pedir que repita o relato a cada profissional para checar a versão","Perguntar por que ela não reagiu, para documentar a resistência","Examinar sem consentimento para não perder vestígios importantes"],"c":0,"exp":"O acolhimento evita a revitimização: ambiente privado, escuta sem julgamento, palavra da vítima tomada como verdadeira, relato registrado uma vez de forma detalhada no prontuário, e exame e coleta de vestígios somente com consentimento. Perguntas que culpabilizam e entrevistas repetidas agravam o trauma.","ref":[2,0]},{"id":"4170d81e0b","q":"Sobre a coleta de vestígios em serviço de saúde após violência sexual, é correto afirmar que ela:","opts":["Pode ser feita com consentimento, mesmo sem boletim de ocorrência","Só pode ser feita no IML, após requisição da autoridade policial","Deve vir antes do acolhimento e das profilaxias de urgência","Exige autorização judicial prévia quando a vítima é maior de idade"],"c":0,"exp":"O Decreto 7.958/2013 permite que profissionais do SUS colham e preservem vestígios (secreções em swab, roupas em saco de papel), com consentimento e cadeia de custódia, mesmo sem boletim de ocorrência; o material fica guardado para eventual uso pericial. A coleta nunca deve atrasar as profilaxias.","ref":[2,1]},{"id":"1f481a8077","q":"Mulher de 22 anos, com gestação de 10 semanas, relata que a gravidez resultou de estupro e não registrou boletim de ocorrência. Ela pede a interrupção. Qual é a conduta?","opts":["Realizar pelo procedimento do SUS, sem exigir B.O. nem alvará","Exigir boletim de ocorrência e laudo do IML antes do procedimento","Solicitar autorização judicial, pois não há prova do estupro","Negar, pois o aborto legal por estupro vale só até 8 semanas"],"c":0,"exp":"O Código Penal (art. 128, II) não pune o aborto de gravidez resultante de estupro, com consentimento da gestante. Não se exige B.O., laudo do IML nem autorização judicial: a palavra da mulher tem presunção de veracidade, e a equipe multiprofissional documenta o relato e o consentimento em termos padronizados.","ref":[6,1]},{"id":"75857005d1","q":"Em quais situações a interrupção da gestação é permitida no Brasil sem necessidade de autorização judicial?","opts":["Risco de vida da gestante, estupro e anencefalia fetal","Estupro, malformação fetal grave e desejo até 12 semanas","Risco de vida, estupro e microcefalia fetal por zika","Apenas risco de vida materno e estupro de vulnerável"],"c":0,"exp":"O art. 128 do Código Penal prevê o aborto necessário (quando não há outro meio de salvar a vida da gestante) e o aborto de gravidez resultante de estupro; desde 2012 o STF (ADPF 54) admite a interrupção na anencefalia fetal. Outras malformações dependem de decisão judicial caso a caso.","ref":[6,0]},{"id":"e1b23bdbf4","q":"Um médico invoca objeção de consciência para não realizar um aborto previsto em lei. Em qual situação ele não pode recusar?","opts":["Quando houver risco de morte ou não existir outro médico","Quando a gestação resultar de estupro de mulher adulta","Quando a gestação tiver menos de doze semanas completas","Quando o hospital for público e a paciente pedir por escrito"],"c":0,"exp":"O Código de Ética Médica permite a objeção de consciência, mas ela não vale quando há risco de morte da mulher, quando não há outro profissional que possa fazer o procedimento ou quando a omissão pode causar dano à paciente. A instituição não tem direito a objeção: precisa garantir o procedimento por outro profissional.","ref":[6,2]},{"id":"53be6faf7d","q":"Em qual destas situações a PEP para HIV não está indicada após violência sexual?","opts":["Atendimento 5 dias após a violência, fora da janela de 72 h","Agressor desconhecido e penetração vaginal sem preservativo","Penetração anal desprotegida por agressor de status ignorado","Vítima que se recusa a registrar o boletim de ocorrência"],"c":0,"exp":"Após 72 horas a PEP não tem benefício comprovado; o cuidado passa a ser testagem para HIV, sífilis e hepatites, acolhimento e seguimento (a contracepção de emergência, porém, ainda cabe até o quinto dia). A recusa ao boletim de ocorrência nunca é motivo para negar profilaxia.","ref":[5,1]}],"resumo":[{"h":"","blocos":[{"html":"<blockquote><p>Material de referência: não há slide da aula deste tema. Baseado na Lei 12.845/2013, no Código Penal, no Decreto 7.958/2013, no PCDT de IST (Ministério da Saúde, 2022), no PCDT de Profilaxia Pós-Exposição ao HIV e na norma técnica do MS sobre atenção humanizada às pessoas em situação de violência sexual.<\/p><\/blockquote>"}]},{"h":"Conceitos e marco legal","blocos":[{"html":"<p><strong>Violência sexual<\/strong> é qualquer forma de atividade sexual não consentida (Lei 12.845/2013). Desde 2009, <strong>estupro<\/strong> (Código Penal, art. 213) é constranger alguém, mediante violência ou grave ameaça, à conjunção carnal <strong>ou a qualquer outro ato libidinoso<\/strong> — o crime não exige penetração vaginal nem vítima mulher.<\/p>"},{"html":"<p><strong>Estupro de vulnerável<\/strong> (art. 217-A) é conjunção carnal ou ato libidinoso com:<\/p>"},{"html":"<ul><li><strong>menor de 14 anos<\/strong>, independentemente de consentimento, de experiência sexual anterior ou de relacionamento com o agressor;<\/li><li>quem, por enfermidade ou deficiência mental, <strong>não tem discernimento<\/strong> para o ato;<\/li><li>quem, por <strong>qualquer outra causa, não pode oferecer resistência<\/strong> — inconsciente, sedada, intoxicada a ponto de não reagir.<\/li><\/ul>"},{"html":"<p>A <strong>Lei 12.845/2013 (Lei do Minuto Seguinte)<\/strong> obriga todos os hospitais do SUS a prestar atendimento <strong>emergencial, integral e multidisciplinar<\/strong>: tratamento das lesões, amparo psicológico e social, profilaxia da gravidez e das IST, coleta de material para exames, facilitação do registro de ocorrência e informação sobre direitos e serviços.<\/p>"},{"html":"<blockquote><p><strong>Boletim de ocorrência não é condição para nada no serviço de saúde<\/strong>: nem para o atendimento, nem para as profilaxias, nem para o aborto previsto em lei. Também não se exige exame do IML nem autorização judicial.<\/p><\/blockquote>"}]},{"h":"Acolhimento e primeiro atendimento","blocos":[{"html":"<p>O objetivo é <strong>cuidado e proteção, não investigação<\/strong>. O acolhimento evita a revitimização: ambiente privado, escuta sem julgamento, <strong>palavra da vítima tomada como verdadeira<\/strong>, relato colhido <strong>uma vez<\/strong> e registrado com detalhe no prontuário, sem perguntas que culpabilizam (\"por que não reagiu?\"). Exame físico e ginecológico, registro das lesões e coleta de vestígios só com <strong>consentimento informado<\/strong>.<\/p>"},{"html":"<p>O <strong>Decreto 7.958/2013<\/strong> permite que profissionais do SUS colham e preservem <strong>vestígios<\/strong> — secreções em swab, roupas em saco de papel —, com cadeia de custódia, <strong>mesmo sem B.O.<\/strong>: o material fica guardado para eventual perícia se a mulher decidir registrar depois. A coleta nunca atrasa as profilaxias.<\/p>"},{"html":"<p>A avaliação laboratorial inicial estabelece a linha de base: <strong>teste rápido de HIV<\/strong> (antes da PEP, sem atrasar a primeira dose), <strong>sífilis<\/strong>, <strong>hepatite B<\/strong> (HBsAg e, se possível, anti-HBs), <strong>anti-HCV<\/strong> e <strong>beta-hCG<\/strong> na mulher em idade fértil. Resultado positivo no primeiro dia indica infecção prévia, não decorrente da violência.<\/p>"}]},{"h":"Notificação e rede de proteção","blocos":[{"html":"<ul><li><strong>Notificação compulsória imediata<\/strong> (até 24 horas) à Secretaria Municipal de Saúde, pela ficha de violência do SINAN, <strong>em qualquer idade<\/strong>. É instrumento de vigilância epidemiológica, não denúncia, e não depende da vontade da vítima.<\/li><li><strong>Criança e adolescente<\/strong>: além da notificação, <strong>comunicação obrigatória ao Conselho Tutelar<\/strong> (ECA, art. 13), sem depender de B.O. ou de autorização da família. A Lei 13.431/2017 prevê escuta especializada e depoimento especial, justamente para não repetir o relato.<\/li><li><strong>Mulher adulta<\/strong>: desde a Lei 13.931/2019, os casos de violência contra a mulher atendidos no serviço de saúde também são comunicados à autoridade policial em até 24 horas, para providências e fins estatísticos — o que não transforma o B.O. em condição para o cuidado.<\/li><\/ul>"},{"html":"<blockquote><p>Gestação em menina <strong>menor de 14 anos<\/strong> é, por definição legal, resultado de estupro de vulnerável: notificação, Conselho Tutelar e direito ao aborto previsto em lei.<\/p><\/blockquote>"}]},{"h":"Profilaxias: o relógio decide","blocos":[{"html":"<div class=\"tbl\"><table><thead><tr><th>Profilaxia<\/th><th>Esquema (adulta não gestante)<\/th><th>Janela<\/th><\/tr><\/thead><tbody><tr><td><strong>Contracepção de emergência<\/strong><\/td><td><strong>Levonorgestrel 1,5 mg VO, dose única<\/strong> (ou 0,75 mg de 12/12 h, 2 doses)<\/td><td>Até <strong>5 dias<\/strong>; quanto antes, melhor<\/td><\/tr><tr><td><strong>PEP do HIV<\/strong><\/td><td><strong>Tenofovir 300 mg + lamivudina 300 mg + dolutegravir 50 mg<\/strong>, 1×/dia, <strong>28 dias<\/strong><\/td><td>Até <strong>72 h<\/strong>, idealmente nas primeiras 2 h<\/td><\/tr><tr><td>Sífilis<\/td><td>Penicilina G benzatina <strong>2,4 milhões UI IM<\/strong>, dose única<\/td><td>—<\/td><\/tr><tr><td>Gonorreia<\/td><td>Ceftriaxona <strong>500 mg IM<\/strong>, dose única<\/td><td>—<\/td><\/tr><tr><td>Clamídia<\/td><td>Azitromicina <strong>1 g VO<\/strong>, dose única<\/td><td>—<\/td><\/tr><tr><td>Tricomoníase<\/td><td>Metronidazol <strong>2 g VO<\/strong>, dose única (pode ser adiado)<\/td><td>—<\/td><\/tr><tr><td><strong>Hepatite B<\/strong><\/td><td>Vacina (iniciar ou completar) + <strong>imunoglobulina anti-hepatite B 0,06 mL/kg IM<\/strong> se suscetível<\/td><td>IGHAHB idealmente em 48 h, até <strong>14 dias<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A <strong>contracepção de emergência<\/strong> vale em qualquer fase do ciclo quando houve exposição vaginal ao sêmen e não há método de alta eficácia em uso. O levonorgestrel retarda ou impede a ovulação e <strong>não é abortivo<\/strong>.<\/p>"},{"html":"<p>A <strong>PEP<\/strong> é indicada na penetração vaginal, anal ou oral desprotegida com agressor de status desconhecido ou HIV positivo; em geral não se indica com preservativo íntegro durante todo o ato, nem após 72 horas. Crianças usam esquema pediátrico próprio, e as doses das profilaxias de IST são ajustadas ao peso. O metronidazol pode ser adiado quando há intolerância ou quando ela já está tomando contracepção de emergência e antirretrovirais, para reduzir náusea e vômito.<\/p>"},{"html":"<p>A <strong>imunoglobulina<\/strong> anti-hepatite B é para quem não é vacinado ou tem esquema incompleto; quem tem esquema completo não precisa dela. A vacina HPV também está indicada para vítimas de violência sexual não vacinadas, conforme as faixas do calendário vigente.<\/p>"},{"html":"<blockquote><p><strong>Azitromicina não trata sífilis<\/strong> (mesma regra do tratamento das úlceras genitais): a profilaxia de sífilis é sempre a penicilina benzatina. E <strong>não existe profilaxia para hepatite C<\/strong> — só testagem e seguimento.<\/p><\/blockquote>"}]},{"h":"Seguimento","blocos":[{"html":"<p>O seguimento repete as sorologias: HIV aos <strong>30 e 90 dias<\/strong> da exposição, além de sífilis e hepatites B e C, e beta-hCG se houver atraso menstrual. Quem fez PEP é acompanhado quanto à adesão e aos efeitos adversos dos 28 dias. O cuidado em saúde mental é parte do protocolo, não um encaminhamento opcional: transtorno de estresse pós-traumático, depressão e ideação suicida são frequentes, e o vínculo com a equipe e com a rede de assistência social é o que sustenta o seguimento.<\/p>"},{"html":"<p>Fora das janelas de profilaxia — quem chega depois de 72 horas para a PEP ou depois de 5 dias para a contracepção de emergência —, o atendimento continua integral: testagem, tratamento de IST diagnosticadas, avaliação de gestação, acolhimento e notificação.<\/p>"}]},{"h":"Aborto previsto em lei","blocos":[{"html":"<div class=\"tbl\"><table><thead><tr><th>Situação<\/th><th>Base<\/th><\/tr><\/thead><tbody><tr><td><strong>Risco de vida da gestante<\/strong> sem outro meio de salvá-la (aborto necessário)<\/td><td>Código Penal, art. 128, I<\/td><\/tr><tr><td><strong>Gravidez resultante de estupro<\/strong>, com consentimento da gestante ou do representante legal, se incapaz<\/td><td>Código Penal, art. 128, II<\/td><\/tr><tr><td><strong>Anencefalia fetal<\/strong><\/td><td>STF, ADPF 54 (2012)<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Na gravidez decorrente de estupro, <strong>não se exige B.O., laudo do IML nem autorização judicial<\/strong>. A palavra da mulher tem presunção de veracidade, e a equipe multiprofissional documenta o relato, o parecer técnico e o consentimento em termos padronizados pelo Ministério da Saúde. O Código Penal não fixa idade gestacional limite para essa hipótese. Outras malformações fetais graves dependem de decisão judicial caso a caso.<\/p>"},{"html":"<p>O médico pode alegar <strong>objeção de consciência<\/strong>, exceto quando há <strong>risco de morte<\/strong> da mulher, quando <strong>não há outro profissional<\/strong> disponível ou quando a omissão pode causar dano. A <strong>instituição<\/strong> não tem objeção de consciência: precisa garantir o procedimento.<\/p>"},{"html":"<blockquote><p>Em criança e adolescente, o consentimento envolve a gestante e seu representante legal; a vontade da menina é ouvida em escuta qualificada e registrada no prontuário.<\/p><\/blockquote>"}]}]}]};

/* chave por página: cada prova guarda a própria fila. Sem chave = nomes antigos. */
var NS = DADOS.chave ? '-' + DADOS.chave : '';
var K = { h: 'fech-hist' + NS, f: 'fech-fila' + NS, r: 'fech-rec' + NS };
function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var H = load(K.h, {});   // id -> {ok, seen, at, streak, conf}
var F = load(K.f, []);   // fila de revisão (ids)
var R = load(K.r, 0);    // recuperados

/* ---------- o algoritmo da fila ----------
   Errou OU marcou "em dúvida"      -> entra na fila.
   Para SAIR da fila                -> 2 acertos seguidos sem marcar dúvida.
   Acerto com dúvida                -> zera o streak e devolve para a fila.
------------------------------------------- */
function registrar(lista) {
  lista.forEach(function (e) {
    var q = e.q, ok = e.sel === q.c, unsure = e.conf === 'unsure';
    var streak = (ok && !unsure) ? ((H[q.id] || {}).streak || 0) + 1 : 0;
    var naFila = F.indexOf(q.id) !== -1;
    if (ok && naFila && streak >= 2) R++;
    if (!ok || unsure) { if (!naFila) F.push(q.id); }
    else if (streak >= 2) { F = F.filter(function (x) { return x !== q.id; }); }
    H[q.id] = { ok: ok, seen: ((H[q.id] || {}).seen || 0) + 1, at: Date.now(),
                streak: streak, conf: e.conf || 'sure' };
  });
  save(K.h, H); save(K.f, F); save(K.r, R);
}

/* ---------- leitura de estado ---------- */
function estado(id) {
  var h = H[id];
  if (!h || !h.seen) return 'new';
  if (!h.ok) return h.conf === 'unsure' ? 'err' : 'sureerr';
  return h.conf === 'unsure' ? 'unsureok' : 'ok';
}
function statsTema(t) {
  var s = { total: t.questoes.length, vistas: 0, ok: 0, err: 0, uns: 0, fila: 0 };
  t.questoes.forEach(function (q) {
    var e = estado(q.id);
    if (e !== 'new') s.vistas++;
    if (e === 'ok') s.ok++;
    if (e === 'err' || e === 'sureerr') s.err++;
    if (e === 'unsureok') s.uns++;
    if (F.indexOf(q.id) !== -1) s.fila++;
  });
  return s;
}
function statsGeral() {
  var s = { total: ALL.length, vistas: 0, ok: 0, err: 0, uns: 0 };
  ALL.forEach(function (q) {
    var e = estado(q.id);
    if (e !== 'new') s.vistas++;
    if (e === 'ok') s.ok++;
    if (e === 'err' || e === 'sureerr') s.err++;
    if (e === 'unsureok') s.uns++;
  });
  return s;
}

/* ---------- utilidades ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function embaralhar(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function plural(n, s, p) { return n + ' ' + (n === 1 ? s : p); }
function mmss(ms) {
  if (ms < 0) ms = 0;
  var s = Math.round(ms / 1000), m = Math.floor(s / 60);
  return m + ':' + ('0' + (s % 60)).slice(-2);
}
function segBar(s, cls) {
  var t = s.total || 1;
  function w(n) { return (n / t * 100).toFixed(2) + '%'; }
  return '<div class="seg ' + (cls || '') + '">' +
    '<i class="ok" style="width:' + w(s.ok) + '"></i>' +
    '<i class="uns" style="width:' + w(s.uns) + '"></i>' +
    '<i class="err" style="width:' + w(s.err) + '"></i></div>';
}

function temaPorSlug(slug) {
  return DADOS.temas.filter(function (t) { return t.slug === slug; })[0];
}
/* botão que leva à linha do resumo que sustenta a questão */
function botaoFonte(q) {
  if (!q.ref) return '';
  var t = temaPorSlug(q.tema);
  if (!t || !t.resumo || !t.resumo[q.ref[0]]) return '';
  var sec = t.resumo[q.ref[0]].h;
  return '<button class="btn fonte" data-act="resumo" data-slug="' + esc(q.tema) +
         '" data-sec="' + q.ref[0] + '" data-blk="' + q.ref[1] + '">' +
         'Consultar no resumo' + (sec ? ' &middot; ' + esc(sec) : '') + '</button>';
}

/* ---------- estado da tela ---------- */
var S = { view: 'home', round: null, pick: {}, bloco: 20, minutos: 0, filtro: 'todas',
          resumo: null, voltar: 'home', voltarLabel: 'Voltar ao início' };
var app = document.getElementById('app');

/* ---------- montagem de rodadas ---------- */
function novaRodada(mode, qs, titulo, minutos) {
  S.round = {
    mode: mode, titulo: titulo, qs: qs, i: 0, ans: {}, revelada: false,
    conf: null, corrigido: false,
    endsAt: minutos > 0 ? Date.now() + minutos * 60000 : 0
  };
  S.view = 'rodada';
  pararRelogio();
  if (S.round.endsAt) iniciarRelogio();
}
function treinoTema(slug, n) {
  var t = DADOS.temas.filter(function (x) { return x.slug === slug; })[0];
  if (!t) return;
  var qs = embaralhar(t.questoes.map(function (q) { return BY[q.id]; }));
  if (n > 0 && n < qs.length) {
    // treino parcial (banco grande): primeiro as nunca vistas, depois as erradas, depois o resto
    var peso = function (q) { var e = estado(q.id); return e === 'new' ? 0 : (e === 'ok' ? 2 : 1); };
    qs = qs.map(function (q, i) { return { q: q, i: i }; })
           .sort(function (a, b) { return (peso(a.q) - peso(b.q)) || (a.i - b.i); })
           .map(function (x) { return x.q; }).slice(0, n);
  }
  novaRodada('treino', qs, t.titulo, 0);
}
function rodadaRevisao() {
  var qs = F.map(function (id) { return BY[id]; }).filter(Boolean);
  if (!qs.length) return;
  novaRodada('revisao', embaralhar(qs), 'Fila de revisão', 0);
}

/* ---------- relógio do simulado ---------- */
var relogio = null;
function iniciarRelogio() {
  pararRelogio();
  relogio = setInterval(function () {
    var r = S.round;
    if (!r || !r.endsAt || r.corrigido) { pararRelogio(); return; }
    var resta = r.endsAt - Date.now();
    var el = document.getElementById('clock');
    if (el) {
      el.textContent = mmss(resta);
      el.className = 'timer' + (resta < 120000 ? ' low' : '');
    }
    if (resta <= 0) { pararRelogio(); corrigirSimulado(true); }
  }, 500);
}
function pararRelogio() { if (relogio) { clearInterval(relogio); relogio = null; } }

/* ---------- correção do simulado ---------- */
function corrigirSimulado(auto) {
  var r = S.round;
  if (!r || r.corrigido) return;
  var faltam = r.qs.filter(function (q) { return r.ans[q.id] == null; }).length;
  if (faltam && !auto) {
    var msg = 'Faltam ' + plural(faltam, 'questão', 'questões') + ' sem resposta.\n\n' +
              'Em branco conta como erro e vai para a fila de revisão. Corrigir mesmo assim?';
    if (!confirm(msg)) return;
  }
  pararRelogio();
  registrar(r.qs.map(function (q) {
    var a = r.ans[q.id] || {};
    return { q: q, sel: a.sel == null ? -1 : a.sel, conf: a.conf };
  }));
  r.corrigido = true;
  S.filtro = 'todas';
  S.view = 'resultado';
  render();
}

/* =========================================================================
   TELAS
   ========================================================================= */
function render() {
  if (S.view === 'home') app.innerHTML = telaHome();
  else if (S.view === 'setup') app.innerHTML = telaSetup();
  else if (S.view === 'rodada') app.innerHTML = telaRodada();
  else if (S.view === 'resultado') app.innerHTML = telaResultado();
  else if (S.view === 'resumo') app.innerHTML = telaResumo();
  window.scrollTo(0, 0);
  if (S.view === 'resumo' && S.resumo && S.resumo.sec != null) {
    var alvo = document.getElementById('alvo');
    if (alvo && alvo.scrollIntoView) alvo.scrollIntoView({ block: 'center' });
  }
}

function telaHome() {
  var g = statsGeral();
  var pct = g.total ? Math.round(g.ok / g.total * 100) : 0;
  var h = '';
  if (DADOS.voltar) h += '<p class="eyebrow"><a href="' + esc(DADOS.voltar.href) + '" style="color:inherit">← ' + esc(DADOS.voltar.rotulo) + '</a></p>';
  h += '<p class="eyebrow">' + esc(DADOS.eyebrow) + '</p>';
  h += '<h1>' + esc(DADOS.titulo) + '</h1>';
  h += '<p class="lede">' + esc(DADOS.subtitulo) + '</p>';

  h += '<div class="card">';
  h += '<p class="eyebrow" style="margin-bottom:6px">Seu progresso</p>';
  h += '<div style="display:flex;align-items:baseline;gap:9px">' +
       '<span style="font-family:var(--mono);font-size:33px;font-weight:600;line-height:1">' + pct + '%</span>' +
       '<span style="font-size:13px;color:var(--muted)">do banco acertado na última resposta</span></div>';
  h += segBar(g);
  h += '<div class="legend">' +
       '<span><i style="background:var(--green)"></i>acerto confiante</span>' +
       '<span><i style="background:var(--amberb)"></i>acerto com dúvida</span>' +
       '<span><i style="background:var(--red)"></i>erro</span>' +
       '<span><i style="background:#e4e0d8"></i>ainda não vista</span></div>';
  h += '<div class="stats">';
  h += '<div class="stat"><b>' + g.vistas + '<span style="font-size:13px;color:var(--muted)">/' + g.total + '</span></b><span>questões vistas</span></div>';
  h += '<div class="stat"><b>' + F.length + '</b><span>na fila de revisão</span></div>';
  h += '<div class="stat"><b>' + R + '</b><span>erros recuperados</span></div>';
  h += '<div class="stat"><b>' + g.uns + '</b><span>acertos com dúvida</span></div>';
  h += '</div></div>';

  h += '<div class="row" style="margin:0 0 6px">';
  h += '<button class="btn" data-act="setup">Simulado individual</button>';
  h += '<button class="btn ghost" data-act="revisao"' + (F.length ? '' : ' disabled') + '>' +
       (F.length ? 'Revisar erros e dúvidas (' + F.length + ')' : 'Fila de revisão vazia') + '</button>';
  h += '</div>';

  if (F.length) {
    h += '<p class="hint">Uma questão só sai da fila com <b>dois acertos seguidos sem marcar dúvida</b>.</p>';
  } else if (g.vistas) {
    h += '<div class="note calm" style="margin-top:12px">Fila limpa. Todo erro já foi recuperado com dois acertos confiantes.</div>';
  }

  h += '<h3>Treinar um tema</h3>';
  h += '<div class="temas">';
  DADOS.temas.forEach(function (t) {
    var s = statsTema(t);
    h += '<button class="tema" data-act="treino" data-slug="' + esc(t.slug) + '">';
    h += '<span class="tt"><b>' + esc(t.titulo) + '</b>' +
         '<span>' + esc(t.disciplina) + ' · ' + s.vistas + '/' + s.total + ' vistas</span></span>';
    if (s.fila) h += '<span class="badge">' + s.fila + ' na fila</span>';
    h += '<span class="mini">' + segBar(s) + '</span>';
    h += '</button>';
  });
  h += '</div>';

  var comResumo = DADOS.temas.filter(function (t) { return t.resumo; });
  if (comResumo.length) {
    h += '<h3>Resumos para consulta</h3><div class="chips">';
    comResumo.forEach(function (t) {
      h += '<button class="chip" data-act="resumo" data-slug="' + esc(t.slug) + '">' +
           esc(t.titulo) + '</button>';
    });
    h += '</div>';
  }

  h += '<div class="foot">' + esc(DADOS.rodape) +
       '<br>' + ALL.length + ' questões · ' + DADOS.temas.length + ' temas · progresso salvo neste navegador' +
       '<br><a href="#" data-act="reset">Apagar meu progresso</a></div>';
  return h;
}

function telaSetup() {
  var sel = DADOS.temas.filter(function (t) { return S.pick[t.slug]; });
  var disp = sel.reduce(function (n, t) { return n + t.questoes.length; }, 0);
  var h = '';
  h += '<p class="eyebrow">Monte seu treino</p>';
  h += '<h1>Simulado individual</h1>';
  h += '<p class="lede">Responde tudo sem ver gabarito, com tempo correndo. A correção comentada vem só no fim — como na prova.</p>';

  h += '<div class="card">';
  h += '<p class="eyebrow" style="margin-bottom:10px">1 · Escolha os temas</p>';
  h += '<div class="row" style="margin:0 0 11px">' +
       '<button class="btn ghost" data-act="alltemas" style="padding:8px 14px;font-size:13px">Marcar todos</button>' +
       '<button class="btn ghost" data-act="notemas" style="padding:8px 14px;font-size:13px">Limpar</button>' +
       (F.length ? '<button class="btn ghost" data-act="pickfila" style="padding:8px 14px;font-size:13px">Só a fila (' + F.length + ')</button>' : '') +
       '</div>';
  DADOS.temas.forEach(function (t) {
    var on = !!S.pick[t.slug];
    h += '<button class="chk' + (on ? ' on' : '') + '" data-act="toggle" data-slug="' + esc(t.slug) + '">' +
         '<span class="bx">' + (on ? '&#10003;' : '') + '</span>' +
         '<span>' + esc(t.titulo) + '</span>' +
         '<span class="n">' + t.questoes.length + '</span></button>';
  });
  h += '</div>';

  h += '<div class="card">';
  h += '<p class="eyebrow" style="margin-bottom:10px">2 · Tamanho e tempo</p>';
  h += '<div class="fld"><label for="bloco">Quantas questões</label>' +
       '<input id="bloco" type="number" min="1" max="' + Math.max(disp, 1) + '" value="' + S.bloco + '"></div>';
  h += '<div class="fld"><label for="minutos">Minutos (0 = sem cronômetro)</label>' +
       '<input id="minutos" type="number" min="0" max="300" value="' + S.minutos + '"></div>';
  h += '<p class="hint">Disponível: <b>' + disp + '</b> ' + (disp === 1 ? 'questão' : 'questões') +
       ' em ' + plural(sel.length, 'tema', 'temas') + '. As questões vêm embaralhadas.</p>';
  h += '</div>';

  h += '<div class="row">';
  h += '<button class="btn" data-act="simstart"' + (disp ? '' : ' disabled') + '>Começar simulado</button>';
  h += '<button class="btn ghost" data-act="home">Voltar</button>';
  h += '</div>';
  return h;
}

function telaRodada() {
  var r = S.round, q = r.qs[r.i], sim = r.mode === 'simulado';
  var a = r.ans[q.id] || {};
  var respondida = a.sel != null;
  var revela = !sim && respondida;
  var h = '';

  h += '<div class="meta">';
  h += '<span>' + esc(r.titulo) + ' · ' + (r.i + 1) + '/' + r.qs.length + '</span>';
  h += sim && r.endsAt ? '<span class="timer" id="clock">' + mmss(r.endsAt - Date.now()) + '</span>'
                       : '<span>' + esc(q.temaT) + '</span>';
  h += '</div>';

  h += '<div class="card">';
  h += '<p class="q">' + esc(q.q) + '</p>';

  // portão de confiança — antes de responder
  if (!respondida) {
    h += '<div class="conf"><p>Antes de responder: qual é a sua confiança?</p><div class="row">' +
         '<button class="btn' + (r.conf === 'sure' ? ' on' : '') + '" data-act="conf" data-v="sure">Tenho certeza</button>' +
         '<button class="btn' + (r.conf === 'unsure' ? ' on' : '') + '" data-act="conf" data-v="unsure">Estou em dúvida</button>' +
         '</div></div>';
  }

  q.opts.forEach(function (o, i) {
    var cls = 'opt';
    if (revela) {
      if (i === q.c) cls += ' ok';
      else if (i === a.sel) cls += ' bad';
    } else if (a.sel === i) cls += ' sel';
    h += '<button class="' + cls + '" data-act="opt" data-i="' + i + '"' + (revela ? ' disabled' : '') + '>' +
         '<span class="k">' + 'ABCDE'[i] + '</span><span>' + esc(o) + '</span></button>';
  });

  if (revela) {
    var ok = a.sel === q.c;
    var tit = ok ? (a.conf === 'unsure' ? 'Acerto com dúvida — volta para a fila' : 'Correto. Agora explique o porquê.')
                 : (a.conf === 'unsure' ? 'Erro, e você já desconfiava' : 'Erro com certeza — revise o raciocínio');
    h += '<div class="exp ' + (ok ? 'good' : 'bad') + '"><b>' + esc(tit) + '</b>' + esc(q.exp) + '</div>';
    h += botaoFonte(q);
  }
  h += '</div>';

  // navegação
  h += '<div class="row">';
  if (sim) {
    h += '<button class="btn ghost" data-act="prev"' + (r.i ? '' : ' disabled') + '>Anterior</button>';
    if (r.i < r.qs.length - 1) h += '<button class="btn" data-act="next">Próxima</button>';
    else h += '<button class="btn" data-act="corrigir">Corrigir simulado</button>';
  } else {
    if (revela) {
      if (r.i < r.qs.length - 1) h += '<button class="btn" data-act="next">Próxima questão</button>';
      else h += '<button class="btn" data-act="corrigir">Ver resultado</button>';
    }
    h += '<button class="btn ghost" data-act="home">Sair e salvar</button>';
  }
  h += '</div>';

  if (sim) {
    var resp = r.qs.filter(function (x) { return r.ans[x.id] != null; }).length;
    h += '<h3>' + resp + ' de ' + r.qs.length + ' respondidas</h3>';
    h += '<div class="grid">';
    r.qs.forEach(function (x, i) {
      var c = 'gq' + (r.ans[x.id] != null ? ' done' : '') + (i === r.i ? ' now' : '');
      h += '<button class="' + c + '" data-act="goto" data-i="' + i + '">' + (i + 1) + '</button>';
    });
    h += '</div>';
    h += '<div class="row" style="margin-top:14px">' +
         '<button class="btn ghost" data-act="corrigir">Corrigir agora</button></div>';
  }
  return h;
}

function telaResultado() {
  var r = S.round;
  var certas = r.qs.filter(function (q) { var a = r.ans[q.id] || {}; return a.sel === q.c; }).length;
  var pct = Math.round(certas / r.qs.length * 100);
  var duvida = r.qs.filter(function (q) { var a = r.ans[q.id] || {}; return a.conf === 'unsure'; }).length;
  var brancos = r.qs.filter(function (q) { return (r.ans[q.id] || {}).sel == null; }).length;

  var titulo, msg;
  if (pct >= 90) { titulo = 'Domínio sólido'; msg = 'Confira as que escaparam e siga para outro tema.'; }
  else if (pct >= 70) { titulo = 'Quase lá'; msg = 'A base está firme. O que caiu na fila é o que decide a prova.'; }
  else if (pct >= 50) { titulo = 'Meio do caminho'; msg = 'Releia a fonte dos erros antes de repetir o bloco.'; }
  else { titulo = 'Precisa revisar'; msg = 'Volte ao material deste tema antes de tentar de novo.'; }

  var h = '';
  h += '<p class="eyebrow">' + (r.mode === 'simulado' ? 'Simulado concluído' : 'Bloco concluído') + ' · ' + esc(r.titulo) + '</p>';
  h += '<h1>' + titulo + '</h1>';
  h += '<p class="lede">' + msg + '</p>';

  h += '<div class="card"><div style="display:flex;align-items:baseline;gap:9px">' +
       '<span style="font-family:var(--mono);font-size:33px;font-weight:600;line-height:1">' + certas + '/' + r.qs.length + '</span>' +
       '<span style="font-size:13px;color:var(--muted)">' + pct + '% nesta rodada</span></div>';
  h += '<div class="stats">';
  h += '<div class="stat"><b>' + duvida + '</b><span>marcadas em dúvida</span></div>';
  h += '<div class="stat"><b>' + brancos + '</b><span>em branco</span></div>';
  h += '<div class="stat"><b>' + F.length + '</b><span>na fila agora</span></div>';
  h += '<div class="stat"><b>' + R + '</b><span>recuperados no total</span></div>';
  h += '</div></div>';

  var fs = [['todas', 'Todas'], ['erros', 'Erros'], ['duvida', 'Em dúvida'], ['branco', 'Em branco']];
  h += '<div class="row" style="margin:0 0 14px">';
  fs.forEach(function (f) {
    h += '<button class="btn ghost' + (S.filtro === f[0] ? ' on' : '') + '" data-act="filtro" data-v="' + f[0] + '"' +
         (S.filtro === f[0] ? ' style="border-color:var(--blue);color:var(--blue);background:var(--bluel)"' : '') +
         ' >' + f[1] + '</button>';
  });
  h += '</div>';

  var lista = r.qs.filter(function (q) {
    var a = r.ans[q.id] || {};
    if (S.filtro === 'erros') return a.sel !== q.c;
    if (S.filtro === 'duvida') return a.conf === 'unsure';
    if (S.filtro === 'branco') return a.sel == null;
    return true;
  });

  h += '<div class="card">';
  if (!lista.length) h += '<div class="empty">Nada nesta categoria.</div>';
  lista.forEach(function (q) {
    var a = r.ans[q.id] || {}, ok = a.sel === q.c;
    h += '<div class="rev">';
    h += '<p class="revl">' + esc(q.temaT) + ' · ' +
         (ok ? 'acerto' : 'erro') + (a.conf === 'unsure' ? ' · marcou dúvida' : '') + '</p>';
    h += '<p class="revq">' + esc(q.q) + '</p>';
    h += '<p class="resp" style="color:' + (ok ? 'var(--green)' : 'var(--red)') + '">Sua resposta: ' +
         (a.sel == null ? '<i>em branco</i>' : esc('ABCDE'[a.sel] + '. ' + q.opts[a.sel])) + '</p>';
    if (!ok) h += '<p class="resp" style="color:var(--green)">Correta: ' + esc('ABCDE'[q.c] + '. ' + q.opts[q.c]) + '</p>';
    h += '<div class="exp ' + (ok ? 'good' : 'bad') + '">' + esc(q.exp) + '</div>';
    h += botaoFonte(q);
    h += '</div>';
  });
  h += '</div>';

  h += '<div class="row">';
  h += '<button class="btn" data-act="home">Voltar ao início</button>';
  if (F.length) h += '<button class="btn ghost" data-act="revisao">Revisar a fila (' + F.length + ')</button>';
  h += '</div>';
  return h;
}

function telaResumo() {
  var r = S.resumo, t = temaPorSlug(r.tema), h = '';
  h += '<div class="meta"><span>Resumo da aula</span><span>' + esc(t.disciplina) + '</span></div>';
  h += '<h1>' + esc(t.titulo) + '</h1>';
  h += '<div class="row" style="margin:0 0 20px">' +
       '<button class="btn" data-act="voltar">' + esc(S.voltarLabel) + '</button></div>';

  if (!t.resumo) {
    h += '<div class="empty">Este tema não tem resumo anexado.<br>' +
         'Gere a página com o <code>resumo_' + esc(t.slug) + '.md</code> presente.</div>';
    return h;
  }

  if (r.sec != null) {
    h += '<div class="note">O trecho destacado é o que sustenta a questão. ' +
         'O resumo inteiro do tema está aqui embaixo.</div>';
  }

  h += '<div class="card resumo">';
  t.resumo.forEach(function (s, si) {
    if (s.h) h += '<h2>' + esc(s.h) + '</h2>';
    s.blocos.forEach(function (b, bi) {
      h += (r.sec === si && r.blk === bi)
        ? '<div class="alvo" id="alvo">' + b.html + '</div>'
        : b.html;
    });
  });
  h += '</div>';

  var outros = DADOS.temas.filter(function (x) { return x.resumo; });
  if (outros.length > 1) {
    h += '<h3>Outros resumos</h3><div class="chips">';
    outros.forEach(function (x) {
      h += '<button class="chip' + (x.slug === r.tema ? ' on' : '') +
           '" data-act="resumo" data-slug="' + esc(x.slug) + '">' + esc(x.titulo) + '</button>';
    });
    h += '</div>';
  }
  return h;
}

/* =========================================================================
   EVENTOS — delegação única
   ========================================================================= */
app.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act'), r = S.round;
  ev.preventDefault();

  if (act === 'resumo') {
    var sec = el.getAttribute('data-sec'), blk = el.getAttribute('data-blk');
    if (S.view !== 'resumo') {
      S.voltar = S.view;
      S.voltarLabel = S.view === 'rodada' ? 'Voltar à questão'
                    : S.view === 'resultado' ? 'Voltar ao resultado' : 'Voltar ao início';
    }
    S.resumo = { tema: el.getAttribute('data-slug'),
                 sec: sec == null ? null : +sec, blk: blk == null ? null : +blk };
    S.view = 'resumo';
    return render();
  }
  if (act === 'voltar') { S.view = S.voltar || 'home'; return render(); }

  if (act === 'home') { pararRelogio(); S.round = null; S.view = 'home'; limparEndereco(); return render(); }
  if (act === 'setup') { S.view = 'setup'; return render(); }
  if (act === 'treino') { treinoTema(el.getAttribute('data-slug')); return render(); }
  if (act === 'revisao') { rodadaRevisao(); return render(); }

  if (act === 'toggle') {
    var s = el.getAttribute('data-slug');
    lerCampos(); S.pick[s] = !S.pick[s]; return render();
  }
  if (act === 'alltemas') { lerCampos(); DADOS.temas.forEach(function (t) { S.pick[t.slug] = true; }); return render(); }
  if (act === 'notemas') { lerCampos(); S.pick = {}; return render(); }
  if (act === 'pickfila') {
    lerCampos(); S.pick = {};
    F.forEach(function (id) { if (BY[id]) S.pick[BY[id].tema] = true; });
    return render();
  }
  if (act === 'simstart') {
    lerCampos();
    var pool = [];
    DADOS.temas.forEach(function (t) {
      if (S.pick[t.slug]) t.questoes.forEach(function (q) { pool.push(BY[q.id]); });
    });
    if (!pool.length) return;
    var n = Math.max(1, Math.min(S.bloco, pool.length));
    novaRodada('simulado', embaralhar(pool).slice(0, n), 'Simulado', S.minutos);
    return render();
  }

  if (act === 'conf') { r.conf = el.getAttribute('data-v'); return render(); }

  if (act === 'opt') {
    var q = r.qs[r.i], i = +el.getAttribute('data-i');
    if (r.ans[q.id] != null && r.mode !== 'simulado') return;
    r.ans[q.id] = { sel: i, conf: r.conf || 'sure' };
    if (r.mode !== 'simulado') registrar([{ q: q, sel: i, conf: r.conf || 'sure' }]);
    r.conf = null;
    return render();
  }

  if (act === 'next') { if (r.i < r.qs.length - 1) { r.i++; r.conf = null; } return render(); }
  if (act === 'prev') { if (r.i > 0) { r.i--; r.conf = null; } return render(); }
  if (act === 'goto') { r.i = +el.getAttribute('data-i'); r.conf = null; return render(); }

  if (act === 'corrigir') {
    if (r.mode === 'simulado') return corrigirSimulado(false);
    pararRelogio(); S.filtro = 'todas'; S.view = 'resultado'; return render();
  }
  if (act === 'filtro') { S.filtro = el.getAttribute('data-v'); return render(); }

  if (act === 'reset') {
    if (!confirm('Apagar todo o progresso salvo neste navegador?')) return;
    H = {}; F = []; R = 0; save(K.h, H); save(K.f, F); save(K.r, R);
    return render();
  }
});

// guarda o que está digitado nos campos antes de um re-render
function lerCampos() {
  var b = document.getElementById('bloco'), m = document.getElementById('minutos');
  if (b) S.bloco = Math.max(1, +b.value || 1);
  if (m) S.minutos = Math.max(0, +m.value || 0);
}

// atalhos de teclado
document.addEventListener('keydown', function (ev) {
  if (S.view !== 'rodada' || !S.round) return;
  var r = S.round, q = r.qs[r.i];
  if (ev.key === 'ArrowRight' && r.i < r.qs.length - 1) { r.i++; r.conf = null; render(); }
  else if (ev.key === 'ArrowLeft' && r.i > 0) { r.i--; r.conf = null; render(); }
  else if (/^[1-5a-eA-E]$/.test(ev.key)) {
    var i = /[1-5]/.test(ev.key) ? +ev.key - 1 : 'abcde'.indexOf(ev.key.toLowerCase());
    if (i < 0 || i >= q.opts.length) return;
    if (r.ans[q.id] != null && r.mode !== 'simulado') return;
    r.ans[q.id] = { sel: i, conf: r.conf || 'sure' };
    if (r.mode !== 'simulado') registrar([{ q: q, sel: i, conf: r.conf || 'sure' }]);
    r.conf = null; render();
  }
});

/* ---------- link direto (vindo do plano de estudo) ----------
   #treino=<slug>[&n=20]              treino do tema (n = só as n primeiras, nunca vistas antes)
   #simulado=<slug>,<slug>[&n=40&min=45]  abre a montagem do simulado já marcada
   #revisao                           abre a fila de revisão                       */
function lerEndereco() {
  var h = (typeof location !== 'undefined' && location.hash) ? location.hash.replace(/^#/, '') : '';
  var p = {};
  if (!h) return p;
  h.split('&').forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf('=');
    try {
      p[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1));
    } catch (e) {}
  });
  return p;
}
function abrirPorEndereco() {
  var p = lerEndereco();
  if (p.treino) {
    if (!temaPorSlug(p.treino)) return false;
    treinoTema(p.treino, Math.max(0, parseInt(p.n, 10) || 0));
    return true;
  }
  if (p.simulado != null) {
    var slugs = p.simulado.split(',').filter(function (s) { return !!temaPorSlug(s); });
    if (!slugs.length) return false;
    S.pick = {};
    slugs.forEach(function (s) { S.pick[s] = true; });
    if (parseInt(p.n, 10) > 0) S.bloco = parseInt(p.n, 10);
    if (p.min != null && p.min !== '') S.minutos = Math.max(0, parseInt(p.min, 10) || 0);
    S.view = 'setup';
    return true;
  }
  if (p.revisao != null) { rodadaRevisao(); return !!S.round; }
  return false;
}
// voltar ao início limpa o endereço, para um F5 não reabrir a mesma rodada
function limparEndereco() {
  try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
window.addEventListener('hashchange', function () {
  if (lerEndereco().treino || lerEndereco().simulado != null || lerEndereco().revisao != null) {
    pararRelogio();
    if (abrirPorEndereco()) render();
  }
});

// começa com todos os temas marcados no simulado
DADOS.temas.forEach(function (t) { S.pick[t.slug] = true; });
abrirPorEndereco();
render();
</script>
