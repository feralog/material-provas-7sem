te <strong>polimicrobiano<\/strong>, e pode ser desencadeado por manipulação uterina.<\/p>"},{"html":"<p>O custo biológico é o que transforma a DIP num tema de prova e de plantão: a inflamação tubária produz cicatrização e aderências, e o dano persiste depois de resolvido o episódio agudo. O resultado é infertilidade por fator tubo-peritoneal, aumento do risco de gestação ectópica e dor pélvica crônica.<\/p>"},{"html":"<blockquote><p><strong>Mensagem-chave:<\/strong> o episódio agudo passa; a trompa cicatrizada não volta. Quase toda a conduta na DIP se organiza em torno de impedir a sequela, não apenas de curar a infecção.<\/p><\/blockquote>"}]},{"h":"A origem: do trato inferior para o superior","blocos":[{"html":"<p>O trato genital inferior tem uma defesa química. O <strong>pH ácido<\/strong> mantido pelos <strong>lactobacilos protetores<\/strong> é o que impede a colonização por patógenos. Quando essa acidez cai, os lactobacilos diminuem e abre-se espaço para supercrescimento patogênico — situação provocada por contato com <strong>sêmen<\/strong>, <strong>duchas íntimas<\/strong> e <strong>alterações hormonais<\/strong>.<\/p>"},{"html":"<p>Perdida a barreira, instalam-se vaginite e cervicite. Esse é o primeiro degrau da DIP: a infecção do colo é a porta e a via canalicular é o caminho.<\/p>"},{"html":"<p class=\"figleg\">A perda da acidez vaginal abre a via canalicular para o trato superior<\/p>"},{"html":"<h3>As vaginites que importam<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Vaginite<\/th><th>Secreção<\/th><th>Risco de DIP<\/th><th>Tratamento<\/th><\/tr><\/thead><tbody><tr><td>Vaginose bacteriana<\/td><td>Rala, acinzentada, odor fétido (piora na menstruação e no coito)<\/td><td>Aumenta DIP e parto prematuro<\/td><td>Metronidazol, clindamicina<\/td><\/tr><tr><td>Tricomoníase<\/td><td>Abundante, verde-amarelada, espumosa<\/td><td>DIP e prematuridade<\/td><td>Metronidazol, tinidazol<\/td><\/tr><tr><td>Candidíase<\/td><td>Espessa, branca, em grumos<\/td><td>Sem risco grave de DIP<\/td><td>Fluconazol, miconazol<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A candidíase é a exceção útil: dá muito sintoma (prurido intenso, vermelhidão) e pouco risco. A vaginose bacteriana faz o contrário — costuma ser assintomática ou dar irritação leve, e é a que mais empurra a paciente para a DIP.<\/p>"}]},{"h":"Os agentes e a cascata fisiopatológica","blocos":[{"html":"<p>Dois agentes dominam a etiologia, com personalidades opostas.<\/p>"},{"html":"<h4>Chlamydia trachomatis — a ameaça silenciosa<\/h4>"},{"html":"<p>Bactéria <strong>intracelular obrigatória<\/strong>. Cerca de <strong>70% dos casos são assintomáticos<\/strong>, o que explica por que tanta DIP chega já com dano tubário. O diagnóstico exige <strong>teste molecular (PCR)<\/strong> da secreção cervical; bacterioscopia não serve.<\/p>"},{"html":"<h4>Neisseria gonorrhoeae — a ameaça exuberante<\/h4>"},{"html":"<p><strong>Diplococo Gram-negativo<\/strong>. É altamente sintomática: exsudato purulento visível, colo edemaciado e friável. Cultiva em <strong>meio Thayer-Martin modificado<\/strong>.<\/p>"},{"html":"<p>A cascata segue sempre a mesma direção anatômica:<\/p>"},{"html":"<p><strong>Cervicite → endometrite<\/strong> (discreta, muitas vezes fugaz) <strong>→ salpingite / ooforite<\/strong> (conteúdo purulento, hidrossalpinge) <strong>→ abscesso tubo-ovariano → peritonite e síndrome de Fitz-Hugh-Curtis<\/strong>.<\/p>"},{"html":"<p class=\"figleg\">Cascata fisiopatológica da ascensão da infecção<\/p>"}]},{"h":"Fatores de risco e quadro clínico","blocos":[{"html":"<p>O perfil de risco se organiza em quatro blocos:<\/p>"},{"html":"<ul><li><strong>Histórico prévio<\/strong> — episódio anterior de DIP ou IST documentada.<\/li><li><strong>Idade crítica<\/strong> — adolescentes e jovens de 17 a 21 anos têm o dobro de chance de diagnóstico e recorrência mais rápida.<\/li><li><strong>Comportamento<\/strong> — múltiplos parceiros (2 ou mais por ano), sexo desprotegido, ducha íntima frequente.<\/li><li><strong>DIU<\/strong> — a inserção aumenta o risco em 3 a 5 vezes, <strong>mas apenas se houver cervicite no momento da inserção<\/strong>. Sem cervicite, o risco não se justifica e o método não precisa ser evitado.<\/li><\/ul>"},{"html":"<p>O quadro clínico é um iceberg. Acima da linha d'água está a <strong>apresentação aguda<\/strong>: dor intensa no abdome inferior de piora gradual, febre alta acima de 38,9 °C, náuseas, vômitos e exsudato purulento esverdeado. Abaixo dela, muito mais comum, está a <strong>apresentação subaguda ou silenciosa<\/strong>: dor leve a moderada, especialmente após a menstruação, sangramento irregular em pequena quantidade (<em>spotting<\/em>), dispareunia profunda, disúria e inflamação assintomática.<\/p>"},{"html":"<blockquote><p>É a forma silenciosa que produz sequela. O diagnóstico da DIP aguda é difícil justamente pela variação inespecífica, e o atraso é o que converte uma infecção tratável em infertilidade permanente.<\/p><\/blockquote>"}]},{"h":"Critérios diagnósticos do Ministério da Saúde","blocos":[{"html":"<p>O diagnóstico é <strong>clínico<\/strong> e obedece a uma aritmética fixa: <strong>3 critérios maiores + 1 critério menor = DIP confirmada<\/strong>.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Grupo<\/th><th>Exigência<\/th><th>Itens<\/th><\/tr><\/thead><tbody><tr><td><strong>Maiores<\/strong><\/td><td>Os 3 são necessários<\/td><td>Dor no hipogástrio; dor à palpação dos anexos; dor à mobilização do colo uterino (sinal de Chandelier)<\/td><\/tr><tr><td><strong>Menores<\/strong><\/td><td>Pelo menos 1<\/td><td>Temperatura &gt; 37,5 °C; secreção cervical anormal; massa pélvica; &gt; 5 leucócitos por campo; leucocitose, PCR ou VHS elevada; comprovação de gonococo ou clamídia<\/td><\/tr><tr><td><strong>Elaborados<\/strong><\/td><td>Confirmam isoladamente<\/td><td>Endometrite histopatológica; abscesso tubo-ovariano em imagem; evidência laparoscópica<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">O dashboard diagnóstico: maiores, menores e elaborados<\/p>"},{"html":"<p>Repare em dois detalhes que costumam ser cobrados: o limiar de febre dos critérios menores é <strong>37,5 °C<\/strong> (e não 38 °C), e os critérios elaborados dispensam a soma — um deles já fecha o diagnóstico sozinho.<\/p>"},{"html":"<h3>Investigação complementar<\/h3>"},{"html":"<p><strong>Laboratório obrigatório:<\/strong> hemograma completo, PCR/VHS, cultura endocervical em Thayer-Martin, PCR para clamídia, exame de urina (afastar ITU) e <strong>beta-hCG (afastar ectópica)<\/strong>.<\/p>"},{"html":"<p><strong>Imagem e procedimentos:<\/strong> ultrassonografia transvaginal, que mostra camada líquida preenchendo a trompa ou o abscesso tubo-ovariano; <strong>culdocentese<\/strong>, punção do fundo de saco de Douglas para diagnóstico rápido; <strong>laparoscopia<\/strong>, o padrão-ouro visual.<\/p>"},{"html":"<h3>O dilema do abdome agudo<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th><\/th><th>DIP<\/th><th>Gravidez ectópica rota<\/th><th>Apendicite aguda<\/th><\/tr><\/thead><tbody><tr><td>Dor<\/td><td>Hipogástrica, bilateral<\/td><td>Pélvica, súbita e intensa<\/td><td>Migratória: umbigo → fossa ilíaca direita<\/td><\/tr><tr><td>Corrimento<\/td><td>Purulento, comum<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>Beta-hCG<\/td><td>Negativo<\/td><td><strong>Positivo obrigatório<\/strong><\/td><td>Negativo<\/td><\/tr><tr><td>Mobilização do colo<\/td><td>Extremamente dolorosa<\/td><td>—<\/td><td><strong>Tipicamente indolor<\/strong><\/td><\/tr><tr><td>Alerta<\/td><td>—<\/td><td>Sinais de choque hemorrágico<\/td><td>Febre precoce, náusea e vômito<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>O diferencial anatômico inclui ainda infecção urinária, endometrioma roto e torção ovariana.<\/p>"}]},{"h":"Estadiamento de Monif","blocos":[{"html":"<p>Monif organiza a DIP aguda pela <strong>extensão<\/strong> e pela <strong>presença e integridade do abscesso<\/strong>. É o divisor de águas entre ambulatório e internação.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Estágio<\/th><th>Anatomia<\/th><th>Marcador<\/th><th>Conduta típica<\/th><\/tr><\/thead><tbody><tr><td><strong>I<\/strong><\/td><td>Endometrite / salpingite<\/td><td>Sem peritonite<\/td><td>Ambulatório se estável<\/td><\/tr><tr><td><strong>II<\/strong><\/td><td>Endometrite / salpingite<\/td><td><strong>Com peritonite<\/strong><\/td><td>Internação hospitalar<\/td><\/tr><tr><td><strong>III<\/strong><\/td><td>Abscesso tubo-ovariano <strong>íntegro<\/strong><\/td><td>Massa / coleção<\/td><td>Internação; ATB IV; considerar drenagem<\/td><\/tr><tr><td><strong>IV<\/strong><\/td><td>Abscesso tubo-ovariano <strong>roto<\/strong><\/td><td>Peritonite / sepse<\/td><td><strong>Cirurgia imediata<\/strong> + ATB IV<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Estadiamento de Monif: anatomia, marcador e conduta<\/p>"},{"html":"<p>O estágio IV é emergência: risco de peritonite difusa, sepse e choque, com antibiótico de amplo espectro associado a avaliação cirúrgica imediata. A conduta, contudo, nunca depende só do estágio — pesa também estabilidade hemodinâmica, gestação, tolerância oral e a possibilidade de excluir emergência cirúrgica.<\/p>"},{"html":"<h3>Critérios de internação<\/h3>"},{"html":"<blockquote><p><strong>Internar quando houver:<\/strong> (1) Monif II ou superior — peritonite ou abscesso; (2) <strong>gestação confirmada<\/strong>, pelo risco de abortamento, corioamnionite e prematuridade; (3) intolerância oral ou vômitos intensos; (4) <strong>ausência de resposta em 72 h<\/strong> do esquema ambulatorial; (5) estado geral grave, febre acima de 38,5 °C, leucocitose acentuada ou sinais de sepse; (6) impossibilidade de excluir apendicite aguda ou gestação ectópica.<\/p><\/blockquote>"},{"html":"<p>Na ausência de qualquer critério de gravidade, a conduta é antibiótico por via oral ou intramuscular com <strong>retorno obrigatório em 72 horas<\/strong>.<\/p>"}]},{"h":"Tratamento antimicrobiano","blocos":[{"html":"<p>O esquema precisa ser de amplo espectro e cobrir simultaneamente <strong>clamídia, gonococo e anaeróbios<\/strong>, por <strong>14 dias<\/strong>.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Modalidade<\/th><th>Primeira opção (PCDT 2020 / MS)<\/th><th>Alternativa<\/th><\/tr><\/thead><tbody><tr><td><strong>Ambulatorial<\/strong> (Monif I)<\/td><td>Ceftriaxona 500 mg IM dose única + doxiciclina 100 mg VO 12/12h (14 d) + metronidazol 500 mg VO 12/12h (14 d)<\/td><td>Cefotaxima 500 mg IM dose única + doxiciclina + metronidazol, mesmas doses<\/td><\/tr><tr><td><strong>Hospitalar<\/strong> (Monif II, III e IV)<\/td><td>Ceftriaxona 1 g IV 1×/dia + doxiciclina 100 mg VO 12/12h + metronidazol 400 mg IV 12/12h (14 d)<\/td><td><strong>A:<\/strong> clindamicina 900 mg IV 8/8h + gentamicina 3–5 mg/kg/dia IV · <strong>B:<\/strong> ampicilina/sulbactam 3 g IV 6/6h + doxiciclina 100 mg VO 12/12h<\/td><\/tr><tr><td><strong>Parcerias<\/strong> (últimos 60 dias)<\/td><td>Ceftriaxona 500 mg IM + azitromicina 1 g VO, dose única, <strong>empírico<\/strong><\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Esquemas ambulatorial e hospitalar do PCDT 2020<\/p>"},{"html":"<p>No esquema ambulatorial, <strong>reavaliar em 72 horas<\/strong>. No hospitalar, a transição para via oral é feita após <strong>24 horas afebril<\/strong>, completando os 14 dias.<\/p>"},{"html":"<p>Dois pontos de conduta que não são negociáveis:<\/p>"},{"html":"<ul><li><strong>Tratamento das parcerias dos últimos 60 dias é mandatório<\/strong>, mesmo nas assintomáticas. Tratar apenas a mulher garante reinfecção e falha terapêutica.<\/li><li><strong>Na gestação, doxiciclina e quinolonas são contraindicadas<\/strong>, e a internação é obrigatória com antibiótico parenteral.<\/li><\/ul>"},{"html":"<p>Alta clínica e cura baseiam-se no desaparecimento total dos sintomas. O seguimento ambulatorial é a reavaliação em 72 horas, com <strong>abstinência sexual<\/strong> orientada e reforço do uso de preservativo.<\/p>"},{"html":"<blockquote><p><strong>Limiar baixo para tratar:<\/strong> o antibiótico empírico deve ser iniciado <strong>imediatamente diante da suspeita clínica<\/strong>, sem aguardar ultrassom, PCR ou cultura. Quarenta e oito horas de atraso <strong>triplicam<\/strong> o risco de infertilidade. Errar pelo excesso custa um ciclo de antibiótico; errar pela demora custa a trompa.<\/p><\/blockquote>"}]},{"h":"Complicações e sequelas","blocos":[{"html":"<h4>Precoces (agudas)<\/h4>"},{"html":"<ul><li><strong>Abscesso tubo-ovariano<\/strong> — massa purulenta anexial complexa, com risco de rotura (emergência cirúrgica, Monif IV).<\/li><li><strong>Síndrome de Fitz-Hugh-Curtis<\/strong> — peri-hepatite por disseminação de clamídia ou gonococo, com dor no quadrante superior direito do abdome e aderências em <strong>\"corda de violino\"<\/strong> na cápsula de Glisson.<\/li><li><strong>Pelviperitonite e sepse<\/strong> — disseminação purulenta peritoneal, podendo evoluir para instabilidade hemodinâmica e choque séptico.<\/li><\/ul>"},{"html":"<h4>Tardias (crônicas)<\/h4>"},{"html":"<ul><li><strong>Infertilidade por fator tubário<\/strong> — 10% a 50% das mulheres; o risco sobe exponencialmente a cada episódio e chega a cerca de <strong>75% após três episódios<\/strong>.<\/li><li><strong>Gravidez ectópica tubária<\/strong> — risco aumentado em <strong>6 a 10 vezes<\/strong> pelas aderências e pela destruição do epitélio ciliar.<\/li><li><strong>Dor pélvica crônica<\/strong> — 20% a 40% das pacientes, por bridas e aderências pélvicas permanentes.<\/li><\/ul>"},{"html":"<p class=\"figleg\">A teia de complicações: trompas, fígado, gravidez ectópica e dor crônica<\/p>"}]},{"h":"Prevenção, rastreio e as quatro regras de ouro","blocos":[{"html":"<p>Devem ser rastreadas proativamente para clamídia e gonococo: <strong>mulheres sexualmente ativas com 25 anos ou menos<\/strong>, mulheres com <strong>2 ou mais parceiros por ano<\/strong>, mulheres com <strong>parceiro novo<\/strong> (início há menos de 90 dias) e parceiros com histórico de secreção uretral. O rastreio sistemático e a educação preventiva são vastamente mais econômicos que tratar complicação cirúrgica e infertilidade.<\/p>"},{"html":"<ol><li><strong>Suspeição alta.<\/strong> Erre pelo excesso — a apresentação silenciosa é comum. Dor abdominal baixa somada a mobilização cervical dolorosa já demanda investigação e ação.<\/li><li><strong>Diagnóstico estruturado.<\/strong> Use a fórmula clínica 3 maiores + 1 menor. Não espere a paciente chocar para agir; a inflamação está destruindo tecido agora.<\/li><li><strong>Trate precocemente.<\/strong> Atrasar o antibiótico aguardando culturas aumenta exponencialmente o risco de aderências severas, gravidez ectópica e infertilidade.<\/li><li><strong>Trate a parceria.<\/strong> Tratar apenas a mulher garante reinfecção rápida. Parceiros dos últimos 60 dias recebem tratamento empírico.<\/li><\/ol>"},{"html":"<blockquote><p>A DIP é o <strong>marcador biológico de exposição a ISTs<\/strong>. Toda paciente diagnosticada merece investigação completa para outras infecções sexualmente transmissíveis e aconselhamento preventivo.<\/p><\/blockquote>"}]}]},{"slug":"doencas-mamarias-benignas","titulo":"Doenças Mamárias Benignas","disciplina":"GO","eyebrow":"Ginecologia e Obstetrícia · Mastologia","questoes":[{"id":"69b88daca3","q":"Na classificação didática das afecções benignas da mama, o grupo das alterações funcionais benignas (AFBM) inclui:","opts":["Dor cíclica, nodularidade difusa e mastalgia","Polimastia, politelia e mamilo invertido congênito","Fibroadenoma, tumor filoides e papiloma intraductal","Mastite puerperal, abscesso e mastite periductal"],"c":0,"exp":"As AFBM são a expressão funcional da mama à variação hormonal e englobam dor cíclica, nodularidade difusa e mastalgia. Polimastia/politelia são alterações congênitas; fibroadenoma e papiloma são tumores benignos; mastite e abscesso são alterações inflamatórias.","ref":[0,2]},{"id":"82132bc6b6","q":"Em relação à mastalgia, a conduta inicialmente correta é:","opts":["Fazer o diagnóstico clínico e pedir exames só se houver achado no exame físico","Solicitar mamografia de rastreamento e ultrassom para todas as pacientes","Indicar punção aspirativa por agulha fina diante de qualquer quadro de dor","Encaminhar a excisão cirúrgica ampla mesmo sem nódulo palpável identificado"],"c":0,"exp":"A mastalgia é diagnóstico clínico; exames complementares só são pedidos quando há achado ao exame físico. Dor isolada, sem nódulo ou outro sinal, raramente representa câncer e não justifica biópsia nem cirurgia de imediato.","ref":[1,1]},{"id":"9cc027a9c1","q":"Qual é a característica clínica típica do fibroadenoma?","opts":["Nódulo móvel, bem delimitado, não aderido, indolor e de crescimento lento","Massa fixa, aderida aos planos profundos e de crescimento rápido","Nódulo doloroso com retração da papila e descarga sanguinolenta","Endurecimento difuso com edema e eritema da pele adjacente"],"c":0,"exp":"O fibroadenoma é único ou múltiplo, bem delimitado, móvel, não aderido, às vezes lobulado, de crescimento lento, consistência fibroelástica e habitualmente indolor. Fixação, retração papilar, espiculação e eritema apontam para outras hipóteses, como carcinoma ou processo inflamatório.","ref":[2,1]},{"id":"3c55527f14","q":"O fibroadenoma é um tumor benigno cuja incidência é maior:","opts":["Em mulheres com menos de 35 anos de idade","Em mulheres na pós-menopausa e em idosas","Exclusivamente em adolescentes pré-púberes","Em homens adultos acima dos 50 anos de idade"],"c":0,"exp":"O fibroadenoma predomina em mulheres jovens, com incidência maior abaixo dos 35 anos. Existem formas raras (juvenil, gigante, complexa e extramamária), mas a doença é essencialmente do período reprodutivo, não da pós-menopausa nem do homem.","ref":[2,0]},{"id":"d69a1857e8","q":"Sobre a dor no fibroadenoma, é correto afirmar que:","opts":["Costuma ser indolor, mas pode doer na gravidez e na lactação","É sempre doloroso, com piora progressiva ao longo dos anos","A dor é o sinal mais precoce de transformação maligna do nódulo","Aparece apenas quando o nódulo está fixo à musculatura peitoral"],"c":0,"exp":"O fibroadenoma é indolor, exceto durante a gravidez e a lactação, quando o estímulo hormonal pode torná-lo doloroso. Dor não é marcador de malignidade desse tumor, e fixação aos planos profundos não é uma característica dele.","ref":[2,1]},{"id":"07343e21a0","q":"Na mamografia, a calcificação grosseira 'em pipoca' dentro de um nódulo é característica de:","opts":["Fibroadenoma em involução, achado tipicamente benigno","Carcinoma ductal in situ com necrose central calcificada","Tumor filoides de alto grau com áreas de hemorragia","Cisto oleoso da esteatonecrose pós-traumática da mama"],"c":0,"exp":"A calcificação grosseira e coalescente 'em pipoca' é o padrão clássico de fibroadenoma em involução, um achado benigno. As calcificações do carcinoma ductal in situ são finas, lineares e ramificadas; o cisto oleoso cursa com calcificação anelar, de parede fina.","cap":"Mamografia com calcificação em pipoca no fibroadenoma","ref":[2,5]},{"id":"b70a6b8987","q":"Ao ultrassom, o fibroadenoma típico se apresenta como nódulo:","opts":["Sólido, hipoecoico, bem delimitado e de contornos regulares","Cístico, anecoico, com reforço acústico posterior intenso","Sólido, espiculado, com sombra acústica e margens irregulares","Misto, com áreas císticas internas e paredes grosseiramente espessadas"],"c":0,"exp":"O fibroadenoma é sólido, hipoecoico, bem delimitado e de contornos regulares. O cisto anecoico com reforço posterior é o cisto simples; margens espiculadas e sombra acústica são achados suspeitos, mais compatíveis com carcinoma.","cap":"Ultrassom mostrando nódulo sólido bem delimitado","ref":[2,3]},{"id":"2d53f96421","q":"Na propedêutica do fibroadenoma, a punção aspirativa por agulha fina (PAAF):","opts":["Mostra histologia característica que confirma a natureza benigna","É contraindicada por risco de disseminação tumoral pela agulha","Sempre traz material purulento compatível com abscesso mamário","Substitui a biópsia cirúrgica no diagnóstico de todas as lesões"],"c":0,"exp":"A PAAF do fibroadenoma mostra histologia característica (células epiteliais e estromais em padrão típico), ajudando a confirmar a natureza benigna. Ela não é contraindicada no fibroadenoma e não é o material purulento de abscesso.","ref":[2,2]},{"id":"45caa4a918","q":"No fibroadenoma simples, o tratamento preconizado é:","opts":["Seguimento clínico ou excisão, com cirurgia se complexo ou suspeito","Excisão cirúrgica ampla com margem de um a dois centímetros","Antibioticoterapia prolongada associada à drenagem do nódulo","Radioterapia adjuvante seguida de hormonioterapia de bloqueio"],"c":0,"exp":"O fibroadenoma simples pode ser acompanhado ou submetido a excisão; nas formas complexas ou suspeitas, a cirurgia está indicada. A excisão ampla com margem de 1 a 2 cm é o tratamento do tumor filoides, não do fibroadenoma.","ref":[2,2]},{"id":"a88adc78e1","q":"São consideradas formas raras de fibroadenoma:","opts":["As variantes juvenil, gigante, complexa e extramamária","As variantes sólida, cística, calcificada e dolorosa","As variantes única, múltipla, móvel e lobulada","As variantes dolorosa, fixa, aderida e espiculada"],"c":0,"exp":"As formas raras do fibroadenoma são a juvenil, a gigante, a complexa e a extramamária. As demais opções descrevem características clínicas comuns do tumor (único/múltiplo, móvel, lobulado), não formas raras.","ref":[2,0]},{"id":"c00b66561e","q":"O tumor filoides (phyllodes) é um tumor benigno que se destaca por:","opts":["Crescimento exponencial rápido, indolor e com possível variante maligna","Crescimento lento, doloroso e com regressão espontânea frequente","Crescimento rápido, doloroso e sempre de natureza benigna","Crescimento lento, indolor e sem risco de recidiva local"],"c":0,"exp":"O tumor filoides tem crescimento exponencial rápido, é indolor, pode apresentar variante maligna e recidiva local com frequência. Diferencia-se assim do fibroadenoma, que cresce lentamente e é tipicamente indolor.","ref":[3,0]},{"id":"267afd61ee","q":"O tumor filoides origina-se:","opts":["No tecido conjuntivo extraductal da mama","No epitélio dos ductos mamários terminais","Nas células mioepiteliais dos lóbulos","Na pele e na papila da região areolar"],"c":0,"exp":"O tumor filoides é de origem extraductal, desenvolvendo-se no tecido conjuntivo (estroma) da mama. Os ductos e lóbulos estão envolvidos no fibroadenoma e no papiloma, não na gênese do filoides.","ref":[3,0]},{"id":"f6f5fb407c","q":"Sobre o comportamento do tumor filoides, é correto afirmar que:","opts":["Apresenta recidivas locais frequentes mesmo após a ressecção","Nunca recidiva após a excisão cirúrgica completa da lesão","Metastatiza precocemente para linfonodos axilares em todos os casos","Regride espontaneamente sem necessidade de qualquer tratamento"],"c":0,"exp":"O tumor filoides tem recidivas locais frequentes, o que justifica a excisão ampla. A maioria é benigna e não metastatiza de rotina; a regressão espontânea não ocorre e a lesão não deve ser apenas observada.","ref":[3,0]},{"id":"0c284880fb","q":"O tratamento cirúrgico do tumor filoides deve ser:","opts":["Excisão ampla com margem de um a dois centímetros","Enucleação simples, sem margem de segurança tecidual","Ressecção apenas do ducto que apresenta secreção papilar","Drenagem percutânea seguida de antibiótico de amplo espectro"],"c":0,"exp":"O tumor filoides exige excisão ampla com margem de 1 a 2 cm por causa da alta taxa de recidiva local. A ressecção ductal é a conduta do papiloma intraductal, e a drenagem, do abscesso.","ref":[8,0]},{"id":"d038d522ff","q":"Nos exames de imagem, o tumor filoides geralmente apresenta:","opts":["Achados mamográficos e ultrassonográficos inespecíficos","Microcalcificações agrupadas altamente sugestivas de malignidade","Cistos simples com reforço acústico posterior característico","Calcificações em pipoca dentro do nódulo sólido bem delimitado"],"c":0,"exp":"Na mamografia e no ultrassom, o tumor filoides costuma ter achados inespecíficos, o que dificulta o diagnóstico por imagem. A calcificação em pipoca é do fibroadenoma, e microcalcificações agrupadas apontam para carcinoma.","ref":[3,1]},{"id":"7a3a0b84db","q":"Sobre a punção por agulha grossa (core biopsy) no tumor filoides:","opts":["Pode dar diagnóstico diferencial com carcinoma pela celularidade","É contraindicada por sempre causar sangramento local importante","Confirma o diagnóstico de certeza em todos os casos benignos","Substitui a análise histológica definitiva da peça cirúrgica"],"c":0,"exp":"A core biopsy do tumor filoides pode trazer diagnóstico diferencial com carcinoma, pela hipercelularidade estromal. Por isso, lesões suspeitas exigem avaliação histológica completa, e a peça cirúrgica ainda é importante para o diagnóstico definitivo.","ref":[3,1]},{"id":"6dee1efb39","q":"A imagem mostra uma massa mamária volumosa, indolor e de crescimento rápido. O diagnóstico mais provável é:","opts":["Tumor filoides (phyllodes) com possível variante maligna","Fibroadenoma simples em mulher jovem com menos de 35 anos","Cisto simples com conteúdo anecoico e paredes finas","Mastite puerperal com eritema difuso da pele da mama"],"c":0,"exp":"Massa volumosa, indolor e de crescimento exponencial rápido é a apresentação típica do tumor filoides. O fibroadenoma cresce lentamente, o cisto simples não forma massa palpável desse porte e a mastite cursa com eritema e dor.","cap":"Apresentação clínica de tumor filoides","ref":[3,3]},{"id":"b71dd0bf22","q":"Na mamografia, o tumor filoides costuma aparecer como:","opts":["Grande massa de contornos bem delimitados e achados inespecíficos","Nódulo espiculado com retração da papila e microcalcificações","Grupo de calcificações lineares finas ramificadas suspeitas","Assimetria global do tecido fibroglandular sem massa identificável"],"c":0,"exp":"O tumor filoides aparece como massa grande, de contornos bem delimitados e aspecto inespecífico. Espiculação, retração papilar e microcalcificações lineares finas são achados de malignidade, não do filoides.","cap":"Mamografia do tumor filoides","ref":[3,4]},{"id":"a4458a4619","q":"A manifestação clínica típica do papiloma intraductal é:","opts":["Secreção papilar serossanguinolenta pelo mamilo","Nódulo sólido móvel e indolor em mulher jovem","Dor cíclica associada à nodularidade difusa bilateral","Eritema, calor e edema difuso da pele da mama"],"c":0,"exp":"O papiloma intraductal se manifesta por secreção papilar serossanguinolenta, geralmente uniductal. Nódulo móvel indolor é típico do fibroadenoma; dor cíclica e eritema difuso correspondem a AFBM e mastite, respectivamente.","ref":[4,0]},{"id":"30782250a3","q":"O tratamento do papiloma intraductal benigno consiste em:","opts":["Ressecção cirúrgica do ducto mamário acometido","Acompanhamento clínico sem nenhuma intervenção","Antibioticoterapia de amplo espectro por quatorze dias","Radioterapia externa da região retroareolar da mama"],"c":0,"exp":"O papiloma intraductal benigno é tratado com excisão do ducto que drena a secreção. Observação apenas é a conduta da descarga fisiológica; antibiótico trata processos infecciosos, não o papiloma.","ref":[4,0]},{"id":"68abdf3ed7","q":"Define-se descarga papilar como:","opts":["Secreção espontânea do mamilo, uni ou bilateral, uni ou multiductal","Sangramento traumático do mamilo após amamentação prolongada","Secreção que só aparece mediante expressão forçada da mama","Perda involuntária de leite fora do período de amamentação"],"c":0,"exp":"Descarga papilar é a secreção espontânea do mamilo, unilateral ou bilateral, uniductal ou multiductal. O que define é o caráter espontâneo, e não apenas a expressão forçada ou o contexto de amamentação.","ref":[4,1]},{"id":"9de6a9c855","q":"Na descarga papilar fisiológica, a conduta adequada é:","opts":["Acompanhamento clínico, sem necessidade de cirurgia","Excisão imediata do ducto que drena a secreção","Mastectomia total da mama acometida de imediato","Antibioticoterapia empírica para todas as pacientes"],"c":0,"exp":"A descarga fisiológica é tratada com acompanhamento. A excisão do ducto está reservada para o papiloma benigno, e a investigação completa com cirurgia, para os casos de suspeita de malignidade.","ref":[4,2]},{"id":"0b51715d03","q":"A imagem mostra secreção papilar espontânea. Qual sinal clínico impõe investigação completa?","opts":["Secreção sanguinolenta unilateral e espontânea pelo mamilo","Descarga bilateral leitosa em mulher em idade fértil","Secreção esverdeada multiductal em ambas as mamas","Descarga que aparece apenas com a expressão do mamilo"],"c":0,"exp":"Secreção sanguinolenta, unilateral e espontânea é sinal de alerta que impõe investigação completa (imagem e eventual cirurgia). Descarga leitosa bilateral fisiológica e secreção esverdeada multiductal são, em geral, benignas.","cap":"Secreção espontânea pelo mamilo","ref":[4,4]},{"id":"995b97f537","q":"Fazem parte das alterações inflamatórias benignas da mama:","opts":["Mastite puerperal, abscesso e mastite periductal","Polimastia, politelia e mamilo invertido congênito","Fibroadenoma, tumor filoides e papiloma intraductal","Dor cíclica, nodularidade difusa e mastalgia cíclica"],"c":0,"exp":"As alterações inflamatórias benignas são a mastite puerperal, o abscesso e a mastite periductal. Polimastia e politelia são congênitas; fibroadenoma e papiloma são tumores; dor cíclica e mastalgia são alterações funcionais.","ref":[0,2]},{"id":"eb4e85558a","q":"A imagem mostra mama com eritema, calor e edema. O manejo da mastite e do abscesso inclui:","opts":["Antibioticoterapia e drenagem cirúrgica quando houver abscesso","Somente observação clínica com retorno em seis meses","Excisão ampla da glândula com margem de um a dois centímetros","Ressecção do ducto responsável pela secreção papilar"],"c":0,"exp":"A mastite é tratada com antibiótico e, na presença de abscesso, com drenagem cirúrgica. Observação apenas não resolve infecção; excisão ampla é do tumor filoides e ressecção ductal, do papiloma.","cap":"Mastite com eritema e edema da mama","ref":[8,0]},{"id":"3d12e690d2","q":"São exemplos de alterações congênitas da mama:","opts":["Polimastia, politelia e mamilo invertido","Fibroadenoma, lipoma e hamartoma benigno","Mastite puerperal, abscesso e mastite periductal","Dor cíclica, nodularidade difusa e mastalgia"],"c":0,"exp":"As alterações congênitas da mama incluem polimastia (mamas supranumerárias), politelia (papilas supranumerárias) e mamilo invertido. As demais opções descrevem tumores benignos, processos inflamatórios e alterações funcionais.","ref":[6,0]},{"id":"d3063a782d","q":"Na investigação por imagem da mama, a escolha do método segue a regra:","opts":["Ultrassom em mulheres abaixo de 40 anos e mamografia a partir de 40","Mamografia em mulheres jovens e ultrassom a partir dos 40 anos","Ressonância como primeiro exame para todas as mulheres sintomáticas","Ultrassom apenas para mulheres acima de 50 anos assintomáticas"],"c":0,"exp":"A propedêutica por imagem prefere o ultrassom em mulheres com menos de 40 anos (mamas mais densas, sem radiação) e a mamografia a partir dos 40 anos. A ressonância fica reservada para casos especiais.","ref":[7,1]},{"id":"568be8b581","q":"O diagnóstico das afecções benignas da mama depende fundamentalmente de:","opts":["Clínica, exame físico, imagem e biópsia associados","Somente dos achados de mamografia e de ultrassom","Apenas do exame histopatológico da peça cirúrgica retirada","Exclusivamente da palpação feita pelo médico assistente"],"c":0,"exp":"Nenhum método isolado é suficiente: o diagnóstico combina história clínica (idade, sintomas, ciclo menstrual), exame físico (inspeção e palpação), imagem (USG, mamografia, RM) e, quando indicado, citologia/histologia (PAAF, core biopsy).","ref":[7,1]},{"id":"c8c6999e20","q":"Sobre a dor mamária isolada, é correto afirmar que:","opts":["A dor mamária isolada raramente é câncer","É o principal sintoma de neoplasia mamária","Indica sempre a necessidade de biópsia imediata","Exige mastectomia profilática de forma rotineira"],"c":0,"exp":"Dor isolada, sem nódulo ou outro achado, raramente é câncer. O carcinoma de mama costuma ser indolor; por isso a dor isolada é tratada clinicamente e não indica biópsia nem cirurgia de imediato.","ref":[1,1]},{"id":"c36a5e2fd3","q":"Sobre os 'pontos de atenção' da avaliação das afecções benignas, qual é a conduta correta?","opts":["Investigar todo nódulo novo em mulheres de 35 anos ou mais","Acompanhar qualquer nódulo novo em mulheres de 35 anos ou mais","Tratar com antibiótico todo nódulo novo em mulheres de 35 anos ou mais","Dispensar investigação quando o nódulo novo for totalmente indolor"],"c":0,"exp":"Todo nódulo novo em mulheres com 35 anos ou mais deve ser investigado, pois a probabilidade de malignidade aumenta com a idade. Acompanhar sem exames, tratar como infecção ou dispensar a investigação pela ausência de dor são condutas inadequadas.","ref":[8,2]}],"resumo":[{"h":"Visão geral e classificação","blocos":[{"html":"<p>As afecções benignas da mama são um grupo heterogêneo e muito comum na prática. O desafio central é diferenciá-las do <strong>câncer de mama<\/strong>, e por isso o diagnóstico se apoia sempre na combinação de <strong>história clínica, exame físico, imagem e, quando necessário, biópsia<\/strong>. Nenhum método isolado fecha o diagnóstico.<\/p>"},{"html":"<p>Essas afecções organizam-se em quatro grandes grupos:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Grupo<\/th><th>Exemplos principais<\/th><\/tr><\/thead><tbody><tr><td>Alterações funcionais benignas (AFBM)<\/td><td>dor cíclica, nodularidade difusa, mastalgia<\/td><\/tr><tr><td>Tumores benignos<\/td><td>fibroadenoma, tumor filoides, papiloma intraductal, lipoma, hamartoma<\/td><\/tr><tr><td>Alterações inflamatórias<\/td><td>mastite puerperal, abscesso, mastite periductal<\/td><\/tr><tr><td>Alterações congênitas<\/td><td>polimastia, politelia, mamilo invertido<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Anatomia da mama, com ductos, lóbulos e tecido adiposo<\/p>"},{"html":"<blockquote><p>A conduta é sempre individualizada: observação, tratamento clínico ou cirurgia, conforme o diagnóstico e a suspeita de malignidade.<\/p><\/blockquote>"}]},{"h":"Alterações funcionais benignas da mama (AFBM) e mastalgia","blocos":[{"html":"<p>As AFBM reúnem <strong>dor cíclica, nodularidade difusa e mastalgia<\/strong>. São a expressão funcional da mama à variação hormonal do ciclo menstrual e, em geral, não exigem investigação extensa.<\/p>"},{"html":"<p>A <strong>mastalgia<\/strong> é <strong>diagnóstico clínico<\/strong>; exames complementares só são solicitados quando há <strong>achado no exame físico<\/strong>. Dor mamária isolada, sem nódulo ou outro sinal, <strong>raramente é câncer<\/strong> — o carcinoma de mama costuma ser indolor.<\/p>"},{"html":"<p>O manejo das AFBM é <strong>sintomático<\/strong>, com orientação, medidas para controle da dor e seguimento.<\/p>"}]},{"h":"Fibroadenoma","blocos":[{"html":"<p>O <strong>fibroadenoma<\/strong> é o tumor benigno mais comum em mulheres jovens, com incidência predominante <strong>antes dos 35 anos<\/strong>. Formas raras: <strong>juvenil, gigante, complexa e extramamária<\/strong>.<\/p>"},{"html":"<p>Clinicamente é nódulo <strong>único ou múltiplo, bem delimitado, móvel, não aderido<\/strong>, às vezes lobulado, de <strong>crescimento lento<\/strong> e consistência <strong>fibroelástica<\/strong>. Costuma ser <strong>indolor<\/strong>, mas pode tornar-se doloroso durante a <strong>gravidez e a lactação<\/strong>, pelo estímulo hormonal.<\/p>"},{"html":"<p>O diagnóstico é clínico, complementado por <strong>ultrassom ou mamografia<\/strong> quando necessário; a <strong>PAAF<\/strong> mostra histologia característica. No fibroadenoma <strong>simples<\/strong>, a conduta é <strong>seguimento ou excisão<\/strong>; nas formas <strong>complexas ou suspeitas<\/strong>, está indicada a <strong>cirurgia<\/strong>.<\/p>"},{"html":"<p class=\"figleg\">Ultrassom mostrando nódulo sólido, hipoecoico e bem delimitado, típico do fibroadenoma<\/p>"},{"html":"<p class=\"figleg\">Mamografia com calcificação grosseira em pipoca, padrão de fibroadenoma em involução<\/p>"},{"html":"<blockquote><p>A <strong>calcificação em pipoca<\/strong> na mamografia é o cartão de visita do fibroadenoma em involução — achado tipicamente <strong>benigno<\/strong>, diferente das microcalcificações finas e ramificadas do carcinoma ductal in situ.<\/p><\/blockquote>"}]},{"h":"Tumor filoides (phyllodes)","blocos":[{"html":"<p>O <strong>tumor filoides<\/strong> é um tumor benigno de <strong>origem extraductal<\/strong>, no <strong>tecido conjuntivo<\/strong>, com <strong>crescimento exponencial rápido<\/strong> e <strong>indolor<\/strong>. Pode ter <strong>variante maligna<\/strong> e apresenta <strong>recidivas locais frequentes<\/strong>.<\/p>"},{"html":"<p>Na <strong>mamografia e no ultrassom<\/strong>, os achados costumam ser <strong>inespecíficos<\/strong>; a <strong>punção por agulha grossa<\/strong> pode trazer <strong>diagnóstico diferencial com carcinoma<\/strong>, pela hipercelularidade estromal.<\/p>"},{"html":"<p>O tratamento é <strong>cirúrgico, com excisão ampla e margem de 1 a 2 cm<\/strong> — diferente do fibroadenoma simples, que permite seguimento.<\/p>"},{"html":"<p class=\"figleg\">Apresentação clínica de tumor filoides: massa volumosa de crescimento rápido<\/p>"},{"html":"<p class=\"figleg\">Mamografia do tumor filoides: massa grande, bem delimitada e de aspecto inespecífico<\/p>"}]},{"h":"Papiloma intraductal e descarga papilar","blocos":[{"html":"<p>O <strong>papiloma intraductal<\/strong> é um tumor benigno do ducto que se manifesta por <strong>secreção papilar serossanguinolenta<\/strong>. O tratamento é a <strong>ressecção do ducto<\/strong> acometido.<\/p>"},{"html":"<p><strong>Descarga papilar<\/strong> é a <strong>secreção espontânea do mamilo<\/strong>, unilateral ou bilateral, uniductal ou multiductal. A conduta depende da natureza:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Situação<\/th><th>Conduta<\/th><\/tr><\/thead><tbody><tr><td>Fisiológica<\/td><td>acompanhamento<\/td><\/tr><tr><td>Papiloma benigno<\/td><td>excisão do ducto<\/td><\/tr><tr><td>Suspeita de malignidade<\/td><td>investigação completa e cirurgia conforme a necessidade<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p class=\"figleg\">Definição de descarga papilar: secreção espontânea, uni ou bilateral, uni ou multiductal<\/p>"},{"html":"<blockquote><p><strong>Secreção papilar sanguinolenta, unilateral e espontânea é sinal de alerta<\/strong> e impõe investigação completa.<\/p><\/blockquote>"}]},{"h":"Alterações inflamatórias: mastite e abscesso","blocos":[{"html":"<p>As alterações inflamatórias benignas incluem <strong>mastite puerperal, abscesso mamário e mastite periductal<\/strong>. A <strong>mastite<\/strong> se apresenta com mama <strong>eritematosa, quente e edemaciada<\/strong>; quando há <strong>abscesso<\/strong>, forma-se coleção que exige <strong>drenagem<\/strong>.<\/p>"},{"html":"<p>O manejo combina <strong>antibioticoterapia e drenagem cirúrgica<\/strong> quando houver coleção.<\/p>"},{"html":"<p class=\"figleg\">Mastite: mama com eritema e edema difusos, típicos de processo inflamatório<\/p>"}]},{"h":"Alterações congênitas","blocos":[{"html":"<p>São alterações congênitas da mama a <strong>polimastia<\/strong> (mamas supranumerárias), a <strong>politelia<\/strong> (papilas supranumerárias) e o <strong>mamilo invertido<\/strong>. Não são lesões proliferativas; têm, em geral, importância na orientação clínica e no diagnóstico diferencial.<\/p>"}]},{"h":"Propedêutica diagnóstica","blocos":[{"html":"<p>A investigação das afecções mamárias combina quatro etapas:<\/p>"},{"html":"<ul><li><strong>História clínica<\/strong> — idade, sintomas e relação com o ciclo menstrual.<\/li><li><strong>Exame físico<\/strong> — inspeção e palpação.<\/li><li><strong>Imagem<\/strong> — <strong>ultrassom<\/strong> em mulheres com menos de 40 anos; <strong>mamografia<\/strong> a partir dos 40 anos; <strong>ressonância magnética<\/strong> em casos especiais.<\/li><li><strong>Citologia/histologia<\/strong> — <strong>PAAF<\/strong> e <strong>core biopsy<\/strong>.<\/li><\/ul>"}]},{"h":"Manejo, resumo e pontos de atenção","blocos":[{"html":"<div class=\"tbl\"><table><thead><tr><th>Lesão<\/th><th>Manejo<\/th><\/tr><\/thead><tbody><tr><td>AFBM<\/td><td>sintomático<\/td><\/tr><tr><td>Fibroadenoma<\/td><td>acompanhar ou excisão se crescimento ou dúvida<\/td><\/tr><tr><td>Tumor filoides<\/td><td>excisão ampla<\/td><\/tr><tr><td>Papiloma intraductal<\/td><td>ressecção do ducto<\/td><\/tr><tr><td>Mastite/abscesso<\/td><td>antibiótico + drenagem<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Pontos de atenção:<\/p>"},{"html":"<ul><li><strong>Secreção papilar sanguinolenta unilateral<\/strong> → investigar.<\/li><li><strong>Dor isolada<\/strong> raramente é câncer.<\/li><li><strong>Todo nódulo novo em mulheres de 35 anos ou mais<\/strong> deve ser investigado.<\/li><\/ul>"},{"html":"<p>As afecções benignas são <strong>comuns e heterogêneas<\/strong>; o diagnóstico depende de <strong>clínica + exame físico + imagem + biópsia<\/strong>, e o desafio principal é <strong>diferenciar do câncer de mama<\/strong>. A conduta é individualizada: observação, tratamento clínico ou cirurgia.<\/p>"}]}]},{"slug":"endometriose-e-algia-pelvica","titulo":"Endometriose e Algia Pélvica","disciplina":"GO","eyebrow":"Ginecologia · Dor Pélvica Crônica","questoes":[{"id":"4a6130a3f7","q":"Quais critérios definem a dor pélvica crônica?","opts":["Dor em andar inferior do abdome, acíclica, com duração igual ou superior a seis meses","Dor em andar inferior do abdome, cíclica, com duração igual ou inferior a três meses","Dor em andar inferior do abdome, acíclica, desencadeada exclusivamente pelo coito","Dor em andar inferior do abdome, acíclica, sempre atribuível a uma gravidez atual"],"c":0,"exp":"A dor pélvica crônica é caracterizada por dor em andar inferior do abdome, acíclica, com duração igual ou superior a seis meses, não causada pela gravidez e sem associação exclusiva com o coito. A exigência dos seis meses é o que separa a dor crônica de quadros agudos ou subagudos.","ref":[0,0]},{"id":"50a5b4169d","q":"Qual é a localização anatômica que delimita a dor pélvica crônica?","opts":["Entre a pelve, a parede abdominal anterior e a coluna lombossacra ou nádegas","Entre o epigástrio, o hipocôndrio direito e a região escapular esquerda","Restrita à linha média do abdome, sempre acima da cicatriz umbilical","Restrita à região perineal e à face interna de ambas as coxas"],"c":0,"exp":"A dor se localiza entre a pelve, a parede anterior do abdome e a coluna lombossacra ou nádegas, na altura ou abaixo da cicatriz umbilical. Além da topografia, exige-se que seja intensa o bastante para impossibilitar atividades diárias e/ou obrigar a paciente a procurar tratamento médico.","ref":[0,0]},{"id":"67ecc2995a","q":"Como se classifica a dor pélvica crônica de intensidade grave?","opts":["Interfere nas atividades e não melhora mesmo com a medicação prescrita","Interfere nas atividades, porém melhora com a medicação prescrita","Incomoda a paciente, que segue realizando normalmente suas atividades","Impede as atividades apenas durante os dias de fluxo menstrual intenso"],"c":0,"exp":"A dor grave é incapacitante: interfere nas atividades e não melhora mesmo com a medicação prescrita. A moderada também interfere, mas responde ao analgésico; a leve apenas incomoda, sem impedir as atividades. A escala é funcional, não depende de exame nem de escore numérico.","ref":[0,4]},{"id":"d3d1d3d838","q":"Qual é a prevalência estimada da dor pélvica crônica e seu peso no consultório de ginecologia?","opts":["Cerca de uma em cada sete mulheres, respondendo por 10% das consultas","Cerca de uma em cada setenta mulheres, respondendo por 1% das consultas","Cerca de uma em cada duas mulheres, respondendo por 50% das consultas","Cerca de uma em cada vinte mulheres, respondendo por 30% das consultas"],"c":0,"exp":"A dor pélvica crônica atinge aproximadamente uma em cada sete mulheres e responde por cerca de 10% das consultas ginecológicas. É um motivo de consulta frequente e com alto impacto funcional, o que justifica investigação sistematizada e não apenas sintomática.","ref":[0,5]},{"id":"dd272a5e25","q":"O que se observa, de regra, quanto ao número de causas em uma paciente com dor pélvica crônica?","opts":["É mais comum haver mais de uma condição causando dor do que apenas uma","É mais comum identificar uma única condição isolada causando toda a dor","A dor nunca se origina de órgãos fora do aparelho reprodutor feminino","Mulheres com mais de uma causa costumam referir dor de menor intensidade"],"c":0,"exp":"Na dor pélvica crônica é mais comum a paciente ter mais de uma condição do que apenas uma, com causas sobrepostas que contribuem em graus diferentes — endometriose e cistite intersticial no mesmo quadro, por exemplo. Mulheres com mais de uma causa costumam ter mais dor, e a origem pode estar fora do sistema reprodutor.","ref":[1,0]},{"id":"a491b6dcd0","q":"Quais são as três principais formas de apresentação da síndrome de dor pélvica crônica?","opts":["Dismenorreia, dispareunia e dor acíclica sem relação com fluxo ou coito","Dismenorreia, sangramento intermenstrual e dor desencadeada pelo esforço","Dispareunia, corrimento vaginal recorrente e dor acíclica de forte intensidade","Dor acíclica, disúria isolada e dismenorreia restrita à adolescência"],"c":0,"exp":"As três formas de apresentação são dismenorreia, dispareunia e dor acíclica — esta última sem relação com o fluxo menstrual nem com o coito. Incluir a dor cíclica e a desencadeada pelo coito na definição de dor pélvica crônica é ponto controverso, defendido por autores que acrescentam dismenorreia e dispareunia à síndrome.","ref":[0,1]},{"id":"8cbaa388d6","q":"Quais condições representam causas musculoesqueléticas de dor pélvica crônica?","opts":["Mialgia por tensão do assoalho pélvico e síndrome do piriforme","Cistite intersticial e síndrome da bexiga dolorosa de repetição","Síndrome do intestino irritável e doença inflamatória intestinal","Neuralgia do pudendo e infarto do nervo cutâneo abdominal"],"c":0,"exp":"As causas musculoesqueléticas incluem dor miofascial da parede abdominal, mialgia por tensão do assoalho pélvico, fibromialgia, coccigodinia, síndrome do piriforme e ciatalgia. Cistite intersticial é urológica, intestino irritável é gastrointestinal e neuralgia do pudendo é neurológica.","ref":[1,1]},{"id":"9bbeaf916d","q":"Qual condição é causa urológica clássica de dor pélvica crônica?","opts":["Cistite intersticial, também chamada síndrome da bexiga dolorosa","Coccigodinia, também chamada síndrome da dor do assoalho pélvico","Doença celíaca, também chamada enteropatia sensível ao glúten","Congestão pélvica, também chamada síndrome varicosa vulvar"],"c":0,"exp":"A cistite intersticial, ou síndrome da bexiga dolorosa, é causa urológica de dor pélvica crônica, ao lado de cistite actínica, câncer de bexiga, síndrome uretral, cistite de repetição e urolitíase. Convive com frequência com a endometriose na mesma paciente, somando dor.","ref":[1,1]},{"id":"586ee9f33e","q":"Quais fatores de origem psíquica figuram entre as causas de dor pélvica crônica?","opts":["Depressão, somatização, uso de opiáceos e abuso sexual prévio","Depressão, hipotireoidismo, anemia ferropriva e tabagismo ativo","Somatização, dislipidemia, uso de diuréticos e sedentarismo","Abuso sexual prévio, hipertensão, obesidade e uso de estatinas"],"c":0,"exp":"Entre as causas de origem psíquica estão depressão, somatização, uso de opiáceos, abuso sexual e distúrbios do sono. São fatores que amplificam a percepção dolorosa e precisam entrar na anamnese, sob pena de o quadro ser tratado apenas com analgésico e não responder.","ref":[1,2]},{"id":"8fbf51fbef","q":"Quais diagnósticos compõem o grupo das causas ginecológicas de dor pélvica crônica?","opts":["Adenomiose, leiomioma, sequelas de doença inflamatória pélvica e aderências","Cistite intersticial, urolitíase, síndrome uretral e câncer de bexiga","Doença celíaca, carcinoma colorretal, hérnias e intestino irritável","Fibromialgia, coccigodinia, ciatalgia e síndrome do músculo piriforme"],"c":0,"exp":"As causas ginecológicas incluem endometriose, leiomioma, adenomiose, cistos ovarianos, síndrome do ovário remanescente, sequelas de doença inflamatória pélvica, dor pós-ligadura tubária e doença adesiva pélvica. As demais alternativas listam, respectivamente, causas urológicas, gastrointestinais e musculoesqueléticas.","ref":[1,1]},{"id":"8321b5dd67","q":"Qual é o conceito de endometriose?","opts":["Tecido semelhante ao endométrio fora da cavidade uterina, hormônio-dependente","Tecido semelhante ao miométrio dentro da cavidade uterina, hormônio-dependente","Tecido endometrial invadindo o miométrio, sem qualquer hormônio-dependência","Tecido neoplásico derivado do endométrio, com potencial metastático elevado"],"c":0,"exp":"Endometriose é doença não neoplásica em que tecido semelhante ao endométrio é encontrado fora da cavidade uterina, mimetizando a estrutura histológica e a função do endométrio tópico. Guarda semelhança morfológica, imunológica e estrutural com a mucosa uterina, inclusive a hormônio-dependência.","ref":[2,0]},{"id":"9637897c2b","q":"Qual é a prevalência da endometriose na população feminina em idade reprodutiva e entre as mulheres inférteis?","opts":["10 a 14% das mulheres em idade reprodutiva e 25 a 50% das inférteis","40 a 50% das mulheres em idade reprodutiva e 80 a 90% das inférteis","1 a 2% das mulheres em idade reprodutiva e 5 a 10% das inférteis","10 a 14% das mulheres após a menopausa e 25 a 50% das nulíparas"],"c":0,"exp":"A endometriose acomete 10 a 14% das mulheres na fase reprodutiva, dos 19 aos 44 anos, e chega a 25 a 50% entre as inférteis. No Brasil são estimados 3,5 a 5 milhões de casos, e cerca de 60 milhões no mundo.","ref":[2,2]},{"id":"369220f386","q":"Qual teoria patogênica propõe que células endometriais viáveis chegam à cavidade pélvica pelas tubas durante a menstruação?","opts":["Regurgitação transtubária do sangue menstrual para a cavidade pélvica","Metaplasia celômica do peritônio em resposta a estímulo inflamatório","Disseminação linfática e hematogênica de células endometriais viáveis","Persistência de restos embrionários dos ductos de Müller no peritônio"],"c":0,"exp":"A teoria da regurgitação transtubária do sangue menstrual, proposta por Sampson em 1924, é a mais aceita para a endometriose peritoneal. O refluxo leva células endometriais viáveis à cavidade, onde aderem, proliferam e invadem o peritônio. As demais teorias coexistem para explicar focos que o refluxo não alcança.","ref":[2,5]},{"id":"5dc50d07b0","q":"Qual teoria patogênica explica o aparecimento de focos de endometriose em cicatriz de ato cirúrgico prévio?","opts":["Teoria da disseminação iatrogênica, por implante durante ato cirúrgico","Teoria da metaplasia celômica, por transformação do epitélio pélvico","Teoria dos restos embrionários, por persistência de tecido mülleriano","Teoria neoplásica, por transformação maligna do endométrio tópico"],"c":0,"exp":"A teoria da disseminação iatrogênica atribui o implante ao transporte mecânico de tecido endometrial durante procedimentos. Compõe o conjunto de teorias que inclui regurgitação transtubária, metaplasia celômica, restos embrionários, disseminação linfática e hematogênica, extensão direta, mecanismo imunológico e teoria neoplásica.","ref":[2,5]},{"id":"95ef39ff55","q":"Que tipo de dispareunia caracteriza o quadro clínico da endometriose?","opts":["É de profundidade, referida durante a penetração profunda","É superficial, referida já na entrada do intróito vaginal","É de profundidade, restrita ao período após a menopausa","É superficial, melhorando progressivamente com o coito"],"c":0,"exp":"A dispareunia da endometriose é de profundidade, deflagrada pela penetração profunda que mobiliza ligamentos uterossacros, fundo de saco posterior e septo retovaginal comprometidos. Compõe o quadro clínico junto da dor pélvica crônica cíclica ou acíclica, da dismenorreia e da infertilidade.","ref":[3,0]},{"id":"dbba62df56","q":"Além da dismenorreia e da dor pélvica, o conjunto dos seis 'Ds' da endometriose inclui:","opts":["Dispareunia, dificuldade para engravidar, dor ao urinar e dor ao evacuar","Dispareunia, dificuldade para engravidar, diarreia e distensão abdominal","Dispareunia, disfunção tireoidiana, dor ao urinar e desidratação","Dismetria, dificuldade para engravidar, dor ao urinar e disfagia"],"c":0,"exp":"Os seis 'Ds' são dismenorreia, dor pélvica, dispareunia, dificuldade para engravidar, dor ao urinar e dor ao evacuar. A dor miccional e a dor evacuatória apontam para acometimento de bexiga e de reto-sigmoide, ou seja, para formas profundas.","ref":[3,1]},{"id":"4e652d1c6d","q":"Qual perfil é classicamente descrito como grupo de risco para endometriose?","opts":["Brancas, nulíparas, de nível social elevado e ansiosas","Negras, multíparas, de nível social baixo e tabagistas","Brancas, multíparas, de nível social baixo e obesas","Negras, nulíparas, de nível social elevado e diabéticas"],"c":0,"exp":"O perfil clássico descrito é o de mulheres brancas, nulíparas, de nível socioeconômico elevado e ansiosas. O viés de acesso ao diagnóstico explica parte desse perfil: quem procura e consegue investigação especializada é quem acaba sendo diagnosticada.","ref":[3,2]},{"id":"38a258c3ec","q":"Qual mudança no padrão reprodutivo ajuda a explicar o aumento aparente da endometriose nas últimas décadas?","opts":["A mulher atual acumula 400 a 450 ciclos, contra 40 a 50 no passado","A mulher atual acumula 40 a 50 ciclos, contra 400 a 450 no passado","A mulher atual acumula 100 a 150 ciclos, igual ao número do passado","A mulher atual acumula 400 a 450 ciclos, contra 800 a 900 no passado"],"c":0,"exp":"O número de ciclos menstruais ao longo da vida saltou de 40 a 50 para 400 a 450, com menarca mais precoce, menopausa mais tardia, poucas gestações e pouca amamentação. Mais ciclos significam mais episódios de refluxo menstrual. Somam-se melhora do diagnóstico, poluição, alimentação e menor esforço físico.","ref":[3,4]},{"id":"d6b17cbea2","q":"A figura mostra a sequência evolutiva dos implantes peritoneais. Qual é a ordem correta das lesões ao longo do tempo?","opts":["Vermelha, precoce e vascularizada, evolui para negra e depois branca","Branca, precoce e fibrótica, evolui para negra e depois vermelha","Negra, precoce e inflamatória, evolui para branca e depois vermelha","Vermelha, tardia e fibrótica, evolui para branca e depois negra"],"c":0,"exp":"A lesão começa vermelha, ativa e neovascularizada, após a adesão e a proliferação do implante. A reação inflamatória e o depósito de hemossiderina a tornam negra, e a fibrose progressiva a transforma em lesão branca, cicatricial. As três formas podem coexistir na mesma pelve.","cap":"Patogênese: adesão, proliferação, invasão e neovascularização (vermelha), reação inflamatória e fibrose (negra e branca)","ref":[2,8]},{"id":"c61250a1d5","q":"O que a classificação da American Society for Reproductive Medicine (ASRM) pontua para estadiar a endometriose?","opts":["Tamanho e profundidade dos implantes, aderências e obliteração do fundo de saco","Intensidade da dor, nível sérico de CA-125 e tempo de evolução dos sintomas","Idade da paciente, paridade prévia e resposta ao tratamento hormonal inicial","Volume uterino, espessura endometrial e contagem de folículos antrais basais"],"c":0,"exp":"A pontuação da ASRM soma tamanho e profundidade dos implantes peritoneais e ovarianos, presença, extensão e tipo das aderências, e o grau de obliteração do fundo de saco. É uma classificação anatômica, obtida na inspeção cirúrgica — não incorpora dor nem marcadores laboratoriais.","ref":[5,0]},{"id":"9e575856c4","q":"Qual estádio da ASRM corresponde a escore acima de 40, com endometriomas e aderências densas e firmes?","opts":["Estágio IV, escore acima de 40, com endometriomas e aderências densas","Estágio III, escore acima de 40, com endometriomas e aderências densas","Estágio IV, escore de 16 a 40, com implantes isolados sem aderências","Estágio II, escore de 6 a 15, com endometriomas e aderências densas"],"c":0,"exp":"O estágio IV, endometriose grave, exige escore acima de 40, com múltiplos implantes superficiais e profundos, endometriomas e aderências densas e firmes. O estágio I (mínima) vai de 1 a 5, o II (leve) de 6 a 15 e o III (moderada) de 16 a 40.","ref":[5,1]},{"id":"d5c796f07f","q":"A tabela mostra o escore total e o estádio correspondente na classificação da AAGL de 2021. Qual pontuação define o estágio 4?","opts":["Escore total acima de 21 pontos","Escore total acima de 40 pontos","Escore total de 16 a 21 pontos","Escore total de 9 a 15 pontos"],"c":0,"exp":"Na classificação da AAGL de 2021 o estágio 1 corresponde a escore de até 8 pontos, o estágio 2 de 9 a 15, o estágio 3 de 16 a 21 e o estágio 4 acima de 21. Os pontos de corte são diferentes dos da ASRM, em que o estágio IV começa acima de 40.","cap":"Classificação da AAGL 2021: pontuação por sítio e escore total por estágio","ref":[5,3]},{"id":"df301957c5","q":"Qual é a relação entre a intensidade da dor e o estadiamento da endometriose?","opts":["A intensidade da dor não guarda relação com o estádio da doença","A intensidade da dor cresce proporcionalmente ao estádio da doença","A intensidade da dor só aparece a partir do estádio III da doença","A intensidade da dor decresce à medida que o estádio progride"],"c":0,"exp":"A dor não acompanha o estadiamento: focos mínimos podem ser extremamente dolorosos e doença estádio IV pode cursar com pouca dor. Essa dissociação é uma das razões pelas quais a endometriose é difícil de estudar, ao lado da ausência de bom modelo animal, já que só primatas superiores menstruam.","ref":[5,4]},{"id":"5c33de714b","q":"A imagem laparoscópica mostra pequenas lesões escuras e vesiculares disseminadas sobre a superfície peritoneal. Que forma de endometriose está representada?","opts":["Endometriose peritoneal superficial","Endometriose profunda infiltrativa","Endometrioma ovariano volumoso","Adenomiose uterina focal nodular"],"c":0,"exp":"Trata-se de endometriose peritoneal: lesões superficiais, em número variável, sobre o peritônio. É a forma cuja origem mais provável é a menstruação retrógrada. Não há cisto ovariano nem nódulo infiltrando além de 0,5 cm, o que afasta endometrioma e doença profunda.","cap":"Laparoscopia: implantes peritoneais superficiais","ref":[4,2]},{"id":"67104de581","q":"Como se caracteriza o endometrioma?","opts":["Cisto ovariano de conteúdo espesso achocolatado, com cápsula densa e fibrosa","Cisto ovariano de conteúdo seroso translúcido, com cápsula fina e elástica","Nódulo sólido ovariano de conteúdo gorduroso, com calcificações grosseiras","Cisto tubário de conteúdo purulento espesso, com paredes finas e aderidas"],"c":0,"exp":"O endometrioma é a lesão mais típica da endometriose: formação cística ovariana repleta de líquido espesso e achocolatado, rodeada por cápsula densa e fibrosa. O epitélio da cápsula apresenta áreas com estruturas semelhantes ao endométrio, o que confirma a natureza endometriótica.","ref":[4,4]},{"id":"1201ecee32","q":"A ultrassonografia do ovário esquerdo mostra formação cística de conteúdo homogêneo de baixa ecogenicidade, ao lado de folículos e de parênquima ovariano preservado. Qual é o diagnóstico mais provável?","opts":["Endometrioma ovariano","Cisto dermoide maduro","Abscesso tubo-ovariano","Cistadenoma seroso simples"],"c":0,"exp":"O aspecto de cisto de conteúdo homogêneo e finamente ecogênico, em vidro fosco, dentro de ovário com folículos e parênquima identificáveis, é o padrão típico do endometrioma. O cisto dermoide tem componentes ecogênicos grosseiros, o abscesso cursa com febre e dor aguda, e o cistadenoma seroso é anecoico.","cap":"Ultrassonografia: endometrioma, folículos e parênquima do ovário esquerdo","ref":[4,6]},{"id":"710e3ef19a","q":"Qual é a origem mais provável do endometrioma ovariano?","opts":["Mista: associação entre menstruação retrógrada e metaplasia celômica","Única: exclusivamente a metaplasia do epitélio celômico do ovário","Única: exclusivamente a disseminação hematogênica para a gônada","Mista: associação entre restos embrionários e extensão linfática"],"c":0,"exp":"A origem mais provável do endometrioma é mista: combina a deposição de sangue menstrual retrógrado na superfície ovariana, com internalização das células na gônada, e a metaplasia de células remanescentes do epitélio celômico. Uma terceira hipótese envolve cistos funcionais secundariamente invadidos pelo processo endometriótico.","ref":[4,5]},{"id":"482bda2232","q":"Qual critério define a endometriose profunda, ou infiltrativa?","opts":["Implantes que ultrapassam 0,5 cm de profundidade e envolvem outros órgãos","Implantes que ultrapassam 5,0 cm de diâmetro e envolvem outros órgãos","Implantes restritos ao peritônio, com menos de 0,5 cm de profundidade","Implantes que ultrapassam 0,5 cm e ficam confinados ao ovário acometido"],"c":0,"exp":"A endometriose profunda é definida por implantes que alcançam profundidade superior a 0,5 cm e envolvem outros órgãos. É a forma de sintomatologia mais agressiva, que mais compromete o bem-estar e a qualidade de vida da paciente.","ref":[4,8]},{"id":"73404c552f","q":"Quais estruturas são tipicamente acometidas pela endometriose profunda?","opts":["Ligamentos uterossacros, septo retovaginal, bexiga, ureteres e intestino","Ligamentos redondos, canal cervical, endométrio e miométrio superficial","Trompas, endocérvix, vulva, períneo e parede vaginal anterior apenas","Pulmão, pleura, diafragma, cicatriz umbilical e parede torácica apenas"],"c":0,"exp":"A endometriose profunda compromete ligamentos uterossacros e útero, bexiga e ureteres, septo retovaginal e intestinos, formando nódulos em reto, sigmoide, órgãos genitais, vagina e, por vezes, intestino grosso e íleo. O acometimento ureteral e intestinal é o que confere gravidade ao quadro.","ref":[4,10]},{"id":"8dbbc894c0","q":"Qual é o impacto da endometriose profunda sobre a fertilidade?","opts":["Compromete a fertilidade mesmo com técnicas de reprodução assistida","Não compromete a fertilidade quando há reprodução assistida disponível","Compromete a fertilidade apenas enquanto houver dor pélvica associada","Preserva a fertilidade por não envolver tubas, ovários ou útero algum"],"c":0,"exp":"A endometriose profunda interfere na fertilidade mesmo quando se recorre a técnicas de reprodução assistida. O comprometimento ultrapassa o fator mecânico tubário e envolve ambiente peritoneal inflamatório, qualidade oocitária e receptividade endometrial.","ref":[4,8]},{"id":"7dd8801214","q":"A figura ilustra o toque bimanual em paciente com endometriose. Qual conjunto de achados é esperado nesse exame?","opts":["Útero fixo e retrovertido, com nódulos palpáveis em ligamentos uterossacros","Útero móvel e anteverso, com nódulos palpáveis em ligamentos redondos","Útero aumentado e amolecido, com colo entreaberto e doloroso à mobilização","Útero fixo e anteverso, com massa anexial pulsátil e sopro à ausculta local"],"c":0,"exp":"O exame ginecológico na endometriose busca útero fixo e retrovertido pela retração cicatricial, espessamento e dor nos ligamentos uterossacros e nódulos palpáveis em fundo de saco posterior. A inspeção da vulva e o exame especular complementam, podendo revelar lesão azulada em fundo de saco vaginal.","cap":"Toque bimanual: implantes em fundo de saco posterior e uterossacros","ref":[6,2]},{"id":"c0f242acf9","q":"Qual é o papel da dosagem de CA-125 na investigação da endometriose?","opts":["Não deve ser usada, pois não confirma nem afasta o diagnóstico","Deve ser usada como teste de rastreamento populacional da doença","Deve ser usada para confirmar o diagnóstico antes da cirurgia","Não deve ser usada, pois só se eleva na endometriose mínima"],"c":0,"exp":"O CA-125 não serve para diagnosticar endometriose: eleva-se em várias condições benignas e malignas e pode estar normal em doença extensa. A investigação complementar é de imagem — ultrassonografia transvaginal com preparo, ressonância de pelve, colonoscopia e ecocolonoscopia.","ref":[6,5]},{"id":"cad669ced0","q":"A ultrassonografia transvaginal com preparo mostra, posteriormente ao útero, imagem nodular hipoecogênica ocupando o fundo de saco e impedindo o deslizamento das estruturas. Esse achado corresponde a:","opts":["Nódulo retrocervical com bloqueio do fundo de saco de Douglas","Endometrioma do ovário direito com conteúdo em vidro fosco","Mioma subseroso pediculado deslocando o fundo de saco","Coleção purulenta livre compatível com abscesso pélvico"],"c":0,"exp":"O nódulo hipoecogênico retrocervical com obliteração do fundo de saco de Douglas e perda do sinal de deslizamento é achado típico de endometriose profunda. O preparo intestinal é o que permite ver a parede do reto-sigmoide e medir a extensão do nódulo, orientando o planejamento cirúrgico.","cap":"Ultrassonografia com preparo: nódulo e bloqueio do fundo de saco de Douglas","ref":[6,7]},{"id":"321c96e69b","q":"Quais são as opções de tratamento clínico e cirúrgico da endometriose?","opts":["Clínico com progestágenos e análogo de GnRH; cirúrgico com exérese das lesões","Clínico com antibiótico de amplo espectro; cirúrgico com drenagem percutânea","Clínico com indutores de ovulação; cirúrgico com ligadura tubária bilateral","Clínico com estrogênio isolado em altas doses; cirúrgico com biópsia apenas"],"c":0,"exp":"O tratamento clínico reúne anti-inflamatórios e analgésicos, contraceptivos orais combinados, progestágenos, análogos de GnRH e inibidores da aromatase. O cirúrgico envolve exérese das lesões, reconstituição da anatomia e, em casos selecionados, histerectomia com ou sem ooforectomia. Indica-se tratar diante de dor, sintomas intestinais ou urinários e infertilidade.","ref":[7,1]}],"resumo":[{"h":"Dor pélvica crônica: o que é, quanto dói e quanto pesa","blocos":[{"html":"<p>A dor pélvica crônica é definida por dor em <strong>andar inferior do abdome<\/strong>, <strong>acíclica<\/strong>, com duração <strong>igual ou superior a seis meses<\/strong>, não causada pela gravidez e sem associação exclusiva com o coito. A topografia é mais precisa do que parece: a dor se localiza entre a pelve, a parede anterior do abdome e a coluna lombossacra ou nádegas, na altura ou abaixo da cicatriz umbilical. E há um critério funcional que fecha a definição — a dor precisa ser intensa a ponto de impossibilitar atividades diárias e/ou de obrigar a paciente a procurar tratamento médico. A intensidade entra depois, como graduação funcional: a dor que só incomoda, sem impedir as atividades, é DPC <strong>leve<\/strong> — não é ausência de DPC.<\/p>"},{"html":"<p>A inclusão de quadros de dor <strong>cíclica<\/strong> e de dor desencadeada pelo coito é controversa. Autores que a defendem acrescentam à síndrome a dismenorreia e a dispareunia, e nessa leitura a dor pélvica crônica tem <strong>três formas de apresentação<\/strong>: dismenorreia, dispareunia e dor acíclica — esta última sem relação com o fluxo menstrual nem com o coito.<\/p>"},{"html":"<h3>Graduação da intensidade<\/h3>"},{"html":"<p>A intensidade é graduada por critério funcional, não por escala numérica nem por exame:<\/p>"},{"html":"<ul><li><strong>Leve<\/strong> — incomoda, mas a mulher não deixa de fazer suas atividades.<\/li><li><strong>Moderada<\/strong> — interfere nas atividades, porém melhora com a medicação prescrita.<\/li><li><strong>Grave<\/strong> — interfere nas atividades e <strong>não<\/strong> melhora mesmo com a medicação prescrita. É a dor incapacitante.<\/li><\/ul>"},{"html":"<p>Aproximadamente <strong>1 em cada 7 mulheres<\/strong> tem dor pélvica crônica, e o quadro responde por cerca de <strong>10% das consultas de ginecologia<\/strong>. Não é queixa rara: é uma das razões mais frequentes para a mulher procurar o consultório.<\/p>"}]},{"h":"As causas: quase sempre mais de uma","blocos":[{"html":"<p>O erro mais comum na abordagem da dor pélvica crônica é procurar <em>a<\/em> causa. Nesses quadros, <strong>é mais comum a paciente ter mais de uma condição médica do que apenas uma<\/strong> — endometriose e cistite intersticial convivendo, por exemplo —, com cada causa contribuindo em grau diferente para a dor. E mulheres com mais de uma causa geralmente têm <strong>mais<\/strong> dor do que aquelas com uma só. A dor pélvica também pode ter origem em órgãos <strong>fora<\/strong> do sistema reprodutor feminino, o que torna o diagnóstico diferencial obrigatoriamente amplo.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Origem<\/th><th>Principais diagnósticos<\/th><\/tr><\/thead><tbody><tr><td><strong>Ginecológica<\/strong><\/td><td>Endometriose · leiomioma · adenomiose · cistos ovarianos · síndrome do ovário remanescente · sequelas de doença inflamatória pélvica · dor pós-ligadura tubária · doença adesiva pélvica<\/td><\/tr><tr><td><strong>Urológica<\/strong><\/td><td>Cistite intersticial / síndrome da bexiga dolorosa · cistite por radiação · câncer de bexiga · síndrome uretral · cistite de repetição · urolitíase<\/td><\/tr><tr><td><strong>Gastrointestinal<\/strong><\/td><td>Síndrome do intestino irritável · doença inflamatória intestinal · carcinoma colorretal · doença celíaca · hérnias abdominais e pélvicas<\/td><\/tr><tr><td><strong>Musculoesquelética<\/strong><\/td><td>Dor miofascial da parede abdominal · mialgia por tensão do assoalho pélvico · fibromialgia · coccigodinia · síndrome do piriforme · ciatalgia<\/td><\/tr><tr><td><strong>Neurológica<\/strong><\/td><td>Infarto do nervo cutâneo da parede abdominal · neuralgia do pudendo · alodinia e hiperalgesia<\/td><\/tr><tr><td><strong>Vascular<\/strong><\/td><td>Varicosidades vulvares · síndrome da congestão pélvica<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Há ainda um grupo de <strong>causas psíquicas<\/strong> que amplifica todas as anteriores: depressão, somatização, uso de opiáceos, abuso sexual e distúrbios do sono. Ignorá-las é a receita para o quadro que não responde a analgésico nenhum.<\/p>"}]},{"h":"Endometriose: conceito, números e teorias","blocos":[{"html":"<p><strong>Rokitanski<\/strong> fez a primeira descrição em 1860; <strong>Sampson<\/strong>, em 1925, conceituou a doença como <em>\"doença não neoplásica, onde tecido semelhante ao endométrio é encontrado fora da cavidade uterina, mimetizando sua estrutura histológica e função\"<\/em>. O tecido ectópico guarda semelhança com a mucosa uterina no aspecto morfológico, imunológico e estrutural — inclusive na <strong>hormônio-dependência<\/strong>, que é o que sustenta todo o tratamento clínico.<\/p>"},{"html":"<h4>Epidemiologia<\/h4>"},{"html":"<ul><li><strong>10 a 14%<\/strong> das mulheres em fase reprodutiva (19 a 44 anos).<\/li><li><strong>25 a 50%<\/strong> das mulheres <strong>inférteis<\/strong>.<\/li><li>Brasil: 3,5 a 5 milhões de mulheres. Mundo: cerca de 60 milhões.<\/li><\/ul>"},{"html":"<h3>As teorias etiopatogênicas<\/h3>"},{"html":"<p>Nenhuma teoria isolada explica todos os focos, e é por isso que elas coexistem:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Teoria<\/th><th>O que propõe<\/th><\/tr><\/thead><tbody><tr><td><strong>Regurgitação transtubária<\/strong> (Sampson, 1924)<\/td><td>Sangue menstrual reflui pelas tubas levando células endometriais viáveis à cavidade pélvica — a mais aceita para a doença peritoneal<\/td><\/tr><tr><td><strong>Metaplasia celômica<\/strong><\/td><td>O epitélio celômico que reveste a pelve se transforma em tecido endometrial<\/td><\/tr><tr><td><strong>Restos embrionários<\/strong><\/td><td>Persistência de tecido mülleriano remanescente<\/td><\/tr><tr><td><strong>Disseminação linfática e hematogênica<\/strong><\/td><td>Explica focos a distância, fora da pelve<\/td><\/tr><tr><td><strong>Extensão direta<\/strong><\/td><td>Invasão a partir de foco adjacente<\/td><\/tr><tr><td><strong>Disseminação iatrogênica<\/strong><\/td><td>Implante mecânico durante ato cirúrgico<\/td><\/tr><tr><td><strong>Imunológica<\/strong><\/td><td>Falha da vigilância que deveria eliminar as células refluídas<\/td><\/tr><tr><td><strong>Neoplásica<\/strong><\/td><td>Comportamento semelhante ao de uma neoplasia<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Vale notar que o <strong>refluxo menstrual ocorre na maioria das mulheres<\/strong> — só uma fração desenvolve a doença. É justamente aí que entram as teorias imunológica e da receptividade peritoneal: o que distingue a paciente com endometriose não é refluir, é não conseguir eliminar o que refluiu.<\/p>"},{"html":"<p class=\"figleg\">Patogênese do implante: adesão, proliferação, invasão e neovascularização (lesão vermelha); reação inflamatória e fibrose (lesões negra e branca)<\/p>"},{"html":"<p>A sequência da figura é a história natural do implante: a lesão começa <strong>vermelha<\/strong>, ativa e neovascularizada; a reação inflamatória e o depósito de hemossiderina a tornam <strong>negra<\/strong>; a fibrose progressiva a converte em lesão <strong>branca<\/strong>, cicatricial. As três formas coexistem na mesma pelve.<\/p>"}]},{"h":"Quadro clínico, grupo de risco e por que parece estar aumentando","blocos":[{"html":"<p>O quadro clínico se organiza em dois eixos: <strong>dor<\/strong> e <strong>infertilidade<\/strong>. A dor aparece como dor pélvica crônica cíclica ou acíclica, <strong>dismenorreia<\/strong> e <strong>dispareunia de profundidade<\/strong> — esta deflagrada pela penetração profunda, que mobiliza ligamentos uterossacros e fundo de saco posterior comprometidos.<\/p>"},{"html":"<p>O mnemônico dos <strong>6 \"Ds\"<\/strong> resume a apresentação: <strong>d<\/strong>ismenorreia, <strong>d<\/strong>or pélvica, <strong>d<\/strong>ispareunia, <strong>d<\/strong>ificuldade para engravidar, <strong>d<\/strong>or ao urinar e <strong>d<\/strong>or ao evacuar. Os dois últimos são os mais reveladores: dor miccional aponta para bexiga e dor evacuatória para reto-sigmoide, isto é, para <strong>doença profunda<\/strong>.<\/p>"},{"html":"<p>O grupo de risco classicamente descrito é o de mulheres <strong>brancas, nulíparas, de nível social elevado e ansiosas<\/strong> — perfil em que o viés de acesso ao diagnóstico pesa tanto quanto a biologia.<\/p>"},{"html":"<h3>Está aumentando?<\/h3>"},{"html":"<p>O que mudou foi, em parte, o diagnóstico, e em parte a própria exposição. A mulher de hoje tem <strong>menarca mais precoce<\/strong>, <strong>menopausa mais tardia<\/strong> e, sobretudo, acumula <strong>400 a 450 ciclos menstruais<\/strong> ao longo da vida, contra <strong>40 a 50<\/strong> no passado, quando se casava cedo, engravidava muitas vezes e amamentava longamente. Mais ciclos, mais refluxo. Somam-se poluição, mudança alimentar, menor esforço físico, uso de métodos anticoncepcionais e gestação planejada e tardia.<\/p>"},{"html":"<blockquote><p><strong>Por que o diagnóstico demora tanto.<\/strong> A dismenorreia intensa é normalizada como \"cólica de mulher\"; a dor <strong>não guarda relação com o estadiamento<\/strong>, de modo que foco mínimo pode ser incapacitante e doença grave pode doer pouco; <strong>não existe marcador laboratorial<\/strong> que confirme ou afaste a doença; e a imagem só rende quando há preparo adequado e examinador treinado. O resultado é uma paciente que percorre vários consultórios antes de ser investigada.<\/p><\/blockquote>"}]},{"h":"As formas da doença","blocos":[{"html":"<p>Os tipos se organizam por aspecto da lesão (<strong>vermelha × negra × branca<\/strong>), por profundidade (<strong>superficial/peritoneal × infiltrativa/profunda<\/strong>) e por localização (<strong>pélvica × extrapélvica<\/strong>).<\/p>"},{"html":"<h3>Endometriose peritoneal<\/h3>"},{"html":"<p>Lesão <strong>superficial<\/strong>, em número variável sobre o peritônio. A origem mais provável é a <strong>menstruação retrógrada<\/strong>. O diagnóstico se apoia em clínica, laboratório e imagem — mas é a forma que mais escapa aos exames de imagem, porque as lesões são pequenas e planas.<\/p>"},{"html":"<h3>Endometriose ovariana — o endometrioma<\/h3>"},{"html":"<p>É a <strong>lesão mais típica<\/strong> da endometriose: formação <strong>cística, ovariana, repleta de líquido espesso e achocolatado, rodeada por cápsula densa e fibrosa<\/strong>. Russel fez a primeira descrição em 1899; o epitélio da cápsula apresenta áreas com estruturas semelhantes ao endométrio.<\/p>"},{"html":"<p>Sobre a etiopatogenia há três propostas — deposição de sangue menstrual retrógrado na superfície ovariana com posterior internalização na gônada (Brosens, 1994); processo endometriótico envolvendo inicialmente <strong>cistos funcionais<\/strong> do ovário (Nezhat, 1992); e <strong>metaplasia<\/strong> de células remanescentes do epitélio celômico no ovário (Donnez, 1996). A origem mais provável é <strong>mista<\/strong>: associação entre menstruação retrógrada e metaplasia.<\/p>"},{"html":"<p class=\"figleg\">Ultrassonografia do ovário esquerdo: endometrioma de conteúdo homogêneo, ao lado de folículos e de parênquima ovariano preservado<\/p>"},{"html":"<h3>Endometriose profunda (infiltrativa)<\/h3>"},{"html":"<p>Definida por implantes que alcançam <strong>profundidade superior a 0,5 cm<\/strong> e envolvem outros órgãos. É a forma de <strong>sintomatologia mais agressiva<\/strong>, que mais compromete bem-estar e qualidade de vida, e que <strong>interfere na fertilidade mesmo com técnicas de reprodução assistida<\/strong>.<\/p>"},{"html":"<p>Sítios acometidos:<\/p>"},{"html":"<ul><li>Ligamentos útero-sacros e/ou útero<\/li><li>Bexiga e/ou ureteres<\/li><li>Septo retovaginal e/ou intestinos<\/li><li>Nódulos em reto, sigmoide, órgãos genitais, vagina e, por vezes, intestino grosso e íleo<\/li><\/ul>"}]},{"h":"Classificações: ASRM e AAGL 2021","blocos":[{"html":"<p>A classificação da <strong>American Society for Reproductive Medicine (ASRM)<\/strong> pontua, na inspeção cirúrgica, o tamanho e a profundidade dos implantes peritoneais e ovarianos, a presença, extensão e tipo das aderências, e o grau de obliteração do fundo de saco. Os estádios dependem da pontuação:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Estádio<\/th><th>Escore<\/th><th>Achado<\/th><\/tr><\/thead><tbody><tr><td><strong>I — mínima<\/strong><\/td><td>1 a 5<\/td><td>Implantes isolados, sem aderências significantes<\/td><\/tr><tr><td><strong>II — leve<\/strong><\/td><td>6 a 15<\/td><td>Implantes superficiais com menos de 5 cm, sem aderências significantes<\/td><\/tr><tr><td><strong>III — moderada<\/strong><\/td><td>16 a 40<\/td><td>Múltiplos implantes, aderências peritubárias e periovarianas evidentes<\/td><\/tr><tr><td><strong>IV — grave<\/strong><\/td><td>acima de 40<\/td><td>Múltiplos implantes superficiais e profundos, endometriomas, aderências densas e firmes<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A classificação da <strong>AAGL (American Association of Gynecologic Laparoscopists), de 2021<\/strong>, usa escores por sítio anatômico — peritônio superficial, vagina, ovários, ureteres, tubas, fundo de saco, reto-sigmoide, septo retovaginal, região retrocervical, bexiga, ceco e apêndice — e converte o total em quatro estágios, com pontos de corte <strong>diferentes<\/strong> dos da ASRM: estágio 1 até 8 pontos, estágio 2 de 9 a 15, estágio 3 de 16 a 21 e estágio 4 acima de 21.<\/p>"},{"html":"<p class=\"figleg\">Classificação da AAGL 2021: pontua
