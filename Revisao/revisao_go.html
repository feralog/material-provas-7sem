tinta. Qual a conduta?","opts":["PAAF do linfonodo, classificado como categoria 4","Core biopsy do linfonodo, classificado como categoria 3","Controle ultrassonográfico em seis meses, categoria 3","Retorno ao rastreamento de rotina, categoria 2 no laudo"],"c":0,"exp":"Linfonodo axilar com perda do hilo gorduroso e cortical espessada é suspeito e recebe categoria 4, mesmo quando bilateral. A amostragem indicada em linfonodo axilar é a punção aspirativa por agulha fina, ao contrário das lesões da mama, em que se usa core biopsy ou mamotomia.","cap":"Linfonodo axilar com hilo gorduroso obliterado","ref":[3,2]},{"id":"361171bffc","q":"Mamografia mostrando nódulo denso e espiculado em região retroareolar, acompanhado de retração da papila. Qual a categoria e a conduta?","opts":["BI-RADS 5 — biópsia, mesmo se o ultrassom for pobre","BI-RADS 4A — seguimento semestral, se a paciente aceitar","BI-RADS 0 — compressão localizada antes de decidir a conduta","BI-RADS 3 — controle precoce por imagem em seis meses"],"c":0,"exp":"Nódulo espiculado somado a retração papilar é combinação altamente sugestiva de malignidade, com risco maior que 95%, ou seja, categoria 5. Quando a mamografia é BI-RADS 5, a biópsia está indicada independentemente do que mostre o ultrassom complementar.","cap":"Nódulo espiculado retroareolar com retração papilar","ref":[6,10]},{"id":"06880f2040","q":"Ultrassonografia mostrando imagem anecoica, oval, circunscrita, de paredes finas, com reforço acústico posterior e sombras de borda. Qual a classificação?","opts":["Cisto simples — BI-RADS 2, sem necessidade de punção","Cisto complicado — BI-RADS 3, controle em seis meses","Nódulo sólido hipoecoico — BI-RADS 4, com core biopsy","Cisto complexo — BI-RADS 4, punção associada a biópsia"],"c":0,"exp":"A tríade anecogenicidade, margens circunscritas com parede fina e reforço acústico posterior é diagnóstica de cisto simples. É achado benigno, categoria 2, que não requer punção nem seguimento diferenciado, apenas rotina para a idade.","cap":"Imagem anecoica com reforço acústico posterior","ref":[4,2]},{"id":"73c9976e94","q":"Mamografia de rastreamento em que o radiologista identifica uma imagem nodular e não consegue definir se é cisto ou nódulo sólido. Qual categoria e conduta se aplicam?","opts":["BI-RADS 0 — prosseguir com ultrassonografia complementar","BI-RADS 3 — controle precoce por imagem em seis meses","BI-RADS 2 — retorno ao rastreamento de rotina da idade","BI-RADS 4 — indicar core biopsy da lesão identificada"],"c":0,"exp":"A categoria 0 significa exame inconclusivo e é usada justamente na mamografia de rastreamento que não pode ser laudada como 1 ou 2. A complementação depende do achado: ultrassonografia para nódulo, compressão localizada para assimetria e ampliação para calcificações.","ref":[7,1]},{"id":"50c6ceafda","q":"Achado mamográfico classificado como BI-RADS 4B corresponde a qual faixa de risco de malignidade?","opts":["Maior que 10% e menor ou igual a 50%","Maior que 2% e menor ou igual a 10%","Maior que 50% e menor ou igual a 95%","Maior que 95% de risco de malignidade"],"c":0,"exp":"A categoria 4 abrange risco maior que 2% e até 95%, subdividida em 4A (baixa suspeição, >2% a 10%), 4B (suspeição intermediária, >10% a 50%) e 4C (alta suspeição, >50% a 95%). Todas as subdivisões têm biópsia como conduta.","ref":[3,1]},{"id":"2942d8cef2","q":"Paciente com carcinoma de mama já confirmado por biópsia, em controle de imagem durante quimioterapia neoadjuvante, cujo exame atual não mostra mais achados. Como classificar?","opts":["BI-RADS 6, pois o tratamento definitivo não foi realizado","BI-RADS 1, pois o exame atual não mostra qualquer achado","BI-RADS 2, pois a resposta completa é achado benigno","BI-RADS 3, pois há necessidade de controle em seis meses"],"c":0,"exp":"Durante a neoadjuvância a paciente permanece categoria 6 mesmo sem achados de imagem, porque o tratamento definitivo ainda não foi realizado. Só depois de concluído o tratamento o exame volta a ser classificado pelas demais categorias, conforme os achados.","ref":[7,3]},{"id":"94c14a2d91","q":"Por que a categoria 3 não deve ser atribuída diretamente em uma mamografia de rastreamento, sem complementação?","opts":["Pode gerar seguimento desnecessário e atrasar diagnósticos","Porque a categoria 3 só existe na ultrassonografia mamária","Porque o risco da categoria 3 ultrapassa 10% de malignidade","Porque a conduta da categoria 3 já seria a biópsia percutânea"],"c":0,"exp":"Sem os complementos, o achado pode ser benigno e gerar controle desnecessário, ou ser maligno e ter o diagnóstico postergado por seis meses. O correto é atribuir categoria 0 e complementar: ampliação para calcificações, compressão localizada para assimetrias e ultrassom para nódulos.","ref":[5,4]},{"id":"630aa2dfca","q":"Sobre a categoria 5, qual afirmação está correta?","opts":["Exige combinação de achados: nenhum achado isolado chega a 95%","Basta um nódulo circunscrito de alta densidade na mamografia","Um único grupo de calcificações amorfas já define a categoria","Basta a distorção arquitetural isolada em uma das incidências"],"c":0,"exp":"Nenhum achado mamográfico isolado alcança risco maior ou igual a 95%; a categoria 5 nasce da combinação, como nódulo irregular espiculado, de alta densidade e com microcalcificações. A consequência prática é que qualquer resultado de biópsia diferente de câncer é considerado discordante.","ref":[6,10]},{"id":"d11b5b12b9","q":"Mulher com linfonodopatia axilar detectada na mamografia, sem causa conhecida e sem achado suspeito na mama. Qual a categoria e a conduta?","opts":["Categoria 0 — ultrassom axilar e revisão dos dados clínicos","Categoria 2 — retorno ao rastreamento de rotina para a idade","Categoria 4 — punção aspirativa imediata do linfonodo axilar","Categoria 3 — controle da axila por imagem em seis meses"],"c":0,"exp":"Na ausência de causa conhecida, a linfonodopatia axilar é categoria 0, com complementação por ultrassonografia axilar e busca de informações clínicas. Se houver causa conhecida, mesmo maligna extramamária, entra em categoria 1 ou 2; se o ultrassom mostrar linfonodo suspeito, passa a categoria 4.","ref":[7,6]},{"id":"f695c310f2","q":"Qual é a principal vantagem da ultrassonografia como método complementar à mamografia?","opts":["Distinguir lesões sólidas de císticas e avaliar mamas densas","Detectar microcalcificações agrupadas em fase muito inicial","Substituir a mamografia no rastreamento após os 50 anos","Avaliar a extensão tumoral com melhor acurácia que a ressonância"],"c":0,"exp":"A ultrassonografia não usa radiação, diferencia com precisão lesão sólida de cística e tem maior sensibilidade em mamas densas e em mulheres jovens; além disso, é o método preferido para guiar biópsias percutâneas. Ela não detecta microcalcificações, que continuam sendo domínio da mamografia.","ref":[1,5]},{"id":"addcbac536","q":"Quais são as principais indicações da ressonância magnética de mamas com contraste?","opts":["Rastreamento de alto risco e avaliação da extensão tumoral","Rastreamento populacional de todas as mulheres acima de 50 anos","Diferenciação inicial entre lesões sólidas e císticas palpáveis","Caracterização de microcalcificações agrupadas suspeitas na mama"],"c":0,"exp":"A ressonância usa campo magnético e contraste intravenoso e permite análise funcional do realce das lesões. Suas indicações principais são o rastreamento de mulheres de alto risco, a avaliação da extensão tumoral e casos selecionados, não o rastreamento populacional.","ref":[1,7]},{"id":"c1a803e280","q":"Nódulo classificado como BI-RADS 3 na mamografia apresenta, no controle de seis meses, crescimento de cerca de 30% e margens antes circunscritas agora indistintas. Qual a conduta?","opts":["Reclassificar como BI-RADS 4 e indicar biópsia percutânea","Manter BI-RADS 3 e repetir a imagem em mais seis meses","Reclassificar como BI-RADS 2 e retornar à rotina para a idade","Reclassificar como BI-RADS 0 e apenas ampliar a área alterada"],"c":0,"exp":"A categoria 3 exige estabilidade: crescimento maior que 20% ou mudança das margens durante o seguimento é alteração significativa e leva à reclassificação em BI-RADS 4, com biópsia. Só a estabilidade por dois anos permite a reclassificação em categoria 2.","ref":[5,3]},{"id":"59c7484f38","q":"Mamografia mostrando calcificações amorfas distribuídas de forma difusa e bilateral, sem agrupamentos, comparáveis ao exame anterior. Qual a categoria?","opts":["BI-RADS 2, pois a distribuição difusa e bilateral é benigna","BI-RADS 4, pois a morfologia amorfa é sempre suspeita","BI-RADS 0, pois toda calcificação amorfa exige ampliação","BI-RADS 5, pois calcificações amorfas indicam carcinoma"],"c":0,"exp":"Nas calcificações a distribuição pesa tanto quanto a morfologia: amorfas difusas e bilaterais são categoria 2. As mesmas amorfas passam a suspeição intermediária, categoria 4, quando são regionais novas ou em aumento, agrupadas, lineares ou segmentares.","ref":[6,3]},{"id":"2471503819","q":"Qual incidência mamográfica avalia melhor o quadrante superolateral e o prolongamento axilar da mama?","opts":["Médio-lateral oblíqua, que divide a mama em superior e inferior","Crânio-caudal, que divide a mama em porção medial e lateral","Perfil a noventa graus, que dissocia imagens sobrepostas do tecido","Incidência de clivagem, que compara as duas mamas simultaneamente"],"c":0,"exp":"A médio-lateral oblíqua inclui o músculo peitoral e o prolongamento axilar, sendo a incidência que melhor avalia o quadrante superolateral, região onde se concentra a maioria dos carcinomas. A crânio-caudal cobre melhor os quadrantes mediais e a região retroareolar.","ref":[2,1]}],"resumo":[{"h":"Por que imagem importa em mastologia","blocos":[{"html":"<p>A imagem mamária existe para encontrar doença <strong>antes<\/strong> que ela se manifeste clinicamente. O alvo do rastreamento não é apenas o carcinoma invasivo: são também o <strong>carcinoma ductal in situ (CDIS)<\/strong> e as <strong>lesões precursoras<\/strong> — hiperplasias ductais e lobulares atípicas e o carcinoma lobular in situ. Boa parte dessas lesões não faz nódulo palpável; manifesta-se como microcalcificações, distorção arquitetural ou assimetria, achados que só existem na imagem.<\/p>"},{"html":"<p>Daí a lógica desta aula: primeiro conhecer os métodos e o que cada um enxerga, depois aprender a <strong>descrever<\/strong> o achado com o léxico correto e, por fim, traduzir a descrição em uma <strong>categoria BI-RADS<\/strong>, que é o que define a conduta.<\/p>"}]},{"h":"Os três métodos e suas indicações","blocos":[{"html":"<h3>Mamografia<\/h3>"},{"html":"<p>Radiografia com <strong>raios X de baixa dose<\/strong>. É o <strong>principal método de rastreamento<\/strong> do câncer de mama e o único capaz de identificar <strong>microcalcificações<\/strong> com confiabilidade, além de nódulos e distorções arquiteturais em fase inicial.<\/p>"},{"html":"<ul><li>Processo <strong>convencional<\/strong>: filme-tela intensificadora (STF), filme radiográfico.<\/li><li>Processo <strong>digital<\/strong>: detector eletrônico (DR).<\/li><li>Referência de dose útil para o consultório: a radiação anual recebida de <strong>fontes naturais<\/strong> equivale a cerca de <strong>4 a 6 mamografias<\/strong>.<\/li><\/ul>"},{"html":"<h3>Ultrassonografia<\/h3>"},{"html":"<p>Usa ondas sonoras, <strong>sem radiação ionizante<\/strong>. É <strong>complementar<\/strong>, nunca substituta da mamografia. Pontos fortes:<\/p>"},{"html":"<ul><li>Diferenciar com precisão lesão <strong>sólida<\/strong> de <strong>cística<\/strong>.<\/li><li><strong>Maior sensibilidade em mamas densas<\/strong> e em mulheres jovens.<\/li><li><strong>Guiar biópsias<\/strong> percutâneas com conforto e precisão.<\/li><\/ul>"},{"html":"<h3>Ressonância magnética<\/h3>"},{"html":"<p>Campo magnético e <strong>contraste intravenoso<\/strong>, permitindo análise <strong>funcional<\/strong> do realce das lesões. Indicações principais: <strong>alto risco<\/strong>, <strong>avaliação de extensão tumoral<\/strong> e casos selecionados — não rastreamento populacional.<\/p>"},{"html":"<p class=\"figleg\">RM axial pós-contraste com saturação de gordura: lesão nodular espiculada com impregnação intensa na mama esquerda<\/p>"}]},{"h":"Incidências, posicionamento e localização do achado","blocos":[{"html":"<h3>As duas incidências básicas<\/h3>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Incidência<\/th><th>Divide a mama em<\/th><th>Avalia melhor<\/th><\/tr><\/thead><tbody><tr><td><strong>MLO<\/strong> (médio-lateral oblíqua)<\/td><td>superior e inferior<\/td><td>quadrante superolateral e prolongamento axilar<\/td><\/tr><tr><td><strong>CC<\/strong> (crânio-caudal)<\/td><td>medial e lateral<\/td><td>quadrantes mediais e região retroareolar<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>O quadrante do achado só sai do <strong>cruzamento<\/strong> das duas incidências: uma dá o eixo superior/inferior, a outra o eixo medial/lateral.<\/p>"},{"html":"<p class=\"figleg\">MLO (1 = quadrantes superiores, 2 = inferiores) e CC (3 = laterais, 4 = mediais)<\/p>"},{"html":"<h4>Controle de qualidade do posicionamento<\/h4>"},{"html":"<p>Mede-se a distância da papila até o vértice do músculo peitoral na MLO e compara-se com a distância da papila até o ponto mais posterior na CC. <strong>A diferença não pode exceder 1 cm<\/strong> — acima disso, há tecido posterior fora do campo na crânio-caudal.<\/p>"},{"html":"<p>Além do quadrante, o laudo registra a <strong>profundidade<\/strong> (ou distância até a papila, ou zona anatômica): terço <strong>anterior<\/strong>, <strong>médio<\/strong> ou <strong>posterior<\/strong>.<\/p>"},{"html":"<h3>Incidências complementares<\/h3>"},{"html":"<ul><li><strong>Compressão localizada (spot)<\/strong>: placa seletiva de menor área, gera compressão mais efetiva e <strong>dissocia<\/strong> imagens sobrepostas. Serve para assimetria focal e distorção arquitetural — exclui ou confirma a lesão — e para avaliar <strong>margens de nódulos<\/strong>.<\/li><li><strong>Magnificação / ampliação<\/strong>: define <strong>forma e distribuição das calcificações<\/strong>.<\/li><li>Outras: rolada, <strong>mediolateral a 90º (perfil)<\/strong>, axilar e clivagem (<em>cleavage<\/em>).<\/li><\/ul>"},{"html":"<p class=\"figleg\">Incidência ampliada demonstrando um agrupamento de microcalcificações<\/p>"}]},{"h":"O léxico do BI-RADS","blocos":[{"html":"<p><strong>BI-RADS<\/strong> = <em>Breast Imaging Reporting and Data System<\/em>. Conjunto de recomendações internacionais para padronizar a nomenclatura dos laudos de imagem mamária, criado em <strong>1992<\/strong> pelo <strong>Colégio Americano de Radiologia (ACR)<\/strong>, introduzido no Brasil em <strong>1998<\/strong>; a <strong>6ª edição é de 2025<\/strong>.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Categoria<\/th><th>Achado<\/th><th>Conduta<\/th><th>Risco de malignidade<\/th><\/tr><\/thead><tbody><tr><td><strong>0<\/strong><\/td><td>Inconclusivo<\/td><td>Complementação<\/td><td>Não se aplica<\/td><\/tr><tr><td><strong>1<\/strong><\/td><td>Negativo<\/td><td>Rotina para a idade<\/td><td>Próximo de zero<\/td><\/tr><tr><td><strong>2<\/strong><\/td><td>Achados benignos<\/td><td>Rotina para a idade<\/td><td>Próximo de zero<\/td><\/tr><tr><td><strong>3<\/strong><\/td><td>Provavelmente benigno<\/td><td>Controle precoce (6 meses)<\/td><td>≤ 2%<\/td><\/tr><tr><td><strong>4<\/strong><\/td><td>Suspeito<\/td><td>Biópsia<\/td><td>&gt; 2% e ≤ 95%<\/td><\/tr><tr><td><strong>4A<\/strong><\/td><td>Baixa suspeição<\/td><td>Biópsia<\/td><td>&gt; 2% e ≤ 10%<\/td><\/tr><tr><td><strong>4B<\/strong><\/td><td>Suspeição intermediária<\/td><td>Biópsia<\/td><td>&gt; 10% e ≤ 50%<\/td><\/tr><tr><td><strong>4C<\/strong><\/td><td>Alta suspeição<\/td><td>Biópsia<\/td><td>&gt; 50% e ≤ 95%<\/td><\/tr><tr><td><strong>5<\/strong><\/td><td>Altamente sugestivo de malignidade<\/td><td>Biópsia<\/td><td>&gt; 95%<\/td><\/tr><tr><td><strong>6<\/strong><\/td><td>Biópsia prévia positiva para câncer<\/td><td>Conduta adequada ao caso<\/td><td>Não se aplica<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Na mama, a amostragem é <strong>core biopsy<\/strong> ou <strong>mamotomia<\/strong>; em <strong>linfonodo axilar suspeito<\/strong>, é <strong>PAAF<\/strong>.<\/p>"}]},{"h":"Achados benignos: as categorias 1 e 2","blocos":[{"html":"<p><strong>BI-RADS 1<\/strong> é o exame <strong>negativo<\/strong>: apenas tecido fibroglandular (TFG) e gordura em distribuição habitual, sem qualquer achado.<\/p>"},{"html":"<p><strong>BI-RADS 2<\/strong> exige um achado, mas um achado <strong>tipicamente benigno<\/strong>:<\/p>"},{"html":"<ul><li>Na <strong>mamografia<\/strong> — cistos calcificados; <strong>fibroadenoma calcificado<\/strong> (calcificação <em>em pipoca<\/em>); calcificações <strong>vasculares<\/strong>, <strong>grosseiras<\/strong> e esparsas; <strong>clipes<\/strong> pós-mamotomia e <strong>próteses<\/strong>; lipoma; cisto oleoso e galactocele.<\/li><li>No <strong>ultrassom<\/strong> — <strong>cisto simples<\/strong>: anecoico, oval, circunscrito, paredes finas, com <strong>reforço acústico posterior<\/strong>.<\/li><\/ul>"},{"html":"<h3>Calcificações tipicamente benignas<\/h3>"},{"html":"<ol><li><strong>Cutâneas<\/strong> — reconhecidas nos primeiros cortes da tomossíntese; costumam ter centro lucente.<\/li><li><strong>Vasculares<\/strong> — dois traços paralelos, em <em>trilho de trem<\/em>, acompanhando vaso tortuoso.<\/li><li><strong>Grosseiras<\/strong> e de <strong>fibroadenoma presumido<\/strong> — grandes, coalescentes, <em>em pipoca<\/em>.<\/li><li><strong>Grandes bastonetes<\/strong> — lineares, grossas (&gt; 1 mm), orientadas para a papila, difusas e bilaterais, da ectasia ductal.<\/li><li><strong>Anelares / em casca de ovo<\/strong> — parede fina e <strong>centro radiotransparente<\/strong>: cistos oleosos da <strong>esteatonecrose<\/strong> (trauma ou cirurgia prévia).<\/li><li><strong>Em camadas<\/strong> (leite de cálcio) — mudam de forma entre a CC e o perfil a 90º.<\/li><li><strong>De sutura<\/strong> — desenham o fio e os <strong>nós<\/strong> em mama operada.<\/li><\/ol>"},{"html":"<p class=\"figleg\">Calcificações em grandes bastonetes: lineares, grossas, difusas — ectasia ductal, tipicamente benignas<\/p>"},{"html":"<blockquote><p>Pegadinha clássica: <strong>grandes bastonetes<\/strong> (grossas, &gt; 1 mm, difusas, benignas) <em>versus<\/em> <strong>lineares finas ramificadas<\/strong> (&lt; 0,5 mm, agrupadas ou segmentares, típicas de CDIS). O nome é parecido, a conduta é oposta.<\/p><\/blockquote>"}]},{"h":"BI-RADS 3: o provavelmente benigno","blocos":[{"html":"<p>Risco em torno de <strong>2%<\/strong>. Situações estabelecidas:<\/p>"},{"html":"<ul><li>Nódulo <strong>sólido circunscrito não calcificado<\/strong>.<\/li><li><strong>Assimetria focal<\/strong> sem correlação no ultrassom.<\/li><li><strong>Grupo único de calcificações redondas agrupadas<\/strong>.<\/li><li>No ultrassom: nódulo circunscrito, <strong>paralelo à pele<\/strong>, margens bem delimitadas, hipoecoico ou isoecoico e homogêneo; <strong>cisto espesso<\/strong> (complicado, com ecos internos móveis).<\/li><\/ul>"},{"html":"<h4>Regras do seguimento<\/h4>"},{"html":"<ul><li>Controle aos <strong>6 meses<\/strong> (do lado alterado), <strong>12<\/strong> e <strong>24 meses<\/strong> (bilateral).<\/li><li><strong>Estabilidade por 2 anos → reclassificar como BI-RADS 2.<\/strong><\/li><li><strong>Crescimento &gt; 20%<\/strong> ou <strong>mudança de margens → BI-RADS 4 → biópsia.<\/strong><\/li><li>O seguimento é feito <strong>pelo método que evidenciou<\/strong> a lesão; se vista em mamografia e ultrassom, prefere-se o ultrassom pelo conforto — sem esquecer que a <strong>mamografia anual<\/strong> de rastreamento continua indicada para as demais lesões.<\/li><\/ul>"},{"html":"<blockquote><p>A categoria 3 <strong>não<\/strong> deve ser atribuída em mamografia de rastreamento sem complementação: isso gera seguimento desnecessário de achados benignos e atrasa diagnósticos. O correto é dar <strong>categoria 0<\/strong> e complementar — ampliação para calcificações, compressão localizada para assimetria, ultrassom para nódulo.<\/p><\/blockquote>"},{"html":"<h3>Assimetrias<\/h3>"},{"html":"<ul><li><strong>Assimetria<\/strong>: vista em <strong>apenas 1 incidência<\/strong>.<\/li><li><strong>Assimetria global<\/strong>: ocupa <strong>mais de 1 quadrante<\/strong>; estável, é benigna.<\/li><li><strong>Assimetria focal<\/strong>: ocupa <strong>menos de 1 quadrante<\/strong>. Em primeira mamografia ou sem prévios, após complemento e ultrassom → <strong>BI-RADS 3<\/strong>. <strong>Nova ou em crescimento → BI-RADS 4<\/strong> (VPP em torno de <strong>27%<\/strong>).<\/li><\/ul>"}]},{"h":"BI-RADS 4 e 5: achados suspeitos","blocos":[{"html":"<h3>Na mamografia<\/h3>"},{"html":"<ul><li><strong>Nódulo<\/strong> não circunscrito, heterogêneo, de alta densidade; <strong>espiculado<\/strong> já sugere categoria 5.<\/li><li><strong>Distorção arquitetural<\/strong>: convergência radiada de espículas <strong>sem massa central<\/strong>. Pode ser adenose esclerosante — mas também carcinoma ductal invasivo.<\/li><li><strong>Calcificações de morfologia suspeita<\/strong>, em ordem crescente de suspeição:<\/li><\/ul>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Morfologia<\/th><th>Aspecto<\/th><th>Contexto típico<\/th><\/tr><\/thead><tbody><tr><td><strong>Amorfas<\/strong><\/td><td>pequenas, nebulosas, sem forma definida; não mudam entre incidências<\/td><td>HDA, alteração fibrocística, CDIS<\/td><\/tr><tr><td><strong>Heterogêneas grosseiras<\/strong><\/td><td>irregulares, <strong>0,5 a 1 mm<\/strong>, tendem a coalescer<\/td><td>CDIS<\/td><\/tr><tr><td><strong>Pleomórficas finas<\/strong><\/td><td>variam em tamanho e forma, <strong>&lt; 0,5 mm<\/strong>, mais nítidas que as amorfas<\/td><td>CDIS, carcinoma invasivo<\/td><\/tr><tr><td><strong>Lineares finas / ramificadas<\/strong><\/td><td>finas, irregulares, descontínuas, <strong>&lt; 0,5 mm<\/strong>, com ramificações<\/td><td>CDIS<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A <strong>distribuição<\/strong> modifica a categoria tanto quanto a morfologia: amorfas <strong>bilaterais e difusas<\/strong> são <strong>BI-RADS 2<\/strong>; as mesmas amorfas <strong>regionais novas ou em aumento, agrupadas, lineares ou segmentares<\/strong> viram <strong>BI-RADS 4<\/strong>.<\/p>"},{"html":"<p class=\"figleg\">Calcificações pleomórficas finas de distribuição segmentar — CDIS com carcinoma invasivo<\/p>"},{"html":"<p class=\"figleg\">Distorção arquitetural: espículas convergindo para um ponto, sem nódulo central<\/p>"},{"html":"<h3>No ultrassom<\/h3>"},{"html":"<p>Descritores suspeitos: <strong>margens não circunscritas<\/strong> (anguladas, microlobuladas, <strong>espiculadas<\/strong>), ecotextura <strong>heterogênea<\/strong>, <strong>orientação não paralela<\/strong> à pele (mais alto que largo), <strong>halo ecogênico<\/strong> e <strong>sombra acústica posterior<\/strong>. <strong>Linfonodo axilar<\/strong> com cortical espessada e <strong>hilo gorduroso obliterado<\/strong> é suspeito → <strong>categoria 4<\/strong> (mesmo se bilateral) → <strong>PAAF<\/strong>.<\/p>"},{"html":"<p class=\"figleg\">Nódulo espiculado de alta densidade na mamografia — BI-RADS 5<\/p>"},{"html":"<h3>Particularidades das categorias 4 e 5<\/h3>"},{"html":"<ul><li><strong>4A<\/strong>: é possível optar por <strong>seguimento<\/strong>, se a paciente estiver de acordo.<\/li><li><strong>5<\/strong>: nasce da <strong>combinação<\/strong> de achados — <strong>nenhum achado mamográfico isolado atinge risco ≥ 95%<\/strong>. Exemplos: nódulo irregular, espiculado, de alta densidade, com microcalcificações; ou calcificações lineares finas ramificadas segmentares novas em relação ao exame prévio. Achados associados que reforçam: <strong>retração cutânea<\/strong> e <strong>retração papilar<\/strong>.<\/li><li>Se a <strong>mamografia é BI-RADS 5<\/strong>, indica-se biópsia <strong>independentemente<\/strong> do achado ultrassonográfico.<\/li><li>Consequência prática do 5: qualquer resultado de biópsia diferente de câncer é <strong>discordante<\/strong>.<\/li><\/ul>"}]},{"h":"Categorias 0 e 6 e as pegadinhas do laudo","blocos":[{"html":"<h3>Categoria 0 — inconclusivo<\/h3>"},{"html":"<p>Usada na <strong>mamografia de rastreamento<\/strong> que não pode ser laudada definitivamente como 1 ou 2 (imagem nodular: cisto ou nódulo verdadeiro? assimetria: TFG ou nódulo obscurecido?). É <strong>raramente<\/strong> usada em mamografia diagnóstica, por exemplo em exame incompleto. No ultrassom, é pouco utilizada. A conduta é <strong>prosseguir a investigação<\/strong>: compressão localizada, ampliação, ultrassonografia ou ressonância.<\/p>"},{"html":"<h3>Categoria 6 — biópsia prévia positiva<\/h3>"},{"html":"<ul><li>Controle de imagem <strong>durante<\/strong> quimioterapia ou endocrinoterapia <strong>neoadjuvante<\/strong> — mantém-se <strong>categoria 6 mesmo sem achados<\/strong>, porque o tratamento definitivo não foi realizado.<\/li><li>Controle após longo período do diagnóstico, quando a paciente evade.<\/li><li>Cirurgia com <strong>margem comprometida + pelo menos 1 achado<\/strong> sugestivo de tumor residual → <strong>categoria 6<\/strong>.<\/li><li>Cirurgia com <strong>margem comprometida + ausência de achado<\/strong> → <strong>categoria 2<\/strong> com frase explicativa.<\/li><li><strong>Terminado o tratamento<\/strong>, o exame <strong>deixa de ser categoria 6<\/strong> e volta a ser classificado pelos achados de imagem.<\/li><\/ul>"},{"html":"<h3>Comparação com exames anteriores<\/h3>"},{"html":"<p>Reduz a necessidade de complementos e é <strong>essencial para a categoria 3<\/strong>. Porém: diante de achado suspeito, <strong>não se atrasa a biópsia<\/strong> para conseguir os exames prévios. A comparação e a conclusão do laudo devem ocorrer em até <strong>30 dias<\/strong>.<\/p>"},{"html":"<blockquote><p><strong>Linfonodopatia axilar<\/strong> — se a causa é conhecida (mesmo neoplasia maligna extramamária): categoria <strong>1 ou 2<\/strong>. Se <strong>não há causa conhecida<\/strong>: categoria <strong>0<\/strong>, com ultrassom axilar e informações clínicas (na edição de 2013 era categoria 4). Se o ultrassom mostrar linfonodo <strong>suspeito<\/strong>: categoria <strong>4<\/strong>, mesmo sendo bilateral.<\/p><\/blockquote>"}]}]},{"slug":"incontinencia-urinaria","titulo":"Incontinência Urinária","disciplina":"GO","eyebrow":"Ginecologia e Obstetrícia · Uroginecologia","questoes":[{"id":"747a35027f","q":"De acordo com a definição da International Continence Society, incontinência urinária é:","opts":["qualquer perda involuntária de urina referida pela paciente","perda involuntária de urina apenas durante o esforço físico","perda de urina acompanhada obrigatoriamente de urgência","perda de urina com resíduo pós-miccional acima de 100 mL"],"c":0,"exp":"A definição é deliberadamente ampla: queixa de qualquer perda involuntária de urina, sem exigir esforço, urgência ou medida de resíduo. O tipo e o mecanismo são determinados depois, pela caracterização clínica da perda. Trata-se de condição que compromete de forma significativa a qualidade de vida.","ref":[0,0]},{"id":"f4d2e52367","q":"A incontinência urinária de esforço decorre de perda de urina relacionada a:","opts":["hipermobilidade uretral ou deficiência esfincteriana intrínseca","contrações involuntárias do detrusor durante o enchimento vesical","hipoatividade do detrusor com retenção urinária crônica associada","inibição cortical deficiente sobre o reflexo miccional na ponte"],"c":0,"exp":"A perda ocorre com esforço físico (pular, correr, tossir) porque o mecanismo de fechamento uretral falha: ou a uretra é hipermóvel, por defeito do suporte, ou o esfíncter é intrinsecamente deficiente. Contração involuntária do detrusor caracteriza a incontinência de urgência, não a de esforço.","ref":[0,4]},{"id":"db8a5756d0","q":"Mulher de 52 anos, três partos vaginais, perde urina ao tossir, correr e levantar peso, sem desejo miccional prévio à perda. O diagnóstico mais provável é:","opts":["incontinência de esforço, por falha do suporte uretral","incontinência de urgência, por hiperatividade detrusora","incontinência por transbordamento, com retenção crônica","incontinência funcional, por limitação da mobilidade"],"c":0,"exp":"A perda sincronizada ao aumento da pressão abdominal, sem urgência precedente, define a incontinência de esforço. Multiparidade e partos vaginais reforçam a hipótese: o parto vaginal lesa mucosa vaginal, músculos, fáscia endopélvica e ligamentos que sustentam a uretra.","ref":[2,3]},{"id":"2929634936","q":"Mulher de 60 anos refere desejo súbito e incontrolável de urinar, oito micções diárias e duas noctúrias, com urocultura negativa. O quadro caracteriza:","opts":["síndrome da bexiga hiperativa, com urgência miccional","incontinência de esforço por defeito de suporte uretral","infecção urinária baixa de repetição ainda não tratada","bexiga neurogênica por lesão medular completa prévia"],"c":0,"exp":"A urgência miccional não fisiológica é o sintoma que define a síndrome, habitualmente acompanhada de aumento da frequência e de noctúria. O diagnóstico exige ausência de fatores infecciosos, metabólicos ou locais — daí a urocultura negativa ser parte da definição.","ref":[6,0]},{"id":"c858344046","q":"Mulher de 65 anos perde urina ao espirrar e também quando não consegue chegar ao banheiro após urgência súbita. A conduta correta é:","opts":["tratar primeiro o componente predominante da queixa","indicar sling de uretra média como primeira medida","prescrever antimuscarínico e dispensar a avaliação","encaminhar para derivação urinária definitiva logo"],"c":0,"exp":"O quadro é de incontinência mista, combinação de esforço e urgência, mais comum em idosas. A regra prática é tratar o componente que mais incomoda a paciente, e a investigação urodinâmica é frequentemente necessária para caracterizar os dois componentes antes de qualquer cirurgia.","ref":[0,4]},{"id":"7c97dbe2d5","q":"Mulher diabética de 70 anos apresenta perda urinária contínua em gotas, esforço para iniciar a micção e resíduo pós-miccional de 350 mL. O quadro corresponde a:","opts":["incontinência por transbordamento, com bexiga hipoativa","incontinência de esforço, com hipermobilidade uretral","incontinência de urgência, com detrusor hiperativo","incontinência mista, com dois componentes somados"],"c":0,"exp":"Resíduo pós-miccional elevado, jato hesitante e gotejamento contínuo indicam esvaziamento incompleto, por hipoatividade detrusora (neuropatia diabética) ou obstrução. É exatamente por isso que a medida do resíduo, preferencialmente por ultrassonografia, integra a avaliação básica: antes de tratar como urgência, é preciso excluir retenção.","ref":[0,4]},{"id":"a26224988f","q":"A contração do detrusor que produz a micção é mediada por:","opts":["nervo pélvico parassimpático, por receptores muscarínicos","nervo hipogástrico simpático, por receptores beta-3 do detrusor","nervo pudendo somático, por placa motora da musculatura estriada","nervo ilioinguinal sensitivo, por fibras aferentes do urotélio"],"c":0,"exp":"O esvaziamento é parassimpático: o nervo pélvico, com origem em S2–S4, ativa receptores muscarínicos M2 e M3 do detrusor e promove sua contração, acompanhada do relaxamento do esfíncter uretral interno. O centro pontino coordena esse reflexo e o córtex pode inibi-lo ou iniciá-lo voluntariamente.","ref":[1,5]},{"id":"cf0d7af2a3","q":"Durante a fase de armazenamento vesical, a ativação simpática promove:","opts":["relaxamento do detrusor e contração do colo vesical","contração do detrusor e relaxamento do colo vesical","relaxamento do detrusor e abertura do colo vesical","contração do detrusor e fechamento do colo vesical"],"c":0,"exp":"Pelo nervo hipogástrico, os receptores beta-adrenérgicos relaxam o detrusor (acomodando volume a baixa pressão) e os alfa-adrenérgicos contraem o colo vesical. Some-se o esfíncter estriado contraído pelo pudendo: a pressão uretral supera a vesical e há continência.","ref":[1,3]},{"id":"5066394e5b","q":"O esfíncter uretral estriado e a musculatura do assoalho pélvico são inervados pelo:","opts":["nervo pudendo, somático, com origem em S2 a S4","nervo pélvico, parassimpático, originado em S2 a S4","nervo hipogástrico, simpático, da cadeia toracolombar","nervo obturador, motor, do plexo lombar superior"],"c":0,"exp":"A inervação é somática, pelo nervo pudendo, cujos corpos celulares formam o núcleo de Onuf, na medula sacral. Esse núcleo é justamente o alvo da duloxetina, que ali aumenta serotonina e noradrenalina e reforça o tônus do esfíncter estriado.","ref":[1,8]},{"id":"de8811a737","q":"Durante a fase de enchimento vesical, o comportamento esperado do trato urinário inferior é:","opts":["detrusor relaxado com esfíncter uretral contraído","detrusor contraído com esfíncter uretral relaxado","detrusor contraído com esfíncter uretral contraído","detrusor relaxado com esfíncter uretral relaxado"],"c":0,"exp":"O enchimento ocorre a baixa pressão graças à complacência: o detrusor permanece relaxado enquanto o esfíncter uretral e o assoalho pélvico se mantêm contraídos. Só na micção o padrão se inverte — detrusor contrai e esfíncter relaxa, de forma coordenada.","cap":"Ciclo da função vesical normal","ref":[1,5]},{"id":"7f7a29d4c1","q":"A teoria da rede (hammock theory) explica a continência afirmando que:","opts":["a uretra é comprimida contra uma camada de suporte","o colo vesical precisa ficar em posição intra-abdominal","a coaptação da mucosa uretral faz o efeito de selagem","um eixo de forças traciona a uretra anteriormente"],"c":0,"exp":"Proposta em 1994, descreve a uretra repousando sobre uma camada de suporte que funciona como rede e serve de anteparo para a compressão uretral durante o esforço. As demais alternativas correspondem a outras teorias: equalização da pressão intra-abdominal (1967), deficiência esfincteriana intrínseca (1976) e teoria integral (1990).","ref":[2,1]},{"id":"3e7190203f","q":"Entre os principais fatores de risco para incontinência urinária de esforço estão:","opts":["número de gestações, parto vaginal e envelhecimento","uso de anticoncepcional, tabagismo e sedentarismo","menarca precoce, nuliparidade e baixo peso corporal","cesariana eletiva, amamentação e idade abaixo de 30"],"c":0,"exp":"Cada gestação aumenta o risco; o parto vaginal lesa as estruturas de suporte do assoalho pélvico e da uretra (mucosa vaginal, músculos, fáscia endopélvica e ligamentos); e o envelhecimento altera as fibras musculares e o colágeno. Obesidade e menopausa somam-se como fatores agravantes.","ref":[2,3]},{"id":"e29ebca526","q":"Na reprodução da perda urinária ao exame físico da incontinência de esforço, o correto é examinar a paciente:","opts":["com a bexiga cheia, pedindo tosse ou manobra de Valsalva","com a bexiga vazia, após esvaziamento espontâneo prévio","somente em posição ginecológica, mantida sempre deitada","apenas durante o estudo urodinâmico, em sala de exame"],"c":0,"exp":"O objetivo é reproduzir e caracterizar a perda, o que exige bexiga confortavelmente cheia e manobras de esforço. O exame deve ser feito em posição ginecológica e também em ortostatismo, situação em que a perda muitas vezes só então se evidencia.","ref":[3,2]},{"id":"08a8c40b1d","q":"Em paciente com prolapso genital acentuado, a redução do prolapso durante o exame físico serve para:","opts":["revelar incontinência urinária oculta pelo prolapso","medir a mobilidade uretral com precisão bem maior","estimar o resíduo pós-miccional sem usar sondagem","graduar a força da musculatura do assoalho pélvico"],"c":0,"exp":"O prolapso acentuado angula e comprime a uretra, mascarando a perda urinária. Ao reduzi-lo e repetir as manobras de esforço, identifica-se a incontinência oculta — informação decisiva, porque a correção isolada do prolapso pode transformar uma paciente continente em incontinente.","ref":[3,3]},{"id":"021322bcb3","q":"No teste do absorvente (pad test), caracteriza perda involuntária de urina:","opts":["diferença de peso do absorvente maior que 1 grama","diferença de peso do absorvente maior que 10 gramas","qualquer aumento de peso do absorvente em uma hora","diferença de peso do absorvente maior que 50 gramas"],"c":0,"exp":"O absorvente é pesado antes, colocado junto ao meato uretral externo e pesado de novo após período determinado. Ganho superior a 1 grama caracteriza perda involuntária. O teste quantifica a perda de forma objetiva, complementando a impressão subjetiva da paciente.","ref":[3,7]},{"id":"48f31801ca","q":"Na avaliação inicial de toda paciente com queixa de perda urinária, são considerados indispensáveis:","opts":["urina tipo I e urocultura, para afastar infecção urinária","estudo urodinâmico e uretrocistoscopia sempre na abertura","citologia urinária e tomografia computadorizada da pelve","ressonância do assoalho pélvico e cintilografia renal"],"c":0,"exp":"Infecção urinária causa urgência e perda e precisa ser afastada antes de qualquer rótulo diagnóstico. Compõem ainda a avaliação básica a medida do resíduo pós-miccional, preferencialmente por ultrassonografia, e os questionários de qualidade de vida, método de escolha para avaliar severidade e impacto dos sintomas.","ref":[3,5]},{"id":"3b2fa8c8aa","q":"O estudo urodinâmico na investigação da perda urinária está indicado quando:","opts":["há perda aos esforços associada ou se planeja cirurgia","a paciente refere urgência miccional pela primeira vez","o diagnóstico clínico de perda aos esforços é evidente","a paciente iniciou tratamento comportamental há um mês"],"c":0,"exp":"A urodinâmica não faz parte da avaliação inicial, sobretudo quando o tratamento planejado é clínico. Suas indicações são queixa associada de perda aos esforços, planejamento de cirurgia para incontinência ou prolapso, bexiga hiperativa neurogênica e refratariedade ao tratamento convencional.","ref":[3,10]},{"id":"fc4c205f78","q":"A avaliação da mobilidade uretral é solicitada principalmente quando se cogita indicar:","opts":["injeção periuretral de agente de preenchimento","colocação de sling de uretra média por via TOT","treinamento vesical com diário miccional seriado","aplicação intradetrusora de toxina botulínica"],"c":0,"exp":"Os agentes de preenchimento têm melhor resultado nos casos de uretra fixa, por isso a mobilidade precisa ser conhecida antes da indicação. A medida pode ser feita pelo teste do cotonete (Q-tip test) ou, preferencialmente, por ultrassonografia, já que o cotonete tem baixa sensibilidade e especificidade.","ref":[3,8]},{"id":"0481bd5258","q":"O tratamento de primeira linha da incontinência urinária de esforço é:","opts":["fisioterapia do assoalho pélvico, com exercícios perineais","sling de uretra média por via retropúbica ou transobturatória","duloxetina oral na dose de 80 mg ao dia por doze semanas","injeção periuretral de agente de preenchimento uretral"],"c":0,"exp":"O tratamento conservador abre a sequência terapêutica, com taxas de sucesso de 30% a 80%. Além dos exercícios perineais, compõem o arsenal o biofeedback, a eletroestimulação (cura de 30% a 50% e melhora de 60% a 90%) e os cones vaginais, de 20 a 100 gramas, com sucesso de 60% a 78%.","ref":[4,0]},{"id":"284308a18c","q":"São contraindicações absolutas ao uso de oxibutinina na bexiga hiperativa:","opts":["glaucoma de ângulo fechado, retenção urinária e obstrução intestinal","hipertensão não controlada, síndrome do QT longo e arritmia cardíaca","insuficiência hepática leve, constipação intestinal e queixa de boca seca","miastenia já tratada, sonolência diurna e alteração do nível de consciência"],"c":0,"exp":"O bloqueio muscarínico agrava o glaucoma de ângulo fechado, a retenção urinária e a obstrução intestinal, que por isso são contraindicações absolutas. Hipertensão não controlada e QT longo restringem a mirabegrona, agonista beta-3, e não os antimuscarínicos.","ref":[7,6]},{"id":"116f15e221","q":"O oxalato de duloxetina melhora a incontinência urinária de esforço porque:","opts":["aumenta serotonina e noradrenalina no núcleo de Onuf","bloqueia receptores muscarínicos M2 e M3 do detrusor","ativa receptores beta-3 adrenérgicos da parede vesical","reduz a produção urinária por ação no túbulo coletor"],"c":0,"exp":"É um inibidor da recaptação de serotonina e noradrenalina que age no núcleo de Onuf, conjunto de neurônios sacrais que comanda os músculos estriados do assoalho pélvico. O resultado é aumento da pressão de resistência uretral, da pressão máxima de fechamento e da espessura do esfíncter estriado; 80 mg/dia por 12 semanas reduzem 50% a 60% dos episódios de perda.","ref":[4,4]},{"id":"fb3d807ecd","q":"Atualmente, a técnica cirúrgica com as melhores e maiores evidências no tratamento da incontinência de esforço é:","opts":["o sling de uretra média, sem tensão sob a uretra","a colpofixação retropúbica de Marshall-Marchetti","a injeção periuretral de partículas de silicone","a ampliação vesical com segmento de íleo ou cólon"],"c":0,"exp":"Os slings de uretra média superaram as colpofixações retropúbicas (Burch e Marshall-Marchetti-Krantz) como padrão cirúrgico. Os agentes de preenchimento são reservados a casos selecionados de defeito esfincteriano, e a ampliação vesical pertence ao tratamento de exceção da bexiga hiperativa.","ref":[5,1]},{"id":"97fc11d678","q":"Comparado ao sling retropúbico, o sling por via transobturatória apresenta:","opts":["menor risco de trauma visceral e de hematoma no Retzius","maior risco de perfuração vesical e de lesão epigástrica","maior incidência de disúria por compressão da uretra","menor taxa de cura, entre 40% e 60% dos casos tratados"],"c":0,"exp":"A passagem transobturatória evita o espaço retropúbico, reduzindo trauma visceral e vasculonervoso e hematoma no espaço de Retzius, além de causar menos disúria por comprimir menos a uretra. As taxas de cura são de 81% a 100%, contra 74% a 95% da via retropúbica.","ref":[5,6]},{"id":"204f176ba5","q":"O mini-sling, ou sling de incisão única, caracteriza-se por:","opts":["incisão vaginal única, sem orifícios cutâneos de saída","duas incisões inguinais além da incisão vaginal única","faixa mais larga, com maior volume de material sintético","fixação do colo vesical ao ligamento de Cooper pélvico"],"c":0,"exp":"A incisão é única, de cerca de 1,5 cm na parede vaginal anterior logo abaixo da uretra média, e as extremidades da fita têm âncoras fixadas nos músculos obturadores ou em membranas da pelve. Usa menos material sintético e encurta o trajeto cego, com o objetivo de reduzir infecções e traumas viscerais.","ref":[5,8]},{"id":"b38ed143cb","q":"A injeção periuretral de agentes de preenchimento é indicada sobretudo diante de:","opts":["defeito esfincteriano intrínseco com uretra sem mobilidade","hipermobilidade uretral com esfíncter íntegro e competente","hiperatividade detrusora refratária ao antimuscarínico oral","bexiga de baixa capacidade com complacência muito reduzida"],"c":0,"exp":"É método minimamente invasivo para incontinência de esforço por defeito esfincteriano intrínseco sem mobilidade uretral, e também para falha cirúrgica prévia ou comorbidades que inviabilizam a cirurgia. A eficácia é atribuída à expansão das paredes uretrais, que melhora a coaptação; no Brasil há colágeno bovino, gordura autóloga, carbono pirolítico e polidimetilsiloxano.","ref":[5,10]},{"id":"8e88ca3748","q":"Na comparação entre os tipos de incontinência urinária, a forma mista:","opts":["combina perda ao esforço e perda por urgência miccional","combina perda ao esforço e retenção urinária crônica","define perda contínua por fístula vesicovaginal prévia","define perda apenas noturna, sem qualquer sintoma diurno"],"c":0,"exp":"A forma mista soma o componente de esforço, ligado à hipermobilidade uretral ou à insuficiência esfincteriana, ao componente de urgência, ligado à hiperatividade detrusora. É mais comum em idosas e costuma exigir diagnóstico urodinâmico para definir qual componente predomina.","cap":"Tipos de incontinência urinária","ref":[0,4]},{"id":"407738e356","q":"A síndrome da bexiga hiperativa é definida pela presença de:","opts":["urgência miccional, na ausência de infecção ou causa local","perda urinária ao esforço, na ausência de urgência associada","resíduo pós-miccional elevado, com jato urinário muito fraco","hiperatividade do detrusor documentada em cistometria prévia"],"c":0,"exp":"A urgência miccional não fisiológica é o sintoma que define a síndrome, usualmente com aumento da frequência e noctúria, e exige ausência de fatores infecciosos, metabólicos ou locais. A urgeincontinência está presente em cerca de um terço a metade das pacientes, e o diagnóstico é clínico — a cistometria não é obrigatória.","ref":[6,0]},{"id":"444b5be947","q":"Entre os fenótipos fisiopatológicos descritos para a síndrome da bexiga hiperativa está:","opts":["a síndrome metabólica, ao lado do hipoestrogenismo","a hipermobilidade uretral, ao lado da paridade alta","o defeito esfincteriano, ao lado da uretra fixa curta","a fístula vesicovaginal, ao lado do divertículo uretral"],"c":0,"exp":"Os fenótipos fisiopatológicos reconhecidos incluem síndrome metabólica, transtornos afetivos, hipoestrogenismo, microbiota urinária, distúrbios gastrintestinais e disfunções do sistema nervoso autônomo. Pela demonstração urodinâmica descrevem-se as formas miogênica, uroteliogênica, uretrogênica, supraespinhal e uroteliomiogênica. Hipermobilidade uretral e defeito esfincteriano pertencem à incontinência de esforço.","cap":"Fenótipos da bexiga hiperativa","ref":[6,3]},{"id":"7785c49d77","q":"O diário miccional na avaliação da bexiga hiperativa serve para:","opts":["registrar volume urinado, ingesta e intensidade dos sintomas","medir a pressão do detrusor durante o enchimento vesical","quantificar a perda urinária pelo peso do absorvente usado","avaliar a mobilidade do colo vesical durante o esforço físico"],"c":0,"exp":"O diário identifica o tipo e a quantidade de líquido ingerido, o volume urinado e a intensidade dos sintomas, sendo auxiliar importante tanto no diagnóstico quanto na avaliação da resposta ao tratamento. Pressão detrusora é medida pela urodinâmica e perda por peso, pelo teste do absorvente.","ref":[6,5]},{"id":"cfa967643c","q":"A hiperatividade terminal do detrusor, na cistometria, caracteriza-se por:","opts":["contração única não inibida na capacidade cistométrica máxima","contrações repetidas de amplitude crescente durante o enchimento","ausência de contrações involuntárias ao longo de toda a cistometria","elevação sustentada da pressão uretral durante o esvaziamento vesical"],"c":0,"exp":"Na forma terminal ocorre uma única contração não inibida, justamente quando a bexiga atinge a capacidade cistométrica máxima. Já a hiperatividade fásica traz contrações não inibidas de amplitude crescente conforme o volume aumenta, e é o achado mais comum da hiperatividade vesical idiopática.","cap":"Estudo urodinâmico e tipos de hiperatividade detrusora","ref":[6,9]},{"id":"d49b9161c3","q":"A segunda linha de tratamento da síndrome da bexiga hiperativa corresponde a:","opts":["antimuscarínicos ou agonista beta-3 adrenérgico","treinamento vesical e mudanças comportamentais","toxina botulínica intradetrusora e neuromodulação","cistoplastia de aumento e derivação urinária externa"],"c":0,"exp":"A sequência é progressiva: primeira linha conservadora (comportamental e fisioterápica), segunda linha farmacológica com antimuscarínicos ou agonistas beta-3, terceira linha minimamente invasiva (toxina onabotulínica A, neuromodulação sacral e estimulação do nervo tibial) e quarta linha cirúrgica, reservada a casos refratários.","ref":[7,2]},{"id":"4ab70cd229","q":"O treinamento vesical, no manejo conservador da bexiga hiperativa, consiste em:","opts":["micção programada com aumento progressivo do intervalo","micção a cada hora para manter a bexiga sempre vazia","restrição total de líquidos ao longo de todo o período","contração do assoalho pélvico com auxílio de biofeedback"],"c":0,"exp":"O objetivo é readquirir o controle sobre o reflexo da micção por micções programadas cujo intervalo é ampliado aos poucos. Urinar preventivamente a cada hora tem efeito oposto, pois reduz a capacidade funcional da bexiga e perpetua a urgência.","cap":"Tratamento conservador da síndrome da bexiga hiperativa","ref":[7,1]},{"id":"92fff0bc93","q":"Entre as medidas comportamentais para a bexiga hiperativa, recomenda-se:","opts":["reduzir cerca de 25% da ingesta hídrica e evitar cafeína","aumentar a ingesta hídrica para diluir a urina noturna","urinar a cada hora para não acumular volume na bexiga","suspender toda a ingesta de líquidos depois do almoço"],"c":0,"exp":"A redução de aproximadamente 25% na ingesta hídrica melhora de forma significativa frequência, urgência e noctúria. Recomenda-se ainda evitar cafeína, frutas cítricas, vinagre e bebidas alcoólicas, que exacerbam os sintomas, além de perda de peso e cessação do tabagismo.","ref":[7,1]},{"id":"eb935fd5ef","q":"O uso crônico de anticolinérgicos em pacientes acima de 65 anos tem sido associado a:","opts":["maior risco de desenvolvimento de demência, incluindo Alzheimer","maior risco de hipertensão arterial e de taquicardia sinusal","maior risco de fratura de quadril por hipotensão postural","maior risco de trombose venosa profunda em membros inferiores"],"c":0,"exp":"Estudos recentes ligam o uso crônico de anticolinérgicos em idosos a maior risco de certos tipos de demência, incluindo a doença de Alzheimer. Como a eficácia entre os antimuscarínicos é semelhante, a escolha é norteada pela incidência e severidade dos efeitos colaterais, e nessa faixa etária o balanço pesa contra o uso prolongado.","ref":[7,6]},{"id":"0730994b81","q":"Paciente com bexiga hiperativa e hipertensão arterial não controlada. O fármaco que está contraindicado é a:","opts":["mirabegrona, contraindicada na hipertensão não controlada","solifenacina, contraindicada na hipertensão não controlada","oxibutinina, contraindicada na hipertensão não controlada","tolterodina, contraindicada na hipertensão não controlada"],"c":0,"exp":"A mirabegrona, agonista beta-3 adrenérgico em comprimidos de 50 mg ao dia, tem hipertensão e taquicardia entre seus efeitos adversos e hipertensão não controlada como contraindicação absoluta. Os antimuscarínicos não compartilham essa restrição: suas contraindicações típicas são glaucoma de ângulo fechado, retenção urinária e obstrução intestinal.","cap":"Terapia farmacológica para bexiga hiperativa","ref":[7,6]},{"id":"bf33b7a8a9","q":"A toxina onabotulínica A aplicada no detrusor tem efeito que:","opts":["começa em torno de sete dias e dura de seis a nove meses","começa em torno de seis horas e dura de dois a três meses","começa em torno de trinta dias e dura por tempo definitivo","começa em torno de três meses e dura de um a dois anos"],"c":0,"exp":"O início do efeito ocorre cerca de sete dias após a injeção, com pico por volta de trinta dias, e a duração média é de seis a nove meses, o que obriga a repetir as aplicações. O procedimento é ambulatorial, com anestesia local e cistoscópio, e reduz episódios de urgência em 70% a 75% e de urgeincontinência em 42% a 87%.","ref":[7,8]}],"resumo":[{"h":"Definição e os tipos de incontinência urinária","blocos":[{"html":"<p>A International Continence Society define incontinência urinária de forma deliberadamente ampla: <strong>queixa de qualquer perda involuntária de urina<\/strong>. Nada na definição exige esforço, urgência, volume mínimo ou medida de resíduo — o tipo e o mecanismo são determinados depois, pela caracterização clínica da perda. A escolha por uma definição de sintoma, e não de achado urodinâmico, tem consequência prática: a paciente que perde urina é incontinente mesmo quando a cistometria não documenta nada.<\/p>"},{"html":"<p>O impacto é maior do que a queixa sugere. A perda urinária determina limitações físicas, sociais e emocionais, com isolamento, queda de produtividade, vergonha, frustração, ansiedade, baixa autoestima e aumento dos sintomas depressivos. Boa parte das mulheres nunca relata a perda espontaneamente — por vergonha ou por considerá-la parte normal e inevitável do envelhecimento —, o que torna a pergunta ativa em consulta parte do exame, não um detalhe de anamnese.<\/p>"},{"html":"<p class=\"figleg\">Definição da ICS e os três tipos clássicos de incontinência urinária<\/p>"},{"html":"<p>São três as formas clássicas, às quais se soma a perda por transbordamento, de mecanismo oposto.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Tipo<\/th><th>Quadro clínico<\/th><th>Mecanismo<\/th><th>Achado urodinâmico<\/th><th>Primeira linha<\/th><\/tr><\/thead><tbody><tr><td><strong>De esforço (IUE)<\/strong><\/td><td>perda ao tossir, espirrar, correr, pular ou levantar peso, sem desejo miccional prévio<\/td><td>hipermobilidade uretral ou deficiência esfincteriana intrínseca; defeito de suporte uretral<\/td><td>perda sincronizada ao aumento da pressão abdominal, sem contração do detrusor<\/td><td>fisioterapia do assoalho pélvico<\/td><\/tr><tr><td><strong>De urgência (IUU)<\/strong><\/td><td>desejo súbito e incontrolável de urinar, com perda antes de chegar ao banheiro<\/td><td>hiperatividade detrusora, idiopática ou neurogênica; é a bexiga hiperativa \"molhada\"<\/td><td>contrações involuntárias do detrusor durante a cistometria<\/td><td>medidas comportamentais e treinamento vesical<\/td><\/tr><tr><td><strong>Mista<\/strong><\/td><td>os dois padrões na mesma paciente; mais comum em idosas<\/td><td>soma do defeito de suporte/esfíncter à hiperatividade detrusora<\/td><td>ambos os achados; o exame define qual predomina<\/td><td>tratar o componente que mais incomoda<\/td><\/tr><tr><td><strong>Por transbordamento<\/strong><\/td><td>gotejamento contínuo, jato hesitante, esforço para iniciar a micção<\/td><td>hipoatividade do detrusor (neuropatia diabética, por exemplo) ou obstrução infravesical<\/td><td>resíduo pós-miccional elevado, esvaziamento incompleto<\/td><td>tratar a causa do esvaziamento incompleto<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p><strong>É aqui que mais se erra.<\/strong> O que separa esforço de urgência não é o volume nem a frequência da perda — é a <strong>relação temporal com o desejo miccional<\/strong>. Na IUE a urina sai <em>junto<\/em> com o aumento da pressão abdominal e a paciente não sentiu vontade nenhuma antes. Na IUU existe urgência súbita e incontrolável <em>antes<\/em> da perda, e o esforço é irrelevante. Antes de rotular qualquer perda como urgência, meça o resíduo pós-miccional: gotejamento contínuo com resíduo alto é transbordamento, e tratá-lo com antimuscarínico agrava a retenção.<\/p><\/blockquote>"}]},{"h":"Neurofisiologia da continência e da micção","blocos":[{"html":"<p>A bexiga é um órgão muscular cuja parede é o <strong>detrusor<\/strong>; sua base, o <strong>colo vesical<\/strong>, faz a conexão com a uretra. Ela tem duas funções antagônicas que não podem coexistir: armazenar urina a baixa pressão, graças à complacência, e esvaziar por contração do detrusor. O trato urinário inferior passa a maior parte do tempo em modo de armazenamento e alterna para o esvaziamento por um reflexo coordenado, não por uma soma de forças.<\/p>"},{"html":"<p class=\"figleg\">Ciclo da função vesical normal: enchimento, primeira sensação, desejo miccional e micção<\/p>"},{"html":"<h4>Armazenamento — simpático (T11–L2)<\/h4>"},{"html":"<p>Pelo <strong>nervo hipogástrico<\/strong>, os receptores <strong>beta-3 adrenérgicos<\/strong> relaxam o detrusor, acomodando volume crescente a baixa pressão, enquanto os <strong>alfa-adrenérgicos<\/strong> contraem o colo vesical. Ao mesmo tempo, o <strong>nervo pudendo<\/strong> mantém o esfíncter uretral estriado contraído. O resultado aritmético é o que define a continência: <strong>pressão uretral maior que a pressão vesical<\/strong>.<\/p>"},{"html":"<h4>Esvaziamento — parassimpático (S2–S4)<\/h4>"},{"html":"<p>Pelo <strong>nervo pélvico<\/strong>, a acetilcolina ativa receptores muscarínicos <strong>M2 e M3<\/strong> e contrai o detrusor, acompanhada do relaxamento do esfíncter uretral interno. O padrão do armazenamento se inverte por inteiro: detrusor contrai, esfíncter relaxa.<\/p>"},{"html":"<h4>Controle central<\/h4>"},{"html":"<p>O <strong>centro pontino<\/strong>, na substância reticular pontomesencefálica, coordena o reflexo e recebe impulsos do córtex, da medula sacral, do sistema límbico e do cerebelo — todos os estímulos aferentes e eferentes passam por ali. O <strong>córtex cerebral<\/strong> (lobo frontal e corpo caloso) exerce <strong>atividade inibitória<\/strong> sobre o reflexo durante o enchimento, e é essa inibição que permite adiar a micção até um momento socialmente adequado. Inibição cortical deficiente, sobretudo por lesão frontal direita, é uma das causas de bexiga hiperativa neurogênica.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Nervo<\/th><th>Sistema<\/th><th>Origem<\/th><th>Receptor / efeito<\/th><\/tr><\/thead><tbody><tr><td>Hipogástrico<\/td><td>simpático<\/td><td>T11–L2<\/td><td>beta-3 relaxa o detrusor; alfa-1 contrai o colo vesical — inibe a micção<\/td><\/tr><tr><td>Pélvico<\/td><td>parassimpático<\/td><td>S2–S4<\/td><td>M2 e M3 contraem o detrusor — produz a micção<\/td><\/tr><tr><td>Pudendo<\/td><td>somático<\/td><td>S2–S4 (núcleo de Onuf)<\/td><td>contrai o esfíncter estriado e o assoalho pélvico<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>O <strong>núcleo de Onuf<\/strong> merece destaque porque é alvo terapêutico: é o conjunto de neurônios da medula sacral que comanda os músculos estriados do assoalho pélvico — esfíncteres uretral e anal, bulbocavernoso e isquiocavernoso. As vias sensoriais que disparam o reflexo derivam do urotélio, com sinalização por ATP e receptores P2X.<\/p>"}]},{"h":"Fisiopatologia da incontinência de esforço","blocos":[{"html":"<p>Quatro teorias sucessivas tentaram explicar por que a uretra deixa de se fechar no esforço, e cada uma nomeia um componente que ainda hoje aparece no raciocínio clínico:<\/p>"},{"html":"<ul><li><strong>1967 — Equalização da pressão intra-abdominal:<\/strong> a condição básica da continência seria a topografia intra-abdominal do colo vesical, de modo que o aumento de pressão se transmitisse igualmente à bexiga e à uretra.<\/li><li><strong>1976 — Deficiência esfincteriana intrínseca:<\/strong> perda do efeito selante da coaptação da mucosa uretral ou alteração das forças de fechamento da uretra.<\/li><li><strong>1990 — Teoria integral:<\/strong> a continência dependeria de um eixo complexo de forças que traciona a uretra anteriormente e a bexiga posteriormente; a lesão do eixo anterior produziria a perda.<\/li><li><strong>1994 — Teoria da rede (<em>hammock theory<\/em>):<\/strong> a uretra repousa sobre uma camada de suporte que funciona como rede e serve de anteparo, contra o qual a uretra é comprimida durante o esforço. É a teoria que sustenta a lógica dos slings de uretra média e a formulação de DeLancey de oclusão uretral sobre a fáscia suburetral.<\/li><\/ul>"},{"html":"<p>Os fatores de risco somam-se e são o que se pergunta na anamnese:<\/p>"},{"html":"<ul><li><strong>Número de gestações<\/strong> — cada gestação aumenta o risco.<\/li><li><strong>Via de parto<\/strong> — o parto vaginal pode lesar as estruturas de suporte do assoalho pélvico e da uretra: mucosa vaginal, músculos, fáscia endopélvica e ligamentos.<\/li><li><strong>Envelhecimento tecidual<\/strong> — alterações nas fibras musculares e no colágeno com o avançar da idade.<\/li><\/ul>"},{"html":"<p>Obesidade e hipoestrogenismo pós-menopausa agravam o quadro, este último porque mucosa uretral, vascularização, musculatura e tecido conjuntivo periuretrais — os principais determinantes da pressão intrauretral — são todos estrogênio-dependentes.<\/p>"}]},{"h":"Avaliação clínica e métodos diagnósticos","blocos":[{"html":"<p>A <strong>anamnese<\/strong> deve caracterizar o tipo de perda, os fatores desencadeantes, o tempo de sintomatologia, tratamentos prévios e o uso de absorventes. Pesquisa-se afecções sistêmicas com repercussão urinária — doenças neurológicas e diabetes em primeiro lugar — e medicações com efeito no trato urinário. Investiga-se ainda sintomas de prolapso genital e incontinência a gases e fezes, porque o assoalho pélvico falha em bloco.<\/p>"},{"html":"<p>O <strong>exame físico<\/strong> tem objetivos definidos: reproduzir e caracterizar a perda, descartar alterações neurológicas e identificar distopias. Para isso:<\/p>"},{"html":"<ul><li>A paciente é examinada em <strong>posição ginecológica e também em ortostatismo<\/strong>, preferencialmente com a <strong>bexiga confortavelmente cheia<\/strong> — a perda muitas vezes só se evidencia de pé.<\/li><li>Solicita-se <strong>tosse ou manobra de Valsalva<\/strong> para verificar a perda.<\/li><li>Avalia-se a integridade da musculatura do assoalho pélvico.<\/li><li>Na inspeção, procuram-se sinais de hipoestrogenismo e dermatite amoniacal nos genitais externos.<\/li><li>A avaliação neurológica testa os reflexos <strong>bulbocavernoso, da tosse e anocutâneo<\/strong>, verificando a integridade do arco reflexo sacral.<\/li><\/ul>"},{"html":"<p>Diante de <strong>distopia acentuada<\/strong>, faz-se a <strong>redução do prolapso<\/strong> e repetem-se as manobras de esforço. O prolapso angula e comprime a uretra, mascarando a perda; reduzi-lo revela a <strong>incontinência urinária oculta<\/strong>. A informação é decisiva, porque a correção isolada do prolapso pode transformar uma paciente continente em incontinente.<\/p>"},{"html":"<h4>Exames básicos — indispensáveis em toda paciente<\/h4>"},{"html":"<ul><li><strong>Urina tipo I e urocultura<\/strong>, para afastar infecção do trato urinário: infecção causa urgência e perda e precisa ser excluída antes de qualquer rótulo.<\/li><li><strong>Resíduo pós-miccional<\/strong>, preferencialmente por ultrassonografia.<\/li><li><strong>Questionários de qualidade de vida<\/strong>, método de escolha para avaliar severidade e impacto dos sintomas.<\/li><\/ul>"},{"html":"<h4>Testes complementares<\/h4>"},{"html":"<p><strong>Teste do absorvente (<em>pad test<\/em>)<\/strong> — um absorvente previamente pesado é colocado junto ao meato uretral externo por período determinado e pesado de novo. Diferença de peso <strong>maior que 1 grama<\/strong> caracteriza perda involuntária de urina. É a forma objetiva de quantificar o que a paciente descreve subjetivamente.<\/p>"},{"html":"<p><strong>Avaliação da mobilidade uretral<\/strong> — não é de rotina; é pedida quando se cogita <strong>injeção periuretral de agente de preenchimento<\/strong>, porque esses agentes têm melhor resultado nos casos de <strong>uretra fixa<\/strong>. Pode ser feita pelo teste do cotonete (<em>Q-tip test<\/em>) ou, preferencialmente, por ultrassonografia, já que o cotonete tem baixa sensibilidade e especificidade.<\/p>"},{"html":"<p><strong>Estudo urodinâmico<\/strong> — identifica contrações involuntárias do detrusor e alterações do esvaziamento vesical.<\/p>"},{"html":"<blockquote><p><strong>Quando pedir urodinâmica.<\/strong> Ela <strong>não<\/strong> faz parte da avaliação inicial, especialmente quando o tratamento planejado é clínico. As indicações são quatro: <strong>queixa associada de perda aos esforços<\/strong>; <strong>planejamento de cirurgia<\/strong> para incontinência ou prolapso genital; <strong>bexiga hiperativa neurogênica<\/strong>; e <strong>refratariedade ao tratamento convencional<\/strong>. Pedir urodinâmica para confirmar uma incontinência de esforço clinicamente evidente que será tratada com fisioterapia é exame sem consequência.<\/p><\/blockquote>"}]},{"h":"Tratamento conservador e farmacológico da incontinência de esforço","blocos":[{"html":"<p>O tratamento conservador é a <strong>primeira linha<\/strong> e abre a sequência terapêutica em todos os tipos de incontinência.<\/p>"},{"html":"<ul><li><strong>Exercícios perineais<\/strong> — fortalecem a musculatura do assoalho pélvico, com taxas de sucesso de <strong>30% a 80%<\/strong>.<\/li><li><strong>Biofeedback<\/strong> — usa métodos fisiológicos mensuráveis para educar a paciente; os aparelhos emitem sinais sonoros ou ondas elétricas quando ocorre o relaxamento uretral, ensinando qual músculo contrair.<\/li><li><strong>Eletroestimulação<\/strong> — aumenta a pressão uretral agindo nos nervos eferentes da musculatura periuretral; cura de <strong>30% a 50%<\/strong> e melhora clínica de <strong>60% a 90%<\/strong>.<\/li><li><strong>Cones vaginais<\/strong> — dispositivos de forma e volume semelhantes, com pesos de <strong>20 a 100 gramas<\/strong>; sucesso de <strong>60% a 78%<\/strong>.<\/li><\/ul>"},{"html":"<p>No campo farmacológico, duas frentes:<\/p>"},{"html":"<p><strong>Estrogênios<\/strong> — há receptores hormonais no trato urinário baixo e na musculatura pélvica. Mulheres com sintomas leves a moderados, iniciados na pós-menopausa e sem distopia genital acentuada, costumam melhorar com terapia hormonal.<\/p>"},{"html":"<p><strong>Oxalato de duloxetina<\/strong> — inibidor da recaptação de serotonina e noradrenalina. A maior disponibilidade desses neurotransmissores no <strong>núcleo de Onuf<\/strong> produz três efeitos mensuráveis: aumento da pressão de resistência uretral, aumento da pressão máxima de fechamento uretral e aumento da espessura do esfíncter uretral estriado. Na dose de <strong>80 mg/dia por 12 semanas<\/strong>, reduz cerca de <strong>50% a 60%<\/strong> dos episódios de perda urinária.<\/p>"}]},{"h":"Tratamento cirúrgico da incontinência de esforço","blocos":[{"html":"<p>A cirurgia visa restabelecer uma função, reequilibrando os mecanismos de continência. Três grupos de técnicas dividem o campo:<\/p>"},{"html":"<ol><li><strong>Colpofixações retropúbicas<\/strong> — técnicas de Burch e de Marshall-Marchetti-Krantz, historicamente com alta taxa de sucesso.<\/li><li><strong>Slings de uretra média<\/strong> — <strong>atualmente a técnica com as melhores e maiores evidências científicas<\/strong> no tratamento da incontinência de esforço.<\/li><li><strong>Agentes de preenchimento<\/strong> — método minimamente invasivo para casos específicos de defeito esfincteriano intrínseco.<\/li><\/ol>"},{"html":"<h4>Sling retropúbico (TVT)<\/h4>"},{"html":"<p>O <em>tension-free vaginal tape<\/em> usa a via retropúbica para ancoragem, com mínima dissecção da parede vaginal e ausência de tensão ao redor da uretra média. Taxas de cura de <strong>74% a 95%<\/strong>. As complicações <strong>intraoperatórias<\/strong> são perfuração vesical, hemorragia, lesão do nervo obturador, lesão de vasos epigástricos e lesão uretral; as <strong>pós-operatórias<\/strong>, retenção urinária, infecção urinária, hematoma retropúbico, infecção da incisão abdominal, erosão da parede vaginal, urgência miccional <em>de novo<\/em> e fístula vesicovaginal.<\/p>"},{"html":"<p class=\"figleg\">Sling transobturatório: trajeto da faixa e passos da técnica<\/p>"},{"html":"<h4>Sling transobturatório (TOT)<\/h4>"},{"html":"<p>Baseia-se na teoria de DeLancey, que descreve a oclusão da uretra sobre a fáscia suburetral pela pressão gerada no esforço. A localização transobturadora da faixa evita o espaço retropúbico e traz três vantagens diretas: <strong>redução do risco de traumatismo visceral ou vasculonervoso<\/strong>, <strong>menor risco de hematoma no espaço de Retzius<\/strong> e <strong>menor incidência de disúria<\/strong>, por comprimir menos a uretra. Taxas de cura de <strong>81% a 100%<\/strong>.<\/p>"},{"html":"<h4>Mini-sling (sling de incisão única)<\/h4>"},{"html":"<p>Reduz complicações e simplifica a técnica usando menor quantidade de material sintético. Não há orifícios cutâneos de saída: uma <strong>única incisão de cerca de 1,5 cm<\/strong> na parede vaginal anterior, logo abaixo da uretra média. As extremidades da fita têm mecanismos de ancoragem, pequenos \"dardos\", fixados nos músculos obturadores ou em membranas da pelve. A intenção é encurtar o trajeto cego e minimizar infecções e traumas viscerais.<\/p>"},{"html":"<h4>Agentes de preenchimento periuretrais<\/h4>"},{"html":"<p>Indicados na incontinência de esforço por <strong>defeito esfincteriano intrínseco com ausência de mobilidade uretral<\/strong>, e também em falha de procedimento cirúrgico prévio ou em mulheres com comorbidades que inviabilizam a cirurgia. O mecanismo não está totalmente esclarecido; a eficácia é atribuída à expansão das paredes uretrais, que melhora a coaptação. No Brasil estão disponíveis colágeno bovino, gordura autóloga, carbono pirolítico e partículas de polidimetilsiloxano.<\/p>"}]},{"h":"Síndrome da bexiga hiperativa: definição, fenótipos e diagnóstico","blocos":[{"html":"<p>A síndrome é caracterizada pela <strong>urgência miccional não fisiológica<\/strong>, usualmente acompanhada de aumento da frequência urinária e de noctúria, <strong>na ausência de fatores infecciosos, metabólicos ou locais<\/strong>. A urgeincontinência pode estar presente e é referida por cerca de <strong>um terço a metade<\/strong> das pacientes — quando há perda, fala-se em bexiga hiperativa \"molhada\". A urgência é o sintoma que define a síndrome: o diagnóstico é <strong>eminentemente clínico<\/strong>, estabelecido a partir dos sintomas, e não depende de cistometria.<\/p>"},{"html":"<p>A fisiopatologia é heterogênea e não completamente conhecida. Quatro linhas explicativas se sobrepõem: a <strong>inibição cortical deficiente<\/strong> da região frontal direita sobre o reflexo da micção, causa de bexiga hiperativa neurogênica; as <strong>fibras aferentes do tipo C<\/strong>, implicadas nos quadros ligados a traumas e a algumas afecções medulares; alterações de <strong>neurotransmissores e receptores<\/strong> (óxido nítrico, ATP, substância P, receptores beta-3 adrenérgicos); e as <strong>teorias miogênica e neurogênica<\/strong>, com alterações da parede vesical e mudanças estruturais do detrusor.<\/p>"},{"html":"<p>A abordagem diagnóstica moderna, chamada \"prisma\", busca os <strong>fenótipos fisiopatológicos subjacentes<\/strong> por exame clínico detalhado, eventualmente associado a urodinâmica e outros testes em casos selecionados:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Fenótipos por fatores fisiopatológicos<\/th><th>Fenótipos por demonstração urodinâmica<\/th><\/tr><\/thead><tbody><tr><td>Síndrome metabólica<\/td><td>Miogênica<\/td><\/tr><tr><td>Transtornos afetivos<\/td><td>Uroteliogênica<\/td><\/tr><tr><td>Hipoestrogenismo<\/td><td>Uretrogênica<\/td><\/tr><tr><td>Microbiota urinária<\/td><td>Supraespinal<\/td><\/tr><tr><td>Distúrbios gastrintestinais<\/td><td>Uroteliomiogênica (hipoatividade do detrusor)<\/td><\/tr><tr><td>Disfunções do sistema nervoso autônomo<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A avaliação inclui anamnese cuidadosa (antecedentes urinários, cirurgias prévias, traumas, doenças neurológicas e medicamentos em uso), <strong>exame físico completo, incluindo o neurológico<\/strong> — a bexiga hiperativa pode ser o primeiro sinal de algumas doenças neurológicas —, com avaliação dos genitais externos, região lombossacral, sensibilidade perineal, reflexos bulbocavernoso e clitoridiano e tônus do esfíncter anal.<\/p>"},{"html":"<p>O <strong>diário miccional<\/strong> é auxiliar importante no diagnóstico e na avaliação da resposta ao tratamento: identifica o tipo e a quantidade de líquido ingerido, o volume urinado e a intensidade dos sintomas.<\/p>"},{"html":"<p class=\"figleg\">Estudo urodinâmico: hiperatividade fásica e terminal, e indicações do exame<\/p>"},{"html":"<p>Na investigação complementar, urina tipo I e urocultura são indispensáveis para afastar infecção; o <strong>ultrassom do trato urinário ou da pelve<\/strong> exclui litíase e tumores e mede o resíduo miccional; a <strong>citologia urinária<\/strong> entra nos casos refratários e naqueles com hematúria; e a <strong>uretrocistoscopia<\/strong> é reservada à suspeita de corpo estranho intravesical (fios de sutura), cálculos, tumores vesicais, hematúria e divertículos. Em pacientes com <strong>bexiga hiperativa neurogênica é obrigatória a investigação do trato urinário alto<\/strong>.<\/p>"},{"html":"<p>Quando indicado, o estudo urodinâmico documenta a <strong>hiperatividade do detrusor<\/strong> — contrações involuntárias durante a cistometria — em duas formas:<\/p>"},{"html":"<ul><li><strong>Hiperatividade fásica:<\/strong> contrações não inibidas com amplitude crescente à medida que o volume vesical aumenta. É o achado mais comum da hiperatividade vesical idiopática.<\/li><li><strong>Hiperatividade terminal:<\/strong> uma <strong>única<\/strong> contração não inibida, ocorrendo na capacidade cistométrica máxima.<\/li><\/ul>"}]},{"h":"Tratamento da bexiga hiperativa em quatro linhas","blocos":[{"html":"<p>O tratamento é escalonado e progressivo — cada linha só se justifica depois de esgotada a anterior.<\/p>"},{"html":"<p><strong>Primeira linha — manejo conservador.<\/strong> Modificações comportamentais e fisioterapia. A <strong>redução de cerca de 25% na ingesta hídrica<\/strong> promove melhora significativa da frequência urinária, da urgência e da noctúria. No controle alimentar, evita-se consumo excessivo de cafeína, frutas cítricas, vinagre, alimentos ácidos, salgados ou picantes, sucos e bebidas carbonatadas ou alcoólicas, que exacerbam os sintomas; somam-se perda de peso, exercício moderado e cessação do tabagismo. O <strong>treinamento vesical<\/strong> visa readquirir o controle sobre o reflexo da micção por <strong>micção programada com aumento progressivo do intervalo entre as micções<\/strong> — urinar preventivamente a cada hora faz o contrário, reduz a capacidade funcional e perpetua a urgência. Os <strong>exercícios perineais<\/strong> ensinam como e quando contrair a musculatura do assoalho pélvico, reduzindo a sensação de urgência, e podem ser associados a biofeedback e eletroestimulação. Na <strong>eletroestimulação<\/strong>, os estímulos elétricos são aplicados por eletrodos externos (vaginais, retais, tibiais) ou internos; a inibição vesical se faz por dois reflexos medulares com fibras aferentes dos nervos pudendos — ativação de fibras eferentes hipogástricas para o detrusor e gânglios pélvicos, e inibição de fibras eferentes dos nervos pélvicos no núcleo sacral da micção. Cura e melhora variam de <strong>50% a 90%<\/strong>.<\/p>"},{"html":"<p><strong>Segunda linha — terapia farmacológica.<\/strong> Antimuscarínicos ou agonistas beta-3 adrenérgicos, idealmente <strong>como adjuvantes<\/strong> do tratamento comportamental e fisioterapêutico, não em substituição a ele. A melhora é modesta e raramente há desaparecimento completo dos sintomas; como a <strong>eficácia entre os antimuscarínicos é semelhante<\/strong>, a escolha é norteada pela incidência e severidade dos efeitos colaterais.<\/p>"},{"html":"<p class=\"figleg\">Terapia farmacológica para bexiga hiperativa: doses, vantagens e contraindicações<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Fármaco<\/th><th>Classe<\/th><th>Dose usual<\/th><th>Nota clínica<\/th><th>Contraindicações<\/th><\/tr><\/thead><tbody><tr><td>Oxibutinina<\/td><td>antimuscarínico<\/td><td>5 a 20 mg/dia, 1 a 4 comprimidos<\/td><td>doses flexíveis, mas é o mais descontinuado por efeitos adversos<\/td><td>absolutas: glaucoma de ângulo fechado, retenção urinária, obstrução intestinal<\/td><\/tr><tr><td>Tolterodina<\/td><td>antimuscarínico<\/td><td>4 mg/dia, dose única<\/td><td>boa tolerabilidade; liberação prolongada disponível<\/td><td>miastenia tratada, alteração do nível de consciência, função cognitiva prejudicada<\/td><\/tr><tr><td>Cloreto de tróspio<\/td><td>antimuscarínico<\/td><td>30 a 45 mg/dia, 1 a 3 vezes<\/td><td>boa tolerabilidade em 2 tomadas<\/td><td>função hepática ou renal prejudicada, motilidade intestinal diminuída<\/td><\/tr><tr><td>Fesoterodina<\/td><td>antimuscarínico<\/td><td>4 a 8 mg/dia<\/td><td>superior à tolterodina em eficácia; boca seca e constipação comuns<\/td><td>constipação intestinal<\/td><\/tr><tr><td>Solifenacina<\/td><td>antimuscarínico<\/td><td>5 ou 10 mg/dia<\/td><td>seletiva para M3, perfil de segurança melhor; boca seca comum com 10 mg<\/td><td>as da classe<\/td><\/tr><tr><td>Mirabegrona<\/td><td>agonista beta-3<\/td><td>50 mg/dia, dose única<\/td><td>tão eficaz quanto os anticolinérgicos, melhor tolerabilidade<\/td><td><strong>absoluta: hipertensão não controlada<\/strong>; relativas: síndrome do QT longo, obstrução urinária parcial<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A mirabegrona age diretamente no detrusor pelos receptores beta-3 e indiretamente nos nervos parassimpáticos, inibindo a liberação de acetilcolina; o efeito final é relaxamento do detrusor e aumento da capacidade vesical <strong>sem comprometer o esvaziamento<\/strong>. Hipertensão e taquicardia estão entre seus efeitos adversos. Os <strong>estrogênios por via vaginal<\/strong> promovem melhora significativa dos diferentes tipos de incontinência, da frequência e da urgência, e reduzem episódios de infecção urinária na pós-menopausa.<\/p>"},{"html":"<blockquote><p><strong>Dois erros de prescrição que caem em prova.<\/strong> O primeiro: dar antimuscarínico a quem tem glaucoma de ângulo fechado, retenção urinária ou obstrução intestinal — o bloqueio muscarínico agrava as três, e por isso são contraindicações <strong>absolutas<\/strong>. O segundo: trocar para mirabegrona sem checar a pressão arterial — hipertensão não controlada é contraindicação absoluta ao agonista beta-3, restrição que os antimuscarínicos <strong>não<\/strong> compartilham. Acrescente-se o risco etário: o uso crônico de anticolinérgicos <strong>acima de 65 anos<\/strong> tem sido associado a maior risco de certos tipos de demência, incluindo a doença de Alzheimer.<\/p><\/blockquote>"},{"html":"<p><strong>Terceira linha — intervenções minimamente invasivas<\/strong>, quando as terapias conservadora e farmacológica falham.<\/p>"},{"html":"<ul><li><strong>Toxina onabotulínica A intradetrusora<\/strong> — neurotoxina do <em>Clostridium botulinum<\/em>, aplicada ambulatorialmente sob anestesia local com cistoscópio rígido ou flexível. Reduz episódios de urgência em <strong>70% a 75%<\/strong> e de urgeincontinência em <strong>42% a 87%<\/strong>, além de noctúria e frequência. O efeito <strong>começa em torno de sete dias<\/strong>, tem <strong>pico aos trinta dias<\/strong> e <strong>dura em média de seis a nove meses<\/strong>, obrigando a repetir as injeções.<\/li><li><strong>Neuromodulação sacral<\/strong> — implante cirúrgico de eletrodos na raiz nervosa <strong>S3<\/strong> e de um gerador de impulsos no subcutâneo. Indicada em casos graves refratários; menos invasiva que a cirurgia convencional e preserva a integridade anatômica do trato urinário. O mecanismo não é completamente conhecido, presumindo-se ação sobre fibras aferentes e eferentes.<\/li><li><strong>Estimulação percutânea do nervo tibial posterior<\/strong> — ambulatorial, com agulha-eletrodo no nível do maléolo medial e gerador de pulso externo; os impulsos chegam ao segmento <strong>S3<\/strong> do plexo sacral e influenciam os reflexos da micção. Sessões de <strong>30 minutos, semanais, por 12 semanas<\/strong>. Menos invasiva e com menos complicações que a neuromodulação sacral. Contraindicações: tendência a sangramentos, neuropatia periférica, marca-passo cardíaco e gestação.<\/li><\/ul>"},{"html":"<p><strong>Quarta linha — cirurgia<\/strong>, opção de exceção reservada aos casos refratários a tratamento clínico anterior bem conduzido.<\/p>"},{"html":"<ul><li><strong>Ampliação vesical (cistoplastia de aumento)<\/strong> — aumenta a capacidade da bexiga usando segmentos do trato gastroin
