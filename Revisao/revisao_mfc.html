—, com incentivos como alimentação e transporte, articulação com a assistência social e sem exigir endereço.","ref":[4,1]},{"id":"675ac1c448","q":"Para quem está em situação de rua com suspeita de tuberculose, qual exame o Ministério da Saúde recomenda além do teste rápido molecular ou da baciloscopia?","opts":["Cultura de escarro com teste de sensibilidade","Prova tuberculínica para confirmar doença ativa","IGRA no sangue para confirmar doença ativa","Tomografia de tórax antes de qualquer outro exame"],"c":0,"exp":"Em populações vulneráveis, como a população em situação de rua, a cultura com identificação e teste de sensibilidade é indicada para todos os casos investigados, pelo maior risco de resistência e de abandono prévio. Prova tuberculínica e IGRA servem à investigação de infecção latente e não confirmam doença ativa.","ref":[4,1]},{"id":"2864f85718","q":"Em atendimento do Consultório na Rua, mulher de 27 anos aceita fazer exames. Qual oferta é a mais adequada nesse contato?","opts":["Testagem rápida de HIV, sífilis e hepatites B e C, com prevenção combinada","Somente o teste de HIV, deixando sífilis e hepatites para uma unidade fixa","Testagem só depois que ela tiver documento e um endereço para receber o laudo","Nenhuma testagem, pois sem endereço não há como fazer o seguimento depois"],"c":0,"exp":"Cada contato é oportunidade: testes rápidos de HIV, sífilis e hepatites B e C dão resultado na hora, e o reagente pede vinculação ao cuidado. Junto vêm preservativo, PrEP e PEP quando indicadas e vacina contra hepatite B; a sífilis se trata com penicilina benzatina, conforme o estágio.","ref":[5,0]},{"id":"2ec6bc5017","q":"Homem em situação de rua tem prurido intenso que piora à noite, com lesões escoriadas entre os dedos das mãos, nos punhos e na região genital. O companheiro que dorme com ele tem queixa igual. Qual o diagnóstico e o cuidado associado?","opts":["Escabiose; tratar também o companheiro e lavar roupas e cobertores","Dermatite de contato; trocar o sabonete e usar corticoide tópico","Pediculose do corpo; raspar os pelos e evitar compartilhar o boné","Micose superficial; usar antifúngico só nas lesões das mãos"],"c":0,"exp":"Prurido noturno com lesões em espaços interdigitais, punhos e genitais, e contato com o mesmo quadro, é escabiose, muito frequente na rua pela aglomeração e pela falta de acesso a banho. O tratamento inclui os contatos ao mesmo tempo e medidas com roupas e cobertores, adaptadas ao que é possível na rua.","ref":[5,0]},{"id":"04882679e1","q":"Usuário de crack em situação de rua procura a equipe por uma queimadura nos lábios causada pelo cachimbo. Diz que não quer parar de usar. Qual conduta segue a política de redução de danos?","opts":["Tratar a lesão, orientar não compartilhar o cachimbo e manter o vínculo","Tratar a lesão só após o compromisso formal de parar de usar crack","Encaminhar para internação involuntária, pois ele recusa a abstinência","Negar o curativo para não reforçar o comportamento de uso da droga"],"c":0,"exp":"A redução de danos não condiciona o cuidado à abstinência: atende a demanda trazida, orienta reduzir riscos (não compartilhar cachimbo, que transmite hepatites e outras infecções pelas lesões de boca) e mantém o vínculo, que abre espaço para outras metas. Internação involuntária é exceção, não resposta a quem só recusa parar.","ref":[3,1]},{"id":"1390621775","q":"Diabético de 60 anos em situação de rua come de forma irregular, conforme consegue doação de comida, e não tem onde guardar remédios. Qual ajuste do plano é o mais adequado?","opts":["Priorizar esquema simples e de baixo risco de hipoglicemia, com guarda na unidade","Iniciar insulina em várias doses diárias para controle glicêmico mais rigoroso","Manter sulfonilureia em dose alta, pois a alimentação irregular reduz a glicemia","Suspender todo o tratamento até que ele tenha moradia e alimentação regulares"],"c":0,"exp":"O plano precisa caber na rua: com insegurança alimentar, esquemas com alto risco de hipoglicemia, como sulfonilureia em dose alta e insulina em múltiplas doses, ficam perigosos. Esquema simples, de dose única quando possível, e guarda dos medicamentos na UBS, na eCR ou no Centro POP aumentam a segurança e a adesão.","ref":[3,3]},{"id":"dd6ab3553d","q":"Qual é a natureza do Centro POP (Centro de Referência Especializado para População em Situação de Rua)?","opts":["Serviço da assistência social que oferece convivência, higiene e acesso a direitos","Serviço de saúde mental que substitui o CAPS para quem está em situação de rua","Unidade de saúde que faz consultas médicas e dispensa os remédios da população","Abrigo de longa permanência que oferece moradia definitiva a quem vive na rua"],"c":0,"exp":"O Centro POP é serviço do SUAS, não da saúde: oferece convivência, higiene, alimentação, guarda de pertences, encaminhamento para documentos e benefícios e pode servir de endereço de referência. Com a abordagem social e os serviços de acolhimento, forma a rede de proteção social que o cuidado em saúde precisa acionar.","ref":[6,0]},{"id":"6697039a2a","q":"Na primeira abordagem de uma pessoa em situação de rua que nunca procurou o serviço de saúde, qual postura favorece o vínculo?","opts":["Apresentar-se, perguntar o que ela precisa e combinar o retorno","Exigir documento e banho antes de qualquer atendimento de saúde","Aplicar um questionário completo de saúde logo no primeiro contato","Insistir na ida ao abrigo como condição para voltar a encontrá-la"],"c":0,"exp":"O cuidado começa pelo vínculo: respeitar o espaço da pessoa, apresentar-se, partir da demanda dela (uma ferida, dor de dente, fome) e voltar com regularidade, em local e horário combinados. Impor condições como documento, banho, abstinência ou ida ao abrigo afasta quem mais precisa.","ref":[3,0]},{"id":"f9d3e336af","q":"Mulher em situação de rua chega à UBS relatando violência sexual há 20 horas. Além do acolhimento, qual conduta é obrigatória?","opts":["Profilaxias indicadas, contracepção de emergência e notificação","Encaminhar à delegacia, sem atendimento de saúde antes do boletim","Atender só se ela apresentar documento de identidade e endereço","Orientar retorno em 30 dias para testagem, sem medidas imediatas"],"c":0,"exp":"Violência sexual é urgência: dentro de 72 horas cabem PEP para HIV, profilaxia de IST e hepatite B e contracepção de emergência, que não dependem de boletim de ocorrência. A violência é de notificação compulsória, e mulheres em situação de rua são especialmente expostas à violência sexual.","ref":[5,0]},{"id":"1a0358b379","q":"Sobre a origem do Consultório na Rua, qual afirmação é correta?","opts":["Sucedeu o Consultório de Rua da saúde mental e passou à APS com cuidado integral","Surgiu dentro da assistência social e só depois passou a contar com profissionais","Foi criado pelo SAMU para remoção de pessoas da rua aos hospitais psiquiátricos","Nasceu na atenção hospitalar como ambulatório itinerante de doenças infecciosas"],"c":0,"exp":"O Consultório de Rua nasceu em Salvador, no fim dos anos 1990, no campo da saúde mental, voltado a usuários de drogas. Com a PNAB de 2011, virou Consultório na Rua: equipe da atenção primária com atenção integral, que inclui uso de substâncias, mas também tuberculose, IST, feridas, doenças crônicas e saúde bucal.","ref":[2,1]},{"id":"e358893865","q":"Ao planejar ações para a população em situação de rua do território, a equipe parte de um pressuposto. Qual está correto?","opts":["É população heterogênea: uso de drogas e transtorno mental não são regra","Todos usam drogas, e o foco do cuidado deve ser sempre a abstinência","Todos têm transtorno mental grave e devem ser encaminhados ao CAPS","Ninguém trabalha, e a renda vem exclusivamente de pedir dinheiro"],"c":0,"exp":"A política define essa população como heterogênea. Na pesquisa nacional, álcool e drogas, desemprego e conflitos familiares foram os motivos mais citados para a ida à rua, muitas vezes juntos, e a maior parte exercia alguma atividade remunerada, como a catação de recicláveis; presumir uso de drogas ou transtorno mental distorce o cuidado.","ref":[1,2]}],"resumo":[{"h":"","blocos":[{"html":"<blockquote><p>Material de referência: não há slide da aula deste tema. Baseado no Decreto 7.053/2009, na PNAB e nas portarias do Consultório na Rua, no Manual sobre o Cuidado à Saúde junto à População em Situação de Rua (Ministério da Saúde, 2012) e no Manual de Recomendações para o Controle da Tuberculose.<\/p><\/blockquote>"}]},{"h":"Quem é a população em situação de rua","blocos":[{"html":"<p>O <strong>Decreto 7.053, de 23 de dezembro de 2009<\/strong>, instituiu a <strong>Política Nacional para a População em Situação de Rua<\/strong> e definiu esse grupo como <strong>heterogêneo<\/strong>, que tem em comum a <strong>pobreza extrema<\/strong>, os <strong>vínculos familiares interrompidos ou fragilizados<\/strong> e a <strong>inexistência de moradia convencional regular<\/strong>, e que usa logradouros públicos e áreas degradadas como espaço de moradia e sustento — de forma temporária ou permanente —, além das unidades de acolhimento para pernoite. O decreto criou um comitê intersetorial de acompanhamento (CIAMP-Rua) e prevê acesso <strong>amplo, simplificado e seguro<\/strong> aos serviços públicos, centros de referência especializados na assistência social e contagem oficial dessa população.<\/p>"},{"html":"<p>Os princípios da política são o respeito à dignidade, o direito à convivência familiar e comunitária, a valorização da vida e da cidadania, o <strong>atendimento humanizado e universalizado<\/strong> e o respeito às diferenças de origem, raça, idade, gênero, orientação sexual e religião.<\/p>"},{"html":"<p>Na pesquisa nacional do fim dos anos 2000, os motivos mais citados para ir à rua foram <strong>álcool e outras drogas, desemprego e conflitos familiares<\/strong> — em geral combinados. A maioria é de homens adultos, e a maior parte exerce alguma atividade remunerada (catação de recicláveis, por exemplo).<\/p>"},{"html":"<blockquote><p>Heterogêneo quer dizer que não se presume nada: nem toda pessoa em situação de rua usa drogas, tem transtorno mental ou rompeu com a família. A avaliação começa pela demanda dela.<\/p><\/blockquote>"}]},{"h":"Direito ao SUS e o Consultório na Rua","blocos":[{"html":"<p>O acesso ao SUS é universal, e <strong>a falta de comprovante de endereço ou de documento não impede atendimento<\/strong>. A Portaria 940/2011, que regulamenta o Cartão SUS, dispensa expressamente os moradores de rua da exigência de endereço no cadastro. Recusar atendimento na recepção por \"falta de comprovante\" é barreira de acesso e fere a lei.<\/p>"},{"html":"<p>O <strong>Consultório na Rua<\/strong> (eCR) é uma <strong>equipe da atenção primária<\/strong>, criada na PNAB de 2011, <strong>multiprofissional<\/strong> e <strong>itinerante<\/strong>: vai até onde as pessoas estão, com horário que pode incluir noite e fim de semana, e faz <strong>ações compartilhadas com as UBS<\/strong> do território e, quando preciso, com CAPS, urgência e serviços da assistência social. Oferece <strong>atenção integral<\/strong> — não se limita ao uso de drogas. Ele sucedeu o antigo <em>Consultório de Rua<\/em>, nascido em Salvador no fim dos anos 1990 no campo da saúde mental, voltado a usuários de drogas.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Modalidade da eCR<\/th><th>Composição mínima<\/th><\/tr><\/thead><tbody><tr><td><strong>I<\/strong><\/td><td>4 profissionais: 2 de nível superior e 2 de nível médio<\/td><\/tr><tr><td><strong>II<\/strong><\/td><td>6 profissionais: 3 de nível superior e 3 de nível médio<\/td><\/tr><tr><td><strong>III<\/strong><\/td><td>a modalidade II <strong>acrescida de médico<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>Enfermeiro, psicólogo, assistente social e terapeuta ocupacional são os profissionais de nível superior típicos; agente social, técnico ou auxiliar de enfermagem e técnico em saúde bucal, os de nível médio. Onde não há eCR, o cuidado é responsabilidade da UBS do território — e de toda a rede.<\/p>"}]},{"h":"Abordagem: vínculo, redução de danos e cuidado possível","blocos":[{"html":"<p>O cuidado começa pelo <strong>vínculo<\/strong>. A abordagem no território respeita o espaço da pessoa: apresentar-se, perguntar o que ela precisa, <strong>não impor<\/strong> condições (banho, documento, abstinência) e voltar com regularidade. A demanda que ela traz — uma ferida, dor de dente, fome — é a porta de entrada para o resto.<\/p>"},{"html":"<p>A lógica é a da <strong>redução de danos<\/strong>: o cuidado <strong>não é condicionado à abstinência<\/strong>. Orientar não compartilhar cachimbos e seringas, evitar misturas de depressores, oferecer preservativo, água e alimentação e manter a porta aberta valem mais que exigir uma meta que a pessoa não escolheu.<\/p>"},{"html":"<p>O plano terapêutico precisa caber na rua:<\/p>"},{"html":"<ul><li><strong>simplificar<\/strong> o esquema (dose única diária, comprimidos em vez de soluções), pensando em onde guardar o remédio — a UBS, a eCR ou o Centro POP podem custodiar;<\/li><li>considerar a <strong>insegurança alimentar<\/strong>: hipoglicemiante e insulina sem comida regular são risco de hipoglicemia;<\/li><li>combinar <strong>local e horário reais<\/strong> de reencontro, já que telefone e endereço muitas vezes não existem;<\/li><li>aproveitar cada contato para vacinação, testagem rápida e saúde bucal.<\/li><\/ul>"}]},{"h":"Tuberculose: a doença-sentinela da rua","blocos":[{"html":"<p>A incidência de tuberculose na população em situação de rua é <strong>dezenas de vezes maior<\/strong> que na população geral (o Ministério da Saúde cita cerca de 56 vezes), e o abandono de tratamento também é muito maior. Por isso há estratégias específicas:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Etapa<\/th><th>O que muda na população em situação de rua<\/th><\/tr><\/thead><tbody><tr><td>Busca ativa<\/td><td><strong>sintomático respiratório é quem tem tosse de qualquer duração<\/strong> — não se esperam três semanas<\/td><\/tr><tr><td>Diagnóstico<\/td><td>coletar o escarro <strong>no momento da identificação<\/strong>; teste rápido molecular (TRM-TB) e <strong>cultura com teste de sensibilidade<\/strong><\/td><\/tr><tr><td>Tratamento<\/td><td>esquema básico 2RHZE/4RH, com <strong>tratamento diretamente observado (TDO)<\/strong> — na UBS, na eCR, no abrigo<\/td><\/tr><tr><td>Adesão<\/td><td>incentivos (alimentação, transporte), articulação com a assistência social, sem exigir endereço<\/td><\/tr><tr><td>Rede<\/td><td>notificação, testagem para HIV, avaliação de contatos possíveis<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p>Na população geral, o sintomático respiratório tem tosse há 3 semanas ou mais. Na população em situação de rua, <strong>qualquer tosse<\/strong> já justifica investigar — e o escarro é colhido ali, na hora, porque talvez não haja um segundo encontro.<\/p><\/blockquote>"}]},{"h":"Outros agravos prevalentes","blocos":[{"html":"<ul><li><strong>IST, HIV e hepatites<\/strong>: oferecer <strong>testagem rápida<\/strong> para HIV, sífilis e hepatites B e C em todo contato, prevenção combinada (preservativo, PrEP, PEP) e vacina contra hepatite B. Sífilis se trata com <strong>penicilina benzatina<\/strong>, conforme o estágio; resultado reagente pede vinculação ao cuidado.<\/li><li><strong>Uso de álcool e outras drogas<\/strong>: o álcool é a substância mais usada, e o crack tem peso importante. Cuidado em redução de danos, com o CAPS AD e a Unidade de Acolhimento como apoio.<\/li><li><strong>Saúde mental<\/strong>: sofrimento psíquico, depressão, psicose e risco de suicídio são frequentes — causa e consequência da vida na rua. Cuidado compartilhado entre eCR e CAPS.<\/li><li><strong>Pele e pés<\/strong>: <strong>escabiose<\/strong> (prurido noturno, lesões em mãos, punhos e região genital), pediculose, micoses, piodermites e feridas crônicas, agravados por longas caminhadas, calçado molhado e falta de acesso a banho. Na escabiose, tratar também quem dorme junto e lavar as roupas.<\/li><li><strong>Violência<\/strong>: física, sexual (sobretudo contra mulheres), institucional e policial. Acolher, tratar, oferecer profilaxias após violência sexual e <strong>notificar<\/strong>.<\/li><li><strong>Doenças crônicas e saúde bucal<\/strong>: hipertensão, diabetes e dor dentária costumam estar sem acompanhamento, e o plano se adapta à realidade da rua.<\/li><\/ul>"}]},{"h":"Intersetorialidade: Centro POP e a assistência social","blocos":[{"html":"<p>Saúde sozinha não resolve: a política é intersetorial por definição. O <strong>Centro POP<\/strong> (Centro de Referência Especializado para População em Situação de Rua) é serviço da <strong>assistência social (SUAS)<\/strong>, não da saúde. Oferece convivência, higiene, alimentação, guarda de pertences, encaminhamento para documentação e benefícios (CadÚnico, Bolsa Família) e pode servir de <strong>endereço de referência<\/strong>. Junto com o <strong>serviço especializado em abordagem social<\/strong> e os <strong>serviços de acolhimento<\/strong> (abrigos, casas de passagem), forma a rede de proteção social.<\/p>"},{"html":"<p>O caminho do cuidado costuma ser: abordagem no território (eCR ou abordagem social) → vínculo → demandas de saúde atendidas na eCR ou na UBS → CAPS quando há sofrimento intenso ou uso problemático de drogas → Centro POP e acolhimento para documentos, benefícios e moradia.<\/p>"},{"html":"<blockquote><p>Centro POP não é CAPS nem serviço de saúde; Consultório na Rua não é serviço só para usuários de drogas. As duas confusões são clássicas de prova.<\/p><\/blockquote>"}]}]},{"slug":"tontura-aps","titulo":"Tontura na Atenção Primária","disciplina":"MFC","eyebrow":"Medicina de Família e Comunidade · Referência","questoes":[{"id":"2ffdf3b0d9","q":"Mulher de 58 anos relata que, ao se levantar rapidamente da cama, sente a vista escurecer e a sensação de que vai desmaiar, sem sensação de giro; o quadro passa em segundos se ela se senta. Essa tontura é mais bem classificada como:","opts":["Pré-síncope de provável causa ortostática","Vertigem posicional de origem labiríntica","Desequilíbrio por déficit proprioceptivo","Tontura inespecífica de origem ansiosa"],"c":0,"exp":"Pré-síncope é a sensação de desmaio iminente — escurecimento visual, fraqueza, cabeça leve — e aponta para hipoperfusão cerebral transitória, não para o labirinto. O gatilho postural sugere hipotensão ortostática; vertigem é ilusão de movimento, desequilíbrio é instabilidade na marcha e tontura inespecífica é a queixa vaga que não cabe nas demais.","ref":[1,1]},{"id":"68c222db67","q":"Para confirmar hipotensão ortostática, mede-se a pressão arterial deitado e depois em pé. O critério diagnóstico é uma queda, em até 3 minutos de pé, de:","opts":["20 mmHg ou mais na sistólica, ou 10 mmHg ou mais na diastólica","10 mmHg ou mais na sistólica, ou 5 mmHg ou mais na diastólica","30 mmHg ou mais na sistólica, ou 20 mmHg ou mais na diastólica","40 mmHg ou mais na sistólica, com aumento da frequência cardíaca"],"c":0,"exp":"Hipotensão ortostática é a queda de pelo menos 20 mmHg na sistólica ou 10 mmHg na diastólica até 3 minutos após ficar em pé. Na APS, as causas mais comuns são medicamentos (diuréticos, alfabloqueadores, vasodilatadores, tricíclicos), desidratação e disautonomia, como no diabetes e no Parkinson.","ref":[5,0]},{"id":"ed63149267","q":"Mulher de 55 anos tem, há uma semana, crises de vertigem rotatória intensa que duram menos de um minuto, ao se deitar, virar na cama ou olhar para cima. Entre as crises fica bem; não há perda auditiva nem sintoma neurológico. Qual exame confirma a principal hipótese?","opts":["Manobra de Dix-Hallpike","Tomografia de crânio","Audiometria tonal e vocal","Teste do impulso cefálico"],"c":0,"exp":"Crises de segundos, desencadeadas por mudança de posição da cabeça e sem sintoma auditivo ou neurológico, são a VPPB, a causa mais comum de vertigem. O diagnóstico é clínico, pela manobra de Dix-Hallpike; nos casos típicos, imagem e exames vestibulares não estão indicados (AAO-HNS 2017). O impulso cefálico faz parte do HINTS, que é para vertigem aguda contínua.","ref":[2,0]},{"id":"4fcb08ad4c","q":"Na manobra de Dix-Hallpike para o lado direito, qual achado confirma VPPB do canal semicircular posterior direito?","opts":["Nistagmo torcional e para cima, com latência e duração curta","Nistagmo horizontal persistente, sem latência e sem fadiga","Nistagmo vertical para baixo, que não diminui com a repetição","Ausência de nistagmo, com vertigem que dura mais de uma hora"],"c":0,"exp":"No canal posterior, após latência de alguns segundos surge nistagmo torcional, com o polo superior do olho batendo para a orelha de baixo, e componente vertical para cima; dura menos de 1 minuto e diminui com a repetição. Nistagmo sem latência, persistente, vertical para baixo ou que não fatiga deve levantar suspeita de causa central.","ref":[2,1]},{"id":"5f10abfbb0","q":"Confirmada VPPB do canal posterior direito, qual a conduta de primeira linha?","opts":["Manobra de reposicionamento de Epley no próprio consultório","Betaistina por três meses e reavaliação ao fim do tratamento","Meclizina contínua até o desaparecimento completo das crises","Ressonância de crânio antes de qualquer tratamento específico"],"c":0,"exp":"A VPPB do canal posterior se trata com a manobra de reposicionamento canalicular de Epley, feita no consultório da APS, com alta taxa de resolução e possibilidade de repetição. A diretriz da AAO-HNS (2017) recomenda não usar supressores vestibulares de rotina: nenhum remédio devolve os otólitos ao utrículo, e o uso prolongado atrasa a compensação.","ref":[2,2]},{"id":"24b2d405ee","q":"Homem de 40 anos, uma semana após um resfriado, tem vertigem intensa e contínua há 36 horas, com vômitos; anda com dificuldade, mas fica em pé sem apoio. Não há perda auditiva. Há nistagmo horizontal unidirecional e o teste do impulso cefálico mostra sacada corretiva para um dos lados. Qual o diagnóstico mais provável?","opts":["Neurite vestibular","Labirintite viral","Doença de Ménière","AVC de cerebelo"],"c":0,"exp":"Síndrome vestibular aguda (vertigem contínua por horas a dias, com náusea e nistagmo), sem hipoacusia, após quadro viral, é neurite vestibular. O padrão periférico no HINTS — impulso cefálico alterado com sacada corretiva, nistagmo horizontal unidirecional e teste de skew sem desvio — tranquiliza; com perda auditiva, seria labirintite.","ref":[3,0]},{"id":"e8a0255974","q":"Na neurite vestibular, qual conduta favorece a recuperação?","opts":["Sintomáticos por poucos dias e reabilitação vestibular precoce","Repouso absoluto no leito até o fim completo da vertigem","Cinarizina contínua por seis meses para prevenir recidivas","Antiviral sistêmico por dez dias, iniciado após a primeira semana"],"c":0,"exp":"Antieméticos e supressores vestibulares servem só nos primeiros dias, para náusea e vertigem intensas. A recuperação depende da compensação central, acelerada pela mobilização e pela reabilitação vestibular precoce; repouso prolongado e sedativos a atrasam. Corticoide nos primeiros dias pode ser considerado, com benefício clínico de longo prazo incerto.","ref":[3,1]},{"id":"05b19ab5a0","q":"Homem de 68 anos, hipertenso e diabético, tem vertigem contínua há 10 horas, com nistagmo. No HINTS, o impulso cefálico é normal, o nistagmo muda de direção conforme o olhar e há desvio vertical no teste de cobertura alternada. A interpretação e a conduta são:","opts":["Padrão central: suspeitar de AVC de fossa posterior e enviar ao PS","Padrão periférico: neurite vestibular, tratar com sintomáticos","Impulso normal afasta lesão grave: indicar reabilitação vestibular","Exame inconclusivo: repetir o HINTS no ambulatório em uma semana"],"c":0,"exp":"Na síndrome vestibular aguda, qualquer achado central no HINTS — impulso cefálico normal, nistagmo que muda de direção ou vertical, desvio vertical no skew — sugere AVC de tronco ou cerebelo e exige emergência. O impulso normal é o achado paradoxal: labirinto e nervo íntegros significam que a vertigem vem do sistema nervoso central.","ref":[3,4]},{"id":"8559cffddf","q":"O exame HINTS ajuda a separar causa periférica de central em qual situação?","opts":["Vertigem aguda contínua, com nistagmo, ainda presente no exame","Vertigem posicional de segundos, com o paciente sem sintomas","Pré-síncope recorrente ao levantar, sem nistagmo ao exame","Desequilíbrio crônico do idoso, com piora no escuro e sem giro"],"c":0,"exp":"O HINTS foi validado para a síndrome vestibular aguda: vertigem contínua há horas a dias, com nistagmo presente no momento do exame. Aplicado na VPPB, na pré-síncope ou no paciente assintomático, o impulso cefálico normal pode ser lido erroneamente como sinal central.","ref":[3,4]},{"id":"ce6725f9ca","q":"Qual destes achados, num paciente com tontura, indica encaminhamento imediato à emergência pela suspeita de causa central?","opts":["Incapacidade de ficar em pé ou andar sem apoio, com disartria","Vertigem de segundos ao deitar, com nistagmo que fatiga","Zumbido e plenitude aural que acompanham as crises","Náuseas e vômitos intensos durante a crise de vertigem"],"c":0,"exp":"Ataxia de tronco grave (não fica em pé sem apoio), déficit neurológico focal (diplopia, disartria, disfagia, dismetria, fraqueza), cefaleia súbita ou cervicalgia intensa (dissecção vertebral) e nistagmo vertical ou que muda de direção apontam para AVC de fossa posterior. Náusea intensa é comum nas causas periféricas e não diferencia.","ref":[6,1]},{"id":"76ce7f4cf2","q":"Mulher de 45 anos tem crises de vertigem espontânea que duram de 1 a 3 horas, com zumbido, plenitude e piora da audição no ouvido esquerdo, que melhora entre as crises. Qual a hipótese e a conduta inicial?","opts":["Ménière: restrição de sal, audiometria e encaminhar ao otorrino","VPPB: manobra de Epley no consultório e reavaliar em 1 mês","Neurite: corticoide e reabilitação vestibular precoce","Enxaqueca vestibular: triptano na crise e profilaxia"],"c":0,"exp":"Doença de Ménière: crises espontâneas de vertigem de 20 minutos a 12 horas, com hipoacusia neurossensorial flutuante (em graves, no início), zumbido e plenitude no mesmo ouvido (Bárány Society, 2015). A base é hidropisia endolinfática; o manejo inicial inclui restrição de sódio, audiometria para documentar a perda e avaliação otorrinolaringológica.","ref":[4,0]},{"id":"503cac5d47","q":"O que separa, à beira do leito, a labirintite da neurite vestibular?","opts":["A presença de perda auditiva e zumbido na labirintite","A presença de nistagmo horizontal apenas na neurite","A duração de segundos da vertigem na labirintite","O início sempre bilateral dos sintomas na neurite"],"c":0,"exp":"As duas causam vertigem aguda contínua com náusea e nistagmo periférico. A neurite poupa a cóclea; a labirintite compromete labirinto e cóclea e traz hipoacusia e zumbido. Vertigem aguda com perda auditiva súbita pede cautela: pode também ser AVC no território da artéria cerebelar anteroinferior.","ref":[3,0]},{"id":"315788ff3d","q":"Idosa de 78 anos usa flunarizina há dois anos \"para labirintite\", sem diagnóstico definido. Apresenta tremor, lentidão dos movimentos e humor deprimido. Qual a melhor conduta?","opts":["Suspender a flunarizina e reavaliar a causa da tontura","Associar levodopa para tratar o parkinsonismo idiopático","Trocar por cinarizina, que não tem efeito extrapiramidal","Manter e associar antidepressivo para o humor deprimido"],"c":0,"exp":"Flunarizina e cinarizina, bloqueadores de canal de cálcio com ação antidopaminérgica, causam parkinsonismo e depressão, sobretudo em idosos — tratar o efeito adverso com outro remédio é cascata iatrogênica. Supressor vestibular é sintomático e de curto prazo; o uso crônico atrasa a compensação central e aumenta o risco de quedas.","ref":[6,0]},{"id":"1161b3321c","q":"Homem de 50 anos nota, ao acordar, perda auditiva importante no ouvido direito, com zumbido e leve tontura, sem outros sinais neurológicos; a otoscopia é normal. A conduta adequada é:","opts":["Tratar como urgência: encaminhar no mesmo dia para avaliação e corticoide","Lavagem otológica e reavaliação em 30 dias, se não houver melhora","Prescrever betaistina e marcar audiometria eletiva pela regulação","Orientar que a audição volta sozinha e reavaliar só se piorar"],"c":0,"exp":"Perda auditiva neurossensorial súbita é urgência otorrinolaringológica: o corticoide tem mais chance de benefício quando iniciado cedo, idealmente nos primeiros dias. A otoscopia normal afasta cerume e otite; se a vertigem vier com sinais neurológicos, pensar em AVC da artéria cerebelar anteroinferior.","ref":[6,3]},{"id":"67ccb12d4c","q":"Mulher de 32 anos com enxaqueca tem crises recorrentes de vertigem espontânea, de minutos a horas, às vezes com fotofobia e cefaleia, e audição normal entre e durante as crises. Qual a hipótese mais provável?","opts":["Enxaqueca vestibular","Doença de Ménière","Neurite vestibular","AIT vertebrobasilar"],"c":0,"exp":"Enxaqueca vestibular é uma das causas mais comuns de vertigem episódica espontânea: crises de 5 minutos a 72 horas em quem tem enxaqueca, com características migranosas (cefaleia, fotofobia, aura) em parte delas. Sem hipoacusia flutuante, Ménière fica menos provável; o tratamento segue o da enxaqueca, com controle de gatilhos e profilaxia quando frequente.","ref":[4,1]},{"id":"ab35a43b46","q":"Mulher de 42 anos teve neurite vestibular há 6 meses. Desde então sente tontura não rotatória quase diária, que piora em pé, ao se movimentar e em supermercados cheios de estímulos visuais. Exames neurológico e vestibular normais. Qual o diagnóstico e o tratamento?","opts":["Tontura postural-perceptual persistente: reabilitação, ISRS e TCC","Neurite vestibular recidivante: corticoide em altas doses por 1 mês","VPPB de canal lateral: manobra de reposicionamento no consultório","Insuficiência vertebrobasilar: antiagregante e doppler de vertebrais"],"c":0,"exp":"A tontura postural-perceptual persistente (Bárány Society, 2017) é tontura ou instabilidade não rotatória na maioria dos dias por 3 meses ou mais, piorada pela postura ereta, pelo movimento e por estímulos visuais complexos, em geral após um evento vestibular. É causa frequente de tontura crônica e se trata com reabilitação vestibular, ISRS e terapia cognitivo-comportamental.","ref":[4,2]},{"id":"401308ecf7","q":"Homem de 70 anos, diabético há 20 anos, queixa-se de \"tontura\" ao caminhar, pior à noite e em terreno irregular, sem giro. Tem Romberg positivo e sensibilidade vibratória abolida nos pés. O tipo de tontura e a causa provável são:","opts":["Desequilíbrio por neuropatia periférica com déficit proprioceptivo","Vertigem central por AVC de cerebelo com ataxia de membros","Pré-síncope por hipotensão ortostática da disautonomia diabética","Tontura inespecífica por ansiedade com hiperventilação crônica"],"c":0,"exp":"Desequilíbrio é instabilidade na marcha sem sensação de giro, típico do idoso e multifatorial. Romberg positivo (piora ao fechar os olhos) e perda da sensibilidade vibratória indicam déficit proprioceptivo: o paciente depende da visão, por isso piora no escuro. A conduta inclui fisioterapia, ajuste do ambiente e prevenção de quedas.","ref":[5,2]},{"id":"77fbe82582","q":"Qual característica de um episódio de pré-síncope indica investigação cardiológica urgente?","opts":["Ocorrer durante esforço físico ou vir precedido de palpitações","Ocorrer ao levantar rápido após longo período deitado","Vir precedido de calor, náusea e sudorese em ambiente quente","Acontecer ao ver sangue ou durante a coleta de exames"],"c":0,"exp":"Pré-síncope ou síncope ao esforço, precedida de palpitação, em decúbito, em quem tem cardiopatia estrutural ou com história familiar de morte súbita sugere arritmia ou obstrução ao fluxo (como estenose aórtica) e pede ECG e avaliação urgente. Pródromos de calor, náusea e sudorese, ou gatilho emocional, apontam para a causa reflexa (vasovagal), benigna.","ref":[5,1]}],"resumo":[{"h":"","blocos":[{"html":"<blockquote><p>Material de referência: não há slide da aula deste tema. Baseado na diretriz de VPPB da AAO-HNS (2017), nos critérios da Bárány Society (Ménière 2015, enxaqueca vestibular 2012, TPPP 2017), na literatura do HINTS e em livros-texto de Medicina de Família e Comunidade.<\/p><\/blockquote>"}]},{"h":"Traduzir a queixa: tipo e tempo","blocos":[{"html":"<p>\"Tontura\" é termo guarda-chuva, e a maior parte dos casos se resolve na APS. O primeiro passo clássico é traduzir a queixa em um de <strong>quatro tipos<\/strong>:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Tipo<\/th><th>O que a pessoa sente<\/th><th>Para onde aponta<\/th><\/tr><\/thead><tbody><tr><td><strong>Vertigem<\/strong><\/td><td>ilusão de movimento, em geral rotatório<\/td><td>sistema vestibular, periférico ou central<\/td><\/tr><tr><td><strong>Pré-síncope<\/strong><\/td><td>desmaio iminente, vista escura, fraqueza<\/td><td>hipoperfusão: ortostatismo, arritmia, medicamentos<\/td><\/tr><tr><td><strong>Desequilíbrio<\/strong><\/td><td>instabilidade ao andar, sem giro<\/td><td>neuropatia, cerebelo, Parkinson, visão, multifatorial<\/td><\/tr><tr><td><strong>Tontura inespecífica<\/strong><\/td><td>cabeça leve, vaga, \"aérea\"<\/td><td>ansiedade, hiperventilação, medicamentos, TPPP<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A descrição do paciente, porém, é pouco confiável e muda de uma consulta para outra. Por isso a abordagem atual dá mais peso ao <strong>tempo<\/strong> e ao <strong>gatilho<\/strong>: a tontura é <strong>aguda e contínua<\/strong> (síndrome vestibular aguda), <strong>episódica desencadeada<\/strong> (por posição), <strong>episódica espontânea<\/strong> ou <strong>crônica<\/strong>? O quadrante escolhe o exame: <strong>episódica desencadeada → Dix-Hallpike; aguda contínua → HINTS<\/strong>.<\/p>"}]},{"h":"VPPB: a causa mais comum, resolvida no consultório","blocos":[{"html":"<p>A <strong>vertigem posicional paroxística benigna<\/strong> é a causa mais comum de vertigem. Otólitos soltos do utrículo entram num canal semicircular — o <strong>posterior<\/strong> na grande maioria — e cada mudança de posição da cabeça dispara vertigem rotatória <strong>de segundos (menos de 1 minuto)<\/strong>: ao deitar, virar na cama, olhar para cima. Não há sintoma auditivo nem neurológico.<\/p>"},{"html":"<p>O diagnóstico é clínico, pela <strong>manobra de Dix-Hallpike<\/strong>: do sentado para o decúbito com a cabeça girada 45° para o lado testado e levemente estendida. É positiva quando surge, após <strong>latência<\/strong> de alguns segundos, <strong>nistagmo torcional e vertical para cima<\/strong>, de curta duração e que <strong>fatiga<\/strong> com a repetição. O tratamento é a <strong>manobra de reposicionamento de Epley<\/strong>, no próprio consultório, repetível. A VPPB do canal lateral se testa com o giro da cabeça em decúbito e tem manobras próprias.<\/p>"},{"html":"<blockquote><p><strong>VPPB se trata com manobra, não com remédio.<\/strong> A diretriz da AAO-HNS (2017) recomenda <strong>não<\/strong> pedir imagem nem exames vestibulares nos casos típicos e <strong>não<\/strong> usar supressores vestibulares de rotina. O resumo de Tontura no Idoso cita a betaistina entre os medicamentos da VPPB; pela diretriz atual, ela não trata a VPPB — a manobra é que resolve.<\/p><\/blockquote>"},{"html":"<p>Recorrência é comum; ensinar o paciente a reconhecer a crise e reavaliar em cerca de um mês faz parte do cuidado.<\/p>"}]},{"h":"Síndrome vestibular aguda: neurite, labirintite e o HINTS","blocos":[{"html":"<p><strong>Neurite vestibular<\/strong> é a vertigem <strong>intensa e contínua por dias<\/strong>, com náusea, vômitos e marcha instável, muitas vezes após infecção viral, <strong>sem perda auditiva<\/strong>. A <strong>labirintite<\/strong> é o mesmo quadro <strong>com hipoacusia e zumbido<\/strong>, porque compromete também a cóclea. No exame há nistagmo <strong>horizontal unidirecional<\/strong>, que diminui com a fixação do olhar.<\/p>"},{"html":"<p>Na neurite, sintomáticos só nos primeiros dias; a recuperação depende da <strong>compensação central<\/strong>, acelerada por mobilização e <strong>reabilitação vestibular precoce<\/strong>. Corticoide nos primeiros dias pode ser considerado, com benefício clínico de longo prazo incerto.<\/p>"},{"html":"<p>O dilema é que um <strong>AVC de cerebelo ou tronco<\/strong> pode imitar a neurite, às vezes sem déficit motor. O <strong>HINTS<\/strong>, feito por examinador treinado, é nessa situação mais sensível que a ressonância das primeiras 24 a 48 horas:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Componente<\/th><th>Periférico<\/th><th><strong>Central<\/strong><\/th><\/tr><\/thead><tbody><tr><td><strong>H<\/strong>ead <strong>I<\/strong>mpulse (impulso cefálico)<\/td><td>alterado, com sacada corretiva<\/td><td><strong>normal<\/strong><\/td><\/tr><tr><td><strong>N<\/strong>istagmo<\/td><td>horizontal, unidirecional<\/td><td><strong>muda de direção<\/strong> com o olhar ou <strong>vertical<\/strong><\/td><\/tr><tr><td><strong>T<\/strong>est of <strong>S<\/strong>kew (cobertura alternada)<\/td><td>sem desvio<\/td><td><strong>desvio vertical<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p><strong>Pegadinha.<\/strong> Na vertigem aguda contínua, <strong>impulso cefálico normal é sinal de alarme<\/strong>: labirinto e nervo íntegros significam que a vertigem vem do sistema nervoso central. E o HINTS <strong>só vale<\/strong> para síndrome vestibular aguda com nistagmo presente — na VPPB ou no paciente assintomático, o impulso normal não significa nada.<\/p><\/blockquote>"}]},{"h":"Episódios espontâneos e tontura crônica","blocos":[{"html":"<p><strong>Doença de Ménière<\/strong> (hidropisia endolinfática): crises espontâneas de vertigem de <strong>20 minutos a 12 horas<\/strong>, com <strong>hipoacusia neurossensorial flutuante<\/strong> (em graves, no início), <strong>zumbido<\/strong> e <strong>plenitude<\/strong> no mesmo ouvido. O manejo inicial inclui <strong>restrição de sódio<\/strong>, <strong>audiometria<\/strong> para documentar a perda e <strong>encaminhamento ao otorrino<\/strong>; na crise, supressor vestibular e antiemético por curto período.<\/p>"},{"html":"<p><strong>Enxaqueca vestibular<\/strong> é uma das causas mais comuns de vertigem episódica espontânea: crises de <strong>5 minutos a 72 horas<\/strong> em quem tem enxaqueca, com cefaleia, fotofobia ou aura em parte delas e audição preservada. Trata-se como enxaqueca: gatilhos, crise e profilaxia.<\/p>"},{"html":"<p>A <strong>tontura postural-perceptual persistente (TPPP)<\/strong> é tontura não rotatória na maioria dos dias por <strong>3 meses ou mais<\/strong>, piorada em pé, com o movimento e com estímulos visuais complexos (supermercado, telas), em geral depois de um evento vestibular. Exame normal; tratamento com <strong>reabilitação vestibular, ISRS e TCC<\/strong>.<\/p>"}]},{"h":"Pré-síncope e desequilíbrio","blocos":[{"html":"<p><strong>Hipotensão ortostática<\/strong> é a queda de <strong>pelo menos 20 mmHg na sistólica ou 10 mmHg na diastólica em até 3 minutos<\/strong> de pé. Na APS a causa mais comum são <strong>medicamentos<\/strong> — diuréticos, alfabloqueadores (doxazosina), vasodilatadores, tricíclicos —, além de desidratação e disautonomia (diabetes, Parkinson). Revisar a lista de remédios resolve muitos casos.<\/p>"},{"html":"<p>A pré-síncope pede <strong>ECG<\/strong> e avaliação urgente quando ocorre <strong>ao esforço<\/strong>, com <strong>palpitações<\/strong>, em <strong>decúbito<\/strong>, em quem tem <strong>cardiopatia estrutural<\/strong> ou história familiar de <strong>morte súbita<\/strong>: arritmia e estenose aórtica entram no diferencial. Pródromos de calor, náusea e sudorese, ou gatilho emocional, apontam para a causa reflexa (vasovagal).<\/p>"},{"html":"<p><strong>Desequilíbrio<\/strong> é instabilidade sem giro, frequente no idoso e quase sempre multifatorial. <strong>Romberg positivo<\/strong> (piora ao fechar os olhos) indica déficit proprioceptivo, como na neuropatia diabética; ataxia com Romberg negativo sugere cerebelo. A conduta é fisioterapia, ajuste do ambiente, correção visual, revisão de medicamentos e prevenção de quedas.<\/p>"}]},{"h":"Supressores vestibulares, alarmes e encaminhamento","blocos":[{"html":"<p><strong>Supressores vestibulares<\/strong> — meclizina, dimenidrinato, prometazina, benzodiazepínicos, cinarizina e flunarizina — servem <strong>apenas para alívio sintomático por poucos dias<\/strong> na crise intensa. O uso prolongado <strong>atrasa a compensação central<\/strong>, seda e aumenta <strong>quedas e confusão<\/strong>, sobretudo em idosos. <strong>Cinarizina e flunarizina<\/strong> causam <strong>parkinsonismo e depressão<\/strong>; tratá-los com levodopa ou antidepressivo é cascata iatrogênica — a conduta é suspender e rever o diagnóstico.<\/p>"},{"html":"<blockquote><p><strong>Sinais de alarme de causa central → emergência:<\/strong> incapacidade de ficar em pé ou andar sem apoio, déficit focal (diplopia, disartria, disfagia, dismetria, fraqueza), cefaleia súbita ou cervicalgia intensa (dissecção vertebral), nistagmo vertical ou que muda de direção, HINTS central, idade e fatores de risco vascular. Náusea intensa <strong>não<\/strong> diferencia periférico de central.<\/p><\/blockquote>"},{"html":"<p>Quando encaminhar:<\/p>"},{"html":"<ul><li><strong>Emergência no mesmo dia<\/strong> — suspeita de AVC, pré-síncope com sinais cardíacos de alarme e <strong>perda auditiva súbita<\/strong> (o corticoide funciona melhor quando iniciado cedo).<\/li><li><strong>Otorrino eletivo<\/strong> — Ménière, hipoacusia, VPPB que não responde a manobras repetidas ou com nistagmo atípico.<\/li><li><strong>Neurologia<\/strong> — enxaqueca vestibular refratária, desequilíbrio com sinais cerebelares ou parkinsonianos.<\/li><\/ul>"},{"html":"<p>O papel da APS é traduzir a queixa, examinar com Dix-Hallpike e HINTS quando indicados, fazer a manobra de Epley, revisar medicamentos, orientar <strong>reabilitação vestibular<\/strong> e reconhecer o raro caso grave.<\/p>"}]}]},{"slug":"transtorno-mental-comum","titulo":"Transtorno Mental Comum","disciplina":"MFC","eyebrow":"Medicina de Família e Comunidade · Referência","questoes":[{"id":"055126f16d","q":"Mulher de 42 anos, diarista, vai à UBS pela quinta vez em três meses com cefaleia, cansaço, insônia, 'nervoso' e dor no estômago. Os exames são normais e ela não preenche critérios para depressão maior nem para ansiedade generalizada. Qual a melhor caracterização do quadro?","opts":["Transtorno mental comum, sofrimento real a ser cuidado na APS","Simulação para obter atestado, sem indicação de seguimento","Psicose em fase inicial, com indicação de encaminhar ao CAPS","Doença orgânica oculta, com indicação de repetir os exames"],"c":0,"exp":"Transtorno mental comum (Goldberg e Huxley) reúne sintomas ansiosos, depressivos e somáticos inespecíficos que muitas vezes não fecham diagnóstico, mas geram sofrimento e retornos frequentes. É o problema de saúde mental mais comum na APS e é cuidado ali, com escuta, vínculo e seguimento; repetir exames sem indicação reforça a crença de doença oculta.","ref":[1,0]},{"id":"5127e3528f","q":"Sobre o SRQ-20 no rastreio de transtorno mental comum, qual afirmação é correta?","opts":["Rastreia sofrimento psíquico, mas o resultado positivo não fecha diagnóstico","Confirma depressão maior quando há oito ou mais respostas positivas","É escala de uso exclusivo do psiquiatra para graduar a gravidade da psicose","Mede o risco de suicídio e indica internação quando o escore é alto"],"c":0,"exp":"O SRQ-20, da OMS, tem 20 perguntas de sim ou não sobre os últimos 30 dias e pode ser aplicado por qualquer profissional ou autoaplicado. O corte clássico da validação brasileira é 7/8, variando conforme a população; o resultado positivo pede avaliação clínica, porque rastreio não é diagnóstico.","ref":[2,0]},{"id":"de1229bfbd","q":"Homem de 35 anos tem dor torácica atípica recorrente, palpitação e insônia desde que foi demitido. ECG e exames estão normais. Qual abordagem segue o modelo de reatribuição?","opts":["Fazê-lo se sentir compreendido, ampliar a agenda e ligar sintoma e contexto","Pedir novos exames a cada retorno até que ele aceite a origem emocional","Dizer que ele não tem nada físico e encaminhá-lo direto ao psiquiatra","Prescrever benzodiazepínico contínuo e reavaliar só se houver piora"],"c":0,"exp":"O modelo de reatribuição (Goldberg) tem três passos: o paciente se sentir compreendido (história, exame físico, crenças), ampliar a agenda (devolver o resultado reconhecendo que o sintoma é real) e fazer a ligação entre o sintoma e os problemas de vida. Repetir exames para tranquilizar e dizer que 'não é nada' reforçam a busca de doença oculta.","ref":[3,0]},{"id":"d7627a5867","q":"A equipe de Saúde da Família vai construir um Projeto Terapêutico Singular para um usuário com sofrimento psíquico e grande vulnerabilidade social. Quais são os momentos do PTS?","opts":["Diagnóstico, definição de metas, divisão de responsabilidades e reavaliação","Triagem, encaminhamento ao CAPS, contrarreferência e alta definitiva da UBS","Diagnóstico psiquiátrico, prescrição, internação breve e reinserção social","Rastreio pelo SRQ-20, notificação compulsória, matriciamento e alta da equipe"],"c":0,"exp":"O PTS é um conjunto de condutas construído pela equipe com o usuário, em quatro momentos: diagnóstico (orgânico, psicológico e social, com riscos e potências), definição de metas, divisão de responsabilidades com um profissional de referência e reavaliação. É singular porque é feito para aquela pessoa, e não para a doença.","ref":[3,1]},{"id":"66efbea9b1","q":"O psicólogo da eMulti e a médica de família atendem juntos um paciente com ansiedade e, depois, discutem outros casos da equipe. A responsabilidade pelo paciente continua com a equipe de Saúde da Família. Isso caracteriza:","opts":["Matriciamento, com cuidado compartilhado entre as equipes","Encaminhamento, com o caso passando ao especialista","Supervisão, com o psicólogo avaliando a conduta médica","Triagem, que define quem entra na fila de espera do CAPS"],"c":0,"exp":"O apoio matricial tem dimensão assistencial (consulta e visita conjuntas) e técnico-pedagógica (discussão de casos, educação permanente), e a equipe de referência segue responsável pelo usuário: não é encaminhamento. As eMulti, criadas pela Portaria GM/MS 635/2023, sucederam o NASF nesse papel, ao lado dos CAPS.","ref":[3,2]},{"id":"a44ccedac9","q":"Mulher de 68 anos usa clonazepam há dez anos 'para dormir', com receita renovada sem consulta. Vem tendo esquecimentos e caiu duas vezes neste ano. Qual a conduta mais adequada?","opts":["Pactuar a retirada gradual do benzodiazepínico com seguimento próximo","Suspender o benzodiazepínico de uma vez para evitar novas quedas","Manter a receita, pois a dependência após tantos anos é irreversível","Trocar o clonazepam por diazepam em dose maior, de ação mais longa"],"c":0,"exp":"Benzodiazepínico crônico no idoso causa prejuízo de memória, sedação, quedas e fraturas, além de dependência — exemplo clássico de medicalização. A desprescrição é gradual e pactuada, porque a suspensão abrupta pode causar abstinência e até convulsões; a insônia é abordada com medidas não farmacológicas.","ref":[4,0]},{"id":"450dd422c9","q":"Qual alternativa define prevenção quaternária?","opts":["Proteger a pessoa da sobremedicalização e de intervenções desnecessárias","Reabilitar o paciente com sequelas para reduzir as incapacidades crônicas","Detectar a doença na fase pré-clínica por meio de rastreamento ativo","Impedir o surgimento da doença com vacinação e promoção de hábitos"],"c":0,"exp":"Prevenção quaternária, conceito de Marc Jamoulle adotado pela WONCA, é identificar quem está em risco de sobremedicalização, protegê-lo de intervenções inúteis ou danosas e oferecer alternativas eticamente aceitáveis. No quadro de Jamoulle, corresponde a quem se sente doente sem doença identificável; reabilitação é prevenção terciária, rastreamento é secundária e vacinação é primária.","ref":[4,1]},{"id":"6a318e2905","q":"Mulher de 50 anos, viúva há três semanas, chora com frequência, dorme mal e pede 'um remédio para os nervos'. Mantém o autocuidado, tem apoio dos filhos e nega ideação suicida. Qual a conduta inicial mais adequada na APS?","opts":["Acolher o luto, oferecer escuta e seguimento, sem prescrição de rotina","Iniciar benzodiazepínico contínuo para impedir que o luto se prolongue","Iniciar antidepressivo, pois tristeza após uma perda indica depressão","Encaminhar ao CAPS, pois o luto recente é sofrimento psíquico grave"],"c":0,"exp":"Tristeza, choro e insônia nas semanas seguintes a uma perda fazem parte do luto; medicar de rotina é medicalização, e o mhGAP desaconselha benzodiazepínico e antidepressivo nessa situação. A APS acolhe, acompanha e reavalia, atenta a sinais de depressão: anedonia persistente, menos-valia, ideação suicida e prejuízo funcional importante.","ref":[4,0]},{"id":"7471df59a1","q":"Antes de iniciar antidepressivo em paciente da APS com episódio depressivo moderado, o que é indispensável investigar?","opts":["Episódios prévios de mania ou hipomania e o risco de suicídio","Dosagem sérica de serotonina e eletroencefalograma de base","Tomografia de crânio e avaliação neuropsicológica completa","Resposta a um teste terapêutico de duas semanas com diazepam"],"c":0,"exp":"Antidepressivo em transtorno bipolar não reconhecido pode virar o quadro para mania, por isso se pergunta sobre períodos de euforia, menor necessidade de sono e aceleração. O risco de suicídio é perguntado diretamente — perguntar não induz o ato. Nenhum exame laboratorial ou de imagem diagnostica depressão.","ref":[2,2]},{"id":"b08d831108","q":"Mulher de 38 anos tem sintomas ansiosos e depressivos leves, insônia e queixas somáticas ligados à sobrecarga de trabalho, sem psicose e sem risco de suicídio. Onde ela deve ser cuidada prioritariamente?","opts":["Na UBS, com escuta, grupos, seguimento e apoio matricial se preciso","No CAPS II, que é a referência para qualquer queixa de saúde mental","No ambulatório de psiquiatria, pois a APS não trata saúde mental","Na UPA, onde pode receber sedação sempre que os sintomas piorarem"],"c":0,"exp":"TMC e quadros leves a moderados são cuidados na APS, que tem vínculo e longitudinalidade; o matriciamento amplia a capacidade de resposta da equipe. O CAPS é para sofrimento intenso, transtornos graves e persistentes e crises, e a urgência, para risco iminente.","ref":[2,3]},{"id":"09a6f72024","q":"Qual intervenção psicossocial é adequada como primeira linha para transtorno mental comum na APS?","opts":["Grupos terapêuticos e terapia comunitária integrativa no território","Internação breve em hospital geral para afastar dos estressores","Eletroconvulsoterapia ambulatorial como medida inicial do cuidado","Antipsicótico de depósito para controlar a ansiedade e a insônia"],"c":0,"exp":"Intervenções em grupo — terapêuticos, de convivência, terapia comunitária integrativa, atividade física e práticas integrativas — ampliam vínculo e rede de apoio e são primeira linha no TMC, junto com psicoterapias breves como a de resolução de problemas. Internação, eletroconvulsoterapia e antipsicótico não têm lugar no sofrimento psíquico comum.","ref":[3,3]},{"id":"dc5dbff1e5","q":"Qual alternativa descreve corretamente a Lei 10.216/2001?","opts":["Redireciona o modelo assistencial para serviços comunitários e restringe a internação","Amplia os leitos em hospitais psiquiátricos para garantir o acesso à internação","Cria os CAPS e define o número mínimo de profissionais em cada modalidade","Proíbe qualquer internação psiquiátrica que não tenha ordem judicial expressa"],"c":0,"exp":"A Lei 10.216/2001 (Lei Paulo Delgado) protege os direitos das pessoas com transtorno mental e redireciona o modelo para serviços comunitários. A internação só é indicada quando os recursos extra-hospitalares forem insuficientes, exige laudo médico circunstanciado e é vedada em instituições com características asilares; as modalidades de CAPS foram definidas por portarias.","ref":[5,1]},{"id":"f65e7aae05","q":"Homem de 30 anos com esquizofrenia, em surto, ameaça a mãe com uma faca e recusa tratamento. A mãe pede a internação e o psiquiatra a autoriza. Pela Lei 10.216/2001, qual o tipo de internação e a exigência legal?","opts":["Involuntária, comunicada ao Ministério Público em até 72 horas","Compulsória, comunicada ao Ministério Público em até 72 horas","Voluntária, pois a mãe assina o termo como responsável legal","Involuntária, que depende de autorização prévia do juiz"],"c":0,"exp":"Internação sem consentimento do paciente e a pedido de terceiro é involuntária: autorizada por médico com CRM do estado e comunicada ao Ministério Público Estadual pelo responsável técnico do estabelecimento em até 72 horas, o mesmo valendo para a alta. Compulsória é a determinada pela Justiça; voluntária exige o consentimento do próprio paciente.","ref":[5,2]},{"id":"d0e8278a3f","q":"Durante um processo criminal, o juiz determina a internação psiquiátrica de um homem com transtorno mental grave. Pela Lei 10.216/2001, essa internação é:","opts":["Compulsória, determinada pela Justiça","Involuntária, determinada pelo médico","Voluntária, com anuência do defensor","Involuntária, requerida pelo promotor"],"c":0,"exp":"A internação compulsória é a determinada pela Justiça; o juiz leva em conta as condições de segurança do estabelecimento para o paciente, os demais internados e os funcionários. Involuntária é a pedida por terceiro sem consentimento do paciente, e voluntária, a consentida por ele.","ref":[5,2]},{"id":"8ea75c8c51","q":"Um município de 200 mil habitantes quer implantar o serviço da RAPS que funciona 24 horas, inclusive fins de semana e feriados, com acolhimento noturno, para adultos com transtornos mentais graves e persistentes. Qual é esse serviço?","opts":["Centro de Atenção Psicossocial III","Centro de Atenção Psicossocial II","Centro de Atenção Psicossocial I","Centro de Atenção Psicossocial AD"],"c":0,"exp":"O CAPS III funciona 24 horas, todos os dias, com acolhimento noturno, e é previsto para municípios ou regiões acima de 150 mil habitantes (Portaria 3.088/2011). CAPS I (acima de 15 mil), CAPS II e CAPS AD (acima de 70 mil) funcionam de dia, em dias úteis; o equivalente 24 horas para álcool e drogas é o CAPS AD III.","ref":[6,2]},{"id":"2a1e36c5c5","q":"Homem de 60 anos, internado há 25 anos num hospital psiquiátrico que será fechado, não tem vínculos familiares. Qual dispositivo da RAPS é destinado a ele?","opts":["Serviço Residencial Terapêutico, com o auxílio De Volta para Casa","Unidade de Acolhimento, como moradia definitiva após a alta","Comunidade terapêutica em regime residencial sem prazo definido","Leito em hospital geral até surgir vaga em outro hospital psiquiátrico"],"c":0,"exp":"Os Serviços Residenciais Terapêuticos são moradias na comunidade para egressos de longas internações psiquiátricas sem suporte familiar; integram o componente de desinstitucionalização da RAPS com o Programa De Volta para Casa (Lei 10.708/2003), auxílio pago ao egresso. A Unidade de Acolhimento é transitória e voltada a quem tem necessidades decorrentes de álcool e drogas.","ref":[6,3]},{"id":"5b8d56c80a","q":"Na RAPS, qual o papel dos leitos de saúde mental em hospital geral?","opts":["Internação breve na crise, até a estabilização, articulada à rede","Moradia permanente para egressos de longa internação psiquiátrica","Internação prolongada para afastar o paciente do convívio familiar","Porta de entrada obrigatória antes de qualquer atendimento no CAPS"],"c":0,"exp":"O componente hospitalar da RAPS prioriza leitos em hospital geral para internações curtas, na crise ou na comorbidade clínica, até a estabilização, com continuidade do cuidado no CAPS e na APS. É a lógica da Lei 10.216: a internação é recurso pontual, nunca moradia nem isolamento.","ref":[6,1]},{"id":"191f622256","q":"Sobre o acesso aos Centros de Atenção Psicossocial (CAPS), é correto afirmar que eles:","opts":["Acolhem demanda espontânea, sem exigir encaminhamento prévio","Só atendem quem chega encaminhado pela UBS ou pelo hospital","Só atendem quem já esteve internado em hospital psiquiátrico","Só atendem com agendamento feito pela central de regulação"],"c":0,"exp":"CAPS são serviços de porta aberta: acolhem quem chega por demanda espontânea ou encaminhado pela APS, pela urgência ou por outros serviços. Atendem sofrimento psíquico intenso, transtornos graves e persistentes e necessidades decorrentes do uso de álcool e drogas, e a UBS continua acompanhando o usuário.","ref":[6,4]}],"resumo":[{"h":"","blocos":[{"html":"<blockquote><p>Material de referência: não há slide da aula deste tema. Baseado no Caderno de Atenção Básica nº 34 (Saúde Mental, Ministério da Saúde), no mhGAP da OMS, na Lei 10.216/2001 e na Portaria 3.088/2011 (RAPS).<\/p><\/blockquote>"}]},{"h":"O que é transtorno mental comum","blocos":[{"html":"<p><strong>Transtorno mental comum (TMC)<\/strong> é um conceito clínico-epidemiológico, proposto por Goldberg e Huxley, para o sofrimento psíquico <strong>não psicótico<\/strong> que chega todo dia à atenção primária: insônia, fadiga, irritabilidade, esquecimento, dificuldade de concentração, tristeza, \"nervoso\" e <strong>queixas somáticas inespecíficas<\/strong> (cefaleia, dor difusa, palpitação, aperto no peito, desconforto gástrico). Muitas vezes o quadro <strong>não fecha critério<\/strong> diagnóstico no DSM-5-TR ou na CID e, mesmo assim, gera sofrimento, faltas ao trabalho e retornos frequentes. TMC <strong>não é sinônimo de leve<\/strong>.<\/p>"},{"html":"<p>É o problema de saúde mental <strong>mais frequente na APS<\/strong> — estudos brasileiros encontram TMC em algo entre um terço e mais da metade dos usuários das unidades básicas. Concentra-se em <strong>mulheres<\/strong>, pessoas de <strong>baixa renda e escolaridade<\/strong>, desempregados e quem vive <strong>violência<\/strong>, luto, isolamento ou doença crônica — o contexto de vida faz parte da avaliação.<\/p>"},{"html":"<blockquote><p>O paciente \"poliqueixoso\", que volta com queixas que mudam e exames normais, é a apresentação típica do TMC na UBS. Dizer que ele \"não tem nada\" é erro clínico: o sofrimento é real, e o sintoma físico é a linguagem em que ele chega.<\/p><\/blockquote>"}]},{"h":"Reconhecer e rastrear","blocos":[{"html":"<p>O rastreio clássico é o <strong>SRQ-20<\/strong> (<em>Self-Reporting Questionnaire<\/em>), da OMS: <strong>20 perguntas de sim ou não<\/strong> sobre os <strong>últimos 30 dias<\/strong>, que exploram humor depressivo-ansioso, sintomas somáticos, decréscimo de energia vital e pensamentos depressivos. Na validação brasileira clássica (Mari e Williams, 1986), o ponto de corte foi <strong>7/8<\/strong> — positivo com 8 ou mais respostas \"sim\" —, mas o corte varia entre estudos e populações. O que cai em prova: <strong>SRQ-20 positivo indica sofrimento psíquico provável, não confirma diagnóstico<\/strong>. PHQ-9 (depressão) e GAD-7 (ansiedade) ajudam a identificar e acompanhar sintomas específicos.<\/p>"},{"html":"<p>Na consulta, pergunte início, duração, prejuízo funcional, eventos de vida, violência, apoio social e uso de álcool e drogas — e examine: hipotireoidismo, anemia e efeito de medicamento também causam fadiga e desânimo. Três checagens mudam a conduta:<\/p>"},{"html":"<ul><li><strong>critérios de um transtorno específico<\/strong> — episódio depressivo (humor deprimido ou anedonia por pelo menos 2 semanas, com prejuízo), ansiedade generalizada, pânico;<\/li><li><strong>mania ou hipomania prévia<\/strong>, antes de qualquer antidepressivo (risco de virada no bipolar);<\/li><li><strong>risco de suicídio<\/strong>, perguntado de forma direta — perguntar não induz o ato.<\/li><\/ul>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Situação<\/th><th>Onde é cuidada<\/th><\/tr><\/thead><tbody><tr><td>TMC, depressão e ansiedade leves a moderadas<\/td><td><strong>APS<\/strong>, com apoio matricial<\/td><\/tr><tr><td>Transtorno grave e persistente, psicose, crise, uso de drogas com sofrimento intenso<\/td><td><strong>CAPS<\/strong>, com a UBS acompanhando junto<\/td><\/tr><tr><td>Risco iminente de suicídio, agitação grave, intoxicação ou abstinência grave<\/td><td><strong>Urgência<\/strong> (SAMU, UPA, pronto-socorro)<\/td><\/tr><\/tbody><\/table><\/div>"}]},{"h":"Abordagem na APS: escuta, PTS, matriciamento e grupos","blocos":[{"html":"<p>A ferramenta principal é a <strong>escuta qualificada<\/strong>, dentro do <strong>vínculo<\/strong> e da <strong>longitudinalidade<\/strong>. Para as queixas somáticas, o <strong>modelo de reatribuição<\/strong> (Goldberg) tem três passos: fazer o paciente <strong>sentir-se compreendido<\/strong> (história dos sintomas, exame físico, contexto e crenças), <strong>ampliar a agenda<\/strong> (devolver o resultado do exame reconhecendo que o sintoma é real) e <strong>fazer a ligação<\/strong> entre o sintoma e a vida — por exemplo, a tensão muscular explicando a cefaleia. Pedir exame a cada retorno \"para tranquilizar\" reforça a crença de doença oculta.<\/p>"},{"html":"<p>Casos complexos ganham um <strong>Projeto Terapêutico Singular (PTS)<\/strong>: condutas construídas pela equipe <strong>com o usuário<\/strong> (e a família, quando pertinente), em quatro momentos — <strong>diagnóstico<\/strong> (orgânico, psicológico e social, com vulnerabilidades e potências), <strong>definição de metas<\/strong>, <strong>divisão de responsabilidades<\/strong> (com um <strong>profissional de referência<\/strong>) e <strong>reavaliação<\/strong>. É singular porque é feito para aquela pessoa, não para a doença.<\/p>"},{"html":"<p>O <strong>matriciamento<\/strong> (apoio matricial) é o cuidado <strong>compartilhado<\/strong> entre a equipe de Saúde da Família, que <strong>continua responsável<\/strong> pelo caso, e uma equipe de apoio especializado — hoje as <strong>eMulti<\/strong> (Portaria GM/MS 635/2023), que sucederam o NASF, e os profissionais do CAPS. Tem dimensão <strong>assistencial<\/strong> (consulta e visita domiciliar conjuntas) e <strong>técnico-pedagógica<\/strong> (discussão de casos, educação permanente). <strong>Não é encaminhamento<\/strong>: o caso não sai da UBS.<\/p>"},{"html":"<p>Grupos são primeira linha, não fila de espera: terapêuticos e de convivência, <strong>terapia comunitária integrativa<\/strong>, atividade física e práticas integrativas, articulados à rede do território. Psicoterapias breves, como a <strong>terapia de resolução de problemas<\/strong>, cabem na APS.<\/p>"}]},{"h":"Medicalização e prevenção quaternária","blocos":[{"html":"<p><strong>Medicalização<\/strong> é transformar em problema médico o sofrimento que vem da vida — luto, desemprego, conflito familiar, pobreza — e tratá-lo só com remédio. O retrato clássico é o <strong>benzodiazepínico renovado por anos<\/strong> sem reavaliação: dependência, prejuízo de memória e <strong>quedas e fraturas no idoso<\/strong>, sem resolver a causa; a retirada é <strong>gradual e pactuada<\/strong>, porque a suspensão abrupta pode causar abstinência e convulsões. O antidepressivo — em geral um <strong>ISRS<\/strong> (fluoxetina, sertralina), com latência de semanas — fica para o episódio depressivo moderado a grave e o transtorno de ansiedade estabelecido, não para toda tristeza. Luto recente, com autocuidado preservado e sem ideação suicida, pede acolhimento e seguimento, não prescrição.<\/p>"},{"html":"<p><strong>Prevenção quaternária<\/strong>, conceito de Marc Jamoulle adotado pela WONCA, é identificar a pessoa em risco de <strong>sobremedicalização<\/strong>, protegê-la de intervenções desnecessárias e propor alternativas eticamente aceitáveis. No quadro de Jamoulle, corresponde a quem <strong>se sente doente sem doença identificável<\/strong> — exatamente o terreno do TMC.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Nível<\/th><th>Pessoa se sente doente?<\/th><th>Médico identifica doença?<\/th><th>Exemplo<\/th><\/tr><\/thead><tbody><tr><td>Primária<\/td><td>não<\/td><td>não<\/td><td>vacinação<\/td><\/tr><tr><td>Secundária<\/td><td>não<\/td><td>sim<\/td><td>rastreamento<\/td><\/tr><tr><td>Terciária<\/td><td>sim<\/td><td>sim<\/td><td>reabilitação<\/td><\/tr><tr><td><strong>Quaternária<\/strong><\/td><td><strong>sim<\/strong><\/td><td><strong>não<\/strong><\/td><td>evitar exames e remédios desnecessários<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p>Prevenção quaternária não é \"não fazer nada\": é escolher a intervenção que ajuda — escuta, explicação, grupo, seguimento — em vez da que só traz risco.<\/p><\/blockquote>"}]},{"h":"Reforma Psiquiátrica e Lei 10.216/2001","blocos":[{"html":"<p>A Reforma Psiquiátrica brasileira trocou o <strong>manicômio<\/strong> pelo <strong>cuidado no território<\/strong>. Nasceu no fim dos anos 1970 com o Movimento dos Trabalhadores em Saúde Mental, inspirada em Franco Basaglia (Itália), adotou o lema \"<strong>por uma sociedade sem manicômios<\/strong>\" em 1987 e chegou à lei pelo projeto do deputado Paulo Delgado, aprovado como <strong>Lei 10.216/2001<\/strong>.<\/p>"},{"html":"<p>A lei garante à pessoa com transtorno mental tratamento com humanidade e respeito, sigilo, proteção contra abuso e tratamento <strong>pelos meios menos invasivos possíveis, preferencialmente em serviços comunitários<\/strong>. A <strong>internação só é indicada quando os recursos extra-hospitalares forem insuficientes<\/strong>, exige <strong>laudo médico circunstanciado<\/strong>, visa à reinserção social e é <strong>vedada em instituições com características asilares<\/strong>. Quem ficou longamente internado tem direito a alta planejada e reabilitação, com o auxílio do <strong>Programa De Volta para Casa<\/strong> (Lei 10.708/2003).<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Internação<\/th><th>Quem decide<\/th><th>O que a lei exige<\/th><\/tr><\/thead><tbody><tr><td><strong>Voluntária<\/strong><\/td><td>o próprio paciente consente<\/td><td>declaração assinada; termina a pedido escrito do paciente ou por decisão do médico<\/td><\/tr><tr><td><strong>Involuntária<\/strong><\/td><td><strong>sem consentimento<\/strong>, a pedido de <strong>terceiro<\/strong><\/td><td>autorização de médico com CRM do estado; <strong>comunicação ao Ministério Público Estadual em até 72 horas<\/strong>, também na alta; termina a pedido escrito do familiar ou responsável legal, ou por decisão do especialista<\/td><\/tr><tr><td><strong>Compulsória<\/strong><\/td><td><strong>determinada pela Justiça<\/strong><\/td><td>o juiz considera as condições de segurança do estabelecimento<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p>Na involuntária quem pede é um terceiro (em geral a família) e o médico autoriza; na compulsória quem determina é o juiz. A comunicação ao MP em 72 horas é exigência da <strong>involuntária<\/strong>.<\/p><\/blockquote>"}]},{"h":"RAPS: a rede e seus pontos","blocos":[{"html":"<p>A <strong>Rede de Atenção Psicossocial (RAPS)<\/strong> foi instituída pela <strong>Portaria 3.088/2011<\/strong> para pessoas com sofrimento ou transtorno mental e com necessidades decorrentes do uso de crack, álcool e outras drogas. São sete componentes:<\/p>"},{"html":"<ol><li><strong>Atenção básica<\/strong>: UBS/ESF, eMulti, <strong>Consultório na Rua<\/strong>, centros de convivência.<\/li><li><strong>Atenção psicossocial especializada<\/strong>: os <strong>CAPS<\/strong>.<\/li><li><strong>Urgência e emergência<\/strong>: SAMU 192, sala de estabilização, UPA 24 h, pronto-socorro.<\/li><li><strong>Atenção residencial de caráter transitório<\/strong>: <strong>Unidade de Acolhimento<\/strong> e serviços em regime residencial (onde entram as comunidades terapêuticas).<\/li><li><strong>Atenção hospitalar<\/strong>: <strong>leitos de saúde mental em hospital geral<\/strong>, para internação breve.<\/li><li><strong>Desinstitucionalização<\/strong>: <strong>Serviços Residenciais Terapêuticos<\/strong> e Programa De Volta para Casa.<\/li><li><strong>Reabilitação psicossocial<\/strong>: trabalho e renda, cooperativas, economia solidária.<\/li><\/ol>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Serviço<\/th><th>Para quem<\/th><th>Funcionamento<\/th><\/tr><\/thead><tbody><tr><td><strong>CAPS I<\/strong><\/td><td>transtornos graves e persistentes e uso de drogas, todas as idades; municípios acima de 15 mil habitantes<\/td><td>diurno, dias úteis<\/td><\/tr><tr><td><strong>CAPS II<\/strong><\/td><td>transtornos graves e persistentes; acima de 70 mil<\/td><td>diurno, dias úteis<\/td><\/tr><tr><td><strong>CAPS III<\/strong><\/td><td>idem; acima de 150 mil<\/td><td><strong>24 horas<\/strong>, inclusive fins de semana e feriados, com acolhimento noturno<\/td><\/tr><tr><td><strong>CAPS AD<\/strong><\/td><td>álcool e outras drogas; acima de 70 mil<\/td><td>diurno, dias úteis<\/td><\/tr><tr><td><strong>CAPS AD III<\/strong><\/td><td>álcool e outras drogas; acima de 150 mil<\/td><td><strong>24 horas<\/strong>, com acolhimento noturno<\/td><\/tr><tr><td><strong>CAPSi<\/strong><\/td><td>crianças e adolescentes com sofrimento psíquico intenso; acima de 70 mil<\/td><td>diurno, dias úteis<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>O <strong>Serviço Residencial Terapêutico<\/strong> é moradia na comunidade para egressos de longas internações psiquiátricas sem suporte familiar; a <strong>Unidade de Acolhimento<\/strong> é residência <strong>transitória<\/strong>, ligada ao CAPS, para quem tem necessidades decorrentes de álcool e drogas e vulnerabilidade social.<\/p>"},{"html":"<blockquote><p>O CAPS é <strong>porta aberta<\/strong>: acolhe demanda espontânea, sem exigir encaminhamento. E a RAPS é rede, não escada — a UBS segue acompanhando o usuário mesmo quando ele está no CAPS.<\/p><\/blockquote>"}]}]}]};

/* ---------- índice plano das questões ---------- */
var ALL = [], BY = {};
DADOS.temas.forEach(function (t) {
  t.questoes.forEach(function (q) {
    // O banco guarda a correta SEMPRE na posição 0 (contrato do aula_*.json); sem
    // embaralhar, toda resposta seria A. Embaralha a cada carga da página, como o quiz.
    var certa = q.opts[q.c], opts = embaralhar(q.opts);
    var o = { id: q.id, q: q.q, opts: opts, c: opts.indexOf(certa), exp: q.exp, ref: q.ref || null,
              tema: t.slug, temaT: t.titulo, disc: t.disciplina };
    ALL.push(o); BY[o.id] = o;
  });
});

/* ---------- persistência ---------- */
/* chave por página: cada prova guarda a própria fila. Sem chave = nomes antigos. */
var NS = DADOS.chave ? '-' + DADOS.chave : '';
var K = { h: 'fech-hist' + NS, f: 'fech-fila' + NS, r: 'fech-rec' + NS };
function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var H = load(K.h, {});   // id -> {ok, seen, at, streak, conf}
var F = load(K.f, []);   // fila de revisão (ids)
var R = load(K.r, 0);    // recuperados

/* ---------- o algoritmo da fila ----------
   Errou OU marcou "em dúvida"      -> entra na fila.
   Para SAIR da fila                -> 2 acertos seguidos sem marcar dúvida.
   Acerto com dúvida                -> zera o streak e devolve para a fila.
------------------------------------------- */
function registrar(lista) {
  lista.forEach(function (e) {
    var q = e.q, ok = e.sel === q.c, unsure = e.conf === 'unsure';
    var streak = (ok && !unsure) ? ((H[q.id] || {}).streak || 0) + 1 : 0;
    var naFila = F.indexOf(q.id) !== -1;
    if (ok && naFila && streak >= 2) R++;
    if (!ok || unsure) { if (!naFila) F.push(q.id); }
    else if (streak >= 2) { F = F.filter(function (x) { return x !== q.id; }); }
    H[q.id] = { ok: ok, seen: ((H[q.id] || {}).seen || 0) + 1, at: Date.now(),
                streak: streak, conf: e.conf || 'sure' };
  });
  save(K.h, H); save(K.f, F); save(K.r, R);
}

/* ---------- leitura de estado ---------- */
function estado(id) {
  var h = H[id];
  if (!h || !h.seen) return 'new';
  if (!h.ok) return h.conf === 'unsure' ? 'err' : 'sureerr';
  return h.conf === 'unsure' ? 'unsureok' : 'ok';
}
function statsTema(t) {
  var s = { total: t.questoes.length, vistas: 0, ok: 0, err: 0, uns: 0, fila: 0 };
  t.questoes.forEach(function (q) {
    var e = estado(q.id);
    if (e !== 'new') s.vistas++;
    if (e === 'ok') s.ok++;
    if (e === 'err' || e === 'sureerr') s.err++;
    if (e === 'unsureok') s.uns++;
    if (F.indexOf(q.id) !== -1) s.fila++;
  });
  return s;
}
function statsGeral() {
  var s = { total: ALL.length, vistas: 0, ok: 0, err: 0, uns: 0 };
  ALL.forEach(function (q) {
    var e = estado(q.id);
    if (e !== 'new') s.vistas++;
    if (e === 'ok') s.ok++;
    if (e === 'err' || e === 'sureerr') s.err++;
    if (e === 'unsureok') s.uns++;
  });
  return s;
}

/* ---------- utilidades ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function embaralhar(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function plural(n, s, p) { return n + ' ' + (n === 1 ? s : p); }
function mmss(ms) {
  if (ms < 0) ms = 0;
  var s = Math.round(ms / 1000), m = Math.floor(s / 60);
  return m + ':' + ('0' + (s % 60)).slice(-2);
}
function segBar(s, cls) {
  var t = s.total || 1;
  function w(n) { return (n / t * 100).toFixed(2) + '%'; }
  return '<div class="seg ' + (cls || '') + '">' +
    '<i class="ok" style="width:' + w(s.ok) + '"></i>' +
    '<i class="uns" style="width:' + w(s.uns) + '"></i>' +
    '<i class="err" style="width:' + w(s.err) + '"></i></div>';
}

function temaPorSlug(slug) {
  return DADOS.temas.filter(function (t) { return t.slug === slug; })[0];
}
/* botão que leva à linha do resumo que sustenta a questão */
function botaoFonte(q) {
  if (!q.ref) return '';
  var t = temaPorSlug(q.tema);
  if (!t || !t.resumo || !t.resumo[q.ref[0]]) return '';
  var sec = t.resumo[q.ref[0]].h;
  return '<button class="btn fonte" data-act="resumo" data-slug="' + esc(q.tema) +
         '" data-sec="' + q.ref[0] + '" data-blk="' + q.ref[1] + '">' +
         'Consultar no resumo' + (sec ? ' &middot; ' + esc(sec) : '') + '</button>';
}

/* ---------- estado da tela ---------- */
var S = { view: 'home', round: null, pick: {}, bloco: 20, minutos: 0, filtro: 'todas',
          resumo: null, voltar: 'home', voltarLabel: 'Voltar ao início' };
var app = document.getElementById('app');

/* ---------- montagem de rodadas ---------- */
function novaRodada(mode, qs, titulo, minutos) {
  S.round = {
    mode: mode, titulo: titulo, qs: qs, i: 0, ans: {}, revelada: false,
    conf: null, corrigido: false,
    endsAt: minutos > 0 ? Date.now() + minutos * 60000 : 0
  };
  S.view = 'rodada';
  pararRelogio();
  if (S.round.endsAt) iniciarRelogio();
}
function treinoTema(slug, n) {
  var t = DADOS.temas.filter(function (x) { return x.slug === slug; })[0];
  if (!t) return;
  var qs = embaralhar(t.questoes.map(function (q) { return BY[q.id]; }));
  if (n > 0 && n < qs.length) {
    // treino parcial (banco grande): primeiro as nunca vistas, depois as erradas, depois o resto
    var peso = function (q) { var e = estado(q.id); return e === 'new' ? 0 : (e === 'ok' ? 2 : 1); };
    qs = qs.map(function (q, i) { return { q: q, i: i }; })
           .sort(function (a, b) { return (peso(a.q) - peso(b.q)) || (a.i - b.i); })
           .map(function (x) { return x.q; }).slice(0, n);
  }
  novaRodada('treino', qs, t.titulo, 0);
}
function rodadaRevisao() {
  var qs = F.map(function (id) { return BY[id]; }).filter(Boolean);
  if (!qs.length) return;
  novaRodada('revisao', embaralhar(qs), 'Fila de revisão', 0);
}

/* ---------- relógio do simulado ---------- */
var relogio = null;
function iniciarRelogio() {
  pararRelogio();
  relogio = setInterval(function () {
    var r = S.round;
    if (!r || !r.endsAt || r.corrigido) { pararRelogio(); return; }
    var resta = r.endsAt - Date.now();
    var el = document.getElementById('clock');
    if (el) {
      el.textContent = mmss(resta);
      el.className = 'timer' + (resta < 120000 ? ' low' : '');
    }
    if (resta <= 0) { pararRelogio(); corrigirSimulado(true); }
  }, 500);
}
function pararRelogio() { if (relogio) { clearInterval(relogio); relogio = null; } }

/* ---------- correção do simulado ---------- */
function corrigirSimulado(auto) {
  var r = S.round;
  if (!r || r.corrigido) return;
  var faltam = r.qs.filter(function (q) { return r.ans[q.id] == null; }).length;
  if (faltam && !auto) {
    var msg = 'Faltam ' + plural(faltam, 'questão', 'questões') + ' sem resposta.\n\n' +
              'Em branco conta como erro e vai para a fila de revisão. Corrigir mesmo assim?';
    if (!confirm(msg)) return;
  }
  pararRelogio();
  registrar(r.qs.map(function (q) {
    var a = r.ans[q.id] || {};
    return { q: q, sel: a.sel == null ? -1 : a.sel, conf: a.conf };
  }));
  r.corrigido = true;
  S.filtro = 'todas';
  S.view = 'resultado';
  render();
}

/* =========================================================================
   TELAS
   ========================================================================= */
function render() {
  if (S.view === 'home') app.innerHTML = telaHome();
  else if (S.view === 'setup') app.innerHTML = telaSetup();
  else if (S.view === 'rodada') app.innerHTML = telaRodada();
  else if (S.view === 'resultado') app.innerHTML = telaResultado();
  else if (S.view === 'resumo') app.innerHTML = telaResumo();
  window.scrollTo(0, 0);
  if (S.view === 'resumo' && S.resumo && S.resumo.sec != null) {
    var alvo = document.getElementById('alvo');
    if (alvo && alvo.scrollIntoView) alvo.scrollIntoView({ block: 'center' });
  }
}

function telaHome() {
  var g = statsGeral();
  var pct = g.total ? Math.round(g.ok / g.total * 100) : 0;
  var h = '';
  if (DADOS.voltar) h += '<p class="eyebrow"><a href="' + esc(DADOS.voltar.href) + '" style="color:inherit">← ' + esc(DADOS.voltar.rotulo) + '</a></p>';
  h += '<p class="eyebrow">' + esc(DADOS.eyebrow) + '</p>';
  h += '<h1>' + esc(DADOS.titulo) + '</h1>';
  h += '<p class="lede">' + esc(DADOS.subtitulo) + '</p>';

  h += '<div class="card">';
  h += '<p class="eyebrow" style="margin-bottom:6px">Seu progresso</p>';
  h += '<div style="display:flex;align-items:baseline;gap:9px">' +
       '<span style="font-family:var(--mono);font-size:33px;font-weight:600;line-height:1">' + pct + '%</span>' +
       '<span style="font-size:13px;color:var(--muted)">do banco acertado na última resposta</span></div>';
  h += segBar(g);
  h += '<div class="legend">' +
       '<span><i style="background:var(--green)"></i>acerto confiante</span>' +
       '<span><i style="background:var(--amberb)"></i>acerto com dúvida</span>' +
       '<span><i style="background:var(--red)"></i>erro</span>' +
       '<span><i style="background:#e4e0d8"></i>ainda não vista</span></div>';
  h += '<div class="stats">';
  h += '<div class="stat"><b>' + g.vistas + '<span style="font-size:13px;color:var(--muted)">/' + g.total + '</span></b><span>questões vistas</span></div>';
  h += '<div class="stat"><b>' + F.length + '</b><span>na fila de revisão</span></div>';
  h += '<div class="stat"><b>' + R + '</b><span>erros recuperados</span></div>';
  h += '<div class="stat"><b>' + g.uns + '</b><span>acertos com dúvida</span></div>';
  h += '</div></div>';

  h += '<div class="row" style="margin:0 0 6px">';
  h += '<button class="btn" data-act="setup">Simulado individual</button>';
