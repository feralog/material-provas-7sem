<style>
:root{
  --paper:#f5f3ef; --card:#faf9f6; --ink:#121a2b; --muted:#5b6478; --line:#ddd8ce;
  --blue:#2b57cc; --blued:#1e3f9c; --bluel:#f2f6fb; --blueb:#c9d6f7;
  --green:#1f5c3e; --greenl:#eef7f1; --greenb:#bcdcc9;
  --red:#8f2f25; --redl:#fbe6e2; --redb:#eec4bd;
  --amber:#6b5620; --amberl:#fdf6e4; --amberb:#e8d5a3;
  --serif:'Newsreader',Georgia,serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;font-family:var(--sans);cursor:pointer;border:none;background:none}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 70px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 9px}
h1{font-family:var(--serif);font-size:34px;line-height:1.1;font-weight:400;letter-spacing:-.025em;margin:0 0 10px;text-wrap:pretty}
h2{font-family:var(--serif);font-size:23px;line-height:1.3;font-weight:500;letter-spacing:-.015em;margin:0 0 12px}
h3{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:26px 0 10px}
.lede{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 22px;max-width:58ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border-radius:11px;font-weight:500;font-size:15px;
  background:var(--ink);color:#fff;transition:background .15s,transform .15s;width:100%}
.btn:hover:not(:disabled){background:var(--blue);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){background:#fff;border-color:var(--blue);color:var(--blue);transform:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{width:auto;flex:1 1 170px}
.seg{display:flex;height:7px;border-radius:99px;overflow:hidden;background:#e4e0d8}
.seg>i{display:block;height:100%}
.seg>i.ok{background:var(--green)} .seg>i.err{background:var(--red)} .seg>i.uns{background:var(--amberb)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(102px,1fr));gap:10px;margin:15px 0 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.stat b{display:block;font-family:var(--mono);font-size:21px;font-weight:600;line-height:1.1}
.stat span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}
.temas{display:flex;flex-direction:column;gap:7px}
.tema{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;transition:border-color .15s,transform .15s}
.tema:hover{border-color:var(--blue);transform:translateX(2px)}
.tema .tt{flex:1;min-width:0}
.tema .tt b{display:block;font-weight:500;font-size:14.5px;line-height:1.35}
.tema .tt span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.tema .mini{width:74px;flex:none}
.badge{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:99px;
  background:var(--redl);color:var(--red);border:1px solid var(--redb);flex:none}
.q{font-family:var(--serif);font-size:21px;line-height:1.42;font-weight:400;letter-spacing:-.012em;margin:0 0 18px;text-wrap:pretty}
.opt{display:flex;gap:11px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:13px 15px;margin:0 0 9px;font-size:15px;line-height:1.45;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--bluel)}
.opt .k{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted);flex:none;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--bluel)}
.opt.sel .k{color:var(--blued)}
.opt.ok{border-color:var(--greenb);background:var(--greenl)}
.opt.ok .k{color:var(--green)}
.opt.bad{border-color:var(--redb);background:var(--redl)}
.opt.bad .k{color:var(--red)}
.opt:disabled{cursor:default}
.conf{background:var(--amberl);border:1px solid var(--amberb);border-radius:11px;padding:13px 15px;margin:0 0 16px}
.conf p{margin:0 0 10px;font-size:13px;color:var(--amber);font-weight:500;line-height:1.4}
.conf .row>.btn{flex:1 1 128px;padding:10px 14px;font-size:14px;background:#fff;color:var(--ink);border:1px solid var(--amberb)}
.conf .row>.btn:hover{background:#fff;border-color:var(--blue);color:var(--blue);transform:none}
.conf .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.conf .btn.on:hover{background:var(--ink);color:#fff}
.exp{border-left:3px solid var(--line);padding:2px 0 2px 15px;margin:17px 0 0;font-size:14.5px;line-height:1.6;color:#2a3141}
.exp b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 6px}
.exp.good{border-color:var(--greenb)} .exp.bad{border-color:var(--redb)}
.cap{font-size:12.5px;color:var(--muted);font-style:italic;margin:11px 0 0;line-height:1.5}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 18px;
  font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.timer{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.02em;color:var(--ink)}
.timer.low{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:4px 0 0}
.gq{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:#fff;
  font-family:var(--mono);font-size:12.5px;font-weight:500;display:flex;align-items:center;justify-content:center}
.gq.done{background:var(--bluel);border-color:var(--blueb);color:var(--blued)}
.gq.now{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.gq.ok{background:var(--greenl);border-color:var(--greenb);color:var(--green)}
.gq.bad{background:var(--redl);border-color:var(--redb);color:var(--red)}
.chk{display:flex;align-items:center;gap:10px;padding:11px 13px;background:#fff;border:1px solid var(--line);
  border-radius:10px;margin:0 0 7px;font-size:14px;width:100%;text-align:left;line-height:1.4}
.chk.on{border-color:var(--blue);background:var(--bluel)}
.chk .bx{width:17px;height:17px;border:1.5px solid var(--muted);border-radius:5px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700}
.chk.on .bx{background:var(--blue);border-color:var(--blue)}
.chk .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:none}
.fld{margin:0 0 16px}
.fld label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.fld input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;
  background:#fff;font-family:var(--mono);color:var(--ink)}
.fld input:focus{outline:none;border-color:var(--blue)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:8px 0 0}
.note{background:var(--bluel);border:1px solid var(--blueb);border-radius:11px;padding:13px 15px;
  font-size:13.5px;line-height:1.55;color:var(--blued);margin:0 0 14px}
.note.warn{background:var(--redl);border-color:var(--redb);color:var(--red)}
.note.calm{background:var(--greenl);border-color:var(--greenb);color:var(--green)}
.empty{text-align:center;padding:32px 18px;color:var(--muted);font-size:14.5px;line-height:1.6}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin:13px 0 0;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:block}
.foot{margin:32px 0 0;padding:16px 0 0;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;line-height:1.8}
.foot a{color:var(--muted);text-decoration:underline}
.rev{margin:0 0 12px;padding:15px 0 0;border-top:1px solid var(--line)}
.rev:first-child{border-top:none;padding-top:0}
.revq{font-family:var(--serif);font-size:16.5px;line-height:1.42;margin:0 0 9px}
.revl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
.resp{font-size:14px;line-height:1.5;margin:0 0 4px}
/* ---- resumo anexo, para consulta ---- */
.fonte{display:inline-flex;align-items:center;gap:7px;width:auto;margin:15px 0 0;padding:9px 15px;
  border:1px solid var(--blueb);background:var(--bluel);color:var(--blued);border-radius:9px;
  font-size:13.5px;font-weight:500;line-height:1.3;text-align:left}
.fonte:hover{background:#e8effb;border-color:var(--blue);transform:none}
.resumo{font-size:15px;line-height:1.68;color:#1d2433}
.resumo h2{font-family:var(--serif);font-size:21px;font-weight:500;letter-spacing:-.015em;margin:30px 0 12px;text-transform:none;color:var(--ink)}
.resumo h2:first-child{margin-top:0}
.resumo h3{font-family:var(--serif);font-size:17.5px;font-weight:600;letter-spacing:0;margin:23px 0 9px;text-transform:none;color:var(--ink)}
.resumo h4{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:19px 0 8px}
.resumo p{margin:0 0 13px}
.resumo ul,.resumo ol{margin:0 0 13px;padding-left:21px}
.resumo li{margin:0 0 6px}
.resumo blockquote{margin:15px 0;padding:13px 16px;background:var(--bluel);border-left:3px solid var(--blueb);border-radius:0 9px 9px 0}
.resumo blockquote p:last-child{margin:0}
.resumo hr{border:none;border-top:1px solid var(--line);margin:23px 0}
.resumo code{font-family:var(--mono);font-size:.9em;background:#eeebe4;padding:1px 5px;border-radius:4px}
.resumo .tbl{overflow-x:auto;margin:0 0 15px}
.resumo table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.45}
.resumo th,.resumo td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.resumo th{background:#efece5;font-weight:600}
.resumo .figleg{font-size:12.5px;color:var(--muted);font-style:italic;border-left:2px solid var(--line);padding-left:11px;margin:0 0 13px}
.alvo{background:#fdf6e4;border-radius:5px;scroll-margin-top:24px;
  box-shadow:0 0 0 5px #fdf6e4,0 0 0 6px var(--amberb)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;line-height:1.3}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:560px){h1{font-size:28px}.q{font-size:19px}.wrap{padding:18px 15px 60px}
  .resumo{font-size:14.5px}.resumo table{font-size:12.5px}}
</style>
</head>

<script>

var DADOS = {"titulo":"Revisão · MC VII","eyebrow":"Medicina e Comunidade VII · prova em 10/12","subtitulo":"157 questões em 9 temas. Marque sua confiança antes de responder: o que você errou — ou acertou na dúvida — volta na fila até sair com dois acertos confiantes seguidos.","rodape":"Gerado em 26 de novembro de 2026","chave":"mfc","voltar":{"href":"../plano.html","rotulo":"Plano de estudo"},"temas":[{"slug":"alcool-e-drogas","titulo":"Álcool e Outras Drogas na APS","disciplina":"MFC","eyebrow":"Medicina de Família e Comunidade · Referência","questoes":[{"id":"93794bb92a","q":"Homem de 40 anos, em consulta de rotina na UBS, responde ao AUDIT e soma 12 pontos. Não tem sinais de dependência. Qual a conduta indicada?","opts":["Intervenção breve sobre o uso de risco, com retorno combinado","Encaminhamento imediato ao CAPS AD para desintoxicação","Apenas reforço positivo, pois o escore indica baixo risco","Prescrição de naltrexona para reduzir a vontade de beber"],"c":0,"exp":"No AUDIT (10 perguntas, 0 a 40 pontos), 0 a 7 é baixo risco; 8 a 15, uso de risco que pede intervenção breve; 16 a 19, intervenção breve com aconselhamento e monitoramento; 20 ou mais, avaliação de dependência e tratamento especializado. Com 12 pontos, a conduta é a intervenção breve na própria APS.","ref":[1,2]},{"id":"36a99c680c","q":"Mulher de 52 anos soma 24 pontos no AUDIT. Qual o próximo passo?","opts":["Avaliar dependência e planejar tratamento, com apoio do CAPS AD","Fazer só orientação geral, pois o AUDIT não avalia dependência","Repetir o AUDIT em um ano, já que o escore é apenas de rastreio","Internar de forma involuntária para a desintoxicação imediata"],"c":0,"exp":"AUDIT de 20 a 40 (zona IV) indica provável dependência e pede avaliação diagnóstica e tratamento mais intensivo, em geral compartilhado com o CAPS AD, com a UBS seguindo junto. O instrumento não fecha diagnóstico, mas não se adia a avaliação; internação involuntária é exceção, não conduta de rotina.","ref":[1,4]},{"id":"cf76916443","q":"Homem de 28 anos bebe cerca de dez latas de cerveja todo sábado, sem prejuízo no trabalho ou na família. Responde 'não' às quatro perguntas do CAGE. Qual a interpretação correta?","opts":["O CAGE não mede quantidade e deixa passar o uso de risco; vale aplicar o AUDIT","O CAGE negativo exclui problema com álcool e dispensa qualquer abordagem","O CAGE negativo confirma que o consumo é de baixo risco para a saúde dele","O CAGE só é válido com exames de GGT e VCM, que devem ser pedidos antes"],"c":0,"exp":"O CAGE (Cut down, Annoyed, Guilty, Eye-opener) sugere problema com 2 ou mais respostas positivas, mas é voltado à dependência e não pergunta quanto se bebe. O consumo pesado episódico é uso de risco mesmo sem consequências, e o AUDIT (ou o AUDIT-C, suas três perguntas de consumo) é o instrumento que o capta.","ref":[1,3]},{"id":"61d3edca0c","q":"Na UBS, a equipe quer um instrumento da OMS que rastreie, numa só aplicação, o uso de tabaco, álcool, maconha, cocaína, sedativos, inalantes e opioides, com escore de risco por substância. Qual é ele?","opts":["ASSIST","AUDIT-C","CIWA-Ar","SRQ-20"],"c":0,"exp":"O ASSIST rastreia várias substâncias e classifica o risco de cada uma em baixo (orientação), moderado (intervenção breve) ou alto (intervenção breve e encaminhamento para avaliação e tratamento). O AUDIT-C cobre só o álcool, a CIWA-Ar mede gravidade de abstinência alcoólica e o SRQ-20 rastreia transtorno mental comum.","ref":[1,3]},{"id":"38ecfb2b1a","q":"Na intervenção breve para uso de risco de álcool, quais elementos compõem o acrônimo FRAMES?","opts":["Feedback, responsabilidade, aconselhamento, menu de opções, empatia e autoeficácia","Frequência, risco, abstinência, medicação, encaminhamento e seguimento mensal","Fissura, recaída, avaliação, monitoramento, exames e suspensão gradual do uso","Feedback, repressão, advertência, multa, exclusão do grupo e sanção familiar"],"c":0,"exp":"FRAMES: Feedback (devolver o resultado e os riscos), Responsabilidade (a decisão é do paciente), Advice (conselho claro de reduzir ou parar), Menu (opções de estratégia e meta), Empatia e Self-efficacy (autoeficácia). É indicada sobretudo para uso de risco e uso nocivo; na dependência é só o começo do cuidado.","ref":[2,0]},{"id":"c48b122c26","q":"Paciente diz: 'Sei que estou bebendo demais e às vezes penso em parar, mas a bebida me ajuda a relaxar depois do trabalho. Não sei se é a hora.' Em qual estágio de mudança ele está e o que fazer?","opts":["Contemplação: explorar a ambivalência, pesando prós e contras","Pré-contemplação: confrontar a negação até que ele a admita","Preparação: marcar logo a data de parada e prescrever remédio","Manutenção: focar só na prevenção de recaída e nos gatilhos"],"c":0,"exp":"Reconhecer o problema e estar dividido entre mudar e não mudar é a contemplação de Prochaska e DiClemente. A conduta é explorar a ambivalência com a balança decisória, deixando o paciente verbalizar seus motivos para mudar; empurrar para a ação antes da hora aumenta a resistência.","ref":[3,2]},{"id":"3c6a5646d8","q":"Homem de 45 anos com hipertensão e AUDIT de 14 diz: 'Não vejo problema nenhum, todo mundo bebe no fim de semana.' Qual a abordagem mais adequada?","opts":["Devolver os riscos sem confronto e manter o vínculo para outra conversa","Afirmar que ele é alcoólatra e que precisa admitir isso para ser tratado","Encerrar o assunto e não voltar a ele até que o paciente peça ajuda","Condicionar a renovação da receita do anti-hipertensivo a parar de beber"],"c":0,"exp":"Quem não vê problema está na pré-contemplação: a tarefa é informar e devolver os riscos (inclusive para a pressão), sem rótulos nem confronto, e manter a porta aberta. Pela entrevista motivacional, argumentar e rotular aumentam a resistência, e condicionar o cuidado a parar afasta o paciente.","ref":[3,2]},{"id":"2cb2809581","q":"Fumante parou há quatro meses com acompanhamento na UBS. Voltou a fumar após uma festa e chega dizendo que 'fracassou'. Como entender e conduzir?","opts":["Recaída faz parte do ciclo: acolher, rever os gatilhos e retomar o plano","Recaída indica falta de motivação: aguardar ele voltar a querer parar","Recaída anula o tratamento: o plano só recomeça após seis meses","Recaída mostra que a abordagem falhou: encaminhar para internação"],"c":0,"exp":"No modelo transteórico a recaída é parte esperada do processo, que funciona como espiral: cada tentativa ensina algo. A conduta é acolher sem culpa, identificar o que precipitou a volta e retomar o plano; tratar a recaída como fracasso afasta o paciente do serviço.","ref":[3,3]},{"id":"da16eddc65","q":"Qual atitude do médico está de acordo com os princípios da entrevista motivacional?","opts":["Evitar argumentar e ajudar o paciente a ver a distância entre o uso e seus objetivos","Listar todos os danos do álcool até o paciente concordar em parar naquele dia","Usar o medo das complicações como principal estratégia para gerar a mudança","Assumir a decisão pelo paciente, já que a dependência compromete a autonomia"],"c":0,"exp":"A entrevista motivacional (Miller e Rollnick) se apoia em expressar empatia, desenvolver discrepância entre o comportamento e os objetivos do próprio paciente, evitar argumentação e apoiar a autoeficácia. Quem deve verbalizar as razões para mudar é o paciente; sermão e medo aumentam a resistência.","ref":[3,0]},{"id":"d85f842ad6","q":"Homem de 33 anos, usuário de crack, vive na rua e diz que não quer parar de usar. Procura a equipe por causa de uma ferida no pé. Qual conduta segue a lógica da redução de danos?","opts":["Tratar a ferida, orientar uso mais seguro, testar para IST e manter vínculo","Tratar a ferida só depois que ele aceitar a internação para desintoxicação","Recusar o atendimento até que ele compareça sem ter usado nenhuma droga","Encaminhar direto à comunidade terapêutica como condição para o curativo"],"c":0,"exp":"Redução de danos é reduzir os prejuízos do uso sem exigir abstinência como condição para o cuidado: tratar a demanda que ele trouxe, orientar não compartilhar cachimbo, oferecer preservativo e testagem para HIV, sífilis e hepatites e criar vínculo. Condicionar o atendimento à abstinência afasta justamente quem mais precisa.","ref":[4,0]},{"id":"26573ea722","q":"Sobre a redução de danos no SUS, é correto afirmar que ela:","opts":["É estratégia de saúde pública que não condiciona o cuidado à abstinência","É estratégia restrita ao CAPS AD, sem espaço na atenção primária à saúde","Estimula o consumo de drogas e foi abandonada pelo Ministério da Saúde","Tem como meta única e obrigatória a abstinência total desde o primeiro dia"],"c":0,"exp":"A redução de danos, regulamentada pela Portaria 1.028/2005 e adotada na política do Ministério da Saúde para usuários de álcool e outras drogas, busca diminuir prejuízos à saúde e sociais sem exigir abstinência. É praticada na APS, no Consultório na Rua e nos CAPS; a abstinência pode ser uma meta, mas não é condição de acesso.","ref":[4,0]},{"id":"84fe107876","q":"Mulher de 30 anos, em tratamento no CAPS AD por uso de crack, perdeu a moradia e está em vulnerabilidade social. Qual ponto da RAPS oferece residência transitória articulada ao CAPS?","opts":["Unidade de Acolhimento","Residência Terapêutica","Hospital psiquiátrico","Centro de Convivência"],"c":0,"exp":"A Unidade de Acolhimento, do componente de atenção residencial de caráter transitório da RAPS, oferece moradia temporária e cuidado articulado ao CAPS para quem tem necessidades decorrentes de álcool e drogas e vulnerabilidade social. O Serviço Residencial Terapêutico é moradia para egressos de longas internações psiquiátricas.","ref":[4,1]},{"id":"07f93e2f56","q":"Homem de 48 anos, bebe diariamente há anos e parou há 14 horas. Tem tremor leve, sudorese e ansiedade, sem confusão nem alucinações. Nunca teve convulsão nem delirium tremens, não tem comorbidade grave e a esposa ficará com ele. Qual a conduta?","opts":["Tratar na APS com benzodiazepínico oral, tiamina e retorno próximo","Encaminhar ao pronto-socorro, pois toda abstinência exige internação","Prescrever haloperidol oral isolado para controlar tremor e ansiedade","Orientar que volte a beber aos poucos até a abstinência desaparecer"],"c":0,"exp":"Abstinência leve, sem história de convulsão ou delirium tremens, sem comorbidade grave e com acompanhante pode ser manejada ambulatorialmente: benzodiazepínico oral (diazepam; lorazepam na hepatopatia grave ou no idoso) com redução em cerca de uma semana, tiamina, hidratação e reavaliação frequente. Antipsicótico isolado não trata abstinência.","ref":[5,1]},{"id":"18f89e8ab9","q":"Na avaliação de um paciente em abstinência alcoólica na UBS, qual dado indica encaminhamento para tratamento hospitalar?","opts":["Convulsão em abstinência anterior","Tremor fino de extremidades leve","Insônia e ansiedade desde a véspera","Sudorese leve sem alteração mental"],"c":0,"exp":"História de convulsão ou de delirium tremens em abstinência anterior prediz quadro grave e indica tratamento hospitalar, assim como confusão, alucinações, suspeita de Wernicke, comorbidade descompensada, gestação, falta de suporte em casa ou falha do manejo ambulatorial. Tremor, sudorese, insônia e ansiedade isolados são a abstinência leve.","ref":[5,3]},{"id":"033207fc88","q":"Hipertenso de 55 anos, fumante, vem à UBS para renovar a receita. Em cerca de 3 minutos, o médico pergunta se ele fuma, avalia a motivação e a dependência, aconselha a parar e o prepara para a tentativa. Que abordagem é essa?","opts":["Abordagem breve ou mínima do fumante (PAAP)","Abordagem intensiva em grupo cognitivo-comportamental","Teste de Fagerström para indicar a internação","Entrevista diagnóstica estruturada para dependência"],"c":0,"exp":"A abordagem breve ou mínima (perguntar, avaliar, aconselhar e preparar — PAAP) cabe em qualquer consulta e deve ser feita com todo fumante; a abordagem básica acrescenta o acompanhar (PAAPA). A abordagem intensiva é estruturada em sessões individuais ou em grupo, e o Fagerström mede a dependência de nicotina.","ref":[6,0]},{"id":"d2067bd1fd","q":"Fumante de 46 anos quer parar. Fuma 25 cigarros por dia, acende o primeiro cinco minutos após acordar e tem Fagerström de 8, sem contraindicações clínicas. Qual a conduta?","opts":["Abordagem cognitivo-comportamental associada a farmacoterapia","Abordagem cognitivo-comportamental isolada, sem farmacoterapia","Farmacoterapia isolada, sem necessidade de apoio comportamental","Redução para dez cigarros por dia antes de qualquer tratamento"],"c":0,"exp":"Fumar 20 ou mais cigarros por dia, acender o primeiro até 30 minutos após acordar e ter Fagerström de 5 ou mais indicam dependência elevada e farmacoterapia (reposição de nicotina ou bupropiona). O medicamento sempre se associa à abordagem cognitivo-comportamental, que é a base do tratamento no PCDT do Tabagismo.","ref":[6,1]},{"id":"485c32fd0d","q":"Fumante vai iniciar bupropiona no programa de tabagismo da UBS. Quando o medicamento deve começar em relação à data de parada (dia D)?","opts":["Uma a duas semanas antes da data do dia D","No próprio dia D, junto com o adesivo","Uma semana após o dia D, se houver fissura","Só após um mês sem fumar, para evitar recaída"],"c":0,"exp":"A bupropiona leva alguns dias para atingir efeito e começa 1 a 2 semanas antes do dia D: 150 mg pela manhã por 3 dias e depois 150 mg duas vezes ao dia. O adesivo de nicotina, ao contrário, começa no dia D; a bupropiona é contraindicada em epilepsia, bulimia, anorexia e com IMAO.","ref":[6,2]},{"id":"6efd4cf189","q":"Pela Lei 13.840/2019, a internação involuntária de pessoa dependente de drogas:","opts":["Dura só o tempo da desintoxicação, no máximo 90 dias, comunicada em 72 horas","Dura o tempo que a família decidir, sem prazo e sem comunicação a órgão algum","Pode ser pedida por policial e dura no mínimo seis meses em comunidade terapêutica","É proibida, pois a Reforma Psiquiátrica aboliu toda internação sem consentimento"],"c":0,"exp":"A Lei 13.840/2019 prevê internação involuntária a pedido de familiar ou responsável legal, formalizada por médico, apenas pelo tempo necessário à desintoxicação e no máximo 90 dias, com comunicação ao Ministério Público e à Defensoria em até 72 horas. Servidores da segurança pública não podem pedi-la, e ela é exceção, quando os recursos extra-hospitalares não bastam.","ref":[4,2]}],"resumo":[{"h":"","blocos":[{"html":"<blockquote><p>Material de referência: não há slide da aula deste tema. Baseado nos manuais da OMS (AUDIT, ASSIST e intervenção breve), no Caderno de Atenção Básica nº 34 (Saúde Mental), no PCDT do Tabagismo e no Caderno de Atenção Básica nº 40 (pessoa tabagista), do Ministério da Saúde.<\/p><\/blockquote>"}]},{"h":"Padrões de uso e rastreio","blocos":[{"html":"<p>Nem todo uso é doença, e a conduta muda com o padrão. <strong>Uso de baixo risco<\/strong> não pede intervenção além de orientação; <strong>uso de risco<\/strong> aumenta a chance de dano, embora ele ainda não tenha aparecido; <strong>uso nocivo<\/strong> já causou dano físico ou mental; <strong>dependência<\/strong> (no DSM-5-TR, transtorno por uso de substância) envolve perda de controle, fissura, tolerância, abstinência e uso apesar das consequências. A APS é o lugar ideal para pegar os dois primeiros, que são a maioria e respondem bem a intervenções curtas.<\/p>"},{"html":"<p>O <strong>AUDIT<\/strong>, da OMS, tem <strong>10 perguntas<\/strong> (consumo, sinais de dependência e problemas), soma de 0 a 40, e cada faixa aponta uma conduta:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>AUDIT<\/th><th>Zona<\/th><th>Conduta<\/th><\/tr><\/thead><tbody><tr><td>0 a 7<\/td><td>I<\/td><td>educação em saúde; reforçar o baixo risco<\/td><\/tr><tr><td>8 a 15<\/td><td>II<\/td><td><strong>intervenção breve<\/strong> (orientação sobre o uso de risco)<\/td><\/tr><tr><td>16 a 19<\/td><td>III<\/td><td>intervenção breve, aconselhamento e <strong>monitoramento<\/strong><\/td><\/tr><tr><td>20 a 40<\/td><td>IV<\/td><td><strong>avaliação diagnóstica de dependência<\/strong> e tratamento especializado<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>O <strong>AUDIT-C<\/strong> são as três primeiras perguntas (só consumo): rastreio rápido que, positivo, leva ao AUDIT completo. O <strong>CAGE<\/strong> tem 4 perguntas (<em>Cut down<\/em>, <em>Annoyed<\/em>, <em>Guilty<\/em>, <em>Eye-opener<\/em>), e <strong>2 ou mais respostas positivas<\/strong> sugerem problema — mas ele mira a dependência e não pergunta quantidade, então <strong>deixa passar o uso de risco<\/strong> de quem bebe muito sem consequência ainda. O <strong>ASSIST<\/strong>, também da OMS, rastreia <strong>várias substâncias numa só aplicação<\/strong> (tabaco, álcool, maconha, cocaína, estimulantes, sedativos, inalantes, alucinógenos, opioides) e dá um escore de risco baixo, moderado ou alto <strong>por substância<\/strong>: baixo pede orientação, moderado pede intervenção breve, alto pede intervenção breve e encaminhamento para avaliação e tratamento.<\/p>"},{"html":"<blockquote><p>Instrumento de rastreio estratifica risco e orienta a conduta; <strong>não fecha diagnóstico<\/strong>. Escore alto no AUDIT pede avaliação de dependência, não um rótulo.<\/p><\/blockquote>"}]},{"h":"Intervenção breve: o FRAMES","blocos":[{"html":"<p>A <strong>intervenção breve<\/strong> é uma conversa estruturada de poucos minutos, em uma ou poucas consultas, indicada sobretudo para o <strong>uso de risco e o uso nocivo<\/strong>. Na dependência ela é o começo, não o tratamento inteiro. Os elementos eficazes cabem no acrônimo <strong>FRAMES<\/strong>:<\/p>"},{"html":"<ul><li><strong>F<\/strong>eedback — devolver o resultado do rastreio e os riscos, sem julgamento;<\/li><li><strong>R<\/strong>esponsabilidade — a decisão de mudar é do paciente;<\/li><li><strong>A<\/strong>conselhamento (<em>advice<\/em>) — recomendação clara de reduzir ou parar;<\/li><li><strong>M<\/strong>enu — oferecer opções de estratégia e de meta;<\/li><li><strong>E<\/strong>mpatia — postura acolhedora, sem confronto;<\/li><li><strong>S<\/strong>elf-efficacy (autoeficácia) — reforçar a confiança de que ele consegue.<\/li><\/ul>"},{"html":"<p>A prática é pedir licença para falar do assunto, dar a devolutiva, negociar uma meta (reduzir ou parar) e marcar retorno.<\/p>"}]},{"h":"Entrevista motivacional e estágios de mudança","blocos":[{"html":"<p>A <strong>entrevista motivacional<\/strong> (Miller e Rollnick) parte de que a <strong>ambivalência<\/strong> — querer e não querer mudar ao mesmo tempo — é normal, e de que confrontar aumenta a resistência. Os princípios clássicos são <strong>expressar empatia<\/strong>, <strong>desenvolver discrepância<\/strong> entre o comportamento e os objetivos do próprio paciente, <strong>evitar argumentação<\/strong> (\"fluir com a resistência\") e <strong>apoiar a autoeficácia<\/strong>. As ferramentas: perguntas abertas, reforço positivo, escuta reflexiva e resumos. Quem deve verbalizar os motivos para mudar é o paciente, não o médico.<\/p>"},{"html":"<p>O <strong>modelo transteórico<\/strong> de Prochaska e DiClemente diz em que momento o paciente está e o que fazer em cada um:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Estágio<\/th><th>Como se apresenta<\/th><th>O que fazer<\/th><\/tr><\/thead><tbody><tr><td><strong>Pré-contemplação<\/strong><\/td><td>não vê problema, não pensa em mudar<\/td><td>informar, devolver riscos, manter o vínculo — sem confronto<\/td><\/tr><tr><td><strong>Contemplação<\/strong><\/td><td>reconhece o problema, mas está ambivalente<\/td><td>explorar a ambivalência (prós e contras, a \"balança decisória\")<\/td><\/tr><tr><td><strong>Preparação<\/strong><\/td><td>decidiu mudar em breve<\/td><td>montar plano, data e estratégias<\/td><\/tr><tr><td><strong>Ação<\/strong><\/td><td>mudou recentemente<\/td><td>apoiar, lidar com gatilhos e fissura<\/td><\/tr><tr><td><strong>Manutenção<\/strong><\/td><td>sustenta a mudança<\/td><td>prevenção de recaída<\/td><\/tr><tr><td><strong>Recaída<\/strong><\/td><td>voltou ao comportamento<\/td><td>acolher sem culpa, rever o que falhou, retomar<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p>A recaída faz parte do ciclo — o modelo é uma espiral, não uma escada. Tratar recaída como fracasso afasta o paciente do serviço.<\/p><\/blockquote>"}]},{"h":"Redução de danos e a rede","blocos":[{"html":"<p><strong>Redução de danos<\/strong> é estratégia de saúde pública adotada pelo SUS (regulamentada pela Portaria 1.028/2005 e assumida pela política do Ministério da Saúde para usuários de álcool e outras drogas): reduzir os prejuízos do uso <strong>sem exigir a abstinência como condição para o cuidado<\/strong>. Não é incentivo ao uso — é ir aonde a pessoa está, criar vínculo e abrir a porta para outras metas. Na prática: não compartilhar seringas, cachimbos e canudos, preservativo, evitar misturar depressores (álcool, benzodiazepínico, opioide), hidratação e alimentação, vacina contra hepatite B e testagem para HIV, sífilis e hepatites.<\/p>"},{"html":"<p>Na RAPS, o ponto especializado é o <strong>CAPS AD<\/strong> (dias úteis) ou o <strong>CAPS AD III<\/strong> (24 horas, com acolhimento noturno), de porta aberta, com a UBS seguindo junto. A <strong>Unidade de Acolhimento<\/strong> oferece moradia <strong>transitória<\/strong>, articulada ao CAPS, para quem tem necessidades decorrentes de álcool e drogas e vulnerabilidade social.<\/p>"},{"html":"<blockquote><p>A Lei 13.840/2019 regulamentou a <strong>internação involuntária do dependente de drogas<\/strong>: pedida pela família ou responsável legal, formalizada por médico, só pelo tempo da desintoxicação, <strong>no máximo 90 dias<\/strong>, e comunicada ao Ministério Público e à Defensoria em até 72 horas. É exceção, quando os recursos extra-hospitalares não bastam.<\/p><\/blockquote>"}]},{"h":"Abstinência alcoólica: o que a APS maneja e quando encaminhar","blocos":[{"html":"<p>A abstinência começa em geral <strong>6 a 24 horas<\/strong> após a última dose — tremor, sudorese, taquicardia, hipertensão, ansiedade, insônia, náusea. Convulsões tendem a ocorrer nas primeiras 48 horas, e o <strong>delirium tremens<\/strong>, depois disso. A escala <strong>CIWA-Ar<\/strong> estima a gravidade e guia o benzodiazepínico.<\/p>"},{"html":"<p>A <strong>abstinência leve<\/strong> pode ser tratada <strong>ambulatorialmente na APS<\/strong> quando não há história de convulsão ou delirium tremens, não há comorbidade clínica ou psiquiátrica grave, o paciente aceita medicação oral e tem <strong>um acompanhante<\/strong> que fique com ele, com retorno frequente. A base é <strong>benzodiazepínico por via oral<\/strong> (diazepam; <strong>lorazepam<\/strong> na hepatopatia grave e no idoso) com redução progressiva ao longo de cerca de uma semana, <strong>tiamina<\/strong>, hidratação e alimentação. Betabloqueador ou antipsicótico <strong>isolados<\/strong> não tratam a abstinência.<\/p>"},{"html":"<h4>Encaminhar para urgência ou internação quando houver<\/h4>"},{"html":"<ul><li>abstinência moderada a grave, confusão, desorientação ou alucinações;<\/li><li>história de <strong>convulsão<\/strong> ou de <strong>delirium tremens<\/strong> em abstinência anterior;<\/li><li>suspeita de <strong>encefalopatia de Wernicke<\/strong> (confusão, ataxia, alteração ocular);<\/li><li>comorbidade clínica descompensada, gestação, risco de suicídio ou psicose;<\/li><li>uso associado de outras drogas, falta de suporte em casa ou falha do manejo ambulatorial.<\/li><\/ul>"},{"html":"<p>Passada a desintoxicação, o objetivo é manter a abstinência ou reduzir o consumo, com acompanhamento psicossocial e, quando indicado, naltrexona, acamprosato ou dissulfiram.<\/p>"}]},{"h":"Tabagismo na APS","blocos":[{"html":"<p>Todo fumante deve ser abordado em toda consulta. A <strong>abordagem breve<\/strong> (ou mínima) segue o <strong>PAAP<\/strong> — <strong>perguntar<\/strong> se fuma, <strong>avaliar<\/strong> a dependência e a motivação, <strong>aconselhar<\/strong> a parar e <strong>preparar<\/strong> para a tentativa — em cerca de 3 minutos; a <strong>abordagem básica<\/strong> acrescenta o <strong>acompanhar<\/strong> (<strong>PAAPA<\/strong>). A <strong>abordagem intensiva<\/strong> é estruturada em sessões individuais ou em grupo, com base cognitivo-comportamental: marcar o <strong>dia D<\/strong>, reconhecer gatilhos, lidar com a fissura e prevenir recaída.<\/p>"},{"html":"<p>O <strong>teste de Fagerström<\/strong> (0 a 10) mede a dependência de nicotina; o <strong>primeiro cigarro logo ao acordar<\/strong> é o marcador isolado mais forte. A farmacoterapia é considerada, associada à abordagem comportamental, em quem fuma <strong>20 ou mais cigarros por dia<\/strong>, fuma o primeiro cigarro <strong>até 30 minutos após acordar<\/strong> (com pelo menos 10 cigarros/dia), tem <strong>Fagerström de 5 ou mais<\/strong> ou já falhou por sintomas de abstinência — sem contraindicação.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Tratamento (PCDT)<\/th><th>Como usar<\/th><th>Atenção<\/th><\/tr><\/thead><tbody><tr><td><strong>Adesivo de nicotina<\/strong><\/td><td>começa <strong>no dia D<\/strong>, com redução gradual das doses ao longo de semanas<\/td><td>irritação de pele; cautela no infarto recente e em arritmia grave<\/td><\/tr><tr><td><strong>Goma ou pastilha<\/strong><\/td><td>para a fissura, associada ao adesivo<\/td><td>a combinação é mais eficaz que uma forma isolada<\/td><\/tr><tr><td><strong>Bupropiona<\/strong><\/td><td>começa <strong>1 a 2 semanas antes do dia D<\/strong>: 150 mg pela manhã por 3 dias, depois 150 mg duas vezes ao dia<\/td><td><strong>contraindicada<\/strong> em epilepsia, bulimia e anorexia, com IMAO e na retirada abrupta de álcool ou benzodiazepínico<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p>A vareniclina é a monoterapia mais eficaz nas diretrizes internacionais, mas não integra o elenco do protocolo do SUS. E o cigarro eletrônico tem venda proibida pela Anvisa — não é tratamento.<\/p><\/blockquote>"}]}]},{"slug":"migracao-refugio","titulo":"Migração, Refúgio e Apatridia","disciplina":"MFC","eyebrow":"Medicina de Família e Comunidade · Referência","questoes":[{"id":"4366dae1d6","q":"Uma mulher deixou seu país por ameaças de morte ligadas à sua religião, entrou no Brasil e registrou na Polícia Federal o pedido de reconhecimento da condição de refugiada; o CONARE ainda não decidiu. Ela é, tecnicamente:","opts":["Solicitante de refúgio","Refugiada reconhecida","Imigrante econômica","Visitante temporária"],"c":0,"exp":"Solicitante de refúgio é quem pediu o reconhecimento e aguarda a decisão do CONARE. Nesse período recebe documento provisório que vale como identificação e permite tirar CPF e carteira de trabalho, e já está protegida contra a devolução ao país onde corre risco. O acesso ao SUS vale desde o primeiro dia.","ref":[2,2]},{"id":"cabb5c60c2","q":"Famílias que deixaram suas casas por conflito armado ou desastre, mas continuam dentro das fronteiras do próprio país, são chamadas de:","opts":["Deslocados internos","Refugiados ambientais","Apátridas de fato","Solicitantes de asilo"],"c":0,"exp":"Deslocado interno é quem foi forçado a deixar o lugar onde vivia mas não cruzou fronteira internacional; por isso não é refugiado pela Convenção de 1951, e a proteção cabe ao próprio Estado. \"Refugiado ambiental\" é expressão de uso corrente, mas não é categoria jurídica da Convenção.","ref":[1,2]},{"id":"f882f5b2d7","q":"Pela Lei de Migração (Lei nº 13.445/2017), apátrida é a pessoa que:","opts":["não é considerada nacional por nenhum Estado, segundo a lei de cada um","perdeu o documento de identidade e não consegue provar a nacionalidade","tem duas nacionalidades e precisa escolher uma ao entrar no Brasil","teve o pedido de refúgio negado e permanece no território sem visto"],"c":0,"exp":"Apátrida é quem não é considerado nacional por nenhum Estado, nos termos da Convenção de 1954. A Lei de Migração criou procedimento para reconhecer a apatridia e facilitar a naturalização. Como o Brasil adota o critério do solo, toda criança nascida aqui é brasileira, o que impede que ela nasça apátrida.","ref":[2,3]},{"id":"a8cffb917b","q":"A Lei nº 9.474/1997 reconhece como refugiado quem foge de perseguição por raça, religião, nacionalidade, grupo social ou opinião política e acrescenta, de forma ampliada, quem deixa seu país em razão de:","opts":["grave e generalizada violação de direitos humanos","busca de melhores condições de trabalho e renda","falta de vagas em universidades do país de origem","necessidade de tratamento médico não disponível"],"c":0,"exp":"Além das cinco causas de perseguição da Convenção de 1951, a lei brasileira inclui a grave e generalizada violação de direitos humanos, inspirada na Declaração de Cartagena (1984). Foi com base nela que o CONARE passou a reconhecer venezuelanos de forma facilitada. Quem migra por trabalho ou renda é migrante, não refugiado, e se regulariza por outras vias.","ref":[2,0]},{"id":"2cbb7a114f","q":"O princípio da não devolução (non-refoulement), central no direito dos refugiados, determina que:","opts":["ninguém seja enviado a país onde sua vida ou liberdade estejam ameaçadas","o refugiado não possa voltar ao país de origem nem para visitar a família","o solicitante só seja aceito se vier direto do país onde foi perseguido","o país de acolhida não possa cobrar documentos de quem pede proteção"],"c":0,"exp":"A não devolução proíbe enviar a pessoa a território onde sua vida, liberdade ou integridade estejam ameaçadas, e vale desde o pedido de refúgio, antes de qualquer decisão. É a pedra angular da Convenção de 1951 e está na Lei nº 9.474/1997.","ref":[2,2]},{"id":"3c3504dc4b","q":"Um homem cruzou a fronteira por terra, sem passar pelo controle migratório, fugindo de perseguição política. Sobre o pedido de refúgio, é correto afirmar que:","opts":["a entrada irregular não impede que ele solicite refúgio no Brasil","precisa sair do país e reentrar pelo posto oficial para fazer o pedido","o pedido só é aceito se feito em até 48 horas após cruzar a fronteira","a entrada irregular é crime e leva à deportação antes de qualquer análise"],"c":0,"exp":"A Lei nº 9.474/1997 é explícita: o ingresso irregular não impede a solicitação de refúgio, e a Lei de Migração (2017) adota a não criminalização da migração como princípio. O pedido é feito à Polícia Federal e, a partir dele, a pessoa fica protegida pela não devolução.","ref":[2,2]},{"id":"00eb5421f0","q":"A Lei de Migração (Lei nº 13.445/2017), que substituiu o Estatuto do Estrangeiro de 1980, mudou a lógica da política migratória ao:","opts":["tratar a migração como questão de direitos humanos, não de segurança","restringir o acesso de imigrantes irregulares aos serviços públicos","condicionar a residência a contrato de trabalho prévio no Brasil","criar a prisão administrativa para quem estiver sem visto válido"],"c":0,"exp":"O Estatuto do Estrangeiro, da ditadura, via o imigrante pela ótica da segurança nacional. A lei de 2017 tem como princípios a universalidade dos direitos humanos, o repúdio à xenofobia, a não criminalização da migração, a acolhida humanitária e o acesso igualitário a serviços públicos, incluindo saúde, sem discriminação pela nacionalidade ou pela condição migratória.","ref":[2,3]},{"id":"aaee7cc039","q":"Um imigrante sem documento, em situação migratória irregular, procura a UBS com tosse há três semanas. A equipe deve:","opts":["atendê-lo e cadastrá-lo, sem exigir documento ou regularização","encaminhá-lo à Polícia Federal antes de qualquer atendimento","atender só em caso de urgência até que ele regularize a situação","exigir passaporte para emitir o Cartão SUS e liberar a consulta"],"c":0,"exp":"A saúde é direito de todos (Constituição, art. 196) e a Lei de Migração garante acesso ao SUS sem discriminação pela condição migratória. A falta de documento não impede atendimento nem cadastro, e o Cartão Nacional de Saúde pode ser emitido. A equipe não faz fiscalização migratória — e aqui deve investigar tuberculose.","ref":[3,1]},{"id":"7050dc8e16","q":"Família recém-chegada, que não fala português, vem à consulta com o filho de 10 anos, que fala um pouco da língua e se oferece para traduzir. A melhor conduta é:","opts":["buscar intérprete adulto ou mediador cultural, evitando usar a criança","usar a criança como intérprete, pois ela já é o elo da família com o serviço","remarcar a consulta para quando a família já estiver falando português","conduzir a consulta só com gestos e entregar as orientações por escrito"],"c":0,"exp":"Crianças não devem servir de intérprete: invertem papéis familiares, ficam expostas a temas delicados (violência, sexualidade, prognóstico) e traduzem com erros. O ideal é intérprete profissional ou mediador cultural; na falta, outro adulto de confiança ou ferramenta de tradução, sempre conferindo a compreensão.","ref":[3,3]},{"id":"022c2a3413","q":"Refugiada de 30 anos, que testemunhou a morte de familiares na guerra, tem há quatro meses pesadelos, revivescências, evitação de lembranças e sobressalto constante. Qual a hipótese e a abordagem?","opts":["TEPT: cuidado informado pelo trauma, vínculo e psicoterapia focada","Psicose breve: antipsicótico e encaminhamento para internação","Luto normal: orientar que melhora sozinho, sem acompanhamento","Simulação: investigar ganho secundário no processo de refúgio"],"c":0,"exp":"Revivescência, evitação, alterações negativas de humor e cognição e hiperexcitabilidade por mais de 1 mês após trauma configuram TEPT, mais frequente em refugiados, assim como depressão e ansiedade. A abordagem é informada pelo trauma: segurança, vínculo, não forçar o relato, psicoterapia focada no trauma e ISRS quando indicado, com apoio da rede (eMulti, CAPS).","ref":[4,1]},{"id":"33bd4f4731","q":"Criança de 4 anos recém-chegada de outro país não tem nenhum registro vacinal; os pais dizem que ela \"tomou todas as vacinas\". A conduta é:","opts":["considerá-la não vacinada e atualizar o calendário conforme a idade","aceitar o relato dos pais e só aplicar as doses previstas para 5 anos","solicitar sorologias para todas as doenças antes de qualquer vacina","aguardar a regularização migratória para iniciar a vacinação"],"c":0,"exp":"Sem comprovante, a dose não é considerada válida: a criança é tratada como não vacinada e o esquema é iniciado ou completado conforme a idade e o calendário nacional. Vacinar a mais não traz risco relevante, e a vacinação não depende de documento nem de situação migratória.","ref":[5,2]},{"id":"ea1afc45c4","q":"O surto de sarampo de 2018, que começou em Roraima e no Amazonas com casos importados, num contexto de grande fluxo migratório, teve como consequência:","opts":["a perda, em 2019, da certificação de país livre do sarampo","a proibição temporária da entrada de imigrantes não vacinados","a suspensão da vacina tríplice viral na rotina por falta de doses","a erradicação definitiva do vírus no país após vacinação em massa"],"c":0,"exp":"O vírus reintroduzido encontrou coberturas vacinais abaixo da meta e voltou a circular, e o Brasil perdeu em 2019 a certificação de eliminação do sarampo. A resposta de saúde pública é a cobertura vacinal da população inteira, migrantes e brasileiros, não o fechamento de fronteiras.","ref":[5,2]},{"id":"a06cbbf43e","q":"Gestante boliviana de 26 anos, que cresceu em zona rural do seu país e mora em São Paulo, inicia o pré-natal. Além dos exames de rotina, a história de origem justifica pedir:","opts":["Sorologia para doença de Chagas","Sorologia para esquistossomose","Gota espessa para malária","Sorologia para leptospirose"],"c":0,"exp":"A Bolívia tem alta prevalência de doença de Chagas, e mulheres vindas de áreas endêmicas devem ser testadas: a transmissão vertical é a principal via de infecção nova onde não há vetor, e o recém-nascido infectado tratado cedo tem altas taxas de cura. Gota espessa só se houver febre e passagem recente por área de malária.","ref":[5,1]},{"id":"d9bfb143ae","q":"Homem de 25 anos chegou há 10 dias a Boa Vista vindo de área de garimpo no sul da Venezuela e procura a UBS com febre alta, calafrios e cefaleia há dois dias. Qual exame não pode deixar de ser feito no mesmo dia?","opts":["Gota espessa para pesquisa de plasmódio","Sorologia IgM para dengue após 7 dias","Prova tuberculínica e raio X de tórax","Sorologia para hepatite A e leptospirose"],"c":0,"exp":"Febre em quem esteve recentemente em área de transmissão de malária exige gota espessa ou teste rápido no mesmo dia: a malária por falciparum pode se agravar em poucas horas. As áreas de garimpo do sul da Venezuela têm transmissão intensa; dengue e outras febres entram no diferencial, mas não adiam a pesquisa de plasmódio.","ref":[5,1]},{"id":"5d7473e3b1","q":"Imigrantes recém-chegados costumam ter saúde igual ou melhor que a da população local, vantagem que se perde com os anos de residência em condições precárias. Esse fenômeno é chamado de:","opts":["Efeito do migrante saudável","Lei dos cuidados inversos","Transição epidemiológica","Viés do trabalhador sadio"],"c":0,"exp":"Quem consegue migrar costuma ser jovem e saudável; a piora vem depois, com moradia precária, trabalho informal e exaustivo, barreiras de acesso e discriminação. O dado desmonta o estereótipo do migrante como vetor de doença e desloca o foco para as condições de vida no país de acolhida.","ref":[5,0]},{"id":"aeb13b7801","q":"Na visita domiciliar, a ACS encontra oito imigrantes que moram e trabalham na mesma oficina de costura, com jornadas de 14 horas, documentos retidos pelo dono e dívida com a viagem. Qual a conduta da equipe?","opts":["Acolher, cuidar da saúde e acionar a rede de proteção contra trabalho escravo","Denunciar os trabalhadores à Polícia Federal por situação migratória irregular","Não intervir, pois é questão trabalhista e não de saúde, fora do papel da equipe","Orientar os trabalhadores a procurar sozinhos a Justiça do Trabalho no futuro"],"c":0,"exp":"Jornada exaustiva, retenção de documentos e servidão por dívida caracterizam trabalho análogo à escravidão, muitas vezes ligado ao tráfico de pessoas. A equipe cuida da saúde, mantém o vínculo, notifica a violência e aciona a rede (Ministério Público do Trabalho, fiscalização do trabalho, Disque 100, assistência social); a vítima é protegida, não tratada como infratora.","ref":[4,2]},{"id":"fd17b3cd0a","q":"Uma família de outra cultura atribui a febre do filho a \"mau-olhado\" e já deu um chá tradicional. A abordagem culturalmente sensível consiste em:","opts":["explorar o entendimento da família e negociar um plano compatível","explicar que a crença está errada e proibir o uso de qualquer chá","aceitar sem questionar e não prescrever tratamento convencional","encaminhar a família para atendimento em serviço de outra cultura"],"c":0,"exp":"A abordagem culturalmente sensível explora o modelo explicativo da família (o que acham que é, por que aconteceu, o que temem, o que já fizeram), respeita práticas que não fazem mal e negocia um plano comum, o que melhora a adesão. É o método clínico centrado na pessoa aplicado à diferença cultural, sem perder de vista sinais de gravidade.","ref":[6,0]}],"resumo":[{"h":"","blocos":[{"html":"<blockquote><p>Material de referência: não há slide da aula deste tema. Baseado na Lei do Refúgio (Lei nº 9.474/1997), na Lei de Migração (Lei nº 13.445/2017), nas Convenções da ONU de 1951 e 1954 e em publicações do Ministério da Saúde, do ACNUR e da OIM.<\/p><\/blockquote>"}]},{"h":"Quem é quem: as definições que caem","blocos":[{"html":"<p>As categorias se confundem no uso comum, mas têm consequências jurídicas diferentes — e a prova cobra justamente a fronteira entre elas.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Termo<\/th><th>Definição<\/th><\/tr><\/thead><tbody><tr><td><strong>Migrante<\/strong><\/td><td>termo amplo: quem se desloca do lugar de residência habitual, dentro do país ou para outro<\/td><\/tr><tr><td><strong>Imigrante<\/strong><\/td><td>nacional de outro país ou apátrida que se estabelece, temporária ou definitivamente, no Brasil<\/td><\/tr><tr><td><strong>Refugiado<\/strong><\/td><td>quem está fora do seu país por fundado temor de perseguição (raça, religião, nacionalidade, grupo social, opinião política) ou por grave e generalizada violação de direitos humanos<\/td><\/tr><tr><td><strong>Solicitante de refúgio<\/strong><\/td><td>quem pediu o reconhecimento e aguarda a decisão<\/td><\/tr><tr><td><strong>Apátrida<\/strong><\/td><td>quem não é considerado nacional por nenhum Estado<\/td><\/tr><tr><td><strong>Deslocado interno<\/strong><\/td><td>forçado a sair de casa, mas <strong>sem cruzar fronteira<\/strong> internacional<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>O <strong>migrante econômico<\/strong> — quem sai em busca de trabalho e renda — não é refugiado, e se regulariza por outras vias, como a autorização de residência ou o visto humanitário. O <strong>deslocado interno<\/strong> também não é refugiado pela Convenção de 1951, porque continua no próprio país, sob a proteção (ou a falha) do próprio Estado. \"Refugiado ambiental\" é expressão corrente, mas não categoria jurídica.<\/p>"}]},{"h":"O marco legal brasileiro","blocos":[{"html":"<p>A <strong>Lei nº 9.474/1997<\/strong> incorporou a Convenção de 1951 e criou o <strong>CONARE<\/strong> (Comitê Nacional para os Refugiados). É considerada avançada por ampliar a definição: além das cinco causas de perseguição, reconhece quem foge de <strong>grave e generalizada violação de direitos humanos<\/strong>, inspirada na <strong>Declaração de Cartagena (1984)<\/strong>. Foi com essa base que o CONARE passou a reconhecer venezuelanos de forma facilitada.<\/p>"},{"html":"<p>Dois pontos de prova:<\/p>"},{"html":"<ul><li><strong>Não devolução (non-refoulement):<\/strong> ninguém pode ser enviado a território onde sua vida, liberdade ou integridade estejam ameaçadas. Vale <strong>desde o pedido<\/strong>, antes da decisão.<\/li><li><strong>O ingresso irregular não impede a solicitação de refúgio.<\/strong> O pedido é feito à Polícia Federal, e o solicitante recebe documento provisório que permite tirar CPF e carteira de trabalho.<\/li><\/ul>"},{"html":"<p>A <strong>Lei de Migração (Lei nº 13.445/2017)<\/strong> substituiu o <strong>Estatuto do Estrangeiro (1980)<\/strong>, que via o imigrante pela ótica da segurança nacional. A nova lei parte dos <strong>direitos humanos<\/strong>: universalidade e indivisibilidade dos direitos, <strong>repúdio à xenofobia<\/strong> e ao racismo, <strong>não criminalização da migração<\/strong>, <strong>acolhida humanitária<\/strong> (com visto específico, usado para haitianos, sírios, afegãos e ucranianos) e <strong>acesso igualitário a serviços públicos<\/strong>, incluindo <strong>saúde, sem discriminação pela nacionalidade ou condição migratória<\/strong>. Ela também criou procedimento para reconhecer a <strong>apatridia<\/strong> e facilitar a naturalização. Como o Brasil adota o <strong>critério do solo<\/strong>, toda criança nascida aqui é brasileira — e não nasce apátrida.<\/p>"},{"html":"<p>Desde 2018, a <strong>Operação Acolhida<\/strong> organiza em Roraima o acolhimento de venezuelanos: ordenamento da fronteira, abrigos e <strong>interiorização<\/strong> para outros estados.<\/p>"}]},{"h":"Direito ao SUS e barreiras de acesso","blocos":[{"html":"<p>A saúde é <strong>direito de todos e dever do Estado<\/strong> (Constituição, art. 196), e a universalidade não depende de nacionalidade nem de situação migratória. Na prática:<\/p>"},{"html":"<ul><li>A <strong>falta de documento não impede<\/strong> atendimento, cadastro na equipe nem emissão do <strong>Cartão Nacional de Saúde<\/strong>.<\/li><li>A equipe <strong>não faz fiscalização migratória<\/strong>: denunciar o usuário à Polícia Federal rompe o vínculo e afasta a população do serviço.<\/li><li>O <strong>território<\/strong> da equipe inclui os migrantes que moram nele; o cadastro pelo ACS é a porta de entrada.<\/li><\/ul>"},{"html":"<blockquote><p>O direito existe; o acesso, nem sempre. As <strong>barreiras<\/strong> mais citadas são a <strong>língua<\/strong>, a <strong>documentação e a burocracia<\/strong>, o <strong>desconhecimento do sistema<\/strong>, o <strong>horário de trabalho<\/strong>, o <strong>medo de deportação<\/strong>, a <strong>moradia precária<\/strong> e a <strong>xenofobia<\/strong> — inclusive dentro do serviço.<\/p><\/blockquote>"},{"html":"<p>Para a barreira linguística, o ideal é <strong>intérprete profissional ou mediador cultural<\/strong>. <strong>Criança não deve servir de intérprete<\/strong>: inverte papéis, expõe a temas delicados e traduz com erros.<\/p>"}]},{"h":"Saúde mental e violência","blocos":[{"html":"<p>Refugiados têm prevalência mais alta de <strong>transtorno de estresse pós-traumático<\/strong>, <strong>depressão<\/strong> e <strong>ansiedade<\/strong>, somando o trauma de origem, o do trajeto e o estresse da chegada — o chamado <strong>luto migratório<\/strong>: perda de língua, família, status, terra e projeto. Nem todo sofrimento é transtorno, e patologizar o luto normal é erro; mas sintomas persistentes que prejudicam a vida pedem tratamento.<\/p>"},{"html":"<p>O <strong>cuidado informado pelo trauma<\/strong> se apoia em segurança, vínculo, previsibilidade e controle devolvido à pessoa: <strong>não forçar o relato<\/strong>, explicar cada etapa do exame, oferecer escolha. Psicoterapia focada no trauma e ISRS quando indicado, com apoio da eMulti e do CAPS.<\/p>"},{"html":"<p>Migrantes, sobretudo mulheres e pessoas em situação irregular, são vulneráveis a <strong>violência de gênero<\/strong>, <strong>tráfico de pessoas<\/strong> e <strong>trabalho análogo à escravidão<\/strong> — jornada exaustiva, retenção de documentos, servidão por dívida, como nas oficinas de costura. A equipe <strong>notifica a violência<\/strong> (a notificação independe da situação migratória) e aciona a rede: Ministério Público do Trabalho, fiscalização do trabalho, Disque 100, assistência social, Defensoria Pública da União.<\/p>"}]},{"h":"Doenças de importância e vacinação","blocos":[{"html":"<p>O <strong>efeito do migrante saudável<\/strong> desmonta um estereótipo: quem chega costuma ter saúde igual ou melhor que a da população local, e a piora vem depois, com as condições de vida no país de acolhida. O migrante não é \"vetor de doença\"; o risco depende da <strong>origem<\/strong>, do <strong>trajeto<\/strong> e das <strong>condições no Brasil<\/strong>.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Situação<\/th><th>O que lembrar<\/th><\/tr><\/thead><tbody><tr><td><strong>Tuberculose<\/strong><\/td><td>origem de país com alta carga e moradia aglomerada; tosse persistente → investigar<\/td><\/tr><tr><td><strong>Malária<\/strong><\/td><td>febre após passagem recente por área de transmissão (Amazônia, garimpos do sul da Venezuela) → <strong>gota espessa no mesmo dia<\/strong><\/td><\/tr><tr><td><strong>Doença de Chagas<\/strong><\/td><td>origem de área endêmica (Bolívia); <strong>testar mulheres em idade fértil e gestantes<\/strong> pela transmissão vertical<\/td><\/tr><tr><td><strong>HIV, sífilis, hepatites<\/strong><\/td><td>oferta de testagem e prevenção combinada<\/td><\/tr><tr><td><strong>Parasitoses, estrongiloidíase<\/strong><\/td><td>lembrar antes de corticoide ou imunossupressão<\/td><\/tr><tr><td><strong>Doenças crônicas<\/strong><\/td><td>hipertensão e diabetes sem acompanhamento, pré-natal tardio<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p><strong>Vacinação:<\/strong> sem comprovante, a dose não vale — a pessoa é considerada <strong>não vacinada<\/strong> e o calendário é iniciado ou completado conforme a idade, sem exigir documento. O surto de <strong>sarampo de 2018<\/strong>, iniciado em Roraima e no Amazonas com casos importados, encontrou coberturas abaixo da meta e fez o Brasil <strong>perder em 2019 a certificação de país livre do sarampo<\/strong>. A lição é cobertura vacinal de toda a população, não fechamento de fronteira.<\/p>"}]},{"h":"Abordagem culturalmente sensível na APS","blocos":[{"html":"<p>A competência cultural não é decorar costumes de cada povo; é <strong>perguntar<\/strong>. O método clínico centrado na pessoa se aplica à diferença cultural explorando o <strong>modelo explicativo<\/strong>: o que a pessoa acha que tem, por que aconteceu, o que teme, o que já fez. Práticas tradicionais que não fazem mal são respeitadas; o plano é <strong>negociado<\/strong>, o que melhora a adesão.<\/p>"},{"html":"<p>Na equipe de Saúde da Família, isso se traduz em <strong>cadastro e territorialização<\/strong> que enxerguem os migrantes, <strong>ACS e mediadores<\/strong> da própria comunidade, horários flexíveis, materiais em outras línguas, abordagem familiar e articulação <strong>intersetorial<\/strong> (assistência social, educação, Defensoria Pública da União, organizações de apoio a migrantes e refugiados).<\/p>"}]}]},{"slug":"pessoa-com-deficiencia","titulo":"Saúde da Pessoa com Deficiência","disciplina":"MFC","eyebrow":"Medicina de Família e Comunidade · Referência","questoes":[{"id":"3b69756a73","q":"Uma cadeirante não consegue fazer o preventivo na UBS porque a maca ginecológica é fixa e alta e o banheiro não comporta a cadeira. Pelo modelo social da deficiência, o problema central está:","opts":["nas barreiras do serviço, que não se adaptou à usuária","na lesão medular da usuária, que precisa ser reabilitada","na falta de um acompanhante que a ajude a subir na maca","na escolha da usuária de não procurar serviço especializado"],"c":0,"exp":"O modelo biomédico localiza a deficiência no corpo, como lesão a ser curada ou corrigida. O modelo social, nascido do movimento das pessoas com deficiência, desloca o problema para as barreiras que a sociedade impõe — aqui, maca e banheiro inacessíveis. A Convenção da ONU e a LBI adotam essa visão, combinada no modelo biopsicossocial.","ref":[1,1]},{"id":"f4b7d00fc2","q":"Pela Lei Brasileira de Inclusão (Lei nº 13.146/2015), pessoa com deficiência é aquela que tem impedimento de longo prazo, de natureza física, mental, intelectual ou sensorial, que:","opts":["em interação com barreiras, pode obstruir sua participação plena na sociedade","seja comprovado por laudo médico com CID e grau de incapacidade para o trabalho","a torne incapaz para os atos da vida civil, exigindo curatela permanente","esteja presente desde o nascimento e seja considerado irreversível"],"c":0,"exp":"A definição da LBI, a mesma da Convenção da ONU, diz que a deficiência resulta da interação entre o impedimento de longo prazo e as barreiras, e não do impedimento sozinho. Por isso, quando necessária, a avaliação é biopsicossocial, por equipe multiprofissional, considerando funções do corpo, fatores ambientais e pessoais, atividades e participação.","ref":[1,3]},{"id":"64894f6ca1","q":"A Convenção da ONU sobre os Direitos das Pessoas com Deficiência (2006) tem, no ordenamento jurídico brasileiro, status equivalente a:","opts":["Emenda constitucional","Lei ordinária federal","Simples recomendação","Norma infralegal comum"],"c":0,"exp":"A Convenção e seu Protocolo Facultativo foram aprovados pelo rito do art. 5º, § 3º, da Constituição (Decreto Legislativo nº 186/2008, promulgados pelo Decreto nº 6.949/2009) e equivalem a emenda constitucional — o primeiro tratado de direitos humanos com esse status no Brasil.","ref":[2,0]},{"id":"d65cb32749","q":"Qual a terminologia adequada, adotada pela Convenção da ONU e pela LBI?","opts":["Pessoa com deficiência","Portador de deficiência","Pessoa excepcional","Pessoa incapacitada"],"c":0,"exp":"\"Pessoa com deficiência\" põe a pessoa antes da condição e não sugere que a deficiência seja algo que se \"porta\" e se pode largar. \"Portador\", \"excepcional\", \"incapacitado\" e \"pessoa com necessidades especiais\" são termos superados.","ref":[1,4]},{"id":"1096f7dd52","q":"Na consulta de um homem surdo que veio acompanhado da irmã, o médico dirige todas as perguntas à irmã e não olha para o paciente. Pela LBI, essa conduta é exemplo de:","opts":["Barreira atitudinal","Barreira tecnológica","Barreira urbanística","Barreira arquitetônica"],"c":0,"exp":"A LBI lista seis tipos de barreira: urbanísticas, arquitetônicas, nos transportes, nas comunicações e na informação, atitudinais e tecnológicas. Atitudinal é o comportamento que impede ou prejudica a participação em igualdade — como tratar o paciente surdo como se não estivesse ali. Também falha a comunicação: ele tem direito a atendimento em Libras.","ref":[2,2]},{"id":"303761158b","q":"O profissional não pergunta sobre vida sexual e contracepção a uma mulher de 25 anos com paralisia cerebral, por presumir que ela não tem vida sexual. Essa atitude é um exemplo de:","opts":["Capacitismo, que presume incapacidade pela deficiência","Prevenção quaternária, que evita intervenções desnecessárias","Respeito à privacidade, pois o tema não foi trazido por ela","Ofuscamento diagnóstico, que atribui tudo à deficiência"],"c":0,"exp":"Capacitismo é o preconceito que presume que a pessoa com deficiência é incapaz, inferior ou assexuada. A LBI garante que a deficiência não afeta a capacidade civil, inclusive para exercer direitos sexuais e reprodutivos e acessar planejamento familiar. Omitir saúde sexual nega cuidado e aumenta a vulnerabilidade a IST, gravidez não planejada e violência.","ref":[3,0]},{"id":"b5e61489a7","q":"A mãe de uma jovem de 19 anos com deficiência intelectual leve pede à equipe que \"providencie a laqueadura\" da filha, que namora e diz querer ter filhos um dia. Qual a orientação correta?","opts":["A decisão é da jovem: a lei veda a esterilização sem o seu consentimento","A mãe pode autorizar a laqueadura, pois responde legalmente pela filha","A laqueadura é indicada sempre que houver deficiência intelectual","Basta um laudo psiquiátrico para a mãe autorizar a laqueadura"],"c":0,"exp":"Pela LBI, a deficiência não afeta a plena capacidade civil, inclusive para decidir sobre o número de filhos e conservar a fertilidade, sendo vedada a esterilização compulsória. A equipe oferece à jovem informação acessível sobre contracepção e planejamento reprodutivo, com o apoio que ela escolher, e conversa com a família.","ref":[3,0]},{"id":"e2878fdec4","q":"Homem de 35 anos com deficiência intelectual quer ajuda para decisões sobre tratamentos e finanças, sem perder o direito de decidir. Ele indica duas pessoas de sua confiança para apoiá-lo, com homologação judicial. Esse instrumento é a:","opts":["Tomada de decisão apoiada","Curatela compartilhada","Interdição civil parcial","Mandato de representação"],"c":0,"exp":"Na tomada de decisão apoiada (Código Civil, art. 1.783-A, incluído pela LBI), a própria pessoa com deficiência escolhe pelo menos duas pessoas idôneas e de sua confiança para lhe dar informação e apoio em decisões da vida civil. Ela mantém a capacidade e a palavra final; os apoiadores não decidem por ela, ao contrário do curador.","ref":[3,1]},{"id":"42417f98b8","q":"Após a LBI, a curatela da pessoa com deficiência passou a ser medida extraordinária, proporcional e restrita a:","opts":["atos de natureza patrimonial e negocial","decisões sobre o próprio corpo e a saúde","casamento, união estável e vida sexual","direito ao voto e participação política"],"c":0,"exp":"A curatela, quando necessária, afeta apenas atos patrimoniais e negociais e não alcança o direito ao próprio corpo, à sexualidade, ao matrimônio, à privacidade, à educação, à saúde, ao trabalho e ao voto. Com a LBI, a pessoa com deficiência deixou de ser considerada absolutamente incapaz.","ref":[3,2]},{"id":"b20c148905","q":"Pela LBI, a pessoa com deficiência pode ser submetida a tratamento ou procedimento sem seu consentimento prévio, livre e esclarecido apenas quando:","opts":["houver risco de morte ou emergência em saúde","a família autorizar por escrito o procedimento","a equipe julgar que ela não entende a explicação","estiver sob tomada de decisão apoiada vigente"],"c":0,"exp":"O consentimento prévio, livre e esclarecido é indispensável para tratamento, procedimento, hospitalização e pesquisa, com informação em formato acessível. A exceção é risco de morte ou emergência em saúde, resguardado o superior interesse da pessoa. Mesmo sob curatela, ela participa da decisão na maior medida possível.","ref":[3,3]},{"id":"41701cf033","q":"Na Rede de Cuidados à Pessoa com Deficiência (RCPD), instituída em 2012, um Centro Especializado em Reabilitação tipo III (CER III) é aquele que:","opts":["atende três das quatro modalidades de reabilitação","é o terceiro nível da rede, acima do hospital geral","atende pessoas com três ou mais deficiências associadas","funciona 24 horas, inclusive com leitos de internação"],"c":0,"exp":"Os CER se classificam pelo número de modalidades de reabilitação que oferecem, entre quatro — auditiva, física, intelectual e visual: CER II (duas), CER III (três) e CER IV (quatro). A RCPD (Portaria GM/MS nº 793/2012) articula atenção primária, atenção especializada em reabilitação (CER, oficinas ortopédicas, CEO) e atenção hospitalar e de urgência.","ref":[4,2]},{"id":"9c62175e62","q":"Sobre o papel da equipe de Saúde da Família no cuidado da pessoa com deficiência, é correto afirmar que ela:","opts":["segue responsável pelo cuidado integral, mesmo com o CER acompanhando","deixa de acompanhar a pessoa depois que ela é vinculada a um CER","cuida apenas de demandas ligadas diretamente à deficiência","dispensa rastreamentos e vacinas, já feitos pela reabilitação"],"c":0,"exp":"A APS é porta de entrada e coordenadora do cuidado: identifica precocemente, acompanha de forma longitudinal, faz visita domiciliar, apoia o cuidador e articula com o CER e a eMulti. Pessoas com deficiência precisam de todo o cuidado habitual — rastreamentos, vacinas, pré-natal, saúde sexual —, que costuma ser negligenciado.","ref":[4,3]},{"id":"0f108c84db","q":"Homem de 40 anos com deficiência intelectual, que se comunica pouco verbalmente, passou a ficar agitado e a bater a mão no rosto há uma semana. O cuidador acha que \"é da deficiência\". O primeiro passo é:","opts":["Investigar causa clínica, como dor dentária, otite ou constipação","Iniciar antipsicótico para controlar o comportamento agressivo","Encaminhar ao CAPS como transtorno de conduta associado","Orientar o cuidador de que é comportamento esperado na condição"],"c":0,"exp":"Atribuir um sintoma novo à deficiência sem investigar é o ofuscamento diagnóstico. Em quem tem dificuldade de comunicação, mudança de comportamento costuma ser a forma de expressar dor ou doença: dor dentária, otite, constipação, infecção urinária, efeito de medicamento. Antipsicótico para \"comportamento\" sem investigar é erro comum.","ref":[6,1]},{"id":"5dcf808f63","q":"Sobre a triagem auditiva neonatal (teste da orelhinha), é correto afirmar que:","opts":["é obrigatória por lei e deve ser feita de preferência antes da alta","só é indicada para recém-nascidos com fator de risco para surdez","deve ser feita aos 2 anos, quando a criança já fala as primeiras palavras","o resultado normal dispensa vigilância da audição e da linguagem"],"c":0,"exp":"A triagem auditiva neonatal é universal e obrigatória (Lei nº 12.303/2010), feita de preferência antes da alta e no primeiro mês de vida, com emissões otoacústicas ou PEATE automático (preferido quando há fator de risco). A meta é diagnosticar a perda até os 3 meses e intervir até os 6. Mesmo com teste normal, a vigilância da linguagem continua.","ref":[5,1]},{"id":"4e42ed27d5","q":"Lactente de 8 meses tem atraso no desenvolvimento motor identificado na consulta de puericultura. Sobre a estimulação precoce, é correto afirmar que:","opts":["deve começar logo, aproveitando a maior plasticidade cerebral até os 3 anos","só deve começar após o diagnóstico etiológico definitivo do atraso","é indicada apenas para crianças com síndrome genética confirmada","deve esperar a idade escolar, quando a criança colabora com a terapia"],"c":0,"exp":"A estimulação precoce, de 0 a 3 anos, aproveita a janela de maior neuroplasticidade e não espera o diagnóstico etiológico: começa diante do atraso. O Ministério da Saúde publicou diretrizes de estimulação precoce em 2016, após a epidemia de Zika. A APS identifica pela vigilância do desenvolvimento na Caderneta da Criança, orienta a família e encaminha à reabilitação.","ref":[5,2]},{"id":"e4bb76b6da","q":"Sobre a detecção precoce do transtorno do espectro autista (TEA) no SUS, é correto afirmar que:","opts":["é obrigatório aplicar instrumento de risco psíquico nos primeiros 18 meses","o rastreamento só deve ser feito a partir dos 6 anos, na idade escolar","o TEA não é considerado deficiência para nenhum efeito legal no Brasil","o diagnóstico exige ressonância de crânio e eletroencefalograma alterados"],"c":0,"exp":"A Lei nº 13.438/2017 tornou obrigatória, nos primeiros 18 meses, a aplicação de protocolo para detectar risco ao desenvolvimento psíquico; o M-CHAT-R/F é usado entre 16 e 30 meses. Pela Lei Berenice Piana (Lei nº 12.764/2012), a pessoa com TEA é considerada pessoa com deficiência para todos os efeitos legais. O diagnóstico é clínico.","ref":[5,3]},{"id":"3faa695de9","q":"Mulher de 28 anos com deficiência intelectual tem lesões suspeitas de violência sexual. Além do cuidado clínico, a LBI determina que o serviço de saúde:","opts":["notifique compulsoriamente a suspeita ou confirmação de violência","notifique apenas se houver confirmação por exame de corpo de delito","aguarde autorização da família para comunicar o caso às autoridades","encaminhe o caso à justiça somente se a vítima for menor de idade"],"c":0,"exp":"Pela LBI (art. 26), a suspeita ou a confirmação de violência contra a pessoa com deficiência é de notificação compulsória pelos serviços de saúde públicos e privados, com comunicação à autoridade policial, ao Ministério Público e aos conselhos de direitos. Mulheres com deficiência, sobretudo intelectual, têm risco muito maior de violência sexual.","ref":[6,2]},{"id":"5bb64d9c44","q":"Uma usuária surda, que se comunica em Libras, procura a UBS. Sobre a comunicação no atendimento, é correto afirmar que:","opts":["Libras é meio legal de comunicação e o SUS deve garantir o atendimento nela","a leitura labial resolve, pois toda pessoa surda é capaz de usá-la","a comunicação escrita em português basta, pois a Libras não tem gramática","a usuária deve trazer intérprete particular, pago por ela, à consulta"],"c":0,"exp":"A Lei nº 10.436/2002 reconheceu a Libras como meio legal de comunicação e expressão, e o Decreto nº 5.626/2005 determina que o SUS garanta atendimento por profissionais capacitados em Libras ou por intérpretes. Libras é língua com gramática própria; muitos surdos têm o português escrito como segunda língua, e a leitura labial é limitada.","ref":[6,0]}],"resumo":[{"h":"","blocos":[{"html":"<blockquote><p>Material de referência: não há slide da aula deste tema. Baseado na Convenção da ONU sobre os Direitos das Pessoas com Deficiência (2006), na Lei Brasileira de Inclusão (Lei nº 13.146/2015), na Portaria GM/MS nº 793/2012 (RCPD) e em publicações do Ministério da Saúde.<\/p><\/blockquote>"}]},{"h":"Do modelo biomédico ao modelo social","blocos":[{"html":"<p>A forma de entender a deficiência mudou, e com ela o papel do profissional de saúde.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th><\/th><th>Modelo biomédico<\/th><th>Modelo social<\/th><\/tr><\/thead><tbody><tr><td>Onde está o problema<\/td><td>no corpo da pessoa (lesão, doença)<\/td><td>nas <strong>barreiras<\/strong> que a sociedade impõe<\/td><\/tr><tr><td>Resposta<\/td><td>curar, corrigir, normalizar<\/td><td>remover barreiras, garantir direitos<\/td><\/tr><tr><td>Quem decide<\/td><td>o profissional<\/td><td>a pessoa — \"<strong>nada sobre nós sem nós<\/strong>\"<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>O modelo social nasceu do próprio movimento das pessoas com deficiência, no Reino Unido dos anos 1970. A OMS o integrou ao biomédico na <strong>CIF (Classificação Internacional de Funcionalidade, Incapacidade e Saúde, 2001)<\/strong>, o <strong>modelo biopsicossocial<\/strong>: funções e estruturas do corpo, atividades, participação e fatores ambientais e pessoais.<\/p>"},{"html":"<p>A <strong>Convenção da ONU<\/strong> e a <strong>LBI<\/strong> adotam a mesma definição: pessoa com deficiência é a que tem <strong>impedimento de longo prazo<\/strong> de natureza física, mental, intelectual ou sensorial que, <strong>em interação com uma ou mais barreiras<\/strong>, pode obstruir sua participação plena e efetiva na sociedade em igualdade de condições. A deficiência está na interação, não só no impedimento. Quando necessária, a avaliação é <strong>biopsicossocial, por equipe multiprofissional e interdisciplinar<\/strong>.<\/p>"},{"html":"<blockquote><p><strong>Terminologia:<\/strong> o termo correto é <strong>\"pessoa com deficiência\"<\/strong>. \"Portador de deficiência\", \"deficiente\", \"excepcional\" e \"pessoa com necessidades especiais\" são superados.<\/p><\/blockquote>"}]},{"h":"O marco legal: Convenção da ONU e LBI","blocos":[{"html":"<p>A <strong>Convenção sobre os Direitos das Pessoas com Deficiência (ONU, 2006)<\/strong> foi aprovada no Brasil pelo rito do art. 5º, § 3º, da Constituição e tem <strong>status de emenda constitucional<\/strong> — o primeiro tratado de direitos humanos com esse peso no país.<\/p>"},{"html":"<p>A <strong>Lei Brasileira de Inclusão (Lei nº 13.146/2015)<\/strong>, também chamada <strong>Estatuto da Pessoa com Deficiência<\/strong>, regulamenta a Convenção. Pontos de prova:<\/p>"},{"html":"<ul><li><strong>Seis tipos de barreira:<\/strong> urbanísticas, arquitetônicas, nos transportes, nas comunicações e na informação, <strong>atitudinais<\/strong> e tecnológicas.<\/li><li><strong>Discriminação<\/strong> inclui a recusa de <strong>adaptação razoável<\/strong> e de <strong>tecnologia assistiva<\/strong>; discriminar pessoa em razão da deficiência é crime.<\/li><li><strong>Atendimento prioritário<\/strong> e direito à <strong>acessibilidade<\/strong>, com desenho universal.<\/li><\/ul>"},{"html":"<p><strong>Capacitismo<\/strong> é o preconceito que presume que a pessoa com deficiência é incapaz, inferior, dependente ou assexuada. Na clínica aparece de formas sutis: falar com o acompanhante em vez do paciente, decidir por ele, não perguntar sobre sexualidade, não oferecer rastreamentos.<\/p>"}]},{"h":"Autonomia: capacidade civil, decisão apoiada e curatela","blocos":[{"html":"<p>A LBI afirma que <strong>a deficiência não afeta a plena capacidade civil<\/strong>, inclusive para casar e constituir união estável, <strong>exercer direitos sexuais e reprodutivos<\/strong>, decidir sobre o número de filhos, <strong>conservar a fertilidade — vedada a esterilização compulsória<\/strong> — e exercer guarda, tutela e adoção. Desde a LBI, a pessoa com deficiência <strong>não é mais considerada absolutamente incapaz<\/strong>.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th><\/th><th>Tomada de decisão apoiada<\/th><th>Curatela<\/th><\/tr><\/thead><tbody><tr><td>Quem pede<\/td><td>a <strong>própria pessoa<\/strong><\/td><td>familiar ou Ministério Público<\/td><\/tr><tr><td>Como funciona<\/td><td>ela escolhe <strong>pelo menos 2 apoiadores<\/strong> de confiança, homologados pelo juiz<\/td><td>o juiz nomeia um curador<\/td><\/tr><tr><td>Capacidade<\/td><td><strong>mantida<\/strong> — a palavra final é dela<\/td><td>limitada, de forma proporcional<\/td><\/tr><tr><td>Alcance<\/td><td>decisões da vida civil que ela definir<\/td><td><strong>só atos patrimoniais e negociais<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<blockquote><p><strong>Pegadinha.<\/strong> A curatela, quando existe, é <strong>extraordinária e proporcional<\/strong>, e <strong>não alcança<\/strong> o direito ao próprio corpo, à sexualidade, ao matrimônio, à privacidade, à educação,
