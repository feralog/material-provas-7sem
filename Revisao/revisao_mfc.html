  h += '<button class="btn ghost" data-act="revisao"' + (F.length ? '' : ' disabled') + '>' +
       (F.length ? 'Revisar erros e dúvidas (' + F.length + ')' : 'Fila de revisão vazia') + '</button>';
  h += '</div>';

  if (F.length) {
    h += '<p class="hint">Uma questão só sai da fila com <b>dois acertos seguidos sem marcar dúvida</b>.</p>';
  } else if (g.vistas) {
    h += '<div class="note calm" style="margin-top:12px">Fila limpa. Todo erro já foi recuperado com dois acertos confiantes.</div>';
  }

  h += '<h3>Treinar um tema</h3>';
  h += '<div class="temas">';
  DADOS.temas.forEach(function (t) {
    var s = statsTema(t);
    h += '<button class="tema" data-act="treino" data-slug="' + esc(t.slug) + '">';
    h += '<span class="tt"><b>' + esc(t.titulo) + '</b>' +
         '<span>' + esc(t.disciplina) + ' · ' + s.vistas + '/' + s.total + ' vistas</span></span>';
    if (s.fila) h += '<span class="badge">' + s.fila + ' na fila</span>';
    h += '<span class="mini">' + segBar(s) + '</span>';
    h += '</button>';
  });
  h += '</div>';

  var comResumo = DADOS.temas.filter(function (t) { return t.resumo; });
  if (comResumo.length) {
    h += '<h3>Resumos para consulta</h3><div class="chips">';
    comResumo.forEach(function (t) {
      h += '<button class="chip" data-act="resumo" data-slug="' + esc(t.slug) + '">' +
           esc(t.titulo) + '</button>';
    });
    h += '</div>';
  }

  h += '<div class="foot">' + esc(DADOS.rodape) +
       '<br>' + ALL.length + ' questões · ' + DADOS.temas.length + ' temas · progresso salvo neste navegador' +
       '<br><a href="#" data-act="reset">Apagar meu progresso</a></div>';
  return h;
}

function telaSetup() {
  var sel = DADOS.temas.filter(function (t) { return S.pick[t.slug]; });
  var disp = sel.reduce(function (n, t) { return n + t.questoes.length; }, 0);
  var h = '';
  h += '<p class="eyebrow">Monte seu treino</p>';
  h += '<h1>Simulado individual</h1>';
  h += '<p class="lede">Responde tudo sem ver gabarito, com tempo correndo. A correção comentada vem só no fim — como na prova.</p>';

  h += '<div class="card">';
  h += '<p class="eyebrow" style="margin-bottom:10px">1 · Escolha os temas</p>';
  h += '<div class="row" style="margin:0 0 11px">' +
       '<button class="btn ghost" data-act="alltemas" style="padding:8px 14px;font-size:13px">Marcar todos</button>' +
       '<button class="btn ghost" data-act="notemas" style="padding:8px 14px;font-size:13px">Limpar</button>' +
       (F.length ? '<button class="btn ghost" data-act="pickfila" style="padding:8px 14px;font-size:13px">Só a fila (' + F.length + ')</button>' : '') +
       '</div>';
  DADOS.temas.forEach(function (t) {
    var on = !!S.pick[t.slug];
    h += '<button class="chk' + (on ? ' on' : '') + '" data-act="toggle" data-slug="' + esc(t.slug) + '">' +
         '<span class="bx">' + (on ? '&#10003;' : '') + '</span>' +
         '<span>' + esc(t.titulo) + '</span>' +
         '<span class="n">' + t.questoes.length + '</span></button>';
  });
  h += '</div>';

  h += '<div class="card">';
  h += '<p class="eyebrow" style="margin-bottom:10px">2 · Tamanho e tempo</p>';
  h += '<div class="fld"><label for="bloco">Quantas questões</label>' +
       '<input id="bloco" type="number" min="1" max="' + Math.max(disp, 1) + '" value="' + S.bloco + '"></div>';
  h += '<div class="fld"><label for="minutos">Minutos (0 = sem cronômetro)</label>' +
       '<input id="minutos" type="number" min="0" max="300" value="' + S.minutos + '"></div>';
  h += '<p class="hint">Disponível: <b>' + disp + '</b> ' + (disp === 1 ? 'questão' : 'questões') +
       ' em ' + plural(sel.length, 'tema', 'temas') + '. As questões vêm embaralhadas.</p>';
  h += '</div>';

  h += '<div class="row">';
  h += '<button class="btn" data-act="simstart"' + (disp ? '' : ' disabled') + '>Começar simulado</button>';
  h += '<button class="btn ghost" data-act="home">Voltar</button>';
  h += '</div>';
  return h;
}

function telaRodada() {
  var r = S.round, q = r.qs[r.i], sim = r.mode === 'simulado';
  var a = r.ans[q.id] || {};
  var respondida = a.sel != null;
  var revela = !sim && respondida;
  var h = '';

  h += '<div class="meta">';
  h += '<span>' + esc(r.titulo) + ' · ' + (r.i + 1) + '/' + r.qs.length + '</span>';
  h += sim && r.endsAt ? '<span class="timer" id="clock">' + mmss(r.endsAt - Date.now()) + '</span>'
                       : '<span>' + esc(q.temaT) + '</span>';
  h += '</div>';

  h += '<div class="card">';
  h += '<p class="q">' + esc(q.q) + '</p>';

  // portão de confiança — antes de responder
  if (!respondida) {
    h += '<div class="conf"><p>Antes de responder: qual é a sua confiança?</p><div class="row">' +
         '<button class="btn' + (r.conf === 'sure' ? ' on' : '') + '" data-act="conf" data-v="sure">Tenho certeza</button>' +
         '<button class="btn' + (r.conf === 'unsure' ? ' on' : '') + '" data-act="conf" data-v="unsure">Estou em dúvida</button>' +
         '</div></div>';
  }

  q.opts.forEach(function (o, i) {
    var cls = 'opt';
    if (revela) {
      if (i === q.c) cls += ' ok';
      else if (i === a.sel) cls += ' bad';
    } else if (a.sel === i) cls += ' sel';
    h += '<button class="' + cls + '" data-act="opt" data-i="' + i + '"' + (revela ? ' disabled' : '') + '>' +
         '<span class="k">' + 'ABCDE'[i] + '</span><span>' + esc(o) + '</span></button>';
  });

  if (revela) {
    var ok = a.sel === q.c;
    var tit = ok ? (a.conf === 'unsure' ? 'Acerto com dúvida — volta para a fila' : 'Correto. Agora explique o porquê.')
                 : (a.conf === 'unsure' ? 'Erro, e você já desconfiava' : 'Erro com certeza — revise o raciocínio');
    h += '<div class="exp ' + (ok ? 'good' : 'bad') + '"><b>' + esc(tit) + '</b>' + esc(q.exp) + '</div>';
    h += botaoFonte(q);
  }
  h += '</div>';

  // navegação
  h += '<div class="row">';
  if (sim) {
    h += '<button class="btn ghost" data-act="prev"' + (r.i ? '' : ' disabled') + '>Anterior</button>';
    if (r.i < r.qs.length - 1) h += '<button class="btn" data-act="next">Próxima</button>';
    else h += '<button class="btn" data-act="corrigir">Corrigir simulado</button>';
  } else {
    if (revela) {
      if (r.i < r.qs.length - 1) h += '<button class="btn" data-act="next">Próxima questão</button>';
      else h += '<button class="btn" data-act="corrigir">Ver resultado</button>';
    }
    h += '<button class="btn ghost" data-act="home">Sair e salvar</button>';
  }
  h += '</div>';

  if (sim) {
    var resp = r.qs.filter(function (x) { return r.ans[x.id] != null; }).length;
    h += '<h3>' + resp + ' de ' + r.qs.length + ' respondidas</h3>';
    h += '<div class="grid">';
    r.qs.forEach(function (x, i) {
      var c = 'gq' + (r.ans[x.id] != null ? ' done' : '') + (i === r.i ? ' now' : '');
      h += '<button class="' + c + '" data-act="goto" data-i="' + i + '">' + (i + 1) + '</button>';
    });
    h += '</div>';
    h += '<div class="row" style="margin-top:14px">' +
         '<button class="btn ghost" data-act="corrigir">Corrigir agora</button></div>';
  }
  return h;
}

function telaResultado() {
  var r = S.round;
  var certas = r.qs.filter(function (q) { var a = r.ans[q.id] || {}; return a.sel === q.c; }).length;
  var pct = Math.round(certas / r.qs.length * 100);
  var duvida = r.qs.filter(function (q) { var a = r.ans[q.id] || {}; return a.conf === 'unsure'; }).length;
  var brancos = r.qs.filter(function (q) { return (r.ans[q.id] || {}).sel == null; }).length;

  var titulo, msg;
  if (pct >= 90) { titulo = 'Domínio sólido'; msg = 'Confira as que escaparam e siga para outro tema.'; }
  else if (pct >= 70) { titulo = 'Quase lá'; msg = 'A base está firme. O que caiu na fila é o que decide a prova.'; }
  else if (pct >= 50) { titulo = 'Meio do caminho'; msg = 'Releia a fonte dos erros antes de repetir o bloco.'; }
  else { titulo = 'Precisa revisar'; msg = 'Volte ao material deste tema antes de tentar de novo.'; }

  var h = '';
  h += '<p class="eyebrow">' + (r.mode === 'simulado' ? 'Simulado concluído' : 'Bloco concluído') + ' · ' + esc(r.titulo) + '</p>';
  h += '<h1>' + titulo + '</h1>';
  h += '<p class="lede">' + msg + '</p>';

  h += '<div class="card"><div style="display:flex;align-items:baseline;gap:9px">' +
       '<span style="font-family:var(--mono);font-size:33px;font-weight:600;line-height:1">' + certas + '/' + r.qs.length + '</span>' +
       '<span style="font-size:13px;color:var(--muted)">' + pct + '% nesta rodada</span></div>';
  h += '<div class="stats">';
  h += '<div class="stat"><b>' + duvida + '</b><span>marcadas em dúvida</span></div>';
  h += '<div class="stat"><b>' + brancos + '</b><span>em branco</span></div>';
  h += '<div class="stat"><b>' + F.length + '</b><span>na fila agora</span></div>';
  h += '<div class="stat"><b>' + R + '</b><span>recuperados no total</span></div>';
  h += '</div></div>';

  var fs = [['todas', 'Todas'], ['erros', 'Erros'], ['duvida', 'Em dúvida'], ['branco', 'Em branco']];
  h += '<div class="row" style="margin:0 0 14px">';
  fs.forEach(function (f) {
    h += '<button class="btn ghost' + (S.filtro === f[0] ? ' on' : '') + '" data-act="filtro" data-v="' + f[0] + '"' +
         (S.filtro === f[0] ? ' style="border-color:var(--blue);color:var(--blue);background:var(--bluel)"' : '') +
         ' >' + f[1] + '</button>';
  });
  h += '</div>';

  var lista = r.qs.filter(function (q) {
    var a = r.ans[q.id] || {};
    if (S.filtro === 'erros') return a.sel !== q.c;
    if (S.filtro === 'duvida') return a.conf === 'unsure';
    if (S.filtro === 'branco') return a.sel == null;
    return true;
  });

  h += '<div class="card">';
  if (!lista.length) h += '<div class="empty">Nada nesta categoria.</div>';
  lista.forEach(function (q) {
    var a = r.ans[q.id] || {}, ok = a.sel === q.c;
    h += '<div class="rev">';
    h += '<p class="revl">' + esc(q.temaT) + ' · ' +
         (ok ? 'acerto' : 'erro') + (a.conf === 'unsure' ? ' · marcou dúvida' : '') + '</p>';
    h += '<p class="revq">' + esc(q.q) + '</p>';
    h += '<p class="resp" style="color:' + (ok ? 'var(--green)' : 'var(--red)') + '">Sua resposta: ' +
         (a.sel == null ? '<i>em branco</i>' : esc('ABCDE'[a.sel] + '. ' + q.opts[a.sel])) + '</p>';
    if (!ok) h += '<p class="resp" style="color:var(--green)">Correta: ' + esc('ABCDE'[q.c] + '. ' + q.opts[q.c]) + '</p>';
    h += '<div class="exp ' + (ok ? 'good' : 'bad') + '">' + esc(q.exp) + '</div>';
    h += botaoFonte(q);
    h += '</div>';
  });
  h += '</div>';

  h += '<div class="row">';
  h += '<button class="btn" data-act="home">Voltar ao início</button>';
  if (F.length) h += '<button class="btn ghost" data-act="revisao">Revisar a fila (' + F.length + ')</button>';
  h += '</div>';
  return h;
}

function telaResumo() {
  var r = S.resumo, t = temaPorSlug(r.tema), h = '';
  h += '<div class="meta"><span>Resumo da aula</span><span>' + esc(t.disciplina) + '</span></div>';
  h += '<h1>' + esc(t.titulo) + '</h1>';
  h += '<div class="row" style="margin:0 0 20px">' +
       '<button class="btn" data-act="voltar">' + esc(S.voltarLabel) + '</button></div>';

  if (!t.resumo) {
    h += '<div class="empty">Este tema não tem resumo anexado.<br>' +
         'Gere a página com o <code>resumo_' + esc(t.slug) + '.md</code> presente.</div>';
    return h;
  }

  if (r.sec != null) {
    h += '<div class="note">O trecho destacado é o que sustenta a questão. ' +
         'O resumo inteiro do tema está aqui embaixo.</div>';
  }

  h += '<div class="card resumo">';
  t.resumo.forEach(function (s, si) {
    if (s.h) h += '<h2>' + esc(s.h) + '</h2>';
    s.blocos.forEach(function (b, bi) {
      h += (r.sec === si && r.blk === bi)
        ? '<div class="alvo" id="alvo">' + b.html + '</div>'
        : b.html;
    });
  });
  h += '</div>';

  var outros = DADOS.temas.filter(function (x) { return x.resumo; });
  if (outros.length > 1) {
    h += '<h3>Outros resumos</h3><div class="chips">';
    outros.forEach(function (x) {
      h += '<button class="chip' + (x.slug === r.tema ? ' on' : '') +
           '" data-act="resumo" data-slug="' + esc(x.slug) + '">' + esc(x.titulo) + '</button>';
    });
    h += '</div>';
  }
  return h;
}

/* =========================================================================
   EVENTOS — delegação única
   ========================================================================= */
app.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act'), r = S.round;
  ev.preventDefault();

  if (act === 'resumo') {
    var sec = el.getAttribute('data-sec'), blk = el.getAttribute('data-blk');
    if (S.view !== 'resumo') {
      S.voltar = S.view;
      S.voltarLabel = S.view === 'rodada' ? 'Voltar à questão'
                    : S.view === 'resultado' ? 'Voltar ao resultado' : 'Voltar ao início';
    }
    S.resumo = { tema: el.getAttribute('data-slug'),
                 sec: sec == null ? null : +sec, blk: blk == null ? null : +blk };
    S.view = 'resumo';
    return render();
  }
  if (act === 'voltar') { S.view = S.voltar || 'home'; return render(); }

  if (act === 'home') { pararRelogio(); S.round = null; S.view = 'home'; limparEndereco(); return render(); }
  if (act === 'setup') { S.view = 'setup'; return render(); }
  if (act === 'treino') { treinoTema(el.getAttribute('data-slug')); return render(); }
  if (act === 'revisao') { rodadaRevisao(); return render(); }

  if (act === 'toggle') {
    var s = el.getAttribute('data-slug');
    lerCampos(); S.pick[s] = !S.pick[s]; return render();
  }
  if (act === 'alltemas') { lerCampos(); DADOS.temas.forEach(function (t) { S.pick[t.slug] = true; }); return render(); }
  if (act === 'notemas') { lerCampos(); S.pick = {}; return render(); }
  if (act === 'pickfila') {
    lerCampos(); S.pick = {};
    F.forEach(function (id) { if (BY[id]) S.pick[BY[id].tema] = true; });
    return render();
  }
  if (act === 'simstart') {
    lerCampos();
    var pool = [];
    DADOS.temas.forEach(function (t) {
      if (S.pick[t.slug]) t.questoes.forEach(function (q) { pool.push(BY[q.id]); });
    });
    if (!pool.length) return;
    var n = Math.max(1, Math.min(S.bloco, pool.length));
    novaRodada('simulado', embaralhar(pool).slice(0, n), 'Simulado', S.minutos);
    return render();
  }

  if (act === 'conf') { r.conf = el.getAttribute('data-v'); return render(); }

  if (act === 'opt') {
    var q = r.qs[r.i], i = +el.getAttribute('data-i');
    if (r.ans[q.id] != null && r.mode !== 'simulado') return;
    r.ans[q.id] = { sel: i, conf: r.conf || 'sure' };
    if (r.mode !== 'simulado') registrar([{ q: q, sel: i, conf: r.conf || 'sure' }]);
    r.conf = null;
    return render();
  }

  if (act === 'next') { if (r.i < r.qs.length - 1) { r.i++; r.conf = null; } return render(); }
  if (act === 'prev') { if (r.i > 0) { r.i--; r.conf = null; } return render(); }
  if (act === 'goto') { r.i = +el.getAttribute('data-i'); r.conf = null; return render(); }

  if (act === 'corrigir') {
    if (r.mode === 'simulado') return corrigirSimulado(false);
    pararRelogio(); S.filtro = 'todas'; S.view = 'resultado'; return render();
  }
  if (act === 'filtro') { S.filtro = el.getAttribute('data-v'); return render(); }

  if (act === 'reset') {
    if (!confirm('Apagar todo o progresso salvo neste navegador?')) return;
    H = {}; F = []; R = 0; save(K.h, H); save(K.f, F); save(K.r, R);
    return render();
  }
});

// guarda o que está digitado nos campos antes de um re-render
function lerCampos() {
  var b = document.getElementById('bloco'), m = document.getElementById('minutos');
  if (b) S.bloco = Math.max(1, +b.value || 1);
  if (m) S.minutos = Math.max(0, +m.value || 0);
}

// atalhos de teclado
document.addEventListener('keydown', function (ev) {
  if (S.view !== 'rodada' || !S.round) return;
  var r = S.round, q = r.qs[r.i];
  if (ev.key === 'ArrowRight' && r.i < r.qs.length - 1) { r.i++; r.conf = null; render(); }
  else if (ev.key === 'ArrowLeft' && r.i > 0) { r.i--; r.conf = null; render(); }
  else if (/^[1-5a-eA-E]$/.test(ev.key)) {
    var i = /[1-5]/.test(ev.key) ? +ev.key - 1 : 'abcde'.indexOf(ev.key.toLowerCase());
    if (i < 0 || i >= q.opts.length) return;
    if (r.ans[q.id] != null && r.mode !== 'simulado') return;
    r.ans[q.id] = { sel: i, conf: r.conf || 'sure' };
    if (r.mode !== 'simulado') registrar([{ q: q, sel: i, conf: r.conf || 'sure' }]);
    r.conf = null; render();
  }
});

/* ---------- link direto (vindo do plano de estudo) ----------
   #treino=<slug>[&n=20]              treino do tema (n = só as n primeiras, nunca vistas antes)
   #simulado=<slug>,<slug>[&n=40&min=45]  abre a montagem do simulado já marcada
   #revisao                           abre a fila de revisão                       */
function lerEndereco() {
  var h = (typeof location !== 'undefined' && location.hash) ? location.hash.replace(/^#/, '') : '';
  var p = {};
  if (!h) return p;
  h.split('&').forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf('=');
    try {
      p[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1));
    } catch (e) {}
  });
  return p;
}
function abrirPorEndereco() {
  var p = lerEndereco();
  if (p.treino) {
    if (!temaPorSlug(p.treino)) return false;
    treinoTema(p.treino, Math.max(0, parseInt(p.n, 10) || 0));
    return true;
  }
  if (p.simulado != null) {
    var slugs = p.simulado.split(',').filter(function (s) { return !!temaPorSlug(s); });
    if (!slugs.length) return false;
    S.pick = {};
    slugs.forEach(function (s) { S.pick[s] = true; });
    if (parseInt(p.n, 10) > 0) S.bloco = parseInt(p.n, 10);
    if (p.min != null && p.min !== '') S.minutos = Math.max(0, parseInt(p.min, 10) || 0);
    S.view = 'setup';
    return true;
  }
  if (p.revisao != null) { rodadaRevisao(); return !!S.round; }
  return false;
}
// voltar ao início limpa o endereço, para um F5 não reabrir a mesma rodada
function limparEndereco() {
  try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
window.addEventListener('hashchange', function () {
  if (lerEndereco().treino || lerEndereco().simulado != null || lerEndereco().revisao != null) {
    pararRelogio();
    if (abrirPorEndereco()) render();
  }
});

// começa com todos os temas marcados no simulado
DADOS.temas.forEach(function (t) { S.pick[t.slug] = true; });
abrirPorEndereco();
render();
</script>
