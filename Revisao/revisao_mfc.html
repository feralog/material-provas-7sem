 à <strong>saúde<\/strong>, ao trabalho e ao voto. Curador não autoriza laqueadura.<\/p><\/blockquote>"},{"html":"<p>O <strong>consentimento prévio, livre e esclarecido<\/strong> é indispensável para tratamento, procedimento, hospitalização e pesquisa, com informação em <strong>formato acessível<\/strong>. Atender sem consentimento só em <strong>risco de morte ou emergência em saúde<\/strong>, resguardado o superior interesse da pessoa.<\/p>"}]},{"h":"A Rede de Cuidados à Pessoa com Deficiência","blocos":[{"html":"<p>A <strong>RCPD<\/strong> foi instituída pela <strong>Portaria GM/MS nº 793/2012<\/strong>, dentro do plano Viver sem Limite, e organiza três componentes:<\/p>"},{"html":"<ol><li><strong>Atenção primária<\/strong> — UBS e equipes de Saúde da Família, eMulti e saúde bucal.<\/li><li><strong>Atenção especializada em reabilitação<\/strong> — <strong>CER<\/strong> (Centros Especializados em Reabilitação), <strong>oficinas ortopédicas<\/strong> (órteses, próteses e meios auxiliares de locomoção) e <strong>CEO<\/strong> com atendimento à pessoa com deficiência.<\/li><li><strong>Atenção hospitalar e de urgência e emergência.<\/strong><\/li><\/ol>"},{"html":"<p>Os <strong>CER<\/strong> se classificam pelo número de modalidades que oferecem entre quatro — <strong>auditiva, física, intelectual e visual<\/strong>: <strong>CER II<\/strong> (duas), <strong>CER III<\/strong> (três) e <strong>CER IV<\/strong> (quatro).<\/p>"},{"html":"<p>A <strong>equipe de Saúde da Família<\/strong> é porta de entrada e <strong>coordenadora do cuidado<\/strong>: identifica precocemente, acompanha de forma longitudinal, faz visita domiciliar, apoia o cuidador, articula com o CER e a eMulti — e <strong>continua responsável<\/strong> quando a reabilitação começa. A pessoa com deficiência precisa de todo o cuidado habitual: rastreamentos, vacinas, pré-natal, saúde sexual, saúde bucal.<\/p>"}]},{"h":"Prevenção, triagem e estimulação precoce","blocos":[{"html":"<p>A prevenção começa no pré-natal (vacinação, ácido fólico, controle de infecções congênitas) e segue nas <strong>triagens neonatais<\/strong>:<\/p>"},{"html":"<ul><li><strong>Teste do pezinho<\/strong> — doenças metabólicas, endócrinas e hemoglobinopatias; ampliado por lei em 2021.<\/li><li><strong>Teste da orelhinha<\/strong> — universal e <strong>obrigatório<\/strong> (Lei nº 12.303/2010), de preferência antes da alta; meta de diagnosticar até os 3 meses e intervir até os 6.<\/li><li><strong>Teste do olhinho<\/strong> (reflexo vermelho) — catarata congênita, retinoblastoma, glaucoma; repetido nas consultas.<\/li><\/ul>"},{"html":"<p>Na puericultura, a <strong>vigilância do desenvolvimento<\/strong> pela Caderneta da Criança identifica atrasos. A <strong>estimulação precoce<\/strong> (0 a 3 anos) aproveita a janela de maior <strong>neuroplasticidade<\/strong> e <strong>não espera o diagnóstico etiológico<\/strong>: começa diante do atraso. O Ministério da Saúde publicou diretrizes de estimulação precoce em <strong>2016<\/strong>, após a epidemia de <strong>Zika<\/strong> e a síndrome congênita associada.<\/p>"},{"html":"<p>Para o <strong>TEA<\/strong>, a <strong>Lei nº 13.438/2017<\/strong> tornou obrigatório aplicar, nos <strong>primeiros 18 meses<\/strong>, instrumento de detecção de risco ao desenvolvimento psíquico; o <strong>M-CHAT-R/F<\/strong> é usado entre 16 e 30 meses. Pela <strong>Lei Berenice Piana (Lei nº 12.764/2012)<\/strong>, a pessoa com TEA é <strong>pessoa com deficiência para todos os efeitos legais<\/strong>.<\/p>"}]},{"h":"Cuidado na APS: acesso, comunicação e violência","blocos":[{"html":"<p><strong>Acessibilidade<\/strong> é física (rampas, banheiros, <strong>maca ginecológica acessível<\/strong>, balança para cadeira de rodas, padrão da <strong>NBR 9050<\/strong>), comunicacional e atitudinal. A <strong>Libras<\/strong> é meio legal de comunicação (<strong>Lei nº 10.436/2002<\/strong>), e o SUS deve garantir atendimento por profissional capacitado ou <strong>intérprete<\/strong> (Decreto nº 5.626/2005). Para pessoas com deficiência intelectual: linguagem simples, mais tempo de consulta, falar com a pessoa.<\/p>"},{"html":"<blockquote><p><strong>Ofuscamento diagnóstico<\/strong> é atribuir um sintoma novo à deficiência sem investigar. Em quem tem dificuldade de comunicação, <strong>mudança de comportamento<\/strong> muitas vezes é dor ou doença — dor dentária, otite, constipação, infecção urinária, efeito de medicamento. Investigar antes de rotular ou de prescrever antipsicótico.<\/p><\/blockquote>"},{"html":"<p>Pessoas com deficiência, sobretudo <strong>mulheres e pessoas com deficiência intelectual<\/strong>, sofrem mais <strong>violência<\/strong>, inclusive sexual e por parte de cuidadores. Pela LBI (art. 26), a <strong>suspeita ou confirmação<\/strong> de violência é de <strong>notificação compulsória<\/strong> pelos serviços públicos e privados, com comunicação à autoridade policial, ao Ministério Público e aos conselhos de direitos. Por fim, o <strong>cuidador<\/strong> — quase sempre uma mulher da família — também é objeto de cuidado da equipe: sobrecarga, adoecimento e acesso a direitos sociais.<\/p>"}]}]},{"slug":"saude-baseada-em-evidencias","titulo":"Saúde Baseada em Evidências","disciplina":"MFC","eyebrow":"Medicina de Família e Comunidade · Referência","questoes":[{"id":"95332b62f0","q":"Médico de família se pergunta: 'Em idosos com fibrilação atrial, a apixabana reduz AVC e sangramento quando comparada à varfarina?' No formato PICO, o que corresponde ao C?","opts":["O anticoagulante varfarina","O anticoagulante apixabana","Os idosos com fibrilação atrial","Os desfechos AVC e sangramento"],"c":0,"exp":"No PICO, P é o paciente ou problema (idosos com fibrilação atrial), I a intervenção (apixabana), C a comparação (varfarina) e O o desfecho (AVC e sangramento). A pergunta estruturada define os termos da busca e o filtro do que serve: estudo com PICO diferente não responde à pergunta.","ref":[1,2]},{"id":"4bc4c9bc17","q":"Qual definição traduz o tripé da medicina baseada em evidências, segundo Sackett?","opts":["Melhor evidência, experiência clínica e valores e preferências do paciente","Melhor evidência, opinião do especialista e protocolo do serviço de saúde","Ensaios clínicos, metanálises e diretrizes da indústria farmacêutica","Experiência clínica, exames complementares e custo do tratamento"],"c":0,"exp":"Sackett definiu a medicina baseada em evidências como o uso consciente, explícito e criterioso da melhor evidência disponível na decisão sobre cada paciente, integrada à experiência clínica e aos valores e preferências do paciente. Evidência isolada não decide; ela informa a decisão.","ref":[1,0]},{"id":"fd1bdd3646","q":"Pesquisadores querem saber se um novo anti-hipertensivo reduz AVC em comparação ao tratamento padrão. Qual desenho de estudo responde melhor a essa pergunta?","opts":["Ensaio clínico randomizado","Estudo de coorte prospectivo","Estudo de caso-controle","Estudo transversal de base"],"c":0,"exp":"Para perguntas de tratamento, o ensaio clínico randomizado é o melhor desenho primário: a randomização distribui entre os grupos os confundidores conhecidos e desconhecidos, o que permite inferir causa e efeito. A revisão sistemática de bons ensaios randomizados fica acima dele.","ref":[2,1]},{"id":"e7d4d8a9c8","q":"Uma equipe quer conhecer a evolução, em dez anos, de pacientes que tiveram o primeiro AVC: quantos voltam a ter AVC, quantos morrem e quantos ficam dependentes. Qual o desenho mais adequado?","opts":["Estudo de coorte","Estudo transversal","Estudo caso-controle","Estudo ecológico"],"c":0,"exp":"Perguntas de prognóstico pedem coorte: acompanhar pessoas com a condição ao longo do tempo e medir a incidência dos desfechos. O transversal é um retrato num momento só, o caso-controle parte do desfecho para a exposição e o ecológico compara grupos populacionais, não indivíduos.","ref":[2,1]},{"id":"f03149240e","q":"Pesquisadores querem investigar se o uso de um medicamento na gestação se associa a uma malformação muito rara. Qual desenho é o mais eficiente?","opts":["Caso-controle","Ensaio clínico","Transversal","Série de casos"],"c":0,"exp":"Para desfecho raro ou de latência longa, o caso-controle é o desenho eficiente: parte de quem tem o desfecho (casos) e de quem não tem (controles) e compara a exposição prévia. Uma coorte precisaria de milhares de expostos para observar poucos casos, e expor gestantes a um possível dano num ensaio não seria ético.","ref":[2,1]},{"id":"10d5348ad1","q":"Por que a relação entre tabagismo e câncer de pulmão foi estabelecida sobretudo por estudos observacionais, e não por ensaios randomizados?","opts":["Porque designar pessoas para fumar ao acaso seria antiético","Porque ensaios randomizados não servem para doenças crônicas","Porque estudos observacionais não sofrem viés de confusão","Porque a randomização só funciona com amostras pequenas"],"c":0,"exp":"Quando a exposição é potencialmente nociva, não é ético randomizar pessoas para recebê-la; perguntas de etiologia e dano se respondem com coortes e caso-controle. Esses desenhos estão sujeitos a confundimento, por isso a força da associação, a consistência entre estudos e o gradiente dose-resposta pesam na inferência causal.","ref":[4,0]},{"id":"c605ed0182","q":"Uma metanálise reúne oito ensaios pequenos, todos sem sigilo de alocação, sem cegamento e com muitas perdas de seguimento. Como interpretar a sua conclusão?","opts":["Com cautela: a síntese não corrige o viés dos estudos incluídos","Como evidência definitiva, por estar no topo da pirâmide","Como evidência nula, pois metanálise não inclui ensaios","Como equivalente a um ensaio grande e bem conduzido"],"c":0,"exp":"Revisão sistemática de estudos ruins é evidência ruim: a qualidade da síntese depende da qualidade dos estudos que ela junta. Por isso o GRADE avalia a certeza do conjunto da evidência (risco de viés, inconsistência, evidência indireta, imprecisão, viés de publicação), e não apenas o lugar do desenho na pirâmide.","ref":[3,3]},{"id":"f2129d818e","q":"Pelo sistema GRADE, um conjunto de estudos observacionais começa com certeza baixa. Qual situação pode elevar essa certeza?","opts":["Efeito de grande magnitude, com gradiente dose-resposta","Intervalo de confiança largo, cruzando a linha de nulidade","Resultados muito diferentes entre os estudos analisados","População dos estudos diferente da população de interesse"],"c":0,"exp":"No GRADE, ensaios randomizados começam como alta e observacionais como baixa. Observacionais podem subir com grande magnitude de efeito, gradiente dose-resposta ou confundidores que reduziriam o efeito observado; a certeza cai por risco de viés, inconsistência, evidência indireta, imprecisão e viés de publicação.","ref":[4,0]},{"id":"4e8e7c4791","q":"Uma diretriz faz recomendação 'fraca' ou 'condicional' a favor de uma intervenção, pelo sistema GRADE. O que isso significa na prática?","opts":["A escolha depende dos valores do paciente e pede decisão compartilhada","A intervenção é ineficaz e não deve ser oferecida a nenhum paciente","A evidência é sempre de certeza muito baixa e não deve ser usada","A intervenção é obrigatória, salvo contraindicação absoluta registrada"],"c":0,"exp":"A força da recomendação considera benefícios e danos, certeza da evidência, valores e preferências e custos. Recomendação forte é a que quase todas as pessoas bem informadas escolheriam; a fraca ou condicional indica que pessoas diferentes fariam escolhas diferentes, e por isso pede decisão compartilhada.","ref":[4,1]},{"id":"dc318d0f8e","q":"Na classificação clássica do CEBM de Oxford, uma recomendação de grau A se apoia em qual tipo de evidência, para perguntas de tratamento?","opts":["Revisão sistemática de ensaios randomizados ou ensaio randomizado bom","Estudos de coorte e de caso-controle consistentes entre si","Séries de casos e estudos de coorte de menor qualidade","Opinião de especialistas baseada em fisiologia e experiência"],"c":0,"exp":"No esquema clássico de Oxford, o grau A vem de evidência de nível 1 (revisão sistemática de ensaios randomizados ou ensaio randomizado de boa qualidade); o B, dos níveis 2 e 3 (coortes e caso-controle); o C, do nível 4 (séries de casos); e o D, do nível 5 (opinião de especialistas sem avaliação crítica).","ref":[3,1]},{"id":"c1198f7bf5","q":"Em um ensaio de 5 anos, o infarto ocorreu em 20% do grupo placebo e em 15% do grupo tratado. Quais são a redução absoluta do risco e o NNT?","opts":["RRA de 5 pontos percentuais e NNT de 20","RRA de 25 pontos percentuais e NNT de 4","RRA de 15 pontos percentuais e NNT de 7","RRA de 5 pontos percentuais e NNT de 5"],"c":0,"exp":"RRA = risco no controle − risco no tratado = 20% − 15% = 5 pontos percentuais; NNT = 1 ÷ RRA = 1 ÷ 0,05 = 20 pessoas tratadas por 5 anos para evitar um infarto. O RR é 0,75 e a redução do risco relativo é de 25%, número que soa maior que a RRA.","ref":[5,1]},{"id":"ff0aceb32f","q":"Uma propaganda afirma que um remédio 'reduz pela metade o risco de fratura'. No estudo, o risco em 3 anos caiu de 2% para 1%. Qual a leitura correta?","opts":["RRR de 50%, mas RRA de 1 ponto percentual e NNT de 100","RRR de 50%, RRA de 50 pontos percentuais e NNT de 2","RRR de 1%, RRA de 50 pontos percentuais e NNT de 50","RRR de 2%, RRA de 1 ponto percentual e NNT de 200"],"c":0,"exp":"A redução do risco relativo é de 50% (1 − 1/2), mas a redução absoluta é de apenas 1 ponto percentual (2% − 1%), e o NNT é 1 ÷ 0,01 = 100 pessoas tratadas por 3 anos para evitar uma fratura. A RRR impressiona mais; RRA e NNT, que dependem do risco basal, mostram o benefício real.","ref":[5,2]},{"id":"c16e770849","q":"Um ensaio relata risco relativo de 0,85 para morte, com intervalo de confiança de 95% de 0,70 a 1,05. Como interpretar?","opts":["Sem diferença estatisticamente significativa, pois o IC inclui o 1","Redução de mortalidade significativa, pois o RR é menor que 1","Aumento de mortalidade significativo, pois o IC passa de 1","Resultado inválido, pois o IC deveria ser menor que o RR"],"c":0,"exp":"Para medidas relativas (RR, odds ratio, hazard ratio), o valor 1 significa ausência de diferença; um intervalo de confiança de 95% que inclui o 1 indica que o resultado não tem significância estatística. O intervalo largo também sinaliza imprecisão, um dos motivos de rebaixamento no GRADE.","ref":[5,3]},{"id":"c540f7bf20","q":"Um ensaio com homens de 45 a 60 anos, sem comorbidades, mostrou benefício claro de um fármaco. O médico avalia usá-lo numa mulher de 86 anos com insuficiência renal e mais seis medicamentos. Qual o problema principal?","opts":["Validade externa: ela difere muito da população do estudo","Validade interna: o resultado do ensaio está comprometido","Viés de publicação: o ensaio deve ter sido mal divulgado","Erro aleatório: o tamanho da amostra deve ter sido pequeno"],"c":0,"exp":"Validade interna é a confiança de que o resultado é verdadeiro na população estudada; validade externa, ou aplicabilidade, é saber se ele vale para o paciente à frente. Um ensaio impecável pode ter pouca aplicabilidade a idosos multimórbidos, muitas vezes excluídos desses estudos.","ref":[6,0]},{"id":"4af79eb0b6","q":"Um novo antidiabético reduziu a HbA1c em ensaios clínicos, mas não houve redução de infarto, AVC nem mortalidade. Como classificar o desfecho HbA1c nesse contexto?","opts":["Desfecho substituto, que nem sempre reflete benefício ao paciente","Desfecho duro, que por si só comprova benefício clínico relevante","Desfecho primário de segurança, voltado a efeitos adversos graves","Desfecho composto, que soma eventos cardiovasculares e renais"],"c":0,"exp":"HbA1c, LDL e densidade óssea são desfechos substitutos: marcadores que se espera que acompanhem desfechos clínicos, mas nem sempre acompanham. O que importa ao paciente é morte, infarto, AVC, fratura e qualidade de vida; melhorar o exame sem melhorar esses desfechos não basta para afirmar benefício.","ref":[5,3]},{"id":"81982d2a17","q":"No meio do atendimento, a médica de família precisa responder rapidamente a uma dúvida de tratamento com a melhor evidência disponível. Por onde é mais eficiente começar a busca?","opts":["Por diretrizes baseadas em evidência e sumários clínicos atualizados","Por estudos individuais no PubMed, lendo os artigos mais recentes","Por relatos de caso publicados sobre pacientes parecidos com o dela","Pela opinião de colegas mais experientes, por ser a resposta mais rápida"],"c":0,"exp":"A busca eficiente começa pelo que já foi sintetizado e avaliado: diretrizes baseadas em evidência (PCDT e Conitec, NICE) e sumários clínicos, depois revisões sistemáticas (Biblioteca Cochrane) e, por fim, estudos individuais em bases como PubMed/MEDLINE e LILACS. O estudo isolado mais recente pode contrariar um conjunto inteiro de evidências.","ref":[1,3]},{"id":"4d57a924f0","q":"Homem de 55 anos, assintomático, pede à médica de família 'o exame de próstata'. Qual conduta segue a decisão compartilhada e a posição do Ministério da Saúde e do INCA?","opts":["Explicar benefícios e danos do PSA e decidir junto com ele","Pedir PSA e toque retal anuais, pois é o rastreamento padrão","Negar o exame, pois o rastreamento é proibido pelo SUS","Pedir PSA e biópsia já na primeira consulta, por segurança"],"c":0,"exp":"O Ministério da Saúde e o INCA não recomendam rastreamento populacional do câncer de próstata, pelo risco de falso-positivo, biópsias, sobrediagnóstico e sobretratamento (incontinência, disfunção erétil). Quando o homem pede, a conduta é apresentar benefícios e danos em números absolutos e decidir com ele, sem pedido automático.","ref":[6,1]},{"id":"6f8e25418a","q":"Um ensaio controlado mostrou que um programa de exercícios reduz quedas em idosos. Aplicado na rede municipal, com adesão menor e pacientes mais variados, o efeito foi menor. Os dois resultados ilustram, respectivamente:","opts":["Eficácia e efetividade","Efetividade e eficácia","Eficiência e eficácia","Efetividade e eficiência"],"c":0,"exp":"Eficácia é o efeito em condições ideais e controladas, como no ensaio clínico; efetividade é o efeito no mundo real, com adesão imperfeita e pacientes heterogêneos; eficiência relaciona o efeito ao custo. É comum que a efetividade seja menor que a eficácia.","ref":[6,0]}],"resumo":[{"h":"","blocos":[{"html":"<blockquote><p>Material de referência: não há slide da aula deste tema. Baseado na definição clássica de Sackett, no Oxford Centre for Evidence-Based Medicine (CEBM), no sistema GRADE e nas diretrizes metodológicas do Ministério da Saúde para pareceres e diretrizes clínicas.<\/p><\/blockquote>"}]},{"h":"O que é e os cinco passos","blocos":[{"html":"<p><strong>Saúde (ou medicina) baseada em evidências<\/strong> é o uso consciente, explícito e criterioso da <strong>melhor evidência disponível<\/strong> na decisão sobre o cuidado de cada paciente (Sackett). Ela se apoia num <strong>tripé<\/strong>: a melhor evidência científica, a <strong>experiência clínica<\/strong> do profissional e os <strong>valores e preferências do paciente<\/strong>. Evidência sozinha não decide: ela informa uma decisão que é sempre de uma pessoa concreta, num contexto concreto.<\/p>"},{"html":"<p>A prática segue cinco passos: <strong>perguntar<\/strong> (transformar a dúvida em pergunta estruturada), <strong>buscar<\/strong> a evidência, <strong>avaliar criticamente<\/strong> sua validade e importância, <strong>aplicar<\/strong> ao paciente e <strong>avaliar<\/strong> o resultado.<\/p>"},{"html":"<p>A pergunta estruturada usa o <strong>PICO<\/strong>: <strong>P<\/strong> de paciente ou problema, <strong>I<\/strong> de intervenção (ou exposição), <strong>C<\/strong> de comparação e <strong>O<\/strong> de <em>outcome<\/em> (desfecho). \"Em idosos com fibrilação atrial (P), a apixabana (I), comparada com a varfarina (C), reduz AVC e sangramento (O)?\" O PICO define as palavras da busca e o filtro do que serve: um estudo excelente com PICO diferente do seu não responde à sua pergunta.<\/p>"},{"html":"<p>Na busca, comece pelo que já foi sintetizado. A ordem prática é: <strong>diretrizes baseadas em evidência e sumários clínicos<\/strong> (PCDT e relatórios da Conitec, NICE, USPSTF, UpToDate, DynaMed, BMJ Best Practice) → <strong>revisões sistemáticas<\/strong> (Biblioteca Cochrane) → <strong>estudos individuais<\/strong> nas bases (PubMed/MEDLINE, LILACS e o portal da BVS, Embase, SciELO).<\/p>"}]},{"h":"Tipos de estudo: qual desenho para qual pergunta","blocos":[{"html":"<p>O melhor desenho depende da pergunta, não de uma escala fixa.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Pergunta<\/th><th>Melhor desenho<\/th><th>Por quê<\/th><\/tr><\/thead><tbody><tr><td><strong>Tratamento<\/strong> (a intervenção funciona?)<\/td><td><strong>ensaio clínico randomizado<\/strong><\/td><td>a randomização distribui os confundidores, conhecidos e desconhecidos, entre os grupos<\/td><\/tr><tr><td><strong>Prognóstico<\/strong> (o que acontece com quem tem a doença?)<\/td><td><strong>coorte<\/strong><\/td><td>acompanha no tempo, do fator ao desfecho, e mede incidência<\/td><\/tr><tr><td><strong>Etiologia ou dano<\/strong> (a exposição causa?)<\/td><td><strong>coorte<\/strong>; <strong>caso-controle<\/strong> se a doença é rara ou de latência longa<\/td><td>expor pessoas a um fator nocivo de propósito não é ético<\/td><\/tr><tr><td><strong>Prevalência<\/strong> (quantos têm?)<\/td><td><strong>transversal<\/strong><\/td><td>retrato num momento só; não estabelece sequência temporal<\/td><\/tr><tr><td><strong>Diagnóstico<\/strong> (o teste acerta?)<\/td><td><strong>estudo de acurácia<\/strong><\/td><td>compara o teste com o padrão-ouro nos mesmos pacientes<\/td><\/tr><tr><td><strong>Síntese<\/strong> de tudo isso<\/td><td><strong>revisão sistemática<\/strong>, com ou sem metanálise<\/td><td>busca reprodutível de todos os estudos e combinação dos resultados<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p><strong>Estudos experimentais<\/strong> (o pesquisador controla a exposição) testam causa e efeito; <strong>observacionais<\/strong> (o pesquisador só observa) descrevem, associam e geram hipóteses, e são vulneráveis ao <strong>confundimento<\/strong>. Relatos e séries de casos não têm grupo de comparação: servem para sinalizar doenças novas e efeitos adversos raros, não para provar eficácia.<\/p>"}]},{"h":"Hierarquia de evidências e seus limites","blocos":[{"html":"<p>Para perguntas de tratamento, a <strong>pirâmide<\/strong> vai da base ao topo: opinião de especialistas → relatos e séries de casos → caso-controle → coorte → ensaio clínico randomizado → revisão sistemática e metanálise. A classificação clássica do CEBM de Oxford liga o nível da evidência ao grau da recomendação:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Grau<\/th><th>Nível de evidência (tratamento)<\/th><\/tr><\/thead><tbody><tr><td><strong>A<\/strong><\/td><td>nível 1: revisão sistemática de ensaios randomizados ou ensaio randomizado de boa qualidade<\/td><\/tr><tr><td><strong>B<\/strong><\/td><td>níveis 2 e 3: coortes e caso-controle (e suas revisões), ensaios de menor qualidade<\/td><\/tr><tr><td><strong>C<\/strong><\/td><td>nível 4: séries de casos e estudos de pior qualidade<\/td><\/tr><tr><td><strong>D<\/strong><\/td><td>nível 5: opinião de especialistas sem avaliação crítica<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>A pirâmide é um atalho, e tem limites claros:<\/p>"},{"html":"<ul><li>ela vale para <strong>tratamento<\/strong>; para prognóstico o topo é a coorte, para dano raro, o caso-controle;<\/li><li><strong>revisão sistemática de estudos ruins é evidência ruim<\/strong> — a síntese não corrige o viés dos estudos que junta;<\/li><li>um ensaio randomizado mal conduzido (sem sigilo de alocação, sem cegamento, com muitas perdas) pode valer menos que uma coorte grande e bem feita;<\/li><li>ensaios com pacientes muito selecionados podem ter <strong>pouca aplicabilidade<\/strong> ao paciente da APS.<\/li><\/ul>"},{"html":"<p>Por isso os sistemas atuais avaliam a <strong>certeza do conjunto da evidência<\/strong> sobre cada desfecho, e não apenas o desenho.<\/p>"}]},{"h":"GRADE: certeza da evidência e força da recomendação","blocos":[{"html":"<p>O <strong>GRADE<\/strong> classifica a <strong>certeza da evidência<\/strong> em <strong>alta, moderada, baixa ou muito baixa<\/strong>. Ensaios randomizados <strong>começam como alta<\/strong>; estudos observacionais <strong>começam como baixa<\/strong>. A certeza <strong>cai<\/strong> por cinco motivos — <strong>risco de viés, inconsistência<\/strong> entre os estudos, <strong>evidência indireta<\/strong> (população, intervenção ou desfecho diferentes do que interessa), <strong>imprecisão<\/strong> (amostra pequena, intervalo de confiança largo) e <strong>viés de publicação<\/strong> — e pode <strong>subir<\/strong>, nos observacionais, com <strong>grande magnitude de efeito<\/strong>, <strong>gradiente dose-resposta<\/strong> ou quando os confundidores plausíveis reduziriam o efeito observado.<\/p>"},{"html":"<p>A <strong>força da recomendação<\/strong> é outra dimensão: <strong>forte<\/strong> ou <strong>fraca (condicional)<\/strong>. Ela considera o balanço entre benefícios e danos, a certeza da evidência, os valores e preferências dos pacientes e os custos.<\/p>"},{"html":"<blockquote><p>Recomendação <strong>forte<\/strong>: quase todas as pessoas bem informadas escolheriam a mesma conduta. Recomendação <strong>fraca ou condicional<\/strong>: a escolha depende dos valores de cada um — é o terreno natural da <strong>decisão compartilhada<\/strong>. Evidência de alta certeza pode gerar recomendação fraca, se o benefício é pequeno e os danos, relevantes.<\/p><\/blockquote>"}]},{"h":"Medidas de efeito: RR, RRA, RRR e NNT","blocos":[{"html":"<p>Imagine que, em 5 anos, 20% dos pacientes do grupo controle e 15% do grupo tratado tenham um infarto:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Medida<\/th><th>Cálculo<\/th><th>Resultado<\/th><\/tr><\/thead><tbody><tr><td><strong>Risco relativo (RR)<\/strong><\/td><td>risco no tratado ÷ risco no controle<\/td><td>15 ÷ 20 = <strong>0,75<\/strong><\/td><\/tr><tr><td><strong>Redução do risco relativo (RRR)<\/strong><\/td><td>1 − RR<\/td><td><strong>25%<\/strong><\/td><\/tr><tr><td><strong>Redução absoluta do risco (RRA)<\/strong><\/td><td>risco no controle − risco no tratado<\/td><td>20% − 15% = <strong>5 pontos percentuais<\/strong><\/td><\/tr><tr><td><strong>Número necessário para tratar (NNT)<\/strong><\/td><td>1 ÷ RRA<\/td><td>1 ÷ 0,05 = <strong>20<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p>O NNT diz quantas pessoas precisam ser tratadas, naquele tempo, para que <strong>uma<\/strong> evite o desfecho; o <strong>NNH<\/strong> (número necessário para causar dano) é a mesma conta aplicada ao efeito adverso. A RRR impressiona mais e engana mais: um remédio que leva o risco de 2% para 1% \"reduz o risco pela metade\" (RRR de 50%), mas a RRA é de 1 ponto percentual e o NNT é 100. <strong>A RRA e o NNT dependem do risco basal<\/strong>: o mesmo RR rende muito benefício para quem tem risco alto e quase nenhum para quem tem risco baixo.<\/p>"},{"html":"<p>O <strong>intervalo de confiança de 95%<\/strong> mostra a precisão: para RR ou <em>odds ratio<\/em>, um intervalo que <strong>inclui o 1<\/strong> indica diferença <strong>sem significância estatística<\/strong>. Significância estatística também não é relevância clínica — um efeito minúsculo fica \"significativo\" com amostra enorme. E vale olhar o desfecho: <strong>desfecho substituto<\/strong> (HbA1c, LDL, densidade óssea) nem sempre se traduz em <strong>desfecho que importa ao paciente<\/strong> (morte, infarto, fratura, qualidade de vida).<\/p>"}]},{"h":"Validade, aplicabilidade e decisão compartilhada","blocos":[{"html":"<p><strong>Validade interna<\/strong> é a confiança de que o resultado é verdadeiro <strong>na população estudada<\/strong>, livre de viés, confundimento e acaso. <strong>Validade externa<\/strong> (aplicabilidade ou generalização) é a pergunta seguinte: <strong>o meu paciente se parece com os do estudo?<\/strong> Um ensaio impecável em homens de 50 anos sem comorbidades pode ter pouca aplicabilidade a uma mulher de 85 anos com multimorbidade. Na mesma linha, <strong>eficácia<\/strong> é o efeito em condições ideais (o ensaio clínico), <strong>efetividade<\/strong> é o efeito no mundo real e <strong>eficiência<\/strong> relaciona o efeito ao custo.<\/p>"},{"html":"<p>A <strong>decisão compartilhada<\/strong> fecha o ciclo: apresentar as opções (inclusive não fazer nada), os benefícios e os danos <strong>em números absolutos<\/strong> — RRA, NNT, NNH —, explorar o que importa para a pessoa e decidir junto, se possível com apoio de ferramentas de decisão. O exemplo clássico na APS é o <strong>PSA<\/strong>: o Ministério da Saúde e o INCA não recomendam rastreamento populacional do câncer de próstata, pelo risco de sobrediagnóstico e sobretratamento; quando um homem pede o exame, a conduta é explicar benefícios e danos e decidir com ele, sem pedido automático.<\/p>"},{"html":"<blockquote><p>Evidência boa aplicada sem ouvir o paciente não é medicina baseada em evidências — falta a terceira perna do tripé.<\/p><\/blockquote>"}]}]},{"slug":"saude-do-homem","titulo":"Saúde do Homem","disciplina":"MFC","eyebrow":"Medicina de Família e Comunidade · Referência","questoes":[{"id":"f14a99b079","q":"A Política Nacional de Atenção Integral à Saúde do Homem (PNAISH), de 2009, organiza suas ações em cinco eixos temáticos. Qual destes é um deles?","opts":["Paternidade e cuidado","Rastreio de próstata","Saúde do trabalhador","Urologia preventiva"],"c":0,"exp":"Os cinco eixos da PNAISH são: acesso e acolhimento; saúde sexual e saúde reprodutiva; paternidade e cuidado; doenças prevalentes na população masculina; e prevenção de violências e acidentes. A política vai muito além da próstata — e o Ministério da Saúde não recomenda rastreamento populacional do câncer de próstata.","ref":[1,2]},{"id":"c8dde702fa","q":"Por que os homens adultos usam menos a atenção primária e costumam chegar ao sistema de saúde pela urgência ou pela atenção especializada?","opts":["Normas de masculinidade e horários que coincidem com o trabalho","Menor carga de doenças crônicas em relação à população feminina","Exclusão formal dos homens da carteira de serviços da APS","Preferência por planos privados em todas as classes sociais"],"c":0,"exp":"A masculinidade hegemônica associa o homem à força, à invulnerabilidade e ao papel de provedor; procurar cuidado soa como fraqueza, e a UBS é vista como espaço de mulheres e crianças. Somam-se horários de funcionamento que coincidem com o trabalho. Resultado: o homem chega tarde, pela urgência, com a doença avançada.","ref":[2,0]},{"id":"c7502d881d","q":"Entre homens jovens, de 20 a 39 anos, a principal causa de morte no Brasil é o grupo das:","opts":["Causas externas, como homicídios e acidentes","Doenças do aparelho circulatório, como o IAM","Neoplasias, sobretudo o câncer de próstata","Doenças infecciosas, sobretudo a tuberculose"],"c":0,"exp":"Homicídios, acidentes de trânsito e suicídios lideram a mortalidade dos homens jovens; cerca de nove em cada dez vítimas de homicídio são homens. Com a idade, as doenças do aparelho circulatório passam à frente. O excesso de mortes evitáveis explica boa parte da expectativa de vida masculina cerca de sete anos menor que a feminina.","ref":[3,1]},{"id":"6fae4e8426","q":"Sobre o suicídio no Brasil, é correto afirmar que:","opts":["a taxa é cerca de três a quatro vezes maior em homens que em mulheres","as tentativas e as mortes por suicídio predominam no sexo masculino","a taxa é semelhante entre os sexos, pois os métodos são parecidos","a taxa é maior em mulheres, que procuram menos os serviços de saúde"],"c":0,"exp":"Homens morrem por suicídio cerca de três a quatro vezes mais que mulheres, por usarem métodos mais letais e procurarem menos ajuda; já as tentativas são mais frequentes entre mulheres. Perguntar diretamente sobre ideação suicida, uso de álcool e acesso a armas faz parte da consulta do homem.","ref":[3,1]},{"id":"7442b13c45","q":"Na estratégia Pré-Natal do Parceiro, além de acolher o homem nas consultas, a equipe deve oferecer a ele:","opts":["testes rápidos de HIV, sífilis e hepatites, exames de rotina e vacinas","espermograma e dosagem de testosterona para avaliar a fertilidade","apenas orientações sobre o parto, pois a gestante é o foco do cuidado","PSA e toque retal, aproveitando a ida do homem à unidade de saúde"],"c":0,"exp":"O Guia do Pré-Natal do Parceiro (Ministério da Saúde, 2016) prevê testes rápidos para HIV, sífilis e hepatites B e C, tipagem sanguínea e fator Rh, hemograma, glicemia, lipidograma, eletroforese de hemoglobina, aferição de pressão e IMC, atualização vacinal e participação nas consultas, no parto e nos cuidados com o bebê. É porta de entrada do homem na APS.","ref":[6,3]},{"id":"d7a88c3449","q":"Gestante com sífilis foi tratada adequadamente, mas o parceiro não compareceu à UBS. Qual o principal risco e a conduta?","opts":["Reinfecção da gestante: convocar e tratar o parceiro sexual","Nenhum risco: o tratamento da gestante já protege o feto","Resistência à penicilina: trocar o esquema da gestante","Sífilis do parceiro é autolimitada: orientar só preservativo"],"c":0,"exp":"Parceiro não tratado reinfecta a gestante e mantém o risco de sífilis congênita. Ele deve ser testado e tratado; quando exposto nos últimos 90 dias, recebe tratamento mesmo com teste negativo (PCDT-IST 2022). O pré-natal do parceiro existe também por isso.","ref":[6,3]},{"id":"9b0264ccf4","q":"Homem de 58 anos, assintomático e sem história familiar, pede \"o exame da próstata\" porque viu uma campanha do Novembro Azul. Pelas recomendações do Ministério da Saúde e do INCA, a conduta é:","opts":["Explicar benefícios e danos e decidir junto com ele se fará o PSA","Pedir PSA e toque retal anuais, que reduzem muito a mortalidade","Negar o exame, pois o PSA está proibido em homens assintomáticos","Pedir só o toque retal, que tem acurácia maior que a do PSA"],"c":0,"exp":"O Ministério da Saúde e o INCA não recomendam o rastreamento populacional do câncer de próstata: o benefício em mortalidade é pequeno e incerto, e os danos são frequentes. Quando o homem pede o exame, a conduta é a decisão compartilhada, explicando benefícios e riscos, sem pedido automático e sem recusa autoritária.","ref":[5,1]},{"id":"b7ad33d3e2","q":"Qual é o principal dano do rastreamento do câncer de próstata com PSA?","opts":["Sobrediagnóstico e sobretratamento de tumores indolentes","Exposição à radiação ionizante pela repetição dos exames","Reação alérgica ao contraste usado na coleta do exame","Atraso no diagnóstico de tumores agressivos sintomáticos"],"c":0,"exp":"Muitos tumores detectados pelo PSA nunca causariam sintomas nem morte: é o sobrediagnóstico. Tratá-los expõe o homem a incontinência urinária e disfunção erétil sem benefício. Somam-se falsos-positivos (o PSA sobe também na hiperplasia prostática e na prostatite) e biópsias com risco de sangramento e infecção.","ref":[5,2]},{"id":"ef1b5520f6","q":"Homem de 66 anos procura a UBS com jato urinário fraco, noctúria e um episódio de hematúria. Sobre a solicitação de PSA nesse caso, é correto afirmar que:","opts":["é investigação diagnóstica de quem tem sintomas, não rastreamento","é rastreamento e, por isso, contraindicado pelo Ministério da Saúde","só se justifica após os 70 anos, idade do pico de incidência","é dispensável, pois os sintomas confirmam hiperplasia benigna"],"c":0,"exp":"Rastreamento é para assintomáticos. Sintomas urinários, hematúria ou toque retal alterado pedem investigação diagnóstica, que inclui PSA, toque retal e outros exames conforme o caso. Sintomas obstrutivos são mais frequentemente hiperplasia benigna, mas hematúria nunca deve ser atribuída a ela sem investigar.","ref":[5,3]},{"id":"d76b53d9f9","q":"Homem de 55 anos, assintomático e sem história familiar, vai à consulta de rotina. Qual rastreamento oncológico tem evidência de benefício e está indicado?","opts":["Câncer colorretal, por sangue oculto nas fezes ou colonoscopia","Câncer de próstata, por PSA e toque retal anuais a partir dos 50","Câncer de testículo, por autoexame mensal ensinado na consulta","Câncer de pâncreas, por ultrassonografia de abdome a cada 2 anos"],"c":0,"exp":"O rastreamento do câncer colorretal reduz a mortalidade e é recomendado dos 50 aos 75 anos (Caderno de Atenção Primária nº 29), com pesquisa de sangue oculto nas fezes ou colonoscopia; a USPSTF (2021) antecipou o início para 45 anos. Próstata, testículo e pâncreas não têm rastreamento populacional recomendado.","ref":[4,1]},{"id":"3a1d632334","q":"Pelo Caderno de Atenção Primária nº 29 (Rastreamento), a dosagem de lipídios em homens assintomáticos, sem outro fator de risco cardiovascular, está indicada a partir dos:","opts":["35 anos","20 anos","45 anos","60 anos"],"c":0,"exp":"O Caderno nº 29 recomenda rastrear dislipidemia em homens a partir dos 35 anos e em mulheres a partir dos 45; homens de 20 a 35 anos são rastreados se tiverem risco cardiovascular aumentado (tabagismo, hipertensão, diabetes, história familiar precoce). O perfil lipídico entra no cálculo do risco cardiovascular global.","ref":[4,1]},{"id":"086c89d280","q":"Sobre o rastreamento de hipertensão arterial em homens adultos assintomáticos, é correto afirmar que:","opts":["a aferição da PA está indicada para todos os adultos a partir dos 18 anos","a aferição da PA só está indicada após os 40 anos ou se houver sintomas","a MAPA de 24 horas é o exame de rastreamento inicial em toda a população","a PA só deve ser medida se houver história familiar de hipertensão"],"c":0,"exp":"O rastreamento de hipertensão em adultos a partir dos 18 anos tem forte evidência e é simples: aferir a PA, aproveitando qualquer contato do homem com o serviço. MAPA e MRPA servem para confirmar o diagnóstico e afastar o efeito do avental branco, não para rastrear.","ref":[4,1]},{"id":"91caf823e4","q":"Pelo Caderno de Atenção Básica nº 36 do Ministério da Saúde, qual destes homens assintomáticos tem indicação de rastreamento de diabetes tipo 2?","opts":["Homem de 46 anos, sem outros fatores de risco","Homem de 30 anos, com IMC 23 e sem antecedentes","Homem de 25 anos, atleta e sem história familiar","Homem de 38 anos, com IMC 22 e pressão normal"],"c":0,"exp":"O rastreamento é indicado para quem tem 45 anos ou mais e, antes disso, para quem tem excesso de peso associado a outro fator de risco, como hipertensão, dislipidemia, história familiar de diabetes, sedentarismo ou doença cardiovascular. Usa-se glicemia de jejum, hemoglobina glicada ou teste oral de tolerância à glicose.","ref":[4,1]},{"id":"e98eacb0a5","q":"Homem de 52 anos, tabagista e sedentário, queixa-se de disfunção erétil progressiva há um ano. Qual a interpretação mais importante para o médico de família?","opts":["Pode ser marcador precoce de doença cardiovascular e pede avaliação de risco","É consequência esperada do envelhecimento e não exige nenhuma investigação","É quase sempre psicogênica e deve ser tratada só com psicoterapia de casal","Indica deficiência de testosterona e a reposição hormonal deve começar já"],"c":0,"exp":"A disfunção erétil compartilha fisiopatologia com a aterosclerose e costuma preceder em alguns anos a doença coronariana: é ocasião para avaliar PA, glicemia, lipídios, tabagismo e risco cardiovascular, além de medicamentos e saúde mental. Os inibidores da fosfodiesterase-5 (sildenafila, tadalafila) são contraindicados com nitratos, pelo risco de hipotensão grave.","ref":[6,0]},{"id":"25163369cb","q":"Homem de 23 anos, casado e sem filhos, deseja fazer vasectomia; a esposa não concorda. Pela Lei do Planejamento Familiar, atualizada em 2022, é correto afirmar que:","opts":["ele pode fazer: tem mais de 21 anos e não precisa do aval da esposa","não pode fazer: a lei exige 25 anos e pelo menos dois filhos vivos","não pode fazer: a lei exige o consentimento expresso do cônjuge","ele pode fazer, mas só após 6 meses de acompanhamento psicológico"],"c":0,"exp":"A Lei nº 14.443/2022 alterou a Lei nº 9.263/1996: a esterilização voluntária é permitida a partir dos 21 anos ou com pelo menos dois filhos vivos, com prazo mínimo de 60 dias entre a manifestação da vontade e a cirurgia, e sem exigir consentimento do cônjuge. Nesse prazo, a equipe aconselha e informa que é preciso usar outro método até o espermograma confirmar azoospermia.","ref":[6,2]},{"id":"bd0e4557eb","q":"Sobre a vacina contra o HPV para meninos no calendário do SUS, é correto afirmar que:","opts":["é oferecida a meninos e meninas de 9 a 14 anos, em dose única","é oferecida apenas a meninas, pois o HPV não causa câncer em homens","é oferecida a meninos somente após o início da vida sexual","é oferecida a homens de 30 a 45 anos com mais de um parceiro"],"c":0,"exp":"O SUS vacina meninos e meninas de 9 a 14 anos contra o HPV, em dose única desde 2024; grupos especiais, como pessoas vivendo com HIV e transplantados, têm esquema ampliado. No homem, o HPV causa verrugas anogenitais e cânceres de pênis, ânus e orofaringe, além de ser transmitido às parcerias.","ref":[6,1]},{"id":"d938cb9b26","q":"Homem de 45 anos vem à UBS pela primeira vez em 10 anos, apenas para pegar um atestado depois de uma crise de lombalgia. Qual a melhor atitude da equipe?","opts":["Atender a demanda e aproveitar o contato para cuidado preventivo","Fornecer só o atestado, pois o motivo da consulta deve ser respeitado","Recusar o atestado até que ele traga todos os exames de rotina","Repreendê-lo por não ir à unidade e agendar check-up completo"],"c":0,"exp":"O homem procura pouco a APS, então cada contato é oportunidade: resolver a demanda trazida e, sem culpabilizar, aferir a PA, perguntar sobre tabagismo, álcool, saúde mental e sexual, vacinas e combinar retorno. Horários estendidos e acolhimento sem julgamento facilitam o vínculo; check-up com bateria de exames sem indicação não é o objetivo.","ref":[2,2]}],"resumo":[{"h":"","blocos":[{"html":"<blockquote><p>Material de referência: não há slide da aula deste tema. Baseado na Política Nacional de Atenção Integral à Saúde do Homem (2009), no Caderno de Atenção Primária nº 29 (Rastreamento), no Caderno de Atenção Básica nº 36 (Diabetes), no Guia do Pré-Natal do Parceiro (2016), nas recomendações do INCA e na Lei nº 14.443/2022.<\/p><\/blockquote>"}]},{"h":"A PNAISH e seus cinco eixos","blocos":[{"html":"<p>A <strong>Política Nacional de Atenção Integral à Saúde do Homem (PNAISH)<\/strong> foi instituída pela <strong>Portaria GM/MS nº 1.944, de 27 de agosto de 2009<\/strong>, com foco nos homens de <strong>20 a 59 anos<\/strong>. Seu objetivo é reduzir a morbimortalidade masculina enfrentando os fatores de risco e <strong>facilitando o acesso<\/strong> às ações e aos serviços, respeitando as diferentes <strong>masculinidades<\/strong>.<\/p>"},{"html":"<p>A política se organiza em <strong>cinco eixos temáticos<\/strong>:<\/p>"},{"html":"<ol><li><strong>Acesso e acolhimento<\/strong><\/li><li><strong>Saúde sexual e saúde reprodutiva<\/strong><\/li><li><strong>Paternidade e cuidado<\/strong><\/li><li><strong>Doenças prevalentes na população masculina<\/strong><\/li><li><strong>Prevenção de violências e acidentes<\/strong><\/li><\/ol>"},{"html":"<blockquote><p><strong>Ideia central:<\/strong> saúde do homem inclui saúde mental, risco cardiovascular, sexualidade, paternidade, trabalho e violência — <strong>vai muito além da próstata<\/strong>. Questão que reduz a política ao PSA está errada.<\/p><\/blockquote>"}]},{"h":"Masculinidades e acesso","blocos":[{"html":"<p>O homem procura menos a atenção primária e entra no sistema <strong>pela urgência ou pela atenção especializada<\/strong>, com a doença já avançada. A explicação central é cultural: a <strong>masculinidade hegemônica<\/strong> associa o homem à força, à <strong>invulnerabilidade<\/strong> e ao papel de <strong>provedor<\/strong>; adoecer e pedir ajuda soam como fraqueza. Somam-se o medo de descobrir doença, a vergonha de expor o corpo, a percepção da UBS como espaço de mulheres e crianças e <strong>horários de funcionamento que coincidem com o trabalho<\/strong>.<\/p>"},{"html":"<p>Fala-se em <strong>masculinidades<\/strong>, no plural: homens negros, gays, trans, idosos, em situação de rua ou privados de liberdade vivem a masculinidade e o acesso de formas diferentes.<\/p>"},{"html":"<p>O que a equipe pode fazer: <strong>horários estendidos<\/strong> (como no programa Saúde na Hora), acolhimento <strong>sem culpabilizar<\/strong>, <strong>aproveitar todo contato<\/strong> (o homem que vem por um atestado sai com a PA aferida e o retorno combinado), ações em locais de trabalho e o <strong>pré-natal do parceiro<\/strong> como porta de entrada.<\/p>"}]},{"h":"O que mata e adoece o homem","blocos":[{"html":"<p>Os homens vivem <strong>cerca de sete anos menos<\/strong> que as mulheres, e boa parte da diferença vem de mortes evitáveis.<\/p>"},{"html":"<ul><li><strong>Causas externas<\/strong> — homicídios, acidentes de trânsito e suicídio — são a principal causa de morte dos <strong>homens jovens<\/strong>; cerca de <strong>nove em cada dez vítimas de homicídio<\/strong> são homens.<\/li><li><strong>Suicídio<\/strong> — homens morrem cerca de <strong>três a quatro vezes mais<\/strong> que mulheres, por métodos mais letais e menos procura de ajuda; as <strong>tentativas<\/strong> são mais frequentes entre mulheres.<\/li><li><strong>Doenças do aparelho circulatório<\/strong> passam à frente com a idade, seguidas das <strong>neoplasias<\/strong>.<\/li><li><strong>Tabagismo e uso abusivo de álcool<\/strong> são mais frequentes no homem e estão por trás de doença cardiovascular, câncer, cirrose, violência e acidentes.<\/li><\/ul>"},{"html":"<p>Na consulta: perguntar diretamente sobre <strong>ideação suicida<\/strong>, <strong>álcool<\/strong> (AUDIT), tabaco, <strong>acesso a armas<\/strong>, violência sofrida e praticada e exposição ocupacional.<\/p>"}]},{"h":"Rastreamento com evidência — e o que não rastrear","blocos":[{"html":"<p>Rastreamento é para <strong>assintomáticos<\/strong>; quem tem sintoma é investigado. As recomendações abaixo seguem o <strong>Caderno de Atenção Primária nº 29<\/strong> e o <strong>Caderno nº 36<\/strong>, com a USPSTF como referência complementar.<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Rastreamento<\/th><th>Para quem<\/th><\/tr><\/thead><tbody><tr><td><strong>Hipertensão<\/strong><\/td><td>todos os adultos a partir dos <strong>18 anos<\/strong>, em qualquer contato<\/td><\/tr><tr><td><strong>Dislipidemia<\/strong><\/td><td>homens a partir dos <strong>35 anos<\/strong>; de 20 a 35 se houver risco cardiovascular aumentado<\/td><\/tr><tr><td><strong>Diabetes tipo 2<\/strong><\/td><td>a partir dos <strong>45 anos<\/strong>, ou antes se excesso de peso com outro fator de risco (hipertensão, dislipidemia, história familiar, sedentarismo)<\/td><\/tr><tr><td><strong>Câncer colorretal<\/strong><\/td><td>dos <strong>50 aos 75 anos<\/strong>, por sangue oculto nas fezes ou colonoscopia (a USPSTF 2021 antecipou para 45)<\/td><\/tr><tr><td><strong>Tabagismo e álcool<\/strong><\/td><td>todos os adultos, com abordagem breve<\/td><\/tr><tr><td><strong>HIV, sífilis, hepatites<\/strong><\/td><td>oferta de testagem conforme exposição e no pré-natal do parceiro<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p><strong>Não<\/strong> têm rastreamento populacional recomendado: <strong>câncer de próstata<\/strong>, <strong>câncer de testículo<\/strong> (o autoexame não é estratégia de rastreio, mas nódulo testicular deve ser investigado) e ECG de rotina em quem é de baixo risco. Pedir \"check-up\" com bateria de exames sem indicação gera falso-positivo e cascata de intervenções — é o oposto da <strong>prevenção quaternária<\/strong>.<\/p>"}]},{"h":"Câncer de próstata: rastrear não é diagnosticar","blocos":[{"html":"<p>O câncer de próstata é o tumor mais incidente no homem brasileiro depois do de pele não melanoma. Os fatores de risco principais são <strong>idade<\/strong>, <strong>história familiar<\/strong> (pai ou irmão, sobretudo antes dos 60) e <strong>raça negra<\/strong>.<\/p>"},{"html":"<p>O <strong>Ministério da Saúde e o INCA não recomendam o rastreamento populacional<\/strong> com PSA e toque retal: o benefício em mortalidade é pequeno e incerto, e os danos são frequentes.<\/p>"},{"html":"<ul><li><strong>Sobrediagnóstico<\/strong> — tumores indolentes que nunca causariam sintomas.<\/li><li><strong>Sobretratamento<\/strong> — cirurgia e radioterapia com <strong>incontinência urinária<\/strong> e <strong>disfunção erétil<\/strong>.<\/li><li><strong>Falsos-positivos<\/strong> — o PSA é específico do <strong>órgão<\/strong>, não do câncer: sobe na hiperplasia, na prostatite, após ejaculação e manipulação.<\/li><li><strong>Biópsias<\/strong> — dor, sangramento e infecção.<\/li><\/ul>"},{"html":"<blockquote><p><strong>Três situações, três condutas.<\/strong> Homem <strong>assintomático<\/strong> → não rastrear de rotina. Homem <strong>que pede o PSA<\/strong> → <strong>decisão compartilhada<\/strong>, explicando benefícios e danos, sem pedido automático nem recusa autoritária. Homem com <strong>sintomas urinários, hematúria ou toque alterado<\/strong> → <strong>investigação diagnóstica<\/strong>, que não é rastreamento.<\/p><\/blockquote>"},{"html":"<p>A Sociedade Brasileira de Urologia recomenda avaliação a partir dos 50 anos (45 para negros ou com história familiar), e a USPSTF (2018) admite decisão individual dos 55 aos 69 anos. Em questão sobre <strong>política pública brasileira<\/strong>, vale o referencial do <strong>MS/INCA<\/strong>.<\/p>"}]},{"h":"Saúde sexual, reprodutiva e paternidade","blocos":[{"html":"<p>A <strong>disfunção erétil<\/strong> compartilha fisiopatologia com a aterosclerose e pode preceder em alguns anos a doença coronariana: é <strong>marcador de risco cardiovascular<\/strong> e ocasião para avaliar PA, glicemia, lipídios e tabagismo, além de medicamentos (tiazídicos, betabloqueadores, ISRS) e saúde mental. Os <strong>inibidores da fosfodiesterase-5<\/strong> (sildenafila, tadalafila) são <strong>contraindicados com nitratos<\/strong>, pelo risco de hipotensão grave.<\/p>"},{"html":"<p>Prevenção de <strong>IST<\/strong>: preservativo, testagem, PrEP e PEP conforme indicação, e <strong>vacina contra o HPV<\/strong> para meninos e meninas de <strong>9 a 14 anos<\/strong>, em <strong>dose única desde 2024<\/strong> — no homem, o HPV causa verrugas e cânceres de pênis, ânus e orofaringe.<\/p>"},{"html":"<p><strong>Vasectomia:<\/strong> a <strong>Lei nº 14.443/2022<\/strong> alterou a Lei do Planejamento Familiar — esterilização voluntária a partir dos <strong>21 anos ou com dois filhos vivos<\/strong>, <strong>prazo mínimo de 60 dias<\/strong> entre a manifestação da vontade e a cirurgia e <strong>sem exigir consentimento do cônjuge<\/strong>. Usar outro método até o espermograma confirmar azoospermia.<\/p>"},{"html":"<p>O <strong>Pré-Natal do Parceiro<\/strong> (Ministério da Saúde, 2016) traz o homem para a UBS: <strong>testes rápidos<\/strong> de HIV, sífilis e hepatites B e C, tipagem sanguínea e fator Rh, hemograma, glicemia, lipidograma, <strong>eletroforese de hemoglobina<\/strong>, PA e IMC, <strong>atualização vacinal<\/strong> e participação nas consultas, no parto e no cuidado do bebê. Na <strong>sífilis<\/strong>, tratar o parceiro evita a reinfecção da gestante e a sífilis congênita — exposto nos últimos 90 dias recebe tratamento mesmo com teste negativo. É o eixo <strong>paternidade e cuidado<\/strong> na prática.<\/p>"}]}]},{"slug":"saude-populacao-negra","titulo":"Saúde da População Negra","disciplina":"MFC","eyebrow":"Medicina de Família e Comunidade · Referência","questoes":[{"id":"350eb431d7","q":"A Política Nacional de Saúde Integral da População Negra (PNSIPN), instituída em 2009, tem como \"marca\" o reconhecimento de que:","opts":["o racismo e as desigualdades étnico-raciais são determinantes sociais da saúde","as doenças da população negra são sobretudo de origem genética e hereditária","a população negra precisa de serviços de saúde separados e exclusivos no SUS","as diferenças de saúde entre grupos raciais decorrem só da diferença de renda"],"c":0,"exp":"A marca da PNSIPN (Portaria GM/MS nº 992/2009) é o reconhecimento do racismo, das desigualdades étnico-raciais e do racismo institucional como determinantes sociais das condições de saúde, com vistas à promoção da equidade. Ela não cria serviço paralelo: orienta os serviços que o SUS já tem.","ref":[1,1]},{"id":"4359d6e28a","q":"Na recepção da UBS, a técnica preenche o campo raça/cor do cadastro de um usuário adulto e consciente a partir da aparência dele, sem perguntar. Qual a orientação correta?","opts":["Perguntar ao usuário: a cor é autodeclarada, nas categorias do IBGE","Manter o registro: a cor é atribuída pelo profissional que o atende","Deixar o campo em branco, pois perguntar a cor constrange o usuário","Registrar só \"negro\" ou \"não negro\", que é a categoria usada no SUS"],"c":0,"exp":"O quesito raça/cor é de preenchimento obrigatório nos sistemas de informação do SUS (Portaria GM/MS nº 344/2017) e segue a autodeclaração, nas cinco categorias do IBGE: branca, preta, parda, amarela e indígena. Só quando a pessoa não pode se autodeclarar — recém-nascido, óbito, inconsciência — a informação vem de familiar ou responsável.","ref":[3,0]},{"id":"311300691f","q":"Pelas categorias do IBGE, a expressão \"população negra\", usada nas políticas de saúde, corresponde à soma das:","opts":["pessoas que se autodeclaram pretas e pardas","pessoas que se autodeclaram pretas e indígenas","pessoas que se autodeclaram somente pretas","pessoas pretas, pardas, amarelas e indígenas"],"c":0,"exp":"População negra é a soma de pretos e pardos. No Censo 2022 os pardos passaram a ser o maior grupo (cerca de 45%) e, somados aos pretos (cerca de 10%), a população negra é mais da metade dos brasileiros.","ref":[3,1]},{"id":"22f56ac979","q":"Um serviço de urgência adota a mesma rotina para todos, mas uma auditoria mostra que pacientes negros com dor recebem menos analgesia e esperam mais pela avaliação, sem que nenhum profissional se declare preconceituoso. Esse fenômeno é mais bem descrito como:","opts":["Racismo institucional","Racismo internalizado","Preconceito interpessoal","Viés de seleção amostral"],"c":0,"exp":"Racismo institucional é o fracasso de uma organização em prover serviço adequado às pessoas por causa de cor, cultura ou origem étnica; aparece em normas, rotinas e resultados, mesmo sem intenção individual. O subtratamento da dor em pessoas negras é o exemplo clássico — inclusive na crise álgica da doença falciforme.","ref":[2,1]},{"id":"a1242b48e6","q":"A \"lei dos cuidados inversos\", formulada por Julian Tudor Hart em 1971, afirma que:","opts":["a oferta de bom cuidado varia na razão inversa da necessidade da população","quanto mais especializado o serviço, menor a resolutividade para a população","a prevenção quaternária deve ser inversamente proporcional ao risco individual","a demanda por serviços cai à medida que a oferta de atenção primária aumenta"],"c":0,"exp":"Tudor Hart observou que a disponibilidade de boa atenção médica tende a variar inversamente à necessidade da população atendida: quem mais precisa recebe menos e pior. A população negra, sobre-representada entre os mais pobres, ilustra a lei, e a equidade é o princípio do SUS que responde a ela.","ref":[1,3]},{"id":"a9ff85782e","q":"Na classificação usada pela PNSIPN para os agravos mais relevantes na população negra, a hipertensão arterial e o diabetes mellitus aparecem como doenças:","opts":["de evolução agravada ou de tratamento dificultado","geneticamente determinadas, de herança autossômica","adquiridas em condições socioeconômicas desfavoráveis","exclusivas da população negra, por razão étnica"],"c":0,"exp":"Os agravos se agrupam em três blocos: geneticamente determinados (doença falciforme, deficiência de G6PD); adquiridos em condições desfavoráveis (tuberculose, desnutrição, mortes violentas, mortalidade infantil, sofrimento psíquico); e de evolução agravada ou tratamento dificultado (hipertensão, diabetes, coronariopatias, doença renal crônica, câncer, miomas).","ref":[4,1]},{"id":"e05afcf9bd","q":"Recém-nascido tem no teste do pezinho o padrão de hemoglobina FAS. Os pais, assustados, perguntam se o filho tem anemia falciforme. A interpretação correta é:","opts":["Traço falciforme: é portador, não doente, e não precisa de tratamento","Anemia falciforme: deve iniciar penicilina e ácido fólico desde já","Doença falciforme leve: precisa de doppler transcraniano anual","Resultado inconclusivo: repetir o exame só depois dos 2 anos de idade"],"c":0,"exp":"No padrão FAS, a hemoglobina fetal (F) aparece ao lado da A e da S: é o traço falciforme (heterozigoto AS), que não é doença. O padrão FS, sem hemoglobina A, indica doença falciforme. O traço pede orientação e aconselhamento genético da família, não tratamento.","ref":[5,1]},{"id":"e63323fb4e","q":"Um casal em que os dois têm traço falciforme (HbAS) planeja ter filhos. Qual a chance, a cada gestação, de nascer uma criança com anemia falciforme (HbSS)?","opts":["1 em 4 (25%)","1 em 2 (50%)","3 em 4 (75%)","1 em 8 (12,5%)"],"c":0,"exp":"Herança autossômica recessiva: cada genitor AS transmite o alelo S com 50% de chance, então a cada gestação há 25% de filho SS (doente), 50% de AS (traço) e 25% de AA. Por isso o achado de traço no teste do pezinho deve levar à orientação genética da família.","ref":[5,1]},{"id":"6a3e618014","q":"Criança de 2 anos com anemia falciforme, em uso regular de penicilina profilática, chega à UBS com febre de 39 °C há 3 horas, sem foco aparente e em bom estado geral. A conduta é:","opts":["Encaminhar com urgência para avaliação, exames e antibiótico parenteral","Prescrever antitérmico e reavaliar em 48 horas, pois está em bom estado","Manter a penicilina oral e orientar retorno apenas se surgir algum foco","Solicitar hemograma ambulatorial e aguardar o resultado para decidir"],"c":0,"exp":"Na doença falciforme há asplenia funcional desde cedo, e a febre pode ser o primeiro sinal de sepse por germes encapsulados, sobretudo pneumococo, de evolução fulminante. Febre é urgência mesmo com bom estado geral e mesmo com penicilina profilática: avaliação imediata, hemocultura e antibiótico parenteral.","ref":[5,4]},{"id":"4fe1be9da6","q":"No acompanhamento de rotina da criança com doença falciforme na APS, qual medida faz parte do cuidado preconizado?","opts":["Penicilina profilática até os 5 anos e vacinas especiais do CRIE","Transfusão mensal de hemácias para manter a hemoglobina normal","Suplementação de ferro contínua para corrigir a anemia hemolítica","Restringir a ingestão de líquidos para evitar a crise vaso-oclusiva"],"c":0,"exp":"A rotina inclui penicilina profilática dos primeiros meses de vida até os 5 anos, ácido fólico, calendário vacinal completo mais os imunobiológicos especiais do CRIE (como as pneumocócicas), hidratação abundante e ensino da família para reconhecer febre, palidez súbita e aumento do baço. Ferro de rotina não está indicado: a anemia é hemolítica, não ferropriva.","ref":[5,3]},{"id":"117618f83d","q":"Qual exame é feito anualmente, dos 2 aos 16 anos, nas crianças com anemia falciforme, para identificar o risco de acidente vascular cerebral?","opts":["Doppler transcraniano","Tomografia de crânio","Eletroencefalograma","Ultrassom de carótidas"],"c":0,"exp":"O AVC isquêmico é complicação grave da anemia falciforme na infância. O doppler transcraniano anual, dos 2 aos 16 anos, mede a velocidade do fluxo nas artérias cerebrais; velocidade alta indica alto risco e leva a programa de transfusão crônica ou hidroxiureia. É exame não invasivo e sem radiação.","ref":[5,3]},{"id":"1b85cabc73","q":"Jovem de 19 anos com anemia falciforme chega com dor intensa nas pernas e na região lombar, nota 9 em 10, igual a crises anteriores. Um profissional comenta que ele \"deve estar atrás de remédio forte\". Qual a conduta adequada?","opts":["Analgesia imediata e escalonada, com opioide se preciso, e hidratação","Analgésico simples e alta, pois dor sem sinal objetivo é de origem psíquica","Aguardar exames de imagem que comprovem a crise antes de medicar","Encaminhar ao CAPS AD pela suspeita de uso abusivo de opioides"],"c":0,"exp":"A crise vaso-oclusiva é a complicação mais comum da doença falciforme e não há exame que a confirme: o relato de dor basta. A conduta é analgesia rápida e escalonada (incluindo opioide), hidratação e busca de complicações como a síndrome torácica aguda. Desconfiar da dor do paciente negro e subtratá-la é expressão de racismo institucional.","ref":[5,5]},{"id":"bc5d10ef3f","q":"Sobre a hipertensão arterial na população negra brasileira, é correto afirmar que ela:","opts":["é mais frequente, surge mais cedo e causa mais lesão de órgão-alvo","é menos frequente, mas tem pior resposta aos diuréticos tiazídicos","tem prevalência igual à dos brancos, sem diferença de complicações","é explicada só pela genética, sem influência de fatores sociais"],"c":0,"exp":"A hipertensão é mais prevalente, mais precoce e mais grave na população negra, com mais AVC e doença renal. A Diretriz Brasileira de Hipertensão (2020) pondera que condições socioeconômicas e hábitos de vida pesam mais nessa diferença que a etnia em si. Em negros, tiazídicos e bloqueadores de canal de cálcio costumam responder melhor em monoterapia que IECA ou BRA.","ref":[4,2]},{"id":"7813be24f4","q":"Sobre a mortalidade materna no Brasil, os dados desagregados por raça/cor mostram que ela:","opts":["é maior nas mulheres negras, com predomínio de causas evitáveis","é igual entre os grupos, pois o pré-natal no SUS é universal","é maior nas brancas, por terem mais cesarianas eletivas","é maior nas negras, mas só por causas genéticas como a falciforme"],"c":0,"exp":"A razão de mortalidade materna é persistentemente mais alta entre mulheres negras, sobretudo pretas, e a maior parte das mortes é evitável (síndromes hipertensivas, hemorragia, infecção, aborto inseguro). Nesse grupo há menos consultas de pré-natal, mais peregrinação em busca de vaga para o parto e menos analgesia — marcas de racismo institucional.","ref":[4,3]},{"id":"686eb81fd2","q":"Sobre a violência letal no Brasil, os dados do Atlas da Violência mostram que:","opts":["cerca de três em cada quatro vítimas de homicídio são pessoas negras","as vítimas de homicídio se distribuem igualmente entre os grupos raciais","a maior parte das vítimas de homicídio é de mulheres brancas idosas","os homicídios de pessoas negras caíram mais rápido que os de brancos"],"c":0,"exp":"Pessoas negras são cerca de três quartos das vítimas de homicídio no país, com destaque para homens jovens; o homicídio é a principal causa de morte da juventude negra. Na última década, a queda dos homicídios foi maior entre não negros, o que ampliou a desigualdade.","ref":[4,4]},{"id":"d1a8c2ce60","q":"Uma comunidade rural do território da equipe se reconhece como remanescente de quilombo. Sobre essa população, é correto afirmar que:","opts":["a identidade quilombola se baseia na autodefinição da própria comunidade","só é quilombola a comunidade com ascendência comprovada por exame genético","o reconhecimento depende de laudo antropológico emitido pela própria UBS","a comunidade deixa de ter direito à ESF ao ser titulada como quilombola"],"c":0,"exp":"Pelo Decreto nº 4.887/2003, os remanescentes de quilombo se caracterizam por autodefinição da própria comunidade, com certificação pela Fundação Cultural Palmares; a Constituição (art. 68 do ADCT) garante a propriedade das terras. O Censo 2022 contou os quilombolas pela primeira vez (cerca de 1,3 milhão).","ref":[6,0]},{"id":"847277025a","q":"Destinar mais recursos e ações a grupos em pior situação de saúde, como prevê a PNSIPN, é a aplicação de qual princípio do SUS?","opts":["Equidade, que trata desigualmente os desiguais","Universalidade, que garante acesso a todos","Integralidade, que articula prevenção e cura","Descentralização, com comando único por esfera"],"c":0,"exp":"Equidade é tratar desigualmente os desiguais, investindo mais onde a necessidade é maior para reduzir diferenças evitáveis e injustas. A PNSIPN é uma política de equidade: não cria um SUS à parte, mas orienta o sistema universal a enfrentar o racismo e as desigualdades étnico-raciais.","ref":[1,2]}],"resumo":[{"h":"","blocos":[{"html":"<blockquote><p>Material de referência: não há slide da aula deste tema. Baseado na Política Nacional de Saúde Integral da População Negra (2009), na Portaria GM/MS nº 344/2017, no PCDT da Doença Falciforme e em publicações do Ministério da Saúde, do IBGE e do Atlas da Violência.<\/p><\/blockquote>"}]},{"h":"A política e a razão de existir","blocos":[{"html":"<p>A <strong>Política Nacional de Saúde Integral da População Negra (PNSIPN)<\/strong> foi instituída pela <strong>Portaria GM/MS nº 992, de 13 de maio de 2009<\/strong>, depois de aprovada no Conselho Nacional de Saúde. A data não é acaso: é o aniversário da abolição. Em 2010 o <strong>Estatuto da Igualdade Racial (Lei nº 12.288)<\/strong> reforçou em lei o direito à saúde da população negra.<\/p>"},{"html":"<p>A <strong>marca<\/strong> da política é o <strong>reconhecimento do racismo, das desigualdades étnico-raciais e do racismo institucional como determinantes sociais das condições de saúde<\/strong>, com vistas à promoção da <strong>equidade<\/strong>. O objetivo geral é promover a saúde integral da população negra, priorizando a redução das desigualdades étnico-raciais e o combate ao racismo e à discriminação nas instituições e serviços do SUS.<\/p>"},{"html":"<blockquote><p>A PNSIPN <strong>não cria um SUS paralelo<\/strong> nem serviços exclusivos. Ela é uma política de <strong>equidade<\/strong> — tratar desigualmente os desiguais — que orienta o sistema universal que já existe.<\/p><\/blockquote>"},{"html":"<p>A <strong>lei dos cuidados inversos<\/strong>, de <strong>Julian Tudor Hart (1971)<\/strong>, explica por que a política é necessária: a disponibilidade de boa atenção médica tende a variar <strong>inversamente<\/strong> à necessidade da população. Quem mais precisa — mais pobre, mais exposto, com menos acesso — recebe menos e pior. Sem ação deliberada, o sistema reproduz a desigualdade.<\/p>"}]},{"h":"Racismo como determinante social","blocos":[{"html":"<p>O racismo opera em camadas, e a prova costuma cobrar a diferença entre elas.<\/p>"},{"html":"<ul><li><strong>Estrutural<\/strong> — o racismo integra a organização econômica, política e histórica da sociedade; é a \"normalidade\" que produz desigualdade de renda, moradia, escolaridade e território, mesmo sem um agressor identificável.<\/li><li><strong>Institucional<\/strong> — o fracasso de uma organização em prover serviço adequado às pessoas por causa de cor, cultura ou origem étnica. Aparece em <strong>normas, rotinas e resultados<\/strong>, não em intenções declaradas.<\/li><li><strong>Interpessoal<\/strong> — o preconceito e a discriminação no contato direto entre pessoas.<\/li><li><strong>Internalizado<\/strong> — a incorporação, pela própria pessoa discriminada, dos estigmas sobre seu grupo.<\/li><\/ul>"},{"html":"<p>Na saúde, o exemplo clássico de racismo institucional é o <strong>subtratamento da dor<\/strong>: pacientes negros recebem menos analgesia e esperam mais, apoiados no estereótipo de que \"sentem menos dor\" ou \"querem remédio forte\". Outros exemplos: menos consultas de pré-natal, menos analgesia no parto e menos acesso a exames de alta complexidade. Além disso, o próprio racismo vivido é fonte de <strong>estresse crônico e sofrimento psíquico<\/strong>.<\/p>"}]},{"h":"Quesito raça/cor: sem dado não há equidade","blocos":[{"html":"<p>A <strong>Portaria GM/MS nº 344/2017<\/strong> tornou <strong>obrigatório<\/strong> o preenchimento do quesito raça/cor nos formulários dos sistemas de informação em saúde, respeitando a <strong>autodeclaração<\/strong> e as <strong>cinco categorias do IBGE<\/strong>: <strong>branca, preta, parda, amarela e indígena<\/strong>. Quando a pessoa não pode se autodeclarar (recém-nascido, óbito, inconsciência), a informação vem de familiar ou responsável.<\/p>"},{"html":"<p><strong>População negra = pretos + pardos.<\/strong> No Censo 2022, os pardos se tornaram o maior grupo (cerca de 45%) e, com os pretos (cerca de 10%), a população negra passa da metade dos brasileiros.<\/p>"},{"html":"<blockquote><p><strong>Pegadinha.<\/strong> O profissional <strong>não atribui<\/strong> a cor pela aparência. Perguntar a cor não é constrangimento: é o que permite enxergar a desigualdade nos dados — sem o quesito preenchido, não há como medir mortalidade materna ou homicídio por raça/cor.<\/p><\/blockquote>"}]},{"h":"O perfil de agravos e a tripla carga","blocos":[{"html":"<p>O Brasil vive uma <strong>tripla carga de doenças<\/strong> — infecciosas e carenciais ainda presentes, crônicas não transmissíveis em alta e causas externas elevadas —, e a população negra concentra as três. A classificação usada na PNSIPN agrupa os agravos de maior relevância em três blocos:<\/p>"},{"html":"<div class=\"tbl\"><table><thead><tr><th>Bloco<\/th><th>Exemplos<\/th><\/tr><\/thead><tbody><tr><td><strong>Geneticamente determinados<\/strong><\/td><td>doença falciforme, deficiência de G6PD<\/td><\/tr><tr><td><strong>Adquiridos em condições desfavoráveis<\/strong><\/td><td>desnutrição, tuberculose, HIV/IST, mortalidade infantil, mortes violentas, sofrimento psíquico, uso de álcool e outras drogas<\/td><\/tr><tr><td><strong>De evolução agravada ou tratamento dificultado<\/strong><\/td><td>hipertensão arterial, diabetes, coronariopatias, doença renal crônica, câncer, miomas<\/td><\/tr><\/tbody><\/table><\/div>"},{"html":"<p><strong>Hipertensão<\/strong> é mais prevalente, mais <strong>precoce<\/strong> e mais <strong>grave<\/strong> na população negra, com mais AVC, doença renal e lesão de órgão-alvo. A Diretriz Brasileira de Hipertensão (2020) pondera que condições socioeconômicas e hábitos de vida pesam mais nessa diferença do que a etnia em si. Em negros, <strong>tiazídicos e bloqueadores de canal de cálcio<\/strong> costumam responder melhor em monoterapia que IECA ou BRA.<\/p>"},{"html":"<p>A <strong>mortalidade materna<\/strong> é persistentemente mais alta entre mulheres negras, sobretudo pretas, e é em grande parte <strong>evitável<\/strong> (síndromes hipertensivas, hemorragia, infecção, aborto inseguro). Pesam menos consultas de pré-natal, peregrinação em busca de vaga para o parto e menos analgesia.<\/p>"},{"html":"<p>A <strong>violência<\/strong> é o retrato mais duro: cerca de <strong>três em cada quatro vítimas de homicídio são negras<\/strong>, e o homicídio é a principal causa de morte da <strong>juventude negra masculina<\/strong>. Na última década, a queda dos homicídios foi maior entre não negros, o que ampliou a distância.<\/p>"}]},{"h":"Doença falciforme na APS","blocos":[{"html":"<p>É a <strong>doença genética monogênica mais comum do Brasil<\/strong>, mais frequente na população negra, e tem política própria desde 2005. Uma mutação na cadeia beta da globina gera a <strong>hemoglobina S<\/strong>, que polimeriza quando desoxigenada e deforma a hemácia em foice: hemólise crônica e <strong>vaso-oclusão<\/strong>.<\/p>"},{"html":"<p>O diagnóstico vem da <strong>triagem neonatal (teste do pezinho)<\/strong>, que inclui as hemoglobinopatias. Na leitura do resultado, <strong>FAS = traço falciforme<\/strong> (heterozigoto, portador, <strong>não doente<\/strong>) e <strong>FS = doença falciforme<\/strong>. O traço pede <strong>aconselhamento genético<\/strong>: se os dois pais têm traço, cada gestação tem <strong>25%<\/strong> de chance de filho SS.<\/p>"},{"html":"<p>A equipe de Saúde da Família acompanha a criança de forma compartilhada com o hemocentro. A rotina inclui:<\/p>"},{"html":"<ol><li><strong>Penicilina profilática<\/strong> dos primeiros meses de vida <strong>até os 5 anos<\/strong>, e <strong>ácido fólico<\/strong>.<\/li><li><strong>Vacinação completa<\/strong>, acrescida dos imunobiológicos especiais do <strong>CRIE<\/strong> (pneumocócicas, entre outros).<\/li><li><strong>Doppler transcraniano anual dos 2 aos 16 anos<\/strong> para rastrear risco de AVC.<\/li><li><strong>Hidroxiureia<\/strong> nos casos indicados pelo protocolo, que reduz crises e internações.<\/li><li>Educação da família: hidratação, palpação do baço, sinais de alarme.<\/li><\/ol>"},{"html":"<blockquote><p><strong>Febre é urgência.<\/strong> Por <strong>asplenia funcional<\/strong>, a criança com doença falciforme pode evoluir para sepse fulminante por pneumococo — mesmo em bom estado geral e mesmo usando penicilina. Também exigem avaliação imediata: palidez súbita com aumento do baço (<strong>sequestro esplênico<\/strong>), dor torácica com febre e infiltrado (<strong>síndrome torácica aguda<\/strong>), déficit neurológico e priapismo.<\/p><\/blockquote>"},{"html":"<p>A <strong>crise vaso-oclusiva<\/strong> é a complicação mais comum e não tem exame que a confirme: o relato basta. A conduta é <strong>analgesia imediata e escalonada<\/strong>, incluindo opioide, e hidratação. Ferro de rotina não está indicado — a anemia é hemolítica, não ferropriva.<\/p>"}]},{"h":"Quilombolas e o papel da equipe","blocos":[{"html":"<p>As <strong>comunidades remanescentes de quilombo<\/strong> têm a propriedade de suas terras garantida pela Constituição (<strong>art. 68 do ADCT<\/strong>). Pelo <strong>Decreto nº 4.887/2003<\/strong>, a identidade se baseia na <strong>autodefinição da própria comunidade<\/strong>, com certificação pela <strong>Fundação Cultural Palmares<\/strong> e titulação pelo INCRA. O <strong>Censo 2022<\/strong> contou os quilombolas pela primeira vez: cerca de <strong>1,3 milhão<\/strong> de pessoas. Elas também estão contempladas pela política de saúde das populações do campo, da floresta e das águas.<\/p>"},{"html":"<p>São, em geral, comunidades rurais com acesso difícil a serviços, saneamento precário e alta carga de hipertensão, doença falciforme e agravos ligados à pobreza. Para a equipe de Saúde da Família, o cuidado passa por <strong>territorialização<\/strong> que reconheça a comunidade, <strong>agentes comunitários do próprio território<\/strong>, respeito aos saberes e práticas tradicionais e oferta ativa de cuidado.<\/p>"},{"html":"<p>No dia a dia da UBS, a política se traduz em ações concretas: <strong>preencher o quesito raça/cor<\/strong> por autodeclaração, <strong>usar os dados<\/strong> para identificar desigualdades no território, <strong>acolher sem discriminação<\/strong>, levar a sério a queixa de dor, garantir o cuidado à pessoa com doença falciforme e incluir o tema do racismo na educação permanente da equipe.<\/p>"}]}]},{"slug":"situacao-de-rua","titulo":"Saúde da População em Situação de Rua","disciplina":"MFC","eyebrow":"Medicina de Família e Comunidade · Referência","questoes":[{"id":"5bf171bee5","q":"Pelo Decreto 7.053/2009, que institui a Política Nacional para a População em Situação de Rua, o que caracteriza esse grupo?","opts":["Grupo heterogêneo com pobreza extrema, vínculos familiares fragilizados e sem moradia regular","Grupo homogêneo de usuários de drogas que vivem nas ruas por escolha própria e permanente","Pessoas com transtorno mental grave egressas de hospitais psiquiátricos sem família conhecida","Migrantes sem documentação que usam abrigos e não têm direito a benefícios assistenciais"],"c":0,"exp":"O decreto define a população em situação de rua como grupo heterogêneo que tem em comum a pobreza extrema, os vínculos familiares interrompidos ou fragilizados e a inexistência de moradia convencional regular, usando logradouros e áreas degradadas como moradia e sustento, de forma temporária ou permanente, além de unidades de acolhimento. Heterogêneo significa não presumir uso de drogas nem transtorno mental.","ref":[1,0]},{"id":"d97569b3de","q":"Homem de 50 anos em situação de rua procura a UBS com dor de dente e febre. A recepção recusa o atendimento porque ele não tem comprovante de residência nem documento. Qual a avaliação correta?","opts":["A recusa é indevida: endereço e documento não podem barrar o atendimento no SUS","A recusa é correta: sem endereço não se define a UBS responsável pelo cuidado","A recusa é correta: ele deve ser atendido só pelo Consultório na Rua do município","A recusa é indevida só na urgência; consultas eletivas exigem comprovante"],"c":0,"exp":"O acesso ao SUS é universal, e a Portaria 940/2011, que regulamenta o Cartão SUS, dispensa expressamente os moradores de rua da exigência de endereço no cadastro. A falta de documento também não impede o atendimento; recusar na recepção é barreira de acesso.","ref":[2,0]},{"id":"4914cff0ed","q":"Sobre o Consultório na Rua, qual afirmação é correta?","opts":["É equipe multiprofissional e itinerante da atenção primária, com atenção integral","É serviço especializado do CAPS AD, restrito ao cuidado de usuários de drogas","É unidade fixa da assistência social que oferece banho, comida e documentação","É equipe do SAMU que recolhe pessoas da rua e as leva a abrigos municipais"],"c":0,"exp":"O Consultório na Rua, criado na PNAB de 2011, é equipe da APS, multiprofissional e itinerante, que vai até onde as pessoas estão e faz ações compartilhadas com as UBS, os CAPS e a assistência social. Oferece atenção integral; o antigo Consultório de Rua, da saúde mental, é que era voltado a usuários de drogas.","ref":[2,1]},{"id":"8d745e42ca","q":"Um município vai implantar uma equipe de Consultório na Rua e quer que ela tenha médico obrigatoriamente na composição mínima. Qual modalidade deve escolher?","opts":["Modalidade III, que é a II acrescida de médico","Modalidade I, com quatro profissionais e médico","Modalidade II, com seis profissionais e médico","Qualquer modalidade, pois todas exigem médico"],"c":0,"exp":"A modalidade I tem no mínimo 4 profissionais (2 de nível superior e 2 de nível médio), a II tem 6 (3 e 3), e a III é a modalidade II acrescida de médico. Enfermeiro, psicólogo, assistente social e terapeuta ocupacional são os profissionais de nível superior típicos.","ref":[2,2]},{"id":"15ad30221a","q":"A equipe de Consultório na Rua encontra um homem de 38 anos que vive na rua há dois anos e refere tosse há cinco dias. Qual a conduta em relação à tuberculose?","opts":["Considerá-lo sintomático respiratório e colher escarro no mesmo encontro","Aguardar completar três semanas de tosse antes de investigar tuberculose","Pedir só radiografia de tórax e investigar se surgir febre e emagrecimento","Investigar apenas se ele aceitar antes ir morar num abrigo do município"],"c":0,"exp":"Na população geral, o sintomático respiratório tem tosse há 3 semanas ou mais; na população em situação de rua, tosse de qualquer duração já justifica investigar. O escarro é colhido no momento da identificação, para teste rápido molecular e cultura com teste de sensibilidade, porque talvez não haja um segundo encontro.","ref":[4,2]},{"id":"d8ef5b1b03","q":"Mulher de 35 anos em situação de rua tem tuberculose pulmonar sensível confirmada. Qual estratégia aumenta a chance de completar o tratamento?","opts":["Tratamento diretamente observado, com incentivos e apoio da assistência social","Entregar os seis meses de remédio de uma vez, para evitar idas à unidade","Internar até o fim do tratamento, pois a adesão na rua é sempre impossível","Adiar o início até que ela tenha comprovante de endereço e documento"],"c":0,"exp":"Na população em situação de rua, a incidência de tuberculose e o abandono de tratamento são muito maiores. O esquema básico (2RHZE/4RH) é dado com tratamento diretamente observado — na UBS, na eCR ou no abrigo
